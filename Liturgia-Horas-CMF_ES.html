:true},{"t":"v","x":"que nos ha bendecido en la persona de Cristo","c":true},{"t":"v","x":"con toda clase de bienes espirituales y celestiales.","c":true},{"t":"v","x":"Él nos eligió en la persona de Cristo,","c":false},{"t":"v","x":"antes de crear el mundo,","c":true},{"t":"v","x":"para que fuésemos santos","c":true},{"t":"v","x":"e irreprochables ante él por el amor.","c":true},{"t":"v","x":"Él nos ha destinado en la persona de Cristo,","c":false},{"t":"v","x":"por pura iniciativa suya,","c":true},{"t":"v","x":"a ser sus hijos,","c":true},{"t":"v","x":"para que la gloria de su gracia,","c":true},{"t":"v","x":"que tan generosamente nos ha concedido","c":true},{"t":"v","x":"en su querido Hijo,","c":true},{"t":"v","x":"redunde en alabanza suya.","c":true},{"t":"v","x":"Por este Hijo, por su sangre,","c":false},{"t":"v","x":"hemos recibido la redención,","c":true},{"t":"v","x":"el perdón de los pecados.","c":true},{"t":"v","x":"El tesoro de su gracia, sabiduría y prudencia","c":true},{"t":"v","x":"ha sido un derroche para con nosotros,","c":true},{"t":"v","x":"dándonos a conocer el misterio de su voluntad.","c":true},{"t":"v","x":"Este es el plan","c":false},{"t":"v","x":"que había proyectado realizar por Cristo","c":true},{"t":"v","x":"cuando llegase el momento culminante:","c":true},{"t":"v","x":"recapitular en Cristo todas las cosas","c":true},{"t":"v","x":"del cielo y de la tierra.","c":true},{"t":"v","x":"Ant. Bendita tú entre las mujeres y bendito el fruto de","c":false},{"t":"v","x":"tu vientre.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}],"cite":"Ef 1, 3-10"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Ayúdanos, Señor, a trabajar en el plan que habías proyectado realizar por Cristo: haz que, siguiendo las huellas de san Antonio María Claret, anunciemos el Evangelio a los pobres hasta que Cristo sea todo en todos. Él, que vive y reina por los siglos de los siglos. Amén."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Escuché una voz potente que decía desde el trono:"},{"t":"p","x":"«Esta es la morada de Dios con los hombres: acampará entre ellos. Ellos serán su pueblo, y Dios estará con ellos y será su Dios»."}],"cite":"Ap 21, 3"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Alégrate, María, llena de gracia, el Señor está contigo."},{"t":"rr","x":"Alégrate, María, llena de gracia, el Señor está contigo."},{"t":"vr","x":"¡Bendita tú entre las mujeres y bendito el fruto de tu vientre!"},{"t":"rr","x":"El Señor está contigo."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Alégrate, María, llena de gracia, el Señor está contigo."}]},{"type":"Cántico evangélico","label":"Magníficat, ant. El Señor ha bendecido a María y por","blocks":[{"t":"p","x":"ella hemos recibido el don de la vocación para gloria del Padre."}]},{"type":"Preces","label":"Preces","blocks":[{"t":"p","x":"Al conmemorar el aniversario de la fundación de nuestra Congregación, celebrando la fiesta de nuestra Señora del Monte Carmelo, elevemos nuestras súplicas al Padre celestial, diciendo:"},{"t":"p","x":"Que la fuerza de tu Espíritu nos apremie, Señor. Tú, que de distintos lugares nos has llamado para"},{"t":"p","x":"formar parte de tu familia, — haz que te llamemos Padre por el Espíritu Santo. Tú, que quisiste que tu Hijo nos adoptara como"},{"t":"p","x":"hermanos, — haz que vivamos unidos en un mismo espíritu para"},{"t":"p","x":"que el mundo crea. Tú, que conoces nuestro egoísmo y nuestras ambiciones, — reúnenos en torno a la mesa de tu Palabra y del"},{"t":"p","x":"Sacramento para que nos amemos mutuamente. Tú, que quieres que seamos testigos de tu misericordia"},{"t":"p","x":"entre los hombres,"},{"t":"p","x":"— haz que nos configuremos profundamente con la"},{"t":"p","x":"vida de tu Hijo."},{"t":"r","x":"Pueden añadirse intenciones particulares, que concluyen con la"},{"t":"p","x":"respuesta indicada más arriba. Tú, que resucitaste a tu Hijo y prometiste la vida eterna"},{"t":"p","x":"a los que lo abandonaran todo por ti, — cumple misericordiosamente tus promesas con"},{"t":"p","x":"nuestros hermanos difuntos. Padre nuestro."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Al venerar la memoria de la bienaventurada Virgen"},{"t":"p","x":"María del Monte Carmelo y celebrar el origen de nuestra familia misionera, te rogamos, Señor, que confirmes a tus siervos en su plena consagración y hagas fecundas las tareas de nuestro apostolado para que siempre y en todo seamos hijos fieles de esta misma Madre. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]}]},{"id":"claret","date":"24 de octubre","title":"San Antonio María Claret","rank":"Solemnidad · Fundador","intro":[{"t":"p","x":"San Antonio María Claret nació en Sallent (Barcelona) el 23 de diciembre de 1807. Dedicó su vida al ministerio de la Palabra como misionero apostólico. Su espíritu era «para todo el mundo». Y para hacer con otros lo que él solo no podía, fundó la Congregación de Misioneros Hijos del Inmaculado Corazón de la bienaventurada Virgen María en Vic (Barcelona) el 16 de julio de 1849. En 1855, junto con la M. María Antonia París, fundó la Congregación de Religiosas de María Inmaculada, Misioneras Claretianas. Bajo su inspiración, fueron fundados posteriormente el instituto secular de las Hijas del Corazón de María o Filiación Cordimariana y los Seglares Claretianos. Creó otras muchas asociaciones y obras para el servicio de la Iglesia. Fue Arzobispo de Santiago de Cuba, Confesor de la reina Isabel II y Padre del Concilio Vaticano I. Los enemigos de la fe lo persiguieron hasta el último momento de su vida. Murió en el destierro, en Fontfroide (Francia), el 24 de octubre de 1870. Su cuerpo fue trasladado a Vic en 1897. Pío XII lo inscribió en el catálogo de los santos el 7 de mayo de 1950."}],"hours":[{"id":"claret-i-visperas","name":"I Vísperas","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Hijo del pueblo y confesor de reyes,","s":true},{"t":"v","x":"arroyo manso y huracán profético,","s":false},{"t":"v","x":"trabajador y misionero, obispo,","s":false},{"t":"v","x":"Padre Claret.","s":false},{"t":"v","x":"Fuiste una llama que pasó abrasando","s":true},{"t":"v","x":"tierras y mares de tu patria, España.","s":false},{"t":"v","x":"Cuba en la América —la viña joven—","s":false},{"t":"v","x":"supo tu incendio.","s":false},{"t":"v","x":"Cristo en tu pecho prolongó su altar.","s":true},{"t":"v","x":"Él te dio un cáliz de abrasados bordes:","s":false},{"t":"v","x":"persecuciones y calumnias, sangre.","s":false},{"t":"v","x":"Nada te arredra.","s":false},{"t":"v","x":"Nunca en tu cielo se eclipsó María,","s":true},{"t":"v","x":"María Madre, Corazón en vela,","s":false},{"t":"v","x":"por ella cuentas con estela fúlgida","s":false},{"t":"v","x":"de hijos e hijas.","s":false},{"t":"v","x":"Bendito el Padre que te dio a la Iglesia,","s":true},{"t":"v","x":"y gloria a Cristo cuyo amor te urgió.","s":false},{"t":"v","x":"Gloria al que es sello de los dos, su Espíritu,","s":false},{"t":"v","x":"gloria por siempre.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. Alabemos al Señor que ha glorificado a san Antonio María Claret y lo ha constituido padre de muchas familias en la Iglesia."}]},{"type":"Salmo","label":"Salmo 112","blocks":[{"t":"v","x":"Alabad, siervos del Señor,","c":false},{"t":"v","x":"alabad el nombre del Señor.","c":true},{"t":"v","x":"Bendito sea el nombre del Señor,","c":true},{"t":"v","x":"ahora y por siempre:","c":true},{"t":"v","x":"de la salida del sol hasta su ocaso,","c":true},{"t":"v","x":"alabado sea el nombre del Señor.","c":true},{"t":"v","x":"El Señor se eleva sobre todos los pueblos,","c":false},{"t":"v","x":"su gloria sobre los cielos.","c":true},{"t":"v","x":"¿Quién como el Señor, Dios nuestro,","c":true},{"t":"v","x":"que se eleva en su trono","c":true},{"t":"v","x":"y se abaja para mirar","c":true},{"t":"v","x":"al cielo y a la tierra?","c":true},{"t":"v","x":"Levanta del polvo al desvalido,","c":false},{"t":"v","x":"alza de la basura al pobre,","c":true},{"t":"v","x":"para sentarlo con los príncipes,","c":true},{"t":"v","x":"los príncipes de su pueblo;","c":true},{"t":"v","x":"a la estéril le da un puesto en la casa,","c":true},{"t":"v","x":"como madre feliz de hijos.","c":true},{"t":"v","x":"Ant. Alabemos al Señor que ha glorificado a san Antonio","c":false},{"t":"v","x":"María Claret y lo ha constituido padre de muchas","c":false},{"t":"v","x":"familias en la Iglesia.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Dios todopoderoso, que glorificaste a tu Hijo Jesucristo, escucha nuestra oración y concédenos participar del espíritu de san Antonio María Claret para llegar a ser admitidos un día con él en tu presencia, donde tu nombre es alabado por siempre. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"2. Mientras viva alabaré al Señor, que mantiene su fidelidad perpetuamente."}]},{"type":"Salmo","label":"Salmo 145","blocks":[{"t":"v","x":"Alaba, alma mía, al Señor:","c":false},{"t":"v","x":"alabaré al Señor mientras viva,","c":true},{"t":"v","x":"tañeré para mi Dios mientras exista.","c":true},{"t":"v","x":"No confiéis en los príncipes,","c":false},{"t":"v","x":"seres de polvo que no pueden salvar;","c":true},{"t":"v","x":"exhalan el espíritu y vuelven al polvo,","c":true},{"t":"v","x":"ese día perecen sus planes.","c":true},{"t":"v","x":"Dichoso a quien auxilia el Dios de Jacob,","c":false},{"t":"v","x":"el que espera en el Señor, su Dios,","c":true},{"t":"v","x":"que hizo el cielo y la tierra,","c":true},{"t":"v","x":"el mar y cuanto hay en él;","c":true},{"t":"v","x":"que mantiene su fidelidad perpetuamente,","c":false},{"t":"v","x":"que hace justicia a los oprimidos,","c":true},{"t":"v","x":"que da pan a los hambrientos.","c":true},{"t":"v","x":"El Señor liberta a los cautivos,","c":false},{"t":"v","x":"el Señor abre los ojos al ciego,","c":true},{"t":"v","x":"el Señor endereza a los que ya se doblan,","c":true},{"t":"v","x":"el Señor ama a los justos.","c":true},{"t":"v","x":"El Señor guarda a los peregrinos,","c":false},{"t":"v","x":"sustenta al huérfano y a la viuda","c":true},{"t":"v","x":"y trastorna el camino de los malvados.","c":true},{"t":"v","x":"El Señor reina eternamente;","c":false},{"t":"v","x":"tu Dios, Sion, de edad en edad.","c":true},{"t":"v","x":"Ant. Mientras viva alabaré al Señor, que mantiene su","c":false},{"t":"v","x":"fidelidad perpetuamente.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor y Dios nuestro, que enviaste a tu Hijo al mundo para anunciar la buena nueva a los pobres y liberar a los cautivos, danos el gozo de ser anunciadores de tu Evangelio en el seguimiento de Cristo, a imitación de san Antonio María Claret. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"3. Dios eligió en la persona de Cristo a san Antonio María Claret para que fuese santo y diera a conocer el misterio de su voluntad."}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Bendito sea Dios,","c":false},{"t":"v","x":"Padre de nuestro Señor Jesucristo,","c":true},{"t":"v","x":"que nos ha bendecido en la persona de Cristo","c":true},{"t":"v","x":"con toda clase de bienes espirituales y celestiales.","c":true},{"t":"v","x":"Él nos eligió en la persona de Cristo,","c":false},{"t":"v","x":"antes de crear el mundo,","c":true},{"t":"v","x":"para que fuésemos santos","c":true},{"t":"v","x":"e irreprochables ante él por el amor.","c":true},{"t":"v","x":"Él nos ha destinado en la persona de Cristo,","c":false},{"t":"v","x":"por pura iniciativa suya,","c":true},{"t":"v","x":"a ser sus hijos,","c":true},{"t":"v","x":"para que la gloria de su gracia,","c":true},{"t":"v","x":"que tan generosamente nos ha concedido","c":true},{"t":"v","x":"en su querido Hijo,","c":true},{"t":"v","x":"redunde en alabanza suya.","c":true},{"t":"v","x":"Por este Hijo, por su sangre,","c":false},{"t":"v","x":"hemos recibido la redención,","c":true},{"t":"v","x":"el perdón de los pecados.","c":true},{"t":"v","x":"El tesoro de su gracia, sabiduría y prudencia","c":true},{"t":"v","x":"ha sido un derroche para con nosotros,","c":true},{"t":"v","x":"dándonos a conocer el misterio de su voluntad.","c":true},{"t":"v","x":"Este es el plan","c":false},{"t":"v","x":"que había proyectado realizar por Cristo","c":true},{"t":"v","x":"cuando llegase el momento culminante:","c":true},{"t":"v","x":"recapitular en Cristo todas las cosas","c":true},{"t":"v","x":"del cielo y de la tierra.","c":true},{"t":"v","x":"Ant. Dios eligió en la persona de Cristo a san Antonio","c":false},{"t":"v","x":"María Claret para que fuese santo y diera a conocer el","c":false},{"t":"v","x":"misterio de su voluntad.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}],"cite":"Ef 1, 3-10"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Bendito seas, Dios nuestro, que nos has destinado en la persona de Cristo, por pura iniciativa tuya, a ser tus hijos; aviva en nosotros el espíritu filial para que nuestra vida redunde en alabanza tuya. Por Jesucristo, nuestro Señor. Amén."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"El Espíritu del Señor está sobre mí, porque el Señor"},{"t":"p","x":"me ha ungido. Me ha enviado para dar la buena noticia a los que sufren, para vendar los corazones desgarrados, para proclamar la amnistía a los cautivos y a los prisioneros la libertad, para proclamar el año de gracia del Señor."}],"cite":"Is 61, 1-2a"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Tú eres mi siervo de quien estoy orgulloso. Desde el vientre me formó siervo suyo."},{"t":"rr","x":"Tú eres mi siervo de quien estoy orgulloso. Desde el vientre me formó siervo suyo."},{"t":"vr","x":"Te hago luz de las naciones para que mi salvación alcance hasta el confín de la tierra."},{"t":"rr","x":"Desde el vientre me formó siervo suyo."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Tú eres mi siervo de quien estoy orgulloso. Desde el vientre me formó siervo suyo."}],"cite":"Is 49, 3. 6"},{"type":"Cántico evangélico","label":"Magníficat, ant. San Antonio María Claret fue llamado","blocks":[{"t":"p","x":"a anunciar la muerte y resurrección del Señor para que todos los hombres, creyendo en él, se salven."}]},{"type":"Preces","label":"Preces","blocks":[{"t":"p","x":"Constituidos en familia de Dios por el Espíritu Santo y por la vida y doctrina de san Antonio María Claret, oremos a nuestro Padre celestial por nuestra Congregación y supliquémosle:"},{"t":"p","x":"Acuérdate, Señor, de tu Congregación. Padre santo, que enviaste a tu Hijo al mundo para que"},{"t":"p","x":"anunciara a los pobres la buena nueva del Reino, — haz que proclamemos el Evangelio a todos los hombres. Padre santo, que enviaste a tu Hijo para que reconciliara"},{"t":"p","x":"al mundo contigo, — te rogamos que también nosotros sepamos colaborar"},{"t":"p","x":"en la reconciliación de todos los hombres contigo. Padre santo, tú que hiciste que los apóstoles siguieran"},{"t":"p","x":"a tu Hijo en el anuncio del Evangelio, — concédenos participar plenamente en la comunidad de"},{"t":"p","x":"vida misionera que fundó san Antonio María Claret. Padre santo, tú, que por los ruegos de tu Hijo y de la"},{"t":"p","x":"Iglesia envías obreros a tu mies, — dígnate enviarlos a nuestra Congregación para que te"},{"t":"p","x":"glorifiquemos más y más con nuestra vida y apostolado. Padre santo, tú, que inflamaste el corazón de san"},{"t":"p","x":"Antonio María Claret en el amor a la Virgen María,"},{"t":"p","x":"Madre de la Iglesia, — haz que experimentemos siempre su protección"},{"t":"p","x":"materna para que de verdad nos llamemos y seamos"},{"t":"p","x":"hijos suyos."},{"t":"r","x":"Pueden añadirse intenciones particulares, que concluyen con la"},{"t":"p","x":"respuesta indicada más arriba."},{"t":"p","x":"Padre santo, Tú, que resucitaste a tu Hijo de entre los"},{"t":"p","x":"muertos, — haz que cuantos son de Cristo resuciten con él el día"},{"t":"p","x":"de su venida. Padre nuestro."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Señor, Dios nuestro, que escogiste a san Antonio"},{"t":"p","x":"María Claret para fundador de nuestra Congregación e hiciste que, ardiendo en caridad, se gozara en los trabajos, en las calumnias y en los tormentos, concédenos, benigno, que, adhiriéndonos fielmente a sus enseñanzas y ejemplos, proclamemos tu gloria en todo el mundo y busquemos con solicitud la salvación de todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"claret-invitatorio","name":"Invitatorio","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"a","x":"Celebremos con gozo la fiesta de san Antonio María Claret, misionero apostólico y fundador de nuestra familia."},{"t":"r","x":"O bien:"},{"t":"p","x":"Venid, adoremos al Señor en la fiesta de san Antonio María Claret, apóstol de la Palabra."},{"t":"r","x":"El salmo invitatorio, como en el Ordinario."}]}]},{"id":"claret-oficio-de-lectura","name":"Oficio de lectura","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Claret, voz peregrina que vas sembrando","s":true},{"t":"v","x":"la gran noticia: la salvación.","s":true},{"t":"v","x":"No importan razas ni pueblos;","s":true},{"t":"v","x":"solo hay un Padre, solo un Señor.","s":true},{"t":"v","x":"Claret, desde tu vida Dios nos señala","s":true},{"t":"v","x":"nuestra tarea, nuestra misión.","s":true},{"t":"v","x":"Vamos siguiendo tus huellas,","s":true},{"t":"v","x":"gritando al mundo: Dios es amor.","s":true},{"t":"v","x":"Llegó el Señor cruzando tu camino","s":true},{"t":"v","x":"y, al verte, por tu nombre te llamó,","s":false},{"t":"v","x":"para hacerte testigo de su Reino,","s":false},{"t":"v","x":"como fiel mensajero de su voz.","s":false},{"t":"v","x":"Y tú pasabas mares y montañas","s":false},{"t":"v","x":"proclamando el mensaje del amor.","s":false},{"t":"v","x":"Llegaste hasta las islas más lejanas","s":false},{"t":"v","x":"anunciando a los hombres el perdón.","s":false},{"t":"v","x":"La luz del Evangelio fue tu rumbo,","s":true},{"t":"v","x":"tu vida, Cristo mismo la llenó,","s":false},{"t":"v","x":"y le hiciste llegar hasta los hombres,","s":false},{"t":"v","x":"como el Hijo, en María, se nos dio.","s":false},{"t":"v","x":"Nosotros seguiremos tus caminos,","s":false},{"t":"v","x":"como nueva familia del Señor.","s":false},{"t":"v","x":"Queremos ser también la luz del mundo,","s":false},{"t":"v","x":"levadura de vida y salvación.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. El Señor ha puesto en su cabeza una corona de oro fino y le ha concedido años que se prolongan sin término."}]},{"type":"Salmo","label":"Salmo 20, 2-8. 14","blocks":[{"t":"v","x":"Señor, el rey se alegra por tu fuerza,","c":false},{"t":"v","x":"¡y cuánto goza con tu victoria!","c":true},{"t":"v","x":"Le has concedido el deseo de su corazón,","c":true},{"t":"v","x":"no le has negado lo que pedían sus labios.","c":true},{"t":"v","x":"Te adelantaste a bendecirlo con el éxito","c":false},{"t":"v","x":"y has puesto en su cabeza una corona de oro fino.","c":true},{"t":"v","x":"Te pidió vida y se la has concedido,","c":true},{"t":"v","x":"años que se prolongan sin término.","c":true},{"t":"v","x":"Tu victoria ha engrandecido su fama,","c":false},{"t":"v","x":"lo has vestido de honor y majestad.","c":true},{"t":"v","x":"Le concedes bendiciones incesantes,","c":true},{"t":"v","x":"lo colmas de gozo en tu presencia;","c":true},{"t":"v","x":"porque el rey confía en el Señor,","c":true},{"t":"v","x":"y con la gracia del Altísimo no fracasará.","c":true},{"t":"v","x":"Levántate, Señor, con tu fuerza,","c":false},{"t":"v","x":"y al son de instrumentos cantaremos tu poder.","c":true},{"t":"v","x":"Ant. El Señor ha puesto en su cabeza una corona de oro","c":false},{"t":"v","x":"fino y le ha concedido años que se prolongan sin término.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor, tú que has resucitado a Cristo y le has concedido años que se prolongan sin término, mira propicio a los coherederos de tu Hijo y mantenlos firmes en el combate, no sea que, anunciando a otros el Evangelio,"},{"t":"p","x":"queden excluidos del reino de Jesucristo. Él, que vive y reina por los siglos de los siglos. Amén."},{"t":"a","x":"2. Señor, te confesamos y te damos gracias porque nos revelaste tus obras y tus designios."}]},{"type":"Salmo","label":"Salmo 91","blocks":[{"t":"v","x":"Es bueno dar gracias al Señor","c":false},{"t":"v","x":"y tocar para tu nombre, oh, Altísimo,","c":true},{"t":"v","x":"proclamar por la mañana tu misericordia","c":true},{"t":"v","x":"y de noche tu fidelidad,","c":true},{"t":"v","x":"con arpas de diez cuerdas y laúdes,","c":true},{"t":"v","x":"sobre arpegios de cítaras.","c":true},{"t":"v","x":"Tus acciones, Señor, son mi alegría;","c":false},{"t":"v","x":"y mi júbilo, las obras de tus manos.","c":true},{"t":"v","x":"¡Qué magníficas son tus obras, Señor,","c":true},{"t":"v","x":"qué profundos tus designios!","c":true},{"t":"v","x":"El ignorante no los entiende","c":true},{"t":"v","x":"ni el necio se da cuenta.","c":true},{"t":"v","x":"Aunque germinen como hierba los malvados","c":false},{"t":"v","x":"y florezcan los malhechores,","c":true},{"t":"v","x":"serán destruidos para siempre.","c":true},{"t":"v","x":"Tú, en cambio, Señor,","c":true},{"t":"v","x":"eres excelso por los siglos.","c":true},{"t":"v","x":"Ant. Señor, te confesamos y te damos gracias porque","c":false},{"t":"v","x":"nos revelaste tus obras y tus designios.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}],"div":"I"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor, tus acciones son nuestra alegría y nuestro júbilo: haz que comprendamos tus profundos designios y, a la luz de la fe, busquemos en todos los acontecimientos los signos de tu voluntad, de modo que seamos más fieles a nuestra misión. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"3. El justo crecerá como palmera en la casa del Señor y seguirá dando fruto en abundancia."}]},{"type":"Salmo","label":"Salmo 91","blocks":[{"t":"v","x":"Porque tus enemigos, Señor, perecerán,","c":false},{"t":"v","x":"los malhechores serán dispersados;","c":true},{"t":"v","x":"pero a mí me das la fuerza de un búfalo","c":true},{"t":"v","x":"y me unges con aceite nuevo.","c":true},{"t":"v","x":"Mis ojos despreciarán a mis enemigos,","c":true},{"t":"v","x":"mis oídos escucharán su derrota.","c":true},{"t":"v","x":"El justo crecerá como una palmera,","c":false},{"t":"v","x":"se alzará como un cedro del Líbano:","c":true},{"t":"v","x":"plantado en la casa del Señor,","c":true},{"t":"v","x":"crecerá en los atrios de nuestro Dios;","c":true},{"t":"v","x":"en la vejez seguirá dando fruto","c":false},{"t":"v","x":"y estará lozano y frondoso,","c":true},{"t":"v","x":"para proclamar que el Señor es justo,","c":true},{"t":"v","x":"que en mi Roca no existe la maldad.","c":true},{"t":"v","x":"Ant. El justo crecerá como palmera en la casa del Señor","c":false},{"t":"v","x":"y seguirá dando fruto en abundancia.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}],"div":"II"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Ungidos con el aceite nuevo de tu Espíritu, te alabamos, Señor; concédenos que, plantados en tu casa, unidos a ti, demos fruto abundante y nuestro fruto permanezca siempre. Por Jesucristo, nuestro Señor. Amén."},{"t":"vr","x":"A toda la tierra alcanza su pregón."},{"t":"rr","x":"Y hasta los límites del orbe su lenguaje."}]},{"type":"Primera lectura","label":"Primera lectura","blocks":[{"t":"src","x":"De la segunda carta del apóstol san Pablo a los Corintios.","cite":"5, 11-21"},{"t":"th","x":"El amor de Cristo nos apremia"},{"t":"p","x":"Hermanos: sabiendo lo que es el temor del Señor, tratamos de ganar la confianza de los hombres, pues ante Dios estamos al descubierto; aunque espero estar también al descubierto ante vuestras conciencias. No estamos volviendo a recomendarnos ante vosotros; nuestro único deseo es daros motivos para gloriaros de nosotros, de modo que tengáis algo que responder a los que se glorían de apariencias y no de lo que hay en el corazón; pues si empezamos a desatinar, fue por Dios; si nos moderamos, es por vosotros. Porque nos apremia el amor de Cristo al considerar que, si uno murió por todos, todos murieron. Y Cristo murió por todos, para que los que viven ya no vivan para sí, sino para el que murió y resucitó por ellos."},{"t":"p","x":"De modo que nosotros desde ahora no conocemos a nadie según la carne; si alguna vez conocimos a Cristo según la carne, ahora ya no lo conocemos así. Por tanto, si alguno está en Cristo es una criatura nueva. Lo viejo"},{"t":"p","x":"ha pasado, ha comenzado lo nuevo. Todo procede de Dios, que nos reconcilió consigo por medio de Cristo y nos encargó el ministerio de la reconciliación. Porque Dios mismo estaba en Cristo reconciliando al mundo consigo, sin pedirles cuenta de sus pecados, y ha puesto en nosotros el mensaje de la reconciliación. Por eso, nosotros actuamos como enviados de Cristo, y es como si Dios mismo exhortara por medio de nosotros. En nombre de Cristo os pedimos que os reconciliéis con Dios. Al que no conocía el pecado, lo hizo pecado en favor nuestro, para que nosotros llegáramos a ser justicia de Dios en él. Responsorio                                Gál 6, 14. 17"},{"t":"vr","x":"Dios me libre de gloriarme si no es en la cruz de nuestro Señor Jesucristo, en la cual el mundo está crucificado para mí y yo para el mundo."},{"t":"rr","x":"Dios me libre de gloriarme si no es en la cruz de nuestro Señor Jesucristo, en la cual el mundo está crucificado para mí y yo para el mundo."},{"t":"vr","x":"Yo llevo en mi cuerpo las marcas de Jesús."},{"t":"rr","x":"En la cual el mundo está crucificado para mí y yo para el mundo."},{"t":"r","x":"O bien:"},{"t":"p","x":"De la primera carta del apóstol san Pablo a los Corintios.                          9, 16-19. 22-27"},{"t":"p","x":"¡Ay de mí si no anuncio el Evangelio! Hermanos: el hecho de predicar no es para mí motivo de orgullo. No tengo más remedio y, ¡ay de mí si no anuncio el Evangelio! Si yo lo hiciera por mi propio gusto, eso mismo sería mi paga. Pero, si lo hago a pesar"},{"t":"p","x":"mío, es que me han encargado este oficio. Entonces, ¿cuál es la paga? Precisamente dar a conocer el Evangelio, anunciándolo de balde, sin usar el derecho que me da la predicación del Evangelio."},{"t":"p","x":"Porque, siendo libre como soy, me he hecho esclavo de todos para ganar a los más posibles. Me he hecho débil con los débiles, para ganar a los débiles; me he hecho todo para todos, para ganar, sea como sea, a algunos. Y todo lo hago por causa del Evangelio, para participar yo también de sus bienes."},{"t":"p","x":"¿No sabéis que en el estadio todos los corredores cubren la carrera, aunque uno solo se lleva el premio? Pues corred así: para ganar. Pero un atleta se impone toda clase de privaciones; ellos para ganar una corona que se marchita; nosotros, en cambio, una que no se marchita. Por eso corro yo, pero no al azar; lucho, pero no contra el aire; sino que golpeo mi cuerpo y lo someto, no sea que, habiendo predicado a otros, quede yo descalificado. Responsorio                 cf. Hch 20, 21. 24; Rom 1, 16"},{"t":"vr","x":"No he ahorrado medio alguno para predicar la fe en nuestro Señor Jesucristo. No me importa la vida; lo que me importa es completar mi carrera y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios."},{"t":"rr","x":"No he ahorrado medio alguno para predicar la fe en nuestro Señor Jesucristo. No me importa la vida; lo que me importa es completar mi carrera y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios."},{"t":"vr","x":"Yo no me avergüenzo del Evangelio: es la fuerza de salvación de Dios para todo el que cree."},{"t":"rr","x":"No me importa la vida; lo que me importa es completar mi carrera y cumplir el encargo que me dio el Señor Jesús: ser testigo del Evangelio, que es la gracia de Dios."}]},{"type":"Segunda lectura","label":"Segunda lectura","blocks":[{"t":"src","x":"De los escritos de san Antonio María Claret, obispo y fundador. (El egoísmo vencido, en Escritos espirituales, BAC, Madrid 1985, págs. 417-418, y Autobiografía, núm. 494)"},{"t":"th","x":"El amor de Cristo nos apremia"},{"t":"p","x":"Inflamados por el mismo fuego, los misioneros apostólicos han llegado, llegan y llegarán hasta los confines del mundo, desde uno y otro polo, para anunciar la Palabra de Dios, de modo que pueden decirse con razón a sí mismos las palabras del apóstol san Pablo: «Charitas Christi urget nos». La caridad o el amor de Cristo nos estimula y apremia a correr y a volar con las alas del santo celo."},{"t":"p","x":"El verdadero amante ama a Dios y a su prójimo; el verdadero celador es el mismo amante pero en grado superior según los grados de amor, de modo que cuanto más amor tiene, por tanto mayor celo es compelido. Y, si uno no tiene celo, es señal cierta que tiene apagado en su corazón el fuego del amor, la caridad. Quien tiene celo, desea y procura por todos los medios posibles que Dios sea cada vez más conocido, amado y servido en esta vida y en la otra, puesto que este sagrado amor no tiene ningún límite."},{"t":"p","x":"Lo mismo practica con su prójimo, deseando y procurando que todos estén contentos en este mundo y sean felices en el otro; que todos se salven, que ninguno se pierda eternamente, que nadie ofenda a Dios y, finalmente, que ninguno se encuentre ni siquiera un momento en pecado. Así lo vemos en los santos apóstoles y en cualquiera que esté dotado de espíritu apostólico."},{"t":"p","x":"Yo me digo a mí mismo: un Hijo del Inmaculado Corazón de María es un hombre que arde en caridad y que abrasa por donde pasa, que desea eficazmente y procura por todos los medios encender a todo el mundo en el fuego del divino amor. Nada le arredra, se goza en las privaciones, aborda los trabajos, abraza los sacrificios, se complace en las calumnias y se alegra en los tormentos. No piensa sino cómo seguirá e imitará a Jesucristo en trabajar, sufrir y en procurar siempre y únicamente la mayor gloria de Dios y la salvación de las almas. Responsorio                            1Tes 2, 8; Gál 4, 19"},{"t":"vr","x":"Os  teníamos tanto cariño que deseábamos entregaros no solo el evangelio de Dios, sino hasta nuestras propias personas, porque os habíais ganado nuestro amor."},{"t":"rr","x":"Os teníamos tanto cariño que deseábamos entregaros no solo el evangelio de Dios, sino hasta nuestras propias personas, porque os habíais ganado nuestro amor."},{"t":"vr","x":"Hijos míos, otra vez me causáis dolores de parto, hasta que Cristo tome forma en vosotros."},{"t":"rr","x":"Porque os habíais ganado nuestro amor."},{"t":"r","x":"O bien:"},{"t":"p","x":"De los escritos de san Antonio María Claret, obispo y fundador. (Carta al P. José Xifré, 20 de agosto de 1861, en Cartas selectas, BAC, Madrid 1996, pp. 351-352)"},{"t":"p","x":"Cariño a los Misioneros Veo lo que me dice del modo de extender nuestra Congregación y me parece bien, y cuanto más al interior de España, mejor, por ser mayor la necesidad. Me atrevo a decir que nadie lo sabe mejor que yo, por razón de vivir en Madrid y por los viajes que llevo hechos al lado de Sus Majestades. Yo, al ver la disposición de la gente, el hambre de la divina Palabra, etc., no me puedo contener, así que todo el día estoy predicando. ¡Quién me diera el poder correr predicando por toda España, por todo el mundo!… La tentación que tengo que sufrir mayor es [la] de escaparme del lado de Sus Majestades, y aguanto porque me dicen que es la voluntad de Dios el que yo esté a su lado, y yo por ahora también lo creo, y esto, únicamente esto, me hace aguantar, esperando que el Señor me soltará."},{"t":"p","x":"Entre tanto, diga a mis queridísimos hermanos los misioneros que se animen y que trabajen cuanto puedan, que Dios y la Santísima Virgen se lo pagarán. Yo tengo tanto cariño a los sacerdotes que se dedican a las misiones que les daría mi sangre y mi vida; yo les lavaría y besaría mil veces los pies; yo les haría la cama, les guisaría la comida y me quitaría el bocado para que ellos comiesen; los quiero tanto, que de amor me vuelvo loco por ellos, ni sé lo que haría por ellos. Cuando considero que ellos trabajan para que Dios sea más conocido y amado, y para que las almas se salven y no se condenen,"},{"t":"p","x":"yo no sé lo que siento… Ahora mismo, que esto escribo, he tenido que dejar la pluma para acudir a mis ojos… ¡Oh, hijos del Inmaculado Corazón de mi queridísima Madre!, quiero escribiros y no puedo por tener los ojos arrasados en lágrimas. Predicad y rogad por mí."}]},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Vosotros sois la luz del mundo, dice el Señor. Id al mundo entero y proclamad el Evangelio a toda la creación."},{"t":"rr","x":"Vosotros sois la luz del mundo, dice el Señor. Id al mundo entero y proclamad el Evangelio a toda la creación."},{"t":"vr","x":"Tus criaturas, Señor, proclamen la gloria de tu reinado."},{"t":"rr","x":"Id al mundo entero y proclamad el Evangelio a toda la creación."},{"t":"r","x":"Se dice el Himno Te Deum."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Mt 5, 11; Mc 16, 15; Sal 144, 10. 11"}]},{"id":"claret-laudes","name":"Laudes","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Claret, cristiano de fuego,","s":true},{"t":"v","x":"pobre, casto y compasivo,","s":false},{"t":"v","x":"misionero al rojo vivo,","s":false},{"t":"v","x":"con afanes de andariego","s":false},{"t":"v","x":"y ardor de contemplativo.","s":false},{"t":"v","x":"Este es aquel siervo bueno","s":true},{"t":"v","x":"que sus talentos dobló,","s":false},{"t":"v","x":"que muerto al mundo vivió","s":false},{"t":"v","x":"y, como un hijo del trueno,","s":false},{"t":"v","x":"de oriente a poniente ardió.","s":false},{"t":"v","x":"Era una flecha certera","s":true},{"t":"v","x":"que va al blanco con pasión:","s":false},{"t":"v","x":"tenía en el Corazón","s":false},{"t":"v","x":"de su Madre y Medianera","s":false},{"t":"v","x":"la aljaba de su ilusión.","s":false},{"t":"v","x":"Pastor de noble cayado,","s":true},{"t":"v","x":"hizo Iglesia de tal suerte","s":false},{"t":"v","x":"que siempre fue dulce y fuerte,","s":false},{"t":"v","x":"y hasta morir desterrado,","s":false},{"t":"v","x":"buscó la vida en la muerte.","s":false},{"t":"v","x":"Señor del bieldo y del trigo,","s":true},{"t":"v","x":"Cristo Jesús, Salvador:","s":false},{"t":"v","x":"por este tu fiel amigo","s":false},{"t":"v","x":"llévanos siempre contigo","s":false},{"t":"v","x":"hacia el Padre en el Amor.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. Mi alma está unida a ti, Señor mío. Mi alma está sedienta de ti y de la salvación de los hombres."}]},{"type":"Salmo","label":"Salmo 62, 2-9","blocks":[{"t":"v","x":"Oh, Dios, tú eres mi Dios, por ti madrugo,","c":false},{"t":"v","x":"mi alma está sedienta de ti;","c":true},{"t":"v","x":"mi carne tiene ansia de ti,","c":true},{"t":"v","x":"como tierra reseca, agostada, sin agua.","c":true},{"t":"v","x":"¡Cómo te contemplaba en el santuario","c":false},{"t":"v","x":"viendo tu fuerza y tu gloria!","c":true},{"t":"v","x":"Tu gracia vale más que la vida,","c":true},{"t":"v","x":"te alabarán mis labios.","c":true},{"t":"v","x":"Toda mi vida te bendeciré","c":false},{"t":"v","x":"y alzaré las manos invocándote.","c":true},{"t":"v","x":"Me saciaré como de enjundia y de manteca,","c":true},{"t":"v","x":"y mis labios te alabarán jubilosos.","c":true},{"t":"v","x":"En el lecho me acuerdo de ti","c":false},{"t":"v","x":"y velando medito en ti,","c":true},{"t":"v","x":"porque fuiste mi auxilio,","c":true},{"t":"v","x":"y a la sombra de tus alas canto con júbilo;","c":true},{"t":"v","x":"mi alma está unida a ti,","c":true},{"t":"v","x":"y tu diestra me sostiene.","c":true},{"t":"v","x":"Ant. Mi alma está unida a ti, Señor mío. Mi alma está","c":false},{"t":"v","x":"sedienta de ti y de la salvación de los hombres.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor, tu Hijo ha proclamado bienaventurados a los que tienen hambre y sed de justicia; haz que tengamos ansia de ti y nos saciemos de tu palabra para que nuestros labios te alaben jubilosos y anuncien tu nombre a todos los pueblos. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"2. Santos y humildes de corazón, bendecid al Señor por todos los siglos."}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Criaturas todas del Señor, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Ángeles del Señor, bendecid al Señor;","s":false},{"t":"v","x":"cielos, bendecid al Señor.","s":true},{"t":"v","x":"Aguas del espacio, bendecid al Señor;","s":false},{"t":"v","x":"ejércitos del Señor, bendecid al Señor.","s":true},{"t":"v","x":"Sol y luna, bendecid al Señor;","s":false},{"t":"v","x":"astros del cielo, bendecid al Señor.","s":true},{"t":"v","x":"Lluvia y rocío, bendecid al Señor;","s":false},{"t":"v","x":"vientos todos, bendecid al Señor.","s":true},{"t":"v","x":"Fuego y calor, bendecid al Señor;","s":false},{"t":"v","x":"fríos y heladas, bendecid al Señor.","s":true},{"t":"v","x":"Rocíos y nevadas, bendecid al Señor;","s":false},{"t":"v","x":"témpanos y hielos, bendecid al Señor.","s":true},{"t":"v","x":"Escarchas y nieves, bendecid al Señor;","s":false},{"t":"v","x":"noche y día, bendecid al Señor.","s":true},{"t":"v","x":"Luz y tinieblas, bendecid al Señor;","s":false},{"t":"v","x":"rayos y nubes, bendecid al Señor.","s":true},{"t":"v","x":"Bendiga la tierra al Señor,","s":false},{"t":"v","x":"ensálcelo con himnos por los siglos.","s":true},{"t":"v","x":"Montes y cumbres, bendecid al Señor;","s":false},{"t":"v","x":"cuanto germina en la tierra, bendiga al Señor.","s":true},{"t":"v","x":"Manantiales, bendecid al Señor;","s":false},{"t":"v","x":"mares y ríos, bendecid al Señor.","s":true},{"t":"v","x":"Cetáceos y peces, bendecid al Señor;","s":false},{"t":"v","x":"aves del cielo, bendecid al Señor.","s":true},{"t":"v","x":"Fieras y ganados, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Hijos de los hombres, bendecid al Señor;","s":false},{"t":"v","x":"bendiga Israel al Señor.","s":true},{"t":"v","x":"Sacerd ":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Soy ministro del Evangelio por el don de la gracia de Dios."}]},{"type":"Cántico evangélico","label":"Benedictus, ant. El Señor suscitó en la Iglesia a su siervo","blocks":[{"t":"p","x":"Antonio María Claret para que se consagrara a Cristo e imitara su vida en el anuncio del Evangelio."}]},{"type":"Preces","label":"Preces","blocks":[{"t":"p","x":"Supliquemos a Cristo, Señor nuestro, enviado por el Padre, nacido de la Virgen María y ungido por el Espíritu para ser maestro y salvador de los hombres, y aclamémoslo diciendo:"},{"t":"p","x":"Envíanos, Señor, tu Espíritu. Señor Jesús, que nos has llamado para estar contigo y"},{"t":"p","x":"nos envías a predicar el Evangelio, — haz que cada día se acreciente en nosotros tu"},{"t":"p","x":"amistad y el amor a todos los hombres. Señor Jesús, que nos has consagrado para que vivamos"},{"t":"p","x":"en fraternidad, a fin de que el mundo crea por el"},{"t":"p","x":"testimonio de nuestra unidad, — concédenos perseverar unánimes en la oración en"},{"t":"p","x":"comunión con María, tu Madre. Señor Jesús, que quieres que seamos sal de la tierra y"},{"t":"p","x":"luz del mundo, — ilumina nuestras vidas con la luz de tu Palabra. Señor Jesús, que viniste a traer fuego a la tierra y"},{"t":"p","x":"anhelas ver el mundo ardiendo en ese mismo fuego, — inflámanos en tu amor para que abrasemos por"},{"t":"p","x":"donde pasemos."},{"t":"p","x":"Señor Jesús, que pasaste por el mundo haciendo el"},{"t":"p","x":"bien, especialmente a los pobres y a los enfermos, — haz que, siguiendo el ejemplo de san Antonio"},{"t":"p","x":"María Claret, busquemos con solicitud el bien de"},{"t":"p","x":"los hermanos."},{"t":"r","x":"Pueden añadirse intenciones particulares, que concluyen con la"},{"t":"p","x":"respuesta indicada más arriba. Padre nuestro."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Señor, Dios nuestro, que escogiste a san Antonio"},{"t":"p","x":"María Claret para fundador de nuestra Congregación e hiciste que, ardiendo en caridad, se gozara en los trabajos, en las calumnias y en los tormentos, concédenos, benigno, que, adhiriéndonos fielmente a sus enseñanzas y ejemplos, proclamemos tu gloria en todo el mundo y busquemos con solicitud la salvación de todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"claret-hora-intermedia","name":"Hora intermedia","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"r","x":"Si cae en domingo se recitan los salmos del domingo I; en los demás casos, se dirán los salmos graduales de la salmodia complementaria."}]}]},{"id":"claret-tercia","name":"Tercia","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Humilde mensajero por los campos del mundo,","c":true},{"t":"v","x":"cruzas los anchos mares como antorcha de gloria,","c":true},{"t":"v","x":"predicando a los pobres el amor de Dios Padre,","c":true},{"t":"v","x":"realizando prodigios, dando luz a las almas.","c":true},{"t":"v","x":"Forjador de una nueva sociedad sin fronteras,","c":true},{"t":"v","x":"redimes a los pobres con tu pobreza humilde,","c":true},{"t":"v","x":"enseñas a los reyes la pobreza de espíritu","c":true},{"t":"v","x":"y a todos enriquece tu verbo inextinguible.","c":true},{"t":"v","x":"Vives vida escondida con Cristo en la plegaria,","c":true},{"t":"v","x":"tu cuerpo es un sagrario donde el Señor se asienta,","c":true},{"t":"v","x":"y el Corazón ardiente de la Virgen alumbra","c":true},{"t":"v","x":"tus pasos en el gozo de tu piedad materna.","c":true},{"t":"v","x":"Sin piedad te difaman, calumnian y persiguen","c":true},{"t":"v","x":"los que no reconocen la verdad que proclamas,","c":true},{"t":"v","x":"y un día, al fin, entregas al Señor de la gloria","c":true},{"t":"v","x":"la mies madura, el fruto de tu vida incansada.","c":true},{"t":"v","x":"Hoy los hijos nacidos de tu entraña fecunda","c":true},{"t":"v","x":"prolongamos el fuego de tu inmensa palabra,","c":true},{"t":"v","x":"por eso bendecimos al Padre y al Espíritu","c":true},{"t":"v","x":"y damos gloria a Cristo por siglos infinitos. Amén.","c":true},{"t":"v","x":"Ant. He aquí el sumo sacerdote que en su vida agradó","c":false},{"t":"v","x":"a Dios.","c":false}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"He aquí el sumo sacerdote que en su vida reparó la"},{"t":"p","x":"casa y en sus días fortificó el santuario. Que cuidó de su pueblo para evitar su ruina. Y al subir al santo altar, llenaba de gloria el recinto del santuario."},{"t":"vr","x":"El Señor lo eligió para ser su sacerdote."},{"t":"rr","x":"Para ofrecerle un sacrificio de alabanza."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Eclo 50, 1. 4. 11b"}],"sub":true},{"id":"claret-sexta","name":"Sexta","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"r","x":"El himno, como en Tercia."},{"t":"a","x":"Nuestros ojos están fijos en el Señor, confiando y esperando su misericordia."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"r","x":"Para la ley yo estoy muerto, porque la ley me ha dado"},{"t":"p","x":"muerte, pero así vivo para Dios. Estoy crucificado con Cristo: vivo yo, pero no soy yo, es Cristo quien vive en mí. Y, mientras vivo en esta carne, vivo de la fe en el Hijo de Dios, que me amó hasta entregarse por mí."},{"t":"vr","x":"La grandeza de Cristo se manifestará en mi persona."},{"t":"rr","x":"Para mí, la vida es Cristo."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Gál 2, 19-20"}],"sub":true},{"id":"claret-nona","name":"Nona","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"r","x":"El himno, como en Tercia."},{"t":"a","x":"El Señor ha estado grande con los que lo temen, dará la herencia a sus amigos."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Hijo mío, si aceptas mis palabras y conservas mis"},{"t":"p","x":" odia","blocks":[{"t":"a","x":"1. El que procede honradamente y practica la justicia habitará, Señor, en tu monte santo."}]},{"type":"Salmo","label":"Salmo 14","blocks":[{"t":"v","x":"Señor, ¿quién puede hospedarse en tu tienda","c":false},{"t":"v","x":"y habitar en tu monte santo?","c":true},{"t":"v","x":"El que procede honradamente","c":false},{"t":"v","x":"y practica la justicia,","c":true},{"t":"v","x":"el que tiene intenciones leales","c":true},{"t":"v","x":"y no calumnia con su lengua,","c":true},{"t":"v","x":"el que no hace mal a su prójimo","c":false},{"t":"v","x":"ni difama al vecino,","c":true},{"t":"v","x":"el que considera despreciable al impío","c":true},{"t":"v","x":"y honra a los que temen al Señor,","c":true},{"t":"v","x":"el que no retracta lo que juró","c":false},{"t":"v","x":"aun en daño propio,","c":true},{"t":"v","x":"el que no presta dinero a usura","c":true},{"t":"v","x":"ni acepta soborno contra el inocente.","c":true},{"t":"v","x":"El que así obra nunca fallará.","c":false},{"t":"v","x":"Ant. El que procede honradamente y practica la justicia","c":false},{"t":"v","x":"habitará, Señor, en tu monte santo.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Padre santo, haz que procedamos honradamente y practiquemos la justicia, y que seamos cada día más humildes, más fervorosos y más celosos de la salvación de los hombres para llegar a hospedarnos en tu tienda y habitar contigo en tu monte santo. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"2. Dichoso el hombre que administra rectamente sus asuntos: su descendencia será bendita."}]},{"type":"Salmo","label":"Salmo 111","blocks":[{"t":"v","x":"Dichoso quien teme al Señor","c":false},{"t":"v","x":"y ama de corazón sus mandatos.","c":true},{"t":"v","x":"Su linaje será poderoso en la tierra,","c":true},{"t":"v","x":"la descendencia del justo será bendita.","c":true},{"t":"v","x":"En su casa habrá riquezas y abundancia,","c":false},{"t":"v","x":"su caridad es constante, sin falta.","c":true},{"t":"v","x":"En las tinieblas brilla como una luz","c":true},{"t":"v","x":"el que es justo, clemente y compasivo.","c":true},{"t":"v","x":"Dichoso el que se apiada y presta,","c":false},{"t":"v","x":"y administra rectamente sus asuntos.","c":true},{"t":"v","x":"El justo jamás vacilará,","c":true},{"t":"v","x":"su recuerdo será perpetuo.","c":true},{"t":"v","x":"No temerá las malas noticias,","c":false},{"t":"v","x":"su corazón está firme en el Señor.","c":true},{"t":"v","x":"Su corazón está seguro, sin temor,","c":true},{"t":"v","x":"hasta que vea derrotados a sus enemigos.","c":true},{"t":"v","x":"Reparte limosna a los pobres;","c":false},{"t":"v","x":"su caridad es constante, sin falta,","c":true},{"t":"v","x":"y alzará la frente con dignidad.","c":true},{"t":"v","x":"El malvado, al verlo, se irritará,","c":false},{"t":"v","x":"rechinará los dientes hasta consumirse.","c":true},{"t":"v","x":"La ambición del malvado fracasará.","c":true},{"t":"v","x":"Ant. Dichoso el hombre que administra rectamente sus","c":false},{"t":"v","x":"asuntos: su descendencia será bendita.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Mantén, Señor, nuestro corazón firme, seguro y sin temor, y haz que, urgidos por la caridad, sepamos"},{"t":"p","x":"gozarnos en las privaciones, abordar los trabajos, abrazar los sacrificios y gloriarnos en la cruz de Jesucristo. Él, que vive y reina por los siglos de los siglos. Amén."},{"t":"a","x":"3. Vendrán las naciones y se postrarán en tu acatamiento, porque tus juicios se hicieron manifiestos."}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Grandes y maravillosas son tus obras,","c":false},{"t":"v","x":"Señor, Dios omnipotente,","c":true},{"t":"v","x":"justos y verdaderos tus caminos,","c":true},{"t":"v","x":"¡oh, Rey de los siglos!","c":true},{"t":"v","x":"¿Quién no temerá, Señor,","c":false},{"t":"v","x":"y glorificará tu nombre?","c":true},{"t":"v","x":"Porque tú solo eres santo,","c":true},{"t":"v","x":"porque vendrán todas las naciones","c":true},{"t":"v","x":"y se postrarán en tu acatamiento,","c":true},{"t":"v","x":"porque tus juicios se hicieron manifiestos.","c":true},{"t":"v","x":"Ant. Vendrán las naciones y se postrarán en tu","c":false},{"t":"v","x":"acatamiento, porque tus juicios se hicieron manifiestos.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}],"cite":"Ap 15, 3-4"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor Dios omnipotente, tus caminos son justos y verdaderos; haz que procuremos siempre y únicamente tu mayor gloria y encendamos a todo el mundo en el fuego del divino amor. Por Jesucristo, nuestro Señor. Amén."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Vendrá un tiempo en que la gente no soportará la"},{"t":"p","x":"doctrina sana, sino que, para halagarse el oído,"},{"t":"p","x":"se rodearán de maestros a la medida de sus deseos; y, apartando el oído de la verdad, se volverán a las fábulas. Tú estate siempre alerta: soporta lo adverso, cumple tu tarea de evangelizador, desempeña tu ministerio."}],"cite":"2Tim 4, 3-5"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Como el Padre me envió, también yo os envío."},{"t":"rr","x":"Como el Padre me envió, también yo os envío."},{"t":"vr","x":"Para ser mis testigos hasta los confines del mundo."},{"t":"rr","x":"También yo os envío."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Como el Padre me envió, también yo os envío."}],"cite":"Jn 20, 21"},{"type":"Cántico evangélico","label":"Magníficat, ant. Mira desde el cielo, fíjate, ven a visitar tu","blocks":[{"t":"p","x":"viña, la que tu diestra plantó y que tú hiciste vigorosa."},{"t":"p","x":"Las preces, como en las I Vísperas."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Señor, Dios nuestro, que escogiste a san Antonio"},{"t":"p","x":"María Claret para fundador de nuestra Congregación e hiciste que, ardiendo en caridad, se gozara en los trabajos, en las calumnias y en los tormentos, concédenos, benigno, que, adhiriéndonos fielmente a sus enseñanzas y ejemplos, proclamemos tu gloria en todo el mundo y busquemos con solicitud la salvación de todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]}]},{"id":"patrocinio","date":"13 de noviembre","title":"Beata María Patrocinio Giner","rank":"Memoria facultativa","intro":[{"t":"p","x":"María Patrocinio Giner, Misionera Claretiana, nació en Tortosa (Tarragona), el 4 de enero de 1874. El 16 de septiembre de 1893 hizo su profesión perpetua en Carcagente (Valencia). Desempeñó diversas responsabilidades en la comunidad como superiora y formadora, educadora sensible a las necesidades de las niñas y jóvenes. Fue la fundadora de la comunidad de Puerto Sagunto. Una vez desatada la persecución religiosa en el contexto de la guerra civil española (1936-1939), afrontó con valentía y paz las adversidades que sufrió la comunidad tanto en Puerto Sagunto como, luego nuevamente, en Carcagente. Con otras hermanas tuvo que salir de la casa religiosa y refugiarse. No dejó de animar a sus hermanas y las instó a entregar la vida por Cristo. La muerte la alcanzó la noche del 13 de noviembre de 1936, cuando sin juicio fue asesinada junto a otras víctimas. Sus últimas palabras fueron de perdón e intercesión."},{"t":"r","x":"Común de un mártir."}],"hours":[{"id":"patrocinio-laudes","name":"Laudes","parts":[{"type":"Cántico evangélico","label":"Benedictus, ant. Se ciñó la cintura con firmeza y desplegó","blocks":[{"t":"p","x":"la fuerza de sus brazos; por ello, no se apagará nunca más su lámpara."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Dios todopoderoso y misericordioso, tú que has"},{"t":"p","x":"hecho a la beata María Patrocinio admirable en el servicio de los hermanos y en el martirio, concédenos, por su intercesión, seguir a Cristo con perseverancia en el camino de la cruz para alcanzar la gloria de la resurrección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"patrocinio-visperas","name":"Vísperas","parts":[{"type":"Cántico evangélico","label":"Magníficat, ant. El que se aborrece a sí mismo en este","blocks":[{"t":"p","x":"mundo se guardará para la vida eterna."},{"t":"p","x":"ORACIÓN"},{"t":"p","x":"PARA ANTES DEL DESCANSO NOCTURNO"}]}]}]},{"id":"completas","date":"Apéndice","title":"Completas","rank":"Oración para antes del descanso nocturno","intro":[{"t":"r","x":"Para la oración de Completas puede tomarse o bien el formulario"},{"t":"p","x":"que corresponde al día de la semana o bien, si se prefiere, uno de los dos formularios indicados para el domingo, diciendo, en este caso, la segunda oración conclusiva."}],"hours":[{"id":"completas-despues-de-las-i-visperas-de-las-solemnidades","name":"Después de las I Vísperas de las solemnidades","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"p","x":"DE LAS SOLEMNIDADES"},{"t":"r","x":"Todo como en el Ordinario, excepto lo siguiente:"}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. Ten piedad de mí, Señor, y escucha mi oración."}]},{"type":"Salmo","label":"Salmo 4","blocks":[{"t":"v","x":"Escúchame cuando te invoco, Dios, defensor mío;","c":false},{"t":"v","x":"tú que en el aprieto me diste anchura,","c":true},{"t":"v","x":"ten piedad de mí y escucha mi oración.","c":true},{"t":"v","x":"Y vosotros, ¿hasta cuándo ultrajaréis mi honor,","c":false},{"t":"v","x":"amaréis la falsedad y buscaréis el engaño?","c":true},{"t":"v","x":"Sabedlo: el Señor hizo milagros en mi favor","c":true},{"t":"v","x":"y el Señor me escuchará cuando lo invoque.","c":true},{"t":"v","x":"Temblad y no pequéis, reflexionad","c":false},{"t":"v","x":"en el silencio de vuestro lecho:","c":true},{"t":"v","x":"ofreced sacrificios legítimos","c":true},{"t":"v","x":"y confiad en el Señor.","c":true},{"t":"v","x":"Hay muchos que dicen: «¿Quién nos hará ver la dicha,","c":false},{"t":"v","x":"si la luz de tu rostro ha huido de nosotros?».","c":true},{"t":"v","x":"Pero tú, Señor, has puesto en mi corazón más alegría","c":false},{"t":"v","x":"que si abundara en trigo y en vino.","c":true},{"t":"v","x":"En paz me acuesto y en seguida me duermo,","c":false},{"t":"v","x":"porque tú solo, Señor, me haces vivir tranquilo.","c":true},{"t":"v","x":"Ant. Ten piedad de mí, Señor, y escucha mi oración.","c":false},{"t":"v","x":"Ant. 2. Durante la noche, bendecid al Señor.","c":false}]},{"type":"Salmo","label":"Salmo 133","blocks":[{"t":"v","x":"Ya ahora bendecid al Señor,","c":false},{"t":"v","x":"los siervos del Señor,","c":true},{"t":"v","x":"los que pasáis la noche","c":true},{"t":"v","x":"en la casa del Señor:","c":true},{"t":"v","x":"levantad las manos hacia el santuario","c":false},{"t":"v","x":"y bendecid al Señor.","c":true},{"t":"v","x":"El Señor te bendiga desde Sion,","c":false},{"t":"v","x":"el que hizo cielo y tierra.","c":true},{"t":"v","x":"Ant. Durante la noche, bendecid al Señor.","c":false}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Escucha, Israel: el Señor, nuestro Dios, es solamente"},{"t":"p","x":"uno. Amarás al Señor, tu Dios, con todo el corazón, con toda el alma, con todas las fuerzas. Las palabras que hoy te digo quedarán en tu memoria, se las repetirás a tus hijos y hablarás de ellas estando en casa y yendo de camino, acostado y levantado."}],"cite":"Dt 6, 4-7"},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Cuando la solemnidad coincide en domingo:"},{"t":"p","x":"Guárdanos, Señor, durante esta noche y haz que"},{"t":"p","x":"mañana, ya al clarear el nuevo día, la celebración del domingo nos llene con la alegría de la resurrección de tu Hijo. Él, que vive y reina por los siglos de los siglos. Amén. Cuando la solemnidad no coincide en domingo:"},{"t":"p","x":"Visita, Señor, esta habitación: aleja de ella las"},{"t":"p","x":"insidias del enemigo. Que tus santos ángeles habiten en ella y nos guarden en paz, y que tu bendición permanezca siempre con nosotros. Por Jesucristo, nuestro Señor. Amén. La oración y la antífona final a la Santísima Virgen María, como en el Ordinario."}]}]},{"id":"completas-despues-de-las-ii-visperas-de-las-solemnidades","name":"Después de las II Vísperas de las solemnidades","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"p","x":"DE LAS SOLEMNIDADES"},{"t":"r","x":"Todo como en el Ordinario, excepto lo siguiente:"}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"Al amparo del Altísimo no temo el espanto nocturno."}]},{"type":"Salmo","label":"Salmo 90","blocks":[{"t":"v","x":"Tú que habitas al amparo del Altísimo,","c":false},{"t":"v","x":"que vives a la sombra del Omnipotente,","c":true},{"t":"v","x":"di al Señor: «Refugio mío, alcázar mío.","c":true},{"t":"v","x":"Dios mío, confío en ti».","c":true},{"t":"v","x":"Él te librará de la red del cazador,","c":false},{"t":"v","x":"de la peste funesta.","c":true},{"t":"v","x":"Te cubrirá con sus plumas,","c":true},{"t":"v","x":"bajo sus alas te refugiarás:","c":true},{"t":"v","x":"su brazo es escudo y armadura.","c":true},{"t":"v","x":"No temerás el espanto nocturno,","c":false},{"t":"v","x":"ni la flecha que vuela de día,","c":true},{"t":"v","x":"ni la peste que se desliza en las tinieblas,","c":true},{"t":"v","x":"ni la epidemia que devasta a mediodía.","c":true},{"t":"v","x":"Caerán a tu izquierda mil,","c":false},{"t":"v","x":"diez mil a tu derecha;","c":true},{"t":"v","x":"a ti no te alcanzará.","c":true},{"t":"v","x":"Nada más mirar con tus ojos","c":false},{"t":"v","x":"verás la paga de los malvados,","c":true},{"t":"v","x":"porque hiciste del Señor tu refugio,","c":true},{"t":"v","x":"tomaste al Altísimo por defensa.","c":true},{"t":"v","x":"No se te acercará la desgracia,","c":false},{"t":"v","x":"ni la plaga llegará hasta tu tienda,","c":true},{"t":"v","x":"porque a sus ángeles ha dado órdenes","c":true},{"t":"v","x":"para que te guarden en tus caminos;","c":true},{"t":"v","x":"te llevarán en sus palmas,","c":false},{"t":"v","x":"para que tu pie no tropiece en la piedra;","c":true},{"t":"v","x":"caminarás sobre áspides y víboras,","c":true},{"t":"v","x":"pisotearás leones y dragones.","c":true},{"t":"v","x":"«Se puso junto a mí: lo libraré;","c":false},{"t":"v","x":"lo protegeré porque conoce mi nombre,","c":true},{"t":"v","x":"me invocará y lo escucharé.","c":true},{"t":"v","x":"Con él estaré en la tribulación,","c":false},{"t":"v","x":"lo defenderé, lo glorificaré;","c":true},{"t":"v","x":"lo saciaré de largos días,","c":true},{"t":"v","x":"y le haré ver mi salvación».","c":true},{"t":"v","x":"Ant. Al amparo del Altísimo no temo el espanto nocturno.","c":false}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Verán al Señor cara a cara y llevarán su nombre en"},{"t":"p","x":"la frente. Ya no habrá más noche, ni necesitarán luz de lámpara o de sol, porque el Señor Dios irradiará sobre ellos y reinarán por los siglos de los siglos."}],"cite":"Ap 22, 4-5"},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Cuando la solemnidad coincide en domingo:"},{"t":"p","x":"Guárdanos, Señor, durante esta noche y haz que"},{"t":"p","x":"mañana, ya al clarear el nuevo día, la celebración del domingo nos llene con la alegría de la resurrección de tu Hijo. Él, que vive y reina por los siglos de los siglos. Amén. Cuando la solemnidad no coincide en domingo:"},{"t":"p","x":"Visita, Señor, esta habitación: aleja de ella las"},{"t":"p","x":"insidias del enemigo; que tus santos ángeles habiten en ella y nos guarden en paz y que tu bendición permanezca siempre con nosotros. Por Jesucristo, nuestro Señor. Amén. La oración y la antífona final a la Santísima Virgen María, como en el Ordinario."}]}]}]},{"id":"complementaria","date":"Apéndice","title":"Salmodia complementaria","rank":"Para Tercia, Sexta y Nona","intro":[{"t":"p","x":"En las solemnidades que no coinciden en domingo, después de la invocación inicial y del himno, se recitan los salmos de la serie correspondiente con las antífonas propias."}],"hours":[{"id":"complementaria-serie-i-tercia","name":"Serie I (Tercia)","parts":[{"type":"Salmo","label":"Salmo 119","blocks":[{"t":"v","x":"En mi aflicción llamé al Señor","c":false},{"t":"v","x":"y él me respondió.","c":true},{"t":"v","x":"Líbrame, Señor, de los labios mentirosos,","c":true},{"t":"v","x":"de la lengua traidora.","c":true},{"t":"v","x":"¿Qué te va a dar o a mandarte Dios,","c":false},{"t":"v","x":"lengua traidora?","c":true},{"t":"v","x":"Flechas de arquero","c":true},{"t":"v","x":"afiladas con ascuas de retama.","c":true},{"t":"v","x":"¡Ay de mí, desterrado en Masac,","c":false},{"t":"v","x":"acampado en Cadar!","c":true},{"t":"v","x":"Demasiado llevo viviendo","c":true},{"t":"v","x":"con los que odian la paz;","c":true},{"t":"v","x":"cuando yo digo: «Paz»,","c":true},{"t":"v","x":"ellos dicen: «Guerra».","c":true}]},{"type":"Salmo","label":"Salmo 120","blocks":[{"t":"v","x":"Levanto mis ojos a los montes:","c":false},{"t":"v","x":"¿de dónde me vendrá el auxilio?","c":true},{"t":"v","x":"El auxilio me viene del Señor,","c":true},{"t":"v","x":"que hizo el cielo y la tierra.","c":true},{"t":"v","x":"No permitirá que resbale tu pie,","c":false},{"t":"v","x":"tu guardián no duerme;","c":true},{"t":"v","x":"no duerme ni reposa","c":true},{"t":"v","x":"el guardián de Israel.","c":true},{"t":"v","x":"El Señor te guarda a su sombra,","c":false},{"t":"v","x":"está a tu derecha:","c":true},{"t":"v","x":"de día el sol no te hará daño,","c":true},{"t":"v","x":"ni la luna de noche.","c":true},{"t":"v","x":"El Señor te guarda de todo mal,","c":false},{"t":"v","x":"él guarda tu alma;","c":true},{"t":"v","x":"el Señor guarda tus entradas y salidas,","c":true},{"t":"v","x":"ahora y por siempre.","c":true}]},{"type":"Salmo","label":"Salmo 121","blocks":[{"t":"v","x":"¡Qué alegría cuando me dijeron:","c":false},{"t":"v","x":"«Vamos a la casa del Señor»!","c":true},{"t":"v","x":"Ya están pisando nuestros pies","c":true},{"t":"v","x":"tus umbrales, Jerusalén.","c":true},{"t":"v","x":"Jerusalén está fundada","c":false},{"t":"v","x":"como ciudad bien compacta.","c":true},{"t":"v","x":"Allá suben las tribus,","c":true},{"t":"v","x":"las tribus del Señor,","c":true},{"t":"v","x":"según la costumbre de Israel,","c":false},{"t":"v","x":"a celebrar el nombre del Señor;","c":true},{"t":"v","x":"en ella están los tribunales de justicia,","c":true},{"t":"v","x":"en el palacio de David.","c":true},{"t":"v","x":"Desead la paz a Jerusalén:","c":false},{"t":"v","x":"«Vivan seguros los que te aman,","c":true},{"t":"v","x":"haya paz dentro de tus muros,","c":true},{"t":"v","x":"seguridad en tus palacios».","c":true},{"t":"v","x":"Por mis hermanos y compañeros,","c":false},{"t":"v","x":"voy a decir: «La paz contigo».","c":true},{"t":"v","x":"Por la casa del Señor, nuestro Dios,","c":true},{"t":"v","x":"te deseo todo bien.","c":true}]}]},{"id":"complementaria-serie-ii-sexta","name":"Serie II (Sexta)","parts":[{"type":"Salmo","label":"Salmo 122","blocks":[{"t":"v","x":"Aa ti levanto mis ojos,","c":false},{"t":"v","x":"a ti que habitas en el cielo.","c":true},{"t":"v","x":"Como están los ojos de los esclavos","c":false},{"t":"v","x":"fijos en las manos de sus señores,","c":true},{"t":"v","x":"como están los ojos de la esclava","c":true},{"t":"v","x":"fijos en las manos de su señora,","c":true},{"t":"v","x":"así están nuestros ojos","c":true},{"t":"v","x":"en el Señor, Dios nuestro,","c":true},{"t":"v","x":"esperando su misericordia.","c":true},{"t":"v","x":"Misericordia, Señor, misericordia,","c":false},{"t":"v","x":"que estamos saciados de desprecios;","c":true},{"t":"v","x":"nuestra alma está saciada","c":true},{"t":"v","x":"del sarcasmo de los satisfechos,","c":true},{"t":"v","x":"del desprecio de los orgullosos.","c":true}]},{"type":"Salmo","label":"Salmo 123","blocks":[{"t":"v","x":"Si el Señor no hubiera estado de nuestra parte","c":false},{"t":"v","x":"—que lo diga Israel—,","c":true},{"t":"v","x":"si el Señor no hubiera estado de nuestra parte","c":true},{"t":"v","x":"cuando nos asaltaban los hombres,","c":true},{"t":"v","x":"nos habrían tragado vivos:","c":true},{"t":"v","x":"tanto ardía su ira contra nosotros.","c":true},{"t":"v","x":"Nos habrían arrollado las aguas,","c":false},{"t":"v","x":"llegándonos el torrente hasta el cuello:","c":true},{"t":"v","x":"nos habrían llegado hasta el cuello","c":true},{"t":"v","x":"las aguas espumantes.","c":true},{"t":"v","x":"Bendito el Señor, que no nos entregó","c":false},{"t":"v","x":"en presa a sus dientes;","c":true},{"t":"v","x":"hemos salvado la vida, como un pájaro","c":true},{"t":"v","x":"de la trampa del cazador:","c":true},{"t":"v","x":"la trampa se rompió, y escapamos.","c":true},{"t":"v","x":"Nuestro auxilio es el nombre del Señor,","c":false},{"t":"v","x":"que hizo el cielo y la tierra.","c":true}]},{"type":"Salmo","label":"Salmo 124","blocks":[{"t":"v","x":"Los que confían en el Señor son como el monte Sion:","c":false},{"t":"v","x":"no tiembla, está asentado para siempre.","c":true},{"t":"v","x":"Jerusalén está rodeada de montañas,","c":false},{"t":"v","x":"y el Señor rodea a su pueblo","c":true},{"t":"v","x":"ahora y por siempre.","c":true},{"t":"v","x":"No pesará el cetro de los malvados","c":false},{"t":"v","x":"sobre el lote de los ju
