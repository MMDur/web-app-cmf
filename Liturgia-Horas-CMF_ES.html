:"su salario, el fruto del vientre:","c":true},{"t":"v","x":"son saetas en mano de un guerrero","c":true},{"t":"v","x":"los hijos de la juventud.","c":true},{"t":"v","x":"Dichoso el hombre que llena","c":false},{"t":"v","x":"con ellas su aljaba:","c":true},{"t":"v","x":"no quedará derrotado cuando litigue","c":true},{"t":"v","x":"con su adversario en la plaza.","c":true}]},{"type":"Salmo","label":"Salmo 127","blocks":[{"t":"v","x":"Dichoso el que teme al Señor","c":false},{"t":"v","x":"y sigue sus caminos.","c":true},{"t":"v","x":"Comerás del fruto de tu trabajo,","c":false},{"t":"v","x":"serás dichoso, te irá bien;","c":true},{"t":"v","x":"tu mujer, como parra fecunda,","c":true},{"t":"v","x":"en medio de tu casa;","c":true},{"t":"v","x":"tus hijos, como renuevos de olivo,","c":false},{"t":"v","x":"alrededor de tu mesa:","c":true},{"t":"v","x":"esta es la bendición del hombre","c":true},{"t":"v","x":"que teme al Señor.","c":true},{"t":"v","x":"Que el Señor te bendiga desde Sion,","c":false},{"t":"v","x":"que veas la prosperidad de Jerusalén","c":true},{"t":"v","x":"todos los días de tu vida;","c":true},{"t":"v","x":"que veas a los hijos de tus hijos.","c":true},{"t":"v","x":"¡Paz a Israel!","c":true},{"t":"v","x":"En lugar de los salmos graduales 121 y 126, se pueden recitar los","c":false},{"t":"v","x":"salmos 128 y 130 respectivamente.","c":false}]},{"type":"Salmo","label":"Salmo 128","blocks":[{"t":"v","x":"¡Cuánta guerra me han hecho desde mi juventud","c":false},{"t":"v","x":"—que lo diga Israel—,","c":true},{"t":"v","x":"cuánta guerra me han hecho desde mi juventud,","c":true},{"t":"v","x":"pero no pudieron conmigo!","c":true},{"t":"v","x":"En mis espaldas metieron el arado","c":false},{"t":"v","x":"y alargaron los surcos.","c":true},{"t":"v","x":"Pero el Señor, que es justo,","c":true},{"t":"v","x":"rompió las coyundas de los malvados.","c":true},{"t":"v","x":"Retrocedan avergonzados","c":false},{"t":"v","x":"los que odian a Sion;","c":true},{"t":"v","x":"sean como la hierba del tejado,","c":true},{"t":"v","x":"que se seca y nadie la siega;","c":true},{"t":"v","x":"que no llena la mano del segador","c":false},{"t":"v","x":"ni la brazada del que agavilla;","c":true},{"t":"v","x":"ni le dicen los que pasan:","c":true},{"t":"v","x":"«Que el Señor te bendiga».","c":true},{"t":"v","x":"Os bendecimos en el nombre del Señor.","c":false}]},{"type":"Salmo","label":"Salmo 130","blocks":[{"t":"v","x":"S eñor, mi corazón no es ambicioso,","c":false},{"t":"v","x":"ni mis ojos altaneros;","c":true},{"t":"v","x":"no pretendo grandezas","c":true},{"t":"v","x":"que superan mi capacidad;","c":true},{"t":"v","x":"sino que acallo y modero mis deseos,","c":true},{"t":"v","x":"como un niño en brazos de su madre.","c":true},{"t":"v","x":"Espere Israel en el Señor","c":false},{"t":"v","x":"ahora y por siempre.","c":true},{"t":"v","x":"Si la solemnidad de San Antonio María Claret coincide en domingo","c":false},{"t":"v","x":"se recitan los siguientes salmos para la Hora intermedia:","c":false}]},{"type":"Salmo","label":"Salmo 117","blocks":[{"t":"v","x":"Dad gracias al Señor porque es bueno,","c":false},{"t":"v","x":"porque es eterna su misericordia.","c":true},{"t":"v","x":"Diga la casa de Israel:","c":false},{"t":"v","x":"eterna es su misericordia.","c":true},{"t":"v","x":"Diga la casa de Aarón:","c":false},{"t":"v","x":"eterna es su misericordia.","c":true},{"t":"v","x":"Digan los fieles del Señor:","c":false},{"t":"v","x":"eterna es su misericordia.","c":true},{"t":"v","x":"En el peligro grité al Señor,","c":false},{"t":"v","x":"y me escuchó, poniéndome a salvo.","c":true},{"t":"v","x":"El Señor está conmigo: no temo;","c":false},{"t":"v","x":"¿qué podrá hacerme el hombre?","c":true},{"t":"v","x":"El Señor está conmigo y me auxilia,","c":true},{"t":"v","x":"veré la derrota de mis adversarios.","c":true},{"t":"v","x":"Mejor es refugiarse en el Señor","c":false},{"t":"v","x":"que fiarse de los hombres,","c":true},{"t":"v","x":"mejor es refugiarse en el Señor","c":true},{"t":"v","x":"que fiarse de los jefes.","c":true}],"div":"I"},{"type":"Salmo","label":"Salmo 117","blocks":[{"t":"v","x":"Todos los pueblos me rodeaban,","c":false},{"t":"v","x":"en el nombre del Señor los rechacé;","c":true},{"t":"v","x":"me rodeaban cerrando el cerco,","c":true},{"t":"v","x":"en el nombre del Señor los rechacé;","c":true},{"t":"v","x":"me rodeaban como avispas,","c":true},{"t":"v","x":"ardiendo como fuego en las zarzas,","c":true},{"t":"v","x":"en el nombre del Señor los rechacé.","c":true},{"t":"v","x":"Empujaban y empujaban para derribarme,","c":false},{"t":"v","x":"pero el Señor me ayudó;","c":true},{"t":"v","x":"el Señor es mi fuerza y mi energía,","c":true},{"t":"v","x":"él es mi salvación.","c":true},{"t":"v","x":"Escuchad: hay cantos de victoria","c":false},{"t":"v","x":"en las tiendas de los justos:","c":true},{"t":"v","x":"«la diestra del Señor es poderosa,","c":true},{"t":"v","x":"la diestra del Señor es excelsa,","c":true},{"t":"v","x":"la diestra del Señor es poderosa».","c":true},{"t":"v","x":"No he de morir, viviré","c":false},{"t":"v","x":"para contar las hazañas del Señor.","c":true},{"t":"v","x":"Me castigó, me castigó el Señor,","c":true},{"t":"v","x":"pero no me entregó a la muerte.","c":true}],"div":"II"},{"type":"Salmo","label":"Salmo 117","blocks":[{"t":"v","x":"Abridme las puertas del triunfo,","c":false},{"t":"v","x":"y entraré para dar gracias al Señor.","c":true},{"t":"v","x":"Esta es la puerta del Señor:","c":false},{"t":"v","x":"los vencedores entrarán por ella.","c":true},{"t":"v","x":"Te doy gracias porque me escuchaste","c":false},{"t":"v","x":"y fuiste mi salvación.","c":true},{"t":"v","x":"La piedra que desecharon los arquitectos","c":false},{"t":"v","x":"es ahora la piedra angular.","c":true},{"t":"v","x":"Es el Señor quien lo ha hecho,","c":false},{"t":"v","x":"ha sido un milagro patente.","c":true},{"t":"v","x":"Este es el día en que actuó el Señor:","c":false},{"t":"v","x":"sea nuestra alegría y nuestro gozo.","c":true},{"t":"v","x":"Señor, danos la salvación;","c":true},{"t":"v","x":"Señor, danos prosperidad.","c":true},{"t":"v","x":"Bendito el que viene en nombre del Señor,","c":false},{"t":"v","x":"os bendecimos desde la casa del Señor;","c":true},{"t":"v","x":"el Señor es Dios, él nos ilumina.","c":true},{"t":"v","x":"Ordenad una procesión con ramos","c":false},{"t":"v","x":"hasta los ángulos del altar.","c":true},{"t":"v","x":"Tú eres mi Dios, te doy gracias;","c":false},{"t":"v","x":"Dios mío, yo te ensalzo.","c":true},{"t":"v","x":"Dad gracias al Señor porque es bueno,","c":false},{"t":"v","x":"porque es eterna su misericordia.","c":true}],"div":"III"}]}]}];</script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let cur=null, hourOnly=false;

function load(cid,hid,flash){
  const c=DATA.find(x=>x.id===cid); if(!c)return;
  cur=cid;
  $('#res').classList.remove('on'); $('#doc').classList.remove('hidden');
  if($('#doc').dataset.cid!==cid){ $('#doc').innerHTML=render(c); $('#doc').dataset.cid=cid; }
  $$('.feast').forEach(f=>f.classList.toggle('open',f.dataset.id===cid));
  $$('.hours button').forEach(b=>b.classList.toggle('cur',b.dataset.h===hid));
  localStorage.setItem('cmf-last',JSON.stringify({cid,hid}));
  applyOnly(hid);
  requestAnimationFrame(()=>{
    if(hid){const el=document.getElementById(hid);
      if(el){el.scrollIntoView({behavior:flash?'smooth':'auto',block:'start'});
        if(flash){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1700);} }
    } else window.scrollTo(0,0);
  });
  if(innerWidth<=820) closeNav();
}
function applyOnly(hid){
  $$('#doc .hour').forEach(h=>h.classList.toggle('hidden',hourOnly&&hid&&h.id!==hid));
  $('#doc .chead')?.classList.toggle('hidden',hourOnly&&!!hid);
  $('#doc .intro')?.classList.toggle('hidden',hourOnly&&!!hid);
}
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

function render(c){
  let h=`<div class="chead"><div class="dt">${esc(c.date)}</div>
    <h2>${esc(c.title)}</h2><div class="rk">${esc(c.rank)}</div></div>`;
  if(c.intro.length) h+=`<div class="intro">${c.intro.map(blk).join('')}</div>`;
  for(const hr of c.hours){
    h+=`<section class="hour${hr.sub?' sub':''}" id="${hr.id}"><h3>${esc(hr.name)}</h3>`;
    for(const p of hr.parts) h+=part(p);
    h+=`</section>`;
  }
  return h;
}
function part(p){
  const vk=p.type==='Himno'?'hymn':(p.type==='Salmo'||p.type==='Cántico')?'psalm':'';
  let h=`<div class="part ${vk}">`;
  if(p.label&&p.type!=='Rúbrica')
    h+=`<div class="plabel"><span>${esc(p.label)}</span>${p.cite?`<span class="cite">${esc(p.cite)}</span>`:''}</div>`;
  if(p.div) h+=`<div class="divnum">${esc(p.div)}</div>`;
  h+=p.blocks.map(blk).join('');
  return h+`</div>`;
}
function blk(b){
  const t=esc(b.x);
  switch(b.t){
    case 'v':  return `<div class="verse${b.s?' s':''}${b.c?' c':''}">${t}</div>`;
    case 'div':return `<div class="divnum">${t}</div>`;
    case 'a':  return `<div class="ant${/^(Benedictus|Magníficat)/.test(b.x)?' ev':''}">${t}</div>`;
    case 'vr': return `<div class="vr">${t}</div>`;
    case 'rr': return `<div class="rr">${t}</div>`;
    case 'r':  return `<div class="rub">${t}</div>`;
    case 'src':return `<div class="src"><span>${t}</span>${b.cite?`<span class="cite">${esc(b.cite)}</span>`:''}</div>`;
    case 'th': return `<div class="theme">${t}</div>`;
    default:   return `<p>${t}</p>`;
  }
}

/* ---------- nav ---------- */
function buildNav(){
  $('#nav').innerHTML=DATA.map(c=>`
   <div class="feast" data-id="${c.id}">
     <button class="head"><span class="caret">▶</span>
       <span class="nm">${esc(c.title)}<span class="dt">${esc(c.date)}</span></span></button>
     <div class="hours">${c.hours.map(h=>
        `<button data-c="${c.id}" data-h="${h.id}" class="${h.sub?'sub':''}">${esc(h.name)}
           <span class="cnt">${h.parts.length}</span></button>`).join('')}
     </div>
   </div>`).join('');
  $$('.feast .head').forEach(b=>b.onclick=()=>{
    const f=b.parentElement, id=f.dataset.id, was=f.classList.contains('open');
    $$('.feast').forEach(x=>x.classList.remove('open'));
    if(!was||cur!==id) f.classList.add('open');
    load(id,null,false);
  });
  $$('.hours button').forEach(b=>b.onclick=e=>{e.stopPropagation();load(b.dataset.c,b.dataset.h,true);});
}

/* ---------- search ---------- */
const IDX=[];
DATA.forEach(c=>{
  c.intro.forEach(b=>IDX.push({c:c.id,h:null,hn:'Presentación',p:'',x:b.x}));
  c.hours.forEach(h=>h.parts.forEach(p=>p.blocks.forEach(b=>
    IDX.push({c:c.id,h:h.id,hn:h.name,p:p.label||p.type,x:b.x}))));
});
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function search(q){
  const n=norm(q.trim()); const box=$('#res');
  if(n.length<2){box.classList.remove('on');$('#doc').classList.remove('hidden');return;}
  const hits=IDX.filter(r=>norm(r.x).includes(n)).slice(0,80);
  const title=DATA.reduce((m,c)=>(m[c.id]=c.title,m),{});
  box.innerHTML=`<h2>${hits.length} resultado${hits.length===1?'':'s'}</h2>`+
    (hits.length?hits.map(r=>{
      const i=norm(r.x).indexOf(n), a=Math.max(0,i-60), s=(a?'… ':'')+r.x.slice(a,i)+
        '<mark>'+r.x.slice(i,i+q.trim().length)+'</mark>'+r.x.slice(i+q.trim().length,i+q.trim().length+90)+'…';
      return `<button class="hit" data-c="${r.c}" data-h="${r.h||''}">
        <div class="where">${esc(title[r.c])} · ${esc(r.hn)}${r.p?' · '+esc(r.p):''}</div>
        <div class="txt">${s}</div></button>`;}).join('')
      :`<p class="rub">Sin coincidencias.</p>`);
  box.classList.add('on'); $('#doc').classList.add('hidden');
  $$('.hit').forEach(b=>b.onclick=()=>{$('#search').value='';load(b.dataset.c,b.dataset.h||null,true);});
  window.scrollTo(0,0);
}

/* ---------- chrome ---------- */
function openNav(){$('#nav').classList.add('open');$('#scrim').classList.add('on');}
function closeNav(){$('#nav').classList.remove('open');$('#scrim').classList.remove('on');}
let fs=+(localStorage.getItem('cmf-fs')||100);
function setFs(v){fs=Math.min(150,Math.max(80,v));document.documentElement.style.fontSize=fs+'%';
  localStorage.setItem('cmf-fs',fs);}
addEventListener('DOMContentLoaded',()=>{
  setFs(fs);
  const th=localStorage.getItem('cmf-theme')||
    (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=th;
  buildNav();
  $('#burger').onclick=()=>$('#nav').classList.contains('open')?closeNav():openNav();
  $('#scrim').onclick=closeNav;
  $('#big').onclick=()=>setFs(fs+10); $('#small').onclick=()=>setFs(fs-10);
  $('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=n;localStorage.setItem('cmf-theme',n);};
  $('#only').onclick=()=>{hourOnly=!hourOnly;$('#only').style.opacity=hourOnly?1:.55;
    const c=$$('.hours button.cur')[0];applyOnly(c?c.dataset.h:null);};
  $('#only').style.opacity=.55;
  let t;$('#search').oninput=e=>{clearTimeout(t);t=setTimeout(()=>search(e.target.value),140);};
  $('#search').onkeydown=e=>{if(e.key==='Escape'){e.target.value='';search('');}};
  let last={};try{last=JSON.parse(localStorage.getItem('cmf-last'))||{};}catch(e){}
  load(last.cid&&DATA.some(c=>c.id===last.cid)?last.cid:DATA[0].id,last.hid||null,false);
});
</script>
</body>
</html>
