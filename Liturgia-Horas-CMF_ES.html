jura contra el prójimo en falso.","c":true},{"t":"v","x":"Ese recibirá la bendición del Señor,","c":true},{"t":"v","x":"le hará justicia el Dios de salvación.","c":true},{"t":"v","x":"— Este es el grupo que busca al Señor,","c":false},{"t":"v","x":"que viene a tu presencia, Dios de Jacob.","c":true},{"t":"v","x":"¡Portones!, alzad los dinteles,","c":false},{"t":"v","x":"que se alcen las antiguas compuertas:","c":true},{"t":"v","x":"va a entrar el Rey de la gloria.","c":true},{"t":"v","x":"— ¿Quién es ese Rey de la gloria?","c":false},{"t":"v","x":"— El Señor, héroe valeroso;","c":true},{"t":"v","x":"el Señor, héroe de la guerra.","c":true},{"t":"v","x":"¡Portones!, alzad los dinteles,","c":false},{"t":"v","x":"que se alcen las antiguas compuertas:","c":true},{"t":"v","x":"va a entrar el Rey de la gloria.","c":true},{"t":"v","x":"— ¿Quién es ese Rey de la gloria?","c":false},{"t":"v","x":"— El Señor, Dios de los ejércitos.","c":true},{"t":"v","x":"Él es el Rey de la gloria.","c":true},{"t":"v","x":"Ant. María, de manos inocentes y puro corazón, ha","c":false},{"t":"v","x":"recibido la bendición del Señor.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Padre santo, que te muestras al hombre de manos inocentes y puro corazón, limpia de toda idolatría el corazón de tus fieles y enciende en ellos el fuego del amor que ardió incesantemente en el Corazón de María para estar en tu recinto sacro y recibir tu bendición. Por Jesucristo, nuestro Señor. Amén. Cuando se recita el salmo 94, se puede decir la siguiente: Señor, que eres un Dios grande, haz que escuchemos hoy tu voz y, fieles a tu ley, reconozcamos tus caminos y entremos en tu descanso. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"2. Alégrate, María, llena de gracia, el Señor está contigo."}]},{"type":"Salmo","label":"Salmo 45","blocks":[{"t":"v","x":"Dios es nuestro refugio y nuestra fuerza,","s":false},{"t":"v","x":"poderoso defensor en el peligro.","s":true},{"t":"v","x":"Por eso no tememos aunque tiemble la tierra","s":false},{"t":"v","x":"y los montes se desplomen en el mar.","s":true},{"t":"v","x":"Que hiervan y bramen sus olas,","s":false},{"t":"v","x":"que sacudan a los montes con su furia:","s":true},{"t":"v","x":"el Señor de los ejércitos está con nosotros,","s":false},{"t":"v","x":"nuestro alcázar es el Dios de Jacob.","s":true},{"t":"v","x":"El correr de las acequias alegra la ciudad de Dios,","s":false},{"t":"v","x":"el Altísimo consagra su morada.","s":true},{"t":"v","x":"Teniendo a Dios en medio, no vacila;","s":false},{"t":"v","x":"Dios la socorre al despuntar la aurora.","s":true},{"t":"v","x":"Los pueblos se amotinan, los reyes se rebelan;","s":false},{"t":"v","x":"pero él lanza su trueno y se tambalea la tierra.","s":true},{"t":"v","x":"El Señor de los ejércitos está con nosotros,","s":false},{"t":"v","x":"nuestro alcázar es el Dios de Jacob.","s":true},{"t":"v","x":"Venid a ver las obras del Señor,","s":false},{"t":"v","x":"las maravillas que hace en la tierra:","s":true},{"t":"v","x":"pone fin a la guerra hasta el extremo del orbe,","s":false},{"t":"v","x":"rompe los arcos, quiebra las lanzas,","s":true},{"t":"v","x":"prende fuego a los escudos.","s":true},{"t":"v","x":"«Rendíos, reconoced que yo soy Dios:","s":false},{"t":"v","x":"más alto que los pueblos, más alto que la tierra».","s":true},{"t":"v","x":"El Señor de los ejércitos está con nosotros,","s":false},{"t":"v","x":"nuestro alcázar es el Dios de Jacob.","s":true},{"t":"v","x":"Ant. Alégrate, María, llena de gracia, el Señor está","s":false},{"t":"v","x":"contigo.","s":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","s":false},{"t":"v","x":"con la siguiente oración:","s":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Oh, Dios, refugio y fortaleza nuestra, que quisiste que tu Hijo, por la fuerza del Espíritu Santo, se encarnase en el seno de María, haz que ella sea el cayado de nuestra confianza en el seguimiento de tu Hijo. Él, que vive y reina por los siglos de los siglos. Amén."},{"t":"a","x":"3. Con todas las generaciones te proclamamos bienaventurada, Virgen María."}]},{"type":"Salmo","label":"Salmo 86","blocks":[{"t":"v","x":"Él la ha cimentado sobre el monte santo;","c":false},{"t":"v","x":"y el Señor prefiere las puertas de Sion","c":true},{"t":"v","x":"a todas las moradas de Jacob.","c":true},{"t":"v","x":"¡Qué pregón tan glorioso para ti,","c":false},{"t":"v","x":"ciudad de Dios!","c":true},{"t":"v","x":"«Contaré a Egipto y a Babilonia","c":true},{"t":"v","x":"entre mis fieles;","c":true},{"t":"v","x":"filisteos, tirios y etíopes","c":true},{"t":"v","x":"han nacido allí».","c":true},{"t":"v","x":"Se dirá de Sion: «Uno por uno","c":false},{"t":"v","x":"todos han nacido en ella;","c":true},{"t":"v","x":"el Altísimo en persona la ha fundado».","c":true},{"t":"v","x":"El Señor escribirá en el registro de los pueblos:","c":false},{"t":"v","x":"«Este ha nacido allí».","c":true},{"t":"v","x":"Y cantarán mientras danzan:","c":true},{"t":"v","x":"«Todas mis fuentes están en ti».","c":true},{"t":"v","x":"Ant. Con todas las generaciones te proclamamos","c":false},{"t":"v","x":"bienaventurada, Virgen María.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Padre de todos los hombres, que quisiste que tu Hijo en la cruz nos diera a María por Madre; te pedimos que, entregándonos a ella para cooperar con su oficio maternal en la misión apostólica, crezca el número de tus hijos de toda raza y nación. Por Jesucristo, nuestro Señor. Amén."},{"t":"vr","x":"El Altísimo ha consagrado tu morada."},{"t":"rr","x":"Porque llevaste en tu seno al Creador del universo."}]},{"type":"Primera lectura","label":"Primera lectura","blocks":[{"t":"src","x":"Del Libro de los Proverbios.","cite":"8, 22-36"},{"t":"th","x":"María, trono de la sabiduría"},{"t":"p","x":"Así dice la Sabiduría de Dios: «El Señor me creó al principio de sus tareas, al comienzo de sus obras antiquísimas. En un tiempo remoto fui formada, antes de que la tierra existiera. Antes de los abismos fui engendrada, antes de los manantiales de las aguas. Aún no estaban aplomados los montes, antes de las montañas fui engendrada. No había hecho aún la tierra y la hierba, ni los primeros terrones del orbe. Cuando colocaba los cielos, allí estaba yo; cuando trazaba la bóveda sobre la faz del abismo; cuando sujetaba las nubes en la altura y fijaba las fuentes abismales; cuando ponía un límite al mar, cuyas aguas no traspasan su mandato; cuando asentaba los cimientos de la tierra, yo estaba junto a él, como arquitecto, y día tras día lo alegraba, todo el tiempo jugaba en su presencia: jugaba con la bola de la tierra, y mis delicias están con los hijos de los hombres."},{"t":"p","x":"Por tanto, hijos míos, escuchadme: dichosos los que siguen mis caminos; escuchad la instrucción, no rechacéis la sabiduría. Dichoso el hombre que me escucha, velando día a día en mi portal, guardando las jambas de mi puerta. Quien me encuentra, encuentra la vida y alcanza el favor del Señor. Quien me pierde, se arruina a sí mismo; los que me odian aman la muerte». Responsorio                                 Sof 3, 14. 15"},{"t":"vr","x":"Regocíjate, hija de Sion; grita de júbilo, Israel: alégrate y gózate de todo corazón, Jerusalén."},{"t":"rr","x":"Regocíjate, hija de Sion; grita de júbilo, Israel: alégrate y gózate de todo corazón, Jerusalén."},{"t":"vr","x":"El Señor será el rey de Israel, en medio de ti."},{"t":"rr","x":"Alégrate y gózate de todo corazón, Jerusalén."}]},{"type":"Segunda lectura","label":"Segunda lectura","blocks":[{"t":"src","x":"De las cartas de san Antonio María Claret, obispo y fundador. (Escritos espirituales, BAC, Madrid 1985, págs. 497-500 y 506)"},{"t":"th","x":"El Corazón de María, templo del Espíritu Santo"},{"t":"p","x":"Acabo de recibir vuestra estimadísima carta con que me pedís os diga alguna cosa para crecer cada día más y más en la devoción del Inmaculado Corazón de María. No me podíais pedir cosa más de mi gusto. Yo quisiera que todos los cristianos tuvieran hambre y sed de esta devoción. Amad, amigo mío, amad y amad muchísimo a María."},{"t":"p","x":"Es propio de Dios el dar las gracias a cada criatura según el fin a que la destina y como Dios destinó a María para ser madre, hija y esposa del mismo Dios, y madre del hombre, de aquí se infiere qué corazón le daría y con qué gracias la adornaría."},{"t":"p","x":"En el Corazón de María se han de considerar dos cosas: el corazón material y el corazón formal, que es el amor y voluntad."},{"t":"p","x":"El Corazón de María reúne estas propiedades y muchas otras más: el Corazón de María no solo fue miembro vivo de Jesucristo por la fe y la caridad, sino también origen, manantial de donde se tomó la humanidad; el Corazón de María fue templo del Espíritu Santo y más que templo, pues que de la preciosísima sangre salida de este Inmaculado Corazón formó el Espíritu Santo la humanidad santísima en las purísimas y virginales entrañas de María en el grande misterio de la encarnación; el Corazón de María"},{"t":"p","x":"ha sido el órgano de todas las virtudes en grado heroico y singularmente en la caridad para con Dios y para con los hombres; el Corazón de María es, en el día, un corazón vivo, animado y sublimado en lo más alto de la gloria; el Corazón de María es el trono en donde se dispensan todas las gracias y misericordias."},{"t":"p","x":"Por tanto, amigo mío, en María, después de Jesús, hemos de poner toda nuestra confianza y esperanza de nuestra eterna salvación. ¡Oh, dichoso el que invoca a María con confianza, que él alcanzará el perdón de sus pecados por muchos y por graves que sean, ¡alcanzará la gracia y finalmente la gloria del cielo!"}]},{"type":"Responsorio","label":"Responsorio","blocks":[{"t":"vr","x":"Dichosa eres, Virgen María, y digna de toda alabanza, porque por la fe y el amor formaste a Cristo en tu Corazón. Bendita tú entre las mujeres y bendito el fruto de tu vientre."},{"t":"rr","x":"Dichosa eres, Virgen María, y digna de toda alabanza, porque por la fe y el amor formaste a Cristo en tu Corazón. Bendita tú entre las mujeres y bendito el fruto de tu vientre."},{"t":"vr","x":"Dichosa eres, Virgen María, que llevaste al Hijo del eterno Padre."},{"t":"rr","x":"Bendita tú entre las mujeres y bendito el fruto de tu vientre."},{"t":"r","x":"O bien:"},{"t":"p","x":"Exhortación apostólica Marialis cultus del papa Pablo VI, sobre el culto a la Virgen María. (Núms. 17 y 18)"},{"t":"p","x":"María es la Virgen oyente y orante María es la Virgen oyente, que acoge con fe la palabra de Dios: fe que para ella fue premisa y camino hacia la Maternidad divina, porque, como intuyó san Agustín: «la bienaventurada Virgen María concibió creyendo al Jesús que dio a luz creyendo»: en efecto, cuando recibió del Ángel la respuesta a su duda «ella, llena de fe y concibiendo a Cristo en su mente antes que en su seno», dijo: «he aquí la esclava del Señor, hágase en mí según tu palabra»; fe, que fue para ella causa de bienaventuranza y seguridad en el cumplimiento de la palabra del Señor; fe, con la que ella, protagonista y testigo singular de la Encarnación, volvía sobre los acontecimientos de la infancia de Cristo, confrontándolos entre sí en lo hondo de su Corazón."},{"t":"p","x":"Esto mismo hace la Iglesia, la cual, sobre todo en la Sagrada Escritura, escucha con fe, acoge, proclama, venera la palabra de Dios, la distribuye a los fieles como pan de vida y escudriña a su luz los signos de los tiempos, interpreta y vive los acontecimientos de la historia."},{"t":"p","x":"María es, asimismo, la Virgen orante. Así aparece ella en la visita a la madre del Precursor, donde abre su espíritu en expresiones de glorificación a Dios, de humildad, de fe, de esperanza: tal es el Magníficat, la oración por excelencia de María, el canto de los tiempos mesiánicos."},{"t":"p","x":"Virgen orante aparece María en Caná, donde, manifestando al Hijo con delicada súplica una necesidad temporal, obtiene además un efecto de gracia: que Jesús, realizando el primero de sus signos, confirme a sus discípulos en la fe en él."},{"t":"p","x":"También el último trazo biográfico de María nos la describe en oración: los apóstoles «perseveraban"},{"t":"p","x":"unánimes en la oración, juntamente con las mujeres y con María, Madre de Jesús, y con sus hermanos»: presencia orante de María en la Iglesia naciente y en la Iglesia de todo tiempo, porque ella, asunta al cielo, no ha abandonado su misión de intercesión y salvación. Virgen orante es también la Iglesia, que cada día presenta al Padre las necesidades de sus hijos, «alaba incesantemente al Señor e intercede por la salvación del mundo». Responsorio                            Lc 1, 45-46; cf. Sal 65, 16"},{"t":"vr","x":"Dichosa tú, Virgen María, que has creído, porque lo que te ha dicho el Señor se cumplirá. María dijo: Proclama mi alma la grandeza del Señor."},{"t":"rr","x":"Dichosa tú, Virgen María, que has creído, porque lo que te ha dicho el Señor se cumplirá. María dijo: Proclama mi alma la grandeza del Señor."},{"t":"vr","x":"Venid a escuchar, y os contaré lo que Dios ha hecho conmigo."},{"t":"rr","x":"Proclama mi alma la grandeza del Señor."},{"t":"r","x":"Se dice el Himno Te Deum."},{"t":"r","x":"La oración, como en Laudes."}]}]},{"id":"corazon-laudes","name":"Laudes","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Virgen llena de gracia, madre de los vivientes,","s":true},{"t":"v","x":"bendita por los siglos más que todas las madres.","s":false},{"t":"v","x":"Cubierta por la sombra fecunda del Espíritu,","s":false},{"t":"v","x":"engendras en tu seno la luz que alumbra al mundo.","s":false},{"t":"v","x":"Tu Corazón escucha la Palabra de vida,","s":true},{"t":"v","x":"la conserva en las hondas moradas de la sangre","s":false},{"t":"v","x":"y la medita siempre con amor y ternura.","s":false},{"t":"v","x":"La fe te hizo dichosa Madre feliz del Verbo.","s":false},{"t":"v","x":"Pobre y humilde esclava del Señor de la gloria","s":true},{"t":"v","x":"abrasada en el fuego del manantial divino,","s":false},{"t":"v","x":"precedes a la Iglesia, peregrina hacia el Padre,","s":false},{"t":"v","x":"en fe y en la esperanza y en amor invencible.","s":false},{"t":"v","x":"Junto al árbol de la cruz redentora,","s":true},{"t":"v","x":"mientras el fruto santo de tu vientre agoniza","s":false},{"t":"v","x":"y aceptas el suplicio de la punzante espada","s":false},{"t":"v","x":"que atraviesa tu alma, tú nos tomas por hijos.","s":false},{"t":"v","x":"Formaste a los Apóstoles con tu oración asidua","s":true},{"t":"v","x":"para ser luz del mundo en medio de los hombres.","s":false},{"t":"v","x":"Fórmanos a tus hijos en la ardorosa fragua","s":false},{"t":"v","x":"de tu florido seno, colmado ya de gloria.","s":false},{"t":"v","x":"Hoy, con gozo radiante, tus hijos celebramos","s":true},{"t":"v","x":"el amor de Dios Padre, del Hijo y del Espíritu,","s":false},{"t":"v","x":"que llenaron de gloria tu Corazón sagrado","s":false},{"t":"v","x":"y lo llenan de gloria por siglos infinitos. Amén.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. Tu gracia vale más que la vida, te alabarán mis labios."}]},{"type":"Salmo","label":"Salmo 62, 2-9","blocks":[{"t":"v","x":"Oh, Dios, tú eres mi Dios, por ti madrugo,","c":false},{"t":"v","x":"mi alma está sedienta de ti;","c":true},{"t":"v","x":"mi carne tiene ansia de ti,","c":true},{"t":"v","x":"como tierra reseca, agostada, sin agua.","c":true},{"t":"v","x":"¡Cómo te contemplaba en el santuario","c":false},{"t":"v","x":"viendo tu fuerza y tu gloria!","c":true},{"t":"v","x":"Tu gracia vale más que la vida,","c":true},{"t":"v","x":"te alabarán mis labios.","c":true},{"t":"v","x":"Toda mi vida te bendeciré","c":false},{"t":"v","x":"y alzaré las manos invocándote.","c":true},{"t":"v","x":"Me saciaré como de enjundia y de manteca,","c":true},{"t":"v","x":"y mis labios te alabarán jubilosos.","c":true},{"t":"v","x":"En el lecho me acuerdo de ti","c":false},{"t":"v","x":"y velando medito en ti,","c":true},{"t":"v","x":"porque fuiste mi auxilio,","c":true},{"t":"v","x":"y a la sombra de tus alas canto con júbilo;","c":true},{"t":"v","x":"mi alma está unida a ti,","c":true},{"t":"v","x":"y tu diestra me sostiene.","c":true},{"t":"v","x":"Ant. Tu gracia vale más que la vida, te alabarán mis labios.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Nuestra alma tiene sed de ti, Señor, como tierra agostada y sin agua; haz que comprendamos que nuestros anhelos se han hecho realidad en María, tu humilde sierva, a la que has exaltado en el cielo junto a tu Hijo Jesucristo. Él, que vive y reina por los siglos de los siglos. Amén."},{"t":"a","x":"2. María, santa y humilde de corazón, bendice al Señor con todas las criaturas de la tierra."}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Criaturas todas del Señor, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Ángeles del Señor, bendecid al Señor;","s":false},{"t":"v","x":"cielos, bendecid al Señor.","s":true},{"t":"v","x":"Aguas del espacio, bendecid al Señor;","s":false},{"t":"v","x":"ejércitos del Señor, bendecid al Señor.","s":true},{"t":"v","x":"Sol y luna, bendecid al Señor;","s":false},{"t":"v","x":"astros del cielo, bendecid al Señor.","s":true},{"t":"v","x":"Lluvia y rocío, bendecid al Señor;","s":false},{"t":"v","x":"vientos todos, bendecid al Señor.","s":true},{"t":"v","x":"Fuego y calor, bendecid al Señor;","s":false},{"t":"v","x":"fríos y heladas, bendecid al Señor.","s":true},{"t":"v","x":"Rocíos y nevadas, bendecid al Señor;","s":false},{"t":"v","x":"témpanos y hielos, bendecid al Señor.","s":true},{"t":"v","x":"Escarchas y nieves, bendecid al Señor;","s":false},{"t":"v","x":"noche y día, bendecid al Señor.","s":true},{"t":"v","x":"Luz y tinieblas, bendecid al Señor;","s":false},{"t":"v","x":"rayos y nubes, bendecid al Señor.","s":true},{"t":"v","x":"Bendiga la tierra al Señor,","s":false},{"t":"v","x":"ensálcelo con himnos por los siglos.","s":true},{"t":"v","x":"Montes y cumbres, bendecid al Señor;","s":false},{"t":"v","x":"cuanto germina en la tierra, bendiga al Señor.","s":true},{"t":"v","x":"Manantiales, bendecid al Señor;","s":false},{"t":"v","x":"mares y ríos, bendecid al Señor.","s":true},{"t":"v","x":"Cetáceos y peces, bendecid al Señor;","s":false},{"t":"v","x":"aves del cielo, bendecid al Señor.","s":true},{"t":"v","x":"Fieras y ganados, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Hijos de los hombres, bendecid al Señor;","s":false},{"t":"v","x":"bendiga Israel al Señor.","s":true},{"t":"v","x":"Sacerdotes del Señor, bendecid al Señor;","s":false},{"t":"v","x":"siervos del Señor, bendecid al Señor.","s":true},{"t":"v","x":"Almas y espíritus justos, bendecid al Señor;","s":false},{"t":"v","x":"santos y humildes de corazón, bendecid al Señor.","s":true},{"t":"v","x":"Ananías, Azarías y Misael, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Bendigamos al Padre y al Hijo con el Espíritu Santo,","s":false},{"t":"v","x":"ensalcémoslo con himnos por los siglos.","s":true},{"t":"v","x":"Bendito el Señor en la bóveda del cielo,","s":false},{"t":"v","x":"alabado y glorioso y ensalzadlo, por los siglos.","s":true},{"t":"v","x":"Al final de este cántico no se dice Gloria al Padre.","s":false},{"t":"v","x":"Ant. María, santa y humilde de corazón, bendice al","s":false},{"t":"v","x":"Señor con todas las criaturas de la tierra.","s":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","s":false},{"t":"v","x":"con la siguiente oración:","s":false}],"cite":"Dn 3, 57-88. 56"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Te alabamos y bendecimos, Señor Dios nuestro, porque nos has colmado de vida y esperanza en tu Hijo Jesucristo; enséñanos, por intercesión de María, a verte a ti en todas las cosas y todas las cosas en ti, para cantar tu alabanza por los siglos de los siglos. Amén."},{"t":"a","x":"3. Cantemos hoy al Señor un cántico nuevo, porque el Señor ha adornado con la victoria a María, su humilde sierva."}]},{"type":"Salmo","label":"Salmo 149","blocks":[{"t":"v","x":"Cantad al Señor un cántico nuevo,","c":false},{"t":"v","x":"resuene su alabanza en la asamblea de los fieles;","c":true},{"t":"v","x":"que se alegre Israel por su Creador,","c":true},{"t":"v","x":"los hijos de Sion por su Rey.","c":true},{"t":"v","x":"Alabad su nombre con danzas,","c":false},{"t":"v","x":"cantadle con tambores y cítaras;","c":true},{"t":"v","x":"porque el Señor ama a su pueblo","c":true},{"t":"v","x":"y adorna con la victoria a los humildes.","c":true},{"t":"v","x":"Que los fieles festejen su gloria","c":false},{"t":"v","x":"y canten jubilosos en filas,","c":true},{"t":"v","x":"con vítores a Dios en la boca","c":true},{"t":"v","x":"y espadas de dos filos en las manos:","c":true},{"t":"v","x":"para tomar venganza de los pueblos","c":false},{"t":"v","x":"y aplicar el castigo a las naciones,","c":true},{"t":"v","x":"sujetando a los reyes con argollas,","c":true},{"t":"v","x":"a los nobles con esposas de hierro.","c":true},{"t":"v","x":"Ejecutar la sentencia dictada","c":false},{"t":"v","x":"es un honor para todos sus fieles.","c":true},{"t":"v","x":"Ant. Cantemos hoy al Señor un cántico nuevo, porque","c":false},{"t":"v","x":"el Señor ha adornado con la victoria a María, su","c":false},{"t":"v","x":"humilde sierva.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor Dios, creador y libertador nuestro, te damos gracias porque has adornado a María con un corazón sabio y dócil, nuevo y humilde, firme y dispuesto para soportar la espada de dolor y esperar, llena de fe, la resurrección de tu Hijo. Él, que vive y reina por los siglos de los siglos. Amén."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Por la fe, también Sara, cuando ya le había pasado la"},{"t":"p","x":"edad, obtuvo fuerza para fundar un linaje, porque juzgó digno de fe al que se lo prometía. Y así, de uno solo y, en este aspecto, ya extinguido, nacieron hijos numerosos como las estrellas del cielo y como la arena incontable de las playas."}],"cite":"Heb 11, 11-12"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"La Palabra de Cristo habite copiosamente en vosotros. Dichosos los que la cumplen."},{"t":"rr","x":"La Palabra de Cristo habite copiosamente en vosotros. Dichosos los que la cumplen."},{"t":"vr","x":"La Palabra de la fe que predicamos."},{"t":"rr","x":"Dichosos los que la cumplen."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"La Palabra de Cristo habite copiosamente en vosotros. Dichosos los que la cumplen."}]},{"type":"Cántico evangélico","label":"Benedictus, ant. Dichosa tú, Virgen María, que has","blocks":[{"t":"p","x":"creído; dichosos también los que escuchan la Palabra de Dios y la cumplen."}]},{"type":"Preces","label":"Preces","blocks":[{"t":"p","x":"Al celebrar con gozo esta festividad, elevemos por intercesión del Corazón de María nuestras súplicas al Padre para que en nuestra vida y ministerio seamos verdaderos hijos del Inmaculado Corazón de María, y digámosle:"},{"t":"p","x":"Escucha nuestra oración."},{"t":"p","x":"Tú, que otorgaste a María un corazón sin mancha, — purifícanos de toda culpa y haz que alejemos"},{"t":"p","x":"siempre de nosotros toda iniquidad. Tú, que por el Espíritu Santo consagraste a María para"},{"t":"p","x":"que fuese Madre de tu Hijo, — concédenos consagrar la vida entera a su servicio. Tú, que elegiste a María como Arca del Verbo, — haz que también nosotros conservemos y meditemos"},{"t":"p","x":"tu Palabra en el corazón. Tú, que quisiste que tu Hijo colgado en la cruz nos"},{"t":"p","x":"diera por Madre a María, — concédenos que, al anunciar tu Reino, nos"},{"t":"p","x":"manifestemos como verdaderos hijos suyos. Tú, que quisiste que María estuviera con los apóstoles"},{"t":"p","x":"el día de Pentecostés, — derrama sobre nosotros el Espíritu Santo y renuévanos"},{"t":"p","x":"para anunciar tu Reino a todos los pueblos."},{"t":"r","x":"Pueden añadirse intenciones particulares, que concluyen con la"},{"t":"p","x":"respuesta indicada más arriba."},{"t":"p","x":"Padre nuestro."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Señor, Dios nuestro, que elegiste a la siempre Virgen"},{"t":"p","x":"María para ser la Madre de tu Hijo y Madre nuestra, haz que, por la fiel entrega a su Corazón materno, nos configuremos más plenamente con Cristo y, urgidos por su caridad, nos dediquemos con mayor generosidad a proclamar el Evangelio a todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"corazon-hora-intermedia","name":"Hora intermedia","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"r","x":"Se dirán los salmos graduales de la salmodia complementaria. Los salmos 121 y 126, que se emplean ya en II Vísperas, pueden sustituirse por el salmo 128 y el salmo 130 respectivamente."}]}]},{"id":"corazon-tercia","name":"Tercia","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Salve, Madre virginal,","c":true},{"t":"v","x":"promesa, logro, fruición.","c":true},{"t":"v","x":"Eres plena floración","c":true},{"t":"v","x":"de una gracia maternal.","c":true},{"t":"v","x":"Eres toda corazón.","c":true},{"t":"v","x":"Esta es la Virgen oyente","c":true},{"t":"v","x":"hecha de silencio y fe.","c":true},{"t":"v","x":"Su amor en las sombras fue","c":true},{"t":"v","x":"centella para su mente,","c":true},{"t":"v","x":"linterna para su pie.","c":true},{"t":"v","x":"Esta es la Virgen orante,","c":true},{"t":"v","x":"grito de un mundo sin voz.","c":true},{"t":"v","x":"Su amor la hace portavoz","c":true},{"t":"v","x":"del dolor más lacerante,","c":true},{"t":"v","x":"de la mayor sed de Dios.","c":true},{"t":"v","x":"Esta es la Madre oferente","c":true},{"t":"v","x":"rica en generosidad.","c":true},{"t":"v","x":"Su amor hace intimidad","c":true},{"t":"v","x":"el clamor más exigente","c":true},{"t":"v","x":"y la entrega más audaz.","c":true},{"t":"v","x":"Gloria en silencio y a coro","c":true},{"t":"v","x":"al Padre, al Hijo, a la Unción.","c":true},{"t":"v","x":"Gloria al amor en acción.","c":true},{"t":"v","x":"Donde está nuestro tesoro","c":true},{"t":"v","x":"está nuestro corazón.","c":true},{"t":"v","x":"Ant. Todos oraban de corazón a Dios para que mirara","c":false},{"t":"v","x":"a su pueblo.","c":false}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Después de subir Jesús al cielo, los apóstoles se"},{"t":"p","x":"volvieron a Jerusalén, desde el monte que llaman de los Olivos, que dista de Jerusalén lo que se permite caminar en sábado. Llegados a casa subieron a la sala, donde se alojaban: Pedro, Juan, Santiago, Andrés, Felipe, Tomás, Bartolomé, Mateo, Santiago el de Alfeo, Simón el Celotes y Judas el de Santiago. Todos ellos se dedicaban a la oración en común, junto con algunas mujeres, entre ellas María, la Madre de Jesús, y con sus hermanos."},{"t":"vr","x":"María alaba al Señor sin cesar."},{"t":"rr","x":"Intercede por la salvación de todo el mundo."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Hch 1, 12-14"}],"sub":true},{"id":"corazon-sexta","name":"Sexta","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"r","x":"El himno, como en Tercia."},{"t":"a","x":"Visítanos, Señor, con tu salvación ahora y por siempre."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Que Cristo habite por la fe en vuestros corazones,"},{"t":"p","x":"que el amor sea vuestra raíz y vuestro cimiento; y así, con todos los santos, lograréis abarcar lo ancho, lo largo, lo alto y lo profundo, comprendiendo lo que"},{"t":"p","x":"trasciende toda filosofía: el amor cristiano. Así llegaréis a vuestra plenitud, según la plenitud total de Dios."},{"t":"vr","x":"Dichosa tú, Virgen María, que has creído."},{"t":"rr","x":"Porque lo que te ha dicho el Señor se cumplirá."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Ef 3, 17-19"}],"sub":true},{"id":"corazon-nona","name":"Nona","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"r","x":"El himno, como en Tercia."},{"t":"a","x":"María, Madre del amor hermoso, del temor, de la sabiduría y de la santa esperanza."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Hija, que el Dios altísimo te bendiga entre todas las"},{"t":"p","x":"mujeres de la tierra. Bendito el Señor, creador del cielo y tierra, que enderezó tu golpe contra la cabeza del general enemigo. Los que recuerden esta hazaña de Dios jamás perderán la confianza que tú inspiras."},{"t":"vr","x":"María ha recibido la bendición del Señor."},{"t":"rr","x":"Y la misericordia de Dios, su Salvador."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Jdt 13, 18-19"}],"sub":true},{"id":"corazon-ii-visperas","name":"II Vísperas","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Virgen María, la mujer en llamas:","s":true},{"t":"v" ":"v","x":"con su adversario en la plaza.","c":true},{"t":"v","x":"Ant. Bendita tú, oh, María, entre las mujeres y bendito el","c":false},{"t":"v","x":"fruto de tu vientre.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Oh, Dios, constructor de la casa y guardián de la ciudad, haz que imitemos a María en su cooperación a la obra salvadora de tu Hijo, y nos dediquemos con mayor generosidad a la misión apostólica de proclamar fielmente el Evangelio. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"3. El Señor eligió a María en la persona de Cristo, antes de la creación del mundo."}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Bendito sea Dios,","c":false},{"t":"v","x":"Padre de nuestro Señor Jesucristo,","c":true},{"t":"v","x":"que nos ha bendecido en la persona de Cristo","c":true},{"t":"v","x":"con toda clase de bienes espirituales y celestiales.","c":true},{"t":"v","x":"Él nos eligió en la persona de Cristo,","c":false},{"t":"v","x":"antes de crear el mundo,","c":true},{"t":"v","x":"para que fuésemos santos","c":true},{"t":"v","x":"e irreprochables ante él por el amor.","c":true},{"t":"v","x":"Él nos ha destinado en la persona de Cristo,","c":false},{"t":"v","x":"por pura iniciativa suya,","c":true},{"t":"v","x":"a ser sus hijos,","c":true},{"t":"v","x":"para que la gloria de su gracia,","c":true},{"t":"v","x":"que tan generosamente nos ha concedido","c":true},{"t":"v","x":"en su querido Hijo,","c":true},{"t":"v","x":"redunde en alabanza suya.","c":true},{"t":"v","x":"Por este Hijo, por su sangre,","c":false},{"t":"v","x":"hemos recibido la redención,","c":true},{"t":"v","x":"el perdón de los pecados.","c":true},{"t":"v","x":"El tesoro de su gracia, sabiduría y prudencia","c":true},{"t":"v","x":"ha sido un derroche para con nosotros,","c":true},{"t":"v","x":"dándonos a conocer el misterio de su voluntad.","c":true},{"t":"v","x":"Este es el plan","c":false},{"t":"v","x":"que había proyectado realizar por Cristo","c":true},{"t":"v","x":"cuando llegase el momento culminante:","c":true},{"t":"v","x":"recapitular en Cristo todas las cosas","c":true},{"t":"v","x":"del cielo y de la tierra.","c":true},{"t":"v","x":"Ant. El Señor eligió a María en la persona de Cristo,","c":false},{"t":"v","x":"antes de la creación del mundo.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}],"cite":"Ef 1, 3-10"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Bendito seas, Dios nuestro, porque, sin mérito alguno de nuestra parte, nos has elegido en la persona de Cristo antes de la creación del mundo; te suplicamos"},{"t":"p","x":"que envíes nuevos operarios a nuestra Congregación y nos confirmes en la vocación misionera para que anunciemos a todos los pueblos la buena nueva del Reino. Por Jesucristo, nuestro Señor. Amén."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"S i por Adán murieron todos, por Cristo todos volverán"},{"t":"p","x":"a la vida. Pero cada uno en su puesto: primero Cristo, como primicia; después, cuando él vuelva, todos los que son de Cristo."}],"cite":"1Cor 15, 22-23"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Enséñame a cumplir tu voluntad y guíame por tierra llana."},{"t":"rr","x":"Enséñame a cumplir tu voluntad y guíame por tierra llana."},{"t":"vr","x":"Porque tu voluntad es nuestra santificación."},{"t":"rr","x":"Y guíame por tierra llana."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Enséñame a cumplir tu voluntad y guíame por tierra llana."}]},{"type":"Cántico evangélico","label":"Magníficat, ant. ¡Alégrate, Virgen María! Tú llevaste en","blocks":[{"t":"p","x":"el seno a Cristo, el Salvador; de ti vino la salvación del mundo."},{"t":"r","x":"O bien:"},{"t":"p","x":"Se alegra mi espíritu en Dios, mi salvador; porque el Poderoso ha hecho obras grandes por mí. Las preces, como en las I Vísperas."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Señor, Dios nuestro, que elegiste a la siempre Virgen"},{"t":"p","x":"María para ser la Madre de tu Hijo y Madre nuestra, haz que, por la fiel entrega a su Corazón materno, nos configuremos más plenamente con Cristo y, urgidos por su caridad, nos dediquemos con mayor generosidad a proclamar el Evangelio a todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]}]},{"id":"carmelo","date":"16 de julio","title":"Bienaventurada Virgen María del Monte Carmelo","rank":"Fiesta · Aniversario de la fundación","intro":[{"t":"p","x":"Aniversario de la fundación de la Congregación"},{"t":"p","x":"Fiesta La Congregación de Misioneros Hijos del Inmaculado Corazón de la bienaventurada Virgen María fue fundada en Vic (Barcelona) el 16 de julio de 1849. Humildes fueron sus comienzos; sin embargo, según la mente del fundador, se emprendía una grande obra. «La fundación de la Congregación se atribuye a la intervención de la Santísima Virgen». En el día dedicado a la bienaventurada Virgen María del Monte Carmelo, el cuadro de la Madre del Amor Hermoso, que presidía la celda en que se congregaba el grupo para iniciar sus ejercicios espirituales, era como un augurio y una prenda segura de la maternal protección de María para con aquellos Misioneros que se llaman hijos suyos y le consagran sus planes de vida misionera."}],"hours":[{"id":"carmelo-invitatorio","name":"Invitatorio","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"a","x":"Venid, adoremos a Cristo, Hijo de María Virgen."},{"t":"r","x":"O bien:"},{"t":"p","x":"Aclamemos al Señor en esta fiesta de María Virgen."},{"t":"r","x":"El salmo invitatorio, como en el Ordinario."}]}]},{"id":"carmelo-oficio-de-lectura","name":"Oficio de lectura","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"¿Quién eres tú, mujer, que, aunque rendida","s":true},{"t":"v","x":"al parecer, al parecer postrada,","s":false},{"t":"v","x":"no estás sino en los cielos ensalzada,","s":false},{"t":"v","x":"no estás sino en la tierra preferida?","s":false},{"t":"v","x":"Pero, ¿qué mucho, si del sol vestida,","s":true},{"t":"v","x":"qué mucho, si de estrellas coronada,","s":false},{"t":"v","x":"vienes de tantas luces ilustrada,","s":false},{"t":"v","x":"vienes de tantos rayos guarnecida?","s":false},{"t":"v","x":"Cielo y tierra parece, que, a primores,","s":true},{"t":"v","x":"se compitieron con igual desvelo,","s":false},{"t":"v","x":"mezcladas sus estrellas y sus flores;","s":false},{"t":"v","x":"para que en ti tuviesen tierra y cielo,","s":true},{"t":"v","x":"con no sé qué lejanos resplandores","s":false},{"t":"v","x":"de flor del Sol plantada en el Carmelo.","s":false},{"t":"v","x":"Gloria al Padre, y al Hijo, y al Espíritu,","s":true},{"t":"v","x":"por los siglos de los siglos. Amén.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. María ha recibido la bendición del Señor. Por María hemos recibido la salvación de Dios. Cuando en el Invitatorio se ha dicho el salmo 23, aquí se dice el salmo 94."}]},{"type":"Salmo","label":"Salmo 23","blocks":[{"t":"v","x":"Del Señor es la tierra y cuanto la llena,","s":false},{"t":"v","x":"el orbe y todos sus habitantes:","s":true},{"t":"v","x":"él la fundó sobre los mares,","s":true},{"t":"v","x":"él la afianzó sobre los ríos.","s":true},{"t":"v","x":"— ¿Quién puede subir al monte del Señor?","s":false},{"t":"v","x":"¿Quién puede estar en el recinto sacro?","s":false},{"t":"v","x":"— El hombre de manos inocentes","s":false},{"t":"v","x":"y puro corazón,","s":false},{"t":"v","x":"que no confía en los ídolos","s":true},{"t":"v","x":"ni jura contra el prójimo en falso.","s":true},{"t":"v","x":"Ese recibirá la bendición del Señor,","s":true},{"t":"v","x":"le hará justicia el Dios de salvación.","s":true},{"t":"v","x":"— Este es el grupo que busca al Señor,","s":false},{"t":"v","x":"que viene a tu presencia, Dios de Jacob.","s":false},{"t":"v","x":"¡Portones!, alzad los dinteles,","s":false},{"t":"v","x":"que se alcen las antiguas compuertas:","s":true},{"t":"v","x":"va a entrar el Rey de la gloria.","s":true},{"t":"v","x":"— ¿Quién es ese Rey de la gloria?","s":false},{"t":"v","x":"— El Señor, héroe valeroso;","s":false},{"t":"v","x":"el Señor, héroe de la guerra.","s":false},{"t":"v","x":"¡Portones!, alzad los dinteles,","s":false},{"t":"v","x":"que se alcen las antiguas compuertas:","s":true},{"t":"v","x":"va a entrar el Rey de la gloria.","s":true},{"t":"v","x":"— ¿Quién es ese Rey de la gloria?","s":false},{"t":"v","x":"— El Señor, Dios de los ejércitos.","s":false},{"t":"v","x":"Él es el Rey de la gloria.","s":false},{"t":"v","x":"Ant. María ha recibido la bendición del Señor. Por","s":false},{"t":"v","x":"María hemos recibido la salvación de Dios.","s":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","s":false},{"t":"v","x":"con la siguiente oración:","s":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Padre santo, que te muestras al hombre de manos inocentes y puro corazón, concédenos que, movidos por la intercesión de la Virgen María, anunciemos al mundo tu misericordia y te amemos como ella te amó. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"2. Venid a ver las maravillas del Señor. Él ha hecho obras grandes por mí."}]},{"type":"Salmo","label":"Salmo 45","blocks":[{"t":"v","x":"Dios es nuestro refugio y nuestra fuerza,","s":false},{"t":"v","x":"poderoso defensor en el peligro.","s":true},{"t":"v","x":"Por eso no tememos aunque tiemble la tierra","s":false},{"t":"v","x":"y los montes se desplomen en el mar.","s":true},{"t":"v","x":"Que hiervan y bramen sus olas,","s":false},{"t":"v","x":"que sacudan a los montes con su furia:","s":true},{"t":"v","x":"el Señor de los ejércitos está con nosotros,","s":false},{"t":"v","x":"nuestro alcázar es el Dios de Jacob.","s":true},{"t":"v","x":"El correr de las acequias alegra la ciudad de Dios,","s":false},{"t":"v","x":"el Altísimo consagra su morada.","s":true},{"t":"v","x":"Teniendo a Dios en medio, no vacila;","s":false},{"t":"v","x":"Dios la socorre al despuntar la aurora.","s":true},{"t":"v","x":"Los pueblos se amotinan, los reyes se rebelan;","s":false},{"t":"v","x":"pero él lanza su trueno y se tambalea la tierra.","s":true},{"t":"v","x":"El Señor de los ejércitos está con nosotros,","s":false},{"t":"v","x":"nuestro alcázar es el Dios de Jacob.","s":true},{"t":"v","x":"Venid a ver las obras del Señor,","s":false},{"t":"v","x":"las maravillas que hace en la tierra:","s":true},{"t":"v","x":"pone fin a la guerra hasta el extremo del orbe,","s":false},{"t":"v","x":"rompe los arcos, quiebra las lanzas,","s":true},{"t":"v","x":"prende fuego a los escudos.","s":true},{"t":"v","x":"«Rendíos, reconoced que yo soy Dios:","s":false},{"t":"v","x":"más alto que los pueblos, más alto que la tierra».","s":true},{"t":"v","x":"El Señor de los ejércitos está con nosotros,","s":false},{"t":"v","x":"nuestro alcázar es el Dios de Jacob.","s":true},{"t":"v","x":"Ant. Venid a ver las maravillas del Señor. Él ha hecho","s":false},{"t":"v","x":"obras grandes por mí.","s":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","s":false},{"t":"v","x":"con la siguiente oración:","s":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Oh, Dios, que no cesas de obrar maravillas en favor de tu Iglesia y suscitaste a san Antonio María Claret para que fundase nuestra Congregación con una intervención particular de la Virgen María, concede a nuestro Instituto arraigo, vigor y firmeza, y da abundante fruto apostólico a sus trabajos. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"3. El Altísimo la ha fundado y todos han nacido en ella."}]},{"type":"Salmo","label":"Salmo 86","blocks":[{"t":"v","x":"Él la ha cimentado sobre el monte santo;","c":false},{"t":"v","x":"y el Señor prefiere las puertas de Sion","c":true},{"t":"v","x":"a todas las moradas de Jacob.","c":true},{"t":"v","x":"¡Qué pregón tan glorioso para ti,","c":false},{"t":"v","x":"ciudad de Dios!","c":true},{"t":"v","x":"«Contaré a Egipto y a Babilonia","c":true},{"t":"v","x":"entre mis fieles;","c":true},{"t":"v","x":"filisteos, tirios y etíopes","c":true},{"t":"v","x":"han nacido allí».","c":true},{"t":"v","x":"Se dirá de Sion: «Uno por uno","c":false},{"t":"v","x":"todos han nacido en ella;","c":true},{"t":"v","x":"el Altísimo en persona la ha fundado».","c":true},{"t":"v","x":"El Señor escribirá en el registro de los pueblos:","c":false},{"t":"v","x":"«Este ha nacido allí».","c":true},{"t":"v","x":"Y cantarán mientras danzan:","c":true},{"t":"v","x":"«Todas mis fuentes están en ti».","c":true},{"t":"v","x":"Ant. El Altísimo la ha fundado y todos han nacido en ella.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor, que amas a tu Iglesia, obra de tus manos, te damos gracias porque has inscrito en ella nuestros nombres. Ayúdanos a enriquecerla siendo fieles a la vocación que hemos recibido. Por Jesucristo, nuestro Señor. Amén."},{"t":"vr","x":"María conservaba todas estas cosas."},{"t":"rr","x":"Meditándolas en su corazón."}]},{"type":"Primera lectura","label":"Primera lectura","blocks":[{"t":"src","x":"Del Libro del Apocalipsis.","cite":"11, 19; 12, 1-17"},{"t":"th","x":"La figura portentosa de la mujer en el cielo"},{"t":"p","x":"Se abrió en el cielo el santuario de Dios y en su santuario apareció el arca de su alianza."},{"t":"p","x":"Después apareció una figura portentosa en el cielo: una mujer vestida del sol, la luna por pedestal, coronada con doce estrellas. Estaba encinta, y gritaba entre los espasmos del parto, y por el tormento de dar a luz. Apareció otra señal en el cielo: un enorme dragón rojo, con siete cabezas y diez cuernos, y siete diademas en las cabezas. Con la cola barrió del cielo un tercio de las estrellas, arrojándolas a la tierra. El dragón estaba enfrente de la mujer que iba a dar a luz, dispuesto a tragarse el niño en cuanto naciera. Dio a luz un varón, destinado a gobernar con vara de hierro a los pueblos. Arrebataron al niño y lo llevaron junto al"},{"t":"p","x":"trono de Dios. La mujer huyó al desierto, donde tiene un lugar reservado por Dios, para que allí la sustenten mil doscientos sesenta días."},{"t":"p","x":"Se trabó una batalla en el cielo: Miguel y sus ángeles declararon la guerra al dragón. Lucharon el dragón y sus ángeles, pero no vencieron, y no quedó lugar para ellos en el cielo. Y al gran dragón, a la serpiente primordial, que se llama diablo y Satanás, y extravía la tierra entera, lo precipitaron a la tierra, y a sus ángeles con él. Se oyó una gran voz en el cielo:"},{"t":"p","x":"«Ahora se estableció la salud y el poderío y el reinado de nuestro Dios y la potestad de su Cristo; porque fue precipitado el acusador de nuestros hermanos, el que los acusaba ante nuestro Dios día y noche. Ellos le vencieron en virtud de la sangre del Cordero y por la palabra del testimonio que dieron, y no amaron tanto su vida que temieran la muerte. Por esto, estad alegres, cielos, y los que moráis en sus tiendas. ¡Ay de la tierra y del mar! El diablo bajó contra vosotros rebosando furor, pues sabe que le queda poco tiempo»."},{"t":"p","x":"Cuando vio el dragón que lo habían arrojado a la tierra, se puso a perseguir a la mujer que había dado a luz al hijo varón. Le pusieron a la mujer dos alas de águila real para que volase a su lugar en el desierto, donde será sustentada un año y otro año y medio año, lejos de la serpiente. La serpiente persiguiendo a la mujer echó por la boca un río de agua para que el río la arrastrase; pero la tierra salió en ayuda de la mujer, abrió su boca y se bebió el río salido de la boca de la serpiente. Despechado el dragón por causa de la mujer, se marchó a hacer la guerra al resto de su descendencia, a los que guardan los mandamientos de Dios y mantienen el testimonio de Jesús."},{"t":"p","x":"Responsorio                                      Sal 105, 4. 5a. 10"},{"t":"vr","x":"Acuérdate de nosotros, Señor, y visítanos con tu salvación para que veamos la dicha de tus escogidos."},{"t":"rr","x":"Acuérdate de nosotros, Señor, y visítanos con tu salvación para que veamos la dicha de tus escogidos."},{"t":"vr","x":"Nos salvó de la mano del adversario y nos rescató del puño del enemigo."},{"t":"rr","x":"Para que veamos la dicha de tus escogidos."}]},{"type":"Segunda lectura","label":"Segunda lectura","blocks":[{"t":"src","x":"De los escritos de san Antonio María Claret, obispo y fundador. (Autobiografía y Escritos complementarios, Editorial Claretiana, Buenos Aires 2008, núms. 490 y 492-494)"},{"t":"th","x":"Tu vara y tu cayado me sosiegan"},{"t":"p","x":"El día 16 de julio de 1849, hallándonos ya reunidos, con aprobación del señor obispo y del señor rector, empezamos los santos ejercicios espirituales en el Seminario nosotros solos, con todo rigor y fervor. Como cabalmente en este día 16 es la fiesta de la Santa Cruz y de la Virgen del Carmen, por tema de la primera plática puse aquellas palabras del salmo 22, 4: «Tu vara y tu cayado me sosiegan». Aludiendo a la devoción y confianza que hemos de tener en la santa Cruz y en María Santísima; aplicando además todo el salmo a nuestro objeto. De aquellos ejercicios todos salimos muy fervorosos, resueltos y determinados a perseverar y, gracias sean dadas a Dios y a María Santísima, todos han perseverado muy bien. Dos han muerto y se hallan actualmente en la gloria del cielo gozando de Dios y del premio de sus trabajos apostólicos y rogando por sus hermanos."},{"t":"p","x":"¡Oh, Dios mío, bendito seáis por haberos dignado escoger vuestros humildes siervos para Hijos del Inmaculado Corazón de vuestra Madre!"},{"t":"p","x":"¡Oh, Madre benditísima, mil alabanzas os sean dadas por la fineza de vuestro Inmaculado Corazón y habernos tomado por Hijos vuestros! Haced, Madre mía, que correspondamos a tanta bondad, que cada día seamos más humildes, más fervorosos y más celosos de la salvación de las almas."},{"t":"p","x":"Yo me digo a mí mismo: Un Hijo del Inmaculado Corazón de María es un hombre que arde en caridad y que abrasa por donde pasa; que desea eficazmente y procura por todos los medios encender a todo el mundo en el fuego del divino amor. Nada le arredra; se goza en las privaciones, aborda los trabajos; abraza los sacrificios, se complace en las calumnias y se alegra en los tormentos. No piensa sino cómo seguirá e imitará a Jesucristo en trabajar, sufrir y en procurar siempre y únicamente la mayor gloria de Dios y la salvación de las almas."}]},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Mira desde el cielo, fíjate, ven a visitar tu viña, la que tu diestra plantó y que tú hiciste vigorosa."},{"t":"rr","x":"Mira desde el cielo, fíjate, ven a visitar tu viña, la que tu diestra plantó y que tú hiciste vigorosa."},{"t":"vr","x":"El Señor es el lote de mi heredad."},{"t":"rr","x":"La que tu diestra plantó y que tú hiciste vigorosa."},{"t":"r","x":"Se dice el himno Te Deum."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Sal 79, 15; Sal 15, 5"}]},{"id":"carmelo-laudes","name":"Laudes","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Madre bendita con tus pies descalzos,","s":true},{"t":"v","x":"con tu vestido de color de roca,","s":false},{"t":"v","x":"y con tu capa como espuma blanca:","s":false},{"t":"v","x":"Virgen del Carmen.","s":false},{"t":"v","x":"Tienes en brazos con tu hijo a todos.","s":true},{"t":"v","x":"Todos te buscan con afán de náufragos.","s":false},{"t":"v","x":"Todos te gritan con clamor de olas","s":false},{"t":"v","x":"«Madre de gracia».","s":false},{"t":"v","x":"Los que hoy nacimos como Misioneros","s":true},{"t":"v","x":"—frágil barquilla al mar del mundo echada—","s":false},{"t":"v","x":"a ti elevamos con los remos tensos","s":false},{"t":"v","x":"cantos de júbilo.","s":false},{"t":"v","x":"Da a nuestras quillas singladuras nuevas.","s":true},{"t":"v","x":"Pon cielos nuevos sobre nuestros mástiles","s":false},{"t":"v","x":"y ante el acoso de galernas turbias","s":false},{"t":"v","x":"sé nuestro puerto.","s":false},{"t":"v","x":"Honor al Padre y a Jesús por siempre:","s":true},{"t":"v","x":"ellos te hicieron nuestra hermana y Madre.","s":false},{"t":"v","x":"Gloria al Espíritu que consuma su obra,","s":false},{"t":"v","x":"gloria perenne.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. Dichosa eres, María, porque de ti vino la salvación del mundo; tú, que ahora vives ya en la gloria del Señor, intercede por nosotros ante tu Hijo."}]},{"type":"Salmo","label":"Salmo 62, 2-9","blocks":[{"t":"v","x":"Oh, Dios, tú eres mi Dios, por ti madrugo,","c":false},{"t":"v","x":"mi alma está sedienta de ti;","c":true},{"t":"v","x":"mi carne tiene ansia de ti,","c":true},{"t":"v","x":"como tierra reseca, agostada, sin agua.","c":true},{"t":"v","x":"¡Cómo te contemplaba en el santuario","c":false},{"t":"v","x":"viendo tu fuerza y tu gloria!","c":true},{"t":"v","x":"Tu gracia vale más que la vida,","c":true},{"t":"v","x":"te alabarán mis labios.","c":true},{"t":"v","x":"Toda mi vida te bendeciré","c":false},{"t":"v","x":"y alzaré las manos invocándote.","c":true},{"t":"v","x":"Me saciaré como de enjundia y de manteca,","c":true},{"t":"v","x":"y mis labios te alabarán jubilosos.","c":true},{"t":"v","x":"En el lecho me acuerdo de ti","c":false},{"t":"v","x":"y velando medito en ti,","c":true},{
