<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liturgia de las Horas CMF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Literata:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --garnet:#6b2233; --garnet-l:#8d3347; --gold:#b8894a; --gold-l:#d9b482;
  --ink:#2b2724; --muted:#7a716b; --rubric:#9c4a4a;
  --bg:#faf7f2; --panel:#fffdfa; --line:#e6ded2; --hl:#ffe9a8;
}
html[data-theme="dark"]{
  --garnet:#e0a9b8; --garnet-l:#f0c4d0; --gold:#d9b482; --gold-l:#f0d9b0;
  --ink:#e8e3dd; --muted:#a49a92; --rubric:#e09a9a;
  --bg:#17151a; --panel:#1f1d23; --line:#3a3540; --hl:#5c4a1e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Literata,Georgia,serif;background:var(--bg);color:var(--ink);
     line-height:1.62;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:40;background:var(--garnet);color:#fff;
     display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;
     border-bottom:2px solid var(--gold)}
html[data-theme="dark"] #top{background:#241017;color:var(--gold-l)}
#top h1{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;
        letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sub{font-size:.7rem;opacity:.75;display:block;font-family:Literata;font-weight:400}
.tbtn{padding:.3rem .5rem;border-radius:5px;font-size:.85rem;opacity:.9}
.tbtn:hover{background:rgba(255,255,255,.15);opacity:1}
#burger{display:none}
#search{flex:1;max-width:340px;margin-left:auto;padding:.35rem .7rem;border-radius:16px;
        border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);
        color:#fff;font-size:.85rem;font-family:inherit}
#search::placeholder{color:rgba(255,255,255,.65)}

/* ---------- layout ---------- */
#wrap{display:flex;align-items:flex-start}
#nav{width:290px;flex:none;position:sticky;top:46px;height:calc(100vh - 46px);
     overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:.6rem 0 3rem}
#main{flex:1;min-width:0;padding:1.6rem clamp(1rem,4vw,3rem) 6rem;max-width:44rem;margin:0 auto}

/* ---------- nav ---------- */
.feast{border-bottom:1px solid var(--line)}
.feast>.head{display:flex;width:100%;align-items:baseline;gap:.4rem;
             padding:.55rem .8rem;text-align:left}
.feast>.head:hover{background:rgba(184,137,74,.1)}
.feast.open>.head{background:rgba(184,137,74,.14)}
.feast .nm{font-family:'Cormorant Garamond',serif;font-size:1.06rem;font-weight:600;
           color:var(--garnet);line-height:1.25;flex:1}
.feast .dt{display:block;font-family:Literata;font-size:.68rem;font-weight:400;
           color:var(--muted);letter-spacing:.02em;margin-top:.1rem}
.caret{color:var(--gold);font-size:.7rem;transition:transform .18s;flex:none}
.feast.open .caret{transform:rotate(90deg)}
.hours{display:none;padding:0 0 .45rem}
.feast.open .hours{display:block}
.hours button{display:block;width:100%;text-align:left;padding:.26rem .8rem .26rem 1.7rem;
              font-size:.84rem;color:var(--muted);border-left:2px solid transparent}
.hours button:hover{color:var(--garnet);background:rgba(184,137,74,.08)}
.hours button.sub{padding-left:2.7rem;font-size:.8rem}
.hours button.sub::before{content:"·";margin-right:.45rem;color:var(--gold)}
.hours button.cur{color:var(--garnet);border-left-color:var(--gold);
                  background:rgba(184,137,74,.12);font-weight:600}
.hours .cnt{float:right;font-size:.68rem;opacity:.6;padding-left:.4rem}

/* ---------- celebration header ---------- */
.chead{text-align:center;margin-bottom:1.8rem;padding-bottom:1.2rem;
       border-bottom:1px solid var(--line)}
.chead .dt{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.chead h2{font-family:'Cormorant Garamond',serif;font-size:clamp(1.7rem,4.5vw,2.3rem);
          font-weight:600;color:var(--garnet);line-height:1.15;margin:.35rem 0}
.chead .rk{font-size:.8rem;font-style:italic;color:var(--muted)}
.intro{font-size:.92rem;color:var(--muted);text-align:justify;hyphens:auto;
       margin:1.4rem 0 2rem;padding:0 .2rem}
.intro p{margin-bottom:.6rem;text-indent:1.2em}
.intro p:first-child{text-indent:0}

/* ---------- hour ---------- */
.hour{margin:2.6rem 0 0;scroll-margin-top:60px}
.hour>h3{font-family:'Cormorant Garamond',serif;font-size:1.65rem;font-weight:600;
         color:var(--garnet);text-align:center;letter-spacing:.03em;
         padding-bottom:.35rem;margin-bottom:1.3rem;position:relative}
.hour>h3::after{content:"";display:block;width:4.5rem;height:2px;background:var(--gold);
                margin:.45rem auto 0;opacity:.7}
.hour.sub{margin-top:1.6rem}
.hour.sub>h3{font-size:1.2rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
.hour.sub>h3::after{width:2.2rem}
.hour.flash>h3{animation:fl 1.6s ease-out}
@keyframes fl{0%,40%{background:var(--hl)}100%{background:transparent}}

/* ---------- parts ---------- */
.part{margin:1.5rem 0}
.plabel{font-family:Literata;font-size:.7rem;font-weight:600;letter-spacing:.16em;
        text-transform:uppercase;color:var(--gold);
        border-top:1px solid var(--line);padding-top:.5rem;margin-bottom:.7rem;
        display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.plabel .cite{font-weight:400;letter-spacing:.02em;text-transform:none;
              font-style:italic;color:var(--muted);font-size:.78rem;white-space:nowrap}
.divnum{text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.1rem;
        color:var(--gold);letter-spacing:.2em;margin:.9rem 0 .5rem}

/* antiphon */
.ant{border-left:3px solid var(--gold);background:rgba(184,137,74,.07);
     padding:.5rem .8rem;margin:.8rem 0;font-style:italic;border-radius:0 3px 3px 0}
.ant::before{content:"Ant.";font-style:normal;font-weight:600;font-size:.7rem;
             letter-spacing:.1em;color:var(--gold);margin-right:.5em;
             text-transform:uppercase;vertical-align:.08em}
.ant.ev::before{content:none}

/* verse: hymn & psalm */
.verse{margin:.15rem 0}
.hymn .verse{font-style:italic;padding-left:1.4rem;text-indent:-1.4rem}
.hymn .verse.s{margin-top:.85rem}
.hymn .verse.s:first-child{margin-top:0}
.psalm .verse{padding-left:1.6rem;text-indent:-1.6rem}
.psalm .verse.c{padding-left:2.8rem}
.psalm .verse:not(.c){margin-top:.5rem}
.psalm .verse:first-child{margin-top:0}

/* readings */
.src{font-size:.86rem;font-style:italic;color:var(--muted);
     display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.src .cite{font-style:normal;white-space:nowrap}
.theme{font-family:'Cormorant Garamond',serif;font-size:1.18rem;font-weight:600;
       text-align:center;color:var(--garnet);margin:.7rem 0 .9rem;line-height:1.3}
.part p{text-align:justify;hyphens:auto;margin-bottom:.35rem;text-indent:1.2em}
.part p.first,.part>p:first-of-type{text-indent:0}

/* versicle / response */
.vr,.rr{padding-left:1.7rem;text-indent:-1.7rem;margin:.28rem 0}
.vr::before{content:"℣.";color:var(--gold);font-weight:700;margin-right:.5em}
.rr::before{content:"℟.";color:var(--gold);font-weight:700;margin-right:.5em}

/* rubric */
.rub{color:var(--rubric);font-style:italic;font-size:.87rem;margin:.7rem 0;
     text-align:justify}

/* search results */
#res{display:none}
#res.on{display:block}
#res h2{font-family:'Cormorant Garamond',serif;color:var(--garnet);font-size:1.5rem;
        margin-bottom:1rem}
.hit{display:block;width:100%;text-align:left;padding:.7rem .8rem;margin-bottom:.5rem;
     border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.hit:hover{border-color:var(--gold)}
.hit .where{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);
            margin-bottom:.25rem}
.hit .txt{font-size:.9rem;color:var(--ink)}
.hit mark,mark{background:var(--hl);color:inherit;padding:0 .1em;border-radius:2px}

/* misc */
#crumb{position:sticky;top:46px;z-index:30;background:var(--bg);
       border-bottom:1px solid var(--line);padding:.35rem 0;margin:-1.6rem 0 1.2rem;
       font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
       display:none}
.hidden{display:none !important}
#scrim{display:none}

@media(max-width:820px){
  #burger{display:block}
  #nav{position:fixed;left:0;top:46px;z-index:50;transform:translateX(-100%);
       transition:transform .22s;box-shadow:2px 0 14px rgba(0,0,0,.2);width:82vw;max-width:310px}
  #nav.open{transform:none}
  #scrim.on{display:block;position:fixed;inset:46px 0 0;background:rgba(0,0,0,.45);z-index:45}
  #main{padding:1.2rem 1.1rem 5rem}
  #search{max-width:none}
  #top h1{font-size:1.02rem}
}
@media print{
  #top,#nav,#crumb,#scrim{display:none}
  body{background:#fff;color:#000;font-size:11pt}
  #main{max-width:none;padding:0}
  .hour{page-break-inside:avoid}
}
</style>
</head>
<body>
<header id="top">
  <button id="burger" class="tbtn" aria-label="Menú">☰</button>
  <h1>Liturgia de las Horas<span class="sub">Misioneros Claretianos · Propio 2025</span></h1>
  <input id="search" type="search" placeholder="Buscar en todo el propio…" autocomplete="off">

</header>
<div id="scrim"></div>
<div id="wrap">
  <nav id="nav"></nav>
  <main id="main">
    <div id="res"></div>
    <article id="doc"></article>
  </main>
</div>
<script>const DATA=[{"id":"martires","date":"1 de febrero","title":"Beatos mártires claretianos","rank":"Memoria","intro":[{"t":"p","x":"En el contexto de la persecución religiosa desatada durante la guerra civil española (1936-1939) murieron martirizados, en lugares y fechas diversas, numerosos Misioneros Hijos del Inmaculado Corazón de la bienaventurada Virgen María. Sin plegarse a las insinuaciones de sus perseguidores, que los instaban a renegar de su fe, entregaron la vida con generosidad, animándose mutuamente; dando gracias al Señor que los había llamado; alabando a María, a cuyo Corazón se encomendaban; ofreciendo su sacrificio por el fruto de la Congregación, de la que se sabían hijos, y perdonando a sus verdugos. Eran misioneros sacerdotes, hermanos y estudiantes. El más joven tenía solamente 16 años de edad. El primer grupo en ser beatificado (25 de octubre de 1992) fue el de los 51 mártires de Barbastro, cuyo testimonio ha marcado la espiritualidad claretiana. A su vez, dicha espiritualidad hunde sus raíces en el deseo del propio P. Fundador, san Antonio María Claret, quien de muchos modos manifestó su disposición al martirio, sufriendo con fe y entereza persecución, calumnias, atentados y todo tipo de violencias. A los beatos mártires de Barbastro les han seguido otros, como los 23 de Sigüenza, Fernán Caballero y Tarragona (13 de octubre de 2013) o los 109 de Solsona, Cervera, Barcelona, Sabadell, Lérida, Vic, Santander y Valencia (21 de octubre de 2017)."},{"t":"p","x":"A estos hay que añadir el misionero mártir Andrés Solá (20 de noviembre de 2005), asesinado en México el 25 de abril de 1927 junto con un compañero sacerdote y un laico, durante la persecución abierta por el gobierno mexicano del momento."}],"hours":[{"id":"martires-invitatorio","name":"Invitatorio","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"a","x":"Venid, adoremos al Señor, rey de los mártires."},{"t":"r","x":"El salmo invitatorio, como en el Ordinario."}]}]},{"id":"martires-oficio-de-lectura","name":"Oficio de lectura","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Testigos de la fe y del Evangelio,","s":true},{"t":"v","x":"mártires claretianos,","s":true},{"t":"v","x":"gloria de la Congregación y de la Iglesia,","s":true},{"t":"v","x":"anuncio del Señor resucitado,","s":true},{"t":"v","x":"profetas del amor y la esperanza,","s":true},{"t":"v","x":"mártires claretianos.","s":true},{"t":"v","x":"Amigos del Señor hasta la muerte,","s":true},{"t":"v","x":"vivís con alegría sin ocaso.","s":false},{"t":"v","x":"La sangre martirial de vuestra ofrenda","s":false},{"t":"v","x":"refulge coronando el holocausto.","s":false},{"t":"v","x":"Fue trigo vuestro cuerpo, pan ahora,","s":true},{"t":"v","x":"cocido en el rescoldo de la entrega.","s":false},{"t":"v","x":"La sangre derramada corre viva","s":false},{"t":"v","x":"por la Congregación y por la Iglesia.","s":false},{"t":"v","x":"De amor y de perdón sois profecía","s":true},{"t":"v","x":"y sois testigos claros de esperanza.","s":false},{"t":"v","x":"Poned perdón y amor en nuestras vidas","s":false},{"t":"v","x":"y el gozo de anunciar más alborada.","s":false},{"t":"v","x":"Cantando a Cristo Rey ganáis la altura,","s":true},{"t":"v","x":"nostalgia nos dejáis en vuestro vuelo.","s":false},{"t":"v","x":"María es vuestra Madre y vuestra Reina:","s":false},{"t":"v","x":"su limpio Corazón es vuestro cielo. Amén.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. Los santos mártires derramaron su sangre por Cristo: por ello han conseguido el premio eterno."}]},{"type":"Salmo","label":"Salmo 2","blocks":[{"t":"v","x":"¿Por qué se amotinan las naciones,","c":false},{"t":"v","x":"y los pueblos planean un fracaso?","c":true},{"t":"v","x":"Se alían los reyes de la tierra,","c":false},{"t":"v","x":"los príncipes conspiran","c":true},{"t":"v","x":"contra el Señor y contra su Mesías:","c":true},{"t":"v","x":"«Rompamos sus coyundas,","c":true},{"t":"v","x":"sacudamos su yugo».","c":true},{"t":"v","x":"El que habita en el cielo sonríe,","c":false},{"t":"v","x":"el Señor se burla de ellos.","c":true},{"t":"v","x":"Luego les habla con ira,","c":true},{"t":"v","x":"los espanta con su cólera:","c":true},{"t":"v","x":"«Yo mismo he establecido a mi rey","c":true},{"t":"v","x":"en Sion, mi monte santo».","c":true},{"t":"v","x":"Voy a proclamar el decreto del Señor;","c":false},{"t":"v","x":"él me ha dicho:","c":true},{"t":"v","x":"«Tú eres mi Hijo: yo te he engendrado hoy.","c":true},{"t":"v","x":"Pídemelo: te daré en herencia las naciones,","c":true},{"t":"v","x":"en posesión, los confines de la tierra:","c":true},{"t":"v","x":"los gobernarás con cetro de hierro,","c":true},{"t":"v","x":"los quebrarás como jarro de loza».","c":true},{"t":"v","x":"Y ahora, reyes, sed sensatos;","c":false},{"t":"v","x":"escarmentad, los que regís la tierra:","c":true},{"t":"v","x":"servid al Señor con temor,","c":true},{"t":"v","x":"rendidle homenaje temblando;","c":true},{"t":"v","x":"no sea que se irrite, y vayáis a la ruina,","c":true},{"t":"v","x":"porque se inflama de pronto su ira.","c":true},{"t":"v","x":"¡Dichosos los que se refugian en él!","c":true},{"t":"v","x":"Ant. Los santos mártires derramaron su sangre por","c":false},{"t":"v","x":"Cristo: por ello han conseguido el premio eterno.","c":false},{"t":"v","x":"Ant. 2. Los justos viven eternamente, reciben de Dios","c":false},{"t":"v","x":"su recompensa.","c":false}]},{"type":"Salmo","label":"Salmo 32","blocks":[{"t":"v","x":"Aclamad, justos, al Señor,","c":false},{"t":"v","x":"que merece la alabanza de los buenos.","c":true},{"t":"v","x":"Dad gracias al Señor con la cítara,","c":false},{"t":"v","x":"tocad en su honor el arpa de diez cuerdas;","c":true},{"t":"v","x":"cantadle un cántico nuevo,","c":true},{"t":"v","x":"acompañando los vítores con bordones:","c":true},{"t":"v","x":"que la palabra del Señor es sincera,","c":false},{"t":"v","x":"y todas sus acciones son leales;","c":true},{"t":"v","x":"él ama la justicia y el derecho,","c":true},{"t":"v","x":"y su misericordia llena la tierra.","c":true},{"t":"v","x":"La palabra del Señor hizo el cielo;","c":false},{"t":"v","x":"el aliento de su boca, sus ejércitos;","c":true},{"t":"v","x":"encierra en un odre las aguas marinas,","c":true},{"t":"v","x":"mete en un depósito el océano.","c":true},{"t":"v","x":"Tema al Señor la tierra entera,","c":false},{"t":"v","x":"tiemblen ante él los habitantes del orbe:","c":true},{"t":"v","x":"porque él lo dijo y existió,","c":true},{"t":"v","x":"él lo mandó y surgió.","c":true},{"t":"v","x":"El Señor deshace los planes de las naciones,","c":false},{"t":"v","x":"frustra los proyectos de los pueblos;","c":true},{"t":"v","x":"pero el plan del Señor subsiste por siempre,","c":true},{"t":"v","x":"los proyectos de su corazón, de edad en edad.","c":true},{"t":"v","x":"Ant. Los justos viven eternamente, reciben de Dios su","c":false},{"t":"v","x":"recompensa.","c":false},{"t":"v","x":"Ant. 3. A vosotros, mis santos, que habéis luchado en este","c":false},{"t":"v","x":"mundo, yo os daré la recompensa de vuestro esfuerzo.","c":false}],"div":"I"},{"type":"Salmo","label":"Salmo 32","blocks":[{"t":"v","x":"Dichosa la nación cuyo Dios es el Señor,","c":false},{"t":"v","x":"el pueblo que él se escogió como heredad.","c":true},{"t":"v","x":"El Señor mira desde el cielo,","c":false},{"t":"v","x":"se fija en todos los hombres;","c":true},{"t":"v","x":"desde su morada observa","c":true},{"t":"v","x":"a todos los habitantes de la tierra:","c":true},{"t":"v","x":"él modeló cada corazón,","c":true},{"t":"v","x":"y comprende todas sus acciones.","c":true},{"t":"v","x":"No vence el rey por su gran ejército,","c":false},{"t":"v","x":"no escapa el soldado por su mucha fuerza,","c":true},{"t":"v","x":"nada valen sus caballos para la victoria,","c":true},{"t":"v","x":"ni por su gran ejército se salva.","c":true},{"t":"v","x":"Los ojos del Señor están puestos en sus fieles,","c":false},{"t":"v","x":"en los que esperan en su misericordia,","c":true},{"t":"v","x":"para librar sus vidas de la muerte","c":true},{"t":"v","x":"y reanimarlos en tiempo de hambre.","c":true},{"t":"v","x":"Nosotros aguardamos al Señor:","c":false},{"t":"v","x":"él es nuestro auxilio y escudo;","c":true},{"t":"v","x":"con él se alegra nuestro corazón,","c":true},{"t":"v","x":"en su santo nombre confiamos.","c":true},{"t":"v","x":"Que tu misericordia, Señor, venga sobre nosotros,","c":false},{"t":"v","x":"como lo esperamos de ti.","c":true},{"t":"v","x":"Ant. A vosotros, mis santos, que habéis luchado en este","c":false},{"t":"v","x":"mundo, yo os daré la recompensa de vuestro esfuerzo.","c":false},{"t":"v","x":"℣. Nosotros aguardamos al Señor.","c":false},{"t":"v","x":"℟. Él es nuestro auxilio y escudo.","c":false}],"div":"II"},{"type":"Primera lectura","label":"Primera lectura","blocks":[{"t":"src","x":"De la carta del apóstol san Pablo a los Romanos.","cite":"8, 18-39"},{"t":"th","x":"Nada puede apartarnos del amor de Dios manifestado en Cristo Jesús"},{"t":"p","x":"Hermanos: sostengo que los sufrimientos de ahora no pesan lo que la gloria que un día se nos descubrirá. Porque la creación, expectante, está aguardando la plena manifestación de los hijos de Dios; ella fue sometida a la frustración, no por su voluntad, sino por uno que la sometió: pero fue con la esperanza de que la creación misma se vería liberada de la esclavitud de la corrupción, para entrar en la libertad gloriosa de los hijos de Dios."},{"t":"p","x":"Porque sabemos que hasta hoy la creación entera está gimiendo toda ella con dolores de parto. Y no solo eso; también nosotros, que poseemos las primicias del Espíritu, gemimos en nuestro interior, aguardando la hora de ser hijos de Dios, la redención de nuestro cuerpo. Porque en esperanza fuimos salvados. Y una esperanza que se ve ya no es esperanza. ¿Cómo seguirá esperando uno aquello que ve? Cuando esperamos lo que no vemos, aguardamos con perseverancia."},{"t":"p","x":"Pero además el Espíritu viene en ayuda de nuestra debilidad, porque nosotros no sabemos pedir lo que nos conviene, pero el Espíritu mismo intercede por nosotros con gemidos inefables. Y el que escudriña los corazones sabe cuál es el deseo del Espíritu, y que su intercesión por los santos es según Dios."},{"t":"p","x":"Sabemos también que a los que aman a Dios todo les sirve para el bien: a los que ha llamado conforme a su designio. A los que había escogido, Dios los predestinó a"},{"t":"p","x":"ser imagen de su Hijo, para que él fuera el primogénito de muchos hermanos. A los que predestinó, los llamó; a los que llamó, los justificó; a los que justificó, los glorificó."},{"t":"p","x":"¿Cabe decir más? Si Dios está con nosotros, ¿quién estará contra nosotros? El que no perdonó a su propio Hijo, sino que lo entregó por todos nosotros, ¿cómo no nos dará todo con él? ¿Quién acusará a los elegidos de Dios? ¿Dios, el que justifica? ¿Quién condenará? ¿Será acaso Cristo, que murió, más aún, resucitó y está a la derecha de Dios, y que intercede por nosotros?"},{"t":"p","x":"¿Quién podrá apartarnos del amor de Cristo?: ¿la aflicción?, ¿la angustia?, ¿la persecución?, ¿el hambre?, ¿la desnudez?, ¿el peligro?, ¿la espada?, como dice la Escritura: «Por tu causa nos degüellan cada día, nos tratan como a ovejas de matanza»."},{"t":"p","x":"Pero en todo esto vencemos fácilmente por aquel que nos ha amado. Pues estoy convencido de que ni muerte, ni vida, ni ángeles, ni principados, ni presente, ni futuro, ni potencias, ni altura, ni profundidad, ni criatura alguna podrá apartarnos del amor de Dios manifestado en Cristo Jesús, Señor nuestro."},{"t":"vr","x":"Amad a vuestros enemigos y rezad por los que os persiguen. Así seréis hijos de vuestro Padre que está en el cielo."},{"t":"rr","x":"Amad a vuestros enemigos y rezad por los que os persiguen. Así seréis hijos de vuestro Padre que está en el cielo."},{"t":"vr","x":"Sed perfectos como vuestro Padre celestial es perfecto."},{"t":"rr","x":"Así seréis hijos de vuestro Padre que está en el cielo."}]},{"type":"Segunda lectura","label":"Segunda lectura","blocks":[{"t":"src","x":"De la Autobiografía de san Antonio María Claret, obispo y fundador. (Cap. XXVIII, núms. 414-415 y 421-424)"},{"t":"th","x":"La mortificación"},{"t":"p","x":"Conocí que en un solo acto de mortificación se pueden ejercitar muchas virtudes, según los diferentes fines que cada uno se propone en cada acto; v. g.: el que mortifica su cuerpo con el fin de refrenar la concupiscencia hace un acto de la virtud de la templanza. Si lo hace con el fin de ordenar bien la vida, será un acto de la virtud de la prudencia. Si lo hace con el fin de satisfacer por las faltas de la vida pasada, será un acto de justicia. Si lo hace para vencer las dificultades de la vida espiritual, será un acto de fortaleza. Si lo hace con el fin de ofrecer un sacrificio a Dios privándose de lo que le gusta y practicando lo que le amarga y repugna, será un acto de la virtud de la religión. Si lo hace con el fin de recibir mayor luz para conocer los divinos atributos, será un acto de fe. Si lo hace con el fin de asegurar más su salvación, será un acto de esperanza. Si lo hace con el fin de ayudar a la conversión de los pecadores y en sufragio de las almas del purgatorio, será un acto de caridad para con el prójimo. Si lo hace con el fin de tener más con que socorrer a los pobres, será un acto de misericordia. Si lo hace con el fin de agradar más y más a Dios, será un acto de amor de Dios. En cada acto de mortificación podré ejercitar todas estas diez virtudes, según los fines que me proponga."},{"t":"p","x":"Yo conozco que trescientos años de fieles servicios a Dios se pagan, y de sobra, con una hora que me permita de penas; tan grande es el valor de ella. ¡Oh,"},{"t":"p","x":"Jesús mío y Maestro mío! El atribulado perseguido y desamparado de amigos; el crucificado de trabajos exteriores y de cruces interiores y desamparado de consuelos espirituales, que calla, que sufre y persevera con amor, este es vuestro amado y el que os agrada y a quien más estimáis. Así es que me he propuesto nunca jamás sincerarme, ni excusarme, ni defenderme cuando me censuren, calumnien y persigan, porque perdería delante de Dios y de los hombres. Sí, estos se valdrían de mis verdades y razones, que yo alegaría, como de armas contra mí. Creo que todo viene de Dios y creo que Dios quiere de mí este obsequio: que sufra con paciencia y por su amor las penas del cuerpo, del alma y del honor. Creo que con esto haré lo que es de mayor gloria de Dios: el que yo calle y sufra como Jesús, que murió en la cruz desamparado del todo. El hacer y el sufrir son las grandes pruebas del amor. Responsorio                                  Mt 5, 10-12"},{"t":"vr","x":"Bienaventurados los perseguidos por causa de la justicia, porque de ellos es el reino de los cielos. Bienaventurados vosotros cuando os insulten y os persigan y os calumnien de cualquier modo por mi causa."},{"t":"rr","x":"Bienaventurados los perseguidos por causa de la justicia, porque de ellos es el reino de los cielos. Bienaventurados vosotros cuando os insulten y os persigan y os calumnien de cualquier modo por mi causa."},{"t":"vr","x":"Alegraos y regocijaos, porque vuestra recompensa será grande en el cielo."},{"t":"rr","x":"Bienaventurados vosotros cuando os insulten y os persigan y os calumnien de cualquier modo por mi causa."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Dios, Padre nuestro, que, con la ayuda de la"},{"t":"p","x":"bienaventurada Virgen María, llevaste a los beatos mártires claretianos a la imitación de Cristo hasta el derramamiento de la sangre, concédenos, por su ejemplo e intercesión, confesar la fe con fortaleza de palabra y de obra. Por Jesucristo, nuestro Señor. Amén."}]}]},{"id":"martires-laudes","name":"Laudes","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Cristo, cordero, puerta del martirio,","s":true},{"t":"v","x":"cruzan tus atrios los que te han seguido","s":false},{"t":"v","x":"en cuerpo, en alma, en corazón, en sangre;","s":false},{"t":"v","x":"tuyo, su brío.","s":false},{"t":"v","x":"Cristo, simiente, mártir de la siembra,","s":true},{"t":"v","x":"caen en tierra y brota de su vientre","s":false},{"t":"v","x":"trigo en tus campos, pan en tus manteles;","s":false},{"t":"v","x":"tuya, su ofrenda.","s":false},{"t":"v","x":"Cristo, romero, paz de los cautivos,","s":true},{"t":"v","x":"pasan unidos valles de tiniebla,","s":false},{"t":"v","x":"la faz serena, libre de rencores;","s":false},{"t":"v","x":"tuyas, sus penas.","s":false},{"t":"v","x":"Cristo, viviente, mártir de la espera,","s":true},{"t":"v","x":"mueren contentos, van hacia el mañana,","s":false},{"t":"v","x":"oran por su Congregación querida;","s":false},{"t":"v","x":"tuya, su pascua.","s":false},{"t":"v","x":"Cristo, lucero, rey de los testigos,","s":true},{"t":"v","x":"cantan al alba vivas a tu gloria,","s":false},{"t":"v","x":"«Madre» en sus labios, ruegos y perdones;","s":false},{"t":"v","x":"tuyas, sus voces.","s":false},{"t":"v","x":"Cristo, poniente, mártir de la siega,","s":true},{"t":"v","x":"ganan la mano al santo en su carrera,","s":false},{"t":"v","x":"sellan de rojo el vuelo claretiano;","s":false},{"t":"v","x":"tuya, su meta.","s":false},{"t":"v","x":"Cristo, venero, tregua en el camino,","s":true},{"t":"v","x":"ceden su aliento por hallar la dicha","s":false},{"t":"v","x":"de un pecho amigo, un Corazón de Madre;","s":false},{"t":"v","x":"tuyo, su abrigo.","s":false},{"t":"v","x":"Cristo, corriente, mártir de la leva,","s":true},{"t":"v","x":"salen al mundo ardientes misioneros,","s":false},{"t":"v","x":"su vivo amor ya no tiene fronteras;","s":false},{"t":"v","x":"tuyo, su fuego.","s":false},{"t":"v","x":"Cristo Jesús, tu Espíritu los fragua,","s":true},{"t":"v","x":"nacen en ti los que por ti murieron,","s":false},{"t":"v","x":"se alzan contigo, al Padre los entregas;","s":false},{"t":"v","x":"«Tuyos, tus hijos». Amén.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. En medio de sus tormentos, los mártires de Cristo contemplaban su gloria y decían: «Ayúdanos, Señor»."}]},{"type":"Salmo","label":"Salmo 62, 2-9","blocks":[{"t":"v","x":"Oh, Dios, tú eres mi Dios, por ti madrugo,","c":false},{"t":"v","x":"mi alma está sedienta de ti;","c":true},{"t":"v","x":"mi carne tiene ansia de ti,","c":true},{"t":"v","x":"como tierra reseca, agostada, sin agua.","c":true},{"t":"v","x":"¡Cómo te contemplaba en el santuario","c":false},{"t":"v","x":"viendo tu fuerza y tu gloria!","c":true},{"t":"v","x":"Tu gracia vale más que la vida,","c":true},{"t":"v","x":"te alabarán mis labios.","c":true},{"t":"v","x":"Toda mi vida te bendeciré","c":false},{"t":"v","x":"y alzaré las manos invocándote.","c":true},{"t":"v","x":"Me saciaré como de enjundia y de manteca,","c":true},{"t":"v","x":"y mis labios te alabarán jubilosos.","c":true},{"t":"v","x":"En el lecho me acuerdo de ti","c":false},{"t":"v","x":"y velando medito en ti,","c":true},{"t":"v","x":"porque fuiste mi auxilio,","c":true},{"t":"v","x":"y a la sombra de tus alas canto con júbilo;","c":true},{"t":"v","x":"mi alma está unida a ti,","c":true},{"t":"v","x":"y tu diestra me sostiene.","c":true},{"t":"v","x":"Ant. En medio de sus tormentos, los mártires de Cristo","c":false},{"t":"v","x":"contemplaban su gloria y decían: «Ayúdanos, Señor».","c":false},{"t":"v","x":"Ant. 2. Almas y espíritus justos, cantad un himno a Dios.","c":false}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Criaturas todas del Señor, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Ángeles del Señor, bendecid al Señor;","s":false},{"t":"v","x":"cielos, bendecid al Señor.","s":true},{"t":"v","x":"Aguas del espacio, bendecid al Señor;","s":false},{"t":"v","x":"ejércitos del Señor, bendecid al Señor.","s":true},{"t":"v","x":"Sol y luna, bendecid al Señor;","s":false},{"t":"v","x":"astros del cielo, bendecid al Señor.","s":true},{"t":"v","x":"Lluvia y rocío, bendecid al Señor;","s":false},{"t":"v","x":"vientos todos, bendecid al Señor.","s":true},{"t":"v","x":"Fuego y calor, bendecid al Señor;","s":false},{"t":"v","x":"fríos y heladas, bendecid al Señor.","s":true},{"t":"v","x":"Rocíos y nevadas, bendecid al Señor;","s":false},{"t":"v","x":"témpanos y hielos, bendecid al Señor.","s":true},{"t":"v","x":"Escarchas y nieves, bendecid al Señor;","s":false},{"t":"v","x":"noche y día, bendecid al Señor.","s":true},{"t":"v","x":"Luz y tinieblas, bendecid al Señor;","s":false},{"t":"v","x":"rayos y nubes, bendecid al Señor.","s":true},{"t":"v","x":"Bendiga la tierra al Señor,","s":false},{"t":"v","x":"ensálcelo con himnos por los siglos.","s":true},{"t":"v","x":"Montes y cumbres, bendecid al Señor;","s":false},{"t":"v","x":"cuanto germina en la tierra, bendiga al Señor.","s":true},{"t":"v","x":"Manantiales, bendecid al Señor;","s":false},{"t":"v","x":"mares y ríos, bendecid al Señor.","s":true},{"t":"v","x":"Cetáceos y peces, bendecid al Señor;","s":false},{"t":"v","x":"aves del cielo, bendecid al Señor.","s":true},{"t":"v","x":"Fieras y ganados, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Hijos de los hombres, bendecid al Señor;","s":false},{"t":"v","x":"bendiga Israel al Señor.","s":true},{"t":"v","x":"Sacerdotes del Señor, bendecid al Señor;","s":false},{"t":"v","x":"siervos del Señor, bendecid al Señor.","s":true},{"t":"v","x":"Almas y espíritus justos, bendecid al Señor;","s":false},{"t":"v","x":"santos y humildes de corazón, bendecid al Señor.","s":true},{"t":"v","x":"Ananías, Azarías y Misael, bendecid al Señor,","s":false},{"t":"v","x":"ensalzadlo con himnos por los siglos.","s":true},{"t":"v","x":"Bendigamos al Padre y al Hijo con el Espíritu Santo,","s":false},{"t":"v","x":"ensalcémoslo con himnos por los siglos.","s":true},{"t":"v","x":"Bendito el Señor en la bóveda del cielo,","s":false},{"t":"v","x":"alabado y glorioso y ensalzadlo, por los siglos.","s":true},{"t":"v","x":"Al final de este cántico no se dice Gloria al Padre.","s":false},{"t":"v","x":"Ant. Almas y espíritus justos, cantad un himno a Dios.","s":false},{"t":"v","x":"Ant. 3. Mártires del Señor, alabad al Señor en el cielo.","s":false}],"cite":"Dn 3, 57-88. 56"},{"type":"Salmo","label":"Salmo 149","blocks":[{"t":"v","x":"Cantad al Señor un cántico nuevo,","c":false},{"t":"v","x":"resuene su alabanza en la asamblea de los fieles;","c":true},{"t":"v","x":"que se alegre Israel por su Creador,","c":true},{"t":"v","x":"los hijos de Sion por su Rey.","c":true},{"t":"v","x":"Alabad su nombre con danzas,","c":false},{"t":"v","x":"cantadle con tambores y cítaras;","c":true},{"t":"v","x":"porque el Señor ama a su pueblo","c":true},{"t":"v","x":"y adorna con la victoria a los humildes.","c":true},{"t":"v","x":"Que los fieles festejen su gloria","c":false},{"t":"v","x":"y canten jubilosos en filas:","c":true},{"t":"v","x":"con vítores a Dios en la boca","c":true},{"t":"v","x":"y espadas de dos filos en las manos:","c":true},{"t":"v","x":"para tomar venganza de los pueblos","c":false},{"t":"v","x":"y aplicar el castigo a las naciones,","c":true},{"t":"v","x":"sujetando a los reyes con argollas,","c":true},{"t":"v","x":"a los nobles con esposas de hierro.","c":true},{"t":"v","x":"Ejecutar la sentencia dictada","c":false},{"t":"v","x":"es un honor para todos sus fieles.","c":true},{"t":"v","x":"Ant. Mártires del Señor, alabad al Señor en el cielo.","c":false}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"¡Bendito sea Dios, Padre de nuestro Señor Jesucristo,"},{"t":"p","x":"Padre de misericordia y Dios de todo consuelo! Él nos alienta en nuestras luchas, hasta el punto de poder nosotros alentar a los demás en cualquier lucha, repartiendo con ellos el ánimo que nosotros recibimos de Dios. Si los sufrimientos de Cristo rebosan sobre nosotros, gracias a Cristo rebosa en proporción nuestro ánimo."}],"cite":"2Cor 1, 3-5"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Los justos viven eternamente."},{"t":"rr","x":"Los justos viven eternamente."},{"t":"vr","x":"Reciben de Dios su recompensa."},{"t":"rr","x":"Viven eternamente."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Los justos viven eternamente."}]},{"type":"Cántico evangélico","label":"Benedictus, ant. Dichosos los perseguidos por causa de","blocks":[{"t":"p","x":"la justicia, pues de ellos es el reino de los cielos."}]},{"type":"Preces","label":"Preces","blocks":[{"t":"p","x":"Celebremos, amados hermanos, a nuestro Salvador, el testigo fiel, y, al recordar hoy a los santos mártires que murieron a causa de la palabra de Dios, aclamémoslo, diciendo:"},{"t":"p","x":"Nos has comprado, Señor, con tu sangre. Por la intercesión de los santos mártires, que entregaron"},{"t":"p","x":"libremente su vida como testimonio de la fe, — concédenos, Señor, la verdadera libertad de espíritu. Por la intercesión de los santos mártires, que"},{"t":"p","x":"proclamaron la fe hasta derramar su sangre,"},{"t":"p","x":"— concédenos, Señor, la integridad y la constancia de"},{"t":"p","x":"la fe. Por la intercesión de los santos mártires, que"},{"t":"p","x":"soportando la cruz siguieron tus pasos, — concédenos, Señor, soportar con generosidad las"},{"t":"p","x":"contrariedades de la vida. Por la intercesión de los santos mártires, que lavaron"},{"t":"p","x":"su manto en la sangre del Cordero, — concédenos, Señor, vencer las obras del mundo y de"},{"t":"p","x":"la carne."},{"t":"r","x":"Pueden añadirse intenciones particulares, que concluyen con la"},{"t":"p","x":"respuesta indicada más arriba. Padre nuestro."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Dios, Padre nuestro, que, con la ayuda de la"},{"t":"p","x":"bienaventurada Virgen María, llevaste a los beatos mártires claretianos a la imitación de Cristo hasta el derramamiento de la sangre, concédenos, por su ejemplo e intercesión, confesar la fe con fortaleza de palabra y de obra. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"martires-hora-intermedia","name":"Hora intermedia","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"r","x":"Si cae en domingo se recitan los salmos del domingo I; en los demás casos, se dirán los salmos graduales de la salmodia complementaria."}]}]},{"id":"martires-tercia","name":"Tercia","parts":[{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Tras un breve padecer, el mismo Dios de toda gracia,"},{"t":"p","x":"que os ha llamado en Cristo a su eterna gloria, os restablecerá, os afianzará, os robustecerá. Suyo es el poder por los siglos. Amén."},{"t":"vr","x":"Los santos que esperan en el Señor."},{"t":"rr","x":"Serán fuertes y no fallarán."}],"cite":"1Pe 5, 10-11"}],"sub":true},{"id":"martires-sexta","name":"Sexta","parts":[{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Los santos, por medio de la fe en Cristo, nuestro"},{"t":"p","x":"Señor, subyugaron reinos, practicaron la justicia, obtuvieron promesas."},{"t":"vr","x":"Vuestra tristeza."},{"t":"rr","x":"Se convertirá en alegría."}],"cite":"cf. Heb 11, 33"}],"sub":true},{"id":"martires-nona","name":"Nona","parts":[{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"La vida de los justos está en las manos de Dios y no"},{"t":"p","x":"los tocará el tormento. La gente insensata pensaba que morían, pero ellos están en paz."},{"t":"vr","x":"Al volver, vuelven cantando."},{"t":"rr","x":"Trayendo sus gavillas."},{"t":"r","x":"La oración, como en Laudes."}],"cite":"Sab 3, 1-2a. 3b"}],"sub":true},{"id":"martires-visperas","name":"Vísperas","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Mártires de la Iglesia Mártir, mártires,","s":true},{"t":"v","x":"que gozosos moristeis por su causa,","s":true},{"t":"v","x":"vuestra sangre hoy vive entre nosotros","s":true},{"t":"v","x":"y es sangre de perdón,","s":true},{"t":"v","x":"y es sangre de perdón y de esperanza.","s":true},{"t":"v","x":"Juventud claretiana, sangre nuestra,","s":true},{"t":"v","x":"de tu pasión guardamos la memoria;","s":false},{"t":"v","x":"eres tú la heredad de esta familia","s":false},{"t":"v","x":"que en vosotros ya goza de la gloria.","s":false},{"t":"v","x":"No temisteis la muerte que venía,","s":true},{"t":"v","x":"y, cantando, marchabais al suplicio;","s":false},{"t":"v","x":"las balas no pudieron apartaros","s":false},{"t":"v","x":"del Amor en la sangre del camino.","s":false},{"t":"v","x":"Corazón de María traspasado:","s":true},{"t":"v","x":"tú velaste el dolor de aquellos hijos;","s":false},{"t":"v","x":"¡Qué fácil, como tú, asunta al cielo,","s":false},{"t":"v","x":"volar hacia la gloria, peregrinos!","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. Los cuerpos de los santos fueron sepultados en paz y su fama vive por generaciones."}]},{"type":"Salmo","label":"Salmo 114","blocks":[{"t":"v","x":"Amo al Señor, porque escucha","c":false},{"t":"v","x":"mi voz suplicante,","c":true},{"t":"v","x":"porque inclina su oído hacia mí","c":true},{"t":"v","x":"el día que lo invoco.","c":true},{"t":"v","x":"Me envolvían redes de muerte,","c":false},{"t":"v","x":"me alcanzaron los lazos del abismo,","c":true},{"t":"v","x":"caí en tristeza y angustia.","c":true},{"t":"v","x":"Invoqué el nombre del Señor:","c":true},{"t":"v","x":"«Señor salva mi vida».","c":true},{"t":"v","x":"El Señor es benigno y justo,","c":false},{"t":"v","x":"nuestro Dios es compasivo;","c":true},{"t":"v","x":"el Señor guarda a los sencillos:","c":true},{"t":"v","x":"estando yo sin fuerzas me salvó.","c":true},{"t":"v","x":"Alma mía, recobra tu calma,","c":false},{"t":"v","x":"que el Señor fue bueno contigo:","c":true},{"t":"v","x":"arrancó mi alma de la muerte,","c":true},{"t":"v","x":"mis ojos de las lágrimas,","c":true},{"t":"v","x":"mis pies de la caída.","c":true},{"t":"v","x":"Caminaré en presencia del Señor","c":false},{"t":"v","x":"en el país de la vida.","c":true},{"t":"v","x":"Ant. Los cuerpos de los santos fueron sepultados en","c":false},{"t":"v","x":"paz y su fama vive por generaciones.","c":false},{"t":"v","x":"Ant. 2. Vi las almas de los degollados a causa de la","c":false},{"t":"v","x":"palabra de Dios y del testimonio que mantuvieron.","c":false}]},{"type":"Salmo","label":"Salmo 115","blocks":[{"t":"v","x":"Tenía fe, aun cuando dije:","c":false},{"t":"v","x":"«¡Qué desgraciado soy!».","c":true},{"t":"v","x":"Yo decía en mi apuro:","c":true},{"t":"v","x":"«Los hombres son unos mentirosos».","c":true},{"t":"v","x":"¿Cómo pagaré al Señor","c":false},{"t":"v","x":"todo el bien que me ha hecho?","c":true},{"t":"v","x":"Alzaré la copa de la salvación,","c":true},{"t":"v","x":"invocando su nombre.","c":true},{"t":"v","x":"Cumpliré al Señor mis votos","c":true},{"t":"v","x":"en presencia de todo el pueblo.","c":true},{"t":"v","x":"Mucho le cuesta al Señor","c":false},{"t":"v","x":"la muerte de sus fieles.","c":true},{"t":"v","x":"Señor, yo soy tu siervo,","c":true},{"t":"v","x":"siervo tuyo, hijo de tu esclava:","c":true},{"t":"v","x":"rompiste mis cadenas.","c":true},{"t":"v","x":"Te ofreceré un sacrificio de alabanza,","c":false},{"t":"v","x":"invocando tu nombre, Señor.","c":true},{"t":"v","x":"Cumpliré al Señor mis votos","c":true},{"t":"v","x":"en presencia de todo el pueblo,","c":true},{"t":"v","x":"en el atrio de la casa del Señor,","c":true},{"t":"v","x":"en medio de ti, Jerusalén.","c":true},{"t":"v","x":"Ant. Vi las almas de los degollados a causa de la palabra","c":false},{"t":"v","x":"de Dios y del testimonio que mantuvieron.","c":false},{"t":"v","x":"Ant. 3. Estos son aquellos santos que entregaron sus","c":false},{"t":"v","x":"cuerpos para ser fieles a la alianza de Dios y han lavado","c":false},{"t":"v","x":"sus vestiduras en la sangre del Cordero.","c":false}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Eres digno, Señor Dios nuestro,","c":false},{"t":"v","x":"de recibir la gloria, el honor y el poder,","c":true},{"t":"v","x":"porque tú has creado el universo;","c":true},{"t":"v","x":"porque por tu voluntad lo que no existía fue creado.","c":true},{"t":"v","x":"Eres digno de tomar el libro y abrir sus sellos,","c":false},{"t":"v","x":"porque fuiste degollado","c":true},{"t":"v","x":"y con tu sangre compraste para Dios","c":true},{"t":"v","x":"hombres de toda raza, lengua, pueblo y nación;","c":true},{"t":"v","x":"y has hecho de ellos para nuestro Dios","c":true},{"t":"v","x":"un reino de sacerdotes,","c":true},{"t":"v","x":"y reinan sobre la tierra.","c":true},{"t":"v","x":"Digno es el Cordero degollado","c":false},{"t":"v","x":"de recibir el poder, la riqueza, la sabiduría,","c":true},{"t":"v","x":"la fuerza, el honor, la gloria y la alabanza.","c":true},{"t":"v","x":"Ant. Estos son aquellos santos que entregaron sus","c":false},{"t":"v","x":"cuerpos para ser fieles a la alianza de Dios y han lavado","c":false},{"t":"v","x":"sus vestiduras en la sangre del Cordero.","c":false}],"cite":"Ap 4, 11; 5, 9-10. 12"},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Queridos hermanos: estad alegres cuando compartís"},{"t":"p","x":"los padecimientos de Cristo, para que, cuando se manifieste su gloria, reboséis de gozo. Si os ultrajan por el nombre de Cristo, dichosos vosotros, porque el Espíritu de la gloria, el Espíritu de Dios, reposa sobre vosotros."}],"cite":"1Pe 4, 13-14"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Alegraos, justos, y gozad con el Señor."},{"t":"rr","x":"Alegraos, justos, y gozad con el Señor."},{"t":"vr","x":"Aclamadlo, los de corazón sincero."},{"t":"rr","x":"Y gozad con el Señor."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Alegraos, justos, y gozad con el Señor."}]},{"type":"Cántico evangélico","label":"Magníficat, ant. Se alegran en el cielo los santos que","blocks":[{"t":"p","x":"siguieron las huellas de Cristo; y, porque lo amaron hasta derramar su sangre, reinan con el Señor eternamente."}]},{"type":"Preces","label":"Preces","blocks":[{"t":"p","x":"A la misma hora en que el Rey de los mártires ofreció su vida en la última cena y la entregó en la cruz, démosle gracias, diciendo:"},{"t":"p","x":"Te glorificamos, Señor."},{"t":"p","x":"Porque nos amaste hasta el extremo, Salvador nuestro,"},{"t":"p","x":"principio y origen de todo martirio:"},{"t":"p","x":"Te glorificamos, Señor. Porque no cesas de llamar a los pecadores arrepentidos"},{"t":"p","x":"para los premios de tu Reino:"},{"t":"p","x":"Te glorificamos, Señor. Porque hoy hemos ofrecido la sangre de la alianza nueva"},{"t":"p","x":"y eterna, derramada para el perdón de los pecados:"},{"t":"p","x":"Te glorificamos, Señor. Porque con tu gracia nos has dado perseverancia en la"},{"t":"p","x":"fe durante el día que ahora termina:"},{"t":"p","x":"Te glorificamos, Señor."},{"t":"r","x":"Pueden añadirse intenciones particulares, que concluyen con la"},{"t":"p","x":"respuesta indicada más arriba. Porque has asociado a tu muerte a nuestros hermanos"},{"t":"p","x":"difuntos:"},{"t":"p","x":"Te glorificamos, Señor. Dirijamos ahora nuestra oración al Padre que está en los cielos, diciendo: Padre nuestro."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Dios, Padre nuestro, que, con la ayuda de la"},{"t":"p","x":"bienaventurada Virgen María, llevaste a los beatos mártires claretianos a la imitación de Cristo hasta el derramamiento de la sangre, concédenos, por su ejemplo e intercesión, confesar la fe con fortaleza de palabra y de obra. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]}]},{"id":"joaquina","date":"22 de mayo","title":"Santa Joaquina de Vedruna","rank":"Memoria","intro":[{"t":"p","x":"Santa Joaquina de Vedruna de Mas nació en Barcelona el 16 de abril de 1783. En 1826 fundó el Instituto de Hermanas Carmelitas de la Caridad. La unió una santa amistad con san Antonio María Claret, como queda de manifiesto en las cartas del santo: «Siendo estudiante la conocí». «Ya fundadora, quiso que examinara de nuevo las Reglas, siendo yo sacerdote y después arzobispo». Hablando de las Hermanas Carmelitas de la Caridad dice: «En ellas reina el espíritu de pobreza evangélica, de oración y caridad». El Obispo de Vic nombró director de dichas religiosas a Antonio María Claret, quien les dio ejercicios espirituales, gestionó su aprobación real y trabajó en la aprobación definitiva de sus Constituciones. Después del santo fundador, se hizo cargo del acompañamiento de las mismas religiosas el P. Esteban Sala. La madre Joaquina de Vedruna murió en Barcelona el 28 de agosto de 1854. Fue canonizada por Juan XXIII el 12 de abril de 1959."},{"t":"r","x":"Común de santas mujeres: para los religiosos o para los que se han"},{"t":"p","x":"consagrado a una actividad caritativa, o para los educadores."}],"hours":[{"id":"joaquina-laudes","name":"Laudes","parts":[{"type":"Cántico evangélico","label":"Benedictus, ant. Si alguno me ama, mi Padre lo amará","blocks":[{"t":"p","x":"y vendremos a él y pondremos en él nuestra morada (T. P. Aleluya)."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"S eñor, tú que has hecho surgir en la Iglesia a santa"},{"t":"p","x":"Joaquina de Vedruna para la educación cristiana de la juventud y el alivio de los enfermos, haz que nosotros sepamos imitar sus ejemplos y dediquemos nuestra vida a servir con amor a nuestros hermanos."},{"t":"p","x":"Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"joaquina-visperas","name":"Vísperas","parts":[{"type":"Cántico evangélico","label":"Magníficat, ant. Proclamad la grandeza del Señor,","blocks":[{"t":"p","x":"que derriba del trono a los poderosos y enaltece a los humildes (T. P. Aleluya)."}]}]}]},{"id":"micaela","date":"15 de junio","title":"Santa María Micaela del Santísimo Sacramento","rank":"Memoria","intro":[{"t":"p","x":"Santa María Micaela Desmaisières y López de Dicastillo nació en Madrid el 1 de enero de 1809. En 1850 san Antonio María Claret la exhortó a entregarse de lleno a la obra comenzada de regeneración de las mujeres extraviadas. Más tarde, siendo su director espiritual, aprobó y defendió su espíritu de abnegación. Le aconsejó, además, escribir su autobiografía y cultivar la amistad con la reina Isabel II. Colaboró con ella en la fundación de su Congregación de Adoratrices Esclavas del Santísimo Sacramento y de la Caridad (1856) y colaboró en la aprobación de sus Constituciones. Una íntima amistad unió siempre a estos dos grandes santos. Siguiendo las orientaciones de Claret, se entregó a una misión heroica en pro de los hermanos, muriendo víctima de la peste en Valencia el 24 de agosto de 1865. Fue beatificada por Pío XI el 7 de junio de 1925 y el mismo Pontífice la inscribió en el catálogo de los santos el 4 de marzo de 1934. El 14 de mayo de 1964, Pablo VI nombró a san Antonio María Claret Patrón principal del Instituto de las Adoratrices."},{"t":"r","x":"Común de vírgenes o de santas mujeres: para los religiosos."}],"hours":[{"id":"micaela-laudes","name":"Laudes","parts":[{"type":"Cántico evangélico","label":"Benedictus, ant. Dios anuncia la paz a su pueblo y a sus","blocks":[{"t":"p","x":"amigos y a los que se convierten de corazón."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Oh, Dios, que amas a los hombres y concedes"},{"t":"p","x":"a todos tu perdón; suscita en nosotros un espíritu de generosidad y de amor que, alimentado y fortalecido con la eucaristía, a imitación de santa"},{"t":"p","x":"María Micaela, nos impulse a encontrarte en los más pobres y en los más necesitados de tu protección. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"micaela-visperas","name":"Vísperas","parts":[{"type":"Cántico evangélico","label":"Magníficat, ant. No amemos de palabra y de boca, sino","blocks":[{"t":"p","x":"de verdad y con obras."}]}]}]},{"id":"corazon","date":"Sábado posterior al II domingo después de Pentecostés","title":"Inmaculado Corazón de la Bienaventurada Virgen María","rank":"Solemnidad · Titular y Patrona","intro":[{"t":"p","x":"El Inmaculado Corazón de la bienaventurada Virgen María es nuestro Titular desde la fundación misma del Instituto (1849). En 1852 es proclamada nuestra Patrona. A partir de 1862 los miembros de la Congregación en su profesión religiosa se entregan al servicio especial del Corazón Inmaculado de María para conseguir el objeto para el que nuestro Instituto ha sido constituido en la Iglesia."},{"t":"p","x":"La expresión Corazón de María se ha de interpretar en sentido bíblico: designa la persona misma de la Virgen; su ser íntimo y único; el centro y la fuente de su vida interior: del entendimiento, de la memoria, de la voluntad y del amor; la actitud indivisa con que amó a Dios y a los hermanos y se entregó intensamente a la obra salvadora del Hijo. En la liturgia se contempla la solicitud materna de la Virgen, modelo del corazón nuevo, don y signo de la nueva alianza."},{"t":"p","x":"El P. Claret presenta el Corazón de María como la fragua ardiente donde los misioneros se forjan para ser servidores de la Palabra a fin de poder prolongar los oficios de la maternidad espiritual de María sobre los hombres."},{"t":"p","x":"Nuestro estilo profético de vida recibe del Corazón Inmaculado de María, Madre de la Congregación, una impronta peculiar. Ella nos enseña que sin corazón, sin ternura, sin amor, no hay profecía creíble. El viernes posterior al segundo domingo después de Pentecostés, se reza el oficio propio de las II Vísperas de la solemnidad del Sagrado Corazón de Jesús. Los textos aquí indicados para las I Vísperas del Inmaculado Corazón de la bienaventurada Virgen María únicamente se emplean en el caso de celebrar esta solemnidad en fecha distinta."}],"hours":[{"id":"corazon-i-visperas","name":"I Vísperas","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v","x":"Virgen fecunda, Madre de la Iglesia,","s":true},{"t":"v","x":"pura flor de belleza sobrehumana,","s":false},{"t":"v","x":"alegría del hombre que se entrega,","s":false},{"t":"v","x":"esperanza del mundo que se afana.","s":false},{"t":"v","x":"Crecida en el amor humilde y fuerte,","s":true},{"t":"v","x":"Madre de Dios, de claro sol vestida,","s":false},{"t":"v","x":"feliz porque venciste nuestra muerte","s":false},{"t":"v","x":"y nos brindas la fuente de la vida.","s":false},{"t":"v","x":"Corazón abrasado por la llama","s":true},{"t":"v","x":"inquieta del Espíritu divino,","s":false},{"t":"v","x":"da luz a nuestros ojos, y derrama","s":false},{"t":"v","x":"amor que nos sostenga en el camino.","s":false},{"t":"v","x":"Corazón que respiras en la gloria","s":true},{"t":"v","x":"del Señor y proclamas su grandeza,","s":false},{"t":"v","x":"haz que nunca se apague tu memoria","s":false},{"t":"v","x":"en los hijos que anhelan tu pureza.","s":false},{"t":"v","x":"Oh, Corazón, amor de los que buscan","s":true},{"t":"v","x":"en Cristo la verdad y el buen camino,","s":false},{"t":"v","x":"enciende en el amor a los que luchan","s":false},{"t":"v","x":"por encontrar la vida de tu Hijo.","s":false},{"t":"v","x":"Húndenos en tu entraña jubilosa,","s":true},{"t":"v","x":"báñanos en la luz del Evangelio","s":false},{"t":"v","x":"y prolonga en nosotros la gozosa","s":false},{"t":"v","x":"misión de proclamarlo al mundo entero.","s":false},{"t":"v","x":"Gloria al Padre que vive en luz de gloria","s":true},{"t":"v","x":"y al Hijo que nació de Madre virgen","s":false},{"t":"v","x":"y al Espíritu fiel que con su sombra","s":false},{"t":"v","x":"cubrió tu Corazón manso y humilde. Amén.","s":false}]},{"type":"Salmodia","label":"Salmodia","blocks":[{"t":"a","x":"1. El Señor derriba del trono a los poderosos y enaltece a los humildes."}]},{"type":"Salmo","label":"Salmo 112","blocks":[{"t":"v","x":"Alabad, siervos del Señor,","c":false},{"t":"v","x":"alabad el nombre del Señor.","c":true},{"t":"v","x":"Bendito sea el nombre del Señor,","c":true},{"t":"v","x":"ahora y por siempre:","c":true},{"t":"v","x":"de la salida del sol hasta su ocaso,","c":true},{"t":"v","x":"alabado sea el nombre del Señor.","c":true},{"t":"v","x":"El Señor se eleva sobre todos los pueblos,","c":false},{"t":"v","x":"su gloria sobre los cielos.","c":true},{"t":"v","x":"¿Quién como el Señor Dios nuestro,","c":true},{"t":"v","x":"que se eleva en su trono","c":true},{"t":"v","x":"y se abaja para mirar al cielo y a la tierra?","c":true},{"t":"v","x":"Levanta del polvo al desvalido,","c":false},{"t":"v","x":"alza de la basura al pobre,","c":true},{"t":"v","x":"para sentarlo con los príncipes,","c":true},{"t":"v","x":"los príncipes de su pueblo;","c":true},{"t":"v","x":"a la estéril le da un puesto en la casa,","c":true},{"t":"v","x":"como madre feliz de hijos.","c":true},{"t":"v","x":"Ant. El Señor derriba del trono a los poderosos y","c":false},{"t":"v","x":"enaltece a los humildes.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Señor, que te sientas en tu trono y te abajas para mirar el cielo y la tierra, te has fijado en María, tu humilde sierva, y la has hecho madre feliz de hijos, concédenos a cuantos la reconocemos como Madre llamarnos y ser de verdad hijos de su Corazón. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"2. El Señor ha enviado su mensaje a María y le ha manifestado su voluntad."}]},{"type":"Salmo","label":"Salmo 147","blocks":[{"t":"v","x":"Glorifica al Señor, Jerusalén;","c":false},{"t":"v","x":"alaba a tu Dios, Sion:","c":true},{"t":"v","x":"que ha reforzado los cerrojos de tus puertas","c":true},{"t":"v","x":"y ha bendecido a tus hijos dentro de ti;","c":true},{"t":"v","x":"ha puesto paz en tus fronteras,","c":true},{"t":"v","x":"te sacia con flor de harina.","c":true},{"t":"v","x":"Él envía su mensaje a la tierra","c":false},{"t":"v","x":"y su palabra corre veloz;","c":true},{"t":"v","x":"manda la nieve como lana,","c":true},{"t":"v","x":"esparce la escarcha como ceniza;","c":true},{"t":"v","x":"hace caer el hielo como migajas","c":false},{"t":"v","x":"y con el frío congela las aguas;","c":true},{"t":"v","x":"envía una orden y se derriten;","c":true},{"t":"v","x":"sopla su aliento y corren.","c":true},{"t":"v","x":"Anuncia su palabra a Jacob,","c":false},{"t":"v","x":"sus decretos y mandatos a Israel;","c":true},{"t":"v","x":"con ninguna nación obró así,","c":true},{"t":"v","x":"ni les dio a conocer sus mandatos.","c":true},{"t":"v","x":"Ant. El Señor ha enviado su mensaje a María y le ha","c":false},{"t":"v","x":"manifestado su voluntad.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}]},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Oh, Dios, que en la plenitud de los tiempos enviaste al que es tu Palabra, nacido de mujer, enséñanos a acoger y guardar, como ella, tu Palabra en el corazón hasta convertirnos en evangelio de Dios. Por Jesucristo, nuestro Señor. Amén."},{"t":"a","x":"3. El Señor ha bendecido a María con toda clase de bienes espirituales y celestiales, y por ella hemos recibido el fruto de la vida."}]},{"type":"Cántico","label":"Cántico","blocks":[{"t":"v","x":"Bendito sea Dios,","c":false},{"t":"v","x":"Padre de nuestro Señor Jesucristo,","c":true},{"t":"v","x":"que nos ha bendecido en la persona de Cristo","c":true},{"t":"v","x":"con toda clase de bienes espirituales y celestiales.","c":true},{"t":"v","x":"Él nos eligió en la persona de Cristo,","c":false},{"t":"v","x":"antes de crear el mundo,","c":true},{"t":"v","x":"para que fuésemos santos","c":true},{"t":"v","x":"e irreprochables ante él por el amor.","c":true},{"t":"v","x":"Él nos ha destinado en la persona de Cristo,","c":false},{"t":"v","x":"por pura iniciativa suya,","c":true},{"t":"v","x":"a ser sus hijos,","c":true},{"t":"v","x":"para que la gloria de su gracia,","c":true},{"t":"v","x":"que tan generosamente nos ha concedido","c":true},{"t":"v","x":"en su querido Hijo,","c":true},{"t":"v","x":"redunde en alabanza suya.","c":true},{"t":"v","x":"Por este Hijo, por su sangre,","c":false},{"t":"v","x":"hemos recibido la redención,","c":true},{"t":"v","x":"el perdón de los pecados.","c":true},{"t":"v","x":"El tesoro de su gracia, sabiduría y prudencia","c":true},{"t":"v","x":"ha sido un derroche para con nosotros,","c":true},{"t":"v","x":"dándonos a conocer el misterio de su voluntad.","c":true},{"t":"v","x":"Este es el plan","c":false},{"t":"v","x":"que había proyectado realizar por Cristo","c":true},{"t":"v","x":"cuando llegase el momento culminante:","c":true},{"t":"v","x":"recapitular en Cristo todas las cosas","c":true},{"t":"v","x":"del cielo y de la tierra.","c":true},{"t":"v","x":"Ant. El Señor ha bendecido a María con toda clase","c":false},{"t":"v","x":"de bienes espirituales y celestiales, y por ella hemos","c":false},{"t":"v","x":"recibido el fruto de la vida.","c":false},{"t":"v","x":"Seguidamente, observado un momento de silencio, se puede concluir","c":false},{"t":"v","x":"con la siguiente oración:","c":false}],"cite":"Ef 1, 3-10"},{"type":"Oración sálmica","label":"Oración sálmica","blocks":[{"t":"p","x":"Bendito seas, Padre, Señor del cielo y de la tierra, porque has revelado el misterio de tu voluntad a los sencillos; te pedimos que tu Espíritu, con la colaboración maternal de la Virgen María, forme a Cristo en nuestros corazones hasta llegar a la plenitud del hombre perfecto. Por Jesucristo, nuestro Señor. Amén."}]},{"type":"Lectura breve","label":"Lectura breve","blocks":[{"t":"p","x":"Cuando se cumplió el tiempo, envió Dios a su"},{"t":"p","x":"Hijo, nacido de una mujer, nacido bajo la ley, para rescatar a los que estaban bajo la ley, para que recibiéramos el ser hijos por adopción."}],"cite":"Gál 4, 5"},{"type":"Responsorio breve","label":"Responsorio breve","blocks":[{"t":"vr","x":"Dichosa eres, Virgen María, porque llevaste en tu seno al Creador del universo."},{"t":"rr","x":"Dichosa eres, Virgen María, porque llevaste en tu seno al Creador del universo."},{"t":"vr","x":"Y por ti hemos recibido el fruto de la Vida."},{"t":"rr","x":"Porque llevaste en tu seno al Creador del universo."},{"t":"vr","x":"Gloria al Padre, y al Hijo, y al Espíritu Santo."},{"t":"rr","x":"Dichosa eres, Virgen María, porque llevaste en tu seno al Creador del universo."}]},{"type":"Cántico evangélico","label":"Magníficat, ant. Dichosa es la Virgen María, que","blocks":[{"t":"p","x":"conservaba la palabra de Dios, meditándola en su corazón."}]},{"type":"Preces","label":"Preces","blocks":[{"t":"p","x":"Celebrando las maravillas de Dios Padre todopoderoso que quiso que todas las generaciones proclamasen bienaventurada a María, Madre de su Hijo y Madre de la Iglesia, digamos con amor y confianza:"},{"t":"p","x":"Que la Madre del amor"},{"t":"p","x":"nos encienda en celo apostólico. Tú, que asociaste tan estrecha e indisolublemente"},{"t":"p","x":"a María a la obra salvífica de tu Hijo haciéndola"},{"t":"p","x":"Madre suya y Madre nuestra, — haz que con plenitud de fe aceptemos tu plan de"},{"t":"p","x":"salvación y con amor profundo recibamos a María"},{"t":"p","x":"por Madre y formadora nuestra. Tú, que elegiste a María, tu fidelísima sierva, para que"},{"t":"p","x":"meditase en su Corazón las palabras de tu Hijo, — conviértenos, por su intercesión, en discípulos"},{"t":"p","x":"dóciles de tu Hijo y fieles servidores del Evangelio. Tú, que fortaleciste a María al pie de la cruz y la"},{"t":"p","x":"colmaste de gozo en la resurrección de tu Hijo, — alienta nuestra esperanza en las adversidades del"},{"t":"p","x":"ministerio apostólico. Tú, que quisiste que la Inmaculada Virgen María"},{"t":"p","x":"fuese partícipe en cuerpo y alma de la gloria de tu"},{"t":"p","x":"Hijo y cuidase maternalmente de los hombres que"},{"t":"p","x":"peregrinan aún en la tierra, — haz que, encendidos en la fragua de su amor,"},{"t":"p","x":"trabajemos para llevar a nuestros hermanos por el"},{"t":"p","x":"camino de la salvación."},{"t":"r","x":"Pueden añadirse intenciones particulares, que concluyen con la"},{"t":"p","x":"respuesta indicada más arriba."},{"t":"p","x":"Tú, que llenaste de amor a la Virgen María, haciéndola"},{"t":"p","x":"Madre de misericordia, — haz que los pecadores experimenten su protección"},{"t":"p","x":"y que nuestros hermanos difuntos sean conducidos"},{"t":"p","x":"a la plenitud de la vida eterna. Padre nuestro."}]},{"type":"Oración","label":"Oración","blocks":[{"t":"p","x":"Señor, Dios nuestro, que elegiste a la siempre Virgen"},{"t":"p","x":"María para ser la Madre de tu Hijo y Madre nuestra, haz que, por la fiel entrega a su Corazón materno, nos configuremos más plenamente con Cristo y, urgidos por su caridad, nos dediquemos con mayor generosidad a proclamar el Evangelio a todos los hombres. Por nuestro Señor Jesucristo, tu Hijo, que vive y reina contigo en la unidad del Espíritu Santo y es Dios por los siglos de los siglos. Amén."}]}]},{"id":"corazon-invitatorio","name":"Invitatorio","parts":[{"type":"Rúbrica","label":null,"blocks":[{"t":"a","x":"Aclamemos al Señor en esta fiesta del Inmaculado Corazón de la Virgen María."},{"t":"r","x":"El salmo invitatorio, como en el Ordinario."}]}]},{"id":"corazon-oficio-de-lectura","name":"Oficio de lectura","parts":[{"type":"Himno","label":"Himno","blocks":[{"t":"v",
