<meta name="apple-mobile-web-app-title" content="Pregàries Japó">
<meta name="application-name" content="Pregàries Japó">
<meta name="theme-color" content="#7B1E2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F3; --surface:#FFFFFF; --ink:#2B2124; --muted:#6F6266; --line:#E6DCD6;
  --garnet:#7B1E2E; --garnet-soft:#F3E6E7; --gold:#A8833A;
  --c-v:#6C4A8C; --c-p:#C47A98; --c-w:#C9A646; --c-g:#4F7B4C; --c-r:#A3322C;
  --fs:19px;
  --serif-d:"Cormorant Garamond", Garamond, "Times New Roman", serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1416; --surface:#241C1F; --ink:#EEE6E2; --muted:#A99C9F; --line:#3A2F33;
    --garnet:#E0939D; --garnet-soft:#3A2228; --gold:#D6B46E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1416; --surface:#241C1F; --ink:#EEE6E2; --muted:#A99C9F; --line:#3A2F33;
  --garnet:#E0939D; --garnet-soft:#3A2228; --gold:#D6B46E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:var(--garnet)}

/* Capçalera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:.45rem;padding:.6rem 1rem}
.logo{flex:none;width:40px;height:40px;border-radius:10px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--serif-d);font-weight:700;font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05;margin:0;color:var(--garnet)}
.brand p{margin:0;font-size:.78rem;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:38px;height:38px;padding:0 .6rem;
  display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.icon-btn[aria-pressed="true"]{background:var(--garnet);color:var(--bg);border-color:var(--garnet)}

main{max-width:760px;margin:0 auto;padding:1rem 1rem 2rem}

/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.55rem .2rem .6rem;text-decoration:none;color:var(--muted);font-size:.78rem}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--garnet);font-weight:500}

/* Fitxa del diumenge */
.sunday{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem 1.2rem 1.5rem;overflow:hidden}
.sunday::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--season,var(--c-g))}
.when{font-size:.88rem;color:var(--muted);margin:0 0 .15rem}
.sunday h2{font-family:var(--serif-d);font-weight:600;font-size:2rem;line-height:1.1;margin:0 0 .35rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.85rem}
.pill{border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;color:var(--muted)}
.pill.cyc{border-color:var(--garnet);color:var(--garnet);font-weight:500}
.note{margin:.8rem 0 0;padding:.65rem .8rem;border-radius:10px;background:var(--garnet-soft);font-size:.9rem}
.note p{margin:0 0 .4rem}.note p:last-child{margin:0}
.linkbtn{background:none;border:none;padding:0;color:var(--garnet);text-decoration:underline;text-underline-offset:3px}

/* Pregàries */
.prayers{margin-top:1.2rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.2rem 0 1rem}
.toolbar .sp{flex:1}
.prayer{padding:1rem 0 1.2rem;border-top:1px solid var(--line)}
.prayer:first-of-type{border-top:none}
.prayer-h{display:flex;align-items:baseline;gap:.5rem;margin:0 0 .55rem}
.prayer-h h3{flex:1;margin:0;font-family:var(--serif-d);font-style:italic;font-weight:600;font-size:1.25rem;color:var(--garnet)}
.copy{border:none;background:none;color:var(--muted);font-size:.8rem;padding:.2rem .3rem;border-radius:6px}
.copy:hover{color:var(--garnet)}
.text{font-size:var(--fs);line-height:1.68;max-width:38em}
.text span{display:block;padding-left:1.2em;text-indent:-1.2em}
.text span:first-child{font-weight:500}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.2rem}
.pn button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;text-align:left;min-height:56px}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--muted);font-size:.75rem}
.pn button:disabled{visibility:hidden}

/* Seccions */
.sec-h{font-family:var(--serif-d);font-weight:600;font-size:1.4rem;margin:1.6rem 0 .6rem;display:flex;align-items:center;gap:.5rem}
.sec-h:first-child{margin-top:.4rem}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--season);flex:none;display:inline-block}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--garnet);border-radius:999px;overflow:hidden}
.seg button{border:none;background:none;padding:.45rem 1.1rem;color:var(--garnet);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--garnet);color:var(--bg)}
.seg-sm button{padding:.3rem .8rem;font-size:.85rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:.45rem}
.chips button{height:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.05rem}
.chips button.wide{grid-column:span 3}
.chips button.cur{border-color:var(--garnet);box-shadow:inset 0 0 0 1px var(--garnet);color:var(--garnet);font-weight:600}
.hint{color:var(--muted);font-size:.88rem;margin:.3rem 0 0}

/* Calendari */
.yearbar{display:flex;align-items:center;gap:.5rem;margin:.2rem 0 1rem}
.yearbar h2{flex:1;margin:0;text-align:center;font-family:var(--serif-d);font-weight:600;font-size:1.35rem;line-height:1.15}
.yearbar h2 small{display:block;font-family:var(--serif);font-size:.8rem;color:var(--muted);font-weight:400}
.cal{list-style:none;margin:0;padding:0}
.cal-m{font-family:var(--serif-d);font-style:italic;font-size:1.15rem;color:var(--muted);margin:1rem 0 .3rem}
.cal li button,.cal li .row{width:100%;display:grid;grid-template-columns:3.6rem 10px 1fr auto;gap:.65rem;align-items:center;
  background:none;border:none;border-bottom:1px solid var(--line);padding:.6rem .2rem;text-align:left}
.cal li button:hover{background:var(--garnet-soft)}
.cal .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.cal .n{line-height:1.3}
.cal .n small{display:block;color:var(--muted);font-size:.8rem}
.cal .go{color:var(--garnet);font-size:.85rem}
.cal li.now button,.cal li.now .row{background:var(--garnet-soft);border-radius:8px}
.cal .miss{color:var(--muted);font-size:.78rem;font-style:italic}

/* Cerca */
.search{width:100%;font:inherit;font-size:1.05rem;padding:.7rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.results{list-style:none;padding:0;margin:1rem 0 0}
.results button{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:.7rem .2rem}
.results b{font-weight:600}
.results .sn{display:block;color:var(--muted);font-size:.92rem;margin-top:.15rem}
mark{background:#F1DFA8;color:inherit;border-radius:2px}
[data-theme="dark"] mark{background:#6B5420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:#6B5420}}

details.about{margin-top:2rem;border-top:1px solid var(--line);padding-top:1rem;color:var(--muted);font-size:.92rem}
details.about summary{cursor:pointer;color:var(--garnet);font-family:var(--serif-d);font-size:1.15rem;font-weight:600}
.datepick{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:1rem 0 0;font-size:.9rem;color:var(--muted)}
.datepick input{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.8rem;background:none;border:none;color:var(--garnet);padding:0;font-size:.95rem}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:.5rem .9rem;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* Mode altar: només el text */
body.altar header.top,body.altar nav.tabs,body.altar .back,body.altar .pn,body.altar .datepick,body.altar details.about,body.altar .copy{display:none}
body.altar{padding-bottom:2rem}
body.altar .toolbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:.4rem 0;margin-bottom:.4rem}
@media print{header.top,nav.tabs,.toolbar,.pn,.copy,.back,.datepick,details.about{display:none!important}body{padding:0}.sunday{border:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
const DATA_ES = {"A":{"adv1":[["Oh Dios, Padre nuestro.","Tú estás siempre con quien espera y busca la salvación.","Ilumina con tu luz nuestros corazones","al comenzar el Adviento,","para que, en un mundo en el que no cesan","las luchas y los enfrentamientos,","sepamos caminar poniendo nuestra confianza","en la luz de Cristo."],["Oh Dios, rico en dones y en gracias.","Mientras esperamos gozosamente nuestra salvación,","te pedimos que nos hagas gustar profundamente","la grandeza de tu amor al darnos a tu Hijo."],["Saciados con el pan de la vida,","envíanos, Señor, para que podamos compartir,","con todos los que encontramos en nuestra vida diaria,","la esperanza y la alegría que de ti hemos recibido."]],"adv2":[["Oh Dios, que cuidas con cariño de todas las cosas","y no dejas de desear y esperar la conversión de cada uno.","Llena con tu Espíritu","a los que nos hemos reunido aquí en el nombre de Cristo,","para que, con un corazón renovado,","no dejemos nunca de esperar al Salvador","que trae al mundo un amor sin límites."],["Oh Dios, creador de todas las cosas,","que sostienes y cultivas toda vida.","A todos los que celebramos hoy la Cena del Señor","concédenos la gracia de gustar profundamente","el gozo de ser vivificados por ti."],["Oh Dios, fuente de la salvación.","Unidos en el Cuerpo de Cristo te pedimos que,","poniendo nuestra confianza en tu palabra,","podamos recorrer con gozo y entusiasmo el camino de Jesús."]],"adv3":[["Oh Dios compasivo y misericordioso,","fundamento de nuestra existencia.","Nuestros corazones desbordan de alegría","por la buena noticia del nacimiento de nuestro salvador.","En este momento de gracia, abre los ojos de nuestro corazón","y haznos descubrir tu luz que brilla en la oscuridad.","Abre nuestros oídos","y haznos dóciles a la voz de tu llamada."],["Padre nuestro, lleno de amor y de ternura.","Llena de tu Espíritu","a los que nos encontramos reunidos en torno a tu mesa,","de manera que saboreemos profundamente","el amor de Cristo, que está con nosotros."],["Oh Dios, fuente de la vida.","Guía a los que acabas de alimentar en la mesa del Señor.","Haz que compartamos con todos la alegría","que de ti hemos recibido","y anunciemos al mundo la visita de tu salvación."]],"adv4":[["Oh Dios, que estás siempre con nosotros.","Tú nos has enviado a tu Hijo como salvador del mundo.","Te pedimos que todos los que esperamos","la cercana fiesta de su nacimiento","sepamos descubrir en la pequeñez del niño recién nacido","la luz del amor y de la esperanza."],["Oh Dios, rico en dones y en gracias.","Te presentamos estas ofrendas con las que","nosotros mismos nos ponemos en tus manos,","y te suplicamos que, al celebrar la muerte y resurrección de Cristo,","gustemos profundamente el amor escondido","en el envío de tu Hijo."],["Oh Dios, que derramas tu amor sobre todos los hombres.","Llena con tu Espíritu","a los que tú envías al terminar esta celebración.","Haz que compartamos con todos","la alegría vivida","en la celebración del nacimiento de Cristo."]],"qua1":[["Oh Dios, fuente de la vida.","Jesús, al experimentar la prueba en el desierto,","nos enseñó el camino para vencer las tentaciones del mal.","Guíanos a nosotros, que comenzamos la Cuaresma,","para que podamos vivir cada día vivificados por tu palabra."],["Oh Dios, generoso en dones y gracias.","Concédenos que, vivificados por tu palabra,","saboreemos profundamente el misterio","de la muerte y resurrección del Señor."],["Oh Dios, esperanza de los que creen en ti.","Llena con tu Espíritu y defiende de toda tentación","a los que por la comunión estamos unidos a Cristo,","y concédenos vivir día a día el camino de conversión","en acción de gracias y alegría."]],"qua2":[["Oh Dios, fuente de toda luz,","que invitas a todos los hombres a la salvación.","Nos hemos reunido aquí respondiendo a tu llamada:","concédenos la gracia de renovar de verdad","nuestro compromiso de seguir a Cristo","en su camino hacia la cruz."],["Oh Padre, que nos envuelves e iluminas con tu luz.","Fortalece en la fe y en el amor","a los que invitas a la mesa de Cristo,","para que una vez más","podamos celebrar con alegría el misterio de la salvación."],["Oh Dios, Padre nuestro.","Gracias por este rato pasado en compañía de Jesús","y por el don de habernos unido más estrechamente a él.","Concédenos que este tiempo de Cuaresma","nos ayude a seguir a Cristo","y nos lleve a trabajar por la salvación de todos."]],"qua3":[["Oh Dios, fuente de la salvación.","Tú has enviado a tu Hijo Jesús","como comida y bebida","que saciara nuestra hambre y nuestra sed.","Cuando, cansados y sedientos,","perdemos la alegría y la esperanza,","renueva nuestras fuerzas con el agua de la vida","y ayúdanos a levantarnos y continuar nuestro camino."],["Oh Dios, compasivo y misericordioso,","que recibes con alegría a todo el que, arrepentido, vuelve a ti.","Te pedimos que, al conmemorar la ofrenda de Cristo,","podamos adorarte en espíritu y en verdad."],["Oh Dios, rico en amor y ternura.","Jesús, adelantándose, dirigió la palabra a la samaritana","y quiso calmar la sed de su corazón.","Haz que nosotros, unidos a Cristo,","vivamos la abundancia de tu amor","por encima de todas las barreras que separan a los hombres."]],"qua4":[["Oh Dios, que diriges el mundo con la fuerza de tu amor.","Tú nos has enviado a Jesús como luz verdadera de este mundo.","Te pedimos que, creyendo en él y fijando en él nuestra mirada,","podamos vencer, como hijos de la luz, la fuerza de las tinieblas."],["Oh Dios, que con tu providencia guías a todos los hombres.","Iluminados con tu palabra salvadora te pedimos que,","por medio de este banquete de acción de gracias,","saboreemos la profundidad de tu amor","y quedemos plenamente fortalecidos con un ánimo nuevo."],["Oh Padre, que nos inundas abundantemente con tu gracia.","Tu Hijo Jesús derramó la luz de tu amor","sobre todos los hombres.","Te pedimos que nosotros, unidos a él,","sepamos agradecer la gracia recibida","y demos un testimonio decidido de nuestra fe."]],"qua5":[["Oh Dios, misericordioso y compasivo,","que nos has salvado de la muerte por medio de Jesucristo.","Llena a tu Iglesia con la alegría de una vida nueva,","y renuévala junto con los que en esta Cuaresma","se preparan para recibir el bautismo."],["Oh Dios, desbordante de gracias para con tus hijos.","Derrama tu bendición","sobre los que nos sentamos a la mesa del Señor","y haz que nuestro corazón se parezca un poco más al de Cristo,","que, ofreciéndose a sí mismo,","vivió el paso de la muerte a la vida."],["Oh Dios, que gobiernas todas las cosas con tu amor.","En tu Hijo Jesús nos has mostrado","la fuerza del amor que vence a la muerte.","Haz que seamos capaces de anunciar con alegría","este amor tuyo que nunca cambia."]],"pas3":[["Oh Dios, fuente de la esperanza,","que por la resurrección de Cristo","nos has mostrado el camino hacia una vida nueva.","Haz que abramos siempre nuestro corazón a Cristo,","que recorre con nosotros nuestra vida de fe,","y podamos compartir con todos la alegría de la salvación."],["Oh Dios, misericordioso y compasivo.","El Señor Jesús preside nuestra celebración","y también hoy nos invita a la mesa del pan de vida.","Te pedimos que, renovado nuestro corazón de creyentes,","podamos participar abundantemente en la vida de Cristo."],["Oh Dios, que derramas abundantemente","tu gracia sobre nosotros.","A los que has alimentado con la vida de Cristo","envíanos a la misión de hoy,","para que, cada uno en su lugar,","seamos testigos del misterio pascual del Señor."]],"pas4":[["Oh Dios todopoderoso,","que como guía y pastor nos has dado a Jesús,","vencedor de la muerte.","Concédenos que, cuando nos encontremos perdidos","y sin rumbo en la vida,","sepamos escuchar la voz de Jesús que nos llama a cada uno."],["Oh Dios misericordioso y compasivo.","Jesús, como buen pastor, cuida de nosotros,","nos apacienta en verdes praderas","y nos hace reposar junto a las aguas.","Que los invitados a la cena del Señor","saboreemos hondamente esta gracia."],["Oh Dios, fuente y dador de la vida.","Fortalécenos al comenzar una nueva semana,","para que nuestra vida de cada día","sea una respuesta a la llamada de Cristo."]],"pas5":[["Oh Dios, Padre compasivo y misericordioso,","que, resucitando a tu Hijo Jesús,","nos muestras el camino de la vida eterna.","Te pedimos que, aun en medio del peligro y la incertidumbre,","nuestro corazón esté siempre orientado hacia ti."],["Padre santo,","ahora que en esta mesa celebramos con alegría","la vida nueva de la resurrección,","haz de nosotros un pueblo que te sirva","y danos un corazón semejante al de Jesús,","que se ofreció él mismo por nosotros."],["Padre, lleno de ternura y amor.","Después de saciarnos con la vida nueva,","tú nos envías en medio del mundo.","Haz que seamos testigos gozosos de Cristo,","que es el camino que nos lleva hacia ti."]],"pas6":[["Oh Dios, misericordioso y compasivo.","Tu Hijo Jesús, en la Última Cena,","prometió a sus discípulos: «No os dejaré huérfanos».","Concédenos la gracia de vivir siempre con Cristo","y de estar sostenidos, en toda circunstancia,","por el Espíritu Santo, que es nuestra ayuda."],["Padre misericordioso y compasivo.","Tu Hijo Jesús se hizo amigo de todos","y nos mostró el amor más grande","cuando dio su propia vida por nosotros.","Haz que este sacramento","nos una más estrechamente a su amor."],["Oh Dios todopoderoso.","Fortalecidos con el alimento de la vida eterna, te suplicamos que,","sostenidos por Cristo, que está en nosotros,","vivamos la vida de cada día con amor y alegría."]],"ord2":[["Oh Dios, que amas al mundo","hasta el punto de entregar a tu propio Hijo.","Tú nos reúnes, unidos en la luz de Cristo.","Ilumina con el resplandor de esta luz","este mundo nuestro, que sufre las heridas del pecado,","y muéstrale el camino de la vida."],["Oh Dios, que has enviado a tu Hijo","para quitar el pecado del mundo.","Haz que, por estos dones que te ofrecemos,","nuestros corazones queden unidos a ti","y reciban la fuerza para trabajar por la salvación."],["Oh Dios, que nos das abundantemente tu gracia.","Llenos de la luz de Cristo, te pedimos","que sepamos dar testimonio de tu Hijo Jesús","por medio de nuestra vida."]],"ord3":[["Oh Dios, Padre nuestro.","Nos reunimos en medio del frío invierno","para alabarte y darte gracias.","Hoy tu Hijo Jesús nos comunica,","una vez más, el evangelio de tu reino.","Haz que esta celebración nuestra reciba tu luz","y la refleje de tal manera","que podamos iluminar la oscuridad del mundo."],["Oh Dios, tú creas y conservas todas las cosas.","Acéptanos a nosotros con estos dones que te ofrecemos","y haz que, teniendo un solo corazón y una sola alma,","podamos vivir el misterio de la muerte y resurrección de Cristo."],["Oh Dios, Padre nuestro,","que nos das continuamente tu vida y tu fuerza.","Te pedimos que, vivificados y movidos por ellas,","podamos sentirnos acompañados por ti","a lo largo de esta semana que comenzamos."]],"ord4":[["Oh Dios,","vivimos en un mundo inmerso en el dolor.","Pero, precisamente en medio del sufrimiento,","encontramos la fuerza de tu presencia salvadora.","Llénanos de la alegría de tu reino","a nosotros, que queremos escuchar la buena noticia","que Jesús proclamó en Galilea."],["Oh Dios, fuente de la vida.","Tú transformas en alimento nuestro","los frutos de nuestro trabajo de cada día que ahora te presentamos.","Haz que nuestras penas y sufrimientos","se transformen también en alegría."],["Oh Dios, que sacias a los que tienen hambre y sed.","Ahora, todos juntos, hemos recibido de ti nuestro alimento.","Te pedimos que los que, todavía hoy,","carecen de lo necesario","puedan ver remediada su indigencia."]],"ord5":[["Oh Dios, luz que ilumina nuestro mundo.","Nos has reunido aquí como sal de la tierra y luz del mundo.","Te pedimos que también hoy,","formando un solo corazón con todos los demás,","podamos alabar tu misericordia y tu amor."],["Padre nuestro, que derramas tu luz sobre todas las cosas.","Te presentamos estos dones,","fruto de nuestros pobres esfuerzos de cada día,","y te pedimos que, por ellos, nos unas al misterio","de la muerte y resurrección de Cristo."],["Oh Dios, Padre nuestro.","Llenos de tu luz, te pedimos","que nos hagas saborear profundamente","la gracia que de ti hemos recibido","y nos guíes para cumplir con alegría","la misión que nos encomiendas."]],"ord6":[["Oh Dios, que nos muestras el camino de la vida.","Por tu Hijo Jesús has llevado a plenitud","la ley que habías dado al pueblo del Antiguo Testamento.","Ilumina con tu sabiduría a los que nos hemos reunido aquí","y guíanos para que podamos seguir caminando con Cristo."],["Padre nuestro, que nos has enseñado el camino del amor.","Ahora que te ofrecemos estos dones,","te pedimos que nos hagas imitadores del amor","que has mostrado en la pasión de tu Hijo Jesús."],["Oh Dios, que siempre das abundantemente tu gracia.","Fortalecidos por el sacramento recibido, te pedimos","que nos concedas discernir","cuál es tu voluntad en la sociedad actual,","y que nos guíes para poder ir avanzando por tu camino."]],"ord7":[["Padre nuestro, que por medio de tu Hijo Jesús","nos has mostrado tu amor a todos.","Los que nos encontramos aquí reunidos","te pedimos que, en este mundo nuestro,","tan inclinado a encerrarse en sí mismo,","sepamos expresar en nuestras vidas","el amor a ti y al prójimo."],["Padre santo,","tu Hijo Jesús rezó por los que lo crucificaban.","Nosotros, al ofrecerte estos dones,","te pedimos que, por ellos, nos hagas participar","del amor y el perdón de Cristo."],["Padre compasivo y misericordioso,","unidos a Cristo y llenos de tu Espíritu,","te pedimos que nos libres del rencor y del egoísmo","y nos hagas vivir en tu amor."]],"ord8":[["Oh Dios, que con tu vida alimentas a todos los vivientes.","Tú, que alimentas a los pájaros del cielo","y cuidas de las flores del campo,","también nos alimentas y te preocupas de nosotros","sin olvidarnos ni un solo momento.","Haz que todos los que nos hemos reunido aquí","sepamos descubrir tu amor, presente en todas las cosas,","y hacer crecer también nuestra confianza en ti."],["Te ofrecemos, oh Dios, estos frutos de la vida","que tú mismo has creado,","y, unidos en un solo corazón para darte gracias,","te pedimos que sepamos ser testigos","de tu amor y de tu ternura."],["Padre nuestro, que conoces bien todo lo que necesitamos.","Te agradecemos las gracias recibidas, y también te pedimos","que, recordando constantemente tu amor","—que tantas veces hemos experimentado—,","tengamos a Cristo con nosotros a lo largo de toda nuestra vida."]],"ord9":[["Oh Dios, fuente de la salvación,","que llenas de bendiciones a los que creen en ti.","Te pedimos que los que nos hemos reunido hoy aquí","abramos nuestro corazón a tu palabra","y sepamos mantener firme la confianza en ti."],["Oh Dios, fuerza de los que creen en ti.","Acéptanos a nosotros mismos junto con estos dones","y danos la fuerza de mantenernos fieles a tu palabra."],["Oh Dios, que nos alimentas y cuidas de nosotros.","Guarda y protege a los que has saciado con el alimento de la vida.","Haz que, sostenidos por una fe sólida en toda circunstancia,","podamos avanzar por el camino cristiano","con entusiasmo y alegría."]],"ord10":[["Oh Dios, fuente del amor.","Tú invitas a todos al banquete de la salvación","y les das consuelo y esperanza.","Dirige tu mirada sobre los que nos hemos reunido aquí,","y, así como la lluvia empapa y fecunda la tierra,","derrama tú también tu amor y tu ternura","sobre nosotros."],["Oh Dios, Padre de todos nosotros.","Jesús invitaba a los pecadores y se sentaba a la mesa con ellos.","Te pedimos que nosotros,","que nos sentamos a la mesa del Señor,","seamos capaces de perdonarnos mutuamente."],["Oh Dios, que estás siempre con nosotros.","Fortalece con tu fuerza","a los que has alimentado con el cuerpo de Cristo,","para que, a imitación de él, que invitaba a los pecadores,","vivamos con el corazón abierto a todos los hermanos."]],"ord11":[["Oh Dios, que guías siempre nuestros pasos.","Tú buscas trabajadores para el evangelio de tu reino.","Llénanos de tu bendición a nosotros que,","decididos a seguir a Cristo, nos hemos reunido aquí,","y afiánzanos una vez más con tu palabra."],["Oh Dios, solo tú eres santo.","Acepta estos dones que te presentamos de todo corazón,","y haz que, respondiendo a tu invitación,","nos sintamos fortalecidos para trabajar por tu reino."],["Oh Dios, fuente y dador de toda vida.","Afianza con tu gracia","a los que has alimentado en la mesa del Señor,","para que las palabras y las obras de los que seguimos a Jesús","sean buena noticia para todos."]],"ord12":[["Oh Dios, que te preocupas incluso del más pequeño de los pájaros.","Tú nos guardas siempre y nos proteges con amor.","Te pedimos que, venciendo toda inquietud e incertidumbre,","crezca cada día nuestra confianza en ti."],["Oh Dios, tú eres nuestro Padre.","Unimos nuestro corazón al de Jesús,","que siguió el camino de la cruz;","y, ahora que nos disponemos a recibir el pan de la salvación,","te pedimos que nos llenes de confianza en ti."],["Oh Dios, compañero nuestro en la vida.","Llenos de gozo por compartir la vida de Cristo,","te rogamos que, unidos a él,","hagamos de nuestra vida","un testimonio gozoso y decidido de nuestra fe."]],"ord13":[["Oh Dios,","tú conoces bien lo que nosotros buscamos y necesitamos.","Danos fuerza para seguir buscando la forma auténtica de vida,","y haz que, en la invitación de Cristo que nos dice:","«que cada uno tome su cruz y me siga»,","sepamos encontrar la verdadera luz que guíe nuestra vida."],["Oh Dios, fuente de la salvación.","En torno a la mesa del altar, te pedimos","que, unidos a Cristo, que siguió el camino de la cruz,","podamos participar también en la vida de la resurrección."],["Padre nuestro, fuente de la vida.","Haz que saboreemos profundamente la gracia del sacramento","que juntos acabamos de celebrar,","y que, como seguidores de Cristo,","vivamos nuestra vida de cada día con gozo en el corazón."]],"ord14":[["Padre nuestro, Señor del cielo y de la tierra.","Tu Hijo Jesús ofrece siempre descanso","a los que se sienten agobiados por el yugo de la vida.","Haz que los que nos hemos reunido aquí","sepamos llevar la paz de Cristo","a un mundo abrumado por las luchas y las dificultades."],["Oh Dios, que das alimento a todos los seres vivos.","Junto con estos dones,","acepta también nuestra oración.","Te pedimos que los que recibimos el cuerpo de Cristo","imitemos la actitud de su corazón humilde y sencillo."],["Agradeciendo la gracia recibida, te pedimos, Padre,","que, asumiendo el yugo de la vida,","como discípulos de Cristo que somos,","sepamos olvidarnos de nosotros mismos","y emplear nuestra vida en bien de todos."]],"ord15":[["Oh Dios, tú diriges tu llamada a todos.","Como aquella gente a orillas del mar de Galilea,","también nosotros escuchamos hoy la palabra de Jesús.","Haz que sepamos acoger profundamente en nuestro corazón","este anuncio gozoso."],["Oh Dios, tu gracia se extiende sobre todas las cosas.","Te alabamos y te damos gracias por los frutos de la tierra,","y te pedimos que los que hemos sembrado la semilla del evangelio","nos unamos más íntimamente a Cristo por medio de esta comida."],["Padre compasivo y misericordioso.","Haz que los que participamos en la vida de tu Hijo Jesús","sepamos compartir con todos esta gracia","y recojamos de ella frutos abundantes."]],"ord16":[["Oh Dios, que amas con solicitud todas las cosas.","Tú siembras en el mundo la buena semilla","y acompañas su crecimiento con ternura y paciencia.","Te pedimos","que todos nosotros sepamos amarnos mutuamente","y que, como hijos tuyos amados que somos,","crezcamos en tu amor."],["Oh Dios, lleno de amor y de ternura.","Después de escuchar tu palabra","y de renovar nuestro corazón,","te presentamos nuestros dones,","y te pedimos que los que celebramos el memorial de Cristo","contribuyamos también a la expansión de tu reino."],["Padre, rico en dones y gracias,","que nos has hecho uno en Jesucristo.","Enséñanos a no fijarnos en los defectos de los demás","y, en cambio, a saber descubrir","tu amor presente y actuante en nuestro mundo."]],"ord17":[["Oh Dios, tú que eres amor,","nos manifiestas continuamente las riquezas de tu reino.","Reunidos ahora ante ti, te pedimos","que seamos capaces de descubrir en la palabra de Cristo","tu alegría y tu luz para nuestra vida."],["Padre santo,","que nos invitas al banquete de tu reino.","Haz que respondamos con prontitud a tu invitación."],["Dios y Señor nuestro,","concédenos saber discernir","en nuestra vida de cada día","lo que de verdad tiene valor de auténtico tesoro,","y que con corazón decidido hagamos caso de tu palabra."]],"ord18":[["Oh Dios, que alimentas con tu gracia","a los que tienen hambre y sed.","Te alabamos por tu amor tan grande","y te pedimos","que sepamos escuchar y poner en práctica tu palabra,","para poder mantenernos en la vida verdadera."],["Dios nuestro.","Haz que hoy también nosotros saboreemos","el misterio del pan con el que Jesús","sació el hambre de sus seguidores,","de manera que por medio de este sacramento","nos unamos más profundamente a Cristo."],["Oh Dios, de quien hemos recibido la vida.","Alimentados con la comida verdadera,","te pedimos poder compartir con todos","la abundancia que hemos recibido en la palabra y el cuerpo de Cristo."]],"ord19":[["Oh Dios, que nos miras con tanto amor.","Fortalece a los que nos hemos reunido buscando la salvación.","Ayúdanos a superar nuestras angustias y desesperanzas","y llénanos de tu fuerza","para que sepamos cumplir fielmente tu palabra."],["Oh Dios, que nos das tu amor","y nos mantienes con tu aliento.","Contentos de encontrarnos en la mesa del Señor,","te pedimos que, por el misterio que ahora celebramos,","la palabra de Jesús resuene y penetre en nosotros,","de manera que se fortalezca la fe de nuestro corazón."],["Oh Dios, que estás siempre con nosotros.","Agradeciendo la gracia recibida, te pedimos","que —en este mundo nuestro, abrumado por conflictos y ansiedades—","sepamos anunciar a Cristo con firmeza y valentía."]],"ord20":[["Oh Dios, fuente de la salvación.","Acoge complacido los deseos de todos los que estamos aquí","y, aunque experimentemos nuestra debilidad y desfallecimiento,","haz que nos mantengamos firmes","en la esperanza de tu salvación."],["Oh Dios, Padre de todos nosotros.","Bendice con tu gracia este banquete de oración","y a todos los que alimentas, porque son tu pueblo,","concédeles acercarse cada vez más al corazón de Cristo."],["Oh Dios, que nos concedes participar en el don de la vida.","Ya que nos has renovado las fuerzas,","haz de nosotros tus enviados","para que podamos dar respuesta a los que buscan ayuda."]],"ord21":[["Oh Dios, que nos has enviado a tu Hijo Jesús como salvador.","Fortalece la fe de los que nos hemos reunido aquí,","para que, alimentados con tu palabra,","demos un testimonio muy animoso de Cristo."],["Oh Dios, que por la muerte y resurrección de Cristo","nos has abierto el camino de tu reino.","Invitados a la mesa de la salvación y llenos de gozo,","queremos celebrar la acción de gracias formando un solo corazón."],["Oh Dios, fuente de la vida.","Recibe la oración que te ofrecemos en acción de gracias","y concédenos que, unidos a Cristo,","venzamos la fuerza del mal","y lleguemos a ser portadores de la buena nueva de la salvación."]],"ord22":[["Oh Dios, Padre nuestro, que por medio de tu Hijo Jesús","nos has mostrado cuál es el camino para cumplir tu voluntad.","Haz que los que nos hemos reunido aquí","encontremos esperanza cuando él nos habla","y plenitud cuando recorremos con él el camino de la vida."],["Oh Dios, esperanza de los que sufren.","Fortalecidos con tu palabra de salvación y llenos de gratitud,","acudimos a ti y te suplicamos","que a todos los que conmemoramos la muerte y resurrección de Jesús","nos hagas fuertes para llevar la cruz junto con él."],["Oh Dios, fuente de la vida.","Llenos de tu gracia te pedimos que, unidos a Cristo,","sepamos ponerlo todo en tus manos","y emplear la vida en bien de los demás."]],"ord23":[["Oh Dios, tú nos has convocado","para que, viviendo como hermanos y hermanas, formemos un solo pueblo.","Reunidos en el nombre de Cristo, te pedimos","que seamos capaces de enriquecernos unos a otros","y de avanzar juntos por el mismo camino."],["Oh Dios, compasivo y misericordioso.","Aquí, en torno a la misma mesa, te pedimos","que los que unimos nuestro amor al de Cristo en su ofrenda","comprendamos que el amor es la plenitud de todo."],["Oh Dios, que guías continuamente a tu pueblo.","Fortalecidos con el pan de la vida","te suplicamos que tu Iglesia","continúe sin cesar su conversión hacia ti,","y, como familia tuya, muestre al mundo el amor verdadero."]],"ord24":[["Oh Dios, fuente del amor.","A este mundo nuestro, afligido por luchas y divisiones,","tú le has mostrado el camino del perdón y la reconciliación.","Haz que nosotros, como seguidores de Cristo,","sepamos aceptarnos mutuamente","y así dar testimonio de tu amor."],["Oh Dios, rico en amor y compasión.","Convierte nuestras ofrendas","en signo de reconciliación y de perdón verdaderos,","para que, perdonándonos de corazón mutuamente,","podamos sentarnos a la mesa del Señor."],["Fortalecidos por la gracia que acabamos de recibir,","te pedimos, Dios nuestro,","que, sintiéndonos siempre vivificados por tu amor,","podamos hacer de nuestra vida de cada día","una continua acción de gracias."]],"ord25":[["Oh Dios, que estás siempre a nuestro lado.","Tus pensamientos superan nuestros pensamientos,","tu mirada abarca todas las cosas","y tu amor no tiene fondo ni límite.","A todos los que hoy, reunidos aquí,","dirigimos hacia ti nuestros corazones,","haz que descubramos tu amor,","que vale más que cualquier otra cosa."],["Oh Dios, que das a cada uno lo que necesitamos.","Haz que este pan y este vino que te ofrecemos","se conviertan en portadores de la vida auténtica."],["Oh Dios, Padre nuestro.","Envíanos hoy una vez más,","para que, fortalecidos con el alimento que nos has dado,","podamos trabajar por tu reino,","cada uno en su propio ambiente."]],"ord26":[["Oh Dios, que guías a toda persona a actuar con generosidad.","Tú, que conoces nuestros sentimientos más profundos,","acompáñanos en el camino de la fe,","para que podamos vivir siempre con el corazón orientado hacia ti."],["Oh Dios, fuente de la vida.","Cristo se entregó totalmente a sí mismo por el bien de todos.","Te pedimos que, por medio de esta comida salvadora,","podamos saborear profundamente el amor de Cristo."],["Oh Dios, que amas a todos los hombres y mujeres.","Unidos a Cristo, y con un corazón humilde,","te pedimos que con nuestra vida","podamos dar testimonio","del camino que recorremos siguiéndote."]],"ord27":[["Oh Dios, fuente de quien hemos recibido la vida.","Tú guardas y cultivas todas las cosas","para que den fruto abundante.","Haz que, teniendo siempre el corazón orientado y abierto","a tu acción salvadora,","podamos responder como es debido a este amor tuyo."],["Oh Dios, creador y sostén de todas las cosas.","Te presentamos este pan y este vino, frutos de la tierra,","y te suplicamos","que, para todos los que, dando gracias,","nos encontramos en torno a tu mesa,","se hagan abundante realidad las obras de tu salvación."],["Te alabamos y te damos gracias, Padre,","y te pedimos","que, llenos de tu bendición generosa,","demos frutos abundantes en nuestra vida diaria."]],"ord28":[["Oh Dios, fuente de la esperanza,","que invitas a todos a la mesa de tu reino.","Estamos aquí, ante ti,","cada uno con sus inquietudes y esperanzas.","Haz que descubramos y saboreemos tu amor,","y que correspondamos a él como es debido de palabra y de obra."],["Padre compasivo y misericordioso.","Bendice esta mesa que hemos preparado con mucha ilusión.","Te pedimos que todos los que participamos juntos","en el gozo del misterio de tu amor","nos sintamos siempre unidos a ti."],["Oh Dios, que caminas con nosotros por el camino de la vida.","Haznos gustar el gozo de sentirnos enviados por ti,","para que, compartiendo con todos la salvación de Cristo,","podamos invitarlos al banquete de tu reino."]],"ord29":[["Oh Dios, que gobiernas todo el universo","y guías a todos los hombres y mujeres a la salvación.","Bendice a este pueblo tuyo, reunido para alabarte lleno de gozo.","Graba con fuerza en nuestros corazones","que solo tú eres el Señor,","y ábrenos a tu palabra salvadora."],["Oh Dios, creador de todas las cosas.","Te presentamos este pan y este vino que hemos recibido de ti.","Te pedimos que,","igual que Jesús supo devolverte todo lo que era tuyo,","también nosotros sepamos hacerlo hoy,","unidos íntimamente a su ofrenda."],["Oh Dios, Señor de todas las cosas.","Te damos gracias por el don de participar juntos en la vida de Cristo,","y te pedimos que despiertes nuestra conciencia","a tu justicia y a tu amor,","para que construyamos un mundo de paz,","donde sean respetadas la vida y la dignidad de todas las personas."]],"ord30":[["Oh Dios, tú nos has enviado a tu Hijo Jesús","para que conociéramos tu amor sin límites.","Haz que tengamos siempre presentes las enseñanzas de Cristo","y así podamos vivir","una vida plena en el amor a ti y a todos."],["Oh Dios, fuente del amor.","Ahora que nos disponemos a recordar a Jesús,","que llevó hasta el extremo su amor","a ti y a toda la humanidad,","te pedimos que, por esta participación","en el misterio de su muerte y resurrección,","alabemos con todas nuestras fuerzas este triunfo de su amor."],["Oh Dios, fundamento y sostén de todos los hombres y mujeres.","Haznos fuertes a todos los que, unidos a Cristo, ahora seremos enviados.","Que, movidos por tu amor,","podamos dar apoyo a los que necesitan ayuda."]],"ord31":[["Oh Dios, nuestro único Padre.","Sin tu gracia no podemos darte culto","con docilidad de corazón.","Haznos sentir el gozo de vivir como hijos tuyos","a todos los que, ante ti,","nos sentimos igualmente pequeños y débiles."],["Oh Dios,","que has iluminado nuestra vida con la luz del evangelio.","Estamos celebrando de corazón","el misterio de la muerte y resurrección de Cristo.","Te pedimos que nos asemejemos a tu Hijo,","que se hizo servidor hasta la muerte en cruz."],["Oh Dios, fuente del amor,","que nos haces sentir el gozo de compartir el pan de la vida","y, vivificados con este alimento, nos envías al mundo.","Haz que nos hagamos de verdad hermanos","de todos los que se sienten abrumados por el peso de la vida."]],"ord32":[["Oh Dios todopoderoso,","que actúas con tu aliento en la historia humana","y llevas todas las cosas a su plenitud.","Abre los ojos de los que nos hemos reunido aquí","mientras esperamos la vuelta del Señor,","y haz que sepamos discernir lo que debemos hacer aquí y ahora."],["Oh Dios,","que nos has dado a tu Hijo Jesús como esposo.","Llenos de alegría","por habernos invitado al banquete de la salvación,","te pedimos poder participar dignamente en este misterio","y poder recibir a Cristo, el Señor."],["Dios y Padre nuestro.","Unidos en la muerte y la vida de Cristo Jesús,","te pedimos que, incluso en medio de las tinieblas","de un mundo dominado por el odio y la mentira,","sepamos vivir enarbolando la antorcha de la fe y del amor."]],"ord33":[["Oh Dios, que derramas abundantemente tu gracia","sobre cada uno de nosotros.","Mira con bondad a los que, desde el trabajo de la vida diaria,","hemos venido a esta fiesta de acción de gracias","para corresponder a tu invitación.","Haz que encontremos descanso al calor de tu amor","y renueva nuestras ganas de vivir más plenamente el don de la vida."],["Oh Dios nuestro,","tu Hijo Jesús es para nosotros","el don más precioso que hemos recibido de ti.","Te pedimos que, por medio del sacramento que él nos dejó,","saboreemos la profundidad de tu amor."],["Oh Dios, que nos alimentas","con la palabra de la salvación y con el pan de la vida.","Tú pones en las manos de cada uno de nosotros","este tesoro que eres tú mismo.","Haz que, aprovechando como es debido los dones recibidos,","alcancemos el gozo de estar siempre contigo."]],"rei":[["Oh Dios, todopoderoso y eterno.","Todas las cosas, creadas por Cristo,","se reúnen y se completan de nuevo en él como rey.","Te pedimos que los que ponemos nuestra esperanza","en su palabra y esperamos su venida","vivamos hasta el fin de los tiempos en el amor que nunca pasa."],["Padre compasivo y misericordioso,","que has reconciliado todas las cosas","en la muerte y resurrección de tu Hijo Jesús.","Al celebrar en torno a tu mesa esta gracia de salvación,","llena hasta rebosar nuestros corazones del gozo de la unidad."],["Oh Dios, rico en gracias y dones.","Gracias al perdón que hemos recibido en este sacramento,","se ha fortalecido una vez más nuestra unión con Cristo.","Ahora que somos enviados al mundo,","te pedimos que cada uno de nosotros","sepa descubrir a Cristo en el hermano necesitado,","sea capaz de compartir su sufrimiento","y de sostenernos los unos a los otros."]]},"B":{"adv1":[["Oh Dios, que derramas sobre nosotros la luz de la esperanza.","Abre los ojos de nuestro corazón en este comienzo del Adviento,","para que sepamos discernir tu voluntad","en nuestra vida de cada día","y podamos vivirla siguiendo los pasos de Cristo Jesús."],["Oh Dios, rico en dones y gracias.","Mientras esperamos con alegría nuestra salvación,","te pedimos que nos hagas conocer profundamente","la grandeza del amor","que nos has mostrado al darnos a tu Hijo."],["A los que nos has saciado con el pan de la vida,","envíanos, Señor,","para que podamos compartir","la esperanza y el gozo que de ti hemos recibido","con todos los que encontramos en nuestra vida de cada día."]],"adv2":[["Oh Dios, Padre nuestro, lleno de amor y misericordia.","A este mundo nuestro, atormentado y dolorido,","tú le preparas el camino de la salvación.","Derrama abundantemente tu Espíritu","sobre los que nos encontramos reunidos aquí,","para que, volviéndonos de corazón hacia ti,","podamos caminar junto con Cristo."],["Oh Dios, creador de todas las cosas,","que mantienes y cuidas toda vida.","A todos los que celebramos hoy la Cena del Señor","concédenos la gracia de saborear plenamente","el gozo de sentirnos vivificados por ti."],["Oh Dios, fuente de la salvación.","Unidos en el Cuerpo de Cristo te pedimos que","los que hemos puesto nuestra confianza en tu palabra","podamos recorrer con gozo y entusiasmo el camino de Jesús."]],"adv3":[["Oh Dios, Padre de todos los hombres.","Tú haces brillar la luz en medio de las tinieblas","y cambias en gozo la tristeza.","Derrama la luz de la fe y de la esperanza","en los corazones de los que nos hemos reunido aquí","y llénanos de gozo por la venida de Cristo Jesús."],["Padre nuestro, lleno de ternura y amor.","Llena de tu Espíritu","a los que nos reunimos en torno a tu mesa,","para que saboreemos profundamente","el amor de Cristo, que está con nosotros."],["Oh Dios, fuente de la vida.","Guía a los que acabas de alimentar en la mesa del Señor.","Haz que compartamos con todos","el gozo que hemos recibido de ti","y anunciemos al mundo la visita de tu salvación."]],"adv4":[["Oh Padre, Dios eterno.","Al enviarnos a tu Hijo,","escogiste a María como madre del Salvador.","Te pedimos que nosotros, haciendo como ella,","recibamos a Jesús con amor y alegría","y vivamos siempre unidos a él."],["Oh Dios, rico en dones y gracias.","Te presentamos estos dones,","con los que nosotros mismos","nos ponemos en tus manos.","Concédenos que, al celebrar la muerte y resurrección de Cristo,","saboreemos profundamente","el amor que nos has mostrado al enviarnos a tu Hijo."],["Oh Dios, que derramas tu amor sobre todos los hombres.","Llena con tu Espíritu","a los que somos enviados al despedirnos de esta celebración.","Haz que compartamos con todos","el gozo que sentimos al celebrar el nacimiento de Cristo."]],"qua1":[["Oh Dios, rico en amor y misericordia,","que invitas a todos a la alegría de tu reino.","En este comienzo de la Cuaresma te pedimos que nosotros","(miembros de la Iglesia que acoge hoy a los catecúmenos)","renunciemos al mal y vivamos creyendo de verdad el evangelio."],["Oh Dios, generoso en dones y gracias.","Concédenos que, vivificados por tu palabra,","saboreemos profundamente","el misterio de la muerte y resurrección del Señor."],["Oh Dios, esperanza de los que creen en ti.","Llena con tu Espíritu y defiende de toda tentación","a los que por la comunión estamos unidos a Cristo,","y concédenos vivir cada día el camino de conversión","en acción de gracias."]],"qua2":[["Oh Dios, lleno de gloria y esplendor.","Tú señalaste como tu «Hijo amado»","a aquel Jesús que se encaminaba hacia la pasión.","Haz que nosotros, que escuchamos y seguimos su palabra,","continuemos —como hijos tuyos— el camino de nuestra vida."],["Oh Padre, que nos envuelves e iluminas con tu luz.","Haz más fuertes en la fe y en el amor","a los que invitas a la mesa de Cristo,","para que con gozo podamos celebrar una vez más","el misterio de la salvación."],["Oh Dios, Padre nuestro.","Gracias por este rato que hemos pasado","en compañía de Jesús","y por el don de habernos unido más estrechamente a él.","Concédenos que este tiempo de Cuaresma","nos ayude a seguir a Cristo","y nos lleve a trabajar por la salvación de todos."]],"qua3":[["Oh Dios, fuerza de los que esperan en ti.","Tu Hijo Jesús nos enseñó","—incluso arriesgando su vida—","cómo hemos de vivir en el amor a ti.","Haz que nosotros, que celebramos la liturgia cuaresmal","(acompañando a los que se preparan para recibir el bautismo),","volvamos a ti y profundicemos en la fe y el amor."],["Oh Dios, que has establecido con nosotros una alianza nueva.","Para nosotros, seguidores de Jesús,","ya no hay ni templo ni ofrendas.","Al conmemorar en esta cena la ofrenda única de Cristo","—que se ofreció él mismo por nosotros—,","únenos fuertemente a ti, que eres la fuente del amor."],["Oh Dios, que con tu vida abundante","alimentas a todos los que creemos en ti.","Reunidos como cuerpo de Cristo en una sola Iglesia,","te pedimos que derrames sobre nosotros un nuevo aliento,","que nos haga ser signo visible de tu amor."]],"qua4":[["Oh Dios, fuente de toda gracia,","que en la muerte de Jesús en la cruz","mostraste tu amor a todos los hombres.","Haz que, poniendo nuestra esperanza en Cristo, luz de salvación,","vivamos nuestra vida con una fe muy animosa."],["Oh Dios, compasivo y misericordioso,","que tanto amaste al mundo","que le diste a tu propio Hijo.","Concede a los que ahora celebramos juntos la cena del Señor","que todos y cada uno gustemos intensamente","la gracia de tu amor."],["Oh Dios, luz de nuestros corazones.","Saciados con la plenitud de tu amor","y como hijos de tu luz,","te pedimos que podamos compartir con todos","el gozo de creer en Jesús."]],"qua5":[["Oh Dios, Padre nuestro.","Llevando al límite el amor y la obediencia,","tu Hijo Jesús recorrió voluntariamente","el camino de la pasión para la salvación de todos.","Haz que también nosotros,","poniendo en ti nuestra confianza,","podamos recorrer sin miedo el camino de Jesús."],["Oh Dios, fuente y dador de toda vida.","Te ofrecemos de todo corazón este pan","—trigo molido, amasado y cocido al fuego—","como expresión de la vida y el amor de Cristo.","Que sea para nosotros alimento de vida nueva."],["Oh Dios, fuerza de todos los que creen en ti.","Llena de tu luz a los que formamos un solo cuerpo en Cristo,","para que, incluso en medio del sufrimiento y la adversidad,","no perdamos nunca la esperanza y la fe en ti,","y transparentemos en nuestra vida la luz de tu amor."]],"pas3":[["Oh Dios, fuente de la salvación,","que por la resurrección de Cristo","has liberado al mundo del dominio del pecado y de la muerte.","Fortalece con tu palabra","a los que has llamado y unido en un solo pueblo,","y haz que seamos testigos de la resurrección del Señor."],["Oh Dios, misericordioso y compasivo.","El Señor Jesús preside nuestra celebración","y hoy nos invita a la mesa del pan de la vida.","Te pedimos que, renovado nuestro corazón de creyentes,","podamos participar abundantemente en la vida de Cristo."],["Oh Dios, que derramas tu gracia sobre nosotros.","Ahora que nos has alimentado con la vida de Cristo,","envíanos a la misión de hoy,","para que, cada uno en su lugar,","demos testimonio del misterio pascual del Señor."]],"pas4":[["Oh Dios, fuente de la vida.","Jesús, como buen pastor,","dio su vida por nosotros con un amor infinito.","Te pedimos que, reunidos a sus pies con un solo corazón,","nos vayamos haciendo cada día más semejantes a su amor."],["Oh Dios misericordioso y compasivo.","Jesús, como buen pastor, cuida de nosotros,","nos apacienta en praderas deliciosas","y nos hace reposar junto al agua.","Que los invitados a la cena del Señor","sepamos saborear hondamente esta gracia."],["Oh Dios, fuente y dador de la vida.","Fortalécenos, ahora que comenzamos una nueva semana,","para que nuestra vida de cada día","sea nuestra respuesta a la llamada de Cristo."]],"pas5":[["Oh Dios, fuente de la vida,","que nunca abandonas a quien confía en ti,","sino que lo guías y lo sostienes.","Haz que los que nos hemos reunido como cuerpo de Cristo","formemos un solo corazón","y hagamos más fuertes estos lazos de unidad y de amor."],["Padre santo.","Ahora que en esta mesa celebramos con gozo","la vida nueva de la resurrección,","haz de nosotros un pueblo que te sirva","y danos un corazón cercano al de Jesús,","que se ofreció a sí mismo."],["Padre, lleno de ternura y amor,","que ahora envías al mundo","a los que nos has saciado con la vida nueva.","Haz que seamos testigos gozosos de Cristo","como Camino que conduce hacia ti."]],"pas6":[["Oh Dios, fuente de la vida.","Cuando nosotros procuramos vivir en el amor,","tú estás siempre a nuestro lado.","Al celebrar este domingo la resurrección de Jesús,","haz que encontremos el gozo verdadero en la ley del amor."],["Padre misericordioso y compasivo.","Tu Hijo Jesús se hizo amigo de todos","y, dando su propia vida por nosotros,","nos mostró el colmo del amor.","Haz que este sacramento nos una estrechamente a su amor."],["Oh Dios, Padre bueno.","Fortalecidos con el alimento de la vida eterna","te suplicamos que, sostenidos por Cristo, que está en nosotros,","vivamos la vida de cada día con amor y alegría."]],"ord2":[["Oh Dios,","que haces oír tu voz en el corazón de cada persona.","Tu Hijo Jesús, enviado al mundo,","proclamó el evangelio con su vida.","Te pedimos que todos los que hoy abrimos el corazón","a tu palabra salvadora","lleguemos a descubrir el camino que lleva a la vida."],["Oh Dios, que nos das abundantemente","tu amor y tu cariño.","Como respuesta a este amor","que Jesús, tu Hijo, nos dio,","concédenos permanecer también hoy cerca de él","y sentarnos con gozo a su mesa."],["Oh Dios, fuente de la vida.","Con el gozo experimentado en la cena del Señor,","te pedimos que los que hemos recibido tu fuerza por medio de él","expresemos en nuestra vida el gozo que nos da seguirlo."]],"ord3":[["Oh Dios, fuente de la vida.","Mira con ojos comprensivos esta fragilidad humana nuestra,","que nos hace caer esclavos de los cambios constantes de este mundo.","Renueva el corazón de los que nos hemos reunido aquí,","para que caminemos siguiendo las huellas de Jesús."],["Oh Dios, esperanza de los que se arrepienten.","Mira con bondad a los que, respondiendo a tu llamada,","nos hemos reunido en torno a tu mesa,","y haz que, uniendo nuestros corazones a la ofrenda de Cristo,","seamos capaces de ofrecernos nosotros mismos."],["Oh Dios, fuente de la alegría.","Alimentados y renovados con la palabra de Cristo","y con el pan de vida,","te pedimos que","los que somos enviados a las tareas de la vida de cada día","seamos diligentes en la construcción de tu reino."]],"ord4":[["Oh Dios, que nos llamas a la conversión.","Tu Hijo Jesús —rechazando el mal—","nos mostró la fuerza ilimitada de tu salvación.","Derrama el aliento y la fuerza de tu Espíritu","sobre los que hoy nos hemos reunido para alabarte."],["Oh Dios, que quieres la salvación de todos los hombres y mujeres.","Robustecidos con tu palabra","y llenos de esperanza, te pedimos","que fortalezcas a los que has reunido en el banquete de la salvación","y nos hagas saborear el gozo de servirte."],["Oh Dios, que nos has unido en ti formando un solo cuerpo.","Llenos de esta vida tuya te pedimos","que con todos los que encontramos en nuestra vida de cada día","sepamos compartir la palabra que Jesús proclamó","con fuerza y autoridad."]],"ord5":[["Oh Dios,","que derramas sobre nosotros la luz de la esperanza.","Tú enviaste a Jesús como salvador","a un mundo atormentado y dolorido.","Te pedimos que,","por medio de los sacramentos que hoy celebramos,","encontremos a Cristo, que sana a todos los hombres."],["Oh Dios, que das la fuerza para vivir.","Escucha la oración","de los que nos hemos reunido en torno a tu mesa,","para que, unidos en el amor de Cristo,","experimentemos el gozo completo del servicio mutuo."],["Oh Dios, que nos llenas con el aliento de tu Espíritu.","En nuestras caídas","tú mismo nos tiendes la mano y nos levantas.","Te pedimos que, renovados con tu fuerza,","proclamemos el evangelio con decisión y entusiasmo."]],"ord6":[["Oh Dios, fuente de la salvación,","que por la palabra y la vida de tu Hijo Jesús","has mostrado tu amor al mundo.","Inclina tu oído a la voz de los que buscan la salvación","en medio de las penas y el dolor,","y ofréceles, compasivo, la ternura de tu mano."],["Oh Dios, que nos sanas en el cuerpo y en el espíritu.","Fortalecidos con la palabra de salvación,","te suplicamos que, al celebrar el sacramento de acción de gracias,","quedemos unidos al sufrimiento de Cristo crucificado","y asociados al gozo de su resurrección."],["Oh Dios, rico en amor y ternura.","Llenos del gozo de tu salvación,","te pedimos que","los que somos enviados con la fuerza de tu Espíritu","vivamos con entusiasmo la misión que nos has confiado","de ser portadores de tu palabra."]],"ord7":[["Oh Dios, que renuevas el mundo con el aliento de tu Espíritu.","Aquí nos tienes, reunidos,","con nuestra esperanza puesta en Cristo.","Te pedimos que todos los que —por encima de enemistades y luchas—","buscamos la gracia del perdón mutuo","encontremos el amor y el perdón que tú nos ofreces en Cristo."],["Oh Dios,","que perdonas a tus hijos e hijas con amor y ternura.","Fortalecidos con tu palabra salvadora","te pedimos que los que compartimos el mismo cuerpo de Cristo","profundicemos en nuestra unidad mutua."],["Oh Dios, que nos llenas de vida nueva.","Con el gozo de haber participado en la mesa del perdón,","te pedimos","que hoy nos levantemos otra vez de nuestras caídas","y vivamos la vida de cada día como seguidores del evangelio."]],"ord8":[["Oh Dios, fuente de la salvación,","que hoy diriges de nuevo tu palabra","a los que nos encontramos reunidos aquí.","Renueva nuestros corazones por medio de esta palabra","y haz que nos llene el gozo de sentirnos siempre","acompañados por Cristo."],["Oh Dios, rico en amor y ternura.","Con el gozo de sentirnos invitados al banquete de la salvación,","te pedimos","que los que nos hemos reunido en torno a tu mesa","tengamos un solo corazón,","para que podamos ser dignos de participar en la nueva alianza."],["Oh Dios, que nos sacias con el pan de la vida.","Llenos de alegría por sabernos tus enviados,","te pedimos que cada uno de nosotros,","como servidor del evangelio,","sepa comunicar tu palabra, siempre actual y válida,","a todos con los que se encuentre en su vida de cada día."]],"ord9":[["Oh Dios, creador de todo el universo.","Tu mirada está siempre atenta a todo lo que has creado","y tu amor se derrama constantemente","sobre el que sufre o desfallece.","Te pedimos que los que nos hemos reunido aquí para alabarte","encontremos descanso a los pies de Cristo","y seamos plenamente renovados con su fuerza."],["Oh Dios,","que derramas sin medida tu amor sobre nosotros.","Fortalecidos con tu palabra y llenos de gozo","te pedimos, Señor, que llenes de la vida de Cristo","a todos los que nos sentamos a la mesa de la salvación,","para que así podamos irradiar la luz del evangelio."],["Padre misericordioso y compasivo.","Unidos en el amor y la vida de Cristo, te pedimos","que seamos capaces de vivir en nuestra vida de cada día","este amor tuyo que siente ternura y cariño","por todo ser viviente."]],"ord10":[["Oh Dios, fuente de la esperanza,","que en tu Hijo Jesús nos has mostrado tu fuerza,","que vence cualquier mal.","Llena de tu Santo Espíritu a los que nos hemos reunido aquí,","para que, sin extraviarnos por las sombras del mal,","avancemos por el camino de la vida con una sólida fe en ti."],["Oh Dios, fuente del amor.","Jesús hizo familia suya a los que cumplen tu voluntad.","Haz que, siguiendo su palabra,","todos los que compartimos un mismo pan","hagamos más fuerte nuestra unidad como familia tuya."],["Oh Dios, tu poder no tiene límite.","Unidos como un solo cuerpo en Cristo,","te pedimos que nos ayudes","a compartir sin miedo todo lo que creemos","y a anunciar tu palabra a todos los hombres."]],"ord11":[["Oh Dios, lleno de amor y ternura.","Te pedimos que tu reinado, iniciado por Cristo,","crezca vigorosamente en este mundo,","y que nosotros, abriendo el corazón a la acción de tu gracia,","colaboremos en poner en práctica tu voluntad."],["Oh Dios, fuente de la vida.","Ahora que traemos como ofrendas el pan y el vino,","te rogamos que el misterio de salvación que aquí conmemoramos","produzca frutos abundantes en nosotros."],["Oh Dios, que nos alimentas por medio de tus sacramentos.","Haz que, con la ayuda de tu Espíritu,","fructifique la semilla del evangelio sembrada en nosotros,","para que así seamos testigos claros","del crecimiento de tu reino."]],"ord12":[["Oh Dios, Señor de todo lo que existe.","En medio de un mundo inmerso en cambios profundos,","tu Iglesia tiene siempre por guía tu palabra poderosa.","Te pedimos","que los que hoy unimos nuestros corazones en la oración","rechacemos toda fuerza del mal","y cultivemos una fe sólida e inquebrantable."],["Oh Dios, esperanza de los que creen en ti.","Tú escuchas siempre","la voz de los que tienen hambre y sed de salvación.","Bendice a todos y cada uno de los que compartimos tu mesa","y llénanos de tu vida sobreabundante."],["Oh Dios, de quien proceden la victoria y la fuerza.","Alimentados y renovados con el don de tu pan,","te pedimos vencer todo temor y toda ansiedad","y testimoniar así ante todos el gozo de creer en ti."]],"ord13":[["Oh Dios, creador de todas las cosas,","tu gloria resplandece en todo ser viviente.","Haz que, por la palabra de Cristo que hoy proclamaremos,","podamos descubrir el sentido de la vida,","y que, al recibir el pan de la vida,","experimentemos una vez más el gozo de vivir."],["Oh Dios, bondadoso y compasivo,","que, por la resurrección de tu Hijo Jesús,","destruiste la fuerza de la muerte.","Te pedimos que los que conmemoramos la Pascua del Señor","vivamos una vida nueva."],["Oh Dios, que haces subsistir todo lo que existe.","Con el gozo de haber sentido el flujo de vida de Cristo,","te pedimos que sepamos apoyarnos mutuamente","y ser, cada uno para el otro, fuerza en las penas y sufrimientos."]],"ord14":[["Oh Dios, tu amor no tiene límite.","Tú nos guías constantemente con tu palabra de verdad.","Haz que los que nos hemos reunido aquí","sepamos acoger gozosamente tu palabra","y alabarte desde lo más hondo de nuestro corazón."],["Oh Dios, fuerza de los que creen en ti.","Fortalecidos con la palabra de salvación,","te pedimos que derrames tu bendición","sobre los que estamos preparando la mesa del Señor","y que nos llenes de vida nueva."],["Oh Dios todopoderoso.","Ahora que en este sacramento","se ha hecho más fuerte nuestra unión con Cristo, el Señor,","envíanos a las tareas de nuestra vida de cada día.","Haz que, confiando en tu fuerza, que ayuda a nuestra debilidad,","podamos realizar la misión que nos encomiendas."]],"ord15":[["Oh Dios, que llamas e invitas a todos los hombres.","Tú buscas trabajadores para tu reino","en todos los tiempos y en todas las edades.","Te pedimos que los que celebramos juntos la fiesta del domingo","prestemos oído atento a tu voz, que resuena en el silencio,","para que así podamos acogerla de nuevo en nuestro corazón."],["Oh Dios, rico en amor y ternura.","Todo lo que existe recibe su aliento","de tu proyecto de salvación.","Escucha a los que te rogamos","—uniendo nuestros corazones a la ofrenda de Cristo—","y únenos formando un solo cuerpo en él."],["Oh Dios, que reúnes y unificas todas las cosas en Cristo.","Envíanos como servidores del evangelio","y concédenos","que, confiando por encima de todo en tu amor,","trabajemos en la realización de la paz de Cristo."]],"ord16":[["Oh Dios, lleno de ternura y amor.","Tú, enviándonos a Cristo como pastor,","convocas y reúnes a todos los hombres.","Te pedimos que los que nos hemos reunido aquí","acojamos atentamente la palabra de Cristo","y lleguemos a ser seguidores fieles de sus enseñanzas."],["Padre misericordioso y compasivo.","Fortalece la fe y el amor de los que caminamos siguiendo a Cristo","y concédenos que,","profundizando nuestra comunión mutua en la mesa del Señor,","podamos llegar a ser un único pueblo tuyo."],["Oh Dios, que nos guías con mano poderosa.","Con el gozo de vernos unidos en un mismo Cristo,","te pedimos que en este mundo nuestro, herido por divisiones,","tu Iglesia trabaje con confianza por la paz y la unidad."]],"ord17":[["Oh Dios, fuente de la salvación,","que miras amorosamente a todos los que tienen hambre y sed de ti.","Te pedimos que los que hoy nos reunimos","para escuchar tu palabra salvadora","gustemos profundamente el gozo de estar llenos de tu vida."],["Oh Dios, generoso en gracias y dones.","Cristo, el Señor, sació el hambre de mucha gente","con solo unos pocos alimentos.","Ahora nosotros, reunidos en torno a tu mesa,","meditamos en nuestros corazones el significado de este signo.","Haz que participemos dignamente en el misterio de la Pascua de Cristo."],["Oh Dios, misericordioso y compasivo.","Las gracias recibidas de tu mano","se multiplican cuando se comparten.","Que los que nos hemos unido a la vida de Cristo por el sacramento","sepamos compartir este gozo","con todos los que viven a nuestro alrededor."]],"ord18":[["Oh Dios, que conoces bien nuestra hambre y nuestra sed.","Derrama tu bendición","sobre esta asamblea que busca tu salvación,","y haz que, al encontrar a Cristo, palabra y pan de vida,","se desborde abundantemente la fuerza que vive en cada uno de nosotros."],["Oh Dios, que cuidas con ternura de todo lo que vive.","Tú has dado al mundo a tu Hijo Jesús como pan del cielo.","Que el pan y el vino que ahora te ofrecemos","sean sacramento de Cristo, que nos da la vida eterna."],["Oh Dios, que desbordas de gracia y de amor.","Ya que formamos un solo cuerpo en Cristo, auténtico pan de la vida,","te rogamos que nos renueves con tu Espíritu,","para que trabajemos por tu reino con el gozo de la fe."]],"ord19":[["Oh Dios,","que alimentas con tu presencia la vida de los hombres.","Mira a tus hijos,","que una vez más nos reunimos hoy en torno a Cristo,","y haz que los que participamos juntos en la gracia de la vida","recibamos en plenitud la fuerza que necesitamos","para avanzar construyendo tu reino."],["Oh Dios, lleno de amor y ternura.","Estamos en torno a tu mesa,","celebrando la ofrenda de Cristo.","Te pedimos que, como respuesta a este amor de Jesús,","sepamos hacer de nuestra vida una ofrenda en tu honor."],["Oh Dios, rico en amor y ternura.","Con nuestras fuerzas renovadas,","te pedimos que,","a imitación de Jesús, que se dio a sí mismo como alimento,","también nosotros sepamos avanzar por el camino del amor."]],"ord20":[["Oh Dios, esperanza nuestra,","que invitas a todos los hombres al banquete de la salvación.","Te pedimos","que nos alimentes abundantemente por medio de esta celebración","para que podamos ofrecerte de todo corazón alabanzas y acción de gracias."],["Oh Dios, generoso en dones y gracias.","Jesús nos dijo: «El que come este pan vivirá para siempre».","Haz que todos los que recibimos este alimento","vivamos en el amor de Cristo."],["Oh Dios, dador de la vida.","Habiendo saboreado el gozo de compartir","la auténtica comida y la auténtica bebida,","te pedimos","que, fortalecidos por Cristo, que está siempre con nosotros,","la vida de cada uno de nosotros sea un canto de alabanza para ti."]],"ord21":[["Oh Dios, fuente de la alegría.","Tu palabra es luz que ilumina a los que creen.","Dirígenos hoy una vez más tu palabra poderosa,","para que, renovando constantemente la fe de nuestro corazón,","perseveremos en el seguimiento de Cristo."],["Oh Dios, fuerza de los que creen.","Fortalecidos con tu palabra de vida eterna,","te pedimos que, por el sacramento que ahora celebramos,","quedemos estrechamente unidos","al misterio de la muerte y resurrección de tu Hijo Jesús."],["Oh Dios, que nos das abundantemente tu vida.","Te pedimos que los que formamos un solo cuerpo en Cristo","seamos servidores los unos de los otros,","y así podamos seguir recorriendo todos juntos el camino de la fe."]],"ord22":[["Oh Dios todopoderoso y eterno,","que por medio de tu Hijo Jesús","nos has manifestado tu voluntad.","Haz que hoy nosotros volvamos una vez más a ti","y encontremos en tu palabra el alimento de nuestra vida."],["Oh Dios, que renuevas todas las cosas.","Tu Hijo Jesús se entregó él mismo","para purificarnos del pecado.","Te pedimos que este banquete de tu mesa","nos una más profundamente a la ofrenda de Cristo."],["Oh Dios, fuerza de los que creen en ti.","Guíanos con tu mano poderosa","en esta semana que comienza,","de manera que, discerniendo lo que es realmente importante,","vivamos en la sociedad procurando realizar tu voluntad."]],"ord23":[["Oh Dios, esperanza de todos los hombres,","que, enviando a tu Hijo Jesús,","nos liberaste de la angustia y el sufrimiento.","Abre hoy nuestros oídos","para que escuchen tu palabra salvadora,","y abre también nuestros labios","para que sepan cantar tu alabanza."],["Oh Dios, rico en amor y misericordia,","que en la muerte y resurrección de Jesús","nos revelaste la fuerza de tu salvación.","Te pedimos que, al celebrar la Pascua del Señor,","saboreemos profundamente el gozo de estar unidos a él."],["Oh Dios, fuente de la salvación.","Dirige nuestras vidas","de manera que podamos compartir con todos","el gozo de sentirnos vivificados por la vida de Cristo,","y que nuestra vida de cada día","se convierta en un canto de alabanza a ti."]],"ord24":[["Oh Dios, fuente de la salvación.","Tu Hijo Jesús, a través del dolor y de la cruz,","nos mostró el camino para seguirte.","Ilumina con tu palabra","a los que proclamamos a Jesús como salvador,","y haz que, sin perdernos en las tinieblas,","vayamos recorriendo el camino hacia ti."],["Oh Dios, que derramas tu amor sin medida.","Aumenta nuestra fe y únenos a Cristo,","que, a través del sufrimiento,","se encaminó hacia la vida de la resurrección."],["Oh Dios, que llenas nuestras vidas con la fuerza de la salvación.","Mantén con tu gracia","a los que participamos juntos de tu vida,","y haz que tengamos siempre presente","el amor que nos has mostrado en la muerte de Jesús,","y así podamos dar un testimonio firme de nuestra fe."]],"ord25":[["Oh Dios,","que derramas a manos llenas tu gracia sobre nosotros.","Tú diste al mundo como salvador a tu Hijo Jesús.","Te pedimos que, por medio de esta celebración,","nos acerquemos a Cristo,","que, abajándose, se hizo servidor de todos."],["Padre nuestro, rico en amor y ternura.","Los que en torno a tu mesa","celebramos la muerte y resurrección de Jesús","te pedimos que nos unas fuertemente a él,","que se entregó a sí mismo sin medida."],["Oh Dios, fuente del amor y de la misericordia.","Unidos a Cristo, que vino a servir,","te pedimos que nos ayudes a ser servidores los unos de los otros","y a perdonarnos mutuamente,","para que nuestra vida sea una fuerza","que ayude a construir la paz en el mundo."]],"ord26":[["Oh Dios, esperanza de los que creen en ti.","Cuando derramaste tu Espíritu sobre nosotros,","nos constituiste como tu único pueblo.","Te pedimos que los que en tu nombre nos reunimos aquí","sepamos aceptarnos mutuamente","y cantarte con un solo corazón."],["Oh Dios, rico en gracias y dones.","Acepta la oración que, unidos a la ofrenda de Cristo, te presentamos","y haz que, recordando su amor por todos los hombres,","seamos colmados del gozo que nace del amor mutuo."],["Oh Dios, salvación de todos los hombres.","Llenos de tu Espíritu y con un solo corazón,","te pedimos que, siguiendo la palabra de Cristo,","seamos portadores del evangelio de la paz","en la sociedad actual."]],"ord27":[["Oh Dios, dador de la vida,","que quieres que los hombres vivamos no en la soledad y el aislamiento,","sino ayudándonos y sosteniéndonos mutuamente.","Derrama tu amor desbordante","sobre los que nos hemos reunido aquí, congregados en torno a Cristo."],["Oh Dios, rico en amor y cariño.","Derrama tu bendición","sobre los reunidos en torno a tu mesa.","Que el amor de Cristo, que se ofreció a sí mismo sin medida,","sea el vínculo que nos una a los unos con los otros."],["Oh Dios, que eres el amor.","Fortalecidos por Cristo, que está siempre con nosotros,","te pedimos","que formemos una única familia vivificada por tu amor."]],"ord28":[["Oh Dios, dador de la sabiduría que supera todo conocimiento.","Tu palabra actúa poderosa a lo largo de todos los tiempos.","Ilumina nuestros corazones con la luz del evangelio","y haz que no nos aferremos a los bienes inmediatos."],["Oh Dios, rico en dones y gracias.","Fortalecidos con tu palabra de salvación y llenos de esperanza,","te pedimos que todos los que celebramos la ofrenda de Cristo","seamos también asociados a su vida nueva en la resurrección."],["Oh Dios, misericordioso y compasivo.","Unidos a la vida de Cristo","y vivificados por tu amor, que supera cualquier bien,","te pedimos que podamos recorrer con gozo en el corazón","la senda de su seguimiento."]],"ord29":[["Oh Dios, rico en dones y gracias.","Tu Hijo Jesús ofreció su propia vida","por la salvación de todos.","Haz que nosotros, incluso en el sufrimiento y la prueba,","sepamos descubrir la esperanza","en la cruz de Cristo."],["Oh Dios, Padre de todos los hombres.","Nos acercamos a tu mesa","con el gozo de sentirnos invitados a ella.","Te pedimos que la celebración de la muerte y resurrección de Jesús","haga crecer en nosotros","una actitud pronta a la propia ofrenda."],["Oh Dios, fuerza de los que creen en ti.","Unidos y formando un solo cuerpo en Cristo,","te pedimos que,","haciéndonos hermanos y hermanas unos de otros,","lleguemos a compartir sinceramente las alegrías y las penas."]],"ord30":[["Oh Dios, lleno de amor y misericordia.","Escucha nuestras voces que, desde la angustia y el dolor,","claman a ti esperando la salvación.","Te pedimos que, por medio de esta celebración,","los que confiamos en ti sepamos discernir y aceptar","la guía de Jesús."],["Oh Dios, santo y a la vez cercano.","Cuida de este pueblo tuyo","que has reunido para tu servicio,","y haz que, junto con Cristo, sumo sacerdote,","también nosotros ofrezcamos todo lo que somos."],["Oh Dios todopoderoso,","que nos alimentas con comida abundante","y nos sanas en el cuerpo y en el espíritu.","Ayúdanos a compartir con los demás este gozo."]],"ord31":[["Oh Dios, fuente del amor.","Jesús, tu Hijo, nos mostró con palabras y obras","el camino que lleva a la vida.","Te pedimos que su palabra","resuene con insistencia en el corazón de los que nos reunimos","buscando la forma verdadera de vida."],["Oh Dios de amor y ternura sin fin.","Llenos de gozo por poder sentarnos a tu mesa,","te pedimos vivir el amor a ti y a los hombres,","para que así nos sintamos unidos a Cristo,","que se ofreció él mismo sin reserva."],["Oh Dios, rico en dones y gracias.","Tú, por medio del pan de este sacramento,","nos unes mutuamente en Cristo.","Haz que vivamos su amor","en nuestra vida de cada día."]],"ord32":[["Padre compasivo y misericordioso.","Tú conoces bien el corazón ferviente de los que te suplican.","Derrama tu bendición sobre nosotros,","congregados en una misma esperanza en ti,","y haz que, estimulados por tu palabra,","podamos ofrecerte nuestra vida de cada día."],["Oh Dios, dador de la vida.","Fortalece a los que nos hemos reunido aquí","en torno a tu mesa de salvación.","Haznos gustar en profundidad el amor de Cristo","—que se dio a sí mismo del todo y sin reservas—","y así sentirnos llenos del gozo de nuestra propia ofrenda."],["Oh Dios y Padre nuestro.","Compartiendo el mismo gozo de estar unidos a Cristo,","te pedimos que, dejándolo todo en tus manos,","vivamos con corazón gozoso","una vida llena de sentido."]],"ord33":[["Oh Dios único y verdadero,","que convocas a todos los hombres para formar una única familia.","Ilumina los corazones de los que nos hemos reunido aquí,","y haz que pongamos toda nuestra confianza","en la palabra de Cristo, que nunca pasa."],["Oh Dios, que por medio de la muerte en cruz de tu Hijo Jesús","nos has liberado del pecado.","Atiende las súplicas","de los que conmemoramos la entrega de Cristo","y haznos partícipes del banquete eterno con todos los hombres."],["Oh Dios, que nos das la vida eterna.","Unidos en la palabra y el cuerpo de Cristo,","te pedimos que, hasta que llegue su vuelta gloriosa,","la Iglesia sea signo de amor y de esperanza."]],"rei":[["Oh Dios, todopoderoso y eterno,","que, resucitando a Cristo de entre los muertos,","lo constituiste rey para que gobierne todas las cosas con amor.","Guía y dirige a los que, respondiendo a tu llamada,","nos hemos congregado con un solo corazón,","y danos la fuerza que necesitamos","para trabajar en la construcción de tu reino."],["Oh Dios, que desbordas de gracia.","Por medio de la muerte y resurrección de Cristo,","tú has liberado del pecado a todos los hombres.","Te pedimos","que, por medio del banquete que conmemora su Pascua,","nos llenes de tu amor y de tu perdón."],["Oh Dios, fuerza de los que creen en ti.","Unidos estrechamente a Cristo,","te pedimos que, siguiéndolo a él como rey de la paz,","trabajemos con todas nuestras fuerzas","en la construcción de tu reino."]]},"C":{"adv1":[["Oh Dios, lleno de justicia y amor.","Despierta los corazones de los que,","confiados en tu promesa salvadora,","esperan que llegue su liberación.","Haz que, con nuestros ojos fijos en Cristo,","luz de nuestra esperanza,","sigamos recorriendo con gozo nuestro camino cristiano."],["Oh Dios, rico en dones y gracias.","Mientras esperamos con alegría nuestra salvación,","te pedimos que nos hagas conocer profundamente","la grandeza del amor que nos has mostrado","al darnos a tu Hijo."],["A los que nos has saciado con el pan de la vida,","envíanos, Señor,","para que podamos compartir","la esperanza y el gozo que de ti hemos recibido","con todos los que encontramos en nuestra vida de cada día."]],"adv2":[["Oh Dios, rico en amor y misericordia.","El resplandor de tu gloria ilumina a todos los hombres","y transforma en alegría su tristeza.","Haz que nosotros, que hemos conocido el camino de la salvación,","sigamos por la senda de tu amor","hasta alcanzar la plena unión con Cristo."],["Oh Dios, creador de todas las cosas,","que mantienes y cuidas toda vida.","A todos los que celebramos hoy la Cena del Señor","concédenos la gracia de saborear plenamente","el gozo de sentirnos vivificados por ti."],["Oh Dios, fuente de la salvación.","Unidos en el Cuerpo de Cristo te pedimos que","los que hemos puesto nuestra confianza en tu palabra","podamos recorrer con gozo y entusiasmo el camino de Jesús."]],"adv3":[["Oh Dios, fuente de la esperanza,","que estás siempre a nuestro lado.","Nos hemos reunido en torno a ti mientras esperamos a Cristo.","Haz de nosotros un solo corazón en la unidad de tu Espíritu,","para que, llenos de alegría,","no dejemos nunca de alabarte."],["Padre nuestro, lleno de ternura y amor.","Llena de tu Espíritu","a los que nos reunimos en torno a tu mesa,","para que saboreemos profundamente","el amor de Cristo, que está con nosotros."],["Oh Dios, fuente de la vida.","Guía a los que acabas de alimentar en la mesa del Señor.","Haz que compartamos con todos","el gozo que de ti hemos recibido","y anunciemos al mundo la visita de tu salvación."]],"adv4":[["Oh Dios misericordioso y compasivo,","que tienes predilección por los pequeños.","Tú enviaste a tu Hijo","y colmaste de bendiciones a los que tenían hambre y sed de salvación.","Haz que nosotros, que acogemos con gozo su nacimiento,","nos sintamos también unidos a él en nuestra propia vida."],["Oh Dios, rico en dones y gracias.","Te presentamos estos dones,","con los que nosotros mismos","nos ponemos en tus manos.","Concédenos que, al celebrar la muerte y resurrección de Cristo,","saboreemos profundamente","el amor que nos has mostrado al enviarnos a tu Hijo."],["Oh Dios, que derramas tu amor sobre todos los hombres.","Llena con tu Espíritu","a los que somos enviados al despedirnos de esta celebración.","Haz que compartamos con todos","el gozo que sentimos al celebrar el nacimiento de Cristo."]],"qua1":[["Oh Dios todopoderoso.","Tu Hijo Jesús, venciendo toda tentación,","siguió el camino de la fidelidad y la obediencia a ti","hasta la muerte en cruz.","Fortalécenos con tu gracia al comenzar la Cuaresma,","para que, renovando nuestra fe y esperanza en la resurrección,","podamos seguir con Jesús el camino que él siguió."],["Oh Dios, generoso en dones y gracias.","Concédenos que, vivificados por tu palabra,","saboreemos profundamente","el misterio de la muerte y resurrección del Señor."],["Oh Dios, esperanza de los que creen en ti.","Llena con tu Espíritu y defiende de toda tentación","a los que por la comunión estamos unidos a Cristo,","y concédenos vivir cada día en acción de gracias","el camino de la conversión."]],"qua2":[["Oh Dios, fuente de la salvación,","que a través de la pasión llevaste a tu Hijo Jesús a la gloria.","Fortalece nuestra esperanza y nuestro ánimo","para que sigamos las huellas de Cristo en
