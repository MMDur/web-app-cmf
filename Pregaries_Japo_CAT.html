<meta name="apple-mobile-web-app-title" content="Pregàries Japó">
<meta name="application-name" content="Pregàries Japó">
<meta name="theme-color" content="#7B1E2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F3; --surface:#FFFFFF; --ink:#2B2124; --muted:#6F6266; --line:#E6DCD6;
  --garnet:#7B1E2E; --garnet-soft:#F3E6E7; --gold:#A8833A;
  --c-v:#6C4A8C; --c-p:#C47A98; --c-w:#C9A646; --c-g:#4F7B4C; --c-r:#A3322C;
  --fs:19px;
  --serif-d:"Cormorant Garamond", Garamond, "Times New Roman", serif;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1416; --surface:#241C1F; --ink:#EEE6E2; --muted:#A99C9F; --line:#3A2F33;
    --garnet:#E0939D; --garnet-soft:#3A2228; --gold:#D6B46E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1416; --surface:#241C1F; --ink:#EEE6E2; --muted:#A99C9F; --line:#3A2F33;
  --garnet:#E0939D; --garnet-soft:#3A2228; --gold:#D6B46E; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;
  padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
a{color:var(--garnet)}

/* Capçalera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:.45rem;padding:.6rem 1rem}
.logo{flex:none;width:40px;height:40px;border-radius:10px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--serif-d);font-weight:700;font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.05;margin:0;color:var(--garnet)}
.brand p{margin:0;font-size:.78rem;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:38px;height:38px;padding:0 .6rem;
  display:inline-flex;align-items:center;justify-content:center;font-size:.9rem}
.icon-btn[aria-pressed="true"]{background:var(--garnet);color:var(--bg);border-color:var(--garnet)}

main{max-width:760px;margin:0 auto;padding:1rem 1rem 2rem}

/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.55rem .2rem .6rem;text-decoration:none;color:var(--muted);font-size:.78rem}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--garnet);font-weight:500}

/* Fitxa del diumenge */
.sunday{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem 1.2rem 1.5rem;overflow:hidden}
.sunday::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--season,var(--c-g))}
.when{font-size:.88rem;color:var(--muted);margin:0 0 .15rem}
.sunday h2{font-family:var(--serif-d);font-weight:600;font-size:2rem;line-height:1.1;margin:0 0 .35rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-size:.85rem}
.pill{border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;color:var(--muted)}
.pill.cyc{border-color:var(--garnet);color:var(--garnet);font-weight:500}
.note{margin:.8rem 0 0;padding:.65rem .8rem;border-radius:10px;background:var(--garnet-soft);font-size:.9rem}
.note p{margin:0 0 .4rem}.note p:last-child{margin:0}
.linkbtn{background:none;border:none;padding:0;color:var(--garnet);text-decoration:underline;text-underline-offset:3px}

/* Pregàries */
.prayers{margin-top:1.2rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.2rem 0 1rem}
.toolbar .sp{flex:1}
.prayer{padding:1rem 0 1.2rem;border-top:1px solid var(--line)}
.prayer:first-of-type{border-top:none}
.prayer-h{display:flex;align-items:baseline;gap:.5rem;margin:0 0 .55rem}
.prayer-h h3{flex:1;margin:0;font-family:var(--serif-d);font-style:italic;font-weight:600;font-size:1.25rem;color:var(--garnet)}
.copy{border:none;background:none;color:var(--muted);font-size:.8rem;padding:.2rem .3rem;border-radius:6px}
.copy:hover{color:var(--garnet)}
.text{font-size:var(--fs);line-height:1.68;max-width:38em}
.text span{display:block;padding-left:1.2em;text-indent:-1.2em}
.text span:first-child{font-weight:500}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.2rem}
.pn button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;text-align:left;min-height:56px}
.pn button:last-child{text-align:right}
.pn small{display:block;color:var(--muted);font-size:.75rem}
.pn button:disabled{visibility:hidden}

/* Seccions */
.sec-h{font-family:var(--serif-d);font-weight:600;font-size:1.4rem;margin:1.6rem 0 .6rem;display:flex;align-items:center;gap:.5rem}
.sec-h:first-child{margin-top:.4rem}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--season);flex:none;display:inline-block}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--garnet);border-radius:999px;overflow:hidden}
.seg button{border:none;background:none;padding:.45rem 1.1rem;color:var(--garnet);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--garnet);color:var(--bg)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:.45rem}
.chips button{height:48px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.05rem}
.chips button.wide{grid-column:span 3}
.chips button.cur{border-color:var(--garnet);box-shadow:inset 0 0 0 1px var(--garnet);color:var(--garnet);font-weight:600}
.hint{color:var(--muted);font-size:.88rem;margin:.3rem 0 0}

/* Calendari */
.yearbar{display:flex;align-items:center;gap:.5rem;margin:.2rem 0 1rem}
.yearbar h2{flex:1;margin:0;text-align:center;font-family:var(--serif-d);font-weight:600;font-size:1.35rem;line-height:1.15}
.yearbar h2 small{display:block;font-family:var(--serif);font-size:.8rem;color:var(--muted);font-weight:400}
.cal{list-style:none;margin:0;padding:0}
.cal-m{font-family:var(--serif-d);font-style:italic;font-size:1.15rem;color:var(--muted);margin:1rem 0 .3rem}
.cal li button,.cal li .row{width:100%;display:grid;grid-template-columns:3.6rem 10px 1fr auto;gap:.65rem;align-items:center;
  background:none;border:none;border-bottom:1px solid var(--line);padding:.6rem .2rem;text-align:left}
.cal li button:hover{background:var(--garnet-soft)}
.cal .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.cal .n{line-height:1.3}
.cal .n small{display:block;color:var(--muted);font-size:.8rem}
.cal .go{color:var(--garnet);font-size:.85rem}
.cal li.now button,.cal li.now .row{background:var(--garnet-soft);border-radius:8px}
.cal .miss{color:var(--muted);font-size:.78rem;font-style:italic}

/* Cerca */
.search{width:100%;font:inherit;font-size:1.05rem;padding:.7rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.results{list-style:none;padding:0;margin:1rem 0 0}
.results button{width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:.7rem .2rem}
.results b{font-weight:600}
.results .sn{display:block;color:var(--muted);font-size:.92rem;margin-top:.15rem}
mark{background:#F1DFA8;color:inherit;border-radius:2px}
[data-theme="dark"] mark{background:#6B5420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:#6B5420}}

details.about{margin-top:2rem;border-top:1px solid var(--line);padding-top:1rem;color:var(--muted);font-size:.92rem}
details.about summary{cursor:pointer;color:var(--garnet);font-family:var(--serif-d);font-size:1.15rem;font-weight:600}
.datepick{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:1rem 0 0;font-size:.9rem;color:var(--muted)}
.datepick input{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.8rem;background:none;border:none;color:var(--garnet);padding:0;font-size:.95rem}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:.5rem .9rem;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* Mode altar: només el text */
body.altar header.top,body.altar nav.tabs,body.altar .back,body.altar .pn,body.altar .datepick,body.altar details.about,body.altar .copy{display:none}
body.altar{padding-bottom:2rem}
body.altar .toolbar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:.4rem 0;margin-bottom:.4rem}
@media print{header.top,nav.tabs,.toolbar,.pn,.copy,.back,.datepick,details.about{display:none!important}body{padding:0}.sunday{border:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
const DATA = {"A":{"adv1":[["Oh Déu, Pare nostre.","Vós esteu sempre amb el qui espera i busca la salvació.","Il·lumineu amb la vostra llum els nostres cors","a l’inici de l’Advent,","perquè en un món en què no cessen","les lluites i confrontacions,","sapiguem caminar posant la nostra confiança","en la llum de Crist."],["Oh Déu, ric en dons i en gràcies.","Mentre esperem joiosament la nostra salvació,","us demanem que ens feu tastar profundament","la grandesa del vostre amor quan ens doneu el vostre Fill."],["Sadollats amb el pa de la vida,","envieu-nos Senyor, perquè puguem compartir,","amb tots els que trobem en la nostra vida diària,","l’esperança i alegria que de vós hem rebut."]],"adv2":[["Oh Déu, que cuideu amb afecte de totes les coses","i no pareu de desitjar i esperar la conversió de cadascú.","Ompliu amb el vostre Esperit","els qui ens hem reunit aquí en el nom de Crist,","perquè amb un cor renovat","no deixem mai d’esperar el Salvador","que duu al món un amor sense límits."],["Oh Déu, creador de totes les coses,","que sosteniu i conreeu tota vida.","A tots els qui celebrem avui el Sopar del Senyor","feu-nos la gràcia de tastar profundament","el goig d’estar vivificats per vós."],["Oh Déu, font de la salvació.","Units en el Cos de Crist us demanem que,","posant la nostra confiança en la vostra paraula,","puguem fer amb goig i entusiasme el camí de Jesús."]],"adv3":[["Oh Déu compassiu i misericordiós,","fonament de la nostra existència.","Els nostres cors desborden d’alegria","per la bona notícia del naixement del nostre salvador.","En aquest moment de gràcia, obriu els ulls del nostre cor","i feu-nos descobrir la vostra llum que brilla en la foscor.","Obriu les nostres oïdes","i feu-nos dòcils a la veu de la vostra crida."],["Pare nostre, ple d’amor i de tendresa.","Ompliu del vostre Esperit","els qui ens trobem aplegats al voltant de la vostra taula,","de manera que assaborim profundament","l’amor del Crist que és amb nosaltres."],["Oh Déu, font de la vida.","Conduïu els que acabeu d’alimentar a la taula del Senyor.","Feu que compartim amb tothom l’alegria","que de vós hem rebut","i anunciem al món la visita de la vostra salvació."]],"adv4":[["Oh Déu, que sempre sou amb nosaltres.","Vós ens heu enviat el vostre Fill com a salvador del món.","Us demanem que tots els qui esperem","la propera festa del seu naixement","sapiguem descobrir en la petitesa de l’infant nounat","la llum de l’amor i de l’esperança."],["Oh Déu, ric en dons i en gràcies.","Us presentem aquestes ofrenes amb les quals","nosaltres mateixos ens posem a les vostres mans,","i us supliquem que, en celebrar la mort i resurrecció de Crist,","tastem profundament l’amor amagat","en l’enviament del vostre Fill."],["Oh Déu que vesseu el vostre amor sobre tots els homes.","Ompliu amb el vostre Esperit","els qui per vós som enviats en acabar aquesta celebració.","Feu que compartim amb tothom","l’alegria experimentada","en la celebració del naixement de Crist."]],"qua1":[["Oh Déu, font de la vida.","Jesús, experimentant la prova en el desert,","ens va ensenyar el camí per vèncer les temptacions del mal.","Guieu-nos a nosaltres, que iniciem la quaresma,","perquè puguem viure cada dia vivificats per la vostra paraula."],["Oh Déu, generós en dons i gràcies.","Concediu-nos que, vivificats per la vostra paraula,","assaborim profundament el misteri","de la mort i resurrecció del Senyor."],["Oh Déu, esperança dels qui creuen en vós.","Ompliu amb el vostre esperit i defenseu de tota temptació","els qui per la comunió estem units a Crist,","i concediu-nos viure dia a dia el camí de conversió","en acció de gràcies i alegria."]],"qua2":[["Oh Déu, font de tota llum,","que convideu tots els homes a la salvació.","Ens hem reunit aquí, responent a la vostra crida:","concediu-nos la gràcia de renovar de debò","el nostre compromís de seguir el Crist","en el seu camí cap a la creu."],["Oh Pare, que ens embolcalleu i il·lumineu amb la vostra la llum.","Enfortiu en la fe i en l’amor","els qui convideu a la taula del Crist,","perquè una vegada més","puguem celebrar amb alegria el misteri de la salvació."],["Oh Déu, Pare nostre.","Gràcies per aquesta estona passada en companyia de Jesús","i pel do d’haver-nos unit més estretament a ell.","Concediu-nos que aquest temps de quaresma","ens ajudi a seguir el Crist","i ens porti a treballar per la salvació de tots."]],"qua3":[["Oh Déu, font de la salvació.","Vós heu enviat el vostre Fill Jesús","com a aliment i beguda","que saciés la nostra fam i la nostra set.","Quan, cansats i assedegats,","perdem l’alegria i l’esperança,","renoveu les nostres forces amb l’aigua de la vida","i ajudeu-nos a aixecar-nos i continuar el nostre camí."],["Oh Déu, compassiu i misericordiós,","que rebeu amb alegria tot aquell que, penedit, torna a vós.","Us demanem que, en commemorar l’oferiment de Crist,","us puguem adorar a vós en esperit i en veritat."],["Oh Déu, ric en amor i tendresa.","Jesús, avançant-se, adreçà la paraula a la samaritana","i va tractar de calmar la set del seu cor.","Feu que nosaltres, units a Crist,","visquem l’abundor del vostre amor","per damunt de totes les barreres que separen els homes."]],"qua4":[["Oh Déu, que dirigiu el món amb la força del vostre amor.","Vós ens heu enviat Jesús com a llum veritable d’aquest món.","Us demanem que, creient en ell i fixant en ell la nostra mirada,","puguem vèncer com a fills de la llum la força de les tenebres."],["Oh Déu, que amb la vostra providència guieu tots els homes.","Il·luminats amb la vostra paraula salvadora us demanem que,","mitjançant aquest banquet d’acció de gràcies,","assaborim la profunditat del vostre amor","i quedem plenament enfortits amb un ànim nou."],["Oh Pare, que ens inundeu abundosament amb la vostra gràcia.","El vostre Fill Jesús va vessar la llum del vostre amor","sobre tots els homes.","Us demanem que nosaltres, units a ell,","sapiguem agrair la gràcia rebuda","i donem un testimoniatge decidit de la nostra fe."]],"qua5":[["Oh Déu, misericordiós i compassiu,","vós ens heu salvat de la mort mitjançant Jesucrist.","Omple la vostra església amb l’alegria d’una vida nova,","i renova-la juntament amb els qui en aquesta quaresma","es preparen per a rebre el baptisme."],["Oh Déu, desbordant de gràcies envers els teus fills.","Vessa la vostra benedicció","sobre els qui ens asseiem a la taula del Senyor.","i feu que el nostre cor s’assembli, una mica més, al de Crist,","el qual, oferint-se a si mateix,","va viure el pas de la mort a la vida."],["Oh Déu, que governes totes les coses amb el vostre amor.","En el vostre Fill Jesús ens heu mostrat","la força de l’amor que venç la mort.","Feu que siguem capaços d’anunciar en l’alegria","aquest amor vostre que mai no canvia."]],"pas3":[["Oh Déu, font de l’esperança,","que gràcies a la resurrecció de Crist","ens heu mostrat el camí cap a una vida nova.","Feu que obrim sempre el nostre cor a Crist,","que fa amb nosaltres la nostra vida de fe,","i puguem compartir amb tothom l’alegria de la salvació."],["Oh Déu, misericordiós i compassiu.","El Senyor Jesús està presidint la nostra celebració","i avui també ens convida a la taula del pa de vida.","Us demanem que, renovat el nostre cor de creients,","puguem participar abundosament en la vida de Crist."],["Oh Déu, que vesseu abundosament","la vostra gràcia sobre nosaltres.","Els qui ens heu nodrit amb la vida de Crist,","envieu-nos a la missió d’avui,","per tal que, cadascun en el seu lloc,","siguem testimonis del misteri pasqual del Senyor."]],"pas4":[["Oh Déu totpoderós,","que com a guia i pastor ens heu donat Jesús,","vencedor de la mort.","Concediu-nos que, quan ens trobem perduts","i sense nord a la vida,","sapiguem escoltar la veu de Jesús que ens crida a cadascú."],["Oh Déu misericordiós i compassiu.","Jesús, com a bon pastor, cuida de nosaltres,","ens pastura en prats d’herba fresca","i ens fa descansar a la vora de l’aigua.","Que els convidats al sopar del Senyor","assaborim pregonament aquesta gràcia."],["Oh Déu, font i dador de la vida.","Enfortiu-nos al començament d’una nova setmana,","perquè la nostra vida de cada dia","sigui una resposta a la crida del Crist."]],"pas5":[["Oh Déu, pare compassiu i misericordiós,","que, ressuscitant el vostre Fill Jesús,","ens mostreu el camí de la vida eterna.","Us demanem que, fins i tot enmig del perill i la incertesa,","el nostre cor estigui sempre orientat cap a vós."],["Pare sant,","ara que en aquesta taula celebrem amb alegria","la vida nova de la resurrecció,","feu de nosaltres un poble que us serveixi a vós,","i doneu-nos un cor semblant al de Jesús,","que es va oferir ell mateix per nosaltres."],["Pare, ple de tendresa i amor.","Després de sadollar-nos amb la nova vida,","vós ens envieu enmig del món.","Feu que siguem testimonis joiosos de Crist","que és el camí que ens porta cap a vós."]],"pas6":[["Oh Déu, misericordiós i compassiu.","El vostre Fill Jesús a l’Últim Sopar","va prometre als seus deixebles: «No us deixaré orfes».","Feu-nos la gràcia de viure sempre amb Crist","i d’estar sostinguts, en tota circumstància,","per l’Esperit Sant, que és la nostra ajuda."],["Pare misericordiós i compassiu.","El vostre Fill Jesús es va fer amic de tots","i ens va mostrar l’amor més gran","quan va donar la seva pròpia vida per nosaltres.","Feu que aquest sagrament","ens uneixi més estretament al seu amor."],["Oh Déu totpoderós.","Enfortits amb l’aliment de la vida eterna us supliquem que,","sostinguts per Crist, que està en nosaltres,","visquem la vida de cada dia amb amor i alegria."]],"ord2":[["Oh Déu, que estimeu el món","fins al punt de lliurar al vostre propi Fill.","Vós ens aplegueu, units en la llum de Crist.","Il·lumineu amb la resplendor d’aquesta llum","aquest món nostre, que sofreix les ferides del pecat,","i mostreu-li el camí de la vida."],["Oh Déu, que heu enviat el vostre Fill","per a llevar el pecat del món.","Feu que, per aquests dons que us oferim,","els nostres cors quedin units a vós","i rebin la força per treballar per la salvació."],["Oh Déu, que ens doneu abundosament la vostra gràcia.","Plens de la llum del Crist, us demanem","que sapiguem donar testimoniatge del vostre Fill Jesús","mitjançant la nostra vida."]],"ord3":[["Oh Déu, pare nostre.","Ens reunim enmig del fred hivern","per lloar-vos i donar-vos gràcies.","Avui el vostre Fill Jesús ens comunica,","un cop més, l’evangeli del vostre regne.","Feu que aquesta celebració nostra rebi la vostra llum","i la reflecteixi de tal manera,","que puguem il·luminar la foscor del món."],["Oh Déu, vós creeu i conserveu totes les coses.","Accepteu-nos a nosaltres amb aquests dons que us oferim","i feu que, tenint un sol cor i un sol esperit,","puguem viure el misteri de la mort i resurrecció del Crist."],["Oh Déu, Pare nostre,","que ens doneu contínuament la vostra vida i la vostra força.","Us demanem que, vivificats i moguts per elles,","puguem sentir-nos acompanyats per vós","al llarg d’aquesta setmana que comencem."]],"ord4":[["Oh Déu,","vivim en un món immers en el dolor.","Però, justament, enmig del sofriment","hi trobem la força de la vostra presència salvadora.","Ompliu-nos de l’alegria del vostre regne","a nosaltres que volem escoltar la bona notícia","que Jesús va proclamar a Galilea."],["Oh Déu, font de la vida.","Vós transformeu en aliment nostre","els fruits del nostre treball de cada dia que ara us presentem.","Feu que les nostres penes i sofriments","es transformin també en alegria."],["Oh Déu, que sadolleu els qui tenen fam i set.","Ara, tots junts, hem rebut de vós el nostre aliment.","Us demanem que els qui, encara avui,","es troben mancats del necessari,","puguin veure satisfeta la seva indigència."]],"ord5":[["Oh Déu, llum que il·lumina el nostre món.","Ens heu aplegat aquí com a sal de la terra i llum del món.","Us demanem que també avui,","formant un sol cor amb tots els altres,","puguem lloar la vostra misericòrdia i el vostre amor."],["Pare nostre, que vesseu la vostra llum sobre tota cosa.","Us presentem aquests dons,","fruit dels nostres pobres esforços de cada dia,","i us demanem que, per ells, ens uniu al misteri","de la mort i resurrecció de Crist."],["Oh Déu, pare nostre.","Plens de la vostra llum, us demanem","que ens feu assaborir profundament","la gràcia que de vós hem rebut,","i ens guieu per a acomplir amb alegria","la missió que ens encomaneu."]],"ord6":[["Oh Déu, que ens mostreu el camí de la vida.","Pel vostre Fill Jesús, vós heu portat a la plenitud","la llei que havíeu donat al poble de l’Antic Testament.","Il·lumineu amb la vostra saviesa els qui ens hem reunits aquí","i guieu-nos perquè puguem continuar caminant amb el Crist."],["Pare nostre, que ens heu ensenyat el camí de l’amor.","Ara que us oferim aquests dons,","us demanem que ens feu imitadors del vostre amor","que heu mostrat en la passió del vostre Fill Jesús."],["Oh Déu, que sempre doneu abundosament la vostra gràcia.","Enfortits pel sagrament rebut, us demanem","que ens concediu de discernir","quina és la vostra voluntat en la societat actual,","i que ens guieu per poder anar avançant pel vostre camí."]],"ord7":[["Pare nostre que, per mitjà del vostre Fill Jesús,","ens heu mostrat el vostre amor envers tothom.","Els qui ens trobem reunits aquí","us demanem que, en aquest món nostre,","tan propens a tancar-se sobre si mateix,","sapiguem expressar en les nostres vides","l’amor a vós i al proïsme."],["Pare sant,","el vostre Fill Jesús va pregar pels qui el crucificaven.","Nosaltres, tot oferint-vos aquests dons,","us demanem que, per ells, ens feu participar","de l’amor i el perdó del Crist."],["Pare compassiu i misericordiós,","units a Crist i plens del vostre Esperit,","us demanem que ens deslliureu de la rancúnia i de l’egoisme","i ens feu viure en el vostre amor."]],"ord8":[["Oh Déu, que amb la vostra vida nodriu tots els vivents.","Vós, que alimenteu els ocells del cel","i teniu cura de les flors del camp,","ens nodriu també i us preocupeu de nosaltres","sense oblidar-nos ni un sol moment.","Feu que tots els qui ens hem aplegat aquí,","sapiguem descobrir el vostre amor, present en totes les coses,","i fer créixer també la nostra confiança en vós."],["Us oferim, oh Déu, aquests fruits de la vida","que vós mateix heu creat,","i, units en un sol cor per donar-vos gràcies,","us demanem que sapiguem ser testimonis","el vostre amor i la vostra tendresa."],["Pare nostre, que coneixeu bé tot el que necessitem.","Us agraïm les gràcies rebudes; i també us demanem","que, recordant constantment el vostre amor","–que tantes vegades hem experimentat–,","tinguem amb nosaltres el Crist tot al llarg de la nostra vida."]],"ord9":[["Oh Déu, font de la salvació,","que ompliu de benediccions els qui creuen en vós.","Us demanem que els qui ens hem aplegat avui aquí,","obrim el nostre cor a la vostra paraula","i sapiguem mantenir ferma la confiança en vós."],["Oh Déu, força dels qui creuen en vós.","Accepteu-nos a nosaltres mateixos juntament amb aquests dons,","i doneu-nos la força de mantenir-nos fidels la vostra paraula."],["Oh Déu, que ens alimenteu i teniu cura de nosaltres.","Guardeu i protegiu els qui heu sadollat amb l’aliment de la vida.","Feu que, sostinguts per una fe sòlida en tota circumstància,","puguem avançar pel camí cristià","amb entusiasme i alegria."]],"ord10":[["Oh Déu, font de l’amor.","Vós convideu tothom al banquet de salvació,","i els doneu consol i esperança.","Dirigiu la vostra mirada sobre els qui ens hem aplegat aquí,","i, així com la pluja amara i fecunda la terra,","vesseu, vós també, el vostre amor i la vostra tendresa","sobre nosaltres."],["Oh Déu, pare de tots nosaltres.","Jesús convidava els pecadores i s’asseia a taula amb ells.","Us demanem que nosaltres,","que ens asseiem a la taula del Senyor,","siguem capaços de perdonar-nos mútuament."],["Oh Déu, que sou sempre amb nosaltres.","Enfortiu amb la vostra força","els qui heu alimentat amb el cos de Crist,","perquè, a imitació d’ell, que convidava els pecadors,","visquem amb el cor obert a tots els germans."]],"ord11":[["Oh Déu, que guieu sempre els nostres passos.","Vós cerqueu treballadors per a l’evangeli del vostre regne.","Ompliu-nos de la vostra benedicció, a nosaltres que,","decidits a seguir el Crist, ens hem reunit aquí;","i refermeu-nos un cop més amb la vostra paraula."],["Oh Déu, només vós sou sant.","Accepteu aquests dons que us presentem de tot cor,","i feu que, responent a la vostra invitació,","ens vegem enfortits per a treballar pel vostre regne."],["Oh Déu, font i donador de tota vida.","Afermeu amb la vostra gràcia","els qui heu alimentat a la taula del Senyor,","perquè les paraules i obres dels qui seguim Jesús","siguin bona notícia per a tothom."]],"ord12":[["Oh Déu, que us preocupeu fins i tot del més petit dels ocells.","Vós ens guardeu sempre i ens protegiu amb amor.","Us demanem que, vencent tot neguit i incertesa,","creixi cada dia la nostra confiança en vós."],["Oh Déu, vós sou el nostre pare.","Unim el nostre cor al de Jesús,","que va seguir el camí de la creu;","i, ara que ens disposem a rebre el pa de la salvació,","us demanem que ens ompliu de confiança en vós."],["Oh Déu, company nostre en la vida.","Plens de goig pel fet de compartir la vida de Crist,","us preguem que, units a ell,","fem de la nostra vida","un testimoni joiós i decidit de la nostra fe."]],"ord13":[["Oh Déu,","vós coneixeu prou bé el que nosaltres cerquem i necessitem.","Doneu-nos força per seguir buscant la forma autèntica de vida,","i feu que, en la invitació de Crist que ens diu:","«que cadascú prengui la seva creu i em segueixi»,","hi sapiguem trobar la veritable llum que guiï la nostra vida."],["Oh Déu, font de la salvació.","Envoltant la taula de l’altar, us demanem","que, units a Crist, que va seguir el camí de la creu,","puguem participar també en la vida de la resurrecció."],["Pare nostre, font de la vida.","Feu que assaborim profundament la gràcia del sagrament","que junts acabem de celebrar,","i que, com a seguidors de Crist,","visquem la nostra vida de cada dia amb goig al cor."]],"ord14":[["Pare nostre, Senyor del cel i de la terra.","El vostre Fill Jesús ofereix sempre el repòs","als qui se senten afeixugats pel jou de la vida.","Feu que, els qui ens hem reunit aquí,","sapiguem portar la pau de Crist","a un món aclaparat per les lluites i les dificultats."],["Oh Déu, que doneu aliment a tots els éssers vivents.","Juntament amb aquests dons,","accepteu també la nostra pregària.","Us demanem que els qui rebem el cos de Crist","imitem l’actitud del seu cor humil i senzill."],["Agraint la gràcia rebuda, us demanem, Pare,","que, tot assumint el jou de la vida,","com a deixebles que som de Crist","sapiguem oblidar-nos de nosaltres mateixos","i esmerçar la nostra vida en bé de tothom."]],"ord15":[["Oh Déu, vós adreceu la vostra crida a tothom.","Com aquella gent a la vora del mar de Galilea,","també nosaltres escoltem avui la paraula de Jesús.","Feu que sapiguem acollir profundament en el nostre cor","aquest anunci joiós."],["Oh Déu, la vostra gràcia s’escampa sobre totes les coses.","Us lloem i us agraïm els fruits de la terra,","i us demanem que els qui hem sembrat la llavor evangèlica","ens unim més íntimament a Crist per mitjà d’aquest àpat."],["Pare compassiu i misericordiós.","Feu que, els qui participem en la vida del vostre Fill Jesús,","sapiguem compartir amb tothom aquesta gràcia","i en recollim fruits abundosos."]],"ord16":[["Oh Déu, que estimeu sol·lícitament totes les coses.","Vós sembreu en el món la bona llavor","i acompanyeu la seva creixença amb tendresa i paciència.","Us demanem","que tots nosaltres ens sapiguem estimar mútuament","i que, com a fills vostres estimats que som,","creixem en el vostre amor."],["Oh Déu, ple d’amor i de tendresa.","Després d’escoltar la vostra paraula","i de renovar el nostre cor,","us presentem els nostres dons,","i us demanem que, els qui celebrem el memorial de Crist,","contribuïm també a l’expandiment del vostre regne."],["Pare, ric en dons i gràcies,","que ens heu fet u en Jesucrist.","Ensenyeu-nos a no fixar-nos en els defectes dels altres,","i, en canvi, a saber descobrir","el vostre amor present i actuant en el nostre món."]],"ord17":[["Oh Déu, vós que sou amor,","ens manifesteu contínuament les riqueses del vostre regne.","Aplegats ara davant vostre, us demanem","que siguem capaços descobrir en la paraula de Crist","la vostra alegria i la vostra llum per a la nostra vida."],["Pare sant,","que ens convideu al banquet del vostre regne.","Feu que responguem promptament a la vostra invitació."],["Déu i Senyor nostre,","concediu-nos que sapiguem discernir","en la nostra vida de cada dia","allò que de debò té valor d’autèntic tresor,","i que amb cor decidit fem cas de la vostra paraula."]],"ord18":[["Oh Déu, que alimenteu amb la vostra gràcia","els qui tenen fam i set.","Us lloem pel vostre amor tan gran","i us demanem","que sapiguem escoltar i posar en pràctica la vostra paraula,","per tal de poder mantenir-nos en la vida veritable."],["Déu nostre.","Feu que avui, també nosaltres assaborim","el misteri del pa amb què Jesús","va satisfer la fam dels seus seguidors,","de manera que mitjançant aquest sagrament","ens unim més profundament al Crist."],["Oh Déu, de qui hem rebut la vida.","Alimentats amb el menjar veritable,","us demanem de poder compartir amb tothom","l’abundor que hem rebut en la paraula i el cos de Crist."]],"ord19":[["Oh Déu, que ens mireu amb tant d’amor.","Enfortiu els qui ens hem aplegat cercant la salvació.","Ajudeu-nos a superar les nostres angúnies i desesperances","i ompliu-nos de la vostra força","perquè sapiguem complir fidelment la vostra paraula."],["Oh Déu, que ens doneu el vostre amor","i ens manteniu amb el vostre alè.","Contents de trobar-nos a la taula del Senyor,","us demanem que, mitjançant el misteri que ara celebrem,","la paraula de Jesús ressoni i penetri en nosaltres,","de manera que s’enforteixi la fe del nostre cor."],["Oh Déu, que sou sempre amb nosaltres.","Tot agraint la gràcia rebuda, us demanem","que –en aquest món nostre, aclaparat per conflictes i ansietats– sapiguem anunciar el Crist amb fermesa i valentia."]],"ord20":[["Oh Déu, font de la salvació.","Accepteu complagut els desigs de tots els qui som aquí","i, malgrat que experimentem la nostra feblesa i defallença,","feu que ens mantinguem ferms","en l’esperança de la vostra salvació."],["Oh Déu, Pare de tots nosaltres.","Beneïu amb la vostra gràcia aquest banquet de pregària","i a tots els qui alimenteu, perquè són el vostre poble,","concediu-los d’apropar-se cada cop més al cor de Crist."],["Oh Déu, que ens concediu de participar en el do de la vida.","Ja que ens heu renovat les forces,","feu de nosaltres els vostres enviats","perquè puguem donar resposta als qui cerquen ajuda."]],"ord21":[["Oh Déu, que ens heu enviat el vostre Fill Jesús com a salvador.","Enfortiu la fe dels qui ens hem aplegat aquí,","per tal que, nodrits amb la vostra paraula,","donem un testimoniatge ben animós del Crist."],["Oh Déu, que per la mort i resurrecció de Crist,","ens heu obert el camí del vostre regne.","Convidats a la taula de la salvació i plens goig,","volem celebrar l’acció de gràcies formant un sol cor."],["Oh Déu, font de la vida.","Rebeu l’oració que us oferim en acció de gràcies","i concediu-nos que, units a Crist,","vencem la força del mal","i esdevinguem portadors de la bona nova de la salvació."]],"ord22":[["Oh Déu, pare nostre, que mitjançant el vostre Fill Jesús,","ens heu mostrat quin és el camí per a complir la vostra voluntat.","Feu que els qui ens hem aplegat aquí","trobem esperança quan ell ens parla","i plenitud quan fem amb ell el camí de la vida."],["Oh Déu, esperança dels qui sofreixen.","Enfortits amb la vostra paraula de salvació i plens de gratitud,","acudim a vós i us supliquem","que, a tots els qui commemorem la mort i resurrecció de Jesús,","ens feu forts per a portar la creu juntament amb ell."],["Oh Déu, font de la vida.","Plens de la vostra gràcia us demanem que, units a Crist,","sapiguem posar-ho tot a les vostres mans","i esmerçar la vida en bé dels altres."]],"ord23":[["Oh Déu, vós ens heu convocat","perquè, vivint com a germans i germanes, formem un sol poble.","Reunits en el nom de Crist, us demanem","que siguem capaços d’enriquir-nos els uns als altres","i d’avançar plegats pel mateix camí."],["Oh Déu, compassiu i misericordiós.","Aquí, entorn de la mateixa taula, us demanem","que, els qui unim el nostre amor al de Crist en el seu oferiment,","comprenguem que l’amor és la plenitud de tot."],["Oh Déu, que guieu contínuament el vostre poble.","Enfortits amb el pa de la vida","us supliquem que la vostra església","continuï sense parar la seva conversió cap a vós,","i, com a família vostra, mostri al món l’amor veritable."]],"ord24":[["Oh Déu, font de l’amor.","A aquest món nostre afligit per lluites i divisions","vós li heu mostrat el camí del perdó i la reconciliació.","Feu que nosaltres, com a seguidors del Crist,","sapiguem acceptar-nos mútuament","i així donar testimoni del vostre amor."],["Oh Déu, ric en amor i compassió.","Convertiu les nostres ofrenes","en signe de reconciliació i perdó veritables,","perquè, perdonant-nos de cor mútuament,","puguem asseure’ns a la taula del Senyor."],["Enfortits per la gràcia que acabem de rebre,","us demanem, Déu nostre,","que, sentint-nos sempre vivificats pel vostre amor,","puguem fer de la nostra vida de cada dia","una contínua acció de gràcies."]],"ord25":[["Oh Déu, que sempre sou al nostre costat.","El vostre pensament ultrapassa el nostre pensament,","la vostra mirada esguarda totes les coses","i el vostre amor no té fons ni té límit.","A tots els qui avui –reunits aquí–","adrecem vers vós els nostres cors,","feu que descobrim el vostre amor,","que val més que cap altra cosa."],["Oh Déu, que doneu a cadascú allò que necessitem.","Feu que aquest pa i vi que us oferim,","esdevinguin portadors de la vida autèntica."],["Oh Déu, pare nostre.","Envieu-nos avui un cop més,","perquè, enfortits amb l’aliment que ens heu donat,","puguem treballar pel vostre regne","cadascú en els nostres propis ambients."]],"ord26":[["Oh Déu, que guieu tota persona a actuar amb generositat.","Vós, que coneixeu els nostres sentiments més profunds,","acompanyeu-nos en el camí de la fe,","perquè puguem viure sempre amb el cor orientat cap a vós."],["Oh Déu, font de la vida.","Crist es va lliurar totalment ell mateix pel bé de tothom.","Us demanem que, per mitjà d’aquest àpat salvador,","puguem assaborir profundament l’amor del Crist."],["Oh Déu, que estimeu tots els homes i dones.","Units a Crist, i amb un cor humiliat,","us demanem que, amb la nostra vida,","puguem donar testimoniatge","del camí que fem en el teu seguiment."]],"ord27":[["Oh Déu, font de qui hem rebut la vida.","Vós guardeu i conreeu totes les coses,","perquè donin fruit abundós.","Feu que, tenint sempre el cor orientat i obert","a la vostra acció salvadora,","puguem respondre com cal a aquest amor vostre."],["Oh Déu, creador i suport de totes les coses.","Us presentem aquest pa i aquest vi, fruits de la terra,","i us supliquem","que, per a tots els qui –donant gràcies–","ens trobem a l’entorn de la vostra taula,","es facin abundosa realitat les obres de la vostra salvació."],["Us lloem i us donem gràcies, Pare,","i us demanem","que, plens de la vostra benedicció generosa,","donem fruits abundants en la nostra vida diària."]],"ord28":[["Oh Déu, font de l’esperança,","que convideu tothom a la taula del vostre regne.","Som aquí, davant vostre,","cadascú amb els seus neguits i esperances.","Feu que descobrim i assaborim el vostre amor,","i que hi corresponguem com cal de paraula i d’obra."],["Pare compassiu i misericordiós.","Beneïu aquesta taula que hem preparat amb molta il·lusió.","Us demanem que, tots els qui participem plegats","en el goig del misteri del vostre amor,","ens sentim sempre units a vós."],["Oh Déu, que camineu amb nosaltres pel camí de la vida.","Feu-nos tastar el goig de sentir-nos enviats per vós,","per tal que, compartint amb tothom la salvació de Crist,","els puguem convidar al banquet del vostre regne."]],"ord29":[["Oh Déu, que governeu tot l’univers","i guieu tots els homes i dones a la salvació.","Beneïu aquest poble vostre, aplegat per a lloar-vos ple de goig.","Graveu ben fort en els nostres cors","que solament vós sou el Senyor,","i obriu-nos a la vostra paraula salvadora."],["Oh Déu, creador de totes les coses.","Us presentem aquest pa i aquest vi que hem rebut de vós,","Us demanem que,","igual com Jesús sabé retornar-vos tot el que era vostre,","també nosaltres ho sapiguem fer avui","units íntimament al seu oferiment."],["Oh Déu, Senyor de totes les coses.","Us donem gràcies pel do de participar junts en la vida de Crist,","i us demanem que desvetlleu la nostra consciència","a la vostra justícia i al vostre amor,","perquè construïm un món de pau,","on sigui respectada la vida i la dignitat de totes les persones."]],"ord30":[["Oh Déu, vós ens heu enviat el vostre Fill Jesús,","perquè coneguéssim el vostre amor sense límits.","Feu que tinguem sempre presents els ensenyaments de Crist","i així puguem viure","una vida plena en l’amor a vós i a tothom."],["Oh Déu, font de l’amor.","Ara que ens disposem a recordar Jesús,","que va dur fins a l’extrem el seu amor","a vós i a tota la humanitat,","us demanem que, per aquesta participació","en el misteri de la seva mort i resurrecció,","lloem amb totes la nostres forces aquest triomf del seu amor."],["Oh Déu, fonament i suport de tots els homes i dones.","Feu-nos forts a tots els qui, units a Crist, ara serem enviats.","Que, moguts pel vostre amor,","puguem donar suport als qui necessiten ajut."]],"ord31":[["Oh Déu, el nostre únic pare.","Sense la vostra gràcia no podem donar-vos culte","amb docilitat de cor.","Feu-nos sentir el goig de viure com a fills vostres","a tots els qui, davant vostre,","ens sentim igualment petits i febles."],["Oh Déu,","que heu il·luminat la nostra vida amb la llum de l’evangeli.","Estem celebrant de cor","el misteri de la mort i resurrecció de Crist.","Us demanem que ens assemblem al vostre Fill,","que es va fer servidor fins a la mort de creu."],["Oh Déu, font de l’amor,","que ens feu sentir el goig de compartir el pa de la vida","i, vivificats amb aquest aliment, ens envieu al món.","Feu que ens fem de debò germans","de tots els qui se senten aclaparats pel pes de la vida."]],"ord32":[["Oh Déu totpoderós,","que actueu amb el vostre alè en la història humana","i porteu totes les coses a la seva plenitud.","Obriu els ulls dels qui ens hem aplegat aquí,","mestre esperem el retorn del Senyor,","i feu que sapiguem discernir el que ens cal fer ara i aquí."],["Oh Déu,","que ens heu donat el vostre Fill Jesús com a espòs.","Plens d’alegria","per haver-nos convidat al banquet de la salvació,","us demanem de poder participar dignament en aquest misteri","i de poder rebre Crist el Senyor."],["Déu i Pare nostre.","Units en la mort i vida de Crist Jesús,","us demanem que, fins i tot enmig de les tenebres","d’un món dominat per l’odi i la mentida,","sapiguem viure brandant la torxa de la fe i de l’amor."]],"ord33":[["Oh Déu, que vesseu abundosament la vostra gràcia","sobre cadascú de nosaltres.","Mira benvolent els qui, des del treball de la vida diària,","hem vingut en aquesta festa d’acció de gràcies","per correspondre a la vostra invitació.","Feu que trobem repòs a l’escalf del vostre amor","i renoveu-nos les ganes de viure més plenament el do de la vida."],["Oh Déu nostre,","el vostre Fill Jesús és per a nosaltres","el do més preciós que hem rebut de vós.","Us demanem que, mitjançant el sagrament que ell ens va deixar,","assaborim la profunditat del vostre amor."],["Oh Déu, que ens alimenteu","amb la paraula de la salvació i amb el pa de la vida.","Vós poseu a les mans de cadascú de nosaltres","aquest tresor que sou vós mateix.","Feu que, aprofitant com cal els dons rebuts,","aconseguim el goig d’estar sempre amb vós."]],"rei":[["Oh Déu, totpoderós i etern.","Totes les coses, creades per Crist,","es reuneixen i completen de nou en ell com a rei.","Us demanem que, els qui posem la nostra esperança","en la seva paraula i esperem la seva vinguda,","visquem fins a la fi dels temps, en l’amor que no passa mai."],["Pare compassiu i misericordiós,","que heu reconciliat totes les coses","en la mort i resurrecció del vostre Fill Jesús.","Celebrant entorn de la vostra taula aquesta gràcia de salvació,","ompliu fins a vessar els nostres cors del goig de la unitat."],["Oh Déu, ric en gràcies i dons.","Gràcies al perdó que hem rebut en aquest sagrament,","s’ha enfortit una vegada més la nostra unió amb el Crist.","Ara que som enviats al món,","us demanem que cadascú de nosaltres","sapiguem descobrir Crist en el germà necessitat,","siguem capaços de compartir el seu sofriment","i de sostenir-nos els uns als altres."]]},"B":{"adv1":[["Oh Déu, que vesseu sobre nosaltres la llum de l’esperança.","Obriu els ulls del nostre cor en aquest inici de l’Advent,","perquè sapiguem discernir la vostra voluntat","en la nostra vida de cada dia,","i la puguem viure seguint els passos de Crist Jesús."],["Oh Déu, ric en dons i gràcies.","Mentre esperem amb joia la nostra salvació,","us demanem que ens feu conèixer profundament","la grandesa de l’amor","que ens heu mostrat donant-nos el vostre Fill."],["Als qui ens heu sadollat amb el pa de la vida,","envieu-nos, Senyor,","perquè puguem compartir","l’esperança i el goig que de vós hem rebut,","amb tots els qui ens trobem en la nostra vida de cada dia."]],"adv2":[["Oh Déu, pare nostre, ple d’amor i misericòrdia.","A aquest món nostre, turmentat i adolorit.","vós li prepareu el camí de la salvació.","Vesseu abundosament el vostre Esperit","sobre els qui ens trobem reunits aquí,","perquè, girant-nos de cor cap a vós,","puguem fer camí juntament amb el Crist."],["Oh Déu, creador de totes les coses,","que manteniu i cuideu tota vida.","A tots els qui celebrem avui el Sopar del Senyor","concediu-nos la gràcia d’assaborir plenament","el goig de sentir-nos vivificats per vós."],["Oh Déu, font de la salvació.","Units en el Cos de Crist us demanem que,","els qui hem posat la nostra confiança en la vostra paraula,","puguem fer amb goig i entusiasme el camí de Jesús."]],"adv3":[["Oh Déu, pare de tots els homes.","Vós feu brillar la llum enmig de la tenebra","i mudeu en goig la tristesa.","Vesseu la llum de la fe i de l’esperança,","en els cors dels qui ens hem reunit aquí","i ompliu-nos de goig per la vinguda del Crist Jesús."],["Pare nostre, ple de tendresa i amor.","Ompliu del vostre Esperit","els qui ens apleguem entorn de la vostra taula,","per tal que assaborim profundament","l’amor del Crist que és amb nosaltres."],["Oh Déu, font de la vida.","Guieu els que acabeu d’alimentar en la taula del Senyor.","Feu que compartim amb tothom","el goig que hem rebut de vós","i anunciem al món la visita de la vostra salvació."]],"adv4":[["Oh Pare, Déu etern.","En enviar-nos el vostre Fill,","vau escollir María com a mare del Salvador.","Us demanem que nosaltres, fent com ella,","rebem Jesús amb amor i alegria","i visquem sempre units a ell."],["Oh Déu, ric en dons i gràcies.","Us presentem aquests dons,","amb els quals nosaltres mateixos","ens posem a les vostres mans.","Concediu-nos, que en celebrar la mort i resurrecció de Crist,","assaborim profundament","l’amor que ens heu mostrat en enviar-nos el vostre Fill."],["Oh Déu que vesseu el vostre amor sobre tots els homes.","Ompliu amb el vostre Esperit","els qui som enviats en el comiat d’aquesta celebració.","Feu que compartim amb tothom","el goig que sentim en la celebració del naixement del Crist."]],"qua1":[["Oh Déu, ric en amor i misericòrdia,","que convideu tothom a l’alegria del vostre regne.","En aquest inici de la quaresma us demanem que nosaltres,","(membres de l’Església que acull avui els catecúmens)","renunciem al mal i visquem creient de debò l’evangeli."],["Oh Déu, generós en dons i gràcies.","Concediu-nos que, vivificats per la vostra paraula,","assaborim profundament","el misteri de la mort i resurrecció del Senyor."],["Oh Déu, esperança dels qui creuen en vós.","Ompliu amb el vostre esperit i defenseu de tota temptació","els qui per la comunió estem units al Crist,","i concediu-nos de viure cada dia el camí de conversió","en acció de gràcies."]],"qua2":[["Oh Déu, ple de glòria i esplendor.","Vós vau assenyalar com a «fill estimat» vostre","aquell Jesús que s’encaminava cap a la passió.","Feu que nosaltres, que escoltem i seguim la seva paraula,","continuem fent –com a fills vostres– el camí de la nostra vida."],["Oh Pare, que ens envolteu i il·lumineu amb la vostra llum.","Feu més forts en la fe i en l’amor","els qui convideu a la taula de Crist,","perquè amb goig puguem celebrar una vegada més","el misteri de la salvació."],["Oh Déu, pare nostre.","Gràcies per aquesta estona que hem passat","en companyia de Jesús","i pel do d’haver-nos unit més estretament amb ell.","Concediu-nos que aquest temps de quaresma","ens ajudi a seguir el Crist","i ens dugui a treballar per la salvació de tothom."]],"qua3":[["Oh Déu, força dels qui esperen en vós.","El vostre Fill Jesús ens va ensenyar","–fins i tot arriscant la seva vida–","com hem de viure en l’amor envers vós.","Feu que nosaltres, que celebrem la litúrgia quaresmal","(acompanyant els qui es preparen per rebre el baptisme)","tornem cap a vós i aprofundim la fe i l’amor."],["Oh Déu, que heu establert amb nosaltres una aliança nova.","Per a nosaltres, seguidors de Jesús,","ja no hi ha ni temple ni ofrenes.","En commemorar en aquest sopar l’oferiment únic de Crist,","–que es va oferir ell mateix per nosaltres–,","uniu-nos fortament a vós, que sou la font de l’amor."],["Oh Déu, que amb la vostra vida abundosa","nodriu tots els qui creiem en vós.","Reunits com a cos de Crist en una sola església,","us demanem que vesseu sobre nosaltres un nou alè,","que ens faci esdevenir signe visible del vostre amor."]],"qua4":[["Oh Déu, font de tota gràcia,","que en la mort de Jesús a la creu,","ens mostràreu el vostre amor a tots els homes.","Feu que, posant la nostra esperança en Crist, llum de salvació,","visquem la nostra vida amb una fe ben animosa."],["Oh Déu, compassiu i misericordiós,","que vau estimar tant el món","que li vau donar el vostre propi Fill.","Concediu als qui ara celebrem plegats el sopar del Senyor","que tots i cadascú tastem intensament","la gràcia del vostre amor."],["Oh Déu, llum dels nostres cors.","Sadollats amb la plenitud del vostre amor","i com a fills de la vostra llum,","us demanem que puguem compartir amb tothom","el goig de creure en Jesús."]],"qua5":[["Oh Déu, pare nostre.","Portant al límit l’amor i l’obediència,","el vostre Fill Jesús va recórrer voluntàriament","el camí de la passió per a la salvació de tots.","Feu que també nosaltres,","posant en vós la nostra confiança,","puguem fer sense por el camí de Jesús."],["Oh Déu, font i donador de tota vida.","Us oferim de tot cor aquest pa,","–blat mòlt, pastat i cuit al foc–,","com a expressió de la vida i amor de Crist.","Que sigui per a nosaltres aliment de nova vida."],["Oh Déu, força de tots els qui creuen en vós.","Ompliu de la vostra llum els qui formem un sol cos en Crist,","perquè, fins i tot enmig del sofriment i de l’adversitat,","no perdem mai l’esperança i la fe en vós,","i transparentem en la nostra vida la llum del vostre amor."]],"pas3":[["Oh Déu, font de la salvació,","que mitjançant la resurrecció de Crist","heu alliberat el món del domini del pecat i de la mort.","Enfortiu amb la vostra paraula","els qui heu cridat i unit en un sol poble,","i feu que siguem testimonis de la resurrecció del Senyor."],["Oh Déu, misericordiós i compassiu.","El Senyor Jesús està presidint la nostra celebració","i avui ens convida a la taula del pa de la vida.","Us demanem que, renovat el nostre cor de creients,","puguem participar abundosament en la vida de Crist."],["Oh Déu, que vesseu la vostra gràcia sobre nosaltres.","Ara que ens heu alimentat amb la vida de Crist,","envieu-nos a la missió d’avui,","per tal que, cadascú en el seu lloc,","donem testimoniatge del misteri pasqual del Senyor."]],"pas4":[["Oh Déu, font de la vida.","Jesús, com a bon pastor,","va donar la seva vida per nosaltres amb un amor infinit.","Us demanem que, aplegats als seus peus amb un sol cor,","anem fent-nos cada dia més semblants al seu amor."],["Oh Déu misericordiós i compassiu.","Jesús, com a bon pastor, té cura de nosaltres,","ens pastura en prats deliciosos","i ens fa descansar vora l’aigua.","Que els convidats al sopar del Senyor","sapiguem assaborir pregonament aquesta gràcia."],["Oh Déu, font i donador de la vida.","Enfortiu-nos, ara que comencem una nova setmana,","perquè la nostra vida de cada dia","sigui la nostra resposta a la crida del Crist."]],"pas5":[["Oh Déu, font de la vida,","que no abandoneu mai el qui confia en vós,","sinó que el guieu i sosteniu.","Feu que els qui ens hem reunit com a cos de Crist,","formem un sol cor,","i fem més forts aquests vincles d’unitat i d’amor."],["Pare sant.","Ara que en aquesta taula celebrem amb goig","la vida nova de la resurrecció,","feu de nosaltres un poble que us serveixi a vós,","i doneu-nos un cor proper al de Jesús,","que es va oferir a si mateix."],["Pare, ple de tendresa i amor,","que ara envieu al món","els qui ens heu sadollat amb la nova vida.","Feu que siguem testimonis joiosos de Crist","com a Camí que condueix cap a vós."]],"pas6":[["Oh Déu, font de la vida.","Quan nosaltres mirem de viure en l’amor,","vós sou sempre al nostre costat.","En celebrar aquest diumenge la resurrecció de Jesús,","feu que trobem el goig veritable en la llei de l’amor."],["Pare misericordiós i compassiu.","El vostre Fill Jesús es va fer amic de tothom","i donant la seva pròpia vida per nosaltres,","ens va mostrar el súmmum de l’amor.","Feu que aquest sagrament es uneixi estretament al seu amor."],["Oh Déu, pare bo.","Enfortits amb l’aliment de la vida eterna","us supliquem que, sustentats per Crist que està en nosaltres,","visquem la vida de cada dia amb amor i alegria."]],"ord2":[["Oh Déu,","que feu sentir la vostra veu en el cor de cada persona.","El vostre Fill Jesús, enviat al món,","va proclamar l’evangeli amb la seva vida.","Us demanem que tots els qui avui obrim el cor","a la vostra paraula salvadora","arribem a descobrir el camí que duu a la vida."],["Oh Déu, que ens doneu abundosament","el vostre amor i el vostre afecte.","Com a resposta a aquest amor","que Jesús, el vostre Fill, ens donà,","concediu-nos de romandre també avui prop d’ell","i d’asseure’ns amb goig a la seva taula."],["Oh Déu, font de la vida.","Amb el goig experimentat en el sopar del Senyor,","us demanem que els qui hem rebut la vostra força a través d’ell, expressem en la nostra vida el goig que ens fa de seguir-lo."]],"ord3":[["Oh Déu, font de la vida.","Mireu amb ulls comprensius aquesta nostra fragilitat humana, que ens fa caure esclaus dels canvis constants d’aquest món.","Renoveu el cor dels qui ens hem aplegat aquí,","perquè caminem seguint les petjades de Jesús."],["Oh Déu, esperança dels qui es penedeixen.","Mireu amb bondat els qui, responent a la vostra crida,","ens hem reunit entorn de la vostra taula,","i feu que, unint els nostres cors a l’oferiment de Crist,","siguem capaços d’oferir-nos nosaltres mateixos."],["Oh Déu, font de l’alegria.","Alimentats i renovats amb la paraula de Crist","i amb el pa de vida,","us demanem que,","els qui som enviats a les tasques de la vida de cada dia,","siguem diligents en la construcció del vostre regne."]],"ord4":[["Oh Déu, que ens crideu a la conversió.","El vostre Fill Jesús –tot rebutjant el mal–","ens va mostrar la força il·limitada de la vostra salvació.","Vesseu l’alè i la força del vostre esperit","sobre els qui avui ens hem aplegat per lloar-vos."],["Oh Déu, que voleu la salvació de tots els homes i dones.","Enrobustits amb la vostra paraula","i plens d’esperança, us demanem","que enfortiu els qui heu reunit en el banquet de salvació","i ens feu assaborir el goig de servir-vos."],["Oh Déu, que ens heu unit en vós formant un sol cos.","Plens d’aquesta vida vostra us demanem","que amb tots els qui trobem en la nostra vida de cada dia","sapiguem compartir la paraula que Jesús proclamà","amb força i autoritat."]],"ord5":[["Oh Déu,","que vesseu sobre nosaltres la llum de l’esperança.","Vós enviàreu Jesús com a salvador","a un món turmentat i adolorit.","Us demanem que,","mitjançant els sagraments que avui celebrem,","nosaltres trobem el Crist que sana tots els homes."],["Oh Déu, que doneu la força per viure.","Escolteu la pregària","dels qui ens hem aplegat entorn de la vostra taula,","per tal que, units en l’amor de Crist,","experimentem el goig complet del mutu servei."],["Oh Déu, que ens ompliu amb l’alè del vostre Esperit.","En les nostres caigudes","vós mateix ens allargueu la mà i ens aixequeu.","Us demanem que, renovats amb la vostra força,","proclamem l’evangeli amb decisió i entusiasme."]],"ord6":[["Oh Déu, font de la salvació,","que mitjançant la paraula i vida del vostre Fill Jesús","heu mostrat el vostre amor al món.","Inclineu la vostra oïda a la veu dels qui cerquen la salvació","enmig de les penes i el dolor,","i oferiu-los, compassiu, la tendresa de la vostra mà."],["Oh Déu, que ens saneu en el cos i en l’esperit.","Enfortits amb la paraula de salvació,","us supliquem que, en celebrar el sagrament d’acció de gràcies,","siguem units al sofriment de Crist crucificat","i associats al goig de la seva resurrecció."],["Oh Déu, ric en amor i tendresa.","Plens del goig de la vostra salvació,","us demanem que,","el qui som enviats amb la força del vostre Esperit,","visquem amb entusiasme la missió que ens heu confiat","de ser portadors de la vostra paraula."]],"ord7":[["Oh Déu, que renoveu el món amb l’alè del vostre Esperit.","Aquí ens teniu, reunits,","amb la nostra esperança posada en Crist.","Us demanem que tots els qui –per damunt d’enemistats i lluites–","busquem la gràcia del mutu perdó,","trobem l’amor i perdó que vós ens oferiu en Crist."],["Oh Déu,","que perdoneu els vostres fills i filles amb amor i tendresa.","Enfortits amb la vostra paraula salvadora","us demanem que els qui compartim el mateix cos de Crist,","aprofundim la nostra mútua unitat."],["Oh Déu, que ens ompliu de vida nova.","Amb el goig d’haver participat en la taula del perdó,","us demanem","que avui ens aixequem altra vegada de les nostres caigudes","i visquem la vida de cada dia com a seguidors de l’evangeli."]],"ord8":[["Oh Déu, font de la salvació,","que avui ens adreceu novament la vostra paraula","als qui ens trobem aplegats aquí.","Renoveu els nostres cors mitjançant aquesta paraula","i feu que ens ompli el goig de sentir-nos sempre","acompanyats per Crist."],["Oh Déu, ric en amor i tendresa.","Amb el goig de sentir-nos convidats al banquet de la salvació,","us demanem","que els qui ens hem reunit entorn de la vostra taula","tinguem un sol cor,","perquè puguem ser dignes de participar de la nova aliança."],["Oh Déu, que ens sadolleu amb el pa de la vida.","Plens d’alegria per saber-nos els vostres enviats","us demanem que cadascú de nosaltres,","com a servidor de l’evangeli,","sàpiga comunicar la vostra paraula, sempre actual i vàlida,","a tothom amb qui es trobi en la seva vida de cada dia."]],"ord9":[["Oh Déu, creador de tot l’univers.","La vostra mirada està sempre atenta a tot el que heu creat","i el vostre amor es vessa constantment","sobre aquell que sofreix o s’afebleix.","Us demanem que els que ens hem reunit aquí per lloar-vos","trobem descans als peus del Crist","i siguem plenament renovats amb la seva força."],["Oh Déu,","que vesseu sense mesura el vostre amor sobre nosaltres.","Enfortits amb la vostra paraula i plens de goig","us demanem, Senyor, que ompliu de la vida de Crist,","tots els qui ens asseiem a la taula de la salvació","perquè així puguem irradiar la llum de l’evangeli."],["Pare misericordiós i compassiu.","Units en l’amor i vida de Crist, us demanem","que siguem capaços de viure en la nostra vida de cada dia","aquest amor vostre que sent tendresa i afecte","per tot ésser vivent."]],"ord10":[["Oh Déu, font de l’esperança, que en el vostre Fill Jesús ens heu mostrat la vostra força que supera qualsevol mal. Ompliu del vostre sant Esperit els qui ens hem aplegat aquí, perquè, sense extraviar-nos per les ombres del mal,","avancem pel camí de la vida amb una sòlida fe en vós."],["Oh Déu, font de l’amor.","Jesús va fer família seva els qui compleixen la vostra voluntat.","Feu que, seguint la seva paraula,","tots els qui compartim un mateix pa","fem més forta la nostra unitat com a família vostra."],["Oh Déu, el vostre poder no té límit.","Units com un sol cos en Crist","us demanem que ens ajudeu","a compartir sense por tot allò que creiem","i a anunciar la vostra paraula a tots els homes."]],"ord11":[["Oh Déu, ple d’amor i tendresa.","Us demanem que el vostre regnat, iniciat per Crist,","creixi vigorosament en aquest món,","i que nosaltres, obrint el cor a l’acció de la vostra gràcia,","col·laborem a posar en pràctica la vostra voluntat."],["Oh Déu, font de la vida.","Ara que portem com a ofrenes el pa i el vi,","us preguem que el misteri de salvació que aquí commemorem produeixi fruits abundants en nosaltres."],["Oh Déu, que ens alimenteu mitjançant els vostres sagraments.","Feu que amb l’ajut del vostre Esperit","fructifiqui la llavor evangèlica sembrada dins nostre,","perquè així siguem testimonis clars","del creixement del vostre regne."]],"ord12":[["Oh Déu, senyor de tot el que existeix.","Enmig d’un món immers en canvis profunds,","la vostra Església té sempre per guia la vostra paraula poderosa.","Us demanem","que els qui avui ajuntem els nostres cors en la pregària,","rebutgem tota força del mal","i conreem una fe sòlida i incommovible."],["Oh Déu, esperança dels qui creuen en vós.","Vós escolteu sempre","la veu dels qui tenen fam i set de salvació.","Beneïu tots i cadascú dels qui compartim la vostra taula","i ompliu-nos de la vostra vida sobreabundant."],["Oh Déu, de qui prové la victòria i la força.","Alimentats i renovats amb el do del vostre pa,","us demanem de vèncer tot temor i tota ansietat","i testimoniar així davant tothom el goig de creure en vós."]],"ord13":[["Oh Déu, creador de tota cosa,","la vostra glòria resplendeix en tot ésser vivent.","Feu que, mitjançant la paraula de Crist que avui proclamarem,","puguem descobrir el sentit de la vida,","i que, rebent el pa de la vida,","experimentem una vegada més el goig de viure."],["Oh Déu, bondadós i compassiu,","que, per la resurrecció del vostre Fill Jesús,","destruíreu la força de la mort.","Us demanem que els qui commemorem la Pasqua del Senyor","visquem una vida nova."],["Oh Déu, que feu subsistir tot el que existeix.","Amb el goig d’haver sentit el flux de vida del Crist","us demanem que sapiguem recolzar-nos mútuament","i ser, cadascú per a l’altre, força en les penes i sofriments."]],"ord14":[["Oh Déu, el vostre amor no té límit.","Vós ens guieu constantment amb la vostra paraula de veritat.","Feu que els qui ens hem aplegat aquí","sapiguem acollir joiosament la vostra paraula","i lloar-vos des del més pregon del nostre cor."],["Oh Déu, força dels qui creuen en vós.","Enfortits amb la paraula de salvació,","us demanem que vesseu la vostra benedicció","sobre els qui estem preparant la taula del Senyor","i que ens ompliu de nova vida."],["Oh Déu totpoderós.","Ara que en aquest sagrament","s’ha fet més forta la nostra unió amb Crist el Senyor,","envieu-nos a les feines de la nostra vida de cada dia.","Feu que, confiant en la vostra força que ajuda la nostra feblesa,","puguem realitzar la missió que ens encomaneu."]],"ord15":[["Oh Déu, que crideu i convideu tots els homes.","Vós cerqueu treballadors per al vostre regne","en tots els temps i en totes les edats.","Us demanem que els qui celebrem plegats la festa del diumenge","parem oïda atenta a la vostra veu que ressona en el silenci,","per tal que així la puguem acollir novament en el nostre cor."],["Oh Déu, ric en amor i tendresa.","Tot el que existeix rep el seu alè","del vostre projecte de salvació.","Escolteu els qui us preguem,","–tot ajuntat els nostres cors a l’oferiment de Crist–","i uniu-nos formant un sol cos en El."],["Oh Déu, que aplegueu i unifiqueu totes les coses en Crist.","Envieu-nos com a servidors de l’evangeli","i concediu-nos","que, confiant per damunt de tot en el vostre amor,","treballem en la realització de la pau de Crist."]],"ord16":[["Oh Déu, ple de tendresa i amor.","Vós, enviant-nos el Crist com a pastor,","convoqueu i aplegueu tots els homes.","Us demanem que els qui ens hem reunit aquí","acollim atentament la paraula de Crist","i esdevinguem seguidors fidels del seus ensenyaments."],["Pare misericordiós i compassiu.","Enfortiu la fe i l’amor dels qui fem camí seguint el Crist","i concediu-nos que,","aprofundint la nostra mútua comunió en la taula del Senyor,","puguem arribar a ser un únic poble vostre."],["Oh Déu, que ens guieu amb mà poderosa.","Amb el goig de veure’ns units en un mateix Crist,","us demanem que en aquest món nostre, ferit de divisions,","la vostra Església treballi amb confiança per la pau i la unitat."]],"ord17":[["Oh Déu, font de la salvació,","que mireu amorosament tots els qui tenen fam i set de vós.","Us demanem que els qui avui ens apleguem","per escoltar la vostra paraula salvadora,","tasten profundament el goig d’estar plens de la vostra vida."],["Oh Déu, generós en gràcies i dons.","Crist, el Senyor, va saciar la fam de molta gent","només amb uns pocs aliments.","Ara nosaltres, reunits entorn de la vostra taula,","meditem en els nostres cors el significat d’aquest signe.","Feu que participem dignament en el misteri de la pasqua de Crist."],["Oh Déu, misericordiós i compassiu.","Les gràcies rebudes de la vostra mà","es multipliquen quan són compartides.","Que els qui ens hem unit a la vida de Crist pel sagrament","sapiguem compartir aquest goig","amb tots els que viuen al nostre voltant."]],"ord18":[["Oh Déu, que coneixeu bé la nostra fam i set.","Vesseu la vostra benedicció","sobre aquesta assemblea que busca la vostra salvació,","i feu que, trobant el Crist, paraula i pa de vida,","es vessi abundosament la força que viu en cadascú de nosaltres."],["Oh Déu, que cuideu amb tendresa tot el que viu.","Vós heu donat al món el vostre Fill Jesús com a pa del cel.","Que el pa i vi que ara us oferim","siguin sagrament de Crist que ens dóna la vida eterna."],["Oh Déu, que desbordeu de gràcia i d’amor.","Ja que formem un sol cos en Crist, autèntic pa de la vida,","us preguem que ens renoveu amb el vostre Esperit,","perquè treballem pel vostre regne amb el goig de la fe."]],"ord19":[["Oh Déu,","que nodriu amb la vostra presència la vida dels homes.","Mireu els vostres fills","que una vegada més ens reunim avui a l’entorn de Crist","i feu que, els qui participem plegats en la gràcia de la vida,","rebem en plenitud la força que ens cal","per avançar tot construint el vostre regne."],["Oh Déu, ple d’amor i tendresa.","Som al voltant de la vostra taula,","celebrant l’oferiment de Crist.","Us demanem que, com a resposta a aquest amor de Jesús,","sapiguem fer de la nostra vida una ofrena en honor vostre."],["Oh Déu, ric en amor i tendresa.","Amb les nostres forces renovades,","us demanem que,","a imitació de Jesús que es va donar a sí mateix com a aliment,","també nosaltres sapiguem avançar pel camí de l’amor."]],"ord20":[["Oh Déu, esperança nostra,","Que convideu tots els homes al banquet de la salvació.","Us demanem","que ens nodriu abundosament mitjançant aquesta celebració","perquè puguem oferir-vos de tot cor lloances i acció de gràcies."],["Oh Déu, generós en dons i gràcies.","Jesús ens digué: «El qui menja aquest pa viurà per sempre».","Feu que tots els qui rebem aquest aliment","visquem en l’amor de Crist."],["Oh Déu, donador de la vida.","Havent assaborit el goig de compartir","l’autèntic aliment i l’autèntica beguda,","us demanem","que, enfortits pel Crist que està sempre amb nosaltres,","la nostra vida de cadascú sigui un cant de lloança per a vós."]],"ord21":[["Oh Déu, font de l’alegria.","La vostra paraula és llum que il·lumina els qui creuen.","Adreceu-nos avui una vegada més la vostra paraula poderosa,","per tal que, renovant constantment la fe del nostre cor,","perseverem en el seguiment de Crist."],["Oh Déu, força dels qui creuen.","Enfortits amb la vostra paraula de vida eterna,","us demanem que, mitjançant el sagrament que ara celebrem,","siguem units estretament","al misteri de la mort i resurrecció del vostre Fill Jesús."],["Oh Déu, que ens doneu abundosament la vostra vida.","Us demanem que els qui formem un sol cos en Crist,","siguem mútuament servidors els uns dels altres,","i així puguem continuar fent tots junts el camí de la fe."]],"ord22":[["Oh Déu totpoderós i etern,","que, mitjançant el vostre Fill Jesús,","ens heu manifestat la vostra voluntat.","Feu que avui nosaltres tornem una vegada més a vós","i trobem en la vostra paraula el nodriment de la nostra vida."],["Oh Déu, que renoveu totes les coses.","El vostre Fill Jesús es va lliurar ell mateix","per purificar-nos del pecat.","Us demanem que aquest banquet de la vostra taula","ens uneixi més profundament a l’oferiment de Crist."],["Oh Déu, força dels qui creuen en vos.","Guieu-nos amb la vostra mà poderosa","en aquesta setmana que comença,","de manera que, discernint allò que és realment important,","visquem en la societat mirant de realitzar la vostra voluntat."]],"ord23":[["Oh Déu, esperança de tots els homes,","que enviant el vostre Fill Jesús","ens vau alliberar de l’angoixa i el sofriment.","Obriu avui les nostres oïdes","perquè escoltin la vostra paraula salvadora,","i obriu també els nostres llavis","perquè sàpiguen cantar la vostra lloança."],["Oh Déu, ric en amor i misericòrdia,","que en la mort i resurrecció de Jesús","ens vau revelar la força de la vostra salvació.","Us demanem que, en celebrar la pasqua del Senyor,","assaborim profundament el goig d’estar units a Ell."],["Oh Déu, font de la salvació.","Dirigiu les nostres vides","de manera que puguem compartir amb tothom","el goig de sentir-nos vivificats per la vida de Crist,","i que la nostra vida de cada dia","esdevingui un cant de lloança a vós."]],"ord24":[["Oh Déu, font de la salvació.","El vostre Fill Jesús, mitjançant el dolor i la creu,","ens mostrà el camí del vostre seguiment.","Il·lumineu amb la vostra paraula","els qui proclamem Jesús com a salvador,","i feu que, sense perdre’ns en la tenebra,","anem fent el camí cap a vós."],["Oh Déu, que vesseu el vostre amor sense mesura.","Augmenteu la nostra fe i uniu-nos al Crist,","el qual, mitjançant el sofriment,","s’encaminà cap a la vida de la resurrecció."],["Oh Déu, que ompliu les nostres vides amb la força de la salvació.","Manteniu amb la vostra gràcia","els qui participem junts de la vostra vida,","i feu que tinguem sempre present","l’amor que ens heu mostrat en la mort de Jesús,","i així puguem donar un testimoniatge ferm de la nostra fe"]],"ord25":[["Oh Déu,","que vesseu a mans plenes la vostra gràcia sobre nosaltres.","Vós donàreu al món com a salvador el vostre Fill Jesús.","Us demanem que, mitjançant aquesta celebració,","ens acostem al Crist","el qual, abaixant-se, es va fer servidor de tots."],["Pare nostre, ric en amor i tendresa.","Els qui al voltant de la vostra taula","celebrem la mort i resurrecció de Jesús,","us demanem que ens uniu fortament a Ell","que es va entregar a si mateix sense mesura."],["Oh Déu, font de l’amor i de la misericòrdia.","Units al Crist, que va venir a servir,","us demanem que ens ajudeu a ser servidors els uns dels altres","i a perdonar-nos mútuament,","per tal que la nostra vida sigui una força","que ajudi a la realització de la pau al món."]],"ord26":[["Oh Déu, esperança dels qui creuen en vós,","Quan vessàreu el vostre Esperit sobre nosaltres,","ens vau constituït com a únic poble vostre.","Us demanem que els qui en nom vostre ens apleguem aquí,","sapiguem acceptar-nos mútuament","i cantar-vos amb un sol cor."],["Oh Déu, ric en gràcies i dons.","Accepteu l’oració que units a l’oferiment de Crist us presentem","i feu que, tot recordant el seu amor per a tots els homes,","siguem omplerts del goig que prové del mutu amor."],["Oh Déu, salvació de tots els homes.","Plens del vostre Esperit i amb un sol cor,","us demanem que, seguint la paraula de Crist,","siguem portadors de l’evangeli de la pau","en la societat actual."]],"ord27":[["Oh Déu, donador de la vida,","que voleu que els homes visquem no en la solitud i l’aïllament,","sinó ajudant-nos i sostenint-nos mútuament.","Vesseu el vostre amor desbordant","sobre els qui ens hem reunits aquí, aplegats entorn de Crist."],["Oh Déu, ric en amor i afecte.","Vesseu la vostra benedicció","sobre els reunits entorn de la vostra taula.","Que l’amor de Crist, que es va oferir a si mateix sense mesura,","esdevingui el vincle d’unió que ens uneixi els uns als altres."],["Oh Déu, que sou l’amor.","Enfortits per Crist, que està sempre amb nosaltres,","us demanem","que formem una única família vivificada pel vostre amor."]],"ord28":[["Oh Déu, donador de la saviesa que supera tot coneixement.","La vostra paraula actua poderosa al llarg de tots els temps.","Il·lumineu els nostres cors amb la llum de l’evangeli","i feu que no ens aferrissem als béns immediats."],["Oh Déu, ric en dons i gràcies.","Enfortits amb la vostra paraula de salvació i plens d’esperança,","us demanem que tots els qui celebrem l’oferiment de Crist","siguem també associats a la seva vida nova en la resurrecció."],["Oh Déu, misericordiós i compassiu.","Units a la vida de Crist,","i vivificats pel vostre amor, que supera qualsevol bé,","us demanem que puguem recórrer amb goig al cor","la senda del seu seguiment."]],"ord29":[["Oh Déu, ric en dons i gràcies.","El vostre Fill Jesús oferí la seva pròpia vida","per la salvació de tots.","Feu que nosaltres, fins i tot en el sofriment i la prova,","sapiguem descobrir l’esperança","en la creu de Crist."],["Oh Déu, pare de tots els homes.","Ens apropem a la vostra taula","amb el goig de sentir-nos-hi convidats.","Us demanem que la celebració de la mort i resurrecció de Jesús,","faci créixer en nosaltres","una actitud prompta al propi oferiment."],["Oh Déu, força dels qui creuen en vós.","Units i formant un sol cos en Crist,","us demanem que,","fent-nos mútuament germans i germanes per als altres,","arribem a compartir sincerament les alegries i les penes."]],"ord30":[["Oh Déu, ple d’amor i misericòrdia.","Escolteu les nostres veus que, des de l’angoixa i el dolor,","clamen a vós esperant salvació.","Us demanem que, mitjançant aquesta celebració,","els qui confiem en vós sapiguem destriar i acceptar","el guiatge de Jesús."],["Oh Déu, sant i alhora proper.","Cuideu d’aquest vostre poble","que heu reunit en servei vostre,","i feu que, juntament amb el Crist gran sacerdot,","també nosaltres oferim tot el que som."],["Oh Déu totpoderós,","que ens nodriu amb aliment abundós","i ens saneu en el cos i en l’esperit.","Ajudeu-nos a compartir amb els altres aquest goig."]],"ord31":[["Oh Déu, font de l’amor.","Jesús, el vostre Fill, ens mostrà amb paraules i obres","el camí que duu a la vida.","Us demanem que la seva paraula","ressoni insistentment en el cor dels qui ens apleguem","buscant la forma veritable de vida."],["Oh Déu, d’amor i tendresa sens fi.","Plens de goig per poder seure a la vostra taula,","us demanem de viure l’amor a vós i als homes,","per tal que així ens sentim units a Crist","que es va oferir ell mateix sense reserva."],["Oh Déu, ric en dons i gràcies.","Vós, mitjançant el pa d’aquest sagrament,","ens uniu mútuament en Crist.","Feu que visquem el seu amor","en la nostra vida de cada dia."]],"ord32":[["Pare, compassiu i misericordiós.","Vós coneixeu bé el cor fervent dels qui us supliquen.","Vesseu la vostra benedicció sobre nosaltres,","congregats en una mateixa esperança en vós,","i feu que, estimulats per la vostra paraula,","us puguem oferir la nostra vida de cada dia."],["Oh Déu, donador de la vida.","Enfortiu els qui ens hem aplegat aquí","entorn de la vostra taula de salvació.","Feu-nos tastar en profunditat l’amor de Crist,","–que es va donar a si mateix del tot i sense reserves–","i així sentir-nos plens del goig del nostre propi oferiment."],["Oh Déu i pare nostre.","Compartint el mateix goig d’estar units amb el Crist,","us demanem que, deixant-ho tot a les vostres mans,","visquem amb cor joiós","una vida plena de sentit."]],"ord33":[["Oh Déu únic i veritable,","que convoqueu tots els homes per formar una única família.","Il·lumineu els cors dels qui ens hem aplegat aquí,","i feu que posem tota la nostra confiança","en la paraula de Crist que no passa mai."],["Oh Déu, que per mitjà de la mort en creu del vostre Fill Jesús,","ens heu alliberat del pecat.","Ateneu les súpliques","dels qui commemorem el lliurament de Crist","i feu-nos partícips del banquet etern amb tots els homes."],["Oh Déu, que ens doneu la vida eterna.","Units en la paraula i cos de Crist,","us demanem que, fins que arribi el seu retorn gloriós,","l’Església sigui signe d’amor i d’esperança."]],"rei":[["Oh Déu, totpoderós i etern,","que, ressuscitant Crist d’entre els morts,","el constituíreu rei perquè governi totes les coses amb amor.","Guieu i dirigiu els qui, responent a la vostra crida,","ens hem congregat amb un sol cor,","i doneu-nos la força que ens cal","per treballar en la construcció del vostre regne."],["Oh Déu, que desbordeu de gràcia.","Per mitjà de la mort i resurrecció de Crist,","vós heu alliberat del pecat tots els homes.","Us demanem","que, per mitjà del banquet commemoratiu de la seva pasqua,","ens ompliu del vostre amor i del vostre perdó."],["Oh Déu, força dels qui creuen en vós.","Units estretament a Crist,","us demanem que, seguint-lo a Ell com a rei de la pau,","treballem amb totes les nostres forces","per la construcció del vostre regne."]]},"C":{"adv1":[["Oh Déu, ple de justícia i amor.","Desperteu els cors dels qui,","fiats en la vostra promesa salvadora,","esperen que arribi el seu alliberament.","Feu que, amb els nostres ulls fits en el Crist,","llum de la nostra esperança,","continuem fent amb goig el nostre camí cristià."],["Oh Déu, ric en dons i gràcies.","Mentre esperem amb joia la nostra salvació,","us demanem que ens feu conèixer profundament","la grandesa de l’amor que ens heu mostrat","en donar-nos el vostre Fill."],["Als qui ens heu sadollat amb el pa de la vida,","envieu-nos, Senyor,","perquè puguem compartir","l’esperança i el goig que de vós hem rebut,","amb tots els qui ens trobem en la nostra vida de cada dia."]],"adv2":[["Oh Déu, ric en amor i misericòrdia.","L’esclat de la vostra glòria il·lumina tots els homes","i transforma en alegria la seva tristor.","Feu que nosaltres, que hem conegut el camí de la salvació,","continuem en la senda del vostre amor","fins a aconseguir la plena unió amb el Crist."],["Oh Déu, creador de totes les coses,","que manteniu i cuideu tota vida.","A tots els qui celebrem avui el Sopar del Senyor","concediu-nos la gràcia d’assaborir plenament","el goig de sentir-nos vivificats per vós."],["Oh Déu, font de la salvació.","Units en el Cos de Crist us demanem que,","els qui hem posat la nostra confiança en la vostra paraula, puguem fer amb goig i entusiasme el camí de Jesús."]],"adv3":[["Oh Déu, font de l’esperança,","que esteu sempre al nostre costat.","Ens hem reunit entorn vostre, mentre esperem el Crist. Feu de nosaltres un sol cor en la unitat del vostre Esperit, perquè, plens d’alegria, no deixem mai de lloar-vos."],["Pare nostre, ple de tendresa i amor.","Ompliu del vostre Esperit","els qui ens apleguem entorn de la vostra taula,","per tal que assaborim profundament","l’amor del Crist que és amb nosaltres."],["Oh Déu, font de la vida.","Conduïu els que acabeu d’alimentar a la taula del Senyor.","Feu que compartim amb tothom","el goig que de vós hem rebut","i anunciem al món la visita de la vostra salvació."]],"adv4":[["Oh Déu misericordiós i compassiu,","que teniu predilecció pels petits.","Vos enviàreu el vostre Fill","i vau omplir de benediccions els qui tenien fam i set de salvació.","Feu que nosaltres, que acollim amb goig el seu naixement,","ens sentim també units a ell en la nostra vida mateixa."],["Oh Déu, ric en dons i gràcies.","Us presentem aquests dons,","amb els quals nosaltres mateixos","ens posem a les vostres mans.","Concediu-nos, que en celebrar la mort i resurrecció de Crist,","assaborim profundament","l’amor que ens heu mostrat en enviar-nos el vostre Fill."],["Oh Déu que vesseu el vostre amor sobre tots els homes.","Ompliu amb el vostre Esperit","els qui som enviats en el comiat d’aquesta celebració.","Feu que compartim amb tothom","el goig que sentim en la celebració del naixement del Crist."]],"qua1":[["Oh Déu totpoderós.","El vostre Fill Jesús, vencent tota temptació,","va seguir el camí de fidelitat i obediència a vós,","fins a la mort en creu.","Enfortiu-nos amb la vostra gràcia a l’inici de la quaresma,","perquè, renovant la nostra fe i esperança en la resurrecció,","puguem seguir amb Jesús el camí que ell va seguir."],["Oh Déu, generós en dons i gràcies.","Concediu-nos que, vivificats per la vostra paraula, assaborim profundament","el misteri de la mort i resurrecció del Senyor."],["Oh Déu, esperança dels qui creuen en vós.","Ompliu amb el vostre esperit i defenseu de tota temptació","els qui per la comunió estem units al Crist,","i concediu-nos de viure cada dia en acció de gràcies","el camí de la conversió."]],"qua2":[["Oh Déu, font de la salvació,","que a través de la passió duguéreu el vostre Fill Jesús a la glòria. Enfortiu la nostra esperança i el nostre ànim","perquè seguim les petjades de Crist en el seu camí cap a la creu."],["Oh Pare, que ens envolteu i il·lumineu amb la vostra llum.","Feu més forts en la fe i e
