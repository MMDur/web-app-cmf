 su camino hacia la cruz."],["Oh Padre, que nos envuelves e iluminas con tu luz.","Haz más fuertes en la fe y en el amor","a los que invitas a la mesa de Cristo,","para que con gozo podamos celebrar una vez más","el misterio de la salvación."],["Oh Dios, Padre nuestro.","Gracias por este rato que hemos pasado","en compañía de Jesús","y por el don de habernos unido más fuertemente a él.","Concédenos que este tiempo de Cuaresma","nos ayude a seguir a Cristo","y nos lleve a trabajar por la salvación de todos."]],"qua3":[["Oh Dios, fuente de la vida.","Siempre que nuestro corazón se aleja de ti,","tú, por medio de tu Hijo Jesús, nos invitas a volver.","Ahora que en la Cuaresma recorremos el camino de conversión,","danos un corazón que sepa alabarte y darte gracias."],["Oh Dios, que has establecido con nosotros una alianza nueva.","Para nosotros, seguidores de Jesús,","ya no hay ni templo ni ofrendas.","Al conmemorar en esta cena la ofrenda única de Cristo","—que se ofreció él mismo por nosotros—,","únenos fuertemente a ti, que eres la fuente del amor."],["Oh Dios, que con tu vida abundante","alimentas a todos los que creemos en ti.","Reunidos como cuerpo de Cristo en una sola Iglesia,","te pedimos que derrames sobre nosotros un nuevo aliento,","que nos haga ser signo visible de tu amor."]],"qua4":[["Oh Dios, misericordioso y compasivo,","que acoges con un amor sin límites","a todo el que vuelve a ti.","A los que en la Cuaresma recorremos el camino de la conversión,","danos una vida nueva como hijos tuyos."],["Oh Dios, generoso en dones y gracias,","que, por medio de tu Hijo Jesús,","has hecho de nosotros una sola familia.","Llénanos de la alegría de la reconciliación","a los que somos invitados a la misma mesa junto a los hermanos."],["Oh Dios, que estás siempre con nosotros.","Fortalece con tu gracia a este pueblo tuyo creyente.","Y a todos los que participamos en la mesa de la Pascua de Cristo","concédenos poder testimoniar su gozo a todos los hombres."]],"qua5":[["Oh Dios, fuente del amor.","Tú perdonas al pecador, levantas al hombre caído","y nos das fuerza para emprender una vida nueva.","Te pedimos que nosotros,","que hemos recibido en abundancia la gracia de tu perdón,","sepamos darte gracias con un solo corazón."],["Oh Dios, misericordioso y compasivo,","que invitas a todos a tu mesa, sin distinción.","Fortalece con tu amor y con tu perdón","a los que celebramos el misterio de la Pascua del Señor."],["Oh Dios, que haces correr el agua por el desierto","y haces crecer en él una vida nueva.","A los que hemos recibido la vida de Cristo,","envíanos al mundo, sediento de salvación.","Haz que podamos compartir con todos los hombres","la abundancia de gracia que hay en ti."]],"pas3":[["Oh Dios, generoso en amor y gracia,","que nos diste a tu Hijo amado como salvador del mundo.","Llénanos del gozo de vivir en tu amor","y haznos seguidores de Cristo, que está con nosotros."],["Oh Dios, misericordioso y compasivo.","El Señor Jesús preside nuestra celebración","y hoy nos invita a la mesa del pan de la vida.","Te pedimos que, con un corazón renovado de creyentes,","podamos participar abundantemente en la vida de Cristo."],["Oh Dios, que derramas tu gracia sobre nosotros.","Ahora que nos has alimentado con la vida de Cristo,","envíanos a la misión de hoy,","para que, cada uno en su lugar,","demos testimonio del misterio pascual del Señor."]],"pas4":[["Oh Dios, fuente de la salvación.","Jesús, el verdadero cordero pascual,","aceptó voluntariamente el sufrimiento para darnos vida a todos.","Llena del amor y de la vida de Cristo","a los que juntos celebramos la Pascua del Señor."],["Oh Dios misericordioso y compasivo.","Jesús, como buen pastor, cuida de nosotros,","nos apacienta en praderas deliciosas","y nos hace reposar junto al agua.","Que los invitados a la cena del Señor","sepamos saborear a fondo esta gracia."],["Oh Dios, fuente y dador de la vida.","Fortalécenos, ahora que comenzamos una nueva semana,","para que nuestra vida de cada día","sea nuestra respuesta a la llamada de Cristo."]],"pas5":[["Oh Dios, que estás siempre con nosotros.","Resucitando a Cristo de entre los muertos","nos has mostrado tu amor sin límites.","Te pedimos que también nosotros, amándonos mutuamente,","demos testimonio de ti, que eres el amor mismo."],["Padre santo.","Ahora que en esta mesa celebramos con gozo","la vida nueva de la resurrección,","haz de nosotros un pueblo que te sirva","y danos un corazón cercano al de Jesús,","que se ofreció a sí mismo."],["Padre, lleno de ternura y amor,","que ahora envías al mundo","a los que nos has saciado con la vida nueva.","Haz que seamos testigos gozosos de Cristo,","que es el Camino que lleva hacia ti."]],"pas6":[["Oh Dios, Padre de Jesús, el Señor.","Tú vienes a nosotros en tu Palabra y en tu Espíritu,","y estás siempre con nosotros.","Llena con la paz y el gozo de Cristo","los corazones de los que nos hemos reunido aquí."],["Padre misericordioso y compasivo.","Tu Hijo Jesús se hizo amigo de todos","y, dando su propia vida por nosotros,","nos mostró el colmo del amor.","Haz que este sacramento nos una íntimamente a su amor."],["Oh Dios, Padre de bondad.","Fortalecidos con el alimento de la vida eterna","te suplicamos que, sostenidos por Cristo, que está en nosotros,","vivamos la vida de cada día con amor y alegría."]],"ord2":[["Oh Dios, fuente del amor.","Tú siempre escuchas y respondes","a los que te imploran desde el fondo del corazón.","Haz que esta celebración nuestra sea realmente","una fiesta de alegría celebrada con Cristo Jesús","y que cada uno de nosotros, al alabarte y darte gracias,","quede lleno a rebosar de tu amor."],["Oh Dios, fuente de la vida.","Jesús, tu Hijo,","realizó su primer signo en Caná de Galilea,","cuando llenó de alegría aquel banquete de fiesta.","Haz que el pan y el vino que aquí te ofrecemos","se conviertan en alimento de vida abundante."],["Oh Dios, rico en amor y misericordia.","Te pedimos que los que somos alimentados con un mismo pan","y vivificados por un mismo Espíritu","seamos testigos de tu amor","con la alegría de nuestra vida."]],"ord3":[["Oh Dios, fuente de la alegría.","Te pedimos que a todos los que nos hemos reunido en torno a Jesús","nos hagas escuchar la buena nueva de salvación que nos dice:","«Este día es santo;","hoy se cumple la palabra de Dios».","Haz que esta celebración de acción de gracias","sea para nosotros fuente de energía para la vida."],["Oh Dios, lleno de amor y compasión.","Tu Hijo, Jesús, ofreció su vida","para dar la libertad a los oprimidos","y librarlos del poder del pecado y de la muerte.","Haz que nosotros sepamos celebrar con alegría","esta ofrenda de Cristo."],["Oh Dios, fuerza de la salvación.","Ahora que saboreamos el gozo de sentirnos unidos a Cristo,","te pedimos que la Iglesia,","llena de tu Espíritu y enviada al mundo,","sepa llevar tu buena nueva a todos los hombres."]],"ord4":[["Oh Dios,","que haces oír tu voz en el corazón de cada hombre.","Tú conoces nuestros pensamientos y deseos.","Guía con tu Espíritu","a los que hoy estamos reunidos aquí,","y haz que abramos generosamente nuestros corazones","a la voz de tu llamada."],["Oh Dios, compasivo y misericordioso.","Fortalecidos con la palabra de vida,","te pedimos","que los que nos hemos reunido en torno a tu mesa","estemos estrechamente unidos a Cristo,","que se ofrece por todos los hombres."],["Oh Dios, fuente de la salvación.","Hoy nos envías de nuevo como cuerpo de Cristo.","Ayúdanos a ser signos de fe, esperanza y amor","para todos los que encontraremos en la vida de cada día."]],"ord5":[["Dios misericordioso y compasivo.","A nosotros, pecadores, nos has mirado con ojos de ternura y compasión,","y nos has conducido al encuentro con Jesús, tu Hijo.","Haz que ahora, recordando este don de tu amor,","sepamos alabarte en el gozo y la acción de gracias."],["Oh Dios, fuerza de salvación.","Junto con el pan y el vino, recíbenos también a nosotros,","y, ya que compartimos el pan como Jesús nos dijo,","haznos experimentar abundantemente una energía nueva","para construir tu reino."],["Oh Dios, tú eres todo misericordia y todo amor.","Tú levantas e invitas a colaborar en tu reino","a todo el que, como Pedro,","reconoce humildemente su indignidad y su pobreza.","Te pedimos que también nosotros, fortalecidos con tu amor,","podamos anunciar el evangelio con gozo y valentía."]],"ord6":[["Oh Dios, que amas con ternura a todos los hombres.","Jesús, tu Hijo, dio palabras de vida","a los que se reunieron a su lado.","Vuelve tu mirada sobre nosotros,","que nos hemos reunido para buscar la salvación,","y enséñanos la auténtica felicidad."],["Oh Dios, que sacias el hambre y la sed de los que buscan.","Al ofrecerte el pan y el vino que de ti hemos recibido,","te pedimos que se conviertan en el cuerpo de Cristo","y sean para cada uno de nosotros fuerza y sostén en la vida."],["Oh Dios, fuente de la salvación.","Guía los pasos de tu pueblo,","fortalecido por el evangelio y alimentado con el cuerpo de Cristo,","para que, con todos los que vamos encontrando","en nuestra vida de cada día,","podamos saborear la felicidad del reino","que Jesús anunció."]],"ord7":[["Oh Dios, de un amor infinito.","Amando a sus enemigos, e incluso al que lo entregó,","Jesús, tu Hijo, nos mostró en su vida","la imagen del amor auténtico.","Te pedimos que todos los que nos hemos reunido aquí","podamos parecernos, aunque sea un poco,","al modelo que él nos dejó."],["Padre, lleno de amor y ternura.","Aquí nos tienes reunidos en torno a tu mesa","para conmemorar el amor de tu Hijo Jesús en la cruz.","Que esta celebración de acción de gracias","nos una más estrechamente a su forma de vida."],["Oh Dios, que acoges gozoso a todo el que acude a ti.","Llenos del amor de Cristo te pedimos, Señor,","que la Iglesia, en su trabajo en medio del mundo,","dé testimonio fiel del amor de Jesús a todos, sin discriminación."]],"ord8":[["Oh Dios, espléndido en dones y gracias.","Con su palabra y con sus obras","Jesús, tu Hijo, nos mostró","el camino de la vida eterna.","Derrama tu Espíritu sobre cada uno de nosotros,","para que tu palabra, que hoy escucharemos,","sea para nosotros luz que ilumine nuestro camino."],["Oh Dios, fuente de la vida.","Tú nos invitas a la mesa de Cristo, vencedor de la muerte.","Haz que podamos participar con un corazón limpio en el misterio de la Pascua."],["Padre santo.","Gozosos de sentirnos unidos a Cristo,","te pedimos que nuestras palabras y nuestras obras","sean conformes a tu voluntad","y den buenos frutos."]],"ord9":[["Oh Dios, Señor de todos los hombres,","que escuchas y respondes","a los que buscan con ardor la salvación.","Fortalece la fe de los que nos hemos reunido ante ti,","para que tu palabra se convierta,","en cada uno de nosotros,","en fuerza que sostenga nuestro caminar de cada día."],["Oh Dios, que miras con cariño y ternura a todos los hombres.","Te pedimos que los que estamos reunidos en torno a una misma mesa","sepamos derribar todas las barreras","que nos separan unos de otros,","y así compartir la gracia de la vida."],["Oh Dios, de quien brota a raudales amor y cariño.","Robustece a los que, unidos en la palabra y el cuerpo de Cristo,","envías al mundo.","En medio de una sociedad que va perdiendo el sentido de la fe,","haz que conservemos siempre el gozo de vivir creyendo en ti."]],"ord10":[["Oh Dios, fuerza de los que creen en ti.","Tú estás siempre al lado del que sufre","y ayudas a levantarse al que cae.","Ayúdanos a compartir el gozo de la salvación,","para que podamos alabarte con un solo corazón."],["Oh Dios misericordioso,","que, disipando las tinieblas de la muerte,","nos guías a la luz de la vida.","Haz que los que conmemoramos la Pascua de Jesús","seamos realmente vivificados por su amor y por su vida."],["Oh Dios, rico en amor y ternura.","Unidos a Cristo te pedimos","que nunca ahoguemos el latido y el calor","de la vida que recibimos de ti,","sino que sepamos ser testigos","de la riqueza de tu amor."]],"ord11":[["Oh Dios, fuente del amor y del perdón.","Tú comprendes nuestra flaqueza y debilidad","y renuevas nuestra esperanza de vivir como hijos tuyos.","Te pedimos que, reunidos aquí en asamblea,","podamos ofrecerte esta celebración eucarística","unidos en un solo corazón, lleno de fe en ti."],["Oh Dios, Padre nuestro,","que, enviando a tu Hijo, Jesús,","nos has reconciliado contigo.","Haz que todos los que estamos hoy aquí unidos en Cristo","sepamos amarte a ti y servir a los hombres."],["Oh Dios, esperanza de los que creen en ti.","Unidos en la vida de Cristo, te pedimos que,","vivificados por tu amor sin límites,","trabajemos por la salvación de todos los hombres."]],"ord12":[["Oh Dios, esperanza de los que creen en ti.","Jesús, nuestro salvador,","emprendió libremente el camino de la cruz","y dio su vida por nosotros.","Te pedimos que los que nos hemos reunido aquí en tu nombre","renovemos nuestra decisión de seguir a Cristo."],["Oh Dios, fuente de la salvación.","Jesucristo, con su victoria sobre la muerte,","nos muestra el camino de la vida eterna.","Haz que los que recibimos el pan del Señor","caminemos siguiendo sus huellas y vivamos una vida nueva."],["Padre nuestro y Dios eterno.","Hoy, una vez más, unidos en el cuerpo del Señor,","lo hemos confesado como nuestro salvador.","Ahora que somos enviados, llenos de su gracia,","te pedimos que nos sostengas y nos guíes","con la fuerza de tu Espíritu."]],"ord13":[["Dios, Padre misericordioso,","que quieres la salvación de todos","y a todos invitas por medio de Jesucristo.","Mira a los que hoy estamos reunidos aquí","y condúcenos con tu fuerza,","para que sigamos las huellas de Jesús."],["Oh Dios y Padre nuestro.","Como respuesta a la invitación de Cristo Jesús,","te pedimos que, unidos a él,","seamos capaces de ofrecernos nosotros mismos,","tal como él hizo ofrenda de su propia vida."],["Oh Dios, fuente de la vida.","Llena con tu Espíritu","a los que por la comunión estamos unidos a Cristo,","para que, viviendo nuestra vida cristiana en libertad y alegría,","podamos compartir con todos los hombres","la esperanza de la salvación."]],"ord14":[["Oh Dios, fuente de la salvación.","A este mundo nuestro, que sufre por la división y el enfrentamiento,","tú enviaste a Jesús, tu Hijo,","para que nos enseñara el camino de la paz y de la unidad.","Te pedimos que todos los que participamos en esta asamblea","sepamos escuchar con un corazón nuevo la palabra de salvación."],["Oh Dios, fuente de la vida,","que, como una madre con sus hijos,","nos amas y nos alimentas con la mejor comida.","Haz que este pan y este vino se conviertan en nosotros","en energía y fuerza para trabajar por tu reino."],["Oh Dios, esperanza de los que creen en ti.","Llenos de vida nueva por la comunión, te pedimos","que la Iglesia anuncie el gozo de tu reino","y sea portadora de la paz de Cristo."]],"ord15":[["Padre misericordioso.","A este mundo nuestro, tan falto de calor humano,","pero que tanto anhela el amor auténtico,","Jesús le mostró —con su palabra y con su vida—","en qué consiste ese amor auténtico.","Haz que nosotros sepamos acoger con un corazón muy sincero","la palabra de Cristo que hoy se nos comunica."],["Oh Dios, rico en bondad y misericordia.","Jesús, tu Hijo,","ofreció su propia vida por todos los hombres.","Haz que también nosotros, unidos a él por este sacramento,","sepamos hacer ofrenda de nuestras propias vidas."],["Oh Dios, fuente de la vida.","Celebrando en acción de gracias el amor de Jesús, nuestro Señor,","te pedimos, ahora que volvemos a nuestra vida cotidiana,","que cada uno de nosotros sepa acercarse de buen grado","a todos los que necesitan nuestra ayuda."]],"ord16":[["Oh Dios, fuente de la salvación.","Tú estás siempre a nuestro lado","y no dejas de comunicarte con nosotros.","Haz que hoy, reunidos como hijos tuyos,","sepamos escuchar muy atentos tu palabra."],["Oh Dios, fuerza de los que creen en ti.","Te pedimos que todos los que celebramos","la memoria de la muerte y resurrección de Jesús","estemos unidos en su vida abundante."],["Oh Dios, que estás siempre con nosotros.","Después de recibir el sacramento del cuerpo de Cristo,","tú nos envías como servidores de tu palabra.","Que, como María, grabemos tu palabra en nuestro corazón,","y, como Marta, sepamos acoger a los demás con todo cariño."]],"ord17":[["Oh Dios, fuente de la vida.","Jesús nos enseñó a llamarte «Padre».","Reunidos para orar juntos siguiendo su palabra,","te pedimos que nos bendigas","y nos llenes con la luz de tu Espíritu."],["Oh Dios, compasivo y misericordioso.","Tú nunca dejas sin el alimento necesario","a quien lo busca con hambre y sed.","Sentados para orar en torno a tu mesa,","te pedimos que derrames abundantemente sobre nosotros","la fuerza siempre nueva de tu vida."],["Oh Dios, Padre nuestro.","Hoy, por medio de este sacramento,","nos has unido una vez más en tu Hijo Jesús.","Te pedimos que la Iglesia, en oración constante,","mantenga encendida en el mundo actual","la luz de la fe y de la esperanza."]],"ord18":[["Oh Dios, fuente de la alegría.","En medio de los trabajos y el cansancio de la vida,","eres tú quien nos da el descanso que vivifica.","Aquí nos tienes, reunidos,","buscando junto a ti la auténtica forma de vida;","concédenos encontrar el gozo de vivir en Cristo."],["Oh Dios, compasivo y misericordioso.","Con profundo agradecimiento por tus dones,","te ofrecemos el fruto de nuestro trabajo de cada día,","y, reunidos en torno a tu mesa, te pedimos","que aprendamos a saborear las riquezas de la vida auténtica."],["Oh Dios, rico en dones y gracias para con tus hijos.","Saciados con la palabra y el alimento de la salvación,","te pedimos que sepamos compartir con los demás","todas las gracias que de ti hemos recibido."]],"ord19":[["Oh Dios, fuente de la esperanza,","que llevas a cabo la salvación del mundo por caminos inescrutables.","Derrama sobre tu pueblo la abundancia de tu Espíritu,","para que los que creemos en la realidad de tu reino","nos mantengamos unidos en una misma esperanza."],["Oh Dios, rico en misericordia.","Respondiendo a tu invitación y con gozo en el corazón,","nos hemos reunido en torno a tu mesa.","Te pedimos que, llenos de agradecimiento,","sepamos seguir las huellas de Jesús,","que se hizo servidor de todos."],["Oh Dios, rico en dones y gracias para con tus hijos.","Tú nos alimentas con el pan de vida para sostener nuestro camino.","Te pedimos que, en medio de un mundo lleno de problemas,","tu Iglesia, con fe decidida en tus designios de salvación,","no deje nunca de trabajar con fe y perseverancia."]],"ord20":[["Oh Dios, compasivo y misericordioso,","que para la salvación de toda la humanidad","enviaste a Jesús, tu Hijo.","Los que nos hemos reunido aquí te pedimos","que nos purifiques con tu Espíritu,","para que el gozo del seguimiento de Jesús","llene a rebosar el corazón de cada uno de nosotros."],["Oh Dios, rico en gracias y dones.","Mira con amor a los que, en torno a tu mesa,","estamos celebrando el misterio de la salvación,","y concédenos que, grabada en nuestros corazones la cruz de Jesús","como signo de su victoria sobre el odio y la enemistad,","trabajemos sin descanso por alcanzar la paz verdadera."],["Oh Dios, fuente del amor y de la paz.","Te pedimos que, llenos de la vida nueva","y siguiendo los pasos de Jesús,","seamos capaces de enfrentarnos con valentía","al mal y al pecado del mundo."]],"ord21":[["Oh Dios, Padre de todos los hombres.","Hoy también nos invitas a todos,","sin distinción de razas ni nacionalidades,","al banquete de tu reino.","Te pedimos que, unidos en un solo corazón, sepamos alabarte","por el gozo de sentirnos invitados por ti."],["Oh Dios, que diriges con tu providencia todas las cosas.","Fortalece con tu gracia","a los que hemos preparado este banquete de tu mesa,","y haz que todos nosotros,","alimentados con la comida auténtica,","nos llenemos de nuevas energías para seguirte."],["Oh Dios, lleno de ternura y amor para con nosotros.","Sabemos que tú purificas a los que amas.","Ayúdanos a seguir el camino de Jesús","con la firme convicción de que también en la prueba","tú estás muy cerca, a nuestro lado."]],"ord22":[["Oh Dios, salvación de los que creen en ti.","Tú humillas a los que se ensalzan","y acoges a los que se humillan.","Haz que todos nosotros,","que nos reconocemos igualmente pobres ante ti,","podamos encontrar esperanza en la palabra de Jesús."],["Oh Dios, rico en gracias y dones.","Tú invitas a tu mesa a los que se humillan.","A los que conmemoramos la muerte y resurrección de Cristo,","concédenos encontrarnos unidos","en Aquel que se anonadó a sí mismo."],["Dios misericordioso y compasivo.","A todos los que hemos recibido el cuerpo de Cristo,","concédenos ser con él un solo corazón,","para que podamos abrir nuestro corazón a los pobres y necesitados","y compartir con todos el gozo de la salvación."]],"ord23":[["Padre y Dios nuestro.","Tu Hijo Jesús cargó con la cruz para nuestra salvación.","Derrama tu Espíritu","sobre los que hoy celebramos este misterio salvador,","para que, teniendo siempre abierto a ti nuestro corazón,","podamos seguir tu voluntad."],["Oh Dios, esperanza de los que creen en ti.","Sostén con tu gracia a los que se esfuerzan","por responder a la invitación de Cristo,","para que, celebrando juntos este sacramento,","estén unidos a aquel que voluntariamente cargó con la cruz."],["Padre, lleno de amor y misericordia.","Fortalece con tu fuerza a los que son enviados","después de participar en la mesa del Señor.","Que en la vida de cada día","no dejen nunca de caminar como discípulos suyos."]],"ord24":[["Oh Dios, rico en amor y misericordia.","Enviándonos a tu Hijo,","tú invitas a todos a la conversión.","Te pedimos que","todos los que nos hemos reunido en torno a Cristo Jesús","vivamos constantemente el gozo de tu salvación."],["Dios misericordioso.","Tú te alegras con la conversión de cada uno de nosotros","y nos invitas a la mesa del Señor.","Haz que todos los que participamos de un mismo pan","seamos testigos de tu amor."],["Padre santo.","Te damos gracias por habernos unido a Jesús, el Cristo,","y habernos hecho hijos tuyos.","Ayúdanos a hacer partícipes de tu amor y tu ternura","a todos aquellos con quienes nos encontremos","en nuestra vida de cada día."]],"ord25":[["Oh Dios, generoso en dones y gracias.","Tu Hijo Jesús nos mostró,","con su propia vida,","el camino de la perfecta pobreza.","Haz que los que seguimos sus huellas","experimentemos la plenitud auténtica."],["Oh Dios, fuerza de los que creen en ti.","Dirige tu mirada a los que has invitado a la mesa del Señor","y hazles saborear la gracia que nunca se acaba."],["Oh Dios, fuente de la auténtica justicia.","Te damos gracias por tu amor,","que nos llena hasta rebosar.","Líbranos del apego al dinero,","para que podamos trabajar por la felicidad de todos."]],"ord26":[["Oh Dios, rico en amor y ternura,","que escuchas el grito del que sufre","y respondes a las quejas del pobre.","Dirige tu palabra de salvación","a los que nos hemos reunido en tu presencia,","y haz que con la luz de tu palabra","se ilumine el mundo en que vivimos."],["Oh Dios, misericordioso y compasivo,","que llamas a tu lado a todos los que sufren.","Haz que los que hemos recibido el pan del Señor","nos sintamos llenos del gozo de la salvación."],["Oh Dios, que siempre nos acompañas y nos guías.","Te damos gracias por el don que nos has hecho de unirnos en Cristo.","Haz que escuchemos el clamor de los que nos necesitan","y sepamos ver en ellos a Jesús, el Señor."]],"ord27":[["Oh Dios, Padre nuestro,","que invitas a todos y los ayudas a avanzar por el camino de la fe.","A nosotros, que nos hemos reunido en el nombre de Jesús,","concédenos renovar constantemente nuestro compromiso de fe","y hacer del evangelio nuestra fuerza de vida."],["Oh Dios, fuente de la vida.","Fortalece la fe y el amor de los que estamos en torno a la mesa del Señor,","de manera que, venciendo el sufrimiento en unión con Cristo,","participemos también en el gozo de su resurrección."],["Oh Dios, esperanza de los que creen en ti.","Llena con tu Espíritu a los que has unido a Cristo,","para que podamos seguir caminando","apoyados no en nuestra fuerza, sino en la tuya."]],"ord28":[["Oh Dios, rico en ternura y amor,","que a todos sanas y a todos das tu vida sin medida.","Te pedimos que los que nos hemos reunido hoy aquí","podamos ofrecerte nuestra oración de alabanza","con un corazón unido, lleno de gratitud."],["Oh Dios, fuente de la vida.","Haz que los que aquí y ahora te ofrecemos el pan y el vino","seamos fortalecidos por tu gracia y vivamos una vida nueva."],["Oh Dios, fuerza de nuestra salvación,","que en Cristo, el Señor, nos has dado una vida nueva.","Te pedimos que,","acogiendo la palabra de Jesús «levántate, vete»,","sepamos compartir el evangelio con alegría."]],"ord29":[["Oh Dios, fuerza de los que creen en ti.","Tú escuchas siempre las oraciones de los que te invocan.","Te pedimos que sepamos acercarnos a ti","con una actitud de oración sincera y confiada."],["Oh Dios misericordioso y compasivo.","Fortalecidos por tu palabra de vida y llenos de alegría,","estamos en torno a tu mesa de salvación.","Haz que esta participación sea para todos nosotros","una experiencia viva del amor sobreabundante de Cristo."],["Oh Dios, que guías con cariño a todos los hombres.","Sostén con tu fuerza","los pasos de los que somos enviados al mundo","después de haber participado en la mesa del Señor.","Te pedimos que,","siguiendo la palabra de Jesús y constantes en la oración,","podamos ser signos de esperanza para los hombres."]],"ord30":[["Oh Dios, rico en dones y gracias.","Nos presentamos ante ti tal como somos,","con todas nuestras limitaciones,","y tú nos acoges con tu gran amor.","Aquí nos tienes a todos juntos, pidiéndote","que sepamos confiarlo todo a tus manos."],["Oh Dios, que invitas a todos, sin ninguna distinción.","Te pedimos que este sacramento,","celebrado con un solo corazón,","se convierta para muchos en signo de tu amor."],["Padre misericordioso y compasivo.","Fortalécenos con la gracia de este sacramento,","para que podamos vencer la fuerza del mal","y seguir hasta el final el camino de Jesús."]],"ord31":[["Oh Dios compasivo y misericordioso,","que, para salvar lo que se había perdido,","enviaste al mundo a tu Hijo Jesús.","Concede a los que hoy nos encontramos reunidos aquí","sentirnos llenos de gozo al recibir a Jesús como salvador."],["Oh Dios, Padre de todos los hombres.","Fortalece a tus hijos, invitados a la mesa de Cristo,","para que podamos experimentar profundamente","tu perdón y tu amor."],["Oh Dios todopoderoso.","Ayúdanos a dejar nuestra inercia y pasividad","y a ir al mundo con decisión y valentía,","para que podamos compartir con todos","el gozo del encuentro con Cristo."]],"ord32":[["Oh Dios, que quieres la salvación de todos los hombres.","Tu Hijo, Jesús, nos ha abierto","con su resurrección","las puertas de la salvación eterna.","Derrama sobre nosotros, reunidos aquí, la luz de la esperanza","y llénanos del gozo que no se acaba."],["Oh Dios, fuente de toda vida.","Venimos ante ti trayendo los frutos de nuestro trabajo.","Haz que todos los que nos sentamos a tu mesa","sepamos compartir la alegría de estar vivificados por ti."],["Oh Dios, fuerza de los que creen en ti.","Tú nos envías en medio del mundo a nosotros, que, unidos a Cristo,","hemos participado en su muerte y resurrección.","Haz que sepamos experimentar y apreciar","la abundancia de la vida recibida,","y de este modo testimoniar con fuerza la alegría de vivir."]],"ord33":[["Oh Dios, origen y fundamento de todas las cosas.","Tú sostienes y guías a los que te reverencian.","Fortalece con tu Espíritu a los que se han reunido aquí,","para que, incluso en medio de cualquier adversidad,","puedan seguir las huellas de Jesús."],["Oh Dios, compasivo y misericordioso.","Reunidos en oración ante ti,","te ofrecemos los frutos de nuestro trabajo de cada día.","Haz que este pan y este vino sean para nosotros","alimento de vida que nos mantenga en el camino."],["Oh Dios, origen de la luz.","Ilumina el camino de nuestros pasos,","para que, incluso en medio de los problemas y sufrimientos,","sepamos mantener viva hasta el final nuestra esperanza."]],"rei":[["Oh Dios, Padre nuestro.","Tú nos has mostrado a Jesús clavado en la cruz","como salvador de todos los hombres.","Haz que, celebrando hoy esta fiesta,","comprendamos —por haberlo vivido—","que es precisamente Jesús crucificado","el portador de la paz para el mundo","y el germen de una nueva humanidad."],["Oh Dios, rico en bondad y misericordia.","Haznos experimentar profundamente la alegría de estar en Cristo Jesús,","para que, reunidos en torno a la misma mesa,","podamos ser testigos de tu reino."],["Oh Dios, que derramas sin medida","tu amor sobre nosotros.","Te pedimos que todos los hombres seamos una sola cosa en Cristo,","y que la Iglesia, mientras camina esperanzada","hacia la plenitud de tu reino,","sea instrumento de tu amor y de tu paz."]]}};
const DATA = {"A":{"adv1":[["Oh Déu, Pare nostre.","Vós esteu sempre amb el qui espera i busca la salvació.","Il·lumineu amb la vostra llum els nostres cors","a l’inici de l’Advent,","perquè en un món en què no cessen","les lluites i confrontacions,","sapiguem caminar posant la nostra confiança","en la llum de Crist."],["Oh Déu, ric en dons i en gràcies.","Mentre esperem joiosament la nostra salvació,","us demanem que ens feu tastar profundament","la grandesa del vostre amor quan ens doneu el vostre Fill."],["Sadollats amb el pa de la vida,","envieu-nos Senyor, perquè puguem compartir,","amb tots els que trobem en la nostra vida diària,","l’esperança i alegria que de vós hem rebut."]],"adv2":[["Oh Déu, que cuideu amb afecte de totes les coses","i no pareu de desitjar i esperar la conversió de cadascú.","Ompliu amb el vostre Esperit","els qui ens hem reunit aquí en el nom de Crist,","perquè amb un cor renovat","no deixem mai d’esperar el Salvador","que duu al món un amor sense límits."],["Oh Déu, creador de totes les coses,","que sosteniu i conreeu tota vida.","A tots els qui celebrem avui el Sopar del Senyor","feu-nos la gràcia de tastar profundament","el goig d’estar vivificats per vós."],["Oh Déu, font de la salvació.","Units en el Cos de Crist us demanem que,","posant la nostra confiança en la vostra paraula,","puguem fer amb goig i entusiasme el camí de Jesús."]],"adv3":[["Oh Déu compassiu i misericordiós,","fonament de la nostra existència.","Els nostres cors desborden d’alegria","per la bona notícia del naixement del nostre salvador.","En aquest moment de gràcia, obriu els ulls del nostre cor","i feu-nos descobrir la vostra llum que brilla en la foscor.","Obriu les nostres oïdes","i feu-nos dòcils a la veu de la vostra crida."],["Pare nostre, ple d’amor i de tendresa.","Ompliu del vostre Esperit","els qui ens trobem aplegats al voltant de la vostra taula,","de manera que assaborim profundament","l’amor del Crist que és amb nosaltres."],["Oh Déu, font de la vida.","Conduïu els que acabeu d’alimentar a la taula del Senyor.","Feu que compartim amb tothom l’alegria","que de vós hem rebut","i anunciem al món la visita de la vostra salvació."]],"adv4":[["Oh Déu, que sempre sou amb nosaltres.","Vós ens heu enviat el vostre Fill com a salvador del món.","Us demanem que tots els qui esperem","la propera festa del seu naixement","sapiguem descobrir en la petitesa de l’infant nounat","la llum de l’amor i de l’esperança."],["Oh Déu, ric en dons i en gràcies.","Us presentem aquestes ofrenes amb les quals","nosaltres mateixos ens posem a les vostres mans,","i us supliquem que, en celebrar la mort i resurrecció de Crist,","tastem profundament l’amor amagat","en l’enviament del vostre Fill."],["Oh Déu que vesseu el vostre amor sobre tots els homes.","Ompliu amb el vostre Esperit","els qui per vós som enviats en acabar aquesta celebració.","Feu que compartim amb tothom","l’alegria experimentada","en la celebració del naixement de Crist."]],"qua1":[["Oh Déu, font de la vida.","Jesús, experimentant la prova en el desert,","ens va ensenyar el camí per vèncer les temptacions del mal.","Guieu-nos a nosaltres, que iniciem la quaresma,","perquè puguem viure cada dia vivificats per la vostra paraula."],["Oh Déu, generós en dons i gràcies.","Concediu-nos que, vivificats per la vostra paraula,","assaborim profundament el misteri","de la mort i resurrecció del Senyor."],["Oh Déu, esperança dels qui creuen en vós.","Ompliu amb el vostre esperit i defenseu de tota temptació","els qui per la comunió estem units a Crist,","i concediu-nos viure dia a dia el camí de conversió","en acció de gràcies i alegria."]],"qua2":[["Oh Déu, font de tota llum,","que convideu tots els homes a la salvació.","Ens hem reunit aquí, responent a la vostra crida:","concediu-nos la gràcia de renovar de debò","el nostre compromís de seguir el Crist","en el seu camí cap a la creu."],["Oh Pare, que ens embolcalleu i il·lumineu amb la vostra la llum.","Enfortiu en la fe i en l’amor","els qui convideu a la taula del Crist,","perquè una vegada més","puguem celebrar amb alegria el misteri de la salvació."],["Oh Déu, Pare nostre.","Gràcies per aquesta estona passada en companyia de Jesús","i pel do d’haver-nos unit més estretament a ell.","Concediu-nos que aquest temps de quaresma","ens ajudi a seguir el Crist","i ens porti a treballar per la salvació de tots."]],"qua3":[["Oh Déu, font de la salvació.","Vós heu enviat el vostre Fill Jesús","com a aliment i beguda","que saciés la nostra fam i la nostra set.","Quan, cansats i assedegats,","perdem l’alegria i l’esperança,","renoveu les nostres forces amb l’aigua de la vida","i ajudeu-nos a aixecar-nos i continuar el nostre camí."],["Oh Déu, compassiu i misericordiós,","que rebeu amb alegria tot aquell que, penedit, torna a vós.","Us demanem que, en commemorar l’oferiment de Crist,","us puguem adorar a vós en esperit i en veritat."],["Oh Déu, ric en amor i tendresa.","Jesús, avançant-se, adreçà la paraula a la samaritana","i va tractar de calmar la set del seu cor.","Feu que nosaltres, units a Crist,","visquem l’abundor del vostre amor","per damunt de totes les barreres que separen els homes."]],"qua4":[["Oh Déu, que dirigiu el món amb la força del vostre amor.","Vós ens heu enviat Jesús com a llum veritable d’aquest món.","Us demanem que, creient en ell i fixant en ell la nostra mirada,","puguem vèncer com a fills de la llum la força de les tenebres."],["Oh Déu, que amb la vostra providència guieu tots els homes.","Il·luminats amb la vostra paraula salvadora us demanem que,","mitjançant aquest banquet d’acció de gràcies,","assaborim la profunditat del vostre amor","i quedem plenament enfortits amb un ànim nou."],["Oh Pare, que ens inundeu abundosament amb la vostra gràcia.","El vostre Fill Jesús va vessar la llum del vostre amor","sobre tots els homes.","Us demanem que nosaltres, units a ell,","sapiguem agrair la gràcia rebuda","i donem un testimoniatge decidit de la nostra fe."]],"qua5":[["Oh Déu, misericordiós i compassiu,","vós ens heu salvat de la mort mitjançant Jesucrist.","Omple la vostra església amb l’alegria d’una vida nova,","i renova-la juntament amb els qui en aquesta quaresma","es preparen per a rebre el baptisme."],["Oh Déu, desbordant de gràcies envers els teus fills.","Vessa la vostra benedicció","sobre els qui ens asseiem a la taula del Senyor.","i feu que el nostre cor s’assembli, una mica més, al de Crist,","el qual, oferint-se a si mateix,","va viure el pas de la mort a la vida."],["Oh Déu, que governes totes les coses amb el vostre amor.","En el vostre Fill Jesús ens heu mostrat","la força de l’amor que venç la mort.","Feu que siguem capaços d’anunciar en l’alegria","aquest amor vostre que mai no canvia."]],"pas3":[["Oh Déu, font de l’esperança,","que gràcies a la resurrecció de Crist","ens heu mostrat el camí cap a una vida nova.","Feu que obrim sempre el nostre cor a Crist,","que fa amb nosaltres la nostra vida de fe,","i puguem compartir amb tothom l’alegria de la salvació."],["Oh Déu, misericordiós i compassiu.","El Senyor Jesús està presidint la nostra celebració","i avui també ens convida a la taula del pa de vida.","Us demanem que, renovat el nostre cor de creients,","puguem participar abundosament en la vida de Crist."],["Oh Déu, que vesseu abundosament","la vostra gràcia sobre nosaltres.","Els qui ens heu nodrit amb la vida de Crist,","envieu-nos a la missió d’avui,","per tal que, cadascun en el seu lloc,","siguem testimonis del misteri pasqual del Senyor."]],"pas4":[["Oh Déu totpoderós,","que com a guia i pastor ens heu donat Jesús,","vencedor de la mort.","Concediu-nos que, quan ens trobem perduts","i sense nord a la vida,","sapiguem escoltar la veu de Jesús que ens crida a cadascú."],["Oh Déu misericordiós i compassiu.","Jesús, com a bon pastor, cuida de nosaltres,","ens pastura en prats d’herba fresca","i ens fa descansar a la vora de l’aigua.","Que els convidats al sopar del Senyor","assaborim pregonament aquesta gràcia."],["Oh Déu, font i dador de la vida.","Enfortiu-nos al començament d’una nova setmana,","perquè la nostra vida de cada dia","sigui una resposta a la crida del Crist."]],"pas5":[["Oh Déu, pare compassiu i misericordiós,","que, ressuscitant el vostre Fill Jesús,","ens mostreu el camí de la vida eterna.","Us demanem que, fins i tot enmig del perill i la incertesa,","el nostre cor estigui sempre orientat cap a vós."],["Pare sant,","ara que en aquesta taula celebrem amb alegria","la vida nova de la resurrecció,","feu de nosaltres un poble que us serveixi a vós,","i doneu-nos un cor semblant al de Jesús,","que es va oferir ell mateix per nosaltres."],["Pare, ple de tendresa i amor.","Després de sadollar-nos amb la nova vida,","vós ens envieu enmig del món.","Feu que siguem testimonis joiosos de Crist","que és el camí que ens porta cap a vós."]],"pas6":[["Oh Déu, misericordiós i compassiu.","El vostre Fill Jesús a l’Últim Sopar","va prometre als seus deixebles: «No us deixaré orfes».","Feu-nos la gràcia de viure sempre amb Crist","i d’estar sostinguts, en tota circumstància,","per l’Esperit Sant, que és la nostra ajuda."],["Pare misericordiós i compassiu.","El vostre Fill Jesús es va fer amic de tots","i ens va mostrar l’amor més gran","quan va donar la seva pròpia vida per nosaltres.","Feu que aquest sagrament","ens uneixi més estretament al seu amor."],["Oh Déu totpoderós.","Enfortits amb l’aliment de la vida eterna us supliquem que,","sostinguts per Crist, que està en nosaltres,","visquem la vida de cada dia amb amor i alegria."]],"ord2":[["Oh Déu, que estimeu el món","fins al punt de lliurar al vostre propi Fill.","Vós ens aplegueu, units en la llum de Crist.","Il·lumineu amb la resplendor d’aquesta llum","aquest món nostre, que sofreix les ferides del pecat,","i mostreu-li el camí de la vida."],["Oh Déu, que heu enviat el vostre Fill","per a llevar el pecat del món.","Feu que, per aquests dons que us oferim,","els nostres cors quedin units a vós","i rebin la força per treballar per la salvació."],["Oh Déu, que ens doneu abundosament la vostra gràcia.","Plens de la llum del Crist, us demanem","que sapiguem donar testimoniatge del vostre Fill Jesús","mitjançant la nostra vida."]],"ord3":[["Oh Déu, pare nostre.","Ens reunim enmig del fred hivern","per lloar-vos i donar-vos gràcies.","Avui el vostre Fill Jesús ens comunica,","un cop més, l’evangeli del vostre regne.","Feu que aquesta celebració nostra rebi la vostra llum","i la reflecteixi de tal manera,","que puguem il·luminar la foscor del món."],["Oh Déu, vós creeu i conserveu totes les coses.","Accepteu-nos a nosaltres amb aquests dons que us oferim","i feu que, tenint un sol cor i un sol esperit,","puguem viure el misteri de la mort i resurrecció del Crist."],["Oh Déu, Pare nostre,","que ens doneu contínuament la vostra vida i la vostra força.","Us demanem que, vivificats i moguts per elles,","puguem sentir-nos acompanyats per vós","al llarg d’aquesta setmana que comencem."]],"ord4":[["Oh Déu,","vivim en un món immers en el dolor.","Però, justament, enmig del sofriment","hi trobem la força de la vostra presència salvadora.","Ompliu-nos de l’alegria del vostre regne","a nosaltres que volem escoltar la bona notícia","que Jesús va proclamar a Galilea."],["Oh Déu, font de la vida.","Vós transformeu en aliment nostre","els fruits del nostre treball de cada dia que ara us presentem.","Feu que les nostres penes i sofriments","es transformin també en alegria."],["Oh Déu, que sadolleu els qui tenen fam i set.","Ara, tots junts, hem rebut de vós el nostre aliment.","Us demanem que els qui, encara avui,","es troben mancats del necessari,","puguin veure satisfeta la seva indigència."]],"ord5":[["Oh Déu, llum que il·lumina el nostre món.","Ens heu aplegat aquí com a sal de la terra i llum del món.","Us demanem que també avui,","formant un sol cor amb tots els altres,","puguem lloar la vostra misericòrdia i el vostre amor."],["Pare nostre, que vesseu la vostra llum sobre tota cosa.","Us presentem aquests dons,","fruit dels nostres pobres esforços de cada dia,","i us demanem que, per ells, ens uniu al misteri","de la mort i resurrecció de Crist."],["Oh Déu, pare nostre.","Plens de la vostra llum, us demanem","que ens feu assaborir profundament","la gràcia que de vós hem rebut,","i ens guieu per a acomplir amb alegria","la missió que ens encomaneu."]],"ord6":[["Oh Déu, que ens mostreu el camí de la vida.","Pel vostre Fill Jesús, vós heu portat a la plenitud","la llei que havíeu donat al poble de l’Antic Testament.","Il·lumineu amb la vostra saviesa els qui ens hem reunits aquí","i guieu-nos perquè puguem continuar caminant amb el Crist."],["Pare nostre, que ens heu ensenyat el camí de l’amor.","Ara que us oferim aquests dons,","us demanem que ens feu imitadors del vostre amor","que heu mostrat en la passió del vostre Fill Jesús."],["Oh Déu, que sempre doneu abundosament la vostra gràcia.","Enfortits pel sagrament rebut, us demanem","que ens concediu de discernir","quina és la vostra voluntat en la societat actual,","i que ens guieu per poder anar avançant pel vostre camí."]],"ord7":[["Pare nostre que, per mitjà del vostre Fill Jesús,","ens heu mostrat el vostre amor envers tothom.","Els qui ens trobem reunits aquí","us demanem que, en aquest món nostre,","tan propens a tancar-se sobre si mateix,","sapiguem expressar en les nostres vides","l’amor a vós i al proïsme."],["Pare sant,","el vostre Fill Jesús va pregar pels qui el crucificaven.","Nosaltres, tot oferint-vos aquests dons,","us demanem que, per ells, ens feu participar","de l’amor i el perdó del Crist."],["Pare compassiu i misericordiós,","units a Crist i plens del vostre Esperit,","us demanem que ens deslliureu de la rancúnia i de l’egoisme","i ens feu viure en el vostre amor."]],"ord8":[["Oh Déu, que amb la vostra vida nodriu tots els vivents.","Vós, que alimenteu els ocells del cel","i teniu cura de les flors del camp,","ens nodriu també i us preocupeu de nosaltres","sense oblidar-nos ni un sol moment.","Feu que tots els qui ens hem aplegat aquí,","sapiguem descobrir el vostre amor, present en totes les coses,","i fer créixer també la nostra confiança en vós."],["Us oferim, oh Déu, aquests fruits de la vida","que vós mateix heu creat,","i, units en un sol cor per donar-vos gràcies,","us demanem que sapiguem ser testimonis","el vostre amor i la vostra tendresa."],["Pare nostre, que coneixeu bé tot el que necessitem.","Us agraïm les gràcies rebudes; i també us demanem","que, recordant constantment el vostre amor","–que tantes vegades hem experimentat–,","tinguem amb nosaltres el Crist tot al llarg de la nostra vida."]],"ord9":[["Oh Déu, font de la salvació,","que ompliu de benediccions els qui creuen en vós.","Us demanem que els qui ens hem aplegat avui aquí,","obrim el nostre cor a la vostra paraula","i sapiguem mantenir ferma la confiança en vós."],["Oh Déu, força dels qui creuen en vós.","Accepteu-nos a nosaltres mateixos juntament amb aquests dons,","i doneu-nos la força de mantenir-nos fidels la vostra paraula."],["Oh Déu, que ens alimenteu i teniu cura de nosaltres.","Guardeu i protegiu els qui heu sadollat amb l’aliment de la vida.","Feu que, sostinguts per una fe sòlida en tota circumstància,","puguem avançar pel camí cristià","amb entusiasme i alegria."]],"ord10":[["Oh Déu, font de l’amor.","Vós convideu tothom al banquet de salvació,","i els doneu consol i esperança.","Dirigiu la vostra mirada sobre els qui ens hem aplegat aquí,","i, així com la pluja amara i fecunda la terra,","vesseu, vós també, el vostre amor i la vostra tendresa","sobre nosaltres."],["Oh Déu, pare de tots nosaltres.","Jesús convidava els pecadores i s’asseia a taula amb ells.","Us demanem que nosaltres,","que ens asseiem a la taula del Senyor,","siguem capaços de perdonar-nos mútuament."],["Oh Déu, que sou sempre amb nosaltres.","Enfortiu amb la vostra força","els qui heu alimentat amb el cos de Crist,","perquè, a imitació d’ell, que convidava els pecadors,","visquem amb el cor obert a tots els germans."]],"ord11":[["Oh Déu, que guieu sempre els nostres passos.","Vós cerqueu treballadors per a l’evangeli del vostre regne.","Ompliu-nos de la vostra benedicció, a nosaltres que,","decidits a seguir el Crist, ens hem reunit aquí;","i refermeu-nos un cop més amb la vostra paraula."],["Oh Déu, només vós sou sant.","Accepteu aquests dons que us presentem de tot cor,","i feu que, responent a la vostra invitació,","ens vegem enfortits per a treballar pel vostre regne."],["Oh Déu, font i donador de tota vida.","Afermeu amb la vostra gràcia","els qui heu alimentat a la taula del Senyor,","perquè les paraules i obres dels qui seguim Jesús","siguin bona notícia per a tothom."]],"ord12":[["Oh Déu, que us preocupeu fins i tot del més petit dels ocells.","Vós ens guardeu sempre i ens protegiu amb amor.","Us demanem que, vencent tot neguit i incertesa,","creixi cada dia la nostra confiança en vós."],["Oh Déu, vós sou el nostre pare.","Unim el nostre cor al de Jesús,","que va seguir el camí de la creu;","i, ara que ens disposem a rebre el pa de la salvació,","us demanem que ens ompliu de confiança en vós."],["Oh Déu, company nostre en la vida.","Plens de goig pel fet de compartir la vida de Crist,","us preguem que, units a ell,","fem de la nostra vida","un testimoni joiós i decidit de la nostra fe."]],"ord13":[["Oh Déu,","vós coneixeu prou bé el que nosaltres cerquem i necessitem.","Doneu-nos força per seguir buscant la forma autèntica de vida,","i feu que, en la invitació de Crist que ens diu:","«que cadascú prengui la seva creu i em segueixi»,","hi sapiguem trobar la veritable llum que guiï la nostra vida."],["Oh Déu, font de la salvació.","Envoltant la taula de l’altar, us demanem","que, units a Crist, que va seguir el camí de la creu,","puguem participar també en la vida de la resurrecció."],["Pare nostre, font de la vida.","Feu que assaborim profundament la gràcia del sagrament","que junts acabem de celebrar,","i que, com a seguidors de Crist,","visquem la nostra vida de cada dia amb goig al cor."]],"ord14":[["Pare nostre, Senyor del cel i de la terra.","El vostre Fill Jesús ofereix sempre el repòs","als qui se senten afeixugats pel jou de la vida.","Feu que, els qui ens hem reunit aquí,","sapiguem portar la pau de Crist","a un món aclaparat per les lluites i les dificultats."],["Oh Déu, que doneu aliment a tots els éssers vivents.","Juntament amb aquests dons,","accepteu també la nostra pregària.","Us demanem que els qui rebem el cos de Crist","imitem l’actitud del seu cor humil i senzill."],["Agraint la gràcia rebuda, us demanem, Pare,","que, tot assumint el jou de la vida,","com a deixebles que som de Crist","sapiguem oblidar-nos de nosaltres mateixos","i esmerçar la nostra vida en bé de tothom."]],"ord15":[["Oh Déu, vós adreceu la vostra crida a tothom.","Com aquella gent a la vora del mar de Galilea,","també nosaltres escoltem avui la paraula de Jesús.","Feu que sapiguem acollir profundament en el nostre cor","aquest anunci joiós."],["Oh Déu, la vostra gràcia s’escampa sobre totes les coses.","Us lloem i us agraïm els fruits de la terra,","i us demanem que els qui hem sembrat la llavor evangèlica","ens unim més íntimament a Crist per mitjà d’aquest àpat."],["Pare compassiu i misericordiós.","Feu que, els qui participem en la vida del vostre Fill Jesús,","sapiguem compartir amb tothom aquesta gràcia","i en recollim fruits abundosos."]],"ord16":[["Oh Déu, que estimeu sol·lícitament totes les coses.","Vós sembreu en el món la bona llavor","i acompanyeu la seva creixença amb tendresa i paciència.","Us demanem","que tots nosaltres ens sapiguem estimar mútuament","i que, com a fills vostres estimats que som,","creixem en el vostre amor."],["Oh Déu, ple d’amor i de tendresa.","Després d’escoltar la vostra paraula","i de renovar el nostre cor,","us presentem els nostres dons,","i us demanem que, els qui celebrem el memorial de Crist,","contribuïm també a l’expandiment del vostre regne."],["Pare, ric en dons i gràcies,","que ens heu fet u en Jesucrist.","Ensenyeu-nos a no fixar-nos en els defectes dels altres,","i, en canvi, a saber descobrir","el vostre amor present i actuant en el nostre món."]],"ord17":[["Oh Déu, vós que sou amor,","ens manifesteu contínuament les riqueses del vostre regne.","Aplegats ara davant vostre, us demanem","que siguem capaços descobrir en la paraula de Crist","la vostra alegria i la vostra llum per a la nostra vida."],["Pare sant,","que ens convideu al banquet del vostre regne.","Feu que responguem promptament a la vostra invitació."],["Déu i Senyor nostre,","concediu-nos que sapiguem discernir","en la nostra vida de cada dia","allò que de debò té valor d’autèntic tresor,","i que amb cor decidit fem cas de la vostra paraula."]],"ord18":[["Oh Déu, que alimenteu amb la vostra gràcia","els qui tenen fam i set.","Us lloem pel vostre amor tan gran","i us demanem","que sapiguem escoltar i posar en pràctica la vostra paraula,","per tal de poder mantenir-nos en la vida veritable."],["Déu nostre.","Feu que avui, també nosaltres assaborim","el misteri del pa amb què Jesús","va satisfer la fam dels seus seguidors,","de manera que mitjançant aquest sagrament","ens unim més profundament al Crist."],["Oh Déu, de qui hem rebut la vida.","Alimentats amb el menjar veritable,","us demanem de poder compartir amb tothom","l’abundor que hem rebut en la paraula i el cos de Crist."]],"ord19":[["Oh Déu, que ens mireu amb tant d’amor.","Enfortiu els qui ens hem aplegat cercant la salvació.","Ajudeu-nos a superar les nostres angúnies i desesperances","i ompliu-nos de la vostra força","perquè sapiguem complir fidelment la vostra paraula."],["Oh Déu, que ens doneu el vostre amor","i ens manteniu amb el vostre alè.","Contents de trobar-nos a la taula del Senyor,","us demanem que, mitjançant el misteri que ara celebrem,","la paraula de Jesús ressoni i penetri en nosaltres,","de manera que s’enforteixi la fe del nostre cor."],["Oh Déu, que sou sempre amb nosaltres.","Tot agraint la gràcia rebuda, us demanem","que –en aquest món nostre, aclaparat per conflictes i ansietats– sapiguem anunciar el Crist amb fermesa i valentia."]],"ord20":[["Oh Déu, font de la salvació.","Accepteu complagut els desigs de tots els qui som aquí","i, malgrat que experimentem la nostra feblesa i defallença,","feu que ens mantinguem ferms","en l’esperança de la vostra salvació."],["Oh Déu, Pare de tots nosaltres.","Beneïu amb la vostra gràcia aquest banquet de pregària","i a tots els qui alimenteu, perquè són el vostre poble,","concediu-los d’apropar-se cada cop més al cor de Crist."],["Oh Déu, que ens concediu de participar en el do de la vida.","Ja que ens heu renovat les forces,","feu de nosaltres els vostres enviats","perquè puguem donar resposta als qui cerquen ajuda."]],"ord21":[["Oh Déu, que ens heu enviat el vostre Fill Jesús com a salvador.","Enfortiu la fe dels qui ens hem aplegat aquí,","per tal que, nodrits amb la vostra paraula,","donem un testimoniatge ben animós del Crist."],["Oh Déu, que per la mort i resurrecció de Crist,","ens heu obert el camí del vostre regne.","Convidats a la taula de la salvació i plens goig,","volem celebrar l’acció de gràcies formant un sol cor."],["Oh Déu, font de la vida.","Rebeu l’oració que us oferim en acció de gràcies","i concediu-nos que, units a Crist,","vencem la força del mal","i esdevinguem portadors de la bona nova de la salvació."]],"ord22":[["Oh Déu, pare nostre, que mitjançant el vostre Fill Jesús,","ens heu mostrat quin és el camí per a complir la vostra voluntat.","Feu que els qui ens hem aplegat aquí","trobem esperança quan ell ens parla","i plenitud quan fem amb ell el camí de la vida."],["Oh Déu, esperança dels qui sofreixen.","Enfortits amb la vostra paraula de salvació i plens de gratitud,","acudim a vós i us supliquem","que, a tots els qui commemorem la mort i resurrecció de Jesús,","ens feu forts per a portar la creu juntament amb ell."],["Oh Déu, font de la vida.","Plens de la vostra gràcia us demanem que, units a Crist,","sapiguem posar-ho tot a les vostres mans","i esmerçar la vida en bé dels altres."]],"ord23":[["Oh Déu, vós ens heu convocat","perquè, vivint com a germans i germanes, formem un sol poble.","Reunits en el nom de Crist, us demanem","que siguem capaços d’enriquir-nos els uns als altres","i d’avançar plegats pel mateix camí."],["Oh Déu, compassiu i misericordiós.","Aquí, entorn de la mateixa taula, us demanem","que, els qui unim el nostre amor al de Crist en el seu oferiment,","comprenguem que l’amor és la plenitud de tot."],["Oh Déu, que guieu contínuament el vostre poble.","Enfortits amb el pa de la vida","us supliquem que la vostra església","continuï sense parar la seva conversió cap a vós,","i, com a família vostra, mostri al món l’amor veritable."]],"ord24":[["Oh Déu, font de l’amor.","A aquest món nostre afligit per lluites i divisions","vós li heu mostrat el camí del perdó i la reconciliació.","Feu que nosaltres, com a seguidors del Crist,","sapiguem acceptar-nos mútuament","i així donar testimoni del vostre amor."],["Oh Déu, ric en amor i compassió.","Convertiu les nostres ofrenes","en signe de reconciliació i perdó veritables,","perquè, perdonant-nos de cor mútuament,","puguem asseure’ns a la taula del Senyor."],["Enfortits per la gràcia que acabem de rebre,","us demanem, Déu nostre,","que, sentint-nos sempre vivificats pel vostre amor,","puguem fer de la nostra vida de cada dia","una contínua acció de gràcies."]],"ord25":[["Oh Déu, que sempre sou al nostre costat.","El vostre pensament ultrapassa el nostre pensament,","la vostra mirada esguarda totes les coses","i el vostre amor no té fons ni té límit.","A tots els qui avui –reunits aquí–","adrecem vers vós els nostres cors,","feu que descobrim el vostre amor,","que val més que cap altra cosa."],["Oh Déu, que doneu a cadascú allò que necessitem.","Feu que aquest pa i vi que us oferim,","esdevinguin portadors de la vida autèntica."],["Oh Déu, pare nostre.","Envieu-nos avui un cop més,","perquè, enfortits amb l’aliment que ens heu donat,","puguem treballar pel vostre regne","cadascú en els nostres propis ambients."]],"ord26":[["Oh Déu, que guieu tota persona a actuar amb generositat.","Vós, que coneixeu els nostres sentiments més profunds,","acompanyeu-nos en el camí de la fe,","perquè puguem viure sempre amb el cor orientat cap a vós."],["Oh Déu, font de la vida.","Crist es va lliurar totalment ell mateix pel bé de tothom.","Us demanem que, per mitjà d’aquest àpat salvador,","puguem assaborir profundament l’amor del Crist."],["Oh Déu, que estimeu tots els homes i dones.","Units a Crist, i amb un cor humiliat,","us demanem que, amb la nostra vida,","puguem donar testimoniatge","del camí que fem en el teu seguiment."]],"ord27":[["Oh Déu, font de qui hem rebut la vida.","Vós guardeu i conreeu totes les coses,","perquè donin fruit abundós.","Feu que, tenint sempre el cor orientat i obert","a la vostra acció salvadora,","puguem respondre com cal a aquest amor vostre."],["Oh Déu, creador i suport de totes les coses.","Us presentem aquest pa i aquest vi, fruits de la terra,","i us supliquem","que, per a tots els qui –donant gràcies–","ens trobem a l’entorn de la vostra taula,","es facin abundosa realitat les obres de la vostra salvació."],["Us lloem i us donem gràcies, Pare,","i us demanem","que, plens de la vostra benedicció generosa,","donem fruits abundants en la nostra vida diària."]],"ord28":[["Oh Déu, font de l’esperança,","que convideu tothom a la taula del vostre regne.","Som aquí, davant vostre,","cadascú amb els seus neguits i esperances.","Feu que descobrim i assaborim el vostre amor,","i que hi corresponguem com cal de paraula i d’obra."],["Pare compassiu i misericordiós.","Beneïu aquesta taula que hem preparat amb molta il·lusió.","Us demanem que, tots els qui participem plegats","en el goig del misteri del vostre amor,","ens sentim sempre units a vós."],["Oh Déu, que camineu amb nosaltres pel camí de la vida.","Feu-nos tastar el goig de sentir-nos enviats per vós,","per tal que, compartint amb tothom la salvació de Crist,","els puguem convidar al banquet del vostre regne."]],"ord29":[["Oh Déu, que governeu tot l’univers","i guieu tots els homes i dones a la salvació.","Beneïu aquest poble vostre, aplegat per a lloar-vos ple de goig.","Graveu ben fort en els nostres cors","que solament vós sou el Senyor,","i obriu-nos a la vostra paraula salvadora."],["Oh Déu, creador de totes les coses.","Us presentem aquest pa i aquest vi que hem rebut de vós,","Us demanem que,","igual com Jesús sabé retornar-vos tot el que era vostre,","també nosaltres ho sapiguem fer avui","units íntimament al seu oferiment."],["Oh Déu, Senyor de totes les coses.","Us donem gràcies pel do de participar junts en la vida de Crist,","i us demanem que desvetlleu la nostra consciència","a la vostra justícia i al vostre amor,","perquè construïm un món de pau,","on sigui respectada la vida i la dignitat de totes les persones."]],"ord30":[["Oh Déu, vós ens heu enviat el vostre Fill Jesús,","perquè coneguéssim el vostre amor sense límits.","Feu que tinguem sempre presents els ensenyaments de Crist","i així puguem viure","una vida plena en l’amor a vós i a tothom."],["Oh Déu, font de l’amor.","Ara que ens disposem a recordar Jesús,","que va dur fins a l’extrem el seu amor","a vós i a tota la humanitat,","us demanem que, per aquesta participació","en el misteri de la seva mort i resurrecció,","lloem amb totes la nostres forces aquest triomf del seu amor."],["Oh Déu, fonament i suport de tots els homes i dones.","Feu-nos forts a tots els qui, units a Crist, ara serem enviats.","Que, moguts pel vostre amor,","puguem donar suport als qui necessiten ajut."]],"ord31":[["Oh Déu, el nostre únic pare.","Sense la vostra gràcia no podem donar-vos culte","amb docilitat de cor.","Feu-nos sentir el goig de viure com a fills vostres","a tots els qui, davant vostre,","ens sentim igualment petits i febles."],["Oh Déu,","que heu il·luminat la nostra vida amb la llum de l’evangeli.","Estem celebrant de cor","el misteri de la mort i resurrecció de Crist.","Us demanem que ens assemblem al vostre Fill,","que es va fer servidor fins a la mort de creu."],["Oh Déu, font de l’amor,","que ens feu sentir el goig de compartir el pa de la vida","i, vivificats amb aquest aliment, ens envieu al món.","Feu que ens fem de debò germans","de tots els qui se senten aclaparats pel pes de la vida."]],"ord32":[["Oh Déu totpoderós,","que actueu amb el vostre alè en la història humana","i porteu totes les coses a la seva plenitud.","Obriu els ulls dels qui ens hem aplegat aquí,","mestre esperem el retorn del Senyor,","i feu que sapiguem discernir el que ens cal fer ara i aquí."],["Oh Déu,","que ens heu donat el vostre Fill Jesús com a espòs.","Plens d’alegria","per haver-nos convidat al banquet de la salvació,","us demanem de poder participar dignament en aquest misteri","i de poder rebre Crist el Senyor."],["Déu i Pare nostre.","Units en la mort i vida de Crist Jesús,","us demanem que, fins i tot enmig de les tenebres","d’un món dominat per l’odi i la mentida,","sapiguem viure brandant la torxa de la fe i de l’amor."]],"ord33":[["Oh Déu, que vesseu abundosament la vostra gràcia","sobre cadascú de nosaltres.","Mira benvolent els qui, des del treball de la vida diària,","hem vingut en aquesta festa d’acció de gràcies","per correspondre a la vostra invitació.","Feu que trobem repòs a l’escalf del vostre amor","i renoveu-nos les ganes de viure més plenament el do de la vida."],["Oh Déu nostre,","el vostre Fill Jesús és per a nosaltres","el do més preciós que hem rebut de vós.","Us demanem que, mitjançant el sagrament que ell ens va deixar,","assaborim la profunditat del vostre amor."],["Oh Déu, que ens alimenteu","amb la paraula de la salvació i amb el pa de la vida.","Vós poseu a les mans de cadascú de nosaltres","aquest tresor que sou vós mateix.","Feu que, aprofitant com cal els dons rebuts,","aconseguim el goig d’estar sempre amb vós."]],"rei":[["Oh Déu, totpoderós i etern.","Totes les coses, creades per Crist,","es reuneixen i completen de nou en ell com a rei.","Us demanem que, els qui posem la nostra esperança","en la seva paraula i esperem la seva vinguda,","visquem fins a la fi dels temps, en l’amor que no passa mai."],["Pare compassiu i misericordiós,","que heu reconciliat totes les coses","en la mort i resurrecció del vostre Fill Jesús.","Celebrant entorn de la vostra taula aquesta gràcia de salvació,","ompliu fins a vessar els nostres cors del goig de la unitat."],["Oh Déu, ric en gràcies i dons.","Gràcies al perdó que hem rebut en aquest sagrament,","s’ha enfortit una vegada més la nostra unió amb el Crist.","Ara que som enviats al món,","us demanem que cadascú de nosaltres","sapiguem descobrir Crist en el germà necessitat,","siguem capaços de compartir el seu sofriment","i de sostenir-nos els uns als altres."]]},"B":{"adv1":[["Oh Déu, que vesseu sobre nosaltres la llum de l’esperança.","Obriu els ulls del nostre cor en aquest inici de l’Advent,","perquè sapiguem discernir la vostra voluntat","en la nostra vida de cada dia,","i la puguem viure seguint els passos de Crist Jesús."],["Oh Déu, ric en dons i gràcies.","Mentre esperem amb joia la nostra salvació,","us demanem que ens feu conèixer profundament","la grandesa de l’amor","que ens heu mostrat donant-nos el vostre Fill."],["Als qui ens heu sadollat amb el pa de la vida,","envieu-nos, Senyor,","perquè puguem compartir","l’esperança i el goig que de vós hem rebut,","amb tots els qui ens trobem en la nostra vida de cada dia."]],"adv2":[["Oh Déu, pare nostre, ple d’amor i misericòrdia.","A aquest món nostre, turmentat i adolorit.","vós li prepareu el camí de la salvació.","Vesseu abundosament el vostre Esperit","sobre els qui ens trobem reunits aquí,","perquè, girant-nos de cor cap a vós,","puguem fer camí juntament amb el Crist."],["Oh Déu, creador de totes les coses,","que manteniu i cuideu tota vida.","A tots els qui celebrem avui el Sopar del Senyor","concediu-nos la gràcia d’assaborir plenament","el goig de sentir-nos vivificats per vós."],["Oh Déu, font de la salvació.","Units en el Cos de Crist us demanem que,","els qui hem posat la nostra confiança en la vostra paraula,","puguem fer amb goig i entusiasme el camí de Jesús."]],"adv3":[["Oh Déu, pare de tots els homes.","Vós feu brillar la llum enmig de la tenebra","i mudeu en goig la tristesa.","Vesseu la llum de la fe i de l’esperança,","en els cors dels qui ens hem reunit aquí","i ompliu-nos de goig per la vinguda del Crist Jesús."],["Pare nostre, ple de tendresa i amor.","Ompliu del vostre Esperit","els qui ens apleguem entorn de la vostra taula,","per tal que assaborim profundament","l’amor del Crist que és amb nosaltres."],["Oh Déu, font de la vida.","Guieu els que acabeu d’alimentar en la taula del Senyor.","Feu que compartim amb tothom","el goig que hem rebut de vós","i anunciem al món la visita de la vostra salvació."]],"adv4":[["Oh Pare, Déu etern.","En enviar-nos el vostre Fill,","vau escollir María com a mare del Salvador.","Us demanem que nosaltres, fent com ella,","rebem Jesús amb amor i alegria","i visquem sempre units a ell."],["Oh Déu, ric en dons i gràcies.","Us presentem aquests dons,","amb els quals nosaltres mateixos","ens posem a les vostres mans.","Concediu-nos, que en celebrar la mort i resurrecció de Crist,","assaborim profundament","l’amor que ens heu mostrat en enviar-nos el vostre Fill."],["Oh Déu que vesseu el vostre amor sobre tots els homes.","Ompliu amb el vostre Esperit","els qui som enviats en el comiat d’aquesta celebració.","Feu que compartim amb tothom","el goig que sentim en la celebració del naixement del Crist."]],"qua1":[["Oh Déu, ric en amor i misericòrdia,","que convideu tothom a l’alegria del vostre regne.","En aquest inici de la quaresma us demanem que nosaltres,","(membres de l’Església que acull avui els catecúmens)","renunciem al mal i visquem creient de debò l’evangeli."],["Oh Déu, generós en dons i gràcies.","Concediu-nos que, vivificats per la vostra paraula,","assaborim profundament","el misteri de la mort i resurrecció del Senyor."],["Oh Déu, esperança dels qui creuen en vós.","Ompliu amb el vostre esperit i defenseu de tota temptació","els qui per la comunió estem units al Crist,","i concediu-nos de viure cada dia el camí de conversió","en acció de gràcies."]],"qua2":[["Oh Déu, ple de glòria i esplendor.","Vós vau assenyalar com a «fill estimat» vostre","aquell Jesús que s’encaminava cap a la passió.","Feu que nosaltres, que escoltem i seguim la seva paraula,","continuem fent –com a fills vostres– el camí de la nostra vida."],["Oh Pare, que ens envolteu i il·lumineu amb la vostra llum.","Feu més forts en la fe i en l’amor","els qui convideu a la taula de Crist,","perquè amb goig puguem celebrar una vegada més","el misteri de la salvació."],["Oh Déu, pare nostre.","Gràcies per aquesta estona que hem passat","en companyia de Jesús","i pel do d’haver-nos unit més estretament amb ell.","Concediu-nos que aquest temps de quaresma","ens ajudi a seguir el Crist","i ens dugui a treballar per la salvació de tothom."]],"qua3":[["Oh Déu, força dels qui esperen en vós.","El vostre Fill Jesús ens va ensenyar","–fins i tot arriscant la seva vida–","com hem de viure en l’amor envers vós.","Feu que nosaltres, que celebrem la litúrgia quaresmal","(acompanyant els qui es preparen per rebre el baptisme)","tornem cap a vós i aprofundim la fe i l’amor."],["Oh Déu, que heu establert amb nosaltres una aliança nova.","Per a nosaltres, seguidors de Jesús,","ja no hi ha ni temple ni ofrenes.","En commemorar en aquest sopar l’oferiment únic de Crist,","–que es va oferir ell mateix per nosaltres–,","uniu-nos fortament a vós, que sou la font de l’amor."],["Oh Déu, que amb la vostra vida abundosa","nodriu tots els qui creiem en vós.","Reunits com a cos de Crist en una sola església,","us demanem que vesseu sobre nosaltres un nou alè,","que ens faci esdevenir signe visible del vostre amor."]],"qua4":[["Oh Déu, font de tota gràcia,","que en la mort de Jesús a la creu,","ens mostràreu el vostre amor a tots els homes.","Feu que, posant la nostra esperança en Crist, llum de salvació,","visquem la nostra vida amb una fe ben animosa."],["Oh Déu, compassiu i misericordiós,","que vau estimar tant el món","que li vau donar el vostre propi Fill.","Concediu als qui ara celebrem plegats el sopar del Senyor","que tots i cadascú tastem intensament","la gràcia del vostre amor."],["Oh Déu, llum dels nostres cors.","Sadollats amb la plenitud del vostre amor","i com a fills de la vostra llum,","us demanem que puguem compartir amb tothom","el goig de creure en Jesús."]],"qua5":[["Oh Déu, pare nostre.","Portant al límit l’amor i l’obediència,","el vostre Fill Jesús va recórrer voluntàriament","el camí de la passió per a la salvació de tots.","Feu que també nosaltres,","posant en vós la nostra confiança,","puguem fer sense por el camí de Jesús."],["Oh Déu, font i donador de tota vida.","Us oferim de tot cor aquest pa,","–blat mòlt, pastat i cuit al foc–,","com a expressió de la vida i amor de Crist.","Que sigui per a nosaltres aliment de nova vida."],["Oh Déu, força de tots els qui creuen en vós.","Ompliu de la vostra llum els qui formem un sol cos en Crist,","perquè, fins i tot enmig del sofriment i de l’adversitat,","no perdem mai l’esperança i la fe en vós,","i transparentem en la nostra vida la llum del vostre amor."]],"pas3":[["Oh Déu, font de la salvació,","que mitjançant la resurrecció de Crist","heu alliberat el món del domini del pecat i de la mort.","Enfortiu amb la vostra paraula","els qui heu cridat i unit en un sol poble,","i feu que siguem testimonis de la resurrecció del Senyor."],["Oh Déu, misericordiós i compassiu.","El Senyor Jesús està presidint la nostra celebració","i avui ens convida a la taula del pa de la vida.","Us demanem que, renovat el nostre cor de creients,","puguem participar abundosament en la vida de Crist."],["Oh Déu, que vesseu la vostra gràcia sobre nosaltres.","Ara que ens heu alimentat amb la vida de Crist,","envieu-nos a la missió d’avui,","per tal que, cadascú en el seu lloc,","donem testimoniatge del misteri pasqual del Senyor."]],"pas4":[["Oh Déu, font de la vida.","Jesús, com a bon pastor,","va donar la seva vida per nosaltres amb un amor infinit.","Us demanem que, aplegats als seus peus amb un sol cor,","anem fent-nos cada dia més semblants al seu amor."],["Oh Déu misericordiós i compassiu.","Jesús, com a bon pastor, té cura de nosaltres,","ens pastura en prats deliciosos","i ens fa descansar vora l’aigua.","Que els convidats al sopar del Senyor","sapiguem assaborir pregonament aquesta gràcia."],["Oh Déu, font i donador de la vida.","Enfortiu-nos, ara que comencem una nova setmana,","perquè la nostra vida de cada dia","sigui la nostra resposta a la crida del Crist."]],"pas5":[["Oh Déu, font de la vida,","que no abandoneu mai el qui confia en vós,","sinó que el guieu i sosteniu.","Feu que els qui ens hem reunit com a cos de Crist,","formem un sol cor,","i fem més forts aquests vincles d’unitat i d’amor."],["Pare sant.","Ara que en aquesta taula celebrem amb goig","la vida nova de la resurrecció,","feu de nosaltres un poble que us serveixi a vós,","i doneu-nos un cor proper al de Jesús,","que es va oferir a si mateix."],["Pare, ple de tendresa i amor,","que ara envieu al món","els qui ens heu sadollat amb la nova vida.","Feu que siguem testimonis joiosos de Crist","com a Camí que condueix cap a vós."]],"pas6":[["Oh Déu, font de la vida.","Quan nosaltres mirem de viure en l’amor,","vós sou sempre al nostre costat.","En celebrar aquest diumenge la resurrecció de Jesús,","feu que trobem el goig veritable en la llei de l’amor."],["Pare misericordiós i compassiu.","El vostre Fill Jesús es va fer amic de tothom","i donant la seva pròpia vida per nosaltres,","ens va mostrar el súmmum de l’amor.","Feu que aquest sagrament es uneixi estretament al seu amor."],["Oh Déu, pare bo.","Enfortits amb l’aliment de la vida eterna","us supliquem que, sustentats per Crist que està en nosaltres,","visquem la vida de cada dia amb amor i alegria."]],"ord2":[["Oh Déu,","que feu sentir la vostra veu en el cor de cada persona.","El vostre Fill Jesús, enviat al món,","va proclamar l’evangeli amb la seva vida.","Us demanem que tots els qui avui obrim el cor","a la vostra paraula salvadora","arribem a descobrir el camí que duu a la vida."],["Oh Déu, que ens doneu abundosament","el vostre amor i el vostre afecte.","Com a resposta a aquest amor","que Jesús, el vostre Fill, ens donà,","concediu-nos de romandre també avui prop d’ell","i d’asseure’ns amb goig a la seva taula."],["Oh Déu, font de la vida.","Amb el goig experimentat en el sopar del Senyor,","us demanem que els qui hem rebut la vostra força a través d’ell, expressem en la nostra vida el goig que ens fa de seguir-lo."]],"ord3":[["Oh Déu, font de la vida.","Mireu amb ulls comprensius aquesta nostra fragilitat humana, que ens fa caure esclaus dels canvis constants d’aquest món.","Renoveu el cor dels qui ens hem aplegat aquí,","perquè caminem seguint les petjades de Jesús."],["Oh Déu, esperança dels qui es penedeixen.","Mireu amb bondat els qui, responent a la vostra crida,","ens hem reunit entorn de la vostra taula,","i feu que, unint els nostres cors a l’oferiment de Crist,","siguem capaços d’oferir-nos nosaltres mateixos."],["Oh Déu, font de l’alegria.","Alimentats i renovats amb la paraula de Crist","i amb el pa de vida,","us demanem que,","els qui som enviats a les tasques de la vida de cada dia,","siguem diligents en la construcció del vostre regne."]],"ord4":[["Oh Déu, que ens crideu a la conversió.","El vostre Fill Jesús –tot rebutjant el mal–","ens va mostrar la força il·limitada de la vostra salvació.","Vesseu l’alè i la força del vostre esperit","sobre els qui avui ens hem aplegat per lloar-vos."],["Oh Déu, que voleu la salvació de tots els homes i dones.","Enrobustits amb la vostra paraula","i plens d’esperança, us demanem","que enfortiu els qui heu reunit en el banquet de salvació","i ens feu assaborir el goig de servir-vos."],["Oh Déu, que ens heu unit en vós formant un sol cos.","Plens d’aquesta vida vostra us demanem","que amb tots els qui trobem en la nostra vida de cada dia","sapiguem compartir la paraula que Jesús proclamà","amb força i autoritat."]],"ord5":[["Oh Déu,","que vesseu sobre nosaltres la llum de l’esperança.","Vós enviàreu Jesús com a salvador","a un món turmentat i adolorit.","Us demanem que,","mitjançant els sagraments que avui celebrem,","nosaltres trobem el Crist que sana tots els homes."],["Oh Déu, que doneu la força per viure.","Escolteu la pregària","dels qui ens hem aplegat entorn de la vostra taula,","per tal que, units en l’amor de Crist,","experimentem el goig complet del mutu servei."],["Oh Déu, que ens ompliu amb l’alè del vostre Esperit.","En les nostres caigudes","vós mateix ens allargueu la mà i ens aixequeu.","Us demanem que, renovats amb la vostra força,","proclamem l’evangeli amb decisió i entusiasme."]],"ord6":[["Oh Déu, font de la salvació,","que mitjançant la paraula i vida del vostre Fill Jesús","heu mostrat el vostre amor al món.","Inclineu la vostra oïda a la veu dels qui cerquen la salvació","enmig de les penes i el dolor,","i oferiu-los, compassiu, la tendresa de la vostra mà."],["Oh Déu, que ens saneu en el cos i en l’esperit.","Enfortits amb la paraula de salvació,","us supliquem que, en celebrar el sagrament d’acció de gràcies,","siguem units al sofriment de Crist crucificat","i associats al goig de la seva resurrecció."],["Oh Déu, ric en amor i tendresa.","Plens del goig de la vostra salvació,","us demanem que,","el qui som enviats amb la força del vostre Esperit,","visquem amb entusiasme la missió que ens heu confiat","de ser portadors de la vostra paraula."]],"ord7":[["Oh Déu, que renoveu el món amb l’alè del vostre Esperit.","Aquí ens teniu, reunits,","amb la nostra esperança posada en Crist.","Us demanem que tots els qui –per damunt d’enemistats i lluites–","busquem la gràcia del mutu perdó,","trobem l’amor i perdó que vós ens oferiu en Crist."],["Oh Déu,","que perdoneu els vostres fills i filles amb amor i tendresa.","Enfortits amb la vostra paraula salvadora","us demanem que els qui compartim el mateix cos de Crist,","aprofundim la nostra mútua unitat."],["Oh Déu, que ens ompliu de vida nova.","Amb el goig d’haver participat en la taula del perdó,","us demanem","que avui ens aixequem altra vegada de les nostres caigudes","i visquem la vida de cada dia com a seguidors de l’evangeli."]],"ord8":[["Oh Déu, font de la salvació,","que avui ens adreceu novament la vostra paraula","als qui ens trobem aplegats aquí.","Renoveu els nostres cors mitjançant aquesta paraula","i feu que ens ompli el goig de sentir-nos sempre","acompanyats per Crist."],["Oh Déu, ric en amor i tendresa.","Amb el goig de sentir-nos convidats al banquet de la salvació,","us demanem","que els qui ens hem reunit entorn de la vostra taula","tinguem un sol cor,","perquè puguem ser dignes de participar de la nova aliança."],["Oh Déu, que ens sadolleu amb el pa de la vida.","Plens d’alegria per saber-nos els vostres enviats","us demanem que cadascú de nosaltres,","com a servidor de l’evangeli,","sàpiga comunicar la vostra paraula, sempre actual i vàlida,","a tothom amb qui es trobi en la seva vida de cada dia."]],"ord9":[["Oh Déu, creador de tot l’univers.","La vostra mirada està sempre atenta a tot el que heu creat","i el vostre amor es vessa constantment","sobre aquell que sofreix o s’afebleix.","Us demanem que els que ens hem reunit aquí per lloar-vos","trobem descans als peus del Crist","i siguem plenament renovats amb la seva força."],["Oh Déu,","que vesseu sense mesura el vostre amor sobre nosaltres.","Enfortits amb la vostra paraula i plens de goig","us demanem, Senyor, que ompliu de la vida de Crist,","tots els qui ens asseiem a la taula de la salvació","perquè així puguem irradiar la llum de l’evangeli."],["Pare misericordiós i compassiu.","Units en l’amor i vida de Crist, us demanem","que siguem capaços de viure en la nostra vida de cada dia","aquest amor vostre que sent tendresa i afecte","per tot ésser vivent."]],"ord10":[["Oh Déu, font de l’esperança, que en el vostre Fill Jesús ens heu mostrat la vostra força que supera qualsevol mal. Ompliu del vostre sant Esperit els qui ens hem aplegat aquí, perquè, sense extraviar-nos per les ombres del mal,","avancem pel camí de la vida amb una sòlida fe en vós."],["Oh Déu, font de l’amor.","Jesús va fer família seva els qui compleixen la vostra voluntat.","Feu que, seguint la seva paraula,","tots els qui compartim un mateix pa","fem més forta la nostra unitat com a família vostra."],["Oh Déu, el vostre poder no té límit.","Units com un sol cos en Crist","us demanem que ens ajudeu","a compartir sense por tot allò que creiem","i a anunciar la vostra paraula a tots els homes."]],"ord11":[["Oh Déu, ple d’amor i tendresa.","Us demanem que el vostre regnat, iniciat per Crist,","creixi vigorosament en aquest món,","i que nosaltres, obrint el cor a l’acció de la vostra gràcia,","col·laborem a posar en pràctica la vostra voluntat."],["Oh Déu, font de la vida.","Ara que portem com a ofrenes el pa i el vi,","us preguem que el misteri de salvació que aquí commemorem produeixi fruits abundants en nosaltres."],["Oh Déu, que ens alimenteu mitjançant els vostres sagraments.","Feu que amb l’ajut del vostre Esperit","fructifiqui la llavor evangèlica sembrada dins nostre,","perquè així siguem testimonis clars","del creixement del vostre regne."]],"ord12":[["Oh Déu, senyor de tot el que existeix.","Enmig d’un món immers en canvis profunds,","la vostra Església té sempre per guia la vostra paraula poderosa.","Us demanem","que els qui avui ajuntem els nostres cors en la pregària,","rebutgem tota força del mal","i conreem una fe sòlida i incommovible."],["Oh Déu, esperança dels qui creuen en vós.","Vós escolteu sempre","la veu dels qui tenen fam i set
