 de salvació.","Beneïu tots i cadascú dels qui compartim la vostra taula","i ompliu-nos de la vostra vida sobreabundant."],["Oh Déu, de qui prové la victòria i la força.","Alimentats i renovats amb el do del vostre pa,","us demanem de vèncer tot temor i tota ansietat","i testimoniar així davant tothom el goig de creure en vós."]],"ord13":[["Oh Déu, creador de tota cosa,","la vostra glòria resplendeix en tot ésser vivent.","Feu que, mitjançant la paraula de Crist que avui proclamarem,","puguem descobrir el sentit de la vida,","i que, rebent el pa de la vida,","experimentem una vegada més el goig de viure."],["Oh Déu, bondadós i compassiu,","que, per la resurrecció del vostre Fill Jesús,","destruíreu la força de la mort.","Us demanem que els qui commemorem la Pasqua del Senyor","visquem una vida nova."],["Oh Déu, que feu subsistir tot el que existeix.","Amb el goig d’haver sentit el flux de vida del Crist","us demanem que sapiguem recolzar-nos mútuament","i ser, cadascú per a l’altre, força en les penes i sofriments."]],"ord14":[["Oh Déu, el vostre amor no té límit.","Vós ens guieu constantment amb la vostra paraula de veritat.","Feu que els qui ens hem aplegat aquí","sapiguem acollir joiosament la vostra paraula","i lloar-vos des del més pregon del nostre cor."],["Oh Déu, força dels qui creuen en vós.","Enfortits amb la paraula de salvació,","us demanem que vesseu la vostra benedicció","sobre els qui estem preparant la taula del Senyor","i que ens ompliu de nova vida."],["Oh Déu totpoderós.","Ara que en aquest sagrament","s’ha fet més forta la nostra unió amb Crist el Senyor,","envieu-nos a les feines de la nostra vida de cada dia.","Feu que, confiant en la vostra força que ajuda la nostra feblesa,","puguem realitzar la missió que ens encomaneu."]],"ord15":[["Oh Déu, que crideu i convideu tots els homes.","Vós cerqueu treballadors per al vostre regne","en tots els temps i en totes les edats.","Us demanem que els qui celebrem plegats la festa del diumenge","parem oïda atenta a la vostra veu que ressona en el silenci,","per tal que així la puguem acollir novament en el nostre cor."],["Oh Déu, ric en amor i tendresa.","Tot el que existeix rep el seu alè","del vostre projecte de salvació.","Escolteu els qui us preguem,","–tot ajuntat els nostres cors a l’oferiment de Crist–","i uniu-nos formant un sol cos en El."],["Oh Déu, que aplegueu i unifiqueu totes les coses en Crist.","Envieu-nos com a servidors de l’evangeli","i concediu-nos","que, confiant per damunt de tot en el vostre amor,","treballem en la realització de la pau de Crist."]],"ord16":[["Oh Déu, ple de tendresa i amor.","Vós, enviant-nos el Crist com a pastor,","convoqueu i aplegueu tots els homes.","Us demanem que els qui ens hem reunit aquí","acollim atentament la paraula de Crist","i esdevinguem seguidors fidels del seus ensenyaments."],["Pare misericordiós i compassiu.","Enfortiu la fe i l’amor dels qui fem camí seguint el Crist","i concediu-nos que,","aprofundint la nostra mútua comunió en la taula del Senyor,","puguem arribar a ser un únic poble vostre."],["Oh Déu, que ens guieu amb mà poderosa.","Amb el goig de veure’ns units en un mateix Crist,","us demanem que en aquest món nostre, ferit de divisions,","la vostra Església treballi amb confiança per la pau i la unitat."]],"ord17":[["Oh Déu, font de la salvació,","que mireu amorosament tots els qui tenen fam i set de vós.","Us demanem que els qui avui ens apleguem","per escoltar la vostra paraula salvadora,","tasten profundament el goig d’estar plens de la vostra vida."],["Oh Déu, generós en gràcies i dons.","Crist, el Senyor, va saciar la fam de molta gent","només amb uns pocs aliments.","Ara nosaltres, reunits entorn de la vostra taula,","meditem en els nostres cors el significat d’aquest signe.","Feu que participem dignament en el misteri de la pasqua de Crist."],["Oh Déu, misericordiós i compassiu.","Les gràcies rebudes de la vostra mà","es multipliquen quan són compartides.","Que els qui ens hem unit a la vida de Crist pel sagrament","sapiguem compartir aquest goig","amb tots els que viuen al nostre voltant."]],"ord18":[["Oh Déu, que coneixeu bé la nostra fam i set.","Vesseu la vostra benedicció","sobre aquesta assemblea que busca la vostra salvació,","i feu que, trobant el Crist, paraula i pa de vida,","es vessi abundosament la força que viu en cadascú de nosaltres."],["Oh Déu, que cuideu amb tendresa tot el que viu.","Vós heu donat al món el vostre Fill Jesús com a pa del cel.","Que el pa i vi que ara us oferim","siguin sagrament de Crist que ens dóna la vida eterna."],["Oh Déu, que desbordeu de gràcia i d’amor.","Ja que formem un sol cos en Crist, autèntic pa de la vida,","us preguem que ens renoveu amb el vostre Esperit,","perquè treballem pel vostre regne amb el goig de la fe."]],"ord19":[["Oh Déu,","que nodriu amb la vostra presència la vida dels homes.","Mireu els vostres fills","que una vegada més ens reunim avui a l’entorn de Crist","i feu que, els qui participem plegats en la gràcia de la vida,","rebem en plenitud la força que ens cal","per avançar tot construint el vostre regne."],["Oh Déu, ple d’amor i tendresa.","Som al voltant de la vostra taula,","celebrant l’oferiment de Crist.","Us demanem que, com a resposta a aquest amor de Jesús,","sapiguem fer de la nostra vida una ofrena en honor vostre."],["Oh Déu, ric en amor i tendresa.","Amb les nostres forces renovades,","us demanem que,","a imitació de Jesús que es va donar a sí mateix com a aliment,","també nosaltres sapiguem avançar pel camí de l’amor."]],"ord20":[["Oh Déu, esperança nostra,","Que convideu tots els homes al banquet de la salvació.","Us demanem","que ens nodriu abundosament mitjançant aquesta celebració","perquè puguem oferir-vos de tot cor lloances i acció de gràcies."],["Oh Déu, generós en dons i gràcies.","Jesús ens digué: «El qui menja aquest pa viurà per sempre».","Feu que tots els qui rebem aquest aliment","visquem en l’amor de Crist."],["Oh Déu, donador de la vida.","Havent assaborit el goig de compartir","l’autèntic aliment i l’autèntica beguda,","us demanem","que, enfortits pel Crist que està sempre amb nosaltres,","la nostra vida de cadascú sigui un cant de lloança per a vós."]],"ord21":[["Oh Déu, font de l’alegria.","La vostra paraula és llum que il·lumina els qui creuen.","Adreceu-nos avui una vegada més la vostra paraula poderosa,","per tal que, renovant constantment la fe del nostre cor,","perseverem en el seguiment de Crist."],["Oh Déu, força dels qui creuen.","Enfortits amb la vostra paraula de vida eterna,","us demanem que, mitjançant el sagrament que ara celebrem,","siguem units estretament","al misteri de la mort i resurrecció del vostre Fill Jesús."],["Oh Déu, que ens doneu abundosament la vostra vida.","Us demanem que els qui formem un sol cos en Crist,","siguem mútuament servidors els uns dels altres,","i així puguem continuar fent tots junts el camí de la fe."]],"ord22":[["Oh Déu totpoderós i etern,","que, mitjançant el vostre Fill Jesús,","ens heu manifestat la vostra voluntat.","Feu que avui nosaltres tornem una vegada més a vós","i trobem en la vostra paraula el nodriment de la nostra vida."],["Oh Déu, que renoveu totes les coses.","El vostre Fill Jesús es va lliurar ell mateix","per purificar-nos del pecat.","Us demanem que aquest banquet de la vostra taula","ens uneixi més profundament a l’oferiment de Crist."],["Oh Déu, força dels qui creuen en vos.","Guieu-nos amb la vostra mà poderosa","en aquesta setmana que comença,","de manera que, discernint allò que és realment important,","visquem en la societat mirant de realitzar la vostra voluntat."]],"ord23":[["Oh Déu, esperança de tots els homes,","que enviant el vostre Fill Jesús","ens vau alliberar de l’angoixa i el sofriment.","Obriu avui les nostres oïdes","perquè escoltin la vostra paraula salvadora,","i obriu també els nostres llavis","perquè sàpiguen cantar la vostra lloança."],["Oh Déu, ric en amor i misericòrdia,","que en la mort i resurrecció de Jesús","ens vau revelar la força de la vostra salvació.","Us demanem que, en celebrar la pasqua del Senyor,","assaborim profundament el goig d’estar units a Ell."],["Oh Déu, font de la salvació.","Dirigiu les nostres vides","de manera que puguem compartir amb tothom","el goig de sentir-nos vivificats per la vida de Crist,","i que la nostra vida de cada dia","esdevingui un cant de lloança a vós."]],"ord24":[["Oh Déu, font de la salvació.","El vostre Fill Jesús, mitjançant el dolor i la creu,","ens mostrà el camí del vostre seguiment.","Il·lumineu amb la vostra paraula","els qui proclamem Jesús com a salvador,","i feu que, sense perdre’ns en la tenebra,","anem fent el camí cap a vós."],["Oh Déu, que vesseu el vostre amor sense mesura.","Augmenteu la nostra fe i uniu-nos al Crist,","el qual, mitjançant el sofriment,","s’encaminà cap a la vida de la resurrecció."],["Oh Déu, que ompliu les nostres vides amb la força de la salvació.","Manteniu amb la vostra gràcia","els qui participem junts de la vostra vida,","i feu que tinguem sempre present","l’amor que ens heu mostrat en la mort de Jesús,","i així puguem donar un testimoniatge ferm de la nostra fe"]],"ord25":[["Oh Déu,","que vesseu a mans plenes la vostra gràcia sobre nosaltres.","Vós donàreu al món com a salvador el vostre Fill Jesús.","Us demanem que, mitjançant aquesta celebració,","ens acostem al Crist","el qual, abaixant-se, es va fer servidor de tots."],["Pare nostre, ric en amor i tendresa.","Els qui al voltant de la vostra taula","celebrem la mort i resurrecció de Jesús,","us demanem que ens uniu fortament a Ell","que es va entregar a si mateix sense mesura."],["Oh Déu, font de l’amor i de la misericòrdia.","Units al Crist, que va venir a servir,","us demanem que ens ajudeu a ser servidors els uns dels altres","i a perdonar-nos mútuament,","per tal que la nostra vida sigui una força","que ajudi a la realització de la pau al món."]],"ord26":[["Oh Déu, esperança dels qui creuen en vós,","Quan vessàreu el vostre Esperit sobre nosaltres,","ens vau constituït com a únic poble vostre.","Us demanem que els qui en nom vostre ens apleguem aquí,","sapiguem acceptar-nos mútuament","i cantar-vos amb un sol cor."],["Oh Déu, ric en gràcies i dons.","Accepteu l’oració que units a l’oferiment de Crist us presentem","i feu que, tot recordant el seu amor per a tots els homes,","siguem omplerts del goig que prové del mutu amor."],["Oh Déu, salvació de tots els homes.","Plens del vostre Esperit i amb un sol cor,","us demanem que, seguint la paraula de Crist,","siguem portadors de l’evangeli de la pau","en la societat actual."]],"ord27":[["Oh Déu, donador de la vida,","que voleu que els homes visquem no en la solitud i l’aïllament,","sinó ajudant-nos i sostenint-nos mútuament.","Vesseu el vostre amor desbordant","sobre els qui ens hem reunits aquí, aplegats entorn de Crist."],["Oh Déu, ric en amor i afecte.","Vesseu la vostra benedicció","sobre els reunits entorn de la vostra taula.","Que l’amor de Crist, que es va oferir a si mateix sense mesura,","esdevingui el vincle d’unió que ens uneixi els uns als altres."],["Oh Déu, que sou l’amor.","Enfortits per Crist, que està sempre amb nosaltres,","us demanem","que formem una única família vivificada pel vostre amor."]],"ord28":[["Oh Déu, donador de la saviesa que supera tot coneixement.","La vostra paraula actua poderosa al llarg de tots els temps.","Il·lumineu els nostres cors amb la llum de l’evangeli","i feu que no ens aferrissem als béns immediats."],["Oh Déu, ric en dons i gràcies.","Enfortits amb la vostra paraula de salvació i plens d’esperança,","us demanem que tots els qui celebrem l’oferiment de Crist","siguem també associats a la seva vida nova en la resurrecció."],["Oh Déu, misericordiós i compassiu.","Units a la vida de Crist,","i vivificats pel vostre amor, que supera qualsevol bé,","us demanem que puguem recórrer amb goig al cor","la senda del seu seguiment."]],"ord29":[["Oh Déu, ric en dons i gràcies.","El vostre Fill Jesús oferí la seva pròpia vida","per la salvació de tots.","Feu que nosaltres, fins i tot en el sofriment i la prova,","sapiguem descobrir l’esperança","en la creu de Crist."],["Oh Déu, pare de tots els homes.","Ens apropem a la vostra taula","amb el goig de sentir-nos-hi convidats.","Us demanem que la celebració de la mort i resurrecció de Jesús,","faci créixer en nosaltres","una actitud prompta al propi oferiment."],["Oh Déu, força dels qui creuen en vós.","Units i formant un sol cos en Crist,","us demanem que,","fent-nos mútuament germans i germanes per als altres,","arribem a compartir sincerament les alegries i les penes."]],"ord30":[["Oh Déu, ple d’amor i misericòrdia.","Escolteu les nostres veus que, des de l’angoixa i el dolor,","clamen a vós esperant salvació.","Us demanem que, mitjançant aquesta celebració,","els qui confiem en vós sapiguem destriar i acceptar","el guiatge de Jesús."],["Oh Déu, sant i alhora proper.","Cuideu d’aquest vostre poble","que heu reunit en servei vostre,","i feu que, juntament amb el Crist gran sacerdot,","també nosaltres oferim tot el que som."],["Oh Déu totpoderós,","que ens nodriu amb aliment abundós","i ens saneu en el cos i en l’esperit.","Ajudeu-nos a compartir amb els altres aquest goig."]],"ord31":[["Oh Déu, font de l’amor.","Jesús, el vostre Fill, ens mostrà amb paraules i obres","el camí que duu a la vida.","Us demanem que la seva paraula","ressoni insistentment en el cor dels qui ens apleguem","buscant la forma veritable de vida."],["Oh Déu, d’amor i tendresa sens fi.","Plens de goig per poder seure a la vostra taula,","us demanem de viure l’amor a vós i als homes,","per tal que així ens sentim units a Crist","que es va oferir ell mateix sense reserva."],["Oh Déu, ric en dons i gràcies.","Vós, mitjançant el pa d’aquest sagrament,","ens uniu mútuament en Crist.","Feu que visquem el seu amor","en la nostra vida de cada dia."]],"ord32":[["Pare, compassiu i misericordiós.","Vós coneixeu bé el cor fervent dels qui us supliquen.","Vesseu la vostra benedicció sobre nosaltres,","congregats en una mateixa esperança en vós,","i feu que, estimulats per la vostra paraula,","us puguem oferir la nostra vida de cada dia."],["Oh Déu, donador de la vida.","Enfortiu els qui ens hem aplegat aquí","entorn de la vostra taula de salvació.","Feu-nos tastar en profunditat l’amor de Crist,","–que es va donar a si mateix del tot i sense reserves–","i així sentir-nos plens del goig del nostre propi oferiment."],["Oh Déu i pare nostre.","Compartint el mateix goig d’estar units amb el Crist,","us demanem que, deixant-ho tot a les vostres mans,","visquem amb cor joiós","una vida plena de sentit."]],"ord33":[["Oh Déu únic i veritable,","que convoqueu tots els homes per formar una única família.","Il·lumineu els cors dels qui ens hem aplegat aquí,","i feu que posem tota la nostra confiança","en la paraula de Crist que no passa mai."],["Oh Déu, que per mitjà de la mort en creu del vostre Fill Jesús,","ens heu alliberat del pecat.","Ateneu les súpliques","dels qui commemorem el lliurament de Crist","i feu-nos partícips del banquet etern amb tots els homes."],["Oh Déu, que ens doneu la vida eterna.","Units en la paraula i cos de Crist,","us demanem que, fins que arribi el seu retorn gloriós,","l’Església sigui signe d’amor i d’esperança."]],"rei":[["Oh Déu, totpoderós i etern,","que, ressuscitant Crist d’entre els morts,","el constituíreu rei perquè governi totes les coses amb amor.","Guieu i dirigiu els qui, responent a la vostra crida,","ens hem congregat amb un sol cor,","i doneu-nos la força que ens cal","per treballar en la construcció del vostre regne."],["Oh Déu, que desbordeu de gràcia.","Per mitjà de la mort i resurrecció de Crist,","vós heu alliberat del pecat tots els homes.","Us demanem","que, per mitjà del banquet commemoratiu de la seva pasqua,","ens ompliu del vostre amor i del vostre perdó."],["Oh Déu, força dels qui creuen en vós.","Units estretament a Crist,","us demanem que, seguint-lo a Ell com a rei de la pau,","treballem amb totes les nostres forces","per la construcció del vostre regne."]]},"C":{"adv1":[["Oh Déu, ple de justícia i amor.","Desperteu els cors dels qui,","fiats en la vostra promesa salvadora,","esperen que arribi el seu alliberament.","Feu que, amb els nostres ulls fits en el Crist,","llum de la nostra esperança,","continuem fent amb goig el nostre camí cristià."],["Oh Déu, ric en dons i gràcies.","Mentre esperem amb joia la nostra salvació,","us demanem que ens feu conèixer profundament","la grandesa de l’amor que ens heu mostrat","en donar-nos el vostre Fill."],["Als qui ens heu sadollat amb el pa de la vida,","envieu-nos, Senyor,","perquè puguem compartir","l’esperança i el goig que de vós hem rebut,","amb tots els qui ens trobem en la nostra vida de cada dia."]],"adv2":[["Oh Déu, ric en amor i misericòrdia.","L’esclat de la vostra glòria il·lumina tots els homes","i transforma en alegria la seva tristor.","Feu que nosaltres, que hem conegut el camí de la salvació,","continuem en la senda del vostre amor","fins a aconseguir la plena unió amb el Crist."],["Oh Déu, creador de totes les coses,","que manteniu i cuideu tota vida.","A tots els qui celebrem avui el Sopar del Senyor","concediu-nos la gràcia d’assaborir plenament","el goig de sentir-nos vivificats per vós."],["Oh Déu, font de la salvació.","Units en el Cos de Crist us demanem que,","els qui hem posat la nostra confiança en la vostra paraula, puguem fer amb goig i entusiasme el camí de Jesús."]],"adv3":[["Oh Déu, font de l’esperança,","que esteu sempre al nostre costat.","Ens hem reunit entorn vostre, mentre esperem el Crist. Feu de nosaltres un sol cor en la unitat del vostre Esperit, perquè, plens d’alegria, no deixem mai de lloar-vos."],["Pare nostre, ple de tendresa i amor.","Ompliu del vostre Esperit","els qui ens apleguem entorn de la vostra taula,","per tal que assaborim profundament","l’amor del Crist que és amb nosaltres."],["Oh Déu, font de la vida.","Conduïu els que acabeu d’alimentar a la taula del Senyor.","Feu que compartim amb tothom","el goig que de vós hem rebut","i anunciem al món la visita de la vostra salvació."]],"adv4":[["Oh Déu misericordiós i compassiu,","que teniu predilecció pels petits.","Vos enviàreu el vostre Fill","i vau omplir de benediccions els qui tenien fam i set de salvació.","Feu que nosaltres, que acollim amb goig el seu naixement,","ens sentim també units a ell en la nostra vida mateixa."],["Oh Déu, ric en dons i gràcies.","Us presentem aquests dons,","amb els quals nosaltres mateixos","ens posem a les vostres mans.","Concediu-nos, que en celebrar la mort i resurrecció de Crist,","assaborim profundament","l’amor que ens heu mostrat en enviar-nos el vostre Fill."],["Oh Déu que vesseu el vostre amor sobre tots els homes.","Ompliu amb el vostre Esperit","els qui som enviats en el comiat d’aquesta celebració.","Feu que compartim amb tothom","el goig que sentim en la celebració del naixement del Crist."]],"qua1":[["Oh Déu totpoderós.","El vostre Fill Jesús, vencent tota temptació,","va seguir el camí de fidelitat i obediència a vós,","fins a la mort en creu.","Enfortiu-nos amb la vostra gràcia a l’inici de la quaresma,","perquè, renovant la nostra fe i esperança en la resurrecció,","puguem seguir amb Jesús el camí que ell va seguir."],["Oh Déu, generós en dons i gràcies.","Concediu-nos que, vivificats per la vostra paraula, assaborim profundament","el misteri de la mort i resurrecció del Senyor."],["Oh Déu, esperança dels qui creuen en vós.","Ompliu amb el vostre esperit i defenseu de tota temptació","els qui per la comunió estem units al Crist,","i concediu-nos de viure cada dia en acció de gràcies","el camí de la conversió."]],"qua2":[["Oh Déu, font de la salvació,","que a través de la passió duguéreu el vostre Fill Jesús a la glòria. Enfortiu la nostra esperança i el nostre ànim","perquè seguim les petjades de Crist en el seu camí cap a la creu."],["Oh Pare, que ens envolteu i il·lumineu amb la vostra llum.","Feu més forts en la fe i en l’amor","els qui convideu a la taula de Crist,","perquè amb goig puguem celebrar una vegada més","el misteri de la salvació."],["Oh Déu, pare nostre.","Gràcies per aquesta estona que hem passat","en companyia de Jesús","i pel do d’haver-nos unit més fortament amb ell.","Concediu-nos que aquest temps de quaresma","ens ajudi a seguir el Crist","i ens dugui a treballar per la salvació de tothom."]],"qua3":[["Oh Déu, font de la vida.","Sempre que el nostre cor s’allunya de vós,","vós, per mitjà del vostre Fill Jesús, ens convideu a tornar. Ara que a la quaresma fem el camí de conversió, doneu-nos un cor que sàpiga lloar-vos i donar-vos gràcies."],["Oh Déu, que heu establert amb nosaltres una aliança nova. Per a nosaltres, seguidors de Jesús,","ja no hi ha ni temple ni ofrenes.","En commemorar en aquest sopar l’oferiment únic de Crist, –que es va oferir ell mateix per nosaltres–,","uniu-nos fortament a vós, que sou la font de l’amor."],["Oh Déu, que amb la vostra vida abundosa","nodriu tots els qui creiem en vós.","Reunits com a cos de Crist en una sola Església,","us demanem que vesseu sobre nosaltres un nou alè,","que ens faci esdevenir signe visible del vostre amor."]],"qua4":[["Oh Déu, misericordiós i compassiu,","que acolliu amb un amor sense límits","tot aquell que torna a vós.","Als qui a la quaresma fem el camí de la conversió,","doneu-nos una vida nova com a fills vostres."],["Oh Déu, generós en dons i gràcies, que, per mitjà del vostre Fill Jesús, heu fet de nosaltres una sola família. Ompliu-nos de l’alegria de la reconciliació, els qui som convidats a la mateixa taula al costat dels germans."],["Oh Déu, que sempre esteu amb nosaltres.","Enfortiu amb la vostra gràcia aquest poble vostre creient. I tots els qui participem a la taula de la pasqua de Crist concediu-nos de poder testimoniar el seu goig a tots els homes."]],"qua5":[["Oh Déu, font de l’amor.","Vós perdoneu el pecador, aixequeu l’home caigut i ens doneu força per emprendre una vida nova. Us demanem que nosaltres,","que hem rebut a vessar la gràcia del vostre perdó, sapiguem donar-vos gràcies amb un sol cor."],["Oh Déu, misericordiós i compassiu,","que convideu tothom a la vostra taula, sense distinció. Enfortiu amb el vostre amor i amb el vostre perdó els qui celebrem el misteri de la pasqua del Senyor."],["Oh Déu, que feu córrer l’aigua pel el desert","i hi feu créixer una nova vida.","Els qui hem rebut la vida de Crist,","envieu-nos al món, assedegat de salvació.","Feu que puguem compartir amb tots els homes","l’abundor de gràcia que hi ha en vós."]],"pas3":[["Oh Déu, generós en amor i gràcia,","que ens vau donar el vostre Fill estimat com a salvador del món. Ompliu-nos amb el goig de viure en el vostre amor i feu-nos seguidors del Crist que està amb nosaltres."],["Oh Déu, misericordiós i compassiu.","El Senyor Jesús està presidint la nostra celebració","i avui ens convida a la taula del pa de la vida.","Us demanem que, amb un cor renovat de creients,","puguem participar abundosament en la vida de Crist."],["Oh Déu, que vesseu la vostra gràcia sobre nosaltres. Ara que ens heu alimentat amb la vida de Crist, envieu-nos a la missió d’avui,","per tal que, cadascú en el seu lloc,","donem testimoniatge del misteri pasqual del Senyor."]],"pas4":[["Oh Déu, font de la salvació.","Jesús, el veritable anyell pasqual,","acceptà voluntàriament el sofriment per donar-nos vida a tots.","Ompliu de l’amor i de la vida de Crist","els qui junts celebrem la pasqua del Senyor."],["Oh Déu misericordiós i compassiu. Jesús, com a bon pastor, té cura de nosaltres, ens pastura en prats deliciosos i ens fa descansar vora l’aigua. Que els convidats al sopar del Senyor","sapiguem assaborir a fons aquesta gràcia."],["Oh Déu, font i donador de la vida.","Enfortiu-nos, ara que comencem una nova setmana,","perquè la nostra vida de cada dia","sigui la nostra resposta a la crida del Crist."]],"pas5":[["Oh Déu, que esteu sempre amb nosaltres.","Ressuscitant el Crist d’entre els morts","ens heu mostrat el vostre amor sense límits.","Us demanem que també nosaltres, estimant-nos mútuament,","donem testimoniatge de vós, que sou l’amor mateix."],["Pare sant.","Ara que en aquesta taula celebrem amb goig","la vida nova de la resurrecció,","feu de nosaltres un poble que us serveixi a vós,","i doneu-nos un cor proper al de Jesús,","que es va oferir a si mateix."],["Pare, ple de tendresa i amor, que ara envieu al món","els qui ens heu sadollat amb la nova vida. Feu que siguem testimonis joiosos de Crist ell que és el Camí que porta cap a vós."]],"pas6":[["Oh Déu, Pare de Jesús, el Senyor.","Vós veniu a nosaltres en la vostra Paraula i en el vostre Esperit,","i sou sempre amb nosaltres.","Ompliu amb la pau i la joia del Crist","els cors dels qui ens hem reunit aquí."],["Pare misericordiós i compassiu.","El vostre Fill Jesús es va fer amic de tothom","i donant la seva pròpia vida per nosaltres,","ens va mostrar el súmmum de l’amor.","Feu que aquest sagrament es uneixi íntimament al seu amor."],["Oh Déu, pare de bondat.","Enfortits amb l’aliment de la vida eterna","us supliquem que, sustentats pel Crist que està en nosaltres, visquem la vida de cada dia amb amor i alegria."]],"ord2":[["Oh Déu, font de l’amor.","Vós sempre escolteu i responeu","els qui des del fons del cor us imploren.","Feu que aquesta celebració nostra sigui realment","una festa d’alegria celebrada amb Crist Jesús","i que cadascun de nosaltres, en lloar-vos i donar-vos gràcies,","quedi ple a vessar del vostre amor."],["Oh Déu, font de la vida.","Jesús, el vostre Fill,","va realitzar el seu primer signe a Canà de Galilea, quan va omplir d’alegria aquell banquet de festa. Feu que el pa i el vi que aquí us oferim es converteixin en aliment de vida abundosa."],["Oh Déu, ric en amor i misericòrdia.","Us demanem que els qui som alimentats amb un mateix pa","i vivificats per un mateix Esperit,","siguem testimonis del vostre amor","amb l’alegria de la nostra vida."]],"ord3":[["Oh Déu, font de l’alegria.","Us demanem que, a tots els qui ens hem reunit entorn de Jesús,","ens feu escoltar la bona nova de salvació que ens diu:","«La diada d’avui és santa;","la paraula de Déu té avui el seu acompliment».","Feu que aquesta celebració d’acció de gràcies","sigui para nosaltres font d’energia per a la vida."],["Oh Déu, ple d’amor i compassió.","El vostre Fill, Jesús, va oferir la seva vida","per donar la llibertat als oprimits","i lliurar-los del poder del pecat i de la mort.","Feu que nosaltres sapiguem celebrar amb alegria","aquest oferiment de Crist!"],["Oh Déu, força de la salvació.","Ara que assaborim el goig de sentir-nos units al Crist,","us demanem que l’Església,","plena del vostre Esperit i enviada al món,","sàpiga portar la vostra bona nova a tots els homes."]],"ord4":[["Oh Déu,","que feu sentir la vostra veu en el cor de cada home.","Vós coneixeu els nostres pensaments i desitjos.","Guieu amb el vostre Esperit","els qui avui estem reunits aquí,","i feu que obrim generosament els nostres cors","a la veu de la vostra crida."],["Oh Déu, compassiu i misericordiós.","Enfortits amb la paraula de vida,","us demanem","que, els qui ens hem reunit entorn de la vostra taula,","estiguem units estretament al Crist","que s’ofereix per tots els homes."],["Oh Déu, font de la salvació.","Avui ens envieu novament com a cos de Crist. Ajudeu-nos a ser signes de fe, esperança i amor per a tots els qui trobarem a la vida de cada dia."]],"ord5":[["Déu misericordiós i compassiu.","A nosaltres pecadors, vós ens heu mirat amb ulls de tendresa i compassió, i ens heu conduït a la trobada amb Jesús, el vostre Fill. Feu que ara, recordant aquest do del vostre amor, sapiguem lloar-vos en el goig i l’acció de gràcies."],["Oh Déu, força de salvació.","Juntament amb el pa i el vi rebeu-nos també a nosaltres,","i ja que compartim el pa, tal com Jesús ens va dir,","feu-nos experimentar abundosament una energia nova per construir el vostre regne."],["Oh Déu, vós sou tot misericòrdia i tot amor.","Vós aixequeu i convideu a col·laborar en el vostre regne","tot aquell que, com Pere,","reconeix humilment la seva indignitat i pobresa.","Us demanem que també nosaltres, enfortits amb el vostre amor,","puguem anunciar l’evangeli amb goig i valentia."]],"ord6":[["Oh Déu, que estimeu amb tendresa tots els homes.","Jesús, el vostre Fill, va donar paraules de vida","a aquells que es van aplegar al seu costat.","Gireu la vostra mirada sobre nosaltres,","que ens hem reunit per cercar la salvació,","i ensenyeu-nos l’autèntica felicitat."],["Oh Déu, que sadolleu la fam i la set dels qui busquen.","En oferir-vos el pa i vi que de vós hem rebut,","us demanem que es converteixin en el cos de Crist","i siguin para cadascun de nosaltres força i sosteniment a la vida."],["Oh Déu, font de la salvació.","Guieu els passos del vostre poble,","enfortit per l’evangeli i alimentat amb el cos de Crist,","perquè amb tots els que ens anem trobant","en la nostra vida de cada dia,","puguem assaborir la felicitat del regne","que Jesús va anunciar."]],"ord7":[["Oh Déu, d’un amor infinit.","Estimant els seus enemics i, fins i tot, el qui el va entregar,","Jesús, el vostre Fill, ens va mostrar en la seva vida","la imatge de l’amor autèntic.","Us demanem que tots els ens hem reunit aquí","puguem assemblar-nos, ni que sigui una mica,","al model que ell ens va deixar."],["Pare, ple d’amor i tendresa.","Aquí ens teniu reunits entorn de la vostra taula,","per commemorar l’amor del vostre Fill Jesús en la creu.","Que aquesta celebració d’acció de gràcies","ens uneixi més estretament a la seva forma de vida."],["Oh Déu, que acolliu joiós tot aquell que acudeix a vós. Plens de l’amor de Crist us demanem, Senyor, que l’Església, en el seu treball enmig del món, doni testimoniatge fidel de l’amor sense discriminació de Jesús per a tothom."]],"ord8":[["Oh Déu, esplèndid en dons i gràcies.","Amb la seva paraula i amb les seves obres","Jesús, el vostre Fill, ens va mostrar","el camí de la vida eterna.","Vesseu el vostre Esperit sobre cadascun de nosaltres,","perquè la vostra paraula que avui escoltarem","sigui para nosaltres llum que ens il·lumini el camí."],["Oh Déu, font de la vida.","Vós ens convideu a la taula de Crist, vencedor de la mort.","Feu que puguem participar amb un cor net en el misteri de la pasqua."],["Pare sant.","Joiosos de sentir-nos units a Crist,","us demanem que les nostres paraules i les nostres obres","siguin conformes a la vostra voluntat","i donin bons fruits."]],"ord9":[["Oh Déu, Senyor de tots els homes,","que escolteu i responeu","els qui busquen amb ardor la salvació.","Enfortiu la fe dels qui ens hem reunit davant vostre,","perquè la vostra paraula esdevingui","en cadascun de nosaltres","força que sostingui els nostre caminar de cada dia."],["Oh Déu, que mireu amb afecte i tendresa tots els homes.","Us demanem que els qui estem reunits entorn d’una mateixa taula,","sapiguem fer caure totes les barreres","que mútuament ens separen,","i així compartir la gràcia de la vida."],["Oh Déu, de qui brolla a vessar amor i afecte.","Enrobustiu els qui, units en la paraula i cos de Crist,","envieu al món.","Enmig d’una societat que va perdent el sentit de fe,","feu que conservem sempre el goig de viure creient en vós."]],"ord10":[["Oh Déu, força dels qui creuen en vós.","Vós esteu sempre al costat del qui sofreix","i ajudeu a aixecar-se el qui cau.","Ajudeu-nos a compartir el goig de la salvació,","perquè puguem lloar-vos amb un sol cor."],["Oh Déu misericordiós,","que, eliminant les tenebres de la mort,","ens guieu a la llum de la vida.","Feu que els qui commemorem la pasqua de Jesús","siguem realment vivificats pel seu amor i per la seva vida."],["Oh Déu, ric en amor i tendresa.","Units a Crist us demanem","que mai no ofeguem el batec i l’escalf","de la vida que rebem de vós,","sinó que sapiguem ser testimonis","de la riquesa del vostre amor."]],"ord11":[["Oh Déu, font de l’amor i del perdó.","Vós compreneu la nostra flaquesa i debilitat","i renoveu la nostra esperança de viure com a fills vostres.","Us demanem que, reunits aquí en assemblea,","puguem oferir-vos aquesta celebració eucarística.","units en un sol cor, ple de fe en vós."],["Oh Déu, pare nostre,","Que, enviant el vostre Fill, Jesús,","ens heu reconciliat amb vós.","Feu que, tots els qui estem avui aquí units en Crist,","sapiguem estimar-vos a vós i servir els homes"],["Oh Déu, esperança dels qui creuen en vós. Units en la vida de Crist, us demanem que, vivificats pel vostre amor sense límits, treballem per la salvació de tots els homes."]],"ord12":[["Oh Déu, esperança dels qui creuen en vós.","Jesús, salvador nostre,","va emprendre lliurement el camí de la creu","i va donar la seva vida per nosaltres.","Us demanem que els qui ens hem reunit aquí en el vostre nom","renovem la nostra decisió de seguir el Crist."],["Oh Déu, font de la salvació.","Jesucrist, amb la seva victòria sobre la mort, ens mostra el camí de la vida eterna. Feu que els qui rebem el pa del Senyor caminem seguint les seves petjades i visquem una vida nova."],["Pare nostre i Déu etern.","Avui, una vegada més, units en el cos del Senyor ,","l’hem confessat com el nostre salvador.","Ara que som enviats, plens de la seva gràcia,","us demanem que ens sostingueu i ens guieu","amb la força del vostre Esperit."]],"ord13":[["Déu Pare misericordiós,","que voleu la salvació de tots,","i a tots convideu per mitjà de Jesucrist. Mireu els qui avui estem reunits aquí i conduïu-nos amb la vostra força, perquè seguim les petjades de Jesús."],["Oh Déu i Pare nostre,","Com a resposta a la invitació de Crist Jesús,","us demanem que, units a Ell,","siguem capaços d’oferir-nos nosaltres mateixos,","tal com ell mateix va fer ofrena de la seva pròpia vida."],["Oh Déu, font de la vida,","Ompliu amb el vostre Esperit","els qui per la comunió estem units a Crist,","per tal que, vivint la nostra vida cristiana en llibertat i alegria,","puguem compartir amb tots els homes","l’esperança de la salvació."]],"ord14":[["Oh Déu, font de la salvació.","A aquest món nostre que sofreix per la divisió i confrontació, Vós vau enviar Jesús, el vostre fill,","perquè ens ensenyés el camí de la pau i de la unitat.","Us demanem que tots els que participem en aquesta assemblea sapiguem escoltar amb un cor nou la paraula de salvació."],["Oh Déu, font de la vida,","que, talment una mare amb els seus fills, ens estimeu i alimenteu amb el millor menjar. Feu que aquest pa i vi esdevinguin en nosaltres energia i força per treballar pel vostre regne."],["Oh Déu, esperança dels qui creuen en vós. Plens de nova vida per la comunió us demanem que l’Església anunciï el goig del vostre regne i sigui portadora de la pau de Crist."]],"ord15":[["Pare misericordiós.","A aquest món nostre, tan mancat d’escalf humà,","però que tant deleja l’amor autèntic,","Jesús, li va mostrar –amb la seva paraula i la seva vida–","en què consisteix aquest amor autèntic.","Feu que nosaltres sapiguem acollir amb un cor ben sincer","la paraula de Crist que avui se’ns comunica."],["Oh Déu, ric en bondat i misericòrdia.","Jesús, el vostre Fill,","va oferir la seva pròpia vida per tots els homes.","Feu que també nosaltres, units a Ell per aquest sagrament,","sapiguem fer ofrena de les nostres pròpies vides."],["Oh Déu, font de la vida.","Celebrant en acció de gràcies l’amor de Jesús, nostre Senyor, us demanem, ara que tornem a la nostra vida quotidiana, que cadascun de nosaltres sapiguem acostar-nos de bon grat a tots els qui necessiten la nostra ajuda."]],"ord16":[["Oh Déu, font de la salvació.","Vós sou sempre al nostre costat,","i no deixeu de comunicar-vos amb nosaltres. Feu que avui, reunits com a fills vostres, sapiguem escoltar ben atents la vostra paraula"],["Oh Déu, força dels qui creuen en vós.","Us demanem que tots els qui celebrem la memòria de la mort i resurrecció de Jesús,","estiguem units en la seva abundosa vida."],["Oh Déu, que sempre esteu amb nosaltres.","Després de rebre el sagrament del cos de Crist,","Vós ens envieu com a servidors de la vostra paraula.","Que, com María, gravem la vostra paraula en el nostre cor,","i, com Marta, sapiguem acollir els altres amb tot l’afecte."]],"ord17":[["Oh Déu, font de la vida.","Jesús ens va ensenyar a dir-vos «Pare».","Reunits per pregar junts seguint la seva paraula,","us demanem que ens beneïu","i ens ompliu amb la llum el vostre Esperit."],["Oh Déu, compassiu i misericordiós.","Vós no deixeu mai sense l’aliment necessari","a tot aquell que amb fam i set el busca.","Asseguts per pregar entorn de la vostra taula,","us demanem que vesseu abundosa sobre nosaltres","la força sempre nova de la vostra vida."],["Oh Déu, pare nostre.","Avui, mitjançant aquest sagrament,","ens heu unit una vegada més en el vostre Fill Jesús. Us demanem que l’Església, en pregària constant, conservi encesa en el món actual, la llum de la fe i de l’esperança."]],"ord18":[["Oh Déu, font de l’alegria.","Enmig dels treballs i del cansament de la vida, sou Vos el qui ens dóna el descans vivificant. Aquí ens teniu, reunits,","cercant prop vostre l’autèntica forma de vida, i concediu-nos de trobar el goig de viure en Crist."],["Oh Déu, compassiu i misericordiós.","Amb profund agraïment pels vostres dons,","us oferim el fruit del nostre treball de cada dia,","i, reunits entorn de la vostra taula, us demanem","que aprenguem a assaborir les riqueses de la vida autèntica."],["Oh Déu, ric en dons i gràcies envers els vostres fills. Sadollats amb la paraula i aliment de la salvació, us demanem que sapiguem compartir amb els altres totes les gràcies que de vós hem rebut."]],"ord19":[["Oh Déu, font de l’esperança,","que dueu a terme la salvació del món per camins inescrutables. Vesseu sobre el vostre poble l’abundor del vostre Esperit, perquè els qui creiem en la realitat del vostre regne ens mantinguem units en una mateixa esperança."],["Oh Déu, ric en misericòrdia.","Responent a la vostra invitació i amb goig al cor,","ens hem reunit entorn de la vostra taula.","Us demanem que, plens d’agraïment,","sapiguem seguir les petjades de Jesús,","que es va fer servidor de tots."],["Oh Déu, ric en dons i gràcies envers els vostres fills. Vós ens alimenteu amb el pa de vida, per a sostenir el nostre camí.","Us demanem que, enmig d’un món ple de problemes, la vostra Església,","amb fe decidida en els vostres designis de salvació, no deixi mai de treballar amb fe i perseverança."]],"ord20":[["Oh Déu, compassiu i misericordiós,","que per a la salvació de tota la humanitat","vau enviar Jesús, el vostre Fill.","Els qui ens hem aplegat aquí us demanem","que ens purifiqueu amb el vostre Esperit,","perquè el goig del seguiment de Jesús","ompli a vessar el cor de cadascun de nosaltres."],["Oh Déu, ric en gràcies i dons.","Mireu amb amor els qui, al voltant de la vostra taula, estem celebrant el misteri de la salvació, i concediu-nos que, gravada en els nostres cors la creu de Jesús, com a signe de la seva victòria sobre l’odi i l’enemistat, treballem sense descans per aconseguir la pau veritable."],["Oh Déu, font de l’amor i de la pau.","Us demanem que, plens de la vida nova","i seguint els passos de Jesús,","siguem capaços d’enfrontar-nos, amb valentia,","al mal i al pecat del món."]],"ord21":[["Oh Déu, pare de tots els homes.","Avui també ens convideu a tots,","sense distinció de races i nacionalitats,","al banquet del vostre regne.","Us demanem que units en un sol cor sapiguem lloar-vos","pel goig de sentir-nos convidats per vós."],["Oh Déu, que dirigiu amb la vostra providència totes les coses.","Enfortiu amb la vostra gràcia","els qui hem preparat aquest banquet de la vostra taula,","i feu que tots nosaltres,","nodrits amb l’aliment autèntic,","ens omplim amb noves energies per seguir-vos."],["Oh Déu, ple de tendresa i amor envers nosaltres. Sabem que vós purifiqueu els qui estimeu. Ajudeu-nos a seguir el camí de Jesús amb la ferma convicció que també en la prova Vós esteu ben a prop, al nostre costat."]],"ord22":[["Oh Déu, salvació dels iu i misericordiós, que, per salvar el que s’havia perdut, vau enviar al món el vostre Fill Jesús. Concediu-nos als qui avui ens trobem reunits aquí, que ens sentim plens de goig per rebre Jesús com a salvador."],["Oh Déu, pare de tots els homes.","Enfortiu els vostres fills, convidats a la taula del Crist, perquè puguem experimentar profundament el vostre perdó i el vostre amor."],["Oh Déu totpoderós.","Ajudeu-nos a deixar la nostra inèrcia i passivitat","i anar al món amb decisió i valentia,","perquè puguem compartir amb tothom","el goig de la trobada amb Crist."]],"ord32":[["Oh Déu, que voleu la salvació de tots els homes.","El vostre Fill, Jesús, ens ha obert","amb la seva resurrecció,","les portes de la salvació eterna.","Vesseu sobre nosaltres, aplegats aquí, la llum de l’esperança","i ompliu-nos del goig que no s’acaba."],["Oh Déu, font de tota vida.","Venim davant vostre portant els fruits del nostre treball. Feu que tots els qui ens asseiem a la vostra taula sapiguem compartir l’alegria d’estar vivificats per vós."],["Oh Déu, força dels qui creuen en vós.","Vós ens envieu enmig del món a nosaltres que, units a Crist,","hem participat en la seva mort i resurrecció.","Feu que sapiguem experimentar i apreciar","l’abundor de la vida rebuda,","i d’aquesta manera testimoniar amb força l’alegria de viure."]],"ord33":[["Oh Déu, origen i fonament de totes les coses.","Vós sosteniu i guieu els qui us reverencien.","Enfortiu amb el vostre Esperit els qui s’han reunit aquí, perquè, fins i tot enmig de qualsevol adversitat,","puguin seguir les petjades de Jesús."],["Oh Déu, compassiu i misericordiós.","Reunits en pregària davant vostre,","us oferim els fruits del nostre treball de cada dia. Feu que aquest pa i aquest vi siguin para nosaltres nodriment de vida que ens mantingui en el camí."],["Oh Déu, origen de la llum.","Il·lumineu el camí dels nostres passos,","perquè, fins i tot enmig dels problemes i sofriments, sapiguem mantenir viva fins a la fi la nostra esperança const DAY=86400000;
function dt(y,m,d){return new Date(y,m-1,d,12);}
function addDays(x,n){const r=new Date(x);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function diffDays(a,b){return Math.round((a-b)/DAY);}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return dt(y,mo,da);}
function advent1(y){const x=dt(y,12,25),w=x.getDay();return addDays(x,-(w===0?7:w)-21);}
function cycleOf(Y){return ['C','A','B'][(Y+1)%3];}
function litYearOf(date){let Y=date.getFullYear();if(date<advent1(Y))Y--;return Y;}
const FIXED={'2-2':['Presentació del Senyor','w'],'6-24':['Naixement de sant Joan Baptista','w'],'6-29':['Sant Pere i sant Pau','r'],'8-6':['Transfiguració del Senyor','w'],'8-15':['Assumpció de la Mare de Déu','w'],'9-14':['Exaltació de la Santa Creu','r'],'11-1':['Tots Sants','w'],'11-2':['Commemoració de tots els fidels difunts','v'],'11-9':['Dedicació de la basílica del Laterà','w']};
const _cache={};
function liturgicalYear(Y){
  if(_cache[Y])return _cache[Y];
  const start=advent1(Y),end=advent1(Y+1),E=easter(Y+1),cyc=cycleOf(Y);
  const ash=addDays(E,-46),pent=addDays(E,49),ck=addDays(end,-7);
  const j6=dt(Y+1,1,6),bapt=addDays(j6,7-j6.getDay());
  const out=[];
  for(let s=new Date(start);s<end;s=addDays(s,7)){
    const e={date:new Date(s),cyc,key:null,name:'',color:'g',note:''};
    const md=(s.getMonth()+1)+'-'+s.getDate();
    if(s<addDays(start,28)){const n=diffDays(s,start)/7+1;e.key='adv'+n;e.color=n===3?'p':'v';}
    else if(s<bapt){
      if(md==='12-25'){e.name='Nadal del Senyor';}
      else if(s.getMonth()===11){e.name='Sagrada Família';}
      else if(md==='1-1'){e.name='Santa Maria, Mare de Déu';}
      else if(md==='1-6'){e.name='Epifania del Senyor';}
      else e.name='Diumenge 2 després de Nadal';
      e.color='w';
    }
    else if(s<ash){const n=diffDays(s,bapt)/7+1;if(n===1){e.name='Baptisme del Senyor';e.color='w';}else e.key='ord'+n;}
    else if(s<E){const k=diffDays(E,s)/7;if(k===1){e.name='Diumenge de Rams';e.color='r';}else{const n=7-k;e.key='qua'+n;e.color=n===4?'p':'v';}}
    else if(s<=pent){const k=diffDays(s,E)/7;e.color='w';
      if(k===0)e.name='Diumenge de Pasqua';else if(k===1)e.name='Diumenge 2 de Pasqua';
      else if(k<=5)e.key='pas'+(k+1);
      else if(k===6){e.name='Ascensió del Senyor';e.note='A Espanya se celebra el diumenge 7 de Pasqua.';}
      else{e.name='Pentecosta';e.color='r';}}
    else{
      const n=34-diffDays(ck,s)/7;
      if(sameDay(s,addDays(pent,7))){e.name='Santíssima Trinitat';e.color='w';}
      else if(sameDay(s,addDays(pent,14))){e.name='Cos i Sang de Crist';e.color='w';e.note='A Espanya se celebra en diumenge.';}
      else if(n===34){e.key='rei';e.color='w';}
      else e.key='ord'+n;
    }
    if(e.key&&e.key.startsWith('ord')&&FIXED[md]){
      e.sundayKey=e.key;e.key=null;e.name=FIXED[md][0];e.color=FIXED[md][1];
    }
    if(md==='12-8'&&e.key&&e.key.startsWith('adv'))e.note='El 8 de desembre és la Immaculada Concepció: consulteu el calendari litúrgic de la vostra diòcesi.';
    if(md==='10-24'&&e.key)e.note='24 d’octubre: Sant Antoni Maria Claret, solemnitat en el calendari propi dels Missioners Claretians.';
    out.push(e);
  }
  return _cache[Y]=out;
}
function sundayOnOrAfter(x){return addDays(x,(7-x.getDay())%7);}
function entryFor(sunday){const Y=litYearOf(sunday);return liturgicalYear(Y).find(e=>sameDay(e.date,sunday));}

function seasonOf(k){return {adv:'Advent',qua:'Quaresma',pas:'Pasqua',ord:'Temps durant l’any',rei:'Temps durant l’any'}[k.replace(/\d+/,'')];}

// Data en què es fa servir una clau dins l'any litúrgic més proper d'aquest cicle
function nearestDate(cyc,key){const Y0=litYearOf(today());let best=null;
  for(let Y=Y0-1;Y<=Y0+2;Y++){if(cycleOf(Y)!==cyc)continue;const e=liturgicalYear(Y).find(x=>x.key===key||x.sundayKey===key);
    if(e&&(!best||Math.abs(e.date-today())<Math.abs(best.date-today())))best=e;}
  return best;}

function sundayCard(e,{showPrayers=true,heading=''}={}){
  const key=e.key, col=e.color;
  const name=key?titleOf(key):e.name;
  let notes='';
  if(!key&&e.sundayKey){notes+=`<p>Aquest diumenge la litúrgia celebra <b>${esc(e.name)}</b>, que té oracions pròpies al Missal.</p>
    <p>Corresponia al <button class="linkbtn" data-go="p-${e.cyc}-${e.sundayKey}">${titleOf(e.sundayKey)} (${e.cyc})</button>.</p>`;}
  else if(!key){notes+=`<p>Aquesta celebració té oracions pròpies al Missal Romà; el recull de pregàries del Japó no n’inclou.</p>`;}
  if(e.note)notes+=`<p>${esc(e.note)}</p>`;
  return `<article class="sunday" style="--season:var(--c-${col})">

    <div class="meta"><span class="pill cyc">Cicle ${e.cyc}</span><span class="pill">${key?seasonOf(key):'Solemnitat o festa'}</span><span class="pill">Color ${COLORNAME[col]}</span></div>
    ${notes?`<div class="note">${notes}</div>`:''}
    ${key&&showPrayers?prayersHTML(e.cyc,key):''}
  </article>`;
}

  const label=state.pick?'Diumenge de la data triada':(isSun?'Avui':'Proper diumenge');
  let extra='';
  if(!isSun&&prev){const pk=prev.key;
    extra=`<div class="note" style="margin-top:1rem"><p>Per a les misses feriales d’aquesta setmana: ${pk?`<button class="linkbtn" data-go="p-${prev.cyc}-${pk}">${titleOf(pk)} (${prev.cyc})</button>`:esc(prev.name)}.</p></div>`;}
  app.innerHTML=`${sundayCard(e,{heading:label})}${extra}
    <div class="datepick"><label for="dp">Consulta una altra data</label>
      <input type="date" id="dp" value="${isoDate(base)}">
      ${state.pick?'<button class="linkbtn" data-act="resetpick">Torna a avui</button>':''}</div>
    <details class="about"><summary>Sobre aquestes pregàries</summary>
      <p>Després de la reforma litúrgica del Vaticà II, l’Església del Japó va redactar unes oracions noves per a la missa dominical en sintonia amb les lectures bíbliques de cada diumenge, i amb un llenguatge que s’adreça a Déu com a Pare bo, misericordiós i proper.</p>
      <p>José M. Lerga, sacerdot navarrès que ha viscut mitja vida al Japó, les va traduir a l’espanyol. La traducció catalana és de PCM (edició privada, fora del circuit comercial). La versió castellana d’aquesta app s’ha fet a partir del text català i no és la de Lerga.</p>
      <p>El recull conté les tres oracions (col·lecta, sobre les ofrenes i després de la comunió) dels diumenges d’Advent, de Quaresma, de Pasqua (3r a 6è), durant l’any (2n a 33è) i de Crist Rei, per als cicles A, B i C. Les solemnitats i festes que no hi són remeten al Missal Romà.</p>
      <p>El calendari segueix el calendari general amb les particularitats d’Espanya (Epifania el 6 de gener, Ascensió i Corpus traslladats a diumenge).</p>
    </details>`;
  document.getElementById('dp').addEventListener('change',ev=>{const v=ev.target.value;if(!v)return;const [y,m,d]=v.split('-').map(Number);state.pick=dt(y,m,d);render();});
}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function viewCycles(cyc){
  const curE=entryFor(sundayOnOrAfter(today()));
  cyc=cyc||state.cycle||curE.cyc; state.cycle=cyc; store.set('cycle',cyc);
  const curKey=curE.cyc===cyc?curE.key:null;
  const chip=(k,txt,wide)=>`<button class="${wide?'wide ':''}${k===curKey?'cur':''}" data-go="p-${cyc}-${k}" aria-label="${titleOf(k)}">${txt}</button>`;
  let html=`<div style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap">
    <div class="seg" role="group" aria-label="Cicle">${['A','B','C'].map(c=>`<button data-act="cyc" data-c="${c}" aria-pressed="${c===cyc}">Cicle ${c}</button>`).join('')}</div>
    <span class="hint">Ara som al cicle ${curE.cyc}.</span></div>`;
  for(const [s,name,col] of SEASONS){
    const ks=ORDER.filter(k=>k.startsWith(s));
    html+=`<h2 class="sec-h"><span class="dot" style="--season:var(--c-${col})"></span>${name}</h2><div class="chips">`;
    html+=ks.map(k=>chip(k,k.replace(/\D+/,''))).join('');
    if(s==='ord')html+=chip('rei','Crist Rei',true);
    html+='</div>';
    if(s==='pas')html+=`<p class="hint">Els diumenges 1r, 2n i 7è de Pasqua, i Pentecosta, tenen oracions pròpies al Missal.</p>`;
  }
  app.innerHTML=html;
}

function viewPrayer(cyc,key){
  if(!DATA[cyc]||!DATA[cyc][key]){location.hash='#cicles';return;}
  const e=nearestDate(cyc,key);
  const i=ORDER.indexOf(key),pk=ORDER[i-1],nk=ORDER[i+1];
  const card={date:e?e.date:null,cyc,key,color:colorOf(key),name:'',note:''};
  let dateLine='';
  if(e){dateLine=fmtLong.format(e.date);}
  let notes='';
  if(e&&!e.key&&e.sundayKey)notes=`<div class="note"><p>El ${fmtLong.format(e.date)} aquest diumenge queda substituït per <b>${esc(e.name)}</b>.</p></div>`;
  else if(e&&e.note)notes=`<div class="note"><p>${esc(e.note)}</p></div>`;
  app.innerHTML=`<button class="back" data-act="back">‹ Tornar</button>
  <article class="sunday" style="--season:var(--c-${card.color})">
    ${dateLine?`<p class="when">${dateLine}</p>`:''}
    <h2>${titleOf(key)}</h2>
    <div class="meta"><span class="pill cyc">Cicle ${cyc}</span><span class="pill">${seasonOf(key)}</span><span class="pill">Color ${COLORNAME[card.color]}</span></div>
    ${notes}
    ${prayersHTML(cyc,key)}
    <div class="pn">
      <button data-go="p-${cyc}-${pk}" ${pk?'':'disabled'}><small>Anterior</small>${pk?titleOf(pk):''}</button>
      <button data-go="p-${cyc}-${nk}" ${nk?'':'disabled'}><small>Següent</small>${nk?titleOf(nk):''}</button>
    </div>
  </article>`;
}

function viewCalendar(){
  const curY=litYearOf(today());
  if(state.calY===null)state.calY=curY;
  const Y=state.calY, list=liturgicalYear(Y);
  const nextSun=sundayOnOrAfter(today());
  let html=`<div class="yearbar">
    <button class="icon-btn" data-act="calprev" aria-label="Any litúrgic anterior">‹</button>
    <h2>Any litúrgic ${Y}–${Y+1}<small>Cicle ${cycleOf(Y)}${Y===curY?', any en curs':''}</small></h2>
    <button class="icon-btn" data-act="calnext" aria-label="Any litúrgic següent">›</button></div><ul class="cal">`;
  let lastM='';
  for(const e of list){
    let m=fmtMonth.format(e.date).replace(' del ',' de ');m=m[0].toUpperCase()+m.slice(1);
    if(m!==lastM){html+=`<li class="cal-m">${m}</li>`;lastM=m;}
    const now=sameDay(e.date,nextSun);
    const name=e.key?titleOf(e.key):e.name;
    const sub=e.sundayKey?`<small>En lloc del ${titleOf(e.sundayKey).toLowerCase()}</small>`:(e.note?`<small>${esc(e.note)}</small>`:'');
    const inner=`<span class="d">${e.date.getDate()} ${MES[e.date.getMonth()]}</span><span class="dot" style="--season:var(--c-${e.color})"></span>
      <span class="n">${esc(name)}${sub}</span>${e.key?'<span class="go">Obre ›</span>':'<span class="miss">Missal</span>'}`;
    html+=`<li class="${now?'now':''}">${e.key?`<button data-go="p-${e.cyc}-${e.key}">${inner}</button>`:`<div class="row">${inner}</div>`}</li>`;
  }
  app.innerHTML=html+'</ul>';
  const cur=app.querySelector('li.now');if(cur&&Y===curY&&!viewCalendar._scrolled){cur.scrollIntoView({block:'center'});viewCalendar._scrolled=true;}
}

const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/’/g,"'");
function viewSearch(){
  app.innerHTML=`<input class="search" id="q" type="search" placeholder="${state.lang==='es'?'Busca una palabra: misericordia, luz, pan…':'Cerca una paraula: misericòrdia, llum, pa…'}" value="${esc(state.query)}" aria-label="Cerca dins les pregàries">
  <div class="seg seg-sm" style="margin-top:.7rem" role="group" aria-label="Llengua de la cerca"><button data-act="lang" data-l="ca" aria-pressed="${state.lang==='ca'}">Català</button><button data-act="lang" data-l="es" aria-pressed="${state.lang==='es'}">Castellano</button></div>
  <ul class="results" id="res"></ul>`;
  const q=document.getElementById('q');q.addEventListener('input',()=>{state.query=q.value;runSearch();});
  if(!state.query)q.focus();runSearch();
}
function runSearch(){
  const res=document.getElementById('res'),q=fold(state.query.trim());
  if(q.length<3){res.innerHTML=`<li class="hint">Escriu almenys tres lletres. La cerca abasta les ${3*ORDER.length*3} oracions dels tres cicles.</li>`;return;}
  const out=[];
  for(const c of ['A','B','C'])for(const k of ORDER)TXT()[c][k].forEach((lines,i)=>{
    const t=lines.join(' ');const f=fold(t);const pos=f.indexOf(q);
    if(pos>=0){const a=Math.max(0,pos-50),b=Math.min(t.length,pos+q.length+60);
      out.push({c,k,i,sn:(a>0?'…':'')+esc(t.slice(a,pos))+'<mark>'+esc(t.slice(pos,pos+q.length))+'</mark>'+esc(t.slice(pos+q.length,b))+(b<t.length?'…':'')});}
  });
  res.innerHTML=out.length?`<li class="hint">${out.length} resultat${out.length>1?'s':''}</li>`+out.slice(0,200).map(r=>`<li><button data-go="p-${r.c}-${r.k}"><b>${titleOf(r.k)} (${r.c})</b>, ${LBL()[r.i].toLowerCase()}<span class="sn">${r.sn}</span></button></li>`).join(''):'<li class="hint">Cap oració conté aquesta paraula.</li>';
}

// ---------- Encaminament ----------
let lastList='#avui';
function render(){
  const h=(location.hash||'#avui').slice(1);
  let tab='avui';
  if(h.startsWith('p-')){const [,c,k]=h.split('-');viewPrayer(c,k);tab=null;}
  else if(h==='cicles'){viewCycles();tab='cicles';}
  else if(/^cicle-[ABC]$/.test(h)){viewCycles(h.slice(-1));tab='cicles';}
  else if(h==='calendari'){viewCalendar();tab='calendari';}
  else if(h==='cerca'){viewSearch();tab='cerca';}
  else viewToday();
  if(tab)lastList='#'+h;
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
}
window.addEventListener('hashchange',()=>{render();if(!document.body.classList.contains('altar'))window.scrollTo(0,0);});

// ---------- Accions ----------
let wakeLock=null;
async function toggleWake(){
  try{if(wakeLock){await wakeLock.release();wakeLock=null;toast('Pantalla encesa desactivada');}
    else{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;syncBtns();});toast('La pantalla no s’apagarà');}}
  catch(e){toast('Aquest navegador no permet mantenir la pantalla encesa');}
  syncBtns();
}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&wakeLock===null&&state.wantWake){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}});
function syncBtns(){document.querySelectorAll('[data-act="wake"]').forEach(b=>b.setAttribute('aria-pressed',!!wakeLock));
  document.querySelectorAll('[data-act="altar"]').forEach(b=>b.setAttribute('aria-pressed',document.body.classList.contains('altar')));}
function copyText(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiat'),()=>{
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiat');}catch(e){toast('No s’ha pogut copiar');}ta.remove();});}
document.addEventListener('click',ev=>{
  const go=ev.target.closest('[data-go]');
  if(go){location.hash='#'+go.dataset.go;return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='cyc'){location.hash='#cicle-'+b.dataset.c;}
  else if(a==='calprev'){state.calY--;viewCalendar();}
  else if(a==='calnext'){state.calY++;viewCalendar();}
  else if(a==='resetpick'){state.pick=null;render();}
  else if(a==='back'){if(history.length>1)history.back();else location.hash=lastList;}
  else if(a==='altar'){document.body.classList.toggle('altar');syncBtns();window.scrollTo(0,0);}
  else if(a==='wake'){state.wantWake=!wakeLock;toggleWake();}
  else if(a==='copy'){const p=TXT()[b.dataset.c][b.dataset.k][+b.dataset.i];copyText(`${LBL()[+b.dataset.i]}\n${p.join('\n')}`);}
  else if(a==='lang'){state.lang=b.dataset.l;store.set('lang',state.lang);const y=window.scrollY;render();window.scrollTo(0,y);}
  else if(a==='copyall'){const c=b.dataset.c,k=b.dataset.k;copyText(`${TTL(k)} (${state.lang==='es'?'ciclo':'cicle'} ${c})\n\n`+TXT()[c][k].map((p,i)=>`${LBL()[i]}\n${p.join('\n')}`).join('\n\n'));}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&document.body.classList.contains('altar')){document.body.classList.remove('altar');syncBtns();}});

// Mida del text i tema
function applyFs(){document.documentElement.style.setProperty('--fs',state.fs+'px');store.set('fs',state.fs);}
document.getElementById('fsMinus').onclick=()=>{state.fs=Math.max(14,state.fs-1);applyFs();};
document.getElementById('fsPlus').onclick=()=>{state.fs=Math.min(34,state.fs+1);applyFs();};
function applyTheme(){if(state.theme)document.documentElement.setAttribute('data-theme',state.theme);else document.documentElement.removeAttribute('data-theme');}
document.getElementById('theme').onclick=()=>{
  const dark=state.theme?state.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  state.theme=dark?'light':'dark';store.set('theme',state.theme);applyTheme();};
applyFs();applyTheme();render();
</script>
</body>
</html>
