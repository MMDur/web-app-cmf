<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traductor 750</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;padding:20px}
.container{max-width:900px;margin:auto}
.card{background:#fff;padding:20px;border-radius:15px;margin:15px 0;box-shadow:0 3px 10px #ddd}
textarea{width:100%;min-height:120px;padding:10px;box-sizing:border-box;border-radius:10px;border:1px solid #ccc}
button{background:#2563eb;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}
.counter{text-align:right;color:#666}
</style>
</head>
<body>
<div class="container">
<h1>🌐 Traductor 750</h1>
<p style="text-align:center">Español → Catalán · Francés · Italiano · Euskera</p>

<div class="card">
<textarea id="input" maxlength="750" placeholder="Introduce el texto en español..."></textarea>
<div class="counter"><span id="count">0</span>/750</div>
<button onclick="translateText()">Traducir</button>
</div>

<div class="grid">
<div class="card"><h3>🇨🇦 Catalán</h3><textarea id="ca" readonly></textarea><button onclick="copyText('ca')">Copiar</button></div>
<div class="card"><h3>🇫🇷 Francés</h3><textarea id="fr" readonly></textarea><button onclick="copyText('fr')">Copiar</button></div>
<div class="card"><h3>🇮🇹 Italiano</h3><textarea id="it" readonly></textarea><button onclick="copyText('it')">Copiar</button></div>
<div class="card"><h3>🟢 Euskera</h3><textarea id="eu" readonly></textarea><button onclick="copyText('eu')">Copiar</button></div>
</div>
</div>

<script>
const input=document.getElementById("input");
input.oninput=()=>document.getElementById("count").textContent=input.value.length;

async function translateText(){
 const text=input.value.trim();
 if(!text){alert("Introduce un texto");return;}

 const r=await fetch("TU_URL_BACKEND_AQUI",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({text})
 });

 const data=await r.json();

 ca.value=data.catalan;
 fr.value=data.frances;
 it.value=data.italiano;
 eu.value=data.euskera;
}

function copyText(id){
 navigator.clipboard.writeText(document.getElementById(id).value);
}
</script>
</body>
</html>
