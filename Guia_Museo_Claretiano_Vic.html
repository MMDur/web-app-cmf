l d'Avisos a les Donzelles. Després vaig escriure el dels Pares de família, el dels Nens, el dels Joves..."},{"ab":"323","t":"Gràcies en siguin donades a Déu, tots els llibrets han produït feliços resultats; però dels qui trobo més ànimes convertides, són: **El camí dret** i **El Catecisme explicat**... Tots el cerquen i no paren fins que no l'han adquirit."}]},{"left":[{"v":"J","r":[["56","***«Camí Dret i segur per arribar al cel»***. Successió d'edicions en català i castellà."],["57","Edicions en altres idiomes: èuscar, portuguès, pangasinan (de les Filipines)."]]}],"right":[{"a":"«EL CAMÍ DRET I SEGUR PER ARRIBAR AL CEL» ha estat el manual de formació de la pietat i vida cristiana més popular d'Espanya. Els exemplars impresos es calculen en uns dos milions."},{"a":"És l'obra més editada en llengua catalana, i amb més nombre d'exemplars en total. L'edició original catalana es féu el 1843 i era un opuscle de 48 pàgines. Les edicions se succeïren ràpidament, i amb les millores i ampliacions de cada edició arribà a ser un volum de 500 pàgines. A final de segle se n'havien fet 250 edicions amb uns 800.000 exemplars."},{"a":"«EL CAMÍ DRET» fou editat en llengua pangasinan, a Manila, l'any 1884. Aquesta és una reedició feta a Txecoslovàquia."},{"a":"Sant Antoni Maria Claret és l'únic autor català que ha estat traduït a llengües malaies (tagal, bisaya, ilocà, pangasinan)."}]},{"left":[{"v":"K","r":[["58","***«Catecisme explicat»***. Primeres edicions."],["59","Làmines del ***«Catecisme explicat»***."],["60","***«Mannà del Cristià»***."],["61","***«El santo evangelio de Nuestro Señor Jesucristo según san Mateo»***."],["62","***«La Santa Ley de Dios»***."],["63","***«Nuevo manojito de flores»***."],["64","***«La Llave de Oro»***."]]}],"right":[{"ab":"285","t":"Per l'amor que tenia als nens i pel meu desig que fossin instruïts en la Doctrina cristiana, he escrit quatre catecismes: un per als pàrvuls, des que parlen fins als set anys; un altre per als rudes; un altre una mica més extens, i un altre d'explicat i amb estampes."},{"ab":"287","t":"El Catecisme per als grans és el mitjà que he conegut que feia més fruit. Amb ell se'ls treia de la ignorància..."}]},{"left":[{"v":"L","r":[["65","***«El Colegial o seminarista instruído»***."],["66","***«La vocación de los niños»***."],["67","***«Colección de opúsculos»***."],["68","***«A la juventud estudiosa y cristiana»***. ***«La Colegiala Instruída»***."],["69","***«L'egoismo vinto»*** (una de les darreres obres)."],["70","Alguns dels innombrables llibres publicats per la «Llibreria Religiosa». Entre ells sobresurt la Bíblia: un exemplar de la tercera edició, amb unes manetes que assenyalen els punts que el Pare Claret considerava més remarcables."],["71","«Ex-libris» de l'Arquebisbe Claret. Hi ha la dedicatòria personal d'un autor."]]}],"right":[{"ab":"329","t":"A fi de poder donar i vendre com més barat millor, vaig pensar establir una Impremta Religiosa sota la protecció de Maria Santíssima de Montserrat..."},{"a":"Fundada el desembre de 1848, la Llibreria Religiosa edità en vida del seu fundador uns deu milions d'impresos. La seva obra editorial ha arribat fins als nostres dies."},{"ab":"331","t":"Per mitjà de la Llibreria Religiosa els eclesiàstics i seglars s'han proveït i es proveeixen de llibres bons, els millors de què es té notícia, i al preu més baix..."}]},{"left":[{"p":"Plafó 14","i":["Làmines del ***«Catecisme explicat»*** dibuixades pel sant."]},{"v":"M","r":[["72","Escriptori personal del Pare Claret."]]},{"p":"Plafó 15","i":["L'escriptor missioner: fotografia feta a París l'any 1868."]}],"right":[{"a":"L'altre llibre és el CATECISME DE LA DOCTRINA CRISTIANA EXPLICAT I ADAPTAT A LA CAPACITAT DELS NENS, i adornat amb moltes làmines, pel Rev. D. Antoni Claret, prevere."},{"a":"L'originalitat d'aquesta obra fou el seu mètode intuïtiu, la pedagogia de la imatge. Amb això l'autor s'avançava al seu temps. La Llibreria Religiosa n'edità 170.000 exemplars en català i 145.000 en castellà."},{"ab":"56","t":"I qui havia de dir que el dibuix que jo aprenia per a la fabricació, Déu disposava que servís per a la Religió! I en efecte, m'ha servit de molt per a dibuixar estampes del Catecisme i de temes místics."}]}]},{"rom":"IV","title":"Fundador dels Missioners Claretians","blocks":[{"left":[{"box":[null,"**Cel·la** on el Pare Claret fundà la Congregació dels Missioners Fills de l'Immaculat Cor de Maria, el 16 de juliol de 1849. Era una simple habitació de seminarista situada al tercer pis del seminari vell. La finestra donava al pati interior."]},{"sub":"Els elements originals de la mateixa cel·la són:"},{"o":[["73","La porta,"],["74","la finestra."],["75","Les bigues i el paviment."],["76","Les rajoles del terra. Els 87 centímetres de rajoles del costat de la finestra són de la cel·la que ocupava el P. Esteve Sala, cofundador."],["77","El quadre del Cor de Maria que presidí la fundació."],["78","La taula i la cadira foren usades també pel Pare Claret a la casa del seu germà Josep, a Olost de Lluçanès, o bé en altres moments de la seva vida."]]}],"right":[{"ab":"488","t":"A mitjan maig vaig arribar a Barcelona i vaig retirar-me a Vic, i vaig parlar amb els meus amics els senyors canonges doctor Soler i amb el doctor Passarell, del pensament que tenia de formar una Congregació de Sacerdots que fossin i s'anomenessin Fills de l'Immaculat Cor de Maria."},{"ab":"489","t":"... vaig parlar amb alguns sacerdots, a qui Déu nostre Senyor havia donat el mateix esperit de què jo em sentia animat. Aquests eren: Esteve Sala, Josep Xifré, Domènec Fàbregas, Manuel Vilaró, Jaume Clotet, Antoni Claret, jo, l'ínfim de tots."},{"ab":"490","t":"El dia 16 de juliol del 1849, trobant-nos ja reunits, amb l'aprovació del senyor bisbe i del senyor rector, vam començar els sants exercicis espirituals al Seminari nosaltres sols, amb tot rigor i fervor... D'aquells exercicis tots vam sortir-ne molt fervorosos, resolts i determinats a perseverar i, gràcies siguin donades a Déu i a Maria Santíssima, tots han perseverat molt bé."},{"a":"El començament dels exercicis espirituals a les 3 de la tarda del 16 de juliol, a la cel·la d'un seminarista, marcà el naixement de la Congregació Claretiana."}]},{"left":[{"p":"Plafó 16","i":["Els cofundadors:"],"names":["Sant Antoni Maria Claret","Venerable Jaume Clotet","Esteve Sala","Josep Xifré","Domènec Fàbregas","Manuel Vilaró"]},{"o":[["80","**Rellotge** de l'escala que marcava les hores a la zona del seminari on tingué lloc la fundació. Les agulles marquen les tres de la tarda, hora en què s'inicià la fundació."]]},{"p":"Plafó 17","i":["Definició del Missioner Fill del Cor de Maria, redactada pel sant fundador."]}],"right":[{"ab":"491","t":"Així vam començar i així continuàvem guardant estrictament una vida perfectament comuna. Tots anàvem treballant en el sagrat ministeri."},{"ab":"494","t":"Jo em dic a mi mateix: Un Fill de l'Immaculat Cor de Maria és un home encès de caritat que cala foc arreu on passa; que desitja eficaçment i procura per tots els mitjans d'encendre tothom amb el foc de l'amor diví. Res no el fa enrere; frueix en les privacions; aborda els treballs; abraça els sacrificis; es complau en les calúmnies i s'alegra en els turments. Només pensa com seguirà i imitarà Jesucrist a pregar, a treballar, a sofrir i a procurar sempre i únicament la major glòria de Déu i la salvació de les ànimes.","caps":true}]}]},{"rom":"V","title":"La Casa Mare","blocks":[{"left":[{"v":"N","r":[["81","Maqueta de l'antic convent de la Mercè que el bisbe de Vic cedí a la nova comunitat missionera, i que l'octubre de 1849 esdevingué la Casa Mare de la Congregació dels Missioners Claretians. Ja des del començament es constituí en Casa d'Exercicis Espirituals per a seglars i sacerdots."]]},{"p":"Plafó 18","s":"transparències al centre","i":["Al voltant de la maqueta, fotografies de diversos moments històrics de la Casa Mare de Vic:","En el temps de la fundació.","Obres de reforma dels anys 1928-1930, sota la direcció del màrtir P. Jaume Girón.","Projecte de restauració de l'església al seu estil original gòtic conventual.","La destrucció el juliol de 1936.","En el moment actual."]}],"right":[{"a":"Algunes dades sobre el convent de la Mercè de Vic:"},{"chron":[["1235","El 19 de novembre, Jaume I funda la casa mercedària de Vic."],["1254","Es fa efectiva la fundació a l'actual carrer de Sant Pere, on hi ha actualment l'hospital de Vic."],["1264","Els mercedaris es traslladen al lloc on ara hi ha l'església de Sant Domènec."],["1367","Compren una casa al lloc on s'emplaçarà posteriorment el convent de la Mercè."],["1383","Cap a aquest any ja s'ha començat a construir l'església de la Mercè, d'estil gòtic conventual."],["1580","Sembla que s'edifica el claustre."],["1620","A l'església es construeixen les voltes barroques que desfiguren l'estil original."],["1733","Es construeix la nova porta de l'església. La data que s'hi llegia era 1734."],["1835","Els frares són expulsats del país."],["1849","Octubre: els Missioners Claretians, fundats el 16 de juliol del mateix any al seminari vell, es traslladen al convent dels mercedaris."]]}]},{"left":[{"o":[["82","**Altar** de la capella de la Casa d'Exercicis de la Mercè on, des del començament, els missioners claretians exercien el ministeri apostòlic dels Exercicis Espirituals. Tradició que continua a l'actual «Casa d'Espiritualitat Pare Claret», a la Rambla de Sant Domènec, obra del Pare Lluís Pujol CMF, fundador de les Missioneres de la Institució Claretiana."]]},{"v":"O","r":[["83","Imatge de la Mare de Déu de la Mercè beneïda pel sant. Prové del noviciat dels Pares Escolapis d'Alella."],["84","Bust del Venerable Jaume Clotet, cofundador de la Congregació dels Missioners Claretians i primer biògraf del sant. Obra de Josep Vilarrúbias CMF, any 1990."],["85","**Làpida sepulcral** del Pare Claret, que era a l'antiga església de la Mercè. L'escut, restablert, és obra de Jordi Pallàs."]]}],"right":[]},{"left":[{"box":[null,"**Cel·la** del tercer pis del seminari vell que ocupà el Pare Claret els primers mesos de la fundació. La finestra donava al carrer de Sant Hipòlit, avui de Sant Miquel dels Sants."]},{"sub":"Els elements originals de la mateixa cel·la són:"},{"o":[["86","La porta,"],["87","la finestra,"],["88","Les bigues i el terra. Els 87 centímetres de rajoles del costat de la finestra són de la cel·la que ocupava el P. Esteve Sala."],["89","La tovallola del palanganer fou del Pare Claret anys més tard. *El mobiliari és facsímil, segons la descripció feta pel Pare Clotet en el relat de la fundació.*"]]}],"right":[{"a":"En aquesta habitació, el Pare Claret visqué un gran sofriment i angoixa mentre discernia la voluntat de Déu entre acceptar el nomenament d'arquebisbe o renunciar-hi, atès l'amplíssim camp d'apostolat que tenia en perspectiva. El nomenament li arribà a l'agost i no l'acceptà fins al 4 d'octubre. Des d'aquí escrigué cartes doloroses al Bisbe, al Nunci, al Ministeri de Justícia..."},{"a":"Sant Antoni Maria Claret fundà, a més dels MISSIONERS CLARETIANS i de les MISSIONERES CLARETIANES, altres institucions, com l'Acadèmia de Sant Miquel, que avui es reflecteix en el MOVIMENT DE LAICS CLARETIANS, i les Religioses a casa seva, actualment Institut Secular FILIACIÓ CORDIMARIANA."}]}]},{"rom":"VI","title":"Bisbe missioner","blocks":[{"left":[{"v":"P","r":[["90","**Butlla pontifícia** del papa Pius IX en què es nomena el Pare Claret arquebisbe de Santiago de Cuba."]]},{"p":"Plafó 19","i":["La primera reacció del Pare Claret davant el nomenament."]},{"v":"Q","r":[["91","Amit de l'Arquebisbe Claret."],["92","Sobrepellís."],["93","Dos llibres d'aquella època de la vida del sant: ***«Apuntes del Arzobispo Claret»***, que ell mateix redactà per al govern personal de la diòcesi i que posteriorment fou publicat; ***«Las delicias del Campo»***, per a la promoció dels pagesos."],["94","Corporals amb què celebrava l'Eucaristia."],["95","Cinta de la Mare de Déu de la Caritat del Cobre, patrona del bisbat de Santiago de Cuba. La seva llargada és igual a l'alçada de la imatge de la Mare de Déu del Cobre."],["96","Utensilis personals: navalla d'afaitar, pedra d'esmolar, ganivets plegables, tisores."]]},{"v":"R","r":[["97","Mitra de l'Arquebisbe Claret."],["98","Creu pectoral i anell episcopal."]]}],"right":[{"ab":"491","t":"I heus aquí que el dia 11 d'agost, en baixar de la trona a l'acabament del darrer acte, l'Il·lm. Sr. Bisbe em mana que vagi a Palau, i en arribar-hi em lliura el nomenament reial, datat el dia 4 d'agost, per l'arquebisbat de Cuba."},{"ab":"495","t":"Espantat pel nomenament, no el vaig voler acceptar per considerar-me indigne i incapaç de tan gran dignitat, per no tenir ni la ciència ni les virtuts necessàries... encara que tingués ciència i virtut, no havia d'abandonar la Llibreria Religiosa i la Congregació que acabaven de néixer."},{"ab":"538","t":"Durant els dos primers anys, tot i els terretrèmols i el còlera morbo, visitàrem totes les parròquies de l'arquebisbat; a totes vam donar missió, o jo mateix o els companys, i a les parròquies rurals que tenen tanta extensió se'n donaren moltes."},{"ab":"547","t":"La primera carta pastoral que vaig escriure vaig signar-la el dia 20 de setembre del 1852. Vaig dirigir-la al clergat."},{"ab":"549","t":"La segona carta pastoral vaig dirigir-la al poble el dia 25 de març del 1853, recordant-hi el que els havíem ensenyat en les Missions i visita pastoral."},{"ab":"555","t":"Vaig reparar el Seminari Conciliar. Havien transcorregut més de trenta anys sense que cap seminarista intern s'hagués ordenat."},{"ab":"563","t":"Per als pobres vaig comprar una hisenda a la ciutat de Puerto Príncipe."},{"ab":"564","t":"El pla d'aquesta obra era de recollir els nens i les nenes pobres, molts dels quals es perden pels carrers demanant caritat. A la hisenda se'ls havia de proveir d'aliment i de vestits, i se'ls havia d'ensenyar la Religió, llegir, escriure, etc., i després art o ofici, el que volguessin."},{"ab":"566","t":"Al frontis de l'establiment o casa, a la part dels nens, hi havia un gabinet de física i aparells d'agricultura, un laboratori de química i una biblioteca. Tothom havia de tenir entrada a la biblioteca, dues hores al matí i dues a la tarda; la classe d'agricultura, tres dies la setmana, era per a tots els qui hi volguessin assistir; la resta era per als interns."},{"ab":"568","t":"Mentre la construcció d'aquesta casa anava tirant endavant vaig escriure una obreta intitulada *Las delicias del campo*... que inclou en embrió la casa de Beneficència començada. Aquesta obreta *Delicias del campo* ha estat de gran utilitat a l'Illa, de manera que els amos de les hisendes la lliuraven als majorals i els deien que s'hi guiessin."},{"ab":"569","t":"També vaig establir a la diòcesi la Caixa d'estalvis, el reglament i l'aprovació de la qual estan inclosos en la mateixa obra, per a utilitat i morigeració dels pobres, perquè vaig veure que els pobres si se'ls dirigeix bé i se'ls proporciona un mitjà decent de guanyar-se la vida, són homes virtuosos."},{"ab":"561","t":"Vaig instal·lar un convent de monges de l'ensenyament per a nenes i els vaig comprar una casa..."},{"a":"Es refereix a les religioses de l'Ensenyança de Maria Immaculada, que fundà a Cuba juntament amb la Mare Antònia París, i que posteriorment s'anomenaren CLARETIANES."},{"ab":"570","t":"També visitava els presos de les presons, els catequitzava i els predicava molt sovint... Cuidàvem que a les presons els presos aprenguessin a llegir, escriure, la Religió i algun ofici. Amb aquest motiu teníem a la presó una porció de tallers..."}]},{"left":[{"v":"S","r":[["99","Coixí tacat amb la sang de l'arquebisbe després de l'atemptat sofert a la ciutat d'Holguín, a Cuba, l'1 de febrer de 1856."]]}],"right":[{"ab":"575","t":"Se m'acostà un home com si em volgués besar l'anell, però a l'instant allargà el braç armat amb una navalla d'afaitar i va descarregar el cop amb tota la força."},{"ab":"577","t":"No puc explicar el plaer, el goig i l'alegria que sentia la meva ànima veient que havia aconseguit allò que tant desitjava, que era vessar la sang per amor de Jesús i de Maria i poder segellar amb la sang de les meves venes les veritats evangèliques."}]},{"left":[{"p":"Plafó 20","i":["Santa JOAQUIMA DE VEDRUNA, fundadora de les Carmelites de la Caritat. Vic.","Venerable MARIA ANTÒNIA PARÍS, que, juntament amb l'Arquebisbe Claret, fundà la Congregació de les Religioses de Maria Immaculada (Missioneres Claretianes).","Santa MIQUELA DEL SANTÍSSIM SAGRAMENT, fundadora de les Religioses Adoratrius. Madrid.","Sant FRANCESC COLL, OP, fundador de les Dominiques de l'Anunciata.","Sant PERE ALMATÓ, dominic, a qui el Pare Claret ajudà en el discerniment vocacional."]},{"p":"Plafó 21","i":["Quadre de l'Arquebisbe de Cuba, fet amb fragments de roba utilitzada pel mateix Pare Claret. Obra que unes Missioneres Claretianes de Cuba realitzaren en vida del sant."]}],"right":[{"h":"Conseller espiritual de fundadors:"},{"a":"Sant Antoni Maria Claret prengué part activa en l'animació espiritual i apostòlica d'homes i dones d'Església, sants i fundadors de diverses congregacions religioses."}]},{"left":[{"p":"Plafó 22","i":["Diploma de l'Acadèmia de Sant Miquel, dissenyat i signat per l'Arquebisbe Claret."]}],"right":[{"ab":"581","t":"El tercer fou el pensament de l'Acadèmia de Sant Miquel, pensament que vaig tenir els primers dies d'estar enllitat, i tan bon punt vaig aixecar-me, vaig començar de dibuixar l'estampa i d'escriure'n el Reglament."},{"a":"L'Acadèmia de Sant Miquel fou una de les grans intuïcions pastorals i eclesials del Pare Claret: la presència activa dels laics a l'Església, cridats a l'apostolat des de les diverses professions laicals: intel·lectuals, artistes, escriptors, músics..."}]}]},{"rom":"VII","title":"Confessor reial","blocks":[{"left":[{"p":null,"i":["(Al mateix plafó 22) Carta en què l'Arquebisbe Claret, ja des de Madrid, s'acomiada de l'Església de Cuba."]},{"v":"T","r":[["100","Casulla de l'oratori particular de les germanes Bertrana i Forcada de Vic, amb la qual el P. Claret celebrà la Missa el dia 26 d'agost de 1865."]]}],"right":[{"ab":"587","t":"Ja portava uns quants dies de missió, quan vaig rebre una Reial Ordre que em deia de passar a Madrid, perquè havia mort l'arquebisbe de Toledo, que era confessor de S. M. i aquesta m'havia elegit a mi."},{"ab":"588","t":"El dia 18 de març vaig rebre la Reial Ordre, i el dia 22 del mateix mes vaig sortir de Cuba cap a L'Havana i allà vaig agafar el vapor correu que sortia cap a Cadis."},{"ab":"621","t":"Algunes vegades he dit que Déu m'ha enviat en aquest destí perquè sigui el meu purgatori on purgui i pagui els pecats de la meva vida passada... Sempre sospiro per sortir-ne. Sóc com un ocell engabiat, que va recorrent les barretes per veure si es pot escapar; així rumio per veure si en puc sortir."}]},{"left":[{"v":"U","r":[["101","Coberts amb les inicials A C (Antonio Claret), donats per la reina Isabel II a l'Arquebisbe."],["102","Medalla de la Immaculada: felicitació a Maria per la seva Immaculada Concepció."],["103","Medalla de sant Benet."],["104","Medalla de sant Joan de Déu."],["105","Medalla commemorativa del XVIII centenari del martiri dels apòstols sant Pere i sant Pau."],["106","Medalla de la Capella de la Mare de Déu de Montserrat de Madrid."],["107","Creu Porta-Pau."],["108 al 111","Creus beneïdes, portades o regalades pel sant."],["112","Número de roba de l'Arquebisbe."],["113","Fotografia original, en els darrers anys de la seva vida."],["114","Targeta personal."],["115 al 117","Fotografies de les darreries de la seva vida, fetes a Madrid i a París."],["118","Representacions sarcàstiques de l'arquebisbe confessor de la Reina, en capses de llumins (còpies per gentilesa del Museu Marès de Barcelona)."],["119","Al·lusió caricaturesca al P. Claret com a confessor reial, en una auca sobre la revolució de 1868."]]}],"right":[{"ab":"638","t":"... tinc una santa emulació i gairebé enveja als missioners que tenen la bona sort de poder anar d'un poble a l'altre predicant el sant Evangeli."},{"a":"Els viatges que el Pare Claret hagué de fer amb la família reial, els convertí en una missió gegant. Ciutats i pobles de totes les regions d'Espanya foren testimonis de l'incessant acció apostòlica de Claret, adreçada a tota mena de persones."},{"ab":"639","t":"Enmig de les meves penes tinc algun consol. Quan amb SS. MM. i AA. sortim de jornada, llavors se'm proporciona el poder predicar al poble al matí, abans que SS. MM. surtin de casa; després vaig predicant en els convents a les Monges, Germanes, sacerdots, estudiants, senyors i senyores de les Conferències, etc., etc., de manera que tot el dia el passo predicant."},{"ab":"640","t":"Una de les coses que més m'han ocupat d'ençà que estic a Madrid ha estat l'escriure llibres i fulls volanders."},{"ab":"798","t":"Aquest any he estat molt calumniat i perseguit per tota mena de persones, pels periòdics, per opuscles, llibres estrafets, per fotografies i per moltes altres coses..."},{"a":"Al diari de Madrid «LA ESPERANZA» del 24 de gener de 1865 hi llegim: *«Diverses vegades els amics han dit al senyor Claret que es defensés, però ell sempre ha contestat que la millor defensa era no fer-ne cas, i, ensems, pregar Déu per ells, com ho féu Jesús des de la creu...»* (Citat a Aut. 867)"}]}]},{"rom":"VIII","title":"Traspàs a la Casa del Pare","blocks":[{"left":[{"p":"Plafó 23","i":["Vista general del monestir cistercenc de Fontfreda, al Llenguadoc, on morí exiliat el Pare Claret el 24 d'octubre de 1870."]},{"v":"V","r":[["120","Sant Crist que acompanyà l'agonia del Pare Claret. La comunitat cistercenca de Fontfreda en va fer donació a la Congregació Claretiana."]]}],"right":[{"a":"Els darrers mesos de la seva vida l'Arquebisbe Claret pren part activa en el Concili Vaticà I."},{"a":"Exiliat i perseguit, es retira al monestir cistercenc de Fontfreda, al sud de França, on s'agreuja el seu estat de salut i mor santament, acompanyat d'un grup de missioners claretians i de monjos del monestir."},{"a":"El Venerable Pare Clotet, testimoni d'aquells fets i primer biògraf del sant, escrigué: «La pau, l'alegria i el fervor que mostrà durant la seva darrera malaltia foren admirables: no es cansava de besar el crucifix i de fer fervoroses jaculatòries."},{"a":"Amb una pau inalterable, i amb el Crucifix a les mans, a les 8,45 del matí del 24 d'octubre, lliurà plàcidament la seva ànima al Senyor»."},{"a":"Sobre la llosa sepulcral de l'arquebisbe Claret al monestir de Fontfreda s'hi llegien les darreres paraules de sant Gregori VII:"},{"epi":["HE ESTIMAT LA JUSTÍCIA I HE AVORRIT LA INIQUITAT,","PER AIXÒ MORO A L'EXILI."]}]},{"left":[{"p":"Plafó 24","i":[]},{"o":[["121","Brodats amb els escuts de l'Arquebisbe Claret i de la Congregació dels Missioners Fills del Cor de Maria, que ornaven la caixa en el solemne trasllat del cos del Pare Claret de Fontfreda a Vic l'any 1897."]]}],"right":[{"a":"El 13 de juny de 1897 les restes venerables del sant foren traslladades de Fontfreda a Vic. L'entusiasme dels pobles per on passava fou veritablement delirant. Sobretot a Vic."}]},{"left":[{"v":"X","r":[["122","Caixa de fusta on el senyor Miquel Bantulà de Vic amagà, a casa seva, les venerades despulles del Pare Claret durant la guerra civil espanyola (1936-1939)."],["123","Acta de deposició de les restes mortals per a ser amagades el dia 20 de juliol de 1936. L'endemà, dia 21, l'església de la Mercè era incendiada."],["124","Carta del P. Pere Bertrans, Custodi del cos del sant, adreçada al P. General dels Claretians immediatament després d'escapar de la mort (fou tirotejat per negar-se a revelar el lloc on era amagat el cos del sant). Escrita el dia 15 d'agost de 1936, de genolls, enmig d'un camp de blat de moro."],["125","Carnet d'afiliat a la UGT del P. Bertrans."],["126","Vida del P. Claret, trobada a Tona, apunyalada durant la revolta de 1936."]]}],"right":[{"a":"Els set sepulcres del Pare Claret:"},{"chron":[["1","FONTFREDA (Llenguadoc, França). Del 1870 al 1897."],["2","VIC: Capella del Santíssim de l'església de la Mercè. Del 1897 al 1932."],["3","SANTA EUGÈNIA DE BERGA. Del 1932 al 1934."],["4","VIC: Altar major de l'església de la Mercè. Del 1934 al 1936."],["5","VIC / CASA BANTULÀ, carrer de Sant Miquel dels Sants. Del 1936 al 1939."],["6","VIC: capella provisional a la planta baixa del convent on avui hi ha el Museu Claretià. Del 1939 al 1970."],["7","VIC: Actual Temple Sepulcre: des del 1970, primer centenari de la mort del sant."]]}]}]}],"eu":[{"rom":"","title":"Sarrerako panela","blocks":[{"left":[{"h":"Sarrerako panela"},{"t":"Aita Clareten alegoria: lur honetako gizona, Espirituak gantzutua, Kristoren maitasunak bultzatua eta Mariaren Bihotzaren sutegian forjatua, herria ebanjelizatzeko misioari eman zitzaion."},{"q":"«IRAGANA GOGORATZEA ETORKIZUNAREKIKO KONPROMISOA HARTZEA DA» (*Joan Paulo II.a*, Hiroshima, 1981)."},{"t":"Panela garai hartako eta inguru honetako nekazaritza- eta industria-tresnen zatiekin egina dago. (Egilea: *Mn. Genís Baltrons*, 1990.)"},{"sym":[["Antonio Maria deuna","*Mariaren monograma*"],["Claret","*Eguzkia*"],["Clarà","*Ilargia*"],["Espirituak gantzutua","*Uso zuria*"],["Mariaren Bihotzaren Semea","*Bihotzaren ikurra*"],["Kristorekiko maitasuna","*Mahats-mordoak eta galburuak (Eukaristia)*"],["Maria Birjinagandik gizon egina","*Izarra Mariaren Bihotzaren gainean*"],["Ebanjelizatzaileak predikatua","*Haizeak daramatzan xingolak*"],["Herri osoari","*Lanabesak*"],["Nekazari-jatorria amaren aldetik","*Nekazaritza-tresnak*"],["eta industriala aitaren aldetik","*Industria-tresnak*"]]}],"right":[{"a":"*Antonio Maria Claret deunaren Autobiografiako* testuak letra etzanez daude, ohiko zenbakiketaren arabera identifikatuta."},{"a":"Ohar osagarri batzuk ere gehitzen dira."},{"ab":"1","t":"Jose Xifré jaunak, Mariaren Bihotzaren Semeen Misiolarien Nagusiak, hainbat aldiz eskatu dit, ahoz eta idatziz, nire pertsona hutsalaren biografia bat; beti aitzakiak jarri izan ditut, eta orain ere ez nintzateke horretara erabakiko, agindu izan ez balit. Esanekotasunez bakarrik egiten dut, beraz, eta esanekotasunez agertuko ditut ezkutuan geratzea nahiago nituzkeen gauzak. Dena den, izan bedi Jainkoaren eta Maria Santuaren, nire Ama gozoaren, aintza handiagorako, eta bekatari zorigaiztoko honen lotsarako."}]}]},{"rom":"I","title":"Antonio Claret gaztea","blocks":[{"left":[{"p":"1. panela","s":"Atzetik argiztatutako irudia erdiko erakusmahaian","i":["Antonio Maria Claret deuna jaio zen etxea, Sallenteko Cós kaleko 20. zenbakian, 1807ko abenduaren 23an."]},{"p":"**2. panela**","i":["Garai hartako ehungailua"]},{"p":"**3. panela**","i":["Sallent herria"]},{"p":"**4. panela**","i":["Anton Claret i Clarà-ren zuhaitz genealogikoa"]}],"right":[{"ab":"3","t":"Sallent herrian jaio nintzen, Manresako artziprestaldean, Vic-eko elizbarrutian, Bartzelona probintzian. Nire gurasoek Joan Claret eta Josefa Clarà zuten izena; ezkonduak ziren, zintzoak eta Jainkoaren beldur zirenak, eta Aldareko Sakramentu Santuaren eta Maria Santuaren oso debotoak."},{"ab":"31","t":"Nire aita hari- eta ehun-fabrikatzailea zenez, fabrikan jarri ninduen lanean."}]},{"left":[{"v":"A","r":[["1","Aita Claret jaio zeneko mendeurrenaren domina"],["2","Anton Claretek Sallenten zuen etxean ehundutako eskuoihala"],["3","Aita Claretek bere lagun Josep Caixal kalonje doktoreari idatzitako gutunaren zati autografoa. Gogorarazten dio Bartzelonako Llotjan ikasten zuenean HIRU ALDIZ SARITU ZUTELA MARRAZKETAN."],["4","Anton Clareten izena, ehungile gisa, Francesc Prat-en Bartzelonako fabrikako zerrendan («dels Vigatans», Vic-ekoena, herriak esaten zion bezala): fabrikatzaileak berak sinatua, 1828."],["5","Claret gazteak Francesc Prat-en fabrikan bere ehungailuan zuen gurutzefikua."],["6","Bartzelonako loteria-zenbakiak. Garai hartan, adiskide faltsu batek iruzur egingo dio Claret gazteari loteriarekin."]]},{"n":"*(7-8)*"}],"right":[{"ab":"56","t":"Ehungintzako ezagutzetan aurrera egiteko gogoz, Bartzelonara eramateko eskatu nion aitari. Aitak onartu, eta hara eraman ninduen; nik neuk, Paulo deunak bezala, nire eskuekin irabazten nuen behar nuena: janaria, jantziak, liburuak, maisuak eta abar. Egin nuen lehenengo gauza Casa Lonjako Batzarrari eskaera bat aurkeztea izan zen, marrazketa-eskoletan onartua izateko; lortu nuen, eta nolabaiteko etekina atera nion. Eta nork esan behar zuen ehungintzarako ikasten nuen marrazketa Erlijioaren zerbitzurako izatea erabaki zuela Jainkoak! Eta, egiaz, asko balio izan dit Katiximako irudiak marrazteko..."},{"ab":"58","t":"Bizitzan ikasi ditudan eta landu ditudan gauza guztien artean, bat ere ez dut ehungintza bezain ondo ulertu."}]},{"left":[{"p":"5. panela","s":"Atzetik argiztatutako irudia erdiko erakusmahaian","i":["Bartzelonako Llotja, Claret gazteak ehungintza-artea, hizkuntzak eta marrazketa ikasi zituen tokia."]},{"p":"6. panela","s":"Atzetik argiztatutako irudia erdiko erakusmahaian","i":["Vic-eko elizbarrutiko seminario zaharra: barneko patiora ematen duten leihoak.","Vic-eko Plana."]}],"right":[{"a":"Bartzelonako ikasketak aurreratuak zituela, eta aurrerapen pertsonalaren euforia betean, bere pertsonarekin lotutako gertaera batzuek begiak ireki zizkioten munduko hutsalkeriei, baita Ebanjelioaren eta senideen zerbitzuari erabat emateko aukerari ere."},{"ab":"68","t":"Nahaste-borraste horren erdian, meza santua entzuten ari nintzela, oso txikitan irakurritako Ebanjelioko hitz haiek etorri zitzaizkidan gogora: Zer onura du gizakiak mundu guztia irabazteak, azkenean bere arima galtzen badu? Esaldi horrek zirrara sakona eragin zidan... bihotza zauritu zidan gezia izan zen niretzat; zer egin pentsatu eta pentsatu aritzen nintzen, baina ez nuen asmatzen."},{"ab":"69","t":"Saulo bezala aurkitu nintzen, Damaskorako bidean;"},{"a":"Une larri hartan, anaia laiko batekin izandako topaketa eta Amigó aitarekin izandako harremana, biak ere Felipe Neri deunaren Oratoriokoak, izan ziren ikuspegi berriak ireki zizkion argia."},{"ab":"82","t":"Bartzelonatik irten nintzen, ia lau urte han eman ondoren, sutasunean dezente hoztuta eta harrokeriaren, laudorioen eta txaloen haizez gehiegi beteta..."}]},{"left":[{"p":"7. panela","s":"Atzetik argiztatutako irudia erdiko erakusmahaian","i":["Tortadès etxearen atzeko fatxada eta Aingeruen Ama Birjinaren kapera, lorategian, Pedro III.aren harresiaren gainean.","Lorategiko kaperaren marrazkia; seminarista gaztea maiz biltzen zen han otoitz egitera.","Aingeruen Ama Birjinaren irudia, 1936aren ondoren Frederic Marèsek zaharberritua. Gaur egun Can Tortadès-en dago, familiaren etxe zaharrean, Guilleries mendialdean."]},{"p":"**8. panela**","i":["**Boto-opari** alegorikoa, tentaldiari buruzkoa. Llucià Costaren lana, 1934ko maiatzekoa, dohatsu-izendapenaren karietara egina."]},{"o":[["9","**Farola**, Vic-eko Tortadès etxekoa, Claret ikaslea zen garaikoa."]]},{"p":"**9. panela**","i":["**Ohea**, Tortadès etxekoa; han jasan zuen Anton Claret seminarista gazteak kastitatearen aurkako tentaldi gogorra, eta hartatik, Ama Birjinaren laguntzaz, apaizgintzarantz erabat zuzenduta atera zen."]}],"right":[{"ab":"83","t":"1829ko iraila hasieran Bartzelonatik irten nintzen, eta gurasoek Sallentera joatea nahi izan zuten. Nik, haiei atsegin emateko, hara joan eta haiekin egon nintzen San Migel egunera arte, hilaren 29ra arte; egun hartan, meza santua entzun ondoren, abiatu ginen. Bidaia oso tristea izan zen, ia bide osoan lagun izan genuen euriagatik. Gauez iritsi ginen Vic-era, goitik behera blai eginda."},{"ab":"84","t":"Biharamunean, Pablo de Jesús Corcuera gotzain jauna ikustera joan ginen. Oso ongi hartu gintuen. Eta ikasteko eta nire debozio partikularretarako denbora gehiago izan nezan, Jauregiko maiordomo jaunaren ondoan jarri ninduten, Fortián Bres jaunaren ondoan, apaiz ona benetan, eta asko maite ninduena. Vic-en egon nintzen denbora guztian harekin bizi izan nintzen..."},{"ab":"95","t":"Vic-en filosofiako bigarren urtea ikasten ari nintzela, honako hau gertatu zitzaidan: neguan hotzeria edo katarroa izan nuen... Egun haietako batean, ohean nengoela... tentaldi izugarri bat izan nuen. Maria Santuarengana jotzen nuen... Eta horra non agertu zitzaidan Maria Santua, ederra eta grazia handikoa...; eta haren besoetan arrosa ederrez egindako girlanda handi-handi bat ikusi nuen... Ama Birjina Santuak hitz egin zidan, eta esan zidan: Antonio, koroa hau zurea izango da, garaitzen baduzu... Hori igaro bezain laster, tentaldirik gabe aurkitu nintzen, eta hain poz handiz, ez bainekien zer gertatu zitzaidan."}]}]},{"rom":"II","title":"Herriaren apaiz eta misiolaria","blocks":[{"left":[{"p":"**10. panela**","i":["Viladrau herria: Claret apaizak herri hartako parrokia gobernatu zuen 1840an.","Montseny mendiko Matagalls gailurreko gurutzea, gaur egungo egoeran; Aita Claretek han landatu zuenaren ondorengoa da."]},{"o":[["10","Almaiza, *Ca l’Herbolari* etxekoa (Jordi Pallàsek egindako kopia), Viladrauko Jaume Bofillen etxetik; familiako tradizio baten arabera, Anton Claret apaizak sendabelarrekin prestakinak egin zituen bertan."]]},{"p":"**11. panela**","i":["Claret apaizaren erretratua, Katalunian predikatzen hasi zen garaikoa. P. Rossen grabatua, 1894."]}],"right":[{"a":"Antonio Claret seminarista Solsonan ordenatu zuten apaiz, 1835eko ekainaren 13an. Lehen destinoa Sallenteko parrokia izan zuen. Gerora, Erromara joatea erabaki zuen, misioetara bidal zezaten, munduan ebanjelizazioak gehien behar zuen tokira. Baina Jaunaren bideak beste batzuk ziren."},{"a":"Kataluniara itzultzean, Vic-eko gotzainak Viladrauko artzain-lanetara bidali zuen; Viladrau Montsenyren ipar-magalean dagoen herria da."},{"ab":"170","t":"Viladrauko parrokian erregente gisa ezarrita, ahal nuen ondoen zaintzen nuen arima haien ongi espirituala."},{"a":"Viladrauko egonaldian, Claret apaizak gurutze bat jaso zuen Montsenyko Matagalls gailurrean. Jacint Verdaguer olerkari eta apaizak honela iruzkintzen du:"},{"a":"«Kataluniako apostolu nekaezina, Claret apaiza... guztiz duina zen Katalunia gurutzearen seinalez markatzeko, haren bekokian erredentzioaren bandera ezarriz»."},{"ab":"171","t":"Eta horrela, gorputzeko eta arimako mediku izan behar izan nuen, bai neuzkan ezagutzei esker, bai eskuratu nituen medikuntza-liburuetan egiten nituen ikasketei esker."},{"ab":"172","t":"Viladrauko parrokia honetan hasi nituen misioak 1840ko abuztuaren 15ean, Ama Birjinaren Jasokundeko bederatziurrena eginez."}]},{"left":[{"v":"B","r":[["11","Claret apaizak Viladrauko «El Noguer» etxean erabiltzen zituen mahai-tresnak."],["12","Aita Claretek erabili zuen musu-zapia."],["13","Claret misiolari apostolikoaren gurutzefikua."],["14","Eskuoihal tolestua, santuak erabilia."],["15","Aita Claretek Lleidako misioan banatu zituen domina eta gurutzeetako batzuk, haien benetakotasuna egiaztatzen duen idazki zahar batekin."],["16","Poltsikoko edalontzi txikia."],["17","Musu-zapi tolestua."]]},{"n":"*(18-19)*"},{"p":"**12. panela**","i":["Autobiografiako orrialdeak; haietan aipatzen ditu Aita Claretek urte haietan predikatu zuen herrietako batzuk."]}],"right":[{"ab":"193","t":"1841eko urtarrilaren erdialdean, zortzi hilabetez Viladrauko erregente izan ondoren, parrokia gobernatuz eta, prelatuak hala aginduta, noizean behin hainbat parrokiatara predikatzera irtenez, azkenean etengabe predikatzera irten nintzen, prelatuak bidaltzen ninduen tokira, inon bizileku finkorik gabe."},{"ab":"460","t":"Zazpi urte haietan beti herri batetik bestera ibili nintzen. Bakarrik eta oinez ibiltzen nintzen... Goizean bost orduko bidea egiten nuen, eta beste bost arratsaldean..."},{"ab":"297","t":"Hasieratik hartu nuen estiloa Ebanjelio santuarena izan zen: xumetasuna eta argitasuna. Horretarako, konparazioak, antzekotasunak eta adibide historiko eta egiazkoak erabiltzen nituen; gehienak Liburu Santuetatik hartuak."},{"ab":"221","t":"Beti gehien eta gehien mugitu nauena Jesukristo kontenplatzea izan da, herri batetik bestera nola dabilen, toki guztietan predikatzen, ez bakarrik herri handietan, baita auzo txikietan ere, eta baita emakume bakar bati ere, Samariarrarekin egin zuen bezala..."}]},{"left":[{"v":"C","r":[["20","Paduako Antonio deunaren irudia; Antonio Claret apaizaren zaindaria zen, eta misiolariak berak bedeinkatu zuen."]]},{"v":"D","r":[["21","Aita Claretek erabilitako eskuoihala. Sabadelletik dator."],["22","Vallsen predikatutako misioan erabili zuen bonetea."],["23","Santuak Lleidatik hurbil dagoen Albíko familia batentzat bedeinkatu zuen gurutzea."],["24","Aita Claretek erabiltzen zuen aterkia."],["25","Zilizioa (penitentzia-tresna)."],["26","Mendekosteko irudia, Aita Claretek bere brebiarioan eramaten zuena."],["(27-28)",""],["29","Aita Claret misiolari, katekista eta idazlearen estatua. Domènec Fitaren lana, 1990."]]},{"v":"E","r":[["30","Claret misiolariaren oinetakoak eta musu-zapia. Oinetakoak 1846ko maiatzean Lleidan predikatu zuen misioan aldatu zizkioten. Lurralde haietan ebanjelizatzen ari zela, lleidarrek «Aita Claret» deitzen hasi zitzaizkion maitasunez, eta izen horrek berehala egin zuen sustraia eta betiko geratu zaio."]]}],"right":[]},{"left":[{"v":"F","r":[["31","Entzule debotu baten bertsoak; 1844ko maiatz osoan zehar Bartzelonako Santa Maria del Mar basilikan Antonio Maria Claret deunari entzun zizkion sermoiak laburbiltzen ditu."],["32","Vic-eko jaiotetxeko gogo-jardunlarien erregistro-liburua, klaretarren kongregazioa sortu zenetik. Bertan agertzen den lehen gogo-jardunlaria (1850) «Anton Claret jaun txit argia, Kubako artzapezpiku hautatua» da."],["33","Aita Claretek Kanarietan predikatu zuen garaian Bartzelonan argitaratu zen marrazki-erretratua; zabalkunde handia izan zuen Katalunian."]]}],"right":[{"a":"Jaime Balmesek Aita Claretez esan zuen, Katalunian predikatzen zuen garaiaz: «Pulpitutik ez du inoiz antzokiez hitz egiten. Ezta heresiez ere. Ezta filosofoez edo sinesgabeez ere. Fedea beti ematen du aurrez onartutzat... Izu gutxi, eztitasuna denean. Adibideak, oro har, Liburu Santuetakoak ziren»."},{"ab":"480","t":"Madrildik Sevilla, Jerez eta Cadizera abiatu ginen, eta han predikatu nuen; gero Kanarietarantz itsasoratu ginen. Otsail hasieran Tenerifera iritsi ginen, eta han predikatu nuen igandean; astelehenean Kanaria Handira abiatu ginen. Apaizei gogo-jardunak eman nizkien Jauregiko areto batean, eta gotzain jaunak ekitaldi guztiak zuzentzen zituen. Seminarioko ikasleei ere gogo-jardunak eman nizkien, eta Kanaria Handiko uharteko parrokia guztietan misioa egin nuen."},{"ab":"481","t":"Askotan plazetan predikatu behar izaten nuen, herri bakoitzean misio santua entzutera biltzen zen jendetza ez baitzen tenpluetan sartzen."},{"a":"Hona hemen Brossosa aitak Kanarietako giro herrikoietan bildutako lekukotasun batzuk: «Aita Claret bezalakorik, bat ere ez»; «Jainkoaren Espirituaz betea zegoen»; «hari denok ulertzen genion... eta esaten zuen guztia»; «entzuten genion bitartean, betetzen, betetzen joaten ginen...»."}]},{"left":[{"o":[["34","Aita Claretek Caldes de Montbuiko Felip Ribó jaunari idatzitako bi gutun, idatzizko zabalkunde erlijiosoari buruzkoak (jatorrizkoen argazkia), eta dohaintzak egiteko proposatzen duen autografo bat."],["35","Aita Clareten Autobiografiaren eskuzko kopia, lehen misiolariek egina (bi liburuki), Clotet aita agurgarriaren hasierako ohar batekin; Aita Clareten laguna eta Klaretar Misiolarien Kongregazioaren sortzaileetako bat izan zen."],["36","Garai hartan agurgarria zen Aita Clareten bizitza, Mariano Aguilar aita historialari klaretarrak idatzia."]]}],"right":[{"ab":"483","t":"Misioa amaitzen zenean, herriko jende guztia irteten zen ni laguntzera, eta joaten nintzen herrikoak irteten ziren ni hartzera. Lehenengoek negar artean agurtzen ninduten, eta bigarrenek pozik hartzen ninduten."},{"ab":"486","t":"1849ko maiatz hasieran irten nintzen uharte haietatik... Hamabost hilabete egon nintzen uharte haietan; egunero egin nuen lan, Jaunaren graziak lagunduta."},{"ab":"487","t":"Ai, ene Jainkoa, zein ona zaren! Zein bitarteko ustekabekoez baliatzen zaren bekatariak bihozberritzeko!"}]},{"left":[{"v":"G","r":[["37","Mariaren Bihotzaren Artxikofradiaren sorrera-agiria, Vic-eko Santo Domingo elizan sortua, 1847an, Aita Claretek urte hartako abuztuan han predikatu zuen bederatziurrenaren ondoren."],["38","Maria Santuari eskainitako Arrosarioaren agiria."],["39","Mariaren Bihotz Garbiari eskainitako goigs-ak eta al·leluies-ak (kopla herrikoiak eta irudidun orriak), Claret artzapezpikuak induljentziaz hornituak."],["40","Mariaren Bihotzaren Artxikofradiari buruzko liburuxkak."],["41","Arrosarioari eta beste debozio mariano batzuei buruzko liburuak."],["42","Mariaren Bihotzaren Artxikofradiako lehen kideen erregistroa."],["43","Ama Birjinaren zazpi atsekabeen koroa, Aita Claretek bedeinkatu eta oparitua."],["44","Hamabi izarren koroa, neskato bati oparitu ziona."],["45","Santuak egindako arrosarioak."],["46","Santuak bere arreba Rosari idatzitako gutuna; Fussimanyako Ama Birjinari egiten zizkion bisitez hitz egiten dio."],["47","Aita Claretek Ama Birjinari eskuz idatzitako otoitza."],["48","Pilarreko Ama Birjinaren irudia."],["49","Vic-eko Mariaren Bihotzaren Artxikofradiaren estandartea. Bertan artxikofradiako kide hauek ageri dira: Pedro Almató deuna, Joakina Vedruna deuna, Jaume Balmes, Jacint Verdaguer apaiza, Josep Xifré aita, eta Vic-eko gotzainak Llucià Casadevall, Josep Morgades eta Josep Torras i Bages."]]},{"box":["Zenbakirik gabe","**Beirate** hau, Aita Clareten gotzain-armarriarekin, 1940tik 1970era egon zen toki berean dago, santuaren hilobiaren atzean argia ematen zuen leiho gisa. Museoa gaur egun Mesedeetako behin-behineko kapera zegoen solairu berean dago, hilobi-tenplua eraiki bitartean.","*Aita Clareten gotzain-armarrian hau ikusten da:* Mariaren izena, eguzkia eta ilargia (CLARET eta CLARÀ abizenen aipamena), Sallenteko zubia Llobregat ibaiaren gainean (bere jaioterriaren erreferentzia) eta «CARITAS CHRISTI URGET NOS» goiburua (Kristoren maitasunak bultzatzen gaitu)."]}],"right":[{"ai":"*Aita Claretek Mariaren Bihotzaren Artxikofradia sortu zuen, bekatarien bihozberritzearen alde, Vic-eko Santo Domingo elizan, 1847ko abuztuan. Bederatziurrenean 10.000 pertsona baino gehiagok eman zuten izena. Haien artean, Pedro Almató deuna, Ocañako aita dominikarren nobiziatuko bere lagun guztiekin.*"}]},{"left":[{"p":"**13. panela**","i":["Aita Claretek herriari predikatzen hasterakoan Ama Birjinari egiten zion otoitza."]},{"v":"H","r":[["50","Doloretako Ama Birjinaren irudia, Aita Claretek bedeinkatua. Vic-eko Doloretako Kofradiako kidea zen."]]}],"right":[{"ab":"270","t":"Ai, Jainkoaren Ama Birjina, bekatari txiro eta zorigaiztokoen Ama eta bitartekaria! Ongi dakizu zure seme eta ministro naizela, zeuk moldatua zure errukiaren eta maitasunaren sutegian. Zure esku boteretsuan jarritako gezi baten antzekoa naiz..."}]}]},{"rom":"III","title":"Apostolu idazlea","blocks":[{"left":[{"v":"I","r":[["51","Mota askotako pertsonentzako liburuak."],["52","***«Consejos que una madre da a su hijo a punto de marcharse a la guerra»*** (Gerrara joateko zorian dagoen semeari amak emandako aholkuak). Misiolariaren zentzu praktikoak lan txiki hau tamainaz eta pisuz ahalik eta gehien murrizteko ideia eman zion."],["53","***«El Ferrocarril»*** (Trenbidea). Hirien arteko garraioa zaldiek tiratutako diligentziatik lurrun-trenera igarotzen ari zen garaian, trenbidea eragin handiko gaia izango zen. Aita Claretek ikur gisa erabiltzen du, hiru urrats mailakatutan."],["54","***«Las Hijas del Corazón de María»*** (Mariaren Bihotzaren Alabak), beren etxeetan bizi diren erlijiosak. Gaur egun «Filiación Cordimariana»-ko misiolariak dira."],["55","Hainbat liburuxka."]]}],"right":[{"ab":"310","t":"Esperientziak irakatsi didanez, onerako bitarteko boteretsuenetako bat inprenta da, eta, gaizki erabiltzen denean, gaizkirako arma boteretsuena ere bai."},{"ab":"311","t":"Gaur egun premia bat dela diot, irakurtzeko grina handia dagoelako, eta jendeak liburu onik ez badu, txarrak irakurriko ditu."},{"ab":"312","t":"Gaur egun, beraz, liburu onak zabaltzeko premia bikoitza dago; baina liburu horiek txikiak izan behar dute, jendea presaka dabilelako eta alde guztietatik eta mila eratara deitzen diotelako..."},{"ab":"313","t":"Argitaratu nuen lehen liburuxka Vic-eko mojentzat idatzitako aholku edo ohar espiritualak zituena izan zen... Lehen liburuak emaitza ona ematen zuela ikusita, bigarrena idaztea erabaki nuen: neskatxentzako oharrena. Gero, familiako gurasoentzakoa, haurrentzakoa eta gazteentzakoa idatzi nituen..."},{"ab":"323","t":"Eskerrak Jainkoari, liburuxka guztiek emaitza onak eman dituzte; baina arima bihozberritu gehien hauen bidez aurkitu ditut: **El camino recto** eta **El Catecismo explicado**... Denek bilatzen dute, eta ez dute atsedenik hartzen eskuratu arte."}]},{"left":[{"v":"J","r":[["56","***«Camino recto y seguro para llegar al cielo»*** (Zerura iristeko bide zuzen eta segurua). Katalanezko eta gaztelaniazko edizioen segida."],["57","Beste hizkuntza batzuetako edizioak: euskara, portugesa, pangasinana (Filipinetakoa)."]]}],"right":[{"a":"«CAMINO RECTO Y SEGURO PARA LLEGAR AL CIELO» (katalanez «Camí dret i segur per arribar al cel») izan da Espainiako pietatean eta kristau-bizitzan hezteko eskuliburu ezagunena. Bi milioi ale inguru inprimatu zirela kalkulatzen da."},{"a":"Katalanez gehien argitaratu den lana da, eta ale gehien izan dituena guztira. Jatorrizko katalanezko edizioa 1843an egin zen, eta 48 orrialdeko liburuxka bat zen. Edizioak bata bestearen atzetik etorri ziren, eta edizio bakoitzaren hobekuntza eta gehikuntzekin 500 orrialdeko liburukia izatera iritsi zen. Mendearen amaierarako 250 edizio egin ziren, 800.000 ale ingururekin."},{"a":"«EL CAMINO RECTO» pangasinan hizkuntzan argitaratu zen, Manilan, 1884an. Erakusten den alea Txekoslovakian egindako berrargitalpena da."},{"a":"Antonio Maria Claret deuna da hizkuntza malaiarretara (tagaloa, bisaya, ilokanoa, pangasinana) itzuli den idazle katalan bakarra."}]},{"left":[{"v":"K","r":[["58","***«Catecismo explicado»***. Lehen edizioak."],["59","Irudiak: ***«Catecismo explicado»***."],["60","***«Maná del Cristiano»***."],["61","***«El santo evangelio de Nuestro Señor Jesucristo según san Mateo»***."],["62","***«La Santa Ley de Dios»***."],["63","***«Nuevo manojito de flores»***."],["64","***«La Llave de Oro»***."]]}],"right":[{"ab":"285","t":"Haurrei nien maitasunagatik eta Kristau Ikasbidean hezita egon zitezen nahi nuelako, lau katixima idatzi ditut: bat txikientzat, hitz egiten hasten direnetik zazpi urtera arte; beste bat jende xumearentzat; beste bat zertxobait zabalagoa, eta beste bat azaldua eta irudiz hornitua."},{"ab":"287","t":"Helduentzako Katixima da ezagutu dudan bitartekorik emankorrena. Harekin ezjakintasunetik ateratzen ziren..."}]},{"left":[{"v":"L","r":[["65","***«El Colegial o seminarista instruído»***."],["66","***«La vocación de los niños»***."],["67","***«Colección de opúsculos»***."],["68","***«A la juventud estudiosa y cristiana»***. ***«La Colegiala Instruída»***."],["69","***«L’egoismo vinto»*** (bere azken lanetako bat)."],["70","«Librería Religiosa»-k argitaratutako liburu ugarietako batzuk. Haien artean nabarmentzen da Biblia: hirugarren edizioko ale bat, Aita Claretek aipagarrienak iruditzen zitzaizkion pasarteak seinalatzen dituzten esku txiki inprimatuekin."],["71","Claret artzapezpikuaren «ex libris»-a. Egile baten eskaintza pertsonala dauka."]]}],"right":[{"ab":"329","t":"Ahalik eta merkeen eman eta saldu ahal izateko, Inprenta Erlijioso bat jartzea pentsatu nuen, Montserrateko Maria Santuaren babespean..."},{"a":"1848ko abenduan sortua, Librería Religiosak hamar milioi inprimaki inguru argitaratu zituen bere sortzailea bizi zela. Haren argitalpen-lanak gaur arte iraun du."},{"ab":"331","t":"Librería Religiosaren bitartez, eliz gizonak eta sekularrak liburu onez hornitu dira eta hornitzen ari dira, ezagutzen diren onenez, eta preziorik txikienean..."}]},{"left":[{"p":"**14. panela**","i":["Irudiak: ***«Catecismo explicado»***, santuak marraztuak."]},{"v":"M","r":[["72","Aita Clareten idazmahai pertsonala."]]},{"p":"**15. panela**","i":["Idazle misiolaria: Parisen 1868an ateratako argazkia."]}],"right":[{"a":"Beste liburua hau da: CATECISMO DE LA DOCTRINA CRISTIANA EXPLICADO Y ADAPTADO A LA CAPACIDAD DE LOS NIÑOS, y adornado con muchas láminas, por el Rev. D. Antonio Claret, Presbítero (Kristau-ikasbidearen katixima, azaldua eta haurren gaitasunera egokitua, irudi askoz apaindua, Antonio Claret apaiz jaunak egina)."},{"a":"Lan honen originaltasuna metodo intuitiboa izan zen, irudiaren pedagogia. Horrela, egilea bere garaiaren aurretik joan zen. Librería Religiosak 170.000 ale argitaratu zituen katalanez eta 145.000 gaztelaniaz."},{"ab":"56","t":"Eta nork esan behar zuen ehungintzarako ikasten nuen marrazketa Erlijioaren zerbitzurako izatea erabaki zuela Jainkoak! Eta, egiaz, asko balio izan dit Katiximako irudiak eta gai mistikoetakoak marrazteko."}]}]},{"rom":"IV","title":"Klaretar Misiolarien sortzailea","blocks":[{"left":[{"box":[null,"**Gela** hau da Aita Claretek Mariaren Bihotz Garbiaren Seme Misiolarien Kongregazioa sortu zuen tokia, 1849ko uztailaren 16an. Seminario zaharreko hirugarren solairuko seminarista-gela xume bat zen. Leihoak barneko patiora ematen zuen."]},{"sub":"***Gela beraren jatorrizko elementuak hauek dira:***"},{"o":[["73","Atea,"],["74","leihoa."],["75","Habeak eta zorua."],["76","Lurreko baldosak. Leiho ondoko 87 zentimetroko baldosak Esteve Sala aitak, sortzaileetako batek, okupatzen zuen gelakoak dira."],["77","Sorrera buru izan zuen Mariaren Bihotzaren koadroa."],["78","Mahaia eta aulkia Aita Claretek ere erabili zituen bere anaia Joseparen etxean, Lluçanèseko Olosten, edo bere bizitzako beste une batzuetan."]]}],"right":[{"ab":"488","t":"Maiatzaren erdialdean Bartzelonara iritsi nintzen, eta Vic-era erretiratu nintzen; eta nire lagun Soler eta Passarell kalonje jaunekin hitz egin nuen, Mariaren Bihotz Garbiaren Semeak izango ziren eta horrela deituko ziren Apaizen Kongregazio bat sortzeko nuen asmoaz."},{"ab":"489","t":"... zenbait apaizekin hitz egin nuen, Jainko gure Jaunak ni bizi ninduen espiritu bera emana zienekin. Hauek ziren: Esteban Sala, José Xifré, Domingo Fábregas, Manuel Vilaró, Jaime Clotet, Antonio Claret, ni, guztien artean txikiena."},{"ab":"490","t":"1849ko uztailaren 16an, dagoeneko bilduta, gotzain jaunaren eta errektore jaunaren onespenarekin, gogo-jardun santuak hasi genituen Seminarioan, gu bakarrik, zorroztasun eta sutasun osoz... Gogo-jardun haietatik denok oso sutsu irten ginen, iraunkor izateko erabakiz eta adorez; eta, eskerrak Jainkoari eta Maria Santuari, denek oso ondo iraun dute."},{"a":"Uztailaren 16ko arratsaldeko hiruretan, seminarista baten gelan, gogo-jardunei hasiera ematearekin batera jaio zen Kongregazio Klaretarra."}]},{"left":[{"p":"**16. panela**","i":["Sortzaileak:"],"names":["***Antonio Maria Claret deuna***","*Jaume Clotet agurgarria*","*Esteve Sala*","*Josep Xifré*","*Domènec Fàbregas*","*Manuel Vilaró*"]},{"o":[["80","**Erlojua**, eskailerakoa; sorrera gertatu zen seminarioko eremuan orduak markatzen zituen. Orratzek arratsaldeko hirurak markatzen dituzte, sorrera hasi zen ordua."]]},{"p":"**17. panela**","i":["Mariaren Bihotzaren Seme Misiolariaren definizioa, sortzaile santuak idatzia."]}],"right":[{"ab":"491","t":"Horrela hasi ginen, eta horrela jarraitzen genuen, bizitza guztiz komuna zorrotz gordez. Denok ari ginen lanean ministerio sakratuan."},{"ab":"494","t":"Neure buruari esaten diot: Mariaren Bihotz Garbiaren Seme bat karitatez sutan dagoen gizona da, igarotzen den lekuan su ematen duena; eraginkortasunez nahi duena eta bitarteko guztiez ahalegintzen dena mundu guztia jainkozko maitasunaren suz pizten. Ezerk ez du atzera eragiten; gabezietan gozatzen du; lanei ekiten die; sakrifizioak besarkatzen ditu; kalumniekin atsegin hartzen du, eta oinazeetan pozten da. Ez du beste ezer pentsatzen, Jesukristo nola jarraitu eta imitatu baizik: otoitz eginez, lan eginez, sufrituz, eta beti eta bakarrik Jainkoaren aintza handiagoa eta arimen salbazioa bilatuz.","caps":true}]}]},{"rom":"V","title":"Jaiotetxea","blocks":[{"left":[{"v":"N","r":[["81","Mesedeetako komentu zaharraren maketa. Vic-eko gotzainak komunitate misiolari berriari utzi zion, eta 1849ko urrian Klaretar Misiolarien Kongregazioaren jaiotetxe bihurtu zen. Hasieratik gogo-jardunetarako etxea izan zen sekularrentzat eta apaizentzat."]]},{"p":"18. panela","s":"atzetik argiztatutako irudiak erdian","i":["Maketaren inguruan, Vic-eko jaiotetxearen hainbat une historikotako argazkiak:","Sorrera-garaian.","1928-1930 urteetako berritze-lanak, Jaume Girón aita martiriaren zuzendaritzapean.","Eliza bere jatorrizko komentu-estilo gotikora itzultzeko zaharberritze-proiektua.","1936ko uztaileko suntsiketa.","Gaur egun."]}],"right":[{"a":"Vic-eko Mesedeetako komentuari buruzko datu batzuk:"},{"chron":[["1235","Azaroaren 19an, Jaime I.ak Vic-eko etxe mertzedarioa sortzen du."],["1254","Sorrera gauzatzen da gaur egungo Sant Pere kalean, gaur Vic-eko ospitalea dagoen tokian."],["1264","Mertzedarioak gaur Santo Domingo eliza dagoen tokira aldatzen dira."],["1367","Etxe bat erosten dute, gerora Mesedeetako komentua egongo den tokian."],["1383","Urte horren inguruan, Mesedeetako eliza eraikitzen hasiak dira, komentu-estilo gotikoan."],["1580","Badirudi klaustroa eraikitzen dela."],["1620","Elizan jatorrizko estiloa itxuragabetzen duten ganga barrokoak eraikitzen dira."],["1733","Elizaren ate berria eraikitzen da. Bertan irakurtzen zen data 1734 zen."],["1835","Fraideak herrialdetik kanporatzen dituzte."],["1849","Urria: Klaretar Misiolariak, urte bereko uztailaren 16an seminario zaharrean sortuak, mertzedarioen komentura aldatzen dira."]]}]},{"left":[{"o":[["82","**Aldarea**, Mesedeetako gogo-jardun etxeko kaperakoa; hasieratik, misiolari klaretarrek gogo-jardunen ministerio apostolikoa bertan betetzen zuten. Tradizio horrek gaur egungo «Aita Claret Espiritualtasun Etxean» jarraitzen du, Sant Domènec Ramblan, Lluís Pujol CMF aitaren lana; Lluís Pujol Institución Claretianako Misiolarien sortzailea da."]]},{"v":"O","r":[["83","Mesedeetako Ama Birjinaren irudia, santuak bedeinkatua. Alellako aita eskolapioen nobiziatutik dator."],["84","Jaume Clotet agurgarriaren bustoa; Klaretar Misiolarien Kongregazioaren sortzaileetako bat izan zen, eta santuaren lehen biografoa. Josep Vilarrúbias CMFren lana, 1990."],["85","**Hilarria**, Aita Claretena, Mesedeetako eliza zaharrean zegoena. Armarria, berrezarria, Jordi Pallàsen lana da."]]}],"right":[]},{"left":[{"box":[null,"**Gela** hau, seminario zaharreko hirugarren solairukoa, Aita Claretek okupatu zuen sorrerako lehen hilabeteetan. Leihoak Sant Hipòlit kalera ematen zuen, gaur Sant Miquel dels Sants kalea."]},{"sub":"***Gela beraren jatorrizko elementuak hauek dira:***"},{"o":[["86","Atea,"],["87","leihoa,"],["88","Habeak eta zorua. Leiho ondoko 87 zentimetroko baldosak Esteve Sala aitak okupatzen zuen gelakoak dira."],["89","Aita Claretek urte batzuk geroago erabili zuen eskuoihala da, konketa-euskarrikoa. *Altzariak faksimileak dira, Clotet aitak sorreraren kontakizunean egindako deskribapenaren arabera.*"]]}],"right":[{"a":"Gela honetan Aita Claretek sufrimendu eta larritasun handia bizi izan zuen, Jainkoaren borondatea bereizten ari zela: artzapezpiku-izendapena onartu ala uko egin, aurrean zuen apostolutza-eremu zabal-zabala kontuan hartuta. Izendapena abuztuan iritsi zitzaion, eta urriaren 4ra arte ez zuen onartu. Hemendik idatzi zizkien gutun mingarriak Gotzainari, Nuntzioari, Justizia Ministerioari..."},{"a":"Antonio Maria Claret deunak, KLARETAR MISIOLARIAK eta MISIOLARI KLARETAR EMAKUMEAK sortzeaz gain, beste erakunde batzuk ere sortu zituen: San Migel Akademia, gaur egun LAIKO KLARETARREN MUGIMENDUAN islatzen dena, eta beren etxeetan bizi ziren Erlijiosak, gaur FILIACIÓN CORDIMARIANA Institutu Sekularra."}]}]},{"rom":"VI","title":"Gotzain misiolaria","blocks":[{"left":[{"v":"P","r":[["90","**Aita santuaren bula**, Pio IX.arena; Aita Claret Santiago de Cubako artzapezpiku izendatzen du."]]},{"p":"**19. panela**","i":["Aita Clareten lehen erreakzioa izendapenaren aurrean."]},{"v":"Q","r":[["91","Claret artzapezpikuaren amitua."],["92","Gainjantzia."],["93","Santuaren bizitzako garai hartako bi liburu: ***«Apuntes del Arzobispo Claret»*** (Claret artzapezpikuaren oharrak), berak idatziak elizbarrutiaren gobernu pertsonalerako eta gerora argitaratuak; ***«Las delicias del Campo»*** (Landako atseginak), nekazariak sustatzeko."],["94","Eukaristia ospatzeko erabiltzen zituen korporalak."],["95","Cobreko Karitateko Ama Birjinaren zinta, Santiago de Cubako elizbarrutiko zaindariarena. Haren luzera Cobreko Ama Birjinaren irudiaren altueraren berdina da."],["96","Erabilera pertsonaleko tresnak: bizar-labana, zorroztarria, labana tolesgarriak, guraizeak."]]},{"v":"R","r":[["97","Claret artzapezpikuaren mitra."],["98","Bular-gurutzea eta gotzain-eraztuna."]]}],"right":[{"ab":"491","t":"Eta horra non abuztuaren 11n, azken ekitaldia amaituta pulpitutik jaistean, gotzain jaun txit argiak Jauregira joateko agintzen didan, eta han iristean errege-izendapena ematen didan, abuztuaren 4ko data duena, Kubako artzapezpikutzarako."},{"ab":"495","t":"Izendapenak ikaratuta, ez nuen onartu nahi izan, hain duintasun handirako ez-duin eta ezgai jotzen nuelako neure burua, ez bainuen ez jakinduria ez beharrezko bertuterik... eta jakinduria eta bertutea izanda ere, ezin nituen utzi jaio berriak ziren Librería Religiosa eta Kongregazioa."},{"ab":"538","t":"Lehenengo bi urteetan, lurrikarak eta kolera gorabehera, artzapezpikutzako parrokia guztiak bisitatu genituen; guztietan misioa eman zen, nik neuk edo lankideek, eta hain hedadura handia duten landa-parrokietan misio asko eman ziren."},{"ab":"547","t":"Idatzi nuen lehen gutun pastorala 1852ko irailaren 20an sinatu nuen. Kleroari zuzendu nion."},{"ab":"549","t":"Bigarren gutun pastorala herriari zuzendu nion, 1853ko martxoaren 25ean, misioetan eta bisita pastoralean irakatsi geniena gogoraraziz."},{"ab":"555","t":"Seminario Kontziliarra berritu nuen. Hogeita hamar urte baino gehiago igaro ziren barneko seminarista bakar bat ere ordenatu gabe."},{"ab":"563","t":"Pobreentzat finka bat erosi nuen Puerto Príncipe hirian."},{"ab":"564","t":"Lan horren asmoa haur pobreak biltzea zen, mutilak eta neskak, haietako asko kaleetan galtzen baitira eskean. Finkan janaria eta jantziak eman behar zitzaizkien, eta Erlijioa, irakurtzen, idazten eta abar irakatsi, eta gero arte edo ofizio bat, nahi zutena."},{"ab":"566","t":"Etxearen aurrealdean, mutilen aldean, fisika-kabinete bat eta nekazaritzako tresnak zeuden, baita kimika-laborategi bat eta liburutegi bat ere. Liburutegian denek izan behar zuten sarrera, bi ordu goizean eta beste bi arratsaldean; nekazaritza-eskola, astean hiru egunetan, joan nahi zuten guztientzat zen; gainerakoa barnekoentzat."},{"ab":"568","t":"Etxe horren eraikuntzak aurrera egiten zuen bitartean, liburuxka bat idatzi nuen, *Delicias del campo* izenekoa..., hasitako Ongintza-etxea hazi moduan jasotzen duena. *Delicias del campo* liburuxka oso baliagarria izan da uhartean; hala, finketako jabeek nagusiei ematen zieten, eta haren arabera jokatzeko esaten zieten."},{"ab":"569","t":"Elizbarrutian Aurrezki Kutxa ere ezarri nuen —haren araudia eta onespena liburu berean daude—, pobreen onerako eta neurritasunerako, ikusi bainuen pobreak, ongi gidatzen badira eta bizitza duintasunez irabazteko bide bat ematen bazaie, gizon bertutetsuak direla."},{"ab":"561","t":"Neskentzako irakaskuntzako mojen komentu bat ezarri nuen, eta etxe bat erosi nien..."},{"a":"Maria Immakulatuaren Irakaskuntzako erlijiosak dira; Antonia París amarekin batera sortu zituen Kuban, eta gerora KLARETARRAK izena hartu zuten."},{"ab":"570","t":"Kartzeletako presoak ere bisitatzen nituen, katekesia ematen nien eta oso maiz predikatzen nien... Kartzelan presoek irakurtzen, idazten, Erlijioa eta ofizioren bat ikas zezaten arduratzen ginen. Horretarako, kartzelan hainbat lantegi genituen..."}]},{"left":[{"v":"S","r":[["99","Artzapezpikuaren odolez zikindutako burkoa, 1856ko otsailaren 1ean Kubako Holguín hirian jasan zuen atentatuaren ondorengoa."]]}],"right":[{"ab":"575","t":"Gizon bat hurbildu zitzaidan, eraztuna musukatu nahiko balit bezala, baina bat-batean bizar-labanaz armatutako besoa luzatu eta bere indar guztiaz eman zuen kolpea."},{"ab":"577","t":"Ezin dut azaldu zer atsegin, poz eta alaitasun sentitzen zuen nire arimak, hainbeste desiratzen nuena lortu nuela ikustean: Jesusen eta Mariaren maitasunagatik odola isurtzea, eta nire zainetako odolarekin egia ebanjelikoak zigilatu ahal izatea."}]},{"left":[{"p":"**20. panela**","i":["JOAKINA VEDRUNA deuna, Karitateko Karmeldarren sortzailea. Vic.","MARIA ANTONIA PARÍS agurgarria; Claret artzapezpikuarekin batera Maria Immakulatuaren Erlijiosen Kongregazioa (Misiolari Klaretarrak) sortu zuen.","Sakramentu Santuko MIKAELA deuna, Erlijioso Adoratzaileen sortzailea. Madril.","FRANCISCO COLL deuna, OP, Anunziatako Dominikarren sortzailea.","PEDRO ALMATÓ deuna, dominikarra; Aita Claretek bere bokazioa bereizten lagundu zion."]},{"p":"**21. panela**","i":["Kubako Artzapezpikuaren koadroa, Aita Claretek berak erabilitako arropa-zatiekin egina. Kubako Misiolari Klaretar batzuek egin zuten, santua bizi zela."]}],"right":[{"h":"**Sortzaileen aholkulari espirituala:**"},{"a":"Antonio Maria Claret deunak parte aktiboa hartu zuen Elizako gizon-emakumeen, santuen eta hainbat kongregazio erlijiosotako sortzaileen animazio espiritual eta apostolikoan."}]},{"left":[{"p":"**22. panela**","i":["San Migel Akademiaren diploma, Claret artzapezpikuak diseinatua eta sinatua."]}],"right":[{"ab":"581","t":"Hirugarrena San Migel Akademiaren asmoa izan zen; ohean nengoen lehen egunetan izan nuen asmo hori, eta jaiki bezain laster irudia marrazten eta Araudia idazten hasi nintzen."},{"a":"San Migel Akademia Aita Clareten intuizio pastoral eta eklesial handietako bat izan zen: laikoen presentzia aktiboa Elizan, apostolutzara deituak beren lanbide laikoetatik: intelektualak, artistak, idazleak, musikariak..."}]}]},{"rom":"VII","title":"Erreginaren aitortzailea","blocks":[{"left":[{"p":null,"i":["(22. panel berean) Claret artzapezpikuak, Madrildik jada, Kubako Elizari agur egiten dion gutuna."]},{"v":"T","r":[["100","Vic-eko Bertrana i Forcada ahizpen otoiztegi partikularreko kasulla; Aita Claretek meza ospatu zuen harekin 1865eko abuztuaren 26an."]]}],"right":[{"ab":"587","t":"Misioan egun batzuk neramatzan, Madrilera joateko Errege Agindu bat jaso nuenean; izan ere, Toledoko artzapezpikua hil zen, Bere Maiestatearen aitortzailea zena, eta Erreginak ni aukeratu ninduen."},{"ab":"588","t":"Martxoaren 18an jaso nuen Errege Agindua, eta hilaren 22an Santiagotik Habanarantz irten nintzen, eta han Cadizera zihoan posta-lurrunontzia hartu nuen."},{"ab":"621","t":"Batzuetan esan izan dut Jainkoak toki honetara bidali nauela nire purgatorioa izan dadin, iraganeko bizitzako bekatuak garbitu eta ordaintzeko... Beti nago hemendik irteteko irrikaz. Kaiolan sartutako txori bat bezalakoa naiz, ihes egiteko modurik ba ote dagoen ikusteko barrak ukituz dabilena; horrela nabil ni ere, hemendik irteteko modua asmatu nahian."}]},{"left":[{"v":"U","r":[["101","A C inizialak dituzten mahai-tresnak (Antonio Claret), Isabel II.a erreginak Artzapezpikuari emanak."],["102","Sortzez Garbiaren domina: zorionak Mariari bere Sortzez Garbitasunagatik."],["103","Benito deunaren domina."],["104","Jainkoaren Joan deunaren domina."],["105","Pedro eta Paulo apostolu deunen martirioaren XVIII. mendeurreneko domina oroigarria."],["106","Madrilgo Montserrateko Ama Birjinaren Kaperako domina."],["107","Bakearen gurutzea (Porta-Paz)."],["108 al 111","Santuak bedeinkatu, eraman edo oparitutako gurutzeak."],["112","Artzapezpikuaren arropen zenbaki-etiketa."],["113","Jatorrizko argazkia, bere bizitzako azken urteetakoa."],["114","Bisita-txartela."],["115 al 117","Bere bizitzaren azkenaldiko argazkiak, Madrilen eta Parisen ateratakoak."],["118","Erreginaren aitortzaile zen artzapezpikuaren irudikapen sarkastikoak, pospolo-kutxetan (kopiak, Bartzelonako Marès Museoaren adeitasunez)."],["119","Aita Clareti errege-aitortzaile gisa egindako karikatura-aipamena, 1868ko iraultzari buruzko «auca» batean (herri-orri irudiduna)."]]}],"right":[{"ab":"638","t":"... lehia santua eta ia inbidia sentitzen dut herriz herri Ebanjelio santua predikatzeko zorte ona duten misiolariekiko."},{"a":"Errege-familiarekin egin behar izan zituen bidaiak misio erraldoi bihurtu zituen Aita Claretek. Espainiako eskualde guztietako hiri eta herriak izan ziren Clareten ekintza apostoliko etengabearen lekuko, era guztietako pertsonei zuzendua."},{"ab":"639","t":"Nire nahigabeen artean, baditut kontsolamendu batzuk. Maiestate eta Gorentasunekin bidaian irteten garenean, herriari goizean predikatzeko aukera izaten dut, Maiestateak etxetik irten aurretik; gero komentuetan predikatzen ibiltzen naiz, mojei, ahizpei, apaizei, ikasleei, Konferentzietako jaun-andreei eta abar, eta abar; hala, egun osoa predikatzen ematen dut."},{"ab":"640","t":"Madrilen nagoenetik gehien landu dudan gauzetako bat liburuak eta orri solteak idaztea izan da."},{"ab":"798","t":"Aurten asko kalumniatu eta jazarri naute era guztietako pertsonek: egunkarien, liburuxken, liburu faltsifikatuen, argazkien eta beste gauza askoren bidez..."},{"a":"Madrilgo «LA ESPERANZA» egunkarian, 1865eko urtarrilaren 24an, hau irakur daiteke: *«Hainbat aldiz esan diote lagunek Claret jaunari bere burua defendatzeko, baina berak beti erantzun izan du defentsarik onena kasurik ez egitea dela, eta, aldi berean, haien alde Jainkoari otoitz egitea, Jesusek gurutzetik egin zuen bezala...»* (Aut. 867an aipatua)"}]}]},{"rom":"VIII","title":"Aitaren etxera igarotzea","blocks":[{"left":[{"p":"**23. panela**","i":["Langedokako Fontfroide monasterio zistertarraren ikuspegi orokorra; Aita Claret han hil zen erbestean, 1870eko urriaren 24an."]},{"v":"V","r":[["120","Aita Clareten agonian lagun izan zen gurutzefikua. Fontfroideko komunitate zistertarrak Kongregazio Klaretarrari eman zion."]]}],"right":[{"a":"Bere bizitzako azken hilabeteetan, Claret artzapezpikuak parte aktiboa hartu zuen Vatikanoko I. Kontzilioan."},{"a":"Erbesteratua eta jazarria, Frantziako hegoaldeko Fontfroide monasterio zistertarrera erretiratzen da; han larriagotzen da bere osasuna, eta santutasunez hiltzen da, misiolari klaretar talde batek eta monasterioko fraideek lagunduta."},{"a":"Clotet aita agurgarriak, gertaera haien lekuko eta santuaren lehen biografoak, honela idatzi zuen: «Azken gaixotasunean erakutsi zuen bakea, poza eta sutasuna miresgarriak izan ziren: ez zen nekatzen gurutzefikua musukatzen eta otoitz labur sutsuak egiten."},{"a":"Bake aldaezinarekin eta Gurutzefikua eskuetan zuela, urriaren 24ko goizeko 8:45ean, lasai eman zion bere arima Jaunari»."},{"a":"Claret artzapezpikuak Fontfroide monasterioan zuen hilarriaren gainean Gregorio VII.a deunaren azken hitzak irakurtzen ziren:"},{"epi":["**ZUZENTASUNA MAITATU ETA GAIZTAKERIA GORROTATU DUT;**","**HORREGATIK HILTZEN NAIZ ERBESTEAN.**"]}]},{"left":[{"p":"**24. panela**","i":[]},{"o":[["121","Claret artzapezpikuaren eta Mariaren Bihotzaren Seme Misiolarien Kongregazioaren armarriak dituzten brodatuak; hilkutxa apaintzen zuten Aita Clareten gorpua Fontfroidetik Vic-era eraman zutenean, 1897an."]]}],"right":[{"a":"1897ko ekainaren 13an, santuaren gorpuzki agurgarriak Fontfroidetik Vic-era eraman zituzten. Gorpuzkiak igaro ziren herrietako jendearen gogo-berotasuna izugarria izan zen. Batez ere Vic-en."}]},{"left":[{"v":"X","r":[["122","Egurrezko kutxa; Vic-eko Miquel Bantulà jaunak bere etxean ezkutatu zituen bertan Aita Clareten gorpuzki agurgarriak, Espainiako gerra zibilean (1936-1939)."],["123","Gorpuzkiak ezkutatzeko gordailuaren akta, 1936ko uztailaren 20koa. Biharamunean, 21ean, Mesedeetako eliza erre zuten."],["124","Pere Bertrans aitaren gutuna; santuaren gorpuaren zaintzailea zen, eta Klaretarren Aita Nagusiari idatzi zion heriotzatik ihes egin eta berehala (tiroka eraso zioten, santuaren gorpua non ezkutatuta zegoen esan nahi ez zuelako). 1936ko abuztuaren 15ean idatzia, belauniko, arto-soro baten erdian."],["125","Bertrans aitaren UGTko afiliazio-txartela."],["126","Aita Clareten bizitza, Tonan aurkitua, 1936ko matxinadan labankadaz zulatua."]]}],"right":[{"a":"Aita Clareten zazpi hilobiak:"},{"chron":[["1","FONTFROIDE (Langedoka, Frantzia). 1870etik 1897ra."],["2","VIC: Mesedeetako elizako Sakramentu Santuaren kapera. 1897tik 1932ra."],["3","SANTA EUGÈNIA DE BERGA. 1932tik 1934ra."],["4","VIC: Mesedeetako elizako aldare nagusia. 1934tik 1936ra."],["5","VIC / BANTULÀ ETXEA, Sant Miquel dels Sants kalea. 1936tik 1939ra."],["6","VIC: behin-behineko kapera, gaur Museo Klaretarra dagoen komentuko beheko solairuan. 1939tik 1970era."],["7","VIC: gaur egungo Hilobi-tenplua, 1970etik aurrera, santuaren heriotzaren lehen mendeurrenean."]]}]}]}],"en":[{"rom":"","title":"Entrance panel","blocks":[{"left":[{"h":"Entrance panel"},{"t":"An allegory of Father Claret, a man of this land who, anointed by the Spirit, impelled by the love of Christ and forged in the forge of the Heart of Mary, gave himself to the mission of evangelising the people."},{"q":"“TO REMEMBER THE PAST IS TO COMMIT ONESELF TO THE FUTURE” (*John Paul II*, Hiroshima, 1981)."},{"t":"The panel was made with fragments of agricultural and industrial tools of the region and the period. (Artist: *Fr Genís Baltrons*, 1990.)"},{"sym":[["Saint Anthony Mary","*Monogram of Mary*"],["Claret","*The sun*"],["Clarà","*The moon*"],["Anointed by the Spirit","*The dove*"],["Son of the Heart of Mary","*Symbol of the heart*"],["Love for Christ","*Grapes and ears of wheat (Eucharist)*"],["Incarnate of the Virgin Mary","*Star over the Heart of Mary*"],["Preached by the evangeliser","*Fringes blown by the wind*"],["To all the people","*Working tools*"],["Farming roots on his mother’s side","*Farm tools*"],["and industrial on his father’s side","*Industrial tools*"]]}],"right":[{"a":"The texts from the *Autobiography of Saint Anthony Mary Claret* are in italics and identified by their usual numbering."},{"a":"Some additional notes are also included."},{"ab":"1","t":"Although Father Joseph Xifré, Superior of the Missionary Sons of the Heart of Mary, has frequently spoken and written to request that I write a biography of my insignificant self, I have heretofore always excused myself. I would not have agreed to do so even now had I not been ordered to. Thus I am doing this only out of obedience, and out of obedience I am going to reveal several things that I would rather have left unknown. At any rate, may it all be for the greater glory of God and my sweet mother Mary and for the embarrassment of this poor sinner."}]}]},{"rom":"I","title":"The young Anthony Claret","blocks":[{"left":[{"p":"Panel 1","s":"Backlit image in the central display case","i":["The house where Saint Anthony Mary Claret was born, at 20 Carrer del Cós, Sallent, on 23 December 1807."]},{"p":"**Panel 2**","i":["Loom of the period"]},{"p":"**Panel 3**","i":["The town of Sallent"]},{"p":"**Panel 4**","i":["Family tree of Anton Claret i Clarà"]}],"right":[{"ab":"3","t":"I was born in the village of Sallent, deanery of Manresa, diocese of Vic, province of Barcelona. My parents, whose names were John Claret and Josephine Clara, were married, upright, and God-fearing people, very devoted to the Blessed Sacrament and Mary Most Holy."},{"ab":"31","t":"Since my father manufactured thread and cloth, he set me to work in his factory."}]},{"left":[{"v":"A","r":[["1","Medal for the centenary of Father Claret’s birth"],["2","Towel woven in the house of Anton Claret in Sallent"],["3","Autograph fragment of a letter from Fr Claret to his friend Canon Dr Josep Caixal. He reminds him that, while studying at the Llotja in Barcelona, he won THREE PRIZES IN DRAWING."],["4","The name of Anton Claret as a textile worker in the factory of Francesc Prat in Barcelona, popularly known as “dels Vigatans” (the Vic people’s factory): list signed by the manufacturer himself, 1828."],["5","Crucifix that the young Claret kept on his loom in Francesc Prat’s factory."],["6","Lottery numbers from Barcelona. At this time the young Claret would be swindled by a false friend in a lottery scheme."]]},{"n":"*(7-8)*"}],"right":[{"ab":"56","t":"Because I wanted to improve my knowledge of manufacturing techniques, I asked my father to send me to Barcelona. He agreed and took me there. But, like St. Paul, I had to earn what I needed for food, clothing, books, teachers, etc., with my own two hands. My first move was to submit a petition to the Board of Trade for admission to classes in design. My request was granted and I used it to some advantage. Who would have guessed that God would one day use in the interests of religion the studies in design that I undertook for business reasons? And, in fact, these skills have been most useful to me in designing prints for catechisms..."},{"ab":"58","t":"Of all the things I have studied or worked at during my life, I have understood none better than manufacturing."}]},{"left":[{"p":"Panel 5","s":"Backlit image in the central display case","i":["The Llotja in Barcelona, where the young Claret studied the textile arts, languages and drawing."]},{"p":"Panel 6","s":"Backlit image in the central display case","i":["The old diocesan Seminary of Vic: windows onto the inner courtyard.","The Plain of Vic."]}],"right":[{"a":"With his studies in Barcelona well advanced, and at the height of his personal success, certain events in his own life opened his eyes to the vanities of the world and to the possibility of giving himself completely to the service of the Gospel and of his brothers and sisters."},{"ab":"68","t":"In the midst of this whirling of ideas, while I was at Mass one day, I remembered reading as a small boy those words of the Gospel: For what does it profit a man, if he gain the whole world and suffer the loss of his soul? This phrase impressed me deeply and went like an arrow that pierced my heart. I tried to think and reason what to do, but to no avail."},{"ab":"69","t":"I was like Saul on the road to Damascus;"},{"a":"At that critical moment, a meeting with a lay brother and his contact with Father Amigó, both of the Oratory of Saint Philip Neri, were the light that opened new horizons for him."},{"ab":"82","t":"I left Barcelona after living there almost four years. During that time my fervor had cooled and I had been filled with the winds of vanity, praise, and applause..."}]},{"left":[{"p":"Panel 7","s":"Backlit image in the central display case","i":["Rear façade of the Tortadès house and the chapel of Our Lady of the Angels in the garden, on the city wall built by Peter III.","Drawing of the garden chapel, where the young seminarian often withdrew to pray.","Statue of Our Lady of the Angels, restored after 1936 by Frederic Marès. It is now at Can Tortadès, the family’s ancestral home in the Guilleries."]},{"p":"**Panel 8**","i":["**Ex-voto** depicting the temptation allegorically. Work by Llucià Costa, May 1934, on the occasion of the beatification."]},{"o":[["9","**Lantern** from the Tortadès house in Vic, from the time when Claret was a student."]]},{"p":"**Panel 9**","i":["**Bed** from the Tortadès house, where the young seminarian Anton Claret suffered a strong temptation against chastity, from which, with the help of Our Lady, he emerged firmly set on the priesthood."]}],"right":[{"ab":"83","t":"At the beginning of September, 1829, I left Barcelona and because my parents wanted me to go to Sallent, I did so to please them. I stayed with them until September 29, the feast of St. Michael, when we left after hearing Mass. It was a gloomy trip because of the rain that accompanied us almost all the way. We reached Vic that night, completely soaked."},{"ab":"84","t":"On the following day we went to see the bishop, Paul of Jesus Corcuera, who received us kindly. So that I might have more time for study and my particular devotions, I was stationed with the Steward of the Bishop’s Palace, Msgr. Fortian Bres, a very good priest who showed me a great deal of affection. I lived with him throughout my stay in Vic..."},{"ab":"95","t":"I had the following experience while I was in my second year of philosophy at Vic. That winter I had caught a bad cold and was ordered to bed... One day as I lay there... I felt a terrible temptation. I turned to Mary... suddenly I saw the Blessed Virgin Mary, very beautiful and gracious... in her arms I saw a huge garland of the most beautiful roses... The Blessed Virgin spoke to me and said, Anthony, this crown is yours if you overcome... As soon as it had passed, I felt free of the temptation and filled with a joy so deep that I couldn’t grasp what had been going on within me."}]}]},{"rom":"II","title":"Priest and missionary to the people","blocks":[{"left":[{"p":"**Panel 10**","i":["The village of Viladrau: Fr Claret had charge of its parish in 1840.","The cross on the summit of Matagalls, in the Montseny, in its present state; it succeeded the one Father Claret had set up there."]},{"o":[["10","Mortar from *Ca l’Herbolari* (copy made by Jordi Pallàs), from the house of Jaume Bofill in Viladrau, where, according to family tradition, Fr Anton Claret prepared remedies from medicinal herbs."]]},{"p":"**Panel 11**","i":["Portrait of Fr Claret at the beginning of his preaching throughout Catalonia. Engraving by P. Ross, 1894."]}],"right":[{"a":"The seminarian Anthony Claret was ordained priest in Solsona on 13 June 1835. His first appointment was the parish of Sallent. Later he decided to go to Rome to be sent on mission wherever in the world evangelisation was most needed. But the Lord’s ways were otherwise."},{"a":"On his return to Catalonia, the Bishop of Vic sent him to exercise his pastoral ministry in Viladrau, a village on the northern slope of the Montseny."},{"ab":"170","t":"After I had settled in the parish of Viladrau as regent, I did my best to care for the spiritual welfare of the people."},{"a":"During his time in Viladrau, Fr Claret raised a cross on the summit of Matagalls, in the Montseny. The poet and priest Jacint Verdaguer comments:"},{"a":"“The tireless apostle of Catalonia, Fr Claret... was most worthy to mark Catalonia with the sign of the Cross, setting on her brow the standard of redemption.”"},{"ab":"171","t":"Thus I had to become not only the spiritual but also the bodily physician of the people, on the basis of my general knowledge and consultation of the medical books I procured."},{"ab":"172","t":"I started giving missions in the parish of Viladrau on August 15, 1840, while I was conducting a novena in honor of the Assumption of the Blessed Virgin Mary."}]},{"left":[{"v":"B","r":[["11","Cutlery used by Fr Claret at the house “El Noguer” in Viladrau."],["12","Handkerchief used by Father Claret."],["13","Crucifix of the apostolic missionary Claret."],["14","Folded towel used by the saint."],["15","Medal and crosses, among those Father Claret gave out during the mission in Lleida, with an old document attesting their authenticity."],["16","Small pocket cup."],["17","Folded handkerchief."]]},{"n":"*(18-19)*"},{"p":"**Panel 12**","i":["Pages from the Autobiography in which Father Claret mentions some of the towns where he preached in those years."]}],"right":[{"ab":"193","t":"In mid-January of 1841, after eight months as regent in Viladrau, where I had been ministering to the parish, leaving it from time to time to preach in various other towns to which my bishop sent me, I finally left it for good, so as to be permanently free to preach wherever he might send me, without any fixed residence."},{"ab":"460","t":"During that whole seven years, I was on the go from one town to another. I traveled alone and on foot...
