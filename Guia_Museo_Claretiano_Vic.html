<style>
:root{
  --plaster:#EDEFEC; --paper:#FFFFFF; --ink:#1E2328; --ink2:#4A5158; --rust:#9A4A20; --bronze:#B7843A; --marian:#23466E;
  --line:#D5D8D3; --soft:#E2E5E0; --numbg:#1E2328; --numfg:#FFFFFF; --sheet:#FFFFFF; --testi:#F5F1E8;
  --serif:"Spectral",Georgia,"Times New Roman",serif; --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark; --plaster:#171A1D; --paper:#20252A; --ink:#ECEAE4; --ink2:#AEB4B9; --rust:#D98A5C; --bronze:#D3A25C; --marian:#8FB0D8;
    --line:#343A40; --soft:#2A3036; --numbg:#ECEAE4; --numfg:#171A1D; --sheet:#20252A; --testi:#2A2924;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --plaster:#171A1D; --paper:#20252A; --ink:#ECEAE4; --ink2:#AEB4B9; --rust:#D98A5C; --bronze:#D3A25C; --marian:#8FB0D8;
  --line:#343A40; --soft:#2A3036; --numbg:#ECEAE4; --numfg:#171A1D; --sheet:#20252A; --testi:#2A2924;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);font-size:var(--fs);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--plaster);color:var(--ink);font-family:var(--serif);line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
a{color:var(--marian)}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px;border-radius:4px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);flex:1;min-width:0}
.brand .mk{width:32px;height:32px;background:var(--numbg);color:var(--numfg);display:grid;place-items:center;font:700 .82rem var(--serif);flex:none}
.brand span{font:600 .95rem var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.3rem .7rem;font:600 .8rem var(--sans);cursor:pointer}

main{max-width:760px;margin:0 auto;padding:1rem 1.1rem 7rem}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .55rem;text-decoration:none;color:var(--ink2);font:500 .72rem var(--sans)}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs a[aria-current="page"]{color:var(--rust)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.2}

h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
.sans{font-family:var(--sans)}
.muted{color:var(--ink2)}

/* home */
.hero{display:grid;grid-template-columns:1fr;gap:1.2rem;margin:.4rem 0 1.6rem}
.hero figure{margin:0;position:relative;background:var(--ink);overflow:hidden}
.hero img{display:block;width:100%;height:46vh;max-height:430px;object-fit:cover;object-position:center 40%}
.hero figcaption{position:absolute;left:0;bottom:0;padding:.4rem .7rem;font:.72rem var(--sans);color:#fff;background:rgba(0,0,0,.45)}
.hero h1{font-size:2.3rem;font-weight:700;letter-spacing:-.01em}
.hero h1 small{display:block;font:500 1rem var(--sans);color:var(--rust);letter-spacing:.02em;margin-top:.35rem}
.hero p{margin:.7rem 0 0;max-width:36em}
@media(min-width:700px){.hero{grid-template-columns:5fr 6fr;align-items:end}.hero img{height:520px;max-height:none}}
.cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.1rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;cursor:pointer;text-decoration:none;font:600 .95rem var(--sans);padding:.75rem 1.1rem;border-radius:6px}
.btn.pri{background:var(--rust);color:#fff}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.resume{margin-top:1.2rem;padding:.8rem 1rem;border-left:3px solid var(--bronze);background:var(--paper);font:.92rem var(--sans)}
.resume a{font-weight:600}

/* stages list */
.path{list-style:none;margin:1rem 0 0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:23px;top:10px;bottom:10px;width:2px;background:var(--line)}
.path li{position:relative}
.path a{display:grid;grid-template-columns:48px 1fr auto;gap:.9rem;align-items:center;text-decoration:none;color:var(--ink);padding:.75rem 0}
.path .r{width:48px;height:48px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font:700 1rem var(--serif);color:var(--rust);position:relative;z-index:1}
.path .done .r{background:var(--rust);border-color:var(--rust);color:#fff}
.path h3{font-size:1.15rem}
.path p{margin:.1rem 0 0;font:.8rem var(--sans);color:var(--ink2)}
.path .chk{font:600 .75rem var(--sans);color:var(--rust)}

/* stage */
.stagehead{margin:.6rem 0 1.2rem;padding-bottom:1rem;border-bottom:2px solid var(--ink)}
.stagehead .rom{font:700 1rem var(--serif);color:var(--rust)}
.stagehead h1{font-size:1.9rem;margin-top:.15rem}
.stagehead p{margin:.5rem 0 0;font:.85rem var(--sans);color:var(--ink2)}
.block{margin:0 0 2rem}
.plafon{margin:1.4rem 0 .6rem}
.plafon h3{display:flex;align-items:baseline;gap:.6rem;font:600 1.05rem var(--sans)}
.pnum{display:inline-grid;place-items:center;min-width:2rem;height:2rem;padding:0 .35rem;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:700 .95rem var(--sans)}
.plafon .sub{font:italic .8rem var(--sans);color:var(--ink2);font-weight:400}
.plafon ul{margin:.5rem 0 0;padding-left:1.2rem}
.plafon li{margin:.25rem 0}
.names{list-style:none;padding:0!important;margin:.5rem 0 0 .2rem}
.names li{font-style:italic}
.vit{margin:1.5rem 0 .4rem;display:flex;align-items:center;gap:.7rem}
.vit .vl{width:2.4rem;height:2.4rem;display:grid;place-items:center;background:var(--rust);color:#fff;font:700 1.25rem var(--serif)}
.vit h3{font:600 1rem var(--sans)}
.objs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.objs li{border-bottom:1px solid var(--line)}
.obj{display:grid;grid-template-columns:auto 1fr;gap:.85rem;width:100%;text-align:left;background:none;border:0;padding:.7rem 0;cursor:pointer;font-family:var(--serif);line-height:1.5}
.num{display:inline-grid;place-items:center;min-width:2.2rem;height:2.2rem;padding:0 .35rem;background:var(--numbg);color:var(--numfg);font:700 .95rem var(--sans)}
.num.big{font-size:1.05rem;min-width:2.5rem;height:2.5rem}
.num.wide{font-size:.72rem}
.obj .seen{color:var(--rust);font:600 .7rem var(--sans);margin-left:.3rem}
.gapnote{font:italic .82rem var(--sans);color:var(--ink2);padding:.5rem 0}
.prose{margin:.6rem 0}
.quote{margin:1rem 0;text-align:center;color:var(--rust);font-style:italic;font-size:1.1rem}
.sym{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:.6rem 0;border-top:1px solid var(--line)}
.sym div{padding:.45rem .2rem;border-bottom:1px solid var(--line);font-size:.92rem}
.sym div:nth-child(odd){font:600 .8rem var(--sans);color:var(--ink2)}
.sym div:nth-child(even){font-style:italic}
.box{background:var(--paper);border-top:2px solid var(--bronze);padding:.9rem 1rem;margin:1rem 0}
.box h4{margin:0 0 .3rem;font:600 .85rem var(--sans);color:var(--rust)}
.box p{margin:.4rem 0}
.subhead{font:italic 600 .95rem var(--serif);color:var(--rust);margin:1rem 0 .3rem}

.testi{margin-top:1rem;background:var(--testi);padding:1rem 1.1rem 1rem;border-left:3px solid var(--bronze)}
.testi .lbl{display:flex;justify-content:space-between;align-items:center;font:600 .8rem var(--sans);color:var(--ink2);margin-bottom:.4rem}
.ab{margin:.7rem 0;font-style:italic}
.ab b{font-style:normal;font-family:var(--sans);font-size:.78rem;color:var(--rust);margin-right:.35rem;font-weight:700}
.ab.caps{font-variant:small-caps}
.an{margin:.7rem 0;font-family:var(--sans);font-size:.88rem;line-height:1.55}
.an.i{font-family:var(--serif);font-style:italic;font-size:1rem}
.chron{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;font:.86rem var(--sans);margin:.6rem 0}
.chron b{color:var(--rust)}
.epi{text-align:center;font:600 .85rem var(--sans);letter-spacing:.04em;color:var(--rust);margin:.8rem 0;line-height:1.7}
.listen{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.25rem .65rem;font:600 .75rem var(--sans);cursor:pointer;color:var(--ink)}
.listen[aria-pressed="true"]{background:var(--rust);color:#fff;border-color:var(--rust)}

.stagenav{display:flex;justify-content:space-between;gap:.6rem;margin:2rem 0 0;padding-top:1.2rem;border-top:2px solid var(--ink)}
.stagenav a{flex:1;text-decoration:none;color:var(--ink);font:.8rem var(--sans)}
.stagenav a span{display:block;font:600 1rem var(--serif);margin-top:.15rem}
.stagenav a.n{text-align:right}
.donebar{margin-top:1.4rem;display:flex;justify-content:center}

/* number finder */
.finder h1{font-size:1.7rem}
.mode{display:inline-flex;margin:.9rem 0 .4rem;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.mode button{border:0;background:transparent;padding:.5rem .9rem;font:600 .85rem var(--sans);cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--plaster)}
.display{display:flex;align-items:center;gap:1rem;margin:.8rem 0}
.display .scr{min-width:6.5rem;height:4.2rem;display:grid;place-items:center;font:700 2.4rem var(--sans);padding:0 .8rem}
.display .scr.o{background:var(--numbg);color:var(--numfg)}
.display .scr.p{background:var(--paper);color:var(--ink);border:3px solid var(--ink)}
.display .hint{font:.85rem var(--sans);color:var(--ink2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:330px}
.pad button{height:3.4rem;border:1px solid var(--line);background:var(--paper);font:600 1.35rem var(--sans);cursor:pointer;border-radius:6px}
.pad button:active{background:var(--soft)}
.pad .fn{font-size:.85rem;color:var(--ink2)}
.results{margin:1rem 0 0}
.letters{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.letters button{width:2.6rem;height:2.6rem;border:0;background:var(--rust);color:#fff;font:700 1.1rem var(--serif);cursor:pointer}
.fgrid{display:grid;gap:1.6rem}
@media(min-width:720px){.fgrid{grid-template-columns:330px 1fr}}

/* plan */
.planwrap{overflow:auto;border:1px solid var(--line);background:#fff;margin:.8rem 0;-webkit-overflow-scrolling:touch;max-height:70vh}
.plan{position:relative;width:100%;min-width:320px}
.plan img{display:block;width:100%;height:auto}
:root[data-theme="dark"] .plan img{filter:invert(.92) hue-rotate(180deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .plan img{filter:invert(.92) hue-rotate(180deg)}}
:root[data-theme="dark"] .planwrap{background:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .planwrap{background:#111}}
.hs{position:absolute;transform:translate(-50%,-50%);width:9%;aspect-ratio:1;border-radius:50%;border:0;background:rgba(154,74,32,.22);cursor:pointer;padding:0}
.hs:hover,.hs:focus-visible{background:rgba(154,74,32,.45)}
.hs.cell{width:13%;border-radius:4px;background:rgba(35,70,110,.16)}
.zoom{display:flex;gap:.4rem;align-items:center;font:.85rem var(--sans)}

/* life */
.tl{list-style:none;margin:1rem 0;padding:0}
.tl li{display:grid;grid-template-columns:4.2rem 1fr;gap:.8rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.tl .y{font:700 1.05rem var(--serif);color:var(--rust)}
.tl p{margin:0}
.tl small{font:.75rem var(--sans);color:var(--ink2)}
.farewell{margin:2.2rem 0 1rem;padding:1.6rem 1.2rem;background:var(--ink);color:var(--plaster);text-align:center}
.farewell blockquote{margin:0;font-style:italic;font-size:1.3rem;line-height:1.5}
.farewell cite{display:block;margin-top:.8rem;font:normal .85rem var(--sans);color:var(--bronze)}

h2.sec{font-size:1.35rem;margin:2rem 0 .5rem;padding-bottom:.35rem;border-bottom:1px solid var(--line)}
details{background:var(--paper);padding:.8rem 1rem;margin:.8rem 0;border-left:3px solid var(--line)}
summary{cursor:pointer;font:600 .95rem var(--sans)}
.cred{font:.82rem var(--sans);line-height:1.6}
.cred dt{color:var(--ink2);font-style:italic;margin-top:.4rem}
.cred dd{margin:0}
.rules{padding-left:1.2rem}
.note{font:.78rem var(--sans);color:var(--ink2)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--sheet);border-radius:14px 14px 0 0;padding:1rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto .8rem}
.sheet .sh{display:flex;align-items:center;gap:.9rem}
.sheet .sh .meta{font:.8rem var(--sans);color:var(--ink2)}
.sheet .close{margin-left:auto;border:0;background:var(--soft);width:2.2rem;height:2.2rem;border-radius:50%;cursor:pointer;font:600 1.1rem var(--sans)}
.sheet .desc{font-size:1.12rem;margin:1rem 0}
.sheet .acts{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.sheet .nav2{display:flex;justify-content:space-between;margin-top:1rem;gap:.5rem}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%{background:rgba(183,132,58,.35)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.flash{animation:none;outline:2px solid var(--bronze)}}
.orig{display:inline-block;margin-left:.35rem;font:italic .7rem var(--sans);color:var(--ink2);font-style:normal}
.langb{font-weight:700;letter-spacing:.03em}
.lgmenu{position:absolute;right:.8rem;top:calc(100% + .3rem);background:var(--paper);border:1px solid var(--line);border-radius:.7rem;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:.3rem;z-index:40;min-width:11rem}
.lgmenu[hidden]{display:none}
.lgmenu button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;border:0;background:none;padding:.6rem .7rem;font:500 .95rem var(--sans);color:var(--ink);border-radius:.45rem;cursor:pointer}
.lgmenu button:hover,.lgmenu button:focus-visible{background:var(--soft)}
.lgmenu button[aria-checked="true"]{font-weight:700}
.lgmenu button[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--rust)}
.lgmenu b{width:1.9rem;font:700 .8rem var(--sans);letter-spacing:.03em;color:var(--ink2)}
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-top:.45rem}
.refs .rl{font:600 .72rem var(--sans);color:var(--ink2);margin-right:.15rem}
.rc{display:inline-flex;align-items:center;border:0;background:none;padding:0;cursor:pointer;text-decoration:none;color:inherit}
.rc .num{min-width:1.75rem;height:1.75rem;font-size:.75rem}
.rc .num.wide{font-size:.62rem}
.rc .pnum{min-width:1.75rem;height:1.75rem;font-size:.75rem;border-width:1.5px}
.rc .vlc{width:1.75rem;height:1.75rem;display:grid;place-items:center;background:var(--rust);color:#fff;font:700 .85rem var(--serif)}
.rc.autc{font:600 .72rem var(--sans);color:var(--rust);border:1px solid var(--rust);border-radius:999px;padding:.2rem .55rem;height:1.75rem}
.tl p sup{font-size:.7em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
const DATA={"es":[{"rom":"","title":"Plafón de entrada","blocks":[{"left":[{"h":"Plafón de entrada"},{"t":"Alegoría del Padre Claret, hombre de esta tierra que, ungido por el Espíritu, estimulado por el amor de Cristo y forjado en la fragua del Corazón de María, se entregó a la misión evangelizadora del pueblo."},{"q":"«RECORDAR EL PASADO ES COMPROMETERSE CON EL FUTURO» (*Juan Pablo II*, Hiroshima, 1981)."},{"t":"El plafón ha sido elaborado con fragmentos de instrumental agrícola e industrial del país y de la época. (Autor: *Mn. Genís Baltrons*, año 1990.)"},{"sym":[["San Antonio María","Anagrama de María"],["Claret","El sol"],["Clara","La luna"],["Ungido por el Espíritu","Paloma"],["Hijo del Corazón de María","Símbolo del corazón"],["Amor a Cristo","Racimos y espigas (Eucaristía)"],["Encarnado de María Virgen","Estrella sobre el Corazón de María"],["Predicado por el evangelizador","Flecos llevados por el viento"],["A todo el pueblo","Instrumental de trabajo"],["Origen campesino por parte de madre","Instrumental agrícola"],["e industrial por parte del padre","Instrumental industrial"]]}],"right":[{"a":"Los textos de la *Autobiografía de San Antonio Mª Claret* están en letra cursiva, identificados según la numeración habitual."},{"a":"Se añaden algunas anotaciones complementarias."},{"ab":"1","t":"Habiéndome pedido el señor D. José Xifré, Superior de los Misioneros de los Hijos del Corazón de María, diferentes veces de palabra y por escrito una biografía de mi insignificante persona, siempre me he excusado, y aun ahora no me habría resuelto a no habérmelo mandado. Así únicamente por obediencia lo hago, y por obediencia revelaré cosas que más quisiera que se ignorasen; con todo, sea para la mayor gloria de Dios y de María Santísima, mi dulce Madre, y confusión de este miserable pecador."}]}]},{"rom":"I","title":"El joven Antonio Claret","blocks":[{"left":[{"p":"Plafón 1","s":"Transparencia en vitrina del centro","i":["La casa donde nació san Antonio María Claret, Calle Cos nº. 20, de Sallent, el día 23 de diciembre de 1807."]},{"p":"Plafón 2","i":["Telar de la época"]},{"p":"Plafón 3","i":["La villa de Sallent"]},{"p":"Plafón 4","i":["Árbol genealógico de Antonio Claret y Clarà"]}],"right":[{"ab":"3","t":"Nací en la villa de Sallent, deanato de Manresa, obispado de Vic, provincia de Barcelona. Mis padres se llamaban Juan Claret y Josefa Clará, casados, honrados y temerosos de Dios, y muy devotos del Santísimo Sacramento del Altar y de María Santísima."},{"ab":"31","t":"Como mi padre era fabricante de hilados y tejidos, me puso en la fábrica a trabajar."}]},{"left":[{"v":"A","r":[["1","Medalla del centenario del nacimiento del Padre Claret"],["2","Toalla tejida en la casa de Antonio Claret en Sallent"],["3","Fragmento autógrafo de la carta del P. Claret a su amigo Dr. Josep Caixal, canónigo. Le recuerda que, cuando estudiaba en la Llotja de Barcelona, le premiaron TRES VECES EN DIBUJO."],["4","El nombre de Antonio Claret como obrero textil de la fábrica de Francisco Prat de Barcelona, popularmente llamada «dels vigatans» (la lista, firmada por el propio fabricante, en 1828)."],["5","Crucifijo que el joven Claret tenía en su telar de la fábrica de Francisco Prat."],["6","Números de la lotería en Barcelona. Por aquella época el joven Claret será estafado por un falso amigo en un asunto de lotería."]]},{"n":"(7-8)"}],"right":[{"ab":"56","t":"Deseoso de adelantar en los conocimientos de la fabricación dije a mi padre que me llevase a Barcelona. Condescendiendo mi padre, me llevó allá; yo mismo, como San Pablo, me ganaba con mis manos lo que necesitaba para comida, vestidos, libros, maestros, etc. La primera cosa que hice fue presentar una solicitud a la Junta de la Casa Lonja para ser admitido en las clases de dibujo, lo conseguí y me aproveché algún tanto. Y ¡quién lo había de decir que el dibujo que yo aprendía para la fabricación, Dios lo disponía para que sirviera para la Religión! Y en efecto, mucho me ha servido para dibujar estampas del Catecismo."},{"ab":"58","t":"De cuantas cosas he estudiado, y en cuantas cosas me he aplicado durante la vida, ninguna he entendido tanto como la fabricación."}]},{"left":[{"p":"Plafón 5","s":"Transparencia en vitrina del centro","i":["Lonja de Barcelona, donde el joven Claret estudió arte textil, idiomas y dibujo."]},{"p":"Plafón 6","s":"Transparencia en vitrina del centro","i":["El antiguo Seminario Diocesano de Vic: ventanas sobre el patio interior.","La Plana de Vic."]}],"right":[{"a":"Ya avanzados sus estudios en Barcelona, y en plena euforia de progreso personal, algunos acontecimientos relacionados con su persona le abrieron los ojos a las vanidades del mundo y a la posibilidad de entregarse plenamente al servicio del Evangelio y de los hermanos."},{"ab":"68","t":"En medio de esta barahúnda de cosas, estando oyendo la santa Misa, me acordé de haber leído desde muy niño aquellas palabras del Evangelio: ¿De qué le aprovecha al hombre ganar todo el mundo, si finalmente pierde su alma? Esta sentencia me causó una profunda impresión... fue para mí una saeta que me hirió el corazón; yo pensaba y discurría qué haría, pero no acertaba."},{"ab":"69","t":"Me hallé como Saulo, por el camino de Damasco;"},{"a":"En aquel momento crítico, el encuentro con un hermano lego y el contacto con el Padre Amigó, ambos del Oratorio de San Felipe Neri, fue la luz que le abrió nuevos horizontes."},{"ab":"82","t":"Salí de Barcelona después de haber estado cerca de cuatro años, habiéndome resfriado bastante en el fervor y llenado demasiado del viento de la vanidad, de elogios y aplausos."}]},{"left":[{"p":"Plafón 7","s":"Transparencia en vitrina del centro","i":["Fachada posterior de la Casa Tortadés y capilla de la Virgen de los Ángeles, en el jardín, sobre la muralla de Pedro III.","Dibujo de la capilla del jardín, donde el joven seminarista se retiraba frecuentemente a rezar.","Imagen de la Virgen de los Ángeles, restaurada después de 1936 por Federico Marés. Actualmente se encuentra en Can Tortadés, casa solariega, en las Guillerías."]},{"p":"Plafón 8","i":["**Exvoto** alegórico de la tentación. Obra de Llucià Costa, en mayo de 1934, con motivo de la beatificación."]},{"o":[["9","**Farola** de la casa Tortadés en Vic, en la época del estudiante Claret."]]},{"p":"Plafón 9","i":["**Cama** de la casa Tortadés, donde el joven seminarista Antón Claret sufrió una difícil tentación contra la castidad, de la cual, con la ayuda de la Virgen, salió decididamente encaminado hacia el sacerdocio."]}],"right":[{"ab":"83","t":"A los primeros del mes de septiembre del año 1829 salí de Barcelona hacia Sallent hasta el día de San Miguel, día 29, que salimos después de oída la Santa Misa. Fue un viaje muy triste por razón de la lluvia que nos acompañó casi todo el viaje. Por la noche, enteramente calados, llegamos a Vic."},{"ab":"84","t":"Al día siguiente fuimos a ver al señor Obispo, que era D. Pablo de Jesús Corcuera. Nos recibió muy bien. Y a fin de tener más tiempo para estudiar y poderme dedicar a mis particulares devociones, me colocaron al lado del señor mayordomo de Palacio, llamado D. Fortián Bres, sacerdote muy bueno que me quería muchísimo. Estuve con él durante toda mi permanencia en Vic."},{"ab":"95","t":"Cuando estudiaba en Vic el segundo año de filosofía, me sucedió lo siguiente. En invierno tuve un resfriado o catarro. Un día de aquellos que me hallaba en cama... experimenté una tentación muy terrible. Acudía a María Santísima... Cuando he aquí que se apareció María Santísima, hermosísima y graciosísima...; y entre sus brazos vi una guirnalda muy grande de rosas hermosísimas... La Santísima Virgen me dirigió la palabra y me dijo: Antonio, esta corona será tuya si vences. Tan pronto como esto pasó, me hallé libre de la tentación y con una alegría tan grande que, que no sabía lo que por mí había pasado."}]}]},{"rom":"II","title":"Sacerdote y misionero del pueblo","blocks":[{"left":[{"p":"Plafón 10","i":["El pueblo de Viladrau: Mosén Claret regentó la parroquia del mismo el año 1840","La Cruz en la cumbre del Matagalls, en el Montseny, en su estado actual, sucesora de la que allí plantó el Padre Claret."]},{"o":[["10","Mortero de *Ca l'Herbolari* (Copia realizada por Jordi Pallás) de la casa de Jaume Bofill en Viladrau, en el cual, según una tradición familiar, Mn. Antón Claret hizo preparados de hierbas medicinales."]]},{"p":"Plafón 11","i":["Retrato de Mn. Claret en los comienzos de su predicación por Catalunya. Grabado de P. Ross, año 1894."]}],"right":[{"a":"El seminarista Antonio Claret recibió la ordenación sacerdotal en Solsona, el 13 de junio de 1835. El primer destino fue la parroquia de Sallent. Más adelante decidió ir a Roma para ser enviado a misiones, al lugar del mundo donde más conviniera la evangelización. Pero los caminos del Señor eran otros."},{"a":"Al volver a Catalunya fue enviado por el obispo de Vic a ejercer la cura pastoral en Viladrau, pueblo asentado en la falda norte del Montseny."},{"ab":"170","t":"Establecido en la parroquia de Viladrau de Regente, cuidaba del mejor modo que sabía del bien espiritual de aquellas almas."},{"a":"Durante su estancia en Viladrau Mosén Claret erigió una cruz en la cumbre del Matagalls, en el Montseny. El poeta Mn. Jacinto Verdaguer lo comenta de este modo:"},{"a":"«El infatigable apóstol de Catalunya, Mosén Claret...era bien digno de santiguar a Catalunya poniendo en su frente, con la señal de la Cruz, la bandera de la redención»."},{"ab":"171","t":"Y así me fue preciso hacer yo de médico corporal y espiritual, ya por los conocimientos que tenía, ya por los estudios que hacía en los libros de medicina, que me procuré."},{"ab":"172","t":"En esta parroquia de Viladrau empecé las misiones el día 15 de agosto del año 1840, en que hice la novena de la Asunción de la Virgen María."}]},{"left":[{"v":"B","r":[["11","Cubiertos que Mn. Claret utilizaba en la casa «El Noguer» de Viladrau."],["12","Pañuelo que usó el Padre Claret."],["13","Crucifijo del misionero apostólico Claret."],["14","Toalla plegada, usada por el santo."],["15","Medalla y cruces, de las que el Padre Claret repartió en la Misión de Lérida, junto con un antiguo escrito acreditativo."],["16","Vasito de bolsillo."],["17","Pañuelo plegado."]]},{"n":"(18-19)"},{"p":"Plafón 12","i":["Páginas de la autobiografía en las que el Padre Claret menciona algunos pueblos donde predicó por aquellos años."]}],"right":[{"ab":"193","t":"A mediados de enero de 1841, después de haber sido regente de Viladrau por el espacio de ocho meses, regentando el curato y saliendo de cuando en cuando a predicar, por disposición del Prelado, en diferentes parroquias, salí finalmente para predicar continuamente en donde me enviara el Prelado, sin fijarme en ninguna parte."},{"ab":"460","t":"En estos siete años siempre estuve andando de una población a otra. Andaba solo y a pie. Por la mañana hacía cinco horas de viaje y otras cinco por la tarde."},{"ab":"297","t":"El estilo que me propuse desde el principio fue el del santo Evangelio: sencillez y claridad. Para esto me valía de comparaciones, semejanzas, ejemplos... los más eran tomados de la santa Escritura."},{"ab":"221","t":"Lo que más y más me ha movido siempre es el contemplar a Jesucristo como va de una población a otra, predicando en todas partes, no sólo en las poblaciones grandes, sino también en las aldeas, hasta a una sola mujer, como hizo a la Samaritana."}]},{"left":[{"v":"C","r":[["20","Imagen de san Antonio de Padua, patrón de Mn. Antonio Claret, que el mismo misionero bendijo."]]},{"v":"D","r":[["21","Toalla usada por el Padre Claret. Proviene de Sabadell."],["22","Bonete que utilizó durante la misión predicada en Valls."],["23","Cruz que el santo bendijo para una familia de Albí, cerca de Lérida."],["24","Paraguas usado por el Padre Claret."],["25","Cilicio (instrumento de penitencia)."],["26","Estampa de Pentecostés que el Padre Claret llevó en su breviario."],["(27-28)",""],["29","Estatua del Padre Claret misionero, catequista y escritor. Obra de Doménech Fita, año 1990."]]},{"v":"E","r":[["30","Zapatos y pañuelo del misionero Claret. Los zapatos le fueron cambiados durante la misión que predicó en Lérida en mayo de 1846. Durante la evangelización por aquellas tierras, los leridanos comenzaron a llamarle cariñosamente «Padre Claret», expresión que inmediatamente arraigó y ha quedado definitiva."]]}],"right":[]},{"left":[{"v":"F","r":[["31","Versos de un oyente devoto, en que resume los sermones escuchados a san Antonio María Claret en la basílica de Santa María del Mar de Barcelona, durante todo el mes de mayo de 1844."],["32","Libro registro de ejercitantes de la casa madre de Vic, desde la fundación de la congregación de los claretianos. El primer ejercitante que consta en el libro (año 1850) es «el Ilmo. D. Antón Claret, arzobispo electo de Cuba»."],["33","Dibujo-retrato del Padre Claret publicado en Barcelona durante su predicación por las islas Canarias, y que tuvo una enorme difusión por tierras catalanas."]]}],"right":[{"a":"Jaime Balmes dijo del Padre Claret, predicador en Catalunya: «En el púlpito nunca habla de teatros. Tampoco habla de herejías. Ni de filósofos ni de descreídos. Siempre supone la fe... Poco terror, suavidad en todo. Los ejemplos, en general, eran de la Sagrada Escritura»."},{"ab":"480","t":"Salimos de Madrid para Sevilla, Jerez y Cádiz, donde prediqué, y nos embarcamos para Canarias. A principios de febrero llegamos a Tenerife, donde prediqué el domingo, y el lunes salimos para la Gran Canaria. Di ejercicios espirituales a los sacerdotes en un salón de Palacio, y el señor obispo presidía todos los actos. También di ejercicios a los estudiantes del Seminario e hice Misión en todas las parroquias de la isla de la Gran Canaria."},{"ab":"481","t":"Con mucha frecuencia tenía que predicar en las plazas, porque en los templos no cabía la mucha gente que se reunía en cada población para oír la santa misión."},{"a":"He aquí algunos testimonios que el P. Brossosa recogió de ambientes populares de las islas Canarias: «Como el Padre Claret, ninguno»; «estaba lleno del Espíritu de Dios»; «a él todos le entendíamos... y todo lo que decía»; «mientras le escuchábamos nos iba llenando, llenando...»."}]},{"left":[{"o":[["34","Dos cartas del Padre Claret al señor Felipe Ribó, de Caldes de Montbui, con referencia a la divulgación religiosa escrita (fotografía de los originales), y un autógrafo donde propone que se hagan donativos."],["35","Copia manual de la autobiografía del Padre Claret, hecha por los primeros misioneros (dos volúmenes), con una nota inicial del Venerable Padre Clotet, compañero del Padre Claret y cofundador de la Congregación de Misioneros Claretianos."],["36","Vida del entonces Venerable Padre Claret escrita por el historiador claretiano P. Mariano Aguilar."]]}],"right":[{"ab":"483","t":"Cuando concluía la misión, toda la gente de la población me salía a acompañar, y la población adonde iba me salía a recibir. Los primeros me despedían con lágrimas, y los segundos me recibían con alegría."},{"ab":"486","t":"A primeros de mayo de 1849 salí de aquellas islas. En aquellas islas estuve quince meses; todos los días trabajé, ayudado de la gracia del Señor."},{"ab":"487","t":"¡Oh Dios mío, qué bueno eres! De qué medios tan inesperados os valéis Vos para la conversión de los pecadores."}]},{"left":[{"v":"G","r":[["37","Cédula de la fundación de la Archicofradía del Corazón de María en la iglesia de Santo Domingo de Vic, el año 1847, después del novenario que allí predicó el Padre Claret en agosto de aquel año."],["38","Cédula del rosario a María Santísima."],["39","Gozos (Aleluyas) del Inmaculado Corazón de María indulgenciados por el Arzobispo Claret."],["40","Libritos referentes a la Archicofradía del Corazón de María."],["41","Libros sobre el rosario y otras devociones marianas."],["42","Registro de los primeros archicofrades del Corazón de María."],["43","Corona de los siete dolores de la Virgen, que el Padre Claret bendijo y regaló."],["44","Corona de las doce estrellas que regaló a una niña."],["45","Rosarios confeccionados por el santo."],["46","Carta del santo a su hermana Rosa, explicándole sus visitas a la Virgen de Fusimanya."],["47","Plegaria autógrafa del Padre Claret a la Virgen."],["48","Imagen de la Virgen del Pilar."],["49","Pendón de la Archicofradía del Corazón de María de Vic. Vemos representados los archicofrades san Pedro Almató, santa Joaquina de Vedruna, Jaime Balmes, Mn. Jacinto Verdaguer, el P. José Xifré, y los obispos de Vic Luciano Casadevall, José Morgades y José Torras y Bages."]]},{"box":["Sin número","**Vidriera** con el escudo episcopal del Padre Claret, exactamente en el lugar donde estaba los años 1940 al 1970 como ventana de luz detrás del sepulcro del santo. El actual emplazamiento del museo ocupa la misma planta en que se hallaba la capilla provisional de la Merced, en espera de la construcción del templo-sepulcro.","*En el escudo episcopal del P. Claret vemos:* el nombre de María, el sol y la luna (alusión a los apellidos CLARET y CLARA), el puente de Sallent sobre el Llobregat (referencia a su villa natal) y el emblema «CARITAS CHRISTI URGET NOS» (El amor de Cristo nos impulsa)."]}],"right":[{"ai":"El Padre Claret instituyó la Archicofradía del Corazón de María para la conversión de los pecadores en la iglesia de Santo Domingo, en Vic, en agosto de 1847. Durante la novena se inscribieron más de 10.000 personas. Entre ellos san Pedro Almató, con todos sus compañeros del noviciado de los PP. Dominicos de Ocaña."}]},{"left":[{"p":"Plafón 13","i":["Plegaria que el Padre Claret rezaba a la Virgen al comenzar las predicaciones al pueblo."]},{"v":"H","r":[["50","Imagen de la Virgen de los Dolores bendecida por el Padre Claret. Él era hermano de la Cofradía de los Dolores de Vic."]]}],"right":[{"ab":"270","t":"¡Oh Virgen y Madre de Dios, Madre y abogada de los pobres e infelices pecadores! Bien sabéis que soy hijo y ministro vuestro, formado por Vos misma en la fragua de vuestra misericordia y amor. Yo soy como una saeta puesta en vuestra mano poderosa..."}]}]},{"rom":"III","title":"Apóstol escritor","blocks":[{"left":[{"v":"I","r":[["51","Libros dedicados a diversas clases de personas."],["52","***«Consejos que una madre da a su hijo a punto de marcharse a la guerra»***. El sentido práctico del misionero le sugirió la idea de reducir esta obrita al mínimo de tamaño y de peso."],["53","***«El Ferrocarril»***. En tiempos en que el transporte interurbano pasaba de la diligencia tirada por caballos al tren de vapor, el ferrocarril había de ser un tema de gran impacto. El Padre Claret lo utiliza como símbolo en tres momentos progresivos."],["54","***«Las Hijas del Corazón de María»***, religiosas en sus casas. Hoy son las Misioneras de «Filiación Cordimariana»."],["55","Diversos opúsculos."]]}],"right":[{"ab":"310","t":"Uno de los medios que la experiencia me ha enseñado ser más poderoso para el bien es la imprenta así como es el arma más poderosa para el mal cuando se abusa de ella."},{"ab":"311","t":"Digo que en el día es una necesidad, porque hay un delirio para leer, y si la gente no tiene libros buenos, leerá malos."},{"ab":"312","t":"En el día, pues hay una doble necesidad de hacer circular libros buenos, pero estos libros han de ser pequeños, porque la gente anda aprisa y la llaman por todas partes y de mil maneras."},{"ab":"313","t":"El primer librito que publiqué fue el que contiene unos consejos o avisos espirituales, que había escrito para unas monjas. Viendo el buen resultado, determiné escribir el segundo, que fue el de Avisos a las Doncellas. Después escribí el de los Padres de familia, el de los Niños, el de los Jóvenes..."},{"ab":"323","t":"Gracias sean dadas a Dios, todos los libritos han producido felices resultados; pero de quienes he hallado más almas convertidas han sido: **El Camino recto** y **El catecismo Explicado**. Todos lo buscan y no reposan hasta haberse hecho con él."}]},{"left":[{"v":"J","r":[["56","***«CAMINO RECTO y seguro para llegar al cielo»***. Sucesión de ediciones en catalán y castellano."],["57","Ediciones en otros idiomas: Euskera, Portugués, Pangasinan (de Filipinas)."]]}],"right":[{"a":"«EL CAMINO RECTO Y SEGURO PARA LLEGAR AL CIELO» ha sido el manual de formación de la piedad y vida cristiana más popular de España. Los ejemplares impresos se calculan en unos dos millones."},{"a":"Es la obra más editada en lengua catalana, y con mayor número de ejemplares en total. La edición original catalana se hizo en 1843 y era un opusculito de 48 páginas. Las ediciones se sucedieron rápidamente, y con las mejoras y ampliaciones de cada edición llegó a ser un volumen de 500 páginas. A finales de siglo se habían hecho 250 ediciones con unos 800.000 ejemplares."},{"a":"«EL CAMINO RECTO» fue editado en lengua pangasinan, en Manila, el año 1884. Esta es una reedición hecha en Checoslovaquia."},{"a":"San Antonio María Claret es el único autor catalán que ha sido traducido a lenguas malayas (tagalog, bisaya, Iloco, pangasinan)."}]},{"left":[{"v":"K","r":[["58","***«Catecismo explicado»***. Primeras ediciones."],["59","Láminas del ***«Catecismo explicado»***."],["60","***«Maná del Cristiano»***."],["61","***«El santo evangelio de Nuestro Señor Jesucristo según san Mateo»***."],["62","***«La Santa Ley de Dios»***."],["63","***«Nuevo manojito de flores»***."],["64","***«La Llave de Oro»***."]]}],"right":[{"ab":"285","t":"Por el amor que tenía a los niños, he escrito cuatro catecismos: uno para los párvulos; otro para los rústicos; otro algo más extenso; y otro explicado, con estampas."},{"ab":"287","t":"El Catecismo a los mayores es el medio que he conocido hacía más fruto. Con él se les sacaba de la ignorancia."}]},{"left":[{"v":"L","r":[["65","***«El Colegial o seminarista instruído»***."],["66","***«La vocación de los niños»***."],["67","***«Colección de opúsculos»***."],["68","***«A la juventud estudiosa y cristiana»***. ***«La Colegiala Instruída»***."],["69","***«L'egoismo vinto»*** (una de las últimas obras)."],["70","Algunos de los innumerables libros publicados por la «Librería Religiosa». Entre ellos resalta la Biblia: un ejemplar de la tercera edición con unas manecillas señalando los puntos que el Padre Claret consideraba más remarcables."],["71","«Ex libris» del Arzobispo Claret. Hay la dedicación personal de un autor."]]}],"right":[{"ab":"329","t":"A fin de poder dar y vender a la mayor baratura posible, pensé poner una Imprenta Religiosa bajo la protección de María Santísima de Montserrat"},{"a":"Fundada en diciembre de 1848, la Librería Religiosa editó en vida de su fundador unos diez millones de impresos. Su obra editorial ha llegado hasta nuestros días."},{"ab":"331","t":"Por medio de la LIBRERÍA RELIGIOSA los eclesiásticos y seglares se han provisto y se están proveyendo de libros buenos, los mejores que se sabe, y al más ínfimo precio..."}]},{"left":[{"p":"Plafón 14","i":["Láminas del ***«Catecismo explicado»*** dibujadas por el santo."]},{"v":"M","r":[["72","Escritorio personal del Padre Claret."]]},{"p":"Plafón 15","i":["El escritor misionero: fotografía realizada en París el año 1868."]}],"right":[{"a":"El otro libro es el CATECISMO DE LA DOCTRINA CRISTIANA EXPLICADO Y ADAPTADO A LA CAPACIDAD DE LOS NIÑOS, y adornado con muchas láminas, por el Rev. D. Antoni Claret, Presbítero."},{"a":"La originalidad de esta obra fue su método intuitivo, la pedagogía de la imagen. Con ello el autor se anticipaba a su tiempo. La Librería Religiosa editó 170.000 ejemplares en catalán y 145.000 en castellano."},{"ab":"56","t":"Y ¡quién lo había de decir que el dibujo que yo aprendía (de estudiante en Barcelona) para la fabricación, Dios lo disponía para que sirviera para la Religión!. Y en efecto, mucho me ha servido para dibujar estampas del Catecismo y de asuntos místicos."}]}]},{"rom":"IV","title":"Fundador de los Misioneros Claretianos","blocks":[{"left":[{"box":[null,"**Celda** donde el Padre Claret fundó la Congregación de los Misioneros Hijos del Inmaculado Corazón de María, el 16 de julio de 1849. Era una simple habitación de seminarista situada en el tercer piso del seminario viejo. La ventana daba al patio interior."]},{"sub":"Los elementos originarios de la misma celda son:"},{"o":[["73","La puerta,"],["74","la ventana."],["75","Las vigas y el pavimento."],["76","Las baldosas del suelo. Los 87 centímetros de baldosas del lado de la ventana son de la celda que ocupaba el P. Esteban Sala, cofundador."],["77","El cuadro del Corazón de María que presidió la fundación."],["78","La mesa y la silla fueron usadas también por el Padre Claret en la casa de su hermano José, en Olost de Lluçanés, o bien en otros momentos de su vida."]]}],"right":[{"ab":"488","t":"A mediados de mayo llegué a Barcelona y me retiré a Vic y hablé con mis amigos los señores canónigos don Soler y don Passarell, del pensamiento que tenía de formar una Congregación de Sacerdotes que fuesen y se llamasen Hijos del Inmaculado Corazón de María."},{"ab":"489","t":"Yo entretanto hablé con algunos sacerdotes, a quienes Dios nuestro Señor había dado el mismo espíritu de que yo me sentía animado. Estos eran: Esteban Sala, José Xifré, Domingo Fábregas, Manuel Vilaró, Jaime Clotet, Antonio Claret, yo, el ínfimo de todos."},{"ab":"490","t":"El día 16 de julio de 1849, hallándonos ya reunidos, con aprobación del señor obispo y del señor rector, empezamos los santos ejercicios espirituales en el Seminario nosotros solos, con todo rigor y fervor... De aquellos ejercicios todos salimos muy fervorosos, resueltos y determinados a perseverar y, gracias sean dadas a Dios, todos hemos perseverado muy bien."},{"a":"El comienzo de los ejercicios espirituales a las 3 de la tarde del 16 de julio, en la celda de un seminarista, marcó el nacimiento de la Congregación Claretiana."}]},{"left":[{"p":"Plafón 16","i":["Los cofundadores:"],"names":["San Antonio María Claret","Venerable Jaime Clotet","Esteban Sala","José Xifré","Domingo Fábregas","Manuel Vilaró"]},{"o":[["80","**Reloj** de la escalera que marcaba las horas en la zona del seminario donde tuvo lugar la fundación. Las agujas marcan las tres de la tarde, hora en que se inició la fundación."]]},{"p":"Plafón 17","i":["Definición del Misionero Hijo del Corazón de María, redactada por el santo fundador."]}],"right":[{"ab":"491","t":"Así empezamos y así seguíamos estrictamente una vida perfectamente común. Todos íbamos trabajando en el sagrado ministerio."},{"ab":"494","caps":true,"t":"Yo me digo a mí mismo: un hijo del Inmaculado Corazón de María es un hombre que arde en caridad y que abrasa por donde pasa; que desea eficazmente y procura por todos los medios encender a todo el mundo en el fuego del divino amor. Nada le arredra; se goza en las privaciones; aborda los trabajos; abraza los sacrificios; se complace en las calumnias y se alegra en los tormentos. No piensa sino cómo seguirá e imitará a Jesucristo en trabajar, sufrir y en procurar siempre y únicamente la mayor gloria de Dios y la salvación de las almas."}]}]},{"rom":"V","title":"La Casa Madre","blocks":[{"left":[{"v":"N","r":[["81","Maqueta del antiguo convento de la Merced que el obispo de Vic cedió a la nueva comunidad misionera, y que en octubre de 1849 vino a ser la Casa Madre de la Congregación de los Misioneros Claretianos. Ya desde el principio se constituyó en Casa de Ejercicios Espirituales para seglares y sacerdotes."]]},{"p":"Plafón 18","s":"transparencias centro","i":["Alrededor de la maqueta, fotografías de diversos momentos históricos de la Casa Madre de Vic:","En tiempos de la fundación.","Obras de la reforma de los años 1928-1930, bajo la dirección del mártir P. Jaume Girón.","Proyecto de la restauración de la iglesia a su estilo original gótico conventual.","La destrucción en julio de 1936.","En el momento actual."]}],"right":[{"a":"Algunos datos sobre el convento de la Merced de Vic:"},{"chron":[["1235","El 19 de noviembre, Jaime I funda la casa mercedaria de Vic."],["1254","Se hace efectiva la fundación en la actual calle de Sant Pere, donde está actualmente el hospital de Vic."],["1264","Los mercedarios se trasladan al lugar donde ahora está la iglesia de Santo Domingo."],["1367","Compran una casa en el sitio donde se emplazará posteriormente el convento de la Merced."],["1383","Por este año se ha comenzado ya a construir la iglesia de la Merced, de estilo gótico conventual."],["1580","Parece que se edifica el claustro."],["1620","En la iglesia se construyen las bóvedas barrocas que desfiguran el estilo original."],["1733","Se construye la nueva puerta de la iglesia. La fecha que en ella se leía era 1734."],["1835","Los frailes son expulsados del país."],["1849","Octubre: los Misioneros Claretianos, fundados el 16 de julio del mismo año en el viejo seminario, se trasladan al convento de los mercedarios."]]}]},{"left":[{"o":[["82","**Altar** de la capilla de la Casa de Ejercicios de la Merced donde, desde los comienzos, los misioneros claretianos ejercían el ministerio apostólico de los Ejercicios Espirituales. Tradición que continúa en la actual «Casa de Espiritualidad Padre Claret», en la Rambla de Santo Domingo, obra del Padre Lluís Pujol CMF, fundador de las Misioneras de la Institución Claretiana."]]},{"v":"O","r":[["83","Imagen de la Virgen de la Merced bendecida por el santo. Proviene del noviciado de los Padres Escolapios de Alella."],["84","Busto del Venerable Jaume Clotet, cofundador de la Congregación de los Misioneros Claretianos y primer biógrafo del santo. Obra de Josep Vilarrubias CMF, año 1990."],["85","**Lápida sepulcral** del Padre Claret que se situaba en la antigua iglesia de la Merced. El escudo, restablecido, es obra de Jordi Pallàs."]]}],"right":[]},{"left":[{"box":[null,"**Celda** del tercer piso del seminario viejo, que ocupó el Padre Claret los primeros meses de la fundación. La ventana daba a la calle de Sant Hipòlit, hoy de Sant Miquel dels Sants."]},{"sub":"Elementos originales de la misma son:"},{"o":[["86","La puerta,"],["87","La ventana,"],["88","Las vigas y el suelo. Los 87 centímetros de baldosas del lado de la ventana son de la celda que ocupaba el P. Esteban Sala."],["89","La toalla del palanganero perteneció al Padre Claret años más tarde. *El mobiliario es facsímil, según la descripción hecha por el Padre Clotet en el relato de la fundación.*"]]}],"right":[{"a":"En esta habitación, el Padre Claret tuvo un gran sufrimiento y angustia mientras discernía la voluntad de Dios entre aceptar el nombramiento de arzobispo o renunciar al mismo, dado el amplísimo campo de apostolado que tenía en perspectiva. El nombramiento le llegó en agosto y no aceptó hasta el 4 de octubre. Desde aquí escribió cartas dolorosas al Obispo, al Nuncio, al Ministerio de Justicia..."},{"a":"San Antonio María Claret fundó, además de los MISIONEROS CLARETIANOS y de las MISIONERAS CLARETIANAS, otras instituciones, como la Academia de San Miguel que hoy se refleja en el MOVIMIENTO DE LAICOS CLARETIANOS; y las Religiosas en sus casas, actualmente Instituto Secular FILIACIÓN CORDIMARIANA."}]}]},{"rom":"VI","title":"Obispo misionero","blocks":[{"left":[{"v":"P","r":[["90","**Bula Pontificia** del Papa Pío IX en que se nombra Arzobispo de Santiago de Cuba al Padre Claret."]]},{"p":"Plafón 19","i":["La primera reacción del Padre Claret ante el nombramiento."]},{"v":"Q","r":[["91","Amito del Arzobispo Claret."],["92","Sobrepelliz."],["93","Dos libros de aquella época de la vida del santo: ***«Apuntes del Arzobispo Claret»*** que él mismo redactó para su gobierno personal de la diócesis y que posteriormente fue publicado; ***«Las delicias del Campo»*** para la promoción de los campesinos."],["94","Corporales con que celebraba la Eucaristía."],["95","Cinta de la Virgen de la Caridad del Cobre, patrona del obispado de Santiago de Cuba. Su longitud es igual a la altura de la imagen de la Virgen del Cobre."],["96","Utensilios personales: navaja de afeitar, piedra de afilar, cuchillos plegables, tijeras."]]},{"v":"R","r":[["97","Mitra del Arzobispo Claret."],["98","Cruz pectoral y anillo episcopal."]]}],"right":[{"ab":"491","t":"El día 11 de agosto, al bajar del púlpito, el Ilmo. Sr. Obispo me manda que vaya a Palacio, y al llegar allí me entregó el Real Nombramiento, fechado el día 4 de agosto, para el Arzobispado de Cuba."},{"ab":"495","t":"Espantado del nombramiento no quise aceptar por considerarme indigno e incapaz de tan grande dignidad; por no tener ni la ciencia ni las virtudes necesarias; y aunque yo tuviese ciencia y virtud, no debía abandonar la Librería religiosa y la Congregación que acababan de nacer."},{"ab":"538","t":"Durante los dos primeros años de nuestra estancia en Cuba, no obstante los temblores y el cólera morbo, visitamos todas las parroquias del Arzobispado; en todas se dio misión por mí mismo o por mis compañeros, y en las parroquias rurales que tienen tanta extensión se dieron muchas."},{"ab":"547","t":"La primera carta pastoral que escribí y firmé fue en el día 20 de Septiembre de 1852. La dirigí al clero."},{"ab":"549","t":"La segunda carta pastoral la dirigí al pueblo el día 25 de Marzo de 1853, recordando en ella lo que les habíamos enseñado en las Misiones y visita pastoral."},{"ab":"555","t":"Reparé el Seminario Conciliar. Más de treinta años habían pasado sin que seminarista interno se hubiese ordenado."},{"ab":"563","t":"Para los pobres compré una hacienda en la ciudad de Puerto Príncipe."},{"ab":"564","t":"El plan de esta obra era recoger a los niños y niñas pobres, que muchos de ellos se pierden por las calles pidiendo limosna. Allí se les había de proveer de comida y vestido y se les había de enseñar la Religión, leer, escribir, etc. y después arte u oficio, el que quisiesen."},{"ab":"566","t":"Al frontis del establecimiento o casa, había de haber un gabinete de física y aparatos de agricultura, un laboratorio de química y una biblioteca. A la biblioteca se había de dar entrada a todo el mundo, dos horas por la mañana y dos por la tarde; la clase de agricultura, tres días a la semana, era para todos los que quisiesen asistir; lo demás era para los internos."},{"ab":"568","t":"Mientras esta casa se iba adelantando, escribí una obrita que se titula «Delicias del campo», que encierra en embrión la Casa de Beneficencia comenzada. Esta obrita «Delicias del campo» ha sido de gran utilidad en aquella isla, de modo que los dueños de las haciendas la entregaban a los mayorales y les decían que por ella se llevaran."},{"ab":"569","t":"También puse en la diócesis la «Caja de ahorros», cuyo reglamento y aprobación está en la misma obra, para utilidad y morigeración de los pobres, porque vi que los pobres si se les dirige bien y se les proporciona un modo decente de ganarse la vida, son hombres virtuosos."},{"ab":"561","t":"Puse un convento de monjas de la enseñanza para niñas y les compré una casa."},{"a":"Se refiere a las religiosas de la Enseñanza de María Inmaculada, que fundó en Cuba juntamente con la Madre Antonia París, y que posteriormente se denominaron CLARETIANAS."},{"ab":"570","t":"También visitaba los presos de las cárceles, les catequizaba y predicaba con mucha frecuencia. Cuidábamos de que en la cárcel los presos aprendieran a leer, escribir, la Religión y algún oficio. Así que en la cárcel teníamos una porción de talleres..."}]},{"left":[{"v":"S","r":[["99","Almohada manchada con la sangre del arzobispo después del atentado sufrido en la ciudad de Holguín, en Cuba, el 1 de febrero de 1856."]]}],"right":[{"ab":"575","t":"Se acercó un hombre como si me quisiera besar el anillo, pero al instante alargó el brazo armado con una navaja de afeitar y descargó el golpe con toda su fuerza."},{"ab":"577","t":"No puedo explicar el placer, el gozo y la alegría que sentía mi alma al ver que había logrado lo que tanto deseaba, que era derramar la sangre por amor de Jesús y de María, y poder sellar con la sangre de mis venas las verdades evangélicas."}]},{"left":[{"p":"Plafón 20","i":["Santa JOAQUINA DE VEDRUNA, fundadora de las Carmelitas de la Caridad. Vic.","Venerable MARÍA ANTONIA PARÍS que, juntamente con el Arzobispo Claret, fundó la Congregación de las Religiosas de María Inmaculada (Misioneras Claretianas).","Santa MICAELA DEL SANTÍSIMO SACRAMENTO, fundadora de las Religiosas Adoratrices. Madrid.","San FRANCISCO COLL, OP, Fundador de las Dominicas de la Anunciata.","San PEDRO ALMATÓ, Dominico, a quien el Padre Claret ayudó en el discernimiento vocacional."]},{"p":"Plafón 21","i":["Cuadro del Arzobispo de Cuba, realizado con fragmentos de ropa utilizada por el mismo Padre Claret. Obra que unas Misioneras Claretianas de Cuba realizaron en vida del santo."]}],"right":[{"h":"Consejero espiritual de fundadores:"},{"a":"San Antonio María Claret tomó parte activa en la animación espiritual y apostólica de hombres y mujeres de Iglesia, santos y fundadores de diversas Congregaciones religiosas."}]},{"left":[{"p":"Plafón 22","i":["Diploma de la Academia de San Miguel, diseñado y firmado por el Arzobispo Claret."]}],"right":[{"ab":"581","t":"El tercero fue el pensamiento de la Academia de San Miguel, pensamiento que tuve en los primeros días de hallarme en la cama, y tan pronto como me levanté empecé a dibujar la estampa y a escribir el Reglamento."},{"a":"La Academia de San Miguel fue una de las grandes intuiciones pastorales y eclesiales del Padre Claret: la presencia activa de los laicos en la Iglesia, llamados al apostolado desde las diversas profesiones laicales: intelectuales, artistas, escritores, músicos..."}]}]},{"rom":"VII","title":"Confesor real","blocks":[{"left":[{"p":null,"i":["(En el mismo plafón 22) Carta en que el Arzobispo Claret, ya desde Madrid, se despide de la Iglesia de Cuba."]},{"v":"T","r":[["100","Casulla del oratorio particular de las hermanas Bertrana Forcada de Vic, con la que el P. Claret celebró la Misa el día 26 de agosto de 1865."]]}],"right":[{"ab":"587","t":"Ya llevaba unos cuantos días de misión cuando recibí una Real orden para que pasara a Madrid; pues se había muerto el arzobispo de Toledo, confesor que era de S.M. y ésta me había elegido a mí."},{"ab":"588","t":"El día 18 de marzo recibí la Real orden, y el día 22 del mismo mes salí de Cuba para La Habana y tomé allí el vapor correo que salía para Cádiz."},{"ab":"621","t":"Algunas veces he dicho que Dios me ha mandado a este destino para que sea mi purgatorio en que purgue y pague los pecados de mi vida pasada... Siempre estoy suspirando por salir. Soy como un pájaro enjaulado que va siguiendo las varitas por ver si puede escapar; así yo voy discurriendo para ver si puedo salir."}]},{"left":[{"v":"U","r":[["101","Cubiertos con las iniciales A C (Antonio Claret), donados por la reina Isabel II al Arzobispo."],["102","Medalla de la Inmaculada: Felicitación a María por su Inmaculada Concepción."],["103","Medalla de san Benito."],["104","Medalla de san Juan de Dios."],["105","Medalla conmemorativa del XVIII centenario del martirio de los apóstoles san Pedro y san Pablo."],["106","Medalla de la Capilla de la Virgen de Montserrat de Madrid."],["107","Cruz Porta-Paz."],["108 al 111","Cruces bendecidas, llevadas, o regaladas por el santo."],["112","Número de ropa del Arzobispo."],["113","Fotografía original, en los últimos años de su vida."],["114","Tarjeta personal."],["115 al 117","Fotografías en las postrimerías de su vida, hechas en Madrid y en París."],["118","Representaciones sarcásticas del arzobispo-confesor de la Reina, en cajas de cerillas (son copias por gentileza del Museo Marés, de Barcelona)."],["119","Alusión caricaturesca del P. Claret como confesor real, en una Auca sobre la revolución de 1868."]]}],"right":[{"ab":"638","t":"Tengo una santa emulación y casi envidia a los Misioneros que tienen la dichosa suerte de poder de pueblo en pueblo predicando el santo Evangelio."},{"a":"Los viajes que el Padre Claret tuvo que hacer con la familia real los convirtió en una misión gigante. Ciudades y pueblos de todas las regiones de España fueron testigos de la incesante acción apostólica de Claret dirigida a toda clase de personas."},{"ab":"639","t":"En medio de mis penas tengo algún consuelo; cuando con SS. MM. y AA. salimos de jornada, entonces se me proporciona el poder predicar al pueblo por la mañana, antes que SS. MM. salgan de casa; después voy predicando en los conventos a las Monjas, Hermanas, sacerdotes, estudiantes, señores y señoras de las Conferencia, etc., etc., por manera que todo el día lo paso predicando."},{"ab":"640","t":"Una de las cosas que más me ha ocupado desde que estoy en Madrid ha sido el escribir libros y hojas sueltas."},{"ab":"798","t":"Este año he sido muy calumniado y perseguido por toda clase de personas: por los periodistas, por los folletos, libros remedados, por fotografías y por muchas otras cosas..."},{"a":"En el periódico de Madrid «LA ESPERANZA» el 24 de enero de 1865 leemos: *«En diversas ocasiones los amigos han dicho al señor Claret que se defendiera, pero él siempre ha contestado que la mejor defensa consistía en no hacer caso, y al mismo tiempo rogar a Dios por ellos. Como lo hizo Jesús desde la cruz...»* (Citado en A. 867)"}]}]},{"rom":"VIII","title":"Hacia la Casa del Padre","blocks":[{"left":[{"p":"Plafón 23","i":["Vista general del monasterio cisterciense de Fontfroide, en el Languedoc, donde murió exiliado el Padre Claret, el 24 de octubre de 1870."]},{"v":"V","r":[["120","Crucifijo que acompañó la agonía del Padre Claret. La comunidad cisterciense de Fontfroide lo regaló a la Congregación Claretiana."]]}],"right":[{"a":"Los últimos meses de su vida el Arzobispo Claret toma parte activa en el Concilio Vaticano I."},{"a":"Exiliado y perseguido se retira al monasterio cisterciense de Fontfroide, al sur de Francia, donde se agrava su estado de salud y muere santamente, acompañado de un grupo de misioneros claretianos y de monjes del monasterio."},{"a":"El Venerable Padre Clotet, testimonio de aquellos hechos y primer biógrafo del santo, escribió: «La paz, la alegría y el fervor que mostró durante su última enfermedad, fueron admirables: No se cansaba de besar el crucifijo y de hacer fervorosas jaculatorias."},{"a":"Con una paz inalterable, y con el Crucifijo en las manos, a las 8,45 de la mañana del 24 de octubre, entregó apaciblemente su alma al Señor»."},{"a":"Sobre la losa sepulcral del arzobispo Claret en el monasterio de Fontfroide se leían las últimas palabras de San Gregorio VII:"},{"epi":["AMÉ LA JUSTICIA Y ODIÉ LA INIQUIDAD,","POR ESO MUERO EN EL DESTIERRO."]}]},{"left":[{"p":"Plafón 24","i":[]},{"o":[["121","Bordados con los escudos del Arzobispo Claret y de la Congregación de los Misioneros Hijos del Corazón de María, que adornaron la caja en el solemne traslado del cuerpo del Padre Claret de Fontfroide a Vic el año 1897."]]}],"right":[{"a":"El 13 de junio de 1897 los restos venerables del santo fueron trasladados de Fontfroide a Vic. El entusiasmo de los pueblos por donde pasaba fue en verdad delirante. Sobre todo en Vic."}]},{"left":[{"v":"X","r":[["122","Caja de madera en que el señor Miquel Bantulà de Vic escondió, en su casa, los venerables despojos del Padre Claret durante la guerra civil española (1936-1939)."],["123","Acta de deposición de los restos mortales para ser ocultados el día 20 de julio de 1936. Al día siguiente, 21, era incendiada la iglesia de la Merced."],["124","Carta del P. Pere Bertrans, Custodio del Cuerpo del santo, dirigida al P. General de los Claretianos inmediatamente después de escapar de la muerte (fue tiroteado por negarse a revelar el lugar donde estaba escondido el cuerpo del santo). Escrita el día 15 de agosto de 1936, arrodillado en medio de un campo de maíz."],["125","Carnet del P. Bertrans de afiliado a la UGT."],["126","Vida del P. Claret, hallada en Tona, apuñalada durante la revuelta de 1936."]]}],"right":[{"a":"Los siete sepulcros del Padre Claret:"},{"chron":[["1","FONTFROIDE (Languedoc en Francia). Del 1870 al 1897."],["2","VIC: Capilla del Santísimo de la iglesia de la Merced. De 1897 a 1932."],["3","SANTA EUGENIA DE BERGA. De 1932 a 1934."],["4","VIC: Altar mayor de la iglesia de la Merced. Del 1934 a 1936."],["5","VIC / CASA BANTULÀ, Calle Sant Miquel dels Sants. De 1936 a 1939."],["6","VIC: capilla provisional en la planta baja del convento donde hoy se emplaza el Museo Claretiano. De 1939 a 1970."],["7","VIC: Actual Templo Sepulcro: desde 1970, primer centenario de la muerte del santo."]]}]}]}],"ca":[{"rom":"","title":"Plafó d'entrada","blocks":[{"left":[{"h":"Plafó d'entrada"},{"t":"Al·legoria del Pare Claret, home d'aquesta terra, que, ungit per l'Esperit, esperonat per l'amor de Crist i forjat a la fornal del Cor de Maria, es lliurà a la missió evangelitzadora del poble."},{"q":"«RECORDAR EL PASSAT ÉS COMPROMETRE'S AMB EL FUTUR» (*Joan Pau II*, Hiroshima, 1981)."},{"t":"El plafó ha estat elaborat amb fragments d'instruments agrícoles i industrials del país i de l'època. (Autor: *Mn. Genís Baltrons*, any 1990.)"},{"sym":[["Sant Antoni Maria","Anagrama de Maria"],["Claret","El sol"],["Clarà","La lluna"],["Ungit per l'Esperit","El colom"],["Fill del Cor de Maria","Símbol del cor"],["Amor a Crist","Raïms i espigues (Eucaristia)"],["Encarnat de Maria Verge","Estel sobre el Cor de Maria"],["Predicat per l'evangelitzador","Serrells enduts pel vent"],["A tot el poble","Instruments de treball"],["Origen pagès per part de mare","Instruments agrícoles"],["i industrial per part de pare","Instruments industrials"]]}],"right":[{"a":"Els textos de l'*Autobiografia de sant Antoni Maria Claret* són en lletra cursiva, identificats segons la numeració habitual."},{"a":"S'hi afegeixen algunes anotacions complementàries."},{"ab":"1","t":"El R. P. Josep Xifré Superior dels Missioners Fills del Cor Immaculat de Maria, m'ha demanat diferents vegades que escrigui una biografia de la meva insignificant persona. Jo sempre hi he presentat les meves excuses i, si no fos perquè me'n dóna el manament, tampoc ara no m'hi hauria resolt. Així, doncs, ho faig únicament per obediència i per obediència revelaré coses que més m'estimaria que fossin ignorades. Que sigui, tanmateix, per a major glòria de Déu i de Maria Santíssima, la meva dolça Mare i per a confusió d'aquest miserable pecador."}]}]},{"rom":"I","title":"El noi Anton Claret","blocks":[{"left":[{"p":"Plafó 1","s":"Transparència a la vitrina del centre","i":["La casa on nasqué sant Antoni Maria Claret, carrer Cós n. 20 de Sallent, el dia 23 de desembre de 1807."]},{"p":"Plafó 2","i":["Teler de l'època"]},{"p":"Plafó 3","i":["La vila de Sallent"]},{"p":"Plafó 4","i":["Arbre genealògic d'Anton Claret i Clarà"]}],"right":[{"ab":"3","t":"Vaig néixer a la vila de Sallent deganat de Manresa, bisbat de Vic, província de Barcelona. Els meus pares es deien Joan Claret i Josepa Clarà, casats, honrats i temorosos de Déu, molt devots del Santíssim Sagrament de l'Altar i de Maria Santíssima."},{"ab":"31","t":"Com que el meu pare era fabricant de filats i de teixits, va posar-me a la fàbrica a treballar."}]},{"left":[{"v":"A","r":[["1","Medalla del centenari del naixement del Pare Claret"],["2","Tovallola teixida a la casa d'Anton Claret a Sallent"],["3","Fragment autògraf de la carta del P. Claret al seu amic el canonge Dr. Josep Caixal. Li recorda que, quan estudiava a la Llotja de Barcelona, el van premiar TRES VEGADES DE DIBUIX."],["4","El nom d'Anton Claret com a obrer tèxtil de la fàbrica de Francesc Prat de Barcelona, popularment anomenada «dels Vigatans» (la llista, signada pel fabricant mateix, el 1828)."],["5","Sant Crist que el jove Claret tenia al seu teler de la fàbrica de Francesc Prat."],["6","Números de la loteria a Barcelona. En aquella època el jove Claret serà estafat per un fals amic en una qüestió de loteria."]]},{"n":"(7-8)"}],"right":[{"ab":"56","t":"Delerós d'avançar en els coneixements de la fabricació, vaig dir al meu pare que em portés a Barcelona. El meu pare s'hi va avenir i m'hi va portar; jo mateix, com sant Pau, em guanyava amb les meves mans el que necessitava per a àpats, vestits, llibres, mestres, etc. La primera cosa que vaig fer fou presentar una sol·licitud a la Junta de la Casa Llotja per tal de ser-hi admès a les classes de dibuix; vaig aconseguir-ho i Déu n'hi do el profit que en vaig treure. I qui havia de dir que el dibuix que jo aprenia per a la fabricació, Déu disposava que servís per a la Religió! I en efecte, m'ha servit de molt per a dibuixar estampes del Catecisme..."},{"ab":"58","t":"De totes les coses que he estudiat i de totes aquelles a què m'he aplicat durant la vida, en cap no hi he entès tant com en la fabricació."}]},{"left":[{"p":"Plafó 5","s":"Transparència a la vitrina del centre","i":["La Llotja de Barcelona, on el jove Claret estudià l'art tèxtil, idiomes i dibuix."]},{"p":"Plafó 6","s":"Transparència a la vitrina del centre","i":["L'antic Seminari diocesà de Vic: finestres sobre el pati interior.","La Plana de Vic."]}],"right":[{"a":"Ja avançats els seus estudis a Barcelona, i en plena eufòria de progrés personal, alguns esdeveniments relacionats amb la seva persona li obriren els ulls a les vanitats del món i a la possibilitat de lliurar-se plenament al servei de l'Evangeli i dels germans."},{"ab":"68","t":"Enmig d'aquest enrenou, mentre oïa la santa Missa, vaig recordar-me d'haver llegit de molt petit aquelles paraules de l'Evangeli: ¿Què en traurà l'home de guanyar tot el món si finalment perd la seva ànima? Aquesta sentència va causar-me una profunda impressió... fou per a mi una sageta que va ferir-me el cor; jo pensava i rumiava què faria, però no me'n sortia."},{"ab":"69","t":"Vaig trobar-me com Saule al camí de Damasc;"},{"a":"En aquell moment crític, la trobada amb un germà llec i el contacte amb el Pare Amigó, tots dos de l'Oratori de Sant Felip Neri, foren la llum que li obrí nous horitzons."},{"ab":"82","t":"Vaig sortir de Barcelona després d'haver-m'hi estat prop de quatre anys, d'haver-m'hi enfredorit bastant en el fervor i d'haver-m'hi omplert massa del vent de la vanitat, d'elogis i d'aplaudiments..."}]},{"left":[{"p":"Plafó 7","s":"Transparència a la vitrina del centre","i":["Façana posterior de la casa Tortadès i capella de la Mare de Déu dels Àngels, al jardí, sobre la muralla de Pere III.","Dibuix de la capella del jardí, on el jove seminarista sovint es recollia a pregar.","Imatge de la Mare de Déu dels Àngels, restaurada després del 1936 per Frederic Marès. Actualment es troba a Can Tortadès, casa pairal a les Guilleries."]},{"p":"Plafó 8","i":["**Ex-vot** al·legòric de la temptació. Obra de Llucià Costa, del maig de 1934, amb motiu de la beatificació."]},{"o":[["9","**Fanal** de la casa Tortadès de Vic, a l'època de l'estudiant Claret."]]},{"p":"Plafó 9","i":["**Llit** de la casa Tortadès, on el jove seminarista Anton Claret patí una forta temptació contra la castedat, de la qual, amb l'ajuda de la Mare de Déu, en sortí decididament encaminat cap al sacerdoci."]}],"right":[{"ab":"83","t":"A primers del mes de setembre de l'any 1829 vaig sortir de Barcelona i els meus pares volgueren que anés a Sallent. Jo, per complaure'ls, hi vaig anar i vaig estar-me amb ells fins a la festa de Sant Miquel, dia 29, que vam sortir després d'oir la santa Missa. Fou un viatge molt trist per raó de la pluja que va acompanyar-nos gairebé tot el viatge. Arribàrem de nit a Vic, xops de dalt a baix."},{"ab":"84","t":"L'endemà mateix anàrem a veure el senyor bisbe que era Pablo de Jesús Corcuera. Ens va rebre molt bé. I per tal de tenir més temps per a estudiar i poder-me dedicar a les meves devocions particulars, van col·locar-me al costat del senyor majordom de Palau, anomenat mossèn Fortià Bres, molt bon sacerdot, que m'estimava moltíssim. Vaig estar-me amb ell durant tota la meva permanència a Vic..."},{"ab":"95","t":"Quan estudiava a Vic el segon any de filosofia, va succeir-me el que segueix: A l'hivern vaig tenir un refredat o cadarn... I un d'aquells dies que era al llit... vaig experimentar una temptació molt terrible. Acudia a Maria Santíssima... quan heus ací que se'm presenta Maria Santíssima, formosíssima i graciosíssima...; i entre els seus braços vaig veure una garlanda molt gran de roses bellíssimes... La Verge Santíssima va dirigir-me la paraula i em digué: Antoni, si vences, aquesta corona serà teva... I tant bon punt hagué passat això, vaig sentir-me lliure de la temptació i amb una joia tan gran, que no sabia el que m'havia passat."}]}]},{"rom":"II","title":"Prevere i missioner del poble","blocks":[{"left":[{"p":"Plafó 10","i":["El poble de Viladrau: mossèn Claret en regentà la parròquia l'any 1840.","La Creu del cim del Matagalls, al Montseny, en el seu estat actual, successora de la que hi plantà el Pare Claret."]},{"o":[["10","Morter de *Ca l'Herbolari* (còpia feta per Jordi Pallàs) de la casa de Jaume Bofill de Viladrau, on, segons una tradició familiar, mossèn Anton Claret féu preparats d'herbes medicinals."]]},{"p":"Plafó 11","i":["Retrat de mossèn Claret en els inicis de la seva predicació per Catalunya. Gravat de P. Ross, any 1894."]}],"right":[{"a":"El seminarista Antoni Claret rebé l'ordenació sacerdotal a Solsona, el 13 de juny de 1835. El primer destí fou la parròquia de Sallent. Més endavant decidí d'anar a Roma per ser enviat a missions, al lloc del món on més convingués l'evangelització. Però els camins del Senyor eren uns altres."},{"a":"En tornar a Catalunya, el bisbe de Vic l'envià a exercir la cura pastoral a Viladrau, poble assentat a la falda nord del Montseny."},{"ab":"170","t":"Establert de Regent a la parròquia de Viladrau, tenia cura d'aquelles ànimes de la millor manera que podia."},{"a":"Durant la seva estada a Viladrau, mossèn Claret erigí una creu al cim del Matagalls, al Montseny. El poeta mossèn Jacint Verdaguer ho comenta així:"},{"a":"«L'infatigable apòstol de Catalunya, mossèn Claret... era ben digne de senyar Catalunya posant-li al front, amb el senyal de la Creu, la bandera de la redempció»."},{"ab":"171","t":"I així em va caldre fer de metge corporal i espiritual, fos pels coneixements que tenia, fos pels estudis que feia en els llibres de medicina que em vaig procurar."},{"ab":"172","t":"En aquesta parròquia de Viladrau vaig començar les missions el dia 15 d'agost de l'any 1840, on vaig fer la novena de l'Assumpció de la Verge Maria."}]},{"left":[{"v":"B","r":[["11","Coberts que mossèn Claret utilitzava a la casa «El Noguer» de Viladrau."],["12","Mocador que usà el Pare Claret."],["13","Sant Crist del missioner apostòlic Claret."],["14","Tovallola plegada, usada pel sant."],["15","Medalla i creus de les que el Pare Claret repartí a la Missió de Lleida, juntament amb un antic escrit que n'acredita l'autenticitat."],["16","Vaset de butxaca."],["17","Mocador plegat."]]},{"n":"(18-19)"},{"p":"Plafó 12","i":["Pàgines de l'autobiografia en què el Pare Claret esmenta alguns pobles on predicà en aquells anys."]}],"right":[{"ab":"193","t":"A mitjan gener del 1841, després d'haver estat Regent de Viladrau durant vuit mesos, regentant el curat i sortint de tant en tant a predicar, per disposició del prelat, a diferents parròquies, vaig sortir finalment per predicar contínuament on m'enviés el prelat, sense fixar enlloc el meu domicili."},{"ab":"460","t":"En aquests set anys sempre vaig estar anant d'una població a l'altra. Anava sol i a peu... Al matí feia cinc hores de viatge i cinc més a la tarda..."},{"ab":"297","t":"L'estil que vaig proposar-me des del començament fou el del sant Evangeli: senzillesa i claredat. Per això em servia de comparances, semblances, exemples històrics i veritables; la majoria eren presos de la sagrada Escriptura."},{"ab":"221","t":"El que més m'ha mogut sempre és de contemplar Jesucrist anant d'una població a l'altra, predicant a tot arreu, no solament a les poblacions grans, sinó també als llogarrets; fins a una sola dona, com ho va fer amb la Samaritana..."}]},{"left":[{"v":"C","r":[["20","Imatge de sant Antoni de Pàdua, patró de mossèn Antoni Claret, que el mateix missioner beneí."]]},{"v":"D","r":[["21","Tovallola usada pel Pare Claret. Prové de Sabadell."],["22","Bonet que utilitzà durant la missió predicada a Valls."],["23","Creu que el sant beneí per a una família d'Albí, a prop de Lleida."],["24","Paraigua que feia servir el Pare Claret."],["25","Cilici (instrument de penitència)."],["26","Estampa de la Pentecosta que el Pare Claret portava al seu breviari."],["(27-28)",""],["29","Estàtua del Pare Claret missioner, catequista i escriptor. Obra de Domènec Fita, any 1990."]]},{"v":"E","r":[["30","Sabates i mocador del missioner Claret. Les sabates li foren canviades durant la missió que predicà a Lleida el maig de 1846. Durant l'evangelització per aquelles terres, els lleidatans el començaren a anomenar afectuosament «Pare Claret», expressió que immediatament arrelà i que ha restat definitiva."]]}],"right":[]},{"left":[{"v":"F","r":[["31","Versos d'un oient devot, en què resumeix els sermons escoltats a sant Antoni Maria Claret a la basílica de Santa Maria del Mar de Barcelona durant tot el mes de maig de 1844."],["32","Llibre registre d'exercitants de la Casa Mare de Vic, des de la fundació de la congregació dels claretians. El primer exercitant que hi consta (any 1850) és «l'Iltm. D. Anton Claret, arquebisbe electe de Cuba»."],["33","Dibuix-retrat del Pare Claret publicat a Barcelona durant la seva predicació per les illes Canàries, i que tingué una enorme difusió per terres catalanes."]]}],"right":[{"a":"Jaume Balmes digué del Pare Claret, predicador a Catalunya: «A la trona no parla mai de teatres. Tampoc no parla d'heretgies. Ni de filòsofs ni de descreguts. Sempre suposa la fe... Poc terror, suavitat en tot. Els exemples, en general, eren de la Sagrada Escriptura»."},{"ab":"480","t":"Vam sortir de Madrid cap a Sevilla, Jerez i Cadis, on vaig predicar, i ens vam embarcar cap a Canàries. A principi de febrer vam arribar a Tenerife, on vaig predicar el diumenge, i el dilluns vam sortir cap a la Gran Canària. Vaig donar exercicis espirituals als sacerdots en una sala del Palau, i el senyor bisbe presidia tots els actes. També vaig donar exercicis als estudiants del seminari, i vaig fer Missió a totes les parròquies de l'illa de la Gran Canària."},{"ab":"481","t":"Molt sovint havia de predicar a les places, perquè als temples no hi cabia la gentada que es reunia a cada població per escoltar la santa Missió."},{"a":"Heus ací alguns testimonis que el P. Brossosa recollí d'ambients populars de les illes Canàries: «Com el Pare Claret, cap»; «era ple de l'Esperit de Déu»; «a ell tots l'enteníem... i tot el que deia»; «mentre l'escoltàvem ens anava omplint, omplint...»."}]},{"left":[{"o":[["34","Dues cartes del Pare Claret al senyor Felip Ribó, de Caldes de Montbui, amb referència a la divulgació religiosa escrita (fotografia dels originals), i un autògraf on proposa que es facin donatius."],["35","Còpia manual de l'autobiografia del Pare Claret, feta pels primers missioners (dos volums), amb una nota inicial del Venerable Pare Clotet, company del Pare Claret i cofundador de la Congregació de Missioners Claretians."],["36","Vida de l'aleshores Venerable Pare Claret escrita per l'historiador claretià P. Mariano Aguilar."]]}],"right":[{"ab":"483","t":"Quan acabava la Missió, tota la gent de la població sortia a acompanyar-me, i la població on anava em sortia a rebre. Els primers m'acomiadaven amb llàgrimes, i els segons em rebien amb alegria."},{"ab":"486","t":"A primers de maig del 1849 vaig sortir d'aquelles illes... Quinze mesos vaig estar-me en aquelles illes. Vaig treballar-hi cada dia, ajudat de la gràcia del Senyor."},{"ab":"487","t":"¡O Déu meu, que en sou de bo! De quins mitjans tan inesperats us serviu Vós per a la conversió dels pecadors."}]},{"left":[{"v":"G","r":[["37","Butlleta de la fundació de l'Arxiconfraria del Cor de Maria a l'església de Sant Domènec de Vic, l'any 1847, després del novenari que hi predicà el Pare Claret l'agost d'aquell any."],["38","Cèdula del Rosari a Maria Santíssima."],["39","Goigs (Al·leluies) de l'Immaculat Cor de Maria indulgenciats per l'Arquebisbe Claret."],["40","Llibrets referents a l'Arxiconfraria del Cor de Maria."],["41","Llibres sobre el Rosari i altres devocions marianes."],["42","Registre dels primers arxiconfrares del Cor de Maria."],["43","Corona dels set dolors de la Mare de Déu, que el Pare Claret beneí i regalà."],["44","Corona de les dotze estrelles que regalà a una nena."],["45","Rosaris confeccionats pel sant."],["46","Carta del sant a la seva germana Rosa, en què li parla de les seves visites a la Mare de Déu de Fussimanya."],["47","Pregària autògrafa del Pare Claret a la Mare de Déu."],["48","Imatge de la Mare de Déu del Pilar."],["49","Penó de l'Arxiconfraria del Cor de Maria de Vic. Hi veiem representats els arxiconfrares sant Pere Almató, santa Joaquima de Vedruna, Jaume Balmes, mossèn Jacint Verdaguer, el P. Josep Xifré, i els bisbes de Vic Llucià Casadevall, Josep Morgades i Josep Torras i Bages."]]},{"box":["Sense número","**Vitrall** amb l'escut episcopal del Pare Claret, exactament al lloc on era els anys 1940 al 1970 com a finestra de llum darrere el sepulcre del sant. L'emplaçament actual del museu ocupa la mateixa planta on hi havia la capella provisional de la Mercè, en espera de la construcció del temple-sepulcre.","*A l'escut episcopal del P. Claret hi veiem:* el nom de Maria, el sol i la lluna (al·lusió als cognoms CLARET i CLARÀ), el pont de Sallent sobre el Llobregat (referència a la seva vila natal) i el lema «CARITAS CHRISTI URGET NOS» (L'amor del Crist ens esperona)."]}],"right":[{"ai":"El Pare Claret instituí l'Arxiconfraria del Cor de Maria per a la conversió dels pecadors a l'església de Sant Domènec de Vic, l'agost de 1847. Durant la novena s'hi inscriviren més de 10.000 persones. Entre ells, sant Pere Almató, amb tots els seus companys del noviciat dels PP. Dominics d'Ocaña."}]},{"left":[{"p":"Plafó 13","i":["Pregària que el Pare Claret resava a la Mare de Déu en començar les predicacions al poble."]},{"v":"H","r":[["50","Imatge de la Mare de Déu dels Dolors beneïda pel Pare Claret. Ell era germà de la Confraria dels Dolors de Vic."]]}],"right":[{"ab":"270","t":"Oh Verge i Mare de Déu, Mare i advocada dels pobres i infeliços pecadors! Sabeu prou que sóc fill i servent vostre, format per Vós mateixa a la farga de la vostra misericòrdia i amor. Jo sóc com una sageta posada a la vostra mà poderosa..."}]}]},{"rom":"III","title":"Apòstol escriptor","blocks":[{"left":[{"v":"I","r":[["51","Llibres adreçats a diverses classes de persones."],["52","***«Consejos que una madre da a su hijo a punto de marcharse a la guerra»***. El sentit pràctic del missioner li suggerí la idea de reduir aquesta obreta al mínim de mida i de pes."],["53","***«El Ferrocarril»***. En un temps en què el transport interurbà passava de la diligència tirada per cavalls al tren de vapor, el ferrocarril havia de ser un tema de gran impacte. El Pare Claret l'utilitza com a símbol en tres moments progressius."],["54","***«Las Hijas del Corazón de María»***, religioses a casa seva. Avui són les Missioneres de la «Filiació Cordimariana»."],["55","Opuscles diversos."]]}],"right":[{"ab":"310","t":"Un dels mitjans que l'experiència m'ha ensenyat ser més poderós per al bé és la impremta, així com és l'arma més poderosa per al mal quan se n'abusa."},{"ab":"311","t":"Dic que avui és una necessitat, perquè hi ha una fal·lera per llegir, i si la gent no té llibres bons, en llegirà de dolents."},{"ab":"312","t":"Avui, doncs, hi ha una doble necessitat de fer circular llibres bons; però aquests llibres han d'ésser petits, perquè la gent es mou de pressa i la criden pertot arreu i de mil maneres..."},{"ab":"313","t":"El primer llibret que vaig publicar fou el que conté uns consells o avisos espirituals, que havia escrit per a les monges de Vic... Veient el bon resultat que donava el primer llibre, em vaig decidir a escriure el segon, que fou e
