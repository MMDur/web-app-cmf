aversées, surtout à Vic."}]},{"left":[{"v":"X","r":[["122","Caisse en bois dans laquelle M. Miquel Bantulà, de Vic, cacha chez lui les vénérables dépouilles du Père Claret pendant la guerre civile espagnole (1936-1939)."],["123","Procès-verbal de la mise à l’abri des restes mortels, cachés le 20 juillet 1936. Le lendemain, 21 juillet, l’église de la Merci était incendiée."],["124","Lettre du P. Pere Bertrans, gardien du corps du saint, adressée au P. Général des Clarétains aussitôt après avoir échappé à la mort (on lui tira dessus parce qu’il refusait de révéler l’endroit où le corps du saint était caché). Écrite le 15 août 1936, à genoux, au milieu d’un champ de maïs."],["125","Carte d’adhérent à l’UGT du P. Bertrans."],["126","Vie du P. Claret, retrouvée à Tona, transpercée de coups de couteau pendant la révolte de 1936."]]}],"right":[{"a":"Les sept sépultures du Père Claret :"},{"chron":[["1","FONTFROIDE (Languedoc, France). De 1870 à 1897."],["2","VIC : chapelle du Saint-Sacrement de l’église de la Merci. De 1897 à 1932."],["3","SANTA EUGÈNIA DE BERGA. De 1932 à 1934."],["4","VIC : maître-autel de l’église de la Merci. De 1934 à 1936."],["5","VIC / MAISON BANTULÀ, rue Sant Miquel dels Sants. De 1936 à 1939."],["6","VIC : chapelle provisoire au rez-de-chaussée du couvent où se trouve aujourd’hui le Musée clarétain. De 1939 à 1970."],["7","VIC : actuel Temple-Sépulcre, depuis 1970, premier centenaire de la mort du saint."]]}]}]}],"it":[{"rom":"","title":"Pannello d’ingresso","blocks":[{"left":[{"h":"Pannello d’ingresso"},{"t":"Allegoria di Padre Claret, uomo di questa terra che, unto dallo Spirito, spinto dall’amore di Cristo e forgiato nella fucina del Cuore di Maria, si donò alla missione evangelizzatrice del popolo."},{"q":"«RICORDARE IL PASSATO È IMPEGNARSI PER IL FUTURO» (*Giovanni Paolo II*, Hiroshima, 1981)."},{"t":"Il pannello è stato realizzato con frammenti di attrezzi agricoli e industriali della zona e dell’epoca. (Autore: *Mn. Genís Baltrons*, 1990.)"},{"sym":[["Sant’Antonio Maria","*Monogramma di Maria*"],["Claret","*Il sole*"],["Clarà","*La luna*"],["Unto dallo Spirito","*La colomba*"],["Figlio del Cuore di Maria","*Simbolo del cuore*"],["Amore per Cristo","*Grappoli e spighe (Eucaristia)*"],["Incarnato dalla Vergine Maria","*Stella sul Cuore di Maria*"],["Predicato dall’evangelizzatore","*Frange portate dal vento*"],["A tutto il popolo","*Attrezzi da lavoro*"],["Origine contadina da parte di madre","*Attrezzi agricoli*"],["e industriale da parte di padre","*Attrezzi industriali*"]]}],"right":[{"a":"I testi dell’*Autobiografia di sant’Antonio Maria Claret* sono in corsivo, contrassegnati secondo la numerazione abituale."},{"a":"Vi si aggiungono alcune note complementari."},{"ab":"1","t":"Avendomi chiesto Don Giuseppe Xifré, Superiore dei Missionari Figli del Cuore di Maria, ripetute volte, e a voce e per iscritto, una biografia della mia insignificante persona, mi sono sempre scusato, e anche adesso non mi sarei deciso, se non me lo avesse comandato. Di modo che lo faccio solo per obbedienza, e per obbedienza rivelerò cose che preferirei restassero ignorate. Che tutto sia per la maggior gloria di Dio e di Maria Santissima, mia dolce Madre, e a confusione di questo miserabile peccatore."}]}]},{"rom":"I","title":"Il giovane Antonio Claret","blocks":[{"left":[{"p":"Pannello 1","s":"Immagine retroilluminata nella vetrina centrale","i":["La casa dove nacque sant’Antonio Maria Claret, in via del Cós n. 20, a Sallent, il 23 dicembre 1807."]},{"p":"**Pannello 2**","i":["Telaio dell’epoca"]},{"p":"**Pannello 3**","i":["La cittadina di Sallent"]},{"p":"**Pannello 4**","i":["Albero genealogico di Anton Claret i Clarà"]}],"right":[{"ab":"3","t":"Sono nato nella cittadina di Sallent, decanato di Manresa, diocesi di Vic, provincia di Barcellona. I miei genitori si chiamavano Giovanni Claret e Giuseppina Clarà, sposati, onesti e timorati di Dio, molto devoti del Santissimo Sacramento dell’Altare e di Maria Santissima."},{"ab":"31","t":"E siccome mio padre era fabbricante di filati e tessuti, mi portò nella sua fabbrica a lavorare."}]},{"left":[{"v":"A","r":[["1","Medaglia del centenario della nascita di Padre Claret"],["2","Asciugamano tessuto nella casa di Anton Claret a Sallent"],["3","Frammento autografo della lettera del P. Claret al suo amico, il canonico dott. Josep Caixal. Gli ricorda che, quando studiava alla Llotja di Barcellona, fu premiato TRE VOLTE NEL DISEGNO."],["4","Il nome di Anton Claret come operaio tessile della fabbrica di Francesc Prat a Barcellona, detta popolarmente «dels Vigatans» (dei vicensi): elenco firmato dallo stesso fabbricante nel 1828."],["5","Crocifisso che il giovane Claret teneva sul suo telaio, nella fabbrica di Francesc Prat."],["6","Numeri della lotteria a Barcellona. In quel periodo il giovane Claret sarà truffato da un falso amico in una faccenda di lotteria."]]},{"n":"*(7-8)*"}],"right":[{"ab":"56","t":"Volendomi perfezionare nell’arte dei tessuti, dissi a mio padre di portarmi a Barcellona. Accondiscese, e mi ritrovai in quella città; dove, come san Paolo, dovevo guadagnarmi con le mie mani il necessario per il vitto, vestiti, libri, maestri, ecc. Presentai, per prima cosa, una domanda alla Giunta della Casa Lonja, per essere ammesso alle lezioni di disegno. Fui ammesso, e ne ricavai un certo profitto. Chi avrebbe detto che il disegno che imparavo per i tessuti, Dio lo destinava a servire alla Religione! Infatti mi servì poi molto per disegnare stampe del Catechismo..."},{"ab":"58","t":"Tante cose ho studiato e in tante mi sono applicato nella vita, ma in nessuna ho progredito tanto come nell’arte del tessuto."}]},{"left":[{"p":"Pannello 5","s":"Immagine retroilluminata nella vetrina centrale","i":["La Llotja di Barcellona, dove il giovane Claret studiò l’arte tessile, le lingue e il disegno."]},{"p":"Pannello 6","s":"Immagine retroilluminata nella vetrina centrale","i":["L’antico Seminario diocesano di Vic: finestre sul cortile interno.","La Plana di Vic."]}],"right":[{"a":"Quando i suoi studi a Barcellona erano ormai avanzati, e in piena euforia di affermazione personale, alcuni avvenimenti che lo riguardavano direttamente gli aprirono gli occhi sulle vanità del mondo e sulla possibilità di donarsi pienamente al servizio del Vangelo e dei fratelli."},{"ab":"68","t":"Mi dibattevo in questo tumulto di pensieri quando, proprio durante la santa Messa, mi ricordai di quella sentenza del Vangelo che avevo letto ancora bambino: «Che giova all’uomo guadagnare tutto il mondo, se poi perde la sua anima?». Ne fui profondamente scosso... Fu per me una saetta che mi colpì al cuore. Io mi domandavo cosa dovessi fare, ma non ne venivo a capo."},{"ab":"69","t":"Mi ritrovavo come Saulo sulla via di Damasco;"},{"a":"In quel momento critico, l’incontro con un fratello laico e il contatto con Padre Amigó, entrambi dell’Oratorio di San Filippo Neri, furono la luce che gli aprì nuovi orizzonti."},{"ab":"82","t":"Lasciai Barcellona dopo circa quattro anni. Il mio fervore si era assai raffreddato e mi ero riempito troppo del vento della vanità, degli elogi e degli applausi..."}]},{"left":[{"p":"Pannello 7","s":"Immagine retroilluminata nella vetrina centrale","i":["Facciata posteriore di casa Tortadès e cappella della Madonna degli Angeli, nel giardino, sulle mura di Pietro III.","Disegno della cappella del giardino, dove il giovane seminarista si ritirava spesso a pregare.","Statua della Madonna degli Angeli, restaurata dopo il 1936 da Frederic Marès. Si trova attualmente a Can Tortadès, casa avita, nelle Guilleries."]},{"p":"**Pannello 8**","i":["**Ex voto** allegorico della tentazione. Opera di Llucià Costa, del maggio 1934, in occasione della beatificazione."]},{"o":[["9","**Lanterna** di casa Tortadès a Vic, all’epoca in cui Claret era studente."]]},{"p":"**Pannello 9**","i":["**Letto** di casa Tortadès, dove il giovane seminarista Anton Claret subì una forte tentazione contro la castità, dalla quale, con l’aiuto della Madonna, uscì decisamente orientato verso il sacerdozio."]}],"right":[{"ab":"83","t":"Lasciai Barcellona i primi del mese di settembre del 1829. I miei genitori vollero che passassi per Sallent. Io li accontentai, e rimasi con loro fino al 29, festa di san Michele. Quel giorno, ascoltata la santa Messa, ci mettemmo in cammino per Vic. Fu un viaggio molto triste, per la pioggia che ci accompagnò quasi tutto il tragitto. La sera arrivammo a Vic del tutto fradici."},{"ab":"84","t":"Il giorno dopo facemmo visita al Vescovo, che era Mons. Paolo di Gesù Corcuera, che ci ricevette amabilmente. E perché potessi avere più tempo per lo studio e per i miei atti di pietà, mi collocarono vicino al maggiordomo di Palazzo, Don Forziano Bres, sacerdote molto buono, che mi voleva molto bene. Rimasi con lui durante tutta la mia permanenza a Vic..."},{"ab":"95","t":"Mentre a Vic facevo il secondo anno di filosofia, mi accadde quanto segue: quell’inverno ebbi un forte raffreddore. Mi fu imposto di stare a letto... Un giorno... mi sentii assalito da una terribile tentazione. Invocai la Madonna... quand’ecco, mi apparve Maria Santissima, bellissima e graziosissima... fra le mani una ghirlanda molto grande di bellissime rose... La Santissima Vergine allora mi rivolse la parola, e mi disse: «Antonio, questa corona sarà tua, se vincerai»... E quando tutto finì, mi ritrovai libero dalla tentazione e con una gioia tanto grande, che non sapevo quello che era accaduto in me."}]}]},{"rom":"II","title":"Sacerdote e missionario del popolo","blocks":[{"left":[{"p":"**Pannello 10**","i":["Il paese di Viladrau: don Claret ne resse la parrocchia nel 1840.","La croce sulla cima del Matagalls, nel Montseny, nel suo stato attuale; è succeduta a quella che vi aveva piantato Padre Claret."]},{"o":[["10","Mortaio di *Ca l’Herbolari* (copia realizzata da Jordi Pallàs), proveniente dalla casa di Jaume Bofill a Viladrau, dove, secondo una tradizione di famiglia, don Anton Claret preparava rimedi a base di erbe medicinali."]]},{"p":"**Pannello 11**","i":["Ritratto di don Claret agli inizi della sua predicazione in Catalogna. Incisione di P. Ross, 1894."]}],"right":[{"a":"Il seminarista Antonio Claret ricevette l’ordinazione sacerdotale a Solsona, il 13 giugno 1835. La prima destinazione fu la parrocchia di Sallent. In seguito decise di andare a Roma per essere inviato in missione, nel luogo del mondo dove l’evangelizzazione fosse più necessaria. Ma le vie del Signore erano altre."},{"a":"Al ritorno in Catalogna, il vescovo di Vic lo mandò a esercitare la cura pastorale a Viladrau, paese situato sul versante nord del Montseny."},{"ab":"170","t":"Stabilito nella parrocchia di Viladrau come reggente, badavo come meglio potevo al bene spirituale di quelle anime."},{"a":"Durante la sua permanenza a Viladrau, don Claret eresse una croce sulla cima del Matagalls, nel Montseny. Il poeta e sacerdote Jacint Verdaguer lo commenta così:"},{"a":"«L’infaticabile apostolo della Catalogna, don Claret... era ben degno di segnare la Catalogna ponendole in fronte, con il segno della Croce, la bandiera della redenzione»."},{"ab":"171","t":"Fu allora necessario che io facessi il medico corporale e spirituale, sia con le conoscenze che già avevo, sia con gli studi che facevo nei libri di medicina che mi procurai."},{"ab":"172","t":"In questa parrocchia di Viladrau iniziai le missioni il 15 agosto del 1840, con la novena della Madonna Assunta."}]},{"left":[{"v":"B","r":[["11","Posate che don Claret usava nella casa «El Noguer» di Viladrau."],["12","Fazzoletto usato da Padre Claret."],["13","Crocifisso del missionario apostolico Claret."],["14","Asciugamano piegato, usato dal santo."],["15","Medaglia e croci, tra quelle che Padre Claret distribuì durante la Missione di Lerida, con un antico scritto che ne attesta l’autenticità."],["16","Bicchierino da tasca."],["17","Fazzoletto piegato."]]},{"n":"*(18-19)*"},{"p":"**Pannello 12**","i":["Pagine dell’Autobiografia in cui Padre Claret ricorda alcuni paesi dove predicò in quegli anni."]}],"right":[{"ab":"193","t":"Verso la metà di gennaio del 1841, dopo otto mesi passati a Viladrau come reggente, andando di quando in quando a predicare, secondo che il Prelato disponeva, nelle varie parrocchie, finalmente presi a predicare senza interruzione dove il Prelato mi mandava, senza fissa dimora."},{"ab":"460","t":"In questi sette anni andavo continuamente da un paese all’altro. Andavo solo e a piedi... Al mattino facevo cinque ore di viaggio e altrettante al pomeriggio..."},{"ab":"297","t":"Lo stile che adottai fin dal principio fu quello del santo Vangelo: semplicità e chiarezza. A questo scopo mi servivo di paragoni, similitudini, esempi storici e veri; i più tratti dalla sacra Scrittura."},{"ab":"221","t":"Quello che più mi ha sempre mosso è contemplare Gesù Cristo che andava da un paese all’altro, predicando dappertutto, non solamente nei paesi grandi, ma anche nei villaggi, persino a una donna sola, come fece con la Samaritana..."}]},{"left":[{"v":"C","r":[["20","Statua di sant’Antonio di Padova, patrono di don Antonio Claret, benedetta dallo stesso missionario."]]},{"v":"D","r":[["21","Asciugamano usato da Padre Claret. Proviene da Sabadell."],["22","Berretta che usò durante la missione predicata a Valls."],["23","Croce che il santo benedisse per una famiglia di Albí, vicino a Lerida."],["24","Ombrello usato da Padre Claret."],["25","Cilicio (strumento di penitenza)."],["26","Immaginetta della Pentecoste che Padre Claret teneva nel suo breviario."],["(27-28)",""],["29","Statua di Padre Claret missionario, catechista e scrittore. Opera di Domènec Fita, 1990."]]},{"v":"E","r":[["30","Scarpe e fazzoletto del missionario Claret. Le scarpe gli furono scambiate durante la missione che predicò a Lerida nel maggio 1846. Durante l’evangelizzazione di quelle terre, gli abitanti di Lerida cominciarono a chiamarlo affettuosamente «Padre Claret», espressione che subito attecchì e che gli è rimasta per sempre."]]}],"right":[]},{"left":[{"v":"F","r":[["31","Versi di un ascoltatore devoto, in cui riassume le prediche di sant’Antonio Maria Claret ascoltate nella basilica di Santa Maria del Mar di Barcellona durante tutto il mese di maggio 1844."],["32","Registro degli esercitanti della Casa Madre di Vic, dalla fondazione della congregazione dei clarettiani. Il primo esercitante che vi figura (1850) è «l’Ill.mo Don Anton Claret, arcivescovo eletto di Cuba»."],["33","Disegno-ritratto di Padre Claret pubblicato a Barcellona durante la sua predicazione nelle isole Canarie, che ebbe un’enorme diffusione nelle terre catalane."]]}],"right":[{"a":"Jaume Balmes disse di Padre Claret, predicatore in Catalogna: «Dal pulpito non parla mai di teatri. Non parla nemmeno di eresie. Né di filosofi né di miscredenti. Suppone sempre la fede... Poco terrore, soavità in tutto. Gli esempi, in genere, erano tratti dalla Sacra Scrittura»."},{"ab":"480","t":"Partimmo da Madrid per Siviglia, Jerez e Cadice, dove predicai; e ci imbarcammo per le Canarie. I primi di febbraio giungemmo a Tenerife, dove la domenica predicai; e lunedì partimmo per la Gran Canaria. Tenni gli esercizi spirituali ai sacerdoti in un salone del Palazzo, dove il Vescovo presiedeva tutti gli atti. Anche agli studenti del Seminario detti gli esercizi, e feci la missione in tutte le parrocchie dell’isola della Gran Canaria."},{"ab":"481","t":"Molto frequentemente dovevo predicare nelle piazze, perché nelle chiese non c’entrava tutta la gente che in ogni paese si radunava per la missione."},{"a":"Ecco alcune testimonianze che il P. Brossosa raccolse negli ambienti popolari delle isole Canarie: «Come Padre Claret, nessuno»; «era pieno dello Spirito di Dio»; «lui lo capivamo tutti... e tutto quello che diceva»; «mentre lo ascoltavamo ci riempiva, ci riempiva...»."}]},{"left":[{"o":[["34","Due lettere di Padre Claret al signor Felip Ribó, di Caldes de Montbui, riguardanti la diffusione religiosa per mezzo della stampa (fotografia degli originali), e un autografo in cui propone di fare offerte."],["35","Copia manoscritta dell’Autobiografia di Padre Claret, fatta dai primi missionari (due volumi), con una nota iniziale del Venerabile Padre Clotet, compagno di Padre Claret e cofondatore della Congregazione dei Missionari Clarettiani."],["36","Vita dell’allora Venerabile Padre Claret, scritta dallo storico clarettiano P. Mariano Aguilar."]]}],"right":[{"ab":"483","t":"Conclusa una missione, tutta la gente del paese usciva per accompagnarmi; e usciva a ricevermi quella della località dove dovevo recarmi. I primi si accomiatavano con le lacrime, mentre gli altri mi ricevevano con gioia."},{"ab":"486","t":"I primi di maggio del 1849 lasciai quelle isole... Stetti in quelle isole quindici mesi; lavorai tutti i giorni, aiutato dalla grazia del Signore."},{"ab":"487","t":"Oh Dio mio, quanto siete buono! Di quali mezzi imprevisti vi servite Voi per la conversione dei peccatori!"}]},{"left":[{"v":"G","r":[["37","Cedola di fondazione dell’Arciconfraternita del Cuore di Maria nella chiesa di San Domenico di Vic, nel 1847, dopo la novena che vi predicò Padre Claret nell’agosto di quell’anno."],["38","Cedola del Rosario a Maria Santissima."],["39","Goigs e al·leluies (canti e fogli illustrati popolari) dell’Immacolato Cuore di Maria, arricchiti di indulgenze dall’Arcivescovo Claret."],["40","Libretti riguardanti l’Arciconfraternita del Cuore di Maria."],["41","Libri sul Rosario e su altre devozioni mariane."],["42","Registro dei primi iscritti all’Arciconfraternita del Cuore di Maria."],["43","Corona dei sette dolori della Madonna, che Padre Claret benedisse e regalò."],["44","Corona delle dodici stelle che regalò a una bambina."],["45","Rosari confezionati dal santo."],["46","Lettera del santo alla sorella Rosa, in cui le parla delle sue visite alla Madonna di Fussimanya."],["47","Preghiera autografa di Padre Claret alla Madonna."],["48","Statua della Madonna del Pilar."],["49","Stendardo dell’Arciconfraternita del Cuore di Maria di Vic. Vi sono raffigurati alcuni suoi membri: san Pietro Almató, santa Gioacchina de Vedruna, Jaume Balmes, don Jacint Verdaguer, il P. Josep Xifré e i vescovi di Vic Llucià Casadevall, Josep Morgades e Josep Torras i Bages."]]},{"box":["Senza numero","**Vetrata** con lo stemma episcopale di Padre Claret, esattamente nel punto in cui, dal 1940 al 1970, dava luce alle spalle del sepolcro del santo. Il museo occupa oggi lo stesso piano in cui si trovava la cappella provvisoria della Mercede, in attesa della costruzione del tempio-sepolcro.","*Nello stemma episcopale del P. Claret si vedono:* il nome di Maria, il sole e la luna (allusione ai cognomi CLARET e CLARÀ), il ponte di Sallent sul Llobregat (riferimento al suo paese natale) e il motto «CARITAS CHRISTI URGET NOS» (L’amore del Cristo ci possiede)."]}],"right":[{"ai":"*Padre Claret istituì l’Arciconfraternita del Cuore di Maria per la conversione dei peccatori nella chiesa di San Domenico di Vic, nell’agosto 1847. Durante la novena vi si iscrissero più di 10.000 persone. Tra loro san Pietro Almató, con tutti i suoi compagni del noviziato dei Padri Domenicani di Ocaña.*"}]},{"left":[{"p":"**Pannello 13**","i":["Preghiera che Padre Claret recitava alla Madonna all’inizio delle predicazioni al popolo."]},{"v":"H","r":[["50","Statua della Madonna Addolorata benedetta da Padre Claret. Era membro della Confraternita dell’Addolorata di Vic."]]}],"right":[{"ab":"270","t":"O Vergine e Madre di Dio, Madre e avvocata dei poveri e infelici peccatori! Ben sapete che sono figlio e ministro vostro, formato da Voi stessa nella fucina della vostra misericordia e amore. Io sono come una freccia posta nella vostra mano potente..."}]}]},{"rom":"III","title":"Apostolo scrittore","blocks":[{"left":[{"v":"I","r":[["51","Libri rivolti a diverse categorie di persone."],["52","***«Consejos que una madre da a su hijo a punto de marcharse a la guerra»*** (Consigli di una madre al figlio in procinto di partire per la guerra). Il senso pratico del missionario gli suggerì l’idea di ridurre quest’operetta al minimo di formato e di peso."],["53","***«El Ferrocarril»*** (La ferrovia). In un’epoca in cui il trasporto tra le città passava dalla diligenza trainata dai cavalli al treno a vapore, la ferrovia non poteva non colpire l’immaginazione. Padre Claret la usa come simbolo in tre momenti progressivi."],["54","***«Las Hijas del Corazón de María»*** (Le Figlie del Cuore di Maria), religiose in casa propria. Oggi sono le Missionarie della «Filiazione Cordimariana»."],["55","Opuscoli vari."]]}],"right":[{"ab":"310","t":"Uno dei mezzi che l’esperienza mi ha insegnato essere potentissimo per fare il bene è la stampa; la quale è del pari arma potentissima per il male quando di essa si abusa."},{"ab":"311","t":"Dico che oggi è una necessità, perché c’è un delirio per la lettura, e se non si hanno libri buoni, si leggeranno quelli cattivi."},{"ab":"312","t":"Vi è dunque oggi una doppia necessità di far circolare libri buoni; i quali però devono essere piccoli, perché la gente va in fretta, ed è attirata in mille maniere da ogni parte..."},{"ab":"313","t":"Il primo opuscolo che pubblicai fu quello che contiene alcuni Avvisi o consigli spirituali, scritto per le monache di Vic... Vedendo il buon risultato che dava il primo libretto, mi decisi a scrivere il secondo, che fu Avvisi alle Fanciulle. Poi scrissi quello dei Padri di famiglia, quello dei Bambini, quello dei Giovani..."},{"ab":"323","t":"Ringraziando Dio, tutti i miei opuscoli hanno prodotto buoni frutti. Ma quelli che hanno convertito più anime sono: **Il Cammino retto** e **Il Catechismo spiegato**... Tutti lo cercano e non si danno pace finché non lo hanno trovato."}]},{"left":[{"v":"J","r":[["56","***«Camino recto y seguro para llegar al cielo»*** (Cammino retto e sicuro per arrivare al cielo). Successione di edizioni in catalano e in castigliano."],["57","Edizioni in altre lingue: basco, portoghese, pangasinan (delle Filippine)."]]}],"right":[{"a":"«CAMINO RECTO Y SEGURO PARA LLEGAR AL CIELO» (in catalano «Camí dret i segur per arribar al cel») è stato il manuale di formazione alla pietà e alla vita cristiana più diffuso in Spagna. Le copie stampate si calcolano in circa due milioni."},{"a":"È l’opera più edita in lingua catalana, e con il maggior numero di copie in assoluto. L’edizione originale catalana uscì nel 1843 ed era un opuscolo di 48 pagine. Le edizioni si susseguirono rapidamente e, con i miglioramenti e le aggiunte di ciascuna, l’opera finì per raggiungere le 500 pagine. Alla fine del secolo se ne contavano 250 edizioni, per circa 800.000 copie."},{"a":"«EL CAMINO RECTO» fu pubblicato in lingua pangasinan, a Manila, nel 1884. L’esemplare esposto è una ristampa fatta in Cecoslovacchia."},{"a":"Sant’Antonio Maria Claret è l’unico autore catalano tradotto in lingue malesi (tagalog, visaya, ilocano, pangasinan)."}]},{"left":[{"v":"K","r":[["58","***«Catecismo explicado»***. Prime edizioni."],["59","Tavole del ***«Catecismo explicado»***."],["60","***«Maná del Cristiano»***."],["61","***«El santo evangelio de Nuestro Señor Jesucristo según san Mateo»***."],["62","***«La Santa Ley de Dios»***."],["63","***«Nuevo manojito de flores»***."],["64","***«La Llave de Oro»***."]]}],"right":[{"ab":"285","t":"Per l’amore che portavo ai bambini, e per il desiderio che fossero istruiti nella dottrina cristiana, ho scritto quattro catechismi: uno per i bambini fino a sette anni, uno per la gente semplice, un terzo più esteso e l’ultimo spiegato e illustrato con figure."},{"ab":"287","t":"Il catechismo agli adulti è il mezzo più proficuo che ho conosciuto. Con esso vengono liberati dalla loro ignoranza..."}]},{"left":[{"v":"L","r":[["65","***«El Colegial o seminarista instruído»***."],["66","***«La vocación de los niños»***."],["67","***«Colección de opúsculos»***."],["68","***«A la juventud estudiosa y cristiana»***. ***«La Colegiala Instruída»***."],["69","***«L’egoismo vinto»*** (una delle ultime opere)."],["70","Alcuni degli innumerevoli libri pubblicati dalla «Libreria Religiosa». Tra di essi spicca la Bibbia: un esemplare della terza edizione, con delle manine stampate che indicano i passi che Padre Claret riteneva più notevoli."],["71","«Ex libris» dell’Arcivescovo Claret. Vi è la dedica personale di un autore."]]}],"right":[{"ab":"329","t":"Per poter dare o vendere al minor prezzo possibile, ho pensato di fondare una Tipografia Religiosa sotto la protezione della Madonna di Montserrat..."},{"a":"Fondata nel dicembre 1848, la Libreria Religiosa pubblicò, mentre il suo fondatore era in vita, circa dieci milioni di stampati. La sua opera editoriale è giunta fino ai nostri giorni."},{"ab":"331","t":"Per mezzo della Libreria Religiosa ecclesiastici e secolari si sono provvisti e si stanno provvedendo di buoni libri, i migliori che si conoscono, e al prezzo più conveniente..."}]},{"left":[{"p":"**Pannello 14**","i":["Tavole del ***«Catecismo explicado»*** disegnate dal santo."]},{"v":"M","r":[["72","Scrittoio personale di Padre Claret."]]},{"p":"**Pannello 15**","i":["Lo scrittore missionario: fotografia scattata a Parigi nel 1868."]}],"right":[{"a":"L’altro libro è il CATECISMO DE LA DOCTRINA CRISTIANA EXPLICADO Y ADAPTADO A LA CAPACIDAD DE LOS NIÑOS, y adornado con muchas láminas, por el Rev. D. Antonio Claret, Presbítero (Catechismo della dottrina cristiana spiegato e adattato alla capacità dei bambini, ornato di molte tavole, del Rev. D. Antonio Claret, sacerdote)."},{"a":"L’originalità di quest’opera fu il suo metodo intuitivo, la pedagogia dell’immagine. In questo l’autore anticipava i tempi. La Libreria Religiosa ne pubblicò 170.000 copie in catalano e 145.000 in castigliano."},{"ab":"56","t":"Chi avrebbe detto che il disegno che imparavo per i tessuti, Dio lo destinava a servire alla Religione! Infatti mi servì poi molto per disegnare stampe del Catechismo e di argomenti mistici."}]}]},{"rom":"IV","title":"Fondatore dei Missionari Clarettiani","blocks":[{"left":[{"box":[null,"**Cella** in cui Padre Claret fondò la Congregazione dei Missionari Figli dell’Immacolato Cuore di Maria, il 16 luglio 1849. Era una semplice stanza da seminarista situata al terzo piano del seminario vecchio. La finestra dava sul cortile interno."]},{"sub":"***Gli elementi originali della cella sono:***"},{"o":[["73","La porta,"],["74","la finestra."],["75","Le travi e la pavimentazione."],["76","Le mattonelle del pavimento. Gli 87 centimetri di mattonelle accanto alla finestra provengono dalla cella che occupava il P. Esteve Sala, cofondatore."],["77","Il quadro del Cuore di Maria che presiedette la fondazione."],["78","Il tavolo e la sedia furono usati anche da Padre Claret nella casa di suo fratello Josep, a Olost de Lluçanès, o in altri momenti della sua vita."]]}],"right":[{"ab":"488","t":"Verso la metà di maggio arrivai a Barcellona e mi ritirai a Vic. Qui parlai con due amici, i canonici don Soler e don Passarell, del mio divisamento di formare una Congregazione di Sacerdoti che fossero e si chiamassero Figli dell’Immacolato Cuore di Maria."},{"ab":"489","t":"... io intanto parlai con alcuni sacerdoti, ai quali Dio aveva dato lo stesso spirito di cui ero io animato. Questi erano: Stefano Sala, Giuseppe Xifré, Domenico Fàbregas, Manuel Vilaró, Giacomo Clotet, Antonio Claret, io, l’infimo di tutti."},{"ab":"490","t":"Il giorno 16 luglio 1849, trovandoci riuniti, con l’approvazione del signor Vescovo e del signor Rettore, incominciammo i santi esercizi spirituali nel Seminario, noi soli, con gran rigore e fervore... Da quegli esercizi uscimmo tutti molto fervorosi, risoluti e decisi a perseverare; e, ringraziando Dio e Maria Santissima, tutti hanno perseverato benissimo."},{"a":"L’inizio degli esercizi spirituali, il 16 luglio alle tre del pomeriggio, nella cella di un seminarista, segnò la nascita della Congregazione clarettiana."}]},{"left":[{"p":"**Pannello 16**","i":["I cofondatori:"],"names":["***Sant’Antonio Maria Claret***","*Venerabile Jaume Clotet*","*Esteve Sala*","*Josep Xifré*","*Domènec Fàbregas*","*Manuel Vilaró*"]},{"o":[["80","**Orologio** della scala che segnava le ore nella zona del seminario dove ebbe luogo la fondazione. Le lancette segnano le tre del pomeriggio, ora in cui iniziò la fondazione."]]},{"p":"**Pannello 17**","i":["Definizione del Missionario Figlio del Cuore di Maria, redatta dal santo fondatore."]}],"right":[{"ab":"491","t":"Così cominciammo e così seguitammo, nella più stretta vita comune. Tutti si andava lavorando nel sacro ministero."},{"ab":"494","t":"Io dico a me stesso: un Figlio dell’Immacolato Cuore di Maria è un uomo che arde di carità e che brucia dovunque passa; che desidera efficacemente e procura con ogni mezzo di infiammare il mondo intero nel fuoco del divino amore. Nulla lo fa indietreggiare; gode nelle privazioni, affronta le fatiche, abbraccia i sacrifici; si compiace nelle calunnie e gioisce nei tormenti. Non pensa che a seguire e imitare Gesù Cristo nel lavorare, nel soffrire e nel procurare sempre e unicamente la maggior gloria di Dio e la salvezza delle anime.","caps":true}]}]},{"rom":"V","title":"La Casa Madre","blocks":[{"left":[{"v":"N","r":[["81","Plastico dell’antico convento della Mercede, che il vescovo di Vic cedette alla nuova comunità missionaria e che nell’ottobre 1849 divenne la Casa Madre della Congregazione dei Missionari Clarettiani. Fin dall’inizio fu anche Casa di Esercizi Spirituali per laici e sacerdoti."]]},{"p":"Pannello 18","s":"immagini retroilluminate al centro","i":["Intorno al plastico, fotografie di diversi momenti storici della Casa Madre di Vic:","Al tempo della fondazione.","Lavori di ristrutturazione degli anni 1928-1930, sotto la direzione del martire P. Jaume Girón.","Progetto di restauro della chiesa nel suo stile originale, gotico conventuale.","La distruzione del luglio 1936.","Oggi."]}],"right":[{"a":"Alcuni dati sul convento della Mercede di Vic:"},{"chron":[["1235","Il 19 novembre, Giacomo I fonda la casa mercedaria di Vic."],["1254","La fondazione diventa effettiva nell’attuale via di Sant Pere, dove oggi si trova l’ospedale di Vic."],["1264","I mercedari si trasferiscono nel luogo dove ora sorge la chiesa di San Domenico."],["1367","Comprano una casa nel luogo dove sorgerà in seguito il convento della Mercede."],["1383","Intorno a quest’anno è già iniziata la costruzione della chiesa della Mercede, in stile gotico conventuale."],["1580","Probabilmente viene edificato il chiostro."],["1620","Nella chiesa si costruiscono le volte barocche che sfigurano lo stile originale."],["1733","Si costruisce il nuovo portale della chiesa. La data che vi si leggeva era 1734."],["1835","I frati vengono espulsi dal paese."],["1849","Ottobre: i Missionari Clarettiani, fondati il 16 luglio dello stesso anno nel seminario vecchio, si trasferiscono nel convento dei mercedari."]]}]},{"left":[{"o":[["82","**Altare** della cappella della Casa di Esercizi della Mercede dove, fin dall’inizio, i missionari clarettiani esercitavano il ministero apostolico degli Esercizi Spirituali. Una tradizione che continua nell’attuale «Casa di Spiritualità Padre Claret» (Casa d’Espiritualitat Pare Claret), sulla Rambla de Sant Domènec, opera di Padre Lluís Pujol CMF, fondatore delle Missionarie dell’Istituzione Clarettiana."]]},{"v":"O","r":[["83","Statua della Madonna della Mercede benedetta dal santo. Proviene dal noviziato dei Padri Scolopi di Alella."],["84","Busto del Venerabile Jaume Clotet, cofondatore della Congregazione dei Missionari Clarettiani e primo biografo del santo. Opera di Josep Vilarrúbias CMF, 1990."],["85","**Lapide sepolcrale** di Padre Claret, che si trovava nell’antica chiesa della Mercede. Lo stemma, ripristinato, è opera di Jordi Pallàs."]]}],"right":[]},{"left":[{"box":[null,"**Cella** del terzo piano del seminario vecchio, che Padre Claret occupò nei primi mesi della fondazione. La finestra dava sulla via di Sant Hipòlit, oggi di Sant Miquel dels Sants."]},{"sub":"***Gli elementi originali della cella sono:***"},{"o":[["86","La porta,"],["87","la finestra,"],["88","Le travi e il pavimento. Gli 87 centimetri di mattonelle accanto alla finestra provengono dalla cella che occupava il P. Esteve Sala."],["89","L’asciugamano del portacatino è un oggetto che Padre Claret usò alcuni anni più tardi. *Il mobilio è una riproduzione, secondo la descrizione fatta da Padre Clotet nel racconto della fondazione.*"]]}],"right":[{"a":"In questa stanza Padre Claret visse una grande sofferenza e angoscia mentre discerneva la volontà di Dio: accettare la nomina ad arcivescovo o rinunciarvi, dato l’amplissimo campo di apostolato che aveva davanti. La nomina gli giunse in agosto ed egli la accettò solo il 4 ottobre. Da qui scrisse lettere dolorose al Vescovo, al Nunzio, al Ministero di Grazia e Giustizia..."},{"a":"Sant’Antonio Maria Claret fondò, oltre ai MISSIONARI CLARETTIANI e alle MISSIONARIE CLARETTIANE, altre istituzioni, come l’Accademia di San Michele, che oggi si rispecchia nel MOVIMENTO DEI LAICI CLARETTIANI, e le Religiose in casa propria, attualmente Istituto Secolare FILIAZIONE CORDIMARIANA."}]}]},{"rom":"VI","title":"Vescovo missionario","blocks":[{"left":[{"v":"P","r":[["90","**Bolla pontificia** di papa Pio IX con cui Padre Claret viene nominato arcivescovo di Santiago di Cuba."]]},{"p":"**Pannello 19**","i":["La prima reazione di Padre Claret di fronte alla nomina."]},{"v":"Q","r":[["91","Amitto dell’Arcivescovo Claret."],["92","Cotta."],["93","Due libri di quel periodo della vita del santo: ***«Apuntes del Arzobispo Claret»*** (Appunti dell’Arcivescovo Claret), che egli stesso redasse a uso personale nel governo della diocesi e che furono pubblicati in seguito; ***«Las delicias del Campo»*** (Le delizie della campagna), per la promozione dei contadini."],["94","Corporali con cui celebrava l’Eucaristia."],["95","Nastro-misura della Madonna della Carità del Cobre, patrona della diocesi di Santiago di Cuba. La sua lunghezza corrisponde all’altezza della statua della Vergine del Cobre."],["96","Oggetti personali: rasoio, cote, coltelli pieghevoli, forbici."]]},{"v":"R","r":[["97","Mitra dell’Arcivescovo Claret."],["98","Croce pettorale e anello episcopale."]]}],"right":[{"ab":"491","t":"...quand’ecco che l’11 agosto, scendendo dal pulpito dopo aver concluso l’ultimo atto, Mons. Vescovo mi fece chiamare in Vescovado; e, appena arrivato, mi consegnò la nomina reale, datata 4 agosto, all’arcivescovato di Cuba."},{"ab":"495","t":"Spaventato dalla nomina, non volli accettare, considerandomi indegno e incapace di sì grande dignità, per non avere né la scienza né le virtù necessarie... e pur se avessi avuto scienza e virtù, non dovevo abbandonare la Libreria Religiosa e la Congregazione, che erano appena nate."},{"ab":"538","t":"Durante i primi due anni, nonostante i terremoti e il colera, visitammo tutte le parrocchie dell’Arcidiocesi. In tutte si fece la missione o da me o dai miei collaboratori; e nelle parrocchie rurali, che sono tanto estese, più di una."},{"ab":"547","t":"La prima lettera pastorale che scrissi e firmai fu quella del 20 settembre 1852. Era diretta al clero."},{"ab":"549","t":"La seconda lettera pastorale la diressi al popolo il 25 marzo del 1853, ricordando in essa quello che avevamo insegnato nelle Missioni e nella Visita pastorale."},{"ab":"555","t":"Riparai il Seminario Conciliare. Erano passati più di trent’anni senza che un seminarista interno arrivasse agli Ordini sacri."},{"ab":"563","t":"Per i poveri comprai una fattoria nella città di Puerto Príncipe."},{"ab":"564","t":"L’obiettivo di quest’opera era di raccogliere i fanciulli e le fanciulle poveri, ché molti si perdono per le vie a chiedere l’elemosina. Lì si doveva provvedere a dar loro da mangiare, vestirli, insegnare la Religione, leggere, scrivere, ecc. e poi qualche arte o mestiere, quello che volevano."},{"ab":"566","t":"Nella parte della facciata dello stabile, dove stavano i fanciulli, doveva esserci un gabinetto di fisica e strumenti di agricoltura, un laboratorio di chimica e una biblioteca. Alla biblioteca dovevano poter entrare tutti, due ore la mattina e due ore il pomeriggio; la lezione di agricoltura, tre giorni alla settimana, era per tutti quelli che volessero assistervi. Il resto era per gli interni."},{"ab":"568","t":"Mentre questa fondazione faceva i suoi primi passi, scrissi un opuscolo intitolato *Delizie del Campo*, che contiene in embrione la Casa di Beneficenza già iniziata. Questa operetta *Delizie del Campo* è stata di grande utilità in quell’isola, tanto che i padroni delle fattorie la consegnavano ai loro fattori perché si regolassero secondo essa."},{"ab":"569","t":"Introdussi nella diocesi anche la Cassa di Risparmio, il cui regolamento è contenuto nella predetta opera, a utilità e moralizzazione dei poveri, perché vedevo che i poveri, se sono bene indirizzati e si offre loro un modo decoroso di guadagnarsi la vita, sono uomini virtuosi."},{"ab":"561","t":"Fondai un convento di monache per l’insegnamento alle bambine, e comprai per esse una casa..."},{"a":"Si riferisce alle religiose dell’Insegnamento di Maria Immacolata, che fondò a Cuba insieme a Madre Antonia París e che in seguito presero il nome di CLARETTIANE."},{"ab":"570","t":"Anche i carcerati visitavo nelle carceri, li catechizzavo e predicavo loro con frequenza... Si procurava che i carcerati imparassero nel carcere a leggere, scrivere, la Religione e qualche mestiere. Per questo mettemmo nel carcere una serie di laboratori..."}]},{"left":[{"v":"S","r":[["99","Cuscino macchiato del sangue dell’arcivescovo dopo l’attentato subito nella città di Holguín, a Cuba, il 1° febbraio 1856."]]}],"right":[{"ab":"575","t":"Si avvicinò un uomo come per baciarmi l’anello; ma ecco che allunga il braccio armato di un rasoio e vibra un colpo con tutta la sua forza."},{"ab":"577","t":"Non mi è possibile spiegare il piacere, la gioia e l’allegrezza che provava l’anima mia, al vedere che avevo ottenuto quello che tanto desideravo, cioè versare il sangue per amore di Gesù e di Maria, e poter sigillare con il sangue delle mie vene le verità evangeliche."}]},{"left":[{"p":"**Pannello 20**","i":["Santa GIOACCHINA DE VEDRUNA, fondatrice delle Carmelitane della Carità. Vic.","Venerabile MARIA ANTONIA PARÍS, che insieme all’Arcivescovo Claret fondò la Congregazione delle Religiose di Maria Immacolata (Missionarie Clarettiane).","Santa MARIA MICHELA DEL SANTISSIMO SACRAMENTO, fondatrice delle Religiose Adoratrici. Madrid.","San FRANCESCO COLL, OP, fondatore delle Domenicane dell’Annunziata.","San PIETRO ALMATÓ, domenicano, che Padre Claret aiutò nel discernimento vocazionale."]},{"p":"**Pannello 21**","i":["Quadro dell’Arcivescovo di Cuba, realizzato con ritagli di indumenti usati dallo stesso Padre Claret. Opera eseguita da alcune Missionarie Clarettiane di Cuba quando il santo era ancora in vita."]}],"right":[{"h":"**Consigliere spirituale di fondatori:**"},{"a":"Sant’Antonio Maria Claret prese parte attiva all’animazione spirituale e apostolica di uomini e donne di Chiesa, santi e fondatori di diverse congregazioni religiose."}]},{"left":[{"p":"**Pannello 22**","i":["Diploma dell’Accademia di San Michele, disegnato e firmato dall’Arcivescovo Claret."]}],"right":[{"ab":"581","t":"Il terzo fu l’idea dell’Accademia di San Michele, che mi venne nei primi giorni in cui stavo a letto; e appena mi potei alzare, incominciai subito a disegnare l’immagine e a scrivere il regolamento..."},{"a":"L’Accademia di San Michele fu una delle grandi intuizioni pastorali ed ecclesiali di Padre Claret: la presenza attiva dei laici nella Chiesa, chiamati all’apostolato a partire dalle diverse professioni laicali: intellettuali, artisti, scrittori, musicisti..."}]}]},{"rom":"VII","title":"Confessore reale","blocks":[{"left":[{"p":null,"i":["(Sullo stesso pannello 22) Lettera in cui l’Arcivescovo Claret, ormai da Madrid, si congeda dalla Chiesa di Cuba."]},{"v":"T","r":[["100","Pianeta dell’oratorio privato delle sorelle Bertrana i Forcada di Vic, con la quale il P. Claret celebrò la Messa il 26 agosto 1865."]]}],"right":[{"ab":"587","t":"Erano passati alcuni giorni di quella missione, quando ricevetti un Ordine reale che mi chiamava a Madrid; era infatti morto l’arcivescovo di Toledo, confessore di Sua Maestà, e la Regina aveva scelto me."},{"ab":"588","t":"L’Ordine reale mi raggiunse il 18 marzo; e il 22 dello stesso mese lasciavo Santiago alla volta dell’Avana, dove mi imbarcai su un vapore postale che partiva per Cadice."},{"ab":"621","t":"Qualche volta ho detto che Dio mi ha mandato qui come al mio purgatorio, perché purghi e paghi i peccati della mia vita passata... Sto sempre sospirando di andarmene. Sono come un uccello in gabbia, che va tastando le sbarre per vedere se può scappare; così io vado almanaccando su come uscirne."}]},{"left":[{"v":"U","r":[["101","Posate con le iniziali A C (Antonio Claret), donate dalla regina Isabella II all’Arcivescovo."],["102","Medaglia dell’Immacolata: felicitazione a Maria per la sua Immacolata Concezione."],["103","Medaglia di san Benedetto."],["104","Medaglia di san Giovanni di Dio."],["105","Medaglia commemorativa del XVIII centenario del martirio degli apostoli san Pietro e san Paolo."],["106","Medaglia della Cappella della Madonna di Montserrat di Madrid."],["107","Croce portapace."],["108 al 111","Croci benedette, portate o regalate dal santo."],["112","Cartellino numerato della biancheria dell’Arcivescovo."],["113","Fotografia originale, degli ultimi anni della sua vita."],["114","Biglietto da visita."],["115 al 117","Fotografie degli ultimi tempi della sua vita, scattate a Madrid e a Parigi."],["118","Raffigurazioni sarcastiche dell’arcivescovo confessore della Regina, su scatole di fiammiferi (copie per gentile concessione del Museo Marès di Barcellona)."],["119","Allusione caricaturale al P. Claret come confessore reale, in una «auca» (foglio illustrato popolare) sulla rivoluzione del 1868."]]}],"right":[{"ab":"638","t":"...provo una santa emulazione e quasi invidia per i Missionari che hanno la fortuna di poter andare da un paese all’altro predicando il santo Vangelo."},{"a":"Padre Claret trasformò in una missione gigantesca i viaggi che dovette compiere con la famiglia reale. Città e paesi di tutte le regioni della Spagna furono testimoni dell’incessante azione apostolica di Claret verso ogni genere di persone."},{"ab":"639","t":"In mezzo a tante pene ho però anche qualche consolazione. Quando con le Loro Maestà e Altezze ci mettiamo in viaggio, mi si offre l’occasione di predicare al popolo la mattina, prima che le Loro Maestà escano di casa. Dopo vado predicando nei conventi a monache, suore, sacerdoti, studenti, signori e signore delle Conferenze, ecc. ecc., di modo che passo tutto il giorno predicando."},{"ab":"640","t":"Una delle cose di cui più mi sono occupato da quando sono a Madrid è lo scrivere libri e fogli volanti."},{"ab":"798","t":"Quest’anno sono stato molto calunniato e perseguitato da ogni genere di persone, per mezzo di giornali, opuscoli, libri contraffatti, fotografie e molte altre cose..."},{"a":"Nel giornale madrileno «LA ESPERANZA» del 24 gennaio 1865 leggiamo: *«Varie volte gli amici hanno suggerito al signor Claret di difendersi, ma egli ha sempre risposto che la migliore difesa era non farci caso e, al tempo stesso, pregare Dio per loro, come fece Gesù dalla croce...»* (Citato in Aut. 867)"}]}]},{"rom":"VIII","title":"Il passaggio alla Casa del Padre","blocks":[{"left":[{"p":"**Pannello 23**","i":["Veduta generale del monastero cistercense di Fontfroide, in Linguadoca, dove Padre Claret morì in esilio il 24 ottobre 1870."]},{"v":"V","r":[["120","Crocifisso che accompagnò l’agonia di Padre Claret. La comunità cistercense di Fontfroide ne fece dono alla Congregazione clarettiana."]]}],"right":[{"a":"Negli ultimi mesi della sua vita l’Arcivescovo Claret prende parte attiva al Concilio Vaticano I."},{"a":"Esiliato e perseguitato, si ritira nel monastero cistercense di Fontfroide, nel sud della Francia, dove la sua salute si aggrava ed egli muore santamente, assistito da un gruppo di missionari clarettiani e da monaci del monastero."},{"a":"Il Venerabile Padre Clotet, testimone di quei fatti e primo biografo del santo, scrisse: «La pace, la gioia e il fervore che mostrò durante la sua ultima malattia furono ammirevoli: non si stancava di baciare il crocifisso e di fare ferventi giaculatorie."},{"a":"Con una pace inalterabile, e con il Crocifisso tra le mani, il 24 ottobre, alle 8.45 del mattino, consegnò serenamente la sua anima al Signore»."},{"a":"Sulla lapide sepolcrale dell’arcivescovo Claret nel monastero di Fontfroide si leggevano le ultime parole di san Gregorio VII:"},{"epi":["**HO AMATO LA GIUSTIZIA E ODIATO L’INIQUITÀ,**","**PERCIÒ MUOIO IN ESILIO.**"]}]},{"left":[{"p":"**Pannello 24**","i":[]},{"o":[["121","Ricami con gli stemmi dell’Arcivescovo Claret e della Congregazione dei Missionari Figli del Cuore di Maria, che ornavano la cassa nella solenne traslazione del corpo di Padre Claret da Fontfroide a Vic nel 1897."]]}],"right":[{"a":"Il 13 giugno 1897 i venerati resti del santo furono traslati da Fontfroide a Vic. L’entusiasmo nei paesi attraversati fu indescrivibile, soprattutto a Vic."}]},{"left":[{"v":"X","r":[["122","Cassa di legno in cui il signor Miquel Bantulà di Vic nascose, in casa sua, le venerate spoglie di Padre Claret durante la guerra civile spagnola (1936-1939)."],["123","Verbale del deposito dei resti mortali, messi al sicuro il 20 luglio 1936. Il giorno dopo, 21 luglio, la chiesa della Mercede veniva incendiata."],["124","Lettera del P. Pere Bertrans, custode del corpo del santo, indirizzata al P. Generale dei Clarettiani subito dopo essere scampato alla morte (gli spararono perché si rifiutava di rivelare il luogo in cui era nascosto il corpo del santo). Scritta il 15 agosto 1936, in ginocchio, in mezzo a un campo di granturco."],["125","Tessera di iscrizione alla UGT del P. Bertrans."],["126","Vita del P. Claret, ritrovata a Tona, trafitta da coltellate durante la rivolta del 1936."]]}],"right":[{"a":"I sette sepolcri di Padre Claret:"},{"chron":[["1","FONTFROIDE (Linguadoca, Francia). Dal 1870 al 1897."],["2","VIC: Cappella del Santissimo della chiesa della Mercede. Dal 1897 al 1932."],["3","SANTA EUGÈNIA DE BERGA. Dal 1932 al 1934."],["4","VIC: Altare maggiore della chiesa della Mercede. Dal 1934 al 1936."],["5","VIC / CASA BANTULÀ, via di Sant Miquel dels Sants. Dal 1936 al 1939."],["6","VIC: cappella provvisoria al pianterreno del convento dove oggi si trova il Museo Clarettiano. Dal 1939 al 1970."],["7","VIC: attuale Tempio-Sepolcro, dal 1970, primo centenario della morte del santo."]]}]}]}]};

};
const t=()=>T[LANG];
const pN=n=>t().plafN?t().plafN(n):t().plafon+' '+n, vN=v=>t().vitN?t().vitN(v):t().vitrina+' '+v;

/* ---------- text helpers ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){
  s=esc(String(s).replace(/'/g,'’'));
  return s.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
}
const plain=s=>String(s).replace(/\*/g,'');

/* ---------- index ---------- */
let STAGES, OBJ, PLAF, VIT;
function buildIndex(){
  STAGES=DATA[LANG]; OBJ=[]; PLAF={}; VIT={};
  STAGES.forEach((st,si)=>st.blocks.forEach((b,bi)=>{
    b.left.forEach(el=>{
      if(el.v){VIT[el.v]={si,bi};el.r.forEach(r=>{ if(r[1]) OBJ.push(mkObj(r,si,bi,el.v)); });}
      if(el.o) el.o.forEach(r=>{ if(r[1]) OBJ.push(mkObj(r,si,bi,null)); });
      if(el.p){const n=+el.p.replace(/\D/g,''); PLAF[n]={n,si,bi,el};}
    });
  }));
  OBJ.forEach((o,i)=>o.i=i);
}
function mkObj(r,si,bi,v){const m=r[0].match(/\d+/g).map(Number);return {label:r[0],lo:m[0],hi:m[m.length-1],text:r[1],si,bi,v,id:'o-'+m[0]};}
const findObj=n=>OBJ.find(o=>n>=o.lo&&n<=o.hi);
const lbl=s=>s.replace(/ al /,'–');

/* ---------- renderers ---------- */
const main=document.getElementById('main');
function numBox(label,cls=''){return `<span class="num ${label.length>4?'wide':''} ${cls}" aria-hidden="true">${esc(lbl(label))}</span>`}
function renderLeft(el){
  let h='';
  if(el.h) h+=`<h3 class="subhead">${md(el.h)}</h3>`;
  if(el.t) h+=`<p class="prose">${md(el.t)}</p>`;
  if(el.q) h+=`<p class="quote">${md(el.q)}</p>`;
  if(el.sym){h+=`<h3 class="subhead">${t().symb}</h3><div class="sym">`+el.sym.map(r=>`<div>${md(r[0])}</div><div>${md(r[1])}</div>`).join('')+`</div>`;}
  if('p' in el){
    if(el.p){const n=el.p.replace(/\D/g,'');h+=`<div class="plafon" id="p-${n}"><h3><span class="pnum">${n}</span>${pN(n)}${el.s?` <span class="sub">${esc(el.s)}</span>`:''}</h3>`}
    else h+=`<div class="plafon">`;
    if(el.i.length) h+='<ul>'+el.i.map(x=>`<li>${md(x)}</li>`).join('')+'</ul>';
    if(el.names) h+='<ul class="names">'+el.names.map(n=>`<li>${esc(n)}</li>`).join('')+'</ul>';
    h+='</div>';
  }
  if(el.v){h+=`<div class="vit" id="v-${el.v}"><span class="vl">${el.v}</span><h3>${vN(el.v)}</h3></div>`+objList(el.r);}
  if(el.o){h+=objList(el.o);}
  if(el.n) h+=`<p class="gapnote">${t().gap(el.n.replace(/[()]/g,''))}</p>`;
  if(el.sub) h+=`<p class="subhead">${md(el.sub)}</p>`;
  if(el.box){const [hd,...ps]=el.box;h+=`<div class="box">${hd?`<h4>${esc(hd)}</h4>`:''}${ps.map(p=>`<p>${md(p)}</p>`).join('')}</div>`;}
  return h;
}
function objList(rows){
  return '<ul class="objs">'+rows.map(r=>{
    if(!r[1]) return `<li><p class="gapnote">${t().gap(r[0].replace(/[()]/g,''))}</p></li>`;
    const o=OBJ.find(x=>x.label===r[0]&&x.text===r[1]);
    return `<li><button class="obj" id="${o.id}" data-o="${o.i}">${numBox(r[0])}<span>${md(r[1])}</span></button></li>`;
  }).join('')+'</ul>';
}
function renderRight(els){
  let h='';
  els.forEach(el=>{

 iberica, il 16 luglio fonda la *Congregazione dei Figli del Cuore Immacolato di Maria* (*Missionari Clarettiani*).", ["p:16", "p:17", "o:73", "o:77", "o:80", "o:81", "a:488", "a:489", "a:490", "a:494"]], ["1850", "Viene consacrato arcivescovo di Santiago de Cuba, dove rimane quasi sette anni.", ["o:32", "o:90", "p:19", "o:97", "o:98", "a:495"]], ["1855", "Con M. Antonia París fonda la *Congregazione delle Religiose di Maria Immacolata per l'Insegnamento* (*Missionarie Clarettiane*).", ["p:20", "a:561"]], ["1856", "Il 1° febbraio subisce un grave attentato a Holguín.", ["o:99", "a:575", "a:577"]], ["1857", "La regina Isabella II lo chiama a Madrid e lo nomina suo confessore. Percorre tutta la Spagna predicando al popolo, ai sacerdoti e alle religiose. Scrive numerosi libri.", ["p:22", "o:101", "a:587", "a:588", "a:621"]], ["1858", "Fonda l'*Accademia di San Michele*, associazione apostolica laicale per evangelizzare la cultura.", ["p:22", "a:581"]], ["1859", "Isabella II lo nomina presidente del Real Monastero dell'Escorial, dove fonda un collegio, un seminario, un'università e una società di cappellani.", []], ["1861", "Il 26 agosto, nella chiesa del Rosario, alla Granja (Segovia), riceve la *grazia grande* della conservazione delle specie sacramentali.", []], ["1862", "Comincia a redigere la sua *Autobiografia*.", ["p:12", "o:35"]], ["1864", "Fonda le *Biblioteche popolari e parrocchiali*, il cui libro fondazionale è il germe del movimento dei *Secolari Clarettiani*.", []], ["1868", "Parte per l'esilio in Francia al seguito della regina Isabella II. A Parigi assiste gli emigranti e fonda un'associazione benefica per i più poveri.", ["p:15", "o:115", "o:118", "o:119"]], ["1869", "Giunge a Roma per partecipare al Concilio Vaticano I.", []], ["1870", "Si reca a Prades (Francia) per riunirsi ai suoi missionari esiliati; deve però rifugiarsi nel monastero cistercense di Fontfroide, dove muore il 24 ottobre.", ["p:23", "o:120"]], ["1897", "I suoi resti vengono traslati nella *Casa Madre* di Vic.", ["o:121"]], ["1934", "Il 25 febbraio viene beatificato da Pio XI.", ["p:8"]], ["1950", "Il 7 maggio viene canonizzato da Pio XII.", []]], "fr": [["1807", "Il naît à Sallent (Barcelone, Espagne) dans une famille de tisserands profondément croyante. Il est le cinquième de onze enfants.", ["p:1", "p:3", "p:4", "o:2", "a:3"]], ["1819", "À 12 ans, il ressent l'appel au sacerdoce, mais ne peut entrer au séminaire. Il commence à travailler dans l'atelier textile familial.", ["p:2", "a:31"]], ["1825", "À 18 ans, il part pour Barcelone afin de se perfectionner dans l'industrie textile. Il étudie à la Lonja et travaille dans un atelier.", ["p:5", "o:3", "o:4", "o:5", "o:6", "a:56", "a:58"]], ["1829", "Il entre au séminaire de Vic. Il renonce à l'idée de devenir moine chartreux.", ["p:6", "p:7", "p:8", "p:9", "o:9", "a:68", "a:82", "a:83", "a:84", "a:95"]], ["1835", "Il est ordonné prêtre à Solsona (Lleida). Il est envoyé dans sa paroisse natale, d'abord comme vicaire, puis comme administrateur (curé).", []], ["1839", "Il part pour Rome afin de s'offrir à la mission universelle. Il s'adresse à la *Propaganda Fide*, sans succès. Il entre au noviciat de la Compagnie de Jésus.", []], ["1840", "Il rentre en Espagne. Il est envoyé à la paroisse de Viladrau (Barcelone). Il commence les missions populaires.", ["p:10", "o:10", "a:170", "a:171", "a:172"]], ["1841", "Il s'installe à Vic, d'où il prêche dans toute la Catalogne. Il reçoit du Saint-Siège le titre de *Missionnaire apostolique*.", ["p:11", "p:12", "v:B", "a:193", "a:460", "a:297", "a:221"]], ["1843", "Il écrit le livre de dévotion *Camí dret i segur per arribar al cel* (en castillan *Camino recto*), la première de ses publications et le livre religieux le plus lu en Espagne au XIX<sup>e</sup> siècle.", ["v:J"]], ["1848", "Il part pour les îles Canaries, où il prêche pendant plus d'un an. Il fonde à Barcelone la *Libreria Religiosa* avec l'abbé José Caixal. Il écrit le petit ouvrage *Religiosas en sus casas*, germe de l'Institut séculier *Filiation cordimariale*.", ["o:33", "o:54", "o:70", "a:480", "a:481", "a:329", "a:331"]], ["1849", "De retour dans la péninsule Ibérique, il fonde le 16 juillet la *Congrégation des Fils du Cœur Immaculé de Marie* (*Missionnaires Clarétains*).", ["p:16", "p:17", "o:73", "o:77", "o:80", "o:81", "a:488", "a:489", "a:490", "a:494"]], ["1850", "Il est sacré archevêque de Santiago de Cuba, où il demeure près de sept ans.", ["o:32", "o:90", "p:19", "o:97", "o:98", "a:495"]], ["1855", "Avec Mère Antonia París, il fonde la *Congrégation des Religieuses de Marie-Immaculée pour l'enseignement* (*Missionnaires Clarétaines*).", ["p:20", "a:561"]], ["1856", "Le 1<sup>er</sup> février, il est victime d'un grave attentat à Holguín.", ["o:99", "a:575", "a:577"]], ["1857", "La reine Isabelle II l'appelle à Madrid et le nomme son confesseur. Il parcourt toute l'Espagne en prêchant au peuple, aux prêtres et aux religieuses. Il écrit de nombreux livres.", ["p:22", "o:101", "a:587", "a:588", "a:621"]], ["1858", "Il fonde l'*Académie de Saint-Michel*, association apostolique laïque pour évangéliser la culture.", ["p:22", "a:581"]], ["1859", "Isabelle II le nomme président du monastère royal de l'Escurial, où il fonde un collège, un séminaire, une université et une société de chapelains.", []], ["1861", "Le 26 août, en l'église du Rosaire, à la Granja (Ségovie), il reçoit la *grande grâce* de conserver en lui les espèces sacramentelles.", []], ["1862", "Il commence à rédiger son *Autobiographie*.", ["p:12", "o:35"]], ["1864", "Il fonde les *Bibliothèques populaires et paroissiales*, dont le livre fondateur est le germe du mouvement des *Laïcs Clarétains*.", []], ["1868", "Il part en exil en France, accompagnant la reine Isabelle II. À Paris, il prend soin des émigrés et fonde une association de bienfaisance pour les plus pauvres.", ["p:15", "o:115", "o:118", "o:119"]], ["1869", "Il arrive à Rome pour participer au concile Vatican I.", []], ["1870", "Il se rend à Prades (France) pour rejoindre ses missionnaires exilés ; il doit cependant se réfugier à l'abbaye cistercienne de Fontfroide, où il meurt le 24 octobre.", ["p:23", "o:120"]], ["1897", "Ses restes sont transférés à la *Maison mère* de Vic.", ["o:121"]], ["1934", "Le 25 février, il est béatifié par Pie XI.", ["p:8"]], ["1950", "Le 7 mai, il est canonisé par Pie XII.", []]], "eu": [["1807", "Sallenten (Bartzelona, Espainia) jaiotzen da, ehule-familia oso erlijioso batean. Hamaika anai-arrebetatik bosgarrena da.", ["p:1", "p:3", "p:4", "o:2", "a:3"]], ["1819", "12 urte zituela apaiz-bokazioa sentitzen du, baina ezin da seminarioan sartu. Familiaren ehun-lantegian lanean hasten da.", ["p:2", "a:31"]], ["1825", "18 urte zituela Bartzelonara joaten da ehungintzan trebatzeko. Llotja eskolan ikasten du eta lantegi batean egiten du lan.", ["p:5", "o:3", "o:4", "o:5", "o:6", "a:56", "a:58"]], ["1829", "Vic-eko Seminarioan sartzen da. Kartusiar monje izateko asmoa baztertzen du.", ["p:6", "p:7", "p:8", "p:9", "o:9", "a:68", "a:82", "a:83", "a:84", "a:95"]], ["1835", "Solsonan (Lleida) apaiz ordenatzen dute. Bere jaioterriko parrokiara bidaltzen dute, lehenik bikario eta gero ekonomo (parroko) gisa.", []], ["1839", "Erromara joaten da misio unibertsalerako bere burua eskaintzera. *Propaganda Fide*-n saiatzen da, baina ez du lortzen. Jesusen Lagundiaren nobiziotegian sartzen da.", []], ["1840", "Espainiara itzultzen da. Viladrauko (Bartzelona) parrokiara bidaltzen dute. Herri-misioak ematen hasten da.", ["p:10", "o:10", "a:170", "a:171", "a:172"]], ["1841", "Vic-era aldatzen da, eta handik Katalunia osoan predikatzen du. Egoitza Santuak *Misiolari Apostoliko* titulua ematen dio.", ["p:11", "p:12", "v:B", "a:193", "a:460", "a:297", "a:221"]], ["1843", "*Camí dret i segur per arribar al cel* (gaztelaniaz, *Camino recto*) debozio-liburua idazten du: bere argitalpenetatik lehena, eta XIX. mendean Espainian gehien irakurri zen liburu erlijiosoa.", ["v:J"]], ["1848", txiroenentzako ongintza-elkarte bat sortzen du.", ["p:15", "o:115", "o:118", "o:119"]], ["1869", "Erromara iristen da Vatikanoko I. Kontzilioan parte hartzeko.", []], ["1870", "Pradesera (Frantzia) joaten da bere misiolari erbesteratuekin elkartzeko; hala ere, Fontfroideko monasterio zistertarrean babesa hartu behar du, eta han hiltzen da urriaren 24an.", ["p:23", "o:120"]], ["1897", "Haren gorpuzkiak Vic-eko *jaiotetxera* eramaten dituzte.", ["o:121"]], ["1934", "Otsailaren 25ean Pio XI.ak dohatsu izendatzen du.", ["p:8"]], ["1950", "Maiatzaren 7an Pio XII.ak santu izendatzen du.", []]], "en": [["1807", "He is born in Sallent (Barcelona, Spain) into a deeply religious family of weavers, the fifth of eleven children.", ["p:1", "p:3", "p:4", "o:2", "a:3"]], ["1819", "At the age of 12 he feels called to the priesthood, but is unable to enter the seminary. He begins working in the family textile workshop.", ["p:2", "a:31"]], ["1825", "At 18 he moves to Barcelona to perfect his skills in the textile industry. He studies at the Llotja school and works in a workshop.", ["p:5", "o:3", "o:4", "o:5", "o:6", "a:56", "a:58"]], ["1829", "He enters the Seminary of Vic and gives up the idea of becoming a Carthusian monk.", ["p:6", "p:7", "p:8", "p:9", "o:9", "a:68", "a:82", "a:83", "a:84", "a:95"]], ["1835", "He is ordained a priest in Solsona (Lleida) and assigned to his home parish, first as curate and then as administrator (parish priest).", []], ["1839", "He goes to Rome to offer himself for the universal mission. He approaches *Propaganda Fide*, without success. He enters the novitiate of the Society of Jesus.", []], ["1840", "He returns to Spain and is sent to the parish of Viladrau (Barcelona). He begins preaching popular missions.", ["p:10", "o:10", "a:170", "a:171", "a:172"]], ["1841", "He moves to Vic, from where he preaches throughout Catalonia. The Holy See grants him the title of *Apostolic Missionary*.", ["p:11", "p:12", "v:B", "a:193", "a:460", "a:297", "a:221"]], ["1843", "He writes the prayer book *Camí dret i segur per arribar al cel* (*Camino recto* in Spanish), the first of his publications and the most widely read religious book in nineteenth-century Spain.", ["v:J"]], ["1848", "He goes to the Canary Islands, where he preaches for over a year. In Barcelona he founds the *Librería Religiosa* (a religious publishing house) with Fr José Caixal. He writes the booklet *Religiosas en sus casas*, the seed of the Secular Institute *Cordimarian Filiation*.", ["o:33", "o:54", "o:70", "a:480", "a:481", "a:329", "a:331"]], ["1849", "Back in mainland Spain, on 16 July he founds the *Congregation of the Sons of the Immaculate Heart of Mary* (*Claretian Missionaries*).", ["p:16", "p:17", "o:73", "o:77", "o:80", "o:81", "a:488", "a:489", "a:490", "a:494"]], ["1850", "He is consecrated Archbishop of Santiago de Cuba, where he remains for almost seven years.", ["o:32", "o:90", "p:19", "o:97", "o:98", "a:495"]], ["1855", "With Mother Antonia París, he founds the *Congregation of the Religious of Mary Immaculate for Teaching* (*Claretian Missionary Sisters*).", ["p:20", "a:561"]], ["1856", "On 1 February he is the victim of a serious assassination attempt in Holguín.", ["o:99", "a:575", "a:577"]], ["1857", "Queen Isabella II summons him to Madrid and appoints him her confessor. He travels throughout Spain preaching to the people, to priests and to women religious. He writes numerous books.", ["p:22", "o:101", "a:587", "a:588", "a:621"]], ["1858", "He founds the *Academy of Saint Michael*, a lay apostolic association for the evangelization of culture.", ["p:22", "a:581"]], ["1859", "Isabella II appoints him President of the Royal Monastery of El Escorial, where he founds a college, a seminary, a university and a society of chaplains.", []], ["1861", "On 26 August, in the church of the Rosary at La Granja (Segovia), he receives the *great grace* of the conservation of the sacramental species.", []], ["1862", "He begins writing his *Autobiography*.", ["p:12", "o:35"]], ["1864", "He founds the *Popular and Parish Libraries*, whose founding book is the seed of the *Lay Claretians* movement.", []], ["1868", "He goes into exile in France with Queen Isabella II. In Paris he ministers to emigrants and founds a charitable association for the poorest.", ["p:15", "o:115", "o:118", "o:119"]], ["1869", "He arrives in Rome to take part in the First Vatican Council.", []], ["1870", "He travels to Prades (France) to join his exiled missionaries; however, he is forced to take refuge in the Cistercian monastery of Fontfroide, where he dies on 24 October.", ["p:23", "o:120"]], ["1897", "His remains are transferred to the *Mother House* in Vic.", ["o:121"]], ["1934", "On 25 February he is beatified by Pius XI.", ["p:8"]], ["1950", "On 7 May he is canonized by Pius XII.", []]]};

const INFO={
 es:()=>`<h1 style="font-size:1.8rem">La visita</h1>
  <p>Deseamos que su visita al Museo Claretiano de Vic signifique un contacto vivo con la persona de Claret, que dejó una huella tan profunda en la Iglesia y en nuestra tierra.</p>
  <h2 class="sec">Se ruega, por favor</h2>
  <ul class="rules"><li>Guardar silencio.</li><li>No poner las manos sobre las vitrinas ni sobre los objetos.</li></ul>
  <h2 class="sec">Cómo leer la sala</h2>
  ${legend('Las <strong>vitrinas</strong> se identifican por una letra mayúscula.','Los <strong>objetos</strong> llevan números blancos sobre fondo negro. Los que están fuera de las vitrinas siguen la misma numeración, en tipos de mayor tamaño.','Los <strong>plafones</strong> murales de fotografías y cuadros llevan números negros sobre fondo blanco.')}
  <p>En esta guía, junto a cada grupo de objetos, encontrará el <strong>testimonio autobiográfico</strong>: fragmentos de la <em>Autobiografía</em> de san Antonio María Claret, en cursiva y con su numeración oficial, y algunas anotaciones complementarias.</p>
  <h2 class="sec">Entrada y donativos</h2>
  <p>La visita al museo es gratuita. Si desea colaborar en los gastos de mantenimiento, puede dejar su donativo en el buzón de ofrendas de la salida.</p>
  <p class="note">Misioneros Claretianos, Casa Madre. C/ Sant Antoni Maria Claret, 8, 08500 Vic. Datos tomados de la guía impresa del museo: conviene confirmar horarios y condiciones actuales antes de la visita.</p>
  <h2 class="sec">Esta guía</h2>
  <p class="sans" style="font-size:.9rem">Está en castellano, catalán, euskera, francés, inglés e italiano: el botón <strong>ES</strong>, arriba, permite cambiar de idioma. Funciona sin conexión una vez abierta. El botón <strong>Aa</strong> cambia el tamaño de la letra y <strong>Escuchar</strong> lee en voz alta los testimonios. Para tenerla a mano, añádala a la pantalla de inicio del teléfono.</p>
  ${credits('es')}`,
 ca:()=>`<h1 style="font-size:1.8rem">La visita</h1>
  <p>Desitgem, en donar-vos la benvinguda, que la vostra visita al Museu Claretià de Vic signifiqui un contacte viu amb la persona de Claret, que deixà una petjada tan profunda en l’Església i en la nostra terra.</p>
  <h2 class="sec">Us demanem, si us plau</h2>
  <ul class="rules"><li>Guardar silenci.</li><li>No posar les mans sobre les vitrines ni sobre els objectes.</li></ul>
  <h2 class="sec">Com llegir la sala</h2>
  ${legend('Les <strong>vitrines</strong> s’identifiquen per una lletra majúscula.','Els <strong>objectes</strong> porten números blancs sobre fons negre. Els que són fora de les vitrines segueixen la mateixa numeració, en lletra més grossa.','Els <strong>plafons</strong> murals de fotografies i quadres porten números negres sobre fons blanc.')}
  <p>En aquesta guia, al costat de cada grup d’objectes, hi trobareu el <strong>testimoni autobiogràfic</strong>: fragments de l’<em>Autobiografia</em> de sant Antoni Maria Claret, en cursiva i amb la seva numeració oficial, i algunes anotacions complementàries. Els fragments es donen en la versió catalana de l’<em>Autobiografia</em>.</p>
  <h2 class="sec">Entrada i donatius</h2>
  <p>La visita al Museu és gratuïta. Si voleu col·laborar a les despeses del seu manteniment podeu dipositar el vostre donatiu a la bústia «ofrena» de la sortida.</p>
  <p class="note">Missioners Claretians, Casa Mare. C/ Sant Antoni Maria Claret, 8, 08500 Vic. Dades preses de la guia impresa del museu: convé confirmar horaris i condicions actuals abans de la visita.</p>
  <h2 class="sec">Aquesta guia</h2>
  <p class="sans" style="font-size:.9rem">És en català, castellà, basc, francès, anglès i italià: el botó <strong>CA</strong>, a dalt, permet canviar de llengua. Funciona sense connexió un cop oberta. El botó <strong>Aa</strong> canvia la mida de la lletra i <strong>Escoltar</strong> llegeix en veu alta els testimonis. Per tenir-la a mà, afegiu-la a la pantalla d’inici del telèfon.</p>
  ${credits('ca')}`,
 en:()=>`<h1 style="font-size:1.8rem">The visit</h1>
  <p>Welcome! We hope that your visit to the Claretian Museum of Vic will be a living encounter with the person of Claret, who left such a deep mark on the Church and on our land.</p>
  <h2 class="sec">Please</h2>
  <ul class="rules"><li>Keep silent.</li><li>Do not touch the display cases or the objects.</li></ul>
  <h2 class="sec">How to read the room</h2>
  ${legend('The <strong>display cases</strong> are identified by a capital letter.','The <strong>objects</strong> have white numbers on a black background. Those outside the display cases follow the same numbering, in larger figures.','The wall <strong>panels</strong> of photographs and pictures have black numbers on a white background.')}
  <p>In this guide, next to each group of objects, you will find the <strong>autobiographical testimony</strong>: extracts from the <em>Autobiography</em> of Saint Anthony Mary Claret, in italics and with their official numbering, and some additional notes. The extracts are taken from the English bicentennial edition of the <em>Autobiography</em>, revised against the original Spanish.</p>
  <h2 class="sec">Admission and donations</h2>
  <p>Admission to the museum is free. If you would like to help with its upkeep, you can leave your donation in the offering box at the exit.</p>
  <p class="note">Claretian Missionaries, Mother House. C/ Sant Antoni Maria Claret, 8, 08500 Vic. Information taken from the printed museum guide: please check current opening times and conditions before your visit.</p>
  <h2 class="sec">This guide</h2>
  <p class="sans" style="font-size:.9rem">It is available in Spanish, Catalan, Basque, English, French and Italian: use the <strong>EN</strong> button at the top to change language. Once opened, it works without a connection. The <strong>Aa</strong> button changes the text size, and <strong>Listen</strong> reads the testimonies aloud. To keep it at hand, add it to your phone’s home screen.</p>
  ${credits('en')}`,
 eu:()=>`<h1 style="font-size:1.8rem">Bisita</h1>
  <p>Ongi etorri! Vic-eko Museo Klaretarrera egiten duzun bisita Claretekiko harreman bizia izatea nahi genuke; izan ere, arrasto sakona utzi zuen Elizan eta gure lurrean.</p>
  <h2 class="sec">Mesedez</h2>
  <ul class="rules"><li>Isilik egon.</li><li>Ez ukitu erakusmahaiak ezta objektuak ere.</li></ul>
  <h2 class="sec">Aretoa nola irakurri</h2>
  ${legend('<strong>Erakusmahaiak</strong> letra larri batez identifikatzen dira.','<strong>Objektuek</strong> hondo beltzeko zenbaki zuriak dituzte. Erakusmahaietatik kanpokoek zenbakiketa bera dute, letra handiagoz.','Argazki eta koadroen horma-<strong>panelek</strong> hondo zuriko zenbaki beltzak dituzte.')}
  <p>Gida honetan, objektu-multzo bakoitzaren ondoan, <strong>lekukotasun autobiografikoa</strong> aurkituko duzu: Antonio Maria Claret deunaren <em>Autobiografiako</em> zatiak, letra etzanez eta zenbakiketa ofizialarekin, eta ohar osagarri batzuk. <em>Autobiografiak</em> euskarazko itzulpen argitaraturik ez duenez, zatiak gaztelaniazko jatorrizkotik itzuli dira.</p>
  <h2 class="sec">Sarrera eta dohaintzak</h2>
  <p>Museoa bisitatzea doakoa da. Mantentze-gastuetan lagundu nahi baduzu, zure dohaintza irteerako eskaintza-kutxan utz dezakezu.</p>
  <p class="note">Klaretar Misiolariak, jaiotetxea. Sant Antoni Maria Claret kalea, 8, 08500 Vic. Museoaren gida inprimatutik hartutako datuak: komeni da bisitaren aurretik ordutegiak eta baldintzak egiaztatzea.</p>
  <h2 class="sec">Gida hau</h2>
  <p class="sans" style="font-size:.9rem">Gaztelaniaz, katalanez, euskaraz, frantsesez, ingelesez eta italieraz dago: goiko <strong>EU</strong> botoiarekin alda dezakezu hizkuntza. Konexiorik gabe ere badabil, behin irekita. <strong>Aa</strong> botoiak letraren tamaina aldatzen du, eta <strong>Entzun</strong> botoiak lekukotasunak ozen irakurtzen ditu. Eskura izateko, gehitu telefonoaren hasierako pantailara.</p>
  ${credits('eu')}`,
 fr:()=>`<h1 style="font-size:1.8rem">La visite</h1>
  <p>En vous souhaitant la bienvenue, nous désirons que votre visite au Musée clarétain de Vic soit un contact vivant avec la personne de Claret, qui a laissé une empreinte si profonde dans l’Église et sur notre terre.</p>
  <h2 class="sec">Nous vous demandons, s’il vous plaît</h2>
  <ul class="rules"><li>De garder le silence.</li><li>De ne pas poser les mains sur les vitrines ni sur les objets.</li></ul>
  <h2 class="sec">Comment lire la salle</h2>
  ${legend('Les <strong>vitrines</strong> sont identifiées par une lettre majuscule.','Les <strong>objets</strong> portent des numéros blancs sur fond noir. Ceux qui sont hors des vitrines suivent la même numérotation, en caractères plus grands.','Les <strong>panneaux</strong> muraux de photographies et de tableaux portent des numéros noirs sur fond blanc.')}
  <p>Dans ce guide, à côté de chaque groupe d’objets, vous trouverez le <strong>témoignage autobiographique</strong> : des extraits de l’<em>Autobiographie</em> de saint Antoine-Marie Claret, en italique et avec leur numérotation officielle, et quelques notes complémentaires. Les extraits sont tirés de la traduction française de l’<em>Autobiographie</em>, révisée sur l’original espagnol.</p>
  <h2 class="sec">Entrée et dons</h2>
  <p>La visite du musée est gratuite. Si vous souhaitez participer aux frais d’entretien, vous pouvez déposer votre don dans le tronc des offrandes, à la sortie.</p>
  <p class="note">Missionnaires Clarétains, Maison Mère. C/ Sant Antoni Maria Claret, 8, 08500 Vic. Données tirées du guide imprimé du musée : il est conseillé de vérifier les horaires et les conditions actuelles avant la visite.</p>
  <h2 class="sec">Ce guide</h2>
  <p class="sans" style="font-size:.9rem">Il est disponible en espagnol, en catalan, en basque, en anglais, en français et en italien : le bouton <strong>FR</strong>, en haut, permet de changer de langue. Il fonctionne sans connexion une fois ouvert. Le bouton <strong>Aa</strong> change la taille du texte et <strong>Écouter</strong> lit les témoignages à voix haute. Pour l’avoir toujours sous la main, ajoutez-le à l’écran d’accueil de votre téléphone.</p>
  ${credits('fr')}`,
 it:()=>`<h1 style="font-size:1.8rem">La visita</h1>
  <p>Nel darvi il benvenuto, desideriamo che la vostra visita al Museo Clarettiano di Vic sia un contatto vivo con la persona di Claret, che ha lasciato un’impronta così profonda nella Chiesa e nella nostra terra.</p>
  <h2 class="sec">Si prega di</h2>
  <ul class="rules"><li>Fare silenzio.</li><li>Non appoggiare le mani sulle vetrine né sugli oggetti.</li></ul>
  <h2 class="sec">Come leggere la sala</h2>
  ${legend('Le <strong>vetrine</strong> sono contrassegnate da una lettera maiuscola.','Gli <strong>oggetti</strong> portano numeri bianchi su fondo nero. Quelli fuori dalle vetrine seguono la stessa numerazione, in caratteri più grandi.','I <strong>pannelli</strong> murali di fotografie e quadri portano numeri neri su fondo bianco.')}
  <p>In questa guida, accanto a ogni gruppo di oggetti, troverete la <strong>testimonianza autobiografica</strong>: brani dell’<em>Autobiografia</em> di sant’Antonio Maria Claret, in corsivo e con la numerazione ufficiale, e alcune note complementari. I brani sono tratti dalla traduzione italiana dell’<em>Autobiografia</em>, rivista sull’originale spagnolo.</p>
  <h2 class="sec">Ingresso e offerte</h2>
  <p>La visita al museo è gratuita. Se desiderate contribuire alle spese di manutenzione, potete lasciare la vostra offerta nella cassetta all’uscita.</p>
  <p class="note">Missionari Clarettiani, Casa Madre. C/ Sant Antoni Maria Claret, 8, 08500 Vic. Dati tratti dalla guida stampata del museo: conviene verificare orari e condizioni attuali prima della visita.</p>
  <h2 class="sec">Questa guida</h2>
  <p class="sans" style="font-size:.9rem">È disponibile in spagnolo, catalano, basco, francese, inglese e italiano: il pulsante <strong>IT</strong>, in alto, permette di cambiare lingua. Funziona senza connessione una volta aperta. Il pulsante <strong>Aa</strong> cambia la dimensione del testo e <strong>Ascolta</strong> legge ad alta voce le testimonianze. Per averla sempre a portata di mano, aggiungetela alla schermata iniziale del telefono.</p>
  ${credits('it')}`
};
