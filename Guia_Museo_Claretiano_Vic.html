 I would walk for five hours in the morning and another five in the afternoon..."},{"ab":"297","t":"From the very beginning, the style I aimed at was that of the Gospel: simple and clear. To achieve this aim I made use of comparisons, likenesses, and examples from history and experience, most of them from Scripture."},{"ab":"221","t":"I am ever more deeply impressed at the thought of Jesus moving from town to town, preaching everywhere—not just in big cities, but in little villages and even to a single woman, as with the Samaritan woman..."}]},{"left":[{"v":"C","r":[["20","Statue of Saint Anthony of Padua, patron of Fr Anthony Claret, blessed by the missionary himself."]]},{"v":"D","r":[["21","Towel used by Father Claret. It comes from Sabadell."],["22","Biretta he wore during the mission he preached in Valls."],["23","Cross blessed by the saint for a family in Albí, near Lleida."],["24","Umbrella used by Father Claret."],["25","Hair shirt (instrument of penance)."],["26","Pentecost holy card that Father Claret kept in his breviary."],["(27-28)",""],["29","Statue of Father Claret as missionary, catechist and writer. Work by Domènec Fita, 1990."]]},{"v":"E","r":[["30","Shoes and handkerchief of the missionary Claret. His shoes were exchanged during the mission he preached in Lleida in May 1846. While he was evangelising that region, the people of Lleida began to call him affectionately “Father Claret”, a name that caught on at once and has stayed with him ever since."]]}],"right":[]},{"left":[{"v":"F","r":[["31","Verses by a devout listener summarising the sermons of Saint Anthony Mary Claret heard in the basilica of Santa Maria del Mar in Barcelona throughout May 1844."],["32","Register of retreatants at the Mother House in Vic, from the foundation of the Claretian congregation. The first retreatant listed (1850) is “the Most Illustrious Don Anton Claret, Archbishop-elect of Cuba”."],["33","Portrait drawing of Father Claret published in Barcelona while he was preaching in the Canary Islands; it was very widely circulated throughout Catalonia."]]}],"right":[{"a":"Jaume Balmes said of Father Claret as a preacher in Catalonia: “In the pulpit he never speaks of theatres. Nor of heresies. Nor of philosophers or unbelievers. He always takes faith for granted... Little terror; gentleness in everything. The examples were generally taken from Holy Scripture.”"},{"ab":"480","t":"We left Madrid for Seville, Jerez, and Cadiz, where I preached. From there we set sail for the Canary Islands. Around the beginning of February, we arrived at Tenerife, where I preached on Sunday, embarking from there on Monday for Grand Canary Island. Here I conducted the Spiritual Exercises for the priests, in a drawing room of the Episcopal residence, with the bishop presiding at all the sessions. I also gave a retreat to all the seminarians and preached missions in all the parishes of Grand Canary Island."},{"ab":"481","t":"I often had to preach in public squares because the crowds who gathered for the mission in every town were too large to fit in the churches."},{"a":"Here are some testimonies that Fr Brossosa gathered among ordinary people in the Canary Islands: “There was no one like Father Claret”; “he was full of the Spirit of God”; “we all understood him... and everything he said”; “while we listened to him, he filled us, he filled us...”."}]},{"left":[{"o":[["34","Two letters from Father Claret to Mr Felip Ribó of Caldes de Montbui, concerning the spread of religion through the written word (photograph of the originals), and an autograph in which he suggests making donations."],["35","Handwritten copy of Father Claret’s Autobiography, made by the first missionaries (two volumes), with an opening note by the Venerable Father Clotet, Father Claret’s companion and co-founder of the Congregation of Claretian Missionaries."],["36","Life of Father Claret, then Venerable, written by the Claretian historian Fr Mariano Aguilar."]]}],"right":[{"ab":"483","t":"Whenever I finished a mission, all the townspeople would accompany me on my departure; and the people from the next town would come out to receive me—one group bidding me farewell amid tears and the other welcoming me with joy."},{"ab":"486","t":"Toward the beginning of May, 1849, I left the Islands... I spent 15 months in those islands and worked every day, with God’s help."},{"ab":"487","t":"My God, how good you are! What unexpected means you use to convert sinners!"}]},{"left":[{"v":"G","r":[["37","Certificate of foundation of the Archconfraternity of the Heart of Mary in the church of Saint Dominic in Vic, in 1847, after the novena Father Claret preached there in August that year."],["38","Rosary card dedicated to Mary Most Holy."],["39","Goigs and al·leluies (popular Catalan hymns and illustrated broadsheets) of the Immaculate Heart of Mary, enriched with indulgences by Archbishop Claret."],["40","Booklets concerning the Archconfraternity of the Heart of Mary."],["41","Books on the Rosary and other Marian devotions."],["42","Register of the first members of the Archconfraternity of the Heart of Mary."],["43","Rosary of the Seven Sorrows of Our Lady, blessed and given by Father Claret."],["44","Crown of twelve stars that he gave to a little girl."],["45","Rosaries made by the saint."],["46","Letter from the saint to his sister Rosa, in which he speaks of his visits to Our Lady of Fussimanya."],["47","Autograph prayer of Father Claret to Our Lady."],["48","Statue of Our Lady of the Pillar."],["49","Banner of the Archconfraternity of the Heart of Mary of Vic. It depicts some of its members: Saint Peter Almató, Saint Joaquina de Vedruna, Jaume Balmes, Fr Jacint Verdaguer, Fr Josep Xifré, and the Bishops of Vic Llucià Casadevall, Josep Morgades and Josep Torras i Bages."]]},{"box":["Unnumbered","**Stained-glass window** with Father Claret’s episcopal coat of arms, in exactly the place where, from 1940 to 1970, it let light in behind the saint’s tomb. The museum now occupies the same floor where the provisional chapel of La Mercè stood until the Temple-Sepulchre was built.","*Father Claret’s episcopal coat of arms shows:* the name of Mary, the sun and the moon (an allusion to the surnames CLARET and CLARÀ), the bridge of Sallent over the Llobregat (a reference to his birthplace) and the motto “CARITAS CHRISTI URGET NOS” (The love of Christ impels us)."]}],"right":[{"ai":"*Father Claret founded the Archconfraternity of the Heart of Mary for the conversion of sinners in the church of Saint Dominic in Vic, in August 1847. During the novena more than 10,000 people enrolled. Among them was Saint Peter Almató, with all his companions from the Dominican novitiate at Ocaña.*"}]},{"left":[{"p":"**Panel 13**","i":["Prayer that Father Claret said to Our Lady at the beginning of his preaching to the people."]},{"v":"H","r":[["50","Statue of Our Lady of Sorrows blessed by Father Claret. He was a member of the Confraternity of Our Lady of Sorrows in Vic."]]}],"right":[{"ab":"270","t":"O Virgin Mother of God, mother and advocate of poor and unhappy sinners, you are well aware that I am your son and minister, formed in the forge of your mercy and love. I am like an arrow poised in your mighty hand..."}]}]},{"rom":"III","title":"Apostle of the printed word","blocks":[{"left":[{"v":"I","r":[["51","Books written for different kinds of readers."],["52","***“Consejos que una madre da a su hijo a punto de marcharse a la guerra”*** (A mother’s advice to her son about to leave for the war). The missionary’s practical sense led him to make this little work as small and light as possible."],["53","***“El Ferrocarril”*** (The Railway). At a time when travel between towns was passing from the horse-drawn stagecoach to the steam train, the railway was bound to make a great impression. Father Claret uses it as a symbol in three successive stages."],["54","***“Las Hijas del Corazón de María”*** (The Daughters of the Heart of Mary), religious living in their own homes. Today they are the Missionaries of the “Cordimarian Filiation”."],["55","Various booklets."]]}],"right":[{"ab":"310","t":"Experience has taught me that one of the most powerful forces for good is the press, although when abused it can also be one of the most potent weapons for evil."},{"ab":"311","t":"I say that it is nowadays a necessity because there is such a passion for reading that if people don’t have good books they’ll read bad ones."},{"ab":"312","t":"In our day, then, there is twice the need for circulating good books. But these books must be small because modern people rush about so much and are pressed on all sides by a thousand different demands..."},{"ab":"313","t":"The first booklet I published was one containing some spiritual counsels I had originally written for the nuns at Vic... Encouraged by the good results of this first book, I determined to write a second entitled Advice to Young Ladies. After this, I wrote a whole series of “advice” books: to parents, children, youth..."},{"ab":"323","t":"Thanks be to God, all my books have had happy results, but the ones that I think have converted more people have been **The Straight Path** and **The Catechism Explained**... Everyone is looking for a copy, and they have no rest until they have obtained one."}]},{"left":[{"v":"J","r":[["56","***“Camino recto y seguro para llegar al cielo”*** (The straight and sure path to heaven). Successive editions in Catalan and Spanish."],["57","Editions in other languages: Basque, Portuguese, Pangasinan (from the Philippines)."]]}],"right":[{"a":"“CAMINO RECTO Y SEGURO PARA LLEGAR AL CIELO” (in Catalan “Camí dret i segur per arribar al cel”) was the most popular manual of devotion and Christian life in Spain. Some two million copies are estimated to have been printed."},{"a":"It is the most frequently published work in the Catalan language, and the one with the largest number of copies overall. The original Catalan edition appeared in 1843, a booklet of 48 pages. Editions followed one another rapidly and, with the improvements and additions of each, it grew into a volume of 500 pages. By the end of the century it had gone through 250 editions, some 800,000 copies."},{"a":"“EL CAMINO RECTO” was published in Pangasinan, in Manila, in 1884. The copy displayed is a reprint made in Czechoslovakia."},{"a":"Saint Anthony Mary Claret is the only Catalan author to have been translated into Philippine languages (Tagalog, Visayan, Ilocano, Pangasinan)."}]},{"left":[{"v":"K","r":[["58","***“Catecismo explicado”*** (The Catechism Explained). First editions."],["59","Plates from the ***“Catecismo explicado”***."],["60","***“Maná del Cristiano”***."],["61","***“El santo evangelio de Nuestro Señor Jesucristo según san Mateo”***."],["62","***“La Santa Ley de Dios”***."],["63","***“Nuevo manojito de flores”***."],["64","***“La Llave de Oro”***."]]}],"right":[{"ab":"285","t":"Because I love children and want them to be educated in Christian doctrine, I have written four catechisms: one for small children, from the time they begin talking until they reach seven; one for country folk; another, more extensive one; and one fully explained and illustrated."},{"ab":"287","t":"The most productive means I have used has been adult instruction. It has helped me rescue adults from an ignorance that is greater than one might imagine..."}]},{"left":[{"v":"L","r":[["65","***“El Colegial o seminarista instruído”***."],["66","***“La vocación de los niños”***."],["67","***“Colección de opúsculos”***."],["68","***“A la juventud estudiosa y cristiana”***. ***“La Colegiala Instruída”***."],["69","***“L’egoismo vinto”*** (one of his last works)."],["70","Some of the countless books published by the “Librería Religiosa”. Outstanding among them is the Bible: a copy of the third edition, with small printed pointing hands marking the passages Father Claret considered most noteworthy."],["71","Archbishop Claret’s “ex libris”. It bears an author’s personal dedication."]]}],"right":[{"ab":"329","t":"In order to be able to give books away or to sell them as cheaply as possible, I planned on setting up a Religious Press under the protection of our Lady of Montserrat..."},{"a":"Founded in December 1848, the Librería Religiosa published some ten million printed items during its founder’s lifetime. Its publishing work has continued to this day."},{"ab":"331","t":"Through the offices of the Religious Publishing House, both clergy and laity have been and are still able to purchase good books, the best available and at the lowest prices..."}]},{"left":[{"p":"**Panel 14**","i":["Plates from the ***“Catecismo explicado”*** drawn by the saint."]},{"v":"M","r":[["72","Father Claret’s own writing desk."]]},{"p":"**Panel 15**","i":["The missionary writer: photograph taken in Paris in 1868."]}],"right":[{"a":"The other book is the CATECISMO DE LA DOCTRINA CRISTIANA EXPLICADO Y ADAPTADO A LA CAPACIDAD DE LOS NIÑOS, y adornado con muchas láminas, por el Rev. D. Antonio Claret, Presbítero (Catechism of Christian Doctrine explained and adapted to the capacity of children, adorned with many plates, by the Rev. Anthony Claret, Priest)."},{"a":"The originality of this work lay in its intuitive method, teaching through pictures. In this the author was ahead of his time. The Librería Religiosa published 170,000 copies in Catalan and 145,000 in Spanish."},{"ab":"56","t":"Who would have guessed that God would one day use in the interests of religion the studies in design that I undertook for business reasons? And, in fact, these skills have been most useful to me in designing prints for catechisms and works on mysticism."}]}]},{"rom":"IV","title":"Founder of the Claretian Missionaries","blocks":[{"left":[{"box":[null,"**Room** where Father Claret founded the Congregation of Missionary Sons of the Immaculate Heart of Mary on 16 July 1849. It was a simple seminarian’s room on the third floor of the old seminary. The window looked onto the inner courtyard."]},{"sub":"***The original elements of this room are:***"},{"o":[["73","The door,"],["74","the window."],["75","The beams and the flooring."],["76","The floor tiles. The 87 centimetres of tiles beside the window come from the room occupied by Fr Esteve Sala, co-founder."],["77","The painting of the Heart of Mary that presided over the foundation."],["78","The table and chair were also used by Father Claret in the house of his brother Josep in Olost de Lluçanès, or at other times in his life."]]}],"right":[{"ab":"488","t":"Toward the middle of May I arrived in Barcelona and returned to Vic where I discussed with Canons Jaime Soler and Jaime Passarell my plan to form a congregation of priests who would both be, and be called, Sons of the Immaculate Heart of Mary."},{"ab":"489","t":"... I talked with a number of priests whom the Lord had given the same spirit that motivated me. These were Fathers Stephen Sala, Joseph Xifré, Dominic Fàbregas, Manuel Vilaró, and Jaime Clotet. I, Anthony Claret, was last of all."},{"ab":"490","t":"On July 16, 1849, after we had gathered together in the seminary with the approval of the bishop and the rector, we commenced our own Spiritual Exercises, which we followed with all exactness and fervor... We left those Exercises full of fervor, bound and determined to persevere, and, thanks be to God and Mary Most Holy, all have persevered."},{"a":"The beginning of the spiritual exercises at three o’clock in the afternoon of 16 July, in a seminarian’s room, marked the birth of the Claretian Congregation."}]},{"left":[{"p":"**Panel 16**","i":["The co-founders:"],"names":["***Saint Anthony Mary Claret***","*Venerable Jaume Clotet*","*Esteve Sala*","*Josep Xifré*","*Domènec Fàbregas*","*Manuel Vilaró*"]},{"o":[["80","**Clock** from the staircase, which struck the hours in the part of the seminary where the foundation took place. The hands show three in the afternoon, the hour at which the foundation began."]]},{"p":"**Panel 17**","i":["Definition of the Missionary Son of the Heart of Mary, written by the holy founder."]}],"right":[{"ab":"491","t":"Thus we had begun and thus we continued, living together strictly in community. All of us were going out regularly to work in the sacred ministry."},{"ab":"494","t":"I tell myself: A Son of the Immaculate Heart of Mary is a man on fire with love, who spreads its flames wherever he goes. He desires mightily and strives by all means possible to set the whole world on fire with God’s love. Nothing daunts him; he delights in privations, welcomes work, embraces sacrifices, smiles at slander, and rejoices in suffering. His only concern is how he can best follow Jesus Christ and imitate Him in working, suffering, and striving constantly and single-mindedly for the greater glory of God and the salvation of souls.","caps":true}]}]},{"rom":"V","title":"The Mother House","blocks":[{"left":[{"v":"N","r":[["81","Model of the old convent of La Mercè, which the Bishop of Vic handed over to the new missionary community and which in October 1849 became the Mother House of the Congregation of Claretian Missionaries. From the beginning it was also a retreat house for lay people and priests."]]},{"p":"Panel 18","s":"backlit images in the centre","i":["Around the model, photographs from various moments in the history of the Mother House in Vic:","At the time of the foundation.","Renovation work of 1928-1930, directed by the martyr Fr Jaume Girón.","Project to restore the church to its original conventual Gothic style.","The destruction of July 1936.","Today."]}],"right":[{"a":"Some facts about the convent of La Mercè in Vic:"},{"chron":[["1235","On 19 November, James I founds the Mercedarian house of Vic."],["1254","The foundation takes effect in what is now Carrer de Sant Pere, where the hospital of Vic stands today."],["1264","The Mercedarians move to the site where the church of Saint Dominic now stands."],["1367","They buy a house where the convent of La Mercè would later stand."],["1383","By about this year, construction of the church of La Mercè, in conventual Gothic style, has already begun."],["1580","The cloister was probably built at this time."],["1620","Baroque vaults are built in the church, disfiguring its original style."],["1733","The new door of the church is built. The date that could be read on it was 1734."],["1835","The friars are expelled from the country."],["1849","October: the Claretian Missionaries, founded on 16 July that year in the old seminary, move into the Mercedarian convent."]]}]},{"left":[{"o":[["82","**Altar** of the chapel of the retreat house of La Mercè, where from the very beginning the Claretian missionaries carried out the apostolic ministry of the Spiritual Exercises. The tradition continues today in the “Father Claret Spirituality House” (Casa d’Espiritualitat Pare Claret) on the Rambla de Sant Domènec, the work of Father Lluís Pujol CMF, founder of the Missionaries of the Claretian Institute."]]},{"v":"O","r":[["83","Statue of Our Lady of Mercy blessed by the saint. It comes from the Piarist Fathers’ novitiate in Alella."],["84","Bust of the Venerable Jaume Clotet, co-founder of the Congregation of Claretian Missionaries and first biographer of the saint. Work by Josep Vilarrúbias CMF, 1990."],["85","**Tombstone** of Father Claret, which stood in the old church of La Mercè. The coat of arms, restored, is the work of Jordi Pallàs."]]}],"right":[]},{"left":[{"box":[null,"**Room** on the third floor of the old seminary, occupied by Father Claret during the first months after the foundation. The window looked onto Carrer de Sant Hipòlit, now Carrer de Sant Miquel dels Sants."]},{"sub":"***The original elements of this room are:***"},{"o":[["86","The door,"],["87","the window,"],["88","The beams and the floor. The 87 centimetres of tiles beside the window come from the room occupied by Fr Esteve Sala."],["89","The towel on the washstand was used by Father Claret some years later. *The furniture is a facsimile, based on the description given by Father Clotet in his account of the foundation.*"]]}],"right":[{"a":"In this room Father Claret went through great suffering and anguish as he discerned God’s will: whether to accept his appointment as archbishop or to decline it, in view of the immense field of apostolate open before him. The appointment reached him in August, and he did not accept it until 4 October. From here he wrote anguished letters to the Bishop, the Nuncio, the Ministry of Justice..."},{"a":"Saint Anthony Mary Claret founded, besides the CLARETIAN MISSIONARIES and the CLARETIAN MISSIONARY SISTERS, other institutions, such as the Academy of Saint Michael, continued today in the CLARETIAN LAY MOVEMENT, and the Religious in their own homes, now the Secular Institute of the CORDIMARIAN FILIATION."}]}]},{"rom":"VI","title":"Missionary bishop","blocks":[{"left":[{"v":"P","r":[["90","**Papal bull** of Pope Pius IX appointing Father Claret Archbishop of Santiago de Cuba."]]},{"p":"**Panel 19**","i":["Father Claret’s first reaction to his appointment."]},{"v":"Q","r":[["91","Amice of Archbishop Claret."],["92","Surplice."],["93","Two books from this period of the saint’s life: ***“Apuntes del Arzobispo Claret”*** (Notes of Archbishop Claret), which he wrote himself for his own use in governing the diocese and which were later published; ***“Las delicias del Campo”*** (The Delights of the Countryside), for the advancement of country people."],["94","Corporals with which he celebrated the Eucharist."],["95","Measuring ribbon of Our Lady of Charity of El Cobre, patroness of the diocese of Santiago de Cuba. Its length equals the height of the statue of the Virgin of El Cobre."],["96","Personal items: razor, whetstone, folding knives, scissors."]]},{"v":"R","r":[["97","Mitre of Archbishop Claret."],["98","Pectoral cross and episcopal ring."]]}],"right":[{"ab":"491","t":"On August 11, as I was coming down from the pulpit after the closing service, lo and behold, I was told that His Excellency, the Bishop, wanted me to go to his palace. When I arrived there, he handed me a letter dated August 4, containing my royal appointment as Archbishop of Cuba."},{"ab":"495","t":"Overwhelmed by the appointment, I had no desire to accept it because I considered myself unworthy and incapable of such a great dignity, for which I lacked both the necessary knowledge and virtue... even if I had the required knowledge and virtue, it would be wrong for me to abandon the Religious Publishing House and the Congregation, which were just coming into being."},{"ab":"538","t":"During the first two years, despite the earthquakes and the cholera epidemic, we managed to visit all the parishes in the archdiocese. In every one of them a mission was led either by me or my companions, and in rural parishes with a very large territory, several missions were given."},{"ab":"547","t":"My first pastoral letter, written and signed on September 20, 1852, was addressed to the clergy."},{"ab":"549","t":"My second pastoral letter of March 25, 1853 was addressed to the laity, reminding them of what we had taught them in the missions and pastoral visits we had just completed."},{"ab":"555","t":"I undertook the restoration of the diocesan seminary. More than 30 years had passed without seeing the ordination of a single resident seminarian."},{"ab":"563","t":"I bought a ranch for the poor of Puerto Príncipe."},{"ab":"564","t":"My plan in starting this ranch was to gather together poor boys and girls, many of whom were wandering the streets begging. At the ranch they were fed, clothed, and taught their religion, as well as reading, writing, and whatever art or trade they wanted to learn."},{"ab":"566","t":"The front part of the boys’ wing housed a physics and chemistry laboratory, some agricultural equipment, and a library. The library was open to the public for two hours in the morning and two in the afternoon. The class in agriculture, which met three times a week, was open to all who wished to attend. All the other classes were for resident students only."},{"ab":"568","t":"While the ranch was still being built, I wrote a little work called *The Delights of the Country*, which contained a sketch in embryo of the foundation I had started. This little book has been very helpful in Cuba, and ranch owners give copies of it to their foremen and tell them to follow it."},{"ab":"569","t":"I also set up a licensed savings bank in the diocese, for the use and benefit of the poor. For I saw that when the poor have proper direction and are given a decent means to earn a living, they are upright citizens; it is only otherwise that they become debased."},{"ab":"561","t":"I also established a convent of nuns dedicated to teaching girls, and I bought them a house..."},{"a":"These are the Religious of Mary Immaculate, whom he founded in Cuba with Mother Antonia París, and who later took the name of CLARETIAN MISSIONARY SISTERS."},{"ab":"570","t":"I also visited prisoners in jail, catechizing them and preaching to them frequently... We saw to it that prisoners in jail were taught reading, writing, religion, and a trade of some sort. With this in mind we had workshops set up in jail..."}]},{"left":[{"v":"S","r":[["99","Pillow stained with the archbishop’s blood after the assassination attempt he suffered in the city of Holguín, Cuba, on 1 February 1856."]]}],"right":[{"ab":"575","t":"A man stepped forward, as if to kiss my ring, when suddenly his arm flew back and he brought the razor he was holding down upon me with all his might."},{"ab":"577","t":"I can’t describe the pleasure, delight, and joy I felt in my soul on realizing that I had reached the long desired goal of shedding my blood for the love of Jesus and Mary and of sealing the truths of the Gospel with the very blood of my veins."}]},{"left":[{"p":"**Panel 20**","i":["Saint JOAQUINA DE VEDRUNA, foundress of the Carmelites of Charity. Vic.","Venerable MARIA ANTONIA PARÍS, who with Archbishop Claret founded the Congregation of the Religious of Mary Immaculate (Claretian Missionary Sisters).","Saint MARÍA MICAELA OF THE BLESSED SACRAMENT, foundress of the Adorers of the Blessed Sacrament. Madrid.","Saint FRANCIS COLL, OP, founder of the Dominican Sisters of the Annunciation.","Saint PETER ALMATÓ, Dominican, whom Father Claret helped to discern his vocation."]},{"p":"**Panel 21**","i":["Portrait of the Archbishop of Cuba, composed of pieces of clothing worn by Father Claret himself. It was made by Claretian Missionary Sisters in Cuba during the saint’s lifetime."]}],"right":[{"h":"**Spiritual adviser to founders:**"},{"a":"Saint Anthony Mary Claret took an active part in the spiritual and apostolic guidance of men and women of the Church, of saints and of founders of various religious congregations."}]},{"left":[{"p":"**Panel 22**","i":["Diploma of the Academy of Saint Michael, designed and signed by Archbishop Claret."]}],"right":[{"ab":"581","t":"The third striking phenomenon was the master plan for the Academy of St. Michael, which came to me during those first few days I was in bed. As soon as I could get up, I started designing its emblem and drafting its bylaws..."},{"a":"The Academy of Saint Michael was one of Father Claret’s great pastoral and ecclesial insights: the active presence of lay people in the Church, called to the apostolate from within their various professions: intellectuals, artists, writers, musicians..."}]}]},{"rom":"VII","title":"Royal confessor","blocks":[{"left":[{"p":null,"i":["(On the same panel 22) Letter in which Archbishop Claret, by then in Madrid, takes leave of the Church in Cuba."]},{"v":"T","r":[["100","Chasuble from the private oratory of the Bertrana i Forcada sisters in Vic, with which Fr Claret celebrated Mass on 26 August 1865."]]}],"right":[{"ab":"587","t":"I was a few days into the mission when I received a royal summons to go to Madrid, as the Archbishop of Toledo, who was confessor to the queen, had died, and Her Majesty had chosen me as her new confessor."},{"ab":"588","t":"I received the royal summons on March 18 and on the 22nd left Santiago for Havana, where I boarded a packet boat bound for Cadiz."},{"ab":"621","t":"I have sometimes remarked that God sent me to this job as a kind of purgatory where I am supposed to pay for the sins of my past... I am always sighing to get away from it all. I’m like a caged bird that keeps looking through the bars of its cage for a way to escape, and I keep dreaming up ways to get out."}]},{"left":[{"v":"U","r":[["101","Cutlery with the initials A C (Antonio Claret), given by Queen Isabella II to the Archbishop."],["102","Medal of the Immaculate: congratulations to Mary on her Immaculate Conception."],["103","Medal of Saint Benedict."],["104","Medal of Saint John of God."],["105","Medal commemorating the 18th centenary of the martyrdom of the apostles Saint Peter and Saint Paul."],["106","Medal of the chapel of Our Lady of Montserrat in Madrid."],["107","Pax cross."],["108 al 111","Crosses blessed, worn or given by the saint."],["112","Numbered laundry tag of the Archbishop."],["113","Original photograph from the last years of his life."],["114","Visiting card."],["115 al 117","Photographs from the end of his life, taken in Madrid and Paris."],["118","Satirical portrayals of the archbishop who was the Queen’s confessor, on matchboxes (copies, by courtesy of the Museu Marès, Barcelona)."],["119","Caricature of Fr Claret as royal confessor in an “auca” (popular illustrated broadsheet) on the revolution of 1868."]]}],"right":[{"ab":"638","t":"... I have a holy emulation and almost envy of those missionaries who are lucky enough to be able to go from town to town preaching the Holy Gospel."},{"a":"Father Claret turned the journeys he had to make with the royal family into an immense mission. Cities and towns in every region of Spain witnessed Claret’s tireless apostolic work among all kinds of people."},{"ab":"639","t":"I have had some consolation in the midst of my sufferings. When I go on tour with Their Majesties and Highnesses, I get to preach to the people in the morning, before Their Majesties leave the house. Afterward I go around preaching in convents to nuns, sisters, priests, seminarians, members of the St. Vincent de Paul Society, etc., so that my whole day is spent in preaching."},{"ab":"640","t":"One of the things that has kept me most occupied since I’ve been in Madrid has been writing books and pamphlets."},{"ab":"798","t":"This year I have been much slandered and persecuted by all sorts of persons. I have been attacked by journalists and lampooned in pamphlets, parodied books, touched-up photographs, and in many other ways..."},{"a":"The Madrid newspaper “LA ESPERANZA” of 24 January 1865 reads: *“On various occasions, Bishop Claret’s friends have asked him to defend himself, but his answer has always been that the best defense was to ignore his detractors and pray for them as Jesus did on the cross...”* (Quoted in Aut. 867)"}]}]},{"rom":"VIII","title":"Passing to the Father’s house","blocks":[{"left":[{"p":"**Panel 23**","i":["General view of the Cistercian monastery of Fontfroide, in Languedoc, where Father Claret died in exile on 24 October 1870."]},{"v":"V","r":[["120","Crucifix that accompanied Father Claret in his last agony. The Cistercian community of Fontfroide gave it to the Claretian Congregation."]]}],"right":[{"a":"In the last months of his life, Archbishop Claret took an active part in the First Vatican Council."},{"a":"Exiled and persecuted, he withdrew to the Cistercian monastery of Fontfroide, in the south of France, where his health worsened and he died a holy death, surrounded by a group of Claretian missionaries and monks of the monastery."},{"a":"The Venerable Father Clotet, a witness of these events and the saint’s first biographer, wrote: “The peace, joy and fervour he showed during his last illness were admirable: he never tired of kissing the crucifix and making fervent aspirations."},{"a":"With unalterable peace and the Crucifix in his hands, on 24 October at 8.45 in the morning, he peacefully gave up his soul to the Lord.”"},{"a":"On Archbishop Claret’s tombstone in the monastery of Fontfroide could be read the last words of Saint Gregory VII:"},{"epi":["**I HAVE LOVED JUSTICE AND HATED INIQUITY;**","**THEREFORE I DIE IN EXILE.**"]}]},{"left":[{"p":"**Panel 24**","i":[]},{"o":[["121","Embroideries with the coats of arms of Archbishop Claret and of the Congregation of Missionary Sons of the Heart of Mary, which adorned the coffin during the solemn translation of Father Claret’s body from Fontfroide to Vic in 1897."]]}],"right":[{"a":"On 13 June 1897 the saint’s venerated remains were transferred from Fontfroide to Vic. The enthusiasm in the towns along the way was overwhelming, above all in Vic."}]},{"left":[{"v":"X","r":[["122","Wooden chest in which Mr Miquel Bantulà of Vic hid Father Claret’s venerated remains in his home during the Spanish Civil War (1936-1939)."],["123","Record of the deposit of the mortal remains, hidden on 20 July 1936. The next day, 21 July, the church of La Mercè was set on fire."],["124","Letter from Fr Pere Bertrans, custodian of the saint’s body, to the Claretian Father General immediately after escaping death (he was shot at because he refused to reveal where the saint’s body was hidden). Written on 15 August 1936, on his knees, in the middle of a maize field."],["125","Fr Bertrans’ UGT (socialist trade union) membership card."],["126","Life of Fr Claret, found in Tona, stabbed through with a knife during the uprising of 1936."]]}],"right":[{"a":"The seven resting places of Father Claret:"},{"chron":[["1","FONTFROIDE (Languedoc, France). From 1870 to 1897."],["2","VIC: Blessed Sacrament chapel of the church of La Mercè. From 1897 to 1932."],["3","SANTA EUGÈNIA DE BERGA. From 1932 to 1934."],["4","VIC: High altar of the church of La Mercè. From 1934 to 1936."],["5","VIC / BANTULÀ HOUSE, Carrer de Sant Miquel dels Sants. From 1936 to 1939."],["6","VIC: provisional chapel on the ground floor of the convent where the Claretian Museum now stands. From 1939 to 1970."],["7","VIC: the present Temple-Sepulchre, since 1970, first centenary of the saint’s death."]]}]}]}],"fr":[{"rom":"","title":"Panneau d’entrée","blocks":[{"left":[{"h":"Panneau d’entrée"},{"t":"Allégorie du Père Claret, homme de cette terre qui, oint par l’Esprit, pressé par l’amour du Christ et façonné dans la forge du Cœur de Marie, s’est donné à la mission évangélisatrice du peuple."},{"q":"« SE SOUVENIR DU PASSÉ, C’EST S’ENGAGER POUR L’AVENIR » (*Jean-Paul II*, Hiroshima, 1981)."},{"t":"Le panneau a été réalisé avec des fragments d’outils agricoles et industriels du pays et de l’époque. (Auteur : *Mn. Genís Baltrons*, 1990.)"},{"sym":[["Saint Antoine-Marie","*Monogramme de Marie*"],["Claret","*Le soleil*"],["Clarà","*La lune*"],["Oint par l’Esprit","*La colombe*"],["Fils du Cœur de Marie","*Symbole du cœur*"],["Amour pour le Christ","*Grappes de raisin et épis (Eucharistie)*"],["Incarné de la Vierge Marie","*Étoile sur le Cœur de Marie*"],["Prêché par l’évangélisateur","*Franges emportées par le vent*"],["À tout le peuple","*Outils de travail*"],["Origine paysanne du côté de sa mère","*Outils agricoles*"],["et industrielle du côté de son père","*Outils industriels*"]]}],"right":[{"a":"Les textes de l’*Autobiographie de saint Antoine-Marie Claret* sont en italique, identifiés selon la numérotation habituelle."},{"a":"S’y ajoutent quelques notes complémentaires."},{"ab":"1","t":"Plusieurs fois, de vive voix ou par écrit, Don José Xifré, Supérieur des Missionnaires Fils du Cœur Immaculé de Marie, m’a demandé une biographie de mon insignifiante personne. Je me suis toujours excusé, et encore maintenant je ne m’y serais pas résolu s’il ne me l’avait commandé ; ainsi, je le fais uniquement par obéissance, et, par obéissance, je ferai connaître des choses que je préférerais laisser inconnues. Que ce soit toutefois pour la plus grande gloire de Dieu et de la très sainte Vierge Marie, ma douce Mère, et pour la confusion de ce misérable pécheur."}]}]},{"rom":"I","title":"Le jeune Antoine Claret","blocks":[{"left":[{"p":"Panneau 1","s":"Image rétroéclairée dans la vitrine centrale","i":["La maison où naquit saint Antoine-Marie Claret, rue del Cós nº 20, à Sallent, le 23 décembre 1807."]},{"p":"**Panneau 2**","i":["Métier à tisser de l’époque"]},{"p":"**Panneau 3**","i":["La ville de Sallent"]},{"p":"**Panneau 4**","i":["Arbre généalogique d’Anton Claret i Clarà"]}],"right":[{"ab":"3","t":"Je suis né dans la ville de Sallent, au doyenné de Manrèse et diocèse de Vic, dans la province de Barcelone. Mes parents s’appelaient Jean Claret et Joséphine Clara, mariés, honnêtes et craignant Dieu, et très dévots au très saint Sacrement de l’autel et à la très sainte Vierge Marie."},{"ab":"31","t":"Comme mon père était fabricant de filés et de tissus, il me mit à travailler dans sa fabrique."}]},{"left":[{"v":"A","r":[["1","Médaille du centenaire de la naissance du Père Claret"],["2","Serviette tissée dans la maison d’Anton Claret à Sallent"],["3","Fragment autographe de la lettre du P. Claret à son ami le chanoine Dr Josep Caixal. Il lui rappelle que, lorsqu’il étudiait à la Llotja de Barcelone, il fut primé TROIS FOIS EN DESSIN."],["4","Le nom d’Anton Claret comme ouvrier textile de la fabrique de Francesc Prat, à Barcelone, dite « dels Vigatans » (des gens de Vic) : liste signée par le fabricant lui-même en 1828."],["5","Crucifix que le jeune Claret avait sur son métier à tisser, dans la fabrique de Francesc Prat."],["6","Numéros de loterie à Barcelone. À cette époque, un faux ami escroquera le jeune Claret dans une affaire de loterie."]]},{"n":"*(7-8)*"}],"right":[{"ab":"56","t":"Désireux de parfaire mes connaissances en fabrication, je demandai à mon père de m’emmener à Barcelone. Mon père accepta et m’y conduisit ; quant à moi, comme saint Paul, je gagnais de mes mains ce dont j’avais besoin pour manger, m’habiller, ainsi que pour les livres, les professeurs, etc. Je commençai par demander à la « Direction de la Casa Lonja » mon admission aux classes de dessin ; je l’obtins et j’en tirai quelque profit. Et qui aurait dit que Dieu ferait servir pour la religion le dessin que j’apprenais pour la fabrication ! De fait, cela m’a beaucoup servi pour dessiner les images du catéchisme..."},{"ab":"58","t":"De toutes les choses que j’ai étudiées et auxquelles je me suis appliqué durant ma vie, aucune ne m’a été aussi familière que la fabrication."}]},{"left":[{"p":"Panneau 5","s":"Image rétroéclairée dans la vitrine centrale","i":["La Llotja de Barcelone, où le jeune Claret étudia l’art textile, les langues et le dessin."]},{"p":"Panneau 6","s":"Image rétroéclairée dans la vitrine centrale","i":["L’ancien Séminaire diocésain de Vic : fenêtres donnant sur la cour intérieure.","La Plana de Vic."]}],"right":[{"a":"Ses études à Barcelone déjà bien avancées, et en pleine euphorie de réussite personnelle, quelques événements qui le concernaient directement lui ouvrirent les yeux sur les vanités du monde et sur la possibilité de se donner pleinement au service de l’Évangile et de ses frères."},{"ab":"68","t":"Au milieu de ce tumulte de pensées, alors que j’assistais à la sainte messe, je me suis rappelé avoir lu, tout enfant, ces paroles de l’Évangile : « Que sert à l’homme de gagner le monde entier, s’il vient finalement à perdre son âme ? » Cette parole me causa une profonde impression... elle fut pour moi une flèche qui me perça le cœur ; je me demandais et je réfléchissais à ce que je devais faire, mais je n’y voyais pas clair."},{"ab":"69","t":"Je me suis trouvé comme Saul sur le chemin de Damas ;"},{"a":"En ce moment critique, la rencontre d’un frère convers et le contact avec le Père Amigó, tous deux de l’Oratoire de Saint-Philippe-Néri, furent la lumière qui lui ouvrit de nouveaux horizons."},{"ab":"82","t":"... j’ai quitté Barcelone, où j’avais passé près de quatre ans, après m’y être passablement refroidi dans la ferveur et trop rempli du vent de la vanité, des éloges et des applaudissements..."}]},{"left":[{"p":"Panneau 7","s":"Image rétroéclairée dans la vitrine centrale","i":["Façade arrière de la maison Tortadès et chapelle Notre-Dame-des-Anges, dans le jardin, sur la muraille de Pierre III.","Dessin de la chapelle du jardin, où le jeune séminariste se retirait souvent pour prier.","Statue de Notre-Dame des Anges, restaurée après 1936 par Frederic Marès. Elle se trouve actuellement à Can Tortadès, demeure ancestrale de la famille, dans les Guilleries."]},{"p":"**Panneau 8**","i":["**Ex-voto** allégorique de la tentation. Œuvre de Llucià Costa, de mai 1934, à l’occasion de la béatification."]},{"o":[["9","**Lanterne** de la maison Tortadès de Vic, à l’époque où Claret était étudiant."]]},{"p":"**Panneau 9**","i":["**Lit** de la maison Tortadès, où le jeune séminariste Anton Claret subit une forte tentation contre la chasteté, dont il sortit, avec l’aide de la Vierge, résolument orienté vers le sacerdoce."]}],"right":[{"ab":"83","t":"Dans les premiers jours de septembre 1829, j’ai quitté Barcelone pour Sallent, où mes parents désiraient me garder quelques jours en leur compagnie. Le 29, fête de saint Michel, nous partions pour Vic après avoir entendu la sainte messe. Ce fut un voyage très triste à cause de la pluie qui nous accompagna presque tout le long du chemin. C’est la nuit, et tout trempés, que nous sommes arrivés à Vic."},{"ab":"84","t":"Le lendemain, nous sommes allés rencontrer Mgr l’évêque, Don Pablo de Jesús Corcuera. Il nous reçut très bien. Et afin que j’aie plus de temps pour étudier et pour pratiquer mes dévotions particulières, on me logea chez le majordome du palais épiscopal, Don Fortián Bres, excellent prêtre qui m’aimait beaucoup. Je suis resté chez lui tout le temps que j’ai passé à Vic..."},{"ab":"95","t":"Pendant ma deuxième année de philosophie à Vic, il m’est arrivé ce qui suit : au cours de l’hiver, j’ai été enrhumé et on m’obligea à garder le lit. Un jour, alors que j’étais au lit... une terrible tentation me survint. J’ai eu aussitôt recours à la Sainte Vierge... Tout à coup, je vois la très sainte Vierge qui se présente à moi, très gracieuse et très belle... J’ai vu entre ses bras une grosse guirlande formée des plus belles roses... La Mère de Dieu m’adressa la parole : « Antoine, me dit-elle, si tu vaincs, tu auras cette couronne »... Dès que la scène s’évanouit, je me suis senti délivré de la tentation et rempli d’une joie si grande que je ne comprenais pas ce qui m’était arrivé."}]}]},{"rom":"II","title":"Prêtre et missionnaire du peuple","blocks":[{"left":[{"p":"**Panneau 10**","i":["Le village de Viladrau : l’abbé Claret en desservit la paroisse en 1840.","La croix du sommet du Matagalls, dans le Montseny, dans son état actuel ; elle a succédé à celle que le Père Claret y avait plantée."]},{"o":[["10","Mortier de *Ca l’Herbolari* (copie réalisée par Jordi Pallàs), provenant de la maison de Jaume Bofill, à Viladrau, où, selon une tradition familiale, l’abbé Anton Claret préparait des remèdes à base de plantes médicinales."]]},{"p":"**Panneau 11**","i":["Portrait de l’abbé Claret au début de sa prédication à travers la Catalogne. Gravure de P. Ross, 1894."]}],"right":[{"a":"Le séminariste Antoine Claret fut ordonné prêtre à Solsona le 13 juin 1835. Sa première affectation fut la paroisse de Sallent. Plus tard, il décida d’aller à Rome pour être envoyé en mission, là où l’évangélisation serait la plus nécessaire dans le monde. Mais les chemins du Seigneur étaient autres."},{"a":"À son retour en Catalogne, l’évêque de Vic l’envoya exercer la charge pastorale à Viladrau, village situé sur le versant nord du Montseny."},{"ab":"170","t":"Une fois installé dans la paroisse de Viladrau en qualité de desservant, je veillais de mon mieux au bien spirituel de ces âmes."},{"a":"Pendant son séjour à Viladrau, l’abbé Claret érigea une croix au sommet du Matagalls, dans le Montseny. Le poète et prêtre Jacint Verdaguer le commente ainsi :"},{"a":"« L’infatigable apôtre de la Catalogne, l’abbé Claret... était bien digne de marquer la Catalogne du signe de la Croix, en plaçant sur son front l’étendard de la rédemption. »"},{"ab":"171","t":"C’est pourquoi j’ai été amené à être à la fois médecin des âmes et médecin des corps en utilisant mes connaissances générales et celles que je puisais dans des ouvrages de médecine."},{"ab":"172","t":"C’est à Viladrau que j’ai commencé l’œuvre des missions le 15 août 1840, en prêchant la neuvaine de l’Assomption."}]},{"left":[{"v":"B","r":[["11","Couverts que l’abbé Claret utilisait dans la maison « El Noguer », à Viladrau."],["12","Mouchoir dont se servit le Père Claret."],["13","Crucifix du missionnaire apostolique Claret."],["14","Serviette pliée, utilisée par le saint."],["15","Médaille et croix, parmi celles que le Père Claret distribua lors de la Mission de Lérida, avec un document ancien qui en atteste l’authenticité."],["16","Petit gobelet de poche."],["17","Mouchoir plié."]]},{"n":"*(18-19)*"},{"p":"**Panneau 12**","i":["Pages de l’Autobiographie où le Père Claret mentionne quelques-uns des villages où il prêcha au cours de ces années."]}],"right":[{"ab":"193","t":"Vers le milieu de janvier 1841, après avoir été desservant de Viladrau pendant huit mois, administrant la cure et sortant de temps en temps prêcher, sur l’ordre du prélat, dans différentes paroisses, je partis finalement pour prêcher sans relâche là où le prélat m’enverrait, sans me fixer nulle part."},{"ab":"460","t":"Quant à moi, pendant ces sept ans, j’allais d’une localité à l’autre. J’allais seul et toujours à pied... Je marchais cinq heures le matin et cinq heures l’après-midi..."},{"ab":"297","t":"Dès le début, j’ai adopté le style même de l’Évangile : la simplicité et la clarté. C’est pourquoi je me servais de comparaisons, d’images, d’exemples historiques et réels, la plupart tirés des saintes Écritures."},{"ab":"221","t":"Ce qui m’a toujours poussé le plus, c’est de contempler Jésus-Christ allant d’une localité à l’autre, prêchant partout, non seulement dans les grandes villes, mais aussi dans les hameaux, et jusqu’à une seule femme, comme il le fit avec la Samaritaine..."}]},{"left":[{"v":"C","r":[["20","Statue de saint Antoine de Padoue, patron de l’abbé Antoine Claret, bénie par le missionnaire lui-même."]]},{"v":"D","r":[["21","Serviette utilisée par le Père Claret. Elle provient de Sabadell."],["22","Barrette qu’il porta pendant la mission prêchée à Valls."],["23","Croix que le saint bénit pour une famille d’Albí, près de Lérida."],["24","Parapluie dont se servait le Père Claret."],["25","Cilice (instrument de pénitence)."],["26","Image de la Pentecôte que le Père Claret gardait dans son bréviaire."],["(27-28)",""],["29","Statue du Père Claret missionnaire, catéchiste et écrivain. Œuvre de Domènec Fita, 1990."]]},{"v":"E","r":[["30","Souliers et mouchoir du missionnaire Claret. Ses souliers lui furent échangés pendant la mission qu’il prêcha à Lérida en mai 1846. Au cours de l’évangélisation de cette région, les habitants de Lérida commencèrent à l’appeler affectueusement « Père Claret », une expression qui s’enracina aussitôt et qui lui est restée pour toujours."]]}],"right":[]},{"left":[{"v":"F","r":[["31","Vers d’un auditeur dévot, qui y résume les sermons de saint Antoine-Marie Claret entendus à la basilique Santa Maria del Mar de Barcelone pendant tout le mois de mai 1844."],["32","Registre des retraitants de la Maison Mère de Vic, depuis la fondation de la congrégation des Clarétains. Le premier retraitant qui y figure (1850) est « l’Illustrissime Don Anton Claret, archevêque élu de Cuba »."],["33","Dessin-portrait du Père Claret publié à Barcelone pendant sa prédication aux îles Canaries, et qui connut une très large diffusion en terres catalanes."]]}],"right":[{"a":"Jaume Balmes a dit du Père Claret, prédicateur en Catalogne : « En chaire, il ne parle jamais de théâtres. Il ne parle pas non plus d’hérésies. Ni de philosophes, ni d’incroyants. Il suppose toujours la foi... Peu de terreur, de la douceur en tout. Les exemples étaient, en général, tirés de l’Écriture sainte. »"},{"ab":"480","t":"... nous sommes partis de Madrid pour Séville, Xérès et Cadix, où j’ai prêché. De là, nous nous sommes embarqués pour les Canaries. Au début de février, nous avons débarqué à Tenerife, où j’ai prêché le dimanche. Le lundi, nous sommes partis pour la Grande Canarie. Là, j’ai donné les exercices spirituels aux prêtres dans une salle du palais, sous la présidence de Mgr l’Évêque. J’ai aussi donné les exercices spirituels aux séminaristes et j’ai prêché la mission dans toutes les paroisses de l’île de la Grande Canarie."},{"ab":"481","t":"Très souvent, je devais prêcher sur les places parce que les églises ne pouvaient accueillir la multitude qui se réunissait dans toutes les localités pour suivre la mission."},{"a":"Voici quelques témoignages que le P. Brossosa recueillit dans les milieux populaires des îles Canaries : « Comme le Père Claret, personne » ; « il était rempli de l’Esprit de Dieu » ; « lui, nous le comprenions tous... et tout ce qu’il disait » ; « pendant que nous l’écoutions, il nous remplissait, il nous remplissait... »."}]},{"left":[{"o":[["34","Deux lettres du Père Claret à M. Felip Ribó, de Caldes de Montbui, au sujet de la diffusion religieuse par l’écrit (photographie des originaux), et un autographe où il propose que l’on fasse des dons."],["35","Copie manuscrite de l’Autobiographie du Père Claret, réalisée par les premiers missionnaires (deux volumes), avec une note initiale du Vénérable Père Clotet, compagnon du Père Claret et cofondateur de la Congrégation des Missionnaires Clarétains."],["36","Vie du Père Claret, alors Vénérable, écrite par l’historien clarétain P. Mariano Aguilar."]]}],"right":[{"ab":"483","t":"Quand la mission prenait fin, tous les fidèles m’accompagnaient hors de la ville pendant que les gens du village où je me rendais venaient m’accueillir. Les premiers me disaient au revoir en pleurant et les autres me recevaient avec joie."},{"ab":"486","t":"Quand j’ai quitté les Canaries, au début de mai 1849... Mon séjour aux Canaries a duré quinze mois, au cours desquels j’ai pu travailler tous les jours, avec la grâce de Dieu."},{"ab":"487","t":"Ô mon Dieu, que vous êtes bon ! De quels moyens si inespérés vous vous servez pour la conversion des pécheurs !"}]},{"left":[{"v":"G","r":[["37","Feuillet de fondation de l’Archiconfrérie du Cœur de Marie en l’église Saint-Dominique de Vic, en 1847, après la neuvaine que le Père Claret y prêcha en août de la même année."],["38","Feuillet du Rosaire à la très sainte Vierge Marie."],["39","Goigs et al·leluies (cantiques et feuilles illustrées populaires) du Cœur Immaculé de Marie, enrichis d’indulgences par l’Archevêque Claret."],["40","Livrets concernant l’Archiconfrérie du Cœur de Marie."],["41","Livres sur le Rosaire et d’autres dévotions mariales."],["42","Registre des premiers membres de l’Archiconfrérie du Cœur de Marie."],["43","Chapelet des sept douleurs de la Vierge, que le Père Claret bénit et offrit."],["44","Couronne des douze étoiles qu’il offrit à une fillette."],["45","Chapelets confectionnés par le saint."],["46","Lettre du saint à sa sœur Rosa, où il lui parle de ses visites à Notre-Dame de Fussimanya."],["47","Prière autographe du Père Claret à la Vierge."],["48","Statue de Notre-Dame du Pilar."],["49","Bannière de l’Archiconfrérie du Cœur de Marie de Vic. On y voit représentés plusieurs de ses membres : saint Pierre Almató, sainte Joaquina de Vedruna, Jaume Balmes, l’abbé Jacint Verdaguer, le P. Josep Xifré, et les évêques de Vic Llucià Casadevall, Josep Morgades et Josep Torras i Bages."]]},{"box":["Sans numéro","**Vitrail** aux armes épiscopales du Père Claret, à l’endroit exact où, de 1940 à 1970, il laissait passer la lumière derrière le tombeau du saint. Le musée occupe aujourd’hui le même niveau où se trouvait la chapelle provisoire de la Merci, en attendant la construction du temple-sépulcre.","*Dans les armoiries épiscopales du P. Claret, on voit :* le nom de Marie, le soleil et la lune (allusion aux noms de famille CLARET et CLARÀ), le pont de Sallent sur le Llobregat (référence à sa ville natale) et la devise « CARITAS CHRISTI URGET NOS » (L’amour du Christ nous saisit)."]}],"right":[{"ai":"*Le Père Claret institua l’Archiconfrérie du Cœur de Marie pour la conversion des pécheurs en l’église Saint-Dominique de Vic, en août 1847. Pendant la neuvaine, plus de 10 000 personnes s’y inscrivirent. Parmi elles, saint Pierre Almató, avec tous ses compagnons du noviciat des Pères Dominicains d’Ocaña.*"}]},{"left":[{"p":"**Panneau 13**","i":["Prière que le Père Claret récitait à la Vierge au début de ses prédications au peuple."]},{"v":"H","r":[["50","Statue de Notre-Dame des Douleurs bénie par le Père Claret. Il était membre de la Confrérie des Douleurs de Vic."]]}],"right":[{"ab":"270","t":"Ô Vierge et Mère de Dieu, mère et avocate des pauvres et malheureux pécheurs, vous savez bien que je suis votre fils et votre ministre, formé par vous-même dans la forge de votre miséricorde et de votre amour. Je suis comme une flèche placée dans votre main puissante..."}]}]},{"rom":"III","title":"Apôtre écrivain","blocks":[{"left":[{"v":"I","r":[["51","Livres destinés à différentes catégories de personnes."],["52","***« Consejos que una madre da a su hijo a punto de marcharse a la guerra »*** (Conseils d’une mère à son fils sur le point de partir à la guerre). Le sens pratique du missionnaire lui suggéra l’idée de réduire ce petit ouvrage au minimum de taille et de poids."],["53","***« El Ferrocarril »*** (Le chemin de fer). À une époque où le transport interurbain passait de la diligence tirée par des chevaux au train à vapeur, le chemin de fer ne pouvait manquer de frapper les esprits. Le Père Claret l’utilise comme symbole en trois étapes progressives."],["54","***« Las Hijas del Corazón de María »*** (Les Filles du Cœur de Marie), religieuses chez elles. Ce sont aujourd’hui les Missionnaires de la « Filiation Cordimarienne »."],["55","Opuscules divers."]]}],"right":[{"ab":"310","t":"Un des moyens que l’expérience m’a fait découvrir comme le plus puissant pour le bien, c’est l’imprimerie ; c’est aussi l’arme la plus puissante pour faire le mal si on en abuse."},{"ab":"311","t":"Je dis que c’est une nécessité parce que les gens ont une grande passion pour la lecture ; s’ils ne trouvent pas de bons livres, ils en liront des mauvais."},{"ab":"312","t":"De nos jours, il importe plus que jamais de faire circuler de bons livres. Notons cependant qu’ils ne doivent pas être gros et encombrants parce que les gens vont vite. Ils sont interpellés de toutes parts et de mille manières..."},{"ab":"313","t":"Le premier livre que j’ai publié contenait des conseils et des avis spirituels que j’avais écrits pour les religieuses de Vic... Encouragé par les bons résultats de mon premier ouvrage, j’ai décidé d’en écrire un deuxième : Avisos a las Doncellas. Ont suivi : Avisos a los Padres de familia, a los niños, a los jóvenes..."},{"ab":"323","t":"Grâce à Dieu, tous les livrets ont produit d’heureux résultats ; mais ceux par lesquels j’ai trouvé le plus d’âmes converties sont : **El camino recto** et **El Catecismo explicado**... Tous le cherchent et n’ont de repos qu’après l’avoir obtenu."}]},{"left":[{"v":"J","r":[["56","***« Camino recto y seguro para llegar al cielo »*** (Le chemin droit et sûr pour arriver au ciel). Succession d’éditions en catalan et en castillan."],["57","Éditions en d’autres langues : basque, portugais, pangasinan (des Philippines)."]]}],"right":[{"a":"« CAMINO RECTO Y SEGURO PARA LLEGAR AL CIELO » (en catalan, « Camí dret i segur per arribar al cel ») a été le manuel de formation à la piété et à la vie chrétienne le plus populaire d’Espagne. On estime à environ deux millions le nombre d’exemplaires imprimés."},{"a":"C’est l’ouvrage le plus édité en langue catalane, et celui qui compte le plus grand nombre d’exemplaires au total. L’édition originale catalane parut en 1843 : c’était un opuscule de 48 pages. Les éditions se succédèrent rapidement et, avec les améliorations et les ajouts de chacune, l’ouvrage finit par atteindre 500 pages. À la fin du siècle, on en comptait 250 éditions, soit quelque 800 000 exemplaires."},{"a":"« EL CAMINO RECTO » fut édité en langue pangasinan, à Manille, en 1884. L’exemplaire exposé est une réédition faite en Tchécoslovaquie."},{"a":"Saint Antoine-Marie Claret est le seul auteur catalan à avoir été traduit dans des langues malaises (tagalog, visayan, ilocano, pangasinan)."}]},{"left":[{"v":"K","r":[["58","***« Catecismo explicado »***. Premières éditions."],["59","Planches du ***« Catecismo explicado »***."],["60","***« Maná del Cristiano »***."],["61","***« El santo evangelio de Nuestro Señor Jesucristo según san Mateo »***."],["62","***« La Santa Ley de Dios »***."],["63","***« Nuevo manojito de flores »***."],["64","***« La Llave de Oro »***."]]}],"right":[{"ab":"285","t":"Parce que j’aimais les enfants et voulais qu’ils soient instruits dans la doctrine chrétienne, j’ai écrit quatre catéchismes : un pour les tout-petits, jusqu’à sept ans, un autre pour les gens simples, un autre un peu plus étendu et un quatrième expliqué et illustré."},{"ab":"287","t":"Le catéchisme aux adultes est, à ma connaissance, le meilleur moyen de faire du bien. Par le catéchisme, on les tire de leur ignorance..."}]},{"left":[{"v":"L","r":[["65","***« El Colegial o seminarista instruído »***."],["66","***« La vocación de los niños »***."],["67","***« Colección de opúsculos »***."],["68","***« A la juventud estudiosa y cristiana »***. ***« La Colegiala Instruída »***."],["69","***« L’egoismo vinto »*** (l’une de ses dernières œuvres)."],["70","Quelques-uns des innombrables livres publiés par la « Librairie Religieuse ». Parmi eux se distingue la Bible : un exemplaire de la troisième édition, avec des manicules (petites mains imprimées) qui signalent les passages que le Père Claret jugeait les plus remarquables."],["71","« Ex-libris » de l’Archevêque Claret. On y trouve la dédicace personnelle d’un auteur."]]}],"right":[{"ab":"329","t":"Dans le but de pouvoir donner et vendre le moins cher possible, j’ai pensé établir une Imprimerie Religieuse sous la protection de Notre-Dame de Montserrat..."},{"a":"Fondée en décembre 1848, la Librairie Religieuse publia, du vivant de son fondateur, quelque dix millions d’imprimés. Son œuvre éditoriale s’est poursuivie jusqu’à nos jours."},{"ab":"331","t":"Grâce à la Librairie Religieuse, les ecclésiastiques et les laïcs peuvent se procurer de bons livres, les meilleurs qui soient, à un prix très bas..."}]},{"left":[{"p":"**Panneau 14**","i":["Planches du ***« Catecismo explicado »*** dessinées par le saint."]},{"v":"M","r":[["72","Bureau personnel du Père Claret."]]},{"p":"**Panneau 15**","i":["L’écrivain missionnaire : photographie prise à Paris en 1868."]}],"right":[{"a":"L’autre livre est le CATECISMO DE LA DOCTRINA CRISTIANA EXPLICADO Y ADAPTADO A LA CAPACIDAD DE LOS NIÑOS, y adornado con muchas láminas, por el Rev. D. Antonio Claret, Presbítero (Catéchisme de la doctrine chrétienne expliqué et adapté à la capacité des enfants, orné de nombreuses planches, par le Rév. D. Antoine Claret, prêtre)."},{"a":"L’originalité de cet ouvrage fut sa méthode intuitive, la pédagogie par l’image. L’auteur y devançait son temps. La Librairie Religieuse en publia 170 000 exemplaires en catalan et 145 000 en castillan."},{"ab":"56","t":"Et qui aurait dit que Dieu ferait servir pour la religion le dessin que j’apprenais alors pour la fabrication ! En effet, cela m’a servi beaucoup pour faire des dessins pour le catéchisme et sur des sujets mystiques."}]}]},{"rom":"IV","title":"Fondateur des Missionnaires Clarétains","blocks":[{"left":[{"box":[null,"**Cellule** où le Père Claret fonda la Congrégation des Missionnaires Fils du Cœur Immaculé de Marie, le 16 juillet 1849. C’était une simple chambre de séminariste, située au troisième étage de l’ancien séminaire. La fenêtre donnait sur la cour intérieure."]},{"sub":"***Les éléments d’origine de cette même cellule sont :***"},{"o":[["73","La porte,"],["74","la fenêtre."],["75","Les poutres et le pavement."],["76","Les carreaux du sol. Les 87 centimètres de carreaux du côté de la fenêtre proviennent de la cellule qu’occupait le P. Esteve Sala, cofondateur."],["77","Le tableau du Cœur de Marie qui présida à la fondation."],["78","La table et la chaise furent aussi utilisées par le Père Claret dans la maison de son frère Josep, à Olost de Lluçanès, ou à d’autres moments de sa vie."]]}],"right":[{"ab":"488","t":"Vers le milieu de mai, je suis arrivé à Barcelone et je suis retourné à Vic. Là, j’ai parlé avec les chanoines Soler et Passarell, à qui j’ai soumis mon projet de fonder une congrégation de prêtres qui seraient et s’appelleraient Fils du Cœur Immaculé de Marie."},{"ab":"489","t":"... je suis allé rencontrer un certain nombre de prêtres, à qui Dieu avait donné le même esprit dont j’étais animé. Voici leurs noms : Esteban Sala, José Xifré, Domingo Fábregas, Manuel Vilaró, Jaime Clotet et moi, le moindre de tous."},{"ab":"490","t":"Le 16 juillet 1849, réunis avec l’approbation de Mgr l’évêque et du recteur du séminaire, nous avons commencé les exercices spirituels dans les locaux du séminaire ; nous les avons faits avec rigueur et ferveur... Nous sommes tous sortis de ces exercices très fervents, résolus et déterminés à persévérer dans notre dessein. Grâce à Dieu et à la sainte Vierge, tous ont persévéré."},{"a":"Le début des exercices spirituels, le 16 juillet, à trois heures de l’après-midi, dans la cellule d’un séminariste, marqua la naissance de la Congrégation clarétaine."}]},{"left":[{"p":"**Panneau 16**","i":["Les cofondateurs :"],"names":["***Saint Antoine-Marie Claret***","*Vénérable Jaume Clotet*","*Esteve Sala*","*Josep Xifré*","*Domènec Fàbregas*","*Manuel Vilaró*"]},{"o":[["80","**Horloge** de l’escalier qui marquait les heures dans la partie du séminaire où eut lieu la fondation. Les aiguilles indiquent trois heures de l’après-midi, heure à laquelle commença la fondation."]]},{"p":"**Panneau 17**","i":["Définition du Missionnaire Fils du Cœur de Marie, rédigée par le saint fondateur."]}],"right":[{"ab":"491","t":"C’est ainsi que nous avons commencé, et c’est ainsi que nous continuions, en menant strictement une vie parfaitement commune. Tous, nous travaillions dans le saint ministère."},{"ab":"494","t":"Je me disais à moi-même : un fils du Cœur Immaculé de Marie est un homme qui brûle de charité et qui embrase tout sur son passage. Il désire efficacement et essaie par tous les moyens d’enflammer le monde entier du feu de l’amour divin. Rien ne l’arrête. Il se réjouit des privations, aborde les travaux, embrasse les sacrifices, se complaît dans les calomnies, se réjouit dans les tourments. Il ne pense à rien d’autre qu’à suivre et imiter Jésus-Christ dans la prière, le travail et la souffrance, en cherchant toujours et uniquement la plus grande gloire de Dieu et le salut des âmes.","caps":true}]}]},{"rom":"V","title":"La Maison Mère","blocks":[{"left":[{"v":"N","r":[["81","Maquette de l’ancien couvent de la Merci, que l’évêque de Vic céda à la nouvelle communauté missionnaire et qui devint, en octobre 1849, la Maison Mère de la Congrégation des Missionnaires Clarétains. Dès le début, elle fut aussi une Maison d’Exercices spirituels pour les laïcs et les prêtres."]]},{"p":"Panneau 18","s":"images rétroéclairées au centre","i":["Autour de la maquette, des photographies de différents moments historiques de la Maison Mère de Vic :","À l’époque de la fondation.","Travaux de rénovation des années 1928-1930, sous la direction du martyr P. Jaume Girón.","Projet de restauration de l’église dans son style d’origine, gothique conventuel.","La destruction de juillet 1936.","Aujourd’hui."]}],"right":[{"a":"Quelques données sur le couvent de la Merci de Vic :"},{"chron":[["1235","Le 19 novembre, Jacques Ier fonde la maison mercédaire de Vic."],["1254","La fondation devient effective dans l’actuelle rue Sant Pere, là où se trouve aujourd’hui l’hôpital de Vic."],["1264","Les mercédaires s’installent à l’endroit où se trouve aujourd’hui l’église Saint-Dominique."],["1367","Ils achètent une maison à l’endroit où s’élèvera plus tard le couvent de la Merci."],["1383","Vers cette année, la construction de l’église de la Merci, de style gothique conventuel, a déjà commencé."],["1580","Le cloître aurait été construit à cette époque."],["1620","On construit dans l’église les voûtes baroques qui défigurent le style d’origine."],["1733","On construit la nouvelle porte de l’église. La date qu’on pouvait y lire était 1734."],["1835","Les religieux sont expulsés du pays."],["1849","Octobre : les Missionnaires Clarétains, fondés le 16 juillet de la même année dans l’ancien séminaire, s’installent dans le couvent des mercédaires."]]}]},{"left":[{"o":[["82","**Autel** de la chapelle de la Maison d’Exercices de la Merci où, dès le début, les missionnaires clarétains exerçaient le ministère apostolique des Exercices spirituels. Une tradition qui se poursuit dans l’actuelle « Maison de Spiritualité Père Claret » (Casa d’Espiritualitat Pare Claret), sur la Rambla de Sant Domènec, œuvre du Père Lluís Pujol CMF, fondateur des Missionnaires de l’Institution Clarétaine."]]},{"v":"O","r":[["83","Statue de Notre-Dame de la Merci bénie par le saint. Elle provient du noviciat des Pères des Écoles Pies (piaristes) d’Alella."],["84","Buste du Vénérable Jaume Clotet, cofondateur de la Congrégation des Missionnaires Clarétains et premier biographe du saint. Œuvre de Josep Vilarrúbias CMF, 1990."],["85","**Pierre tombale** du Père Claret, qui se trouvait dans l’ancienne église de la Merci. Les armoiries, restaurées, sont l’œuvre de Jordi Pallàs."]]}],"right":[]},{"left":[{"box":[null,"**Cellule** du troisième étage de l’ancien séminaire, qu’occupa le Père Claret pendant les premiers mois de la fondation. La fenêtre donnait sur la rue Sant Hipòlit, aujourd’hui rue Sant Miquel dels Sants."]},{"sub":"***Les éléments d’origine de cette même cellule sont :***"},{"o":[["86","La porte,"],["87","la fenêtre,"],["88","Les poutres et le sol. Les 87 centimètres de carreaux du côté de la fenêtre proviennent de la cellule qu’occupait le P. Esteve Sala."],["89","La serviette de la table de toilette est un objet dont le Père Claret se servit quelques années plus tard. *Le mobilier est un fac-similé, d’après la description faite par le Père Clotet dans le récit de la fondation.*"]]}],"right":[{"a":"Dans cette chambre, le Père Claret vécut une grande souffrance et une profonde angoisse tandis qu’il discernait la volonté de Dieu : accepter sa nomination comme archevêque ou y renoncer, étant donné l’immense champ d’apostolat qui s’ouvrait devant lui. La nomination lui parvint en août et il ne l’accepta que le 4 octobre. C’est d’ici qu’il écrivit des lettres douloureuses à l’Évêque, au Nonce, au Ministère de la Justice..."},{"a":"Saint Antoine-Marie Claret fonda, outre les MISSIONNAIRES CLARÉTAINS et les MISSIONNAIRES CLARÉTAINES, d’autres institutions, comme l’Académie Saint-Michel, qui se prolonge aujourd’hui dans le MOUVEMENT DES LAÏCS CLARÉTAINS, et les Religieuses chez elles, actuellement Institut séculier FILIATION CORDIMARIENNE."}]}]},{"rom":"VI","title":"Évêque missionnaire","blocks":[{"left":[{"v":"P","r":[["90","**Bulle pontificale** du pape Pie IX nommant le Père Claret archevêque de Santiago de Cuba."]]},{"p":"**Panneau 19**","i":["La première réaction du Père Claret face à sa nomination."]},{"v":"Q","r":[["91","Amict de l’Archevêque Claret."],["92","Surplis."],["93","Deux livres de cette période de la vie du saint : ***« Apuntes del Arzobispo Claret »***, qu’il rédigea lui-même pour son usage personnel dans le gouvernement du diocèse et qui furent publiés par la suite ; ***« Las delicias del Campo »*** (Les délices de la campagne), pour la promotion des paysans."],["94","Corporaux avec lesquels il célébrait l’Eucharistie."],["95","Ruban de Notre-Dame de la Charité du Cobre, patronne du diocèse de Santiago de Cuba. Sa longueur est égale à la hauteur de la statue de la Vierge du Cobre."],["96","Objets personnels : rasoir, pierre à aiguiser, couteaux pliants, ciseaux."]]},{"v":"R","r":[["97","Mitre de l’Archevêque Claret."],["98","Croix pectorale et anneau épiscopal."]]}],"right":[{"ab":"491","t":"Or, le 11 août, pendant que je donnais la dernière conférence des exercices, on est venu m’attendre au pied de la chaire pour me dire d’aller à l’évêché. À mon arrivée, Mgr l’évêque m’a remis la nomination royale, datée du 4 août, à l’archevêché de Cuba."},{"ab":"495","t":"J’étais effrayé de ma nomination comme archevêque de Cuba ; je n’ai pas voulu accepter car je me considérais indigne et incapable ; je n’avais ni la science ni les vertus nécessaires... même si j’avais eu la science et les vertus nécessaires pour cette charge, je ne devais pas abandonner la Librairie Religieuse et la Congrégation, qui venaient de naître."},{"ab":"538","t":"Pendant les deux premières années, malgré les séismes et le choléra, mes compagnons et moi avons visité toutes les paroisses de l’archidiocèse, prêchant des missions partout, même dans les paroisses rurales, qui sont très étendues."},{"ab":"547","t":"Ma première lettre pastorale date du 20 septembre 1852. Elle était adressée au clergé."},{"ab":"549","t":"Ma deuxième lettre pastorale a été adressée aux fidèles, le 25 mars 1853, afin de leur rappeler ce que nous avions enseigné pendant les missions et la visite pastorale."},{"ab":"555","t":"J’ai restauré le séminaire. Pendant plus de trente ans aucun séminariste interne n’avait été ordonné."},{"ab":"563","t":"Mon amour pour les pauvres m’a aussi conduit à leur acheter une propriété à Puerto Príncipe."},{"ab":"564","t":"Cette œuvre avait pour but de recueillir des enfants pauvres, garçons et filles, dont beaucoup se perdaient dans les rues, où ils mendiaient. En plus de leur assurer nourriture et habillement, on leur enseignerait la religion, la lecture, l’écriture, etc. et on leur apprendrait un métier, à leur choix."},{"ab":"566","t":"Dans la partie antérieure de la maison on trouvait un laboratoire de physique, un autre de chimie, une salle pour les instruments agricoles et une bibliothèque. Il faut mentionner que tout le monde avait accès à la bibliothèque deux heures le matin et deux heures l’après-midi. Quant à la classe d’agriculture, elle était ouverte trois jours par semaine à tous ceux qui voulaient y assister. Le reste du temps, elle était réservée aux internes."},{"ab":"568","t":"Au fur et à mesure que l’œuvre se développait, j’ai écrit un livre intitulé *Delicias del campo*. Ce livre a été d’une grande utilité dans l’île, de sorte que les propriétaires des grandes fermes le donnaient à leurs régisseurs en leur demandant de s’en inspirer."},{"ab":"569","t":"Une autre de mes fondations est la caisse d’épargne, dont le but est de venir en aide aux pauvres et de leur apprendre à se prendre en main et à être prévoyants. J’avais remarqué que si on donne aux pauvres un moyen honnête de gagner leur vie et si on leur enseigne une bonne règle de conduite, ils mènent une vie honnête et vertueuse."},{"ab":"561","t":"J’ai aussi fondé un couvent de religieuses enseignantes pour les filles et je leur ai acheté une maison..."},{"a":"Il s’agit des Religieuses Enseignantes de Marie Immaculée, qu’il fonda à Cuba avec la Mère Antonia París, et qui prirent ensuite le nom de CLARÉTAINES."},{"ab":"570","t":"Je visitais souvent les prisonniers. Je leur faisais le catéchisme et leur prêchais... Nous veillions à ce que les prisonniers puissent apprendre, dans leur prison, la lecture, l’écriture, la religion et même un métier. Nous avions installé quelques ateliers dans la prison..."}]},{"left":[{"v":"S","r":[["99","Oreiller taché du sang de l’archevêque après l’attentat dont il fut victime dans la ville de Holguín, à Cuba, le 1er février 1856."]]}],"right":[{"ab":"575","t":"Soudain, un homme s’est rapproché de moi, comme s’il voulait baiser mon anneau pastoral ; mais au moment même, il allongea le bras armé d’un rasoir dont il m’asséna un coup de toute sa force."},{"ab":"577","t":"Je ne saurais expliquer la joie extraordinaire que j’éprouvais dans mon cœur, en pensant que j’avais obtenu ce à quoi j’aspirais si fortement, c’est-à-dire, verser mon sang pour l’amour de Jésus et de sa mère Marie et sceller de mon sang les vérités évangéliques."}]},{"left":[{"p":"**Panneau 20**","i":["Sainte JOAQUINA DE VEDRUNA, fondatrice des Carmélites de la Charité. Vic.","Vénérable MARIA ANTÒNIA PARÍS, qui fonda, avec l’Archevêque Claret, la Congrégation des Religieuses de Marie Immaculée (Missionnaires Clarétaines).","Sainte MICAELA DU SAINT-SACREMENT, fondatrice des Religieuses Adoratrices. Madrid.","Saint FRANCESC COLL, OP, fondateur des Dominicaines de l’Annonciation (Anunciata).","Saint PIERRE ALMATÓ, dominicain, que le Père Claret aida dans son discernement vocationnel."]},{"p":"**Panneau 21**","i":["Tableau de l’Archevêque de Cuba, réalisé avec des morceaux de vêtements portés par le Père Claret lui-même. Œuvre exécutée par des Missionnaires Clarétaines de Cuba du vivant du saint."]}],"right":[{"h":"**Conseiller spirituel de fondateurs :**"},{"a":"Saint Antoine-Marie Claret prit une part active à l’animation spirituelle et apostolique d’hommes et de femmes d’Église, de saints et de fondateurs de diverses congrégations religieuses."}]},{"left":[{"p":"**Panneau 22**","i":["Diplôme de l’Académie Saint-Michel, dessiné et signé par l’Archevêque Claret."]}],"right":[{"ab":"581","t":"La troisième chose a été le plan de l’Académie Saint-Michel. J’en ai eu la première idée pendant les premiers jours de ma convalescence. Dès que j’ai pu me lever, j’ai dessiné l’emblème et j’ai écrit le règlement de cette association..."},{"a":"L’Académie Saint-Michel fut l’une des grandes intuitions pastorales et ecclésiales du Père Claret : la présence active des laïcs dans l’Église, appelés à l’apostolat à partir de leurs diverses professions : intellectuels, artistes, écrivains, musiciens..."}]}]},{"rom":"VII","title":"Confesseur royal","blocks":[{"left":[{"p":null,"i":["(Sur ce même panneau 22) Lettre dans laquelle l’Archevêque Claret, déjà à Madrid, fait ses adieux à l’Église de Cuba."]},{"v":"T","r":[["100","Chasuble de l’oratoire privé des sœurs Bertrana i Forcada de Vic, avec laquelle le P. Claret célébra la messe le 26 août 1865."]]}],"right":[{"ab":"587","t":"J’avais déjà commencé la mission depuis quelques jours, lorsque j’ai reçu un ordre royal qui m’enjoignait de me rendre à Madrid parce que l’archevêque de Tolède, confesseur de la reine, était mort et que Sa Majesté m’avait nommé pour le remplacer."},{"ab":"588","t":"J’ai reçu l’ordre royal le 18 mars et le 22 je partais de Santiago pour La Havane où je devais prendre le vapeur vers Cadix."},{"ab":"621","t":"Parfois je me dis que Dieu m’a envoyé à ce poste pour que ce soit mon purgatoire afin d’y expier les péchés de ma vie passée... Je soupire constamment après le jour où j’en sortirai. Je suis comme un oiseau en cage qui touche à tous les barreaux pour voir s’il peut s’échapper ; ainsi je cherche le moyen d’en sortir."}]},{"left":[{"v":"U","r":[["101","Couverts aux initiales A C (Antonio Claret), offerts par la reine Isabelle II à l’Archevêque."],["102","Médaille de l’Immaculée : félicitation à Marie pour son Immaculée Conception."],["103","Médaille de saint Benoît."],["104","Médaille de saint Jean de Dieu."],["105","Médaille commémorative du XVIIIe centenaire du martyre des apôtres saint Pierre et saint Paul."],["106","Médaille de la chapelle de Notre-Dame de Montserrat de Madrid."],["107","Croix porte-paix."],["108 al 111","Croix bénites, portées ou offertes par le saint."],["112","Étiquette numérotée du linge de l’Archevêque."],["113","Photographie originale, des dernières années de sa vie."],["114","Carte de visite."],["115 al 117","Photographies de la fin de sa vie, prises à Madrid et à Paris."],["118","Représentations sarcastiques de l’archevêque confesseur de la Reine, sur des boîtes d’allumettes (copies, avec l’aimable autorisation du Musée Marès de Barcelone)."],["119","Allusion caricaturale au P. Claret comme confesseur royal, dans une « auca » (feuille illustrée populaire) sur la révolution de 1868."]]}],"right":[{"ab":"638","t":"J’éprouve une sainte émulation et presque de l’envie à l’égard des missionnaires qui ont le bonheur de pouvoir aller de village en village prêcher le saint Évangile."},{"a":"Les voyages que le Père Claret dut faire avec la famille royale, il les transforma en une mission gigantesque. Villes et villages de toutes les régions d’Espagne furent témoins de l’incessante action apostolique de Claret auprès de toutes sortes de personnes."},{"ab":"639","t":"Au milieu de mes peines, j’ai pourtant quelque consolation : quand je pars en voyage avec Leurs Majestés et Leurs Altesses, j’ai l’occasion de prêcher au peuple le matin, avant que Leurs Majestés ne sortent ; ensuite je prêche dans les couvents aux moniales, aux Sœurs, aux prêtres, aux étudiants, aux messieurs et aux dames des Conférences, etc., de sorte que je passe toute la journée à prêcher."},{"ab":"640","t":"Depuis mon arrivée à Madrid, une de mes occupations les plus importantes a été l’apostolat de la presse : écrire des livres et des feuilles volantes..."},{"ab":"798","t":"Cette année, j’ai été très calomnié et persécuté de toute sorte de personnes, qui se servaient de journaux, de pamphlets, de photographies. Ils ont même contrefait et ridiculisé mes livres..."},{"a":"Dans le journal madrilène « LA ESPERANZA » du 24 janvier 1865, on lit : *« Les amis de Mgr Claret lui ont plusieurs fois conseillé de se défendre mais il a toujours répondu que le meilleur moyen de défense est de ne pas faire de cas, tout en priant Dieu pour ses adversaires comme Jésus l’a fait sur la croix... »* (Cité dans Aut. 867)"}]}]},{"rom":"VIII","title":"Le passage vers la Maison du Père","blocks":[{"left":[{"p":"**Panneau 23**","i":["Vue générale du monastère cistercien de Fontfroide, en Languedoc, où le Père Claret mourut en exil le 24 octobre 1870."]},{"v":"V","r":[["120","Crucifix qui accompagna l’agonie du Père Claret. La communauté cistercienne de Fontfroide en fit don à la Congrégation clarétaine."]]}],"right":[{"a":"Durant les derniers mois de sa vie, l’Archevêque Claret prend une part active au concile Vatican I."},{"a":"Exilé et persécuté, il se retire au monastère cistercien de Fontfroide, dans le sud de la France, où son état de santé s’aggrave et où il meurt saintement, entouré d’un groupe de missionnaires clarétains et de moines du monastère."},{"a":"Le Vénérable Père Clotet, témoin de ces événements et premier biographe du saint, écrivit : « La paix, la joie et la ferveur qu’il montra durant sa dernière maladie furent admirables : il ne se lassait pas de baiser le crucifix et de faire de ferventes oraisons jaculatoires."},{"a":"Avec une paix inaltérable, et le crucifix entre les mains, le 24 octobre, à 8 h 45 du matin, il remit paisiblement son âme au Seigneur. »"},{"a":"Sur la dalle funéraire de l’archevêque Claret, au monastère de Fontfroide, on pouvait lire les dernières paroles de saint Grégoire VII :"},{"epi":["**J’AI AIMÉ LA JUSTICE ET HAÏ L’INIQUITÉ,**","**C’EST POURQUOI JE MEURS EN EXIL.**"]}]},{"left":[{"p":"**Panneau 24**","i":[]},{"o":[["121","Broderies aux armes de l’Archevêque Claret et de la Congrégation des Missionnaires Fils du Cœur de Marie, qui ornaient le cercueil lors de la translation solennelle du corps du Père Claret de Fontfroide à Vic, en 1897."]]}],"right":[{"a":"Le 13 juin 1897, les vénérables restes du saint furent transférés de Fontfroide à Vic. L’enthousiasme fut indescriptible dans les localités tr
