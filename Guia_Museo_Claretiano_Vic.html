function vInfo(){setTab('info');main.innerHTML=INFO[LANG]();}

/* ---------- object sheet ---------- */
const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
let lastFocus=null;
function openObj(i){
  const o=OBJ[i]; const st=STAGES[o.si]; const b=st.blocks[o.bi]; const T0=t();
  const key='s'+i; SAY[key]=[{tx:plain(o.text),l:T0.speechLang},...sayParts(b.right)];
  const prev=OBJ[i-1], next=OBJ[i+1];
  sheet.innerHTML=`<div class="grab"></div>
   <div class="sh">${numBox(o.label,'big')}<div class="meta">${o.v?vN(o.v)+'<br>':''}${st.rom?st.rom+'. ':''}${esc(st.title)}</div><button class="close" id="shClose" aria-label="${T0.close}">×</button></div>
   <h2 id="shTitle" class="sr">${T0.objN} ${esc(o.label)}</h2>
   <p class="desc">${md(o.text)}</p>
   <div class="acts"><button class="listen" data-say="${key}" aria-pressed="false">${T0.listen}</button><a class="listen" style="text-decoration:none" href="#etapa-${o.si}" data-goto="${o.id}">${T0.seeStage}</a></div>
   ${testiBox(b.right,key,false)}
   <div class="nav2">${prev?`<button class="tool" data-o="${prev.i}">← ${esc(lbl(prev.label))}</button>`:'<span></span>'}${next?`<button class="tool" data-o="${next.i}">${esc(lbl(next.label))} →</button>`:'<span></span>'}</div>`;
  if(!sheet.classList.contains('on')) lastFocus=document.activeElement;
  sheet.classList.add('on');scrim.classList.add('on');sheet.scrollTop=0;
  document.getElementById('shClose').focus();
}
function closeSheet(){stopSpeech();sheet.classList.remove('on');scrim.classList.remove('on');if(lastFocus)lastFocus.focus();}
scrim.onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('on'))closeSheet();});

/* ---------- speech ---------- */
let speaking=null;
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){} if(speaking){speaking.setAttribute('aria-pressed','false');speaking.textContent=t().listen;speaking=null;}}
function voiceFor(l){const vs=speechSynthesis.getVoices();return vs.find(v=>v.lang.replace('_','-').toLowerCase()===l.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)));}
function speak(btn){
  if(!('speechSynthesis' in window)){alert(t().noSpeech);return;}
  if(speaking===btn){stopSpeech();return;}
  stopSpeech();
  const parts=SAY[btn.dataset.say]||[]; if(!parts.length) return;
  speaking=btn;btn.setAttribute('aria-pressed','true');btn.textContent=t().stop;
  parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p.tx);u.lang=p.l;u.rate=.95;const v=voiceFor(p.l);if(v)u.voice=v;
    if(k===parts.length-1)u.onend=()=>{if(speaking===btn)stopSpeech();};speechSynthesis.speak(u);});
}

/* ---------- global clicks ---------- */
let pendingAnchor=null;
document.addEventListener('click',e=>{
  if(e.target.closest('#shClose')){closeSheet();return;}
  const s=e.target.closest('[data-say]'); if(s){e.preventDefault();speak(s);return;}
  const g=e.target.closest('[data-goto]'); if(g){pendingAnchor=g.dataset.goto; if(sheet.classList.contains('on'))closeSheet(); return;}
  const o=e.target.closest('[data-o]'); if(o){openObj(+o.dataset.o);return;}
});
function goTo(si,anchor){pendingAnchor=anchor;if(location.hash==='#etapa-'+si)route();else location.hash='etapa-'+si;}

/* ---------- prefs ---------- */
const sizes=[16,17,19,21];let fsI=store.get('fs',1);
function applyFs(){document.documentElement.style.setProperty('--fs',sizes[fsI]+'px');}
document.getElementById('fsBtn').onclick=()=>{fsI=(fsI+1)%sizes.length;store.set('fs',fsI);applyFs();};
let theme=store.get('theme',null);
function applyTheme(){if(theme)document.documentElement.setAttribute('data-theme',theme);else document.documentElement.removeAttribute('data-theme');}
document.getElementById('thBtn').onclick=()=>{const dark=theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;theme=dark?'light':'dark';store.set('theme',theme);applyTheme();};
function applyLang(){
  buildIndex(); const T0=t();
  document.documentElement.lang=LANG;
  document.getElementById('brandT').textContent=T0.brand;
  document.getElementById('brand').setAttribute('aria-label',T0.brand);
  const lb=document.getElementById('lgBtn'); lb.textContent=LANG.toUpperCase(); lb.setAttribute('aria-label',T0.lgLab+': '+LANGS.find(x=>x[0]===LANG)[1]);
  document.getElementById('lgMenu').innerHTML=LANGS.map(([c,nm])=>`<button role="menuitemradio" lang="${c}" data-lg="${c}" aria-checked="${c===LANG}"><b>${c.toUpperCase()}</b>${nm}</button>`).join('');
  document.title=T0.heroT+' · Vic';
  document.getElementById('fsBtn').setAttribute('aria-label',T0.fs);
  document.getElementById('thBtn').setAttribute('aria-label',T0.th);
  document.getElementById('tabs').setAttribute('aria-label',T0.tabsLab);
  document.querySelectorAll('[data-n]').forEach(s=>s.textContent=T0.n[s.dataset.n]);
}
const lgBtn=document.getElementById('lgBtn'), lgMenu=document.getElementById('lgMenu');
function lgOpen(on){lgMenu.hidden=!on;lgBtn.setAttribute('aria-expanded',on);if(on){(lgMenu.querySelector('[aria-checked="true"]')||lgMenu.querySelector('button')).focus();}}
lgBtn.onclick=e=>{e.stopPropagation();lgOpen(lgMenu.hidden);};
lgMenu.onclick=e=>{const b=e.target.closest('[data-lg]');if(!b)return;e.stopPropagation();lgOpen(false);lgBtn.focus();
  if(b.dataset.lg!==LANG){LANG=b.dataset.lg;store.set('lang',LANG);applyLang();route(true);}};
lgMenu.onkeydown=e=>{const bs=[...lgMenu.querySelectorAll('button')],i=bs.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus();}
  else if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus();}
  else if(e.key==='Escape'){lgOpen(false);lgBtn.focus();}};
document.addEventListener('click',e=>{if(!lgMenu.hidden&&!e.target.closest('#lgMenu'))lgOpen(false);});
applyFs();applyTheme();applyLang();

/* ---------- router ---------- */
function route(keepScroll){
  const y=window.scrollY;
  stopSpeech(); if(sheet.classList.contains('on')){sheet.classList.remove('on');scrim.classList.remove('on');}
  const h=location.hash.slice(1)||'inicio';
  const m=h.match(/^etapa-(\d+)$/);
  if(m) vStage(+m[1]);
  else if(h==='recorrido') vRoute();
  else if(h==='numero') vFinder();
  else if(h==='plano') vPlan();
  else if(h==='vida') vLife();
  else if(h==='info') vInfo();
  else vHome();
  if(pendingAnchor){
    const id=pendingAnchor==='celda5'?null:pendingAnchor; pendingAnchor=null;
    let el=id?document.getElementById(id):[...document.querySelectorAll('.box')].find(b=>/Sant Hip/.test(b.textContent));
    if(el){requestAnimationFrame(()=>{el.scrollIntoView({block:'center'});el.classList.add('flash');});return;}
  }
  window.scrollTo(0,keepScroll===true?y:0);
}
addEventListener('hashchange',()=>route());
route();
</script>
