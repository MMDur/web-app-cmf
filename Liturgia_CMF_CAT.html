 de Déu; tothom qui estima ha nascut de Déu i coneix Déu. El qui no estima no coneix Déu, perquè Déu és amor.<\/p><p class=\"pr\" id=\"m11x36\">L’amor de Déu s’ha manifestat enmig nostre quan ha enviat al món el seu Fill únic perquè visquem gràcies a ell. L’amor consisteix en això: no som nosaltres qui ens hem avançat a estimar Déu; ell ens ha estimat primer i ha enviat el seu Fill com a víctima que expia els nostres pecats.<\/p><p class=\"pr\" id=\"m11x37\">Estimats meus, si Déu ens ha estimat tant, també nosaltres ens hem d’estimar els uns als altres. A Déu, ningú no l’ha vist mai; però si ens estimem, ell està en nosaltres i, dins nostre, el seu amor ha arribat a la plenitud. Coneixem que estem en ell i que ell està en nosaltres perquè ens ha donat el seu Esperit.<\/p><p class=\"pr\" id=\"m11x38\">Nosaltres donem testimoni d’allò que hem contemplat: el Pare ha enviat el seu Fill com a salvador del món. Per això tothom qui confessa que Jesús és el Fill de Déu, està en Déu, i Déu en ell.<\/p><p class=\"pr\" id=\"m11x39\">Nosaltres hem conegut l’amor que Déu ens té i hi hem cregut. Déu és amor; el qui està en l’amor està en Déu, i Déu està en ell.<\/p><p class=\"fin\" id=\"m11x40\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m11x41\">Al·leluia<\/h3><div class=\"pl\" id=\"m11x42\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m11x43\"><span class=\"l\">Que n’és, de bo i agradable,<\/span><span class=\"l\">viure tots junts els germans! <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m11x44\">Evangeli <span class=\"ref\">Mt 18, 15-22<\/span><\/h3><p class=\"lema\" id=\"m11x45\">On hi ha dos o més de reunits en el meu nom, jo soc allí enmig d’ells.<\/p><p class=\"pr\" id=\"m11x46\">Lectura de l’Evangeli segons sant Mateu.<\/p><p class=\"pr\" id=\"m11x47\">En aquell temps, Jesús va dir al seus deixebles: «Si el teu germà et fa una ofensa, ves a trobar-lo i, tot sol amb ell, fes-li veure la seva falta. Si t’escolta, t’hauràs guanyat el germà. Si no t’escolta, crida’n un o dos més, perquè tota qüestió ha de ser resolta per la declaració de dos o tres testimonis. Si tampoc no els escolta, digues-ho a la comunitat reunida. I si ni tan sols escolta la comunitat, considera’l un pagà i un publicà. Us ho asseguro: tot allò que lligueu a la terra quedarà lligat al cel, i tot allò que deslligueu a la terra quedarà deslligat al cel.<\/p><p class=\"pr\" id=\"m11x48\">Us asseguro també que si dos de vosaltres aquí a la terra es posen d’acord per a demanar alguna cosa, el meu Pare del cel els la concedirà; perquè on n’hi ha dos o tres de reunits en el meu nom, jo soc allí enmig d’ells.<\/p><p class=\"pr\" id=\"m11x49\">Aleshores Pere preguntà a Jesús: «Senyor, quantes vegades hauré de perdonar al meu germà les ofenses que em faci? Set vegades?»<\/p><p class=\"pr\" id=\"m11x50\">Jesús li respon: «No et dic set vegades, sinó setanta vegades set.»<\/p><p class=\"fin\" id=\"m11x51\">Paraula del Senyor<\/p><div class=\"obien\" id=\"m11x52\">O bé<\/div><h3 class=\"rub\" id=\"m11x53\">Al·leluia<\/h3><div class=\"pl\" id=\"m11x54\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m11x55\"><span class=\"l\">Us dono un manament nou:<\/span><span class=\"l\">que us estimeu els uns als altres tal com jo us he estimat. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m11x56\">Evangeli <span class=\"ref\">Jn 15, 9.17<\/span><\/h3><p class=\"lema\" id=\"m11x57\">Aquest és el meu manament: que us estimeu els uns als altres tal com jo us he estimat<\/p><p class=\"pr\" id=\"m11x58\">Lectura de l’evangeli segons sant Joan.<\/p><p class=\"pr\" id=\"m11x59\">En aquell temps, Jesús va dir als seus deixebles: Tal com el Pare m’estima, també jo us estimo a vosaltres. Manteniu-vos en el meu amor. Si guardeu els meus manaments, us mantindreu en el meu amor, tal com jo guardo els manaments del meu Pare i em mantinc en el seu amor.<\/p><p class=\"pr\" id=\"m11x60\">»Us he dit tot això perquè la meva joia sigui també la vostra, i la vostra joia sigui completa. Aquest és el meu manament: que us estimeu els uns als altres tal com jo us he estimat. Ningú no té un amor més gran que el qui dona la vida pels seus amics. Vosaltres sou els meus amics si feu el que jo us mano. Ja no us dic servents, perquè el servent no sap què fa el seu amo. A vosaltres us he dit amics perquè us he fet conèixer tot allò que he sentit del meu Pare. No m’heu escollit vosaltres a mi; soc jo qui us he escollit a vosaltres i us he confiat la missió d’anar pertot arreu i donar fruit, i un fruit que duri per sempre. I tot allò que demanareu al Pare en nom meu, ell us ho concedirà. Això us mano: que us estimeu els uns als altres.<\/p><p class=\"fin\" id=\"m11x61\">Paraula del Senyor<\/p><div class=\"obien\" id=\"m11x62\">O bé <span class=\"ref\">Col 3,15<\/span><\/div><p class=\"pr\" id=\"m11x63\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/p><div class=\"pl\" id=\"m11x64\"><span class=\"l\">Que la pau de Crist coroni en els vostres cors els combats<\/span><span class=\"l\">que manteniu; en aquesta pau heu estat cridats a formar un sol cos. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m11x65\">Evangeli <span class=\"ref\">Jn 17, 1a. 20-26<\/span><\/h3><p class=\"lema\" id=\"m11x66\">Que tots siguin u<\/p><p class=\"pr\" id=\"m11x67\">Lectura de l’evangeli segons sant Joan.<\/p><p class=\"pr\" id=\"m11x68\">En aquell temps, Jesús va alçar els ulls al cel i digué: «No prego només per ells, sinó també pels qui creuran en mi gràcies a la seva paraula. Que tots siguin u, com tu, Pare, estàs en mi i jo en tu. Que també ells estiguin en nosaltres, perquè el món cregui que tu m’has enviat. Jo els he donat la glòria que tu m’has donat, perquè siguin u com nosaltres som u. Que jo estigui en ells i tu en mi, perquè siguin plenament u. Així el món reconeixerà que tu m’has enviat i que els has estimat a ells com m’has estimat a mi. Pare, vull que els qui m’has confiat estiguin amb mi allà on jo estic i vegin la meva glòria, la glòria que m’has donat perquè m’estimaves des d’abans de crear el món. Pare bo, el món no t’ha conegut, però jo t’he conegut, i ells han reconegut que tu m’has enviat. Jo els he fet conèixer el teu nom, i els el faré conèixer més encara, perquè l’amor amb què m’has estimat estigui en ells, i jo també hi estigui.»<\/p><p class=\"fin\" id=\"m11x69\">Paraula del Senyor<\/p><h3 class=\"rub\" id=\"m11x70\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m11x71\"><span class=\"l\">Rebeu, Senyor, les ofrenes que us presentem<\/span><span class=\"l\">i feu que per aquest sacrifici<\/span><span class=\"l\">creixi sense parar l’amor que espereu de nosaltres<\/span><span class=\"l\">i s’edifiqui la nostra comunitat.<\/span><span class=\"l\">Per Crist, nostre Senyor.<\/span><\/div><h3 class=\"rub\" id=\"m11x72\">Antífona de comunió <span class=\"ref\">Jn 15,12<\/span><\/h3><div class=\"pl\" id=\"m11x73\"><span class=\"l\">El meu manament és que us estimeu els uns als altres<\/span><span class=\"l\">tal com jo us he estimat.<\/span><\/div><h3 class=\"rub\" id=\"m11x74\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m11x75\"><span class=\"l\">Que aquests sagraments de la unitat i de l’amor<\/span><span class=\"l\">amb què ens heu nodrit, Senyor Déu nostre,<\/span><span class=\"l\">ens uneixin ben estretament amb Vós i amb els germans<\/span><span class=\"l\">a fi que el món cregui en el vostre Fill<\/span><span class=\"l\">i trobi en Ell la salvació.<\/span><span class=\"l\">Pel mateix Crist Senyor nostre.<\/span><\/div>", "chips": [["m11x0", "Entrada"], ["m11x4", "Col·lecta"], ["m11x6", "1a lectura"], ["m11x18", "Salm"], ["m11x25", "2a lectura"], ["m11x44", "Evangeli"], ["m11x70", "Ofrenes"], ["m11x72", "Comunió"], ["m11x74", "Postcomunió"]], "color": "verde", "fecha": "Per diverses necessitats"}}, {"label": "Per diverses necessitats", "kind": "missa", "group": "necesidades", "title": "Missa per les vocacions claretianes", "rank": "", "sub": [], "intro": "", "hours": [], "missa": {"title": "Missa per les vocacions claretianes", "html": "<p class=\"nota\" id=\"m12x0\">Tots els elements com al Missal Romà i al Leccionari «Per les vocacions sacerdotals i religioses». Podeu utilitzar, tanmateix, les següents oracions i antífones:<\/p><h3 class=\"rub\" id=\"m12x1\">Antífona d’introducció <span class=\"ref\">MT 9,37-38<\/span><\/h3><div class=\"pl\" id=\"m12x2\"><span class=\"l\">La collita és abundant, però hi ha pocs segadors.<\/span><span class=\"l\">Demaneu a l’amo dels sembrats<\/span><span class=\"l\">que hi faci anar més segadors,<\/span><span class=\"l\">diu el Senyor als seus deixebles.<\/span><\/div><div class=\"obien\" id=\"m12x3\">O bé <span class=\"ref\">Mt 4,1<\/span><\/div><div class=\"pl\" id=\"m12x4\"><span class=\"l\">Veniu amb mi, diu el Senyor,<\/span><span class=\"l\">i us faré pescadors d’homes.<\/span><\/div><h3 class=\"rub\" id=\"m12x5\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m12x6\"><span class=\"l\">Senyor,<\/span><span class=\"l\">que vau cridar els Apòstols<\/span><span class=\"l\">perquè fossin pescadors d’homes:<\/span><span class=\"l\">aplegueu en la família claretiana nous germans<\/span><span class=\"l\">que siguin sal de la terra i llum del món<\/span><span class=\"l\">i difonguin pertot arreu<\/span><span class=\"l\">l’amor que esperonava<\/span><span class=\"l\">el vostre servent Antoni Maria Claret.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><p class=\"nota\" id=\"m12x7\">Es poden escollir les lectures de les misses per diverses circumstàncies: per les vocacions; o les següents<\/p><h3 class=\"rub\" id=\"m12x8\">Lectura primera <span class=\"ref\">1Sa 3,1-10<\/span><\/h3><p class=\"pr\" id=\"m12x9\">Lectura del primer llibre de Samuel:<\/p><p class=\"pr\" id=\"m12x10\">El noi Samuel vivia dedicat al servei del Senyor a les ordres d’Elí. En aquell temps, el Senyor comunicava rarament la seva paraula: no solia mostrar-se en visió. Elí anava perdent la vista; gairebé no hi veia.<\/p><p class=\"pr\" id=\"m12x11\">Una nit, Elí se n’havia anat a dormir a la seva cambra. Samuel dormia al santuari del Senyor, on hi havia l’arca de Déu. Abans que s’apagués la llàntia del santuari de Déu, el Senyor va cridar Samuel. Ell respongué: «Soc aquí». Va anar corrents cap on era Elí i li digué: «Soc aquí. He sentit que em cridaves». Elí va respondre: «No t’he pas cridat. Torna-te’n a dormir».<\/p><p class=\"pr\" id=\"m12x12\">Ell se’n tornà a dormir. Però el Senyor el cridà altra vegada. Samuel es va llevar, tornà on era Elí i li digué: «Soc aquí. He sentit que em cridaves». Elí va respondre: «No t’he pas cridat, fill meu. Torna-te’n a dormir».<\/p><p class=\"pr\" id=\"m12x13\">Samuel encara no sabia reconèixer el Senyor, perquè la seva paraula encara no se li havia revelat. El Senyor va cridar Samuel per tercera vegada. Ell es va llevar, anà on era Elí i li digué: «Soc aquí. He sentit que em cridaves». Elí va comprendre que era el Senyor qui cridava el noi, i digué a Samuel: «Ves, torna-te’n a dormir i, si algú et cridava, digues: “Parla, Senyor, que el teu servent escolta”.»<\/p><p class=\"pr\" id=\"m12x14\">Samuel se’n tornà al seu lloc a dormir. El Senyor va entrar, se li acostà i el cridà com les altres vegades: «Samuel, Samuel!» Ell va respondre: «Parla, que el teu servent escolta».<\/p><p class=\"fin\" id=\"m12x15\">Paraula de Déu<\/p><div class=\"obien\" id=\"m12x16\">O bé <span class=\"ref\">Jr 1, 4-9<\/span><\/div><p class=\"lema\" id=\"m12x17\">Ves on jo t’enviaré<\/p><p class=\"pr\" id=\"m12x18\">Lectura del llibre de Jeremies.<\/p><p class=\"pr\" id=\"m12x19\">En aquell temps, el Senyor em va comunicar la seva paraula:<\/p><p class=\"pr\" id=\"m12x20\">Em digué: «Abans de formar-te en les entranyes de la mare, jo et coneixia; abans que sortissis del seu ventre et vaig consagrar profeta destinat a les nacions». Jo vaig replicar: «Ah, Senyor, Déu meu! Soc massa jove. Com sabré parlar?».<\/p><p class=\"pr\" id=\"m12x21\">El Senyor em respongué: «No diguis que ets massa jove. Ves on jo t’enviaré, digues el que jo t’ordenaré. No tinguis por de ningú. Jo seré al teu costat per alliberar-te. T’ho dic jo, el Senyor.<\/p><p class=\"pr\" id=\"m12x22\">Aleshores el Senyor va allargar la mà, em tocà els llavis i em digué: «Poso les meves paraules a la teva boca».<\/p><p class=\"fin\" id=\"m12x23\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m12x24\">Salm responsorial <span class=\"ref\">Sl 39,2 i 4ab.7.8-9.10<\/span><\/h3><div class=\"pl\" id=\"m12x25\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Aquí em teniu: Déu meu, vull fer la vostra voluntat.<\/span><\/div><div class=\"pl\" id=\"m12x26\"><span class=\"l\">Tenia posada l’esperança en el Senyor,<\/span><span class=\"l\">i ell, inclinant-se cap a mi,<\/span><span class=\"l\">ha inspirat als meus llavis un càntic nou,<\/span><span class=\"l\">un himne de lloança al nostre Déu. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x27\"><span class=\"l\">Però vós no voleu oblacions ni sacrificis,<\/span><span class=\"l\">i m’heu parlat a cau d’orella;<\/span><span class=\"l\">no exigiu l’holocaust ni l’expiació. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x28\"><span class=\"l\">Per això us dic: «Aquí em teniu:<\/span><span class=\"l\">com està escrit de mi en el llibre,<\/span><span class=\"l\">Déu meu, vull fer la vostra voluntat,<\/span><span class=\"l\">guardo la vostra llei al fons del cor». <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x29\"><span class=\"l\">Anuncio amb goig la salvació<\/span><span class=\"l\">davant el poble en dia de gran festa.<\/span><span class=\"l\">No puc deixar d’anunciar-la,<\/span><span class=\"l\">ho sabeu prou, Senyor. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x30\"><span class=\"l\">I Vós, Senyor, no aparteu la vostra misericòrdia;<\/span><span class=\"l\">que el teu amor fidel em guardi sempre. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"obien\" id=\"m12x31\">O bé<\/div><h3 class=\"rub\" id=\"m12x32\">Salm responsorial <span class=\"ref\">26,1.4.13-14<\/span><\/h3><div class=\"pl\" id=\"m12x33\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Arribar davant vostre és el que vull<\/span><\/div><div class=\"pl\" id=\"m12x34\"><span class=\"l\">El Senyor m’il·lumina i em salva,<\/span><span class=\"l\">qui em pot fer por?<\/span><span class=\"l\">El Senyor és el mur que protegeix la meva vida,<\/span><span class=\"l\">qui em pot esfereir? <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x35\"><span class=\"l\">Una sola cosa he demanat al Senyor,<\/span><span class=\"l\">i la desitjo amb tota l’ànima:<\/span><span class=\"l\">poder viure a la casa del Senyor<\/span><span class=\"l\">tots els dies de la vida,<\/span><span class=\"l\">per fruir-hi de l’estima del Senyor<\/span><span class=\"l\">i vetllar pel seu temple. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x36\"><span class=\"l\">Ell m’amaga al seu costat,<\/span><span class=\"l\">en dies de desgràcia;<\/span><span class=\"l\">m’oculta dintre el recer de casa seva,<\/span><span class=\"l\">m’encamina a la roca inaccessible. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x37\"><span class=\"l\">Escolteu el meu clam, Senyor,<\/span><span class=\"l\">compadiu-vos de mi, responeu-me.<\/span><span class=\"l\">De part vostra, em diu el cor:<\/span><span class=\"l\">«Busca la meva presència!» <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x38\"><span class=\"l\">Arribar davant vostre és el que vull;<\/span><span class=\"l\">Senyor, no us amagueu.<\/span><span class=\"l\">No sigueu sever fins a rebutjar el vostre servent,<\/span><span class=\"l\">vós que sou el meu ajut. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m12x39\"><span class=\"l\">No em deixeu abandonat,<\/span><span class=\"l\">Déu meu, Salvador meu.<\/span><span class=\"l\">Ensenyeu-me, Senyor, la vostra ruta,<\/span><span class=\"l\">conduïu-me per camins planers;<\/span><span class=\"l\">penseu que tinc enemics. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m12x40\">Lectura segona <span class=\"ref\">Fl 3, 8-14<\/span><\/h3><p class=\"lema\" id=\"m12x41\">M’he avingut a perdre-ho tot a canvi de guanyar-lo a ell<\/p><p class=\"pr\" id=\"m12x42\">Lectura de la carta de sant Pau als cristians de Filips.<\/p><p class=\"pr\" id=\"m12x43\">Germans: Tot ho considero una pèrdua, comparat amb el bé suprem que és conèixer Jesucrist, el meu Senyor.<\/p><p class=\"pr\" id=\"m12x44\">Per ell m’he avingut a perdre-ho tot i a considerar-ho escòria, a canvi de guanyar-lo a ell i de viure unit a ell; no tinc, doncs, una justícia pròpia, la que prové de la Llei, sinó que tinc la justícia que se’ns dona per la fe en Crist, la que prové de Déu i es fonamenta en aquesta fe. Així conec el Crist i la força de la seva resurrecció i puc entrar en comunió amb els seus sofriments, tot configurant-me a la seva mort, esperant d’arribar a la resurrecció d’entre els morts.<\/p><p class=\"pr\" id=\"m12x45\">No vull dir que ja hagi assolit tot això o que ja sigui perfecte. Hi corro al darrere per tal d’apoderar-me’n, ja que també Jesucrist es va apoderar de mi. Germans, no em penso pas que ja me n’hagi apoderat, però tinc un objectiu: oblidar-me del que queda enrere i llançar-me cap allò que hi ha al davant. Corro cap a la meta per aconseguir el premi que Déu ha convocat allà dalt per mitjà de Jesucrist.<\/p><p class=\"fin\" id=\"m12x46\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m12x47\">Al·leluia<\/h3><div class=\"pl\" id=\"m12x48\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m12x49\"><span class=\"l\">Veniu amb mi, diu el Senyor,<\/span><span class=\"l\">i us faré pescadors d’homes. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m12x50\">Evangeli <span class=\"ref\">Lc, 1-11<\/span><\/h3><p class=\"lema\" id=\"m12x51\">D’ara en endavant sereu pescadors d’homes<\/p><p class=\"pr\" id=\"m12x52\">Lectura de l’evangeli segons sant Lluc:<\/p><p class=\"pr\" id=\"m12x53\">En una ocasió la gent s’aglomerava sobre Jesús per escoltar la paraula de Déu. Ell, es trobava vora l’estany de Genesaret, veié dues barques a la platja. Els pescadors n’havien baixat i rentaven les xarxes. Pujà en una de les barques, que era de Simó, li demanà que l’apartés una mica de terra, s’assegué i ensenyava la gent de la barca estant.<\/p><p class=\"pr\" id=\"m12x54\">Quan acabà de parlar, digué a Simó: «Tira endins, i caleu les xarxes per pescar». Simó li respongué: “Mestre, ens hi hem escarrassat tota la nit i no hem pescat res, però ja que vós ho dieu calaré les xarxes”.<\/p><p class=\"pr\" id=\"m12x55\">Així que ho feren, agafaren tant de peix que les xarxes s’esquinçaven. Llavors feren senyal als pescadors de l’altra barca que vinguessin a ajudar-los. Ells hi anaren, i ompliren tant les barques que quasi s’enfonsaven.<\/p><p class=\"pr\" id=\"m12x56\">Simó Pere, en veure això, es llançà als genolls de Jesús i li deia: “Senyor, allunyeu-vos de mi, que soc un pecador”. Ni ell, ni cap dels qui anaven amb ell no se sabien avenir d’una pesca com aquella. Igual passà amb Jaume i Joan, fills de Zebedeu, que eren socis de Simó. Però Jesús digué a Simó: “No tinguis por: des d’ara seràs pescador d’homes”. Llavors tornaren a terra les barques ho deixaren tot i se n’anaren amb ell.<\/p><p class=\"fin\" id=\"m12x57\">Paraula del Senyor<\/p><h3 class=\"rub\" id=\"m12x58\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m12x59\"><span class=\"l\">Senyor, acolliu de bon grat<\/span><span class=\"l\">les pregàries i ofrenes que us presentem,<\/span><span class=\"l\">i, puix compartim la joia de sentir-nos germans i claretians<\/span><span class=\"l\">feu que ens mantinguem sempre fidels<\/span><span class=\"l\">a la vocació evangèlica.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m12x60\">Antífona de comunió <span class=\"ref\">Mt 5,14-16<\/span><\/h3><div class=\"pl\" id=\"m12x61\"><span class=\"l\">Vosaltres sou la llum del món, diu el Senyor.<\/span><span class=\"l\">Ha de resplendir la vostra llum davant la gent.<\/span><span class=\"l\">Llavors, en veure el bé que heu obrat,<\/span><span class=\"l\">glorificaran el vostre Pare del cel.<\/span><\/div><div class=\"obien\" id=\"m12x62\">O bé <span class=\"ref\">Jn 15,16<\/span><\/div><div class=\"pl\" id=\"m12x63\"><span class=\"l\">No sou vosaltres els qui m’heu escollit:<\/span><span class=\"l\">Soc jo qui us he escollit per confiar-vos la missió<\/span><span class=\"l\">d’anar pertot arreu i donar fruit,<\/span><span class=\"l\">un fruit que durarà per sempre.<\/span><\/div><h3 class=\"rub\" id=\"m12x64\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m12x65\"><span class=\"l\">Ara que hem participat en el sagrament del vostre amor,<\/span><span class=\"l\">us demanem, Senyor, que susciteu abundoses vocacions<\/span><span class=\"l\">per a la nostra Congregació,<\/span><span class=\"l\">infoneu en els que heu cridat<\/span><span class=\"l\">el desig de la perfecció evangèlica,<\/span><span class=\"l\">enriquiu la vostra Església<\/span><span class=\"l\">amb el seu servei apostòlic constant<\/span><span class=\"l\">i els concediu romandre fidels a la vostra crida.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div>", "chips": [["m12x1", "Entrada"], ["m12x5", "Col·lecta"], ["m12x8", "1a lectura"], ["m12x24", "Salm"], ["m12x40", "2a lectura"], ["m12x50", "Evangeli"], ["m12x58", "Ofrenes"], ["m12x60", "Comunió"], ["m12x64", "Postcomunió"]], "color": "verde", "fecha": "Per diverses necessitats"}}, {"label": "Per diverses necessitats", "kind": "missa", "group": "necesidades", "title": "Missa pel fruit apostòlic dels missioners", "rank": "", "sub": [], "intro": "", "hours": [], "missa": {"title": "Missa pel fruit apostòlic dels missioners", "html": "<h3 class=\"rub\" id=\"m13x0\">Antífona d’introducció <span class=\"ref\">cf. Sl 66, 2-3<\/span><\/h3><div class=\"pl\" id=\"m13x1\"><span class=\"l\">Que Déu tingui pietat i ens beneeixi,<\/span><span class=\"l\">il·lumini el seu rostre sobre nosaltres,<\/span><span class=\"l\">perquè coneguem a la terra els vostres camins,<\/span><span class=\"l\">tots els pobles la vostra salvació.<\/span><\/div><h3 class=\"rub\" id=\"m13x2\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m13x3\"><span class=\"l\">Senyor, Déu nostre,<\/span><span class=\"l\">que voleu que tota la humanitat se salvi<\/span><span class=\"l\">i arribi al coneixement de la veritat,<\/span><span class=\"l\">beneïu els esforços de la nostra fraternitat missionera<\/span><span class=\"l\">per dur la vostra Paraula a tots els confins de la terra.<\/span><span class=\"l\">Pel nostre Senyor Jesucrist, el vostre Fill.<\/span><span class=\"l\">Es poden escollir algunes de les lectures següents<\/span><\/div><h3 class=\"rub\" id=\"m13x4\">Lectura primera <span class=\"ref\">Is 49, 1-6<\/span><\/h3><p class=\"lema\" id=\"m13x5\">T’he fet llum de les nacions<\/p><p class=\"pr\" id=\"m13x6\">Lectura del llibre d’Isaïes.<\/p><div class=\"pl\" id=\"m13x7\"><span class=\"l\">Escolteu els qui viviu lluny, a les illes!<\/span><span class=\"l\">Estigueu atents, pobles llunyans!<\/span><span class=\"l\">Abans de néixer, el Senyor em va cridar,<\/span><span class=\"l\">va pronunciar el meu nom<\/span><span class=\"l\">quan era a les entranyes de la mare.<\/span><\/div><div class=\"pl\" id=\"m13x8\"><span class=\"l\">Ha fet dels meus llavis una espasa tallant,<\/span><span class=\"l\">m’amaga a l’ombra de la seva mà.<\/span><span class=\"l\">M’ha convertit en una fletxa aguda,<\/span><span class=\"l\">ben guardada en el seu buirac.<\/span><\/div><div class=\"pl\" id=\"m13x9\"><span class=\"l\">M’ha dit: «Ets el meu servent;<\/span><span class=\"l\">en tu, Israel, faig resplendir la meva glòria.»<\/span><\/div><div class=\"pl\" id=\"m13x10\"><span class=\"l\">Jo pensava: «M’he cansat en va,<\/span><span class=\"l\">he consumit per no res les meves forces.»<\/span><span class=\"l\">Però el Senyor té a les mans la meva causa,<\/span><span class=\"l\">el meu Déu m’ha guardat la recompensa.<\/span><\/div><div class=\"pl\" id=\"m13x11\"><span class=\"l\">Ara ha parlat el Senyor,<\/span><span class=\"l\">ell que m’ha format des del si de la mare<\/span><span class=\"l\">perquè fos el seu servent,<\/span><span class=\"l\">perquè fes tornar cap a ell el poble de Jacob<\/span><span class=\"l\">i aplegués Israel al seu voltant.<\/span><\/div><div class=\"pl\" id=\"m13x12\"><span class=\"l\">Als ulls del Senyor jo soc preciós;<\/span><span class=\"l\">el meu Déu és la meva força.<\/span><\/div><div class=\"pl\" id=\"m13x13\"><span class=\"l\">M’ha dit: «És massa poc<\/span><span class=\"l\">que siguis el meu servent<\/span><span class=\"l\">per a restablir les tribus de Jacob<\/span><span class=\"l\">i fer tornar els supervivents d’Israel.<\/span><\/div><div class=\"pl\" id=\"m13x14\"><span class=\"l\">Jo t’he fet llum de les nacions<\/span><span class=\"l\">perquè portis la meva salvació<\/span><span class=\"l\">d’un cap a l’altre de la terra.»<\/span><\/div><p class=\"fin\" id=\"m13x15\">Paraula de Déu<\/p><div class=\"obien\" id=\"m13x16\">O bé <span class=\"ref\">Is 52, 7-10<\/span><\/div><p class=\"lema\" id=\"m13x17\">La benedicció de l’enviament: missatgers d’esperança i d’alliberament<\/p><div class=\"pl\" id=\"m13x18\"><span class=\"l\">Que en són, de bonics, per les muntanyes<\/span><span class=\"l\">els peus del missatger de bones noves<\/span><span class=\"l\">que anuncia la pau i el benestar,<\/span><span class=\"l\">que anuncia la salvació<\/span><span class=\"l\">i diu a la ciutat de Sió:<\/span><span class=\"l\">«El teu Déu ja regna!»<\/span><\/div><div class=\"pl\" id=\"m13x19\"><span class=\"l\">Criden els teus sentinelles, alcen la veu,<\/span><span class=\"l\">tots junts criden de goig<\/span><span class=\"l\">quan veuen amb els seus ulls<\/span><span class=\"l\">que el Senyor torna a Sió.<\/span><\/div><div class=\"pl\" id=\"m13x20\"><span class=\"l\">Esclateu totes alhora en clams de joia,<\/span><span class=\"l\">ruïnes de Jerusalem:<\/span><span class=\"l\">el Senyor ha consolat el seu poble,<\/span><span class=\"l\">ha alliberat Jerusalem!<\/span><\/div><div class=\"pl\" id=\"m13x21\"><span class=\"l\">Als ulls de tots els pobles<\/span><span class=\"l\">el Senyor ha estès el seu sant braç,<\/span><span class=\"l\">i d’un cap a l’altre de la terra<\/span><span class=\"l\">tothom veurà la salvació del nostre Déu.<\/span><\/div><p class=\"fin\" id=\"m13x22\">Paraula de Déu<\/p><div class=\"obien\" id=\"m13x23\">O bé <span class=\"ref\">1Co 9, 16-27<\/span><\/div><p class=\"lema\" id=\"m13x24\">Ai de mi si no anunciés l’evangeli!<\/p><p class=\"pr\" id=\"m13x25\">Germans: Jo no puc gloriar-me d’anunciar l’evangeli, perquè és una obligació que m’han imposat: ai de mi si no anunciés l’evangeli! Si m’ho hagués triat, tindria dret a un salari; però no ho he triat: és un encàrrec que tinc confiat.<\/p><p class=\"pr\" id=\"m13x26\">Quin és, doncs, el meu salari? Oferir de franc l’evangeli que anuncio, sense fer ús dels drets que l’evangeli em dona.<\/p><p class=\"pr\" id=\"m13x27\">Jo, que no era esclau de ningú, m’he fet esclau de tots per guanyar-ne tants com pugui. M’he fet jueu amb els jueus per guanyar els jueus; tot i no estar sotmès a la Llei, he viscut amb els qui hi estan sotmesos com si jo també hi estigués, per guanyar-los a tots ells. I per guanyar els qui no tenen Llei he viscut amb ells com si jo tampoc no en tingués, encara que no estic pas sense Llei de Déu, ja que Crist és la meva llei. M’he fet feble amb els febles per guanyar els febles; m’he fet tot amb tots per salvar-ne alguns, costés el que costés. Tot ho faig a causa de l’evangeli, per poder-hi tenir part.<\/p><p class=\"pr\" id=\"m13x28\">¿No sabeu que a l’estadi tots els corredors es llancen a la cursa, però només un s’emporta el premi? Correu bé per poder-vos-el endur! L’atleta s’absté de moltes coses, i tot per guanyar-se una corona que es marceix, mentre que nosaltres n’hem de guanyar una que mai no es marcirà. Així, doncs, jo corro, però no sense una meta; combato donant cops de puny, però no pas a l’aire. Tracto amb duresa el meu cos i el tinc dominat, no fos cas que, després de proclamar la victòria dels altres, quedés desqualificat jo mateix.<\/p><p class=\"fin\" id=\"m13x29\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m13x30\">Salm responsorial <span class=\"ref\">Sl 96, 1-5 i 11-12<\/span><\/h3><div class=\"pl\" id=\"m13x31\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Canteu al Senyor un càntic nou,<\/span><span class=\"l\">canteu al Senyor arreu de la terra.<\/span><\/div><div class=\"pl\" id=\"m13x32\"><span class=\"l\">Canteu al Senyor un càntic nou,<\/span><span class=\"l\">canteu al Senyor arreu de la terra,<\/span><span class=\"l\">canteu al Senyor, beneïu el seu nom,<\/span><span class=\"l\">anuncieu de dia en dia que ens ha salvat. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m13x33\"><span class=\"l\">Conteu a les nacions la seva glòria,<\/span><span class=\"l\">conteu a tots els pobles els seus prodigis. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m13x34\"><span class=\"l\">El Senyor és gran i digne de tota lloança,<\/span><span class=\"l\">és més temible que tots els déus;<\/span><span class=\"l\">perquè els déus dels pobles no són res,<\/span><span class=\"l\">però el Senyor ha fet el cel. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m13x35\"><span class=\"l\">El cel se n’alegra, la terra ho celebra,<\/span><span class=\"l\">bramula el mar amb tot el que s’hi mou,<\/span><span class=\"l\">1jubilen els camps amb tot el que hi ha,<\/span><span class=\"l\">criden de goig els arbres del bosc. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"obien\" id=\"m13x36\">O bé <span class=\"ref\">Sl 127, 1-5<\/span><\/div><div class=\"pl\" id=\"m13x37\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Si el Senyor no construeix la casa,<\/span><span class=\"l\">és inútil l’afany dels constructors.<\/span><\/div><div class=\"pl\" id=\"m13x38\"><span class=\"l\">És inútil que us lleveu tan de matí<\/span><span class=\"l\">i aneu tan tard a reposar,<\/span><span class=\"l\">per menjar un pa que us guanyeu a dures penes:<\/span><span class=\"l\">fins quan dormen, ell el dona als seus amics! <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m13x39\"><span class=\"l\">L’herència del Senyor són els fills,<\/span><span class=\"l\">els descendents són la millor recompensa;<\/span><span class=\"l\">els fills que heu tingut quan éreu joves<\/span><span class=\"l\">són com les fletxes en mans d’un guerrer. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m13x40\"><span class=\"l\">Feliç l’home que se n’omple el buirac!<\/span><span class=\"l\">Si discuteix a la plaça amb l’adversari,<\/span><span class=\"l\">no haurà de retirar-se avergonyit. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m13x41\">Al·leluia <span class=\"ref\">Sl 27, 1<\/span><\/h3><div class=\"pl\" id=\"m13x42\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m13x43\"><span class=\"l\">El Senyor m’il·lumina i em salva: qui em pot fer por?<\/span><span class=\"l\">El Senyor és el mur que protegeix la meva vida:<\/span><span class=\"l\">qui em pot esfereir? <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m13x44\">Evangeli <span class=\"ref\">Mt 28, 18-20<\/span><\/h3><p class=\"lema\" id=\"m13x45\">Aneu a convertir tots els pobles<\/p><p class=\"pr\" id=\"m13x46\">Lectura de l’evangeli segons sant Mateu:<\/p><p class=\"pr\" id=\"m13x47\">En aquell temps, Jesús s’acostà als seus deixebles i els digué: «Déu m’ha donat plena autoritat al cel i a la terra. Aneu a convertir tots els pobles, bategeu-los en el nom del Pare, del Fill i de l’Esperit Sant i ensenyeu-los a guardar tot el que jo us he manat. Jo seré amb vosaltres cada dia fins a la fi del món».<\/p><p class=\"fin\" id=\"m13x48\">Paraula del Senyor<\/p><div class=\"obien\" id=\"m13x49\">O bé<\/div><p class=\"pr\" id=\"m13x50\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/p><div class=\"pl\" id=\"m13x51\"><span class=\"l\">Obrim els nostres cors a l’ensenyament del Senyor,<\/span><span class=\"l\">que ens mostra el camí de la vida eterna. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m13x52\">Evangeli <span class=\"ref\">Mt, 9 35-38<\/span><\/h3><p class=\"lema\" id=\"m13x53\">Jesús recorria totes les viles i pobles anunciant la bona nova del Regne<\/p><p class=\"pr\" id=\"m13x54\">Lectura de l’evangeli segons sant Mateu.<\/p><p class=\"pr\" id=\"m13x55\">En aquell temps, Jesús recorria totes les viles i pobles, ensenyant a les sinagogues, anunciant la bona nova del Regne i guarint malalties i xacres de tota mena. En veure les multituds, se’n compadí, perquè estaven malmenades i abatudes, com ovelles sense pastor. Llavors digué als seus deixebles: «La collita és abundant, però els segadors són pocs. Pregueu, doncs, a l’amo dels sembrats que hi enviï més segadors».<\/p><p class=\"fin\" id=\"m13x56\">Paraula del Senyor<\/p><div class=\"obien\" id=\"m13x57\">O bé<\/div><p class=\"pr\" id=\"m13x58\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/p><div class=\"pl\" id=\"m13x59\"><span class=\"l\">Enaltiu el Senyor: que n’és, de bo!<\/span><span class=\"l\">Perdura eternament el seu amor. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m13x60\">Evangeli <span class=\"ref\">Jn 20, 19-23<\/span><\/h3><p class=\"lema\" id=\"m13x61\">Com el Pare m’ha enviat a mi, també jo us envio a vosaltres<\/p><p class=\"pr\" id=\"m13x62\">Lectura de l’evangeli segons sant Joan.<\/p><p class=\"pr\" id=\"m13x63\">Al capvespre d’aquell mateix dia, que era diumenge, els deixebles, per por dels jueus, tenien tancades les portes del lloc on es trobaven. Jesús va arribar, es posà al mig i els digué: «Pau a vosaltres».<\/p><p class=\"pr\" id=\"m13x64\">Dit això, els va mostrar les mans i el costat. Els deixebles s’alegraren de veure el Senyor. Ell els tornà a dir: «Pau a vosaltres. Com el Pare m’ha enviat a mi, també jo us envio a vosaltres».<\/p><p class=\"pr\" id=\"m13x65\">Llavors va alenar damunt d’ells i els digué: «Rebeu l’Esperit Sant. A qui perdonareu els pecats, li quedaran perdonats; a qui no els perdoneu, li quedaran sense perdó».<\/p><h3 class=\"rub\" id=\"m13x66\">Oració secreta<\/h3><div class=\"pl\" id=\"m13x67\"><span class=\"l\">Mireu, Senyor, amb bondat<\/span><span class=\"l\">els dons que us presentem,<\/span><span class=\"l\">i per intercessió del Cor Immaculat de Maria,<\/span><span class=\"l\">concediu-nos de viure i anunciar sempre la vostra Paraula<\/span><span class=\"l\">amb fidelitat i alegria.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m13x68\">Antífona de comunió <span class=\"ref\">Jn 15, 16<\/span><\/h3><p class=\"pr\" id=\"m13x69\">No m’heu escollit vosaltres a mi; soc jo qui us he escollit a vosaltres i us he confiat la missió d’anar pertot arreu i donar fruit, i un fruit que duri per sempre.<\/p><h3 class=\"rub\" id=\"m13x70\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m13x71\"><span class=\"l\">Alimentats amb el Cos i la Sang del vostre Fill,<\/span><span class=\"l\">us demanem, Senyor, que procurem sempre<\/span><span class=\"l\">amb el més gran afany la vostra glòria<\/span><span class=\"l\">i que col·laborem amb el vostre Esperit<\/span><span class=\"l\">per encendre tot el món en el foc del vostre amor.<\/span><span class=\"l\">Per Jesucrist, nostre Senyor.<\/span><\/div>", "chips": [["m13x0", "Entrada"], ["m13x2", "Col·lecta"], ["m13x4", "1a lectura"], ["m13x30", "Salm"], ["m13x44", "Evangeli"], ["m13x66", "Ofrenes"], ["m13x68", "Comunió"], ["m13x70", "Postcomunió"]], "color": "verde", "fecha": "Per diverses necessitats"}}], "pres": "<p id=\"p20\" class=\"pr\">Amb molt de gust presento als nostres germans de Congregació, en aquest any en què celebrem el 175è aniversari de la fundació de l’Institut, aquesta nova edició de la Litúrgia de les Hores dels Missioners Fills del Cor Immaculat de Maria. Preguem cada dia a Déu Pare per l’Església i per la salvació del món, particularment quan celebrem el memorial del Senyor i quan recitem la Litúrgia de les Hores (cf. Constitucions, n. 84).<\/p><p id=\"p21\" class=\"pr\">En aquesta edició no s’han fet canvis considerables que requereixin una nova aprovació del Dicasteri per al Culte Diví. Només s’han revisat i millorat els materials que ja teníem, aprovats per la Congregació per al Culte Diví i la Disciplina dels Sagraments el 21 de desembre de 1998 (Prot. 2717/98/L).<\/p><p id=\"p22\" class=\"pr\">Amb l’aprovació de la Congregació per al Culte Diví i la Disciplina dels Sagraments del 25 de gener de 2019 (Prot. N. 6/19), la memòria dels màrtirs de Barbastre del 13 d’agost passa ara a l’1 de febrer i celebra tots els beats màrtirs claretians. A més, el 13 de novembre se celebra la memòria facultativa de la beata Maria Patrocini Giner Gomis, verge i màrtir, religiosa missionera claretiana.<\/p><p id=\"p23\" class=\"pr\">La Litúrgia de les Hores, com a pregària pública i comunitària del poble de Déu, forma part del misteri de l’Església, n’és una expressió i una manifestació particulars: «No s’ha de considerar la lloança de l’Església com una cosa que, pel seu origen o per la seva naturalesa, sigui exclusiva dels clergues o dels monjos, sinó com una cosa que pertany a tota la comunitat cristiana» (Institutio generalis Liturgiæ Horarum, n. 270).<\/p><p id=\"p24\" class=\"pr\">Seguint fidelment el ritme de les celebracions de l’Església, que al llarg de l’any litúrgic proposa la contemplació de tot el misteri de Crist (cf. Constitucions, n. 35b), el nostre Calendari particular ens convida a aprofundir alguns aspectes de la nostra espiritualitat singular, caracteritzada per dinamismes espirituals peculiars i per opcions operatives que ressalten i representen un aspecte o altre de l’únic misteri de Crist (cf. Joan Pau II, Vita consecrata, n. 93). Que les celebracions claretianes, distribuïdes al llarg dels mesos de l’any, ens ajudin a beure del pou del nostre patrimoni espiritual i impregnin cada vegada més d’un esperit apostòlic ardent la nostra vida i missió.<\/p><p id=\"p25\" class=\"pr\"><span class=\"l\">P. Mathew Vattamattam, cmf<\/span><span class=\"l\">Superior general<\/span><span class=\"l\">Roma, 24 d’octubre de 2024<\/span><span class=\"l\">Solemnitat de sant Antoni Maria Claret<\/span><\/p>", "search": [["Amb molt de gust presento als nostres germans de Congregació, en aquest any en què celebrem el 175è aniversari de la fundació de l’Institut, aquesta nova edició de la Litúrgia de les Hores dels Missioners Fills del Cor Immaculat de Maria. Preguem cada dia a Déu Pare per l’Església i per la salvació del món, particularment quan celebrem el memorial del Senyor i quan recitem la Litúrgia de les Hores (cf. Constitucions, n. 84).", -1, -1, "p20"], ["En aquesta edició no s’han fet canvis considerables que requereixin una nova aprovació del Dicasteri per al Culte Diví. Només s’han revisat i millorat els materials que ja teníem, aprovats per la Congregació per al Culte Diví i la Disciplina dels Sagraments el 21 de desembre de 1998 (Prot. 2717/98/L).", -1, -1, "p21"], ["Amb l’aprovació de la Congregació per al Culte Diví i la Disciplina dels Sagraments del 25 de gener de 2019 (Prot. N. 6/19), la memòria dels màrtirs de Barbastre del 13 d’agost passa ara a l’1 de febrer i celebra tots els beats màrtirs claretians. A més, el 13 de novembre se celebra la memòria facultativa de la beata Maria Patrocini Giner Gomis, verge i màrtir, religiosa missionera claretiana.", -1, -1, "p22"], ["La Litúrgia de les Hores, com a pregària pública i comunitària del poble de Déu, forma part del misteri de l’Església, n’és una expressió i una manifestació particulars: «No s’ha de considerar la lloança de l’Església com una cosa que, pel seu origen o per la seva naturalesa, sigui exclusiva dels clergues o dels monjos, sinó com una cosa que pertany a tota la comunitat cristiana» (Institutio generalis Liturgiæ Horarum, n. 270).", -1, -1, "p23"], ["Seguint fidelment el ritme de les celebracions de l’Església, que al llarg de l’any litúrgic proposa la contemplació de tot el misteri de Crist (cf. Constitucions, n. 35b), el nostre Calendari particular ens convida a aprofundir alguns aspectes de la nostra espiritualitat singular, caracteritzada per dinamismes espirituals peculiars i per opcions operatives que ressalten i representen un aspecte o altre de l’únic misteri de Crist (cf. Joan Pau II, Vita consecrata, n. 93). Que les celebracions claretianes, distribuïdes al llarg dels mesos de l’any, ens ajudin a beure del pou del nostre patrimoni espiritual i impregnin cada vegada més d’un esperit apostòlic ardent la nostra vida i missió.", -1, -1, "p24"], ["P. Mathew Vattamattam, cmf Superior general Roma, 24 d’octubre de 2024 Solemnitat de sant Antoni Maria Claret", -1, -1, "p25"], ["En el context de la persecució religiosa desencadenada durant la guerra civil espanyola (1936-1939), van morir martiritzats, en llocs i dates diversos, nombrosos Missioners Fills del Cor Immaculat de la benaurada Verge Maria. Sense cedir a les insinuacions dels seus perseguidors, que els instaven a renegar de la fe, van lliurar la vida amb generositat, encoratjant-se mútuament; donant gràcies al Senyor que els havia cridat; lloant Maria, al Cor de la qual s’encomanaven; oferint el seu sacrifici pel fruit de la Congregació, de la qual se sabien fills, i perdonant els seus botxins. Eren missioners preveres, germans i estudiants. El més jove només tenia 16 anys. El primer grup a ser beatificat (25 d’octubre de 1992) fou el dels 51 màrtirs de Barbastre, el testimoni dels quals ha marcat l’espiritualitat claretiana. Aquesta espiritualitat, al seu torn, arrela en el desig del mateix P. Fundador, sant Antoni Maria Claret, que de moltes maneres manifestà la seva disposició al martiri, sofrint amb fe i enteresa persecució, calúmnies, atemptats i tota mena de violències. Als beats màrtirs de Barbastre els han seguit d’altres, com els 23 de Sigüenza, Fernán Caballero i Tarragona (13 d’octubre de 2013), o els 109 de Solsona, Cervera, Barcelona, Sabadell, Lleida, Vic, Santander i València (21 d’octubre de 2017).", 0, -1, "p39"], ["A aquests cal afegir el missioner màrtir Andreu Solà (20 de novembre de 2005), assassinat a Mèxic el 25 d’abril de 1927 juntament amb un company prevere i un laic, durant la persecució oberta pel govern mexicà d’aquell moment.", 0, -1, "p40"], ["Ant. Veniu, adorem al Senyor, Rei dels màrtirs.", 0, 0, "p42"], ["El salm invitatori, com a l’Ordinari.", 0, 0, "p43"], ["Himne", 0, 1, "p45"], ["Oh màrtirs del Crist! sou foc i embranzida; no hi ha amor més gran que donar la vida.", 0, 1, "p47"], ["Lloem Crist Senyor que us féu triomfar; fins per qui us occí vau saber pregar.", 0, 1, "p48"], ["Lloem Crist Senyor que venç amb la creu; els qui heu mort per Ell, d’Ell amb goig viureu.", 0, 1, "p49"], ["O bé", 0, 1, "p50"], ["Màrtirs de l’Església màrtir,", 0, 1, "p51"], ["Màrtirs que amb coratge moríreu estimant-la.", 0, 1, "p53"], ["La sang vostra és viva entre nosaltres", 0, 1, "p54"], ["i és sang de perdó i d’esperança.", 0, 1, "p55"], ["Joventut claretiana i enardida,", 0, 1, "p56"], ["de la vostra passió fem la memòria;", 0, 1, "p57"], ["sou l'heretat de la nostra família", 0, 1, "p58"], ["que en vosaltres frueix ja de la glòria.", 0, 1, "p59"], ["No teméreu la mort que us esperava", 0, 1, "p60"], ["i cantant caminàveu al suplici;", 0, 1, "p61"], ["afrontàreu les bales del camí", 0, 1, "p62"], ["que us portava, innocents al sacrifici.", 0, 1, "p63"], ["Del botxí i de la mort més ominosa", 0, 1, "p64"], ["vàreu fer-ne d'amor la vostra causa;", 0, 1, "p65"], ["us calia morir perquè en l'Església", 0, 1, "p66"], ["vessar la sang és una eterna Pasqua.", 0, 1, "p67"], ["Maternal Cor de la Verge Maria,", 0, 1, "p68"], ["Vós vetllareu dels vostres fills la mort;", 0, 1, "p69"], ["com Vós al cel, després d'un curt viatge", 0, 1, "p70"], ["entraren en la glòria del Senyor.", 0, 1, "p71"], ["Animosos els màrtirs ens emmenen", 0, 1, "p72"], ["de Jesucrist al Regne de la pau", 0, 1, "p73"], ["i ens diuen que és possible de morir", 0, 1, "p74"], ["per «una bandera i un ideal».", 0, 1, "p75"], ["O bé", 0, 1, "p77"], ["Testimonis de la fe i de l’Evangeli, màrtirs claretians, glòria de la Congregació i de l’Església, anunci del Senyor ressuscitat, profetes de l’amor i de l’esperança, màrtirs claretians.", 0, 1, "p78"], ["Amics del Senyor fins a la mort, viviu amb una alegria sense posta. La sang martirial de la vostra ofrena resplendeix coronant l’holocaust.", 0, 1, "p79"], ["Fou blat el vostre cos, ara és pa, cuit al caliu del lliurament. La sang vessada corre viva per la Congregació i per l’Església.", 0, 1, "p80"], ["Sou profecia d’amor i de perdó i sou testimonis clars d’esperança. Poseu perdó i amor en les nostres vides i el goig d’anunciar més albada.", 0, 1, "p81"], ["Cantant a Crist Rei guanyeu l’altura, ens deixeu enyorança amb el vostre vol. Maria és la vostra Mare i la vostra Reina: el seu Cor pur és el vostre cel. Amén.", 0, 1, "p82"], ["Salmòdia", 0, 1, "p83"], ["Ant. Els sants màrtirs vessaren la seva sang per Crist: per això han aconseguit el premi etern.", 0, 1, "p84"], ["Salm 2", 0, 1, "p85"], ["Per què aquest avalot de les nacions, aquest complot inútil de pobles? Els reis prenen les armes, conspiren alhora els sobirans contra el Senyor i el seu Messies: «Trenquem els seus lligams, trenquem-los! Traguem-nos el seu jou del damunt!» Però se’n riu el qui té el tron al cel, el Senyor els veu i se’n burla. Aleshores els parla indignat, la seva ira els desconcerta. M’ha consagrat a mi com a rei seu dalt de Sió, muntanya santa. Proclamo el decret del Senyor. M’ha dit: «Ets el meu fill; avui t’he engendrat. Demana-m’ho, i et daré els pobles per herència, posseiràs el món d’un cap a l’altre. Els governaràs amb el ceptre de ferro, els esmicolaràs com un gerro de terrissa.» I ara, reis, tingueu seny, apreneu, governants de la terra. Respecteu el Senyor, sotmeteu-vos-hi, veniu tremolant a fer-li homenatge, no fos que el vostre intent acabi en la desfeta si de sobte s’inflamava la seva ira. Feliços els qui en ell es refugien.", 0, 1, "p86"], ["Ant. Els sants màrtirs vessaren la seva sang per Crist: per això han aconseguit el premi etern.", 0, 1, "p87"], ["Ant. Els justos viuen eternament, reben de Déu la seva recompensa.", 0, 1, "p88"], ["Salm 32 I", 0, 1, "p89"], ["Justos, aclameu el Senyor, fareu bé de lloar-lo, homes rectes. Celebreu el Senyor amb la lira, acompanyeu amb l’arpa els vostres cants, dediqueu-li un càntic nou, toqueu acompanyant l’aclamació. Perquè la paraula del Senyor és sincera, es manté fidel en tot el que fa; estima el dret i la justícia, la terra és plena del seu amor. La paraula del Senyor ha fet el cel, amb l’alè de la boca ha creat l’estelada; com dins un odre recull l’aigua del mar, reté l’oceà en el seu llit. Que tota la terra veneri el Senyor, que el temin els habitants del món; a una paraula seva, tot comença, a una ordre d’ell, tot existí. El Senyor desfà els plans de les nacions, tira a terra els propòsits dels pobles; però els plans del Senyor persisteixen, manté sempre els propòsits del seu cor.", 0, 1, "p90"], ["Ant. Els justos viuen eternament, reben de Déu la seva recompensa.", 0, 1, "p91"], ["Ant. A vosaltres, sants meus, que heu lluitat en aquest món, us donaré la recompensa del vostre esforç.", 0, 1, "p92"], ["Salm 32 II", 0, 1, "p93"], ["Feliç la nació que té el Senyor per Déu, feliç el poble que ell s’ha escollit per heretat. El Senyor guaita des del cel observant un per un tots els homes. Des del lloc on ell resideix es fixa en els qui poblen la terra; ell, que ha modelat un per un tots els cors, penetra totes les seves accions. No és un gran exèrcit el que salva els reis, ni per ser valent queda il·lès el soldat; els cavalls no valen res per guanyar una victòria, la seva envestida no salva ningú. Els ulls del Senyor vetllen els qui el veneren, els qui esperen en l’amor que els té; ell els allibera de la mort, i els retorna en temps de fam. Tenim posada l’esperança en el Senyor, auxili nostre i escut que ens protegeix. És l’alegria del nostre cor, i confiem en la presència del seu nom. Que el vostre amor, Senyor, no ens deixi mai; aquesta és l’esperança que posem en vós.", 0, 1, "p94"], ["Ant. A vosaltres, sants meus, que heu lluitat en aquest món, us donaré la recompensa del vostre esforç.", 0, 1, "p95"], ["V. La nostra esperança és el Senyor. R. Ell és el nostre auxili i escut.", 0, 1, "p96"], ["Primera lectura", 0, 1, "p97"], ["De la carta de l’apòstol sant Pau als Romans 8, 18-39", 0, 1, "p98"], ["Res no ens pot separar de l’amor de Déu manifestat en Jesucrist", 0, 1, "p99"], ["Germans: considero que els sofriments d’ara no es poden comparar amb la glòria que un dia se’ns revelarà. Perquè la creació espera amb anhel la plena manifestació dels fills de Déu. Fou sotmesa a la frustració, no pas per voluntat pròpia, sinó per aquell que la hi va sotmetre, però amb l’esperança que també la creació seria alliberada de l’esclavatge de la corrupció per participar de la llibertat gloriosa dels fills de Déu.", 0, 1, "p100"], ["Sabem, en efecte, que fins avui tota la creació gemega i sofreix dolors de part. I no solament ella: també nosaltres, que posseïm les primícies de l’Esperit, gemeguem dins nostre, esperant l’hora de ser fills de Déu, la redempció del nostre cos. Perquè hem estat salvats en esperança. Ara bé, una esperança que es veu ja no és esperança. Com podria continuar esperant algú allò que ja veu? Però, si esperem allò que no veiem, ho aguardem amb perseverança.", 0, 1, "p101"], ["A més, l’Esperit ve a ajudar la nostra feblesa, perquè nosaltres no sabem demanar allò que ens convé, però l’Esperit mateix intercedeix per nosaltres amb gemecs inefables. I el qui escruta els cors sap quin és el desig de l’Esperit, i que la seva intercessió pels sants és d’acord amb Déu.", 0, 1, "p102"], ["Sabem també que tot serveix per al bé dels qui estimen Déu, dels qui ha cridat segons el seu designi. Els qui havia escollit, Déu els predestinà a ser imatge del seu Fill, perquè ell fos el primogènit de molts germans. Els qui predestinà, els cridà; els qui cridà, els justificà; els qui justificà, els glorificà.", 0, 1, "p103"], ["Què més podem dir? Si tenim Déu amb nosaltres, qui tindrem en contra? Ell, que no va plànyer el seu propi Fill, sinó que el lliurà per tots nosaltres, com no ens ho donarà tot amb ell? Qui acusarà els elegits de Déu? Déu, que els justifica? Qui els condemnarà? Potser Crist, que morí, més encara, ressuscità, és a la dreta de Déu i intercedeix per nosaltres?", 0, 1, "p104"], ["Qui ens podrà separar de l’amor de Crist? L’aflicció, l’angoixa, la persecució, la fam, la nuesa, el perill, l’espasa? Tal com diu l’Escriptura: «Per causa vostra ens degollen cada dia, ens tracten com ovelles destinades a la matança». Però, en tot això, vencem plenament gràcies a aquell que ens ha estimat. Estic convençut que ni la mort ni la vida, ni els àngels ni els principats, ni el present ni el futur, ni les potències, ni l’altura ni la profunditat, ni cap altra criatura no ens podrà separar de l’amor de Déu manifestat en Jesucrist, Senyor nostre.", 0, 1, "p105"], ["Responsori", 0, 1, "p106"], ["V. Estimeu els vostres enemics i pregueu pels qui us persegueixen. Així sereu fills del vostre Pare del cel. R. Estimeu els vostres enemics i pregueu pels qui us persegueixen. Així sereu fills del vostre Pare del cel. V. Sigueu perfectes com ho és el vostre Pare celestial. R. Així sereu fills del vostre Pare del cel.", 0, 1, "p107"], ["Segona lectura", 0, 1, "p108"], ["De l’Autobiografia de sant Antoni Maria Claret, bisbe i fundador Capítol XXVIII, nn. 414-415 i 421-424", 0, 1, "p109"], ["La mortificació", 0, 1, "p110"], ["«Vaig comprendre que en un sol acte de mortificació es poden exercitar moltes virtuts segons les diferents finalitats que cadascú es proposi en cada acte; v. gr.: El qui mortifica el seu cos amb la finalitat de refrenar la concupiscència, fa un acte de la virtut de la temprança. Si ho fa amb el fi d’ordenar bé la vida, serà un acte de la virtut de la prudència. Si ho fa amb el fi de satisfer per les faltes de la vida passada, serà un acte de justícia. Si ho fa per vèncer les dificultats de la vida espiritual, serà un acte de fortalesa. Si ho fa amb la finalitat d’oferir un sacrifici a Déu, privant-se d’allò que li agrada i practicant el que l’amarga i repugna, serà un acte de la virtut de la religió. Si ho fa amb la finalitat de rebre una llum més gran per conèixer els atributs divins, serà un acte de fe. Si ho fa a fi d’assegurar més la seva salvació, serà un acte d’esperança. Si ho fa a fi d’ajudar a la conversió dels pecadors, en sufragi de les ànimes del purgatori, serà un acte de caritat envers el proïsme. Si ho fa a fi de tenir més per socórrer els pobres, serà un acte de la virtut de la misericòrdia. Si ho fa amb el fi d’agradar més i més a Déu, serà un acte d’amor a Déu. En cada acte de mortificació podré exercitar aquestes deu virtuts, segons els fins que m’hi proposi. Jo conec que tres-cents anys de fidels serveis a Déu es paguen i sobradament, amb una hora que em permeti de penes; tan gran és el seu valor. Oh Jesús meu i Mestre meu! L’atribolat, perseguit i desemparat d’amics, el crucificat de treballs exteriors i de creus interiors i desemparat de consols espirituals, que calla, sofreix i persevera amb amor, aquest és el vostre estimat i el qui us agrada i el qui més valoreu. Així que m’he proposat de no sincerar-me mai per mai, ni excusar-me, ni defensar-me, quan em blasmin, calumniïn i persegueixin, perquè hi perdria davant Déu i els homes. Sí, aquests es valdrien de les veritats i raons que jo al·legués com armes contra meu. Crec que tot ve de Déu, i crec que Déu vol de mi aquest obsequi, que sofreixi amb paciència pel seu amor les penes del cos, de l’ànima i de l’honor. Crec que en això faré el que és de major glòria de Déu, és a dir que calli i sofreixi com Jesús, que va morir a la creu desemparat de tot. Fer i sofrir són les grans proves de l’amor.»", 0, 1, "p111"], ["Responsori", 0, 1, "p112"], ["Mt 5, 10-12", 0, 1, "p113"], ["R. Feliços els perseguits pel fet de ser justos, perquè d’ells és el Regne del cel. * Feliços vosaltres quan, per causa meva, us insultaran, us perseguiran i escamparan contra vosaltres tota mena de calúmnies. V. Alegreu-vos-en i celebreu-ho, perquè la vostra recompensa és gran en el cel. * Feliços vosaltres quan, per causa meva, us insultaran, us perseguiran i escamparan contra vosaltres tota mena de calúmnies.", 0, 1, "p114"], ["Oració", 0, 1, "p115"], ["Déu, Pare nostre, que, amb l’ajuda de la Benaurada Verge Maria, vau portar els beats màrtirs claretians a la imitació de Crist fins al vessament de la sang, concediu-nos, pel seu exemple i intercessió, de confessar la fe amb fortalesa, de paraula i d’obra. Per Crist Senyor nostre. Amén.", 0, 1, "p116"], ["Himne", 0, 2, "p118"], ["Crist, anyell, porta del martiri, travessen els vostres atris els qui us han seguit en cos, en ànima, en cor, en sang; vostre és el seu coratge.", 0, 2, "p119"], ["Crist, llavor, màrtir de la sembra, cauen a terra i del seu si brota blat als vostres camps, pa a les vostres estovalles; vostra és la seva ofrena.", 0, 2, "p120"], ["Crist, pelegrí, pau dels captius, passen units per valls de tenebra, amb el rostre serè, lliure de rancors; vostres són les seves penes.", 0, 2, "p121"], ["Crist, vivent, màrtir de l’espera, moren contents, van cap al demà, preguen per la seva Congregació estimada; vostra és la seva pasqua.", 0, 2, "p122"], ["Crist, estel del matí, rei dels testimonis, canten a l’alba visques a la vostra glòria, «Mare» als llavis, pregàries i perdons; vostres són les seves veus.", 0, 2, "p123"], ["Crist, ponent, màrtir de la sega, s’avancen al sant en la seva cursa, segellen de vermell el vol claretià; vostra és la seva meta.", 0, 2, "p124"], ["Crist, font, repòs en el camí, lliuren l’alè per trobar la felicitat d’un pit amic, d’un Cor de Mare; vostre és el seu recer.", 0, 2, "p125"], ["Crist, corrent, màrtir de la lleva, surten al món com a missioners ardents, el seu amor viu ja no té fronteres; vostre és el seu foc.", 0, 2, "p126"], ["Crist Jesús, el vostre Esperit els forja, neixen en vós els qui per vós moriren, s’alcen amb vós, els lliureu al Pare; «Vostres, els vostres fills». Amén.", 0, 2, "p127"], ["Salmòdia", 0, 2, "p128"], ["Ant. Enmig dels turments, els màrtirs de Crist contemplaven la seva glòria i deien: «Ajudeu-nos, Senyor».", 0, 2, "p129"], ["Salm 62, 2-9", 0, 2, "p130"], ["Vós, Senyor, sou el meu Déu; jo us cerco. Tot jo tinc set de vós, per vós es desviu el meu cor, com terra eixuta, sense una gota d’aigua. Jo us contemplava al vostre santuari quan us veia gloriós i poderós. L’amor que em teniu val més que la vida; per això els meus llavis us lloaran. Que tota la vida us pugui beneir i alçar les mans lloant el vostre nom. Saciat del bo i millor, us lloaré amb el goig als llavis. Quan des del llit us recordo, passo les nits pensant en vós, perquè vós m’heu ajudat, i sóc feliç sota les vostres ales. La meva ànima s’ha enamorat de vós, em sosté la vostra mà.", 0, 2, "p131"], ["Ant. Enmig dels turments, els màrtirs de Crist contemplaven la seva glòria i deien: «Ajudeu-nos, Senyor».", 0, 2, "p132"], ["Ant. Ànimes i esperits dels justos, canteu un himne a Déu.", 0, 2, "p133"], ["Càntic Dn 3, 57-88.56", 0, 2, "p134"], ["Beneïu el Senyor, totes les criatures, canteu-li lloances per sempre. Beneïu-lo, àngels del Senyor, beneïu, cels, el Senyor. Beneïu el Senyor, aigües de l’espai, beneïu-lo, estols del Senyor. Beneïu el Senyor, sol i lluna, beneïu-lo, estrelles del cel. Beneïu el Senyor, pluges i rosades, beneïu-lo, tots els vents. Beneïu el Senyor, foc i calor, beneïu-lo, freds i gelades. Beneïu el Senyor, rosades i gebre, beneïu-lo, glaç i freds. Beneïu el Senyor, neus i geleres, beneïu-lo, dies i nits. Beneïu el Senyor, llum i tenebres, beneïu-lo, núvols i llamps. Que la terra beneeixi el Senyor, que li canti lloances per sempre. Beneïu el Senyor, muntanyes i turons, vegetació de la terra, beneeix-lo. Beneïu, fonts, el Senyor, beneïu-lo, rius i mars. Beneïu el Senyor, peixos i monstres marins, beneïu-lo, tots els ocells. Beneïu el Senyor, feres i ramats, canteu-li lloances per sempre. Beneïu el Senyor, tots els homes, beneeix-lo, poble d’Israel. Beneïu-lo, sacerdots del Senyor, beneïu-lo, servents del Senyor. Beneïu el Senyor, sants i humils de cor, ànimes i esperits dels justos, beneïu-lo. Beneïu el Senyor, Hananies, Azaries i Misael, canteu-li lloances per sempre. Beneïm el Pare i el Fill amb l’Esperit Sant, cantem-li lloances per sempre. Sou beneït, Senyor, al firmament del cel. Glòria i lloança per sempre.", 0, 2, "p135"], ["Ant. Ànimes i esperits dels justos, canteu un himne a Déu.", 0, 2, "p136"], ["A l’acabament d’aquest càntic no es diu Glòria al Pare.", 0, 2, "p137"], ["Ant. Màrtirs del Senyor, lloeu el Senyor al cel.", 0, 2, "p138"], ["Salm 149", 0, 2, "p139"], ["Canteu al Senyor un càntic nou, canteu les seves lloances davant dels qui l’estimen. Se sent feliç Israel del qui l’ha creat, s’alegren del seu rei els fills de Sió. Lloen el seu nom, el lloen tot dansant, acompanyen els seus cants amb els tambors i les cítares. Perquè el Senyor estima el seu poble, coronarà de triomf els humils. Els fidels celebren la seva glòria, des dels seus rengles aclamen plens de goig; mentre els seus llavis glorifiquen Déu, tenen a les mans espases de dos talls, per fer justícia entre els pobles, per reprendre i castigar les nacions, encadenant els seus reis, emmanillant els poderosos. Executar la sentència que està escrita és la glòria reservada als qui l’estimen.", 0, 2, "p140"], ["Ant. Màrtirs del Senyor, lloeu el Senyor al cel.", 0, 2, "p141"], ["Lectura breu", 0, 2, "p142"], ["2Co 1, 3-5", 0, 2, "p143"], ["Beneït sigui Déu, Pare de nostre Senyor Jesucrist, Pare de misericòrdia i Déu de tot consol! Ell ens encoratja en totes les nostres lluites, fins al punt que també nosaltres podem encoratjar els altres en qualsevol lluita, compartint amb ells el coratge que rebem de Déu. Si els sofriments de Crist desborden en nosaltres, gràcies a Crist també desborda, en la mateixa mesura, el nostre consol.", 0, 2, "p144"], ["Responsori breu", 0, 2, "p145"], ["V. Els justos viuen eternament. R. Els justos viuen eternament. V. Reben de Déu la seva recompensa. R. Viuen eternament. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Els justos viuen eternament.", 0, 2, "p146"], ["Càntic de Zacaries", 0, 2, "p147"], ["Ant. Feliços els perseguits pel fet de ser justos, perquè d’ells és el Regne del cel.", 0, 2, "p148"], ["Beneït sigui el Senyor, Déu d’Israel, ha visitat el seu poble i l’ha redimit. Fa que s’aixequi un salvador poderós a la casa de David el seu servent, com ho havia anunciat de temps antic, per boca dels seus sants profetes. Així ens salva, alliberant-nos dels enemics, de les mans dels qui ens volen mal, mogut per l’amor que el fa fidel als nostres pares, i pel record de l’Aliança santa, que jurà al nostre pare Abraham, prometent de concedir-nos que, sense por, lliures dels enemics, li donem culte amb santedat i justícia tota la vida. I a tu, infant, et diran profeta de l’Altíssim, perquè aniràs al davant del Senyor a preparar els seus camins. Faràs saber al poble que li ve la salvació, el perdó dels seus pecats, per l’amor entranyable del nostre Déu. Perquè ens estima, ens visitarà un Sol que ve del cel, per il·luminar els qui viuen a la fosca, a les ombres de la mort, i guiar els nostres passos per camins de pau.", 0, 2, "p149"], ["Ant. Feliços els perseguits pel fet de ser justos, perquè d’ells és el Regne del cel.", 0, 2, "p150"], ["Pregàries", 0, 2, "p151"], ["Celebrem, germans estimats, el nostre Salvador, el testimoni fidel, i, en recordar avui els sants màrtirs que moriren per causa de la paraula de Déu, aclamem-lo dient:", 0, 2, "p152"], ["Senyor, ens heu comprat amb la vostra sang.", 0, 2, "p153"], ["Per la intercessió dels sants màrtirs, que lliuraren lliurement la seva vida com a testimoni de la fe,", 0, 2, "p154"], ["— concediu-nos, Senyor, la veritable llibertat d’esperit.", 0, 2, "p155"], ["Per la intercessió dels sants màrtirs, que proclamaren la fe fins a vessar la seva sang,", 0, 2, "p156"], ["— concediu-nos, Senyor, la integritat i la constància de la fe.", 0, 2, "p157"], ["Per la intercessió dels sants màrtirs, que, portant la creu, seguiren els vostres passos,", 0, 2, "p158"], ["— concediu-nos, Senyor, de suportar amb generositat les contrarietats de la vida.", 0, 2, "p159"], ["Per la intercessió dels sants màrtirs, que rentaren els seus mantells amb la sang de l’Anyell,", 0, 2, "p160"], ["— concediu-nos, Senyor, de vèncer les obres del món i de la carn.", 0, 2, "p161"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 0, 2, "p162"], ["Pare nostre.", 0, 2, "p163"], ["Oració", 0, 2, "p164"], ["Déu, Pare nostre, que, amb l’ajuda de la Benaurada Verge Maria, vau portar els beats màrtirs claretians a la imitació de Crist fins al vessament de la sang, concediu-nos, pel seu exemple i intercessió, de confessar la fe amb fortalesa, de paraula i d’obra. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 0, 2, "p165"], ["Si cau en diumenge, es reciten els salms del diumenge I; en els altres casos, es diuen els salms graduals de la salmòdia complementària.", 0, 3, "p167"], ["Tèrcia", 0, 3, "p168"], ["Lectura breu", 0, 3, "p169"], ["1Pe 5, 10-11", 0, 3, "p170"], ["Déu, que és font de tota gràcia i que en el Crist us ha cridat a la seva glòria eterna, després d’haver sofert per poc temps, refarà les vostres forces i us deixarà ferms i ben fonamentats. D’ell és el poder per sempre. Amén.", 0, 3, "p171"], ["V. Els sants que esperen en el Senyor. R. Seran forts i no defalliran.", 0, 3, "p172"], ["Sexta", 0, 3, "p173"], ["Lectura breu", 0, 3, "p174"], ["Cf. He 11, 33", 0, 3, "p175"], ["Els sants, per la fe en Crist, Senyor nostre, sotmeteren reialmes, practicaren la justícia i obtingueren promeses.", 0, 3, "p176"], ["V. La vostra tristesa. R. Es convertirà en alegria.", 0, 3, "p177"], ["Nona", 0, 3, "p178"], ["Lectura breu", 0, 3, "p179"], ["Sv 3, 1-2a. 3b", 0, 3, "p180"], ["Les ànimes dels justos estan en mans de Déu, i cap turment no les podrà tocar. Als ulls dels insensats semblava que morissin, però ells han trobat la pau.", 0, 3, "p181"], ["V. Tornen cantant. R. Duent les seves garbes.", 0, 3, "p182"], ["L’oració, com a Laudes.", 0, 3, "p183"], ["Himne", 0, 4, "p185"], ["Com a laudes", 0, 4, "p186"], ["Salmòdia", 0, 4, "p187"], ["Ant. Els cossos dels sants foren sepultats en pau, i la seva fama perdura de generació en generació.", 0, 4, "p188"], ["Salm 114", 0, 4, "p189"], ["Estimo de tot cor el Senyor: el Senyor ha escoltat la meva súplica, ha escoltat el meu clam així que l’invocava. M’envoltaven els llaços de la mort, tenia davant meu els seus paranys, i dintre meu l’angoixa i el neguit. Vaig invocar el nom del Senyor: «Ah, Senyor, salveu-me la vida.» El Senyor és just i benigne, el nostre Déu sap compadir. El Senyor salvaguarda els senzills, jo era feble i m’ha salvat. Recobra la serenor, ànima meva, mira el que t’ha fet el Senyor. Ha alliberat de la mort la meva vida, els meus ulls, de negar-se en el plor, els meus peus, de donar un pas en fals. Continuaré caminant entre els qui viuen, a la presència del Senyor.", 0, 4, "p190"], ["Ant. Els cossos dels sants foren sepultats en pau, i la seva fama perdura de generació en generació.", 0, 4, "p191"], ["Ant. Vaig veure les ànimes dels degollats per causa de la paraula de Déu i del testimoni que havien mantingut.", 0, 4, "p192"], ["Salm 115", 0, 4, "p193"], ["Crec amb tot el cor, tot i que deia: «Que en sóc, de dissortat», tot i que deia, veient-me perdut: «Els homes, tots enganyen.» Com podria retornar al Senyor tot el bé que m’ha fet? Invocant el seu nom, alçaré el calze per celebrar la salvació. Compliré les meves prometences, ho faré davant del poble. Al Senyor li doldria la mort dels qui l’estimen. Ah, Senyor, sóc el vostre servent, ho sóc des del dia que vaig néixer. Vós em trencàreu les cadenes. Us oferiré una víctima d’acció de gràcies, invocant el vostre nom, compliré les meves prometences, ho faré davant del poble, als atris de la casa del Senyor, al teu bell mig, Jerusalem.", 0, 4, "p194"], ["Ant. Vaig veure les ànimes dels degollats per causa de la paraula de Déu i del testimoni que havien mantingut.", 0, 4, "p195"], ["Ant. Aquests són els sants que lliuraren els seus cossos per ser fidels a l’aliança de Déu i han rentat els seus vestits amb la sang de l’Anyell.", 0, 4, "p196"], ["Càntic Ap 4, 11; 5, 9-10.12", 0, 4, "p197"], ["Senyor, Déu nostre, sou digne de rebre la glòria, l’honor i el poder, perquè vós heu creat tot l’univers. Quan res no existia, vós vau voler que tot fos creat. Senyor, sou digne de prendre el document i d’obrir-ne els segells, perquè heu estat degollat i heu comprat per a Déu amb la vostra sang gent de tota tribu, llengua i nació, i n’heu fet una casa reial i uns sacerdots dedicats al nostre Déu, que regnaran a la terra. L’Anyell que ha estat degollat és digne de rebre tot poder, riquesa, saviesa, força, honor, glòria i lloança.", 0, 4, "p198"], ["Ant. Aquests són els sants que lliuraren els seus cossos per ser fidels a l’aliança de Déu i han rentat els seus vestits amb la sang de l’Anyell.", 0, 4, "p199"], ["Lectura breu", 0, 4, "p200"], ["1Pe 4, 13-14", 0, 4, "p201"], ["Alegreu-vos de poder compartir els sofriments del Crist: també el dia que es revelarà la seva glòria, desbordareu d’alegria. Feliços vosaltres si algú us retreu el nom de cristians: vol dir que l’Esperit de la glòria, que és l’Esperit de Déu, reposa sobre vosaltres.", 0, 4, "p202"], ["Responsori breu", 0, 4, "p203"], ["V. Alegreu-vos, justos, i exulteu amb el Senyor. R. Alegreu-vos, justos, i exulteu amb el Senyor. V. Aclameu-lo, els rectes de cor. R. I exulteu amb el Senyor. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Alegreu-vos, justos, i exulteu amb el Senyor.", 0, 4, "p204"], ["Càntic de Maria", 0, 4, "p205"], ["Ant. S’alegren al cel els sants que seguiren les petjades de Crist; i, perquè l’estimaren fins a vessar la sang, regnen amb el Senyor eternament.", 0, 4, "p206"], ["La meva ànima magnifica el Senyor, el meu esperit celebra el Déu que em salva, perquè ha mirat la petitesa de la seva serventa. Des d’ara totes les generacions em diran benaurada, perquè el Totpoderós obra en mi meravelles. El seu nom és sant, i l’amor que té als qui creuen en ell s’estén de generació en generació. Les obres del seu braç són potents: dispersa els homes de cor altiu, derroca els poderosos del soli i exalça els humils. Omple de béns els pobres, i els rics se’n tornen sense res. Ha protegit Israel, el seu servent, com ho havia promès als nostres pares; s’ha recordat del seu amor a Abraham i a la seva descendència per sempre.", 0, 4, "p207"], ["Ant. S’alegren al cel els sants que seguiren les petjades de Crist; i, perquè l’estimaren fins a vessar la sang, regnen amb el Senyor eternament.", 0, 4, "p208"], ["Pregàries", 0, 4, "p209"], ["A la mateixa hora en què el Rei dels màrtirs oferí la seva vida a l’últim sopar i la lliurà a la creu, donem-li gràcies dient:", 0, 4, "p210"], ["Us glorifiquem, Senyor.", 0, 4, "p211"], ["Perquè ens vau estimar fins a l’extrem, Salvador nostre, principi i origen de tot martiri:", 0, 4, "p212"], ["Us glorifiquem, Senyor.", 0, 4, "p213"], ["Perquè no cesseu de cridar els pecadors penedits als premis del vostre Regne:", 0, 4, "p214"], ["Us glorifiquem, Senyor.", 0, 4, "p215"], ["Perquè avui hem ofert la sang de l’aliança nova i eterna, vessada per al perdó dels pecats:", 0, 4, "p216"], ["Us glorifiquem, Senyor.", 0, 4, "p217"], ["Perquè amb la vostra gràcia ens heu donat perseverança en la fe durant el dia que ara s’acaba:", 0, 4, "p218"], ["Us glorifiquem, Senyor.", 0, 4, "p219"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 0, 4, "p220"], ["Perquè heu associat a la vostra mort els nostres germans difunts:", 0, 4, "p221"], ["Us glorifiquem, Senyor.", 0, 4, "p222"], ["Adrecem ara la nostra pregària al Pare del cel, dient: Pare nostre.", 0, 4, "p223"], ["Oració", 0, 4, "p224"], ["Déu, Pare nostre, que, amb l’ajuda de la Benaurada Verge Maria, vau portar els beats màrtirs claretians a la imitació de Crist fins al vessament de la sang, concediu-nos, pel seu exemple i intercessió, de confessar la fe amb fortalesa, de paraula i d’obra. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 0, 4, "p225"], ["Santa Joaquima de Vedruna i de Mas va néixer a Barcelona el 16 d’abril de 1783. Fundà l’Institut de Germanes Carmelites de la Caritat l’any 1826. Va mantenir lligams d’amistat amb sant Antoni Maria Claret com queda palès en les cartes del Sant: «La vaig conèixer d’estudiant». «Ja fundadora, va voler que li tornés a examinar les Regles, primer essent jo sacerdot i després arquebisbe». Parlant de les Germanes Carmelites de la Caritat, diu: «Regna en elles l’esperit de pobresa evangèlica, d’oració i de caritat». El Bisbe de Vic els nomenà, com a director, el Pare Claret, el qual els donà exercicis espirituals, agilitzà l’aprovació reial i treballà en l’aprovació definitiva de llurs Constitucions. Després del sant fundador, el P. Esteve Sala es feu càrrec de l’acompanyament de les mateixes religioses. La Mare Joaquima morí a Barcelona el 28 d’agost de 1854. Fou canonitzada per Joan XXIII el 12 d’abril de 1959.", 1, -1, "p229"], ["Comú de dones santes: per religiosos, per aquells que exerciren obres de misericòrdia o per educadors.", 1, -1, "p230"], ["Càntic de Zacaries, ant. Qui m’estima, el meu Pare l’estimarà i vindrem a viure amb ell (T. P. Al·leluia).", 1, 0, "p232"], ["Oració", 1, 0, "p233"], ["Senyor, vós heu suscitat en l’Església santa Joaquima de Vedruna, perquè eduqués cristianament la joventut i servís els malalts. Feu que en sapiguem imitar els exemples i posem la nostra vida al servei amorós dels nostres germans. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 1, 0, "p234"], ["Càntic de Maria, ant. Proclameu les meravelles de Déu que derroca els poderosos del soli i exalça els humils (T. P. Al·leluia).", 1, 1, "p236"], ["Santa Maria Miquela Desmaissières i López de Dicastillo va néixer a Madrid el dia 1 de gener de 1809. L’any 1850, sant Antoni Maria Claret l’animà a lliurar-se plenament a l’obra començada de rehabilitació de les dones extraviades. Després, essent el seu director espiritual, aprovà i defensà el seu esperit d’abnegació. Li aconsellà, a més, que escrivís la seva autobiografia i que conreés l’amistat amb la reina Isabel II. Col·laborà amb ella en la fundació de la seva Congregació d’Adoratrius Esclaves del Santíssim Sagrament i de la Caritat (1856) i en l’aprovació de les seves Constitucions. Una amistat profunda uní sempre aquests dos grans sants. Seguint les orientacions de Claret, es lliurà a una missió heroica en favor dels germans i morí víctima de la pesta a València el 24 d’agost de 1865. Pius XI la beatificà el 7 de juny de 1925 i el mateix Pontífex la inscriví en el catàleg dels sants el 4 de març de 1934. El dia 14 de maig de 1964, Pau VI nomenà sant Antoni Maria Claret patró principal de l’Institut de les Adoratrius.", 2, -1, "p240"], ["Comú de verges o de dones santes: per religiosos.", 2, -1, "p241"], ["Càntic de Zacaries, ant. Déu anuncia la pau al seu poble, als seus amics i als qui s’hi converteixen de cor.", 2, 0, "p243"], ["Oració", 2, 0, "p244"], ["Senyor Déu nostre, que estimeu infinitament els homes i perdoneu tots els nostres mancaments: doneu-nos l’esperit d’amor i generositat, a fi que, alimentats i enfortits amb la santa Eucaristia, i a imitació de santa Maria Miquela, us descobrim en els més pobres i en els més necessitats de vostre ajut. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 2, 0, "p245"], ["Càntic de Maria, ant. Que el nostre amor no sigui només de frases i paraules, sinó de fets i de veritat.", 2, 1, "p247"], ["El Cor Immaculat de la Benaurada Verge Maria és la nostra Titular des de la mateixa fundació de la Congregació (1849), sobre la qual exerceix el patronatge des de 1852. Des de 1862 els membres de la Congregació, en el moment de la professió religiosa, es consagren deforma especial al Cor Immaculat de Maria a fi d’obtenir l’objecte per al que el nostre Institut ha estat constituït dins l’Església. L’expressió «Cor de Maria» s’ha d’interpretar en sentit bíblic: designa la persona de la Verge; el seu «ésser» íntim i únic; el centre i la font de la seva vida interior: de l’enteniment, de la memòria, de la voluntat i de l’amor; l’actitud indivisa amb què estimà Déu i els germans i es lliurà intensament a l’obra salvadora del Fill. A la litúrgia contemplem la sol·licitud materna de Maria, model de «cor nou», do i signe de la nova aliança. El Pare Claret presenta el Cor de Maria com la fornal ardent on els missioners es forgen per a ser servidors de la Paraula, a fi de poder continuar les funcions de la maternitat espiritual de Maria envers els homes. El nostre estil profètic de vida rep del Cor Immaculat de Maria, Mare de la Congregació, una empremta peculiar. Ella ens ensenya que sense cor, sense amor, no hi ha profecia creïble...", 3, -1, "p251"], ["El divendres posterior al segon diumenge després de la Pentecosta es resa l’ofici propi de les II Vespres de la solemnitat del Sagrat Cor de Jesús.", 3, -1, "p252"], ["Els textos aquí indicats per a les I Vespres del Cor Immaculat de la benaurada Verge Maria únicament s’empren si aquesta solemnitat se celebra en una altra data.", 3, -1, "p253"], ["Himne", 3, 0, "p255"], ["El caliu de la llar els fills convida", 3, 0, "p256"], ["a respondre a la crida de l’amor,", 3, 0, "p257"], ["que de la Mare vessa sense mida,", 3, 0, "p258"], ["sol·lícit i ablamat, de dins el cor.", 3, 0, "p259"], ["La taula, el Pa llescat, el llum que els mostra,", 3, 0, "p260"], ["tot traspua presència maternal.", 3, 0, "p261"], ["Fa de bon seure, Mare, al costat vostre", 3, 0, "p262"], ["al caliu amorós de llar pairal.", 3, 0, "p263"], ["Ara que l’hora baixa ens encomana", 3, 0, "p264"], ["el dolç recolliment de l’esperit,", 3, 0, "p265"], ["el cor us vol a dins per estadana", 3, 0, "p266"], ["que enceti la conversa amb l’Infinit.", 3, 0, "p267"], ["L’amor del vostre Cor, Verge Maria,", 3, 0, "p268"], ["de tan pur és perfecta caritat", 3, 0, "p269"], ["que ens duu el Fill que el Pare sol tenia", 3, 0, "p270"], ["en simple i compartida eternitat.", 3, 0, "p271"], ["En vós ara cerquem sa fesomia,", 3, 0, "p272"], ["que ens mostri el que és el Pare en rostre humà.", 3, 0, "p273"], ["Dins vostra llar busquem la companyia", 3, 0, "p274"], ["tan humana i tan divina del Germà.", 3, 0, "p275"], ["Dem al Pare entranyable la lloança,", 3, 0, "p276"], ["el qual junt amb el Fill i l’Esperit,", 3, 0, "p277"], ["comparteix la perfecta benaurança", 3, 0, "p278"], ["que brolla de llur ésser infinit.", 3, 0, "p279"], ["Es pot cantar també algun dels cants següents:", 3, 0, "p281"], ["Cor de Maria", 3, 0, "p283"], ["de gràcia font:", 3, 0, "p284"], ["cor de maria.", 3, 0, "p285"], ["salveu el món.", 3, 0, "p286"], ["Mare estimada,", 3, 0, "p287"], ["deu-nos entrada", 3, 0, "p288"], ["dins vostre Cor:", 3, 0, "p289"], ["rosa florida,", 3, 0, "p290"], ["sol de la vida,", 3, 0, "p291"], ["cel de l’amor...", 3, 0, "p292"], ["Del cel compendi,", 3, 0, "p293"], ["d’amor incendi d’amor diví,", 3, 0, "p294"], ["lliri en poncella", 3, 0, "p295"], ["divina estrella", 3, 0, "p296"], ["del dematí...", 3, 0, "p297"], ["Mireu, benigna,", 3, 0, "p299"], ["Verge Maria,", 3, 0, "p300"], ["el vostre poble", 3, 0, "p301"], ["que en vós confia.", 3, 0, "p302"], ["Puix tant costàreu", 3, 0, "p303"], ["al Redemptor:", 3, 0, "p304"], ["Guardeu-nos, Mare,", 3, 0, "p305"], ["dins vostre Cor.", 3, 0, "p306"], ["Mar és la vida,", 3, 0, "p308"], ["vós sou l’estrella", 3, 0, "p309"], ["que al cel convida", 3, 0, "p310"], ["amb sa llum bella.", 3, 0, "p311"], ["Quan la tempesta", 3, 0, "p312"], ["brami amb furor:", 3, 0, "p313"], ["Guardeu-nos, Mare,", 3, 0, "p314"], ["dins vostre Cor.", 3, 0, "p315"], ["Estrella de nostre dia,", 3, 0, "p317"], ["Jardí de nostres amors:", 3, 0, "p318"], ["Cor puríssim de Maria,", 3, 0, "p319"], ["convertiu els pecadors.", 3, 0, "p320"], ["Terra verge no llaurada", 3, 0, "p321"], ["que arrosà l’Esperit Sant,", 3, 0, "p322"], ["amb tan cèlica rosada", 3, 0, "p323"], ["quines flors hi naixeran!", 3, 0, "p324"], ["La primera que hi floria", 3, 0, "p325"], ["terra i cel omple d’o
