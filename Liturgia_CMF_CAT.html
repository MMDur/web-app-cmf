deixat tot per vós,<\/p><p id=\"p921\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>vulgueu complir amb els nostres germans difunts les vostres promeses, en la mesura de la vostra misericòrdia.<\/p><p id=\"p922\" class=\"pr\">Pare nostre.<\/p><h3 id=\"p923\">Oració<\/h3><p id=\"p924\" class=\"pr\">Senyor, en venerar la memòria de la benaurada Verge Maria del Mont Carmel i celebrar l’origen de la nostra família missionera, us preguem que confirmeu els vostres servents en la seva plena consagració i feu fecundes les tasques del nostre apostolat, perquè sempre i en tot siguem fills fidels d’aquesta mateixa Mare. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p846", "Himne"], ["p877", "Salmòdia"], ["p899", "Lectura breu"], ["p902", "Responsori breu"], ["p904", "Càntic de Maria"], ["p908", "Pregàries"], ["p923", "Oració"]]}], "kind": "fest", "date": [7, 16], "title": "Benaurada Verge Maria del Mont Carmel", "rank": "Festa", "sub": ["Aniversari de la fundació de la Congregació"], "intro": "<p id=\"p699\" class=\"pr\">La Congregació de Missioners Fills del Cor Immaculat de la benaurada Verge Maria fou fundada a Vic (Barcelona) el 16 de juliol de 1849. Els inicis foren humils; tanmateix, segons la intenció del fundador, s’emprenia una gran obra. «La fundació de la Congregació és atribuïda a la intervenció de Maria Santíssima». En el dia dedicat a la benaurada Verge Maria del Mont Carmel, el quadre de la Mare del Bell Amor, que presidia la cel·la on es congregava el grup per començar els exercicis espirituals, era com un auguri i una penyora segura de la protecció maternal de Maria envers aquells Missioners que es deien fills seus i li consagraven els seus projectes de vida missionera.<\/p>", "missa": {"title": "Mare de Déu del Carme i Aniversari de la fundació de la nostra Congregació", "html": "<h3 class=\"rub\" id=\"m4x0\">Antífona d’introducció <span class=\"ref\">Lc 1,48a; cf. Pr 31,28a<\/span><\/h3><div class=\"pl\" id=\"m4x1\"><span class=\"l\">El Senyor ha mirat la petitesa de la seva serventa.<\/span><span class=\"l\">Els seus fills s’aixequen a proclamar-la benaurada.<\/span><\/div><h3 class=\"rub\" id=\"m4x2\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m4x3\"><span class=\"l\">Senyor, escolteu-nos amb amor,<\/span><span class=\"l\">avui que els vostres servents<\/span><span class=\"l\">celebrem la festa de la Verge Santa Maria<\/span><span class=\"l\">i festegem la fundació de la família Claretiana:<\/span><span class=\"l\">confirmeu-nos en la nostra consagració plena i total<\/span><span class=\"l\">i fecundeu l’acció del nostre apostolat multiforme,<\/span><span class=\"l\">perquè demostrem així<\/span><span class=\"l\">que som de debò fills de tal Mare.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><h3 class=\"rub\" id=\"m4x4\">Lectura primera <span class=\"ref\">Za 2, 14-17<\/span><\/h3><p class=\"lema\" id=\"m4x5\">Alegra’t, crida de goig, ciutat de Sió<\/p><p class=\"pr\" id=\"m4x6\">Lectura del profeta Zacaries.<\/p><div class=\"pl\" id=\"m4x7\"><span class=\"l\">«Alegra’t, crida de goig, ciutat de Sió,<\/span><span class=\"l\">que vinc a viure enmig teu.<\/span><span class=\"l\">T’ho dic jo, el Senyor.<\/span><span class=\"l\">Aquell dia, moltes nacions<\/span><span class=\"l\">s’uniran a mi, el Senyor,<\/span><span class=\"l\">i formaran part del meu poble.<\/span><span class=\"l\">Però jo continuaré residint enmig teu.»<\/span><span class=\"l\">Quan això es complirà,<\/span><span class=\"l\">reconeixeràs que m’ha enviat a tu<\/span><span class=\"l\">el Senyor de l’univers.<\/span><span class=\"l\">El Senyor prendrà possessió de Judà,<\/span><span class=\"l\">la seva propietat, a la Terra Santa,<\/span><span class=\"l\">i continuarà estimant Jerusalem.<\/span><span class=\"l\">Que tothom calli davant el Senyor,<\/span><span class=\"l\">que s’aixeca per sortir<\/span><span class=\"l\">del lloc sant on resideix!<\/span><\/div><p class=\"fin\" id=\"m4x8\">Paraula de Déu<\/p><div class=\"obien\" id=\"m4x9\">O bé <span class=\"ref\">Ef 1, 3-14<\/span><\/div><p class=\"lema\" id=\"m4x10\">Ens escollí en Crist abans de crear el món.<\/p><p class=\"pr\" id=\"m4x11\">Lectura de la carta de sant Pau als cristians d’Efes:<\/p><div class=\"pl\" id=\"m4x12\"><span class=\"l\">Beneït sigui el Déu i Pare de nostre Senyor Jesucrist,<\/span><span class=\"l\">que ens ha beneït en Crist<\/span><span class=\"l\">amb tota mena de benediccions espirituals dalt al cel.<\/span><\/div><div class=\"pl\" id=\"m4x13\"><span class=\"l\">Ens escollí en ell abans de crear el món,<\/span><span class=\"l\">perquè fóssim sants, irreprensibles als seus ulls.<\/span><\/div><div class=\"pl\" id=\"m4x14\"><span class=\"l\">Per amor ens destinà a ser fills seus per Jesucrist,<\/span><span class=\"l\">segons la seva benèvola decisió,<\/span><span class=\"l\">que dona glòria i lloança a la gràcia<\/span><span class=\"l\">que ens ha concedit en el seu Estimat.<\/span><\/div><div class=\"pl\" id=\"m4x15\"><span class=\"l\">En ell, per la seva sang, hem obtingut la redempció,<\/span><span class=\"l\">el perdó dels nostres pecats.<\/span><span class=\"l\">La riquesa de la gràcia de Déu<\/span><span class=\"l\">s’ha desbordat en nosaltres.<\/span><\/div><div class=\"pl\" id=\"m4x16\"><span class=\"l\">Ell ens ha concedit tota aquesta saviesa<\/span><span class=\"l\">i penetració que tenim.<\/span><span class=\"l\">Ens ha fet conèixer el seu designi secret,<\/span><span class=\"l\">la decisió benèvola que havia pres<\/span><span class=\"l\">per executar-la en la plenitud dels temps:<\/span><span class=\"l\">ha volgut unir en el Crist totes les coses,<\/span><span class=\"l\">tant les del cel com les de la terra.<\/span><\/div><div class=\"pl\" id=\"m4x17\"><span class=\"l\">En Crist hem rebut la nostra part en l’herència;<\/span><span class=\"l\">ens hi havia destinat el designi<\/span><span class=\"l\">d’aquell qui tot ho duu a terme<\/span><span class=\"l\">d’acord amb la decisió de la seva voluntat.<\/span><span class=\"l\">Volia que fóssim lloança de la seva glòria,<\/span><span class=\"l\">nosaltres que des del principi<\/span><span class=\"l\">tenim posada en Crist la nostra esperança.<\/span><\/div><div class=\"pl\" id=\"m4x18\"><span class=\"l\">En ell, vosaltres vau escoltar la paraula de la veritat,<\/span><span class=\"l\">l’evangeli que us salva.<\/span><span class=\"l\">En ell heu cregut<\/span><span class=\"l\">i heu estat marcats amb el segell<\/span><span class=\"l\">de l’Esperit Sant promès.<\/span><\/div><div class=\"pl\" id=\"m4x19\"><span class=\"l\">I l’Esperit és la penyora de l’heretat<\/span><span class=\"l\">que Déu ens té reservada,<\/span><span class=\"l\">quan ens redimirà plenament<\/span><span class=\"l\">com a possessió seva<\/span><span class=\"l\">i farà que siguem lloança de la seva glòria.<\/span><\/div><p class=\"fin\" id=\"m4x20\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m4x21\">Salm responsorial <span class=\"ref\">Sal 22, 1-3a.3b-4.5.6<\/span><\/h3><div class=\"pl\" id=\"m4x22\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> El Senyor és el meu pastor<\/span><span class=\"l\">no em mancarà mai res.<\/span><\/div><div class=\"pl\" id=\"m4x23\"><span class=\"l\">El Senyor és el meu pastor, no em manca res,<\/span><span class=\"l\">em fa descansar en prats deliciosos;<\/span><span class=\"l\">em mena al repòs vora l’aigua,<\/span><span class=\"l\">i allí em retorna.<\/span><span class=\"l\">Em guia pels camins segurs<\/span><span class=\"l\">per l’amor del seu nom. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m4x24\"><span class=\"l\">Ni quan passo per barrancs tenebrosos<\/span><span class=\"l\">no tinc por de res,<\/span><span class=\"l\">perquè us tinc vora meu;<\/span><span class=\"l\">la vostra vara de pastor<\/span><span class=\"l\">m’asserena i em conforta. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m4x25\"><span class=\"l\">Davant meu pareu taula vós mateix<\/span><span class=\"l\">i els enemics ho veuen;<\/span><span class=\"l\">m’heu ungit el cap amb perfums,<\/span><span class=\"l\">ompliu a vessar la meva copa. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m4x26\"><span class=\"l\">Oh sí! La vostra bondat i el vostre amor<\/span><span class=\"l\">m’acompanyen tota la vida,<\/span><span class=\"l\">i viuré anys i més anys<\/span><span class=\"l\">a la casa del Senyor. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m4x27\">Al·leluia<\/h3><div class=\"pl\" id=\"m4x28\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m4x29\"><span class=\"l\">Feliços els qui escolten la paraula de Déu i la compleixen. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m4x30\">Evangeli <span class=\"ref\">Mt 12, 46-50<\/span><\/h3><p class=\"lema\" id=\"m4x31\">Assenyalant amb la mà els seus deixebles, digué: «Aquests són la meva mare i els meus germans»<\/p><p class=\"pr\" id=\"m4x32\">Lectura del sant Evangeli segons sant Mateu:<\/p><p class=\"pr\" id=\"m4x33\">Mentre Jesús s’adreçava a la gent, la seva mare i els seus germans, que eren fora, volien parlar amb ell. Algú li digué: «La teva mare i els teus germans són aquí fora, que volen parlar amb tu.»<\/p><p class=\"pr\" id=\"m4x34\">Ell li respongué: «¿Qui és la meva mare i qui són els meus germans?»<\/p><p class=\"pr\" id=\"m4x35\">Llavors, assenyalant amb la mà els seus deixebles, digué: «Aquests són la meva mare i els meus germans. El qui fa la voluntat del meu Pare del cel, aquest és el meu germà, la meva germana, la meva mare.»<\/p><p class=\"fin\" id=\"m4x36\">Paraula del Senyor<\/p><div class=\"obien\" id=\"m4x37\">O bé <span class=\"ref\">Lc 1,39-56<\/span><\/div><p class=\"lema\" id=\"m4x38\">Feliç tu que has cregut<\/p><p class=\"pr\" id=\"m4x39\">Lectura de l’evangeli segons sant Lluc:<\/p><p class=\"pr\" id=\"m4x40\">Per aquells dies, Maria se n’anà decididament a la Muntanya, a la província de Judà, entrà a casa de Zacaries i saludà Elisabet. Tan bon punt Elisabet va sentir la salutació de Maria el nen saltà dins les seves entranyes i Elisabet, plena de l’Esperit Sant, cridà amb totes les seves forces: «Ets beneïda entre totes les dones i és beneït el fruit de les teves entranyes. ¿Qui soc jo perquè la mare del meu Senyor vingui a visitar-me? Mira: tan bon punt he sentit la teva salutació, el nen ha saltat d’entusiasme dins les meves entranyes. Feliç tu que has cregut! Allò que el Senyor t’ha fet saber, es complirà».<\/p><p class=\"pr\" id=\"m4x41\">Maria digué: «La meva ànima magnifica el Senyor, el meu esperit celebra Déu que em salva, perquè ha mirat la petitesa de la seva serventa. Des d’ara totes les generacions em diran benaurada, perquè el Totpoderós obra en mi meravelles. El seu nom és sant, i l’amor que té als qui creuen en ell s’estén de generació en generació.<\/p><p class=\"pr\" id=\"m4x42\">Les obres del seu braç són potents: dispersa els homes de cor altiu, derroca els poderosos del soli i exalça els humils. Omple de béns els pobres, i els rics se’n tornen sense res. Ha protegit Israel, el seu servent, com ho havia promès als nostres pares; s’ha recordat del seu amor a Abraham i a la seva descendència per sempre».<\/p><p class=\"pr\" id=\"m4x43\">Maria es quedà tres mesos amb Elisabet, i després se’n tornà a casa seva.<\/p><p class=\"fin\" id=\"m4x44\">Paraula del Senyor<\/p><h3 class=\"rub\" id=\"m4x45\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m4x46\"><span class=\"l\">Senyor, digneu-vos a mirar aquests presents<\/span><span class=\"l\">que la vostra família posa sobre el vostre altar.<\/span><span class=\"l\">Feu que us servim fidelment, amb santedat i justícia,<\/span><span class=\"l\">els qui celebrem la festa de la Mare de Déu del Carme.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m4x47\">Prefaci<\/h3><div class=\"pl\" id=\"m4x48\"><span class=\"l\">Del Comú de la Mare de Déu,<\/span><span class=\"l\">de la solemnitat del Cor Immaculat de Maria, o el següent:<\/span><\/div><div class=\"pl\" id=\"m4x49\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> El Senyor sigui amb vosaltres.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> I amb el vostre esperit.<\/span><\/div><div class=\"pl\" id=\"m4x50\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> Amunt els cors.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Els elevem al Senyor.<\/span><\/div><div class=\"pl\" id=\"m4x51\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> Donem gràcies al Senyor, Déu nostre.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Cal fer-ho i és de justícia.<\/span><\/div><div class=\"pl\" id=\"m4x52\"><span class=\"l\">Es realment just i necessari,<\/span><span class=\"l\">és el nostre deure i és la nostra salvació<\/span><span class=\"l\">Senyor, Pare Sant, Déu omnipotent i etern,<\/span><span class=\"l\">que sempre i en tot lloc us donem gràcies<\/span><span class=\"l\">i us lloem degudament en aquesta celebració<\/span><span class=\"l\">en honor de la Verge Maria.<\/span><\/div><div class=\"pl\" id=\"m4x53\"><span class=\"l\">Ella, en acceptar el vostre Verb amb cor immaculat,<\/span><span class=\"l\">va merèixer concebre’l en el seu si virginal,<\/span><span class=\"l\">i, en donar a llum el Creador,<\/span><span class=\"l\">va preparar el naixement de l’Església.<\/span><\/div><div class=\"pl\" id=\"m4x54\"><span class=\"l\">Ella, en rebre al costat de la creu<\/span><span class=\"l\">el testament del vostre amor diví,<\/span><span class=\"l\">va prendre com a fills tots els homes,<\/span><span class=\"l\">nascuts a la vida sobrenatural per la mort de Crist.<\/span><\/div><div class=\"pl\" id=\"m4x55\"><span class=\"l\">Ella, esperant amb els apòstols la vinguda de l’Esperit,<\/span><span class=\"l\">en unir les seves oracions a les dels deixebles,<\/span><span class=\"l\">esdevingué el model de l’Església suplicant.<\/span><\/div><div class=\"pl\" id=\"m4x56\"><span class=\"l\">Des de la seva assumpció al cel,<\/span><span class=\"l\">acompanya amb amor matern l’Església pelegrina<\/span><span class=\"l\">i protegeix els seus passos cap a la pàtria celeste,<\/span><span class=\"l\">fins a la vinguda gloriosa del Senyor.<\/span><\/div><div class=\"pl\" id=\"m4x57\"><span class=\"l\">Per això, amb els àngels i tots els sants,<\/span><span class=\"l\">us lloem, proclamant sens parar:<\/span><\/div><p class=\"pr\" id=\"m4x58\">Sant, Sant, Sant…<\/p><h3 class=\"rub\" id=\"m4x59\">Antífona de comunió <span class=\"ref\">Lc 1,45<\/span><\/h3><div class=\"pl\" id=\"m4x60\"><span class=\"l\">Sou feliç, Verge Maria, que heu cregut!<\/span><span class=\"l\">S’ha complert allò que el Senyor us ha fet saber.<\/span><\/div><h3 class=\"rub\" id=\"m4x61\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m4x62\"><span class=\"l\">Ara que ens heu refet amb aquests sagraments de salvació<\/span><span class=\"l\">us demanem, Senyor, que la vostra família<\/span><span class=\"l\">s’ompli de l’esperit de sant Antoni Maria Claret<\/span><span class=\"l\">i perseveri lleialment al servei de l’Evangeli.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div>", "chips": [["m4x0", "Entrada"], ["m4x2", "Col·lecta"], ["m4x4", "1a lectura"], ["m4x21", "Salm"], ["m4x30", "Evangeli"], ["m4x45", "Ofrenes"], ["m4x47", "Prefaci"], ["m4x59", "Comunió"], ["m4x61", "Postcomunió"]], "color": "blanco", "fecha": "16 de juliol"}}, {"label": "24 d’octubre", "hours": [{"name": "I Vespres", "tab": "I Vespres", "html": "<h3 id=\"p930\">Himne<\/h3><p id=\"p931\" class=\"v\">És capvespre, el jorn declina<\/p><p id=\"p932\" class=\"v\">i al cel tremen els estels.<\/p><p id=\"p933\" class=\"v\">Entonin els cors fidels<\/p><p id=\"p934\" class=\"v st\">la lloança vespertina.<\/p><p id=\"p935\" class=\"v\">Lloem Déu per la victòria<\/p><p id=\"p936\" class=\"v\">de Claret, l’humil servent<\/p><p id=\"p937\" class=\"v\">en qui lluu, circumfulgent,<\/p><p id=\"p938\" class=\"v st\">la corona de la glòria.<\/p><p id=\"p939\" class=\"v\">Lloem la Verge Maria<\/p><p id=\"p940\" class=\"v\">que a Claret lliurà el tresor<\/p><p id=\"p941\" class=\"v\">del sagrari del seu Cor,<\/p><p id=\"p942\" class=\"v st\">perquè el guardés nit i dia.<\/p><p id=\"p943\" class=\"v\">Lloem l’amant de pobresa<\/p><p id=\"p944\" class=\"v\">i divina voluntat<\/p><p id=\"p945\" class=\"v\">que intacta servà l’esclat<\/p><p id=\"p946\" class=\"v st\">del lliri de la puresa.<\/p><p id=\"p947\" class=\"v\">Lloem l’ungida figura<\/p><p id=\"p948\" class=\"v\">d’apòstol i fundador<\/p><p id=\"p949\" class=\"v\">que, forjat en el dolor,<\/p><p id=\"p950\" class=\"v st\">ha atès l’eterna ventura.<\/p><p id=\"p951\" class=\"v\">Lloem l’Amor sense mida<\/p><p id=\"p952\" class=\"v\">que, havent-lo configurat,<\/p><p id=\"p953\" class=\"v\">en la mort amb son Amat,<\/p><p id=\"p954\" class=\"v st\">l’ha introduït dins la Vida.<\/p><p id=\"p955\" class=\"v\">El Déu de la benaurança<\/p><p id=\"p956\" class=\"v\">l’Únic, l’Etern, l’Infinit,<\/p><p id=\"p957\" class=\"v\">Pare, Fill i Esperit,<\/p><p id=\"p958\" class=\"v st\">accepti la nostra lloança.<\/p><p id=\"p959\" class=\"v st rub\"><span class=\"r\">O bé:<\/span><\/p><p id=\"p960\" class=\"v\">Cantem tots amb veu fervent<\/p><p id=\"p961\" class=\"v\">del gran Claret la glòria i santedat.<\/p><p id=\"p962\" class=\"v\">Lloem l’obrer de Sallent,<\/p><p id=\"p963\" class=\"v\">l’apòstol de nostra gent,<\/p><p id=\"p964\" class=\"v st\">l’egregi fundador i sant prelat.<\/p><p id=\"p965\" class=\"v\">Mirant les fines malles del teler<\/p><p id=\"p966\" class=\"v\">s’escolen ells seus anys de jovenesa.<\/p><p id=\"p967\" class=\"v\">El seny tingué i la força de l’obrer.<\/p><p id=\"p968\" class=\"v\">Del zel de Déu amb l’ànima ja encesa,<\/p><p id=\"p969\" class=\"v st\">es llença al món l’intrèpid missioner.<\/p><p id=\"p970\" class=\"v\">Un cant vibrant a sa llaor alcem,<\/p><p id=\"p971\" class=\"v\">nimbem d’amor el novell Sant tan nostre.<\/p><p id=\"p972\" class=\"v\">Sobre el país sa protecció implorem<\/p><p id=\"p973\" class=\"v\">i amb la claror de glòria del seu rostre<\/p><p id=\"p974\" class=\"v st\">pel seu CAMÍ DRET I SEGUR... marxem!<\/p><p id=\"p975\" class=\"v st rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p976\" class=\"v st\"><span class=\"l\">Fill del poble i confessor de reis,<\/span><span class=\"l\">rierol mansuet i huracà profètic,<\/span><span class=\"l\">treballador i missioner, bisbe,<\/span><span class=\"l\">Pare Claret.<\/span><span class=\"l e\"><\/span><span class=\"l\">Fóreu una flama que passà abrandant<\/span><span class=\"l\">terres i mars de la vostra pàtria, Espanya.<\/span><span class=\"l\">Cuba a Amèrica —la vinya jove—<\/span><span class=\"l\">conegué el vostre incendi.<\/span><span class=\"l e\"><\/span><span class=\"l\">Crist en el vostre pit prolongà el seu altar.<\/span><span class=\"l\">Ell us donà un calze de vores abrandades:<\/span><span class=\"l\">persecucions i calúmnies, sang.<\/span><span class=\"l\">Res no us fa enrere.<\/span><span class=\"l e\"><\/span><span class=\"l\">Mai en el vostre cel no s’eclipsà Maria,<\/span><span class=\"l\">Maria Mare, Cor que vetlla;<\/span><span class=\"l\">per ella teniu un estol resplendent<\/span><span class=\"l\">de fills i filles.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneït el Pare que us donà a l’Església,<\/span><span class=\"l\">i glòria a Crist, l’amor del qual us urgí.<\/span><span class=\"l\">Glòria al qui és segell de tots dos, l’Esperit,<\/span><span class=\"l\">glòria per sempre.<\/span><\/p><h3 id=\"p977\">Salmòdia<\/h3><p id=\"p978\" class=\"pr\"><span class=\"r\">Ant.<\/span> Lloem el Senyor, que ha glorificat sant Antoni Maria Claret i l’ha constituït pare de moltes famílies en l’Església.<\/p><h4 id=\"p979\">Salm 112<\/h4><p id=\"p980\" class=\"v st\"><span class=\"l\">Servents del Senyor, lloeu-lo,<\/span><span class=\"l\">lloeu el nom del Senyor.<\/span><span class=\"l\">Sigui beneït el nom del Senyor<\/span><span class=\"l\">ara i per tots els segles.<\/span><span class=\"l\">Des de la sortida fins a la posta del sol<\/span><span class=\"l\">lloeu el nom del Senyor.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor és excels als ulls de tots els pobles,<\/span><span class=\"l\">la seva glòria s’eleva més enllà del cel.<\/span><span class=\"l\">Qui és com el Senyor, el nostre Déu?<\/span><span class=\"l\">Té molt amunt el seu tron,<\/span><span class=\"l\">i des d’allí s’inclina<\/span><span class=\"l\">per veure el cel i la terra.<\/span><span class=\"l e\"><\/span><span class=\"l\">Aixeca de la pols el desvalgut,<\/span><span class=\"l\">treu el pobre de la cendra,<\/span><span class=\"l\">per asseure’l entre els poderosos,<\/span><span class=\"l\">els poderosos del seu poble.<\/span><span class=\"l\">La qui vivia estèril a casa,<\/span><span class=\"l\">la fa mare feliç amb els fills.<\/span><\/p><p id=\"p981\" class=\"pr\"><span class=\"r\">Ant.<\/span> Lloem el Senyor, que ha glorificat sant Antoni Maria Claret i l’ha constituït pare de moltes famílies en l’Església.<\/p><p id=\"p982\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p983\">Oració sàlmica<\/h4><p id=\"p984\" class=\"pr\">Déu Totpoderós, que heu glorificat el vostre Fill Jesucrist, escolteu la nostra pregària i concediu-nos que puguem participar de l’esperit de sant Antoni Maria Claret, per tal de ser admesos un dia amb ell a la vostra presència, on el vostre nom és lloat per sempre. Per Crist Senyor nostre.<\/p><p id=\"p985\" class=\"pr\"><span class=\"r\">Ant.<\/span> Lloaré el Senyor tota la vida: ell es manté fidel per sempre.<\/p><h4 id=\"p986\">Salm 145<\/h4><p id=\"p987\" class=\"v st\"><span class=\"l\">Lloa el Senyor, ànima meva.<\/span><span class=\"l\">Lloaré el Senyor tota la vida,<\/span><span class=\"l\">cantaré al meu Déu mentre sigui al món.<\/span><span class=\"l e\"><\/span><span class=\"l\">No confieu en els homes poderosos.<\/span><span class=\"l\">Homes que són terra, incapaços de salvar.<\/span><span class=\"l\">Quan exhalen l’esperit, tornen a la terra,<\/span><span class=\"l\">i aquell dia es desfan els seus plans.<\/span><span class=\"l e\"><\/span><span class=\"l\">Feliç l’home que troba ajuda en el Déu de Jacob;<\/span><span class=\"l\">espera en el Senyor, el seu Déu,<\/span><span class=\"l\">que ha fet el cel, la terra i el mar,<\/span><span class=\"l\">i tot el que es mou en aquests llocs.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor, que es manté fidel per sempre,<\/span><span class=\"l\">fa justícia als oprimits,<\/span><span class=\"l\">dóna pa als qui tenen fam.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor deslliura els presos,<\/span><span class=\"l\">el Senyor dóna la vista als cecs,<\/span><span class=\"l\">el Senyor redreça els vençuts,<\/span><span class=\"l\">el Senyor estima els justos,<\/span><span class=\"l e\"><\/span><span class=\"l\">el Senyor guarda els forasters,<\/span><span class=\"l\">manté les viudes i els orfes,<\/span><span class=\"l\">i capgira els camins dels injustos.<\/span><span class=\"l e\"><\/span><span class=\"l\">El senyor regna per sempre,<\/span><span class=\"l\">és el teu Déu, Sió, per tots els segles.<\/span><\/p><p id=\"p988\" class=\"pr\"><span class=\"r\">Ant.<\/span> Lloaré el Senyor tota la vida: ell es manté fidel per sempre.<\/p><p id=\"p989\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p990\">Oració sàlmica<\/h4><p id=\"p991\" class=\"pr\">Senyor i Déu nostre, que heu enviat el vostre Fill al món per anunciar la Bona Nova als pobres i alliberar els captius, doneu-nos el goig de ser anunciadors del vostre Evangeli en el seguiment de Crist, a imitació de sant Antoni Maria Claret. Per Crist Senyor nostre.<\/p><p id=\"p992\" class=\"pr\"><span class=\"r\">Ant.<\/span> Déu elegí en Crist sant Antoni Maria Claret perquè fos sant i donés a conèixer el misteri de la seva voluntat.<\/p><h4 id=\"p993\">Càntic Ef 1, 3-10<\/h4><p id=\"p994\" class=\"v st\"><span class=\"l\">Beneït sigui el Déu i Pare<\/span><span class=\"l\">de nostre Senyor Jesucrist,<\/span><span class=\"l\">que ens ha beneït en Crist<\/span><span class=\"l\">amb tota mena de benediccions espirituals<\/span><span class=\"l\">dalt del cel.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ens elegí en ell abans de crear el món,<\/span><span class=\"l\">perquè fóssim sants, irreprensibles als seus<\/span><span class=\"l\">ulls.<\/span><span class=\"l e\"><\/span><span class=\"l\">Per amor ens destinà a ser fills seus per Jesucrist,<\/span><span class=\"l\">segons la seva benèvola decisió,<\/span><span class=\"l\">que dóna lloança a la grandesa dels favors<\/span><span class=\"l\">que ens ha concedit en el seu Estimat.<\/span><span class=\"l e\"><\/span><span class=\"l\">En ell, hem estat rescatats<\/span><span class=\"l\">amb el preu de la seva sang.<\/span><span class=\"l\">Les nostres culpes han estat perdonades.<\/span><span class=\"l e\"><\/span><span class=\"l\">La riquesa dels favors de Déu<\/span><span class=\"l\">s’ha desbordat en nosaltres.<\/span><span class=\"l\">Ell ens ha concedit<\/span><span class=\"l\">tota aquesta saviesa i penetració que tenim.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ens ha fet conèixer el secret de la decisió<\/span><span class=\"l\">benèvola<\/span><span class=\"l\">que havia pres,<\/span><span class=\"l\">per executar-la quan els temps fossin madurs.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ha volgut unir en el Crist tot el món,<\/span><span class=\"l\">tant el del cel com el de la terra.<\/span><\/p><p id=\"p995\" class=\"pr\"><span class=\"r\">Ant.<\/span> Déu elegí en Crist sant Antoni Maria Claret perquè fos sant i donés a conèixer el misteri de la seva voluntat.<\/p><p id=\"p996\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p997\">Oració sàlmica<\/h4><p id=\"p998\" class=\"pr\">Beneït sigueu, Senyor Déu nostre, que ens heu destinat en Crist, per pura iniciativa vostra, a ser els vostres fills; aviveu en nosaltres l’esperit filial, per tal que la nostra vida s’esmerci en la vostra lloança. Per Crist Senyor nostre.<\/p><h3 id=\"p999\">Lectura breu<\/h3><p id=\"p1000\" class=\"ref rub\"><span class=\"r\"><i>Is 61, 1-2a<\/i><\/span><\/p><p id=\"p1001\" class=\"pr\">L’Esperit del Senyor reposa sobre meu, perquè el Senyor m’ha ungit, m’ha enviat a portar la Bona Nova als desvalguts, a curar els cors adolorits, a proclamar als captius la llibertat, i als presos el retorn de la llum, a proclamar l’any de gràcia del Senyor.<\/p><h3 id=\"p1002\">Responsori breu<\/h3><p id=\"p1003\" class=\"ref rub\"><span class=\"r\"><i>Is 49, 3. 6<\/i><\/span><\/p><p id=\"p1004\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Tu ets el meu servent; ets la meva glòria. Ell m’ha format des del si de la mare, perquè fos el seu servent.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Tu ets el meu servent; ets la meva glòria. Ell m’ha format des del si de la mare, perquè fos el seu servent.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Jo t’he fet llum de les nacions perquè portis la meva salvació d’un cap a l’altre de la terra.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Ell m’ha format des del si de la mare, perquè fos el seu servent.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Glòria al Pare i al Fill i a l’Esperit Sant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Tu ets el meu servent; ets la meva glòria. Ell m’ha format des del si de la mare, perquè fos el seu servent.<\/span><\/p><h3 id=\"p1005\">Càntic de Maria<\/h3><p id=\"p1006\" class=\"pr\"><span class=\"r\">Ant.<\/span> Sant Antoni Maria Claret fou cridat a anunciar la mort i la resurrecció del Senyor, per tal que se salvin tots els qui creuen en Ell.<\/p><p id=\"p1007\" class=\"v st\"><span class=\"l\">La meva ànima magnifica el Senyor,<\/span><span class=\"l\">el meu esperit celebra el Déu que em salva,<\/span><span class=\"l\">perquè ha mirat la petitesa de la seva serventa.<\/span><span class=\"l e\"><\/span><span class=\"l\">Des d’ara totes les generacions<\/span><span class=\"l\">em diran benaurada,<\/span><span class=\"l\">perquè el Totpoderós obra en mi meravelles.<\/span><span class=\"l e\"><\/span><span class=\"l\">El seu nom és sant,<\/span><span class=\"l\">i l’amor que té als qui creuen en ell<\/span><span class=\"l\">s’estén de generació en generació.<\/span><span class=\"l e\"><\/span><span class=\"l\">Les obres del seu braç són potents:<\/span><span class=\"l\">dispersa els homes de cor altiu,<\/span><span class=\"l\">derroca els poderosos del soli<\/span><span class=\"l\">i exalça els humils.<\/span><span class=\"l\">Omple de béns els pobres,<\/span><span class=\"l\">i els rics se’n tornen sense res.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ha protegit Israel, el seu servent,<\/span><span class=\"l\">com ho havia promès als nostres pares;<\/span><span class=\"l\">s’ha recordat del seu amor a Abraham<\/span><span class=\"l\">i a la seva descendència per sempre.<\/span><\/p><p id=\"p1008\" class=\"pr\"><span class=\"r\">Ant.<\/span> Sant Antoni Maria Claret fou cridat a anunciar la mort i la resurrecció del Senyor, per tal que se salvin tots els qui creuen en Ell.<\/p><h3 id=\"p1009\">Pregàries<\/h3><p id=\"p1010\" class=\"pr\">L’Esperit Sant i la vida i ensenyament de sant Antoni Maria Claret han fet de nosaltres una família de Déu. Preguem per la nostra Congregació i aclamem el nostre Pare del cel:<\/p><p id=\"p1011\" class=\"c\"><i>Senyor, recordeu-vos de la vostra Congregació.<\/i><\/p><p id=\"p1012\" class=\"pr\">Pare Sant, vós que enviàreu el vostre Fill al món perquè proclamés als pobres l’anunci joiós de l’Evangeli,<\/p><p id=\"p1013\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu que anunciem l’Evangeli a tothom.<\/p><p id=\"p1014\" class=\"pr\">Vós enviàreu el vostre Fill perquè reconciliés el món amb vós,<\/p><p id=\"p1015\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu que ajudem els homes a recuperar la vostra amistat.<\/p><p id=\"p1016\" class=\"pr\">Vós convocàreu els Apòstols perquè seguissin el vostre Fill en l’anunci de l’Evangeli,<\/p><p id=\"p1017\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>concediu-nos de participar plenament en la comunitat de vida missionera que fundà sant Antoni Maria Claret.<\/p><p id=\"p1018\" class=\"pr\">Vós, mogut per la pregària del vostre Fill i de l’Església, heu enviat treballadors als vostres sembrats,<\/p><p id=\"p1019\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>vulgueu enviar-ne a la nostra Congregació per tal que us puguem glorificar cada dia més amb la vida i amb l’apostolat.<\/p><p id=\"p1020\" class=\"pr\">Vós que inflamàreu sant Antoni Maria Claret d’amor a la Verge santa Maria, la Mare de l’Església,<\/p><p id=\"p1021\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu-nos experimentar sempre la protecció de Maria per tal que, de nom i de fets, siguem de debò fills de tal Mare.<\/p><p id=\"p1022\" class=\"pr\">Vós volguéreu que el vostre Fill fos el primer a ressuscitar d’entre els morts,<\/p><p id=\"p1023\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>atorgueu a tots els qui són del Crist, de ressuscitar amb Ell el dia de la seva vinguda.<\/p><p id=\"p1024\" class=\"pr rub\"><span class=\"r\">Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.<\/span><\/p><p id=\"p1025\" class=\"pr\">Pare nostre.<\/p><h3 id=\"p1026\">Oració<\/h3><p id=\"p1027\" class=\"pr\">Senyor Déu nostre, vós vau escollir sant Antoni Maria Claret perquè fundés la nostra família i el vau inflamar d’un amor tan ardent que el feia viure alegre enmig de les privacions, calúmnies i turments: concediu-nos que, seguint els seus ensenyaments i exemples, frisem per la salvació de tots els homes i proclamem pertot la vostra glòria. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p930", "Himne"], ["p977", "Salmòdia"], ["p999", "Lectura breu"], ["p1002", "Responsori breu"], ["p1005", "Càntic de Maria"], ["p1009", "Pregàries"], ["p1026", "Oració"]]}, {"name": "Invitatori", "tab": "Invitatori", "html": "<p id=\"p1029\" class=\"pr\"><span class=\"r\">Ant.<\/span> Celebrem amb goig la festa de sant Antoni Maria Claret, missioner apostòlic i fundador de la nostra família.<\/p><p id=\"p1030\" class=\"pr\"><span class=\"r\">O bé:<\/span> Veniu, adorem el Senyor en la festa de sant Antoni Maria Claret, Apòstol de la Paraula.<\/p><p id=\"p1031\" class=\"pr rub\"><span class=\"r\">El salm invitatori, com a l’Ordinari.<\/span><\/p>", "chips": []}, {"name": "Ofici de lectura", "tab": "Ofici de lectura", "html": "<h3 id=\"p1033\">Himne<\/h3><p id=\"p1034\" class=\"v st\"><span class=\"l\">Claret, veu pelegrina que aneu sembrant<\/span><span class=\"l\">la gran notícia: la salvació.<\/span><span class=\"l\">No importen races ni pobles;<\/span><span class=\"l\">només hi ha un Pare, només un Senyor.<\/span><span class=\"l\">Claret, des de la vostra vida Déu ens assenyala<\/span><span class=\"l\">la nostra tasca, la nostra missió.<\/span><span class=\"l\">Anem seguint les vostres petjades,<\/span><span class=\"l\">cridant al món: Déu és amor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Arribà el Senyor travessant el vostre camí<\/span><span class=\"l\">i, en veure-us, pel vostre nom us cridà,<\/span><span class=\"l\">per fer-vos testimoni del seu Regne,<\/span><span class=\"l\">com a fidel missatger de la seva veu.<\/span><span class=\"l\">I vós travessàveu mars i muntanyes<\/span><span class=\"l\">proclamant el missatge de l’amor.<\/span><span class=\"l\">Arribàreu fins a les illes més llunyanes<\/span><span class=\"l\">anunciant als homes el perdó.<\/span><span class=\"l e\"><\/span><span class=\"l\">La llum de l’Evangeli fou el vostre rumb,<\/span><span class=\"l\">la vostra vida, Crist mateix l’omplí,<\/span><span class=\"l\">i el féreu arribar fins als homes,<\/span><span class=\"l\">com el Fill, en Maria, se’ns donà.<\/span><span class=\"l\">Nosaltres seguirem els vostres camins,<\/span><span class=\"l\">com a nova família del Senyor.<\/span><span class=\"l\">Volem ser també la llum del món,<\/span><span class=\"l\">llevat de vida i salvació.<\/span><\/p><h3 id=\"p1035\">Salmòdia<\/h3><p id=\"p1036\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor li ha posat al front una corona d’or i li ha fet la gràcia d’allargar els seus anys per sempre, sense fi.<\/p><h4 id=\"p1037\">Salm 20, 2-8.14<\/h4><p id=\"p1038\" class=\"v st\"><span class=\"l\">El rei celebra el vostre triomf, Senyor.<\/span><span class=\"l\">Com se sent feliç per la vostra victòria!<\/span><span class=\"l\">Li heu concedit el que el seu cor volia,<\/span><span class=\"l\">no li heu refusat el que us demanava.<\/span><span class=\"l e\"><\/span><span class=\"l\">Sortiu a rebre’l augurant-li felicitat,<\/span><span class=\"l\">li poseu al front una corona d’or.<\/span><span class=\"l\">Us demanava la vida, i li heu fet la gràcia<\/span><span class=\"l\">d’allargar els seus anys per sempre, sense fi.<\/span><span class=\"l e\"><\/span><span class=\"l\">L’ha fet cèlebre la vostra victòria,<\/span><span class=\"l\">l’heu cobert d’honor i majestat,<\/span><span class=\"l\">sempre es valdran del seu nom per beneir,<\/span><span class=\"l\">l’ompliu de goig amb la vostra mirada.<\/span><span class=\"l\">El rei confia en el Senyor;<\/span><span class=\"l\">l’Altíssim se l’estima, i no té por de caure.<\/span><span class=\"l e\"><\/span><span class=\"l\">Alceu-vos, Senyor, amb el vostre poder:<\/span><span class=\"l\">cantarem celebrant la vostra gesta.<\/span><\/p><p id=\"p1039\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor li ha posat al front una corona d’or i li ha fet la gràcia d’allargar els seus anys per sempre, sense fi.<\/p><p id=\"p1040\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p1041\">Oració sàlmica<\/h4><p id=\"p1042\" class=\"pr\">Senyor, vós que heu ressuscitat Crist i li heu concedit anys sense fi, mireu propici els cohereus del vostre Fill, i manteniu-los ferms en el combat, no fos cas que, tot anunciant a d’altres l’Evangeli, restessin ells exclosos del Regne. Ell, que viu i regna pels segles dels segles.<\/p><p id=\"p1043\" class=\"pr\"><span class=\"r\">Ant.<\/span> Us lloem, Senyor i us donem gràcies, perquè ens heu revelat les vostres obres i els vostres designis.<\/p><h4 id=\"p1044\">Salm 91 I<\/h4><p id=\"p1045\" class=\"v st\"><span class=\"l\">És bo de lloar l’Altíssim,<\/span><span class=\"l\">de cantar al vostre nom, Senyor,<\/span><span class=\"l\">de proclamar al matí el vostre amor,<\/span><span class=\"l\">i de nit la vostra fidelitat.<\/span><span class=\"l e\"><\/span><span class=\"l\">Us canto amb la lira de deu cordes i amb l’arpa,<\/span><span class=\"l\">als acords d’interludis de cítara.<\/span><span class=\"l\">Senyor, quin goig que em donen les vostres gestes!<\/span><span class=\"l\">Aclamo amb alegria l’obra de les vostres mans.<\/span><span class=\"l e\"><\/span><span class=\"l\">Senyor, que en són de grans les vostres obres,<\/span><span class=\"l\">els vostres designis, que en són de profunds!<\/span><span class=\"l\">Els ignorants els desconeixen,<\/span><span class=\"l\">els insensats no se n’adonen.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ni que els injustos creixin com l’herba,<\/span><span class=\"l\">ni que arribin a florir els amics de males arts,<\/span><span class=\"l\">acabaran, que no se’n parlarà mai més.<\/span><span class=\"l\">Però vós, Senyor, sou excels per sempre.<\/span><\/p><p id=\"p1046\" class=\"pr\"><span class=\"r\">Ant.<\/span> Us lloem, Senyor i us donem gràcies, perquè ens heu revelat les vostres obres i els vostres designis.<\/p><p id=\"p1047\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p1048\">Oració sàlmica<\/h4><p id=\"p1049\" class=\"pr\">Senyor, les vostres accions són la nostra força i la nostra joia; feu que comprenguem la profunditat dels vostres designis i, a la llum de la fe, cerquem en tots els esdeveniments els signes de la vostra voluntat, per tal que siguem cada dia més fidels a la nostra missió. Per Crist Senyor nostre.<\/p><p id=\"p1050\" class=\"pr\"><span class=\"r\">Ant.<\/span> El just creixerà com la palmera a la casa del Senyor, i donarà fruit abundant.<\/p><h4 id=\"p1051\">Salm 91 II<\/h4><p id=\"p1052\" class=\"v st\"><span class=\"l\">Els vostres enemics desapareixeran,<\/span><span class=\"l\">seran dispersats els amics de males arts,<\/span><span class=\"l\">i a mi, com als búfals, m’alceu el front,<\/span><span class=\"l\">m’ungiu amb oli novell;<\/span><span class=\"l\">puc mirar fit a fit els meus contraris,<\/span><span class=\"l\">en sento parlar sense por.<\/span><span class=\"l e\"><\/span><span class=\"l\">Els justos creixeran com les palmeres,<\/span><span class=\"l\">es faran grans com els cedres del Líban;<\/span><span class=\"l\">plantats a la casa del Senyor;<\/span><span class=\"l\">creixeran als atris del nostre Déu;<\/span><span class=\"l e\"><\/span><span class=\"l\">encara donaran fruit a la vellesa,<\/span><span class=\"l\">continuaran plens d’ufana i de vigor,<\/span><span class=\"l\">per proclamar que el Senyor és recte,<\/span><span class=\"l\">que la meva Roca no coneix la injustícia.<\/span><\/p><p id=\"p1053\" class=\"pr\"><span class=\"r\">Ant.<\/span> El just creixerà com la palmera a la casa del Senyor, i donarà fruit abundant.<\/p><p id=\"p1054\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p1055\">Oració sàlmica<\/h4><p id=\"p1056\" class=\"pr\">Ungits amb l’oli novell del vostre Esperit, us lloem, Senyor; concediu-nos que, plantats a la vostra casa, units a vós, donem fruit abundant i el nostre fruit perduri. Per Crist Senyor nostre.<\/p><p id=\"p1057\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> La seva crida s’escampa per tota la terra.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Escolten el seu missatge fins als límits del món.<\/span><\/p><h3 id=\"p1058\">Primera lectura<\/h3><p id=\"p1059\" class=\"src v\">De la segona carta de l’apòstol sant Pau als cristians de Corint 5, 11-21<\/p><h4 class=\"rt\" id=\"p1060\">L’amor de Crist ens esperona<\/h4><p id=\"p1061\" class=\"pr\">Sabent què vol dir venerar el Senyor, intentem de convèncer els homes. Déu prou que ens coneix, i espero que dins vostre també vosaltres ens coneixeu. No volem tornar a fer la nostra pròpia recomanació, però sí donar-vos l’ocasió de gloriar-vos de nosaltres; així tindreu què respondre als qui es glorien de les aparences i no del que hi ha en el cor. Perquè, si havíem perdut el seny, era per Déu, i si ara tenim seny, és per vosaltres. L’amor del Crist ens té agafats: hem comprès que un ha mort per tots, i això vol dir que tots han mort amb ell. I ell ha mort per tots perquè els qui viuen ja no visquin per a ells mateixos, sinó per a aquell qui ha mort i ressuscitat per tots ells.<\/p><p id=\"p1062\" class=\"pr\">Per això nosaltres, des d’ara, ja no valorem ningú de manera purament humana, i si en altre temps havíem valorat així el Crist, ara ja no ho fem. És a dir, els qui viuen en Crist són una creació nova. El que era antic ha passat; ha començat un món nou. I tot això és obra de Déu, que ens ha reconciliat amb ell mateix per Crist i ens ha confiat a nosaltres aquest servei de la reconciliació. Efectivament, Déu, en Crist, reconciliava el món amb ell mateix, no tenint-li més en compte els seus pecats, i a nosaltres ens ha encomanat l’anunci de la reconciliació. Per tant, som ambaixadors de Crist, i Déu mateix us exhorta a través nostre. Us ho demanem en nom de Crist: reconcilieu-vos amb Déu! Al qui no havia experimentat el pecat, Déu, per nosaltres, li va carregar el pecat, perquè gràcies a ell experimentéssim la seva justícia salvadora.<\/p><h4 id=\"p1063\">Responsori<\/h4><p id=\"p1064\" class=\"ref rub\"><span class=\"r\"><i>Ga 6, 14. 17<\/i><\/span><\/p><p id=\"p1065\" class=\"pr\"><span class=\"l\"><span class=\"r\">R.<\/span> Déu me’n guard de gloriar-me en res si no és en la creu de nostre Senyor Jesucrist; * En la creu, el món està crucificat per a mi, i jo, per al món.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Jo porto en el meu cos les marques dels sofriments de Jesús. * En la creu, el món està crucificat per a mi, i jo, per al món.<\/span><\/p><p id=\"p1066\" class=\"pr rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p1067\" class=\"pr rub\"><span class=\"r\"><i>De la primera carta de l’apòstol sant Pau als cristians de Corint 9, 16-19. 22-27<\/i><\/span><\/p><h4 class=\"rt\" id=\"p1068\">Ai de mi si no anunciés l’evangeli<\/h4><p id=\"p1069\" class=\"pr\">Tanmateix, jo no puc gloriar-me d’anunciar l’evangeli, perquè és una obligació que m’han imposat: ai de mi si no anunciés l’evangeli! Si m’ho hagués triat, tindria dret a un salari; però no ho he triat: és un encàrrec que tinc confiat. Quin és, doncs, el meu salari? Oferir de franc l’evangeli que anuncio, sense fer ús dels drets que l’evangeli em dóna. Jo, que no era esclau de ningú, m’he fet esclau de tots per guanyar-ne tants com pugui. M’he fet feble amb els febles per guanyar els febles; m’he fet tot amb tots per salvar-ne alguns, costés el que costés. Tot ho faig a causa de l’evangeli, per poder-hi tenir part. No sabeu que a l’estadi tots els corredors es llancen a la cursa, però només un s’emporta el premi? Correu bé per poder-vos-el endur! L’atleta s’absté de moltes coses, i tot per guanyar-se una corona que es marceix, mentre que nosaltres n’hem de guanyar una que mai no es marcirà. Així, doncs, jo corro, però no sense una meta; combato donant cops de puny, però no pas a l’aire. Tracto amb duresa el meu cos i el tinc dominat, no fos cas que, després de proclamar la victòria dels altres, quedés desqualificat jo mateix.<\/p><h4 id=\"p1070\">Responsori<\/h4><p id=\"p1071\" class=\"ref rub\"><span class=\"r\"><i>Cf. Ac 20, 21. 24; Rm 1, 16<\/i><\/span><\/p><p id=\"p1072\" class=\"pr\"><span class=\"l\"><span class=\"r\">R.<\/span> No he estalviat cap mitjà al meu abast per predicar la fe en Jesús, nostre Senyor. * No dono cap valor a la meva vida, mentre dugui a terme el camí i el ministeri que vaig rebre de Jesús, el Senyor: donar testimoni de l’evangeli de la gràcia de Déu.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Jo no m’avergonyeixo de l’evangeli, que és poder de Déu per a salvar tots els qui creuen. * No dono cap valor a la meva vida, mentre dugui a terme el camí i el ministeri que vaig rebre de Jesús, el Senyor: donar testimoni de l’evangeli de la gràcia de Déu.<\/span><\/p><h3 id=\"p1073\">Segona lectura<\/h3><p id=\"p1074\" class=\"src v\"><span class=\"l\">Dels escrits de sant Antoni Maria Claret, bisbe i fundador<\/span><span class=\"l\">El egoísmo vencido, dins Escritos espirituales, BAC, Madrid 1985, pàgines 417-418, i Autobiografia, n. 494<\/span><\/p><h4 class=\"rt\" id=\"p1075\">L’amor que Crist ens té ens urgeix<\/h4><p id=\"p1076\" class=\"pr\">Encesos per la mateixa flama van venir missioners apostòlics, en vénen i en vindran fins a la fi del món, des d’un cap a l’altre de la terra, i proclamaran la paraula de Déu de manera tal que podrà dir-se d’ells mateixos ben merescudament aquelles paraules de l’apòstol Pau: «L’amor que Crist ens té ens urgeix». L’amor de Crist ens estimula, ens incita a córrer, a volar duts per les ales d’un zel sant. El qui estima com cal estima Déu i el proïsme; el qui té zel de debò és idèntic al qui estima, però li és superior en grau. L’encén l’amor en la mateixa mesura que el zel l’empeny. I si algú no té zel, això sol ja demostra que en el cor se li han extingit l’amor i la caritat. Qui té zel desitja i procura, per tots els mitjans possibles, que Déu sigui sempre més i més conegut, estimat i servit en aquesta vida i en l’altra, ja que aquest amor sagrat no té acabament. I fa el mateix amb el proïsme: desitja i procura que en aquesta terra tothom estigui content i hi sigui feliç, i benaurat en la pàtria sobrenatural. El qui té zel procura que tothom se salvi, que ningú no es perdi eternament, que Déu no sigui mai ofès i que ningú no visqui en pecat ni un sol moment. Això és el que veiem en els sants Apòstols i en tots els qui són duts per l’esperit apostòlic. Jo em dic a mi mateix: Un Fill del Cor Immaculat de Maria és un home encès de caritat que cala foc arreu on passa; que desitja eficaçment i procura per tots els mitjans d’encendre tothom amb el foc de l’amor diví. Res no el fa enrere; frueix en les privacions; aborda els treballs; abraça els sacrificis; es complau en les calúmnies i s’alegra en els turments. Només pensa com seguirà i imitarà Jesucrist a treballar, a sofrir i a procurar sempre i únicament la major glòria de Déu i la salvació de les ànimes.<\/p><h4 id=\"p1077\">Responsori<\/h4><p id=\"p1078\" class=\"ref rub\"><span class=\"r\"><i>1Te 2, 8; Ga 4, 19<\/i><\/span><\/p><p id=\"p1079\" class=\"pr\"><span class=\"l\"><span class=\"r\">R.<\/span> El nostre afecte per vosaltres era tan gran, que estàvem decidits a donar-vos, no tan sols l’evangeli de Déu, sinó fins i tot les nostres pròpies vides. * Tant us havíeu fet estimar!<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Fills meus, sento dolors de part com si us tornés a infantar, i no els acabaré fins que Crist no quedi format en vosaltres. * Tant us havíeu fet estimar!<\/span><\/p><p id=\"p1080\" class=\"pr rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p1081\" class=\"pr rub\"><span class=\"l\"><span class=\"r\"><i>Dels escrits de sant Antoni Maria Claret, bisbe i fundador<\/i><\/span><\/span><span class=\"l\"><span class=\"r\"><i>Carta al P. Josep Xifré, 20 d’agost de 1861, dins Cartas selectas, BAC, Madrid 1996, pàgines 351-352<\/i><\/span><\/span><\/p><h4 class=\"rt\" id=\"p1082\">Estimació pels Missioners<\/h4><p id=\"p1083\" class=\"pr\">Veig el que em diu de la manera d’estendre la nostra Congregació, i em sembla bé, i com més a l’interior d’Espanya millor, per ser més gran la necessitat. M’atreveixo a dir que ningú no ho sap millor que jo, per raó de viure a Madrid i pels viatges que porto fets amb SS. MM. Jo, veient la disposició de la gent, la fam de la divina paraula, etc. etc. no em puc contenir, tot el dia estic predicant. Tant de bo pogués córrer predicant per tot Espanya, per tot el món! La temptació més gran que he de sofrir és d’escapar-me de prop dels reis i aguanto perquè em diuen que és la voluntat de Déu que jo estigui al seu costat, i jo per ara també ho crec, i això i únicament això em fa aguantar, esperant que el Senyor em deixarà anar. Mentrestant, digui als meus estimadíssims germans els Missioners que s’animin i que treballin tot el que puguin, que Déu i la Verge Santíssima els ho pagaran. Jo tinc tant d’afecte als sacerdots que es dediquen a les missions, que els donaria la meva sang i la meva vida, jo els rentaria i besaria mil vegades els peus, jo els faria el llit, els guisaria el menjar, i em privaria del meu bocí perquè ells mengessin. Els estimo tant, que d’amor em torno boig per ells, ni sé el que faria per ells: quan considero que ells treballen perquè Déu sigui més conegut i estimat i perquè les ànimes se salvin i no es condemnin, jo no sé el que sento... Ara mateix que escric això he hagut de deixar la ploma per a eixugar-me els ulls... Oh fills del Cor Immaculat de la meva estimadíssima Mare Maria!... Vull escriure-us i no puc perquè tinc els ulls amarats de llàgrimes. Prediqueu i pregueu per mi.<\/p><h4 id=\"p1084\">Responsori breu<\/h4><p id=\"p1085\" class=\"ref rub\"><span class=\"r\"><i>Mt 5, 11; Mc 16, 15; Sl 144, 10. 11<\/i><\/span><\/p><p id=\"p1086\" class=\"pr\"><span class=\"l\"><span class=\"r\">R.<\/span> Vosaltres sou la llum del món, diu el Senyor. * Aneu per tot el món i anuncieu la bona nova de l’evangeli a tota la humanitat.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Que les vostres criatures, Senyor, proclamin la glòria del vostre regne. * Aneu per tot el món i anuncieu la bona nova de l’evangeli a tota la humanitat.<\/span><\/p><p id=\"p1087\" class=\"pr rub\"><span class=\"r\">Es diu l’himne Te Deum. L’oració, com a Laudes.<\/span><\/p>", "chips": [["p1033", "Himne"], ["p1035", "Salmòdia"], ["p1058", "Primera lectura"], ["p1073", "Segona lectura"]]}, {"name": "Laudes", "tab": "Laudes", "html": "<h3 id=\"p1089\">Himne<\/h3><p id=\"p1090\" class=\"v\">A llevant l’alba poncella<\/p><p id=\"p1091\" class=\"v\">i el jorn novell es desclou<\/p><p id=\"p1092\" class=\"v\">l’esperada meravella<\/p><p id=\"p1093\" class=\"v st\">de la llum nada de nou.<\/p><p id=\"p1094\" class=\"v\">Llum d’amor el cor anheli,<\/p><p id=\"p1095\" class=\"v\">perquè pugi en cant roent<\/p><p id=\"p1096\" class=\"v\">la lloança que s’enceli<\/p><p id=\"p1097\" class=\"v st\">vers el Pare omnipotent.<\/p><p id=\"p1098\" class=\"v\">Lloem la fe que encenia,<\/p><p id=\"p1099\" class=\"v\">com una albada naixent,<\/p><p id=\"p1100\" class=\"v\">en l’apòstol de Maria,<\/p><p id=\"p1101\" class=\"v st\">Claret, el cor i la ment.<\/p><p id=\"p1102\" class=\"v\">Lloem l’excelsa esperança<\/p><p id=\"p1103\" class=\"v\">que, emparant-lo en el patir,<\/p><p id=\"p1104\" class=\"v\">convertia en benaurança<\/p><p id=\"p1105\" class=\"v st\">els sofriments del camí.<\/p><p id=\"p1106\" class=\"v\">Lloem el foc que bleïa,<\/p><p id=\"p1107\" class=\"v\">com una fornal d’amor<\/p><p id=\"p1108\" class=\"v\">ablamada nit i dia,<\/p><p id=\"p1109\" class=\"v st\">la caritat del seu cor.<\/p><p id=\"p1110\" class=\"v\">Dem lloança el Déu de vida<\/p><p id=\"p1111\" class=\"v\">que amb Claret ha compartit<\/p><p id=\"p1112\" class=\"v\">l’etern viure sense mida<\/p><p id=\"p1113\" class=\"v st\">de Pare, Fill i Esperit.<\/p><p id=\"p1114\" class=\"v st rub\"><span class=\"r\">O bé:<\/span><\/p><p id=\"p1115\" class=\"v\">Puix la terra que heu llaurada<\/p><p id=\"p1116\" class=\"v st\">sent de vostre zel enyor:<\/p><p id=\"p1117\" class=\"v\"><i>Oh Claret, vostra sembrada<\/i><\/p><p id=\"p1118\" class=\"v st\"><i>feu que arreli en cada cor.<\/i><\/p><p id=\"p1119\" class=\"v\">A Sallent, vila feinera<\/p><p id=\"p1120\" class=\"v\">vostre esguard s’obre a la llum<\/p><p id=\"p1121\" class=\"v\">com viola primicera,<\/p><p id=\"p1122\" class=\"v\">ja d’infant doneu perfum.<\/p><p id=\"p1123\" class=\"v\">Flor tot just esbadellada<\/p><p id=\"p1124\" class=\"v\">que escampeu de Crist l’olor.<\/p><p id=\"p1125\" class=\"v st\"><i>Oh Claret...<\/i><\/p><p id=\"p1126\" class=\"v\">La llavor de l’Evangeli<\/p><p id=\"p1127\" class=\"v\">quan pels pobles la sembreu,<\/p><p id=\"p1128\" class=\"v\">per a què ben fonda arreli,<\/p><p id=\"p1129\" class=\"v\">amb miracles l’adobeu.<\/p><p id=\"p1130\" class=\"v\">La collita és ben granada,<\/p><p id=\"p1131\" class=\"v\">poca palla i molts grans d’or.<\/p><p id=\"p1132\" class=\"v st\"><i>Oh Claret...<\/i><\/p><p id=\"p1133\" class=\"v\">Com la tasca no escasseja<\/p><p id=\"p1134\" class=\"v\">i són pocs els jornalers,<\/p><p id=\"p1135\" class=\"v\">vostre zel prompte es rodeja<\/p><p id=\"p1136\" class=\"v\">d’activíssims missioners<\/p><p id=\"p1137\" class=\"v\">que ompliren de bona anyada<\/p><p id=\"p1138\" class=\"v\">els graners del gran Senyor.<\/p><p id=\"p1139\" class=\"v st\"><i>Oh Claret...<\/i><\/p><p id=\"p1140\" class=\"v\">Sobre el món feu que davalli<\/p><p id=\"p1141\" class=\"v\">rou del cel a bell ruixat,<\/p><p id=\"p1142\" class=\"v\">on el nostre cor treballi<\/p><p id=\"p1143\" class=\"v\">sigui amb zel d’apostolat.<\/p><p id=\"p1144\" class=\"v\">Protegint vós la llaurada<\/p><p id=\"p1145\" class=\"v\">no es perdrà nostra suor.<\/p><p id=\"p1146\" class=\"v\"><i>Oh Claret...<\/i><\/p><h3 id=\"p1147\">Salmòdia<\/h3><p id=\"p1148\" class=\"pr\"><span class=\"r\">Ant.<\/span> La meva ànima s’ha enamorat de vós, Senyor meu. La meva ànima té set de vós i de la salvació dels homes.<\/p><h4 id=\"p1149\">Salm 62, 2-9<\/h4><p id=\"p1150\" class=\"v st\"><span class=\"l\">Vós, Senyor, sou el meu Déu; jo us cerco.<\/span><span class=\"l\">Tot jo tinc set de vós,<\/span><span class=\"l\">per vós es desviu el meu cor,<\/span><span class=\"l\">com terra eixuta, sense una gota d’aigua.<\/span><span class=\"l e\"><\/span><span class=\"l\">Jo us contemplava al vostre santuari<\/span><span class=\"l\">quan us veia gloriós i poderós.<\/span><span class=\"l\">L’amor que em teniu val més que la vida;<\/span><span class=\"l\">per això els meus llavis us lloaran.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que tota la vida us pugui beneir<\/span><span class=\"l\">i alçar les mans lloant el vostre nom.<\/span><span class=\"l\">Saciat del bo i millor,<\/span><span class=\"l\">us lloaré amb el goig als llavis.<\/span><span class=\"l e\"><\/span><span class=\"l\">Quan des del llit us recordo,<\/span><span class=\"l\">passo les nits pensant en vós,<\/span><span class=\"l\">perquè vós m’heu ajudat,<\/span><span class=\"l\">i sóc feliç sota les vostres ales.<\/span><span class=\"l e\"><\/span><span class=\"l\">La meva ànima s’ha enamorat de vós,<\/span><span class=\"l\">em sosté la vostra mà.<\/span><\/p><p id=\"p1151\" class=\"pr\"><span class=\"r\">Ant.<\/span> La meva ànima s’ha enamorat de vós, Senyor meu. La meva ànima té set de vós i de la salvació dels homes.<\/p><h4 id=\"p1152\">Oració sàlmica<\/h4><p id=\"p1153\" class=\"pr\">Senyor, el vostre Fill ha proclamat feliços els qui tenen fam i set de justícia; feu que tinguem anhel de vós i ens saciem de la vostra paraula, perquè els nostres llavis us lloïn amb goig i anunciïn el vostre nom a tots els pobles. Per Crist Senyor nostre. Amén.<\/p><p id=\"p1154\" class=\"pr\"><span class=\"r\">Ant.<\/span> Beneïu el Senyor, sants i humils de cor, canteu-li lloances per sempre.<\/p><h4 id=\"p1155\">Càntic Dn 3, 57-88.56<\/h4><p id=\"p1156\" class=\"v st\"><span class=\"l\">Beneïu el Senyor, totes les criatures,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l\">Beneïu-lo, àngels del Senyor,<\/span><span class=\"l\">beneïu, cels, el Senyor.<\/span><span class=\"l\">Beneïu el Senyor, aigües de l’espai,<\/span><span class=\"l\">beneïu-lo, estols del Senyor.<\/span><span class=\"l\">Beneïu el Senyor, sol i lluna,<\/span><span class=\"l\">beneïu-lo, estrelles del cel.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïu el Senyor, pluges i rosades,<\/span><span class=\"l\">beneïu-lo, tots els vents.<\/span><span class=\"l\">Beneïu el Senyor, foc i calor,<\/span><span class=\"l\">beneïu-lo, freds i gelades.<\/span><span class=\"l\">Beneïu el Senyor, rosades i gebre,<\/span><span class=\"l\">beneïu-lo, glaç i freds.<\/span><span class=\"l\">Beneïu el Senyor, neus i geleres,<\/span><span class=\"l\">beneïu-lo, dies i nits.<\/span><span class=\"l\">Beneïu el Senyor, llum i tenebres,<\/span><span class=\"l\">beneïu-lo, núvols i llamps.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que la terra beneeixi el Senyor,<\/span><span class=\"l\">que li canti lloances per sempre.<\/span><span class=\"l\">Beneïu el Senyor, muntanyes i turons,<\/span><span class=\"l\">vegetació de la terra, beneeix-lo.<\/span><span class=\"l\">Beneïu, fonts, el Senyor, beneïu-lo, rius i mars.<\/span><span class=\"l\">Beneïu el Senyor, peixos i monstres marins,<\/span><span class=\"l\">beneïu-lo, tots els ocells.<\/span><span class=\"l\">Beneïu el Senyor, feres i ramats,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïu el Senyor, tots els homes,<\/span><span class=\"l\">beneeix-lo, poble d’Israel.<\/span><span class=\"l\">Beneïu-lo, sacerdots del Senyor,<\/span><span class=\"l\">beneïu-lo, servents del Senyor.<\/span><span class=\"l\">Beneïu el Senyor, sants i humils de cor,<\/span><span class=\"l\">ànimes i esperits dels justos, beneïu-lo.<\/span><span class=\"l\">Beneïu el Senyor, Hananies, Azaries i Misael,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïm el Pare i el Fill amb l’Esperit Sant,<\/span><span class=\"l\">cantem-li lloances per sempre.<\/span><span class=\"l\">Sou beneït, Senyor, al firmament del cel.<\/span><span class=\"l\">Glòria i lloança per sempre.<\/span><\/p><p id=\"p1157\" class=\"pr\"><span class=\"r\">Ant.<\/span> Beneïu el Senyor, sants i humils de cor, canteu-li lloances per sempre.<\/p><p id=\"p1158\" class=\"pr rub\"><span class=\"r\">A l’acabament d’aquest càntic no es diu Glòria al Pare.<\/span><\/p><h4 id=\"p1159\">Oració sàlmica<\/h4><p id=\"p1160\" class=\"pr\">Senyor i Pare nostre, que us servim i us fem servir, que us lloem i us fem lloar de totes les criatures. Per Crist Senyor nostre. Amén.<\/p><p id=\"p1161\" class=\"pr\"><span class=\"r\">Ant.<\/span> Canteu al Senyor un càntic nou: perquè el Senyor ha estimat el seu servent i ha coronat de triomf els humils.<\/p><h4 id=\"p1162\">Salm 149<\/h4><p id=\"p1163\" class=\"v st\"><span class=\"l\">Canteu al Senyor un càntic nou,<\/span><span class=\"l\">canteu les seves lloances davant dels qui l’estimen.<\/span><span class=\"l\">Se sent feliç Israel del qui l’ha creat,<\/span><span class=\"l\">s’alegren del seu rei els fills de Sió.<\/span><span class=\"l e\"><\/span><span class=\"l\">Lloen el seu nom, el lloen tot dansant,<\/span><span class=\"l\">acompanyen els seus cants amb els tambors i les<\/span><span class=\"l\">cítares.<\/span><span class=\"l\">Perquè el Senyor estima el seu poble,<\/span><span class=\"l\">coronarà de triomf els humils.<\/span><span class=\"l e\"><\/span><span class=\"l\">Els fidels celebren la seva glòria,<\/span><span class=\"l\">des dels seus rengles aclamen plens de goig;<\/span><span class=\"l\">mentre els seus llavis glorifiquen Déu,<\/span><span class=\"l\">tenen a les mans espases de dos talls,<\/span><span class=\"l e\"><\/span><span class=\"l\">per fer justícia entre els pobles,<\/span><span class=\"l\">per reprendre i castigar les nacions,<\/span><span class=\"l\">encadenant els seus reis,<\/span><span class=\"l\">emmanillant els poderosos.<\/span><span class=\"l e\"><\/span><span class=\"l\">Executar la sentència que està escrita<\/span><span class=\"l\">és la glòria reservada als qui l’estimen.<\/span><\/p><p id=\"p1164\" class=\"pr\"><span class=\"r\">Ant.<\/span> Canteu al Senyor un càntic nou: perquè el Senyor ha estimat el seu servent i ha coronat de triomf els humils.<\/p><h4 id=\"p1165\">Oració sàlmica<\/h4><p id=\"p1166\" class=\"pr\">Senyor Déu nostre, que heu coronat de triomf sant Antoni Maria Claret, feu fecunds els treballs dels qui, seguint els seus ensenyaments, exerceixen el ministeri de la salvació, perquè els pecadors es converteixin a la vostra Paraula, els indecisos es refermin, els justos us estimin cada vegada més i ressoni la vostra lloança en l’assemblea dels fidels. Per Crist Senyor nostre. Amén.<\/p><h3 id=\"p1167\">Lectura breu<\/h3><p id=\"p1168\" class=\"ref rub\"><span class=\"r\"><i>2Co 6, 1. 3-4a<\/i><\/span><\/p><p id=\"p1169\" class=\"pr\">Com a col·laboradors de Déu, us exhortem a no deixar perdre la gràcia que n’heu rebut. No hem de donar mai cap motiu d’escàndol a ningú, perquè no es malparli del servei que Déu ens ha confiat. Ben al contrari, ens hem de manifestar en tot com a servidors de Déu.<\/p><h3 id=\"p1170\">Responsori breu<\/h3><p id=\"p1171\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> He esdevingut servidor de l’Evangeli per un do de Déu.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> He esdevingut servidor de l’Evangeli per un do de Déu.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> I m’ha posat al cap de la seva família.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Per un do de Déu.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Glòria al Pare i al Fill i a l’Esperit Sant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> He esdevingut servidor de l’Evangeli per un do de Déu.<\/span><\/p><h3 id=\"p1172\">Càntic de Zacaries<\/h3><p id=\"p1173\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor suscità en l’Església el seu servent Antoni Maria Claret perquè es consagrés a Crist i n’imités la vida en l’anunci de l’Evangeli.<\/p><p id=\"p1174\" class=\"v st\"><span class=\"l\">Beneït sigui el Senyor, Déu d’Israel,<\/span><span class=\"l\">ha visitat el seu poble i l’ha redimit.<\/span><span class=\"l\">Fa que s’aixequi un salvador poderós<\/span><span class=\"l\">a la casa de David el seu servent,<\/span><span class=\"l\">com ho havia anunciat de temps antic,<\/span><span class=\"l\">per boca dels seus sants profetes.<\/span><span class=\"l e\"><\/span><span class=\"l\">Així ens salva, alliberant-nos dels enemics,<\/span><span class=\"l\">de les mans dels qui ens volen mal,<\/span><span class=\"l\">mogut per l’amor que el fa fidel als nostres pares,<\/span><span class=\"l\">i pel record de l’Aliança santa,<\/span><span class=\"l\">que jurà al nostre pare Abraham,<\/span><span class=\"l e\"><\/span><span class=\"l\">prometent de concedir-nos que, sense por,<\/span><span class=\"l\">lliures dels enemics, li donem culte<\/span><span class=\"l\">amb santedat i justícia tota la vida.<\/span><span class=\"l e\"><\/span><span class=\"l\">I a tu, infant, et diran profeta de l’Altíssim,<\/span><span class=\"l\">perquè aniràs al davant del Senyor<\/span><span class=\"l\">a preparar els seus camins.<\/span><span class=\"l e\"><\/span><span class=\"l\">Faràs saber al poble que li ve la salvació,<\/span><span class=\"l\">el perdó dels seus pecats,<\/span><span class=\"l\">per l’amor entranyable del nostre Déu.<\/span><span class=\"l e\"><\/span><span class=\"l\">Perquè ens estima, ens visitarà un Sol<\/span><span class=\"l\">que ve del cel,<\/span><span class=\"l\">per il·luminar els qui viuen a la fosca,<\/span><span class=\"l\">a les ombres de la mort,<\/span><span class=\"l\">i guiar els nostres passos per camins de pau.<\/span><\/p><p id=\"p1175\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor suscità en l’Església el seu servent Antoni Maria Claret perquè es consagrés a Crist i n’imités la vida en l’anunci de l’Evangeli.<\/p><h3 id=\"p1176\">Pregàries<\/h3><p id=\"p1177\" class=\"pr\">Supliquem Crist, enviat pel Pare, nascut de la Verge Santa Maria i ungit per l’Esperit Sant perquè fos Mestre i Salvador dels homes, i aclamem-lo dient:<\/p><p id=\"p1178\" class=\"c\"><i>Envieu, Senyor, el vostre Esperit.<\/i><\/p><p id=\"p1179\" class=\"pr\">Senyor Jesús, que ens convideu a estar amb vós i ens envieu a predicar,<\/p><p id=\"p1180\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu que cresquem cada dia en la vostra amistat i en l’amor a tots els homes.<\/p><p id=\"p1181\" class=\"pr\">Senyor Jesús, que ens convoqueu a viure com a comunitat de germans a fi que el món cregui pel testimoni de la nostra unitat,<\/p><p id=\"p1182\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu que ens mantinguem tots unànimes en la pregària i en la comunitat de vida amb Maria, la vostra Mare.<\/p><p id=\"p1183\" class=\"pr\">Senyor Jesús, vós que voleu que siguem sal de la terra i llum del món,<\/p><p id=\"p1184\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>il·lumineu la nostra vida amb la llum de la vostra paraula.<\/p><p id=\"p1185\" class=\"pr\">Senyor Jesús, que heu vingut a calar foc a la terra i teniu com a única aspiració que tot el món cremi en aquest foc,<\/p><p id=\"p1186\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>inflameu-nos de tal forma amb el vostre amor que cremant d’amor nosaltres mateixos, calem aquest foc arreu on passem.<\/p><p id=\"p1187\" class=\"pr\">Senyor Jesús, que vau passar pel món fent el bé, especialment als pobres i als malalts,<\/p><p id=\"p1188\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu-nos sol·lícits dels nostres germans a imitació de sant Antoni Maria Claret.<\/p><p id=\"p1189\" class=\"pr rub\"><span class=\"r\">Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.<\/span><\/p><p id=\"p1190\" class=\"pr\">Pare nostre.<\/p><h3 id=\"p1191\">Oració<\/h3><p id=\"p1192\" class=\"pr\">Senyor Déu nostre, vós vau escollir sant Antoni Maria Claret perquè fundés la nostra família i el vau inflamar d’un amor tan ardent que el feia viure alegre enmig de les privacions, calúmnies i turments: concediu-nos que, seguint els seus ensenyaments i exemples, frisem per la salvació de tots els homes i proclamem pertot la vostra glòria. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p1089", "Himne"], ["p1147", "Salmòdia"], ["p1167", "Lectura breu"], ["p1170", "Responsori breu"], ["p1172", "Càntic de Zacaries"], ["p1176", "Pregàries"], ["p1191", "Oració"]]}, {"name": "Hora d’entre dia", "tab": "Hora d’entre dia", "html": "<p id=\"p1194\" class=\"pr rub\"><span class=\"r\">Si cau en diumenge, es reciten els salms del diumenge I; en els altres casos, es diuen els salms graduals de la salmòdia complementària.<\/span><\/p><h3 id=\"p1195\">Tèrcia<\/h3><h4 id=\"p1196\">Himne<\/h4><p id=\"p1197\" class=\"v st\"><span class=\"l\">Humil missatger pels camps del món,<\/span><span class=\"l\">travesseu els mars amples com una torxa de glòria,<\/span><span class=\"l\">predicant als pobres l’amor de Déu Pare,<\/span><span class=\"l\">fent prodigis, donant llum a les ànimes.<\/span><span class=\"l e\"><\/span><span class=\"l\">Forjador d’una nova societat sense fronteres,<\/span><span class=\"l\">redimiu els pobres amb la vostra pobresa humil,<\/span><span class=\"l\">ensenyeu als reis la pobresa d’esperit<\/span><span class=\"l\">i a tothom enriqueix la vostra paraula inextingible.<\/span><span class=\"l e\"><\/span><span class=\"l\">Viviu vida amagada amb Crist en la pregària,<\/span><span class=\"l\">el vostre cos és un sagrari on el Senyor fa estada,<\/span><span class=\"l\">i el Cor ardent de la Verge il·lumina<\/span><span class=\"l\">els vostres passos en el goig de la vostra pietat envers la Mare.<\/span><span class=\"l e\"><\/span><span class=\"l\">Sense pietat us difamen, calumnien i persegueixen<\/span><span class=\"l\">els qui no reconeixen la veritat que proclameu,<\/span><span class=\"l\">i un dia, a la fi, lliureu al Senyor de la glòria<\/span><span class=\"l\">la collita madura, el fruit de la vostra vida incansable.<\/span><span class=\"l e\"><\/span><span class=\"l\">Avui els fills nascuts de la vostra entranya fecunda<\/span><span class=\"l\">prolonguem el foc de la vostra paraula immensa;<\/span><span class=\"l\">per això beneïm el Pare i l’Esperit<\/span><span class=\"l\">i donem glòria a Crist per segles infinits. Amén.<\/span><\/p><p id=\"p1198\" class=\"pr\"><span class=\"r\">Ant.<\/span> Aquest és el gran sacerdot que en la seva vida agradà a Déu.<\/p><h4 id=\"p1199\">Lectura breu<\/h4><p id=\"p1200\" class=\"ref rub\"><span class=\"r\"><i>Sir 50, 1. 4. 11b<\/i><\/span><\/p><p id=\"p1201\" class=\"pr\">Heus ací el gran sacerdot que durant la seva vida va reparar la casa i manà de consolidar el santuari. Es preocupà d'evitar la ruïna del seu poble. Quan pujava a l’altar sant, omplia de glòria el recinte del santuari.<\/p><p id=\"p1202\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> El Senyor l’escollí per ser el seu sacerdot.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Per oferir-li un sacrifici de lloança.<\/span><\/p><p id=\"p1203\" class=\"pr rub\"><span class=\"r\">L’oració, com a Laudes.<\/span><\/p><h3 id=\"p1204\">Sexta<\/h3><p id=\"p1205\" class=\"pr rub\"><span class=\"r\">L’himne, com a Tèrcia.<\/span><\/p><p id=\"p1206\" class=\"pr\"><span class=\"r\">Ant.<\/span> Els nostres ulls estan fixos en el Senyor, confiant i esperant en la seva misericòrdia.<\/p><h4 id=\"p1207\">Lectura breu<\/h4><p id=\"p1208\" class=\"ref rub\"><span class=\"r\"><i>Ga 2, 19-20<\/i><\/span><\/p><p id=\"p1209\" class=\"pr\">En virtut de la Llei, vaig morir a la Llei a fi de viure per a Déu. Estic crucificat amb Crist. Ja no sóc jo qui visc; és Crist qui viu en mi. La meva vida terrenal, la visc gràcies a la fe en el Fill de Déu, que em va estimar i es va entregar ell mateix per mi.<\/p><p id=\"p1210\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Crist serà glorificat en mi.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> La meva vida és Crist.<\/span><\/p><p id=\"p1211\" class=\"pr rub\"><span class=\"r\">L’oració, com a Laudes.<\/span><\/p><h3 id=\"p1212\">Nona<\/h3><p id=\"p1213\" class=\"pr rub\"><span class=\"r\">L’himne, com a Tèrcia.<\/span><\/p><p id=\"p1214\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor ha fet meravelles amb els qui el veneren, donarà l’herència als seus amics.<\/p><h4 id=\"p1215\">Lectura breu<\/h4><p id=\"p1216\" class=\"ref rub\"><span class=\"r\"><i>Pr 2, 1-5<\/i><\/span><\/p><p id=\"p1217\" class=\"pr\">Fill meu, fes cas del que et dic, fica't al cap els meus preceptes: para l'orella a la saviesa, obre el cor al seny; fes venir la intel·ligència, crida la sensatesa; desitja-les com el diner, recerca-les com un tresor. Llavors sabràs venerar el Senyor, arribaràs a conèixer el que Déu vol.<\/p><p id=\"p1218\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Feu veure al vostre servent la claror de la vostra mirada.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> I ensenyeu-me les vostres lleis.<\/span><\/p><p id=\"p1219\" class=\"pr rub\"><span class=\"r\">L’oració, com a Laudes.<\/span><\/p>", "chips": [["p1195", "Tèrcia"], ["p1204", "Sexta"], ["p1212", "Nona"]]}, {"name": "II Vespres", "tab": "II Vespres", "html": "<h3 id=\"p1221\">Himne<\/h3><p id=\"p1222\" class=\"v st rub\"><span class=\"r\">Com a laudes o bé:<\/span><\/p><p id=\"p1223\" class=\"v st\"><span class=\"l\">Avui que l’Església canta la vostra memòria gloriosa,<\/span><span class=\"l\">els vostres fills pel món, reunits en nom vostre,<\/span><span class=\"l\">cantem joiosos la grandesa inefable<\/span><span class=\"l\">de la vostra vida fecunda, de la vostra mort joiosa.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ja en la infància llunyana, els vostres ulls meravellats<\/span><span class=\"l\">descriuen el sentit profund d’allò que és etern.<\/span><span class=\"l\">A les vostres mans descobriu la fatiga artesana:<\/span><span class=\"l\">teixint en somnis, neix el vostre neguit missioner.<\/span><span class=\"l e\"><\/span><span class=\"l\">La Paraula divina resplendeix en els vostres camins.<\/span><span class=\"l\">Què en treu l’home de guanyar el món sencer<\/span><span class=\"l\">si a la fi perd l’ànima? En vós comença una foguera<\/span><span class=\"l\">d’amor inextingible que les aigües no apaguen.<\/span><span class=\"l e\"><\/span><span class=\"l\">Déu us nomenà profeta de pobles i nacions,<\/span><span class=\"l\">riu d’amor i font de gràcia salvadora.<\/span><span class=\"l\">L’Esperit Sant damunt vostre, força viva,<\/span><span class=\"l\">us feu llum dels pobres, evangeli vivent.<\/span><span class=\"l e\"><\/span><span class=\"l\">Urgit per un foc de caritat divina,<\/span><span class=\"l\">immers en el silenci de la Paraula eterna,<\/span><span class=\"l\">llanceu la vostra veu al vent, i és Crist qui escampa,<\/span><span class=\"l\">per mitjà de la vostra llengua, la flama del seu Esperit.<\/span><\/p><h3 id=\"p1224\">Salmòdia<\/h3><p id=\"p1225\" class=\"pr\"><span class=\"r\">Ant.<\/span> El qui obra honradament i practica la justícia, aquest, Senyor, podrà viure a la vostra muntanya sagrada.<\/p><h4 id=\"p1226\">Salm 14<\/h4><p id=\"p1227\" class=\"v st\"><span class=\"l\">Senyor, qui podrà estar-se a casa vostra?<\/span><span class=\"l\">Qui podrà viure a la muntanya sagrada?<\/span><span class=\"l e\"><\/span><span class=\"l\">El qui obra honradament<\/span><span class=\"l\">i practica la justícia,<\/span><span class=\"l\">diu la veritat tal com la pensa,<\/span><span class=\"l\">quan parla no escampa calúmnies,<\/span><span class=\"l e\"><\/span><span class=\"l\">mai no fa mal al proïsme,<\/span><span class=\"l\">ni carrega a ningú res infamant,<\/span><span class=\"l\">compten poc als seus ulls els descreguts,<\/span><span class=\"l\">honra i aprecia els fidels del Senyor;<\/span><span class=\"l e\"><\/span><span class=\"l\">no es desdiu de promeses oneroses,<\/span><span class=\"l\">no fia els seus diners a interès,<\/span><span class=\"l\">ni es ven per condemnar cap innocent.<\/span><span class=\"l\">El qui obra així mai no caurà.<\/span><\/p><p id=\"p1228\" class=\"pr\"><span class=\"r\">Ant.<\/span> El qui obra honradament i practica la justícia, aquest, Senyor, podrà viure a la vostra muntanya sagrada.<\/p><p id=\"p1229\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p1230\">Oració sàlmica<\/h4><p id=\"p1231\" class=\"pr\">Pare sant, feu que procedim honradament i practiquem la justícia, i que siguem cada dia més humils, més fervorosos i més zelosos de la salvació dels homes, per tal que puguem hostatjar-nos a la vostra tenda i viure amb vós a la muntanya sagrada. Per Crist Senyor nostre.<\/p><p id=\"p1232\" class=\"pr\"><span class=\"r\">Ant.<\/span> Sortós l’home que disposa a consciència els seus afers: serà beneït el seu llinatge.<\/p><h4 id=\"p1233\">Salm 111<\/h4><p id=\"p1234\" class=\"v st\"><span class=\"l\">Feliç l’home que venera el Senyor<\/span><span class=\"l\">i estima de cor els seus preceptes.<\/span><span class=\"l\">La seva descendència serà gran al país,<\/span><span class=\"l\">serà beneït el llinatge dels justos.<\/span><span class=\"l e\"><\/span><span class=\"l\">A casa seva hi ha riquesa i abundància,<\/span><span class=\"l\">la seva bondat consta per sempre.<\/span><span class=\"l\">L’home just, compassiu i benigne,<\/span><span class=\"l\">és llum que apunta en la fosca.<\/span><span class=\"l e\"><\/span><span class=\"l\">Sortós l’home que presta de bon grat,<\/span><span class=\"l\">que disposa a consciència els seus afers.<\/span><span class=\"l\">El just no caurà mai,<\/span><span class=\"l\">i deixarà un record inesborrable.<\/span><span class=\"l e\"><\/span><span class=\"l\">Viu sense por de les males noves,<\/span><span class=\"l\">se sent ferm confiant en el Senyor,<\/span><span class=\"l\">té el cor incommovible, res no tem,<\/span><span class=\"l\">i a la fi veurà vençuts els enemics,<\/span><span class=\"l e\"><\/span><span class=\"l\">Reparteix el que té, ho dóna als pobres,<\/span><span class=\"l\">la seva bondat consta per sempre,<\/span><span class=\"l\">pot alçar el front amb dignitat.<\/span><span class=\"l e\"><\/span><span class=\"l\">L’injust, quan ho veu, es consumeix,<\/span><span class=\"l\">i estreny les dents d’indignació.<\/span><span class=\"l\">S’esvaeixen les ambicions de l’injust.<\/span><\/p><p id=\"p1235\" class=\"pr\"><span class=\"r\">Ant.<\/span> Sortós l’home que disposa a consciència els seus afers: serà beneït el seu llinatge.<\/p><p id=\"p1236\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p1237\">Oració sàlmica<\/h4><p id=\"p1238\" class=\"pr\">Senyor, manteniu el nostre cor ferm, segur i sense por, i feu que, urgits per la caritat, sapiguem fruir en les privacions, abordar els treballs, abraçar els sacrificis i gloriar-nos en la Creu de Jesucrist. Ell, que viu i regna pels segles dels segles.<\/p><p id=\"p1239\" class=\"pr\"><span class=\"r\">Ant.<\/span> Ara que heu revelat la vostra justícia, totes les nacions vindran a adorar-vos.<\/p><h4 id=\"p1240\">Càntic Ap 15, 3-4<\/h4><p id=\"p1241\" class=\"v st\"><span class=\"l\">Senyor, Déu de l’univers,<\/span><span class=\"l\">les vostres obres són grans i admirables!<\/span><span class=\"l\">Senyor, rei de tots els pobles,<\/span><span class=\"l\">les vostres decisions són justes,<\/span><span class=\"l\">no van mai errades.<\/span><span class=\"l e\"><\/span><span class=\"l\">Qui no us respectarà!<\/span><span class=\"l\">Qui no glorificarà el vostre nom!<\/span><span class=\"l\">Perquè vós sou l’únic sant,<\/span><span class=\"l\">i ara que heu revelat la vostra justícia,<\/span><span class=\"l\">totes les nacions vindran a adorar-vos.<\/span><\/p><p id=\"p1242\" class=\"pr\"><span class=\"r\">Ant.<\/span> Ara que heu revelat la vostra justícia, totes les nacions vindran a adorar-vos.<\/p><p id=\"p1243\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p1244\">Oració sàlmica<\/h4><p id=\"p1245\" class=\"pr\">Senyor Déu Omnipotent, els vostres camins són justos i veritables, feu que procurem sempre i únicament la major glòria vostra i abrusem tot el món en el foc de l’amor diví. Per Crist Senyor nostre.<\/p><h3 id=\"p1246\">Lectura breu<\/h3><p id=\"p
