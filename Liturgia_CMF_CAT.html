<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6E1A26">
<title>Litúrgia CMF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --garnet:#6E1A26; --garnet-2:#4E111A; --gold:#B38B3D; --gold-soft:#E9DBB8;
  --bg:#FBF8F3; --surface:#FFFFFF; --line:#E7DDD0; --ink:#2A1F1C; --muted:#75655C;
  --rub:#8B252B; --chip:#F3EBDF; --flash:#F6E7B8;
  --fs:19px; --serif:'Literata',Georgia,'Times New Roman',serif;
  --display:'Cormorant Garamond','Cormorant',Garamond,Georgia,serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16100F; --surface:#211816; --line:#3A2C28; --ink:#EEE4D7; --muted:#A8978B;
    --rub:#E3928A; --chip:#2C201D; --gold:#D3AF63; --gold-soft:#4A3B22; --flash:#5A4720; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16100F; --surface:#211816; --line:#3A2C28; --ink:#EEE4D7; --muted:#A8978B;
  --rub:#E3928A; --chip:#2C201D; --gold:#D3AF63; --gold-soft:#4A3B22; --flash:#5A4720; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--garnet)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--garnet);color:#F7EEDC;display:flex;align-items:center;gap:.25rem;padding:.35rem .5rem;font-size:16px}
.bar h1{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.ib:hover{background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

main{max-width:44rem;margin:0 auto;padding:0 1.1rem 5rem}

/* home */
.hero{margin:1.6rem 0 1.4rem;padding:1.4rem 1.3rem 1.3rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold)}
.hero .when{font-size:.8rem;color:var(--muted);margin:0}
.hero h2{font-family:var(--display);font-weight:600;font-size:2rem;line-height:1.1;margin:.3rem 0 .4rem;color:var(--garnet)}
:root[data-theme="dark"] .hero h2{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h2{color:var(--gold)}}
.hero .rank{font-style:italic;color:var(--rub);font-size:.9rem}
.hero .go{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .95rem;border-radius:999px;background:var(--garnet);color:#F7EEDC;font-size:.85rem}
.btn.ghost{background:var(--chip);color:var(--ink)}
.sect{font-family:var(--display);font-size:1.3rem;font-weight:600;margin:2rem 0 .4rem;color:var(--muted)}
.cal{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cal li{border-bottom:1px solid var(--line)}
.cal button,.cal .row{display:grid;grid-template-columns:3.4rem 1fr auto;gap:.9rem;align-items:center;width:100%;text-align:left;padding:.8rem .2rem}
.cal button:hover{background:var(--chip)}
.day{text-align:center;line-height:1}
.day b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:600;color:var(--garnet)}
:root[data-theme="dark"] .day b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .day b{color:var(--gold)}}
.day span{font-size:.7rem;color:var(--muted)}
.cal .t{font-size:.95rem;line-height:1.35}
.cal .t small{display:block;color:var(--rub);font-style:italic;font-size:.78rem;margin-top:.15rem}
.cal .row{opacity:.6}
.tag{font-size:.7rem;padding:.1rem .5rem;border-radius:999px;background:var(--gold-soft);color:var(--ink);white-space:nowrap}
.more{display:grid;gap:.5rem}
.more button{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:.95rem}
.more button span{color:var(--muted);font-size:.8rem;white-space:nowrap;margin-left:.8rem}

/* celebration */
.chead{padding:1.4rem 0 .6rem;text-align:center}
.chead .lab{font-size:.82rem;color:var(--muted)}
.chead h2{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;margin:.25rem 0;color:var(--garnet)}
:root[data-theme="dark"] .chead h2{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chead h2{color:var(--gold)}}
.chead .rank{font-style:italic;color:var(--rub);font-size:.95rem}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -1.1rem;padding:0 .6rem}
.tabs .scr,.chips{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
.tabs .scr::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:none;padding:.7rem .75rem .6rem;font-family:var(--display);font-size:1.12rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.chips{padding:.5rem 0 .55rem;gap:.35rem}
.chip{flex:none;font-size:.78rem;padding:.25rem .7rem;border-radius:999px;background:var(--chip);white-space:nowrap}
.chip:hover{background:var(--gold-soft)}

.txt{padding-top:.4rem}
.txt h3{font-family:var(--display);font-weight:600;font-size:1.5em;color:var(--rub);margin:1.8em 0 .5em;text-align:center;line-height:1.2}
.txt h3::after{content:"";display:block;width:2.2rem;height:2px;background:var(--gold);margin:.35rem auto 0;opacity:.8}
.txt h4{font-family:var(--display);font-weight:600;font-size:1.2em;margin:1.4em 0 .3em;text-align:center;color:var(--ink)}
.txt h4.rt{font-style:italic;font-weight:500;color:var(--muted)}
.txt p{margin:.55em 0}
.txt p.v{margin:0}
.txt p.pr{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
:root.nojust .txt p.pr{text-align:left}
.txt p.c{text-align:center}
.txt p.ref{text-align:right;font-size:.85em;margin:.2em 0}
.txt p.src{font-size:.88em;color:var(--muted);font-style:italic;margin:.4em 0}
.txt p.obe{text-align:center;font-style:italic;margin:1.1em 0 .6em}
.txt .gap{height:.8em}
.txt .l{display:block}
.txt [id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 150px)}
.txt .l.e{height:.8em}
.txt p.v,.txt p.v .l{padding-left:1.3em;text-indent:-1.3em}
.txt p.v .l{padding-left:0}
.txt p.v.st{margin-bottom:.95em}
.r{color:var(--rub)}
.tab{}
.txt .tab, .txt span.tab{display:inline-block;width:1.6em}
.flash{animation:fl 2.4s ease-out}
@keyframes fl{0%,40%{background:var(--flash)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;background:var(--flash)}}
/* missal */
.missa .nota{color:var(--rub);font-style:italic;font-size:.9em;margin:.9em 0 .4em}
.missa h3.rub{font-family:var(--display);font-variant:small-caps;font-weight:600;letter-spacing:.04em;color:var(--rub);font-size:1.25em;margin:1.6em 0 .3em;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;text-align:left}
.missa h3.rub::after{display:none}
.missa h3.rub .ref{font-family:var(--serif);font-variant:normal;font-style:italic;font-weight:400;font-size:.68em;color:var(--muted);white-space:nowrap}
.missa .lema{color:var(--rub);font-style:italic;text-align:center;font-size:.95em;margin:.2em 0 .6em}
.missa .pl{margin:.4em 0 .9em}
.missa .pl .l{padding-left:1.3em;text-indent:-1.3em}
.missa p.pr{margin:.4em 0 .9em;text-align:left}
.missa .vr{color:var(--rub);font-weight:600;font-style:normal}
.missa .obien{color:var(--rub);font-style:italic;margin:1.1em 0 .3em;display:flex;justify-content:space-between;gap:1rem}
.missa .obien .ref{font-size:.85em;color:var(--muted)}
.missa .fin{margin:.3em 0 1em;font-weight:600}
.mtit{text-align:center;font-style:italic;color:var(--muted);font-size:.9em;margin:1rem 0 0}
.tab.sep{margin-left:.5rem;border-left:1px solid var(--line);padding-left:1rem}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;border:1px solid rgba(0,0,0,.18);margin-right:.35rem;vertical-align:.05em}
.d-rojo{background:#A12433}.d-blanco{background:#F2EAD7}.d-morado{background:#6B4A86}.d-verde{background:#4A7A52}
.cal .t .has{display:block;color:var(--muted);font-size:.72rem;font-style:normal;margin-top:.1rem}
.pager{display:flex;justify-content:space-between;gap:.6rem;margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line)}
.pager button{font-size:.85rem;color:var(--muted);padding:.4rem 0}
.pager button b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--ink)}

/* drawer & sheets */
.scrim{position:fixed;inset:0;background:rgba(20,10,8,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(20rem,86vw);z-index:50;background:var(--surface);transform:translateX(-102%);transition:transform .22s;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 1rem) 0 calc(env(safe-area-inset-bottom,0px) + 1rem);font-size:16px}
.drawer.on{transform:none}
.drawer .dh{padding:.4rem 1.2rem 1rem;border-bottom:1px solid var(--line)}
.drawer .dh b{font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--garnet);display:block;line-height:1.1}
:root[data-theme="dark"] .drawer .dh b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .drawer .dh b{color:var(--gold)}}
.drawer .dh span{font-size:.78rem;color:var(--muted)}
.drawer nav button{display:block;width:100%;text-align:left;padding:.6rem 1.2rem;font-size:.95rem;line-height:1.3}
.drawer nav button small{display:block;color:var(--muted);font-size:.75rem}
.drawer nav button:hover,.drawer nav button.cur{background:var(--chip)}
.drawer .grp{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--muted);padding:1rem 1.2rem .2rem}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:16px 16px 0 0;padding:1.1rem 1.3rem calc(env(safe-area-inset-bottom,0px) + 1.3rem);transform:translateY(105%);transition:transform .22s;font-size:16px;max-width:36rem;margin:0 auto}
.sheet.on{transform:none}
.sheet h3{font-family:var(--display);font-size:1.4rem;margin:0 0 .8rem}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 0;border-top:1px solid var(--line)}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:.35rem .8rem;border-radius:999px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--garnet);color:#F7EEDC}
.search{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.search.on{display:flex}
.search .sb{display:flex;gap:.4rem;align-items:center;padding:.5rem .6rem;background:var(--garnet);color:#F7EEDC}
.search input{flex:1;font:inherit;font-size:17px;padding:.55rem .8rem;border-radius:999px;border:0;background:#FFF8EE;color:#2A1F1C}
.search .res{overflow:auto;flex:1;padding:.4rem 1rem 2rem;max-width:44rem;width:100%;margin:0 auto}
.search .count{font-size:.8rem;color:var(--muted);padding:.6rem 0}
.hit{display:block;width:100%;text-align:left;padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.92rem;line-height:1.45}
.hit small{display:block;color:var(--rub);font-size:.75rem;margin-bottom:.15rem}
.hit mark{background:var(--gold-soft);color:inherit;border-radius:2px}
.empty{color:var(--muted);font-size:.9rem;padding:1.4rem 0;text-align:center}
.foot{margin-top:3rem;font-size:.75rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="bMenu" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <h1 id="bTitle">Litúrgia CMF</h1>
  <button class="ib" id="bSearch" aria-label="Cerca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  <button class="ib" id="bSet" aria-label="Ajustos de lectura"><svg viewBox="0 0 24 24"><path d="M4 18L9 6l5 12M5.8 14h6.4"/><path d="M15 18l3-7 3 7M15.9 16h4.2"/></svg></button>
</header>
<main id="main"></main>

<div class="scrim" id="scrim"></div>

<script id="data" type="application/json">{"cels": [{"label": "1 de febrer", "hours": [{"name": "Invitatori", "tab": "Invitatori", "html": "<p id=\"p42\" class=\"pr\"><span class=\"r\">Ant.<\/span> Veniu, adorem al Senyor, Rei dels màrtirs.<\/p><p id=\"p43\" class=\"pr rub\"><span class=\"r\">El salm invitatori, com a l’Ordinari.<\/span><\/p>", "chips": []}, {"name": "Ofici de lectura", "tab": "Ofici de lectura", "html": "<h3 id=\"p45\">Himne<\/h3><div class=\"gap\"><\/div><p id=\"p47\" class=\"v st\"><span class=\"l\">Oh màrtirs del Crist! sou foc i embranzida;<\/span><span class=\"l\">no hi ha amor més gran que donar la vida.<\/span><\/p><p id=\"p48\" class=\"v st\"><span class=\"l\">Lloem Crist Senyor que us féu triomfar;<\/span><span class=\"l\">fins per qui us occí vau saber pregar.<\/span><\/p><p id=\"p49\" class=\"v st\"><span class=\"l\">Lloem Crist Senyor que venç amb la creu;<\/span><span class=\"l\">els qui heu mort per Ell, d’Ell amb goig viureu.<\/span><\/p><p id=\"p50\" class=\"v st rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p51\" class=\"v\">Màrtirs de l’Església màrtir,<\/p><div class=\"gap\"><\/div><p id=\"p53\" class=\"v\">Màrtirs que amb coratge moríreu estimant-la.<\/p><p id=\"p54\" class=\"v\">La sang vostra és viva entre nosaltres<\/p><p id=\"p55\" class=\"v st\">i és sang de perdó i d’esperança.<\/p><p id=\"p56\" class=\"v\">Joventut claretiana i enardida,<\/p><p id=\"p57\" class=\"v\">de la vostra passió fem la memòria;<\/p><p id=\"p58\" class=\"v\">sou l'heretat de la nostra família<\/p><p id=\"p59\" class=\"v st\">que en vosaltres frueix ja de la glòria.<\/p><p id=\"p60\" class=\"v\">No teméreu la mort que us esperava<\/p><p id=\"p61\" class=\"v\">i cantant caminàveu al suplici;<\/p><p id=\"p62\" class=\"v\">afrontàreu les bales del camí<\/p><p id=\"p63\" class=\"v st\">que us portava, innocents al sacrifici.<\/p><p id=\"p64\" class=\"v\">Del botxí i de la mort més ominosa<\/p><p id=\"p65\" class=\"v\">vàreu fer-ne d'amor la vostra causa;<\/p><p id=\"p66\" class=\"v\">us calia morir perquè en l'Església<\/p><p id=\"p67\" class=\"v st\">vessar la sang és una eterna Pasqua.<\/p><p id=\"p68\" class=\"v\">Maternal Cor de la Verge Maria,<\/p><p id=\"p69\" class=\"v\">Vós vetllareu dels vostres fills la mort;<\/p><p id=\"p70\" class=\"v\">com Vós al cel, després d'un curt viatge<\/p><p id=\"p71\" class=\"v st\">entraren en la glòria del Senyor.<\/p><p id=\"p72\" class=\"v\">Animosos els màrtirs ens emmenen<\/p><p id=\"p73\" class=\"v\">de Jesucrist al Regne de la pau<\/p><p id=\"p74\" class=\"v\">i ens diuen que és possible de morir<\/p><p id=\"p75\" class=\"v\">per «una bandera i un ideal».<\/p><div class=\"gap\"><\/div><p id=\"p77\" class=\"v st rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p78\" class=\"v st\"><span class=\"l\">Testimonis de la fe i de l’Evangeli,<\/span><span class=\"l\">màrtirs claretians,<\/span><span class=\"l\">glòria de la Congregació i de l’Església,<\/span><span class=\"l\">anunci del Senyor ressuscitat,<\/span><span class=\"l\">profetes de l’amor i de l’esperança,<\/span><span class=\"l\">màrtirs claretians.<\/span><\/p><p id=\"p79\" class=\"v st\"><span class=\"l\">Amics del Senyor fins a la mort,<\/span><span class=\"l\">viviu amb una alegria sense posta.<\/span><span class=\"l\">La sang martirial de la vostra ofrena<\/span><span class=\"l\">resplendeix coronant l’holocaust.<\/span><\/p><p id=\"p80\" class=\"v st\"><span class=\"l\">Fou blat el vostre cos, ara és pa,<\/span><span class=\"l\">cuit al caliu del lliurament.<\/span><span class=\"l\">La sang vessada corre viva<\/span><span class=\"l\">per la Congregació i per l’Església.<\/span><\/p><p id=\"p81\" class=\"v st\"><span class=\"l\">Sou profecia d’amor i de perdó<\/span><span class=\"l\">i sou testimonis clars d’esperança.<\/span><span class=\"l\">Poseu perdó i amor en les nostres vides<\/span><span class=\"l\">i el goig d’anunciar més albada.<\/span><\/p><p id=\"p82\" class=\"v st\"><span class=\"l\">Cantant a Crist Rei guanyeu l’altura,<\/span><span class=\"l\">ens deixeu enyorança amb el vostre vol.<\/span><span class=\"l\">Maria és la vostra Mare i la vostra Reina:<\/span><span class=\"l\">el seu Cor pur és el vostre cel. Amén.<\/span><\/p><h3 id=\"p83\">Salmòdia<\/h3><p id=\"p84\" class=\"pr\"><span class=\"r\">Ant.<\/span> Els sants màrtirs vessaren la seva sang per Crist: per això han aconseguit el premi etern.<\/p><h4 id=\"p85\">Salm 2<\/h4><p id=\"p86\" class=\"v st\"><span class=\"l\">Per què aquest avalot de les nacions,<\/span><span class=\"l\">aquest complot inútil de pobles?<\/span><span class=\"l e\"><\/span><span class=\"l\">Els reis prenen les armes,<\/span><span class=\"l\">conspiren alhora els sobirans<\/span><span class=\"l\">contra el Senyor i el seu Messies:<\/span><span class=\"l\">«Trenquem els seus lligams, trenquem-los!<\/span><span class=\"l\">Traguem-nos el seu jou del damunt!»<\/span><span class=\"l e\"><\/span><span class=\"l\">Però se’n riu el qui té el tron al cel,<\/span><span class=\"l\">el Senyor els veu i se’n burla.<\/span><span class=\"l\">Aleshores els parla indignat,<\/span><span class=\"l\">la seva ira els desconcerta.<\/span><span class=\"l e\"><\/span><span class=\"l\">M’ha consagrat a mi com a rei seu<\/span><span class=\"l\">dalt de Sió, muntanya santa.<\/span><span class=\"l\">Proclamo el decret del Senyor. M’ha dit:<\/span><span class=\"l\">«Ets el meu fill; avui t’he engendrat.<\/span><span class=\"l\">Demana-m’ho, i et daré els pobles per herència,<\/span><span class=\"l\">posseiràs el món d’un cap a l’altre.<\/span><span class=\"l\">Els governaràs amb el ceptre de ferro,<\/span><span class=\"l\">els esmicolaràs com un gerro de terrissa.»<\/span><span class=\"l e\"><\/span><span class=\"l\">I ara, reis, tingueu seny,<\/span><span class=\"l\">apreneu, governants de la terra.<\/span><span class=\"l\">Respecteu el Senyor, sotmeteu-vos-hi,<\/span><span class=\"l\">veniu tremolant a fer-li homenatge,<\/span><span class=\"l\">no fos que el vostre intent acabi en la desfeta<\/span><span class=\"l\">si de sobte s’inflamava la seva ira.<\/span><span class=\"l\">Feliços els qui en ell es refugien.<\/span><\/p><p id=\"p87\" class=\"pr\"><span class=\"r\">Ant.<\/span> Els sants màrtirs vessaren la seva sang per Crist: per això han aconseguit el premi etern.<\/p><p id=\"p88\" class=\"pr\"><span class=\"r\">Ant.<\/span> Els justos viuen eternament, reben de Déu la seva recompensa.<\/p><h4 id=\"p89\">Salm 32 I<\/h4><p id=\"p90\" class=\"v st\"><span class=\"l\">Justos, aclameu el Senyor,<\/span><span class=\"l\">fareu bé de lloar-lo, homes rectes.<\/span><span class=\"l e\"><\/span><span class=\"l\">Celebreu el Senyor amb la lira,<\/span><span class=\"l\">acompanyeu amb l’arpa els vostres cants,<\/span><span class=\"l\">dediqueu-li un càntic nou,<\/span><span class=\"l\">toqueu acompanyant l’aclamació.<\/span><span class=\"l e\"><\/span><span class=\"l\">Perquè la paraula del Senyor és sincera,<\/span><span class=\"l\">es manté fidel en tot el que fa;<\/span><span class=\"l\">estima el dret i la justícia,<\/span><span class=\"l\">la terra és plena del seu amor.<\/span><span class=\"l e\"><\/span><span class=\"l\">La paraula del Senyor ha fet el cel,<\/span><span class=\"l\">amb l’alè de la boca ha creat l’estelada;<\/span><span class=\"l\">com dins un odre recull l’aigua del mar,<\/span><span class=\"l\">reté l’oceà en el seu llit.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que tota la terra veneri el Senyor,<\/span><span class=\"l\">que el temin els habitants del món;<\/span><span class=\"l\">a una paraula seva, tot comença,<\/span><span class=\"l\">a una ordre d’ell, tot existí.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor desfà els plans de les nacions,<\/span><span class=\"l\">tira a terra els propòsits dels pobles;<\/span><span class=\"l\">però els plans del Senyor persisteixen,<\/span><span class=\"l\">manté sempre els propòsits del seu cor.<\/span><\/p><p id=\"p91\" class=\"pr\"><span class=\"r\">Ant.<\/span> Els justos viuen eternament, reben de Déu la seva recompensa.<\/p><p id=\"p92\" class=\"pr\"><span class=\"r\">Ant.<\/span> A vosaltres, sants meus, que heu lluitat en aquest món, us donaré la recompensa del vostre esforç.<\/p><h4 id=\"p93\">Salm 32 II<\/h4><p id=\"p94\" class=\"v st\"><span class=\"l\">Feliç la nació que té el Senyor per Déu,<\/span><span class=\"l\">feliç el poble que ell s’ha escollit per heretat.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor guaita des del cel<\/span><span class=\"l\">observant un per un tots els homes.<\/span><span class=\"l\">Des del lloc on ell resideix<\/span><span class=\"l\">es fixa en els qui poblen la terra;<\/span><span class=\"l\">ell, que ha modelat un per un tots els cors,<\/span><span class=\"l\">penetra totes les seves accions.<\/span><span class=\"l e\"><\/span><span class=\"l\">No és un gran exèrcit el que salva els reis,<\/span><span class=\"l\">ni per ser valent queda il·lès el soldat;<\/span><span class=\"l\">els cavalls no valen res per guanyar una victòria,<\/span><span class=\"l\">la seva envestida no salva ningú.<\/span><span class=\"l e\"><\/span><span class=\"l\">Els ulls del Senyor vetllen els qui el veneren,<\/span><span class=\"l\">els qui esperen en l’amor que els té;<\/span><span class=\"l\">ell els allibera de la mort,<\/span><span class=\"l\">i els retorna en temps de fam.<\/span><span class=\"l e\"><\/span><span class=\"l\">Tenim posada l’esperança en el Senyor,<\/span><span class=\"l\">auxili nostre i escut que ens protegeix.<\/span><span class=\"l\">És l’alegria del nostre cor,<\/span><span class=\"l\">i confiem en la presència del seu nom.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que el vostre amor, Senyor, no ens deixi mai;<\/span><span class=\"l\">aquesta és l’esperança que posem en vós.<\/span><\/p><p id=\"p95\" class=\"pr\"><span class=\"r\">Ant.<\/span> A vosaltres, sants meus, que heu lluitat en aquest món, us donaré la recompensa del vostre esforç.<\/p><p id=\"p96\" class=\"v st\"><span class=\"l\"><span class=\"r\">V.<\/span> La nostra esperança és el Senyor.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Ell és el nostre auxili i escut.<\/span><\/p><h3 id=\"p97\">Primera lectura<\/h3><p id=\"p98\" class=\"src v\">De la carta de l’apòstol sant Pau als Romans 8, 18-39<\/p><h4 class=\"rt\" id=\"p99\">Res no ens pot separar de l’amor de Déu manifestat en Jesucrist<\/h4><p id=\"p100\" class=\"pr\">Germans: considero que els sofriments d’ara no es poden comparar amb la glòria que un dia se’ns revelarà. Perquè la creació espera amb anhel la plena manifestació dels fills de Déu. Fou sotmesa a la frustració, no pas per voluntat pròpia, sinó per aquell que la hi va sotmetre, però amb l’esperança que també la creació seria alliberada de l’esclavatge de la corrupció per participar de la llibertat gloriosa dels fills de Déu.<\/p><p id=\"p101\" class=\"pr\">Sabem, en efecte, que fins avui tota la creació gemega i sofreix dolors de part. I no solament ella: també nosaltres, que posseïm les primícies de l’Esperit, gemeguem dins nostre, esperant l’hora de ser fills de Déu, la redempció del nostre cos. Perquè hem estat salvats en esperança. Ara bé, una esperança que es veu ja no és esperança. Com podria continuar esperant algú allò que ja veu? Però, si esperem allò que no veiem, ho aguardem amb perseverança.<\/p><p id=\"p102\" class=\"pr\">A més, l’Esperit ve a ajudar la nostra feblesa, perquè nosaltres no sabem demanar allò que ens convé, però l’Esperit mateix intercedeix per nosaltres amb gemecs inefables. I el qui escruta els cors sap quin és el desig de l’Esperit, i que la seva intercessió pels sants és d’acord amb Déu.<\/p><p id=\"p103\" class=\"pr\">Sabem també que tot serveix per al bé dels qui estimen Déu, dels qui ha cridat segons el seu designi. Els qui havia escollit, Déu els predestinà a ser imatge del seu Fill, perquè ell fos el primogènit de molts germans. Els qui predestinà, els cridà; els qui cridà, els justificà; els qui justificà, els glorificà.<\/p><p id=\"p104\" class=\"pr\">Què més podem dir? Si tenim Déu amb nosaltres, qui tindrem en contra? Ell, que no va plànyer el seu propi Fill, sinó que el lliurà per tots nosaltres, com no ens ho donarà tot amb ell? Qui acusarà els elegits de Déu? Déu, que els justifica? Qui els condemnarà? Potser Crist, que morí, més encara, ressuscità, és a la dreta de Déu i intercedeix per nosaltres?<\/p><p id=\"p105\" class=\"pr\">Qui ens podrà separar de l’amor de Crist? L’aflicció, l’angoixa, la persecució, la fam, la nuesa, el perill, l’espasa? Tal com diu l’Escriptura: «Per causa vostra ens degollen cada dia, ens tracten com ovelles destinades a la matança». Però, en tot això, vencem plenament gràcies a aquell que ens ha estimat. Estic convençut que ni la mort ni la vida, ni els àngels ni els principats, ni el present ni el futur, ni les potències, ni l’altura ni la profunditat, ni cap altra criatura no ens podrà separar de l’amor de Déu manifestat en Jesucrist, Senyor nostre.<\/p><h4 id=\"p106\">Responsori<\/h4><p id=\"p107\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Estimeu els vostres enemics i pregueu pels qui us persegueixen. Així sereu fills del vostre Pare del cel.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Estimeu els vostres enemics i pregueu pels qui us persegueixen. Així sereu fills del vostre Pare del cel.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Sigueu perfectes com ho és el vostre Pare celestial.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Així sereu fills del vostre Pare del cel.<\/span><\/p><h3 id=\"p108\">Segona lectura<\/h3><p id=\"p109\" class=\"src v\"><span class=\"l\">De l’Autobiografia de sant Antoni Maria Claret, bisbe i fundador<\/span><span class=\"l\">Capítol XXVIII, nn. 414-415 i 421-424<\/span><\/p><h4 class=\"rt\" id=\"p110\">La mortificació<\/h4><p id=\"p111\" class=\"pr\">«Vaig comprendre que en un sol acte de mortificació es poden exercitar moltes virtuts segons les diferents finalitats que cadascú es proposi en cada acte; v. gr.: El qui mortifica el seu cos amb la finalitat de refrenar la concupiscència, fa un acte de la virtut de la temprança. Si ho fa amb el fi d’ordenar bé la vida, serà un acte de la virtut de la prudència. Si ho fa amb el fi de satisfer per les faltes de la vida passada, serà un acte de justícia. Si ho fa per vèncer les dificultats de la vida espiritual, serà un acte de fortalesa. Si ho fa amb la finalitat d’oferir un sacrifici a Déu, privant-se d’allò que li agrada i practicant el que l’amarga i repugna, serà un acte de la virtut de la religió. Si ho fa amb la finalitat de rebre una llum més gran per conèixer els atributs divins, serà un acte de fe. Si ho fa a fi d’assegurar més la seva salvació, serà un acte d’esperança. Si ho fa a fi d’ajudar a la conversió dels pecadors, en sufragi de les ànimes del purgatori, serà un acte de caritat envers el proïsme. Si ho fa a fi de tenir més per socórrer els pobres, serà un acte de la virtut de la misericòrdia. Si ho fa amb el fi d’agradar més i més a Déu, serà un acte d’amor a Déu. En cada acte de mortificació podré exercitar aquestes deu virtuts, segons els fins que m’hi proposi. Jo conec que tres-cents anys de fidels serveis a Déu es paguen i sobradament, amb una hora que em permeti de penes; tan gran és el seu valor. Oh Jesús meu i Mestre meu! L’atribolat, perseguit i desemparat d’amics, el crucificat de treballs exteriors i de creus interiors i desemparat de consols espirituals, que calla, sofreix i persevera amb amor, aquest és el vostre estimat i el qui us agrada i el qui més valoreu. Així que m’he proposat de no sincerar-me mai per mai, ni excusar-me, ni defensar-me, quan em blasmin, calumniïn i persegueixin, perquè hi perdria davant Déu i els homes. Sí, aquests es valdrien de les veritats i raons que jo al·legués com armes contra meu. Crec que tot ve de Déu, i crec que Déu vol de mi aquest obsequi, que sofreixi amb paciència pel seu amor les penes del cos, de l’ànima i de l’honor. Crec que en això faré el que és de major glòria de Déu, és a dir que calli i sofreixi com Jesús, que va morir a la creu desemparat de tot. Fer i sofrir són les grans proves de l’amor.»<\/p><h4 id=\"p112\">Responsori<\/h4><p id=\"p113\" class=\"ref rub\"><span class=\"r\"><i>Mt 5, 10-12<\/i><\/span><\/p><p id=\"p114\" class=\"pr\"><span class=\"l\"><span class=\"r\">R.<\/span> Feliços els perseguits pel fet de ser justos, perquè d’ells és el Regne del cel. * Feliços<\/span><span class=\"l\">vosaltres quan, per causa meva, us insultaran, us perseguiran i escamparan contra<\/span><span class=\"l\">vosaltres tota mena de calúmnies.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Alegreu-vos-en i celebreu-ho, perquè la vostra recompensa és gran en el cel. *<\/span><span class=\"l\">Feliços vosaltres quan, per causa meva, us insultaran, us perseguiran i escamparan<\/span><span class=\"l\">contra vosaltres tota mena de calúmnies.<\/span><\/p><h3 id=\"p115\">Oració<\/h3><p id=\"p116\" class=\"pr\">Déu, Pare nostre, que, amb l’ajuda de la Benaurada Verge Maria, vau portar els beats màrtirs claretians a la imitació de Crist fins al vessament de la sang, concediu-nos, pel seu exemple i intercessió, de confessar la fe amb fortalesa, de paraula i d’obra. Per Crist Senyor nostre. Amén.<\/p>", "chips": [["p45", "Himne"], ["p83", "Salmòdia"], ["p97", "Primera lectura"], ["p108", "Segona lectura"], ["p115", "Oració"]]}, {"name": "Laudes", "tab": "Laudes", "html": "<h3 id=\"p118\">Himne<\/h3><p id=\"p119\" class=\"v st\"><span class=\"l\">Crist, anyell, porta del martiri,<\/span><span class=\"l\">travessen els vostres atris els qui us han seguit<\/span><span class=\"l\">en cos, en ànima, en cor, en sang;<\/span><span class=\"l\">vostre és el seu coratge.<\/span><\/p><p id=\"p120\" class=\"v st\"><span class=\"l\">Crist, llavor, màrtir de la sembra,<\/span><span class=\"l\">cauen a terra i del seu si brota<\/span><span class=\"l\">blat als vostres camps, pa a les vostres estovalles;<\/span><span class=\"l\">vostra és la seva ofrena.<\/span><\/p><p id=\"p121\" class=\"v st\"><span class=\"l\">Crist, pelegrí, pau dels captius,<\/span><span class=\"l\">passen units per valls de tenebra,<\/span><span class=\"l\">amb el rostre serè, lliure de rancors;<\/span><span class=\"l\">vostres són les seves penes.<\/span><\/p><p id=\"p122\" class=\"v st\"><span class=\"l\">Crist, vivent, màrtir de l’espera,<\/span><span class=\"l\">moren contents, van cap al demà,<\/span><span class=\"l\">preguen per la seva Congregació estimada;<\/span><span class=\"l\">vostra és la seva pasqua.<\/span><\/p><p id=\"p123\" class=\"v st\"><span class=\"l\">Crist, estel del matí, rei dels testimonis,<\/span><span class=\"l\">canten a l’alba visques a la vostra glòria,<\/span><span class=\"l\">«Mare» als llavis, pregàries i perdons;<\/span><span class=\"l\">vostres són les seves veus.<\/span><\/p><p id=\"p124\" class=\"v st\"><span class=\"l\">Crist, ponent, màrtir de la sega,<\/span><span class=\"l\">s’avancen al sant en la seva cursa,<\/span><span class=\"l\">segellen de vermell el vol claretià;<\/span><span class=\"l\">vostra és la seva meta.<\/span><\/p><p id=\"p125\" class=\"v st\"><span class=\"l\">Crist, font, repòs en el camí,<\/span><span class=\"l\">lliuren l’alè per trobar la felicitat<\/span><span class=\"l\">d’un pit amic, d’un Cor de Mare;<\/span><span class=\"l\">vostre és el seu recer.<\/span><\/p><p id=\"p126\" class=\"v st\"><span class=\"l\">Crist, corrent, màrtir de la lleva,<\/span><span class=\"l\">surten al món com a missioners ardents,<\/span><span class=\"l\">el seu amor viu ja no té fronteres;<\/span><span class=\"l\">vostre és el seu foc.<\/span><\/p><p id=\"p127\" class=\"v st\"><span class=\"l\">Crist Jesús, el vostre Esperit els forja,<\/span><span class=\"l\">neixen en vós els qui per vós moriren,<\/span><span class=\"l\">s’alcen amb vós, els lliureu al Pare;<\/span><span class=\"l\">«Vostres, els vostres fills». Amén.<\/span><\/p><h3 id=\"p128\">Salmòdia<\/h3><p id=\"p129\" class=\"pr\"><span class=\"r\">Ant.<\/span> Enmig dels turments, els màrtirs de Crist contemplaven la seva glòria i deien: «Ajudeu-nos, Senyor».<\/p><h4 id=\"p130\">Salm 62, 2-9<\/h4><p id=\"p131\" class=\"v st\"><span class=\"l\">Vós, Senyor, sou el meu Déu; jo us cerco.<\/span><span class=\"l\">Tot jo tinc set de vós,<\/span><span class=\"l\">per vós es desviu el meu cor,<\/span><span class=\"l\">com terra eixuta, sense una gota d’aigua.<\/span><span class=\"l e\"><\/span><span class=\"l\">Jo us contemplava al vostre santuari<\/span><span class=\"l\">quan us veia gloriós i poderós.<\/span><span class=\"l\">L’amor que em teniu val més que la vida;<\/span><span class=\"l\">per això els meus llavis us lloaran.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que tota la vida us pugui beneir<\/span><span class=\"l\">i alçar les mans lloant el vostre nom.<\/span><span class=\"l\">Saciat del bo i millor,<\/span><span class=\"l\">us lloaré amb el goig als llavis.<\/span><span class=\"l e\"><\/span><span class=\"l\">Quan des del llit us recordo,<\/span><span class=\"l\">passo les nits pensant en vós,<\/span><span class=\"l\">perquè vós m’heu ajudat,<\/span><span class=\"l\">i sóc feliç sota les vostres ales.<\/span><span class=\"l e\"><\/span><span class=\"l\">La meva ànima s’ha enamorat de vós,<\/span><span class=\"l\">em sosté la vostra mà.<\/span><\/p><p id=\"p132\" class=\"pr\"><span class=\"r\">Ant.<\/span> Enmig dels turments, els màrtirs de Crist contemplaven la seva glòria i deien: «Ajudeu-nos, Senyor».<\/p><p id=\"p133\" class=\"pr\"><span class=\"r\">Ant.<\/span> Ànimes i esperits dels justos, canteu un himne a Déu.<\/p><h4 id=\"p134\">Càntic Dn 3, 57-88.56<\/h4><p id=\"p135\" class=\"v st\"><span class=\"l\">Beneïu el Senyor, totes les criatures,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l\">Beneïu-lo, àngels del Senyor,<\/span><span class=\"l\">beneïu, cels, el Senyor.<\/span><span class=\"l\">Beneïu el Senyor, aigües de l’espai,<\/span><span class=\"l\">beneïu-lo, estols del Senyor.<\/span><span class=\"l\">Beneïu el Senyor, sol i lluna,<\/span><span class=\"l\">beneïu-lo, estrelles del cel.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïu el Senyor, pluges i rosades,<\/span><span class=\"l\">beneïu-lo, tots els vents.<\/span><span class=\"l\">Beneïu el Senyor, foc i calor,<\/span><span class=\"l\">beneïu-lo, freds i gelades.<\/span><span class=\"l\">Beneïu el Senyor, rosades i gebre,<\/span><span class=\"l\">beneïu-lo, glaç i freds.<\/span><span class=\"l\">Beneïu el Senyor, neus i geleres,<\/span><span class=\"l\">beneïu-lo, dies i nits.<\/span><span class=\"l\">Beneïu el Senyor, llum i tenebres,<\/span><span class=\"l\">beneïu-lo, núvols i llamps.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que la terra beneeixi el Senyor,<\/span><span class=\"l\">que li canti lloances per sempre.<\/span><span class=\"l\">Beneïu el Senyor, muntanyes i turons,<\/span><span class=\"l\">vegetació de la terra, beneeix-lo.<\/span><span class=\"l\">Beneïu, fonts, el Senyor, beneïu-lo, rius i mars.<\/span><span class=\"l\">Beneïu el Senyor, peixos i monstres marins,<\/span><span class=\"l\">beneïu-lo, tots els ocells.<\/span><span class=\"l\">Beneïu el Senyor, feres i ramats,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïu el Senyor, tots els homes,<\/span><span class=\"l\">beneeix-lo, poble d’Israel.<\/span><span class=\"l\">Beneïu-lo, sacerdots del Senyor,<\/span><span class=\"l\">beneïu-lo, servents del Senyor.<\/span><span class=\"l\">Beneïu el Senyor, sants i humils de cor,<\/span><span class=\"l\">ànimes i esperits dels justos, beneïu-lo.<\/span><span class=\"l\">Beneïu el Senyor, Hananies, Azaries i Misael,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïm el Pare i el Fill amb l’Esperit Sant,<\/span><span class=\"l\">cantem-li lloances per sempre.<\/span><span class=\"l\">Sou beneït, Senyor, al firmament del cel.<\/span><span class=\"l\">Glòria i lloança per sempre.<\/span><\/p><p id=\"p136\" class=\"pr\"><span class=\"r\">Ant.<\/span> Ànimes i esperits dels justos, canteu un himne a Déu.<\/p><p id=\"p137\" class=\"pr rub\"><span class=\"r\">A l’acabament d’aquest càntic no es diu Glòria al Pare.<\/span><\/p><p id=\"p138\" class=\"pr\"><span class=\"r\">Ant.<\/span> Màrtirs del Senyor, lloeu el Senyor al cel.<\/p><h4 id=\"p139\">Salm 149<\/h4><p id=\"p140\" class=\"v st\"><span class=\"l\">Canteu al Senyor un càntic nou,<\/span><span class=\"l\">canteu les seves lloances davant dels qui l’estimen.<\/span><span class=\"l\">Se sent feliç Israel del qui l’ha creat,<\/span><span class=\"l\">s’alegren del seu rei els fills de Sió.<\/span><span class=\"l e\"><\/span><span class=\"l\">Lloen el seu nom, el lloen tot dansant,<\/span><span class=\"l\">acompanyen els seus cants amb els tambors i les<\/span><span class=\"l\">cítares.<\/span><span class=\"l\">Perquè el Senyor estima el seu poble,<\/span><span class=\"l\">coronarà de triomf els humils.<\/span><span class=\"l e\"><\/span><span class=\"l\">Els fidels celebren la seva glòria,<\/span><span class=\"l\">des dels seus rengles aclamen plens de goig;<\/span><span class=\"l\">mentre els seus llavis glorifiquen Déu,<\/span><span class=\"l\">tenen a les mans espases de dos talls,<\/span><span class=\"l e\"><\/span><span class=\"l\">per fer justícia entre els pobles,<\/span><span class=\"l\">per reprendre i castigar les nacions,<\/span><span class=\"l\">encadenant els seus reis,<\/span><span class=\"l\">emmanillant els poderosos.<\/span><span class=\"l e\"><\/span><span class=\"l\">Executar la sentència que està escrita<\/span><span class=\"l\">és la glòria reservada als qui l’estimen.<\/span><\/p><p id=\"p141\" class=\"pr\"><span class=\"r\">Ant.<\/span> Màrtirs del Senyor, lloeu el Senyor al cel.<\/p><h3 id=\"p142\">Lectura breu<\/h3><p id=\"p143\" class=\"ref rub\"><span class=\"r\"><i>2Co 1, 3-5<\/i><\/span><\/p><p id=\"p144\" class=\"pr\">Beneït sigui Déu, Pare de nostre Senyor Jesucrist, Pare de misericòrdia i Déu de tot consol! Ell ens encoratja en totes les nostres lluites, fins al punt que també nosaltres podem encoratjar els altres en qualsevol lluita, compartint amb ells el coratge que rebem de Déu. Si els sofriments de Crist desborden en nosaltres, gràcies a Crist també desborda, en la mateixa mesura, el nostre consol.<\/p><h3 id=\"p145\">Responsori breu<\/h3><p id=\"p146\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Els justos viuen eternament.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Els justos viuen eternament.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Reben de Déu la seva recompensa.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Viuen eternament.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Glòria al Pare i al Fill i a l’Esperit Sant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Els justos viuen eternament.<\/span><\/p><h3 id=\"p147\">Càntic de Zacaries<\/h3><p id=\"p148\" class=\"pr\"><span class=\"r\">Ant.<\/span> Feliços els perseguits pel fet de ser justos, perquè d’ells és el Regne del cel.<\/p><p id=\"p149\" class=\"v st\"><span class=\"l\">Beneït sigui el Senyor, Déu d’Israel,<\/span><span class=\"l\">ha visitat el seu poble i l’ha redimit.<\/span><span class=\"l\">Fa que s’aixequi un salvador poderós<\/span><span class=\"l\">a la casa de David el seu servent,<\/span><span class=\"l\">com ho havia anunciat de temps antic,<\/span><span class=\"l\">per boca dels seus sants profetes.<\/span><span class=\"l e\"><\/span><span class=\"l\">Així ens salva, alliberant-nos dels enemics,<\/span><span class=\"l\">de les mans dels qui ens volen mal,<\/span><span class=\"l\">mogut per l’amor que el fa fidel als nostres pares,<\/span><span class=\"l\">i pel record de l’Aliança santa,<\/span><span class=\"l\">que jurà al nostre pare Abraham,<\/span><span class=\"l e\"><\/span><span class=\"l\">prometent de concedir-nos que, sense por,<\/span><span class=\"l\">lliures dels enemics, li donem culte<\/span><span class=\"l\">amb santedat i justícia tota la vida.<\/span><span class=\"l e\"><\/span><span class=\"l\">I a tu, infant, et diran profeta de l’Altíssim,<\/span><span class=\"l\">perquè aniràs al davant del Senyor<\/span><span class=\"l\">a preparar els seus camins.<\/span><span class=\"l e\"><\/span><span class=\"l\">Faràs saber al poble que li ve la salvació,<\/span><span class=\"l\">el perdó dels seus pecats,<\/span><span class=\"l\">per l’amor entranyable del nostre Déu.<\/span><span class=\"l e\"><\/span><span class=\"l\">Perquè ens estima, ens visitarà un Sol<\/span><span class=\"l\">que ve del cel,<\/span><span class=\"l\">per il·luminar els qui viuen a la fosca,<\/span><span class=\"l\">a les ombres de la mort,<\/span><span class=\"l\">i guiar els nostres passos per camins de pau.<\/span><\/p><p id=\"p150\" class=\"pr\"><span class=\"r\">Ant.<\/span> Feliços els perseguits pel fet de ser justos, perquè d’ells és el Regne del cel.<\/p><h3 id=\"p151\">Pregàries<\/h3><p id=\"p152\" class=\"pr\">Celebrem, germans estimats, el nostre Salvador, el testimoni fidel, i, en recordar avui els sants màrtirs que moriren per causa de la paraula de Déu, aclamem-lo dient:<\/p><p id=\"p153\" class=\"c\"><i>Senyor, ens heu comprat amb la vostra sang.<\/i><\/p><p id=\"p154\" class=\"pr\">Per la intercessió dels sants màrtirs, que lliuraren lliurement la seva vida com a testimoni de la fe,<\/p><p id=\"p155\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>concediu-nos, Senyor, la veritable llibertat d’esperit.<\/p><p id=\"p156\" class=\"pr\">Per la intercessió dels sants màrtirs, que proclamaren la fe fins a vessar la seva sang,<\/p><p id=\"p157\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>concediu-nos, Senyor, la integritat i la constància de la fe.<\/p><p id=\"p158\" class=\"pr\">Per la intercessió dels sants màrtirs, que, portant la creu, seguiren els vostres passos,<\/p><p id=\"p159\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>concediu-nos, Senyor, de suportar amb generositat les contrarietats de la vida.<\/p><p id=\"p160\" class=\"pr\">Per la intercessió dels sants màrtirs, que rentaren els seus mantells amb la sang de l’Anyell,<\/p><p id=\"p161\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>concediu-nos, Senyor, de vèncer les obres del món i de la carn.<\/p><p id=\"p162\" class=\"pr rub\"><span class=\"r\">Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.<\/span><\/p><p id=\"p163\" class=\"pr\">Pare nostre.<\/p><h3 id=\"p164\">Oració<\/h3><p id=\"p165\" class=\"pr\">Déu, Pare nostre, que, amb l’ajuda de la Benaurada Verge Maria, vau portar els beats màrtirs claretians a la imitació de Crist fins al vessament de la sang, concediu-nos, pel seu exemple i intercessió, de confessar la fe amb fortalesa, de paraula i d’obra. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p118", "Himne"], ["p128", "Salmòdia"], ["p142", "Lectura breu"], ["p145", "Responsori breu"], ["p147", "Càntic de Zacaries"], ["p151", "Pregàries"], ["p164", "Oració"]]}, {"name": "Hora d’entre dia", "tab": "Hora d’entre dia", "html": "<p id=\"p167\" class=\"pr rub\"><span class=\"r\">Si cau en diumenge, es reciten els salms del diumenge I; en els altres casos, es diuen els salms graduals de la salmòdia complementària.<\/span><\/p><h3 id=\"p168\">Tèrcia<\/h3><h4 id=\"p169\">Lectura breu<\/h4><p id=\"p170\" class=\"ref rub\"><span class=\"r\"><i>1Pe 5, 10-11<\/i><\/span><\/p><p id=\"p171\" class=\"pr\">Déu, que és font de tota gràcia i que en el Crist us ha cridat a la seva glòria eterna, després d’haver sofert per poc temps, refarà les vostres forces i us deixarà ferms i ben fonamentats. D’ell és el poder per sempre. Amén.<\/p><p id=\"p172\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Els sants que esperen en el Senyor.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Seran forts i no defalliran.<\/span><\/p><h3 id=\"p173\">Sexta<\/h3><h4 id=\"p174\">Lectura breu<\/h4><p id=\"p175\" class=\"ref rub\"><span class=\"r\"><i>Cf. He 11, 33<\/i><\/span><\/p><p id=\"p176\" class=\"pr\">Els sants, per la fe en Crist, Senyor nostre, sotmeteren reialmes, practicaren la justícia i obtingueren promeses.<\/p><p id=\"p177\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> La vostra tristesa.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Es convertirà en alegria.<\/span><\/p><h3 id=\"p178\">Nona<\/h3><h4 id=\"p179\">Lectura breu<\/h4><p id=\"p180\" class=\"ref rub\"><span class=\"r\"><i>Sv 3, 1-2a. 3b<\/i><\/span><\/p><p id=\"p181\" class=\"pr\">Les ànimes dels justos estan en mans de Déu, i cap turment no les podrà tocar. Als ulls dels insensats semblava que morissin, però ells han trobat la pau.<\/p><p id=\"p182\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Tornen cantant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Duent les seves garbes.<\/span><\/p><p id=\"p183\" class=\"pr rub\"><span class=\"r\">L’oració, com a Laudes.<\/span><\/p>", "chips": [["p168", "Tèrcia"], ["p173", "Sexta"], ["p178", "Nona"]]}, {"name": "Vespres", "tab": "Vespres", "html": "<h3 id=\"p185\">Himne<\/h3><p id=\"p186\" class=\"v st rub\"><span class=\"r\">Com a laudes<\/span><\/p><h3 id=\"p187\">Salmòdia<\/h3><p id=\"p188\" class=\"pr\"><span class=\"r\">Ant.<\/span> Els cossos dels sants foren sepultats en pau, i la seva fama perdura de generació en generació.<\/p><h4 id=\"p189\">Salm 114<\/h4><p id=\"p190\" class=\"v st\"><span class=\"l\">Estimo de tot cor el Senyor:<\/span><span class=\"l\">el Senyor ha escoltat la meva súplica,<\/span><span class=\"l\">ha escoltat el meu clam<\/span><span class=\"l\">així que l’invocava.<\/span><span class=\"l e\"><\/span><span class=\"l\">M’envoltaven els llaços de la mort,<\/span><span class=\"l\">tenia davant meu els seus paranys,<\/span><span class=\"l\">i dintre meu l’angoixa i el neguit.<\/span><span class=\"l\">Vaig invocar el nom del Senyor:<\/span><span class=\"l\">«Ah, Senyor, salveu-me la vida.»<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor és just i benigne,<\/span><span class=\"l\">el nostre Déu sap compadir.<\/span><span class=\"l\">El Senyor salvaguarda els senzills,<\/span><span class=\"l\">jo era feble i m’ha salvat.<\/span><span class=\"l e\"><\/span><span class=\"l\">Recobra la serenor, ànima meva,<\/span><span class=\"l\">mira el que t’ha fet el Senyor.<\/span><span class=\"l\">Ha alliberat de la mort la meva vida,<\/span><span class=\"l\">els meus ulls, de negar-se en el plor,<\/span><span class=\"l\">els meus peus, de donar un pas en fals.<\/span><span class=\"l e\"><\/span><span class=\"l\">Continuaré caminant entre els qui viuen,<\/span><span class=\"l\">a la presència del Senyor.<\/span><\/p><p id=\"p191\" class=\"pr\"><span class=\"r\">Ant.<\/span> Els cossos dels sants foren sepultats en pau, i la seva fama perdura de generació en generació.<\/p><p id=\"p192\" class=\"pr\"><span class=\"r\">Ant.<\/span> Vaig veure les ànimes dels degollats per causa de la paraula de Déu i del testimoni que havien mantingut.<\/p><h4 id=\"p193\">Salm 115<\/h4><p id=\"p194\" class=\"v st\"><span class=\"l\">Crec amb tot el cor, tot i que deia:<\/span><span class=\"l\">«Que en sóc, de dissortat»,<\/span><span class=\"l\">tot i que deia, veient-me perdut:<\/span><span class=\"l\">«Els homes, tots enganyen.»<\/span><span class=\"l e\"><\/span><span class=\"l\">Com podria retornar al Senyor<\/span><span class=\"l\">tot el bé que m’ha fet?<\/span><span class=\"l\">Invocant el seu nom, alçaré el calze<\/span><span class=\"l\">per celebrar la salvació.<\/span><span class=\"l\">Compliré les meves prometences,<\/span><span class=\"l\">ho faré davant del poble.<\/span><span class=\"l e\"><\/span><span class=\"l\">Al Senyor li doldria<\/span><span class=\"l\">la mort dels qui l’estimen.<\/span><span class=\"l\">Ah, Senyor, sóc el vostre servent,<\/span><span class=\"l\">ho sóc des del dia que vaig néixer.<\/span><span class=\"l\">Vós em trencàreu les cadenes.<\/span><span class=\"l e\"><\/span><span class=\"l\">Us oferiré una víctima d’acció de gràcies,<\/span><span class=\"l\">invocant el vostre nom,<\/span><span class=\"l\">compliré les meves prometences,<\/span><span class=\"l\">ho faré davant del poble,<\/span><span class=\"l\">als atris de la casa del Senyor,<\/span><span class=\"l\">al teu bell mig, Jerusalem.<\/span><\/p><p id=\"p195\" class=\"pr\"><span class=\"r\">Ant.<\/span> Vaig veure les ànimes dels degollats per causa de la paraula de Déu i del testimoni que havien mantingut.<\/p><p id=\"p196\" class=\"pr\"><span class=\"r\">Ant.<\/span> Aquests són els sants que lliuraren els seus cossos per ser fidels a l’aliança de Déu i han rentat els seus vestits amb la sang de l’Anyell.<\/p><h4 id=\"p197\">Càntic Ap 4, 11; 5, 9-10.12<\/h4><p id=\"p198\" class=\"v st\"><span class=\"l\">Senyor, Déu nostre,<\/span><span class=\"l\">sou digne de rebre la glòria, l’honor i el poder,<\/span><span class=\"l\">perquè vós heu creat tot l’univers.<\/span><span class=\"l\">Quan res no existia, vós vau voler que tot fos creat.<\/span><span class=\"l e\"><\/span><span class=\"l\">Senyor, sou digne de prendre el document<\/span><span class=\"l\">i d’obrir-ne els segells,<\/span><span class=\"l\">perquè heu estat degollat<\/span><span class=\"l\">i heu comprat per a Déu amb la vostra sang<\/span><span class=\"l\">gent de tota tribu, llengua i nació,<\/span><span class=\"l\">i n’heu fet una casa reial<\/span><span class=\"l\">i uns sacerdots dedicats al nostre Déu,<\/span><span class=\"l\">que regnaran a la terra.<\/span><span class=\"l e\"><\/span><span class=\"l\">L’Anyell que ha estat degollat<\/span><span class=\"l\">és digne de rebre tot poder, riquesa, saviesa, força,<\/span><span class=\"l\">honor, glòria i lloança.<\/span><\/p><p id=\"p199\" class=\"pr\"><span class=\"r\">Ant.<\/span> Aquests són els sants que lliuraren els seus cossos per ser fidels a l’aliança de Déu i han rentat els seus vestits amb la sang de l’Anyell.<\/p><h3 id=\"p200\">Lectura breu<\/h3><p id=\"p201\" class=\"ref rub\"><span class=\"r\"><i>1Pe 4, 13-14<\/i><\/span><\/p><p id=\"p202\" class=\"pr\">Alegreu-vos de poder compartir els sofriments del Crist: també el dia que es revelarà la seva glòria, desbordareu d’alegria. Feliços vosaltres si algú us retreu el nom de cristians: vol dir que l’Esperit de la glòria, que és l’Esperit de Déu, reposa sobre vosaltres.<\/p><h3 id=\"p203\">Responsori breu<\/h3><p id=\"p204\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Alegreu-vos, justos, i exulteu amb el Senyor.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Alegreu-vos, justos, i exulteu amb el Senyor.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Aclameu-lo, els rectes de cor.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> I exulteu amb el Senyor.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Glòria al Pare i al Fill i a l’Esperit Sant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Alegreu-vos, justos, i exulteu amb el Senyor.<\/span><\/p><h3 id=\"p205\">Càntic de Maria<\/h3><p id=\"p206\" class=\"pr\"><span class=\"r\">Ant.<\/span> S’alegren al cel els sants que seguiren les petjades de Crist; i, perquè l’estimaren fins a vessar la sang, regnen amb el Senyor eternament.<\/p><p id=\"p207\" class=\"v st\"><span class=\"l\">La meva ànima magnifica el Senyor,<\/span><span class=\"l\">el meu esperit celebra el Déu que em salva,<\/span><span class=\"l\">perquè ha mirat la petitesa de la seva serventa.<\/span><span class=\"l e\"><\/span><span class=\"l\">Des d’ara totes les generacions<\/span><span class=\"l\">em diran benaurada,<\/span><span class=\"l\">perquè el Totpoderós obra en mi meravelles.<\/span><span class=\"l e\"><\/span><span class=\"l\">El seu nom és sant,<\/span><span class=\"l\">i l’amor que té als qui creuen en ell<\/span><span class=\"l\">s’estén de generació en generació.<\/span><span class=\"l e\"><\/span><span class=\"l\">Les obres del seu braç són potents:<\/span><span class=\"l\">dispersa els homes de cor altiu,<\/span><span class=\"l\">derroca els poderosos del soli<\/span><span class=\"l\">i exalça els humils.<\/span><span class=\"l\">Omple de béns els pobres,<\/span><span class=\"l\">i els rics se’n tornen sense res.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ha protegit Israel, el seu servent,<\/span><span class=\"l\">com ho havia promès als nostres pares;<\/span><span class=\"l\">s’ha recordat del seu amor a Abraham<\/span><span class=\"l\">i a la seva descendència per sempre.<\/span><\/p><p id=\"p208\" class=\"pr\"><span class=\"r\">Ant.<\/span> S’alegren al cel els sants que seguiren les petjades de Crist; i, perquè l’estimaren fins a vessar la sang, regnen amb el Senyor eternament.<\/p><h3 id=\"p209\">Pregàries<\/h3><p id=\"p210\" class=\"pr\">A la mateixa hora en què el Rei dels màrtirs oferí la seva vida a l’últim sopar i la lliurà a la creu, donem-li gràcies dient:<\/p><p id=\"p211\" class=\"c\"><i>Us glorifiquem, Senyor.<\/i><\/p><p id=\"p212\" class=\"pr\">Perquè ens vau estimar fins a l’extrem, Salvador nostre, principi i origen de tot martiri:<\/p><p id=\"p213\" class=\"c\"><i>Us glorifiquem, Senyor.<\/i><\/p><p id=\"p214\" class=\"pr\">Perquè no cesseu de cridar els pecadors penedits als premis del vostre Regne:<\/p><p id=\"p215\" class=\"c\"><i>Us glorifiquem, Senyor.<\/i><\/p><p id=\"p216\" class=\"pr\">Perquè avui hem ofert la sang de l’aliança nova i eterna, vessada per al perdó dels pecats:<\/p><p id=\"p217\" class=\"c\"><i>Us glorifiquem, Senyor.<\/i><\/p><p id=\"p218\" class=\"pr\">Perquè amb la vostra gràcia ens heu donat perseverança en la fe durant el dia que ara s’acaba:<\/p><p id=\"p219\" class=\"c\"><i>Us glorifiquem, Senyor.<\/i><\/p><p id=\"p220\" class=\"pr rub\"><span class=\"r\">Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.<\/span><\/p><p id=\"p221\" class=\"pr\">Perquè heu associat a la vostra mort els nostres germans difunts:<\/p><p id=\"p222\" class=\"c\"><i>Us glorifiquem, Senyor.<\/i><\/p><p id=\"p223\" class=\"pr\">Adrecem ara la nostra pregària al Pare del cel, dient: Pare nostre.<\/p><h3 id=\"p224\">Oració<\/h3><p id=\"p225\" class=\"pr\">Déu, Pare nostre, que, amb l’ajuda de la Benaurada Verge Maria, vau portar els beats màrtirs claretians a la imitació de Crist fins al vessament de la sang, concediu-nos, pel seu exemple i intercessió, de confessar la fe amb fortalesa, de paraula i d’obra. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p185", "Himne"], ["p187", "Salmòdia"], ["p200", "Lectura breu"], ["p203", "Responsori breu"], ["p205", "Càntic de Maria"], ["p209", "Pregàries"], ["p224", "Oració"]]}], "kind": "fest", "date": [2, 1], "title": "Beats màrtirs claretians", "rank": "Memòria", "sub": [], "intro": "<p id=\"p39\" class=\"pr\">En el context de la persecució religiosa desencadenada durant la guerra civil espanyola (1936-1939), van morir martiritzats, en llocs i dates diversos, nombrosos Missioners Fills del Cor Immaculat de la benaurada Verge Maria. Sense cedir a les insinuacions dels seus perseguidors, que els instaven a renegar de la fe, van lliurar la vida amb generositat, encoratjant-se mútuament; donant gràcies al Senyor que els havia cridat; lloant Maria, al Cor de la qual s’encomanaven; oferint el seu sacrifici pel fruit de la Congregació, de la qual se sabien fills, i perdonant els seus botxins. Eren missioners preveres, germans i estudiants. El més jove només tenia 16 anys. El primer grup a ser beatificat (25 d’octubre de 1992) fou el dels 51 màrtirs de Barbastre, el testimoni dels quals ha marcat l’espiritualitat claretiana. Aquesta espiritualitat, al seu torn, arrela en el desig del mateix P. Fundador, sant Antoni Maria Claret, que de moltes maneres manifestà la seva disposició al martiri, sofrint amb fe i enteresa persecució, calúmnies, atemptats i tota mena de violències. Als beats màrtirs de Barbastre els han seguit d’altres, com els 23 de Sigüenza, Fernán Caballero i Tarragona (13 d’octubre de 2013), o els 109 de Solsona, Cervera, Barcelona, Sabadell, Lleida, Vic, Santander i València (21 d’octubre de 2017).<\/p><p id=\"p40\" class=\"pr\">A aquests cal afegir el missioner màrtir Andreu Solà (20 de novembre de 2005), assassinat a Mèxic el 25 d’abril de 1927 juntament amb un company prevere i un laic, durant la persecució oberta pel govern mexicà d’aquell moment.<\/p>", "missa": {"title": "Beat Felip de Jesús Munárriz i companys, màrtirs", "html": "<p class=\"nota\" id=\"m0x0\">Comú de diversos màrtirs, fora del temps pasqual.<\/p><h3 class=\"rub\" id=\"m0x1\">Antífona d’introducció<\/h3><div class=\"pl\" id=\"m0x2\"><span class=\"l\">A la terra els sants màrtirs han vessat la seva sang per Crist,<\/span><span class=\"l\">per això han arribat al premi etern.<\/span><\/div><h3 class=\"rub\" id=\"m0x3\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m0x4\"><span class=\"l\">Déu, Pare nostre,<\/span><span class=\"l\">que, amb l’ajuda de la Benaurada Verge Maria,<\/span><span class=\"l\">vau portar els Beats Màrtirs Claretians<\/span><span class=\"l\">a la imitació de Crist fins al vessament de la sang,<\/span><span class=\"l\">concediu-nos, pel seu exemple i intercessió,<\/span><span class=\"l\">de confessar la fe amb fortalesa, de paraula i d’obra.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><p class=\"nota\" id=\"m0x5\">Es poden emprar les lectures del Comú de màrtirs, o bé les següents:<\/p><h3 class=\"rub\" id=\"m0x6\">Lectura primera <span class=\"ref\">Rm 8,31-39<\/span><\/h3><p class=\"lema\" id=\"m0x7\">Res de l’univers creat no serà capaç d’allunyar-nos de Déu que, en Jesucrist, ha demostrat com ens estima<\/p><p class=\"pr\" id=\"m0x8\">Lectura de la carta de l’apòstol sant Pau als Romans:<\/p><p class=\"pr\" id=\"m0x9\">Germans: Si tenim Déu amb nosaltres, qui tindrem en contra? Ell, que no va plànyer el seu propi Fill, sinó que el va entregar per tots nosaltres, com no ens ho donarà tot juntament amb ell? Qui s’alçarà per acusar els elegits de Déu, si Déu mateix els fa justos? Qui gosarà condemnar-los, si Jesucrist mateix va morir, més encara, va ressuscitar, està a la dreta de Déu i intercedeix per nosaltres? Qui ens separarà de l’amor de Crist? ¿La tribulació, l’angoixa, la persecució, la fam, la nuesa, el perill, l’espasa? Tal com diu l’Escriptura: És per tu que anem morint tot el dia, i ens tenen com anyells duts a matar. Però, de tot això, en sortim plenament vencedors gràcies a aquell qui ens estima. N’estic cert: ni la mort ni la vida, ni els àngels ni les potències, ni el present ni el futur, ni els poders, ni el món de dalt ni el de sota, ni res de l’univers creat no ens podrà separar de l’amor de Déu que s’ha manifestat en Jesucrist, Senyor nostre.<\/p><p class=\"fin\" id=\"m0x10\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m0x11\">Salm responsorial <span class=\"ref\">Sl 123, 2-5.7b-8<\/span><\/h3><div class=\"pl\" id=\"m0x12\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Hem salvat la vida<\/span><span class=\"l\">com l’ocell que fuig del llaç dels caçadors.<\/span><\/div><div class=\"pl\" id=\"m0x13\"><span class=\"l\">Si el Senyor no hagués estat a favor nostre,<\/span><span class=\"l\">quan els homes intentaven assaltar-nos,<\/span><span class=\"l\">ens haurien engolit de viu en viu:<\/span><span class=\"l\">tan gran era la fúria que portaven. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m0x14\"><span class=\"l\">Quan la riuada ens vingué a sobre,<\/span><span class=\"l\">ens hauria passat la inundació més amunt del coll,<\/span><span class=\"l\">més amunt del coll ens hauria passat<\/span><span class=\"l\">la crescuda de les aigües. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m0x15\"><span class=\"l\">S’ha trencat el llaç, i tots hem fugit.<\/span><\/div><div class=\"pl\" id=\"m0x16\"><span class=\"l\">El nostre auxili és el nom del Senyor,<\/span><span class=\"l\">del Senyor que ha fet cel i terra. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"obien\" id=\"m0x17\">O bé <span class=\"ref\">2Co 4,7-15<\/span><\/div><p class=\"lema\" id=\"m0x18\">Aquell que ressuscità Jesús també ens ressuscitarà a nosaltres amb Jesús i ens portarà a la seva presència juntament amb vosaltres<\/p><p class=\"pr\" id=\"m0x19\">Lectura de la segona carta de sant Pau als cristians de Corint:<\/p><p class=\"pr\" id=\"m0x20\">Germans, portem el tresor del ministeri que Déu ens ha confiat com en gerres de terrissa. Així queda ben clar que aquest poder altíssim ve de Déu, i no pas de nosaltres. Quan les contrarietats ens envolten pertot arreu, no quedem del tot encerclats; quan no sabem com escapar-nos, a la fi trobem la sortida; quan els qui ens persegueixen ja ens tenen a les mans, no quedem del tot abandonats; quan ens trobem per terra en la lluita, no arribem a perdre-hi la vida. Sempre i pertot arreu portem la mort de Jesús en el nostre cos, perquè també en el nostre cos es manifesti en el seu esclat la vida de Jesús. És ben bé així: nosaltres vivim, però per causa de Jesús sempre estem a mercè de la mort, i així la vida de Jesús manifesta el seu esclat en la nostra carn mortal. D’aquesta manera, ni la mort no deixa mai de fer en nosaltres la seva obra, ni la vida, en vosaltres. L’Escriptura diu: «Em sento ple de fe, i per això he parlat». Nosaltres, doncs, que tenim el mateix Esperit de la fe, també ens sentim plens d’aquesta fe, i per això parlem, i sabem que aquell qui ressuscità Jesús, el Senyor, també ens ressuscitarà a nosaltres amb Jesús i ens portarà a la seva presència juntament amb vosaltres. Perquè tot això és en bé vostre; així la gràcia de Déu, que es multiplica a mesura que s’estén a molta gent, farà que sigui desbordant l’acció de gràcies a la seva glòria.<\/p><p class=\"fin\" id=\"m0x21\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m0x22\">Salm responsorial <span class=\"ref\">33, 2-9<\/span><\/h3><div class=\"pl\" id=\"m0x23\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Quan els pobres invoquen el Senyor, ell els escolta.<\/span><\/div><div class=\"pl\" id=\"m0x24\"><span class=\"l\">Beneiré el Senyor en tot moment,<\/span><span class=\"l\">tindré sempre als llavis la seva lloança.<\/span><span class=\"l\">La meva ànima es gloria en el Senyor;<\/span><span class=\"l\">se n’alegraran els humils quan ho sentin. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m0x25\"><span class=\"l\">Tots amb mi glorifiqueu el Senyor,<\/span><span class=\"l\">exalcem plegats el seu nom.<\/span><span class=\"l\">He cercat el Senyor i ell m’ha respost,<\/span><span class=\"l\">m’ha alliberat de l’angoixa que tenia. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m0x26\"><span class=\"l\">Alceu vers ell la mirada i sereu radiants,<\/span><span class=\"l\">i no haureu d’abaixar els ulls, avergonyits.<\/span><span class=\"l\">El Senyor escolta el pobre que l’invoca,<\/span><span class=\"l\">i el salva de tots els perills. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m0x27\"><span class=\"l\">Acampa l’àngel del Senyor<\/span><span class=\"l\">entorn dels seus fidels per protegir-los.<\/span><span class=\"l\">Tasteu i veureu que n’és, de bo, el Senyor;<\/span><span class=\"l\">feliç l’home que s’hi refugia! <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m0x28\">Al·leluia <span class=\"ref\">Mt 5, 10<\/span><\/h3><div class=\"pl\" id=\"m0x29\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m0x30\"><span class=\"l\">Feliços els perseguits pel fet de ser justos,<\/span><span class=\"l\">perquè d’ells és el Regne del cel. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m0x31\">Evangeli <span class=\"ref\">Jn 17, 11-19<\/span><\/h3><p class=\"lema\" id=\"m0x32\">No et demano que els treguis del món, sinó que els preservis del Maligne.<\/p><p class=\"pr\" id=\"m0x33\">Lectura de l’evangeli segons sant Joan:<\/p><p class=\"pr\" id=\"m0x34\">En aquell temps, Jesús alçà els ulls al cel i pregà dient: «Jo no em quedo més al món. Però ells s’hi queden, mentre que jo vinc a tu. Pare sant, guarda’ls en el teu nom, el nom que m’has donat, perquè siguin u com ho som nosaltres. Mentre era amb ells, jo els guardava en el teu nom, el que tu m’has donat. He vetllat per ells i no se n’ha perdut ni un de sol, fora del qui s’havia de perdre, perquè es complís el que diu l’Escriptura. Però ara vinc a tu, i mentre encara soc al món dic tot això, perquè ells tinguin també l’alegria que jo tinc, una alegria completa. Jo els he confiat la teva paraula, però ara el món els odia, perquè no són del món, com jo tampoc no en soc. No et demano que els treguis del món, sinó que els preservis del Maligne. Ells no són del món, com jo tampoc no en soc. Consagra’ls en la veritat, que és la teva paraula. Tal com tu m’has enviat al món, jo també els hi he enviat. I jo em consagro a mi mateix per ells, perquè ells també siguin consagrats en la veritat.<\/p><p class=\"fin\" id=\"m0x35\">Paraula del Senyor<\/p><div class=\"obien\" id=\"m0x36\">O bé<\/div><h3 class=\"rub\" id=\"m0x37\">Al·leluia <span class=\"ref\">Lc 23,46<\/span><\/h3><div class=\"pl\" id=\"m0x38\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m0x39\"><span class=\"l\">Pare, a les vostres mans confio el meu esperit. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m0x40\">Evangeli <span class=\"ref\">Jn 15,18-21<\/span><\/h3><p class=\"lema\" id=\"m0x41\">No sou del món, perquè jo us he escollit del món<\/p><p class=\"pr\" id=\"m0x42\">Lectura de l’evangeli segons sant Joan:<\/p><p class=\"pr\" id=\"m0x43\">En aquell temps, Jesús digué als seus deixebles: «Si el món us odia, tingueu present que m’ha odiat primer a mi que a vosaltres. Si fóssiu del món, el món us estimaria com a cosa seva. Però vosaltres no sou del món: jo us he escollit del món, i per això el món us odia. Recordeu allò que us he dit: «El criat no és més important que el seu amo.» Si m’han perseguit a mi, també us perseguiran a vosaltres. Si haguessin guardat la meva paraula, també guardarien la vostra. Però tot això us ho faran per causa del meu nom, ja que no coneixen aquell qui m’ha enviat.»<\/p><p class=\"fin\" id=\"m0x44\">Paraula del Senyor<\/p><h3 class=\"rub\" id=\"m0x45\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m0x46\"><span class=\"l\">Rebeu, Senyor, aquest sacrifici,<\/span><span class=\"l\">i feu que tot el que celebrem<\/span><span class=\"l\">en el memorial de la passió del vostre Fill,<\/span><span class=\"l\">per intercessió i per l’exemple dels Beats Màrtirs Claretians,<\/span><span class=\"l\">es faci vida en nosaltres.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div><div class=\"obien\" id=\"m0x47\">O bé<\/div><div class=\"pl\" id=\"m0x48\"><span class=\"l\">Que aquesta ofrena que us presentem, Senyor,<\/span><span class=\"l\">en la memòria dels Beats Màrtirs Claretians,<\/span><span class=\"l\">encengui en els nostres cors la flama perenne del vostre amor,<\/span><span class=\"l\">i ens disposi a rebre el premi<\/span><span class=\"l\">promès als que perseveren en la fe.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m0x49\">Antífona de comunió <span class=\"ref\">Rm 8,38-39<\/span><\/h3><div class=\"pl\" id=\"m0x50\"><span class=\"l\">Ni la mort ni la vida, ni res de l’univers creat<\/span><span class=\"l\">no ens podrà separar de l’amor Crist.<\/span><\/div><h3 class=\"rub\" id=\"m0x51\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m0x52\"><span class=\"l\">Alimentats amb el Cos i la Sang del vostre Fill,<\/span><span class=\"l\">us demanem, Senyor,<\/span><span class=\"l\">en la memòria dels Beats Màrtirs Claretians,<\/span><span class=\"l\">de romandre sempre en vós,<\/span><span class=\"l\">perseverar en el vostre amor,<\/span><span class=\"l\">viure de la vostra vida<\/span><span class=\"l\">i ser conduïts per la vostra mà.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div>", "chips": [["m0x1", "Entrada"], ["m0x3", "Col·lecta"], ["m0x6", "1a lectura"], ["m0x11", "Salm"], ["m0x31", "Evangeli"], ["m0x45", "Ofrenes"], ["m0x49", "Comunió"], ["m0x51", "Postcomunió"]], "color": "rojo", "fecha": "1 de febrer"}}, {"label": "22 de maig", "hours": [{"name": "Laudes", "tab": "Laudes", "html": "<p id=\"p232\" class=\"pr\"><span class=\"r\">Càntic de Zacaries, ant.<\/span> Qui m’estima, el meu Pare l’estimarà i vindrem a viure amb ell (T. P. Al·leluia).<\/p><h3 id=\"p233\">Oració<\/h3><p id=\"p234\" class=\"pr\">Senyor, vós heu suscitat en l’Església santa Joaquima de Vedruna, perquè eduqués cristianament la joventut i servís els malalts. Feu que en sapiguem imitar els exemples i posem la nostra vida al servei amorós dels nostres germans. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p233", "Oració"]]}, {"name": "Vespres", "tab": "Vespres", "html": "<p id=\"p236\" class=\"pr\"><span class=\"r\">Càntic de Maria, ant.<\/span> Proclameu les meravelles de Déu que derroca els poderosos del soli i exalça els humils (T. P. Al·leluia).<\/p>", "chips": []}], "kind": "fest", "date": [5, 22], "title": "Santa Joaquima de Vedruna, religiosa", "rank": "Memòria", "sub": [], "intro": "<p id=\"p229\" class=\"pr\">Santa Joaquima de Vedruna i de Mas va néixer a Barcelona el 16 d’abril de 1783. Fundà l’Institut de Germanes Carmelites de la Caritat l’any 1826. Va mantenir lligams d’amistat amb sant Antoni Maria Claret com queda palès en les cartes del Sant: «La vaig conèixer d’estudiant». «Ja fundadora, va voler que li tornés a examinar les Regles, primer essent jo sacerdot i després arquebisbe». Parlant de les Germanes Carmelites de la Caritat, diu: «Regna en elles l’esperit de pobresa evangèlica, d’oració i de caritat». El Bisbe de Vic els nomenà, com a director, el Pare Claret, el qual els donà exercicis espirituals, agilitzà l’aprovació reial i treballà en l’aprovació definitiva de llurs Constitucions. Després del sant fundador, el P. Esteve Sala es feu càrrec de l’acompanyament de les mateixes religioses. La Mare Joaquima morí a Barcelona el 28 d’agost de 1854. Fou canonitzada per Joan XXIII el 12 d’abril de 1959.<\/p><p id=\"p230\" class=\"pr rub\"><span class=\"r\">Comú de dones santes: per religiosos, per aquells que exerciren obres de misericòrdia o per educadors.<\/span><\/p>", "missa": {"title": "Santa Joaquima de Vedruna, religiosa", "html": "<p class=\"nota\" id=\"m1x0\">(Com al missal romà català) Comú de sants o de religiosos:<\/p><h3 class=\"rub\" id=\"m1x1\">Antífona de entrada <span class=\"ref\">cf. Pr 31, 30. 28<\/span><\/h3><div class=\"pl\" id=\"m1x2\"><span class=\"l\">La dona que venera el Senyor mereix de ser lloada.<\/span><span class=\"l\">Els fills van a felicitar-la. (T.P. Al·leluia)<\/span><\/div><h3 class=\"rub\" id=\"m1x3\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m1x4\"><span class=\"l\">Senyor,<\/span><span class=\"l\">vós heu suscitat en l’Església santa Joaquima de Vedruna<\/span><span class=\"l\">perquè eduqués cristianament la joventut i servís els malalts.<\/span><span class=\"l\">Feu que en sapiguem imitar els seus exemples<\/span><span class=\"l\">i posem la nostra vida al servei amorós dels nostres germans.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><p class=\"nota\" id=\"m1x5\">Poden emprar-se les lectures corresponents al dia; les del Comú de sants i santes: per a religiosos o les següents:<\/p><h3 class=\"rub\" id=\"m1x6\">Lectura primera<\/h3><p class=\"lema\" id=\"m1x7\">Fora del Temps Pasqual Pr 31, 10-13. 19-20. 30-31<\/p><p class=\"pr\" id=\"m1x8\">La dona que venera el Senyor mereix de ser lloada<\/p><p class=\"pr\" id=\"m1x9\">Lectura del llibre dels Proverbis:<\/p><div class=\"pl\" id=\"m1x10\"><span class=\"l\">Una dona forta, qui la trobarà?<\/span><span class=\"l\">És més preciosa que les perles.<\/span><span class=\"l\">El seu marit confia en ella:<\/span><span class=\"l\">no enyorarà cap més tresor;<\/span><span class=\"l\">en rebrà benestar i no malestar<\/span><span class=\"l\">tots els dies de la vida.<\/span><\/div><div class=\"pl\" id=\"m1x11\"><span class=\"l\">Ella es procura llana i lli,<\/span><span class=\"l\">i les seves mans treballen amb delit.<\/span><\/div><div class=\"pl\" id=\"m1x12\"><span class=\"l\">Les seves mans agafen el fus,<\/span><span class=\"l\">buida que buida la filosa.<\/span><\/div><div class=\"pl\" id=\"m1x13\"><span class=\"l\">Obre la mà als pobres,<\/span><span class=\"l\">l’allarga als necessitats.<\/span><\/div><div class=\"pl\" id=\"m1x14\"><span class=\"l\">L’encís és enganyós, la bellesa s’esvaeix;<\/span><span class=\"l\">la dona que venera el Senyor mereix de ser lloada.<\/span><\/div><div class=\"pl\" id=\"m1x15\"><span class=\"l\">Reconeixeu-li el fruit del seu treball:<\/span><span class=\"l\">per tot el que fa, rebrà pública lloança.<\/span><\/div><p class=\"fin\" id=\"m1x16\">Paraula de Déu<\/p><p class=\"pr\" id=\"m1x17\">En Temps Pasqual Ap 19, 1.5-9<\/p><p class=\"pr\" id=\"m1x18\">Feliços els invitats al banquet de noces de l’Anyell<\/p><p class=\"pr\" id=\"m1x19\">Lectura del llibre de l’Apocalipsi.<\/p><p class=\"pr\" id=\"m1x20\">Després d’això, vaig sentir al cel la veu forta d’una gran gentada que proclamava: «Al·leluia! La salvació, la glòria i el poder són del nostre Déu.»<\/p><p class=\"pr\" id=\"m1x21\">Després va sortir del tron una veu que exclamava: «Lloeu el nostre Déu, tots els seus servents, tots els qui el venereu, petits i grans.»<\/p><p class=\"pr\" id=\"m1x22\">Llavors vaig sentir la veu d’una gran gentada, que era com el bramul de les onades, com el retruny d’una tronada potent. I deien: «Al·leluia! El Senyor nostre, el Déu de l’univers, ha instaurat el seu Regne. Alegrem-nos-en i celebrem-ho, cantem la seva glòria. Ha arribat l’hora de les noces de l’Anyell, i la seva esposa ja està engalanada. Li ha estat concedit de vestir-se de lli blanc i resplendent, que són les bones obres del poble sant.<\/p><p class=\"pr\" id=\"m1x23\">Després un àngel em va dir: «Escriu: “Feliços els convidats al banquet de les noces de l’Anyell!”»<\/p><p class=\"fin\" id=\"m1x24\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m1x25\">Salm responsorial <span class=\"ref\">Sl 111, 1-2.-3-4.5-7a. 7b-8.9<\/span><\/h3><div class=\"pl\" id=\"m1x26\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Feliç l’home que venera el Senyor.<\/span><\/div><div class=\"pl\" id=\"m1x27\"><span class=\"l\">O bé: Al·leluia!<\/span><\/div><div class=\"pl\" id=\"m1x28\"><span class=\"l\">Feliç l’home que venera el Senyor<\/span><span class=\"l\">i estima de cor els seus preceptes!<\/span><span class=\"l\">La seva descendència serà gran al país,<\/span><span class=\"l\">serà beneït el llinatge dels justos. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m1x29\"><span class=\"l\">A casa seva hi ha riquesa i abundància,<\/span><span class=\"l\">la seva bondat dura per sempre.<\/span><span class=\"l\">L’home just, compassiu i benigne,<\/span><span class=\"l\">és, per als justos, llum que apunta en la fosca. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m1x30\"><span class=\"l\">Sortós l’home que presta de bon grat,<\/span><span class=\"l\">que disposa a consciència els seus afers.<\/span><span class=\"l\">El just no caurà mai<\/span><span class=\"l\">i deixarà un record inesborrable. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m1x31\"><span class=\"l\">Viu sense por de males noves,<\/span><span class=\"l\">se sent ferm confiant en el Senyor,<\/span><span class=\"l\">té el cor incommovible, res no tem<\/span><span class=\"l\">i a la fi veurà vençuts els enemics. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m1x32\"><span class=\"l\">Reparteix el que té, ho dona als pobres,<\/span><span class=\"l\">la seva bondat dura per sempre,<\/span><span class=\"l\">pot alçar el front amb dignitat. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m1x33\">Al·leluia <span class=\"ref\">Mt 11,25<\/span><\/h3><div class=\"pl\" id=\"m1x34\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m1x35\"><span class=\"l\">Us enalteixo, Pare, Senyor del cel i de la terra,<\/span><span class=\"l\">perquè heu revelat als senzills tot això<\/span><span class=\"l\">que heu amagat als savis i entesos. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m1x36\">Evangeli <span class=\"ref\">Mc 9, 34-37<\/span><\/h3><p class=\"lema\" id=\"m1x37\">Qui acull un d’aquests infants en nom meu, m’acull a mi<\/p><p class=\"pr\" id=\"m1x38\">Lectura de l’evangeli segons sant Marc:<\/p><p class=\"pr\" id=\"m1x39\">En aquell temps els deixebles callaven, perquè pel camí havien discutit quin d’ells era el més important.<\/p><p class=\"pr\" id=\"m1x40\">Aleshores s’assegué, va cridar els Dotze i els va dir: «Si algú vol ser el primer, que es faci el darrer de tots i el servidor de tots.»<
