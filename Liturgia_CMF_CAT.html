\/p><p class=\"pr\" id=\"m1x41\">Llavors va agafar un infant, el posà enmig d’ells, el prengué en braços i els digué: «Qui acull un d’aquests infants en nom meu, m’acull a mi, i qui m’acull a mi, no m’acull a mi, sinó el qui m’ha enviat.»<\/p><p class=\"fin\" id=\"m1x42\">Paraula del Senyor<\/p><h3 class=\"rub\" id=\"m1x43\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m1x44\"><span class=\"l\">Accepteu, Senyor, els dons que us presentem per celebrar<\/span><span class=\"l\">el memorial de l’amor del vostre Fill,<\/span><span class=\"l\">i concediu als qui participarem d’aquests misteris<\/span><span class=\"l\">que us estimem a vós per damunt de tot<\/span><span class=\"l\">i a tots els homes per amor vostre,<\/span><span class=\"l\">com ens va ensenyar a fer santa Joaquima de Vedruna.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m1x45\">Antífona de comunió <span class=\"ref\">Jn 15, 13<\/span><\/h3><div class=\"pl\" id=\"m1x46\"><span class=\"l\">Ningú no té un amor més gran<\/span><span class=\"l\">que el qui dona la vida pels seus amics. (T.P. Al·leluia)<\/span><\/div><h3 class=\"rub\" id=\"m1x47\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m1x48\"><span class=\"l\">Us preguem, Senyor,<\/span><span class=\"l\">que aquesta eucaristia<\/span><span class=\"l\">augmenti la vostra vida en nosaltres,<\/span><span class=\"l\">i que les nostres paraules i accions,<\/span><span class=\"l\">com les de santa Joaquima de Vedruna,<\/span><span class=\"l\">siguin expressió d’amor<\/span><span class=\"l\">i llum per als qui ens envolten.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div>", "chips": [["m1x1", "Entrada"], ["m1x3", "Col·lecta"], ["m1x6", "1a lectura"], ["m1x25", "Salm"], ["m1x36", "Evangeli"], ["m1x43", "Ofrenes"], ["m1x45", "Comunió"], ["m1x47", "Postcomunió"]], "color": "blanco", "fecha": "22 de maig"}}, {"label": "15 de juny", "hours": [{"name": "Laudes", "tab": "Laudes", "html": "<p id=\"p243\" class=\"pr\"><span class=\"r\">Càntic de Zacaries, ant.<\/span> Déu anuncia la pau al seu poble, als seus amics i als qui s’hi converteixen de cor.<\/p><h3 id=\"p244\">Oració<\/h3><p id=\"p245\" class=\"pr\">Senyor Déu nostre, que estimeu infinitament els homes i perdoneu tots els nostres mancaments: doneu-nos l’esperit d’amor i generositat, a fi que, alimentats i enfortits amb la santa Eucaristia, i a imitació de santa Maria Miquela, us descobrim en els més pobres i en els més necessitats de vostre ajut. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p244", "Oració"]]}, {"name": "Vespres", "tab": "Vespres", "html": "<p id=\"p247\" class=\"pr\"><span class=\"r\">Càntic de Maria, ant.<\/span> Que el nostre amor no sigui només de frases i paraules, sinó de fets i de veritat.<\/p>", "chips": []}], "kind": "fest", "date": [6, 15], "title": "Santa Maria Miquela del Santíssim Sagrament, verge", "rank": "Memòria", "sub": [], "intro": "<p id=\"p240\" class=\"pr\">Santa Maria Miquela Desmaissières i López de Dicastillo va néixer a Madrid el dia 1 de gener de 1809. L’any 1850, sant Antoni Maria Claret l’animà a lliurar-se plenament a l’obra començada de rehabilitació de les dones extraviades. Després, essent el seu director espiritual, aprovà i defensà el seu esperit d’abnegació. Li aconsellà, a més, que escrivís la seva autobiografia i que conreés l’amistat amb la reina Isabel II. Col·laborà amb ella en la fundació de la seva Congregació d’Adoratrius Esclaves del Santíssim Sagrament i de la Caritat (1856) i en l’aprovació de les seves Constitucions. Una amistat profunda uní sempre aquests dos grans sants. Seguint les orientacions de Claret, es lliurà a una missió heroica en favor dels germans i morí víctima de la pesta a València el 24 d’agost de 1865. Pius XI la beatificà el 7 de juny de 1925 i el mateix Pontífex la inscriví en el catàleg dels sants el 4 de març de 1934. El dia 14 de maig de 1964, Pau VI nomenà sant Antoni Maria Claret patró principal de l’Institut de les Adoratrius.<\/p><p id=\"p241\" class=\"pr rub\"><span class=\"r\">Comú de verges o de dones santes: per religiosos.<\/span><\/p>", "missa": {"title": "Santa Maria Miquela del Santíssim Sagrament, verge", "html": "<p class=\"nota\" id=\"m2x0\">Comú de verges o de sants religiosos<\/p><h3 class=\"rub\" id=\"m2x1\">Antífona d’introducció<\/h3><div class=\"pl\" id=\"m2x2\"><span class=\"l\">Alegrem-nos i omplim-nos de goig,<\/span><span class=\"l\">perquè el Senyor ha estimat aquesta verge santa i gloriosa.<\/span><\/div><h3 class=\"rub\" id=\"m2x3\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m2x4\"><span class=\"l\">Senyor Déu nostre<\/span><span class=\"l\">que estimeu infinitament els homes<\/span><span class=\"l\">i perdoneu tots els nostres mancaments:<\/span><span class=\"l\">doneu-nos l’esperit d’amor i generositat<\/span><span class=\"l\">a fi que, alimentats i enfortits amb la santa eucaristia,<\/span><span class=\"l\">i a imitació de santa Maria Miquela,<\/span><span class=\"l\">us descobrim en els més pobres<\/span><span class=\"l\">i en els més necessitats del vostre ajut.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><p class=\"nota\" id=\"m2x5\">Es poden escollir les lectures corresponents al dia; les del Comú de verges; les del Comú de sants i santes: per a religiosos; o les següents:<\/p><h3 class=\"rub\" id=\"m2x6\">Lectura primera <span class=\"ref\">1Jn 3, 14-18<\/span><\/h3><p class=\"lema\" id=\"m2x7\">També nosaltres hem de donar la vida pels germans<\/p><p class=\"pr\" id=\"m2x8\">Lectura de la primera carta de sant Joan:<\/p><p class=\"pr\" id=\"m2x9\">Germans: nosaltres sabem que hem passat de la mort a la vida, perquè estimem els germans. Qui no estima, continua mort. Tothom qui odia el seu germà és un assassí, i ja sabeu que cap assassí no té vida eterna dintre seu. Hem conegut l’amor pel fet que Jesucrist ha donat la seva vida per nosaltres. Per això, també nosaltres hem de donar la vida pels germans. Si algú que posseeix béns en aquest món veu el seu germà que passa necessitat i li tanca les entranyes, com pot habitar dintre d’ell l’amor de Déu?<\/p><p class=\"pr\" id=\"m2x10\">Fills meus, no estimem amb frases i paraules, sinó amb fets i de veritat.<\/p><p class=\"fin\" id=\"m2x11\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m2x12\">Salm responsorial <span class=\"ref\">Sal 22, 1-3a.3b-4.5.6<\/span><\/h3><div class=\"pl\" id=\"m2x13\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> El Senyor és el meu pastor<\/span><span class=\"l\">no em mancarà mai res.<\/span><\/div><div class=\"pl\" id=\"m2x14\"><span class=\"l\">El Senyor és el meu pastor, no em manca res,<\/span><span class=\"l\">em fa descansar en prats deliciosos;<\/span><span class=\"l\">em mena al repòs vora l’aigua, i allí em retorna.<\/span><span class=\"l\">Em guia pels camins segurs<\/span><span class=\"l\">per l’amor del seu nom. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m2x15\"><span class=\"l\">Ni quan passo per barrancs tenebrosos<\/span><span class=\"l\">no tinc por de res,<\/span><span class=\"l\">perquè us tinc vora meu;<\/span><span class=\"l\">la vostra vara de pastor<\/span><span class=\"l\">m’asserena i em conforta. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m2x16\"><span class=\"l\">Davant meu pareu taula vós mateix<\/span><span class=\"l\">i els enemics ho veuen;<\/span><span class=\"l\">m’heu ungit el cap amb perfums,<\/span><span class=\"l\">ompliu a vessar la meva copa. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m2x17\"><span class=\"l\">Oh sí! La vostra bondat i el vostre amor<\/span><span class=\"l\">m’acompanyen tota la vida,<\/span><span class=\"l\">i viuré anys i més anys<\/span><span class=\"l\">a la casa del Senyor. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m2x18\">Al·leluia <span class=\"ref\">Jn 6,54<\/span><\/h3><div class=\"pl\" id=\"m2x19\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m2x20\"><span class=\"l\">Qui menja la meva carn i beu la meva sang,<\/span><span class=\"l\">té vida eterna, i jo el ressuscitaré el darrer dia. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m2x21\">Evangeli <span class=\"ref\">Jn 6, 47-58<\/span><\/h3><p class=\"lema\" id=\"m2x22\">Els qui mengen aquest pa, viuran per sempre<\/p><p class=\"pr\" id=\"m2x23\">Lectura de l’evangeli segons sant Joan:<\/p><p class=\"pr\" id=\"m2x24\">En aquell temps, Jesús va dir als jueus: Us ho asseguro: els qui creuen tenen vida eterna. Jo soc el pa de vida. Els vostres pares van menjar el mannà en el desert, però van morir.<\/p><p class=\"pr\" id=\"m2x25\">Aquest, en canvi, és el pa que baixa del cel perquè el qui en mengi no mori. Jo soc el pa viu que ha baixat del cel. Qui menja aquest pa, viurà per sempre. I el pa que jo donaré és la meva carn per a la vida del món.<\/p><p class=\"pr\" id=\"m2x26\">Llavors els jueus es posaren a discutir entre ells. Deien: «Com pot donar-nos aquest la seva carn per a menjar?»<\/p><p class=\"pr\" id=\"m2x27\">Jesús els respongué: «Us ho ben asseguro: si no mengeu la carn del Fill de l’home i no beveu la seva sang, no teniu vida en vosaltres. Qui menja la meva carn i beu la meva sang, té vida eterna, i jo el ressuscitaré el darrer dia. La meva carn és veritable menjar i la meva sang és veritable beguda. Qui menja la meva carn i beu la meva sang, està en mi, i jo, en ell.<\/p><p class=\"pr\" id=\"m2x28\">A mi m’ha enviat el Pare que viu, i jo visc gràcies al Pare; igualment els qui em mengen a mi viuran gràcies a mi. Aquest és el pa que ha baixat del cel. No és com el que van menjar els vostres pares. Ells van morir, però els qui mengen aquest pa, viuran per sempre.»<\/p><p class=\"fin\" id=\"m2x29\">Paraula del Senyor<\/p><h3 class=\"rub\" id=\"m2x30\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m2x31\"><span class=\"l\">Senyor,<\/span><span class=\"l\">acolliu bondadosament aquestes ofrenes<\/span><span class=\"l\">que us presentem humilment en la festa de santa Maria Miquela:<\/span><span class=\"l\">I concediu-nos que, mentre celebrem aquest misteri lliures de tot pecat,<\/span><span class=\"l\">ens immolem nosaltres mateixos<\/span><span class=\"l\">com una víctima agradable a la vostra Majestat.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m2x32\">Antífona de comunió <span class=\"ref\">Jn 14, 21.23<\/span><\/h3><p class=\"pr\" id=\"m2x33\">El qui m’estima, el meu Pare l’estimarà i vindrem a fer estada en ell.<\/p><h3 class=\"rub\" id=\"m2x34\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m2x35\"><span class=\"l\">Avui que ens omple de goig la festa de santa Maria Miquela<\/span><span class=\"l\">i ens heu enfortit amb el pa del cel,<\/span><span class=\"l\">demanem a la vostra bondat<\/span><span class=\"l\">que ens abrandeu amb el foc del vostre amor<\/span><span class=\"l\">i ens feu viure sempre a la vostra presència.<\/span><\/div><p class=\"pr\" id=\"m2x36\">Per Crist Senyor nostre.<\/p>", "chips": [["m2x1", "Entrada"], ["m2x3", "Col·lecta"], ["m2x6", "1a lectura"], ["m2x12", "Salm"], ["m2x21", "Evangeli"], ["m2x30", "Ofrenes"], ["m2x32", "Comunió"], ["m2x34", "Postcomunió"]], "color": "blanco", "fecha": "15 de juny"}}, {"label": "Dissabte posterior al segon diumenge després de la Pentecosta", "hours": [{"name": "I Vespres", "tab": "I Vespres", "html": "<h3 id=\"p255\">Himne<\/h3><p id=\"p256\" class=\"v\">El caliu de la llar els fills convida<\/p><p id=\"p257\" class=\"v\">a respondre a la crida de l’amor,<\/p><p id=\"p258\" class=\"v\">que de la Mare vessa sense mida,<\/p><p id=\"p259\" class=\"v st\">sol·lícit i ablamat, de dins el cor.<\/p><p id=\"p260\" class=\"v\">La taula, el Pa llescat, el llum que els mostra,<\/p><p id=\"p261\" class=\"v\">tot traspua presència maternal.<\/p><p id=\"p262\" class=\"v\">Fa de bon seure, Mare, al costat vostre<\/p><p id=\"p263\" class=\"v st\">al caliu amorós de llar pairal.<\/p><p id=\"p264\" class=\"v\">Ara que l’hora baixa ens encomana<\/p><p id=\"p265\" class=\"v\">el dolç recolliment de l’esperit,<\/p><p id=\"p266\" class=\"v\">el cor us vol a dins per estadana<\/p><p id=\"p267\" class=\"v st\">que enceti la conversa amb l’Infinit.<\/p><p id=\"p268\" class=\"v\">L’amor del vostre Cor, Verge Maria,<\/p><p id=\"p269\" class=\"v\">de tan pur és perfecta caritat<\/p><p id=\"p270\" class=\"v\">que ens duu el Fill que el Pare sol tenia<\/p><p id=\"p271\" class=\"v st\">en simple i compartida eternitat.<\/p><p id=\"p272\" class=\"v\">En vós ara cerquem sa fesomia,<\/p><p id=\"p273\" class=\"v\">que ens mostri el que és el Pare en rostre humà.<\/p><p id=\"p274\" class=\"v\">Dins vostra llar busquem la companyia<\/p><p id=\"p275\" class=\"v st\">tan humana i tan divina del Germà.<\/p><p id=\"p276\" class=\"v\">Dem al Pare entranyable la lloança,<\/p><p id=\"p277\" class=\"v\">el qual junt amb el Fill i l’Esperit,<\/p><p id=\"p278\" class=\"v\">comparteix la perfecta benaurança<\/p><p id=\"p279\" class=\"v\">que brolla de llur ésser infinit.<\/p><div class=\"gap\"><\/div><p id=\"p281\" class=\"pr rub\"><span class=\"r\">Es pot cantar també algun dels cants següents:<\/span><\/p><div class=\"gap\"><\/div><p id=\"p283\" class=\"v\">Cor de Maria<\/p><p id=\"p284\" class=\"v\">de gràcia font:<\/p><p id=\"p285\" class=\"v\">cor de maria.<\/p><p id=\"p286\" class=\"v st\">salveu el món.<\/p><p id=\"p287\" class=\"v\">Mare estimada,<\/p><p id=\"p288\" class=\"v\">deu-nos entrada<\/p><p id=\"p289\" class=\"v\">dins vostre Cor:<\/p><p id=\"p290\" class=\"v\">rosa florida,<\/p><p id=\"p291\" class=\"v\">sol de la vida,<\/p><p id=\"p292\" class=\"v st\">cel de l’amor...<\/p><p id=\"p293\" class=\"v\">Del cel compendi,<\/p><p id=\"p294\" class=\"v\">d’amor incendi d’amor diví,<\/p><p id=\"p295\" class=\"v\">lliri en poncella<\/p><p id=\"p296\" class=\"v\">divina estrella<\/p><p id=\"p297\" class=\"v\">del dematí...<\/p><div class=\"gap\"><\/div><p id=\"p299\" class=\"v\">Mireu, benigna,<\/p><p id=\"p300\" class=\"v\">Verge Maria,<\/p><p id=\"p301\" class=\"v\">el vostre poble<\/p><p id=\"p302\" class=\"v\">que en vós confia.<\/p><p id=\"p303\" class=\"v\">Puix tant costàreu<\/p><p id=\"p304\" class=\"v\">al Redemptor:<\/p><p id=\"p305\" class=\"v\"><i>Guardeu-nos, Mare,<\/i><\/p><p id=\"p306\" class=\"v\"><i>dins vostre Cor.<\/i><\/p><div class=\"gap\"><\/div><p id=\"p308\" class=\"v\">Mar és la vida,<\/p><p id=\"p309\" class=\"v\">vós sou l’estrella<\/p><p id=\"p310\" class=\"v\">que al cel convida<\/p><p id=\"p311\" class=\"v\">amb sa llum bella.<\/p><p id=\"p312\" class=\"v\">Quan la tempesta<\/p><p id=\"p313\" class=\"v\">brami amb furor:<\/p><p id=\"p314\" class=\"v\"><i>Guardeu-nos, Mare,<\/i><\/p><p id=\"p315\" class=\"v\"><i>dins vostre Cor.<\/i><\/p><div class=\"gap\"><\/div><p id=\"p317\" class=\"v\">Estrella de nostre dia,<\/p><p id=\"p318\" class=\"v\">Jardí de nostres amors:<\/p><p id=\"p319\" class=\"v\"><i>Cor puríssim de Maria,<\/i><\/p><p id=\"p320\" class=\"v st\"><i>convertiu els pecadors<\/i>.<\/p><p id=\"p321\" class=\"v\">Terra verge no llaurada<\/p><p id=\"p322\" class=\"v\">que arrosà l’Esperit Sant,<\/p><p id=\"p323\" class=\"v\">amb tan cèlica rosada<\/p><p id=\"p324\" class=\"v\">quines flors hi naixeran!<\/p><p id=\"p325\" class=\"v\">La primera que hi floria<\/p><p id=\"p326\" class=\"v st\">terra i cel omple d’olors.<\/p><p id=\"p327\" class=\"v\">Sou del cel la via bella<\/p><p id=\"p328\" class=\"v\">per a on baixà el bon Déu,<\/p><p id=\"p329\" class=\"v\">remuntant després per ella<\/p><p id=\"p330\" class=\"v\">amb qui vulgui ser fill seu.<\/p><p id=\"p331\" class=\"v\">Oh del cel formosa Via,<\/p><p id=\"p332\" class=\"v st\">volem ser tos seguidors.<\/p><p id=\"p333\" class=\"v\">El vostre Cor, Verge Mare,<\/p><p id=\"p334\" class=\"v\">del bon Jesús fou el bres,<\/p><p id=\"p335\" class=\"v\">on el bressà l’Etern Pare<\/p><p id=\"p336\" class=\"v\">de l’amor dels dos corprès.<\/p><p id=\"p337\" class=\"v\">Vós vetlleu, quan Ell somnia,<\/p><p id=\"p338\" class=\"v st\">el somni de sos amors.<\/p><p id=\"p339\" class=\"v\">Del vostre Fill les memòries<\/p><p id=\"p340\" class=\"v\">en aqueix Cor les guardem,<\/p><p id=\"p341\" class=\"v\">rosari de vostres glòries,<\/p><p id=\"p342\" class=\"v\">que en vostra cel·la passeu;<\/p><p id=\"p343\" class=\"v\">repassar jo amb vós voldria<\/p><p id=\"p344\" class=\"v st\">vostres glòries i dolors.<\/p><p id=\"p345\" class=\"v\">Set espases us coronen,<\/p><p id=\"p346\" class=\"v\">set espases de pecat,<\/p><p id=\"p347\" class=\"v\">quina paga, oh Mare, us donen,<\/p><p id=\"p348\" class=\"v\">vostres fills que heu tant amat!<\/p><p id=\"p349\" class=\"v\">Jo també hi claví la mia<\/p><p id=\"p350\" class=\"v st\">fent-vos Mare de dolors!<\/p><p id=\"p351\" class=\"v\">Del de Jesús és l’albada<\/p><p id=\"p352\" class=\"v\">vostre Cor formós i bell,<\/p><p id=\"p353\" class=\"v\">d’aqueix cel mística entrada,<\/p><p id=\"p354\" class=\"v\">d’aqueix temple ric cancell.<\/p><p id=\"p355\" class=\"v\">En el vostre principia<\/p><p id=\"p356\" class=\"v st\">el gran riu dels seus amors.<\/p><p id=\"p357\" class=\"v\">Prou sentí la flama vostra<\/p><p id=\"p358\" class=\"v\">nostre sant Pare Claret,<\/p><p id=\"p359\" class=\"v\">quan com Font al món us mostra,<\/p><p id=\"p360\" class=\"v\">per calmar d’amor la set.<\/p><p id=\"p361\" class=\"v\">De la vostra Confraria<\/p><p id=\"p362\" class=\"v\">fa a sos fills propagadors.<\/p><div class=\"gap\"><\/div><p id=\"p364\" class=\"v st rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p365\" class=\"v st\"><span class=\"l\">Verge fecunda, Mare de l’Església,<\/span><span class=\"l\">flor pura de bellesa sobrehumana,<\/span><span class=\"l\">alegria de l’home que es lliura,<\/span><span class=\"l\">esperança del món que s’afanya.<\/span><span class=\"l e\"><\/span><span class=\"l\">Crescuda en l’amor humil i fort,<\/span><span class=\"l\">Mare de Déu, vestida de sol clar,<\/span><span class=\"l\">feliç perquè vencéreu la nostra mort<\/span><span class=\"l\">i ens oferiu la font de la vida.<\/span><span class=\"l e\"><\/span><span class=\"l\">Cor abrandat per la flama<\/span><span class=\"l\">inquieta de l’Esperit diví,<\/span><span class=\"l\">doneu llum als nostres ulls, i vesseu<\/span><span class=\"l\">amor que ens sostingui en el camí.<\/span><span class=\"l e\"><\/span><span class=\"l\">Cor que respireu en la glòria<\/span><span class=\"l\">del Senyor i en proclameu la grandesa,<\/span><span class=\"l\">feu que mai no s’apagui el vostre record<\/span><span class=\"l\">en els fills que anhelen la vostra puresa.<\/span><span class=\"l e\"><\/span><span class=\"l\">Oh Cor, amor dels qui cerquen<\/span><span class=\"l\">en Crist la veritat i el bon camí,<\/span><span class=\"l\">enceneu en l’amor els qui lluiten<\/span><span class=\"l\">per trobar la vida del vostre Fill.<\/span><span class=\"l e\"><\/span><span class=\"l\">Endinseu-nos en la vostra entranya joiosa,<\/span><span class=\"l\">banyeu-nos en la llum de l’Evangeli<\/span><span class=\"l\">i prolongueu en nosaltres la missió<\/span><span class=\"l\">joiosa de proclamar-lo al món sencer.<\/span><span class=\"l e\"><\/span><span class=\"l\">Glòria al Pare que viu en llum de glòria<\/span><span class=\"l\">i al Fill que nasqué de Mare verge,<\/span><span class=\"l\">i a l’Esperit fidel que amb la seva ombra<\/span><span class=\"l\">cobrí el vostre Cor mansuet i humil. Amén.<\/span><\/p><h3 id=\"p366\">Salmòdia<\/h3><p id=\"p367\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor derroca els poderosos del soli i exalça els humils.<\/p><h4 id=\"p368\">Salm 112<\/h4><p id=\"p369\" class=\"v st\"><span class=\"l\">Servents del Senyor, lloeu-lo,<\/span><span class=\"l\">lloeu el nom del Senyor.<\/span><span class=\"l\">Sigui beneït el nom del Senyor<\/span><span class=\"l\">ara i per tots els segles.<\/span><span class=\"l\">Des de la sortida fins a la posta del sol<\/span><span class=\"l\">lloeu el nom del Senyor.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor és excels als ulls de tots els pobles,<\/span><span class=\"l\">la seva glòria s’eleva més enllà del cel.<\/span><span class=\"l\">Qui és com el Senyor, el nostre Déu?<\/span><span class=\"l\">Té molt amunt el seu tron,<\/span><span class=\"l\">i des d’allí s’inclina<\/span><span class=\"l\">per veure el cel i la terra.<\/span><span class=\"l e\"><\/span><span class=\"l\">Aixeca de la pols el desvalgut,<\/span><span class=\"l\">treu el pobre de la cendra,<\/span><span class=\"l\">per asseure’l entre els poderosos,<\/span><span class=\"l\">els poderosos del seu poble.<\/span><span class=\"l\">La qui vivia estèril a casa,<\/span><span class=\"l\">la fa mare feliç amb els fills.<\/span><\/p><p id=\"p370\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor derroca els poderosos del soli i exalça els humils.<\/p><p id=\"p371\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p372\">Oració sàlmica<\/h4><p id=\"p373\" class=\"pr\">Senyor, que seieu en el vostre tron i us abaixeu a mirar el cel i la terra, vós us heu fixat en Maria, la vostra humil serventa, i l’heu feta mare feliç d’una multitud de fills, concediu als qui la reconeixem com a Mare, de dir-nos i ser de veritat fills del seu Cor. Per Crist Senyor nostre.<\/p><p id=\"p374\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor ha enviat el seu missatge a Maria i li ha manifestat la seva voluntat.<\/p><h4 id=\"p375\">Salm 147<\/h4><p id=\"p376\" class=\"v st\"><span class=\"l\">Glorifica el Senyor, Jerusalem,<\/span><span class=\"l\">Sió, canta lloances al teu Déu,<\/span><span class=\"l\">que assegura les teves portes<\/span><span class=\"l\">i beneeix dintre teu els teus fills,<\/span><span class=\"l\">manté la pau al teu territori<\/span><span class=\"l\">i et sacia amb la flor del blat.<\/span><span class=\"l e\"><\/span><span class=\"l\">Envia ordres a la terra,<\/span><span class=\"l\">i la seva paraula corre de pressa, no es detura.<\/span><span class=\"l\">Tira neu com flocs de llana,<\/span><span class=\"l\">escampa com cendra la gebrada;<\/span><span class=\"l e\"><\/span><span class=\"l\">llança el seu glaç com molles de pa,<\/span><span class=\"l\">si les aigües es gelen de tanta fredor,<\/span><span class=\"l\">dóna una ordre, i les fon tot seguit,<\/span><span class=\"l\">fa bufar els seus vents, i l’aigua s’escola.<\/span><span class=\"l e\"><\/span><span class=\"l\">Anuncia les seves paraules als fills de Jacob,<\/span><span class=\"l\">als fills d’Israel, els seus decrets i decisions.<\/span><span class=\"l\">No ha obrat així amb cap altre poble,<\/span><span class=\"l\">no els ha fet conèixer les seves decisions.<\/span><\/p><p id=\"p377\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor ha enviat el seu missatge a Maria i li ha manifestat la seva voluntat.<\/p><p id=\"p378\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p379\">Oració sàlmica<\/h4><p id=\"p380\" class=\"pr\">Oh Déu, que en la plenitud dels temps heu enviat el qui és la vostra Paraula, nascut d’una dona, ensenyeu-nos a acollir i guardar, com Ella, la vostra Paraula en el cor fins a convertir-nos en Evangeli de Déu. Per Crist Senyor nostre.<\/p><p id=\"p381\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor ha beneït Maria amb tota mena de benediccions dalt del cel; per ella hem rebut el fruit de la vida.<\/p><h4 id=\"p382\">Càntic Ef 1, 3-10<\/h4><p id=\"p383\" class=\"v st\"><span class=\"l\">Beneït sigui el Déu i Pare<\/span><span class=\"l\">de nostre Senyor Jesucrist,<\/span><span class=\"l\">que ens ha beneït en Crist<\/span><span class=\"l\">amb tota mena de benediccions espirituals<\/span><span class=\"l\">dalt del cel.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ens elegí en ell abans de crear el món,<\/span><span class=\"l\">perquè fóssim sants, irreprensibles als seus<\/span><span class=\"l\">ulls.<\/span><span class=\"l e\"><\/span><span class=\"l\">Per amor ens destinà a ser fills seus per Jesucrist,<\/span><span class=\"l\">segons la seva benèvola decisió,<\/span><span class=\"l\">que dóna lloança a la grandesa dels favors<\/span><span class=\"l\">que ens ha concedit en el seu Estimat.<\/span><span class=\"l e\"><\/span><span class=\"l\">En ell, hem estat rescatats<\/span><span class=\"l\">amb el preu de la seva sang.<\/span><span class=\"l\">Les nostres culpes han estat perdonades.<\/span><span class=\"l e\"><\/span><span class=\"l\">La riquesa dels favors de Déu<\/span><span class=\"l\">s’ha desbordat en nosaltres.<\/span><span class=\"l\">Ell ens ha concedit<\/span><span class=\"l\">tota aquesta saviesa i penetració que tenim.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ens ha fet conèixer el secret de la decisió<\/span><span class=\"l\">benèvola<\/span><span class=\"l\">que havia pres,<\/span><span class=\"l\">per executar-la quan els temps fossin madurs.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ha volgut unir en el Crist tot el món,<\/span><span class=\"l\">tant el del cel com el de la terra.<\/span><\/p><p id=\"p384\" class=\"pr\"><span class=\"r\">Ant.<\/span> El Senyor ha beneït Maria amb tota mena de benediccions dalt del cel; per ella hem rebut el fruit de la vida.<\/p><p id=\"p385\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p386\">Oració sàlmica<\/h4><p id=\"p387\" class=\"pr\">Beneït sigueu, Pare, Senyor del cel i de la terra, perquè heu revelat el misteri de la vostra voluntat als senzills; us demanem que el vostre Esperit, amb la col·laboració maternal de Maria, formi Crist en els nostres cors fins arribar a la plenitud de l’home perfecte. Per Crist Senyor nostre.<\/p><h3 id=\"p388\">Lectura breu<\/h3><p id=\"p389\" class=\"ref rub\"><span class=\"r\"><i>Ga 4, 4-5<\/i><\/span><\/p><p id=\"p390\" class=\"pr\">Quan el temps arribà a la seva plenitud, Déu envià el seu Fill, nascut d’una dona, nascut sota la Llei, per rescatar els qui vivien sota la Llei, perquè obtinguéssim ja la condició de fills.<\/p><h3 id=\"p391\">Responsori breu<\/h3><p id=\"p392\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Sou feliç, Verge Maria, perquè heu portat el Creador del món.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Sou feliç, Verge Maria, perquè heu portat el Creador del món.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Per vós hem rebut el fruit de la vida.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Perquè heu portat el Creador del món.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Glòria al Pare i al Fill i a l’Esperit Sant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Sou feliç, Verge Maria, perquè heu portat el Creador del món.<\/span><\/p><h3 id=\"p393\">Càntic de Maria<\/h3><p id=\"p394\" class=\"pr\"><span class=\"r\">Ant.<\/span> Feliç la Verge Maria que conservava en el seu cor la Paraula de Déu i la meditava.<\/p><p id=\"p395\" class=\"v st\"><span class=\"l\">La meva ànima magnifica el Senyor,<\/span><span class=\"l\">el meu esperit celebra el Déu que em salva,<\/span><span class=\"l\">perquè ha mirat la petitesa de la seva serventa.<\/span><span class=\"l e\"><\/span><span class=\"l\">Des d’ara totes les generacions<\/span><span class=\"l\">em diran benaurada,<\/span><span class=\"l\">perquè el Totpoderós obra en mi meravelles.<\/span><span class=\"l e\"><\/span><span class=\"l\">El seu nom és sant,<\/span><span class=\"l\">i l’amor que té als qui creuen en ell<\/span><span class=\"l\">s’estén de generació en generació.<\/span><span class=\"l e\"><\/span><span class=\"l\">Les obres del seu braç són potents:<\/span><span class=\"l\">dispersa els homes de cor altiu,<\/span><span class=\"l\">derroca els poderosos del soli<\/span><span class=\"l\">i exalça els humils.<\/span><span class=\"l\">Omple de béns els pobres,<\/span><span class=\"l\">i els rics se’n tornen sense res.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ha protegit Israel, el seu servent,<\/span><span class=\"l\">com ho havia promès als nostres pares;<\/span><span class=\"l\">s’ha recordat del seu amor a Abraham<\/span><span class=\"l\">i a la seva descendència per sempre.<\/span><\/p><p id=\"p396\" class=\"pr\"><span class=\"r\">Ant.<\/span> Feliç la Verge Maria que conservava en el seu cor la Paraula de Déu i la meditava.<\/p><h3 id=\"p397\">Pregàries<\/h3><p id=\"p398\" class=\"pr\">Cantem les meravelles de Déu Pare Totpoderós que ha volgut que totes les generacions proclamin la benaurança de la Verge Maria, la Mare del seu Fill i Mare de l’Església i supliquem-lo amb amor i confiança:<\/p><p id=\"p399\" class=\"c\"><i>Que la Mare del bell amor ens inflami de zel apostòlic.<\/i><\/p><p id=\"p400\" class=\"pr\">Vós que en fer de Maria la Mare del vostre Fill i Mare nostra, l’heu associada amb un lligam tan estret i indissoluble a l’obra de la salvació,<\/p><p id=\"p401\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu que acceptem plenament el vostre projecte de salvació i que amb amor filial acollim Maria com a Mare i Formadora nostra.<\/p><p id=\"p402\" class=\"pr\">Vós que vau escollir Maria, perquè medités en el seu cor les paraules del vostre Fill i fos la vostra serventa fidel,<\/p><p id=\"p403\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>per la seva intercessió feu-nos deixebles dòcils del vostre Fill i lleials servidors de l’Evangeli.<\/p><p id=\"p404\" class=\"pr\">Vós que vau enfortir Maria al peu de la Creu i l’omplíreu de goig immens en la resurrecció del vostre Fill,<\/p><p id=\"p405\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>sosteniu benignament la nostra esperança enmig de les contrarietats del ministeri apostòlic.<\/p><p id=\"p406\" class=\"pr\">Vós que heu volgut que la Immaculada Verge Maria compartís en cos i ànima la glòria del vostre Fill i vetllés maternalment pels germans que encara peregrinen per la terra,<\/p><p id=\"p407\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>forgeu-nos en la fornal del seu Amor i feu que ens dediquem de ple a portar els homes pel camí de la salvació.<\/p><p id=\"p408\" class=\"pr\">Vós, que omplíreu d’un amor universal el Cor Immaculat de Maria i la féreu Mare de misericòrdia,<\/p><p id=\"p409\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu que els pecadors experimentin la seva protecció maternal i que els germans difunts siguin conduïts a la plenitud de la vida eterna.<\/p><p id=\"p410\" class=\"pr rub\"><span class=\"r\">Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.<\/span><\/p><p id=\"p411\" class=\"pr\">Pare nostre.<\/p><h3 id=\"p412\">Oració<\/h3><p id=\"p413\" class=\"pr\">Senyor Déu nostre: Vós heu escollit la Verge Santa Maria com a Mare del vostre Fill i Mare nostra. Feu que ens consagrem de tal manera al seu Cor maternal, que Crist es formi plenament en nosaltres i el seu amor ens faci sentir amb tota la força la urgència d’anunciar l’Evangeli a tothom. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p255", "Himne"], ["p366", "Salmòdia"], ["p388", "Lectura breu"], ["p391", "Responsori breu"], ["p393", "Càntic de Maria"], ["p397", "Pregàries"], ["p412", "Oració"]]}, {"name": "Invitatori", "tab": "Invitatori", "html": "<p id=\"p415\" class=\"pr\"><span class=\"r\">Ant.<\/span> Aclamem el Senyor en aquesta festa del Cor Immaculat de la Verge Maria.<\/p><p id=\"p416\" class=\"pr rub\"><span class=\"r\">El salm invitatori, com a l’Ordinari.<\/span><\/p>", "chips": []}, {"name": "Ofici de lectura", "tab": "Ofici de lectura", "html": "<h3 id=\"p418\">Himne<\/h3><p id=\"p419\" class=\"v st\"><span class=\"l\">Turgent d'amor la ment deleja l'hora<\/span><span class=\"l\">feliç, en què gaudeixi del delit<\/span><span class=\"l\">de sentir vora seu el Cor que enyora,<\/span><span class=\"l\">com un foc que s'ablami dins el pit.<\/span><\/p><p id=\"p420\" class=\"v st\"><span class=\"l\">Vol sentir ben a prop la meravella<\/span><span class=\"l\">d'aquell Cor que de tan Immaculat<\/span><span class=\"l\">és compendi de Mare i de Donzella<\/span><span class=\"l\">per voler de l'Amor que l'ha abrandat.<\/span><\/p><p id=\"p421\" class=\"v st\"><span class=\"l\">Ens abelleix l'encís, Verge Maria,<\/span><span class=\"l\">del vostre Cor Matern, que dintre seu<\/span><span class=\"l\">acceptà, per amor, la gosadia<\/span><span class=\"l\">de ser Mare dels homes i de Déu.<\/span><\/p><p id=\"p422\" class=\"v st\"><span class=\"l\">Mare de tota humana criatura,<\/span><span class=\"l\">Mare del reu i Mare del botxí,<\/span><span class=\"l\">Mare del just de vida recta i pura,<\/span><span class=\"l\">Mare del traïdor i de l'assassí.<\/span><\/p><p id=\"p423\" class=\"v st\"><span class=\"l\">Així porteu, oh Mare adolorida,<\/span><span class=\"l\">el Cor transit de dols i d'amargor,<\/span><span class=\"l\">cada cop que la mort combat la vida<\/span><span class=\"l\">dins l'ànima de l'home pecador.<\/span><\/p><p id=\"p424\" class=\"v st\"><span class=\"l\">Nosaltres volem dar-vos l'alegria<\/span><span class=\"l\">de qui viu al recer del vostre Cor.<\/span><span class=\"l\">Assistiu-nos, oh Mare, nit i dia,<\/span><span class=\"l\">infonent-nos la força de l'amor.<\/span><\/p><p id=\"p425\" class=\"v st\"><span class=\"l\">Lloem el Pare, font de tota vida,<\/span><span class=\"l\">i el Fill, que ens ha salvat, i l'Esperit,<\/span><span class=\"l\">que ens ha donat la joia compartida<\/span><span class=\"l\">que fóssim fills del Cor, que s'ha escollit.<\/span><\/p><p id=\"p426\" class=\"v st rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p427\" class=\"v st\"><span class=\"l\">Quan se n’anà Jesús, vós us quedàreu<\/span><span class=\"l\">al capdavant de la fe i de la pregària,<\/span><span class=\"l\">encoratjant la unió dels deixebles<\/span><span class=\"l\">i esperant l’Esperit, que és Vida i Amor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Continueu, oh Mare, avui viva en l’Església,<\/span><span class=\"l\">pendent de qui mena ferm el timó,<\/span><span class=\"l\">esperant, amatent, amb els qui esperen,<\/span><span class=\"l\">l’arribada joiosa de Crist Redemptor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Fóreu, Maria, el primer apòstol<\/span><span class=\"l\">que lliurà al món el Senyor.<\/span><span class=\"l\">Li ensenyàreu a donar-se sempre a tothom,<\/span><span class=\"l\">i d’ell aprenguéreu la immensitat del seu amor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Sempre estiguéreu, Mare, amb Crist<\/span><span class=\"l\">i així fóreu qui més el conegué;<\/span><span class=\"l\">avui sou per a tothom la porta oberta<\/span><span class=\"l\">que mena a Crist, camí i salvació.<\/span><span class=\"l e\"><\/span><span class=\"l\">Glòria al Pare, glòria al Fill,<\/span><span class=\"l\">glòria a l’Esperit Sant,<\/span><span class=\"l\">pels segles dels segles. Amén.<\/span><\/p><h3 id=\"p428\">Salmòdia<\/h3><p id=\"p429\" class=\"pr rub\"><span class=\"r\">Quan a l’invitatori s’ha dit el salm 23, aquí es diu el salm 94.<\/span><\/p><p id=\"p430\" class=\"pr\"><span class=\"r\">Ant.<\/span> Maria, de mans innocents i de cor pur, ha rebut la benedicció del Senyor.<\/p><h4 id=\"p431\">Salm 23<\/h4><p id=\"p432\" class=\"v st\"><span class=\"l\">És del Senyor la terra i tot el que s’hi mou,<\/span><span class=\"l\">el món i tots els qui l’habiten.<\/span><span class=\"l\">Li ha posat els fonaments dins els mars,<\/span><span class=\"l\">i les bases, a les fonts dels rius.<\/span><span class=\"l e\"><\/span><span class=\"l\">Qui pot pujar a la muntanya del Senyor?<\/span><span class=\"l\">Qui pot estar-se al recinte sagrat?<\/span><span class=\"l\">El qui té el cor sincer i les mans sense culpa,<\/span><span class=\"l\">que no confia en els déus falsos,<\/span><span class=\"l\">ni jura per ganes d’enganyar.<\/span><span class=\"l e\"><\/span><span class=\"l\">Rebrà benediccions del Senyor,<\/span><span class=\"l\">rebrà els favors del Déu que salva.<\/span><span class=\"l\">Aquests són els qui vénen a buscar-vos, Senyor,<\/span><span class=\"l\">per veure-us de cara, Déu de Jacob.<\/span><span class=\"l e\"><\/span><span class=\"l\">Portals, alceu les llindes;<\/span><span class=\"l\">engrandiu-vos, portalades eternes,<\/span><span class=\"l\">que ha d’entrar el rei de la glòria!<\/span><span class=\"l e\"><\/span><span class=\"l\">Qui és aquest rei de la glòria?<\/span><span class=\"l\">És el Senyor, valent i poderós,<\/span><span class=\"l\">és el Senyor, victoriós en el combat.<\/span><span class=\"l e\"><\/span><span class=\"l\">Portals, alceu les llindes,<\/span><span class=\"l\">engrandiu-vos, portalades eternes,<\/span><span class=\"l\">que ha d’entrar el rei de la glòria!<\/span><span class=\"l e\"><\/span><span class=\"l\">Qui és aquest rei de la glòria?<\/span><span class=\"l\">És el Senyor, Déu de l’univers,<\/span><span class=\"l\">és aquest el rei de la glòria.<\/span><\/p><p id=\"p433\" class=\"pr\"><span class=\"r\">Ant.<\/span> Maria, de mans innocents i de cor pur, ha rebut la benedicció del Senyor.<\/p><h4 id=\"p434\">Oració sàlmica<\/h4><p id=\"p435\" class=\"pr\">Pare sant, que us manifesteu a l’home de mans pures i de cor innocent, netegeu de tota idolatria el cor dels vostres fidels, i enceneu-hi el foc d'amor que abrusà contínuament el Cor de Maria, per poder viure a casa vostra i merèixer la vostra benedicció. Per Crist Senyor nostre.<\/p><p id=\"p436\" class=\"pr rub\"><span class=\"r\">Quan es recita el salm 94, es pot dir l’oració següent:<\/span><\/p><p id=\"p437\" class=\"pr\">Senyor, que sou un Déu gran, feu que escoltem avui la vostra veu i, fidels a la vostra llei, reconeguem els vostres camins i entrem en el vostre repòs. Per Crist Senyor nostre.<\/p><p id=\"p438\" class=\"pr\"><span class=\"r\">Ant.<\/span> Déu vos salve, Maria, plena de gràcia; el Senyor és amb vós.<\/p><h4 id=\"p439\">Salm 45<\/h4><p id=\"p440\" class=\"v st\"><span class=\"l\">Déu ens és un castell de refugi,<\/span><span class=\"l\">una defensa ferma en hores de perill.<\/span><span class=\"l\">No temem res, quan se somou la terra,<\/span><span class=\"l\">quan les muntanyes s’enfonsen dins el mar.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ja poden bramular i escumejar les onades,<\/span><span class=\"l\">i al seu embat, estremir-se les muntanyes:<\/span><span class=\"l\">El Senyor de l’univers és amb nosaltres,<\/span><span class=\"l\">la nostra muralla és el Déu de Jacob.<\/span><span class=\"l e\"><\/span><span class=\"l\">Els braços d’un riu alegren la ciutat de Déu,<\/span><span class=\"l\">la mansió més sagrada de l’Altíssim.<\/span><span class=\"l e\"><\/span><span class=\"l\">Déu hi és al mig, es manté ferma.<\/span><span class=\"l\">Déu la defensa abans que apunti el dia;<\/span><span class=\"l\">si s’amotinen les nacions i es revolten els reis,<\/span><span class=\"l\">fa esclatar el seu tro, i la terra es desfà.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor de l’univers és amb nosaltres,<\/span><span class=\"l\">la nostra muralla és el Déu de Jacob.<\/span><span class=\"l e\"><\/span><span class=\"l\">Veniu, mireu les gestes del Senyor,<\/span><span class=\"l\">les meravelles que fa sobre la terra.<\/span><span class=\"l\">A tot arreu ha fet cessar els combats,<\/span><span class=\"l\">ha trencat els arcs i trossejat les llances,<\/span><span class=\"l\">ha tirat al foc els escuts.<\/span><span class=\"l e\"><\/span><span class=\"l\">Desistiu, reconeixeu que jo sóc Déu;<\/span><span class=\"l\">jo domino els pobles, domino el món.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor de l’univers és amb nosaltres,<\/span><span class=\"l\">la nostra muralla és el Déu de Jacob.<\/span><\/p><p id=\"p441\" class=\"pr\"><span class=\"r\">Ant.<\/span> Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.<\/p><h4 id=\"p442\">Oració sàlmica<\/h4><p id=\"p443\" class=\"pr\">Oh Déu, refugi i fortalesa nostra, que volguéreu que el vostre Fill, per la força de l'Esperit Sant, s'encarnés en el si de Maria, feu que ella afermi la nostra confiança en el seguiment del vostre Fill. Que viu i regna pels segles dels segles.<\/p><p id=\"p444\" class=\"pr\"><span class=\"r\">Ant.<\/span> Amb totes les generacions us proclamem benaurada, Verge Maria.<\/p><h4 id=\"p445\">Salm 86<\/h4><p id=\"p446\" class=\"v st\"><span class=\"l\">El Senyor té el palau a la muntanya santa,<\/span><span class=\"l\">i estima més els portals de Sió<\/span><span class=\"l\">que totes les viles de Jacob.<\/span><span class=\"l e\"><\/span><span class=\"l\">S’han dit de tu, ciutat de Déu,<\/span><span class=\"l\">oracles gloriosos:<\/span><span class=\"l\">«Compto Egipte i Babilònia<\/span><span class=\"l\">entre els fidels que em coneixen.<\/span><span class=\"l\">A Filistea, a Tir i a Etiòpia els dic:<\/span><span class=\"l\">“Fills de Sió.”»<\/span><span class=\"l e\"><\/span><span class=\"l\">Diuen d’ella:<\/span><span class=\"l\">«És l’Altíssim mateix qui l’ha fundada;<\/span><span class=\"l\">aquest i aquell altre són fills de Sió.»<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor va escrivint al registre dels pobles:<\/span><span class=\"l\">«Fill de Sió.»<\/span><span class=\"l\">I els cantors i els dansaires responen:<\/span><span class=\"l\">«Ciutadans de Sió.»<\/span><\/p><p id=\"p447\" class=\"pr\"><span class=\"r\">Ant.<\/span> Amb totes les generacions us proclamem benaurada, Verge Maria.<\/p><h4 id=\"p448\">Oració sàlmica<\/h4><p id=\"p449\" class=\"pr\">Pare de tots els homes, que heu volgut que el vostre Fill a la creu ens donés Maria com a Mare, us demanem que lliurant-nos a Ella per cooperar amb el seu servei maternal en la missió apostòlica, creixi el nombre dels vostres fills de tota raça i nació. Per Crist, Senyor nostre.<\/p><p id=\"p450\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> L’Altíssim ha consagrat la vostra estada.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Perquè heu portat en el vostre si el Creador de l’univers.<\/span><\/p><h3 id=\"p451\">Primera lectura<\/h3><p id=\"p452\" class=\"src v\">Del llibre dels Proverbis 8, 22-36<\/p><h4 class=\"rt\" id=\"p453\">Maria, tron de la saviesa<\/h4><p id=\"p454\" class=\"pr\">Això diu la Saviesa de Déu: El Senyor em posseïa al començament, abans de les seves obres, des de sempre. Em va formar a l'inici del temps, des de l'origen, des del primer moment de la terra. Em va infantar quan els oceans no existien ni brollaven les fonts d'aigua viva. Abans que s'assentessin les muntanyes, abans dels turons, ja m'havia infantat, quan encara no havia fet l'amplària de la terra, el primer grapat de fang dels continents. Jo hi era quan desplegava la volta del cel i marcava un horitzó a l'oceà; quan a dalt penjava els núvols i contenia les aigües abismals; quan imposava un límit a la mar que les aigües no han de traspassar, i quan senyalava els fonaments de la terra. Jo era al seu costat com un mestre d'obres i feia les seves delícies cada dia, jugant davant d'ell sense parar. Jugava per la terra que ell havia creat, i m'era deliciosa la companyia dels homes. \"Escolteu-me, doncs, fills: feliços els qui segueixen els meus camins! Accepteu de formar-vos i posareu seny; no ho refuséssiu pas. Feliç l’home que m'escolta, que vetlla cada dia al meu portal vigilant el llindar de casa meva! Qui em troba, troba la vida, i el Senyor li concedeix el seu favor, però el qui no em troba, es perjudica ell mateix. Els qui m'odien, estimen la mort.\"<\/p><h4 id=\"p455\">Responsori<\/h4><p id=\"p456\" class=\"ref rub\"><span class=\"r\"><i>So 3, 14. 15<\/i><\/span><\/p><p id=\"p457\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Alegra’t, filla de Sió; crida de goig, Israel; alegra’t i exulta de tot cor, Jerusalem.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Alegra’t, filla de Sió; crida de goig, Israel; alegra’t i exulta de tot cor, Jerusalem.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> El Senyor serà el rei d’Israel enmig teu.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Alegra’t i exulta de tot cor, Jerusalem.<\/span><\/p><h3 id=\"p458\">Segona lectura<\/h3><p id=\"p459\" class=\"src v\"><span class=\"l\">De les cartes de sant Antoni Maria Claret, bisbe i fundador<\/span><span class=\"l\">Escritos espirituales, BAC, Madrid 1985, pàgines 497-500 i 506<\/span><\/p><h4 class=\"rt\" id=\"p460\">El Cor de Maria, temple de l’Esperit Sant<\/h4><p id=\"p461\" class=\"pr\">Acabo de rebre la vostra carta tan estimada en la qual em demaneu que us digui alguna cosa per tal de créixer cada dia més en la devoció al Cor Immaculat de Maria. Poc em podíeu demanar res que m'agradés tant. Prou voldria que tots els cristians tinguessin fam i set d'aquesta devoció. Estimeu, amic meu, estimeu Maria, estimeu-la força. És propi de Déu donar a cada criatura les gràcies segons el fi a què la destina. I com que Déu va destinar Maria perquè fos mare, filla i esposa del mateix Déu, i mare de l'home, podeu comptar quin cor no li devia donar i amb quines gràcies no el devia ornar! En el Cor de Maria cal fixar-se en dues coses: el cor material i el cor formal, que representa l'amor i la voluntat. El Cor de Maria reuneix aquestes propietats i moltes d'altres. El Cor de Maria no solament fou membre viu de Jesucrist per la fe i la caritat, sinó també origen i deu d'on brollà la seva humanitat. El Cor de Maria fou temple de l'Esperit Sant; oi més que temple: puix que de la sang preciosíssima que brolla d'aquest Cor Immaculat l'Esperit Sant formà la humanitat santíssima en les puríssimes i virginals entranyes de Maria en el gran misteri de l'Encarnació. El Cor de Maria ha estat l’òrgan de totes les virtuts en grau heroic, i singularment de l’amor envers Déu i envers els homes. El Cor de Maria —encara avui— és un cor viu, animat i sublimat en el cim més alt de la glòria. El Cor de Maria és el tron on són dispensades totes les gràcies i misericòrdies. Per això, amic meu, en Maria, després de Jesús, hem de posar tota la nostra confiança i esperança de la nostra eterna salvació. Feliç el qui invoca Maria amb confiança: assolirà el perdó dels seus pecats, per molts i greus que siguin, obtindrà la gràcia i finalment la glòria del cel.<\/p><h4 id=\"p462\">Responsori<\/h4><p id=\"p463\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Sou feliç, Verge Maria, i digna de tota lloança, perquè per la fe i l’amor formàreu Crist en el vostre Cor. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Sou feliç, Verge Maria, i digna de tota lloança, perquè per la fe i l’amor formàreu Crist en el vostre Cor. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Sou feliç, Verge Maria, que portàreu el Fill del Pare etern.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre.<\/span><\/p><p id=\"p464\" class=\"pr rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p465\" class=\"pr rub\"><span class=\"l\"><span class=\"r\"><i>De l’exhortació apostòlica Marialis cultus del papa Pau VI, sobre el culte a la Verge Maria<\/i><\/span><\/span><span class=\"l\"><span class=\"r\"><i>Números 17 i 18<\/i><\/span><\/span><\/p><h4 class=\"rt\" id=\"p466\">Maria és la Verge que escolta i prega<\/h4><p id=\"p467\" class=\"pr\">Maria és la Verge oient que acull amb fe la Paraula de Déu; fe que va ser la premissa i el camí per a la maternitat divina, perquè, com diu perspicaçment sant Agustí, \"la benaurada Verge Maria va concebre creient el Jesús que va donar a llum creient\"; en rebre de l'àngel la resposta al seu dubte (cf. Lc 1,34-37), \"ella, plena de fe, concebent el Crist abans en el cor que en el cos, va dir: 'Sóc l’esclava del Senyor, que es faci en mi segons la teva paraula' (Lc 1,38)\"; fe que li fou motiu de felicitat i de seguretat en l’acompliment de la promesa: \"Feliç tu que has cregut que s'acomplirà allò que t'ha estat dit de part del Senyor\" (Lc 1, 45); fe amb la qual ella, protagonista i testimoni singular de l'encarnació, recordava els esdeveniments de la infantesa del Crist i els conservava al fons del seu cor (cf. Lc 2,19-51 ). Això és el que fa l’Església quan, sobretot en la Sagrada Escriptura, escolta la paraula de Déu, l'acull, la proclama i la venera, i la dóna als fidels del Crist com a pa de vida i amb la seva llum escateix els signes dels temps i interpreta i viu els esdeveniments humans. Maria és, després, Verge orant. Això es veu en la visitació feta a la mare del precursor. Formula expressions de lloança a Déu i d'humilitat, de fe i d'esperança: són les que ens proporciona el càntic del Magnificat (cf. Lc 1, 46-55), que és la principal pregària de Maria, l’himne propi del temps messiànic. Maria es mostra Verge orant també a Canà, on, en manifestar al seu Fill, amb una delicada súplica, una necessitat únicament temporal, obtingué un efecte de la gràcia: que Jesús fent el primer dels seus \"signes\", confirmés els deixebles en la fe en ell (cf. Jo 2,1-12). També, al final de la seva vida, Maria és presentada com a Verge orant: \"S'aplicaven unànimement a l’oració amb les dones i Maria, la mare de Jesús i amb els germans d'ell\" (Ac 1,14); Maria orant en l'Església naixent i en la de sempre, perquè ara, assumpta al cel, no ha abandonat la seva missió d'intercedir i de salvar. L'Església és també Verge orant, perquè cada dia presenta al Pare les necessitats dels seus fills i \"lloa incessantment el Senyor i intercedeix per la salvació de tot el món\".<\/p><h4 id=\"p468\">Responsori<\/h4><p id=\"p469\" class=\"ref rub\"><span class=\"r\"><i>Lc 1, 45-46; cf. Sl 65, 16<\/i><\/span><\/p><p id=\"p470\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Sou feliç, Verge Maria, perquè heu cregut, ja que allò que el Senyor us ha dit es complirà. Maria digué: La meva ànima magnifica el Senyor.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Sou feliç, Verge Maria, perquè heu cregut, ja que allò que el Senyor us ha dit es complirà. Maria digué: La meva ànima magnifica el Senyor.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Veniu a escoltar, i us contaré el que Déu ha fet per mi.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> La meva ànima magnifica el Senyor.<\/span><\/p><p id=\"p471\" class=\"pr rub\"><span class=\"r\">Es diu l’himne Te Deum. L’oració, com a Laudes.<\/span><\/p><div class=\"gap\"><\/div><p id=\"p473\" class=\"v\">Oh Déu, us lloem.<\/p><p id=\"p474\" class=\"v\">Senyor, us glorifiquem.<\/p><p id=\"p475\" class=\"v\">Oh Pare etern, tota la terra us venera.<\/p><p id=\"p476\" class=\"v\">Tots els àngels, els querubins i els serafins<\/p><p id=\"p477\" class=\"v\">no cessen mai d'aclamar-vos:<\/p><p id=\"p478\" class=\"v\">Sant, sant, sant és el Senyor,<\/p><p id=\"p479\" class=\"v\">Déu de l'univers<\/p><p id=\"p480\" class=\"v\">El cel i la terra són plens<\/p><p id=\"p481\" class=\"v\">de la majestat de la vostra glòria.<\/p><p id=\"p482\" class=\"v\">El cor gloriós dels Apòstols,<\/p><p id=\"p483\" class=\"v\">l'estol venerable dels profetes,<\/p><p id=\"p484\" class=\"v\">l'exèrcit esclatant dels màrtirs<\/p><p id=\"p485\" class=\"v\">us donen lloança.<\/p><p id=\"p486\" class=\"v\"><span class=\"l\">Per tota la terra la santa Església us proclama:<\/span><span class=\"l\">Pare d'immensa majestat,<\/span><\/p><p id=\"p487\" class=\"v\">Fill únic veritable i adorable,<\/p><p id=\"p488\" class=\"v\">Esperit Sant, protector.<\/p><p id=\"p489\" class=\"v\">Oh Crist, vós sou el Rei de la Glòria. <\/p><p id=\"p490\" class=\"v\">Vós sou el Fill etern del Pare.<\/p><p id=\"p491\" class=\"v\">Vós, en fer-vos home per alliberar els homes,<\/p><p id=\"p492\" class=\"v\">no defugireu d'entrar en el si de la Verge.<\/p><p id=\"p493\" class=\"v\">Vós, vençut l'agulló de la mort,<\/p><p id=\"p494\" class=\"v\">obríreu als creients el Regne del cel.<\/p><p id=\"p495\" class=\"v\">Vós seieu a la dreta de Déu<\/p><p id=\"p496\" class=\"v\">en la glòria del Pare.<\/p><p id=\"p497\" class=\"v\">I creiem que un dia retornareu com a jutge.<\/p><p id=\"p498\" class=\"v\">Us demanem, doncs, que socorregueu<\/p><p id=\"p499\" class=\"v\">els vostres servents que heu redimit<\/p><p id=\"p500\" class=\"v\">amb la vostra sang preciosa.<\/p><p id=\"p501\" class=\"v\">Feu que siguem comptats<\/p><p id=\"p502\" class=\"v\">en el nombre dels vostres sants,<\/p><p id=\"p503\" class=\"v\">en la glòria eterna.<\/p><p id=\"p504\" class=\"v\">Senyor, salveu el vostre poble<\/p><p id=\"p505\" class=\"v\">i beneïu la vostra heretat.<\/p><p id=\"p506\" class=\"v\">Sigueu el seu pastor,<\/p><p id=\"p507\" class=\"v\">preneu-lo sempre als vostres braços.<\/p><p id=\"p508\" class=\"v\">Us beneïm dia rera dia<\/p><p id=\"p509\" class=\"v\">i lloem per sempre el vostre nom Senyor,<\/p><p id=\"p510\" class=\"v\">digneu-vos guardar-nos avui lliures de pecat.<\/p><p id=\"p511\" class=\"v\">Senyor, tingueu pietat de nosaltres,<\/p><p id=\"p512\" class=\"v\">tingueu pietat.<\/p><p id=\"p513\" class=\"v\">Que el vostre amor, Senyor, no ens deixi mai;<\/p><p id=\"p514\" class=\"v\">aquesta és l'esperança que posem en vós.<\/p><p id=\"p515\" class=\"v\">En vós, Senyor, m'emparo,<\/p><p id=\"p516\" class=\"v\">que mai no quedi confós.<\/p>", "chips": [["p418", "Himne"], ["p428", "Salmòdia"], ["p451", "Primera lectura"], ["p458", "Segona lectura"]]}, {"name": "Laudes", "tab": "Laudes", "html": "<h3 id=\"p518\">Himne<\/h3><p id=\"p519\" class=\"v\">Ja pregona l’alegria<\/p><p id=\"p520\" class=\"v\">de la primera claror<\/p><p id=\"p521\" class=\"v\">el jorn del Cor de Maria,<\/p><p id=\"p522\" class=\"v st\">que s’estén a l’horitzó.<\/p><p id=\"p523\" class=\"v\">La fe lloï la grandesa<\/p><p id=\"p524\" class=\"v\">d’aquell Cor Immaculat,<\/p><p id=\"p525\" class=\"v\">que amb l’amor de sa puresa<\/p><p id=\"p526\" class=\"v st\">abelleix la Trinitat.<\/p><p id=\"p527\" class=\"v\">Cor de Verge, Cor d’Esposa,<\/p><p id=\"p528\" class=\"v\">Cor de Mare, Cor Tresor<\/p><p id=\"p529\" class=\"v\">de tota virtut desclosa<\/p><p id=\"p530\" class=\"v st\">per l’ardència de l’amor.<\/p><p id=\"p531\" class=\"v\">Cor estremit d’alegria<\/p><p id=\"p532\" class=\"v\">en concebre el Fill diví,<\/p><p id=\"p533\" class=\"v\">quan la Paraula prenia<\/p><p id=\"p534\" class=\"v st\">natura humana en el si.<\/p><p id=\"p535\" class=\"v\">Cor amarat de dolcesa<\/p><p id=\"p536\" class=\"v\">i de goig celestial,<\/p><p id=\"p537\" class=\"v\">quan, malgrat tanta pobresa,<\/p><p id=\"p538\" class=\"v st\">naixia el Fill al portal.<\/p><p id=\"p539\" class=\"v\">Cor immers en l’agonia,<\/p><p id=\"p540\" class=\"v\">Cor transit, crucificat,<\/p><p id=\"p541\" class=\"v\">quan el Fill en creu moria,<\/p><p id=\"p542\" class=\"v st\">redimint la humanitat. <\/p><p id=\"p543\" class=\"v\">Cor nimbat d’excelsa glòria,<\/p><p id=\"p544\" class=\"v\">xop de gaudi i de conhort,<\/p><p id=\"p545\" class=\"v\">en rebre el Fill la victòria<\/p><p id=\"p546\" class=\"v st\">sobre el sepulcre i la mort.<\/p><p id=\"p547\" class=\"v\">Per sempre lloança al Pare,<\/p><p id=\"p548\" class=\"v\">lloança al Fill i a l’Amor<\/p><p id=\"p549\" class=\"v\">que ha dat a la nostra Mare<\/p><p id=\"p550\" class=\"v st\">l’excelsitud del seu Cor.<\/p><p id=\"p551\" class=\"v st rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p552\" class=\"v\">Oh Verge Maria<\/p><p id=\"p553\" class=\"v\">Mare del bon Déu!<\/p><p id=\"p554\" class=\"v\">Vulgueu abrigar-me<\/p><p id=\"p555\" class=\"v\">amb vostre mantell!<\/p><p id=\"p556\" class=\"v\">Quin consol, oh Mare<\/p><p id=\"p557\" class=\"v\">d’estar prop de vós!<\/p><p id=\"p558\" class=\"v\">Feu que visqui sempre<\/p><p id=\"p559\" class=\"v st\">dins el vostre Cor!<\/p><p id=\"p560\" class=\"v\">Mostreu-nos, oh Mare,<\/p><p id=\"p561\" class=\"v\">el camí del cel,<\/p><p id=\"p562\" class=\"v\">i enmig dels mals passos,<\/p><p id=\"p563\" class=\"v\">Verge, no ens deixeu.<\/p><p id=\"p564\" class=\"v\">D’ànimes perdudes<\/p><p id=\"p565\" class=\"v\">el món està ple;<\/p><p id=\"p566\" class=\"v\">no el perdéssim, Mare,<\/p><p id=\"p567\" class=\"v st\">el camí del cel!<\/p><p id=\"p568\" class=\"v\">Sigui Jesús, Mare,<\/p><p id=\"p569\" class=\"v\">sempre el nostre Rei,<\/p><p id=\"p570\" class=\"v\">i el seu Evangeli<\/p><p id=\"p571\" class=\"v\">sigui nostra Llei.<\/p><p id=\"p572\" class=\"v\">Volem per senyera<\/p><p id=\"p573\" class=\"v\">la divina Creu;<\/p><p id=\"p574\" class=\"v\">i per llum i guia<\/p><p id=\"p575\" class=\"v st\">nostra santa fe.<\/p><p id=\"p576\" class=\"v st\">Oh Verge Maria ...<\/p><p id=\"p577\" class=\"v st rub obe\"><span class=\"r\">O bé<\/span><\/p><p id=\"p578\" class=\"v st\"><span class=\"l\">Verge plena de gràcia, mare dels vivents,<\/span><span class=\"l\">beneïda pels segles més que totes les mares.<\/span><span class=\"l\">Coberta per l’ombra fecunda de l’Esperit,<\/span><span class=\"l\">engendreu en el vostre si la llum que il·lumina el món.<\/span><span class=\"l e\"><\/span><span class=\"l\">El vostre Cor escolta la Paraula de vida,<\/span><span class=\"l\">la conserva en les estances profundes de la sang<\/span><span class=\"l\">i la medita sempre amb amor i tendresa.<\/span><span class=\"l\">La fe us feu benaurada, Mare feliç del Verb.<\/span><span class=\"l e\"><\/span><span class=\"l\">Pobra i humil esclava del Senyor de la glòria,<\/span><span class=\"l\">abrandada en el foc de la font divina,<\/span><span class=\"l\">precediu l’Església, pelegrina cap al Pare,<\/span><span class=\"l\">en la fe, en l’esperança i en l’amor invencible.<\/span><span class=\"l e\"><\/span><span class=\"l\">Al costat de l’arbre de la creu redemptora,<\/span><span class=\"l\">mentre el fruit sant del vostre ventre agonitza<\/span><span class=\"l\">i accepteu el suplici de l’espasa punyent<\/span><span class=\"l\">que us travessa l’ànima, ens preneu per fills.<\/span><span class=\"l e\"><\/span><span class=\"l\">Formàreu els Apòstols amb la vostra pregària assídua<\/span><span class=\"l\">per ser llum del món enmig dels homes.<\/span><span class=\"l\">Formeu-nos, els vostres fills, en la fornal ardent<\/span><span class=\"l\">del vostre si florit, ja ple de glòria.<\/span><span class=\"l e\"><\/span><span class=\"l\">Avui, amb goig radiant, els vostres fills celebrem<\/span><span class=\"l\">l’amor de Déu Pare, del Fill i de l’Esperit,<\/span><span class=\"l\">que ompliren de glòria el vostre Cor sagrat<\/span><span class=\"l\">i l’omplen de glòria per segles infinits. Amén.<\/span><\/p><h3 id=\"p579\">Salmòdia<\/h3><p id=\"p580\" class=\"pr\"><span class=\"r\">Ant.<\/span> L’amor que em teniu val més que la vida, per això els meus llavis us lloaran.<\/p><h4 id=\"p581\">Salm 62, 2-9<\/h4><p id=\"p582\" class=\"v st\"><span class=\"l\">Vós, Senyor, sou el meu Déu; jo us cerco.<\/span><span class=\"l\">Tot jo tinc set de vós,<\/span><span class=\"l\">per vós es desviu el meu cor,<\/span><span class=\"l\">com terra eixuta, sense una gota d’aigua.<\/span><span class=\"l e\"><\/span><span class=\"l\">Jo us contemplava al vostre santuari<\/span><span class=\"l\">quan us veia gloriós i poderós.<\/span><span class=\"l\">L’amor que em teniu val més que la vida;<\/span><span class=\"l\">per això els meus llavis us lloaran.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que tota la vida us pugui beneir<\/span><span class=\"l\">i alçar les mans lloant el vostre nom.<\/span><span class=\"l\">Saciat del bo i millor,<\/span><span class=\"l\">us lloaré amb el goig als llavis.<\/span><span class=\"l e\"><\/span><span class=\"l\">Quan des del llit us recordo,<\/span><span class=\"l\">passo les nits pensant en vós,<\/span><span class=\"l\">perquè vós m’heu ajudat,<\/span><span class=\"l\">i sóc feliç sota les vostres ales.<\/span><span class=\"l e\"><\/span><span class=\"l\">La meva ànima s’ha enamorat de vós,<\/span><span class=\"l\">em sosté la vostra mà.<\/span><\/p><p id=\"p583\" class=\"pr\"><span class=\"r\">Ant.<\/span> L’amor que em teniu val més que la vida, per això els meus llavis us lloaran.<\/p><p id=\"p584\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p585\">Oració sàlmica<\/h4><p id=\"p586\" class=\"pr\">La nostra ànima té set de vós, Senyor, com terra eixuta i sense aigua; feu que comprenguem que els nostres anhels s’han fet realitat en Maria, la vostra humil serventa, exalçada al cel al costat del vostre Fill Jesucrist. Ell, que viu i regna pels segles dels segles.<\/p><p id=\"p587\" class=\"pr\"><span class=\"r\">Ant.<\/span> Maria, santa i humil de cor, beneeix el Senyor amb totes les criatures de la terra.<\/p><h4 id=\"p588\">Càntic Dn 3, 57-88.56<\/h4><p id=\"p589\" class=\"v st\"><span class=\"l\">Beneïu el Senyor, totes les criatures,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l\">Beneïu-lo, àngels del Senyor,<\/span><span class=\"l\">beneïu, cels, el Senyor.<\/span><span class=\"l\">Beneïu el Senyor, aigües de l’espai,<\/span><span class=\"l\">beneïu-lo, estols del Senyor.<\/span><span class=\"l\">Beneïu el Senyor, sol i lluna,<\/span><span class=\"l\">beneïu-lo, estrelles del cel.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïu el Senyor, pluges i rosades,<\/span><span class=\"l\">beneïu-lo, tots els vents.<\/span><span class=\"l\">Beneïu el Senyor, foc i calor,<\/span><span class=\"l\">beneïu-lo, freds i gelades.<\/span><span class=\"l\">Beneïu el Senyor, rosades i gebre,<\/span><span class=\"l\">beneïu-lo, glaç i freds.<\/span><span class=\"l\">Beneïu el Senyor, neus i geleres,<\/span><span class=\"l\">beneïu-lo, dies i nits.<\/span><span class=\"l\">Beneïu el Senyor, llum i tenebres,<\/span><span class=\"l\">beneïu-lo, núvols i llamps.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que la terra beneeixi el Senyor,<\/span><span class=\"l\">que li canti lloances per sempre.<\/span><span class=\"l\">Beneïu el Senyor, muntanyes i turons,<\/span><span class=\"l\">vegetació de la terra, beneeix-lo.<\/span><span class=\"l\">Beneïu, fonts, el Senyor, beneïu-lo, rius i mars.<\/span><span class=\"l\">Beneïu el Senyor, peixos i monstres marins,<\/span><span class=\"l\">beneïu-lo, tots els ocells.<\/span><span class=\"l\">Beneïu el Senyor, feres i ramats,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïu el Senyor, tots els homes,<\/span><span class=\"l\">beneeix-lo, poble d’Israel.<\/span><span class=\"l\">Beneïu-lo, sacerdots del Senyor,<\/span><span class=\"l\">beneïu-lo, servents del Senyor.<\/span><span class=\"l\">Beneïu el Senyor, sants i humils de cor,<\/span><span class=\"l\">ànimes i esperits dels justos, beneïu-lo.<\/span><span class=\"l\">Beneïu el Senyor, Hananies, Azaries i Misael,<\/span><span class=\"l\">canteu-li lloances per sempre.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneïm el Pare i el Fill amb l’Esperit Sant,<\/span><span class=\"l\">cantem-li lloances per sempre.<\/span><span class=\"l\">Sou beneït, Senyor, al firmament del cel.<\/span><span class=\"l\">Glòria i lloança per sempre.<\/span><\/p><p id=\"p590\" class=\"pr\"><span class=\"r\">Ant.<\/span> Maria, santa i humil de cor, beneeix el Senyor amb totes les criatures de la terra.<\/p><p id=\"p591\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p592\">Oració sàlmica<\/h4><p id=\"p593\" class=\"pr\">Us lloem i beneïm, Senyor Déu nostre, perquè ens heu omplert de vida i d’esperança en el vostre Fill Jesucrist: ensenyeu-nos, per intercessió de Maria, a veure-us a vós en totes les coses i totes les coses en vós, per cantar la vostra lloança pels segles dels segles.<\/p><p id=\"p594\" class=\"pr rub\"><span class=\"r\">A l’acabament d’aquest càntic no es diu Glòria al Pare.<\/span><\/p><p id=\"p595\" class=\"pr\"><span class=\"r\">Ant.<\/span> Cantem avui al Senyor un càntic nou, perquè el Senyor ha coronat de triomf Maria, la seva humil serventa.<\/p><h4 id=\"p596\">Salm 149<\/h4><p id=\"p597\" class=\"v st\"><span class=\"l\">Canteu al Senyor un càntic nou,<\/span><span class=\"l\">canteu les seves lloances davant dels qui l’estimen.<\/span><span class=\"l\">Se sent feliç Israel del qui l’ha creat,<\/span><span class=\"l\">s’alegren del seu rei els fills de Sió.<\/span><span class=\"l e\"><\/span><span class=\"l\">Lloen el seu nom, el lloen tot dansant,<\/span><span class=\"l\">acompanyen els seus cants<\/span><\/p><p id=\"p598\" class=\"v st\"><span class=\"l\">amb els tambors i les<\/span><span class=\"l\">cítares.<\/span><span class=\"l\">Perquè el Senyor estima el seu poble,<\/span><span class=\"l\">coronarà de triomf els humils.<\/span><span class=\"l e\"><\/span><span class=\"l\">Els fidels celebren la seva glòria,<\/span><span class=\"l\">des dels seus rengles aclamen plens de goig;<\/span><span class=\"l\">mentre els seus llavis glorifiquen Déu,<\/span><span class=\"l\">tenen a les mans espases de dos talls,<\/span><span class=\"l e\"><\/span><span class=\"l\">per fer justícia entre els pobles,<\/span><span class=\"l\">per reprendre i castigar les nacions,<\/span><span class=\"l\">encadenant els seus reis,<\/span><span class=\"l\">emmanillant els poderosos.<\/span><span class=\"l e\"><\/span><span class=\"l\">Executar la sentència que està escrita<\/span><span class=\"l\">és la glòria reservada als qui l’estimen.<\/span><\/p><p id=\"p599\" class=\"pr\"><span class=\"r\">Ant.<\/span> Cantem avui al Senyor un càntic nou, perquè el Senyor ha coronat de triomf Maria, la seva humil serventa.<\/p><p id=\"p600\" class=\"pr rub\"><span class=\"r\">Després d’un moment de silenci, es pot concloure amb l’oració següent.<\/span><\/p><h4 id=\"p601\">Oració sàlmica<\/h4><p id=\"p602\" class=\"pr\">Senyor Déu, creador i alliberador nostre: us donem gràcies, perquè heu enriquit Maria amb un cor savi i dòcil, nou i humil, ferm i disposat a suportar l’espasa de dolor i a esperar, plena de fe, la resurrecció del vostre Fill. Ell, que viu i regna pels segles dels segles.<\/p><h3 id=\"p603\">Lectura breu<\/h3><p id=\"p604\" class=\"ref rub\"><span class=\"r\"><i>He 11, 11-12<\/i><\/span><\/p><p id=\"p605\" class=\"pr\">Gràcies a la fe, també Sara, que era estèril, va obtenir la capacitat de fundar un llinatge, tot i que li havia passat l’edat; és que va posar la confiança en el qui havia fet la promesa. Per això, d’un sol home, Abraham, que ja era a les portes de la mort, en nasqué una descendència tan nombrosa com les estrelles del cel i com els grans de sorra de la vora de la mar.<\/p><h3 id=\"p606\">Responsori breu<\/h3><p id=\"p607\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Que la paraula de Crist tingui estada entre vosaltres en tota la seva riquesa. Feliços els qui la guarden.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Que la paraula de Crist tingui estada entre vosaltres en tota la seva riquesa. Feliços els qui la guarden.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> És la Paraula de la fe que prediquem.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Feliços els qui la guarden.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Glòria al Pare i al Fill i a l’Esperit Sant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Que la paraula de Crist tingui estada entre vosaltres en tota la seva riquesa. Feliços els qui la guarden.<\/span><\/p><h3 id=\"p608\">Càntic de Zacaries<\/h3><p id=\"p609\" class=\"pr\"><span class=\"r\">Ant.<\/span> Sou feliç, Verge Maria, perquè heu cregut; però feliços també els qui escolten la paraula de Déu i la guarden.<\/p><p id=\"p610\" class=\"v st\"><span class=\"l\">Beneït sigui el Senyor, Déu d’Israel,<\/span><span class=\"l\">ha visitat el seu poble i l’ha redimit.<\/span><span class=\"l\">Fa que s’aixequi un salvador poderós<\/span><span class=\"l\">a la casa de David el seu servent,<\/span><span class=\"l\">com ho havia anunciat de temps antic,<\/span><span class=\"l\">per boca dels seus sants profetes.<\/span><span class=\"l e\"><\/span><span class=\"l\">Així ens salva, alliberant-nos dels enemics,<\/span><span class=\"l\">de les mans dels qui ens volen mal,<\/span><span class=\"l\">mogut per l’amor que el fa fidel als nostres pares,<\/span><span class=\"l\">i pel record de l’Aliança santa,<\/span><span class=\"l\">que jurà al nostre pare Abraham,<\/span><span class=\"l e\"><\/span><span class=\"l\">prometent de concedir-nos que, sense por,<\/span><span class=\"l\">lliures dels enemics, li donem culte<\/span><span class=\"l\">amb santedat i justícia tota la vida.<\/span><span class=\"l e\"><\/span><span class=\"l\">I a tu, infant, et diran profeta de l’Altíssim,<\/span><span class=\"l\">perquè aniràs al davant del Senyor<\/span><span class=\"l\">a preparar els seus camins.<\/span><span class=\"l e\"><\/span><span class=\"l\">Faràs saber al poble que li ve la salvació,<\/span><span class=\"l\">el perdó dels seus pecats,<\/span><span class=\"l\">per l’amor entranyable del nostre Déu.<\/span><span class=\"l e\"><\/span><span class=\"l\">Perquè ens estima, ens visitarà un Sol<\/span><span class=\"l\">que ve del cel,<\/span><span class=\"l\">per il·luminar els qui viuen a la fosca,<\/span><span class=\"l\">a les ombres de la mort,<\/span><span class=\"l\">i guiar els nostres passos per camins de pau.<\/span><\/p><p id=\"p611\" class=\"pr\"><span class=\"r\">Ant.<\/span> Sou feliç, Verge Maria, perquè heu cregut; però feliços també els qui escolten la paraula de Déu i la guarden.<\/p><h3 id=\"p612\">Pregàries<\/h3><p id=\"p613\" class=\"pr\">En celebrar amb goig aquesta festa, elevem, per intercessió del Cor de Maria, les nostres súpliques al Pare, perquè en la nostra vida i ministeri siguem veritables fills del Cor Immaculat de Maria, i diguem-li:<\/p><p id=\"p614\" class=\"c\"><i>Escolteu la nostra pregària.<\/i><\/p><p id=\"p615\" class=\"pr\">Vós que heu donat a Maria un cor sense taca,<\/p><p id=\"p616\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>netegeu-nos de tota culpa i feu que ens allunyem sempre de qualsevol iniquitat.<\/p><p id=\"p617\" class=\"pr\">Vós que per l’Esperit Sant vau consagrar Maria perquè fos Mare del vostre Fill,<\/p><p id=\"p618\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu que esmercem tota la nostra vida en el seu servei.<\/p><p id=\"p619\" class=\"pr\">Vós que heu escollit Maria com a Arca del Verb Etern,<\/p><p id=\"p620\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>concediu-nos de guardar i de meditar la vostra Paraula en el nostre cor.<\/p><p id=\"p621\" class=\"pr\">Vós que vau voler que el vostre Fill, clavat a la creu, ens donés Maria per Mare,<\/p><p id=\"p622\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>feu-nos la gràcia de ser autèntics fills seus en l’anunci del vostre Regne.<\/p><p id=\"p623\" class=\"pr\">Vós volguéreu que Maria estigués entre els apòstols el dia de la Pentecosta,<\/p><p id=\"p624\" class=\"pr\"><span class=\"r\">—<\/span><span class=\"tb\"><\/span>infoneu-nos l’Esperit Sant i renoveu-nos perquè anunciem el vostre Regne a tots els pobles.<\/p><p id=\"p625\" class=\"pr rub\"><span class=\"r\">Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.<\/span><\/p><p id=\"p626\" class=\"pr\">Pare nostre.<\/p><h3 id=\"p627\">Oració<\/h3><p id=\"p628\" class=\"pr\">Senyor Déu nostre: Vós heu escollit la Verge Santa Maria com a Mare del vostre Fill i Mare nostra. Feu que ens consagrem de tal manera al seu Cor maternal, que Crist es formi plenament en nosaltres i el seu amor ens faci sentir amb tota la força la urgència d’anunciar l’Evangeli a tothom. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p518", "Himne"], ["p579", "Salmòdia"], ["p603", "Lectura breu"], ["p606", "Responsori breu"], ["p608", "Càntic de Zacaries"], ["p612", "Pregàries"], ["p627", "Oració"]]}, {"name": "Hora d’entre dia", "tab": "Hora d’entre dia", "html": "<p id=\"p630\" class=\"pr rub\"><span class=\"r\">Es diuen els salms graduals de la salmòdia complementària. Els salms 121 i 126, que ja s’empren a les II Vespres, es poden substituir pels salms 128 i 130, respectivament.<\/span><\/p><h3 id=\"p631\">Tèrcia<\/h3><h4 id=\"p632\">Himne<\/h4><p id=\"p633\" class=\"v st\"><span class=\"l\">Salve, Mare virginal,<\/span><span class=\"l\">promesa, assoliment, fruïció.<\/span><span class=\"l\">Sou la plena floració<\/span><span class=\"l\">d’una gràcia maternal.<\/span><span class=\"l\">Sou tota cor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Aquesta és la Verge que escolta,<\/span><span class=\"l\">feta de silenci i de fe.<\/span><span class=\"l\">El seu amor en les ombres fou<\/span><span class=\"l\">espurna per a la seva ment,<\/span><span class=\"l\">llanterna per al seu peu.<\/span><span class=\"l e\"><\/span><span class=\"l\">Aquesta és la Verge que prega,<\/span><span class=\"l\">crit d’un món sense veu.<\/span><span class=\"l\">El seu amor la fa portaveu<\/span><span class=\"l\">del dolor més punyent,<\/span><span class=\"l\">de la set més gran de Déu.<\/span><span class=\"l e\"><\/span><span class=\"l\">Aquesta és la Mare que ofereix,<\/span><span class=\"l\">rica en generositat.<\/span><span class=\"l\">El seu amor fa íntims<\/span><span class=\"l\">el clam més exigent<\/span><span class=\"l\">i el lliurament més agosarat.<\/span><span class=\"l e\"><\/span><span class=\"l\">Glòria en silenci i en cor<\/span><span class=\"l\">al Pare, al Fill, a la Unció.<\/span><span class=\"l\">Glòria a l’amor en acció.<\/span><span class=\"l\">On és el nostre tresor<\/span><span class=\"l\">és el nostre cor.<\/span><\/p><p id=\"p634\" class=\"pr\"><span class=\"r\">Ant.<\/span> Tots pregaven Déu de tot cor perquè mirés el seu poble.<\/p><h4 id=\"p635\">Lectura breu<\/h4><p id=\"p636\" class=\"ref rub\"><span class=\"r\"><i>Ac 1, 12-14<\/i><\/span><\/p><p id=\"p637\" class=\"pr\">Els Apòstols se’n tornaren a Jerusalem de la muntanya de les Oliveres, que és vora mateix de Jerusalem, a la distància que era permès de recórrer durant el repòs del dissabte. Entraren a la ciutat i pujaren a la sala on s’allotjaven. Eren Pere, Joan, Jaume, Andreu, Felip, Tomàs, Bartomeu, Mateu, Jaume, fill d’Alfeu, Simó, el Zelador, i Judes, fill de Jaume. Tots unànimement assistien sens falta a les hores de pregària, amb les dones, amb Maria, la mare de Jesús, i els parents d’ell.<\/p><p id=\"p638\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Maria lloa el Senyor sense parar.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Intercedeix per la salvació de tot el món.<\/span><\/p><p id=\"p639\" class=\"pr rub\"><span class=\"r\">L’oració, com a Laudes.<\/span><\/p><h3 id=\"p640\">Sexta<\/h3><p id=\"p641\" class=\"pr rub\"><span class=\"r\">L’himne, com a Tèrcia.<\/span><\/p><p id=\"p642\" class=\"pr\"><span class=\"r\">Ant.<\/span> Visiteu-nos, veniu a salvar-nos, ara i per tots els segles.<\/p><h4 id=\"p643\">Lectura breu<\/h4><p id=\"p644\" class=\"ref rub\"><span class=\"r\"><i>Ef 3, 17-19<\/i><\/span><\/p><p id=\"p645\" class=\"pr\">Que, per la fe, faci habitar el Crist en els vostres cors, i així, arrelats i fonamentats en l’amor, sigueu capaços de comprendre, amb tot el poble sant, l’amplada i la llargada, l’alçada i la profunditat de l’amor de Crist; que arribeu a conèixer aquest amor que sobrepassa tot coneixement i, així, entreu del tot a la plenitud de Déu.<\/p><p id=\"p646\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Feliç vós, Maria, que heu cregut.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Allò que el Senyor us ha fet saber es complirà.<\/span><\/p><p id=\"p647\" class=\"pr rub\"><span class=\"r\">L’oració, com a Laudes.<\/span><\/p><h3 id=\"p648\">Nona<\/h3><p id=\"p649\" class=\"pr rub\"><span class=\"r\">L’himne, com a Tèrcia.<\/span><\/p><p id=\"p650\" class=\"pr\"><span class=\"r\">Ant.<\/span> Maria, Mare del bell amor, del temor, de la saviesa i de la santa esperança.<\/p><h4 id=\"p651\">Lectura breu<\/h4><p id=\"p652\" class=\"ref rub\"><span class=\"r\"><i>Jdt 13, 18-19<\/i><\/span><\/p><p id=\"p653\" class=\"pr\">Filla, que el Déu altíssim et beneeixi entre totes les dones de la terra. Beneït sigui el Senyor, creador del cel i de la terra, que guià el teu cop contra el cap del general enemic. Els qui recordin aquesta gesta de Déu mai no perdran la confiança que inspires.<\/p><p id=\"p654\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Maria ha rebut la benedicció del Senyor.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> I la misericòrdia de Déu, el seu Salvador.<\/span><\/p><p id=\"p655\" class=\"pr rub\"><span class=\"r\">L’oració, com a Laudes.<\/span><\/p>", "chips": [["p631", "Tèrcia"], ["p640", "Sexta"], ["p648", "Nona"]]}, {"name": "II Vespres", "tab": "II Vespres", "html": "<h3 id=\"p657\">Himne<\/h3><p id=\"p658\" class=\"v st rub\"><span class=\"r\">Com a les primeres vespres o bé<\/span><\/p><p id=\"p659\" class=\"v st\"><span class=\"l\">Verge Maria, la dona en flames:<\/span><span class=\"l\">Déu, que us volgué Mare de tots,<\/span><span class=\"l\">posà al vostre pit un Cor immens,<\/span><span class=\"l\">més que l’oceà.<\/span><span class=\"l e\"><\/span><span class=\"l\">Vós, que acollíreu la Paraula eterna<\/span><span class=\"l\">i en conservàveu àvidament les paraules,<\/span><span class=\"l\">feu, com el vostre, els nostres cors<\/span><span class=\"l\">arques del Verb.<\/span><span class=\"l e\"><\/span><span class=\"l\">Vós, que pujàreu intrèpida fins al Calvari,<\/span><span class=\"l\">amb el pit ferit per l’espasa,<\/span><span class=\"l\">doneu-nos, pietosa, un cor magnànim<\/span><span class=\"l\">fins a la mort.<\/span><span class=\"l e\"><\/span><span class=\"l\">Vós, que esperàreu amb els vostres nous fills<\/span><span class=\"l\">la flama viva en què es donà l’Esperit,<\/span><span class=\"l\">feu que sorgeixin per l’amplada del món<\/span><span class=\"l\">nous Cenacles.<\/span><span class=\"l e\"><\/span><span class=\"l\">Glòria a l’augusta Trinitat per sempre,<\/span><span class=\"l\">que, habitant el vostre Cor puríssim,<\/span><span class=\"l\">feu el motlle d’una Església santa,<\/span><span class=\"l\">santa i catòlica.<\/span><\/p><h3 id=\"p660\">Salmòdia<\/h3><p id=\"p661\" class=\"pr\"><span class=\"r\">Ant.<\/span> Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.<\/p><h4 id=\"p662\">Salm 121<\/h4><p id=\"p663\" class=\"v st\"><span class=\"l\">Quina alegria quan em van dir:<\/span><span class=\"l\">«Anem a la casa del Senyor».<\/span><span class=\"l\">Ja han arribat els nostres peus<\/span><span class=\"l\">al teu llindar, Jerusalem.<\/span><span class=\"l e\"><\/span><span class=\"l\">Jerusalem, ciutat ben construïda,<\/span><span class=\"l\">conjunt harmoniós;<\/span><span class=\"l\">és allà que pugen les tribus,<\/span><span class=\"l\">les tribus del Senyor,<\/span><span cla
