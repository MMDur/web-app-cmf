1247\" class=\"ref rub\"><span class=\"r\"><i>2Tm 4, 3-5<\/i><\/span><\/p><p id=\"p1248\" class=\"pr\">Perquè vindrà un temps que alguns no suportaran la sana doctrina. Seguint els propis capricis i buscant qui els afalagui les orelles, s’envoltaran d’un munt de mestres, no voldran escoltar la veritat i es desviaran cap a les faules. Tu, però, sigues sobri en tot, suporta els sofriments, fes obra d’evangelitzador, compleix bé el teu ministeri.<\/p><h3 id=\"p1249\">Responsori breu<\/h3><p id=\"p1250\" class=\"ref rub\"><span class=\"r\"><i>Jn 20, 21<\/i><\/span><\/p><p id=\"p1251\" class=\"pr\"><span class=\"l\"><span class=\"r\">V.<\/span> Com el Pare m’ha enviat, també us envio jo a vosaltres.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Com el Pare m’ha enviat, també us envio jo a vosaltres.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> I em sereu testimonis fins a l’extrem de la terra.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> També us envio jo a vosaltres.<\/span><span class=\"l\"><span class=\"r\">V.<\/span> Glòria al Pare i al Fill i a l’Esperit Sant.<\/span><span class=\"l\"><span class=\"r\">R.<\/span> Com el Pare m’ha enviat, també us envio jo a vosaltres.<\/span><\/p><h3 id=\"p1252\">Càntic de Maria<\/h3><p id=\"p1253\" class=\"pr\"><span class=\"r\">Ant.<\/span> Gireu des del cel els vostres ulls, veniu i visiteu aquesta vinya que la mà vostra havia plantat i havia fet robusta i forta.<\/p><p id=\"p1254\" class=\"v st\"><span class=\"l\">La meva ànima magnifica el Senyor,<\/span><span class=\"l\">el meu esperit celebra el Déu que em salva,<\/span><span class=\"l\">perquè ha mirat la petitesa de la seva serventa.<\/span><span class=\"l e\"><\/span><span class=\"l\">Des d’ara totes les generacions<\/span><span class=\"l\">em diran benaurada,<\/span><span class=\"l\">perquè el Totpoderós obra en mi meravelles.<\/span><span class=\"l e\"><\/span><span class=\"l\">El seu nom és sant,<\/span><span class=\"l\">i l’amor que té als qui creuen en ell<\/span><span class=\"l\">s’estén de generació en generació.<\/span><span class=\"l e\"><\/span><span class=\"l\">Les obres del seu braç són potents:<\/span><span class=\"l\">dispersa els homes de cor altiu,<\/span><span class=\"l\">derroca els poderosos del soli<\/span><span class=\"l\">i exalça els humils.<\/span><span class=\"l\">Omple de béns els pobres,<\/span><span class=\"l\">i els rics se’n tornen sense res.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ha protegit Israel, el seu servent,<\/span><span class=\"l\">com ho havia promès als nostres pares;<\/span><span class=\"l\">s’ha recordat del seu amor a Abraham<\/span><span class=\"l\">i a la seva descendència per sempre.<\/span><\/p><p id=\"p1255\" class=\"pr\"><span class=\"r\">Ant.<\/span> Gireu des del cel els vostres ulls, veniu i visiteu aquesta vinya que la mà vostra havia plantat i havia fet robusta i forta.<\/p><p id=\"p1256\" class=\"pr rub\"><span class=\"r\">Les pregàries, com a les I Vespres.<\/span><\/p><h3 id=\"p1257\">Oració<\/h3><p id=\"p1258\" class=\"pr\">Senyor Déu nostre, vós vau escollir sant Antoni Maria Claret perquè fundés la nostra família i el vau inflamar d’un amor tan ardent que el feia viure alegre enmig de les privacions, calúmnies i turments: concediu-nos que, seguint els seus ensenyaments i exemples, frisem per la salvació de tots els homes i proclamem pertot la vostra glòria. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p1221", "Himne"], ["p1224", "Salmòdia"], ["p1246", "Lectura breu"], ["p1249", "Responsori breu"], ["p1252", "Càntic de Maria"], ["p1257", "Oració"]]}], "kind": "fest", "date": [10, 24], "title": "Sant Antoni Maria Claret, bisbe i fundador de la Congregació", "rank": "Solemnitat", "sub": [], "intro": "<p id=\"p928\" class=\"pr\">Sant Antoni Maria Claret nasqué a Sallent (Barcelona) el 23 de desembre de 1807. Dedicà la seva vida al ministeri de la Paraula com a missioner apostòlic. El seu esperit era «per a tot el món». I, per fer amb d’altres el que ell sol no podia, fundà la Congregació de Missioners Fills del Cor Immaculat de la benaurada Verge Maria a Vic (Barcelona) el 16 de juliol de 1849. L’any 1855, juntament amb la M. Maria Antònia París, fundà la Congregació de Religioses de Maria Immaculada, Missioneres Claretianes. Sota la seva inspiració, es fundaren posteriorment l’institut secular de les Filles del Cor de Maria o Filiació Cordimariana i els Seglars Claretians. Creà moltes altres associacions i obres al servei de l’Església. Fou arquebisbe de Santiago de Cuba, confessor de la reina Isabel II i pare del Concili Vaticà I. Els enemics de la fe el perseguiren fins al darrer moment de la seva vida. Morí a l’exili, a Fontfroide (França), el 24 d’octubre de 1870. El seu cos fou traslladat a Vic el 1897. Pius XII l’inscriví en el catàleg dels sants el 7 de maig de 1950.<\/p>", "missa": {"title": "Sant Antoni Maria Claret, bisbe i fundador de la nostra Congregació", "html": "<h3 class=\"rub\" id=\"m5x0\">Antífona d’introducció <span class=\"ref\">Is 61,1<\/span><\/h3><div class=\"pl\" id=\"m5x1\"><span class=\"l\">L’Esperit del Senyor reposa sobre meu,<\/span><span class=\"l\">perquè el Senyor m’ha ungit,<\/span><span class=\"l\">m’ha enviat a portar la Bona Nova als desvalguts<\/span><span class=\"l\">a curar els cors adolorits.<\/span><\/div><h3 class=\"rub\" id=\"m5x2\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m5x3\"><span class=\"l\">Oh Déu, que vau concedir<\/span><span class=\"l\">al vostre bisbe Antoni Maria Claret<\/span><span class=\"l\">una caritat i fermesa admirables<\/span><span class=\"l\">per anunciar l’Evangeli als pobres,<\/span><span class=\"l\">i el vau constituir pare<\/span><span class=\"l\">de noves famílies apostòliques a l’Església;<\/span><span class=\"l\">concediu-nos, per la seva intercessió,<\/span><span class=\"l\">que, buscant sempre i en tot la vostra voluntat,<\/span><span class=\"l\">treballem incansablement<\/span><span class=\"l\">per guanyar nous germans per a Crist.<\/span><\/div><div class=\"obien\" id=\"m5x4\">O bé<\/div><div class=\"pl\" id=\"m5x5\"><span class=\"l\">Senyor Déu nostre,<\/span><span class=\"l\">Vós vau escollir sant Antoni Maria Claret<\/span><span class=\"l\">perquè fundés la nostra Família<\/span><span class=\"l\">i el vau inflamar d’un amor tan ardent<\/span><span class=\"l\">que el feia viure alegre enmig de les privacions, calúmnies i turments:<\/span><span class=\"l\">Concediu-nos<\/span><span class=\"l\">que, seguint els seus ensenyaments i exemples,<\/span><span class=\"l\">frisem per la salvació de tots els homes<\/span><span class=\"l\">i proclamem pertot la vostra glòria.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><h3 class=\"rub\" id=\"m5x6\">Lectura primera <span class=\"ref\">Is 61, 1-6<\/span><\/h3><p class=\"lema\" id=\"m5x7\">El Senyor m’ha ungit i m’ha enviat a portar la bona nova als pobres.<\/p><p class=\"pr\" id=\"m5x8\">Lectura del llibre d’Isaïes.<\/p><div class=\"pl\" id=\"m5x9\"><span class=\"l\">L’Esperit del Senyor, Déu sobirà, reposa sobre meu,<\/span><span class=\"l\">perquè el Senyor m’ha ungit.<\/span><span class=\"l\">M’ha enviat<\/span><span class=\"l\">a portar la bona nova als pobres,<\/span><span class=\"l\">a curar els cors desfets,<\/span><span class=\"l\">a proclamar als captius la llibertat i als presos el retorn de la llum,<\/span><span class=\"l\">a proclamar l’any de gràcia del Senyor,<\/span><span class=\"l\">[el dia que el nostre Déu farà justícia,<\/span><span class=\"l\">a consolar tots els qui estan de dol,<\/span><span class=\"l\">a posar una diadema en lloc de cendra als qui porten dol per Sió,<\/span><span class=\"l\">a donar-los perfums de festa en lloc de penes,<\/span><span class=\"l\">vestits triomfals en lloc del desconsol.<\/span><\/div><div class=\"pl\" id=\"m5x10\"><span class=\"l\">Els diran «Roures magnífics,<\/span><span class=\"l\">glòria del Senyor que els ha plantat».<\/span><\/div><div class=\"pl\" id=\"m5x11\"><span class=\"l\">Reconstruiran les ruïnes antigues,<\/span><span class=\"l\">aixecaran edificis<\/span><span class=\"l\">fins ara enderrocats,<\/span><span class=\"l\">restauraran les ciutats devastades,<\/span><span class=\"l\">desolades des de temps immemorial.<\/span><\/div><div class=\"pl\" id=\"m5x12\"><span class=\"l\">Vindran estrangers<\/span><span class=\"l\">a pasturar-vos els ramats,<\/span><span class=\"l\">gent forastera us conrearà<\/span><span class=\"l\">els camps i les vinyes.<\/span><\/div><div class=\"pl\" id=\"m5x13\"><span class=\"l\">A vosaltres us diran<\/span><span class=\"l\">«Sacerdots del Senyor»,<\/span><span class=\"l\">«Ministres del nostre Déu».<\/span><\/div><div class=\"pl\" id=\"m5x14\"><span class=\"l\">Viureu de les riqueses de les nacions,<\/span><span class=\"l\">els seus béns passaran a vosaltres.<\/span><\/div><p class=\"fin\" id=\"m5x15\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m5x16\">Salm responsorial <span class=\"ref\">Sal 22, 1-3a.3b-4.5.6<\/span><\/h3><div class=\"pl\" id=\"m5x17\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> El Senyor és el meu pastor<\/span><span class=\"l\">no em mancarà mai res.<\/span><\/div><div class=\"pl\" id=\"m5x18\"><span class=\"l\">El Senyor és el meu pastor, no em manca res,<\/span><span class=\"l\">em fa descansar en prats deliciosos;<\/span><span class=\"l\">em mena al repòs vora l’aigua,<\/span><span class=\"l\">i allí em retorna.<\/span><span class=\"l\">Em guia pels camins segurs<\/span><span class=\"l\">per l’amor del seu nom. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m5x19\"><span class=\"l\">Ni quan passo per barrancs tenebrosos<\/span><span class=\"l\">no tinc por de res,<\/span><span class=\"l\">perquè us tinc vora meu;<\/span><span class=\"l\">la vostra vara de pastor<\/span><span class=\"l\">m’asserena i em conforta. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m5x20\"><span class=\"l\">Davant meu pareu taula vós mateix<\/span><span class=\"l\">i els enemics ho veuen;<\/span><span class=\"l\">m’heu ungit el cap amb perfums,<\/span><span class=\"l\">ompliu a vessar la meva copa. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m5x21\"><span class=\"l\">Oh sí! La vostra bondat i el vostre amor<\/span><span class=\"l\">m’acompanyen tota la vida,<\/span><span class=\"l\">i viuré anys i més anys<\/span><span class=\"l\">a la casa del Senyor. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"obien\" id=\"m5x22\">O bé <span class=\"ref\">Is 49, 1-6<\/span><\/div><p class=\"lema\" id=\"m5x23\">Jo t’he fet llum de les nacions<\/p><p class=\"pr\" id=\"m5x24\">Lectura del llibre d’Isaïes:<\/p><div class=\"pl\" id=\"m5x25\"><span class=\"l\">Escolteu els qui viviu lluny, a les illes!<\/span><span class=\"l\">Estigueu atents, pobles llunyans!<\/span><span class=\"l\">Abans de néixer, el Senyor em va cridar,<\/span><span class=\"l\">va pronunciar el meu nom<\/span><span class=\"l\">quan era a les entranyes de la mare.<\/span><\/div><div class=\"pl\" id=\"m5x26\"><span class=\"l\">Ha fet dels meus llavis una espasa tallant,<\/span><span class=\"l\">m’amaga a l’ombra de la seva mà.<\/span><\/div><div class=\"pl\" id=\"m5x27\"><span class=\"l\">M’ha convertit en una fletxa aguda,<\/span><span class=\"l\">ben guardada en el seu buirac.<\/span><\/div><div class=\"pl\" id=\"m5x28\"><span class=\"l\">M’ha dit: «Ets el meu servent;<\/span><span class=\"l\">en tu, Israel, faig resplendir la meva glòria.»<\/span><span class=\"l\">Jo pensava: «M’he cansat en va,<\/span><span class=\"l\">he consumit per no res les meves forces.»<\/span><span class=\"l\">Però el Senyor té a les mans la meva causa,<\/span><span class=\"l\">el meu Déu m’ha guardat la recompensa.<\/span><\/div><div class=\"pl\" id=\"m5x29\"><span class=\"l\">Ara ha parlat el Senyor,<\/span><span class=\"l\">ell que m’ha format des del si de la mare<\/span><span class=\"l\">perquè fos el seu servent,<\/span><span class=\"l\">perquè fes tornar cap a ell el poble de Jacob<\/span><span class=\"l\">i aplegués Israel al seu voltant.<\/span><\/div><div class=\"pl\" id=\"m5x30\"><span class=\"l\">Als ulls del Senyor jo soc preciós;<\/span><span class=\"l\">el meu Déu és la meva força.<\/span><\/div><div class=\"pl\" id=\"m5x31\"><span class=\"l\">M’ha dit: «És massa poc<\/span><span class=\"l\">que siguis el meu servent<\/span><span class=\"l\">per a restablir les tribus de Jacob<\/span><span class=\"l\">i fer tornar els supervivents d’Israel.<\/span><\/div><div class=\"pl\" id=\"m5x32\"><span class=\"l\">Jo t’he fet llum de les nacions<\/span><span class=\"l\">perquè portis la meva salvació<\/span><span class=\"l\">d’un cap a l’altre de la terra.»<\/span><\/div><p class=\"fin\" id=\"m5x33\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m5x34\">Salm responsorial <span class=\"ref\">26, 1.4.13-14<\/span><\/h3><div class=\"pl\" id=\"m5x35\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> El Senyor m’il·lumina i em salva.<\/span><\/div><div class=\"pl\" id=\"m5x36\"><span class=\"l\">El Senyor m’il·lumina i em salva,<\/span><span class=\"l\">¿qui em pot fer por?<\/span><span class=\"l\">El Senyor és el mur que protegeix la meva vida,<\/span><span class=\"l\">¿qui em pot esfereir? <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m5x37\"><span class=\"l\">Una cosa he demanat al Senyor,<\/span><span class=\"l\">i la desitjo amb tota l’ànima:<\/span><span class=\"l\">poder viure a la casa del Senyor<\/span><span class=\"l\">tots els dies de la vida,<\/span><span class=\"l\">per fruir-hi de l’estima del Senyor<\/span><span class=\"l\">i vetllar pel seu temple. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m5x38\"><span class=\"l\">N’estic cert, fruiré en la vida eterna<\/span><span class=\"l\">de la bondat que em té el Senyor.<\/span><span class=\"l\">Espera en el Senyor!<\/span><span class=\"l\">Sigues valent! que el teu cor no defalleixi.<\/span><span class=\"l\">Espera en el Senyor! <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m5x39\">Lectura segona <span class=\"ref\">2Co 5,14-20<\/span><\/h3><p class=\"lema\" id=\"m5x40\">L’amor que el Crist ens té ens obliga<\/p><p class=\"pr\" id=\"m5x41\">Lectura de la segona carta de sant Pau als cristians de Corint:<\/p><p class=\"pr\" id=\"m5x42\">Germans, l’amor que el Crist ens té ens obliga: hem de reconèixer que un ha mort per tots. I és que tots han mort, però ell ha mort per tots, perquè els qui viuen no visquin ja per a ells mateixos, sinó per a aquell que ha mort per tots i ha ressuscitat. Per això nosaltres des d’ara, ja no valorem ningú per la seva condició mortal, i si en altre temps havíem valorat així el Crist, ara ja no ho fem.<\/p><p class=\"pr\" id=\"m5x43\">I tot això és obra de Déu, que ens ha reconciliat amb ell mateix per Crist i ens ha confiat a nosaltres aquest servei de la reconciliació. Perquè Déu, en Crist, reconciliava el món amb ell mateix, no retraient-li més les culpes, i a nosaltres ens ha encomanat que portéssim el missatge de la reconciliació.<\/p><p class=\"pr\" id=\"m5x44\">Per tant, nosaltres fem d’ambaixadors de Crist, i és com si Déu mateix us exhortés a través nostre. Us ho demanem en nom de Crist: reconcilieu-vos amb Déu.<\/p><p class=\"fin\" id=\"m5x45\">Paraula de Déu<\/p><div class=\"obien\" id=\"m5x46\">O bé <span class=\"ref\">Ac 1, 3-8<\/span><\/div><p class=\"pr\" id=\"m5x47\">Lectura dels Fets dels Apòstols<\/p><p class=\"pr\" id=\"m5x48\">Després de la passió Jesús ressuscitat se’ls presentà a ells i els donà moltes proves que era viu: durant quaranta dies se’ls va aparèixer i els parlava del Regne de Déu. Un dia, mentre menjava amb ells, els donà aquesta ordre: «No us allunyeu de Jerusalem; espereu-hi aquell que el Pare ha promès i que us vaig anunciar: Joan va batejar amb aigua, però vosaltres, d’aquí a pocs dies, sereu batejats amb l’Esperit Sant.»<\/p><p class=\"pr\" id=\"m5x49\">Ells, doncs, que es trobaven reunits, li preguntaren: «Senyor, és ara que restabliràs el Regne a favor d’Israel?»<\/p><p class=\"pr\" id=\"m5x50\">Ell els contestà: «No és cosa vostra de saber els temps i els moments que el Pare ha fixat amb la seva autoritat. Però vosaltres, quan l’Esperit Sant vindrà damunt vostre, rebreu una força que us farà testimonis meus a Jerusalem, a tot Judea, a Samaria i fins a l’extrem de la terra».<\/p><p class=\"fin\" id=\"m5x51\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m5x52\">Al·leluia <span class=\"ref\">Mt 28, 19a-20b<\/span><\/h3><div class=\"pl\" id=\"m5x53\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/span><\/div><div class=\"pl\" id=\"m5x54\"><span class=\"l\">Aneu, doncs, a tots els pobles i feu-los deixebles meus.<\/span><span class=\"l\">Jo soc amb vosaltres dia rere dia fins a la fi del món. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m5x55\">Evangeli <span class=\"ref\">Mc16,15-20<\/span><\/h3><p class=\"lema\" id=\"m5x56\">Aneu per tot el món i prediqueu a Bona Nova de l’evangeli<\/p><p class=\"pr\" id=\"m5x57\">Lectura de l’evangeli segons sant Marc:<\/p><p class=\"pr\" id=\"m5x58\">En aquell temps, Jesús s’aparegué als onze i els digué: «Aneu per tot el món i prediqueu a tothom la Bona Nova de l’evangeli. Els qui creuran i es faran batejar se salvaran; els qui no creuran seran condemnats. Els qui hauran cregut faran miracles com aquests: expulsaran dimonis pel poder del meu nom; parlaran llenguatges nous; si agafen serps amb les mans o beuen metzines no els faran cap mal; els malalts a qui hauran imposat les mans es posaran bons». Jesús, el Senyor, després de parlar-los, fou endut al cel i s’assegué a la dreta de Déu.<\/p><p class=\"pr\" id=\"m5x59\">Ells se n’anaren a predicar pertot arreu. El Senyor hi cooperava, i confirmava la predicació de la paraula amb els senyals prodigiosos que l’acompanyaven.<\/p><p class=\"fin\" id=\"m5x60\">Paraula del Senyor<\/p><div class=\"obien\" id=\"m5x61\">O bé <span class=\"ref\">Lc 10,2<\/span><\/div><p class=\"pr\" id=\"m5x62\"><span class=\"vr\">&#8479;.<\/span> Al·leluia, al·leluia, al·leluia!<\/p><div class=\"pl\" id=\"m5x63\"><span class=\"l\">«Hi ha molt a segar i pocs segadors:<\/span><span class=\"l\">demaneu a l’amo dels sembrats que enviï més homes a segar-los.» <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m5x64\">Evangeli <span class=\"ref\">Lc 10,1-12.17-20<\/span><\/h3><p class=\"lema\" id=\"m5x65\">La pau que li desitgeu reposarà en ell<\/p><p class=\"pr\" id=\"m5x66\">Lectura de l’evangeli segons sant Lluc:<\/p><p class=\"pr\" id=\"m5x67\">En aquell temps, el Senyor en designà encara setanta-dos, i els envià que s’avancessin de dos en dos cap a cada poble i a cada lloc on ell mateix havia d’anar. Els deia: «Hi ha molt a segar i pocs segadors: demaneu a l’amo dels sembrats que enviï homes a segar-los.<\/p><p class=\"pr\" id=\"m5x68\">Aneu. Us envio com anyells enmig de llops. No porteu bossa, ni sarró, ni calçat, no us atureu a saludar ningú pel camí. Quan entreu en una casa digueu primer: Pau en aquesta casa. Si hi viu un home de pau, la pau que li desitgeu reposarà en ell; si no, retornarà a vosaltres.<\/p><p class=\"pr\" id=\"m5x69\">Quedeu-vos en aquella casa, i compartiu allò que tinguin per menjar i beure: els treballadors bé es mereixen el seu jornal. No aneu de casa en casa. Si en un poble us reben bé, mengeu el que us posin a taula, cureu els malalts que hi hagi i digueu a la gent d’aquell lloc: El Regne de Déu és a prop vostre.<\/p><p class=\"fin\" id=\"m5x70\">Paraula del Senyor<\/p><h3 class=\"rub\" id=\"m5x71\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m5x72\"><span class=\"l\">En oferir-vos aquests presents, us demanem, Senyor,<\/span><span class=\"l\">que l’Esperit Sant es digni a infondre en els nostres cors<\/span><span class=\"l\">el zel de les ànimes amb què sant Antoni Maria Claret<\/span><span class=\"l\">es va oferir ell mateix com a víctima per Crist i pels germans.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m5x73\">Prefaci<\/h3><div class=\"pl\" id=\"m5x74\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> El Senyor sigui amb vosaltres.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> I amb el vostre esperit.<\/span><\/div><div class=\"pl\" id=\"m5x75\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> Amunt els cors.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Els elevem al Senyor.<\/span><\/div><div class=\"pl\" id=\"m5x76\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> Donem gràcies al Senyor, Déu nostre.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Cal fer-ho i és de justícia.<\/span><\/div><div class=\"pl\" id=\"m5x77\"><span class=\"l\">Es realment just i necessari, Pare omnipotent,<\/span><span class=\"l\">que us entonem sempre himnes i càntics de lloança<\/span><span class=\"l\">per Crist Senyor nostre.<\/span><\/div><div class=\"pl\" id=\"m5x78\"><span class=\"l\">Vós vau escollir Sant Antoni Maria Claret<\/span><span class=\"l\">perquè, vivint en comunió amb Crist,<\/span><span class=\"l\">fos en la vostra Església un missioner i un pastor.<\/span><\/div><div class=\"pl\" id=\"m5x79\"><span class=\"l\">Esperonat sempre per la caritat,<\/span><span class=\"l\">continuà, sense defallir, la vostra obra de salvació;<\/span><span class=\"l\">ell també va fundar noves Famílies<\/span><span class=\"l\">que, guiades per l’esperit del seu Pare,<\/span><span class=\"l\">seguissin el Crist Senyor i l’imitessin,<\/span><span class=\"l\">cercant sempre i únicament<\/span><span class=\"l\">la salvació dels homes i la més gran glòria vostra.<\/span><\/div><div class=\"pl\" id=\"m5x80\"><span class=\"l\">Per això, ens unim amb joia a la multitud celestial<\/span><span class=\"l\">cantant sense parar l’himne de la vostra glòria:<\/span><\/div><p class=\"pr\" id=\"m5x81\">Sant, Sant, Sant ...<\/p><h3 class=\"rub\" id=\"m5x82\">Antífona de comunió <span class=\"ref\">Ga 2,20<\/span><\/h3><div class=\"pl\" id=\"m5x83\"><span class=\"l\">La vida que ara visc ja no és meva; qui viu en mi<\/span><span class=\"l\">és Crist que m’ha estimat i s’ha entregat ell mateix per mi.<\/span><\/div><div class=\"obien\" id=\"m5x84\">O bé <span class=\"ref\">Fl 1,23<\/span><\/div><p class=\"pr\" id=\"m5x85\">Tinc el desig d’anar-me’n i d’estar amb Crist!<\/p><h3 class=\"rub\" id=\"m5x86\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m5x87\"><span class=\"l\">Senyor, Déu nostre:<\/span><span class=\"l\">que aquests sagraments que acabem de rebre<\/span><span class=\"l\">nodreixin en nosaltres aquella fe<\/span><span class=\"l\">que la predicació dels Apòstols ens va ensenyar<\/span><span class=\"l\">i que amb tant de zel va defensar sant Antoni Maria Claret.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><div class=\"obien\" id=\"m5x88\">O bé<\/div><div class=\"pl\" id=\"m5x89\"><span class=\"l\">Ara que ens heu omplert dels vostres dons celestials<\/span><span class=\"l\">us demanem humilment, Senyor,<\/span><span class=\"l\">que seguim el camí dret de la veritat<\/span><span class=\"l\">i aprenguem. com el nostre pare sant Antoni Ma Claret,<\/span><span class=\"l\">a donar fins i tot la vida per testimoniar la paraula de Déu.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m5x90\">Benedicció solemne<\/h3><div class=\"pl\" id=\"m5x91\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> El Senyor sigui amb vosaltres<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> I amb el vostre esperit<\/span><\/div><p class=\"nota\" id=\"m5x92\">Inclineu-vos per rebre la benedicció.<\/p><div class=\"pl\" id=\"m5x93\"><span class=\"l\">Déu, font de tota santedat, us concedeix de celebrar<\/span><span class=\"l\">la solemnitat de sant Antoni Maria Claret.<\/span><span class=\"l\">Que us concedeixi també de viure el goig de la santedat.<\/span><\/div><p class=\"pr\" id=\"m5x94\"><span class=\"vr\">&#8479;.<\/span> Amén.<\/p><div class=\"pl\" id=\"m5x95\"><span class=\"l\">Déu, que és font i origen de tota salvació,<\/span><span class=\"l\">us estimuli a tots a seguir els exemples<\/span><span class=\"l\">de sant Antoni Maria Claret,<\/span><span class=\"l\">de tal manera que us mantingueu constantment<\/span><span class=\"l\">en el servei de Déu i dels homes.<\/span><\/div><p class=\"pr\" id=\"m5x96\"><span class=\"vr\">&#8479;.<\/span> Amén<\/p><div class=\"pl\" id=\"m5x97\"><span class=\"l\">Déu, que es fa present en la comunitat humana,<\/span><span class=\"l\">i que us ha convocat en aquest aplec de fidels,<\/span><span class=\"l\">us concedeixi de reunir-vos amb els vostres germans<\/span><span class=\"l\">que ja frueixen dels goigs del cel.<\/span><\/div><p class=\"pr\" id=\"m5x98\"><span class=\"vr\">&#8479;.<\/span> Amén.<\/p><p class=\"pr\" id=\"m5x99\">Que us beneeixi Déu totpoderós, Pare, Fill i Esperit Sant.<\/p><p class=\"pr\" id=\"m5x100\"><span class=\"vr\">&#8479;.<\/span> Amén.<\/p>", "chips": [["m5x0", "Entrada"], ["m5x2", "Col·lecta"], ["m5x6", "1a lectura"], ["m5x16", "Salm"], ["m5x39", "2a lectura"], ["m5x55", "Evangeli"], ["m5x71", "Ofrenes"], ["m5x73", "Prefaci"], ["m5x82", "Comunió"], ["m5x86", "Postcomunió"], ["m5x90", "Benedicció"]], "color": "blanco", "fecha": "24 d’octubre"}}, {"label": "13 de novembre", "hours": [{"name": "Laudes", "tab": "Laudes", "html": "<p id=\"p1265\" class=\"pr\"><span class=\"r\">Càntic de Zacaries, ant.<\/span> Es cenyí la cintura amb fermesa i desplegà la força dels seus braços; per això, la seva llàntia no s’apagarà mai més.<\/p><h3 id=\"p1266\">Oració<\/h3><p id=\"p1267\" class=\"pr\">Déu omnipotent i misericordiós, que a la beata Maria Patrocini la vàreu fer exímia en el servei als germans i en el martiri, concediu-nos per la seva intercessió que, seguint amb perseverança Crist en el camí de la creu, arribem a la glòria de la resurrecció. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.<\/p>", "chips": [["p1266", "Oració"]]}, {"name": "Vespres", "tab": "Vespres", "html": "<p id=\"p1269\" class=\"pr\"><span class=\"r\">Càntic de Maria, ant.<\/span> El qui s’avorreix a si mateix en aquest món es guardarà per a la vida eterna.<\/p>", "chips": []}], "kind": "fest", "date": [11, 13], "title": "Beata Maria Patrocini Giner, verge i màrtir", "rank": "Memòria facultativa", "sub": [], "intro": "<p id=\"p1262\" class=\"pr\">María Patrocini Giner, missionera claretiana, va néixer a Tortosa (Tarragona), el 4 de gener de 1874. El 16 de setembre de 1893, va fer la seva professió perpètua a Carcaixent (València). Va exercir diverses responsabilitats a la comunitat com a superiora i formadora, educadora sensible a les necessitats de nenes i joves. Va ser la fundadora de la comunitat de Port Sagunt. Un cop desencadenada la persecució religiosa en el context de la Guerra Civil Espanyola (1936-1939), va afrontar amb coratge i pau les adversitats patides per la comunitat tant a Port Sagunt com, més tard, de nou a Carcaixent. Amb altres germanes va haver de deixar la casa religiosa i cercar refugi. No va deixar d'animar les seves germanes i les va instar a donar la vida per Crist. La mort va arribar la nit del 13 de novembre de 1936, quan va ser assassinada sense judici juntament amb altres víctimes. Les seves últimes paraules van ser de perdó i intercessió.<\/p><p id=\"p1263\" class=\"pr rub\"><span class=\"r\">Comú d’un màrtir.<\/span><\/p>", "missa": {"title": "Beata Maria Patrocini Giner, verge i màrtir", "html": "<p class=\"nota\" id=\"m7x0\">Comú de màrtirs de verges o de santes: per a religioses<\/p><h3 class=\"rub\" id=\"m7x1\">Antífona d’introducció<\/h3><div class=\"pl\" id=\"m7x2\"><span class=\"l\">Els sants que van seguir les empremtes de Crist,<\/span><span class=\"l\">viuen joiosos al cel.<\/span><span class=\"l\">Van vessar la sang pel seu amor,<\/span><span class=\"l\">per això s’alegren amb Crist per sempre.<\/span><\/div><h3 class=\"rub\" id=\"m7x3\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m7x4\"><span class=\"l\">Déu totpoderós i misericordiós,<\/span><span class=\"l\">Vós que heu fet la beata Maria Patrocini<\/span><span class=\"l\">admirable en el servei dels germans i en el martiri,<\/span><span class=\"l\">concediu-nos, per la seva intercessió,<\/span><span class=\"l\">que seguim Crist amb perseverança<\/span><span class=\"l\">en el camí de la creu,<\/span><span class=\"l\">per tal d’assolir la glòria de la resurrecció.<\/span><span class=\"l\">Pel nostre Senyor Jesucrist ...<\/span><\/div><h3 class=\"rub\" id=\"m7x5\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m7x6\"><span class=\"l\">Que baixi la vostra benedicció com una rosada, Senyor,<\/span><span class=\"l\">sobre l’ofrena que us presentem,<\/span><span class=\"l\">i confirmeu-nos en aquella fe<\/span><span class=\"l\">que la beata Maria Patrocini<\/span><span class=\"l\">va testimoniar fins a donar la seva vida.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div><p class=\"pr\" id=\"m7x7\">Prefaci de màrtirs o de verges i religiosos.<\/p><h3 class=\"rub\" id=\"m7x8\">Antífona de comunió <span class=\"ref\">Jn 15, 1.5<\/span><\/h3><p class=\"pr\" id=\"m7x9\">Jo soc la vinya veritable i vosaltres els sarments, diu el Senyor; el que roman en mi i jo en ell, aquest dona fruit abundant.<\/p><h3 class=\"rub\" id=\"m7x10\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m7x11\"><span class=\"l\">Oh Déu, que en aquests sants misteris<\/span><span class=\"l\">renoveu la vostra Església,<\/span><span class=\"l\">concediu-nos d’imitar la fortalesa<\/span><span class=\"l\">de la beata Maria Patrocini,<\/span><span class=\"l\">per aconseguir el premi<\/span><span class=\"l\">promès als qui pateixen pel teu nom.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div>", "chips": [["m7x1", "Entrada"], ["m7x3", "Col·lecta"], ["m7x5", "Ofrenes"], ["m7x8", "Comunió"], ["m7x10", "Postcomunió"]], "color": "rojo", "fecha": "13 de novembre"}}, {"label": "5 de novembre", "kind": "fest", "date": [11, 5], "title": "Difunts de la Congregació, familiars i benefactors", "rank": "Commemoració", "sub": [], "intro": "", "hours": [], "missa": {"title": "Commemoració dels difunts de la Congregació, familiars i benefactors", "html": "<p class=\"nota\" id=\"m6x0\">Quan el dia 5 sigui diumenge, aquesta commemoració es trasllada al dia següent.<\/p><p class=\"nota\" id=\"m6x1\">Aquests textos es faran servir quan la comunitat vulgui fer memòria dels nostres difunts. Poden utilitzar-se els textos del Missal Romà i del Leccionari o els següents:<\/p><h3 class=\"rub\" id=\"m6x2\">Antífona d’introducció <span class=\"ref\">cf. Rm 8,11<\/span><\/h3><div class=\"pl\" id=\"m6x3\"><span class=\"l\">I si habita en vosaltres l’Esperit<\/span><span class=\"l\">d’aquell qui va ressuscitar Jesús d’entre els morts,<\/span><span class=\"l\">també, gràcies al seu Esperit que habita en vosaltres,<\/span><span class=\"l\">aquell qui va ressuscitar el Crist d’entre els morts<\/span><span class=\"l\">donarà la vida als vostres cossos mortals<\/span><span class=\"l\">pel mateix Esperit que habita en vosaltres.<\/span><\/div><div class=\"obien\" id=\"m6x4\">O bé <span class=\"ref\">Ap 14, 13<\/span><\/div><div class=\"pl\" id=\"m6x5\"><span class=\"l\">Feliços els qui des d’ara moren en el Senyor!<\/span><span class=\"l\">Sí, diu l’Esperit, que reposin del seu esforç,<\/span><span class=\"l\">perquè les seves obres els acompanyen.<\/span><\/div><h3 class=\"rub\" id=\"m6x6\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m6x7\"><span class=\"l\">Oh Déu, que pel misteri pasqual del vostre Fill<\/span><span class=\"l\">manteniu l’esperança de la nostra resurrecció,<\/span><span class=\"l\">us demanem humilment<\/span><span class=\"l\">que tots els qui van consagrar la seva vida<\/span><span class=\"l\">a l’anunci de l’Evangeli<\/span><span class=\"l\">i tots els qui van participar a la terra<\/span><span class=\"l\">de la nostra fraternitat claretiana<\/span><span class=\"l\">arribin al goig de la felicitat eterna.<\/span><span class=\"l\">Pel nostre Senyor Jesucrist.<\/span><\/div><h3 class=\"rub\" id=\"m6x8\">Pregària sobre les ofrenes<\/h3><div class=\"pl\" id=\"m6x9\"><span class=\"l\">Us demanem, Senyor,<\/span><span class=\"l\">que accepteu els dons que us presentem,<\/span><span class=\"l\">tot recordant els nostres germans difunts,<\/span><span class=\"l\">i els admeteu a les estades eternes.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m6x10\">Antífona de comunió <span class=\"ref\">Mt 25, 34<\/span><\/h3><p class=\"pr\" id=\"m6x11\">Veniu, beneïts del meu Pare, rebeu en herència el Regne que ell us tenia preparat des de la creació del món.<\/p><div class=\"obien\" id=\"m6x12\">O bé <span class=\"ref\">Jn 11, 25-26<\/span><\/div><div class=\"pl\" id=\"m6x13\"><span class=\"l\">Jo soc la resurrecció i la vida:<\/span><span class=\"l\">el qui creu en mi, encara que mori, viurà;<\/span><span class=\"l\">i el qui viu i creu en mi, no morirà mai més.<\/span><\/div><h3 class=\"rub\" id=\"m6x14\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m6x15\"><span class=\"l\">Alimentats amb el Cos i la Sang del teu Fill,<\/span><span class=\"l\">us demanem, Senyor,<\/span><span class=\"l\">que tots els qui pietosament han mort<\/span><span class=\"l\">a la nostra família claretiana,<\/span><span class=\"l\">purificats per aquests sagraments que van rebre a la terra,<\/span><span class=\"l\">participin de la salvació eterna.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div>", "chips": [["m6x2", "Entrada"], ["m6x6", "Col·lecta"], ["m6x8", "Ofrenes"], ["m6x10", "Comunió"], ["m6x14", "Postcomunió"]], "color": "morado", "fecha": "5 de novembre"}}, {"label": "Completes", "hours": [{"name": "Després de les primeres Vespres de les solemnitats", "tab": "Després de les I Vespres", "html": "<p id=\"p1274\" class=\"pr rub\"><span class=\"r\">Tot com a l’Ordinari, llevat del que segueix.<\/span><\/p><h3 id=\"p1275\">Salmòdia<\/h3><p id=\"p1276\" class=\"pr\"><span class=\"r\">Ant.<\/span> Tingueu pietat de mi, Senyor, i escolteu la meva pregària.<\/p><h4 id=\"p1277\">Salm 4<\/h4><p id=\"p1278\" class=\"v st\"><span class=\"l\">Responeu-me quan us invoco,<\/span><span class=\"l\">oh Déu que em feu justícia.<\/span><span class=\"l\">M’heu eixamplat el cor en els perills,<\/span><span class=\"l\">compadiu-me i escolteu el meu prec.<\/span><span class=\"l e\"><\/span><span class=\"l\">Fins quan vosaltres, homes,<\/span><span class=\"l\">menyspreareu el Senyor, la meva glòria,<\/span><span class=\"l\">i preferireu el que és no-res<\/span><span class=\"l\">fiant-vos d’esperances enganyoses?<\/span><span class=\"l e\"><\/span><span class=\"l\">Sapigueu que el Senyor<\/span><span class=\"l\">m’ha fet favors meravellosos:<\/span><span class=\"l\">el Senyor m’escolta<\/span><span class=\"l\">sempre que l’invoco.<\/span><span class=\"l e\"><\/span><span class=\"l\">No pequeu si us veieu insegurs;<\/span><span class=\"l\">reflexioneu de nit i assereneu-vos.<\/span><span class=\"l\">Oferiu sacrificis per obtenir el favor de Déu,<\/span><span class=\"l\">i confieu en el Senyor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Molts exclamen:<\/span><span class=\"l\">«En qui trobarem el nostre goig?<\/span><span class=\"l\">Que sigui el nostre estendard<\/span><span class=\"l\">la claror de la vostra mirada.»<\/span><span class=\"l\">El goig que m’heu posat al cor<\/span><span class=\"l\">és més gran que el que ells tenen<\/span><span class=\"l\">quan ha estat bona la collita de blat i de vi.<\/span><span class=\"l e\"><\/span><span class=\"l\">M’adormo en pau<\/span><span class=\"l\">així que em fico al llit<\/span><span class=\"l\">i em sento en vós segur,<\/span><span class=\"l\">només en vós, Senyor.<\/span><\/p><p id=\"p1279\" class=\"pr\"><span class=\"r\">Ant.<\/span> Tingueu pietat de mi, Senyor, i escolteu la meva pregària.<\/p><p id=\"p1280\" class=\"pr\"><span class=\"r\">Ant.<\/span> Durant la nit, beneïu el Senyor.<\/p><h4 id=\"p1281\">Salm 133<\/h4><p id=\"p1282\" class=\"v st\"><span class=\"l\">Beneïu el Senyor, vosaltres,<\/span><span class=\"l\">servents del Senyor,<\/span><span class=\"l\">que us quedeu de nit a casa seva.<\/span><span class=\"l e\"><\/span><span class=\"l\">Alceu les mans al santuari,<\/span><span class=\"l\">beneïu el Senyor.<\/span><span class=\"l\">Que el Senyor et beneeixi des de Sió,<\/span><span class=\"l\">el Senyor que ha fet cel i terra.<\/span><\/p><p id=\"p1283\" class=\"pr\"><span class=\"r\">Ant.<\/span> Durant la nit, beneïu el Senyor.<\/p><h3 id=\"p1284\">Lectura breu<\/h3><p id=\"p1285\" class=\"ref rub\"><span class=\"r\"><i>Dt 6, 4-7<\/i><\/span><\/p><p id=\"p1286\" class=\"pr\">Escolta, Israel: El Senyor és el nostre Déu, el Senyor és l’únic. Estima el Senyor, el teu Déu, amb tot el cor, amb tota l’ànima, amb totes les forces. Guarda en el teu cor les paraules dels manaments que avui et dono, inculca-les als teus fills, parla’n a casa teva i anant de camí, quan te’n vagis al llit i quan et llevis.<\/p><h3 id=\"p1287\">Oració<\/h3><p id=\"p1288\" class=\"pr rub\"><span class=\"r\">Quan la solemnitat coincideix en diumenge:<\/span><\/p><p id=\"p1289\" class=\"pr\">Guardeu-nos, Senyor, durant aquesta nit i feu que demà, en clarejar el nou dia, la celebració del diumenge ens ompli de l’alegria de la resurrecció del vostre Fill. Ell, que viu i regna pels segles dels segles. Amén.<\/p><p id=\"p1290\" class=\"pr rub\"><span class=\"r\">Quan la solemnitat no coincideix en diumenge:<\/span><\/p><p id=\"p1291\" class=\"pr\">Visiteu, Senyor, aquesta estança: allunyeu-ne les insídies de l’enemic. Que els vostres sants àngels hi habitin i ens guardin en pau, i que la vostra benedicció romangui sempre amb nosaltres. Per Crist Senyor nostre. Amén.<\/p><p id=\"p1292\" class=\"pr rub\"><span class=\"r\">La pregària i l’antífona final a la Santíssima Verge Maria, com a l’Ordinari.<\/span><\/p>", "chips": [["p1275", "Salmòdia"], ["p1284", "Lectura breu"], ["p1287", "Oració"]]}, {"name": "Després de les segones Vespres de les solemnitats", "tab": "Després de les II Vespres", "html": "<p id=\"p1294\" class=\"pr rub\"><span class=\"r\">Tot com a l’Ordinari, llevat del que segueix.<\/span><\/p><h3 id=\"p1295\">Salmòdia<\/h3><p id=\"p1296\" class=\"pr\"><span class=\"r\">Ant.<\/span> A recer de l’Altíssim no temo l’esglai de la nit.<\/p><h4 id=\"p1297\">Salm 90<\/h4><p id=\"p1298\" class=\"v st\"><span class=\"l\">Tu que vius a recer de l’Altíssim<\/span><span class=\"l\">i passes la nit a l’ombra del Totpoderós,<\/span><span class=\"l\">digues al Senyor: «Sou la muralla on m’emparo,<\/span><span class=\"l\">el meu Déu, en qui confio.»<\/span><span class=\"l e\"><\/span><span class=\"l\">Ell et guardarà del parany de l’ocellaire<\/span><span class=\"l\">i del flagell de la pesta;<\/span><span class=\"l\">t’abrigarà amb les seves plomes,<\/span><span class=\"l\">trobaràs refugi sota les seves ales;<\/span><span class=\"l\">et cobrirà fidelment com un escut.<\/span><span class=\"l e\"><\/span><span class=\"l\">No et farà por la basarda de la nit<\/span><span class=\"l\">ni la fletxa que vola de dia,<\/span><span class=\"l\">ni la pesta que s’esmuny a la fosca,<\/span><span class=\"l\">o l’epidèmia que a migdia fa estralls.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ni que en caiguin vora teu un miler<\/span><span class=\"l\">o deu mil al teu costat mateix,<\/span><span class=\"l\">a tu res no et tocarà.<\/span><span class=\"l\">Només obrint els ulls,<\/span><span class=\"l\">veuràs com acaben els injustos.<\/span><span class=\"l\">Quan deies: «M’emparo en el Senyor»,<\/span><span class=\"l\">feies de l’Altíssim el teu refugi.<\/span><span class=\"l e\"><\/span><span class=\"l\">No et passarà res de mal,<\/span><span class=\"l\">ni s’acostarà a casa teva cap desgràcia,<\/span><span class=\"l\">perquè ha donat ordre als seus àngels<\/span><span class=\"l\">de guardar-te en els camins:<\/span><span class=\"l e\"><\/span><span class=\"l\">et duran a les palmes de les mans,<\/span><span class=\"l\">perquè els teus peus no ensopeguin amb les pedres,<\/span><span class=\"l\">trepitjaràs lleopards i escurçons,<\/span><span class=\"l\">passaràs sobre lleons i serpents.<\/span><span class=\"l e\"><\/span><span class=\"l\">«Ja que ell s’ha fet tan meu, jo el salvaré,<\/span><span class=\"l\">el protegiré perquè coneix el meu nom.<\/span><span class=\"l\">Sempre que m’invoqui, l’escoltaré,<\/span><span class=\"l e\"><\/span><span class=\"l\">estaré vora d’ell en els perills,<\/span><span class=\"l\">el salvaré, i tothom l’estimarà;<\/span><span class=\"l\">saciaré el seu desig de llarga vida,<\/span><span class=\"l\">i fruirà de la meva salvació.»<\/span><\/p><p id=\"p1299\" class=\"pr\"><span class=\"r\">Ant.<\/span> A recer de l’Altíssim no temo l’esglai de la nit.<\/p><h3 id=\"p1300\">Lectura breu<\/h3><p id=\"p1301\" class=\"ref rub\"><span class=\"r\"><i>Ap 22, 4-5<\/i><\/span><\/p><p id=\"p1302\" class=\"pr\">Veuran Déu cara a cara i portaran el nom d’ell escrit al front. No hi haurà més nit, ni caldrà la llum dels gresols o la del sol; Déu mateix, el Senyor, els il·luminarà. I regnaran pels segles dels segles.<\/p><h3 id=\"p1303\">Oració<\/h3><p id=\"p1304\" class=\"pr rub\"><span class=\"r\">Quan la solemnitat coincideix en diumenge:<\/span><\/p><p id=\"p1305\" class=\"pr\">Guardeu-nos, Senyor, durant aquesta nit i feu que demà, en clarejar el nou dia, la celebració del diumenge ens ompli de l’alegria de la resurrecció del vostre Fill. Ell, que viu i regna pels segles dels segles. Amén.<\/p><p id=\"p1306\" class=\"pr rub\"><span class=\"r\">Quan la solemnitat no coincideix en diumenge:<\/span><\/p><p id=\"p1307\" class=\"pr\">Visiteu, Senyor, aquesta estança: allunyeu-ne les insídies de l’enemic. Que els vostres sants àngels hi habitin i ens guardin en pau, i que la vostra benedicció romangui sempre amb nosaltres. Per Crist Senyor nostre. Amén.<\/p><p id=\"p1308\" class=\"pr rub\"><span class=\"r\">La pregària i l’antífona final a la Santíssima Verge Maria, com a l’Ordinari.<\/span><\/p>", "chips": [["p1295", "Salmòdia"], ["p1300", "Lectura breu"], ["p1303", "Oració"]]}], "kind": "other", "title": "Completes", "rank": "", "sub": [], "intro": "<p id=\"p1271\" class=\"v\">Pregària abans del repòs nocturn<\/p><p id=\"p1272\" class=\"pr rub\"><span class=\"r\">Per a la pregària de Completes es pot prendre el formulari que correspon al dia de la setmana o bé, si es prefereix, un dels dos formularis indicats per al diumenge, dient, en aquest cas, la segona oració conclusiva.<\/span><\/p>", "missa": null}, {"label": "Salmòdia complementària per a Tèrcia, Sexta i Nona", "hours": [{"name": "Sèrie I (Tèrcia)", "tab": "Sèrie I (Tèrcia)", "html": "<h3 id=\"p1312\">Salm 119<\/h3><p id=\"p1313\" class=\"v st\"><span class=\"l\">Clamo al Senyor en la meva desgràcia,<\/span><span class=\"l\">i ell em respon.<\/span><span class=\"l\">Defenseu-me, Senyor, dels llavis mentiders,<\/span><span class=\"l\">de la llengua impostora.<\/span><span class=\"l e\"><\/span><span class=\"l\">Què et donarà Déu a mans plenes,<\/span><span class=\"l\">llengua impostora?<\/span><span class=\"l\">Les fletxes del guerrer, ben esmolades,<\/span><span class=\"l\">i brases de ginesta.<\/span><span class=\"l e\"><\/span><span class=\"l\">Ai de mi, que he de viure a Mósoc,<\/span><span class=\"l\">exiliat als campaments de Quedar.<\/span><span class=\"l\">Fa massa temps que jo he de viure<\/span><span class=\"l\">amb els qui no volen pau.<\/span><span class=\"l\">Jo els parlo de pau i de justícia,<\/span><span class=\"l\">i ells pensen en la guerra.<\/span><\/p><h3 id=\"p1314\">Salm 120<\/h3><p id=\"p1315\" class=\"v st\"><span class=\"l\">Alço els ulls a les muntanyes:<\/span><span class=\"l\">d’on em vindrà l’ajuda?<\/span><span class=\"l\">L’ajuda em vindrà del Senyor,<\/span><span class=\"l\">del Senyor que ha fet cel i terra.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que no deixi relliscar el teu peu,<\/span><span class=\"l\">ni s’adormi el qui et guarda.<\/span><span class=\"l\">El guardià d’Israel mai no s’adorm,<\/span><span class=\"l\">sempre vigila.<\/span><span class=\"l e\"><\/span><span class=\"l\">És el Senyor qui et guarda, el Senyor t’empara<\/span><span class=\"l\">al teu costat mateix.<\/span><span class=\"l\">De dia el sol no et farà mal,<\/span><span class=\"l\">ni la lluna de nit.<\/span><span class=\"l e\"><\/span><span class=\"l\">El Senyor et guarda de tota desgràcia,<\/span><span class=\"l\">et guarda la vida.<\/span><span class=\"l\">El Senyor guarda tots els teus passos<\/span><span class=\"l\">ara i per tots els segles.<\/span><\/p><h3 id=\"p1316\">Salm 121<\/h3><p id=\"p1317\" class=\"v st\"><span class=\"l\">Quina alegria quan em van dir:<\/span><span class=\"l\">«Anem a la casa del Senyor».<\/span><span class=\"l\">Ja han arribat els nostres peus<\/span><span class=\"l\">al teu llindar, Jerusalem.<\/span><span class=\"l e\"><\/span><span class=\"l\">Jerusalem, ciutat ben construïda,<\/span><span class=\"l\">conjunt harmoniós;<\/span><span class=\"l\">és allà que pugen les tribus,<\/span><span class=\"l\">les tribus del Senyor,<\/span><span class=\"l\">a complir l’aliança d’Israel<\/span><span class=\"l\">a lloar el nom del Senyor.<\/span><span class=\"l\">Allí hi ha els tribunals de justícia,<\/span><span class=\"l\">els tribunals del palau de David.<\/span><span class=\"l e\"><\/span><span class=\"l\">Augureu la pau a Jerusalem:<\/span><span class=\"l\">«Que visquin segurs els qui t’estimen,<\/span><span class=\"l\">que sigui inviolable la pau dels teus murs,<\/span><span class=\"l\">la quietud dels teus merlets».<\/span><span class=\"l e\"><\/span><span class=\"l\">Per amor dels meus germans i amics, deixeu-me dir:<\/span><span class=\"l\">«Que hi hagi pau dintre teu».<\/span><span class=\"l\">Per la casa del Senyor, el nostre Déu,<\/span><span class=\"l\">et desitjo la felicitat.<\/span><\/p>", "chips": [["p1312", "Salm 119"], ["p1314", "Salm 120"], ["p1316", "Salm 121"]]}, {"name": "Sèrie II (Sexta)", "tab": "Sèrie II (Sexta)", "html": "<h3 id=\"p1319\">Salm 122<\/h3><p id=\"p1320\" class=\"v st\"><span class=\"l\">A vós, que teniu el tron dalt del cel,<\/span><span class=\"l\">aixeco els meus ulls.<\/span><span class=\"l\">Com l'esclau té els ulls posats<\/span><span class=\"l\">en les mans del seu amo,<\/span><span class=\"l e\"><\/span><span class=\"l\">com l'esclava té els seus ulls<\/span><span class=\"l\">en les mans de la mestressa,<\/span><span class=\"l\">tenim els ulls en el Senyor, el nostre Déu,<\/span><span class=\"l\">fins que s'apiadi de nosaltres.<\/span><span class=\"l e\"><\/span><span class=\"l\">Compadiu-nos, Senyor, compadiu-nos,<\/span><span class=\"l\">estem saturats de menyspreu.<\/span><span class=\"l\">La nostra ànima n'està ben saturada,<\/span><span class=\"l\">dels escarnis dels altius,<\/span><span class=\"l\">del menyspreu dels insolents.<\/span><\/p><h3 id=\"p1321\">Salm 123<\/h3><p id=\"p1322\" class=\"v st\"><span class=\"l\">Si el Senyor no hagués estat a favor nostre,<\/span><span class=\"l\">-que respongui el poble d'Israel-,<\/span><span class=\"l\">si el Senyor no hagués estat a favor nostre,<\/span><span class=\"l\">quan els homes intentaven assaltar-nos<\/span><span class=\"l\">ens haurien engolit de viu en viu:<\/span><span class=\"l\">tan gran era la fúria que portaven.<\/span><span class=\"l e\"><\/span><span class=\"l\">Quan la riuada ens vingué a sobre,<\/span><span class=\"l\">ens hauria passat la inundació<\/span><span class=\"l\">més amunt del coll,<\/span><span class=\"l\">més amunt del coll ens hauria passat<\/span><span class=\"l\">la crescuda de les aigües.<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneït sigui el Senyor,<\/span><span class=\"l\">que no ens deixa caure a les seves dents.<\/span><span class=\"l\">Hem salvat la vida com l'ocell que fuig<\/span><span class=\"l\">del llaç dels caçadors.<\/span><span class=\"l\">S'ha trencat el llaç, i tots hem fugit.<\/span><span class=\"l e\"><\/span><span class=\"l\">El nostre auxili és el nom del Senyor,<\/span><span class=\"l\">del Senyor que ha fet el cel i la terra.<\/span><\/p><h3 id=\"p1323\">Salm 124<\/h3><p id=\"p1324\" class=\"v st\"><span class=\"l\">El qui confia en el Senyor mai no caurà.<\/span><span class=\"l\">Es com Sió, incommovible, ferm per sempre.<\/span><span class=\"l e\"><\/span><span class=\"l\">Jerusalem està envoltada de muntanyes.<\/span><span class=\"l\">Es així com el Senyor envolta el seu poble,<\/span><span class=\"l\">ara i per tots els segles.<\/span><span class=\"l e\"><\/span><span class=\"l\">El ceptre injust no pesarà més<\/span><span class=\"l\">sobre la terra dels justos,<\/span><span class=\"l\">no fos que els justos donin la mà als qui fan el mal.<\/span><span class=\"l e\"><\/span><span class=\"l\">Senyor, feu feliços els bons<\/span><span class=\"l\">i els rectes de cor.<\/span><span class=\"l\">Però els qui es desvien per camins tortuosos,<\/span><span class=\"l\">el Senyor se'ls endurà amb els malfactors.<\/span><span class=\"l\">Pau a Israel!<\/span><\/p>", "chips": [["p1319", "Salm 122"], ["p1321", "Salm 123"], ["p1323", "Salm 124"]]}, {"name": "Sèrie III (Nona)", "tab": "Sèrie III (Nona)", "html": "<h3 id=\"p1326\">Salm 125<\/h3><p id=\"p1327\" class=\"v st\"><span class=\"l\">Quan el Senyor renovà la vida de Sió<\/span><span class=\"l\">ho crèiem un somni;<\/span><span class=\"l\">la nostra boca s’ompli d’alegria,<\/span><span class=\"l\">de crits i de rialles.<\/span><span class=\"l e\"><\/span><span class=\"l\">Els altres pobles es deien: «És magnífic<\/span><span class=\"l\">el que el Senyor fa a favor d’ells.»<\/span><span class=\"l\">És magnífic el que el Senyor fa a favor nostre,<\/span><span class=\"l\">amb quin goig ho celebrem!<\/span><span class=\"l e\"><\/span><span class=\"l\">Renoveu la nostra vida, Senyor,<\/span><span class=\"l\">com l’aigua renova l’estepa del Nègueb.<\/span><span class=\"l\">Els qui sembraven amb llàgrimes als ulls<\/span><span class=\"l\">criden de goig a la sega.<\/span><span class=\"l e\"><\/span><span class=\"l\">Sortien a sembrar tot plorant,<\/span><span class=\"l\">emportant-se la llavor;<\/span><span class=\"l\">i tornaran cantant d’alegria,<\/span><span class=\"l\">duent a coll les seves garbes.<\/span><\/p><h3 id=\"p1328\">Salm 126<\/h3><p id=\"p1329\" class=\"v st\"><span class=\"l\">Si el Senyor no construeix la casa,<\/span><span class=\"l\">és inútil l’afany dels constructors.<\/span><span class=\"l\">Si el Senyor no guarda la ciutat,<\/span><span class=\"l\">és inútil que vigilin els guardes.<\/span><span class=\"l e\"><\/span><span class=\"l\">Es inútil que us lleveu tan de matí,<\/span><span class=\"l\">i aneu tan tard a reposar,<\/span><span class=\"l\">per menjar el pa que us guanyeu a dures penes.<\/span><span class=\"l\">Fins quan dormen, Déu el dóna als seus amics.<\/span><span class=\"l e\"><\/span><span class=\"l\">La millor herència són els fills, do del Senyor,<\/span><span class=\"l\">els descendents són la millor recompensa;<\/span><span class=\"l\">els fills que heu tingut quan éreu joves<\/span><span class=\"l\">són com les fletxes en mans d’un guerrer;<\/span><span class=\"l e\"><\/span><span class=\"l\">feliç l’home que se n’omple el buirac:<\/span><span class=\"l\">si discuteix amb algú davant la gent,<\/span><span class=\"l\">no haurà de retirar-se avergonyit.<\/span><\/p><h3 id=\"p1330\">Salm 127<\/h3><p id=\"p1331\" class=\"v st\"><span class=\"l\">Feliç tu, fidel del Senyor,<\/span><span class=\"l\">que vius seguint els seus camins.<\/span><span class=\"l e\"><\/span><span class=\"l\">Menjaràs del fruit del teu treball,<\/span><span class=\"l\">seràs feliç i tindràs sort.<\/span><span class=\"l\">La teva esposa fruitarà com una parra,<\/span><span class=\"l\">dins la intimitat de casa teva;<\/span><span class=\"l e\"><\/span><span class=\"l\">veuràs els fills com plançons d’olivera<\/span><span class=\"l\">al voltant de la taula.<\/span><span class=\"l\">És així com els fidels del Senyor<\/span><span class=\"l\">seran beneïts.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que el Senyor et beneeixi des de Sió.<\/span><span class=\"l\">Que tota la vida puguis veure<\/span><span class=\"l\">prosperar Jerusalem.<\/span><span class=\"l\">Que puguis veure els fills dels teus fills.<\/span><span class=\"l\">Pau a Israel!<\/span><\/p><p id=\"p1332\" class=\"pr rub\"><span class=\"r\">En lloc dels salms graduals 121 i 126, es poden recitar els salms 128 i 130, respectivament.<\/span><\/p><h3 id=\"p1333\">Salm 128<\/h3><p id=\"p1334\" class=\"v st\"><span class=\"l\">Quantes vegades, des de jove, m’han combatut!<\/span><span class=\"l\">Que respongui el poble d’Israel:<\/span><span class=\"l\">Quantes vegades, des de jove, m’han combatut,<\/span><span class=\"l\">i mai no em poden vèncer.<\/span><span class=\"l e\"><\/span><span class=\"l\">M’han llaurat tot el cos,<\/span><span class=\"l\">per obrir-hi solcs ben llargs;<\/span><span class=\"l\">però la justícia del Senyor ha trencat<\/span><span class=\"l\">les sogues dels injustos.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que se’n tornin defraudats i avergonyits<\/span><span class=\"l\">els qui volien fer mal a Sió,<\/span><span class=\"l\">i siguin com l’herba dels terrats<\/span><span class=\"l\">que abans d’espigar-se s’asseca;<\/span><span class=\"l e\"><\/span><span class=\"l\">no se’n faran cap manat els segadors<\/span><span class=\"l\">ni cap braçat els qui lliguen les garbes,<\/span><span class=\"l\">i no diu ningú dels qui passen a la vora:<\/span><span class=\"l\">«El Senyor us ha beneït.»<\/span><span class=\"l\">Us beneïm en el nom del Senyor.<\/span><\/p><h3 id=\"p1335\">Salm 130<\/h3><p id=\"p1336\" class=\"v st\"><span class=\"l\">El meu cor no és ambiciós, Senyor,<\/span><span class=\"l\">no són altius els meus ulls;<\/span><span class=\"l\">visc sense pretensions de grandeses,<\/span><span class=\"l\">o de coses massa altes per a mi;<\/span><span class=\"l e\"><\/span><span class=\"l\">em mantinc en una pau tranquil·la,<\/span><span class=\"l\">com un nen a la falda de la mare,<\/span><span class=\"l\">tot esperant els vostres dons.<\/span><span class=\"l\">Israel espera en el Senyor<\/span><span class=\"l\">ara i per tots els segles.<\/span><\/p>", "chips": [["p1326", "Salm 125"], ["p1328", "Salm 126"], ["p1330", "Salm 127"], ["p1333", "Salm 128"], ["p1335", "Salm 130"]]}, {"name": "Sant Antoni Maria Claret, quan la solemnitat cau en diumenge", "tab": "Claret en diumenge", "html": "<p id=\"p1338\" class=\"pr rub\"><span class=\"r\">Si la solemnitat de sant Antoni Maria Claret coincideix en diumenge, es reciten els salms següents a l’Hora d’entre dia.<\/span><\/p><h3 id=\"p1339\">Salm 117 I<\/h3><p id=\"p1340\" class=\"v st\"><span class=\"l\">Enaltiu el Senyor: Que n’és, de bo,<\/span><span class=\"l\">perdura eternament el seu amor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Que respongui la casa d’Israel:<\/span><span class=\"l\">perdura eternament el seu amor.<\/span><span class=\"l\">Que respongui la casa d’Aharon:<\/span><span class=\"l\">perdura eternament el seu amor.<\/span><span class=\"l\">Que responguin els qui veneren el Senyor:<\/span><span class=\"l\">perdura eternament el seu amor.<\/span><span class=\"l e\"><\/span><span class=\"l\">Enmig del perill vaig clamar al Senyor,<\/span><span class=\"l\">i em va escoltar, i me’n va treure.<\/span><span class=\"l\">Tinc el Senyor a favor, res no em fa por,<\/span><span class=\"l\">els homes, què em poden fer?<\/span><span class=\"l\">Tinc el Senyor a favor, ell em defensa,<\/span><span class=\"l\">veuré caure els enemics.<\/span><span class=\"l e\"><\/span><span class=\"l\">Més val emparar-se en el Senyor,<\/span><span class=\"l\">que posar confiança en els homes.<\/span><span class=\"l\">Més val emparar-se en el Senyor,<\/span><span class=\"l\">que fiar-se dels poderosos.<\/span><\/p><h3 id=\"p1341\">Salm 117 II<\/h3><p id=\"p1342\" class=\"v st\"><span class=\"l\">Quan totes les nacions m’envoltaven,<\/span><span class=\"l\">invocant el Senyor les he vençudes.<\/span><span class=\"l\">Quan m’envoltaven i estrenyien el setge,<\/span><span class=\"l\">invocant el Senyor les he vençudes.<\/span><span class=\"l\">Quan m’envoltaven com un eixam,<\/span><span class=\"l\">i s’arboraven com foc d’argelagues,<\/span><span class=\"l\">invocant el Senyor les he vençudes.<\/span><span class=\"l e\"><\/span><span class=\"l\">M’empenyien tan fort que anava a caure,<\/span><span class=\"l\">però el Senyor m’ha sostingut.<\/span><span class=\"l\">Del Senyor em ve la força i el triomf,<\/span><span class=\"l\">és ell qui m’ha salvat.<\/span><span class=\"l e\"><\/span><span class=\"l\">Escolteu, crits de festa i de victòria<\/span><span class=\"l\">al campament dels justos:<\/span><span class=\"l\">«La dreta del Senyor fa proeses,<\/span><span class=\"l\">la dreta del Senyor em glorifica,<\/span><span class=\"l\">la dreta del Senyor fa proeses.»<\/span><span class=\"l e\"><\/span><span class=\"l\">No moriré, viuré encara,<\/span><span class=\"l\">per contar les proeses del Senyor.<\/span><span class=\"l\">Els càstigs del Senyor han estat severs,<\/span><span class=\"l\">però no m’ha abandonat a la mort.<\/span><\/p><h3 id=\"p1343\">Salm 117 III<\/h3><p id=\"p1344\" class=\"v st\"><span class=\"l\">Obriu-me les portes dels justos:<\/span><span class=\"l\">entraré a donar gràcies al Senyor.<\/span><span class=\"l\">Aquest és el portal del Senyor,<\/span><span class=\"l\">els justos hi poden entrar.<\/span><span class=\"l\">Gràcies, perquè vós m’heu escoltat<\/span><span class=\"l\">i heu vingut a salvar-me.<\/span><span class=\"l e\"><\/span><span class=\"l\">La pedra que rebutjaven els constructors<\/span><span class=\"l\">ara corona l’edifici.<\/span><span class=\"l\">És el Senyor qui ho ha fet,<\/span><span class=\"l\">i els nostres ulls se’n meravellen.<\/span><span class=\"l e\"><\/span><span class=\"l\">Avui és el dia en què ha obrat el Senyor:<\/span><span class=\"l\">alegrem-nos i celebrem-lo.<\/span><span class=\"l\">Ah, Senyor, doneu-nos la victòria!<\/span><span class=\"l\">Ah, Senyor, feu que prosperem!<\/span><span class=\"l e\"><\/span><span class=\"l\">Beneït el qui ve en nom del Senyor.<\/span><span class=\"l\">Us beneïm des de la casa del Senyor.<\/span><span class=\"l\">El Senyor és Déu: Que ell ens il·lumini.<\/span><span class=\"l e\"><\/span><span class=\"l\">Porteu els rams, ordeneu la processó,<\/span><span class=\"l\">fins a les vores de l’altar.<\/span><span class=\"l\">Vós sou el meu Déu, us dono gràcies,<\/span><span class=\"l\">us exalço, Déu meu!<\/span><span class=\"l\">Enaltiu el Senyor: Que n’és, de bo,<\/span><span class=\"l\">perdura eternament el seu amor.<\/span><\/p><div class=\"gap\"><\/div>", "chips": [["p1339", "Salm 117 I"], ["p1341", "Salm 117 II"], ["p1343", "Salm 117 III"]]}], "kind": "other", "title": "Salmòdia complementària per a Tèrcia, Sexta i Nona", "rank": "", "sub": [], "intro": "<p id=\"p1310\" class=\"pr rub\"><span class=\"r\">En les solemnitats que no coincideixen en diumenge, després de la invocació inicial i de l’himne, es reciten els salms de la sèrie corresponent amb les antífones pròpies.<\/span><\/p>", "missa": null}, {"label": "Missa ritual", "kind": "missa", "group": "rituales", "title": "Missa ritual per al dia de la professió religiosa", "rank": "", "sub": [], "intro": "", "hours": [], "missa": {"title": "Missa ritual per al dia de la professió religiosa", "html": "<p class=\"nota\" id=\"m8x0\">Tot com al Missal Romà i al Leccionari. Es poden emprar tanmateix les següents oracions i antífones d’introducció i de comunió:<\/p><h3 class=\"rub\" id=\"m8x1\">Antífona d’introducció <span class=\"ref\">Cf Sl 39,8-10<\/span><\/h3><div class=\"pl\" id=\"m8x2\"><span class=\"l\">Aquí em teniu, Senyor! Vull fer la vostra voluntat,<\/span><span class=\"l\">guardo la vostra Llei al fons del cor.<\/span><span class=\"l\">Per això anuncio amb goig la salvació<\/span><span class=\"l\">davant el poble en dia de gran festa.<\/span><\/div><div class=\"obien\" id=\"m8x3\">O bé <span class=\"ref\">Jn. 15, 16<\/span><\/div><div class=\"pl\" id=\"m8x4\"><span class=\"l\">No sou vosaltres els qui m’heu escollit.<\/span><span class=\"l\">Soc jo qui us he escollit<\/span><span class=\"l\">per confiar-vos la missió d’anar pertot arreu<\/span><span class=\"l\">donar fruit, un fruit que durarà sempre.<\/span><\/div><h3 class=\"rub\" id=\"m8x5\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m8x6\"><span class=\"l\">Senyor, sou Vós qui desvetlleu i atorgueu la vocació:<\/span><span class=\"l\">mireu aquests germans nostres<\/span><span class=\"l\">(aquest germà nostre)<\/span><span class=\"l\">que, responent generosament a la vostra invitació<\/span><span class=\"l\">us consagren (consagra) la seva vida:<\/span><span class=\"l\">concediu-los (li) de conservar atentament la vostra paraula<\/span><span class=\"l\">tot meditant-la en el seu cor.<\/span><span class=\"l\">Arboreu-los (lo) en el vostre amor,<\/span><span class=\"l\">per tal que siguin (sigui) un signe clar<\/span><span class=\"l\">que Vós sou l’únic Déu veritable<\/span><span class=\"l\">que estimeu tothom amb un amor infinit.<\/span><span class=\"l\">Per nostre Senyor Jesucrist...<\/span><\/div><h3 class=\"rub\" id=\"m8x7\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m8x8\"><span class=\"l\">Senyor, mireu benignament<\/span><span class=\"l\">els dons que presentem en el vostre altar<\/span><span class=\"l\">en la celebració de la professió religiosa<\/span><span class=\"l\">d’aquests servents vostres(d’aquest servent vostre)<\/span><span class=\"l\">que es consagren (consagra) al vostre servei<\/span><span class=\"l\">amb el nou títol dels vots religiosos.<\/span><span class=\"l\">Concediu-los(li), de ser, en el vostre Fill,<\/span><span class=\"l\">un sacrifici perenne de lloança.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m8x9\">Prefaci<\/h3><div class=\"pl\" id=\"m8x10\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> El Senyor sigui amb vosaltres.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> I amb el vostre esperit.<\/span><\/div><div class=\"pl\" id=\"m8x11\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> Amunt els cors.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Els elevem al Senyor.<\/span><\/div><div class=\"pl\" id=\"m8x12\"><span class=\"l\"><span class=\"vr\">&#8483;.<\/span> Donem gràcies al Senyor, Déu nostre.<\/span><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Cal fer-ho i és de justícia.<\/span><\/div><div class=\"pl\" id=\"m8x13\"><span class=\"l\">Es realment just i necessari,<\/span><span class=\"l\">és el nostre deure i és la nostra salvació,<\/span><span class=\"l\">que sempre i en tot lloc us donem gràcies,<\/span><span class=\"l\">Senyor, Pare Sant, Déu omnipotent i etern,<\/span><span class=\"l\">per Crist Senyor nostre,<\/span><\/div><div class=\"pl\" id=\"m8x14\"><span class=\"l\">i que celebrem la vostra providència admirable<\/span><span class=\"l\">envers els vostres servents<\/span><span class=\"l\">en els quals heu suscitat el desig<\/span><span class=\"l\">de seguir més de prop el Crist Senyor nostre<\/span><span class=\"l\">seguint els passos de sant Antoni Maria Claret.<\/span><\/div><div class=\"pl\" id=\"m8x15\"><span class=\"l\">Vós els crideu incessantment<\/span><span class=\"l\">a l’exercici del ministeri de la Paraula;<\/span><span class=\"l\">i els conduïu a experimentar des d’ara<\/span><span class=\"l\">els béns que posseirem en el món venidor.<\/span><\/div><div class=\"pl\" id=\"m8x16\"><span class=\"l\">Per això, amb els àngels i els sants,<\/span><span class=\"l\">cantem sense parar l’himne de la vostra glòria, dient<\/span><\/div><p class=\"pr\" id=\"m8x17\">Sant, Sant, Sant...<\/p><h3 class=\"rub\" id=\"m8x18\">Antífona de comunió <span class=\"ref\">Col 1, 24<\/span><\/h3><p class=\"pr\" id=\"m8x19\">Completo a la meva carn el que falta als patiments de Crist, en favor del seu cos, que és l’Església.<\/p><div class=\"obien\" id=\"m8x20\">O bé <span class=\"ref\">Sl 132, 1<\/span><\/div><p class=\"pr\" id=\"m8x21\">Que n’és, de bo i agradable, viure tots junts els germans!<\/p><h3 class=\"rub\" id=\"m8x22\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m8x23\"><span class=\"l\">Senyor, els sagraments que hem rebut<\/span><span class=\"l\">confirmin en la seva vocació<\/span><span class=\"l\">els nostres germans (el nostre germà)<\/span><span class=\"l\">perquè, lliurant-se en servei especial<\/span><span class=\"l\">al Cor Immaculat de Maria,<\/span><span class=\"l\">assoleixin (assoleixi) la caritat perfecta<\/span><span class=\"l\">en la seva vida missionera.<\/span><span class=\"l\">Per Jesucrist, Senyor nostre.<\/span><\/div>", "chips": [["m8x1", "Entrada"], ["m8x5", "Col·lecta"], ["m8x7", "Ofrenes"], ["m8x9", "Prefaci"], ["m8x18", "Comunió"], ["m8x22", "Postcomunió"]], "color": "blanco", "fecha": "Missa ritual"}}, {"label": "Missa ritual", "kind": "missa", "group": "rituales", "title": "Missa amb motiu del XXV o L aniversari de la professió", "rank": "", "sub": [], "intro": "", "hours": [], "missa": {"title": "Missa amb motiu del XXV o L aniversari de la professió", "html": "<p class=\"nota\" id=\"m9x0\">Aquesta missa es pot celebrar quan ho permet la normativa litúrgica.<\/p><p class=\"nota\" id=\"m9x1\">S’utilitzen els textos de la Missa ritual de professió, o les oracions següents (A), o el formulari B quan qui celebra l’aniversari no presideix la celebració.<\/p><h3 class=\"rub\" style=\"justify-content:center\" id=\"m9x2\">A<\/h3><p class=\"nota\" id=\"m9x3\">Quan el qui celebra l’aniversari de la professió presideix la celebració, s’utilitzen les oracions següents:<\/p><h3 class=\"rub\" id=\"m9x4\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m9x5\"><span class=\"l\">Us donem gràcies. Senyor,<\/span><span class=\"l\">perquè avui, al cap de vint-i-cinc (o cinquanta) anys<\/span><span class=\"l\">de vida religiosa claretiana,<\/span><span class=\"l\">puc renovar, ple d’alegria, la meva consagració a Vós<\/span><span class=\"l\">i la meva donació especial al Cor Immaculat de Maria.<\/span><\/div><div class=\"pl\" id=\"m9x6\"><span class=\"l\">Concediu-me la gràcia de cremar d’amor.<\/span><span class=\"l\">de seguir i d’imitar el vostre Fill<\/span><span class=\"l\">i que, seguint les petjades de sant Antoni Maria Claret<\/span><span class=\"l\">cerqui sempre i únicament la vostra glòria<\/span><span class=\"l\">i la salvació de tothom.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><h3 class=\"rub\" id=\"m9x7\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m9x8\"><span class=\"l\">Acolliu, Senyor, aquests dons que us presentem<\/span><span class=\"l\">i l’oblació que avui renovo i confirmo;<\/span><span class=\"l\">concediu-me que, seguint l’esperit de sant Antoni M. Claret<\/span><span class=\"l\">us pugui servir a Vós i la vostra Església.<\/span><span class=\"l\">Per Crist, Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m9x9\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m9x10\"><span class=\"l\">Després de rebre, Senyor,<\/span><span class=\"l\">el Cos i la Sang del vostre Fill,<\/span><span class=\"l\">en l’aniversari de la meva professió,<\/span><span class=\"l\">us supliquem que em concediu<\/span><span class=\"l\">de perseverar en la vocació claretiana.<\/span><span class=\"l\">Per Jesucrist, nostre Senyor.<\/span><\/div><h3 class=\"rub\" style=\"justify-content:center\" id=\"m9x11\">B<\/h3><p class=\"nota\" id=\"m9x12\">Quan el qui presideix la celebració no és el mateix que celebra l’aniversari de Professió, s’utilitzen les oracions següents:<\/p><h3 class=\"rub\" id=\"m9x13\">Antífona d’introducció <span class=\"ref\">Sl 39, 8a-9a<\/span><\/h3><p class=\"pr\" id=\"m9x14\">Aquí em teniu: «Déu meu, vull fer la vostra voluntat, guardo la vostra llei al fons del cor»<\/p><h3 class=\"rub\" id=\"m9x15\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m9x16\"><span class=\"l\">Us donem gràcies, Senyor,<\/span><span class=\"l\">perquè el nostre germà N.<\/span><span class=\"l\">avui, després de vint-i-cinc (o cinquanta) anys<\/span><span class=\"l\">de vida religiosa claretiana<\/span><span class=\"l\">pot renovar, joiosament, la seva consagració a Vós<\/span><span class=\"l\">i la seva donació especial al Cor Immaculat de Maria:<\/span><span class=\"l\">concediu-li que sigui arborat de caritat,<\/span><span class=\"l\">que segueixi i imiti el vostre Fill<\/span><span class=\"l\">i que, seguint les petjades de Sant Antoni Maria Claret,<\/span><span class=\"l\">cerqui sempre i únicament la vostra glòria<\/span><span class=\"l\">i la salvació de tothom.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><h3 class=\"rub\" id=\"m9x17\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m9x18\"><span class=\"l\">Senyor, juntament amb aquests dons<\/span><span class=\"l\">acolliu l’ofrena de la seva persona<\/span><span class=\"l\">que avui el nostre germà vol renovar i confirmar;<\/span><span class=\"l\">concediu-li que, fidel a l’esperit de sant Antoni Maria Claret<\/span><span class=\"l\">us pugui servir a Vós, i l’Església.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m9x19\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m9x20\"><span class=\"l\">Acabem de rebre, Senyor,<\/span><span class=\"l\">el cos i la sang del vostre Fill,<\/span><span class=\"l\">i us demanem per al nostre germà N.<\/span><span class=\"l\">que celebra el seu aniversari de professió,<\/span><span class=\"l\">la gràcia de perseverar en la seva vocació claretiana.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div>", "chips": [["m9x2", "Formulari A"], ["m9x11", "Formulari B"]], "color": "blanco", "fecha": "Missa ritual"}}, {"label": "Els dissabtes", "kind": "missa", "group": "votivas", "title": "Missa votiva de l’Immaculat Cor de la benaurada Verge Maria", "rank": "", "sub": [], "intro": "", "hours": [], "missa": {"title": "Missa votiva de l’Immaculat Cor de la benaurada Verge Maria", "html": "<p class=\"nota\" id=\"m10x0\">(Es pot dir els dissabtes, quan ho permeti la normativa litúrgica)<\/p><h3 class=\"rub\" id=\"m10x1\">Antífona d’introducció<\/h3><div class=\"pl\" id=\"m10x2\"><span class=\"l\">El Déu Altíssim us ha beneït més que totes les dones de la terra.<\/span><span class=\"l\">Que Déu us enalteixi eternament.<\/span><\/div><h3 class=\"rub\" id=\"m10x3\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m10x4\"><span class=\"l\">Senyor, concediu-nos d’imitar la santíssima Verge Maria<\/span><span class=\"l\">en la seva cooperació a l’obra salvadora del vostre Fill<\/span><span class=\"l\">de manera que, guiats per l’Esperit Sant,<\/span><span class=\"l\">progressem en la fe, l’esperança i la caritat,<\/span><span class=\"l\">i ens esmercem en el ministeri de la salvació<\/span><span class=\"l\">de tots els homes.<\/span><span class=\"l\">Per nostre Senyor, Jesucrist.<\/span><\/div><div class=\"obien\" id=\"m10x5\">O bé<\/div><div class=\"pl\" id=\"m10x6\"><span class=\"l\">Feu, Senyor, que meditem la vostra Paraula,<\/span><span class=\"l\">encarnada en el si de la Verge Maria,<\/span><span class=\"l\">i la guardem en el nostre cor,<\/span><span class=\"l\">perquè siguem servidors fidels<\/span><span class=\"l\">en la proclamació de la bona nova del vostre regne.<\/span><span class=\"l\">Pel nostre Senyor Jesucrist,<\/span><\/div><h3 class=\"rub\" id=\"m10x7\">Oració sobre les ofrenes<\/h3><div class=\"pl\" id=\"m10x8\"><span class=\"l\">Us presentem, Senyor, aquests dons<\/span><span class=\"l\">tot fent memòria de la Verge Santa Maria<\/span><span class=\"l\">que oferí el vostre Fill al peu de la creu;<\/span><span class=\"l\">concediu-nos que us sigui sempre plaent<\/span><span class=\"l\">l’oblació de la nostra vida.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div><h3 class=\"rub\" id=\"m10x9\">Oració després de la comunió<\/h3><div class=\"pl\" id=\"m10x10\"><span class=\"l\">Envigorits amb aquests sagraments<\/span><span class=\"l\">us demanem, Senyor Déu nostre,<\/span><span class=\"l\">que venerant la Immaculada Verge Maria,<\/span><span class=\"l\">cooperem en el seu ofici maternal<\/span><span class=\"l\">en la missió apostòlica.<\/span><span class=\"l\">Per Crist Senyor nostre.<\/span><\/div>", "chips": [["m10x1", "Entrada"], ["m10x3", "Col·lecta"], ["m10x7", "Ofrenes"], ["m10x9", "Postcomunió"]], "color": "blanco", "fecha": "Els dissabtes"}}, {"label": "Per diverses necessitats", "kind": "missa", "group": "necesidades", "title": "Missa per fomentar la vida de comunitat", "rank": "", "sub": [], "intro": "", "hours": [], "missa": {"title": "Missa per fomentar la vida de comunitat", "html": "<h3 class=\"rub\" id=\"m11x0\">Antífona d’introducció <span class=\"ref\">JN 17,21<\/span><\/h3><div class=\"pl\" id=\"m11x1\"><span class=\"l\">Que, tots siguin u. Que estiguin en nosaltres, Pare,<\/span><span class=\"l\">com Vós esteu en mi i jo en Vós.<\/span><span class=\"l\">Així el món creurà que Vós m’heu enviat.<\/span><\/div><div class=\"obien\" id=\"m11x2\">O bé <span class=\"ref\">Sl 132<\/span><\/div><p class=\"pr\" id=\"m11x3\">Que n’és, de bo i agradable, viure junts tots els germans!<\/p><h3 class=\"rub\" id=\"m11x4\">Oració col·lecta<\/h3><div class=\"pl\" id=\"m11x5\"><span class=\"l\">Senyor, Déu nostre,<\/span><span class=\"l\">devotament us demanem que uniu en un mateix Esperit<\/span><span class=\"l\">els qui compartim l’esperit de sant Antoni Maria Claret:<\/span><span class=\"l\">així, fets un sol cor per la caritat,<\/span><span class=\"l\">podrem ser testimonis del vostre amor entre els homes.<\/span><span class=\"l\">Per nostre Senyor Jesucrist.<\/span><\/div><h3 class=\"rub\" id=\"m11x6\">Lectura primera <span class=\"ref\">Ac 2, 42-47<\/span><\/h3><p class=\"lema\" id=\"m11x7\">Tots els creients vivien units i eren constants en la fracció del pa<\/p><p class=\"pr\" id=\"m11x8\">Lectura dels Fets dels Apòstols:<\/p><p class=\"pr\" id=\"m11x9\">Tots eren constants a escoltar l’ensenyament dels apòstols i a viure en comunió fraterna, a partir el pa i a assistir a les pregàries. Per mitjà dels apòstols es feien molts prodigis i senyals, i la gent sentia un gran respecte.<\/p><p class=\"pr\" id=\"m11x10\">Tots els creients vivien units i tot ho tenien al servei de tots; venien les propietats i els béns per distribuir els diners de la venda segons les necessitats de cadascú. Cada dia eren constants a assistir unànimement al culte del temple. A casa, partien el pa i prenien junts el seu aliment amb joia i senzillesa de cor. Lloaven Déu i eren ben vistos de tot el poble. I cada dia el Senyor afegia a la comunitat els qui acollien la salvació.<\/p><p class=\"fin\" id=\"m11x11\">Paraula de Déu<\/p><div class=\"obien\" id=\"m11x12\">O bé <span class=\"ref\">Ac 4, 32-35<\/span><\/div><p class=\"lema\" id=\"m11x13\">Tenien un sol cor i una sola ànima<\/p><p class=\"pr\" id=\"m11x14\">Lectura dels Fets dels Apòstols:<\/p><p class=\"pr\" id=\"m11x15\">La multitud dels creients tenia un sol cor i una sola ànima, i cap d’ells no considerava com a propis els béns que posseïa, sinó que tot estava al servei de tots. Amb gran poder els apòstols donaven testimoni de la resurrecció de Jesús, el Senyor, i la gràcia abundosa de Déu actuava en ells.<\/p><p class=\"pr\" id=\"m11x16\">Ningú d’entre ells no vivia en la indigència, perquè tots els qui eren propietaris de terres o de cases les venien, portaven el producte de la venda, i el dipositaven als peus dels apòstols. Després era distribuït segons les necessitats de cadascú.<\/p><p class=\"fin\" id=\"m11x17\">Paraula de Déu<\/p><h3 class=\"rub\" id=\"m11x18\">Salm responsorial <span class=\"ref\">1Jn 4, 7. 8. 10. 11. 12<\/span><\/h3><div class=\"pl\" id=\"m11x19\"><span class=\"l\"><span class=\"vr\">&#8479;.<\/span> Mantenim-nos en l’amor fratern.<\/span><\/div><div class=\"pl\" id=\"m11x20\"><span class=\"l\">Estimem-nos els uns als altres,<\/span><span class=\"l\">perquè l’amor ve de Déu;<\/span><span class=\"l\">tothom qui estima ha nascut de Déu<\/span><span class=\"l\">i coneix Déu. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m11x21\"><span class=\"l\">El qui no estima no coneix Déu,<\/span><span class=\"l\">perquè Déu és amor. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m11x22\"><span class=\"l\">L’amor consisteix en això:<\/span><span class=\"l\">no som nosaltres qui ens hem avançat a estimar Déu;<\/span><span class=\"l\">ell ens ha estimat primer i ha enviat el seu Fill<\/span><span class=\"l\">com a víctima que expia els nostres pecats. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m11x23\"><span class=\"l\">Si Déu ens ha estimat tant,<\/span><span class=\"l\">també nosaltres ens hem d’estimar<\/span><span class=\"l\">els uns als altres. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><div class=\"pl\" id=\"m11x24\"><span class=\"l\">A Déu, ningú no l’ha vist mai;<\/span><span class=\"l\">però si ens estimem,<\/span><span class=\"l\">ell està en nosaltres<\/span><span class=\"l\">i, dins nostre, el seu amor ha arribat a la plenitud. <span class=\"vr\">&#8479;.<\/span><\/span><\/div><h3 class=\"rub\" id=\"m11x25\">Lectura segona <span class=\"ref\">Rm 12, 3-13<\/span><\/h3><p class=\"lema\" id=\"m11x26\">Cada membre està al servei dels altres membres<\/p><p class=\"pr\" id=\"m11x27\">Lectura de la carta de sant Pau als cristians de Roma.<\/p><p class=\"pr\" id=\"m11x28\">Germans: En virtut de la gràcia que he rebut, dic a tots i cada un: no us tingueu per més del que sou; tingueu una idea justa de vosaltres mateixos, assenyadament, sense ambicions, cadascú segons la mesura de la fe que Déu li ha concedit.<\/p><p class=\"pr\" id=\"m11x29\">En un cos hi ha molts membres, i no tots tenen la mateixa funció; també nosaltres, que som molts, units a Crist formem un sol cos i som membres els uns dels altres. Tenim dons diferents, segons la gràcia que hem rebut. Si és el do de profecia, exercim-lo d’acord amb la fe; si és el de servei, exercim-lo servint; si és el d’ensenyar, ensenyant; si és el d’exhortar, exhortant. El qui reparteix les almoines, que ho faci amb senzillesa; el qui presideix, que sigui sol·lícit; el qui fa obres de misericòrdia, que les faci amb alegria.<\/p><p class=\"pr\" id=\"m11x30\">Que l’amor no sigui fingit. Fugiu del mal, abraceu-vos al bé. Estimeu-vos afectuosament com a germans, avanceu-vos a honorar-vos els uns als altres. Esforceu-vos a ser sol·lícits. Sigueu fervents d’esperit, serviu el Senyor. Que l’esperança us ompli d’alegria. Sigueu pacients en la tribulació, constants en l’oració. Feu-vos solidaris de les necessitats del poble sant. Practiqueu amb deler l’hospitalitat.<\/p><p class=\"fin\" id=\"m11x31\">Paraula de Déu<\/p><div class=\"obien\" id=\"m11x32\">O bé <span class=\"ref\">1Jn 4, 7-16<\/span><\/div><p class=\"lema\" id=\"m11x33\">Si ens estimem els uns els altres, Déu és enmig nostre<\/p><p class=\"pr\" id=\"m11x34\">Lectura de la primera carta de san Juan.<\/p><p class=\"pr\" id=\"m11x35\">Estimats meus, estimem-nos els uns als altres, perquè l’amor ve
