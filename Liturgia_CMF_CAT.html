s en el nom del Pare, del Fill i de l’Esperit Sant i ensenyeu-los a guardar tot el que jo us he manat. Jo seré amb vosaltres cada dia fins a la fi del món».", 15, "m", "m13x47"], ["Paraula del Senyor", 15, "m", "m13x48"], ["O bé", 15, "m", "m13x49"], ["℟. Al·leluia, al·leluia, al·leluia!", 15, "m", "m13x50"], ["Obrim els nostres cors a l’ensenyament del Senyor, que ens mostra el camí de la vida eterna. ℟.", 15, "m", "m13x51"], ["Evangeli Mt, 9 35-38", 15, "m", "m13x52"], ["Jesús recorria totes les viles i pobles anunciant la bona nova del Regne", 15, "m", "m13x53"], ["Lectura de l’evangeli segons sant Mateu.", 15, "m", "m13x54"], ["En aquell temps, Jesús recorria totes les viles i pobles, ensenyant a les sinagogues, anunciant la bona nova del Regne i guarint malalties i xacres de tota mena. En veure les multituds, se’n compadí, perquè estaven malmenades i abatudes, com ovelles sense pastor. Llavors digué als seus deixebles: «La collita és abundant, però els segadors són pocs. Pregueu, doncs, a l’amo dels sembrats que hi enviï més segadors».", 15, "m", "m13x55"], ["Paraula del Senyor", 15, "m", "m13x56"], ["O bé", 15, "m", "m13x57"], ["℟. Al·leluia, al·leluia, al·leluia!", 15, "m", "m13x58"], ["Enaltiu el Senyor: que n’és, de bo! Perdura eternament el seu amor. ℟.", 15, "m", "m13x59"], ["Evangeli Jn 20, 19-23", 15, "m", "m13x60"], ["Com el Pare m’ha enviat a mi, també jo us envio a vosaltres", 15, "m", "m13x61"], ["Lectura de l’evangeli segons sant Joan.", 15, "m", "m13x62"], ["Al capvespre d’aquell mateix dia, que era diumenge, els deixebles, per por dels jueus, tenien tancades les portes del lloc on es trobaven. Jesús va arribar, es posà al mig i els digué: «Pau a vosaltres».", 15, "m", "m13x63"], ["Dit això, els va mostrar les mans i el costat. Els deixebles s’alegraren de veure el Senyor. Ell els tornà a dir: «Pau a vosaltres. Com el Pare m’ha enviat a mi, també jo us envio a vosaltres».", 15, "m", "m13x64"], ["Llavors va alenar damunt d’ells i els digué: «Rebeu l’Esperit Sant. A qui perdonareu els pecats, li quedaran perdonats; a qui no els perdoneu, li quedaran sense perdó».", 15, "m", "m13x65"], ["Oració secreta", 15, "m", "m13x66"], ["Mireu, Senyor, amb bondat els dons que us presentem, i per intercessió del Cor Immaculat de Maria, concediu-nos de viure i anunciar sempre la vostra Paraula amb fidelitat i alegria. Per Crist, Senyor nostre.", 15, "m", "m13x67"], ["Antífona de comunió Jn 15, 16", 15, "m", "m13x68"], ["No m’heu escollit vosaltres a mi; soc jo qui us he escollit a vosaltres i us he confiat la missió d’anar pertot arreu i donar fruit, i un fruit que duri per sempre.", 15, "m", "m13x69"], ["Oració després de la comunió", 15, "m", "m13x70"], ["Alimentats amb el Cos i la Sang del vostre Fill, us demanem, Senyor, que procurem sempre amb el més gran afany la vostra glòria i que col·laborem amb el vostre Esperit per encendre tot el món en el foc del vostre amor. Per Jesucrist, nostre Senyor.", 15, "m", "m13x71"]]}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.cels;
const MES = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const MCUR = ['gen.','febr.','març','abr.','maig','juny','jul.','ag.','set.','oct.','nov.','des.'];
const $ = s => document.querySelector(s);
const main = $('#main');
const store = {
  get(k,d){ try{ const v = localStorage.getItem('litcmf:'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('litcmf:'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- dates ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function dateFor(rule,y){ if(rule==='cor'){const e=easter(y);return new Date(y,e.getMonth(),e.getDate()+69);} return new Date(y,rule[0]-1,rule[1]); }
function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function fmt(d){return d.getDate()+' de '+MES[d.getMonth()].replace(/^(a|o)/,'$1');}
function fmtFull(d){const m=MES[d.getMonth()];return d.getDate()+(/^[ao]/.test(m)?' d’':' de ')+m+' de '+d.getFullYear();}
function nextOcc(rule){const t=today();let d=dateFor(rule,t.getFullYear());if(d<t)d=dateFor(rule,t.getFullYear()+1);return d;}
const DAY = 864e5;

/* calendar rows */
function calRows(){
  const y=today().getFullYear(); const rows=[];
  C.forEach((c,i)=>{ if(c.kind==='fest') rows.push({i, d:dateFor(c.date,y), c}); });
  rows.sort((a,b)=>a.d-b.d); return rows;
}
const GROUPS=[['rituales','Misses rituals'],['votivas','Missa votiva'],['necesidades','Per diverses necessitats']];
function has(c){ const a=[]; if(c.missa) a.push('Missa'); if(c.hours.length) a.push('Litúrgia de les Hores'); return a.join(' i '); }
/* ---------- settings ---------- */
let fs = store.get('fs',19), theme = store.get('theme','auto'), just = store.get('just',1);
function applySet(){
  document.documentElement.style.setProperty('--fs', fs+'px');
  $('#fsV').textContent = fs+' px';
  if(theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',theme);
  document.querySelectorAll('#thSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===theme));
  document.querySelectorAll('#jSeg button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.j===just));
  document.documentElement.classList.toggle('nojust', !just);
  const dark = theme==='dark' || (theme==='auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = '#6E1A26';
}
$('#fsM').onclick=()=>{fs=Math.max(14,fs-1);store.set('fs',fs);applySet();};
$('#fsP').onclick=()=>{fs=Math.min(30,fs+1);store.set('fs',fs);applySet();};
document.querySelectorAll('#thSeg button').forEach(b=>b.onclick=()=>{theme=b.dataset.t;store.set('theme',theme);applySet();});
document.querySelectorAll('#jSeg button').forEach(b=>b.onclick=()=>{just=+b.dataset.j;store.set('just',just);applySet();});
applySet();

/* ---------- overlays ---------- */
const scrim=$('#scrim'), drawer=$('#drawer'), sheet=$('#sheet'), search=$('#search');
function closeAll(){drawer.classList.remove('on');sheet.classList.remove('on');scrim.classList.remove('on');}
$('#bMenu').onclick=()=>{buildNav();drawer.classList.add('on');scrim.classList.add('on');};
$('#bSet').onclick=()=>{sheet.classList.add('on');scrim.classList.add('on');};
scrim.onclick=closeAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();closeSearch();}});
$('#bTitle').onclick=()=>go('');

function buildNav(){
  const cur = location.hash.slice(1);
  const isCur=i=>cur==='c'+i||cur.startsWith('c'+i+'-');
  let h = `<button data-go="" class="${cur===''?'cur':''}">Inici</button><div class="grp">Calendari propi</div>`;
  calRows().forEach(r=>{
    h += `<button data-go="c${r.i}" class="${isCur(r.i)?'cur':''}">${r.c.title}<small>${r.c.date==='cor'?fmt(r.d)+' (data mòbil)':r.c.label}</small></button>`; });
  h += `<div class="grp">Misses rituals i votives</div>`;
  C.forEach((c,i)=>{ if(c.kind==='missa') h += `<button data-go="c${i}" class="${isCur(i)?'cur':''}">${c.title}</button>`; });
  h += `<div class="grp">Litúrgia de les Hores</div>`;
  C.forEach((c,i)=>{ if(c.kind==='other') h += `<button data-go="c${i}" class="${isCur(i)?'cur':''}">${c.title}</button>`; });
  h += `<button data-go="pres" class="${cur==='pres'?'cur':''}">Presentació</button>`;
  $('#nav').innerHTML = h;
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{closeAll();go(b.dataset.go);});
}

/* ---------- routing ---------- */
function go(h){ if(location.hash.slice(1)===h) render(); else location.hash = h; }
window.addEventListener('hashchange', ()=>render());

function pickHour(ci){
  const c=C[ci], names=c.hours.map(h=>h.name), H=new Date().getHours();
  const has=n=>names.indexOf(n);
  let isTomorrow=false;
  if(c.kind==='fest'){ const d=nextOcc(c.date); isTomorrow=(d-today())===DAY; }
  let want;
  if(isTomorrow && H>=14) want=['I Vespres'];
  else if(H<5) want=['Ofici de lectura','Invitatori','Laudes'];
  else if(H<11) want=['Laudes','Ofici de lectura'];
  else if(H<15) want=['Hora d’entre dia','Laudes'];
  else want=['II Vespres','Vespres'];
  for(const w of want){const k=has(w); if(k>=0) return k;}
  return c.intro?-1:0;
}
function pickDefault(ci){const c=C[ci]; if(!c.hours.length) return c.missa?-2:-1; return pickHour(ci);}

function render(){
  const h=location.hash.slice(1);
  closeAll(); closeSearch(true);
  let m;
  if(!h) return renderHome();
  if(h==='pres') return renderPres();
  if((m=h.match(/^c(\d+)(?:-(i|m|\d+))?(?:-([pm][\dx]+))?$/)) && C[+m[1]]){
    const ci=+m[1]; let hi = m[2]===undefined ? pickDefault(ci) : (m[2]==='i'?-1:m[2]==='m'?-2:+m[2]);
    if(hi>=C[ci].hours.length || (hi===-2&&!C[ci].missa) || (hi===-1&&!C[ci].intro)) hi=pickDefault(ci);
    return renderCel(ci,hi,m[3]);
  }
  renderHome();
}

/* ---------- views ---------- */
function renderHome(){
  document.title='Litúrgia CMF';
  const t=today();
  const fests=calRows().map(r=>({...r,d:nextOcc(r.c.date)})).sort((a,b)=>a.d-b.d);
  const n=fests[0]; const days=Math.round((n.d-t)/DAY);
  const last=store.get('last',null);
  let h=`<section class="hero">
    <p class="when">${days===0?'Avui celebrem':'Propera celebració'}, ${fmtFull(n.d)}${days>1?', d’aquí a '+days+' dies':days===1?', demà':''}</p>
    <h2>${n.c.title}</h2>
    <span class="rank">${n.c.rank}</span>
    <div class="go">${n.c.missa?`<button class="btn" data-go="c${n.i}-m">Missa</button>`:''}
    ${n.c.hours.length?`<button class="btn" data-go="c${n.i}">Litúrgia de les Hores</button>`:''}
    ${last&&!last.h.startsWith('c'+n.i+'-')?`<button class="btn ghost" data-go="${last.h}">Continua: ${last.t}</button>`:''}</div>
  </section>`;
  h+=`<div class="sect">Calendari propi de ${t.getFullYear()}</div><ul class="cal">`;
  calRows().forEach(r=>{
    const col=r.c.missa?`<span class="dot d-${r.c.missa.color}" title="Color litúrgic"></span>`:'';
    h+=`<li><button data-go="c${r.i}"><span class="day"><b>${r.d.getDate()}</b><span>${MCUR[r.d.getMonth()]}</span></span>
      <span class="t">${r.c.title}<small>${col}${r.c.rank}${r.c.sub&&r.c.sub.length?'. '+r.c.sub.join(', '):''}</small><span class="has">${has(r.c)}</span></span>
      ${r.c.date==='cor'?'<span class="tag">Data mòbil</span>':'<span></span>'}</button></li>`;
  });
  h+=`</ul>`;
  GROUPS.forEach(([g,nom])=>{
    const its=C.map((c,i)=>({c,i})).filter(x=>x.c.kind==='missa'&&x.c.group===g); if(!its.length) return;
    h+=`<div class="sect">${nom}</div><div class="more">`;
    its.forEach(x=>h+=`<button data-go="c${x.i}">${x.c.title}<span>${x.c.missa.fecha!==x.c.label?x.c.missa.fecha:''}</span></button>`);
    h+=`</div>`;
  });
  h+=`<div class="sect">Litúrgia de les Hores: altres textos</div><div class="more">`;
  C.forEach((c,i)=>{ if(c.kind==='other') h+=`<button data-go="c${i}">${c.title}<span>${c.hours.length} formularis</span></button>`; });
  h+=`<button data-go="pres">Presentació<span>Superior general, 2024</span></button></div>
  <p class="foot">Missal i Leccionari i Litúrgia de les Hores propis dels Missioners Fills del Cor Immaculat de la benaurada Verge Maria.<br>Litúrgia de les Hores: versió catalana actualitzada segons l’edició espanyola de 2025.</p>`;
  main.innerHTML=h; bindGo(main); window.scrollTo(0,0);
}

function renderPres(){
  document.title='Presentació · Litúrgia CMF';
  main.innerHTML=`<div class="chead"><h2>Presentació</h2><div class="rank" style="font-style:italic;color:var(--muted)">Litúrgia de les Hores</div></div><div class="txt">${D.pres}</div>`;
  window.scrollTo(0,0);
}

function renderCel(ci,hi,pid){
  const c=C[ci];
  const dateLab = c.kind==='fest' ? (c.date==='cor' ? c.label+', '+fmtFull(nextOcc(c.date)) : c.label) : (c.kind==='missa'?c.label:'');
  const hour = hi>=0 ? c.hours[hi] : null;
  const isM = hi===-2;
  const nm=k=>k===-1?'Introducció':k===-2?'Missa':c.hours[k].tab;
  document.title=nm(hi)+' · '+c.title;
  const order=[]; if(c.intro) order.push(-1); if(c.missa) order.push(-2); c.hours.forEach((x,k)=>order.push(k));
  const code=k=>k===-1?'i':k===-2?'m':k;
  let tabs='';
  if(order.length>1) order.forEach((k,n)=>{ tabs+=`<button class="tab${k>=0&&n>0&&order[n-1]<0&&c.missa?' sep':''}" role="tab" aria-selected="${k===hi}" data-go="c${ci}-${code(k)}">${nm(k)}</button>`; });
  const chipList = isM ? c.missa.chips : hour ? hour.chips : [];
  const chips = chipList.length>1 ? `<div class="chips">${chipList.map(x=>`<button class="chip" data-jump="${x[0]}">${x[1]}</button>`).join('')}</div>` : '';
  let body;
  if(isM){
    body = (c.missa.title!==c.title && c.kind!=='missa' ? `<p class="mtit">Al Missal: ${c.missa.title}</p>`:'') + c.missa.html;
  } else body = hour ? hour.html : c.intro;
  const pos=order.indexOf(hi), prev=order[pos-1], next=order[pos+1];
  const col = c.missa && (isM||c.kind==='missa') ? `<span class="dot d-${c.missa.color}" title="Color litúrgic"></span>`:'';
  main.innerHTML=`<div class="chead">${dateLab?`<div class="lab">${dateLab}</div>`:''}<h2>${c.title}</h2>${c.rank?`<div class="rank">${col}${c.rank}${c.sub.length?'. '+c.sub.join(', '):''}</div>`:''}</div>
    ${tabs||chips?`<div class="tabs">${tabs?`<div class="scr" role="tablist">${tabs}</div>`:''}${chips}</div>`:''}
    ${hour && hour.name!==hour.tab?`<div class="chead" style="padding:1rem 0 0"><div class="lab">${hour.name}</div></div>`:''}
    <article class="txt${isM?' missa':''}">${body}</article>
    <div class="pager">${prev!==undefined?`<button data-go="c${ci}-${code(prev)}">Anterior<b>${nm(prev)}</b></button>`:'<span></span>'}
    ${next!==undefined?`<button data-go="c${ci}-${code(next)}" style="text-align:right">Següent<b>${nm(next)}</b></button>`:''}</div>`;
  bindGo(main);
  main.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump));
  const sel=main.querySelector('.tab[aria-selected="true"]'); if(sel) sel.scrollIntoView({block:'nearest',inline:'center'});
  store.set('last',{h:`c${ci}-${code(hi)}`, t:nm(hi)+', '+c.title});
  if(pid) setTimeout(()=>jump(pid,true),30); else window.scrollTo(0,0);
}
function jump(id,flash){
  const el=document.getElementById(id); if(!el) return;
  el.scrollIntoView({block:'start'});
  if(flash){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
}
function bindGo(root){ root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go)); }

/* ---------- search ---------- */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’']/g,"'");
const IDX=D.search.map(r=>norm(r[0]));
function openSearch(){search.classList.add('on');const i=$('#sIn');i.focus();i.select();doSearch();}
function closeSearch(silent){search.classList.remove('on');}
$('#bSearch').onclick=openSearch;
$('#sClose').onclick=()=>closeSearch();
let st; $('#sIn').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(doSearch,120);});
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function doSearch(){
  const q=norm($('#sIn').value.trim()), out=$('#sRes');
  if(q.length<2){out.innerHTML='<p class="empty">Escriu almenys dues lletres. La cerca no distingeix accents ni majúscules.</p>';return;}
  const terms=q.split(/\s+/); const hits=[];
  for(let i=0;i<IDX.length && hits.length<200;i++){ if(terms.every(t=>IDX[i].includes(t))) hits.push(i); }
  if(!hits.length){out.innerHTML='<p class="empty">Cap resultat. Prova amb menys paraules o una altra forma del mot.</p>';return;}
  let h=`<div class="count">${hits.length===200?'Més de 200':hits.length} resultats</div>`;
  hits.forEach(i=>{
    const [txt,ci,hi,pid]=D.search[i]; const n=IDX[i];
    const at=n.indexOf(terms[0]); const s=Math.max(0,at-60);
    let snip=(s>0?'…':'')+txt.slice(s,s+220)+(txt.length>s+220?'…':'');
    let sh=esc(snip);
    terms.filter(t=>t.length>2).forEach(t=>{ // highlight accent-insensitively
      const nn=norm(sh); let res='',p=0,k; while((k=nn.indexOf(t,p))>=0){res+=sh.slice(p,k)+'<mark>'+sh.slice(k,k+t.length)+'</mark>';p=k+t.length;} sh=res+sh.slice(p);
    });
    const sec = hi==='m'?'Missa':hi>=0?C[ci].hours[hi].tab:'Introducció';
    const where = ci<0?'Presentació':C[ci].title+', '+sec;
    const target = ci<0?'pres':`c${ci}-${hi==='m'?'m':hi<0?'i':hi}-${pid}`;
    h+=`<button class="hit" data-go="${target}"><small>${where}</small>${sh}</button>`;
  });
  out.innerHTML=h; bindGo(out);
}

render();
})();
</script>
</body>
