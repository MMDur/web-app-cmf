s del seu braç són potents: dispersa els homes de cor altiu, derroca els poderosos del soli i exalça els humils. Omple de béns els pobres, i els rics se’n tornen sense res. Ha protegit Israel, el seu servent, com ho havia promès als nostres pares; s’ha recordat del seu amor a Abraham i a la seva descendència per sempre.", 4, 4, "p906"], ["Ant. El Senyor beneí Maria i per Ella hem rebut el do de la vocació per a glòria del Pare.", 4, 4, "p907"], ["Pregàries", 4, 4, "p908"], ["Avui que festegem devotament la Mare de Déu del Carme i celebrem l’aniversari de la fundació de la Congregació, preguem el nostre Pare:", 4, 4, "p909"], ["Que el vostre Esperit, Senyor, ens esperoni.", 4, 4, "p910"], ["Vós que ens heu cridat a la vostra família des de llocs tan allunyats,", 4, 4, "p911"], ["— feu que, sota l’impuls de l’Esperit Sant, us invoquem com a Pare.", 4, 4, "p912"], ["Vós que heu volgut que el vostre Fill ens reconegués com a germans,", 4, 4, "p913"], ["— concediu-nos de conviure units en un mateix esperit, a fi que el món arribi a la fe.", 4, 4, "p914"], ["Vós que coneixeu el nostre egoisme i les nostres ambicions,", 4, 4, "p915"], ["— reuniu-nos a la taula de la vostra Paraula i del Sagrament, perquè ens estimem mútuament.", 4, 4, "p916"], ["Vós que voleu que siguem davant tothom testimonis de la vostra misericòrdia,", 4, 4, "p917"], ["— feu que reproduïm de debò la vida del vostre Fill.", 4, 4, "p918"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 4, 4, "p919"], ["Vós que heu ressuscitat el vostre Fill i heu promès la vida eterna als qui ho han deixat tot per vós,", 4, 4, "p920"], ["— vulgueu complir amb els nostres germans difunts les vostres promeses, en la mesura de la vostra misericòrdia.", 4, 4, "p921"], ["Pare nostre.", 4, 4, "p922"], ["Oració", 4, 4, "p923"], ["Senyor, en venerar la memòria de la benaurada Verge Maria del Mont Carmel i celebrar l’origen de la nostra família missionera, us preguem que confirmeu els vostres servents en la seva plena consagració i feu fecundes les tasques del nostre apostolat, perquè sempre i en tot siguem fills fidels d’aquesta mateixa Mare. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 4, 4, "p924"], ["Sant Antoni Maria Claret nasqué a Sallent (Barcelona) el 23 de desembre de 1807. Dedicà la seva vida al ministeri de la Paraula com a missioner apostòlic. El seu esperit era «per a tot el món». I, per fer amb d’altres el que ell sol no podia, fundà la Congregació de Missioners Fills del Cor Immaculat de la benaurada Verge Maria a Vic (Barcelona) el 16 de juliol de 1849. L’any 1855, juntament amb la M. Maria Antònia París, fundà la Congregació de Religioses de Maria Immaculada, Missioneres Claretianes. Sota la seva inspiració, es fundaren posteriorment l’institut secular de les Filles del Cor de Maria o Filiació Cordimariana i els Seglars Claretians. Creà moltes altres associacions i obres al servei de l’Església. Fou arquebisbe de Santiago de Cuba, confessor de la reina Isabel II i pare del Concili Vaticà I. Els enemics de la fe el perseguiren fins al darrer moment de la seva vida. Morí a l’exili, a Fontfroide (França), el 24 d’octubre de 1870. El seu cos fou traslladat a Vic el 1897. Pius XII l’inscriví en el catàleg dels sants el 7 de maig de 1950.", 5, -1, "p928"], ["Himne", 5, 0, "p930"], ["És capvespre, el jorn declina", 5, 0, "p931"], ["i al cel tremen els estels.", 5, 0, "p932"], ["Entonin els cors fidels", 5, 0, "p933"], ["la lloança vespertina.", 5, 0, "p934"], ["Lloem Déu per la victòria", 5, 0, "p935"], ["de Claret, l’humil servent", 5, 0, "p936"], ["en qui lluu, circumfulgent,", 5, 0, "p937"], ["la corona de la glòria.", 5, 0, "p938"], ["Lloem la Verge Maria", 5, 0, "p939"], ["que a Claret lliurà el tresor", 5, 0, "p940"], ["del sagrari del seu Cor,", 5, 0, "p941"], ["perquè el guardés nit i dia.", 5, 0, "p942"], ["Lloem l’amant de pobresa", 5, 0, "p943"], ["i divina voluntat", 5, 0, "p944"], ["que intacta servà l’esclat", 5, 0, "p945"], ["del lliri de la puresa.", 5, 0, "p946"], ["Lloem l’ungida figura", 5, 0, "p947"], ["d’apòstol i fundador", 5, 0, "p948"], ["que, forjat en el dolor,", 5, 0, "p949"], ["ha atès l’eterna ventura.", 5, 0, "p950"], ["Lloem l’Amor sense mida", 5, 0, "p951"], ["que, havent-lo configurat,", 5, 0, "p952"], ["en la mort amb son Amat,", 5, 0, "p953"], ["l’ha introduït dins la Vida.", 5, 0, "p954"], ["El Déu de la benaurança", 5, 0, "p955"], ["l’Únic, l’Etern, l’Infinit,", 5, 0, "p956"], ["Pare, Fill i Esperit,", 5, 0, "p957"], ["accepti la nostra lloança.", 5, 0, "p958"], ["O bé:", 5, 0, "p959"], ["Cantem tots amb veu fervent", 5, 0, "p960"], ["del gran Claret la glòria i santedat.", 5, 0, "p961"], ["Lloem l’obrer de Sallent,", 5, 0, "p962"], ["l’apòstol de nostra gent,", 5, 0, "p963"], ["l’egregi fundador i sant prelat.", 5, 0, "p964"], ["Mirant les fines malles del teler", 5, 0, "p965"], ["s’escolen ells seus anys de jovenesa.", 5, 0, "p966"], ["El seny tingué i la força de l’obrer.", 5, 0, "p967"], ["Del zel de Déu amb l’ànima ja encesa,", 5, 0, "p968"], ["es llença al món l’intrèpid missioner.", 5, 0, "p969"], ["Un cant vibrant a sa llaor alcem,", 5, 0, "p970"], ["nimbem d’amor el novell Sant tan nostre.", 5, 0, "p971"], ["Sobre el país sa protecció implorem", 5, 0, "p972"], ["i amb la claror de glòria del seu rostre", 5, 0, "p973"], ["pel seu CAMÍ DRET I SEGUR... marxem!", 5, 0, "p974"], ["O bé", 5, 0, "p975"], ["Fill del poble i confessor de reis, rierol mansuet i huracà profètic, treballador i missioner, bisbe, Pare Claret. Fóreu una flama que passà abrandant terres i mars de la vostra pàtria, Espanya. Cuba a Amèrica —la vinya jove— conegué el vostre incendi. Crist en el vostre pit prolongà el seu altar. Ell us donà un calze de vores abrandades: persecucions i calúmnies, sang. Res no us fa enrere. Mai en el vostre cel no s’eclipsà Maria, Maria Mare, Cor que vetlla; per ella teniu un estol resplendent de fills i filles. Beneït el Pare que us donà a l’Església, i glòria a Crist, l’amor del qual us urgí. Glòria al qui és segell de tots dos, l’Esperit, glòria per sempre.", 5, 0, "p976"], ["Salmòdia", 5, 0, "p977"], ["Ant. Lloem el Senyor, que ha glorificat sant Antoni Maria Claret i l’ha constituït pare de moltes famílies en l’Església.", 5, 0, "p978"], ["Salm 112", 5, 0, "p979"], ["Servents del Senyor, lloeu-lo, lloeu el nom del Senyor. Sigui beneït el nom del Senyor ara i per tots els segles. Des de la sortida fins a la posta del sol lloeu el nom del Senyor. El Senyor és excels als ulls de tots els pobles, la seva glòria s’eleva més enllà del cel. Qui és com el Senyor, el nostre Déu? Té molt amunt el seu tron, i des d’allí s’inclina per veure el cel i la terra. Aixeca de la pols el desvalgut, treu el pobre de la cendra, per asseure’l entre els poderosos, els poderosos del seu poble. La qui vivia estèril a casa, la fa mare feliç amb els fills.", 5, 0, "p980"], ["Ant. Lloem el Senyor, que ha glorificat sant Antoni Maria Claret i l’ha constituït pare de moltes famílies en l’Església.", 5, 0, "p981"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 0, "p982"], ["Oració sàlmica", 5, 0, "p983"], ["Déu Totpoderós, que heu glorificat el vostre Fill Jesucrist, escolteu la nostra pregària i concediu-nos que puguem participar de l’esperit de sant Antoni Maria Claret, per tal de ser admesos un dia amb ell a la vostra presència, on el vostre nom és lloat per sempre. Per Crist Senyor nostre.", 5, 0, "p984"], ["Ant. Lloaré el Senyor tota la vida: ell es manté fidel per sempre.", 5, 0, "p985"], ["Salm 145", 5, 0, "p986"], ["Lloa el Senyor, ànima meva. Lloaré el Senyor tota la vida, cantaré al meu Déu mentre sigui al món. No confieu en els homes poderosos. Homes que són terra, incapaços de salvar. Quan exhalen l’esperit, tornen a la terra, i aquell dia es desfan els seus plans. Feliç l’home que troba ajuda en el Déu de Jacob; espera en el Senyor, el seu Déu, que ha fet el cel, la terra i el mar, i tot el que es mou en aquests llocs. El Senyor, que es manté fidel per sempre, fa justícia als oprimits, dóna pa als qui tenen fam. El Senyor deslliura els presos, el Senyor dóna la vista als cecs, el Senyor redreça els vençuts, el Senyor estima els justos, el Senyor guarda els forasters, manté les viudes i els orfes, i capgira els camins dels injustos. El senyor regna per sempre, és el teu Déu, Sió, per tots els segles.", 5, 0, "p987"], ["Ant. Lloaré el Senyor tota la vida: ell es manté fidel per sempre.", 5, 0, "p988"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 0, "p989"], ["Oració sàlmica", 5, 0, "p990"], ["Senyor i Déu nostre, que heu enviat el vostre Fill al món per anunciar la Bona Nova als pobres i alliberar els captius, doneu-nos el goig de ser anunciadors del vostre Evangeli en el seguiment de Crist, a imitació de sant Antoni Maria Claret. Per Crist Senyor nostre.", 5, 0, "p991"], ["Ant. Déu elegí en Crist sant Antoni Maria Claret perquè fos sant i donés a conèixer el misteri de la seva voluntat.", 5, 0, "p992"], ["Càntic Ef 1, 3-10", 5, 0, "p993"], ["Beneït sigui el Déu i Pare de nostre Senyor Jesucrist, que ens ha beneït en Crist amb tota mena de benediccions espirituals dalt del cel. Ens elegí en ell abans de crear el món, perquè fóssim sants, irreprensibles als seus ulls. Per amor ens destinà a ser fills seus per Jesucrist, segons la seva benèvola decisió, que dóna lloança a la grandesa dels favors que ens ha concedit en el seu Estimat. En ell, hem estat rescatats amb el preu de la seva sang. Les nostres culpes han estat perdonades. La riquesa dels favors de Déu s’ha desbordat en nosaltres. Ell ens ha concedit tota aquesta saviesa i penetració que tenim. Ens ha fet conèixer el secret de la decisió benèvola que havia pres, per executar-la quan els temps fossin madurs. Ha volgut unir en el Crist tot el món, tant el del cel com el de la terra.", 5, 0, "p994"], ["Ant. Déu elegí en Crist sant Antoni Maria Claret perquè fos sant i donés a conèixer el misteri de la seva voluntat.", 5, 0, "p995"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 0, "p996"], ["Oració sàlmica", 5, 0, "p997"], ["Beneït sigueu, Senyor Déu nostre, que ens heu destinat en Crist, per pura iniciativa vostra, a ser els vostres fills; aviveu en nosaltres l’esperit filial, per tal que la nostra vida s’esmerci en la vostra lloança. Per Crist Senyor nostre.", 5, 0, "p998"], ["Lectura breu", 5, 0, "p999"], ["Is 61, 1-2a", 5, 0, "p1000"], ["L’Esperit del Senyor reposa sobre meu, perquè el Senyor m’ha ungit, m’ha enviat a portar la Bona Nova als desvalguts, a curar els cors adolorits, a proclamar als captius la llibertat, i als presos el retorn de la llum, a proclamar l’any de gràcia del Senyor.", 5, 0, "p1001"], ["Responsori breu", 5, 0, "p1002"], ["Is 49, 3. 6", 5, 0, "p1003"], ["V. Tu ets el meu servent; ets la meva glòria. Ell m’ha format des del si de la mare, perquè fos el seu servent. R. Tu ets el meu servent; ets la meva glòria. Ell m’ha format des del si de la mare, perquè fos el seu servent. V. Jo t’he fet llum de les nacions perquè portis la meva salvació d’un cap a l’altre de la terra. R. Ell m’ha format des del si de la mare, perquè fos el seu servent. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Tu ets el meu servent; ets la meva glòria. Ell m’ha format des del si de la mare, perquè fos el seu servent.", 5, 0, "p1004"], ["Càntic de Maria", 5, 0, "p1005"], ["Ant. Sant Antoni Maria Claret fou cridat a anunciar la mort i la resurrecció del Senyor, per tal que se salvin tots els qui creuen en Ell.", 5, 0, "p1006"], ["La meva ànima magnifica el Senyor, el meu esperit celebra el Déu que em salva, perquè ha mirat la petitesa de la seva serventa. Des d’ara totes les generacions em diran benaurada, perquè el Totpoderós obra en mi meravelles. El seu nom és sant, i l’amor que té als qui creuen en ell s’estén de generació en generació. Les obres del seu braç són potents: dispersa els homes de cor altiu, derroca els poderosos del soli i exalça els humils. Omple de béns els pobres, i els rics se’n tornen sense res. Ha protegit Israel, el seu servent, com ho havia promès als nostres pares; s’ha recordat del seu amor a Abraham i a la seva descendència per sempre.", 5, 0, "p1007"], ["Ant. Sant Antoni Maria Claret fou cridat a anunciar la mort i la resurrecció del Senyor, per tal que se salvin tots els qui creuen en Ell.", 5, 0, "p1008"], ["Pregàries", 5, 0, "p1009"], ["L’Esperit Sant i la vida i ensenyament de sant Antoni Maria Claret han fet de nosaltres una família de Déu. Preguem per la nostra Congregació i aclamem el nostre Pare del cel:", 5, 0, "p1010"], ["Senyor, recordeu-vos de la vostra Congregació.", 5, 0, "p1011"], ["Pare Sant, vós que enviàreu el vostre Fill al món perquè proclamés als pobres l’anunci joiós de l’Evangeli,", 5, 0, "p1012"], ["— feu que anunciem l’Evangeli a tothom.", 5, 0, "p1013"], ["Vós enviàreu el vostre Fill perquè reconciliés el món amb vós,", 5, 0, "p1014"], ["— feu que ajudem els homes a recuperar la vostra amistat.", 5, 0, "p1015"], ["Vós convocàreu els Apòstols perquè seguissin el vostre Fill en l’anunci de l’Evangeli,", 5, 0, "p1016"], ["— concediu-nos de participar plenament en la comunitat de vida missionera que fundà sant Antoni Maria Claret.", 5, 0, "p1017"], ["Vós, mogut per la pregària del vostre Fill i de l’Església, heu enviat treballadors als vostres sembrats,", 5, 0, "p1018"], ["— vulgueu enviar-ne a la nostra Congregació per tal que us puguem glorificar cada dia més amb la vida i amb l’apostolat.", 5, 0, "p1019"], ["Vós que inflamàreu sant Antoni Maria Claret d’amor a la Verge santa Maria, la Mare de l’Església,", 5, 0, "p1020"], ["— feu-nos experimentar sempre la protecció de Maria per tal que, de nom i de fets, siguem de debò fills de tal Mare.", 5, 0, "p1021"], ["Vós volguéreu que el vostre Fill fos el primer a ressuscitar d’entre els morts,", 5, 0, "p1022"], ["— atorgueu a tots els qui són del Crist, de ressuscitar amb Ell el dia de la seva vinguda.", 5, 0, "p1023"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 5, 0, "p1024"], ["Pare nostre.", 5, 0, "p1025"], ["Oració", 5, 0, "p1026"], ["Senyor Déu nostre, vós vau escollir sant Antoni Maria Claret perquè fundés la nostra família i el vau inflamar d’un amor tan ardent que el feia viure alegre enmig de les privacions, calúmnies i turments: concediu-nos que, seguint els seus ensenyaments i exemples, frisem per la salvació de tots els homes i proclamem pertot la vostra glòria. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 5, 0, "p1027"], ["Ant. Celebrem amb goig la festa de sant Antoni Maria Claret, missioner apostòlic i fundador de la nostra família.", 5, 1, "p1029"], ["O bé: Veniu, adorem el Senyor en la festa de sant Antoni Maria Claret, Apòstol de la Paraula.", 5, 1, "p1030"], ["El salm invitatori, com a l’Ordinari.", 5, 1, "p1031"], ["Himne", 5, 2, "p1033"], ["Claret, veu pelegrina que aneu sembrant la gran notícia: la salvació. No importen races ni pobles; només hi ha un Pare, només un Senyor. Claret, des de la vostra vida Déu ens assenyala la nostra tasca, la nostra missió. Anem seguint les vostres petjades, cridant al món: Déu és amor. Arribà el Senyor travessant el vostre camí i, en veure-us, pel vostre nom us cridà, per fer-vos testimoni del seu Regne, com a fidel missatger de la seva veu. I vós travessàveu mars i muntanyes proclamant el missatge de l’amor. Arribàreu fins a les illes més llunyanes anunciant als homes el perdó. La llum de l’Evangeli fou el vostre rumb, la vostra vida, Crist mateix l’omplí, i el féreu arribar fins als homes, com el Fill, en Maria, se’ns donà. Nosaltres seguirem els vostres camins, com a nova família del Senyor. Volem ser també la llum del món, llevat de vida i salvació.", 5, 2, "p1034"], ["Salmòdia", 5, 2, "p1035"], ["Ant. El Senyor li ha posat al front una corona d’or i li ha fet la gràcia d’allargar els seus anys per sempre, sense fi.", 5, 2, "p1036"], ["Salm 20, 2-8.14", 5, 2, "p1037"], ["El rei celebra el vostre triomf, Senyor. Com se sent feliç per la vostra victòria! Li heu concedit el que el seu cor volia, no li heu refusat el que us demanava. Sortiu a rebre’l augurant-li felicitat, li poseu al front una corona d’or. Us demanava la vida, i li heu fet la gràcia d’allargar els seus anys per sempre, sense fi. L’ha fet cèlebre la vostra victòria, l’heu cobert d’honor i majestat, sempre es valdran del seu nom per beneir, l’ompliu de goig amb la vostra mirada. El rei confia en el Senyor; l’Altíssim se l’estima, i no té por de caure. Alceu-vos, Senyor, amb el vostre poder: cantarem celebrant la vostra gesta.", 5, 2, "p1038"], ["Ant. El Senyor li ha posat al front una corona d’or i li ha fet la gràcia d’allargar els seus anys per sempre, sense fi.", 5, 2, "p1039"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 2, "p1040"], ["Oració sàlmica", 5, 2, "p1041"], ["Senyor, vós que heu ressuscitat Crist i li heu concedit anys sense fi, mireu propici els cohereus del vostre Fill, i manteniu-los ferms en el combat, no fos cas que, tot anunciant a d’altres l’Evangeli, restessin ells exclosos del Regne. Ell, que viu i regna pels segles dels segles.", 5, 2, "p1042"], ["Ant. Us lloem, Senyor i us donem gràcies, perquè ens heu revelat les vostres obres i els vostres designis.", 5, 2, "p1043"], ["Salm 91 I", 5, 2, "p1044"], ["És bo de lloar l’Altíssim, de cantar al vostre nom, Senyor, de proclamar al matí el vostre amor, i de nit la vostra fidelitat. Us canto amb la lira de deu cordes i amb l’arpa, als acords d’interludis de cítara. Senyor, quin goig que em donen les vostres gestes! Aclamo amb alegria l’obra de les vostres mans. Senyor, que en són de grans les vostres obres, els vostres designis, que en són de profunds! Els ignorants els desconeixen, els insensats no se n’adonen. Ni que els injustos creixin com l’herba, ni que arribin a florir els amics de males arts, acabaran, que no se’n parlarà mai més. Però vós, Senyor, sou excels per sempre.", 5, 2, "p1045"], ["Ant. Us lloem, Senyor i us donem gràcies, perquè ens heu revelat les vostres obres i els vostres designis.", 5, 2, "p1046"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 2, "p1047"], ["Oració sàlmica", 5, 2, "p1048"], ["Senyor, les vostres accions són la nostra força i la nostra joia; feu que comprenguem la profunditat dels vostres designis i, a la llum de la fe, cerquem en tots els esdeveniments els signes de la vostra voluntat, per tal que siguem cada dia més fidels a la nostra missió. Per Crist Senyor nostre.", 5, 2, "p1049"], ["Ant. El just creixerà com la palmera a la casa del Senyor, i donarà fruit abundant.", 5, 2, "p1050"], ["Salm 91 II", 5, 2, "p1051"], ["Els vostres enemics desapareixeran, seran dispersats els amics de males arts, i a mi, com als búfals, m’alceu el front, m’ungiu amb oli novell; puc mirar fit a fit els meus contraris, en sento parlar sense por. Els justos creixeran com les palmeres, es faran grans com els cedres del Líban; plantats a la casa del Senyor; creixeran als atris del nostre Déu; encara donaran fruit a la vellesa, continuaran plens d’ufana i de vigor, per proclamar que el Senyor és recte, que la meva Roca no coneix la injustícia.", 5, 2, "p1052"], ["Ant. El just creixerà com la palmera a la casa del Senyor, i donarà fruit abundant.", 5, 2, "p1053"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 2, "p1054"], ["Oració sàlmica", 5, 2, "p1055"], ["Ungits amb l’oli novell del vostre Esperit, us lloem, Senyor; concediu-nos que, plantats a la vostra casa, units a vós, donem fruit abundant i el nostre fruit perduri. Per Crist Senyor nostre.", 5, 2, "p1056"], ["V. La seva crida s’escampa per tota la terra. R. Escolten el seu missatge fins als límits del món.", 5, 2, "p1057"], ["Primera lectura", 5, 2, "p1058"], ["De la segona carta de l’apòstol sant Pau als cristians de Corint 5, 11-21", 5, 2, "p1059"], ["L’amor de Crist ens esperona", 5, 2, "p1060"], ["Sabent què vol dir venerar el Senyor, intentem de convèncer els homes. Déu prou que ens coneix, i espero que dins vostre també vosaltres ens coneixeu. No volem tornar a fer la nostra pròpia recomanació, però sí donar-vos l’ocasió de gloriar-vos de nosaltres; així tindreu què respondre als qui es glorien de les aparences i no del que hi ha en el cor. Perquè, si havíem perdut el seny, era per Déu, i si ara tenim seny, és per vosaltres. L’amor del Crist ens té agafats: hem comprès que un ha mort per tots, i això vol dir que tots han mort amb ell. I ell ha mort per tots perquè els qui viuen ja no visquin per a ells mateixos, sinó per a aquell qui ha mort i ressuscitat per tots ells.", 5, 2, "p1061"], ["Per això nosaltres, des d’ara, ja no valorem ningú de manera purament humana, i si en altre temps havíem valorat així el Crist, ara ja no ho fem. És a dir, els qui viuen en Crist són una creació nova. El que era antic ha passat; ha començat un món nou. I tot això és obra de Déu, que ens ha reconciliat amb ell mateix per Crist i ens ha confiat a nosaltres aquest servei de la reconciliació. Efectivament, Déu, en Crist, reconciliava el món amb ell mateix, no tenint-li més en compte els seus pecats, i a nosaltres ens ha encomanat l’anunci de la reconciliació. Per tant, som ambaixadors de Crist, i Déu mateix us exhorta a través nostre. Us ho demanem en nom de Crist: reconcilieu-vos amb Déu! Al qui no havia experimentat el pecat, Déu, per nosaltres, li va carregar el pecat, perquè gràcies a ell experimentéssim la seva justícia salvadora.", 5, 2, "p1062"], ["Responsori", 5, 2, "p1063"], ["Ga 6, 14. 17", 5, 2, "p1064"], ["R. Déu me’n guard de gloriar-me en res si no és en la creu de nostre Senyor Jesucrist; * En la creu, el món està crucificat per a mi, i jo, per al món. V. Jo porto en el meu cos les marques dels sofriments de Jesús. * En la creu, el món està crucificat per a mi, i jo, per al món.", 5, 2, "p1065"], ["O bé", 5, 2, "p1066"], ["De la primera carta de l’apòstol sant Pau als cristians de Corint 9, 16-19. 22-27", 5, 2, "p1067"], ["Ai de mi si no anunciés l’evangeli", 5, 2, "p1068"], ["Tanmateix, jo no puc gloriar-me d’anunciar l’evangeli, perquè és una obligació que m’han imposat: ai de mi si no anunciés l’evangeli! Si m’ho hagués triat, tindria dret a un salari; però no ho he triat: és un encàrrec que tinc confiat. Quin és, doncs, el meu salari? Oferir de franc l’evangeli que anuncio, sense fer ús dels drets que l’evangeli em dóna. Jo, que no era esclau de ningú, m’he fet esclau de tots per guanyar-ne tants com pugui. M’he fet feble amb els febles per guanyar els febles; m’he fet tot amb tots per salvar-ne alguns, costés el que costés. Tot ho faig a causa de l’evangeli, per poder-hi tenir part. No sabeu que a l’estadi tots els corredors es llancen a la cursa, però només un s’emporta el premi? Correu bé per poder-vos-el endur! L’atleta s’absté de moltes coses, i tot per guanyar-se una corona que es marceix, mentre que nosaltres n’hem de guanyar una que mai no es marcirà. Així, doncs, jo corro, però no sense una meta; combato donant cops de puny, però no pas a l’aire. Tracto amb duresa el meu cos i el tinc dominat, no fos cas que, després de proclamar la victòria dels altres, quedés desqualificat jo mateix.", 5, 2, "p1069"], ["Responsori", 5, 2, "p1070"], ["Cf. Ac 20, 21. 24; Rm 1, 16", 5, 2, "p1071"], ["R. No he estalviat cap mitjà al meu abast per predicar la fe en Jesús, nostre Senyor. * No dono cap valor a la meva vida, mentre dugui a terme el camí i el ministeri que vaig rebre de Jesús, el Senyor: donar testimoni de l’evangeli de la gràcia de Déu. V. Jo no m’avergonyeixo de l’evangeli, que és poder de Déu per a salvar tots els qui creuen. * No dono cap valor a la meva vida, mentre dugui a terme el camí i el ministeri que vaig rebre de Jesús, el Senyor: donar testimoni de l’evangeli de la gràcia de Déu.", 5, 2, "p1072"], ["Segona lectura", 5, 2, "p1073"], ["Dels escrits de sant Antoni Maria Claret, bisbe i fundador El egoísmo vencido, dins Escritos espirituales, BAC, Madrid 1985, pàgines 417-418, i Autobiografia, n. 494", 5, 2, "p1074"], ["L’amor que Crist ens té ens urgeix", 5, 2, "p1075"], ["Encesos per la mateixa flama van venir missioners apostòlics, en vénen i en vindran fins a la fi del món, des d’un cap a l’altre de la terra, i proclamaran la paraula de Déu de manera tal que podrà dir-se d’ells mateixos ben merescudament aquelles paraules de l’apòstol Pau: «L’amor que Crist ens té ens urgeix». L’amor de Crist ens estimula, ens incita a córrer, a volar duts per les ales d’un zel sant. El qui estima com cal estima Déu i el proïsme; el qui té zel de debò és idèntic al qui estima, però li és superior en grau. L’encén l’amor en la mateixa mesura que el zel l’empeny. I si algú no té zel, això sol ja demostra que en el cor se li han extingit l’amor i la caritat. Qui té zel desitja i procura, per tots els mitjans possibles, que Déu sigui sempre més i més conegut, estimat i servit en aquesta vida i en l’altra, ja que aquest amor sagrat no té acabament. I fa el mateix amb el proïsme: desitja i procura que en aquesta terra tothom estigui content i hi sigui feliç, i benaurat en la pàtria sobrenatural. El qui té zel procura que tothom se salvi, que ningú no es perdi eternament, que Déu no sigui mai ofès i que ningú no visqui en pecat ni un sol moment. Això és el que veiem en els sants Apòstols i en tots els qui són duts per l’esperit apostòlic. Jo em dic a mi mateix: Un Fill del Cor Immaculat de Maria és un home encès de caritat que cala foc arreu on passa; que desitja eficaçment i procura per tots els mitjans d’encendre tothom amb el foc de l’amor diví. Res no el fa enrere; frueix en les privacions; aborda els treballs; abraça els sacrificis; es complau en les calúmnies i s’alegra en els turments. Només pensa com seguirà i imitarà Jesucrist a treballar, a sofrir i a procurar sempre i únicament la major glòria de Déu i la salvació de les ànimes.", 5, 2, "p1076"], ["Responsori", 5, 2, "p1077"], ["1Te 2, 8; Ga 4, 19", 5, 2, "p1078"], ["R. El nostre afecte per vosaltres era tan gran, que estàvem decidits a donar-vos, no tan sols l’evangeli de Déu, sinó fins i tot les nostres pròpies vides. * Tant us havíeu fet estimar! V. Fills meus, sento dolors de part com si us tornés a infantar, i no els acabaré fins que Crist no quedi format en vosaltres. * Tant us havíeu fet estimar!", 5, 2, "p1079"], ["O bé", 5, 2, "p1080"], ["Dels escrits de sant Antoni Maria Claret, bisbe i fundador Carta al P. Josep Xifré, 20 d’agost de 1861, dins Cartas selectas, BAC, Madrid 1996, pàgines 351-352", 5, 2, "p1081"], ["Estimació pels Missioners", 5, 2, "p1082"], ["Veig el que em diu de la manera d’estendre la nostra Congregació, i em sembla bé, i com més a l’interior d’Espanya millor, per ser més gran la necessitat. M’atreveixo a dir que ningú no ho sap millor que jo, per raó de viure a Madrid i pels viatges que porto fets amb SS. MM. Jo, veient la disposició de la gent, la fam de la divina paraula, etc. etc. no em puc contenir, tot el dia estic predicant. Tant de bo pogués córrer predicant per tot Espanya, per tot el món! La temptació més gran que he de sofrir és d’escapar-me de prop dels reis i aguanto perquè em diuen que és la voluntat de Déu que jo estigui al seu costat, i jo per ara també ho crec, i això i únicament això em fa aguantar, esperant que el Senyor em deixarà anar. Mentrestant, digui als meus estimadíssims germans els Missioners que s’animin i que treballin tot el que puguin, que Déu i la Verge Santíssima els ho pagaran. Jo tinc tant d’afecte als sacerdots que es dediquen a les missions, que els donaria la meva sang i la meva vida, jo els rentaria i besaria mil vegades els peus, jo els faria el llit, els guisaria el menjar, i em privaria del meu bocí perquè ells mengessin. Els estimo tant, que d’amor em torno boig per ells, ni sé el que faria per ells: quan considero que ells treballen perquè Déu sigui més conegut i estimat i perquè les ànimes se salvin i no es condemnin, jo no sé el que sento... Ara mateix que escric això he hagut de deixar la ploma per a eixugar-me els ulls... Oh fills del Cor Immaculat de la meva estimadíssima Mare Maria!... Vull escriure-us i no puc perquè tinc els ulls amarats de llàgrimes. Prediqueu i pregueu per mi.", 5, 2, "p1083"], ["Responsori breu", 5, 2, "p1084"], ["Mt 5, 11; Mc 16, 15; Sl 144, 10. 11", 5, 2, "p1085"], ["R. Vosaltres sou la llum del món, diu el Senyor. * Aneu per tot el món i anuncieu la bona nova de l’evangeli a tota la humanitat. V. Que les vostres criatures, Senyor, proclamin la glòria del vostre regne. * Aneu per tot el món i anuncieu la bona nova de l’evangeli a tota la humanitat.", 5, 2, "p1086"], ["Es diu l’himne Te Deum. L’oració, com a Laudes.", 5, 2, "p1087"], ["Himne", 5, 3, "p1089"], ["A llevant l’alba poncella", 5, 3, "p1090"], ["i el jorn novell es desclou", 5, 3, "p1091"], ["l’esperada meravella", 5, 3, "p1092"], ["de la llum nada de nou.", 5, 3, "p1093"], ["Llum d’amor el cor anheli,", 5, 3, "p1094"], ["perquè pugi en cant roent", 5, 3, "p1095"], ["la lloança que s’enceli", 5, 3, "p1096"], ["vers el Pare omnipotent.", 5, 3, "p1097"], ["Lloem la fe que encenia,", 5, 3, "p1098"], ["com una albada naixent,", 5, 3, "p1099"], ["en l’apòstol de Maria,", 5, 3, "p1100"], ["Claret, el cor i la ment.", 5, 3, "p1101"], ["Lloem l’excelsa esperança", 5, 3, "p1102"], ["que, emparant-lo en el patir,", 5, 3, "p1103"], ["convertia en benaurança", 5, 3, "p1104"], ["els sofriments del camí.", 5, 3, "p1105"], ["Lloem el foc que bleïa,", 5, 3, "p1106"], ["com una fornal d’amor", 5, 3, "p1107"], ["ablamada nit i dia,", 5, 3, "p1108"], ["la caritat del seu cor.", 5, 3, "p1109"], ["Dem lloança el Déu de vida", 5, 3, "p1110"], ["que amb Claret ha compartit", 5, 3, "p1111"], ["l’etern viure sense mida", 5, 3, "p1112"], ["de Pare, Fill i Esperit.", 5, 3, "p1113"], ["O bé:", 5, 3, "p1114"], ["Puix la terra que heu llaurada", 5, 3, "p1115"], ["sent de vostre zel enyor:", 5, 3, "p1116"], ["Oh Claret, vostra sembrada", 5, 3, "p1117"], ["feu que arreli en cada cor.", 5, 3, "p1118"], ["A Sallent, vila feinera", 5, 3, "p1119"], ["vostre esguard s’obre a la llum", 5, 3, "p1120"], ["com viola primicera,", 5, 3, "p1121"], ["ja d’infant doneu perfum.", 5, 3, "p1122"], ["Flor tot just esbadellada", 5, 3, "p1123"], ["que escampeu de Crist l’olor.", 5, 3, "p1124"], ["Oh Claret...", 5, 3, "p1125"], ["La llavor de l’Evangeli", 5, 3, "p1126"], ["quan pels pobles la sembreu,", 5, 3, "p1127"], ["per a què ben fonda arreli,", 5, 3, "p1128"], ["amb miracles l’adobeu.", 5, 3, "p1129"], ["La collita és ben granada,", 5, 3, "p1130"], ["poca palla i molts grans d’or.", 5, 3, "p1131"], ["Oh Claret...", 5, 3, "p1132"], ["Com la tasca no escasseja", 5, 3, "p1133"], ["i són pocs els jornalers,", 5, 3, "p1134"], ["vostre zel prompte es rodeja", 5, 3, "p1135"], ["d’activíssims missioners", 5, 3, "p1136"], ["que ompliren de bona anyada", 5, 3, "p1137"], ["els graners del gran Senyor.", 5, 3, "p1138"], ["Oh Claret...", 5, 3, "p1139"], ["Sobre el món feu que davalli", 5, 3, "p1140"], ["rou del cel a bell ruixat,", 5, 3, "p1141"], ["on el nostre cor treballi", 5, 3, "p1142"], ["sigui amb zel d’apostolat.", 5, 3, "p1143"], ["Protegint vós la llaurada", 5, 3, "p1144"], ["no es perdrà nostra suor.", 5, 3, "p1145"], ["Oh Claret...", 5, 3, "p1146"], ["Salmòdia", 5, 3, "p1147"], ["Ant. La meva ànima s’ha enamorat de vós, Senyor meu. La meva ànima té set de vós i de la salvació dels homes.", 5, 3, "p1148"], ["Salm 62, 2-9", 5, 3, "p1149"], ["Vós, Senyor, sou el meu Déu; jo us cerco. Tot jo tinc set de vós, per vós es desviu el meu cor, com terra eixuta, sense una gota d’aigua. Jo us contemplava al vostre santuari quan us veia gloriós i poderós. L’amor que em teniu val més que la vida; per això els meus llavis us lloaran. Que tota la vida us pugui beneir i alçar les mans lloant el vostre nom. Saciat del bo i millor, us lloaré amb el goig als llavis. Quan des del llit us recordo, passo les nits pensant en vós, perquè vós m’heu ajudat, i sóc feliç sota les vostres ales. La meva ànima s’ha enamorat de vós, em sosté la vostra mà.", 5, 3, "p1150"], ["Ant. La meva ànima s’ha enamorat de vós, Senyor meu. La meva ànima té set de vós i de la salvació dels homes.", 5, 3, "p1151"], ["Oració sàlmica", 5, 3, "p1152"], ["Senyor, el vostre Fill ha proclamat feliços els qui tenen fam i set de justícia; feu que tinguem anhel de vós i ens saciem de la vostra paraula, perquè els nostres llavis us lloïn amb goig i anunciïn el vostre nom a tots els pobles. Per Crist Senyor nostre. Amén.", 5, 3, "p1153"], ["Ant. Beneïu el Senyor, sants i humils de cor, canteu-li lloances per sempre.", 5, 3, "p1154"], ["Càntic Dn 3, 57-88.56", 5, 3, "p1155"], ["Beneïu el Senyor, totes les criatures, canteu-li lloances per sempre. Beneïu-lo, àngels del Senyor, beneïu, cels, el Senyor. Beneïu el Senyor, aigües de l’espai, beneïu-lo, estols del Senyor. Beneïu el Senyor, sol i lluna, beneïu-lo, estrelles del cel. Beneïu el Senyor, pluges i rosades, beneïu-lo, tots els vents. Beneïu el Senyor, foc i calor, beneïu-lo, freds i gelades. Beneïu el Senyor, rosades i gebre, beneïu-lo, glaç i freds. Beneïu el Senyor, neus i geleres, beneïu-lo, dies i nits. Beneïu el Senyor, llum i tenebres, beneïu-lo, núvols i llamps. Que la terra beneeixi el Senyor, que li canti lloances per sempre. Beneïu el Senyor, muntanyes i turons, vegetació de la terra, beneeix-lo. Beneïu, fonts, el Senyor, beneïu-lo, rius i mars. Beneïu el Senyor, peixos i monstres marins, beneïu-lo, tots els ocells. Beneïu el Senyor, feres i ramats, canteu-li lloances per sempre. Beneïu el Senyor, tots els homes, beneeix-lo, poble d’Israel. Beneïu-lo, sacerdots del Senyor, beneïu-lo, servents del Senyor. Beneïu el Senyor, sants i humils de cor, ànimes i esperits dels justos, beneïu-lo. Beneïu el Senyor, Hananies, Azaries i Misael, canteu-li lloances per sempre. Beneïm el Pare i el Fill amb l’Esperit Sant, cantem-li lloances per sempre. Sou beneït, Senyor, al firmament del cel. Glòria i lloança per sempre.", 5, 3, "p1156"], ["Ant. Beneïu el Senyor, sants i humils de cor, canteu-li lloances per sempre.", 5, 3, "p1157"], ["A l’acabament d’aquest càntic no es diu Glòria al Pare.", 5, 3, "p1158"], ["Oració sàlmica", 5, 3, "p1159"], ["Senyor i Pare nostre, que us servim i us fem servir, que us lloem i us fem lloar de totes les criatures. Per Crist Senyor nostre. Amén.", 5, 3, "p1160"], ["Ant. Canteu al Senyor un càntic nou: perquè el Senyor ha estimat el seu servent i ha coronat de triomf els humils.", 5, 3, "p1161"], ["Salm 149", 5, 3, "p1162"], ["Canteu al Senyor un càntic nou, canteu les seves lloances davant dels qui l’estimen. Se sent feliç Israel del qui l’ha creat, s’alegren del seu rei els fills de Sió. Lloen el seu nom, el lloen tot dansant, acompanyen els seus cants amb els tambors i les cítares. Perquè el Senyor estima el seu poble, coronarà de triomf els humils. Els fidels celebren la seva glòria, des dels seus rengles aclamen plens de goig; mentre els seus llavis glorifiquen Déu, tenen a les mans espases de dos talls, per fer justícia entre els pobles, per reprendre i castigar les nacions, encadenant els seus reis, emmanillant els poderosos. Executar la sentència que està escrita és la glòria reservada als qui l’estimen.", 5, 3, "p1163"], ["Ant. Canteu al Senyor un càntic nou: perquè el Senyor ha estimat el seu servent i ha coronat de triomf els humils.", 5, 3, "p1164"], ["Oració sàlmica", 5, 3, "p1165"], ["Senyor Déu nostre, que heu coronat de triomf sant Antoni Maria Claret, feu fecunds els treballs dels qui, seguint els seus ensenyaments, exerceixen el ministeri de la salvació, perquè els pecadors es converteixin a la vostra Paraula, els indecisos es refermin, els justos us estimin cada vegada més i ressoni la vostra lloança en l’assemblea dels fidels. Per Crist Senyor nostre. Amén.", 5, 3, "p1166"], ["Lectura breu", 5, 3, "p1167"], ["2Co 6, 1. 3-4a", 5, 3, "p1168"], ["Com a col·laboradors de Déu, us exhortem a no deixar perdre la gràcia que n’heu rebut. No hem de donar mai cap motiu d’escàndol a ningú, perquè no es malparli del servei que Déu ens ha confiat. Ben al contrari, ens hem de manifestar en tot com a servidors de Déu.", 5, 3, "p1169"], ["Responsori breu", 5, 3, "p1170"], ["V. He esdevingut servidor de l’Evangeli per un do de Déu. R. He esdevingut servidor de l’Evangeli per un do de Déu. V. I m’ha posat al cap de la seva família. R. Per un do de Déu. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. He esdevingut servidor de l’Evangeli per un do de Déu.", 5, 3, "p1171"], ["Càntic de Zacaries", 5, 3, "p1172"], ["Ant. El Senyor suscità en l’Església el seu servent Antoni Maria Claret perquè es consagrés a Crist i n’imités la vida en l’anunci de l’Evangeli.", 5, 3, "p1173"], ["Beneït sigui el Senyor, Déu d’Israel, ha visitat el seu poble i l’ha redimit. Fa que s’aixequi un salvador poderós a la casa de David el seu servent, com ho havia anunciat de temps antic, per boca dels seus sants profetes. Així ens salva, alliberant-nos dels enemics, de les mans dels qui ens volen mal, mogut per l’amor que el fa fidel als nostres pares, i pel record de l’Aliança santa, que jurà al nostre pare Abraham, prometent de concedir-nos que, sense por, lliures dels enemics, li donem culte amb santedat i justícia tota la vida. I a tu, infant, et diran profeta de l’Altíssim, perquè aniràs al davant del Senyor a preparar els seus camins. Faràs saber al poble que li ve la salvació, el perdó dels seus pecats, per l’amor entranyable del nostre Déu. Perquè ens estima, ens visitarà un Sol que ve del cel, per il·luminar els qui viuen a la fosca, a les ombres de la mort, i guiar els nostres passos per camins de pau.", 5, 3, "p1174"], ["Ant. El Senyor suscità en l’Església el seu servent Antoni Maria Claret perquè es consagrés a Crist i n’imités la vida en l’anunci de l’Evangeli.", 5, 3, "p1175"], ["Pregàries", 5, 3, "p1176"], ["Supliquem Crist, enviat pel Pare, nascut de la Verge Santa Maria i ungit per l’Esperit Sant perquè fos Mestre i Salvador dels homes, i aclamem-lo dient:", 5, 3, "p1177"], ["Envieu, Senyor, el vostre Esperit.", 5, 3, "p1178"], ["Senyor Jesús, que ens convideu a estar amb vós i ens envieu a predicar,", 5, 3, "p1179"], ["— feu que cresquem cada dia en la vostra amistat i en l’amor a tots els homes.", 5, 3, "p1180"], ["Senyor Jesús, que ens convoqueu a viure com a comunitat de germans a fi que el món cregui pel testimoni de la nostra unitat,", 5, 3, "p1181"], ["— feu que ens mantinguem tots unànimes en la pregària i en la comunitat de vida amb Maria, la vostra Mare.", 5, 3, "p1182"], ["Senyor Jesús, vós que voleu que siguem sal de la terra i llum del món,", 5, 3, "p1183"], ["— il·lumineu la nostra vida amb la llum de la vostra paraula.", 5, 3, "p1184"], ["Senyor Jesús, que heu vingut a calar foc a la terra i teniu com a única aspiració que tot el món cremi en aquest foc,", 5, 3, "p1185"], ["— inflameu-nos de tal forma amb el vostre amor que cremant d’amor nosaltres mateixos, calem aquest foc arreu on passem.", 5, 3, "p1186"], ["Senyor Jesús, que vau passar pel món fent el bé, especialment als pobres i als malalts,", 5, 3, "p1187"], ["— feu-nos sol·lícits dels nostres germans a imitació de sant Antoni Maria Claret.", 5, 3, "p1188"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 5, 3, "p1189"], ["Pare nostre.", 5, 3, "p1190"], ["Oració", 5, 3, "p1191"], ["Senyor Déu nostre, vós vau escollir sant Antoni Maria Claret perquè fundés la nostra família i el vau inflamar d’un amor tan ardent que el feia viure alegre enmig de les privacions, calúmnies i turments: concediu-nos que, seguint els seus ensenyaments i exemples, frisem per la salvació de tots els homes i proclamem pertot la vostra glòria. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 5, 3, "p1192"], ["Si cau en diumenge, es reciten els salms del diumenge I; en els altres casos, es diuen els salms graduals de la salmòdia complementària.", 5, 4, "p1194"], ["Tèrcia", 5, 4, "p1195"], ["Himne", 5, 4, "p1196"], ["Humil missatger pels camps del món, travesseu els mars amples com una torxa de glòria, predicant als pobres l’amor de Déu Pare, fent prodigis, donant llum a les ànimes. Forjador d’una nova societat sense fronteres, redimiu els pobres amb la vostra pobresa humil, ensenyeu als reis la pobresa d’esperit i a tothom enriqueix la vostra paraula inextingible. Viviu vida amagada amb Crist en la pregària, el vostre cos és un sagrari on el Senyor fa estada, i el Cor ardent de la Verge il·lumina els vostres passos en el goig de la vostra pietat envers la Mare. Sense pietat us difamen, calumnien i persegueixen els qui no reconeixen la veritat que proclameu, i un dia, a la fi, lliureu al Senyor de la glòria la collita madura, el fruit de la vostra vida incansable. Avui els fills nascuts de la vostra entranya fecunda prolonguem el foc de la vostra paraula immensa; per això beneïm el Pare i l’Esperit i donem glòria a Crist per segles infinits. Amén.", 5, 4, "p1197"], ["Ant. Aquest és el gran sacerdot que en la seva vida agradà a Déu.", 5, 4, "p1198"], ["Lectura breu", 5, 4, "p1199"], ["Sir 50, 1. 4. 11b", 5, 4, "p1200"], ["Heus ací el gran sacerdot que durant la seva vida va reparar la casa i manà de consolidar el santuari. Es preocupà d'evitar la ruïna del seu poble. Quan pujava a l’altar sant, omplia de glòria el recinte del santuari.", 5, 4, "p1201"], ["V. El Senyor l’escollí per ser el seu sacerdot. R. Per oferir-li un sacrifici de lloança.", 5, 4, "p1202"], ["L’oració, com a Laudes.", 5, 4, "p1203"], ["Sexta", 5, 4, "p1204"], ["L’himne, com a Tèrcia.", 5, 4, "p1205"], ["Ant. Els nostres ulls estan fixos en el Senyor, confiant i esperant en la seva misericòrdia.", 5, 4, "p1206"], ["Lectura breu", 5, 4, "p1207"], ["Ga 2, 19-20", 5, 4, "p1208"], ["En virtut de la Llei, vaig morir a la Llei a fi de viure per a Déu. Estic crucificat amb Crist. Ja no sóc jo qui visc; és Crist qui viu en mi. La meva vida terrenal, la visc gràcies a la fe en el Fill de Déu, que em va estimar i es va entregar ell mateix per mi.", 5, 4, "p1209"], ["V. Crist serà glorificat en mi. R. La meva vida és Crist.", 5, 4, "p1210"], ["L’oració, com a Laudes.", 5, 4, "p1211"], ["Nona", 5, 4, "p1212"], ["L’himne, com a Tèrcia.", 5, 4, "p1213"], ["Ant. El Senyor ha fet meravelles amb els qui el veneren, donarà l’herència als seus amics.", 5, 4, "p1214"], ["Lectura breu", 5, 4, "p1215"], ["Pr 2, 1-5", 5, 4, "p1216"], ["Fill meu, fes cas del que et dic, fica't al cap els meus preceptes: para l'orella a la saviesa, obre el cor al seny; fes venir la intel·ligència, crida la sensatesa; desitja-les com el diner, recerca-les com un tresor. Llavors sabràs venerar el Senyor, arribaràs a conèixer el que Déu vol.", 5, 4, "p1217"], ["V. Feu veure al vostre servent la claror de la vostra mirada. R. I ensenyeu-me les vostres lleis.", 5, 4, "p1218"], ["L’oració, com a Laudes.", 5, 4, "p1219"], ["Himne", 5, 5, "p1221"], ["Com a laudes o bé:", 5, 5, "p1222"], ["Avui que l’Església canta la vostra memòria gloriosa, els vostres fills pel món, reunits en nom vostre, cantem joiosos la grandesa inefable de la vostra vida fecunda, de la vostra mort joiosa. Ja en la infància llunyana, els vostres ulls meravellats descriuen el sentit profund d’allò que és etern. A les vostres mans descobriu la fatiga artesana: teixint en somnis, neix el vostre neguit missioner. La Paraula divina resplendeix en els vostres camins. Què en treu l’home de guanyar el món sencer si a la fi perd l’ànima? En vós comença una foguera d’amor inextingible que les aigües no apaguen. Déu us nomenà profeta de pobles i nacions, riu d’amor i font de gràcia salvadora. L’Esperit Sant damunt vostre, força viva, us feu llum dels pobres, evangeli vivent. Urgit per un foc de caritat divina, immers en el silenci de la Paraula eterna, llanceu la vostra veu al vent, i és Crist qui escampa, per mitjà de la vostra llengua, la flama del seu Esperit.", 5, 5, "p1223"], ["Salmòdia", 5, 5, "p1224"], ["Ant. El qui obra honradament i practica la justícia, aquest, Senyor, podrà viure a la vostra muntanya sagrada.", 5, 5, "p1225"], ["Salm 14", 5, 5, "p1226"], ["Senyor, qui podrà estar-se a casa vostra? Qui podrà viure a la muntanya sagrada? El qui obra honradament i practica la justícia, diu la veritat tal com la pensa, quan parla no escampa calúmnies, mai no fa mal al proïsme, ni carrega a ningú res infamant, compten poc als seus ulls els descreguts, honra i aprecia els fidels del Senyor; no es desdiu de promeses oneroses, no fia els seus diners a interès, ni es ven per condemnar cap innocent. El qui obra així mai no caurà.", 5, 5, "p1227"], ["Ant. El qui obra honradament i practica la justícia, aquest, Senyor, podrà viure a la vostra muntanya sagrada.", 5, 5, "p1228"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 5, "p1229"], ["Oració sàlmica", 5, 5, "p1230"], ["Pare sant, feu que procedim honradament i practiquem la justícia, i que siguem cada dia més humils, més fervorosos i més zelosos de la salvació dels homes, per tal que puguem hostatjar-nos a la vostra tenda i viure amb vós a la muntanya sagrada. Per Crist Senyor nostre.", 5, 5, "p1231"], ["Ant. Sortós l’home que disposa a consciència els seus afers: serà beneït el seu llinatge.", 5, 5, "p1232"], ["Salm 111", 5, 5, "p1233"], ["Feliç l’home que venera el Senyor i estima de cor els seus preceptes. La seva descendència serà gran al país, serà beneït el llinatge dels justos. A casa seva hi ha riquesa i abundància, la seva bondat consta per sempre. L’home just, compassiu i benigne, és llum que apunta en la fosca. Sortós l’home que presta de bon grat, que disposa a consciència els seus afers. El just no caurà mai, i deixarà un record inesborrable. Viu sense por de les males noves, se sent ferm confiant en el Senyor, té el cor incommovible, res no tem, i a la fi veurà vençuts els enemics, Reparteix el que té, ho dóna als pobres, la seva bondat consta per sempre, pot alçar el front amb dignitat. L’injust, quan ho veu, es consumeix, i estreny les dents d’indignació. S’esvaeixen les ambicions de l’injust.", 5, 5, "p1234"], ["Ant. Sortós l’home que disposa a consciència els seus afers: serà beneït el seu llinatge.", 5, 5, "p1235"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 5, "p1236"], ["Oració sàlmica", 5, 5, "p1237"], ["Senyor, manteniu el nostre cor ferm, segur i sense por, i feu que, urgits per la caritat, sapiguem fruir en les privacions, abordar els treballs, abraçar els sacrificis i gloriar-nos en la Creu de Jesucrist. Ell, que viu i regna pels segles dels segles.", 5, 5, "p1238"], ["Ant. Ara que heu revelat la vostra justícia, totes les nacions vindran a adorar-vos.", 5, 5, "p1239"], ["Càntic Ap 15, 3-4", 5, 5, "p1240"], ["Senyor, Déu de l’univers, les vostres obres són grans i admirables! Senyor, rei de tots els pobles, les vostres decisions són justes, no van mai errades. Qui no us respectarà! Qui no glorificarà el vostre nom! Perquè vós sou l’únic sant, i ara que heu revelat la vostra justícia, totes les nacions vindran a adorar-vos.", 5, 5, "p1241"], ["Ant. Ara que heu revelat la vostra justícia, totes les nacions vindran a adorar-vos.", 5, 5, "p1242"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 5, 5, "p1243"], ["Oració sàlmica", 5, 5, "p1244"], ["Senyor Déu Omnipotent, els vostres camins són justos i veritables, feu que procurem sempre i únicament la major glòria vostra i abrusem tot el món en el foc de l’amor diví. Per Crist Senyor nostre.", 5, 5, "p1245"], ["Lectura breu", 5, 5, "p1246"], ["2Tm 4, 3-5", 5, 5, "p1247"], ["Perquè vindrà un temps que alguns no suportaran la sana doctrina. Seguint els propis capricis i buscant qui els afalagui les orelles, s’envoltaran d’un munt de mestres, no voldran escoltar la veritat i es desviaran cap a les faules. Tu, però, sigues sobri en tot, suporta els sofriments, fes obra d’evangelitzador, compleix bé el teu ministeri.", 5, 5, "p1248"], ["Responsori breu", 5, 5, "p1249"], ["Jn 20, 21", 5, 5, "p1250"], ["V. Com el Pare m’ha enviat, també us envio jo a vosaltres. R. Com el Pare m’ha enviat, també us envio jo a vosaltres. V. I em sereu testimonis fins a l’extrem de la terra. R. També us envio jo a vosaltres. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Com el Pare m’ha enviat, també us envio jo a vosaltres.", 5, 5, "p1251"], ["Càntic de Maria", 5, 5, "p1252"], ["Ant. Gireu des del cel els vostres ulls, veniu i visiteu aquesta vinya que la mà vostra havia plantat i havia fet robusta i forta.", 5, 5, "p1253"], ["La meva ànima magnifica el Senyor, el meu esperit celebra el Déu que em salva, perquè ha mirat la petitesa de la seva serventa. Des d’ara totes les generacions em diran benaurada, perquè el Totpoderós obra en mi meravelles. El seu nom és sant, i l’amor que té als qui creuen en ell s’estén de generació en generació. Les obres del seu braç són potents: dispersa els homes de cor altiu, derroca els poderosos del soli i exalça els humils. Omple de béns els pobres, i els rics se’n tornen sense res. Ha protegit Israel, el seu servent, com ho havia promès als nostres pares; s’ha recordat del seu amor a Abraham i a la seva descendència per sempre.", 5, 5, "p1254"], ["Ant. Gireu des del cel els vostres ulls, veniu i visiteu aquesta vinya que la mà vostra havia plantat i havia fet robusta i forta.", 5, 5, "p1255"], ["Les pregàries, com a les I Vespres.", 5, 5, "p1256"], ["Oració", 5, 5, "p1257"], ["Senyor Déu nostre, vós vau escollir sant Antoni Maria Claret perquè fundés la nostra família i el vau inflamar d’un amor tan ardent que el feia viure alegre enmig de les privacions, calúmnies i turments: concediu-nos que, seguint els seus ensenyaments i exemples, frisem per la salvació de tots els homes i proclamem pertot la vostra glòria. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 5, 5, "p1258"], ["María Patrocini Giner, missionera claretiana, va néixer a Tortosa (Tarragona), el 4 de gener de 1874. El 16 de setembre de 1893, va fer la seva professió perpètua a Carcaixent (València). Va exercir diverses responsabilitats a la comunitat com a superiora i formadora, educadora sensible a les necessitats de nenes i joves. Va ser la fundadora de la comunitat de Port Sagunt. Un cop desencadenada la persecució religiosa en el context de la Guerra Civil Espanyola (1936-1939), va afrontar amb coratge i pau les adversitats patides per la comunitat tant a Port Sagunt com, més tard, de nou a Carcaixent. Amb altres germanes va haver de deixar la casa religiosa i cercar refugi. No va deixar d'animar les seves germanes i les va instar a donar la vida per Crist. La mort va arribar la nit del 13 de novembre de 1936, quan va ser assassinada sense judici juntament amb altres víctimes. Les seves últimes paraules van ser de perdó i intercessió.", 6, -1, "p1262"], ["Comú d’un màrtir.", 6, -1, "p1263"], ["Càntic de Zacaries, ant. Es cenyí la cintura amb fermesa i desplegà la força dels seus braços; per això, la seva llàntia no s’apagarà mai més.", 6, 0, "p1265"], ["Oració", 6, 0, "p1266"], ["Déu omnipotent i misericordiós, que a la beata Maria Patrocini la vàreu fer exímia en el servei als germans i en el martiri, concediu-nos per la seva intercessió que, seguint amb perseverança Crist en el camí de la creu, arribem a la glòria de la resurrecció. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 6, 0, "p1267"], ["Càntic de Maria, ant. El qui s’avorreix a si mateix en aquest món es guardarà per a la vida eterna.", 6, 1, "p1269"], ["Pregària abans del repòs nocturn", 8, -1, "p1271"], ["Per a la pregària de Completes es pot prendre el formulari que correspon al dia de la setmana o bé, si es prefereix, un dels dos formularis indicats per al diumenge, dient, en aquest cas, la segona oració conclusiva.", 8, -1, "p1272"], ["Tot com a l’Ordinari, llevat del que segueix.", 8, 0, "p1274"], ["Salmòdia", 8, 0, "p1275"], ["Ant. Tingueu pietat de mi, Senyor, i escolteu la meva pregària.", 8, 0, "p1276"], ["Salm 4", 8, 0, "p1277"], ["Responeu-me quan us invoco, oh Déu que em feu justícia. M’heu eixamplat el cor en els perills, compadiu-me i escolteu el meu prec. Fins quan vosaltres, homes, menyspreareu el Senyor, la meva glòria, i preferireu el que és no-res fiant-vos d’esperances enganyoses? Sapigueu que el Senyor m’ha fet favors meravellosos: el Senyor m’escolta sempre que l’invoco. No pequeu si us veieu insegurs; reflexioneu de nit i assereneu-vos. Oferiu sacrificis per obtenir el favor de Déu, i confieu en el Senyor. Molts exclamen: «En qui trobarem el nostre goig? Que sigui el nostre estendard la claror de la vostra mirada.» El goig que m’heu posat al cor és més gran que el que ells tenen quan ha estat bona la collita de blat i de vi. M’adormo en pau així que em fico al llit i em sento en vós segur, només en vós, Senyor.", 8, 0, "p1278"], ["Ant. Tingueu pietat de mi, Senyor, i escolteu la meva pregària.", 8, 0, "p1279"], ["Ant. Durant la nit, beneïu el Senyor.", 8, 0, "p1280"], ["Salm 133", 8, 0, "p1281"], ["Beneïu el Senyor, vosaltres, servents del Senyor, que us quedeu de nit a casa seva. Alceu les mans al santuari, beneïu el Senyor. Que el Senyor et beneeixi des de Sió, el Senyor que ha fet cel i terra.", 8, 0, "p1282"], ["Ant. Durant la nit, beneïu el Senyor.", 8, 0, "p1283"], ["Lectura breu", 8, 0, "p1284"], ["Dt 6, 4-7", 8, 0, "p1285"], ["Escolta, Israel: El Senyor és el nostre Déu, el Senyor és l’únic. Estima el Senyor, el teu Déu, amb tot el cor, amb tota l’ànima, amb totes les forces. Guarda en el teu cor les paraules dels manaments que avui et dono, inculca-les als teus fills, parla’n a casa teva i anant de camí, quan te’n vagis al llit i quan et llevis.", 8, 0, "p1286"], ["Oració", 8, 0, "p1287"], ["Quan la solemnitat coincideix en diumenge:", 8, 0, "p1288"], ["Guardeu-nos, Senyor, durant aquesta nit i feu que demà, en clarejar el nou dia, la celebració del diumenge ens ompli de l’alegria de la resurrecció del vostre Fill. Ell, que viu i regna pels segles dels segles. Amén.", 8, 0, "p1289"], ["Quan la solemnitat no coincideix en diumenge:", 8, 0, "p1290"], ["Visiteu, Senyor, aquesta estança: allunyeu-ne les insídies de l’enemic. Que els vostres sants àngels hi habitin i ens guardin en pau, i que la vostra benedicció romangui sempre amb nosaltres. Per Crist Senyor nostre. Amén.", 8, 0, "p1291"], ["La pregària i l’antífona final a la Santíssima Verge Maria, com a l’Ordinari.", 8, 0, "p1292"], ["Tot com a l’Ordinari, llevat del que segueix.", 8, 1, "p1294"], ["Salmòdia", 8, 1, "p1295"], ["Ant. A recer de l’Altíssim no temo l’esglai de la nit.", 8, 1, "p1296"], ["Salm 90", 8, 1, "p1297"], ["Tu que vius a recer de l’Altíssim i passes la nit a l’ombra del Totpoderós, digues al Senyor: «Sou la muralla on m’emparo, el meu Déu, en qui confio.» Ell et guardarà del parany de l’ocellaire i del flagell de la pesta; t’abrigarà amb les seves plomes, trobaràs refugi sota les seves ales; et cobrirà fidelment com un escut. No et farà por la basarda de la nit ni la fletxa que vola de dia, ni la pesta que s’esmuny a la fosca, o l’epidèmia que a migdia fa estralls. Ni que en caiguin vora teu un miler o deu mil al teu costat mateix, a tu res no et tocarà. Només obrint els ulls, veuràs com acaben els injustos. Quan deies: «M’emparo en el Senyor», feies de l’Altíssim el teu refugi. No et passarà res de mal, ni s’acostarà a casa teva cap desgràcia, perquè ha donat ordre als seus àngels de guardar-te en els camins: et duran a les palmes de les mans, perquè els teus peus no ensopeguin amb les pedres, trepitjaràs lleopards i escurçons, passaràs sobre lleons i serpents. «Ja que ell s’ha fet tan meu, jo el salvaré, el protegiré perquè coneix el meu nom. Sempre que m’invoqui, l’escoltaré, estaré vora d’ell en els perills, el salvaré, i tothom l’estimarà; saciaré el seu desig de llarga vida, i fruirà de la meva salvació.»", 8, 1, "p1298"], ["Ant. A recer de l’Altíssim no temo l’esglai de la nit.", 8, 1, "p1299"], ["Lectura breu", 8, 1, "p1300"], ["Ap 22, 4-5", 8, 1, "p1301"], ["Veuran Déu cara a cara i portaran el nom d’ell escrit al front. No hi haurà més nit, ni caldrà la llum dels gresols o la del sol; Déu mateix, el Senyor, els il·luminarà. I regnaran pels segles dels segles.", 8, 1, "p1302"], ["Oració", 8, 1, "p1303"], ["Quan la solemnitat coincideix en diumenge:", 8, 1, "p1304"], ["Guardeu-nos, Senyor, durant aquesta nit i feu que demà, en clarejar el nou dia, la celebració del diumenge ens ompli de l’alegria de la resurrecció del vostre Fill. Ell, que viu i regna pels segles dels segles. Amén.", 8, 1, "p1305"], ["Quan la solemnitat no coincideix en diumenge:", 8, 1, "p1306"], ["Visiteu, Senyor, aquesta estança: allunyeu-ne les insídies de l’enemic. Que els vostres sants àngels hi habitin i ens guardin en pau, i que la vostra benedicció romangui sempre amb nosaltres. Per Crist Senyor nostre. Amén.", 8, 1, "p1307"], ["La pregària i l’antífona final a la Santíssima Verge Maria, com a l’Ordinari.", 8, 1, "p1308"], ["En les solemnitats que no coincideixen en diumenge, després de la invocació inicial i de l’himne, es reciten els salms de la sèrie corresponent amb les antífones pròpies.", 9, -1, "p1310"], ["Salm 119", 9, 0, "p1312"], ["Clamo al Senyor en la meva desgràcia, i ell em respon. Defenseu-me, Senyor, dels llavis mentiders, de la llengua impostora. Què et donarà Déu a mans plenes, llengua impostora? Les fletxes del guerrer, ben esmolades, i brases de ginesta. Ai de mi, que he de viure a Mósoc, exiliat als campaments de Quedar. Fa massa temps que jo he de viure amb els qui no volen pau. Jo els parlo de pau i de justícia, i ells pensen en la guerra.", 9, 0, "p1313"], ["Salm 120", 9, 0, "p1314"], ["Alço els ulls a les muntanyes: d’on em vindrà l’ajuda? L’ajuda em vindrà del Senyor, del Senyor que ha fet cel i terra. Que no deixi relliscar el teu peu, ni s’adormi el qui et guarda. El guardià d’Israel mai no s’adorm, sempre vigila. És el Senyor qui et guarda, el Senyor t’empara al teu costat mateix. De dia el sol no et farà mal, ni la lluna de nit. El Senyor et guarda de tota desgràcia, et guarda la vida. El Senyor guarda tots els teus passos ara i per tots els segles.", 9, 0, "p1315"], ["Salm 121", 9, 0, "p1316"], ["Quina alegria quan em van dir: «Anem a la casa del Senyor». Ja han arribat els nostres peus al teu llindar, Jerusalem. Jerusalem, ciutat ben construïda, conjunt harmoniós; és allà que pugen les tribus, les tribus del Senyor, a complir l’aliança d’Israel a lloar el nom del Senyor. Allí hi ha els tribunals de justícia, els tribunals del palau de David. Augureu la pau a Jerusalem: «Que visquin segurs els qui t’estimen, que sigui inviolable la pau dels teus murs, la quietud dels teus merlets». Per amor dels meus germans i amics, deixeu-me dir: «Que hi hagi pau dintre teu». Per la casa del Senyor, el nostre Déu, et desitjo la felicitat.", 9, 0, "p1317"], ["Salm 122", 9, 1, "p1319"], ["A vós, que teniu el tron dalt del cel, aixeco els meus ulls. Com l'esclau té els ulls posats en les mans del seu amo, com l'esclava té els seus ulls en les mans de la mestressa, tenim els ulls en el Senyor, el nostre Déu, fins que s'apiadi de nosaltres. Compadiu-nos, Senyor, compadiu-nos, estem saturats de menyspreu. La nostra ànima n'està ben saturada, dels escarnis dels altius, del menyspreu dels insolents.", 9, 1, "p1320"], ["Salm 123", 9, 1, "p1321"], ["Si el Senyor no hagués estat a favor nostre, -que respongui el poble d'Israel-, si el Senyor no hagués estat a favor nostre, quan els homes intentaven assaltar-nos ens haurien engolit de viu en viu: tan gran era la fúria que portaven. Quan la riuada ens vingué a sobre, ens hauria passat la inundació més amunt del coll, més amunt del coll ens hauria passat la crescuda de les aigües. Beneït sigui el Senyor, que no ens deixa caure a les seves dents. Hem salvat la vida com l'ocell que fuig del llaç dels caçadors. S'ha trencat el llaç, i tots hem fugit. El nostre auxili és el nom del Senyor, del Senyor que ha fet el cel i la terra.", 9, 1, "p1322"], ["Salm 124", 9, 1, "p1323"], ["El qui confia en el Senyor mai no caurà. Es com Sió, incommovible, ferm per sempre. Jerusalem està envoltada de muntanyes. Es així com el Senyor envolta el seu poble, ara i per tots els segles. El ceptre injust no pesarà més sobre la terra dels justos, no fos que els justos donin la mà als qui fan el mal. Senyor, feu feliços els bons i els rectes de cor. Però els qui es desvien per camins tortuosos, el Senyor se'ls endurà amb els malfactors. Pau a Israel!", 9, 1, "p1324"], ["Salm 125", 9, 2, "p1326"], ["Quan el Senyor renovà la vida de Sió ho crèiem un somni; la nostra boca s’ompli d’alegria, de crits i de rialles. Els altres pobles es deien: «És magnífic el que el Senyor fa a favor d’ells.» És magnífic el que el Senyor fa a favor nostre, amb quin goig ho celebrem! Renoveu la nostra vida, Senyor, com l’aigua renova l’estepa del Nègueb. Els qui sembraven amb llàgrimes als ulls criden de goig a la sega. Sortien a sembrar tot plorant, emportant-se la llavor; i tornaran cantant d’alegria, duent a coll les seves garbes.", 9, 2, "p1327"], ["Salm 126", 9, 2, "p1328"], ["Si el Senyor no construeix la casa, és inútil l’afany dels constructors. Si el Senyor no guarda la ciutat, és inútil que vigilin els guardes. Es inútil que us lleveu tan de matí, i aneu tan tard a reposar, per menjar el pa que us guanyeu a dures penes. Fins quan dormen, Déu el dóna als seus amics. La millor herència són els fills, do del Senyor, els descendents són la millor recompensa; els fills que heu tingut quan éreu joves són com les fletxes en mans d’un guerrer; feliç l’home que se n’omple el buirac: si discuteix amb algú davant la gent, no haurà de retirar-se avergonyit.", 9, 2, "p1329"], ["Salm 127", 9, 2, "p1330"], ["Feliç tu, fidel del Senyor, que vius seguint els seus camins. Menjaràs del fruit del teu treball, seràs feliç i tindràs sort. La teva esposa fruitarà com una parra, dins la intimitat de casa teva; veuràs els fills com plançons d’olivera al voltant de la taula. És així com els fidels del Senyor seran beneïts. Que el Senyor et beneeixi des de Sió. Que tota la vida puguis veure prosperar Jerusalem. Que puguis veure els fills dels teus fills. Pau a Israel!", 9, 2, "p1331"], ["En lloc dels salms graduals 121 i 126, es poden recitar els salms 128 i 130, respectivament.", 9, 2, "p1332"], ["Salm 128", 9, 2, "p1333"], ["Quantes vegades, des de jove, m’han combatut! Que respongui el poble d’Israel: Quantes vegades, des de jove, m’han combatut, i mai no em poden vèncer. M’han llaurat tot el cos, per obrir-hi solcs ben llargs; però la justícia del Senyor ha trencat les sogues dels injustos. Que se’n tornin defraudats i avergonyits els qui volien fer mal a Sió, i siguin com l’herba dels terrats que abans d’espigar-se s’asseca; no se’n faran cap manat els segadors ni cap braçat els qui lliguen les garbes, i no diu ningú dels qui passen a la vora: «El Senyor us ha beneït.» Us beneïm en el nom del Senyor.", 9, 2, "p1334"], ["Salm 130", 9, 2, "p1335"], ["El meu cor no és ambiciós, Senyor, no són altius els meus ulls; visc sense pretensions de grandeses, o de coses massa altes per a mi; em mantinc en una pau tranquil·la, com un nen a la falda de la mare, tot esperant els vostres dons. Israel espera en el Senyor ara i per tots els segles.", 9, 2, "p1336"], ["Si la solemnitat de sant Antoni Maria Claret coincideix en diumenge, es reciten els salms següents a l’Hora d’entre dia.", 9, 3, "p1338"], ["Salm 117 I", 9, 3, "p1339"], ["Enaltiu el Senyor: Que n’és, de bo, perdura eternament el seu amor. Que respongui la casa d’Israel: perdura eternament el seu amor. Que respongui la casa d’Aharon: perdura eternament el seu amor. Que responguin els qui veneren el Senyor: perdura eternament el seu amor. Enmig del perill vaig clamar al Senyor, i em va escoltar, i me’n va treure. Tinc el Senyor a favor, res no em fa por, els homes, què em poden fer? Tinc el Senyor a favor, ell em defensa, veuré caure els enemics. Més val emparar-se en el Senyor, que posar confiança en els homes. Més val emparar-se en el Senyor, que fiar-se dels poderosos.", 9, 3, "p1340"], ["Salm 117 II", 9, 3, "p1341"], ["Quan totes les nacions m’envoltaven, invocant el Senyor les he vençudes. Quan m’envoltaven i estrenyien el setge, invocant el Senyor les he vençudes. Quan m’envoltaven com un eixam, i s’arboraven com foc d’argelagues, invocant el Senyor les he vençudes. M’empenyien tan fort que anava a caure, però el Senyor m’ha sostingut. Del Senyor em ve la força i el triomf, és ell qui m’ha salvat. Escolteu, crits de festa i de victòria al campament dels justos: «La dreta del Senyor fa proeses, la dreta del Senyor em glorifica, la dreta del Senyor fa proeses.» No moriré, viuré encara, per contar les proeses del Senyor. Els càstigs del Senyor han estat severs, però no m’ha abandonat a la mort.", 9, 3, "p1342"], ["Salm 117 III", 9, 3, "p1343"], ["Obriu-me les portes dels justos: entraré a donar gràcies al Senyor. Aquest és el portal del Senyor, els justos hi poden entrar. Gràcies, perquè vós m’heu escoltat i heu vingut a salvar-me. La pedra que rebutjaven els constructors ara corona l’edifici. És el Senyor qui ho ha fet, i els nostres ulls se’n meravellen. Avui és el dia en què ha obrat el Senyor: alegrem-nos i celebrem-lo. Ah, Senyor, doneu-nos la victòria! Ah, Senyor, feu que prosperem! Beneït el qui ve en nom del Senyor. Us beneïm des de la casa del Senyor. El Senyor és Déu: Que ell ens il·lumini. Porteu els rams, ordeneu la processó, fins a les vores de l’altar. Vós sou el meu Déu, us dono gràcies, us exalço, Déu meu! Enaltiu el Senyor: Que n’és, de bo, perdura eternament el seu amor.", 9, 3, "p1344"], ["Comú de diversos màrtirs, fora del temps pasqual.", 0, "m", "m0x0"], ["Antífona d’introducció", 0, "m", "m0x1"], ["A la terra els sants màrtirs han vessat la seva sang per Crist, per això han arribat al premi etern.", 0, "m", "m0x2"], ["Oració col·lecta", 0, "m", "m0x3"], ["Déu, Pare nostre, que, amb l’ajuda de la Benaurada Verge Maria, vau portar els Beats Màrtirs Claretians a la imitació de Crist fins al vessament de la sang, concediu-nos, pel seu exemple i intercessió, de confessar la fe amb fortalesa, de paraula i d’obra. Per nostre Senyor Jesucrist.", 0, "m", "m0x4"], ["Es poden emprar les lectures del Comú de màrtirs, o bé les següents:", 0, "m", "m0x5"], ["Lectura primera Rm 8,31-39", 0, "m", "m0x6"], ["Res de l’univers creat no serà capaç d’allunyar-nos de Déu que, en Jesucrist, ha demostrat com ens estima", 0, "m", "m0x7"], ["Lectura de la carta de l’apòstol sant Pau als Romans:", 0, "m", "m0x8"], ["Germans: Si tenim Déu amb nosaltres, qui tindrem en contra? Ell, que no va plànyer el seu propi Fill, sinó que el va entregar per tots nosaltres, com no ens ho donarà tot juntament amb ell? Qui s’alçarà per acusar els elegits de Déu, si Déu mateix els fa justos? Qui gosarà condemnar-los, si Jesucrist mateix va morir, més encara, va ressuscitar, està a la dreta de Déu i intercedeix per nosaltres? Qui ens separarà de l’amor de Crist? ¿La tribulació, l’angoixa, la persecució, la fam, la nuesa, el perill, l’espasa? Tal com diu l’Escriptura: És per tu que anem morint tot el dia, i ens tenen com anyells duts a matar. Però, de tot això, en sortim plenament vencedors gràcies a aquell qui ens estima. N’estic cert: ni la mort ni la vida, ni els àngels ni les potències, ni el present ni el futur, ni els poders, ni el món de dalt ni el de sota, ni res de l’univers creat no ens podrà separar de l’amor de Déu que s’ha manifestat en Jesucrist, Senyor nostre.", 0, "m", "m0x9"], ["Paraula de Déu", 0, "m", "m0x10"], ["Salm responsorial Sl 123, 2-5.7b-8", 0, "m", "m0x11"], ["℟. Hem salvat la vida com l’ocell que fuig del llaç dels caçadors.", 0, "m", "m0x12"], ["Si el Senyor no hagués estat a favor nostre, quan els homes intentaven assaltar-nos, ens haurien engolit de viu en viu: tan gran era la fúria que portaven. ℟.", 0, "m", "m0x13"], ["Quan la riuada ens vingué a sobre, ens hauria passat la inundació més amunt del coll, més amunt del coll ens hauria passat la crescuda de les aigües. ℟.", 0, "m", "m0x14"], ["S’ha trencat el llaç, i tots hem fugit.", 0, "m", "m0x15"], ["El nostre auxili és el nom del Senyor, del Senyor que ha fet cel i terra. ℟.", 0, "m", "m0x16"], ["O bé 2Co 4,7-15", 0, "m", "m0x17"], ["Aquell que ressuscità Jesús també ens ressuscitarà a nosaltres amb Jesús i ens portarà a la seva presència juntament amb vosaltres", 0, "m", "m0x18"], ["Lectura de la segona carta de sant Pau als cristians de Corint:", 0, "m", "m0x19"], ["Germans, portem el tresor del ministeri que Déu ens ha confiat com en gerres de terrissa. Així queda ben clar que aquest poder altíssim ve de Déu, i no pas de nosaltres. Quan les contrarietats ens envolten pertot arreu, no quedem del tot encerclats; quan no sabem com escapar-nos, a la fi trobem la sortida; quan els qui ens persegueixen ja ens tenen a les mans, no quedem del tot abandonats; quan ens trobem per terra en la lluita, no arribem a perdre-hi la vida. Sempre i pertot arreu portem la mort de Jesús en el nostre cos, perquè també en el nostre cos es manifesti en el seu esclat la vida de Jesús. És ben bé així: nosaltres vivim, però per causa de Jesús sempre estem a mercè de la mort, i així la vida de Jesús manifesta el seu esclat en la nostra carn mortal. D’aquesta manera, ni la mort no deixa mai de fer en nosaltres la seva obra, ni la vida, en vosaltres. L’Escriptura diu: «Em sento ple de fe, i per això he parlat». Nosaltres, doncs, que tenim el mateix Esperit de la fe, també ens sentim plens d’aquesta fe, i per això parlem, i sabem que aquell qui ressuscità Jesús, el Senyor, també ens ressuscitarà a nosaltres amb Jesús i ens portarà a la seva presència juntament amb vosaltres. Perquè tot això és en bé vostre; així la gràcia de Déu, que es multiplica a mesura que s’estén a molta gent, farà que sigui desbordant l’acció de gràcies a la seva glòria.", 0, "m", "m0x20"], ["Paraula de Déu", 0, "m", "m0x21"], ["Salm responsorial 33, 2-9", 0, "m", "m0x22"], ["℟. Quan els pobres invoquen el Senyor, ell els escolta.", 0, "m", "m0x23"], ["Beneiré el Senyor en tot moment, tindré sempre als llavis la seva lloança. La meva ànima es gloria en el Senyor; se n’alegraran els humils quan ho sentin. ℟.", 0, "m", "m0x24"], ["Tots amb mi glorifiqueu el Senyor, exalcem plegats el seu nom. He cercat el Senyor i ell m’ha respost, m’ha alliberat de l’angoixa que tenia. ℟.", 0, "m", "m0x25"], ["Alceu vers ell la mirada i sereu radiants, i no haureu d’abaixar els ulls, avergonyits. El Senyor escolta el pobre que l’invoca, i el salva de tots els perills. ℟.", 0, "m", "m0x26"], ["Acampa l’àngel del Senyor entorn dels seus fidels per protegir-los. Tasteu i veureu que n’és, de bo, el Senyor; feliç l’home que s’hi refugia! ℟.", 0, "m", "m0x27"], ["Al·leluia Mt 5, 10", 0, "m", "m0x28"], ["℟. Al·leluia, al·leluia, al·leluia!", 0, "m", "m0x29"], ["Feliços els perseguits pel fet de ser justos, perquè d’ells és el Regne del cel. ℟.", 0, "m", "m0x30"], ["Evangeli Jn 17, 11-19", 0, "m", "m0x31"], ["No et demano que els treguis del món, sinó que els preservis del Maligne.", 0, "m", "m0x32"], ["Lectura de l’evangeli segons sant Joan:", 0, "m", "m0x33"], ["En aquell temps, Jesús alçà els ulls al cel i pregà dient: «Jo no em quedo més al món. Però ells s’hi queden, mentre que jo vinc a tu. Pare sant, guarda’ls en el teu nom, el nom que m’has donat, perquè siguin u com ho som nosaltres. Mentre era amb ells, jo els guardava en el teu nom, el que tu m’has donat. He vetllat per ells i no se n’ha perdut ni un de sol, fora del qui s’havia de perdre, perquè es complís el que diu l’Escriptura. Però ara vinc a tu, i mentre encara soc al món dic tot això, perquè ells tinguin també l’alegria que jo tinc, una alegria completa. Jo els he confiat la teva paraula, però ara el món els odia, perquè no són del món, com jo tampoc no en soc. No et demano que els treguis del món, sinó que els preservis del Maligne. Ells no són del món, com jo tampoc no en soc. Consagra’ls en la veritat, que és la teva paraula. Tal com tu m’has enviat al món, jo també els hi he enviat. I jo em consagro a mi mateix per ells, perquè ells també siguin consagrats en la veritat.", 0, "m", "m0x34"], ["Paraula del Senyor", 0, "m", "m0x35"], ["O bé", 0, "m", "m0x36"], ["Al·leluia Lc 23,46", 0, "m", "m0x37"], ["℟. Al·leluia, al·leluia, al·leluia!", 0, "m", "m0x38"], ["Pare, a les vostres mans confio el meu esperit. ℟.", 0, "m", "m0x39"], ["Evangeli Jn 15,18-21", 0, "m", "m0x40"], ["No sou del món, perquè jo us he escollit del món", 0, "m", "m0x41"], ["Lectura de l’evangeli segons sant Joan:", 0, "m", "m0x42"], ["En aquell temps, Jesús digué als seus deixebles: «Si el món us odia, tingueu present que m’ha odiat primer a mi que a vosaltres. Si fóssiu del món, el món us estimaria com a cosa seva. Però vosaltres no sou del món: jo us he escollit del món, i per això el món us odia. Recordeu allò que us he dit: «El criat no és més important que el seu amo.» Si m’han perseguit a mi, també us perseguiran a vosaltres. Si haguessin guardat la meva paraula, també guardarien la vostra. Però tot això us ho faran per causa del meu nom, ja que no coneixen aquell qui m’ha enviat.»", 0, "m", "m0x43"], ["Paraula del Senyor", 0, "m", "m0x44"], ["Oració sobre les ofrenes", 0, "m", "m0x45"], ["Rebeu, Senyor, aquest sacrifici, i feu que tot el que celebrem en el memorial de la passió del vostre Fill, per intercessió i per l’exemple dels Beats Màrtirs Claretians, es faci vida en nosaltres. Per Crist, Senyor nostre.", 0, "m", "m0x46"], ["O bé", 0, "m", "m0x47"], ["Que aquesta ofrena que us presentem, Senyor, en la memòria dels Beats Màrtirs Claretians, encengui en els nostres cors la flama perenne del vostre amor, i ens disposi a rebre el premi promès als que perseveren en la fe. Per Crist, Senyor nostre.", 0, "m", "m0x48"], ["Antífona de comunió Rm 8,38-39", 0, "m", "m0x49"], ["Ni la mort ni la vida, ni res de l’univers creat no ens podrà separar de l’amor Crist.", 0, "m", "m0x50"], ["Oració després de la comunió", 0, "m", "m0x51"], ["Alimentats amb el Cos i la Sang del vostre Fill, us demanem, Senyor, en la memòria dels Beats Màrtirs Claretians, de romandre sempre en vós, perseverar en el vostre amor, viure de la vostra vida i ser conduïts per la vostra mà. Per Crist, Senyor nostre.", 0, "m", "m0x52"], ["(Com al missal romà català) Comú de sants o de religiosos:", 1, "m", "m1x0"], ["Antífona de entrada cf. Pr 31, 30. 28", 1, "m", "m1x1"], ["La dona que venera el Senyor mereix de ser lloada. Els fills van a felicitar-la. (T.P. Al·leluia)", 1, "m", "m1x2"], ["Oració col·lecta", 1, "m", "m1x3"], ["Senyor, vós heu suscitat en l’Església santa Joaquima de Vedruna perquè eduqués cristianament la joventut i servís els malalts. Feu que en sapiguem imitar els seus exemples i posem la nostra vida al servei amorós dels nostres germans. Per nostre Senyor Jesucrist.", 1, "m", "m1x4"], ["Poden emprar-se les lectures corresponents al dia; les del Comú de sants i santes: per a religiosos o les següents:", 1, "m", "m1x5"], ["Lectura primera", 1, "m", "m1x6"], ["Fora del Temps Pasqual Pr 31, 10-13. 19-20. 30-31", 1, "m", "m1x7"], ["La dona que venera el Senyor mereix de ser lloada", 1, "m", "m1x8"], ["Lectura del llibre dels Proverbis:", 1, "m", "m1x9"], ["Una dona forta, qui la trobarà? És més preciosa que les perles. El seu marit confia en ella: no enyorarà cap més tresor; en rebrà benestar i no malestar tots els dies de la vida.", 1, "m", "m1x10"], ["Ella es procura llana i lli, i les seves mans treballen amb delit.", 1, "m", "m1x11"], ["Les seves mans agafen el fus, buida que buida la filosa.", 1, "m", "m1x12"], ["Obre la mà als pobres, l’allarga als necessitats.", 1, "m", "m1x13"], ["L’encís és enganyós, la bellesa s’esvaeix; la dona que venera el Senyor mereix de ser lloada.", 1, "m", "m1x14"], ["Reconeixeu-li el fruit del seu treball: per tot el que fa, rebrà pública lloança.", 1, "m", "m1x15"], ["Paraula de Déu", 1, "m", "m1x16"], ["En Temps Pasqual Ap 19, 1.5-9", 1, "m", "m1x17"], ["Feliços els invitats al banquet de noces de l’Anyell", 1, "m", "m1x18"], ["Lectura del llibre de l’Apocalipsi.", 1, "m", "m1x19"], ["Després d’això, vaig sentir al cel la veu forta d’una gran gentada que proclamava: «Al·leluia! La salvació, la glòria i el poder són del nostre Déu.»", 1, "m", "m1x20"], ["Després va sortir del tron una veu que exclamava: «Lloeu el nostre Déu, tots els seus servents, tots els qui el venereu, petits i grans.»", 1, "m", "m1x21"], ["Llavors vaig sentir la veu d’una gran gentada, que era com el bramul de les onades, com el retruny d’una tronada potent. I deien: «Al·leluia! El Senyor nostre, el Déu de l’univers, ha instaurat el seu Regne. Alegrem-nos-en i celebrem-ho, cantem la seva glòria. Ha arribat l’hora de les noces de l’Anyell, i la seva esposa ja està engalanada. Li ha estat concedit de vestir-se de lli blanc i resplendent, que són les bones obres del poble sant.", 1, "m", "m1x22"], ["Després un àngel em va dir: «Escriu: “Feliços els convidats al banquet de les noces de l’Anyell!”»", 1, "m", "m1x23"], ["Paraula de Déu", 1, "m", "m1x24"], ["Salm responsorial Sl 111, 1-2.-3-4.5-7a. 7b-8.9", 1, "m", "m1x25"], ["℟. Feliç l’home que venera el Senyor.", 1, "m", "m1x26"], ["O bé: Al·leluia!", 1, "m", "m1x27"], ["Feliç l’home que venera el Senyor i estima de cor els seus preceptes! La seva descendència serà gran al país, serà beneït el llinatge dels justos. ℟.", 1, "m", "m1x28"], ["A casa seva hi ha riquesa i abundància, la seva bondat dura per sempre. L’home just, compassiu i benigne, és, per als justos, llum que apunta en la fosca. ℟.", 1, "m", "m1x29"], ["Sortós l’home que presta de bon grat, que disposa a consciència els seus afers. El just no caurà mai i deixarà un record inesborrable. ℟.", 1, "m", "m1x30"], ["Viu sense por de males noves, se sent ferm confiant en el Senyor, té el cor incommovible, res no tem i a la fi veurà vençuts els enemics. ℟.", 1, "m", "m1x31"], ["Reparteix el que té, ho dona als pobres, la seva bondat dura per sempre, pot alçar el front amb dignitat. ℟.", 1, "m", "m1x32"], ["Al·leluia Mt 11,25", 1, "m", "m1x33"], ["℟. Al·leluia, al·leluia, al·leluia!", 1, "m", "m1x34"], ["Us enalteixo, Pare, Senyor del cel i de la terra, perquè heu revelat als senzills tot això que heu amagat als savis i entesos. ℟.", 1, "m", "m1x35"], ["Evangeli Mc 9, 34-37", 1, "m", "m1x36"], ["Qui acull un d’aquests infants en nom meu, m’acull a mi", 1, "m", "m1x37"], ["Lectura de l’evangeli segons sant Marc:", 1, "m", "m1x38"], ["En aquell temps els deixebles callaven, perquè pel camí havien discutit quin d’ells era el més important.", 1, "m", "m1x39"], ["Aleshores s’assegué, va cridar els Dotze i els va dir: «Si algú vol ser el primer, que es faci el darrer de tots i el servidor de tots.»", 1, "m", "m1x40"], ["Llavors va agafar un infant, el posà enmig d’ells, el prengué en braços i els digué: «Qui acull un d’aquests infants en nom meu, m’acull a mi, i qui m’acull a mi, no m’acull a mi, sinó el qui m’ha enviat.»", 1, "m", "m1x41"], ["Paraula del Senyor", 1, "m", "m1x42"], ["Oració sobre les ofrenes", 1, "m", "m1x43"], ["Accepteu, Senyor, els dons que us presentem per celebrar el memorial de l’amor del vostre Fill, i concediu als qui participarem d’aquests misteris que us estimem a vós per damunt de tot i a tots els homes per amor vostre, com ens va ensenyar a f
