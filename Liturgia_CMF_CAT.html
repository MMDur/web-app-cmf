lors.", 3, 0, "p326"], ["Sou del cel la via bella", 3, 0, "p327"], ["per a on baixà el bon Déu,", 3, 0, "p328"], ["remuntant després per ella", 3, 0, "p329"], ["amb qui vulgui ser fill seu.", 3, 0, "p330"], ["Oh del cel formosa Via,", 3, 0, "p331"], ["volem ser tos seguidors.", 3, 0, "p332"], ["El vostre Cor, Verge Mare,", 3, 0, "p333"], ["del bon Jesús fou el bres,", 3, 0, "p334"], ["on el bressà l’Etern Pare", 3, 0, "p335"], ["de l’amor dels dos corprès.", 3, 0, "p336"], ["Vós vetlleu, quan Ell somnia,", 3, 0, "p337"], ["el somni de sos amors.", 3, 0, "p338"], ["Del vostre Fill les memòries", 3, 0, "p339"], ["en aqueix Cor les guardem,", 3, 0, "p340"], ["rosari de vostres glòries,", 3, 0, "p341"], ["que en vostra cel·la passeu;", 3, 0, "p342"], ["repassar jo amb vós voldria", 3, 0, "p343"], ["vostres glòries i dolors.", 3, 0, "p344"], ["Set espases us coronen,", 3, 0, "p345"], ["set espases de pecat,", 3, 0, "p346"], ["quina paga, oh Mare, us donen,", 3, 0, "p347"], ["vostres fills que heu tant amat!", 3, 0, "p348"], ["Jo també hi claví la mia", 3, 0, "p349"], ["fent-vos Mare de dolors!", 3, 0, "p350"], ["Del de Jesús és l’albada", 3, 0, "p351"], ["vostre Cor formós i bell,", 3, 0, "p352"], ["d’aqueix cel mística entrada,", 3, 0, "p353"], ["d’aqueix temple ric cancell.", 3, 0, "p354"], ["En el vostre principia", 3, 0, "p355"], ["el gran riu dels seus amors.", 3, 0, "p356"], ["Prou sentí la flama vostra", 3, 0, "p357"], ["nostre sant Pare Claret,", 3, 0, "p358"], ["quan com Font al món us mostra,", 3, 0, "p359"], ["per calmar d’amor la set.", 3, 0, "p360"], ["De la vostra Confraria", 3, 0, "p361"], ["fa a sos fills propagadors.", 3, 0, "p362"], ["O bé", 3, 0, "p364"], ["Verge fecunda, Mare de l’Església, flor pura de bellesa sobrehumana, alegria de l’home que es lliura, esperança del món que s’afanya. Crescuda en l’amor humil i fort, Mare de Déu, vestida de sol clar, feliç perquè vencéreu la nostra mort i ens oferiu la font de la vida. Cor abrandat per la flama inquieta de l’Esperit diví, doneu llum als nostres ulls, i vesseu amor que ens sostingui en el camí. Cor que respireu en la glòria del Senyor i en proclameu la grandesa, feu que mai no s’apagui el vostre record en els fills que anhelen la vostra puresa. Oh Cor, amor dels qui cerquen en Crist la veritat i el bon camí, enceneu en l’amor els qui lluiten per trobar la vida del vostre Fill. Endinseu-nos en la vostra entranya joiosa, banyeu-nos en la llum de l’Evangeli i prolongueu en nosaltres la missió joiosa de proclamar-lo al món sencer. Glòria al Pare que viu en llum de glòria i al Fill que nasqué de Mare verge, i a l’Esperit fidel que amb la seva ombra cobrí el vostre Cor mansuet i humil. Amén.", 3, 0, "p365"], ["Salmòdia", 3, 0, "p366"], ["Ant. El Senyor derroca els poderosos del soli i exalça els humils.", 3, 0, "p367"], ["Salm 112", 3, 0, "p368"], ["Servents del Senyor, lloeu-lo, lloeu el nom del Senyor. Sigui beneït el nom del Senyor ara i per tots els segles. Des de la sortida fins a la posta del sol lloeu el nom del Senyor. El Senyor és excels als ulls de tots els pobles, la seva glòria s’eleva més enllà del cel. Qui és com el Senyor, el nostre Déu? Té molt amunt el seu tron, i des d’allí s’inclina per veure el cel i la terra. Aixeca de la pols el desvalgut, treu el pobre de la cendra, per asseure’l entre els poderosos, els poderosos del seu poble. La qui vivia estèril a casa, la fa mare feliç amb els fills.", 3, 0, "p369"], ["Ant. El Senyor derroca els poderosos del soli i exalça els humils.", 3, 0, "p370"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 0, "p371"], ["Oració sàlmica", 3, 0, "p372"], ["Senyor, que seieu en el vostre tron i us abaixeu a mirar el cel i la terra, vós us heu fixat en Maria, la vostra humil serventa, i l’heu feta mare feliç d’una multitud de fills, concediu als qui la reconeixem com a Mare, de dir-nos i ser de veritat fills del seu Cor. Per Crist Senyor nostre.", 3, 0, "p373"], ["Ant. El Senyor ha enviat el seu missatge a Maria i li ha manifestat la seva voluntat.", 3, 0, "p374"], ["Salm 147", 3, 0, "p375"], ["Glorifica el Senyor, Jerusalem, Sió, canta lloances al teu Déu, que assegura les teves portes i beneeix dintre teu els teus fills, manté la pau al teu territori i et sacia amb la flor del blat. Envia ordres a la terra, i la seva paraula corre de pressa, no es detura. Tira neu com flocs de llana, escampa com cendra la gebrada; llança el seu glaç com molles de pa, si les aigües es gelen de tanta fredor, dóna una ordre, i les fon tot seguit, fa bufar els seus vents, i l’aigua s’escola. Anuncia les seves paraules als fills de Jacob, als fills d’Israel, els seus decrets i decisions. No ha obrat així amb cap altre poble, no els ha fet conèixer les seves decisions.", 3, 0, "p376"], ["Ant. El Senyor ha enviat el seu missatge a Maria i li ha manifestat la seva voluntat.", 3, 0, "p377"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 0, "p378"], ["Oració sàlmica", 3, 0, "p379"], ["Oh Déu, que en la plenitud dels temps heu enviat el qui és la vostra Paraula, nascut d’una dona, ensenyeu-nos a acollir i guardar, com Ella, la vostra Paraula en el cor fins a convertir-nos en Evangeli de Déu. Per Crist Senyor nostre.", 3, 0, "p380"], ["Ant. El Senyor ha beneït Maria amb tota mena de benediccions dalt del cel; per ella hem rebut el fruit de la vida.", 3, 0, "p381"], ["Càntic Ef 1, 3-10", 3, 0, "p382"], ["Beneït sigui el Déu i Pare de nostre Senyor Jesucrist, que ens ha beneït en Crist amb tota mena de benediccions espirituals dalt del cel. Ens elegí en ell abans de crear el món, perquè fóssim sants, irreprensibles als seus ulls. Per amor ens destinà a ser fills seus per Jesucrist, segons la seva benèvola decisió, que dóna lloança a la grandesa dels favors que ens ha concedit en el seu Estimat. En ell, hem estat rescatats amb el preu de la seva sang. Les nostres culpes han estat perdonades. La riquesa dels favors de Déu s’ha desbordat en nosaltres. Ell ens ha concedit tota aquesta saviesa i penetració que tenim. Ens ha fet conèixer el secret de la decisió benèvola que havia pres, per executar-la quan els temps fossin madurs. Ha volgut unir en el Crist tot el món, tant el del cel com el de la terra.", 3, 0, "p383"], ["Ant. El Senyor ha beneït Maria amb tota mena de benediccions dalt del cel; per ella hem rebut el fruit de la vida.", 3, 0, "p384"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 0, "p385"], ["Oració sàlmica", 3, 0, "p386"], ["Beneït sigueu, Pare, Senyor del cel i de la terra, perquè heu revelat el misteri de la vostra voluntat als senzills; us demanem que el vostre Esperit, amb la col·laboració maternal de Maria, formi Crist en els nostres cors fins arribar a la plenitud de l’home perfecte. Per Crist Senyor nostre.", 3, 0, "p387"], ["Lectura breu", 3, 0, "p388"], ["Ga 4, 4-5", 3, 0, "p389"], ["Quan el temps arribà a la seva plenitud, Déu envià el seu Fill, nascut d’una dona, nascut sota la Llei, per rescatar els qui vivien sota la Llei, perquè obtinguéssim ja la condició de fills.", 3, 0, "p390"], ["Responsori breu", 3, 0, "p391"], ["V. Sou feliç, Verge Maria, perquè heu portat el Creador del món. R. Sou feliç, Verge Maria, perquè heu portat el Creador del món. V. Per vós hem rebut el fruit de la vida. R. Perquè heu portat el Creador del món. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Sou feliç, Verge Maria, perquè heu portat el Creador del món.", 3, 0, "p392"], ["Càntic de Maria", 3, 0, "p393"], ["Ant. Feliç la Verge Maria que conservava en el seu cor la Paraula de Déu i la meditava.", 3, 0, "p394"], ["La meva ànima magnifica el Senyor, el meu esperit celebra el Déu que em salva, perquè ha mirat la petitesa de la seva serventa. Des d’ara totes les generacions em diran benaurada, perquè el Totpoderós obra en mi meravelles. El seu nom és sant, i l’amor que té als qui creuen en ell s’estén de generació en generació. Les obres del seu braç són potents: dispersa els homes de cor altiu, derroca els poderosos del soli i exalça els humils. Omple de béns els pobres, i els rics se’n tornen sense res. Ha protegit Israel, el seu servent, com ho havia promès als nostres pares; s’ha recordat del seu amor a Abraham i a la seva descendència per sempre.", 3, 0, "p395"], ["Ant. Feliç la Verge Maria que conservava en el seu cor la Paraula de Déu i la meditava.", 3, 0, "p396"], ["Pregàries", 3, 0, "p397"], ["Cantem les meravelles de Déu Pare Totpoderós que ha volgut que totes les generacions proclamin la benaurança de la Verge Maria, la Mare del seu Fill i Mare de l’Església i supliquem-lo amb amor i confiança:", 3, 0, "p398"], ["Que la Mare del bell amor ens inflami de zel apostòlic.", 3, 0, "p399"], ["Vós que en fer de Maria la Mare del vostre Fill i Mare nostra, l’heu associada amb un lligam tan estret i indissoluble a l’obra de la salvació,", 3, 0, "p400"], ["— feu que acceptem plenament el vostre projecte de salvació i que amb amor filial acollim Maria com a Mare i Formadora nostra.", 3, 0, "p401"], ["Vós que vau escollir Maria, perquè medités en el seu cor les paraules del vostre Fill i fos la vostra serventa fidel,", 3, 0, "p402"], ["— per la seva intercessió feu-nos deixebles dòcils del vostre Fill i lleials servidors de l’Evangeli.", 3, 0, "p403"], ["Vós que vau enfortir Maria al peu de la Creu i l’omplíreu de goig immens en la resurrecció del vostre Fill,", 3, 0, "p404"], ["— sosteniu benignament la nostra esperança enmig de les contrarietats del ministeri apostòlic.", 3, 0, "p405"], ["Vós que heu volgut que la Immaculada Verge Maria compartís en cos i ànima la glòria del vostre Fill i vetllés maternalment pels germans que encara peregrinen per la terra,", 3, 0, "p406"], ["— forgeu-nos en la fornal del seu Amor i feu que ens dediquem de ple a portar els homes pel camí de la salvació.", 3, 0, "p407"], ["Vós, que omplíreu d’un amor universal el Cor Immaculat de Maria i la féreu Mare de misericòrdia,", 3, 0, "p408"], ["— feu que els pecadors experimentin la seva protecció maternal i que els germans difunts siguin conduïts a la plenitud de la vida eterna.", 3, 0, "p409"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 3, 0, "p410"], ["Pare nostre.", 3, 0, "p411"], ["Oració", 3, 0, "p412"], ["Senyor Déu nostre: Vós heu escollit la Verge Santa Maria com a Mare del vostre Fill i Mare nostra. Feu que ens consagrem de tal manera al seu Cor maternal, que Crist es formi plenament en nosaltres i el seu amor ens faci sentir amb tota la força la urgència d’anunciar l’Evangeli a tothom. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 3, 0, "p413"], ["Ant. Aclamem el Senyor en aquesta festa del Cor Immaculat de la Verge Maria.", 3, 1, "p415"], ["El salm invitatori, com a l’Ordinari.", 3, 1, "p416"], ["Himne", 3, 2, "p418"], ["Turgent d'amor la ment deleja l'hora feliç, en què gaudeixi del delit de sentir vora seu el Cor que enyora, com un foc que s'ablami dins el pit.", 3, 2, "p419"], ["Vol sentir ben a prop la meravella d'aquell Cor que de tan Immaculat és compendi de Mare i de Donzella per voler de l'Amor que l'ha abrandat.", 3, 2, "p420"], ["Ens abelleix l'encís, Verge Maria, del vostre Cor Matern, que dintre seu acceptà, per amor, la gosadia de ser Mare dels homes i de Déu.", 3, 2, "p421"], ["Mare de tota humana criatura, Mare del reu i Mare del botxí, Mare del just de vida recta i pura, Mare del traïdor i de l'assassí.", 3, 2, "p422"], ["Així porteu, oh Mare adolorida, el Cor transit de dols i d'amargor, cada cop que la mort combat la vida dins l'ànima de l'home pecador.", 3, 2, "p423"], ["Nosaltres volem dar-vos l'alegria de qui viu al recer del vostre Cor. Assistiu-nos, oh Mare, nit i dia, infonent-nos la força de l'amor.", 3, 2, "p424"], ["Lloem el Pare, font de tota vida, i el Fill, que ens ha salvat, i l'Esperit, que ens ha donat la joia compartida que fóssim fills del Cor, que s'ha escollit.", 3, 2, "p425"], ["O bé", 3, 2, "p426"], ["Quan se n’anà Jesús, vós us quedàreu al capdavant de la fe i de la pregària, encoratjant la unió dels deixebles i esperant l’Esperit, que és Vida i Amor. Continueu, oh Mare, avui viva en l’Església, pendent de qui mena ferm el timó, esperant, amatent, amb els qui esperen, l’arribada joiosa de Crist Redemptor. Fóreu, Maria, el primer apòstol que lliurà al món el Senyor. Li ensenyàreu a donar-se sempre a tothom, i d’ell aprenguéreu la immensitat del seu amor. Sempre estiguéreu, Mare, amb Crist i així fóreu qui més el conegué; avui sou per a tothom la porta oberta que mena a Crist, camí i salvació. Glòria al Pare, glòria al Fill, glòria a l’Esperit Sant, pels segles dels segles. Amén.", 3, 2, "p427"], ["Salmòdia", 3, 2, "p428"], ["Quan a l’invitatori s’ha dit el salm 23, aquí es diu el salm 94.", 3, 2, "p429"], ["Ant. Maria, de mans innocents i de cor pur, ha rebut la benedicció del Senyor.", 3, 2, "p430"], ["Salm 23", 3, 2, "p431"], ["És del Senyor la terra i tot el que s’hi mou, el món i tots els qui l’habiten. Li ha posat els fonaments dins els mars, i les bases, a les fonts dels rius. Qui pot pujar a la muntanya del Senyor? Qui pot estar-se al recinte sagrat? El qui té el cor sincer i les mans sense culpa, que no confia en els déus falsos, ni jura per ganes d’enganyar. Rebrà benediccions del Senyor, rebrà els favors del Déu que salva. Aquests són els qui vénen a buscar-vos, Senyor, per veure-us de cara, Déu de Jacob. Portals, alceu les llindes; engrandiu-vos, portalades eternes, que ha d’entrar el rei de la glòria! Qui és aquest rei de la glòria? És el Senyor, valent i poderós, és el Senyor, victoriós en el combat. Portals, alceu les llindes, engrandiu-vos, portalades eternes, que ha d’entrar el rei de la glòria! Qui és aquest rei de la glòria? És el Senyor, Déu de l’univers, és aquest el rei de la glòria.", 3, 2, "p432"], ["Ant. Maria, de mans innocents i de cor pur, ha rebut la benedicció del Senyor.", 3, 2, "p433"], ["Oració sàlmica", 3, 2, "p434"], ["Pare sant, que us manifesteu a l’home de mans pures i de cor innocent, netegeu de tota idolatria el cor dels vostres fidels, i enceneu-hi el foc d'amor que abrusà contínuament el Cor de Maria, per poder viure a casa vostra i merèixer la vostra benedicció. Per Crist Senyor nostre.", 3, 2, "p435"], ["Quan es recita el salm 94, es pot dir l’oració següent:", 3, 2, "p436"], ["Senyor, que sou un Déu gran, feu que escoltem avui la vostra veu i, fidels a la vostra llei, reconeguem els vostres camins i entrem en el vostre repòs. Per Crist Senyor nostre.", 3, 2, "p437"], ["Ant. Déu vos salve, Maria, plena de gràcia; el Senyor és amb vós.", 3, 2, "p438"], ["Salm 45", 3, 2, "p439"], ["Déu ens és un castell de refugi, una defensa ferma en hores de perill. No temem res, quan se somou la terra, quan les muntanyes s’enfonsen dins el mar. Ja poden bramular i escumejar les onades, i al seu embat, estremir-se les muntanyes: El Senyor de l’univers és amb nosaltres, la nostra muralla és el Déu de Jacob. Els braços d’un riu alegren la ciutat de Déu, la mansió més sagrada de l’Altíssim. Déu hi és al mig, es manté ferma. Déu la defensa abans que apunti el dia; si s’amotinen les nacions i es revolten els reis, fa esclatar el seu tro, i la terra es desfà. El Senyor de l’univers és amb nosaltres, la nostra muralla és el Déu de Jacob. Veniu, mireu les gestes del Senyor, les meravelles que fa sobre la terra. A tot arreu ha fet cessar els combats, ha trencat els arcs i trossejat les llances, ha tirat al foc els escuts. Desistiu, reconeixeu que jo sóc Déu; jo domino els pobles, domino el món. El Senyor de l’univers és amb nosaltres, la nostra muralla és el Déu de Jacob.", 3, 2, "p440"], ["Ant. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.", 3, 2, "p441"], ["Oració sàlmica", 3, 2, "p442"], ["Oh Déu, refugi i fortalesa nostra, que volguéreu que el vostre Fill, per la força de l'Esperit Sant, s'encarnés en el si de Maria, feu que ella afermi la nostra confiança en el seguiment del vostre Fill. Que viu i regna pels segles dels segles.", 3, 2, "p443"], ["Ant. Amb totes les generacions us proclamem benaurada, Verge Maria.", 3, 2, "p444"], ["Salm 86", 3, 2, "p445"], ["El Senyor té el palau a la muntanya santa, i estima més els portals de Sió que totes les viles de Jacob. S’han dit de tu, ciutat de Déu, oracles gloriosos: «Compto Egipte i Babilònia entre els fidels que em coneixen. A Filistea, a Tir i a Etiòpia els dic: “Fills de Sió.”» Diuen d’ella: «És l’Altíssim mateix qui l’ha fundada; aquest i aquell altre són fills de Sió.» El Senyor va escrivint al registre dels pobles: «Fill de Sió.» I els cantors i els dansaires responen: «Ciutadans de Sió.»", 3, 2, "p446"], ["Ant. Amb totes les generacions us proclamem benaurada, Verge Maria.", 3, 2, "p447"], ["Oració sàlmica", 3, 2, "p448"], ["Pare de tots els homes, que heu volgut que el vostre Fill a la creu ens donés Maria com a Mare, us demanem que lliurant-nos a Ella per cooperar amb el seu servei maternal en la missió apostòlica, creixi el nombre dels vostres fills de tota raça i nació. Per Crist, Senyor nostre.", 3, 2, "p449"], ["V. L’Altíssim ha consagrat la vostra estada. R. Perquè heu portat en el vostre si el Creador de l’univers.", 3, 2, "p450"], ["Primera lectura", 3, 2, "p451"], ["Del llibre dels Proverbis 8, 22-36", 3, 2, "p452"], ["Maria, tron de la saviesa", 3, 2, "p453"], ["Això diu la Saviesa de Déu: El Senyor em posseïa al començament, abans de les seves obres, des de sempre. Em va formar a l'inici del temps, des de l'origen, des del primer moment de la terra. Em va infantar quan els oceans no existien ni brollaven les fonts d'aigua viva. Abans que s'assentessin les muntanyes, abans dels turons, ja m'havia infantat, quan encara no havia fet l'amplària de la terra, el primer grapat de fang dels continents. Jo hi era quan desplegava la volta del cel i marcava un horitzó a l'oceà; quan a dalt penjava els núvols i contenia les aigües abismals; quan imposava un límit a la mar que les aigües no han de traspassar, i quan senyalava els fonaments de la terra. Jo era al seu costat com un mestre d'obres i feia les seves delícies cada dia, jugant davant d'ell sense parar. Jugava per la terra que ell havia creat, i m'era deliciosa la companyia dels homes. \"Escolteu-me, doncs, fills: feliços els qui segueixen els meus camins! Accepteu de formar-vos i posareu seny; no ho refuséssiu pas. Feliç l’home que m'escolta, que vetlla cada dia al meu portal vigilant el llindar de casa meva! Qui em troba, troba la vida, i el Senyor li concedeix el seu favor, però el qui no em troba, es perjudica ell mateix. Els qui m'odien, estimen la mort.\"", 3, 2, "p454"], ["Responsori", 3, 2, "p455"], ["So 3, 14. 15", 3, 2, "p456"], ["V. Alegra’t, filla de Sió; crida de goig, Israel; alegra’t i exulta de tot cor, Jerusalem. R. Alegra’t, filla de Sió; crida de goig, Israel; alegra’t i exulta de tot cor, Jerusalem. V. El Senyor serà el rei d’Israel enmig teu. R. Alegra’t i exulta de tot cor, Jerusalem.", 3, 2, "p457"], ["Segona lectura", 3, 2, "p458"], ["De les cartes de sant Antoni Maria Claret, bisbe i fundador Escritos espirituales, BAC, Madrid 1985, pàgines 497-500 i 506", 3, 2, "p459"], ["El Cor de Maria, temple de l’Esperit Sant", 3, 2, "p460"], ["Acabo de rebre la vostra carta tan estimada en la qual em demaneu que us digui alguna cosa per tal de créixer cada dia més en la devoció al Cor Immaculat de Maria. Poc em podíeu demanar res que m'agradés tant. Prou voldria que tots els cristians tinguessin fam i set d'aquesta devoció. Estimeu, amic meu, estimeu Maria, estimeu-la força. És propi de Déu donar a cada criatura les gràcies segons el fi a què la destina. I com que Déu va destinar Maria perquè fos mare, filla i esposa del mateix Déu, i mare de l'home, podeu comptar quin cor no li devia donar i amb quines gràcies no el devia ornar! En el Cor de Maria cal fixar-se en dues coses: el cor material i el cor formal, que representa l'amor i la voluntat. El Cor de Maria reuneix aquestes propietats i moltes d'altres. El Cor de Maria no solament fou membre viu de Jesucrist per la fe i la caritat, sinó també origen i deu d'on brollà la seva humanitat. El Cor de Maria fou temple de l'Esperit Sant; oi més que temple: puix que de la sang preciosíssima que brolla d'aquest Cor Immaculat l'Esperit Sant formà la humanitat santíssima en les puríssimes i virginals entranyes de Maria en el gran misteri de l'Encarnació. El Cor de Maria ha estat l’òrgan de totes les virtuts en grau heroic, i singularment de l’amor envers Déu i envers els homes. El Cor de Maria —encara avui— és un cor viu, animat i sublimat en el cim més alt de la glòria. El Cor de Maria és el tron on són dispensades totes les gràcies i misericòrdies. Per això, amic meu, en Maria, després de Jesús, hem de posar tota la nostra confiança i esperança de la nostra eterna salvació. Feliç el qui invoca Maria amb confiança: assolirà el perdó dels seus pecats, per molts i greus que siguin, obtindrà la gràcia i finalment la glòria del cel.", 3, 2, "p461"], ["Responsori", 3, 2, "p462"], ["V. Sou feliç, Verge Maria, i digna de tota lloança, perquè per la fe i l’amor formàreu Crist en el vostre Cor. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre. R. Sou feliç, Verge Maria, i digna de tota lloança, perquè per la fe i l’amor formàreu Crist en el vostre Cor. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre. V. Sou feliç, Verge Maria, que portàreu el Fill del Pare etern. R. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre.", 3, 2, "p463"], ["O bé", 3, 2, "p464"], ["De l’exhortació apostòlica Marialis cultus del papa Pau VI, sobre el culte a la Verge Maria Números 17 i 18", 3, 2, "p465"], ["Maria és la Verge que escolta i prega", 3, 2, "p466"], ["Maria és la Verge oient que acull amb fe la Paraula de Déu; fe que va ser la premissa i el camí per a la maternitat divina, perquè, com diu perspicaçment sant Agustí, \"la benaurada Verge Maria va concebre creient el Jesús que va donar a llum creient\"; en rebre de l'àngel la resposta al seu dubte (cf. Lc 1,34-37), \"ella, plena de fe, concebent el Crist abans en el cor que en el cos, va dir: 'Sóc l’esclava del Senyor, que es faci en mi segons la teva paraula' (Lc 1,38)\"; fe que li fou motiu de felicitat i de seguretat en l’acompliment de la promesa: \"Feliç tu que has cregut que s'acomplirà allò que t'ha estat dit de part del Senyor\" (Lc 1, 45); fe amb la qual ella, protagonista i testimoni singular de l'encarnació, recordava els esdeveniments de la infantesa del Crist i els conservava al fons del seu cor (cf. Lc 2,19-51 ). Això és el que fa l’Església quan, sobretot en la Sagrada Escriptura, escolta la paraula de Déu, l'acull, la proclama i la venera, i la dóna als fidels del Crist com a pa de vida i amb la seva llum escateix els signes dels temps i interpreta i viu els esdeveniments humans. Maria és, després, Verge orant. Això es veu en la visitació feta a la mare del precursor. Formula expressions de lloança a Déu i d'humilitat, de fe i d'esperança: són les que ens proporciona el càntic del Magnificat (cf. Lc 1, 46-55), que és la principal pregària de Maria, l’himne propi del temps messiànic. Maria es mostra Verge orant també a Canà, on, en manifestar al seu Fill, amb una delicada súplica, una necessitat únicament temporal, obtingué un efecte de la gràcia: que Jesús fent el primer dels seus \"signes\", confirmés els deixebles en la fe en ell (cf. Jo 2,1-12). També, al final de la seva vida, Maria és presentada com a Verge orant: \"S'aplicaven unànimement a l’oració amb les dones i Maria, la mare de Jesús i amb els germans d'ell\" (Ac 1,14); Maria orant en l'Església naixent i en la de sempre, perquè ara, assumpta al cel, no ha abandonat la seva missió d'intercedir i de salvar. L'Església és també Verge orant, perquè cada dia presenta al Pare les necessitats dels seus fills i \"lloa incessantment el Senyor i intercedeix per la salvació de tot el món\".", 3, 2, "p467"], ["Responsori", 3, 2, "p468"], ["Lc 1, 45-46; cf. Sl 65, 16", 3, 2, "p469"], ["V. Sou feliç, Verge Maria, perquè heu cregut, ja que allò que el Senyor us ha dit es complirà. Maria digué: La meva ànima magnifica el Senyor. R. Sou feliç, Verge Maria, perquè heu cregut, ja que allò que el Senyor us ha dit es complirà. Maria digué: La meva ànima magnifica el Senyor. V. Veniu a escoltar, i us contaré el que Déu ha fet per mi. R. La meva ànima magnifica el Senyor.", 3, 2, "p470"], ["Es diu l’himne Te Deum. L’oració, com a Laudes.", 3, 2, "p471"], ["Oh Déu, us lloem.", 3, 2, "p473"], ["Senyor, us glorifiquem.", 3, 2, "p474"], ["Oh Pare etern, tota la terra us venera.", 3, 2, "p475"], ["Tots els àngels, els querubins i els serafins", 3, 2, "p476"], ["no cessen mai d'aclamar-vos:", 3, 2, "p477"], ["Sant, sant, sant és el Senyor,", 3, 2, "p478"], ["Déu de l'univers", 3, 2, "p479"], ["El cel i la terra són plens", 3, 2, "p480"], ["de la majestat de la vostra glòria.", 3, 2, "p481"], ["El cor gloriós dels Apòstols,", 3, 2, "p482"], ["l'estol venerable dels profetes,", 3, 2, "p483"], ["l'exèrcit esclatant dels màrtirs", 3, 2, "p484"], ["us donen lloança.", 3, 2, "p485"], ["Per tota la terra la santa Església us proclama: Pare d'immensa majestat,", 3, 2, "p486"], ["Fill únic veritable i adorable,", 3, 2, "p487"], ["Esperit Sant, protector.", 3, 2, "p488"], ["Oh Crist, vós sou el Rei de la Glòria.", 3, 2, "p489"], ["Vós sou el Fill etern del Pare.", 3, 2, "p490"], ["Vós, en fer-vos home per alliberar els homes,", 3, 2, "p491"], ["no defugireu d'entrar en el si de la Verge.", 3, 2, "p492"], ["Vós, vençut l'agulló de la mort,", 3, 2, "p493"], ["obríreu als creients el Regne del cel.", 3, 2, "p494"], ["Vós seieu a la dreta de Déu", 3, 2, "p495"], ["en la glòria del Pare.", 3, 2, "p496"], ["I creiem que un dia retornareu com a jutge.", 3, 2, "p497"], ["Us demanem, doncs, que socorregueu", 3, 2, "p498"], ["els vostres servents que heu redimit", 3, 2, "p499"], ["amb la vostra sang preciosa.", 3, 2, "p500"], ["Feu que siguem comptats", 3, 2, "p501"], ["en el nombre dels vostres sants,", 3, 2, "p502"], ["en la glòria eterna.", 3, 2, "p503"], ["Senyor, salveu el vostre poble", 3, 2, "p504"], ["i beneïu la vostra heretat.", 3, 2, "p505"], ["Sigueu el seu pastor,", 3, 2, "p506"], ["preneu-lo sempre als vostres braços.", 3, 2, "p507"], ["Us beneïm dia rera dia", 3, 2, "p508"], ["i lloem per sempre el vostre nom Senyor,", 3, 2, "p509"], ["digneu-vos guardar-nos avui lliures de pecat.", 3, 2, "p510"], ["Senyor, tingueu pietat de nosaltres,", 3, 2, "p511"], ["tingueu pietat.", 3, 2, "p512"], ["Que el vostre amor, Senyor, no ens deixi mai;", 3, 2, "p513"], ["aquesta és l'esperança que posem en vós.", 3, 2, "p514"], ["En vós, Senyor, m'emparo,", 3, 2, "p515"], ["que mai no quedi confós.", 3, 2, "p516"], ["Himne", 3, 3, "p518"], ["Ja pregona l’alegria", 3, 3, "p519"], ["de la primera claror", 3, 3, "p520"], ["el jorn del Cor de Maria,", 3, 3, "p521"], ["que s’estén a l’horitzó.", 3, 3, "p522"], ["La fe lloï la grandesa", 3, 3, "p523"], ["d’aquell Cor Immaculat,", 3, 3, "p524"], ["que amb l’amor de sa puresa", 3, 3, "p525"], ["abelleix la Trinitat.", 3, 3, "p526"], ["Cor de Verge, Cor d’Esposa,", 3, 3, "p527"], ["Cor de Mare, Cor Tresor", 3, 3, "p528"], ["de tota virtut desclosa", 3, 3, "p529"], ["per l’ardència de l’amor.", 3, 3, "p530"], ["Cor estremit d’alegria", 3, 3, "p531"], ["en concebre el Fill diví,", 3, 3, "p532"], ["quan la Paraula prenia", 3, 3, "p533"], ["natura humana en el si.", 3, 3, "p534"], ["Cor amarat de dolcesa", 3, 3, "p535"], ["i de goig celestial,", 3, 3, "p536"], ["quan, malgrat tanta pobresa,", 3, 3, "p537"], ["naixia el Fill al portal.", 3, 3, "p538"], ["Cor immers en l’agonia,", 3, 3, "p539"], ["Cor transit, crucificat,", 3, 3, "p540"], ["quan el Fill en creu moria,", 3, 3, "p541"], ["redimint la humanitat.", 3, 3, "p542"], ["Cor nimbat d’excelsa glòria,", 3, 3, "p543"], ["xop de gaudi i de conhort,", 3, 3, "p544"], ["en rebre el Fill la victòria", 3, 3, "p545"], ["sobre el sepulcre i la mort.", 3, 3, "p546"], ["Per sempre lloança al Pare,", 3, 3, "p547"], ["lloança al Fill i a l’Amor", 3, 3, "p548"], ["que ha dat a la nostra Mare", 3, 3, "p549"], ["l’excelsitud del seu Cor.", 3, 3, "p550"], ["O bé", 3, 3, "p551"], ["Oh Verge Maria", 3, 3, "p552"], ["Mare del bon Déu!", 3, 3, "p553"], ["Vulgueu abrigar-me", 3, 3, "p554"], ["amb vostre mantell!", 3, 3, "p555"], ["Quin consol, oh Mare", 3, 3, "p556"], ["d’estar prop de vós!", 3, 3, "p557"], ["Feu que visqui sempre", 3, 3, "p558"], ["dins el vostre Cor!", 3, 3, "p559"], ["Mostreu-nos, oh Mare,", 3, 3, "p560"], ["el camí del cel,", 3, 3, "p561"], ["i enmig dels mals passos,", 3, 3, "p562"], ["Verge, no ens deixeu.", 3, 3, "p563"], ["D’ànimes perdudes", 3, 3, "p564"], ["el món està ple;", 3, 3, "p565"], ["no el perdéssim, Mare,", 3, 3, "p566"], ["el camí del cel!", 3, 3, "p567"], ["Sigui Jesús, Mare,", 3, 3, "p568"], ["sempre el nostre Rei,", 3, 3, "p569"], ["i el seu Evangeli", 3, 3, "p570"], ["sigui nostra Llei.", 3, 3, "p571"], ["Volem per senyera", 3, 3, "p572"], ["la divina Creu;", 3, 3, "p573"], ["i per llum i guia", 3, 3, "p574"], ["nostra santa fe.", 3, 3, "p575"], ["Oh Verge Maria ...", 3, 3, "p576"], ["O bé", 3, 3, "p577"], ["Verge plena de gràcia, mare dels vivents, beneïda pels segles més que totes les mares. Coberta per l’ombra fecunda de l’Esperit, engendreu en el vostre si la llum que il·lumina el món. El vostre Cor escolta la Paraula de vida, la conserva en les estances profundes de la sang i la medita sempre amb amor i tendresa. La fe us feu benaurada, Mare feliç del Verb. Pobra i humil esclava del Senyor de la glòria, abrandada en el foc de la font divina, precediu l’Església, pelegrina cap al Pare, en la fe, en l’esperança i en l’amor invencible. Al costat de l’arbre de la creu redemptora, mentre el fruit sant del vostre ventre agonitza i accepteu el suplici de l’espasa punyent que us travessa l’ànima, ens preneu per fills. Formàreu els Apòstols amb la vostra pregària assídua per ser llum del món enmig dels homes. Formeu-nos, els vostres fills, en la fornal ardent del vostre si florit, ja ple de glòria. Avui, amb goig radiant, els vostres fills celebrem l’amor de Déu Pare, del Fill i de l’Esperit, que ompliren de glòria el vostre Cor sagrat i l’omplen de glòria per segles infinits. Amén.", 3, 3, "p578"], ["Salmòdia", 3, 3, "p579"], ["Ant. L’amor que em teniu val més que la vida, per això els meus llavis us lloaran.", 3, 3, "p580"], ["Salm 62, 2-9", 3, 3, "p581"], ["Vós, Senyor, sou el meu Déu; jo us cerco. Tot jo tinc set de vós, per vós es desviu el meu cor, com terra eixuta, sense una gota d’aigua. Jo us contemplava al vostre santuari quan us veia gloriós i poderós. L’amor que em teniu val més que la vida; per això els meus llavis us lloaran. Que tota la vida us pugui beneir i alçar les mans lloant el vostre nom. Saciat del bo i millor, us lloaré amb el goig als llavis. Quan des del llit us recordo, passo les nits pensant en vós, perquè vós m’heu ajudat, i sóc feliç sota les vostres ales. La meva ànima s’ha enamorat de vós, em sosté la vostra mà.", 3, 3, "p582"], ["Ant. L’amor que em teniu val més que la vida, per això els meus llavis us lloaran.", 3, 3, "p583"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 3, "p584"], ["Oració sàlmica", 3, 3, "p585"], ["La nostra ànima té set de vós, Senyor, com terra eixuta i sense aigua; feu que comprenguem que els nostres anhels s’han fet realitat en Maria, la vostra humil serventa, exalçada al cel al costat del vostre Fill Jesucrist. Ell, que viu i regna pels segles dels segles.", 3, 3, "p586"], ["Ant. Maria, santa i humil de cor, beneeix el Senyor amb totes les criatures de la terra.", 3, 3, "p587"], ["Càntic Dn 3, 57-88.56", 3, 3, "p588"], ["Beneïu el Senyor, totes les criatures, canteu-li lloances per sempre. Beneïu-lo, àngels del Senyor, beneïu, cels, el Senyor. Beneïu el Senyor, aigües de l’espai, beneïu-lo, estols del Senyor. Beneïu el Senyor, sol i lluna, beneïu-lo, estrelles del cel. Beneïu el Senyor, pluges i rosades, beneïu-lo, tots els vents. Beneïu el Senyor, foc i calor, beneïu-lo, freds i gelades. Beneïu el Senyor, rosades i gebre, beneïu-lo, glaç i freds. Beneïu el Senyor, neus i geleres, beneïu-lo, dies i nits. Beneïu el Senyor, llum i tenebres, beneïu-lo, núvols i llamps. Que la terra beneeixi el Senyor, que li canti lloances per sempre. Beneïu el Senyor, muntanyes i turons, vegetació de la terra, beneeix-lo. Beneïu, fonts, el Senyor, beneïu-lo, rius i mars. Beneïu el Senyor, peixos i monstres marins, beneïu-lo, tots els ocells. Beneïu el Senyor, feres i ramats, canteu-li lloances per sempre. Beneïu el Senyor, tots els homes, beneeix-lo, poble d’Israel. Beneïu-lo, sacerdots del Senyor, beneïu-lo, servents del Senyor. Beneïu el Senyor, sants i humils de cor, ànimes i esperits dels justos, beneïu-lo. Beneïu el Senyor, Hananies, Azaries i Misael, canteu-li lloances per sempre. Beneïm el Pare i el Fill amb l’Esperit Sant, cantem-li lloances per sempre. Sou beneït, Senyor, al firmament del cel. Glòria i lloança per sempre.", 3, 3, "p589"], ["Ant. Maria, santa i humil de cor, beneeix el Senyor amb totes les criatures de la terra.", 3, 3, "p590"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 3, "p591"], ["Oració sàlmica", 3, 3, "p592"], ["Us lloem i beneïm, Senyor Déu nostre, perquè ens heu omplert de vida i d’esperança en el vostre Fill Jesucrist: ensenyeu-nos, per intercessió de Maria, a veure-us a vós en totes les coses i totes les coses en vós, per cantar la vostra lloança pels segles dels segles.", 3, 3, "p593"], ["A l’acabament d’aquest càntic no es diu Glòria al Pare.", 3, 3, "p594"], ["Ant. Cantem avui al Senyor un càntic nou, perquè el Senyor ha coronat de triomf Maria, la seva humil serventa.", 3, 3, "p595"], ["Salm 149", 3, 3, "p596"], ["Canteu al Senyor un càntic nou, canteu les seves lloances davant dels qui l’estimen. Se sent feliç Israel del qui l’ha creat, s’alegren del seu rei els fills de Sió. Lloen el seu nom, el lloen tot dansant, acompanyen els seus cants", 3, 3, "p597"], ["amb els tambors i les cítares. Perquè el Senyor estima el seu poble, coronarà de triomf els humils. Els fidels celebren la seva glòria, des dels seus rengles aclamen plens de goig; mentre els seus llavis glorifiquen Déu, tenen a les mans espases de dos talls, per fer justícia entre els pobles, per reprendre i castigar les nacions, encadenant els seus reis, emmanillant els poderosos. Executar la sentència que està escrita és la glòria reservada als qui l’estimen.", 3, 3, "p598"], ["Ant. Cantem avui al Senyor un càntic nou, perquè el Senyor ha coronat de triomf Maria, la seva humil serventa.", 3, 3, "p599"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 3, "p600"], ["Oració sàlmica", 3, 3, "p601"], ["Senyor Déu, creador i alliberador nostre: us donem gràcies, perquè heu enriquit Maria amb un cor savi i dòcil, nou i humil, ferm i disposat a suportar l’espasa de dolor i a esperar, plena de fe, la resurrecció del vostre Fill. Ell, que viu i regna pels segles dels segles.", 3, 3, "p602"], ["Lectura breu", 3, 3, "p603"], ["He 11, 11-12", 3, 3, "p604"], ["Gràcies a la fe, també Sara, que era estèril, va obtenir la capacitat de fundar un llinatge, tot i que li havia passat l’edat; és que va posar la confiança en el qui havia fet la promesa. Per això, d’un sol home, Abraham, que ja era a les portes de la mort, en nasqué una descendència tan nombrosa com les estrelles del cel i com els grans de sorra de la vora de la mar.", 3, 3, "p605"], ["Responsori breu", 3, 3, "p606"], ["V. Que la paraula de Crist tingui estada entre vosaltres en tota la seva riquesa. Feliços els qui la guarden. R. Que la paraula de Crist tingui estada entre vosaltres en tota la seva riquesa. Feliços els qui la guarden. V. És la Paraula de la fe que prediquem. R. Feliços els qui la guarden. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Que la paraula de Crist tingui estada entre vosaltres en tota la seva riquesa. Feliços els qui la guarden.", 3, 3, "p607"], ["Càntic de Zacaries", 3, 3, "p608"], ["Ant. Sou feliç, Verge Maria, perquè heu cregut; però feliços també els qui escolten la paraula de Déu i la guarden.", 3, 3, "p609"], ["Beneït sigui el Senyor, Déu d’Israel, ha visitat el seu poble i l’ha redimit. Fa que s’aixequi un salvador poderós a la casa de David el seu servent, com ho havia anunciat de temps antic, per boca dels seus sants profetes. Així ens salva, alliberant-nos dels enemics, de les mans dels qui ens volen mal, mogut per l’amor que el fa fidel als nostres pares, i pel record de l’Aliança santa, que jurà al nostre pare Abraham, prometent de concedir-nos que, sense por, lliures dels enemics, li donem culte amb santedat i justícia tota la vida. I a tu, infant, et diran profeta de l’Altíssim, perquè aniràs al davant del Senyor a preparar els seus camins. Faràs saber al poble que li ve la salvació, el perdó dels seus pecats, per l’amor entranyable del nostre Déu. Perquè ens estima, ens visitarà un Sol que ve del cel, per il·luminar els qui viuen a la fosca, a les ombres de la mort, i guiar els nostres passos per camins de pau.", 3, 3, "p610"], ["Ant. Sou feliç, Verge Maria, perquè heu cregut; però feliços també els qui escolten la paraula de Déu i la guarden.", 3, 3, "p611"], ["Pregàries", 3, 3, "p612"], ["En celebrar amb goig aquesta festa, elevem, per intercessió del Cor de Maria, les nostres súpliques al Pare, perquè en la nostra vida i ministeri siguem veritables fills del Cor Immaculat de Maria, i diguem-li:", 3, 3, "p613"], ["Escolteu la nostra pregària.", 3, 3, "p614"], ["Vós que heu donat a Maria un cor sense taca,", 3, 3, "p615"], ["— netegeu-nos de tota culpa i feu que ens allunyem sempre de qualsevol iniquitat.", 3, 3, "p616"], ["Vós que per l’Esperit Sant vau consagrar Maria perquè fos Mare del vostre Fill,", 3, 3, "p617"], ["— feu que esmercem tota la nostra vida en el seu servei.", 3, 3, "p618"], ["Vós que heu escollit Maria com a Arca del Verb Etern,", 3, 3, "p619"], ["— concediu-nos de guardar i de meditar la vostra Paraula en el nostre cor.", 3, 3, "p620"], ["Vós que vau voler que el vostre Fill, clavat a la creu, ens donés Maria per Mare,", 3, 3, "p621"], ["— feu-nos la gràcia de ser autèntics fills seus en l’anunci del vostre Regne.", 3, 3, "p622"], ["Vós volguéreu que Maria estigués entre els apòstols el dia de la Pentecosta,", 3, 3, "p623"], ["— infoneu-nos l’Esperit Sant i renoveu-nos perquè anunciem el vostre Regne a tots els pobles.", 3, 3, "p624"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 3, 3, "p625"], ["Pare nostre.", 3, 3, "p626"], ["Oració", 3, 3, "p627"], ["Senyor Déu nostre: Vós heu escollit la Verge Santa Maria com a Mare del vostre Fill i Mare nostra. Feu que ens consagrem de tal manera al seu Cor maternal, que Crist es formi plenament en nosaltres i el seu amor ens faci sentir amb tota la força la urgència d’anunciar l’Evangeli a tothom. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 3, 3, "p628"], ["Es diuen els salms graduals de la salmòdia complementària. Els salms 121 i 126, que ja s’empren a les II Vespres, es poden substituir pels salms 128 i 130, respectivament.", 3, 4, "p630"], ["Tèrcia", 3, 4, "p631"], ["Himne", 3, 4, "p632"], ["Salve, Mare virginal, promesa, assoliment, fruïció. Sou la plena floració d’una gràcia maternal. Sou tota cor. Aquesta és la Verge que escolta, feta de silenci i de fe. El seu amor en les ombres fou espurna per a la seva ment, llanterna per al seu peu. Aquesta és la Verge que prega, crit d’un món sense veu. El seu amor la fa portaveu del dolor més punyent, de la set més gran de Déu. Aquesta és la Mare que ofereix, rica en generositat. El seu amor fa íntims el clam més exigent i el lliurament més agosarat. Glòria en silenci i en cor al Pare, al Fill, a la Unció. Glòria a l’amor en acció. On és el nostre tresor és el nostre cor.", 3, 4, "p633"], ["Ant. Tots pregaven Déu de tot cor perquè mirés el seu poble.", 3, 4, "p634"], ["Lectura breu", 3, 4, "p635"], ["Ac 1, 12-14", 3, 4, "p636"], ["Els Apòstols se’n tornaren a Jerusalem de la muntanya de les Oliveres, que és vora mateix de Jerusalem, a la distància que era permès de recórrer durant el repòs del dissabte. Entraren a la ciutat i pujaren a la sala on s’allotjaven. Eren Pere, Joan, Jaume, Andreu, Felip, Tomàs, Bartomeu, Mateu, Jaume, fill d’Alfeu, Simó, el Zelador, i Judes, fill de Jaume. Tots unànimement assistien sens falta a les hores de pregària, amb les dones, amb Maria, la mare de Jesús, i els parents d’ell.", 3, 4, "p637"], ["V. Maria lloa el Senyor sense parar. R. Intercedeix per la salvació de tot el món.", 3, 4, "p638"], ["L’oració, com a Laudes.", 3, 4, "p639"], ["Sexta", 3, 4, "p640"], ["L’himne, com a Tèrcia.", 3, 4, "p641"], ["Ant. Visiteu-nos, veniu a salvar-nos, ara i per tots els segles.", 3, 4, "p642"], ["Lectura breu", 3, 4, "p643"], ["Ef 3, 17-19", 3, 4, "p644"], ["Que, per la fe, faci habitar el Crist en els vostres cors, i així, arrelats i fonamentats en l’amor, sigueu capaços de comprendre, amb tot el poble sant, l’amplada i la llargada, l’alçada i la profunditat de l’amor de Crist; que arribeu a conèixer aquest amor que sobrepassa tot coneixement i, així, entreu del tot a la plenitud de Déu.", 3, 4, "p645"], ["V. Feliç vós, Maria, que heu cregut. R. Allò que el Senyor us ha fet saber es complirà.", 3, 4, "p646"], ["L’oració, com a Laudes.", 3, 4, "p647"], ["Nona", 3, 4, "p648"], ["L’himne, com a Tèrcia.", 3, 4, "p649"], ["Ant. Maria, Mare del bell amor, del temor, de la saviesa i de la santa esperança.", 3, 4, "p650"], ["Lectura breu", 3, 4, "p651"], ["Jdt 13, 18-19", 3, 4, "p652"], ["Filla, que el Déu altíssim et beneeixi entre totes les dones de la terra. Beneït sigui el Senyor, creador del cel i de la terra, que guià el teu cop contra el cap del general enemic. Els qui recordin aquesta gesta de Déu mai no perdran la confiança que inspires.", 3, 4, "p653"], ["V. Maria ha rebut la benedicció del Senyor. R. I la misericòrdia de Déu, el seu Salvador.", 3, 4, "p654"], ["L’oració, com a Laudes.", 3, 4, "p655"], ["Himne", 3, 5, "p657"], ["Com a les primeres vespres o bé", 3, 5, "p658"], ["Verge Maria, la dona en flames: Déu, que us volgué Mare de tots, posà al vostre pit un Cor immens, més que l’oceà. Vós, que acollíreu la Paraula eterna i en conservàveu àvidament les paraules, feu, com el vostre, els nostres cors arques del Verb. Vós, que pujàreu intrèpida fins al Calvari, amb el pit ferit per l’espasa, doneu-nos, pietosa, un cor magnànim fins a la mort. Vós, que esperàreu amb els vostres nous fills la flama viva en què es donà l’Esperit, feu que sorgeixin per l’amplada del món nous Cenacles. Glòria a l’augusta Trinitat per sempre, que, habitant el vostre Cor puríssim, feu el motlle d’una Església santa, santa i catòlica.", 3, 5, "p659"], ["Salmòdia", 3, 5, "p660"], ["Ant. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.", 3, 5, "p661"], ["Salm 121", 3, 5, "p662"], ["Quina alegria quan em van dir: «Anem a la casa del Senyor». Ja han arribat els nostres peus al teu llindar, Jerusalem. Jerusalem, ciutat ben construïda, conjunt harmoniós; és allà que pugen les tribus, les tribus del Senyor, a complir l’aliança d’Israel a lloar el nom del Senyor. Allí hi ha els tribunals de justícia, els tribunals del palau de David. Augureu la pau a Jerusalem: «Que visquin segurs els qui t’estimen, que sigui inviolable la pau dels teus murs, la quietud dels teus merlets». Per amor dels meus germans i amics, deixeu-me dir: «Que hi hagi pau dintre teu». Per la casa del Senyor, el nostre Déu, et desitjo la felicitat.", 3, 5, "p663"], ["Ant. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.", 3, 5, "p664"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 5, "p665"], ["Oració sàlmica", 3, 5, "p666"], ["Senyor, que ens heu invitat a casa vostra i voleu que ens mantinguem a la vostra presència: feu que, en el nostre camí de fidelitat, ens guiï sempre la Verge fidel que acollí i guardà la Paraula en el seu Cor per donar-la al món com a principi i sagrament universal de salvació. Per Crist Senyor nostre.", 3, 5, "p667"], ["Ant. Oh Maria, sou beneïda entre totes les dones i és beneït el fruit de les vostres entranyes.", 3, 5, "p668"], ["Salm 126", 3, 5, "p669"], ["Si el Senyor no construeix la casa, és inútil l’afany dels constructors. Si el Senyor no guarda la ciutat, és inútil que vigilin els guardes. Es inútil que us lleveu tan de matí, i aneu tan tard a reposar, per menjar el pa que us guanyeu a dures penes. Fins quan dormen, Déu el dóna als seus amics. La millor herència són els fills, do del Senyor, els descendents són la millor recompensa; els fills que heu tingut quan éreu joves són com les fletxes en mans d’un guerrer; feliç l’home que se n’omple el buirac: si discuteix amb algú davant la gent, no haurà de retirar-se avergonyit.", 3, 5, "p670"], ["Ant. Oh Maria, sou beneïda entre totes les dones i és beneït el fruit de les vostres entranyes.", 3, 5, "p671"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 5, "p672"], ["Oració sàlmica", 3, 5, "p673"], ["Oh Déu, constructor de la casa i guardià de la ciutat, feu que imitem Maria en la seva cooperació a l’obra salvadora del vostre Fill i que ens dediquem plenament a la missió apostòlica de proclamar fidelment l’Evangeli. Per Crist Senyor nostre.", 3, 5, "p674"], ["Ant. Déu elegí Maria en Crist abans de crear el món.", 3, 5, "p675"], ["Càntic Ef 1, 3-10", 3, 5, "p676"], ["Beneït sigui el Déu i Pare de nostre Senyor Jesucrist, que ens ha beneït en Crist amb tota mena de benediccions espirituals dalt del cel. Ens elegí en ell abans de crear el món, perquè fóssim sants, irreprensibles als seus ulls. Per amor ens destinà a ser fills seus per Jesucrist, segons la seva benèvola decisió, que dóna lloança a la grandesa dels favors que ens ha concedit en el seu Estimat. En ell, hem estat rescatats amb el preu de la seva sang. Les nostres culpes han estat perdonades. La riquesa dels favors de Déu s’ha desbordat en nosaltres. Ell ens ha concedit tota aquesta saviesa i penetració que tenim. Ens ha fet conèixer el secret de la decisió benèvola que havia pres, per executar-la quan els temps fossin madurs. Ha volgut unir en el Crist tot el món, tant el del cel com el de la terra.", 3, 5, "p677"], ["Ant. Déu elegí Maria en Crist abans de crear el món.", 3, 5, "p678"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 3, 5, "p679"], ["Oració sàlmica", 3, 5, "p680"], ["Beneït sigueu, Déu nostre, perquè, sense cap mèrit nostre, ens heu elegit en la persona de Crist abans de la creació del món; us supliquem que envieu nous treballadors a la nostra Congregació i ens confirmeu en la vocació missionera per tal que anunciem a tots els pobles la Bona Nova del Regne. Per Crist Senyor nostre.", 3, 5, "p681"], ["Lectura breu", 3, 5, "p682"], ["1Co 15, 22-23", 3, 5, "p683"], ["Tots són d’Adam, i per això tots moren, però tots viuran gràcies al Crist. Cadascun al moment que li correspon: Crist el primer, després, a l’hora que ell vindrà, els qui són de Crist.", 3, 5, "p684"], ["Responsori breu", 3, 5, "p685"], ["V. Ensenyeu-me a fer la vostra voluntat, i conduïu-me per terra plana. R. Ensenyeu-me a fer la vostra voluntat, i conduïu-me per terra plana. V. Ja que voleu que siguem sants. R. I conduïu-me per terra plana. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Ensenyeu-me a fer la vostra voluntat, i conduïu-me per terra plana.", 3, 5, "p686"], ["Càntic de Maria", 3, 5, "p687"], ["Ant. Alegreu-vos, Verge Maria, Déu us concedí de portar el Crist Salvador. Per vós ha vingut als homes la salvació.", 3, 5, "p688"], ["La meva ànima magnifica el Senyor, el meu esperit celebra el Déu que em salva, perquè ha mirat la petitesa de la seva serventa. Des d’ara totes les generacions em diran benaurada, perquè el Totpoderós obra en mi meravelles. El seu nom és sant, i l’amor que té als qui creuen en ell s’estén de generació en generació. Les obres del seu braç són potents: dispersa els homes de cor altiu, derroca els poderosos del soli i exalça els humils. Omple de béns els pobres, i els rics se’n tornen sense res. Ha protegit Israel, el seu servent, com ho havia promès als nostres pares; s’ha recordat del seu amor a Abraham i a la seva descendència per sempre.", 3, 5, "p689"], ["Ant. Alegreu-vos, Verge Maria, Déu us concedí de portar el Crist Salvador. Per vós ha vingut als homes la salvació.", 3, 5, "p690"], ["O bé: El meu esperit celebra el Déu que em salva, perquè el Totpoderós obra en mi meravelles.", 3, 5, "p691"], ["Les pregàries, com a les I Vespres.", 3, 5, "p692"], ["Oració", 3, 5, "p693"], ["Senyor Déu nostre: Vós heu escollit la Verge Santa Maria com a Mare del vostre Fill i Mare nostra. Feu que ens consagrem de tal manera al seu Cor maternal, que Crist es formi plenament en nosaltres i el seu amor ens faci sentir amb tota la força la urgència d’anunciar l’Evangeli a tothom. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 3, 5, "p694"], ["La Congregació de Missioners Fills del Cor Immaculat de la benaurada Verge Maria fou fundada a Vic (Barcelona) el 16 de juliol de 1849. Els inicis foren humils; tanmateix, segons la intenció del fundador, s’emprenia una gran obra. «La fundació de la Congregació és atribuïda a la intervenció de Maria Santíssima». En el dia dedicat a la benaurada Verge Maria del Mont Carmel, el quadre de la Mare del Bell Amor, que presidia la cel·la on es congregava el grup per començar els exercicis espirituals, era com un auguri i una penyora segura de la protecció maternal de Maria envers aquells Missioners que es deien fills seus i li consagraven els seus projectes de vida missionera.", 4, -1, "p699"], ["Ant. Veniu, adorem Crist, Fill de Maria.", 4, 0, "p701"], ["O bé: Aclamem el Senyor en aquesta festa de la Verge Maria.", 4, 0, "p702"], ["El salm invitatori, com a l’Ordinari.", 4, 0, "p703"], ["Himne", 4, 1, "p705"], ["Qui sou vós, dona, que, tot i semblar rendida, tot i semblar prostrada, no sou sinó enaltida als cels, no sou sinó preferida a la terra? Però, de què ens sorprenem, si, vestida de sol, si, coronada d’estrelles, veniu il·luminada de tantes llums, veniu guarnida de tants raigs? El cel i la terra sembla que, en bellesa, competiren amb la mateixa cura, barrejades les seves estrelles i les seves flors, perquè en vós tinguessin terra i cel, amb no sé quines resplendors llunyanes, una flor del Sol plantada al Carmel. Glòria al Pare, al Fill i a l’Esperit, pels segles dels segles. Amén.", 4, 1, "p706"], ["Salmòdia", 4, 1, "p707"], ["Quan a l’invitatori s’ha dit el salm 23, aquí es diu el salm 94.", 4, 1, "p708"], ["Ant. Maria ha rebut la benedicció del Senyor. Per Maria hem rebut la salvació de Déu.", 4, 1, "p709"], ["Salm 23", 4, 1, "p710"], ["És del Senyor la terra i tot el que s’hi mou, el món i tots els qui l’habiten. Li ha posat els fonaments dins els mars, i les bases, a les fonts dels rius. Qui pot pujar a la muntanya del Senyor? Qui pot estar-se al recinte sagrat? El qui té el cor sincer i les mans sense culpa, que no confia en els déus falsos, ni jura per ganes d’enganyar. Rebrà benediccions del Senyor, rebrà els favors del Déu que salva. Aquests són els qui vénen a buscar-vos, Senyor, per veure-us de cara, Déu de Jacob. Portals, alceu les llindes; engrandiu-vos, portalades eternes, que ha d’entrar el rei de la glòria! Qui és aquest rei de la glòria? És el Senyor, valent i poderós, és el Senyor, victoriós en el combat. Portals, alceu les llindes, engrandiu-vos, portalades eternes, que ha d’entrar el rei de la glòria! Qui és aquest rei de la glòria? És el Senyor, Déu de l’univers, és aquest el rei de la glòria.", 4, 1, "p711"], ["Ant. Maria ha rebut la benedicció del Senyor. Per Maria hem rebut la salvació de Déu.", 4, 1, "p712"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 1, "p713"], ["Oració sàlmica", 4, 1, "p714"], ["Pare sant, que us manifesteu a l’home de mans pures i de cor innocent, concediu-nos que, ajudats per la intercessió de la Verge Maria, anunciem al món la vostra misericòrdia i us estimem com Ella us estimà. Per Crist Senyor nostre.", 4, 1, "p715"], ["Ant. Veniu i veureu les meravelles del Senyor. Ell ha obrat coses grans per mi.", 4, 1, "p716"], ["Salm 45", 4, 1, "p717"], ["Déu ens és un castell de refugi, una defensa ferma en hores de perill. No temem res, quan se somou la terra, quan les muntanyes s’enfonsen dins el mar. Ja poden bramular i escumejar les onades, i al seu embat, estremir-se les muntanyes: El Senyor de l’univers és amb nosaltres, la nostra muralla és el Déu de Jacob. Els braços d’un riu alegren la ciutat de Déu, la mansió més sagrada de l’Altíssim. Déu hi és al mig, es manté ferma. Déu la defensa abans que apunti el dia; si s’amotinen les nacions i es revolten els reis, fa esclatar el seu tro, i la terra es desfà. El Senyor de l’univers és amb nosaltres, la nostra muralla és el Déu de Jacob. Veniu, mireu les gestes del Senyor, les meravelles que fa sobre la terra. A tot arreu ha fet cessar els combats, ha trencat els arcs i trossejat les llances, ha tirat al foc els escuts. Desistiu, reconeixeu que jo sóc Déu; jo domino els pobles, domino el món. El Senyor de l’univers és amb nosaltres, la nostra muralla és el Déu de Jacob.", 4, 1, "p718"], ["Ant. Veniu i veureu les meravelles del Senyor. Ell ha obrat coses grans per mi.", 4, 1, "p719"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 1, "p720"], ["Oració sàlmica", 4, 1, "p721"], ["Oh Déu, que no cesseu d’obrar meravelles en favor de la vostra Església i heu suscitat sant Antoni M. Claret per tal que fundés la nostra Congregació amb una intervenció particular de la Verge Maria: concediu al nostre Institut arrelament, fortalesa i coratge, i atorgueu un abundant fruit apostòlic als seus treballs. Per Crist Senyor nostre.", 4, 1, "p722"], ["Ant. L’Altíssim l’ha fundada i tots hi han nascut.", 4, 1, "p723"], ["Salm 86", 4, 1, "p724"], ["El Senyor té el palau a la muntanya santa, i estima més els portals de Sió que totes les viles de Jacob. S’han dit de tu, ciutat de Déu, oracles gloriosos: «Compto Egipte i Babilònia entre els fidels que em coneixen. A Filistea, a Tir i a Etiòpia els dic: “Fills de Sió.”» Diuen d’ella: «És l’Altíssim mateix qui l’ha fundada; aquest i aquell altre són fills de Sió.» El Senyor va escrivint al registre dels pobles: «Fill de Sió.» I els cantors i els dansaires responen: «Ciutadans de Sió.»", 4, 1, "p725"], ["Ant. L’Altíssim l’ha fundada i tots hi han nascut.", 4, 1, "p726"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 1, "p727"], ["Oració sàlmica", 4, 1, "p728"], ["Senyor, que estimeu la vostra Església, obra de les vostres mans, us donem gràcies perquè hi heu inscrit els nostres noms. Ajudeu-nos a enriquir-la essent fidels a la vocació que hem rebut. Per Crist Senyor nostre.", 4, 1, "p729"], ["V. Maria conservava tots aquests records en el seu cor. R. I els meditava.", 4, 1, "p730"], ["Primera lectura", 4, 1, "p731"], ["Del llibre de l’Apocalipsi 11, 19a; 12, 1-17", 4, 1, "p732"], ["El senyal prodigiós de la dona al cel", 4, 1, "p733"], ["Aleshores es va obrir el temple de Déu que hi ha al cel, i dins el temple va aparèixer l’arca de l’aliança de Déu. Llavors aparegué al cel un gran senyal prodigiós: una dona que tenia el sol per vestit, amb la lluna sota els peus, i duia al cap una corona de dotze estrelles. Esperava un fill i cridava afligida pels dolors del part. També aparegué al cel un altre senyal prodigiós: Un gran drac roig que tenia set caps i deu banyes. Als set caps hi duia set diademes, i la seva cua va arrossegar la tercera part de les estrelles del cel i les llançà a la terra. El drac es va aturar davant la dona que havia d’infantar per devorar-li el fill així que nasqués. La dona va posar al món un fill, un noi que ha de governar totes les nacions amb una vara de ferro. El fill de la dona va ser endut cap a Déu i cap al seu tron, i ella va fugir al desert, on Déu li havia preparat un lloc, perquè l’alimentessin allà mil dos-cents seixanta dies. Aleshores va esclatar una batalla al cel: Miquel i els seus àngels combatien contra el drac. El drac també lluitava juntament amb els seus àngels, però no va poder guanyar, i perderen el lloc que ocupaven al cel. El gran drac, la serp antiga, l’anomenat diable i Satanàs, el qui enganya el món sencer, va ser llançat a la terra, i també els seus àngels hi foren llançats amb ell. Llavors vaig sentir al cel una veu forta que proclamava: Ara és l’hora de la salvació, del poder i del regnat del nostre Déu, i el seu Messies ja governa, perquè l’acusador dels nostres germans, el qui els acusava nit i dia davant el nostre Déu, ha estat expulsat. Ells l’han vençut per la sang de l’Anyell i pel testimoniatge del seu martiri, ja que no van estimar tant la vida que els fes por la mort. Alegreu-vos-en, cel i tots els qui hi habiteu! Ai de la terra i del mar, perquè ha baixat cap a vosaltres el diable, ple de fúria, sabent que el temps se li acaba! Quan el drac es veié llançat a la terra, va perseguir la dona que havia infantat el noi; però la dona va rebre les dues ales de la gran àguila perquè volés fins al desert, al lloc que Déu li havia preparat, on havia de ser alimentada, lluny de la serp, un temps, dos temps i la meitat d’un temps. Llavors la serp va vomitar com una riuada d’aigua darrere la dona perquè el corrent se l’emportés. Però la terra va ajudar la dona: s’obrí i va engolir la riuada que el drac havia vomitat. El drac, ple de ràbia contra la dona, se n’anà a combatre contra la resta dels seus descendents, contra els qui guarden els manaments de Déu i mantenen ferm el testimoni de Jesús.", 4, 1, "p734"], ["Responsori", 4, 1, "p735"], ["Sl 105, 4. 5a. 10", 4, 1, "p736"], ["V. Recordeu-vos de nosaltres, Senyor, visiteu-nos, veniu a salvar-nos. Que puguem veure feliços els vostres elegits. R. Recordeu-vos de nosaltres, Senyor, visiteu-nos, veniu a salvar-nos. Que puguem veure feliços els vostres elegits. V. Els salvà de les mans dels adversaris, els alliberà de les urpes dels enemics. R. Que puguem veure feliços els vostres elegits.", 4, 1, "p737"], ["Segona lectura", 4, 1, "p738"], ["Dels escrits de sant Antoni Maria Claret, bisbe i fundador Autobiografía y Escritos complementarios, Editorial Claretiana, Buenos Aires 2008, nn. 490 i 492-494", 4, 1, "p739"], ["La vostra vara i el vostre bastó em donen confiança", 4, 1, "p740"], ["El dia 16 de juliol del 1849, trobant-nos ja reunits, amb l’aprovació del senyor bisbe i del senyor rector, vam començar els sants exercicis espirituals al Seminari, nosaltres sols, amb tot rigor i fervor. Com que precisament aquest dia 16 és la festa de la Santa Creu i de la Mare de Déu del Carme, per tema de la primera conferència vaig posar aquelles paraules del salm 22: Virga tua et baculus tuus ipsa me consolata sunt (La vostra vara i el vostre bastó em donen confiança) (v. 4). Al·ludint a la devoció i confiança que hem de tenir a la Santa Creu i a Maria Santíssima; aplicant, endemés, tot el salm al nostre propòsit. D’aquells exercicis tots vam sortir-ne molt fervorosos, resolts i determinats a perseverar i, gràcies siguin donades a Déu i a Maria Santíssima, tots han perseverat molt bé. Dos han mort i es troben actualment a la glòria del cel fruint de Déu i del premi dels seus treballs apostòlics i pregant pels seus germans. Oh Déu meu, beneït sigueu per haver-nos dignat a escollir els vostres humils servents per a Fills del Cor Immaculat de la vostra Mare Santíssima! Oh Mare beneïdíssima, mil lloances us siguin donades per la finesa del vostre Cor Immaculat i haver-nos pres per Fills vostres! Feu, Mare meva, que corresponguem a tanta bondat, que cada dia siguem més humils, més fervorosos i més zelosos de la salvació de les ànimes. Jo em dic a mi mateix: Un Fill del Cor Immaculat de Maria és un home encès de caritat que cala foc arreu on passa; que desitja eficaçment i procura per tots els mitjans d’encendre tothom amb el foc de l’amor diví. Res no el fa enrere; frueix en les privacions; aborda els treballs; abraça els sacrificis; es complau en les calúmnies i s’alegra en els turments. Només pensa com seguirà i imitarà Jesucrist a treballar, a sofrir i a procurar sempre i únicament la major glòria de Déu i la salvació de les ànimes.", 4, 1, "p741"], ["Responsori breu", 4, 1, "p742"], ["Sl 79, 15; Sl 15, 5", 4, 1, "p743"], ["V. Gireu des del cel els vostres ulls, veniu i visiteu aquesta vinya. Feu-la robusta i forta, puix és la vostra mà qui l’ha plantada. R. Gireu des del cel els vostres ulls, veniu i visiteu aquesta vinya. Feu-la robusta i forta, puix és la vostra mà qui l’ha plantada. V. Senyor, heretat meva i calze meu. R. Feu-la robusta i forta, puix és la vostra mà qui l’ha plantada.", 4, 1, "p744"], ["Es diu l’himne Te Deum. L’oració, com a Laudes.", 4, 1, "p745"], ["Himne", 4, 2, "p747"], ["Ja de nou apunta el dia", 4, 2, "p748"], ["i desvetlla el nostre anhel", 4, 2, "p749"], ["de lloar santa Maria,", 4, 2, "p750"], ["la Regina del Carmel.", 4, 2, "p751"], ["El temps passa i no detura", 4, 2, "p752"], ["el seu flux en cap moment,", 4, 2, "p753"], ["i la vida que perdura", 4, 2, "p754"], ["és un constant naixement.", 4, 2, "p755"], ["El passat es renovella,", 4, 2, "p756"], ["si la sala que ell enclou,", 4, 2, "p757"], ["pot dar-nos la meravella", 4, 2, "p758"], ["de la vida d’un tany nou.", 4, 2, "p759"], ["Maria ens donà la vida", 4, 2, "p760"], ["amb la sala del seu Cor,", 4, 2, "p761"], ["el qual treu nova florida", 4, 2, "p762"], ["a tot batec de l’Amor.", 4, 2, "p763"], ["Doneu, oh Verge Maria,", 4, 2, "p764"], ["al nostre amor tot l’esplet,", 4, 2, "p765"], ["que va treure quan floria", 4, 2, "p766"], ["al cor d’Antoni Claret.", 4, 2, "p767"], ["Sigui lloança del Pare,", 4, 2, "p768"], ["del Fill i de l’Esperit", 4, 2, "p769"], ["l’amor que infongui la Mare", 4, 2, "p770"], ["i ens abrandi dins el pit.", 4, 2, "p771"], ["O bé", 4, 2, "p772"], ["Mare beneïda, amb els peus descalços, amb el vestit de color de roca i amb la capa com escuma blanca: Verge del Carme. Teniu als braços, amb el vostre fill, tothom. Tothom us cerca amb anhel de nàufrags. Tothom us crida amb clam d’onades: «Mare de gràcia». Els qui avui nasquérem com a Missioners —barqueta fràgil llançada al mar del món— us elevem, amb els rems tensos, cants de joia. Doneu a les nostres quilles singladures noves. Poseu cels nous sobre els nostres pals, i, quan ens assetgin galernes tèrboles, sigueu el nostre port. Honor al Pare i a Jesús per sempre: ells us feren germana i Mare nostra. Glòria a l’Esperit que consuma la seva obra, glòria perenne.", 4, 2, "p773"], ["Salmòdia", 4, 2, "p774"], ["Ant. Sortosa vós, Maria! De vós ens ve la salvació del món. Ara, Mare gloriosa, us alegreu prop del Senyor; pregueu per nosaltres el vostre Fill.", 4, 2, "p775"], ["Salm 62, 2-9", 4, 2, "p776"], ["Vós, Senyor, sou el meu Déu; jo us cerco. Tot jo tinc set de vós, per vós es desviu el meu cor, com terra eixuta, sense una gota d’aigua. Jo us contemplava al vostre santuari quan us veia gloriós i poderós. L’amor que em teniu val més que la vida; per això els meus llavis us lloaran. Que tota la vida us pugui beneir i alçar les mans lloant el vostre nom. Saciat del bo i millor, us lloaré amb el goig als llavis. Quan des del llit us recordo, passo les nits pensant en vós, perquè vós m’heu ajudat, i sóc feliç sota les vostres ales. La meva ànima s’ha enamorat de vós, em sosté la vostra mà.", 4, 2, "p777"], ["Ant. Sortosa vós, Maria! De vós ens ve la salvació del món. Ara, Mare gloriosa, us alegreu prop del Senyor; pregueu per nosaltres el vostre Fill.", 4, 2, "p778"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 2, "p779"], ["Oració sàlmica", 4, 2, "p780"], ["Senyor, alcem les nostres mans per demanar-vos que la nostra Congregació de Missioners, recolzada per la intercessió de la Verge Maria, us glorifiqui sempre per la seva santedat de vida en l’anunci de l’Evangeli. Per Crist Senyor nostre.", 4, 2, "p781"], ["Ant. Vós sou la glòria de Jerusalem, l’alegria d’Israel, l’honor del vostre poble.", 4, 2, "p782"], ["Càntic Dn 3, 57-88.56", 4, 2, "p783"], ["Beneïu el Senyor, totes les criatures, canteu-li lloances per sempre. Beneïu-lo, àngels del Senyor, beneïu, cels, el Senyor. Beneïu el Senyor, aigües de l’espai, beneïu-lo, estols del Senyor. Beneïu el Senyor, sol i lluna, beneïu-lo, estrelles del cel. Beneïu el Senyor, pluges i rosades, beneïu-lo, tots els vents. Beneïu el Senyor, foc i calor, beneïu-lo, freds i gelades. Beneïu el Senyor, rosades i gebre, beneïu-lo, glaç i freds. Beneïu el Senyor, neus i geleres, beneïu-lo, dies i nits. Beneïu el Senyor, llum i tenebres, beneïu-lo, núvols i llamps. Que la terra beneeixi el Senyor, que li canti lloances per sempre. Beneïu el Senyor, muntanyes i turons, vegetació de la terra, beneeix-lo. Beneïu, fonts, el Senyor, beneïu-lo, rius i mars. Beneïu el Senyor, peixos i monstres marins, beneïu-lo, tots els ocells. Beneïu el Senyor, feres i ramats, canteu-li lloances per sempre. Beneïu el Senyor, tots els homes, beneeix-lo, poble d’Israel. Beneïu-lo, sacerdots del Senyor, beneïu-lo, servents del Senyor. Beneïu el Senyor, sants i humils de cor, ànimes i esperits dels justos, beneïu-lo. Beneïu el Senyor, Hananies, Azaries i Misael, canteu-li lloances per sempre. Beneïm el Pare i el Fill amb l’Esperit Sant, cantem-li lloances per sempre. Sou beneït, Senyor, al firmament del cel. Glòria i lloança per sempre.", 4, 2, "p784"], ["Ant. Vós sou la glòria de Jerusalem, l’alegria d’Israel, l’honor del vostre poble.", 4, 2, "p785"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 2, "p786"], ["Oració sàlmica", 4, 2, "p787"], ["Beneït sigueu, Senyor, per haver-vos dignat a escollir els vostres humils servents per a fills de la Verge Maria i per fer-los servidors de la vostra Paraula. Per Crist Senyor nostre.", 4, 2, "p788"], ["A l’acabament d’aquest càntic no es diu Glòria al Pare.", 4, 2, "p789"], ["Ant. Alegreu-vos, Verge Maria. Déu us concedí de portar el Crist salvador.", 4, 2, "p790"], ["Salm 149", 4, 2, "p791"], ["Canteu al Senyor un càntic nou, canteu les seves lloances davant dels qui l’estimen. Se sent feliç Israel del qui l’ha creat, s’alegren del seu rei els fills de Sió. Lloen el seu nom, el lloen tot dansant, acompanyen els seus cants amb els tambors i les cítares. Perquè el Senyor estima el seu poble, coronarà de triomf els humils. Els fidels celebren la seva glòria, des dels seus rengles aclamen plens de goig; mentre els seus llavis glorifiquen Déu, tenen a les mans espases de dos talls, per fer justícia entre els pobles, per reprendre i castigar les nacions, encadenant els seus reis, emmanillant els poderosos. Executar la sentència que està escrita és la glòria reservada als qui l’estimen.", 4, 2, "p792"], ["Ant. Alegreu-vos, Verge Maria. Déu us concedí de portar el Crist salvador.", 4, 2, "p793"], ["Oració sàlmica", 4, 2, "p794"], ["Déu Pare i Salvador nostre, feu-nos participants del goig que inundà el Cor de Maria, Mare i Fundadora de la nostra Congregació, quan exultà per les meravelles que féreu a favor seu i concediu-nos que juntament amb ella celebrem la vostra glòria i entonem plegats un cant joiós. Per Crist Senyor nostre.", 4, 2, "p795"], ["Lectura breu", 4, 2, "p796"], ["Jdt 13, 18-19", 4, 2, "p797"], ["Filla, que el Déu altíssim et beneeixi entre totes les dones de la terra. Beneït sigui el Senyor, creador del cel i de la terra, que guià el teu cop contra el cap del general enemic. Els qui recordin aquesta gesta de Déu mai no perdran la confiança que inspires.", 4, 2, "p798"], ["Responsori breu", 4, 2, "p799"], ["V. El Senyor la va elegir i la va preferir. R. El Senyor la va elegir i la va preferir. V. La va fer viure en el seu tabernacle. R. I la va preferir. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. El Senyor la va elegir i la va preferir.", 4, 2, "p800"], ["Càntic de Zacaries", 4, 2, "p801"], ["Ant. Vaig desitjar la saviesa amb tota l’ànima i cresqué com un raïm que madura.", 4, 2, "p802"], ["Beneït sigui el Senyor, Déu d’Israel, ha visitat el seu poble i l’ha redimit. Fa que s’aixequi un salvador poderós a la casa de David el seu servent, com ho havia anunciat de temps antic, per boca dels seus sants profetes. Així ens salva, alliberant-nos dels enemics, de les mans dels qui ens volen mal, mogut per l’amor que el fa fidel als nostres pares, i pel record de l’Aliança santa, que jurà al nostre pare Abraham, prometent de concedir-nos que, sense por, lliures dels enemics, li donem culte amb santedat i justícia tota la vida. I a tu, infant, et diran profeta de l’Altíssim, perquè aniràs al davant del Senyor a preparar els seus camins. Faràs saber al poble que li ve la salvació, el perdó dels seus pecats, per l’amor entranyable del nostre Déu. Perquè ens estima, ens visitarà un Sol que ve del cel, per il·luminar els qui viuen a la fosca, a les ombres de la mort, i guiar els nostres passos per camins de pau.", 4, 2, "p803"], ["Ant. Vaig desitjar la saviesa amb tota l’ànima i cresqué com un raïm que madura.", 4, 2, "p804"], ["Pregàries", 4, 2, "p805"], ["Aquest dia que, gràcies a la Verge Maria, vam néixer a l’Església com a família reunida en nom del Senyor, presentem al Pare la nostra pregària confiada. Diguem:", 4, 2, "p806"], ["Recordeu-vos, Senyor, de la vostra Congregació.", 4, 2, "p807"], ["Vós que heu enviat al món el vostre Fill nascut de la Verge Maria,", 4, 2, "p808"], ["— feu que siguem fills del seu amor, de nom i de fets.", 4, 2, "p809"], ["Vós que ens heu predestinat a ser una imatge viva del vostre Fill predilecte,", 4, 2, "p810"], ["— feu que Ell visqui en nosaltres, i així us estimem de cor, de paraula i d’obra.", 4, 2, "p811"], ["Vós que vau ungir el vostre Fill amb l’Esperit Sant, perquè proclamés la Bona Nova als pobres,", 4, 2, "p812"], ["— infoneu-nos el vostre Esperit, perquè anunciem l’Evangeli dignament i amb eficàcia.", 4, 2, "p813"], ["Senyor dels sembrats, vós que mogut per la pregària del Fill i de l’Església, hi envieu treballadors,", 4, 2, "p814"], ["— envieu-ne a la nostra Congregació, a fi que us glorifiquem cada dia més amb la nostra vida i apostolat.", 4, 2, "p815"], ["Vós que sou fidel i coneixeu també la nostra feblesa i la nostra inconstància,", 4, 2, "p816"], ["— confirmeu-nos en la vocació, a fi que no parem mai de lloar-vos.", 4, 2, "p817"], ["Es poden afegir intencions particulars, que conclouen amb la resposta indicada més amunt.", 4, 2, "p818"], ["Pare nostre.", 4, 2, "p819"], ["Oració", 4, 2, "p820"], ["Senyor, en venerar la memòria de la benaurada Verge Maria i celebrar l’origen de la nostra família missionera, us preguem que confirmeu els vostres servents en la seva plena consagració i feu fecundes les tasques del nostre apostolat, perquè sempre i en tot siguem fills fidels d’aquesta mateixa Mare. Per nostre Senyor Jesucrist, el vostre Fill, que amb vós viu i regna en la unitat de l’Esperit Sant, Déu, pels segles dels segles. Amén.", 4, 2, "p821"], ["Els salms del dia de la setmana, amb les antífones següents.", 4, 3, "p823"], ["Tèrcia", 4, 3, "p824"], ["Ant. Tots es dedicaven a la pregària en comú, amb Maria, la Mare de Jesús.", 4, 3, "p825"], ["Lectura breu", 4, 3, "p826"], ["So 3, 14. 15", 4, 3, "p827"], ["Alegra’t, filla de Sió; crida de goig, Israel; alegra’t i exulta de tot cor, Jerusalem. El Senyor serà el rei d’Israel enmig teu.", 4, 3, "p828"], ["V. Feliços els qui escolten la paraula de Déu. R. I la guarden.", 4, 3, "p829"], ["L’oració, com a Laudes.", 4, 3, "p830"], ["Sexta", 4, 3, "p831"], ["Ant. La Mare de Jesús els digué: Feu el que ell us indiqui.", 4, 3, "p832"], ["Lectura breu", 4, 3, "p833"], ["Za 9, 9", 4, 3, "p834"], ["Alegra’t, ciutat de Sió. Aclama, ciutat de Jerusalem. El teu rei fa la seva entrada. És bo i salvador, muntat humilment en un ase, en un pollí, fill de somera.", 4, 3, "p835"], ["V. Sortoses les entranyes de la Verge Maria. R. Que van dur el Fill de l’Etern Pare.", 4, 3, "p836"], ["L’oració, com a Laudes.", 4, 3, "p837"], ["Nona", 4, 3, "p838"], ["Ant. El Senyor digué a la seva Mare: «Dona, aquí tens el teu fill». Després digué al deixeble: «Aquí tens la teva mare».", 4, 3, "p839"], ["Lectura breu", 4, 3, "p840"], ["Jdt 14, 7", 4, 3, "p841"], ["Sigues beneïda a totes les terres de Judà i en totes les nacions. Tots els qui sentin el teu nom quedaran meravellats.", 4, 3, "p842"], ["V. Beneïda sou vós entre les dones. R. I beneït és el fruit del vostre ventre.", 4, 3, "p843"], ["L’oració, com a Laudes.", 4, 3, "p844"], ["Himne", 4, 4, "p846"], ["Regina dels alts capcers,", 4, 4, "p847"], ["dels quals el cor sent recança,", 4, 4, "p848"], ["atorgueu-nos-en l’accés,", 4, 4, "p849"], ["en cantar vostra lloança.", 4, 4, "p850"], ["Que la fe sigui com neu", 4, 4, "p851"], ["de congesta mai atesa,", 4, 4, "p852"], ["perquè pugui veure Déu,", 4, 4, "p853"], ["amb l’esguard de sa puresa.", 4, 4, "p854"], ["Que arribi al cim enlairat", 4, 4, "p855"], ["de tot esforç l’esperança,", 4, 4, "p856"], ["amb l’encesa voluntat", 4, 4, "p857"], ["d’atènyer la benaurança.", 4, 4, "p858"], ["Sigui com volcà d’amor", 4, 4, "p859"], ["en un capcer de la serra", 4, 4, "p860"], ["l’incendi que neix del cor,", 4, 4, "p861"], ["tot i romandre a la terra.", 4, 4, "p862"], ["En acostar-se la nit,", 4, 4, "p863"], ["la vostra llum il·lumini", 4, 4, "p864"], ["les foscors de l’esperit,", 4, 4, "p865"], ["perquè la fe no declini.", 4, 4, "p866"], ["Oh Regina del Carmel,", 4, 4, "p867"], ["Senyora santa Maria,", 4, 4, "p868"], ["sigueu sempre el nostre estel,", 4, 4, "p869"], ["quan minva la llum del dia.", 4, 4, "p870"], ["A l’etern Pare infinit,", 4, 4, "p871"], ["que comparteix benaurança", 4, 4, "p872"], ["amb el Fill i l’Esperit,", 4, 4, "p873"], ["sigui dada la lloança. Amén.", 4, 4, "p874"], ["O bé", 4, 4, "p875"], ["Causa de la nostra alegria, salve, Reina de la mar. L’Església que en vós confia es fa a la mar cada dia sense cap més ambició que estimar. Mare de la nostra esperança, mireu a babord i a estribord un món que cap a Déu avança: feu que tot allò que assoleixi ho assoleixi per a l’amor. Tron del perdó més segur, obriu-nos de bat a bat aquest Cor que és port, sempre obert per acollir, tancat per oblidar. Reina misericordiosa, no oblideu mai el vaixell que encallà en platja sorrenca, o s’enfonsà en mar tempestuosa, o salpà sense timoner. Glòria al Pare que us creà, i al Verb que alena amor, i a l’Amor que en vós reféu allò que encisa per sempre el just i el pecador.", 4, 4, "p876"], ["Salmòdia", 4, 4, "p877"], ["Ant. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.", 4, 4, "p878"], ["Salm 121", 4, 4, "p879"], ["Quina alegria quan em van dir: «Anem a la casa del Senyor». Ja han arribat els nostres peus al teu llindar, Jerusalem. Jerusalem, ciutat ben construïda, conjunt harmoniós; és allà que pugen les tribus, les tribus del Senyor, a complir l’aliança d’Israel a lloar el nom del Senyor. Allí hi ha els tribunals de justícia, els tribunals del palau de David. Augureu la pau a Jerusalem: «Que visquin segurs els qui t’estimen, que sigui inviolable la pau dels teus murs, la quietud dels teus merlets». Per amor dels meus germans i amics, deixeu-me dir: «Que hi hagi pau dintre teu». Per la casa del Senyor, el nostre Déu, et desitjo la felicitat.", 4, 4, "p880"], ["Ant. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.", 4, 4, "p881"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 4, "p882"], ["Oració sàlmica", 4, 4, "p883"], ["Senyor, vesseu abundosament la pau sobre nosaltres i conserveu units en el vostre amor tots els qui heu congregat per seguir el camí de perfecció i de servei apostòlic que ens mostrà sant Antoni Maria Claret. Per Crist Senyor nostre.", 4, 4, "p884"], ["Ant. Sóc l’esclava del Senyor: que es compleixin en mi les teves paraules.", 4, 4, "p885"], ["Salm 126", 4, 4, "p886"], ["Si el Senyor no construeix la casa, és inútil l’afany dels constructors. Si el Senyor no guarda la ciutat, és inútil que vigilin els guardes. Es inútil que us lleveu tan de matí, i aneu tan tard a reposar, per menjar el pa que us guanyeu a dures penes. Fins quan dormen, Déu el dóna als seus amics. La millor herència són els fills, do del Senyor, els descendents són la millor recompensa; els fills que heu tingut quan éreu joves són com les fletxes en mans d’un guerrer; feliç l’home que se n’omple el buirac: si discuteix amb algú davant la gent, no haurà de retirar-se avergonyit.", 4, 4, "p887"], ["Ant. Sóc l’esclava del Senyor: que es compleixin en mi les teves paraules.", 4, 4, "p888"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 4, "p889"], ["Oració sàlmica", 4, 4, "p890"], ["Oh Déu, feu que per la intercessió de Maria, la nostra Congregació de Missioners creixi per l’abundància de vocacions i la plena dedicació al ministeri apostòlic. Per Crist Senyor nostre.", 4, 4, "p891"], ["Ant. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre.", 4, 4, "p892"], ["Càntic Ef 1, 3-10", 4, 4, "p893"], ["Beneït sigui el Déu i Pare de nostre Senyor Jesucrist, que ens ha beneït en Crist amb tota mena de benediccions espirituals dalt del cel. Ens elegí en ell abans de crear el món, perquè fóssim sants, irreprensibles als seus ulls. Per amor ens destinà a ser fills seus per Jesucrist, segons la seva benèvola decisió, que dóna lloança a la grandesa dels favors que ens ha concedit en el seu Estimat. En ell, hem estat rescatats amb el preu de la seva sang. Les nostres culpes han estat perdonades. La riquesa dels favors de Déu s’ha desbordat en nosaltres. Ell ens ha concedit tota aquesta saviesa i penetració que tenim. Ens ha fet conèixer el secret de la decisió benèvola que havia pres, per executar-la quan els temps fossin madurs. Ha volgut unir en el Crist tot el món, tant el del cel com el de la terra.", 4, 4, "p894"], ["Ant. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre.", 4, 4, "p895"], ["Després d’un moment de silenci, es pot concloure amb l’oració següent.", 4, 4, "p896"], ["Oració sàlmica", 4, 4, "p897"], ["Ajudeu-nos, Senyor, a treballar en el pla que havíeu projectat realitzar en Crist: feu que, seguint les petjades de sant Antoni Maria Claret, anunciem l’Evangeli als pobres, fins que Crist ho sigui tot en totes les coses. Ell, que viu i regna pels segles dels segles.", 4, 4, "p898"], ["Lectura breu", 4, 4, "p899"], ["Ap 21, 3", 4, 4, "p900"], ["És el tabernacle de Déu amb els homes. Viurà amb ells, ells seran el seu poble i el seu Déu serà «Déu-que-és-amb-ells».", 4, 4, "p901"], ["Responsori breu", 4, 4, "p902"], ["V. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós. R. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós. V. Beneïda sou vós entre les dones i beneït és el fruit del vostre ventre. R. El Senyor és amb vós. V. Glòria al Pare i al Fill i a l’Esperit Sant. R. Déu vós salve, Maria, plena de gràcia; el Senyor és amb vós.", 4, 4, "p903"], ["Càntic de Maria", 4, 4, "p904"], ["Ant. El Senyor beneí Maria i per Ella hem rebut el do de la vocació per a glòria del Pare.", 4, 4, "p905"], ["La meva ànima magnifica el Senyor, el meu esperit celebra el Déu que em salva, perquè ha mirat la petitesa de la seva serventa. Des d’ara totes les generacions em diran benaurada, perquè el Totpoderós obra en mi meravelles. El seu nom és sant, i l’amor que té als qui creuen en ell s’estén de generació en generació. Les obre
