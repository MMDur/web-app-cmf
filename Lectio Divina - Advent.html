  <p>Hermanos: <sup>7</sup>Así pues, hermanos, esperad con paciencia la venida del Señor. Ved cómo el labrador aguarda el fruto precioso de la tierra, esperando con paciencia hasta que recibe las lluvias de otoño y las de primavera. <sup>8</sup>Esperad también vosotros con paciencia; mantened firme vuestro ánimo, porque la venida del Señor está cerca.</p>
  <p><sup>9</sup>No os quejéis los unos de los otros, hermanos, para que no seáis condenados; mirad que el juez está ya a la puerta. <sup>10</sup>Tomad, hermanos, como modelo de sufrimiento y de paciencia a los profetas, que hablaron en nombre del Señor.</p></div>

  <div class="reading"><span class="ref">Evangelio · Mateo 11,2-11</span>
  <p><sup>2</sup>Juan, que había oído hablar en la cárcel de las obras del Mesías, envió a sus discípulos <sup>3</sup>a preguntarle: —¿Eres tú el que tenía que venir, o hemos de esperar a otro?</p>
  <p><sup>4</sup>Jesús les respondió: —Id a contar a Juan lo que estáis viendo y oyendo: <sup>5</sup>los ciegos ven, los cojos andan, los leprosos quedan limpios, los sordos oyen, los muertos resucitan y a los pobres se les anuncia la buena noticia. <sup>6</sup>¡Y dichoso el que no se escandalice de mí!</p>
  <p><sup>7</sup>Cuando se marcharon, Jesús se puso a hablar de Juan a la gente: —¿Qué salisteis a ver en el desierto? ¿Una caña agitada por el viento? <sup>8</sup>¿Qué salisteis a ver? ¿Un hombre lujosamente vestido? Los que visten con lujo están en los palacios de los reyes. <sup>9</sup>¿Qué salisteis entonces a ver? ¿Un profeta? Sí, y más que un profeta.</p>
  <p><sup>10</sup>Éste es de quien está escrito: <i>Yo envío mi mensajero delante de ti; él te preparará el camino.</i> <sup>11</sup>Os aseguro que entre los hijos de mujer no ha habido uno mayor que Juan el Bautista; sin embargo, el más pequeño en el reino de los cielos es mayor que él.</p></div>

  <p class="note">La presente lectura del profeta Isaías presenta una visión totalmente impregnada de gozo. No es necesario indagar el momento histórico en que se pronunció; habla, de hecho, de una transformación que no sólo los oyentes de Isaías, sino los oyentes de todos los tiempos y lugares, pueden interpretar según la propia situación.</p>

  <p class="note">Al comienzo se enuncia el tema: una transformación radical, anunciada con el símbolo de la estepa o desierto convertido en jardín (vv. 1-2a). Se explica a continuación (vv. 2b-4) que dicho cambio radical es posible porque el Señor viene y manifiesta su gloria: «Mirad a vuestro Dios: trae la venganza y el desquite; viene en persona a salvaros». Dios se pone de parte del pobre y se compromete a hacerle justicia (el «desquite») puesto que reconoce el valor de los sufrimientos padecidos y distingue entre el mal y el bien (la «recompensa»), llevando al hombre a la plenitud que ansía: el reconocimiento de su dignidad, la paz interior, la comunión con Dios (la «salvación»). La venida de Dios capacita de nuevo al hombre para la acción (las «manos débiles»), vuelve a poner en marcha a los inseguros (las «rodillas vacilantes») e imprime una nueva personalidad (el «corazón») capaz de decidirse con valentía. Un signo particular de la salvación será la curación de los necesitados (vv. 5-6a). Cualquier categoría desafortunada ya no lo será cuando reconozca a Dios presente.</p>

  <p class="note">Finalmente, el símbolo de la «calzada»: será una calzada llana: la «Vía sacra» que conducirá a los liberados hasta Sión, lugar de la presencia divina (v. 6). Es una promesa válida para siempre (v. 10), la de un Dios que, haciendo verdaderamente libre al hombre, le permite caminar hacia él, encontrar los hermanos en casa, de la que no están excluidos ni «ciegos» ni «cojos» ni «sordos».</p>

  <p class="note">Las presentes líneas de la carta de Santiago constituyen un buen ejemplo de «sabiduría» cristiana, en la que confluyen la tradición judía, de la que Santiago es un hijo ilustre, la enseñanza de Jesús y la reflexión de la Iglesia primitiva.</p>

  <p class="note">Todo lo que Santiago enseña aquí, lo hace a la luz de la «venida del Señor» (repetidas veces). El autor educa a sus destinatarios en una espiritualidad marcada por esta espera: nos prepara a una cita con el Señor. De ahí se desprenden muchos consejos estupendos de los que sólo algunos recoge la lectura de hoy. Sería provechoso ver también lo que sigue, leyendo entero el fragmento bíblico hasta el v. 20.</p>

  <p class="note">El consejo fundamental puesto hoy de relieve es el de la «paciencia» o, mejor todavía, de la «magnanimidad». De hecho sólo puede ser paciente —en el sentido de saber aguantar situaciones difíciles— quien sea magnánimo con una esperanza sólida y fuerte.</p>

  <p class="note">La paciencia, a su vez, se expresa en sus diversos matices: «mirad al labrador», dice Santiago (v. 7). Se pone al agricultor como ejemplo de quien sabe esperar, pero no con una paciencia pasiva: tiene el gusto y el valor de sembrar porque tiene la certeza de que la semilla dará su fruto. En la misma dirección apunta la enseñanza de la paciencia de los profetas, que han hablado en nombre de Dios y han tenido la osadía de hacerlo, aunque el fruto con frecuencia era poco alentador, pero conscientes de que el éxito lo conocía el Señor.</p>

  <p class="note">Un segundo aspecto de la paciencia es el buen uso de la palabra en nuestras relaciones con los demás: el paciente no habla mal de nadie.</p>

  <p class="note">La pregunta del Bautista: «¿Eres tú el que tenía que venir?», que domina la presente página del evangelio de Mateo, no expresa una mera curiosidad religiosa. Juan estaba convencido de que el Mesías iba a inaugurar el Reino de Dios. Llevaba una vida ascética ejemplar llamando a penitencia a sus contemporáneos y fustigó las costumbres de los poderosos hasta ser encarcelado por tal motivo. Desde la prisión, manda a informarse acerca de los fundamentos de la «buena noticia» porque se ha jugado la vida sobre el sentido de lo que ha vivido hasta el presente. Ni siquiera el Bautista es una excepción en la oscuridad de la fe, ni goza desde el principio de una plena comprensión del proyecto de Dios que le puede preservar del escándalo (v. 6).</p>

  <p class="note">Jesús responde indicando lo que está haciendo; sus palabras (anuncia el evangelio a los pobres), sus acciones («Id a contar a Juan lo que estáis viendo y oyendo…»: v. 4), las Escrituras, mediante las cuales se pueden entender sus palabras y acciones (de hecho, espiga unas citas, tomadas la mayor parte de Is 35: «Los ciegos ven…»). Jesús sabe que a alguien que está disponible como el Bautista, el evangelio le habla por sí mismo; él comprenderá que Jesús es el que viene en nombre de Dios. Pero como el Bautista ha anunciado un Mesías un tanto diverso, juez severo, ministro de la ira de Dios, deberá estar dispuesto a rectificar su misma visión de Mesías. También él debe convertirse.</p>

  <p class="note">Mateo reserva al final una palabra dirigida al discípulo de Jesús: el Bautista era grande, pero no era más que un precursor, mientras que el discípulo ha conocido en plenitud el don de Dios, y por eso es más grande que el Bautista (v. 11). Su grandeza no estriba en una mayor estatura ascética y moral, sino en el don de Dios que ahora, en Jesús, se manifiesta plenamente.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Por boca de Isaías, Dios promete un mundo nuevo, construido a partir de los últimos: los desfallecidos cobran ánimo, los ciegos y sordos podrán ver y oír, a los débiles se les ayuda en su camino incierto. ¿Hemos visto alguna vez algo semejante? ¿Quién está en un mar de sufrimientos frente al que nos sentimos impotentes? Además, junto a las enfermedades, prolifera aún más el mal que creamos nosotros con nuestras injusticias. ¿Hay alguien capaz de limpiar la tierra, para convertirla en un mundo de justicia según ese proyecto cantado por Isaías?</p>

  <p>La respuesta de Jesús al Bautista todavía es válida para nosotros hoy: Jesús ya está llevando a cabo este cambio; nos da signos, pero debemos darles crédito, siguiéndole por el camino que ha elegido. El Reino de Dios llega sin ruido (será instaurado definitivamente sobre una cruz), pero si creemos podremos experimentar su fuerza y también nosotros nos comprometeremos en el verdadero cambio del mundo.</p>

  <p>«Dichoso el que no se escandalice de mí»: en concreto viene a ser una llamada a creer. La vida aparentemente sigue como siempre, pero dichoso el que no se escandaliza de la forma «humilde» de la presencia del Mesías, sino que, por el contrario, reconoce en él la verdadera presencia de la acción de Dios que cambia y salva al mundo. El que ha conocido en Jesús la pasión de Dios por el hombre, sabe comprometerse en la caridad, aunque no pueda enjugar todas las lágrimas del mundo, consciente de que sólo Dios puede salvar a la humanidad del mal.</p>

  <p>Nuestra fe, la fe de la comunidad cristiana, se manifestará, según la enseñanza de Santiago, en un conjunto de obras, no vistosas sino preciosas, las obras cotidianas de una comunidad que, convertida a la esperanza, se apasiona por el destino de la humanidad, y aunque sufre por la lentitud, no se encoge de ánimo sino que lo ensancha abriéndolo al proyecto «increíble» de Dios.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«Dichoso quien no se escandalice de mí»: sostén nuestra fe, Señor Jesús, cuando esté a punto de escandalizarse por tu «debilidad». Danos la convicción y la sabiduría que animaba a tu apóstol Santiago: él, que conocía bien las promesas de Isaías, ha creído que tú las has realizado, aunque aparentemente parecía que nada había cambiado en el mundo tras tu paso. Danos también a nosotros la paciencia del agricultor, para sembrar esperanza.</p>

  <p class="prayer">Haz que acojamos con agradecimiento tu evangelio de gozo, la buena noticia a los pobres y enséñanos la paciencia.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>El desierto se alegra y florece: contemplamos la obra de la gracia que transforma la aridez en jardín. Danos, Señor, ojos para ver tu gloria, y pies para caminar por la Vía sacra hacia ti.</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«¡Ánimo! Nuestro Dios viene a salvarnos»</b> (Is 35,4).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>La compasión es fruto de la soledad. Tenemos que admitir lo difícil que es ser compasivo, ya que requiere una actitud de disponibilidad para estar con otros allí donde son débiles, vulnerables, solitarios, rotos. No es nuestra actitud espontánea ante el sufrimiento. Procuramos, ante todo, evitar el sufrimiento huyendo de él o tratando de encontrar una cura inmediata para el mismo. Lo cual significa ante todo hacer algo que demuestre que nuestra presencia es significativa. Olvidamos así nuestro mayor don: la capacidad de solidarizarnos con aquellos que sufren.</p>
  <p>Esta solidaridad compasiva crece en la soledad. En la soledad nos damos cuenta de que nada humano nos es ajeno, de que las raíces de todo conflicto, guerra, injusticia, crueldad, odio, celos y envidia están fuertemente anclados en nuestro corazón. En la soledad, un corazón de piedra puede convertirse en un corazón de carne; un corazón rebelde, en un corazón contrito, y un corazón cerrado puede abrirse a todo aquel que sufre, en un gesto de solidaridad (H. J. M. Nouwen, <i>El camino del corazón</i>, Madrid 1986, 30-31).</p>
  `}
 ]},

{ id:"3d-B", title:"Tercer Domingo de Adviento · Año B", tag:"Tercera semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 61,1-2a.10-11</span>
  <p><sup>1</sup>El Espíritu del Señor está sobre mí, porque me ha ungido el Señor; me ha enviado para dar la buena noticia a los pobres, para vendar los corazones desgarrados, para proclamar la libertad a los cautivos y la liberación a los prisioneros, <sup>2a</sup>para proclamar el año de gracia del Señor.</p>
  <p><sup>10</sup>Desbordo de gozo con el Señor, y me alegro con mi Dios: porque me ha vestido un traje de gala y me ha envuelto en un manto de triunfo, como novio que se pone la corona, o novia que se adorna con sus joyas. <sup>11</sup>Como el suelo echa sus brotes, como un jardín hace brotar sus semillas, así el Señor hará brotar la justicia y los himnos ante todos los pueblos.</p></div>

  <p class="note">Los primeros versículos de este oráculo (vv. 1-2), en los que el profeta habla en primera persona, presentan al profeta como «invadido» por el Espíritu Santo. El efecto de la presencia del Espíritu se manifiesta con dos verbos: «me ha ungido» y «me ha enviado» (v. 1). En primer lugar, la consagración, efecto que le concierne personalmente: es decir, el profeta pertenece a Dios y a su servicio (el verbo es el mismo que luego se utilizará para indicar al «Mesías», el consagrado de Dios). Puesto que pertenece a Dios, pertenece también a los demás; el profeta es un enviado al pueblo con una misión que se define muy detalladamente.</p>

  <p class="note">La frase: «me ha enviado» introduce siete finalidades (la lectura de hoy menciona sólo algunas), de las cuales la primera es un breve resumen: «Para dar la buena noticia a los pobres», a los que tienen en corazón destrozado, a los esclavos, a los prisioneros… El profeta debe anunciar que Dios no se ha olvidado de ellos, sino que se cuida de ellos. Se trata sobre todo de anunciarles: «El año de gracia del Señor», es decir, anunciar el gozo que experimenta Dios al preocuparse de ellos ahora.</p>

  <p class="note">En la segunda parte de la lectura (vv. 10-11) el «yo» del profeta se ensancha para abrazar a toda la comunidad. Ésta se alegra por la misión que le ha sido confiada, la que llevará a la comunidad de Israel a sentirse amada por Dios como esposa y a dejarse revestir de justicia, dejar que YHWH le enseñe a cumplir su voluntad.</p>

  <div class="reading"><span class="ref">Segunda lectura · 1 Tesalonicenses 5,16-24</span>
  <p>Hermanos: <sup>16</sup>Estad siempre alegres. <sup>17</sup>Orad en todo momento. <sup>18</sup>Dad gracias por todo, pues ésta es la voluntad de Dios con respecto a vosotros como cristianos. <sup>19</sup>No apaguéis la fuerza del Espíritu; <sup>20</sup>no menospreciéis los dones proféticos. <sup>21</sup>Examinadlo todo y quedaos con lo bueno. <sup>22</sup>Apartaos de todo tipo de mal.</p>
  <p><sup>23</sup>Que el Dios de la paz os ayude a vivir como corresponde a auténticos creyentes; que todo vuestro ser —espíritu, alma y cuerpo— se conserve irreprochable para la venida de nuestro Señor Jesucristo. <sup>24</sup>Fiel es quien os llama, y él lo cumplirá.</p></div>

  <div class="reading"><span class="ref">Evangelio · Juan 1,6-8.19-28</span>
  <p><sup>6</sup>Vino un hombre, enviado por Dios, que se llamaba Juan. <sup>7</sup>Éste vino como testigo, para dar testimonio de la luz, a fin de que todos creyeran por él. <sup>8</sup>No era él la luz, sino testigo de la luz.</p>
  <p><sup>19</sup>Los judíos de Jerusalén enviaron una comisión de sacerdotes y levitas para preguntar a Juan quién era. <sup>20</sup>Su testimonio fue éste: —Yo no soy el Mesías.</p>
  <p><sup>21</sup>Ellos le preguntaron: —Entonces, ¿qué? ¿Eres tú, acaso, Elías? Juan respondió: —No soy Elías. Volvieron a preguntarle: —¿Eres el profeta que esperamos? Él contestó: —No.</p>
  <p><sup>22</sup>De nuevo insistieron: —Pues, ¿quién eres? Tenemos que dar una respuesta a los que nos han enviado. ¿Qué dices de ti mismo?</p>
  <p><sup>23</sup>Entonces él, aplicándose las palabras del profeta Isaías, se presentó así: <i>Yo soy la voz del que clama en el desierto: allanad el camino del Señor.</i></p>
  <p><sup>24</sup>Algunos miembros de la comisión eran fariseos. <sup>25</sup>Éstos le preguntaron: —Si no eres ni el Mesías, ni Elías, ni el profeta esperado, ¿por qué razón bautizas?</p>
  <p><sup>26</sup>Juan afirmó: —Yo bautizo con agua, pero en medio de vosotros hay uno a quien no conocéis. <sup>27</sup>Él viene detrás de mí, aunque yo no soy digno de desatar la correa de sus sandalias.</p>
  <p><sup>28</sup>Esto ocurrió en Betania, en la otra orilla del Jordán, donde Juan estaba bautizando.</p></div>

  <p class="note">Casi todo el fragmento es una exhortación, a la que sigue un deseo y una certeza final. Frases breves pero eficaces y salpicadas de indicaciones que Pablo desea que se traduzcan inmediatamente en la vida cotidiana de los cristianos.</p>

  <p class="note">Para enseñar a los suyos a vivir como «hijos de la luz» (1 Tes 5,6) que esperan la venida del Señor Jesús (v. 23), Pablo expone en primer lugar cierta doctrina de fondo (vv. 16-18), pasando luego a los consejos para la vida comunitaria (vv. 19-22), para dar una panorámica final de la obra santificadora de Dios en el hombre (vv. 23-24).</p>

  <p class="note">Las exhortaciones de fondo son a la alegría, a la oración, a la acción de gracias, resumidas todas en la «voluntad de Dios» (v. 18), ya que estas actitudes constituyen una tríada connatural al cristiano que busca la voluntad de Dios «siempre, incesantemente, en todo lugar».</p>

  <p class="note">En cuanto a la vida comunitaria, una traducción literal nos hace percibir su carácter «machacón», de urgencia: «No apaguéis la fuerza del Espíritu; no menospreciéis los dones proféticos. Examinadlo todo y quedaos con lo bueno. Apartaos de todo tipo de mal» (vv. 19-22). Como se puede ver, la exhortación principal para una buena vida de comunidad aparece al comienzo: «No apaguéis la fuerza del Espíritu» (v. 19).</p>

  <p class="note">Finalmente el discurso vuelve a la acción de Dios, apareciendo sobre todo como el Dios «fiel», tema favorito en la teología de san Pablo, que se preocupará personalmente de guardar al creyente, no permitiendo que nadie lo sustraiga de su mano.</p>

  <p class="note">La última frase de este fragmento (v. 28) nos indica que Juan desarrolla su ministerio en «Betania, en la otra orilla del Jordán». El significado mismo del nombre del lugar —«casa del testimonio»— puede tener valor simbólico, porque indica exactamente lo que debe llegar a ser toda comunidad: una verdadera casa del testimonio.</p>

  <p class="note">Cualquier página evangélica ilustra en qué consiste concretamente el testimonio. A una «comisión de encuesta» enviada desde Jerusalén para identificar su identidad, el Bautista responde remitiendo a Jesús: «No era él la luz, sino testigo de la luz» (v. 6); y luego: «No lo soy, yo soy la voz» (vv. 21-22). El Bautista, según el evangelio de Juan, no es un predicador o un asceta, sino exactamente el modelo por excelencia del testigo: en la casa de la comunidad cristiana, el comportamiento que debe distinguir a todos es precisamente el suyo. Nadie puede decir: «Yo soy», pero cada uno debe remitir más allá de sí mismo, a Jesucristo. Cada uno puede y debe ser «signo» de Jesús para el otro, manteniendo la capacidad de desaparecer, exactamente como el Bautista. Cada uno es un signo útil, incluso necesario, pero precisamente por ser signo no es algo definitivo.</p>

  <p class="note">Para ser testigos es preciso ser antes oyentes. Poniendo en escena a Juan Bautista que señala a Jesús, el evangelista quiere decir que la verdad está ya presente: «En medio de vosotros hay uno que no conocéis». Esta expresión recuerda el tema veterotestamentario de la sabiduría escondida, que no puede conocerse si ella misma no se manifiesta. Jesús es esta sabiduría que se manifiesta al hombre.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Si la Iglesia es «casa del testimonio», comprendemos que la necesidad de testigos es necesaria cuando se desarrolla un proceso judicial. El evangelio de Juan indica que a lo largo de la historia se lleva a cabo un proceso inmenso en el centro del cual está Jesús —la verdad de Dios— y durante el cual la comunidad de los creyentes es constantemente llamada a estar, como testigo, de parte de Jesús, de parte de Dios, de ese rostro de Dios que Jesús ha dado a conocer. Nuestra comunidad debe hacer visible ese rostro con sus propias obras.</p>

  <p>Bajo este punto de vista es útil volver a la primera lectura, donde el Espíritu Santo que irrumpe en el profeta y, luego, en Jesús se derrama ahora sobre la Iglesia. Pero debe estar atenta a «no apagarlo», como indica san Pablo. El Espíritu reviste a la Iglesia con un «manto de justicia», la capacita para que hable de Dios con las obras, para anunciar la buena noticia a los pobres de hoy día. Capaz de «vendar los corazones desgarrados»: debemos esforzarnos por sanar los corazones con una curación que no tiene nada de milagroso sino que requiere paciencia como herida que sólo cicatriza con el tiempo. Otra de nuestras tareas es «proclamar la libertad de los cautivos y prisioneros», recordando que hay esclavos evidentes y otros latentes, pero no menos graves, por liberar. Finalmente estamos llamados a «proclamar un año de misericordia»: es necesario que comprendamos cómo nuestro tiempo —con frecuencia salpicado por el mal— debe mirarse con respeto y con espíritu de discernimiento como la ocasión de gracia que el Señor nos brinda.</p>

  <p>Con la comitiva del Mesías-esposo revestido de justicia nace en nosotros la solidaridad, el compartir, hace estallar en nosotros ese gozo que no es verdadero si no es compartido. Sabemos bien que nunca estaremos a la altura de este programa de justicia y fraternidad, pero el recurrir continuamente al que es esposo y luz permitirá que la fuerza de la caridad no se debilite en nosotros.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Nos has exhortado al gozo, Señor: «Estad siempre alegres». Más aún, nos has enseñado las palabras para manifestar este gozo: «Desbordo de gozo con el Señor, porque me ha revestido con vestidura de salvación». Haz de mí, Señor, un cristiano alegre: alegre como Juan al ver la luz que ya llega, al sentirse voz al servicio de la Palabra; alegre como el profeta al saberse lleno de tu Espíritu de santidad; alegre como María al reconocer y cantar lo que has hecho por mí y en mí.</p>

  <p class="prayer">Nos has exhortado, Señor, a la oración: «Orad incesantemente». Me parece casi imposible: habituado a separar oración y trabajo, pienso que la oración sólo se puede hacer estando de rodillas. Sin embargo, sé que estás continuamente presente, compartiendo mis días y mi trabajo. Eres tú quien desea santificarme «hasta la perfección», tú quien guías mis pasos inciertos por el sendero de la santidad. Enséñame a vivir constantemente en tu presencia, a hacer todas las cosas por amor tuyo.</p>

  <p class="prayer">Nos has exhortado, Señor, a la acción de gracias: «En toda ocasión dad gracias». En la Eucaristía nos unes a tu acción de gracias. Haz que no me limite a pronunciar palabras de gratitud, quizás gastadas o convencionales, sino a dar gracias al Padre testimoniando su amor, en el servicio concreto al prójimo.</p>

  <p class="prayer">Ven, Espíritu Santo, sé en nosotros gozo, oración, acción de gracias, caridad.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Los mensajeros preguntaron a Juan quién era. ¿Qué responde el príncipe celeste, la estrella matutina, el ángel terrestre, Juan? Dice: «No soy», mientras todos quieren ser o parecer algo.</p>
  <p>Quien lograse sólo tocar este fondo, habría dado con el camino más cercano, más breve, más llano y seguro hacia la verdad más alta y más profunda que se pueda conseguir en el tiempo. Para esto nadie es demasiado viejo, ni demasiado enfermo, ni demasiado pobre, ni demasiado rico. ¡Qué valor inefable se encierra en este «No soy»! Y, sin embargo, nadie quiere emprender este camino, se mire como se mire: en realidad somos y queremos o querríamos siempre ser, siempre encima del otro.</p>
  <p>De aquí provienen todos los llantos y lamentos. Por eso no encontramos paz ni interior ni exterior. Este ser nada proporcionará de todos modos, en todos los lugares, con todos los hombres una paz total, verdadera, esencial, eterna; y será lo más dichoso, seguro y noble del mundo (E. Susone, <i>Opere spirituali. Le prediche</i>, Alba 1971, 584-585).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«El Señor me hace desbordar de gozo, y mi Dios me colma de alegría»</b> (Is 61,10).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Atribuyamos enseguida importancia a esta venida de Cristo al mundo; se trata de un hecho trascendental, colocado como clave normativa e interpretativa de todo el mundo religioso que de ahí se sigue.</p>
  <p>La vocación cristiana es una vocación al gozo esencial para quien la acepta. El cristianismo es fortuna, es plenitud, es felicidad. Podemos decir más: es una felicidad que no se contradice; el cristiano ha sido elegido para una felicidad que no tiene otra fuente más auténtica. El evangelio es una «buena nueva», es un reino en el que no puede faltar la alegría. Un cristiano irremediablemente triste no es auténticamente cristiano. Hemos sido llamados a vivir y a dar testimonio de este clima de vida nueva, alimentado por un gozo trascendente, que el dolor y los sufrimientos de todo orden de nuestra presente existencia no pueden sofocar ni si provocar a una expresión simultánea y victoriosa (Pablo VI, <i>Discurso a la audiencia general del 4 de enero de 1978</i>).</p>
  `}
 ]},

{ id:"3d-C", title:"Tercer Domingo de Adviento · Año C", tag:"Tercera semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Sofonías 3,14-18a</span>
  <p><sup>14</sup>¡Da gritos de alegría, Sión, exulta de júbilo, Israel, alégrate de todo corazón, Jerusalén! <sup>15</sup>El Señor ha anulado la sentencia que pesaba sobre ti, ha barrido a tus enemigos; el Señor es rey de Israel en medio de ti, no tendrás que temer ya ningún mal.</p>
  <p><sup>16</sup>Aquel día dirán a Jerusalén: «No tengas miedo, Sión, que tus brazos no flaqueen; <sup>17</sup>el Señor tu Dios en medio de ti, es un salvador poderoso. Dará saltos de alegría por ti, su amor te renovará, por tu causa danzará y se regocijará, <sup>18a</sup>como en los días de fiesta».</p></div>

  <p class="note">El profeta Sofonías, que precede algunos años al profeta Jeremías, interpreta con estas palabras el deseo de renacer de la ciudad de Jerusalén tras el período del rey Manasés, idólatra y violento. Se trata de un renacer a la vez espiritual y civil. La destinataria de las palabras es la «hija de Sión» o «hija de Jerusalén», que de ambos modos se designa a la misma ciudad de Jerusalén, pero que tal vez aluden también a algo nuevo que va a hacer el Señor.</p>

  <p class="note">En el texto profético se cruzan diversos temas, todos se repiten al menos dos veces, y es que la repetición subraya la urgencia de la exhortación a fiarse de esta palabra de esperanza. La invitación a la alegría da el tono fundamental. El profeta recurre a todos los vocablos posibles para manifestarlo: gozo, alegría, regocijo, fiesta, danza… es ese gozo interior que se manifiesta exteriormente con la participación de toda la comunidad. Pero el aspecto más interesante de este sentimiento es que no sólo se trata de un gozo humano, sino también del de Dios (v. 17: «Él se goza y se complace en ti»). El fragmento se abre con el gozo del pueblo y se cierra con el gozo de Dios.</p>

  <p class="note">El motivo del gozo es la venida de Dios, que, cancelada toda condena, habita ahora en medio de la ciudad como salvador: «El Señor tu Dios en medio de ti» (vv. 15.17). La salvación a su vez se realiza como una renovación en el amor («su amor te renovará»: v. 17). Para Sofonías la salvación está en el reafirmar el amor originario de Dios, en volver a encontrar el amor perdido. Es un amor que expulsa al temor, porque ya no hay motivo para temer cuando Dios manifiesta su amor. Precisamente en este texto se inspirará la escena de la anunciación en Lucas: «Alégrate… El Señor está contigo… No temas…».</p>

  <div class="reading"><span class="ref">Segunda lectura · Filipenses 4,4-7</span>
  <p>Hermanos: <sup>4</sup>Estad siempre alegres en el Señor; os lo repito, estad alegres. <sup>5</sup>Que todo el mundo os conozca por vuestra bondad. El Señor está cerca.</p>
  <p><sup>6</sup>Que nada os angustie; al contrario, en cualquier situación presentad vuestros deseos a Dios orando, suplicando y dando gracias. <sup>7</sup>Y la paz de Dios, que supera todo lo que podemos pensar, custodiará vuestros corazones y vuestros pensamientos en Cristo Jesús.</p></div>

  <p class="note">La invitación a la alegría, como la recomendación a no temer («Que nada os angustie»: v. 6), encuentran, para Pablo, su fundamento en el hecho de que: «El Señor está cerca». «Señor» indica aquí no sólo a Dios, sino a Jesús, porque en él Dios se acerca a la humanidad. La carta a los Filipenses muestra cómo la esperanza del cristiano es diferente de la esperanza del que quiere ser optimista a toda costa. Ésta no se basa en un sentimiento de voluntad personal, en una disposición interior al optimismo, sino en la persona de Jesús, que es garantía de la espera para el futuro. Tres palabras resumen los aspectos personales y comunitarios de la esperanza: gozo, confianza, paz.</p>

  <p class="note">El gozo: brota del hecho de vivir en comunión con Jesús y los demás. El que afirma esto no es un vividor, sino un apóstol que sufre, prisionero, que invita reiteradamente a los filipenses al gozo.</p>

  <p class="note">La confianza: «Que nada os angustie; al contrario, en cualquier situación presentad vuestros deseos a Dios orando, suplicando y dando gracias» (v. 6). Abandonarse en Dios no es indigno del hombre, no es un refugiarse en un mundo irreal, sino que forma parte de la verdadera sabiduría, porque «el Señor protege el camino de los justos» (1 Sm 2,9).</p>

  <p class="note">La paz: resultado de cuanto precede. De las escasas palabras de Pablo se deduce que la paz no es ausencia de preocupaciones, sino fruto del poder de Dios, que guarda el corazón y pensamientos de los creyentes en Cristo Jesús (v. 7), lo cual es muy distinto del simple «no tener pensamientos». La verdadera paz no es superficial, sino que se afianza en el hombre ahí donde decide por sí mismo, en la mente y el corazón, y, de este modo, también sus acciones y relaciones serán acciones y relaciones de paz.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 3,10-18</span>
  <p><sup>10</sup>La gente preguntaba a Juan: —¿Qué debemos hacer? <sup>11</sup>Y les contestaba: —El que tenga dos túnicas, que le dé una al que no tiene ninguna, y el que tenga comida que haga lo mismo.</p>
  <p><sup>12</sup>Vinieron también unos publicanos a bautizarse y le dijeron: —Maestro, ¿qué tenemos que hacer? <sup>13</sup>Él les respondió: —No exijáis nada fuera de lo fijado.</p>
  <p><sup>14</sup>También los soldados le preguntaban: —¿Y nosotros qué tenemos que hacer? Juan les contestó: —No uséis la violencia, no hagáis extorsión a nadie, y contentaos con vuestra paga.</p>
  <p><sup>15</sup>El pueblo estaba a la expectativa y todos se preguntaban si no sería Juan el Mesías. <sup>16</sup>Entonces Juan les dijo: —Yo os bautizo con agua; pero viene el que es más fuerte que yo, a quien no soy digno de desatar la correa de las sandalias. Él os bautizará con Espíritu Santo y fuego. <sup>17</sup>En su mano tiene el bieldo para aventar su parva y recoger el trigo en su granero; pero la paja la quemará en un fuego que no se apaga. <sup>18</sup>Con estas y otras muchas exhortaciones anunciaba al pueblo la buena noticia.</p></div>

  <p class="note">Después del acontecimiento de la Palabra sobre el Bautista que anuncia la salvación (Lc 3,2), Lucas relata los temas éticos de la predicación de Juan en los que precisa los caminos que hay que enderezar y ajustar según los caminos de Dios.</p>

  <p class="note">Se presentan al Bautista diversas categorías de personas. Por tres veces (vv. 10.12.14) la gente pregunta al Bautista: «¿Qué debemos hacer?». En la respuesta no pide cosas desorbitadas, sino que recomienda modos de atención con el otro, respeto a todos en la justicia. El Bautista, hombre del desierto, a quien le pregunta sobre qué debe hacer no le pide imitarle en la vida eremítica o ascética del desierto. Les da unas respuestas para que las realice cada uno en su vida normal, ya que es precisamente en ese ámbito donde todos debemos enderezar los caminos de Dios.</p>

  <p class="note">A algunos interlocutores les sugiere el compromiso del compartir: «El que tenga dos túnicas, que le dé una al que no tiene ninguna» (v. 11). Luego se acercan los publicanos y los soldados, dos categorías «sospechosas». Pero también pueden abrirse a la salvación viviendo una vida honesta y renunciando a algunos fraudes. Cuando venga Jesús, precisamente los publicanos y los soldados (cf. el centurión) serán los testigos de una salvación que se les ofrece sin condiciones previas, salvación recibida gratuitamente, capaz de cambiar la vida.</p>

  <p class="note">Finalmente el evangelista indica que «el pueblo estaba a la expectativa» (v. 15), y se preguntaban si no sería Juan el Cristo. De la pregunta del «hacer» se pasa a la del «Mesías», es decir, a la pregunta de «¿Quién nos puede salvar?». El Bautista remite —más allá de sí mismo— a «aquel que viene», el único que podrá cambiar la vida vieja, quemando la paja y regalando el Espíritu.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La Palabra de Dios me invita a la alegría como nota cualificada de mi testimonio cristiano. «Alegrarse en el Señor»: en el lenguaje cotidiano nunca decimos «alegrarse en una persona», sino más bien «alegrarse con una persona», o «por una persona». La Escritura, sin embargo, me dice: «Alegrarse en el Señor». Estoy llamado a esta singular alegría: puedo alegrarme en cuando vivo unido a otro, al Señor. Mi alegría verdadera sólo brotará de una experiencia de relación, de comunión con el Señor Jesús.</p>

  <p>La alegría arraigada en la esperanza de la venida de Jesús se expresa en la afabilidad con los otros, en la mansedumbre en las relaciones con mis hermanos, en el buscar siempre lo conveniente, lo adaptado a cada situación, en el esfuerzo por lograr la medida justa con cada hermano que encuentro.</p>

  <p>Mi alegría debe manifestarse también en las obras de justicia, en las obras de una vida «salvada». Para poder encontrar hoy paz, el evangelio no me deja sólo con la pregunta: «¿Qué debo hacer?». Quiere ayudarme además a plantearme una pregunta más profunda: «¿A quién debo dar mi corazón? ¿Quién puede decirme una palabra verdadera que suscite y refuerce en mí el querer el bien?». El Bautista, maestro de moral y de justicia, me amonesta a no abandonar esta pregunta y me indica también la respuesta, es decir, me orienta hacia el Único que vale la pena mirar, para apostar por él todo el sentido de mi existencia.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Te miramos a ti, Señor Jesús, aquel que Juan llama «más fuerte»: y tú lo eres porque haces presente y operante la potencia de Dios Padre, para nuestra salvación; lo eres también porque sabes vencer todas nuestras debilidades, todas nuestras resistencias; lo eres porque nos libras del mal y das la paz a nuestro corazón.</p>

  <p class="prayer">Te miramos a ti, Señor Jesús, que bautizas en el Espíritu Santo: tú nos sumerges en la vida misma de Dios, nos comunicas el Espíritu que habita en ti, el Espíritu cuyo fruto es la caridad, el gozo, la paz, la paciencia, la benevolencia, la bondad, la fidelidad, la mansedumbre, el dominio de sí.</p>

  <p class="prayer">Te miramos a ti, Señor Jesús, que vienes a juzgar el mundo. Actúa también hoy con «fuego»: danos a conocer la santidad de Dios, su amor exigente que nos purifica y que es insostenible para nosotros que tenemos la fragilidad de la paja. Mientras, dispersos entre la gente del Jordán, reconocemos nuestro pecado y nuestras ligeras, acércate a nosotros y danos fuerza para volver a Dios.</p>

  <p class="prayer">Te miramos a ti, Señor Jesús: mientras buscamos la alegría en otra parte, te acercas y nos repites: «Tu Dios se alegra y exulta por ti».</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Abriendo nuestros ojos a la luz de Dios, escuchemos atónitos lo que cada día nos advierte la voz divina que clama: «Si hoy escucháis su voz, no endurezcáis vuestros corazones».</p>
  <p>Y, buscándose el Señor un obrero entre la multitud a la que lanza su grito de llamamiento, vuelve a decir: «¿Hay alguien que quiera vivir y desee pasar días prósperos?». Si tú, al oírle, respondes: «Yo», otra vez te dice Dios: «Si quieres gozar de una vida verdadera y perpetua, guarda tu lengua del mal; tus labios de la falsedad; apártate del mal y obra el bien, busca la paz y corre tras ella». Y, cuando cumpláis todo esto, tendré mis ojos fijos sobre vosotros, mis oídos atenderán vuestras súplicas, y antes de que me interroguéis os diré yo: «Aquí estoy». Hermanos amadísimos, ¿puede haber algo más dulce para nosotros que esta voz del Señor, que nos invita? Mirad cómo el Señor, en su bondad, nos indica el camino de la vida.</p>
  <p>Si se considera necesario algo un poco más severo con el fin de corregir los vicios o mantener la caridad, no abandones en seguida, sobrecogido de temor, el camino de la salvación, que forzosamente ha de iniciarse con un comienzo estrecho. Mas, al progresar en la vida monástica y en la fe, ensanchado el corazón por la dulzura de un amor inefable, vuela el alma por el camino de los mandamientos de Dios (Benito de Nursia, <i>Prólogo a la Regla</i>).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Estad siempre alegres en el Señor; os lo repito, estad alegres»</b> (Flp 4,4).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>La alegría es oración. La alegría es fuerza. Es como una red de amor que coge a las almas. Dios ama al que da con alegría. El que da con alegría, da más. No hay mejor manera de manifestar nuestra gratitud a Dios y a los hombres que aceptar todo con alegría. Un corazón ardiente de amor es necesariamente un corazón alegre. No dejéis nunca que la tristeza se apodere de vosotros hasta el punto de olvidar la alegría de Cristo resucitado. Continuad dando Jesús a los demás, no con palabras sino con el ejemplo, por el amor que os une a él, irradiando su santidad y difundiendo su amor profundo, id por todas partes. Que vuestra fuerza no sea otra que la alegría de Jesús. Vivid felices y en paz. Aceptad todo lo que él da y dad todo lo que él toma con una gran sonrisa (Madre Teresa).</p>
  `}
 ]},

{ id:"3-lun", title:"Lunes de la tercera semana", tag:"Tercera semana · Lunes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Números 24,2-7.15-17a</span>
  <p><sup>2</sup>En aquellos días, Balaán levantó los ojos y vio a Israel acampado por tribus, el espíritu de Dios vino sobre él, <sup>3</sup>y pronunció este oráculo:</p>
  <p><i>Oráculo de Balaán, hijo de Beor;<br>oráculo del varón clarividente;<br><sup>4</sup>oráculo del que escucha palabras de Dios,<br>del que ve la visión del Poderoso,<br>y cae en éxtasis con los ojos abiertos.<br>
  <sup>5</sup>¡Qué bellas son tus tiendas, Jacob,<br>y tus moradas, Israel!<br>
  <sup>6</sup>Son como torrentes que se alargan,<br>como jardines junto al río,<br>como áloes plantados por el Señor,<br>como cedros junto a la corriente.<br>
  <sup>7</sup>Los cántaros rebosan de agua,<br>y aguas abundantes riegan su semilla.<br>Su rey es más alto que Agag<br>y su reinado crece en poderío.</i></p>
  <p><sup>15</sup>Y pronunció este oráculo: <i>Oráculo de Balaán, hijo de Beor; oráculo del varón clarividente; <sup>16</sup>oráculo del que escucha palabras de Dios y conoce los designios del Altísimo.</i></p>
  <p><sup>17a</sup>Lo veo, pero no ahora; lo contemplo, pero no de cerca: una estrella sale de Jacob, un cetro surge de Israel.</p></div>

  <p class="note">En una larga y compleja narración acerca del tiempo del camino por el desierto, el libro de los Números cuenta cómo Balaak, rey de Moab, para oponerse al paso de Israel, alquiló a un potente adivino pagano, Balaán, para que soltase sus sortilegios contra Israel y lo maldijera. Éste, sin embargo, en vez de aniquilar al pueblo, como indica su nombre «devorador», es confundido por el Señor y obligado a profetizar en favor de Israel. La presente lectura propone algunos versículos del tercer y cuarto oráculos que pronunció. El primero anuncia la prosperidad y fecundidad de Israel, con la imagen de un campamento enorme de hermosas y ricas tiendas y la de un paisaje con plantas frondosas y abundancia de agua que indican la vitalidad (vv. 5-7). El cuarto añade a los precedentes (vv. 16-17) la descripción de una realeza ideal, que es una visión idealizada de la monarquía davídica, en cuanto destinataria de la promesa divina comunicada por el profeta Natán (cf. 2 Sm 7), y constituye el origen del mesianismo real. Balaán, en sustancia, debe profetizar el gran futuro de Israel, signo concreto de la fidelidad divina a la promesa dada a David.</p>

  <p class="note">«Una estrella sale de Jacob, un cetro surge de Israel» (v. 17). El cetro es claramente símbolo de la realeza; la estrella, sin embargo, hay que vincularla a una idea difusa de la antigüedad: la aparición de un nuevo astro significaría o el nacimiento de un rey o un gran acontecimiento de la historia. Comienza aquí en el Antiguo Testamento el motivo difundido en el mundo judaico intertestamentario de la estrella como símbolo del Mesías, el «hijo de la estrella».</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 21,23-27</span>
  <p><sup>23</sup>Jesús entró en el templo, y mientras enseñaba, se le acercaron los jefes de los sacerdotes y los ancianos del pueblo y le dijeron: —¿Con qué autoridad haces estas cosas? ¿Quién te ha dado esa autoridad?</p>
  <p><sup>24</sup>Jesús les respondió: —También yo os voy a hacer una pregunta. Si me contestáis, os diré con qué autoridad hago esto. <sup>25</sup>El bautismo de Juan, ¿de dónde venía, de Dios o de los hombres?</p>
  <p>Ellos discutían entre sí y comentaban: «Si decimos que de Dios, nos dirá: ¿Por qué no le creísteis? <sup>26</sup>Y si decimos que de los hombres, hay que temer a la gente, porque todos piensan que Juan era un profeta». <sup>27</sup>Así que respondieron a Jesús: —No sabemos. Entonces Jesús les dijo: —Pues tampoco yo os digo con qué autoridad hago estas cosas.</p></div>

  <p class="note">El evangelista muestra a los adversarios de Jesús que protestan, por considerarla pretensión ilegítima, su juicio sobre el templo y la expulsión de los vendedores. Preguntan en nombre de qué autoridad ha actuado de tal modo y sentenciado sobre la relación del pueblo con Dios. Jesús, por su parte, contraataca, pidiéndoles que se decidan en su postura sobre el bautismo de Juan (v. 25), y es que el bautizar había sido la acción más llamativa del Bautista.</p>

  <p class="note">El Nazareno exige una alternativa clara y decidida. A través de la pregunta se ven obligados a hacer una seria reflexión de su propia actitud equivocada frente a Dios. La pregunta de Jesús no es, como podría parecer al lector, una escapatoria táctica, un modo de desplazar el campo de atención evitando así dar una respuesta comprometedora. Se trata más bien de hacer una seria invitación a la conversión; pide tomar partido respecto a la predicación de Juan el Bautista, que había sido precisamente una llamada a la conversión.</p>

  <p class="note">Su predicación ponía a los jefes religiosos en una situación análoga a la deseada por Jesús. Su negativa a responder manifiesta su mala voluntad, su actuar con cálculos políticos de conveniencia (vv. 25-26), olvidando que la primera obligación de los jefes, como de cualquier fiel, es la conversión. De lo contrario Dios puede callar ante el incrédulo, como sugiere la perentoria afirmación final de Jesús: «Pues tampoco yo os digo con qué autoridad hago estas cosas» (v. 27).</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La promesa mesiánica de la primera lectura nos invita a meditar en la fidelidad de Dios, en las promesas y en el poder del Señor que desbarata cualquier poder que se oponga a su proyecto de liberación, ya se trate de fuerzas humanas o suprahumanas. De hecho, en Balaán, obligado a profetizar en favor de Israel, descubro el ejemplo eficaz y alentador del irresistible triunfo del plan de Dios.</p>

  <p>La lectura del evangelio me exige confrontar mis opciones con las exigencias evangélicas, preguntándome si no podré reconocerme a veces en la actitud de los adversarios de Jesús y si su reacción incrédula no será también el retrato de mi condición interior a la no disponibilidad. ¿No soy, tal vez, como los adversarios de Jesús que rechazan la invitación a tomar una decisión responsable frente a Dios? Seré como ellos si no me formo seriamente un juicio personal de fe sobre las vicisitudes de la vida, prefiriendo quedarme en términos de conveniencia y en otras consideraciones. El evangelio desenmascara muchas de mis preocupaciones demasiado humanas, dictadas no por el temor de Dios, sino por el deseo de conservar el poder o, sencillamente porque se cumplan mis apetencias. Mis deseos, si no buscan la voluntad del Señor, tienen la misma consistencia que los proyectos de Balaak y de Balaán confundidos y desbaratados por Dios en un instante.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Como hiciste con Balaán, oh Padre, descorre el velo de nuestros ojos, para que podamos admirar las maravillas que haces en medio de tu pueblo y para que se alegre nuestro corazón con y por tu pueblo, que adquiriste y formaste en tu Hijo.</p>

  <p class="prayer">Como hiciste con Balaán, oh Padre, descorre el velo de nuestros ojos para que podamos acoger en la fe a tu Hijo que viene. Que sea él la estrella que nos guía en el camino y que nos colma de gozo. Que su luz disipe las tinieblas de nuestro corazón, cuando damos vueltas a nuestros cálculos y lógicas que ignoran tu soberanía sobre nosotros. Que su luz ponga en claro la calidad de tantas de nuestras preocupaciones que se mueven no por tu santo temor, sino por el deseo miope de conservar nuestros ridículos tesoros y de que se ejecuten nuestros proyectos.</p>

  <p class="prayer">Ahora, como hiciste antaño con Balaán, obligándole a profetizar en favor de tu pueblo, Padre, ayúdanos a recordar que sólo tus planes tienen éxito y que nada se puede oponer a tu querer soberano.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Lo que les pasa a los que desde la cumbre de una montaña alta miran hacia abajo un mar profundo e insondable, es lo que me pasa a mí cuando bajo los ojos desde la altura de la misteriosa frase del Señor: «Dichosos los limpios de corazón, porque ellos verán a Dios». La promesa de Dios es tan grande que supera los últimos límites de la felicidad. ¿Existe otro bien que se pueda desear? El que ve a Dios ha obtenido todos los bienes, una vida sin ocaso, la bienaventuranza inmortal, un gozo perenne, la verdadera luz, una paz espiritual y dulce, una perpetua alegría. Pero ¿acaso la pureza de corazón no es una de esas virtudes inalcanzables porque supera nuestra naturaleza? Las cosas no son así (…).</p>
  <p>Me parece que Dios desea mostrarse cara a cara al que tenga el ojo del alma bien purificado. Si, por consiguiente, remueves las malezas que han cubierto tu corazón, resplandecerá en ti la belleza divina. Este sublime espectáculo ¿en qué consiste? En la santidad, en la simplicidad y en todos los resplandores radiantes de la naturaleza divina por los cuales se ve a Dios (Gregorio de Nisa, <i>Homilías</i>, 6, passim).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«[Dichoso] el que escucha la Palabra de Dios y conoce la ciencia del Altísimo»</b> (Nm 24,4.16).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>¿De verdad quieres convertirte? ¿Quieres ser transformado? ¿O bien mantienes fuertemente con una mano tus viejos modos, mientras con la otra suplicas a la gente que te ayude a cambiar?</p>
  <p>La conversión es algo que no puedes regalarte a ti mismo. No es cuestión de fuerza de voluntad. Tienes que confiar en la voz interior que te muestra el camino. Conoces esa voz. Te miras en ella a menudo. Pero después de haber oído con claridad lo que se te pide que hagas, empiezas a poner pegas y a buscar la opinión de los demás. De esa forma te ves atrapado en una incontable variedad de opiniones, sentimientos e ideas contradictorios, y pierdes el contacto con Dios que está contigo. Así terminas por depender de las personas que te has buscado para que estén a tu alrededor.</p>
  <p>Sólo con una atención constante a la voz interior te convertirás a una nueva vida libre y gozosa (H. J. M. Nouwen, <i>La voz interior del amor</i>, Madrid 1997, 20).</p>
  `}
 ]},

{ id:"3-mar", title:"Martes de la tercera semana", tag:"Tercera semana · Martes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Sofonías 3,1-2.9-13</span>
  <p>Así dice el Señor: <sup>1</sup>¡Ay de la ciudad rebelde, impura y opresora! <sup>2</sup>No ha escuchado nunca la llamada, no ha aceptado la corrección, jamás ha confiado en el Señor, no ha recurrido a su Dios.</p>
  <p><sup>9</sup>Yo daré entonces a los pueblos labios puros, para que todos invoquen el nombre del Señor y le sirvan todos unidos. <sup>10</sup>Desde el otro lado de los ríos de Etiopía, los que me adoraban y yo dispersé, me traerán sus ofrendas. <sup>11</sup>Aquel día no tendrás que avergonzarte de las perversas acciones con las que te rebelaste contra mí. Extirparé a tus arrogantes fanfarrones de en medio de ti, y no volverás a engreírte en mi monte santo.</p>
  <p><sup>12</sup>Yo dejaré en medio de ti un pueblo humilde y pobre, que buscará refugio en el nombre del Señor. <sup>13</sup>El resto de Israel no cometerá más iniquidad, no dirá más mentiras, ni hablará con falsedad. Se alimentarán y reposarán sin que nadie los inquiete.</p></div>

  <p class="note">El comienzo de este fragmento litúrgico relata una amenaza del Señor contra los jefes de la nación, que buscan sólo su propio interés en vez de dedicarse a la fe del pueblo. Sin embargo, después del juicio aparece una palabra de esperanza, en la que la purificación del pueblo y de Jerusalén mira a la promesa de la alegría mesiánica y la reunión de los dispersos (cf. Sof 3,14-20). El anuncio de la purificación de los pueblos (v. 9) que abandonan el culto a otras divinidades y elevan su profesión de fe al Señor manifiesta la espera profética de una profunda renovación de la humanidad por obra del Señor.</p>

  <p class="note">Esta renovación consiste en la conversión del corazón humano, que se traduce en acoger la ley divina, en el culto al Dios verdadero. Es una transformación antropológica que afecta sobre todo al pueblo de Dios, en el que desaparece todo rastro de soberbia, como síntesis del pecado humano, de un orgullo que tiende a ocupar el puesto de Dios (v. 11). El pueblo del tiempo de la salvación al que se promete el descanso y la paz es un «resto» (v. 13), es decir, un grupo políticamente frágil y culturalmente irrelevante y despreciado, que no puede precisamente presumir de sus propias fuerzas, sino que experimenta con gratitud la fidelidad de su Dios. Está constituido por los «pobres del Señor» (v. 12), o sea, los que tienen a Dios como único recurso de su propia vida y confían plenamente en él traduciendo su humilde confianza en una obediencia práctica de la voluntad divina.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 21,28-32</span>
  <p><sup>28</sup>En aquel tiempo, dijo Jesús a los sumos sacerdotes y a los ancianos del pueblo: —¿Qué os parece? Un hombre tenía dos hijos. Se acercó al primero y le dijo: «Anda, hijo, ve a trabajar hoy en la viña». <sup>29</sup>El respondió: «No quiero». Pero después se arrepintió y fue. <sup>30</sup>Luego se acercó al segundo y le dijo lo mismo. Él respondió: «Voy, señor». Pero no fue. <sup>31</sup>¿Cuál de los dos cumplió la voluntad de su padre? Le contestaron: —El primero.</p>
  <p>Entonces Jesús les dijo: —Os aseguro que los publicanos y las prostitutas entrarán antes que vosotros en el reino de Dios. <sup>32</sup>Porque vino Juan a mostraros el camino de la salvación y no le creísteis; en cambio los publicanos y las prostitutas le creyeron. Y vosotros, a pesar de verlo, no os arrepentisteis ni creísteis en él.</p></div>

  <p class="note">Los jefes del pueblo, que en el contexto precedente aparecían como interlocutores malévolos de Jesús (cf. Mt 21,23-27), no tienen intención de escucharle. Jesús pone al desnudo su incoherencia y los provoca con la perspectiva de una ventaja religiosa de los publicanos y prostitutas con respecto a ellos. Y lo hace con la parábola de los dos hijos distintos, que se aclara teniendo como trasfondo, aceptado tanto por el Bautista como por Jesús, la tradición veterotestamentaria sobre la necesidad de la «justicia», esto es, de una fe que busca llevar a la práctica fielmente la voluntad de Dios en el día a día.</p>

  <p class="note">La parábola no exalta a los pecadores y desprecia a los devotos, como puede parecer basándonos en ciertas lecturas sesgadas, sino que anuncia la extraordinaria cercanía de Dios al pecador, al que ofrece siempre un cambio de vida. También aparece la denuncia de la frecuente incoherencia de tantos creyentes, ejemplarizados en el primer hijo, cumplidores sólo de boquilla. La confrontación llamativa entre publicanos y prostitutas y los hombres de religión (vv. 31-32) no es tanto una condena de estos últimos por parte de Jesús, cuanto una última llamada apremiante a la conversión.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La parábola de los dos hijos es una severa admonición para mí si, como el primer hijo, respondo afirmativamente, pero luego no voy a trabajar a la viña. Debo hoy poner sobre el tapete mis incoherencias y la obediencia meramente formal, cuando antepongo a las exigencias del evangelio mi pequeño «yo». El riesgo no es sólo el no cumplimiento, sino también el reducir mi justicia moral y religiosa a una imagen de fachada, mientras mi corazón olvida la amorosa inquietud de la búsqueda sincera de la voluntad de Dios.</p>

  <p>Resulta por tanto importante la contemplación del paradójico estilo de nuestro Dios, que llama a la conversión incluso a los más lejanos y derrama sus bendiciones a los pobres, a los que sólo confían en él sin poder presumir de sí mismos ni de sus méritos. La parábola evangélica de los dos hijos diversos me interpela sobre la suma importancia de la humildad como cualidad necesaria de la fe que da acceso al reino de Dios. Y, por otra parte, esta dura palabra evangélica me llena también el corazón de gratitud, recordándome que Dios ama a los que no se apoyan en sus propios méritos, sino que, confiando sólo en su misericordia y su fidelidad, están dispuestos a cambiar realmente de vida.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Tu Palabra hoy nos fustiga y nos consuela. Nos fustiga porque cuando nos invitas a trabajar en tu viña, como el hijo mayor de la parábola, con frecuencia respondemos: «Sí, Señor»; pero luego no vamos. Estamos demasiado ocupados y preocupados por nuestro «yo» para estar de veras disponibles a buscar sinceramente tu voluntad. Socórrenos con tu Espíritu, para que podamos velar sobre nosotros mismos con el fin de que nuestra vida no sea una farsa, sino una respuesta sincera a tu llamada.</p>

  <p class="prayer">Nos consuela, porque tu misericordia acoge a los publicanos y a las prostitutas, a los que se arrepienten y creen. Danos la humildad de reconocer nuestros pecados y la confianza de sabernos amados por ti, que no te cansas de esperar nuestra conversión.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Dios no se complace en la muerte del pecador, sino en que se convierta y viva. Su mirada sobre nosotros no es de condena, sino de esperanza. Él nos espera siempre, como el padre que aguarda el retorno del hijo perdido.</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Vino Juan a mostraros el camino de la salvación»</b> (Mt 21,32).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>El pueblo mesiánico, aunque no incluya a todos los hombres actualmente y con frecuencia parezca una grey pequeña, es, sin embargo, para todo el género humano, un germen segurísimo de unidad, de esperanza y de salvación. Cristo, que lo instituyó para ser comunión de vida, de caridad y de verdad, se sirve también de él como de instrumento de redención universal y lo envía a todo el universo como luz del mundo y sal de la tierra (cf. Mt 5,13-16).</p>
  <p>Así como el pueblo de Israel, según la carne, peregrinando por el desierto, se le designa ya como Iglesia (2 Esd 13,1; Nm 20,4; Dt 23,1ss), así el nuevo Israel, que caminando en el tiempo presente busca la ciudad futura y perenne (cf. Heb 13,14), también es designado como Iglesia de Cristo (cf. Mt 16,18), porque fue El quien la adquirió con su sangre (cf. Hch 20,28), la llenó de su Espíritu y la dotó de los medios apropiados de unión visible y social. Dios formó una congregación de quienes, creyendo, ven en Jesús el autor de la salvación y el principio de la unidad y de la paz, y la constituyó Iglesia a fin de que fuera para todos y cada uno el sacramento visible de esta unidad salutífera. Debiendo difundirse en todo el mundo, entra, por consiguiente, en la historia de la humanidad, si bien trasciende los tiempos y las fronteras de los pueblos. Caminando, pues, la Iglesia en medio de tentaciones y tribulaciones, se ve confortada con el poder de la gracia de Dios, que le ha sido prometida para que no desfallezca de la fidelidad perfecta por la debilidad de la carne, antes, al contrario, persevere como esposa digna de su Señor y, bajo la acción del Espíritu Santo, no cese de renovarse hasta que por la cruz llegue a aquella luz que no conoce ocaso (LG, 9).</p>
  `}
 ]},

{ id:"3-mie", title:"Miércoles de la tercera semana", tag:"Tercera semana · Miércoles",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 45,6b-8.18.21b-25</span>
  <p><sup>6b</sup>Yo soy el Señor, y no hay otro. <sup>7</sup>Yo formo la luz y creo las tinieblas, construyo la paz y creo las desdichas. Yo, el Señor, hago todo esto. <sup>8</sup>Cielos, destilad el rocío; nubes, lloved la liberación; que la tierra se abra, que brote la salvación, y junto con ella germine la justicia. Yo, el Señor, lo he creado.</p>
  <p><sup>18</sup>Así dice el Señor, creador del cielo —él es Dios—, él modeló la tierra, la fabricó y la afianzó; no la creó vacía, sino que la formó habitable: «Yo soy el Señor, y no hay otro». No hay otro Dios fuera de mí.</p>
  <p><sup>21b</sup>Yo soy un Dios justo y salvador, y no existe ningún otro. <sup>22</sup>Volveos a mí y os salvaréis, confines de la tierra, pues yo soy Dios y no hay otro.</p>
  <p><sup>23</sup>Por mí mismo lo juro, de mi boca sale una sentencia, una palabra irrevocable: «Ante mí se doblará toda rodilla, por mí jurará toda lengua». <sup>24</sup>Dirán: «La salvación y el poder vienen sólo del Señor». Quedarán en ridículo todos los que se enfrentaban a él. <sup>25</sup>Con el Señor triunfará y será grande toda la estirpe de Israel.</p></div>

  <p class="note">Las palabras del profeta dirigidas a Ciro son un himno a Dios que, a través de su Ungido, ejecuta la salvación (cf. Is 45,1). Se afirma decididamente que sólo el Dios de Israel es el Señor, porque hace todo (luz y tinieblas; salvación y desgracia) y es el creador, es decir, su acción es el origen de todo «radicalmente nuevo», desde el primero al último día. En todo el fragmento aparece una expresión singular: «Yo soy YHWH» (cf. vv. 5.6.14.18.22), que es un modo de afirmar la unicidad de Dios, su poder y su señorío absoluto sobre la historia del hombre.</p>

  <p class="note">Su poder se manifiesta en la creación del mundo, realidad vacía y sin sentido pero con el fin positivo y altísimo de ser la morada de la humanidad (v. 18). Pero el culmen de su señorío se manifiesta más en su querer y poder salvar a la humanidad (vv. 21-22) y en suscitar en la búsqueda sincera de la justicia y el bien (v. 8). Así se revela como «Dios justo» (v. 21), es decir, capaz de instaurar una relación de comunión y de alianza, y por consiguiente es «Dios salvador».</p>

  <p class="note">Sobre todas las cosas, mundo y humanidad, Dios domina soberano y nada puede oponerse a su voluntad: el actuar divino en favor de los fieles, aun siendo misterioso e imprevisible, está patente a los ojos de todos y manifiesta su incomparabilidad y unicidad. Éste es el Dios que Israel, como pueblo de Dios, debe dar a conocer a los demás pueblos.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 7,19-23</span>
  <p><sup>19</sup>En aquel tiempo, Juan envió a dos de sus discípulos a preguntar al Señor: —¿Eres tú el que tenía que venir o hemos de esperar a otro? <sup>20</sup>Ellos se presentaron a Jesús y le dijeron: —Juan el Bautista nos envía a preguntarte: ¿Eres tú el que tenía que venir o hemos de esperar a otro?</p>
  <p><sup>21</sup>En aquel momento, Jesús curó a muchos de sus enfermedades, dolencias y malos espíritus, y devolvió la vista a muchos ciegos. <sup>22</sup>Después les respondió: —Id y contad a Juan lo que habéis visto y oído: los ciegos ven, los cojos andan, los leprosos quedan limpios, los sordos oyen, los muertos resucitan y a los pobres se les anuncia la buena noticia; <sup>23</sup>y dichoso el que no encuentre en mí motivo de tropiezo.</p></div>

  <p class="note">Lucas, presentando al Bautista, nos muestra la figura de un creyente que ha optado vivir por Dios en cada instante. Él se ha unido a su Dios siempre, lo ha sentido increíblemente cercano y creyó reconocerlo en un misterioso hombre de Galilea, venido a bautizarse por él en el Jordán: Jesús de Nazaret (cf. 3,16-17).</p>

  <p class="note">Pero en su soledad y oscuridad de la prisión herodiana, un enorme temor le llena de tristeza: ¿Acaso se equivocó respecto al que señaló como cordero de Dios? A pesar de todo, la fe de Juan es mayor que su duda. Así, en vez de poner en tela de juicio su espera, manda una embajada a Jesús, pidiendo luz y ayuda para comprender. Juan se reduce más a lo esencial, se hace más pobre si cabe, preguntándose simplemente: «¿Eres tú el que ha de venir, o tenemos que esperar a otro?» (v. 19).</p>

  <p class="note">Y Jesús responde a la pregunta de Juan, indicando lo que hace ante los ojos de los enviados por el Bautista (v. 21). Pero no son sencillamente los milagros los que responden en su favor remitiéndose a los textos bíblicos del Antiguo Testamento, sino también el hecho de que en sus obras se descubren los signos del comienzo de una humanidad nueva, que sabe acoger la Palabra de Dios, ver sus maravillas y caminar por sus sendas: «Los ciegos ven…».</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La palabra evangélica me presenta hoy al Bautista como testigo de Cristo con su vida. En Juan se me presenta la figura del verdadero pobre declarado dichoso por Jesús, el creyente que camina en la paciencia y sabe corregir las propias apreciaciones de la espera según el estilo imprevisible del venir de Dios. Por esta razón, puede ahondar en su propia esperanza hasta el testimonio supremo.</p>

  <p>De la figura evangélica del Bautista también aprendo que la fe más fuerte y sincera puede coexistir con la duda y que sólo hay un modo para vencer esta duda que atenaza el corazón. Juan me recuerda que sólo puedo superar la prueba con la oración: renunciando a poner en tela de juicio la promesa de Dios y revisando mis limitados modos de comprender la promesa divina y de esperar su cumplimiento, ahí es donde encuentro la paz.</p>

  <p>A esa fe que invoca, Dios responderá regalándome un nuevo modo de ver las cosas que me permite contemplar los signos de su amor en mi vida y los signos de esa humanidad nueva que sigue creando todavía hoy. Descubro así la verdad de la palabra del profeta Isaías, según el cual, más allá de los aparentes desmentidos de la historia, el Señor puede y quiere salvar a su pueblo, aun cuando su actuación no deja de ser en gran parte misteriosa y refractaria a toda comparación con las soluciones humanas para tales problemas.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«Cielos, destilad el rocío; nubes, lloved la liberación; ábrase la tierra y brote la salvación». Con el profeta Isaías te invocamos en estos días que preparan el nacimiento de tu Hijo, en los que el cielo y la tierra se encuentran y tu divinidad se une a nuestra humanidad para realizar el admirable intercambio: Dios se hace hijo del hombre, para hacernos a los hombres sus hijos.</p>

  <p class="prayer">Esta certeza de fe no impide que broten en mi corazón dudas y temores. A veces llego a pensar que mi vida sea un camino infinito, sin final. Lo único que me queda es ser yo mismo y dirigirte, Señor, con todo mi ser, una plegaria, pues sólo en ti está la victoria y el poder.</p>

  <p class="prayer">Como el Bautista me dirijo a ti, para que tu luz me ayude a contemplar los signos de la nueva humanidad que estás creando ya ahora en nuestro mundo.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Dios y Señor mío: atiende a mi corazón y escuche tu misericordia mi deseo, porque no sólo me abrasa en orden a mí, sino también en orden a servir a la caridad fraterna; y que así es, lo ves tú en mi corazón. Dame lo que debo ofrecer porque soy un mendigo necesitado, tú eres «rico con los que te invocan». Tú, libre de toda necesidad, y que seguro cuidas de nosotros.</p>
  <p>Señor, Dios mío, luz de los ciegos y fortaleza de los débiles y también luz de los que ven y fortaleza de los fuertes, atiende a mi alma. Porque si no estuviesen aún en lo profundo tus oídos, ¿adónde iríamos, adónde clamaríamos? Si llamo a la puerta, no la cierres. Enciende mi amor, porque ya amo y esto es don tuyo. No abandones tus dones ni desprecies a tu hierba sedienta. Te conjuro por nuestro Señor Jesucristo, por medio del cual has venido en mi búsqueda; yo que no te buscaba y me has encontrado.</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Cielos, destilad el rocío; nubes, lloved la liberación»</b> (Is 45,8).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>En el Tiempo de adviento debe movernos una pregunta, la pregunta sobre el que debe venir. ¿Qué significa esta pregunta? ¿Qué se entiende por «el que ha de venir»?</p>
  <p>En tiempos del Bautista y de Jesús en todos los corazones del pueblo hebreo estaba muy viva la pregunta sobre el que debía venir y la esperanza en él. Se trata de la esperanza del Mesías, el rey del dichoso fin de los tiempos, que vendrá a poner fin a toda miseria e injusticia en la tierra y a inaugurar el señorío de Dios, señorío de justicia y salvación. Esta esperanza nació de las palabras de los antiguos profetas, cuidadosamente recogidas en la Escritura, y había penetrado en los corazones anhelantes. De tal esperanza nace a su vez la pregunta: ¿Cuándo vendrá el esperado? ¿Quién será? «Centinela, ¿cuánto queda de la noche?» (Is 21,11).</p>
  <p>En base a esta esperanza se le hace a Jesús la pregunta: ¿Eres tú aquél? La pregunta brota de tal esperanza. Y sólo la podremos plantear si esa esperanza sigue viva en nosotros. La pregunta carece de sentido para los satisfechos de que el mundo sea como es. Sea porque para ésos el mundo constituye el lugar donde disfrutar de la vida, sin hacer caso de las sombras que lo invaden, ateniéndose sólo a la luz, despreocupando la mente de todo y acogiendo la alegría como llega, día a día. Sea que para ésos el mundo constituya el lugar de la lucha y la fatiga, en que el hombre, los hombres crean en comunidad sus obras, las cuales recompensan por la dedicación y el sacrificio que cuestan y hacen la vida aceptable (R. Bultmann, <i>Prediche di Marburg</i>, Brescia 1973, 213-214).</p>
  `}
 ]},

{ id:"3-jue", title:"Jueves de la tercera semana", tag:"Tercera semana · Jueves",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 54,1-10</span>
  <p><sup>1</sup>Canta de alegría, estéril, tú que no dabas a luz; rompe a cantar de júbilo, tú que no conocías los dolores de parto, porque serán más los hijos de la abandonada que los hijos de la casada, dice el Señor. <sup>2</sup>Ensancha el espacio de tu tienda, despliega tus toldos sin miedo, hinca tus estacas y alarga tus cuerdas, <sup>3</sup>porque te extenderás a derecha e izquierda; tu descendencia heredará naciones y poblará ciudades desiertas.</p>
  <p><sup>4</sup>No temas, no quedarás en ridículo; nadie te afrentará ni te sonrojará. Olvidarás la vergüenza de tu soltería, dejarás de recordar el oprobio de tu viudez; <sup>5</sup>pues tu esposo es tu Creador, su nombre es el Señor todopoderoso; tu libertador es el Santo de Israel —se llama Dios de toda la tierra—.</p>
  <p><sup>6</sup>El Señor te vuelve a llamar como a mujer abandonada y abatida. ¿Podrá ser repudiada la esposa de juventud? Esto dice tu Dios: <sup>7</sup>Por un breve instante te abandoné, pero ahora te acojo con inmenso cariño. <sup>8</sup>En un arrebato de ira te oculté mi rostro por un momento, pero mi amor por ti es eterno —dice el Señor, tu libertador—.</p>
  <p><sup>9</sup>Me sucede como en tiempos de Noé, cuando juré que las aguas del diluvio no volverían a anegar la tierra; ahora juro no volver a irritarme contra ti, ni amenazarte nunca más. <sup>10</sup>Aunque los montes cambien de lugar, y se desmoronen las colinas, no cambiará mi amor por ti, ni se desmoronará mi alianza de paz, dice el Señor, que está enamorado de ti.</p></div>

  <p class="note">En la presente profecía Isaías presenta a Sión, es decir, la comunidad engendrada por la muerte del Siervo del Señor (Is 53), que es la que experimenta la renovación de la alianza, el reflorecer un amor conyugal y el alegrarse de una íntima, amorosa relación que une a Dios con su pueblo redimido.</p>

  <p class="note">El profeta repasa la historia del pueblo elegido, sirviéndose del simbolismo del amor esponsal entre Dios y Sión. Así el destierro se parangona con la viudez o repudio (v. 4), y la tragedia que había convulsionado a los habitantes de Jerusalén se presenta como la triste condición de esterilidad de una mujer ansiosa de tener numerosos hijos (v. 1). Pero el Señor cambia la suerte de su pueblo y así Jerusalén, con la vuelta de los desterrados y la repoblación de la ciudad, puede experimentar sensiblemente la vitalidad de un amor que parecía irremediablemente acabado. La nueva milagrosa fecundidad será signo de la bendición del esposo divino que, en realidad, nunca rechazó la propia esposa, aunque en los momentos dolorosos y sombríos afrontados por el pueblo hizo pensar a Sión que estaba olvidada y hasta castigada por el mismo Dios. Como, tras el diluvio, Dios se comprometió con Noé en una alianza eterna (cf. Gn 9,9ss), ahora al pueblo de los desterrados les promete una alianza incondicional, eterna, porque no se basa en posibles infidelidades de Sión, sino en el indefectible amor divino (vv. 9-10).</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 7,24-30</span>
  <p><sup>24</sup>Cuando los mensajeros se fueron, Jesús se puso a hablar de Juan a la gente: —¿Qué salisteis a ver en el desierto? ¿Una caña agitada por el viento? <sup>25</sup>¿Qué salisteis a ver? ¿Un hombre lujosamente vestido? Los que visten con lujo y se dan buena vida están en los palacios de los reyes. <sup>26</sup>¿Qué salisteis entonces a ver? ¿Un profeta? Sí, incluso más que un profeta.</p>
  <p><sup>27</sup>Éste es de quien está escrito: <i>Yo envío mi mensajero delante de ti; él te preparará el camino.</i> <sup>28</sup>Os digo que entre los nacidos de mujer no hay otro mayor que Juan; sin embargo, el más pequeño en el reino de Dios es mayor que él.</p>
  <p><sup>29</sup>Todos los que escucharon a Juan, incluidos los publicanos, acogieron la oferta de Dios y recibieron su bautismo, <sup>30</sup>pero los fariseos y los doctores de la ley frustraron el plan de Dios para con ellos y rechazaron el bautismo de Juan.</p></div>

  <p class="note">Cuando se marcharon los mensajeros de Juan, Jesús comienza a hablar del Bautista a la gente, haciendo preguntas para suscitar el asentimiento de los oyentes. Quiere llevarles a que reconozcan en Juan no sólo un profeta, sino sobre todo el que ha abierto camino a Cristo. Juan es el profeta auténtico que busca a Dios en el desierto, en la penitencia, con fe firme, no vacilante y ajena a cualquier compromiso con el mundo del poder, del aparentar (vv. 24-25). Y, sin embargo, esta interpretación de la figura de Juan, como profeta que ha dedicado toda su vida a la causa de Dios, no llega al nivel más profundo del significado de su misión. Jesús indica.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La lectura de Isaías nos lleva a meditar en el amor esponsal del Señor y en el papel positivo que la prueba puede asumir en el camino de la fe. Se nos invita a reconocernos en la figura femenina de Sión, que si bien se sentía «abandonada y con el ánimo afligido», ahora experimenta la alegría de sentirse amada por un esposo fiel, que no repudia a la compañera de la juventud, sino que la ama con mayor ternura. Una vez más debemos reconocer que la prueba de la fe nos abre a una acogida de comunión más profunda, simbolizada en la unión de hombre y mujer, y a una confianza más arraigada en la fidelidad divina.</p>

  <p>La lectura evangélica, por su parte, nos estimula al testimonio, por medio de la meditación de la figura de Juan, testigo de Cristo. La firmeza de su persona apunta a la cualidad que requiere nuestro testimonio, que exige fortaleza, valentía y perseverancia.</p>

  <p>Finalmente, la condena última de Jesús, dirigida a los que hacen vanos los designios de Dios (Lc 7,30), es un serio aviso para nosotros.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«Por un breve instante te abandoné, pero ahora te acojo con inmenso cariño. En un arrebato de ira te oculté mi rostro por un momento, pero mi amor por ti es eterno —dice el Señor, tu libertador—» (Is 54,7-8).</p>

  <p class="prayer">Hoy, Señor, quiero cantar tu fidelidad, tu amor invencible, tu ternura ilimitada. Tú eres el Dios cercano, cuyos caminos son todos verdad, tú el esposo de Sión, tú el redentor de Israel. Tú te has inclinado a nuestra pobreza y nos has enriquecido de ti, has bajado a nuestro pecado y nos has curado, has alejado nuestro sonrojo y nos has revestido de ti mismo.</p>

  <p class="prayer">Tú nos has abierto las puertas del Reino en el que el más pequeño es inmensamente grande porque es tu hijo, por el que tu mismo Hijo unigénito se ha hecho hombre y ha muerto en cruz.</p>

  <p class="prayer">Tú por nosotros has rasgado el cielo y en la plenitud de los tiempos nos has enviado a tu Hijo, que se ha constituido en nuestro compañero de viaje, nuestro hermano y nuestro Señor.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>En el hombre todo era luminoso, sin tinieblas; hermoso, sin fealdad; puro, sin mancilla… Pero ¡oh desgracia sin igual! Ese vaso del todo divino se quiebra en mil pedazos; esta hermosa estrella cae; este hermoso sol se cubre de lodo; el hombre peca, y pecando, pierde la inocencia, la hermosura y la inmortalidad. En fin, pierde todos los bienes recibidos y se ve asaltado por una infinidad de males.</p>
  <p>La Sabiduría eterna conmuévese vivamente ante la desgracia del pobre Adán y de toda su posteridad. Contempla con suma pena el vaso de honor hecho pedazos, rasgado su retrato, aniquilada su obra maestra. Queriendo salvar al hombre desventurado, a quien se sentía inclinada a amar, halló un remedio admirable.</p>
  <p>¡Proceder asombroso, amor incomprensible llevado hasta el exceso! Su ofrecimiento es aceptado; su consejo, tomado y decretado: el Hijo de Dios se hará hombre en el momento conveniente y en las circunstancias de antemano señaladas. La Sabiduría eterna, durante todo el tiempo que transcurrió antes de su encarnación, testimonió de mil maneras a los hombres el amor que les profesaba. Ella misma se ha difundido por diversas naciones, en las almas santas, para formar en ellas amigos de Dios y profetas (Luis María Grignion de Montfort, <i>El amor de la Sabiduría eterna</i>, Madrid 1954, 38-47, passim).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Mi amor por ti es eterno, dice el Señor»</b> (Is 54,8).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>¿Pertenecemos al grupo de los que sufren por este mundo? ¿De los que miran más allá de lo visible, hacia lo invisible? ¿Pertenecemos a los que esperan, aguardan al que debe venir? Éstas son las preguntas del adviento. Si somos de éstos, nuestra pregunta, como la del Bautista, se dirige a Jesús: «¿Eres tú el que ha de venir?». ¿Es de verdad él, el que trae consigo el reino de la paz? Si fuese él ya se debería haber efectuado. Si es él quien debe venir, ya ha existido desde hace más de 1.900 años. ¿Se ha transformado el mundo? Esto es lo que afirma la comunidad cristiana: él ya ha venido y ha traído con él el mundo nuevo y, sin embargo, él es todavía uno que debe venir.</p>
  <p>Gracias a su venida se ha transformado totalmente nuestro modo de ver el mundo y el tiempo. Su venida no es un acontecimiento de la historia del mundo que aconteció y pasó sin más; se trata más bien de un acontecimiento que significa el final de la historia. Los que creen en él se sustraen a la corriente del tiempo para sumergirse en la eternidad; poseen la verdad, la pureza, la vida; como la miseria es la muerte, ya no pueden caer en desesperación, ni el mal puede espantarnos ni fuera ni dentro de nosotros: ha desaparecido, absorbido por la gracia de Dios.</p>
  <p>De todo esto el cristianismo está seguro por la fe. Y la peculiar situación de los cristianos es tal que, mientras están en la tierra, deben recorrer su camino en la fe y no en la visión. Esos, que en Cristo no pertenecen a este mundo ni a este evo, aunque continúan estando en el tiempo. Y dado que la venida de Jesús no es un mero acontecimiento del pasado, sino el fin de toda la historia, el que ha venido es a la vez el que debe venir y será así hasta el fin del mundo y del tiempo. Para nosotros, que continuamos viviendo en la historia, él es siempre el que viene, el que siempre nos arranca, nos levanta más arriba de la vida y de la actividad temporal y de cuanto en ello existe de perecedero y mísero, del pecado y la muerte (R. Bultmann, <i>Prediche di Marburg</i>, Brescia 1973, 221-222).</p>
  `}
 ]},

{ id:"3-vie", title:"Viernes de la tercera semana", tag:"Tercera semana · Viernes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 56,1-3a.6-8</span>
  <p>Así dice el Señor: <sup>1</sup>Guardad el derecho, actuad con rectitud, pues ya llega mi salvación y está a punto de revelarse mi liberación. <sup>2</sup>Dichoso el hombre que actúa así, el mortal que se mantiene fiel, que observa el sábado, y no lo profana, y que evita actuar perversamente.</p>
  <p><sup>3a</sup>Que no diga el extranjero que se ha unido al Señor: «Sin duda, el Señor me separará de su pueblo».</p>
  <p><sup>6</sup>Y a los extranjeros que deciden unirse y servir al Señor, que se entregan a su amor y a su servicio, que observan el sábado sin profanarlo y son fieles a mi alianza, <sup>7</sup>los llevaré a mi monte santo, y haré que se alegren en mi casa de oración. Aceptaré sobre mi altar sus holocaustos y sacrificios; pues mi casa será casa de oración para todos los pueblos.</p>
  <p><sup>8</sup>Oráculo del Señor, que reúne a los dispersos de Israel y reunirá otros a los ya reunidos.</p></div>
