  <p class="prayer">Señor de la vida y de la historia grande y humilde, que haces maravillas ante nuestros ojos, enviándonos mensajeros de alegres noticias y que te alzas como signo de esperanza y luz para la salvación de todos, ven pronto a nosotros, una vez más, para manifestarnos tu rostro y hacernos comprender que toda vida es un proyecto de amor. Nosotros no tenemos ángeles que nos revelen claramente lo que quieres de nosotros y cuál sea nuestro puesto en los misteriosos caminos de tu providencia.</p>

  <p class="prayer">Tú has vivificado a mujeres estériles, como las madres de Sansón y del Bautista, has hecho prodigios por tu Espíritu en los que han creído en ti; te suplicamos: regenera nuestro corazón, cansado y desconfiado, para que se adhiera a tu voluntad, haz que nazca en nosotros un renovado deseo de amor hacia cualquier persona que encontremos en el camino.</p>

  <p class="prayer">Haznos experimentar lo que haces hoy como en el pasado, para que también nosotros podamos contar tus maravillas y tus intervenciones transformando nuestras debilidades y pobreza con tu poder. Pero, sobre todo, haznos gustar el saber que estás en nosotros y con nosotros y que nos trasciendes en tu misterio, porque tu camino se dirige al corazón, cuando escuchamos tu Palabra de vida en el silencio y la acogemos humildemente, como hizo la virgen de Nazaret, la mujer del silencio y la interioridad.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>«Hubo un hombre». ¿Cómo podía este hombre dar testimonio de la verdad sobre Dios? Es que era un «enviado de Dios». ¿Cuál es su nombre? Juan. ¿Cuál es el fin de su misión? «Vino como testigo, con la misión de dar fe acerca de la luz, con el fin de que por él creyeran todos en ella».</p>
  <p>¿Quién es este que da testimonio de la luz? Algo grande es este Juan, inmensa excelencia, gracia insigne, altísima cumbre. Admíralo, sí, admíralo, pero como se admira una montaña. Una montaña está en tinieblas si no se la viste de la luz. Admira a Juan, pero oye lo que sigue: «No es él la luz». Porque si crees que el monte es la luz, ese mismo monte es tu ruina en vez de ser tu consuelo. Es la montaña, como montaña, lo único que debes admirar. Levanta el vuelo hasta Aquel que ilumina el monte, hasta Aquel que subió a tanta altura para recibir primero los rayos que él envía a tus ojos. Pues Juan «no era la luz» (San Agustín, <i>Sobre el evangelio de san Juan</i>, 2,5).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«No temas, tu ruego ha sido escuchado»</b> (Lc 1,13).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>No te imagines que el Señor en su sublimidad esté lejos: aunque es infinitamente sublime, está cercano a ti, más cercano que los hombres que se aproximan cada día (…) más cercano a ti que tú mismo. Vigila tus pasos, cuando entren en la casa del Señor. ¿Por qué? Pues porque en la casa del Señor se ofrece lo único que puede salvar, el consuelo más dichoso (…).</p>
  <p>Pero, ¡atención! Ten cuidado sobre todo de hacer buen uso de cuanto se te ofrece. Usarlo con fe. No existe una certeza tan interior, tan fuerte y tan dichosa como la fe. Sin embargo, la fe no nos viene por nacimiento, no es la confianza de un ánimo juvenil y rebosante del gozo de la vida. Menos aún: la fe no es vivir en las nubes. La fe es certeza, certeza dichosa que se posee con temor y temblor. Vista la fe desde este ángulo, es decir el celeste, aparece como un reflejo de la bienaventuranza (S. Kierkegaard, <i>Pensieri che feriscono alle spalle</i>, Padua 1982, 33ss).</p>
  `}
 ]},

{ id:"20dic", title:"20 de diciembre", tag:"Cuarta semana · 20 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 7,10-14</span>
  <p><sup>10</sup>El Señor volvió a hablar a Acaz y le dijo: <sup>11</sup>—Pide al Señor tu Dios una señal, en lo hondo del abismo o en lo alto del cielo.</p>
  <p><sup>12</sup>Respondió Acaz: —No la pido, pues no quiero poner a prueba al Señor.</p>
  <p><sup>13</sup>Isaías dijo: —Escucha, heredero de David, ¿os parece poco cansar a los hombres, que queréis también cansar a mi Dios? <sup>14</sup>Pues el Señor mismo os dará una señal: Mirad, la virgen está encinta y da a luz un hijo, y le pondrá por nombre Enmanuel, que significa «Dios con nosotros».</p></div>

  <p class="note">Estamos hacia el año 735 a.C. cuando Acaz, joven rey de Jerusalén, débil, mundano y sin hijos, ve peligrar su trono ante la presencia de los ejércitos enemigos que oprimen los confines del reino de Judá. ¿Qué hacer? El rey pretende resolver el angustioso problema pactando alianzas humanas. Isaías, por el contrario, propone fiarse totalmente de Dios. Incluso el profeta invita al rey, en su apuro, a pedir un «signo» que confirme la protección divina. Pero Acaz lo rechaza aduciendo motivos de falsa religiosidad: «No quiero tentar al Señor» (v. 12). Isaías desenmascara la hipocresía del rey, pero añade que, a pesar del rechazo, Dios mismo dará un signo: «La virgen está encinta y da a luz un hijo, y le pondrá por nombre Emmanuel: Dios con nosotros» (v. 14).</p>

  <p class="note">Las palabras del profeta se refieren a Ezequías, el hijo de Acaz, al que la reina madre está a punto de dar a luz y cuyo nacimiento, en aquel momento histórico singular, se verá como presencia salvífica de Dios a favor del pueblo en apuros. Pero, en realidad, las palabras que Isaías dirige a Acaz son profecía de un rey salvador, y toda la tradición cristiana, basándose en la traducción de los Setenta, ha visto el anuncio profético del nacimiento virginal de Jesús, hijo de María.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,26-38</span>
  <p><sup>26</sup>Al sexto mes, envió Dios al ángel Gabriel a una ciudad de Galilea llamada Nazaret, <sup>27</sup>a una joven prometida a un hombre llamado José, de la estirpe de David; el nombre de la joven era María.</p>
  <p><sup>28</sup>El ángel entró donde estaba María y le dijo: —Dios te salve, llena de gracia, el Señor está contigo. <sup>29</sup>Al oír estas palabras, ella se turbó y se preguntaba qué significaba tal saludo.</p>
  <p><sup>30</sup>El ángel le dijo: —No temas, María, pues Dios te ha concedido su favor. <sup>31</sup>Concebirás y darás a luz un hijo, al que pondrás por nombre Jesús. <sup>32</sup>Él será grande, se llamará Hijo del Altísimo; el Señor Dios le dará el trono de David, su padre, <sup>33</sup>reinará sobre la casa de Jacob por siempre y su reino no tendrá fin.</p>
  <p><sup>34</sup>María dijo al ángel: —¿Cómo será esto, si yo no tengo relaciones con ningún hombre?</p>
  <p><sup>35</sup>El ángel le contestó: —El Espíritu Santo vendrá sobre ti y el poder del Altísimo te cubrirá con su sombra; por eso, el que va a nacer será santo y se llamará Hijo de Dios. <sup>36</sup>Mira, tu pariente Isabel también ha concebido un hijo en su vejez, y ya está de seis meses la que todos tenían por estéril; <sup>37</sup>porque para Dios nada hay imposible.</p>
  <p><sup>38</sup>María dijo: —Aquí está la esclava del Señor, hágase en mí según tu palabra. Y el ángel la dejó.</p></div>

  <p class="note">La narración de la anunciación del ángel Gabriel a la virgen María constituye la aurora del mayor acontecimiento que la historia humana haya visto jamás: la encarnación del Hijo de Dios. El texto bíblico es rico en reminiscencias veterotestamentarias y de gran valor doctrinal: se trata nada menos que del cumplimiento de las promesas hechas por Dios a los patriarcas y renovadas a David (cf. 2 Sm 7,14.16; 1 Cr 17,12-14; Is 7,10-14), y contiene una profunda teología del misterio de Cristo.</p>

  <p class="note">De hecho Jesús aparece como rey e hijo de David («El Señor Dios le dará el trono de David su padre y reinará sobre la casa de Jacob para siempre»: vv. 32-33) y a la vez como santo e hijo de Dios («Será grande, se llamará Hijo del Altísimo»: v. 32). Las palabras del ángel a María, además de ser un anuncio de gozo por la venida del Mesías a la tierra, constituyen el testimonio de la amorosa predilección de Dios con la humilde joven de Nazaret que, como esclava del Señor, ha merecido ser Madre de Dios por su fe incondicional.</p>

  <p class="note">La confirmación de la intervención celeste, por obra del Espíritu Santo, en su condición virginal, abre el corazón de María a la voluntad de Dios y a adherirse plenamente al proyecto universal de salvación con las sencillas palabras que han cambiado la historia humana: «Aquí está la esclava del Señor, hágase en mí según tu palabra» (v. 38). El sí de María franquea el camino de nuestra salvación y es una invitación a leer en los acontecimientos de nuestra vida la presencia del que es nuestro Salvador.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>El anuncio del oráculo de Isaías está vinculado al texto evangélico de Lucas por la interpretación profética que la Iglesia le ha dado refiriéndolo al nacimiento del Hijo de Dios, Salvador de todos los hombres. Su venida ha cambiado la historia profana en historia de salvación, y la vida de cada ser humano está destinada a la comunión con Dios, por la obra mediadora de Jesús de Nazaret. Dios se revela y manifiesta no tanto en la contemplación de la creación, en la investigación filosófica o en la experiencia religiosa universal, sino en la historia de Jesús, hijo de María, de un hombre que se proclama «Hijo», enviado por el Padre en total dependencia amorosa de él y que la Virgen Madre ha acogido y dado al mundo.</p>

  <p>En esta historia es donde irrumpe Dios trascendente y misericordioso para insertarse en la historia de los humanos y salvarlos, elevándolos al nivel superior del Espíritu, en la fe y el amor. Nosotros creyentes, convertidos en amigos de Jesús, somos introducidos a la comunión con Dios Padre, a través de la profundización de la vida de fe y amor vivida en fidelidad al evangelio. Esta vida de unión con el Señor se logra con la interiorización de la Palabra de Dios, como hizo la virgen María.</p>

  <p>La vida contemporánea, desgraciadamente, atenta flagrantemente contra la vida interior. Todo invita a la dispersión. Si no logramos recoger nuestras almas, reflejar a Cristo a fondo, no tendremos la más mínima posibilidad de alcanzar la verdad y la fe. En este camino tenemos a María como guía y ejemplo.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Oh Padre misericordioso y amante con las situaciones humanas, tú que has enviado al mundo a tu Hijo, hecho hombre por medio de la Virgen, como signo de tu ternura paternal, haz que también en nuestros días experimentemos la venida del Salvador, para que, una vez más, cambie nuestras vidas y le reconozcamos presente en todos nuestros acontecimientos cotidianos.</p>

  <p class="prayer">Siguiendo el modelo de María, madre de Jesús y madre nuestra, que se ha adherido generosamente a tu voluntad con su «aquí estoy» y ha abierto nuevamente a la humanidad el camino de una vida de comunión contigo, queremos que aumentes en nosotros el deseo de buscarte cada día por la escucha de la Palabra y la oración silenciosa, para que nuestra vida se vaya conformando a tu Palabra y dé frutos de gozo, paz, bondad, para cuantos nos rodean.</p>

  <p class="prayer">Haz que la comunidad cristiana, tentada con tanta frecuencia de racionalismo, de vida materialista y cómoda, comprenda cada vez más que evangelizar al hombre de hoy es ante todo estar en la presencia de Dios y dar espacio, siguiendo el ejemplo de María de Nazaret, a la importancia de la Palabra de Dios y a la vida contemplativa, para que surjan guías espirituales y testimonios de la verdadera libertad del evangelio. Todo esto es importante para comprender mejor que la Iglesia no es sólo una organización social, sino el signo auténtico de la encarnación de tu Hijo con los hombres.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>«Hágase en mí según tu palabra». Hágase en mí por el Verbo según tu palabra. Hágase carne de mi carne según tu palabra, el Verbo que ya existía desde el principio en Dios.</p>
  <p>No sea una palabra proferida, porque pasa; sino concebida, para que permanezca. Revestida, pero no de aire, sino de carne. Hágase en mí tu palabra, no sólo porque pueda escucharla con los oídos, sino tocarla con mis manos, contemplarla con los ojos y llevarla a cuestas. No se haga en mí la palabra escrita y muda, sino encarnada y viva. No trazada con caracteres sin voz sobre pergaminos resecos, sino impresa vivamente en forma humana en mis castas entrañas; no por los rasgos de una pluma, sino por obra del Espíritu Santo.</p>
  <p>En múltiples ocasiones y de muchas maneras habló Dios antiguamente a nuestros padres por los profetas. Nos dicen las Escrituras que unos escucharon la Palabra, otros la proclamaron y otros la cumplieron, pero yo te pido que se haga en mi vientre según tu Palabra. No quiero una palabra que predique o que declame. Quiero una Palabra que se dé silenciosamente. Hágase que se encarne personalmente y descienda a mí corporalmente. Hágase universalmente para todo el mundo y en particular hágase para mí según tu palabra (Bernardo de Claraval, <i>En alabanza de la Virgen Madre</i>, 4,11).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Aquí está la esclava del Señor, hágase en mí según tu palabra»</b> (Lc 1,38).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>La Virgen santa es la madre del género humano, la nueva Eva. Pero, al mismo tiempo, es también su hija. El mundo antiguo y doloroso, el mundo anterior a la gracia la acunó largo tiempo en su corazón desolado —siglos y más siglos— en la espera oscura, incomprensible de una virgo genitrix (…). Durante siglos y siglos protegió con sus viejas manos cargadas de crímenes, con sus manos pesadas, a la pequeña doncella maravillosa cuyo nombre ni siquiera sabía. ¡Una pequeña doncella reina de los ángeles! Y no hay que olvidar que lo sigue siendo aún (…).</p>
  <p>La Virgen santa no ha tenido ni triunfos ni milagros. Su Hijo no permitió que la gloria humana la rozara siquiera. Nadie ha vivido, ha sufrido y ha muerto con tanta sencillez y en una ignorancia tan profunda de su propia dignidad, de una dignidad que, sin embargo, la pone muy por encima de los ángeles. Ella nació también sin pecado, ¡qué extraña soledad! Un arroyuelo tan puro, tan límpido y tan puro, que Ella no pudo ver reflejada en él su propia imagen, hecha para la sola alegría del Padre Santo, ¡Oh soledad sagrada!</p>
  <p>Los antiguos demonios familiares del hombre, dueños y servidores al mismo tiempo, los terribles patriarcas que guiaron los primeros pasos de Adán en el umbral del mundo maldito, la Astucia y el Orgullo, contemplan desde lejos a esa criatura milagrosa que está fuera de su alcance, invulnerable y desarmada. Es verdad que nuestra pobre especie no vale mucho, pero la infancia emociona siempre sus entrañas y la ignorancia de los pequeños le hace bajar los ojos, esos ojos que han visto tantas cosas. ¡Pero no es más que la ignorancia al fin y al cabo! La Virgen es la inocencia. Date cuenta de lo que nosotros somos para Ella, nosotros, la raza humana. Ella detesta el pecado, naturalmente, pero no tiene de él experiencia alguna, esa experiencia que ni siquiera les ha faltado a los más grandes santos, hasta al propio santo de Asís, con lo seráfico que fue.</p>
  <p>La mirada de la Virgen es la única verdaderamente infantil, la única de niño que se ha dignado fijarse jamás en nuestra vergüenza y nuestra desgracia. Para rezar bien las oraciones que a Ella dirigimos tenemos que sentir sobre nosotros esa mirada que no es del todo la de la indulgencia, pues la indulgencia va siempre acompañada de alguna amarga experiencia, sino de tierna compasión, de sorpresa dolorosa, de no sabemos qué sentimientos, una mirada inconcebible, inexpresable, que nos la muestra más joven que el pecado, más joven que la raza de que Ella es originaria (G. Bernanos, <i>Diario de un cura rural</i>, Barcelona 1985, 164-165).</p>
  `}
 ]},

{ id:"21dic", title:"21 de diciembre", tag:"Cuarta semana · 21 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Cantar de los Cantares 2,8-14</span>
  <p><sup>8</sup>¡La voz de mi amado! Miradlo cómo viene saltando por los montes, brincando por las colinas. <sup>9</sup>Parece mi amado una gacela, parece un cervatillo. Se ha parado detrás de nuestra tapia. Mira por las ventanas, atisba por las rejas. <sup>10</sup>Habla mi amado, ya me dice: «Levántate, amada mía, preciosa mía, ven. <sup>11</sup>Que ya ha pasado el invierno, han cesado las lluvias y se han ido. <sup>12</sup>Las flores aparecen en el campo, ha llegado el tiempo de la poda; y se oye en nuestra tierra el arrullo de la tórtola. <sup>13</sup>Apuntan los brotes de la higuera, las viñas en flor exhalan su fragancia. ¡Levántate, amada mía, preciosa mía, ven! <sup>14</sup>Paloma mía, que anidas en las grietas de la roca, en escarpados escondrijos, déjame ver tu rostro, déjame oír tu voz. ¡Es tan dulce tu voz, tan hermoso tu rostro!»</p></div>

  <p class="note">El texto del Cantar de los Cantares, poema lírico, de autor desconocido, escrito en los siglos VI-V a.C. utilizando material antiguo que pudiera remontarse hasta Salomón (siglo X), exalta con delicadeza el amor humano entre esposo y esposa. Tal amor, descrito de modo espontáneo e inspirado, describe la vuelta del esposo a casa tras el largo invierno en busca de pastos para su rebaño. La alegría de la esposa por la venida de su amado, unida al tierno afecto, es tan intensa, que las palabras utilizadas de densa inspiración poética y las imágenes primaverales, aun las más elevadas, parecen insuficientes para manifestar la emoción interior de la persona amada.</p>

  <p class="note">En la tradición de la Iglesia la imagen «esposo»-«esposa» siempre se ha entendido como símbolo de la relación nupcial entre Dios y el pueblo (cf. Os 1-3; Is 62,4-5; Jer 3,1-39) y entre Cristo y la Iglesia (cf. Mc 2,19-20; Ef 5,25-26; 2 Cor 11,2; Ap 21,9). Dios, de hecho, es el esposo del poema e Israel la esposa. Y como el amor de Dios por su pueblo elegido se prolonga en el amor de Cristo por su Iglesia, el esposo es Cristo y la esposa es la Iglesia. La liturgia utiliza este simbolismo entre Cristo y María y entre Cristo y el creyente: la Virgen es figura de la Iglesia que sale al encuentro con gozo de Cristo-esposo que viene, y así también cada miembro de la comunidad cristiana, que vive esperando acoger al Señor para que le hable directamente al corazón.</p>

  <p class="note"><b>O bien:</b></p>

  <div class="reading"><span class="ref">Primera lectura (alternativa) · Sofonías 3,14-18a</span>
  <p><sup>14</sup>¡Da gritos de alegría, Sión, exulta de júbilo, Israel, alégrate de todo corazón, Jerusalén! <sup>15</sup>El Señor ha anulado la sentencia que pesaba sobre ti, ha barrido a tus enemigos; el Señor es rey de Israel en medio de ti, no tendrás que temer ya ningún mal.</p>
  <p><sup>16</sup>Aquel día dirán a Jerusalén: «No tengas miedo, Sión, que tus brazos no flaqueen; <sup>17</sup>el Señor tu Dios en medio de ti, es un salvador poderoso. Dará saltos de alegría por ti, su amor te renovará, por tu causa danzará y se regocijará, <sup>18a</sup>como en los días de fiesta».</p></div>

  <p class="note">El breve fragmento de Sofonías es un himno de gozo que brota del corazón del profeta, el cual, en nombre de Dios y abriendo horizontes de futuro, le hace experimentar a Israel, casi tangiblemente, la salvación y el amor que el Señor tiene con su pueblo. De hecho, a la amenaza que el profeta ve cernirse sobre Jerusalén, por el comportamiento perverso de las clases dominantes, sigue el juicio de Dios dirigido no a aniquilar al pueblo, sino a purificarlo y convertirlo. La salvación divina pasará por el «resto de Israel», la gente pobre y humilde de la que se sirve el Señor después de hacer desaparecer a los arrogantes.</p>

  <p class="note">La salvación viene favorecida por: no cometer iniquidad ni decir falsedades. Los beneficios consiguientes a esta obra del Señor son: cancelación de la condena, expulsión de los enemigos (v. 15; Lc 1,71.77; 1 Tim 1,15) y la presencia de Dios en el pueblo como «guerrero que salva» (v. 17) que renueva su amor por una vida de comunión perenne. La invitación a la alegría que se dirige a la «hija de Sión» y a la «hija de Jerusalén» (v. 14) se puede aplicar también a María, santificada por la presencia de Jesús, salvador del mundo, llevado con gozo en su seno en espera de entregarlo al mundo.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,39-45</span>
  <p><sup>39</sup>Por aquellos días, María se puso en camino y se fue de prisa a la montaña, a una ciudad de Judá. <sup>40</sup>Entró en casa de Zacarías y saludó a Isabel. <sup>41</sup>Y cuando Isabel oyó el saludo de María, el niño empezó a dar saltos en su seno. Entonces Isabel, llena del Espíritu Santo, <sup>42</sup>exclamó a grandes voces:</p>
  <p>—Bendita tú entre las mujeres y bendito el fruto de tu vientre. <sup>43</sup>Pero ¿cómo es posible que la madre de mi Señor venga a visitarme? <sup>44</sup>Porque en cuanto oí tu saludo, el niño empezó a dar saltos de alegría en mi seno. <sup>45</sup>¡Dichosa tú que has creído! Porque lo que te ha dicho el Señor se cumplirá.</p></div>

  <p class="note">La visita de María a su pariente Isabel en el pueblecito de Ain Karin en las colinas de Judá es una página rica de reminiscencias bíblicas, de humanidad y espiritualidad. María recorre el mismo camino que hizo el arca, cuando David la transportó a Jerusalén (cf. 2 Sm 6,2-11), y es el camino que hará Jesús cuando decididamente se dirigió a Jerusalén a cumplir su misión (cf. Lc 9,51). Se trata siempre de Dios, que, en diversos momentos de la historia de la salvación, se dirige al hombre para invitarlo a la salvación.</p>

  <p class="note">La narración de la visitación está estrechamente vinculada con la de la anunciación, no sólo por su clima tan humano, manifestado en actos de servicio, sino también porque la visitación es la verificación del «signo» que el ángel dio a María (cf. Lc 1,36-37). Los saltos del Bautista en el seno de su madre representa la alegría desbordante de todo Israel por la venida del Salvador (vv. 41.44). Las palabras de bendición, inspiradas por el Espíritu, que Isabel dirige a María, son la confirmación de la especial complacencia de Dios con la Virgen. La salvación que lleva en el secreto de su propia maternidad es el fruto de su fe en la Palabra del Señor: «Dichosa tú que has creído, porque lo que te ha dicho el Señor se cumplirá» (v. 45; Lc 8,19-21). Siempre María se anticipa y con solicitud se da a todos y en todo: la más grande se hace donación a la más pequeña, como Jesús con el Bautista.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>El encuentro de las dos madres y el del Mesías con su Precursor constituyen la expresión de un único cántico de alabanza y acción de gracias a Dios por su presencia salvadora en medio de los hombres. Ahora nos toca a nosotros, siguiendo el ejemplo de María y de su pariente Isabel, abrir el corazón a la acción gozosa y fecunda del Espíritu y responder al don de Dios. La Navidad es tiempo de gozo porque Dios se ha hecho uno de nosotros dándonos a su Hijo y porque nos hemos convertido todos en hermanos e hijos del mismo Padre.</p>

  <p>No es posible hacer lugar a la tristeza cuando celebramos el nacimiento de la vida, vida que destruye el temor de la muerte y nos aporta la alegría por la promesa de la eternidad: nadie queda excluido de esta alegría: la causa de la alegría es común a todos. Alégrese el justo, porque se acerca el premio; alégrese el pecador, porque es invitado al perdón; anímese el pagano, porque es llamado a la vida (san León Magno).</p>

  <p>María es el modelo de apertura de corazón a la acción del Espíritu. Ella con el don de la maternidad no se aisló en una autocomplacencia, sino que, cual verdadera «arca de la alianza» que encierra en sí la fuente de la vida, se pone con gozo en marcha para servir a los demás con una caridad traducida en humilde servicio. «La esposa no engendra obras de arte en la euforia y en la soledad, sino hijos de Adán que debe convertir en hijos de Dios con su carne y su alma» (M. Delbrel). El anuncio de salvación y alegría que Dios nos aporta con su Palabra esta Navidad ¿no está quizás disfrazado en gestos de amor hacia los hermanos, especialmente con aquellos que carecen de motivos para alegrarse?</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor, que te has hecho nuestro hermano y desde el vientre virginal de María comunicaste con alegría la salvación a tu Precursor en el encuentro de la visitación de María a Isabel, haz que también nosotros, siguiendo el ejemplo de tantas personas dispuestas a acoger tus dones, podamos alegrarnos en el Espíritu siempre que acojamos tu Palabra de vida.</p>

  <p class="prayer">Con frecuencia no sabemos escuchar tu voz ni sabemos orar, pero nos has dado el Espíritu que silenciosamente ora en nosotros. Haz que nos impliquemos en su poderosa acción para ejecutar en nosotros la verdad y, de este modo, con corazón renovado, sepamos darte con alegría a nuestros hermanos, especialmente los más necesitados. Concédenos que la Palabra que da vida y que nos regalas podamos vivirla con fe y testimoniarla con un compromiso concreto en nuestro trabajo de cada día, en nuestras familias y comunidad, para que siempre resplandezca esta alegre noticia de salvación para todos, santos y pecadores.</p>

  <p class="prayer">Como María, deseamos ver a Jesús, nuestro salvador, que nos revela el verdadero rostro del Padre y del hombre, y meditar continuamente como la Virgen de Nazaret los grandes acontecimientos de la historia de salvación de modo nuevo y actual. Señor, que cada uno de nosotros esté siempre abierto a la acción del Espíritu para llevar al mundo la novedad del amor.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Suene, oh Jesús, tu voz en mis oídos, para que mi corazón aprenda a amarte, para que te ame mi mente, para que te amen las mismas entrañas de mi alma. Adhiérase a ti en apretado abrazo lo más íntimo de mi corazón; a ti mi único y solo verdadero bien, mi dulce y deleitable alegría. Pero ¿qué es el amor, Dios mío? Si no me engaño, es una admirable delectación del alma, tanto más dulce cuanto más puro, tanto más suave cuanto más sincero, tanto más alegre o gozoso cuanto más extenso y duradero. El paladar del corazón te saborea porque eres dulce; su ojo te contempla porque eres bueno; el corazón puede contenerte a pesar de que eres inmenso. Quien te ama, te goza, y tanto más te goza cuanto más te ama, porque tú mismo eres amor, caridad. Te suplico, Señor, que descienda a mi alma una partecita siquiera de esa tu gran suavidad, para que con ella se torne dulce el pan de su desolada amargura. Guste de antemano algún pequeño sorbo de aquello que anhela, de aquello que ansía, de aquello por lo que suspira en esta peregrinación. Mientras tanto, Señor, te buscaré, y te buscaré amándote (Elredo de Rieval, <i>El espejo de la Caridad</i>, Buenos Aires 1981, 61-62).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Bendita tú entre las mujeres y bendito el fruto de tu vientre»</b> (Lc 1,42).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Ordinariamente, vemos en el misterio de la visitación sobre todo una acción a imitar, como si María hubiese hecho sólo esta visita y la hubiese hecho para darnos un ejemplo, olvidando que lo propio de la naturaleza de la Virgen es hacer visitas: el visitar a los hombres es para ella una función. María viene a visitarnos con frecuencia, como si fuésemos sus amigos, sus parientes próximos.</p>
  <p>La visitación siempre será la fiesta de esta actitud de total donación de sí, propia de María desde que supo que era la madre de Jesús. Ahora comienza esta serie innumerable de «visitas» que no terminará mientras haya un hombre en la tierra.</p>
  <p>Su glorificación y la misteriosa extensión de su maternidad a todos los que nacerán de su Hijo, darán a María un número infinito de parientes por visitar, sencillamente para ayudarles con esa presencia humilde y discreta que le caracteriza.</p>
  <p>María viene a visitarnos llevando a Jesús escondido en ella, para ayudarnos en nuestras necesidades más urgentes, más cotidianas, más banales: necesidad de trabajo, las obligaciones, el estado, las relaciones. María viene a visitarnos, quizás nunca lo habíamos pensado. Nos visita frecuentemente, todos los días. Este es el sentido más profundo, más auténtico de este misterio: el hecho de las visitas innumerables, sencillísimas, personalísimas, todas por nosotros, que María multiplica en nuestra vida en todo momento, en cualquier dificultad (R. Voillaume, <i>Al servicio de los hombres</i>, Madrid 1973).</p>
  `}
 ]},

{ id:"22dic", title:"22 de diciembre", tag:"Cuarta semana · 22 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · 1 Samuel 1,24-28</span>
  <p><sup>24</sup>En aquellos días, cuando Ana hubo destetado a Samuel, subió con él al templo del Señor en Siló, llevando un novillo de tres años, una medida de harina y un odre de vino. <sup>25</sup>Cuando inmolaron el novillo y presentaron el niño a Elí, <sup>26</sup>Ana le dijo: —Señor mío, te ruego que me escuches; yo soy la mujer que estuvo aquí, junto a ti, rezando al Señor. <sup>27</sup>Este niño es lo que yo pedía, y el Señor me ha concedido lo que le pedí. <sup>28</sup>Ahora yo se lo cedo al Señor; por todos los días de su vida queda cedido para el Señor. Y se postraron allí ante el Señor.</p></div>

  <p class="note">Los dones más preciosos no se conquistan, sino que se esperan. Tal es el caso de la madre del joven Samuel, Ana, que acude al santuario del arca en Siló para agradecer al Señor el don de la maternidad después de su insistente súplica. Lleva algunos dones de la tierra, pero sobre todo el don de su hijo Samuel, que ofrece a Dios con generosidad: «Se lo cedo al Señor mientras viva» (v. 28). Ana ofrece primero al Señor un toro, como sacrificio de acción de gracias y alabanza; a continuación presenta a su hijo Samuel al sacerdote Elí, al que le cuenta su historia, recordando la oración que hizo años atrás en su presencia, y cómo Dios había escuchado su petición, concediéndole la gracia tan ansiada del nacimiento del hijo. Ana, pues, está en la casa de Dios para intercambiar el don: «Ahora yo se lo cedo al Señor» (v. 28).</p>

  <p class="note">La narración bíblica es el anuncio extraordinario de lo que Dios realizará en plenitud con María. Lo mismo que en el caso de Isaac (cf. Gn 18,9-14), Sansón (cf. Jue 13,2-25) y Juan Bautista (cf. Lc 1,5-25), el nacimiento de un hijo por obra de Dios, de una mujer estéril, fue el signo de una vocación particular, también lo fue para Samuel, destinado a ser el primer gran profeta de Israel (cf. Hch 3,24) y el guía espiritual del pueblo. Es preciso seguir la trayectoria marcada por Dios en la historia de la salvación de cada uno. Es necesario respetar los tiempos de crecimiento de cada uno sin pretender manipular a Dios en la realización de nuestros proyectos personales y humanos.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,46-55</span>
  <p><sup>46</sup>Entonces María dijo:</p>
  <p><i><sup>47</sup>Proclama mi alma la grandeza del Señor, se alegra mi espíritu en Dios mi Salvador,<br>
  <sup>48</sup>porque ha mirado la humildad de su sierva. Desde ahora me llamarán dichosa todas las generaciones,<br>
  <sup>49</sup>porque ha hecho en mí cosas grandes el Poderoso. Su nombre es santo,<br>
  <sup>50</sup>y es misericordioso siempre con aquellos que le honran.<br>
  <sup>51</sup>Desplegó la fuerza de su brazo y dispersó a los de corazón soberbio.<br>
  <sup>52</sup>Derribó de sus tronos a los poderosos y ensalzó a los humildes.<br>
  <sup>53</sup>Colmó de bienes a los hambrientos y a los ricos despidió sin nada.<br>
  <sup>54</sup>Tomó de la mano a Israel, su siervo, acordándose de su misericordia,<br>
  <sup>55</sup>como lo había prometido a nuestros antepasados, en favor de Abrahán y de sus descendientes para siempre.</i></p></div>

  <p class="note">El Magníficat, canto de los pobres, es una de las más bellas oraciones del Nuevo Testamento, con múltiples reminiscencias veterotestamentarias (cf. 1 Sm 2,1-18; Sal 110,9; 102,17; 88,11; 106,9; Is 41,8-9). Es significativo que el texto se ponga en labios de María, la criatura más digna de alabar a Dios, culmen de la esperanza del pueblo elegido. El cántico celebra en síntesis toda la historia de la salvación que, desde los orígenes de Abrahán hasta el cumplimiento en María, imagen de la Iglesia de todos los tiempos, siempre es guiada por Dios con su amor misericordioso, manifestado especialmente con los pobres y pequeños.</p>

  <p class="note">El cántico se divide en tres partes: María glorifica a Dios por las maravillas que ha hecho en su vida humilde, convirtiéndola en colaboradora de la salvación cumplida en Cristo su Hijo (vv. 46-49); exalta, además, la misericordia de Dios por sus criterios extraordinarios e impensables con que desbarata situaciones humanas, manifestada con seis verbos («Desplegó, dispersó, derribó, ensalzó, colmó, auxilió…»), que reflejan el actuar poderoso y paternal de Dios con los últimos y menesterosos (vv. 50-53); finalmente recuerda el cumplimiento amoroso y fiel de las promesas de Dios hechas a los Padres y mantenidas en la historia de Israel (vv. 54-55). Dios siempre hace grandes cosas en la historia de los hombres, pero sólo se sirve de los que se hacen pequeños y procuran servirle con fidelidad en el ocultamiento y en el silencio de adoración en su corazón.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La unión existente entre la lectura de Samuel y la del Magníficat de María es significativa: las dos madres, Ana y María, viven el gozo y la alabanza agradecida por el don de la vida que está en ellas, signo de la bondad de Dios y se confían con un corazón sencillo en el Señor, porque «es misericordioso siempre con aquellos que le honran» (v. 50). ¿Somos nosotros conscientes de que la pobreza y la sencillez de corazón son las condiciones esenciales para agradar a Dios y ser colmados de su riqueza? Los frutos de las obras de Dios se desarrollan no en la agitación ni con violencia, sino lentamente y en silencio. Dios actúa siempre en el secreto y no con ostentación, sin que por ello el resultado deje de ser eficaz y extraordinario.</p>

  <p>No se puede obligar a una planta a que florezca por la fuerza; precisa germinar lentamente e ir creciendo hasta su punto de madurez y esplendor. Tampoco se pueden forzar los tiempos del Espíritu. Dios sabe ir llevando a la madurez el proyecto de cada uno, de acuerdo con los tiempos y momentos que sólo él conoce. Como María, se nos invita, próxima ya la Navidad, a compartir esta ternura del Señor confiando nuestros proyectos y nuestra misma vida a aquel que nos ha amado primero y sólo desea nuestro bien, dirigiéndole nuestra alabanza porque «ha escogido lo que el mundo considera necio para confundir a los sabios; ha elegido lo que el mundo considera débil para confundir a los fuertes… de este modo, nadie puede presumir delante de Dios» (1 Cor 1,27-29).</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor misericordioso y fiel, tú has puesto en labios de las dos madres, Ana y María, la oración de alabanza y agradecimiento, haciendo germinar en su corazón la alegría, fruto de tu visita amorosa y paternal: concédenos también a nosotros, deseosos de recorrer el mismo camino, descubrir en la oración la actitud de alabanza agradecida, por los múltiples beneficios que nos concedes sin mérito alguno de nuestra parte, y el agradecimiento gozoso por las maravillas que continuamente permites pregustar en tu Iglesia y en el contacto con nuestros hermanos en la fe.</p>

  <p class="prayer">Eres Padre de todos y no quieres que ninguno viva sumido en la tristeza sin experimentar tu amor: haz que, sobre todo los pobres de cuerpo y espíritu, los últimos y los pecadores, experimenten tu presencia misericordiosa y sepan confiar en ti en los momentos difíciles de su vida sin descorazonarse o alejarse de ti.</p>

  <p class="prayer">Te pedimos además que cada uno de nosotros pueda escribir en su vida su propio Magníficat siguiendo el modelo del de María, para poder descubrir en la oración que las riquezas que nos confías superan en mucho nuestra pobreza y que los dones que pones en nuestras manos y en las de nuestros hermanos son un signo de que siempre cuidas de nosotros con amor de Padre.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>La humildad de corazón es la madre de todas las virtudes; en ella y de ella se generan y derivan las demás virtudes, como de la raíz sabemos ponderar la riqueza del árbol. Y como es el más firme y arraigado cimiento sobre el que se eleva todo el edificio de la vida espiritual, Dios quiere ser su maestro y modelo exclusivo. Y por la Virgen María se complace sólo de esta virtud, afirmando que sólo por eso Dios se encarnó en ella diciendo: «Porque miró la humildad de su esclava. Y por esto y no por otra cosa, me proclamarán dichosa todas las generaciones».</p>
  <p>Oh hijos míos, manteneos en esta humildad, para que podáis lograr la verdadera paz de vuestras almas. Oh hijos míos, ¿dónde podrá encontrar reposo y paz la criatura sino en aquel que es la paz suma, en aquel que pacifica todo, el puerto sereno de las almas? ¿Y cómo podrá llegar a él el alma que no vuele con las alas de la humildad, sin las cuales las demás virtudes corren hacia Dios, pero sin fuerza para levantar el vuelo? Carísimos, esta humildad de corazón que Dios-hombre quiere enseñarnos y darnos, es una luz radiante y clara que abre los ojos del alma al doble abismo: el de la nada humana y el de la ilimitada bondad de Dios (Angela de Foligno, <i>Le istruzioni</i>, Florencia 1926, 256-257).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Proclama mi alma la grandeza del Señor, se alegra mi espíritu en Dios, mi salvador»</b> (Lc 1,47).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Para comprender bien este canto de alabanza, debemos notar que la bienaventurada virgen María habla por propia experiencia, habiendo sido iluminada y adoctrinada por el Espíritu Santo: y es que nadie puede comprender rectamente a Dios ni la Palabra de Dios, si no se lo concede directamente el Espíritu Santo. El recibir este don del Espíritu Santo significa experimentarlo como en una escuela, fuera de la cual sólo hay palabras y charlas. Así pues, la santa Virgen, habiendo experimentado en sí misma que Dios había hecho obras grandes en ella, humilde, pobre y despreciada, el Espíritu le enseña este precioso arte y sabiduría, según el cual Dios es el Señor que se complace en elevar lo que es humilde y en humillar lo elevado; resumiendo, a derribar lo construido y a construir lo derribado.</p>
  <p>Como al principio de la creación creó el mundo de la nada, así su modo de actuar sigue esta misma constante, lleva a cabo todas sus obras hasta el fin del mundo sacando de la nada, de lo pequeño, despreciado, miserable, muerto, algo precioso, honrado, dichoso, vivo, lo reduce a nada, pequeño, despreciable, mísero y efímero (Martín Lutero, <i>Introducción al Magníficat</i>).</p>
  `}
 ]},

{ id:"23dic", title:"23 de diciembre", tag:"Cuarta semana · 23 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Malaquías 3,1-4.23-24</span>
  <p>Así dice el Señor: <sup>1</sup>Mirad, yo envío mi mensajero a preparar el camino delante de mí, y de pronto vendrá a su templo el Señor a quien vosotros buscáis, el mensajero de la alianza, a quien tanto deseáis; he aquí que ya viene, dice el Señor todopoderoso.</p>
  <p><sup>2</sup>¿Quién podrá soportar el día de su venida? ¿Quién se mantendrá en pie en su presencia? Será como fuego de fundidor y como lejía de lavandera. <sup>3</sup>Se pondrá a fundir y a refinar la plata. Refinará a los hijos de Leví y los acrisolará como el oro y la plata, para que presenten al Señor ofrendas legítimas. <sup>4</sup>Entonces agradarán al Señor las ofrendas de Judá y de Jerusalén, como en los tiempos pasados, como en los años remotos.</p>
  <p><sup>23</sup>Mirad, yo os enviaré al profeta Elías antes que llegue el día del Señor, grande y terrible; <sup>24</sup>él hará que padres e hijos se reconcilien, de manera que, cuando yo venga, no tenga que entregar esta tierra al exterminio.</p></div>

  <p class="note">En el contexto de la reconstrucción del segundo templo (segunda mitad del siglo V a.C.), el culto y la pureza religiosa del pueblo están en decadencia a causa de los matrimonios mixtos de los que volvieron a Jerusalén del destierro de Babilonia y viven impunes y tranquilos. Los observantes se preguntan: ¿dónde está la justicia de Dios? En nombre del Señor, el profeta responde denunciando el pecado de los sacerdotes y la violación de la ley del culto por parte de pueblo y anunciando como inminente «el día grande y terrible» (v. 23) de la venida del Señor en persona. Él purificará el templo y sus sacerdotes y juzgará a los malvados.</p>

  <p class="note">Pero al Señor le precederá un mensajero, identificado con el profeta Elías (v. 23; Eclo 48,10-11), cuya misión será la de preparar el camino, purificar al pueblo de sus pecados y dirigirlo, mediante la reconciliación del corazón, a las sanas tradiciones de los padres. La profecía de Malaquías, leída en el contexto del Nuevo Testamento, se refiere a la venida de Cristo, precedida por su mensajero: Juan Bautista, cuya misión de Precursor será llamar al pueblo a la conversión y prepararlo al encuentro con el Mesías, «el mensajero de la alianza» (v. 1), por todos esperado.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,57-66</span>
  <p><sup>57</sup>Se le cumplió a Isabel el tiempo y dio a luz un hijo. <sup>58</sup>Sus vecinos y parientes oyeron que el Señor le había mostrado su gran misericordia y se alegraron con ella.</p>
  <p><sup>59</sup>Al octavo día fueron a circuncidar al niño y querían llamarlo Zacarías, como su padre. <sup>60</sup>Pero su madre dijo: —No, se llamará Juan. <sup>61</sup>Le dijeron: —No hay nadie en tu familia que lleve ese nombre. <sup>62</sup>Se dirigieron entonces al padre y le preguntaron por señas cómo quería que se llamase. <sup>63</sup>Él pidió una tablilla y escribió: «Juan es su nombre». Entonces, todos se llevaron una sorpresa.</p>
  <p><sup>64</sup>De pronto recuperó el habla y comenzó a bendecir a Dios. <sup>65</sup>Todos sus vecinos se llenaron de temor, y en toda la montaña de Judea se comentaba lo sucedido. <sup>66</sup>Cuantos lo oían pensaban en su interior: «¿Qué va a ser este niño?». Porque efectivamente el Señor estaba con él.</p></div>

  <p class="note">El evangelio de Lucas, realizando la profecía de Malaquías en la figura del Bautista, nos describe dos episodios de su nacimiento: la participación de los parientes y vecinos que se alegran con Isabel por su parto (vv. 57-58) y la circuncisión del niño al octavo día con la imposición del nombre (vv. 59-66).</p>

  <p class="note">El evangelista, subrayando algunos elementos, advierte en el acontecimiento del nacimiento y de la imposición del nombre la intervención prodigiosa y misericordiosa del Señor actuando en la vida del pequeño de modo extraordinario: la alegría de todos por el acontecimiento inesperado (v. 58); el significado del nombre «Juan» (vv. 60-63), que quiere decir: «Dios favorece y actúa con misericordia», nombre rico en promesas futuras; el asombro de los presentes mezclado con un temor respetuoso, y la divulgación de la noticia por toda Judea (v. 65); Zacarías que recobra el habla y bendice y alaba a Dios, como signo de que todo lo dicho por el Señor se ha cumplido (v. 64); finalmente, la reacción de aquellos que iban conociendo el nacimiento del niño, que se preguntaban: «¿Qué va a ser este niño?», y el mismo evangelista en una nota redaccional concluye diciendo: «El Señor estaba con él» (v. 66).</p>

  <p class="note">La narración del nacimiento del Bautista anuncia ya maduros los tiempos nuevos de la venida del Mesías. Lo importante es acogerlo como hizo el Bautista y saber reconocer en la historia la novedad radical de la relación entre Dios y el hombre.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>En todas las épocas de la historia humana el Señor envía siempre mensajeros como Elías y el Bautista, para recordar que es él quien tiene en sus manos las riendas de los avatares humanos y, a pesar de que el hombre rechace sus llamadas y huya de sus caminos, él siempre reanuda los vínculos con gestos de amor. Tampoco hoy faltan entre nosotros signos concretos y modos elocuentes de su Palabra, personas como la Madre Teresa y acontecimientos extraordinarios como un concilio ecuménico o un sínodo eclesial; personas y acontecimientos que, siendo instrumentos del Espíritu, elevan las propias «antenas» para captar la onda del mundo nuevo que se perfila en el horizonte. Lo nuevo ya está y está vivo, hay que saberlo ver y respetar sin ceder a nostalgias del pasado o a sueños de futuro, que son auténticas evasiones de la realidad.</p>

  <p>Dios nos va educando con largos períodos de ascesis y silencio para que aprendamos a descubrirlo en la historia y en lo íntimo del corazón, donde mora el Espíritu de Cristo que nos guía e ilumina en nuestro camino de fe. Todo esto lleva consigo el romper nuestras seguridades para que nos fiemos de un Dios-Amor, como Jesús nos enseñó (cf. 1 Jn 4,16). Aceptar a Dios-Amor significa entrar en los caminos de Dios, fiarnos de su paternidad divina, que nos hace libres y nos restituye la dignidad de auténticos hijos; significa dejarse conducir por su Espíritu sin poner obstáculos a la acción interior y gratuita de Dios.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Padre santo, que guías la historia y que por medio de tu Hijo Jesús la conduces por los caminos de amor, haz que la Iglesia en su peregrinación terrena hacia el Señor viva plenamente la tensión de la salvación entre el ya cumplido en Jesús y el todavía no actualizado en nosotros y manifestado en Cristo glorioso.</p>

  <p class="prayer">En los albores de la Iglesia los cristianos decían: «La salvación está más cerca que cuando comenzamos a creer» (Rom 13,11). Con frecuencia hoy vivimos sin pensar en tu venida, distraídos por mil luces fatuas que nos deslumbran, ignorando el grito que la Iglesia dirige a su esposo al final del Apocalipsis: «Ven, Señor Jesús» (Ap 22,17.20). Concédenos, Padre bueno, no olvidar que estás entre nosotros, aunque oculto en tantos rostros de hermanos, y guías nuestros pasos por la presencia de tus mensajeros de luz y de paz, que nos interpelan y sacuden nuestra superficialidad espiritual con su fe coherente y su fecundo testimonio de vida.</p>

  <p class="prayer">Queremos estar vigilantes en nuestro caminar para reconocer tus mensajeros que nos invitan a tu amistad. Pero, ante todo, te pedimos que nos hagas capaces de mantener purificado el corazón, libre y sensible a la acción del Espíritu, para que actuemos como deseas, te encontremos en esta Navidad y podamos estar preparados en el día de tu última visita para confesar en alabanza que has sido padre y amigo.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>El nombre de Juan significa: «aquel en el cual está la gracia». Ahora bien, donde debe nacer la gracia, se tiene que caminar por caminos de conversión. Si se lograse seguir este camino, sería una cosa deliciosa. Si se aprendiese bien este camino, nacería en él de verdad la gracia de Dios. El hombre no tiene nada por sí mismo; todo proviene de Dios y por Dios: tanto lo grande como lo pequeño. El hombre debiera tener siempre presente este pensamiento en su corazón (…).</p>
  <p>En esto el hombre debe humillarse y arrojarse a los pies de Dios para que se compadezca de él. Debe además esperar plenamente en Dios. Entonces, de pronto, Juan —esto es, la gracia— nace en ese humus de humildad. En el valle de la humildad crece la dulzura, la confianza, la calma, la paciencia, la bondad (…). Cuando tiene lugar este nacimiento, se experimenta un gozo en el espíritu tan grande que nadie puede expresarlo (…).</p>
  <p>En estas personas descansa la santa Iglesia y, si no existieran, la cristiandad no subsistiría ni una hora. El hecho de que existan es mucho más importante que toda la actividad del mundo. Que Dios nos conceda a todos nosotros lograr todo esto del modo más rápido y glorioso. Amén (Taulero, <i>Sermón por la natividad de san Juan Bautista</i>, en Obras, Alba 1984).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Hablaba bendiciendo a Dios»</b> (Lc 1,64).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>«Era la luz verdadera que alumbra a todo hombre que viene a este mundo». Si, pues, alumbra a todo hombre que viene al mundo, iluminó también al mismo Juan. Alumbraba a aquel por quien quería darse a conocer.</p>
  <p>Entended, pues, hermanos míos: venía a espíritus apocados, a corazones débiles, para vigorizar los ojos enfermizos de las almas. Para éstos venía. ¿Cómo es posible que un alma de éstas vea al Señor por excelencia? De manera parecida a como suele casi siempre darse uno cuenta de que ha salido el sol, que los ojos no ven, por los cuerpos que reflejan sus rayos. Quienes tienen enfermos los ojos pueden fácilmente ver un muro, una montaña, un árbol y otros objetos cualesquiera que el sol ilumina y dora con sus rayos, y estos objetos iluminados muestran la salida del sol a los ojos, que aún no pueden fijarse directamente en él. Así son aquellos hombres a quienes viene Cristo y que son ineptos para verlo. Irradia sobre Juan, quien confiesa no ser él el que irradia y alumbra, sino quien recibe la irradiación y la luz, y por él se ve a Aquel que ilumina y esclarece y lo llena todo. ¿Quién es éste? Este es, dice el evangelista, el que alumbra a todo hombre que viene a este mundo. Si no se hubiese alejado de Él, no tendría necesidad de ser iluminado. Pero le es necesaria esta iluminación, porque se alejó del que podía envolverlos en sus resplandores (San Agustín, <i>Sobre el evangelio de san Juan</i>, Madrid 1968, 95-96).</p>
  `}
 ]},

{ id:"24dic", title:"24 de diciembre", tag:"Cuarta semana · 24 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · 2 Samuel 7,1-5.8b-12.14a.16</span>
  <p><sup>1</sup>Cuando David se estableció en su palacio y el Señor le dio paz con todos sus enemigos de alrededor, <sup>2</sup>dijo al profeta Natán: —Yo vivo en una casa de cedro, mientras que el arca del Señor está en una tienda.</p>
  <p><sup>3</sup>Natán le dijo: —Haz lo que te propones, porque el Señor está contigo.</p>
  <p><sup>4</sup>Pero aquella misma noche el Señor dirigió esta palabra a Natán: <sup>5</sup>—Ve a decir a mi siervo David: Esto dice el Señor: ¿Eres tú quien me va a construir una casa para que viva en ella?</p>
  <p><sup>8b</sup>Yo te tomé de la majada, de detrás de las ovejas, para que fueras caudillo de mi pueblo, Israel. <sup>9</sup>He estado contigo en todas tus empresas, he exterminado delante de ti a todos tus enemigos; y yo haré que tu nombre sea como el de los grandes de la tierra. <sup>10</sup>Asignaré un lugar a mi pueblo Israel y en él lo plantaré, para que lo habite y no vuelva a ser perturbado, ni los malvados lo opriman como antes, <sup>11</sup>como en el tiempo en que yo establecí jueces sobre mi pueblo Israel; te daré paz con todos tus enemigos. Además, el Señor te anuncia que te dará una dinastía.</p>
  <p><sup>12</sup>Cuando hayas llegado al final de tu vida y descanses con tus antepasados, mantendré después de ti el linaje salido de tus entrañas, y consolidaré su reino. <sup>14a</sup>Seré para él un padre y él será para mí un hijo. <sup>16</sup>Tu casa y tu reino subsistirán para siempre ante mí, y tu trono se afirmará para siempre.</p></div>

  <p class="note">La profecía de Natán a David es esclarecedora y abre un nuevo horizonte en la historia de salvación. El reino de Judá goza de un período de tranquilidad y el mismo rey mora en un magnífico palacio. Pero sus planes son construir también una «casa» al Señor donde poder acoger el arca de Dios. El profeta le impide realizarlo porque Dios tiene otro proyecto mayor para David y su descendencia. El Señor tomará la iniciativa para dar una casa no de piedra, sino estable y duradera: la estirpe real de David: «El Señor te anuncia que te dará una dinastía. Tu casa y tu reino subsistirán para siempre ante mí» (vv. 11.16).</p>

  <p class="note">El Señor, de hecho, recuerda a David su historia, lo que ha hecho por él, y promete a su dinastía una duración perenne: lo eligió como pastor del pueblo sacándolo de los campos (cf. 1 Sm 16,11-13); le concedió la victoria sobre todos sus enemigos y en el futuro continuará estando con él; su gloria y la de su descendencia será grande porque gozará de una filiación divina; el rey y su pueblo serán benditos del Señor y poseerán una «casa» estable y tranquila, es decir, una dinastía que durará por los siglos.</p>

  <p class="note">El mensaje de la Palabra de Dios está claro: la salvación no viene de un templo de piedra obra de manos humanas, sino de la alianza con Dios, al que pertenece todo, el hombre y la historia.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,67-79</span>
  <p><sup>67</sup>Zacarías, su padre, se llenó del Espíritu Santo y profetizó:</p>
  <p><i><sup>68</sup>Bendito sea el Señor, Dios de Israel, porque ha visitado y redimido a su pueblo.<br>
  <sup>69</sup>Nos ha suscitado una fuerza salvadora en la familia de David su siervo,<br>
  <sup>70</sup>como lo había prometido desde antiguo por medio de sus santos profetas,<br>
  <sup>71</sup>para salvarnos de nuestros enemigos y del poder de todos los que nos odian.<br>
  <sup>72</sup>De este modo mostró el Señor su misericordia a nuestros antepasados y se acordó de su santa alianza,<br>
  <sup>73</sup>del juramento que hizo a nuestro antepasado Abrahán, para concedernos<br>
  <sup>74</sup>que, libres de nuestros enemigos, podamos servirle sin temor,<br>
  <sup>75</sup>con santidad y justicia en su presencia toda nuestra vida.<br>
  <sup>76</sup>Y tú, niño, serás llamado profeta del Altísimo, pues irás delante del Señor para preparar sus caminos,<br>
  <sup>77</sup>para anunciar a su pueblo la salvación, por medio del perdón de sus pecados.<br>
  <sup>78</sup>Por la misericordia entrañable de nuestro Dios, nos visitará un sol que nace de lo alto,<br>
  <sup>79</sup>para iluminar a los que están en tinieblas y en sombras de muerte, y para dirigir nuestros pasos hacia el camino de la paz.</i></p></div>

  <p class="note">El cántico de Zacarías es un tejido de reminiscencias bíblicas que exalta el cumplimiento de las promesas de salvación hechas por Dios en las antiguas profecías. Zacarías, sacerdote de la antigua ley, pero lleno del Espíritu Santo, en el presente cántico de bendición por la visita del Señor a su pueblo, inaugura la nueva alianza, cuyo precursor será su hijo Juan, en el que la larga espera de siglos llega a su cumplimiento.</p>

  <p class="note">El texto bíblico se divide en dos partes: la primera resume la historia de salvación, resaltando la misericordia de Dios con los padres y su inquebrantable fidelidad a la alianza, que se realizará en la figura del Mesías (vv. 68-75); la segunda mira al Bautista, «profeta del Altísimo» (v. 76), destinado a preparar los caminos del Señor con la predicación de la redención y salvación universal, efectiva en la persona de Jesús, por el perdón de los pecados, fruto de su inmensa bondad.</p>

  <p class="note">El cántico ensalza a Cristo, el sol de la resurrección, engendrado antes de la aurora, que con sus rayos ilumina a los que viven en tinieblas y en espera, vivifica a los que carecen de vida y la imploran. Él es la paz, plenitud de los dones mesiánicos, destinada a los que alaban y dan gloria a Dios. Él, el Verbo del Padre, es luz y vida de los hombres, en el cual ven a Dios y al cual obedecen.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Estamos en la vigilia de la Navidad del Señor, y la Palabra de Dios que resuena en la Iglesia es una actualización de las profecías mesiánicas, invitación a dar gracias y a la alabanza por la inminente venida del Salvador, que ha derramado sus bendiciones sobre el pueblo, manteniendo la fe en sus promesas con el don de la reconciliación y de la salvación universal.</p>

  <p>¿Cómo vivimos personalmente esta vigilia y qué compromiso de vida nos exige? La venida histórica del Mesías nos confirma que Dios ha elegido su «casa» entre nosotros, en el cuerpo de Jesús, su Hijo (cf. Jn 1,14). Él mora con su pueblo, no de modo pasajero, sino de modo estable (cf. Ap 7,15; 12,2; 13,6; 21,3). Si en el Antiguo Testamento el lugar ideal de la presencia de Dios era el templo o la tienda (cf. Ex 25,8; 40,35; Ez 37,27; Jl 4,17), ahora su presencia está en la misma vida del hombre y en la carne visible de Jesús, que tocó y contempló en la fe la primera comunidad de los discípulos (cf. 1 Jn 1,1-4).</p>

  <p>Cristo es la revelación y la luz del Padre, pero de modo oculto y humilde; algo interior que sólo los hombres de fe, como los profetas, los santos y María pueden comprender. Su gloria se manifestará en toda su potencia después, cuando desde la cruz atraiga todos a sí (cf. Jn 12,32). Puede parecer una paradoja que la cruz sea glorificación, pero todo se hace luminoso si pensamos que «Dios es amor» (1 Jn 4,10) y se manifiesta donde aparece el amor.</p>

  <p>¿Es también para nosotros Jesús el centro de la historia, nuestra morada y la plenitud de todas nuestras aspiraciones humanas?</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor Jesús, Verbo del Padre y luz de los hombres, te adoramos en esta vigilia de Navidad y esperamos gozosos tu venida, que una vez más lleva a cumplimiento las promesas de Dios. Iluminados por tu luz, creemos que eres Aquel que ama al hombre y que la única finalidad de tu vida es la salvación de todo hombre. La fe nos introduce en este misterio de vida, la experiencia nos lo enseña y tu Palabra de verdad nos guía en este camino de luz.</p>

  <p class="prayer">Verbo eterno del Padre, queremos ser tus primeros adoradores, adictos a la bondad y al bien, testigos de tu misericordia. Tú que no te ocultas a nadie, sino que a todos concedes tu divina luz, seas por siempre nuestra verdadera luz que alumbre a toda la humanidad. Apresuramos nuestro camino hacia la salvación, hacia el nuevo nacimiento, porque deseamos, a pesar de ser multiplicidad, reunirnos en un solo amor siguiendo el modelo de unidad del misterio trinitario en el que nos sumerges y renovar de este modo la alianza contigo.</p>

  <p class="prayer">Como la virgen María, lugar de la encarnación, concédenos saber interiorizar tu Palabra para descubrir cada vez más la hondura de este misterio dentro de nosotros mismos, misterio en el que «vivimos, nos movemos y existimos» (Hch 17,28), y llegar a ser contemplativos como María para no confundir esta Palabra con nuestro mismo ser, sino identificarnos con la que lleva al Verbo en sus entrañas y lo engendra como hijo suyo.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Feliz día, feliz hora, feliz tiempo: es el que con inefable anhelo todos los santos desde el origen del mundo esperaron (…). Dios está con nosotros. Hasta ahora Dios estaba sobre nosotros, pero hoy es el Emmanuel, hoy Dios está con nosotros en nuestra naturaleza, con nosotros con su gracia. Con nosotros en nuestra pobreza, con nosotros en su benignidad. Con nosotros en nuestra miseria, con nosotros en su misericordia. Con nosotros en la caridad, con nosotros en la piedad, con nosotros en la compasión. ¡Oh Emmanuel! ¡Oh Dios con nosotros!</p>
  <p>¿Qué hacéis, hijos de Adán? Dios está con nosotros. Con nosotros. No pudisteis, hijos de Adán, subir al cielo para estar con Dios, y ahora Dios ha bajado del cielo para ser el Emmanuel, el «Dios con nosotros» (…). Dichoso el que te abre la puerta del corazón, oh buen Jesús: pues entrarás. Tu adviento, Señor, lleva al corazón puro el mediodía de la luz celeste (Elredo de Rieval, <i>Sermones inéditos</i>, cit. en <i>Cristo desiderio del monaco</i>, Milán 1988, 157-158).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Bendito sea el Señor que ha visitado y redimido a su pueblo»</b> (Lc 1,68).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Cerremos la puerta detrás de nosotros. Escuchemos con oído atento la inefable melodía que resuena en el silencio de esta noche. El alma silenciosa y solitaria canta al Dios del corazón su canto más suave y afectuoso. Y puede confiar que él le escucha.</p>
  <p>De hecho, este canto no debe ya buscar al Dios amado más allá de las estrellas, en una luz inaccesible, donde habita y ninguno puede verle.</p>
  <p>Como es Navidad, como la Palabra se ha hecho carne, Dios está cerca, y la dulcísima palabra, la palabra del amor, encuentra su oído y su corazón en la sala más silenciosa del corazón. Y quien se ha detenido cerca de sí, aunque es de noche, en esta paz nocturna, en las honduras del corazón de Dios, percibe la dulce palabra del amor. Es preciso estar tranquilos, no temer la noche, hay que callar. De otro modo no se escucha nada.</p>
  <p>De hecho, la última cosa se dice solamente en el silencio de la noche, cuando, por la llegada llena de gracia de la Palabra en la noche de nuestra vida, se ha hecho Navidad, noche santa, noche de silencio (K. Rahner, <i>Dio si è fatto uomo</i>, Brescia 1990, 72-73).</p>

]}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
const $ = s => document.querySelector(s);
const content = $("#content");
const menu = $("#menu");
const crumb = $("#crumb");
let flat = []; // lista plana de todas las "páginas"
let currentIndex = -1;

/* Construir lista plana */
function buildFlat(){
  flat = [];
  flat.push({ id:"intro", title: DATA.intro.title, tag: DATA.intro.tag, data: DATA.intro, group:"Introducción" });
  DATA.weeks.forEach(w=>{
    w.days.forEach(d=>{
      flat.push({ id:d.id, title:d.title, tag:d.tag, data:d, group:w.title });
    });
  });
}

/* Construir menú */
function buildMenu(){
  menu.innerHTML = "";

  // Introducción
  const introBtn = document.createElement("button");
  introBtn.className = "dayitem";
  introBtn.dataset.id = "intro";
  introBtn.innerHTML = "Introducción<span class='mini'>Presentación y liturgia del Adviento</span>";
  introBtn.onclick = ()=>go("intro");
  menu.appendChild(introBtn);

  DATA.weeks.forEach(w=>{
    const g = document.createElement("div");
    g.className = "weekgroup";
    const head = document.createElement("div");
    head.className = "weekhead";
    head.innerHTML = "<span class='arrow'>▼</span>" + w.title;
    head.onclick = ()=>head.classList.toggle("closed") || g.querySelector(".daylist").classList.toggle("hidden");
    g.appendChild(head);

    const list = document.createElement("div");
    list.className = "daylist";
    w.days.forEach(d=>{
      const b = document.createElement("button");
      b.className = "dayitem";
      b.dataset.id = d.id;
      b.innerHTML = d.title + "<span class='mini'>" + d.tag.split("·").pop().trim() + "</span>";
      b.onclick = ()=>go(d.id);
      list.appendChild(b);
    });
    g.appendChild(list);
    menu.appendChild(g);
  });
}

/* Render de una página */
function render(page, opts){
  opts = opts || {};
  const isIntro = page.id === "intro";
  let html = "";
  html += "<h1 class='doc-title'>" + page.title + "</h1>";
  html += "<p class='doc-sub'>" + page.tag + "</p>";

  page.data.sections.forEach(sec=>{
    html += "<section class='sec'>";
    html += "<h3><span class='dot'></span>" + sec.t + "</h3>";
    html += sec.h;
    html += "</section>";
  });
  content.innerHTML = html;

  crumb.innerHTML = (isIntro ? "Introducción" : "Adviento") + " &nbsp;›&nbsp; <b>" + page.title + "</b>";

  // activo en menú
  document.querySelectorAll(".dayitem").forEach(el=>el.classList.toggle("active", el.dataset.id === page.id));

  // desplazar
  if (opts.keepScroll !== true) window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});

  // cerrar sidebar en móvil
  if (window.innerWidth <= 900) closeSidebar();
}

function go(id, opts){
  const i = flat.findIndex(x=>x.id === id);
  if (i < 0) return;
  currentIndex = i;
  render(flat[i], opts);
  try{ location.hash = id; }catch(e){}
}

/* ============================================================
   BUSCADOR
   ============================================================ */
let searchTimer = null;
$("#search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(()=>doSearch(q), 180);
});

function stripHtml(s){ const d=document.createElement("div"); d.innerHTML=s; return d.textContent || ""; }

function doSearch(q){
  if (q.length < 2){ render(flat[currentIndex]||flat[0]); return; }
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const results = [];

  flat.forEach(page=>{
    page.data.sections.forEach(sec=>{
      const text = stripHtml(sec.h);
      const low = text.toLowerCase();
      let all = true, firstIdx = -1;
      for (const w of words){
        const idx = low.indexOf(w);
        if (idx === -1){ all = false; break; }
        if (firstIdx === -1) firstIdx = idx;
      }
      if (all){
        results.push({ page, secTitle: sec.t, text, firstIdx, word: words[0] });
      }
    });
  });

  if (!results.length){
    content.innerHTML = "<h1 class='doc-title'>Sin resultados</h1><p class='doc-sub'>Búsqueda: " + escapeHtml(q) + "</p>" +
      "<p style='color:#a8b6cd'>No se encontraron coincidencias. Prueba con otra palabra (por ejemplo: <i>esperanza</i>, <i>Isaías</i>, <i>María</i>, <i>vigilad</i>, <i>Jordán</i>, <i>alegría</i>…).</p>";
    crumb.innerHTML = "Búsqueda";
    return;
  }

  let html = "<h1 class='doc-title'>Resultados de búsqueda</h1>";
  html += "<p class='doc-sub'>" + results.length + " coincidencias para «" + escapeHtml(q) + "»</p>";

  results.slice(0, 150).forEach(r=>{
    const start = Math.max(0, r.firstIdx - 90);
    let snippet = r.text.substring(start, start + 260);
    if (start > 0) snippet = "…" + snippet;
    if (start + 260 < r.text.length) snippet += "…";
    // resaltar
    words.forEach(w=>{
      snippet = snippet.replace(new RegExp(escapeReg(w), "gi"), m => "<mark>" + m + "</mark>");
    });
    html += "<div class='result' data-goto='" + r.page.id + "'>" +
              "<div class='rhead'>" + r.page.title + " · " + r.secTitle + "</div>" +
              "<div class='rtext'>" + snippet + "</div>" +
            "</div>";
  });

  content.innerHTML = html;
  crumb.innerHTML = "Búsqueda";
  document.querySelectorAll(".result").forEach(el=>{
    el.onclick = ()=>{ $("#search").value=""; go(el.dataset.goto); };
  });
  window.scrollTo({top:0});
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* ============================================================
   BOTÓN "HOY"
   ============================================================ */
function findToday(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();

  // Fechas fijas de diciembre
  if (m === 12 && d >= 17 && d <= 24){
    const id = d + "dic";
    if (flat.some(x=>x.id===id)) return id;
  }
  if (m === 12 && d === 8 && flat.some(x=>x.id==="inmaculada")) return "inmaculada";

  // Calcular inicio de Adviento: 4º domingo antes de Navidad
  const christmas = new Date(y, 11, 25);
  const christmasDow = christmas.getDay(); // 0 dom
  const fourthSunday = new Date(christmas);
  fourthSunday.setDate(25 - (christmasDow === 0 ? 7 : christmasDow));
  const adventStart = new Date(fourthSunday);
  adventStart.setDate(fourthSunday.getDate() - 21);

  const today = new Date(y, m-1, d);
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (t0 >= adventStart && t0 <= christmas){
    const diffDays = Math.floor((t0 - adventStart)/86400000);
    const week = Math.floor(diffDays/7) + 1;
    const dow = t0.getDay();
    // ciclo litúrgico
    const cyc = (y % 3 === 0) ? "A" : (y % 3 === 1) ? "B" : "C";

    if (dow === 0){
      const order = ["1d","2d","3d","4d"];
      const id = order[week-1] + "-" + cyc;
      if (flat.some(x=>x.id===id)) return id;
    } else {
      const names = ["dom","lun","mar","mie","jue","vie","sab"];
      const id = week + "-" + names[dow];
      if (flat.some(x=>x.id===id)) return id;
    }
    // fallback: primer domingo de la semana
    const fb = week + "d-" + cyc;
    if (flat.some(x=>x.id===fb)) return fb;
  }
  // Fuera de Adviento: devolver el primer domingo
  return "1d-" + ((y % 3 === 0) ? "A" : (y % 3 === 1) ? "B" : "C");
}

/* ============================================================
   ÍNDICE (TOC)
   ============================================================ */
function showToc(){
  let html = "<h1 class='doc-title'>Índice general</h1><p class='doc-sub'>Todo el contenido del volumen</p>";
  html += "<section class='sec'><h3><span class='dot'></span>Introducción</h3><div class='tocgrid'>";
  html += "<div class='toccard' data-goto='intro'><div class='tt'>Presentación</div><div class='ts'>La lectio divina en la vida cristiana</div></div>";
  html += "<div class='toccard' data-goto='intro'><div class='tt'>La liturgia de la Palabra</div><div class='ts'>El misterio de la espera y venida de Dios</div></div>";
  html += "</div></section>";

  DATA.weeks.forEach(w=>{
    html += "<section class='sec'><h3><span class='dot'></span>" + w.title + "</h3><div class='tocgrid'>";
    w.days.forEach(d=>{
      html += "<div class='toccard' data-goto='" + d.id + "'><div class='tt'>" + d.title + "</div><div class='ts'>" + d.tag + "</div></div>";
    });
    html += "</div></section>";
  });

  content.innerHTML = html;
  crumb.innerHTML = "Índice general";
  document.querySelectorAll(".toccard").forEach(el=>{
    el.onclick = ()=>go(el.dataset.goto);
  });
  window.scrollTo({top:0});
}

/* ============================================================
   EVENTOS
   ============================================================ */
$("#btnToday").onclick = ()=>{ go(findToday()); };
$("#btnToc").onclick = showToc;

$("#btnPrev").onclick = ()=>{
  if (currentIndex > 0) go(flat[currentIndex-1].id);
};
$("#btnNext").onclick = ()=>{
  if (currentIndex >= 0 && currentIndex < flat.length-1) go(flat[currentIndex+1].id);
};

$("#burger").onclick = ()=>openSidebar();
$("#backdrop").onclick = ()=>closeSidebar();

function openSidebar(){ $("#sidebar").classList.add("open"); $("#backdrop").classList.add("show"); }
function closeSidebar(){ $("#sidebar").classList.remove("open"); $("#backdrop").classList.remove("show"); }

window.addEventListener("scroll", ()=>{
  $("#toTop").classList.toggle("show", window.scrollY > 500);
});
$("#toTop").onclick = ()=>window.scrollTo({top:0, behavior:"smooth"});

document.addEventListener("keydown", e=>{
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape"){ e.target.value=""; render(flat[currentIndex]); }
    return;
  }
  if (e.key === "ArrowLeft") $("#btnPrev").click();
  if (e.key === "ArrowRight") $("#btnNext").click();
  if (e.key === "/"){ e.preventDefault(); $("#search").focus(); }
});

window.addEventListener("hashchange", ()=>{
  const id = location.hash.replace("#","");
  if (id && flat.some(x=>x.id===id) && id !== flat[currentIndex]?.id) go(id, {keepScroll:false});
});

/* ============================================================
   INICIO
   ============================================================ */
buildFlat();
buildMenu();

const startId = location.hash ? location.hash.replace("#","") : null;
if (startId && flat.some(x=>x.id===startId)) go(startId);
else go("intro");
</script>
</body>
</html>
