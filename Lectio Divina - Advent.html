<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectio Divina · Adviento</title>
<style>
:root{
  --bg:#0f1420;
  --bg2:#151c2c;
  --panel:#1a2333;
  --panel2:#212c40;
  --line:#2c3away;
  --line:#2c3a52;
  --txt:#e8edf6;
  --txt2:#a8b6cd;
  --accent:#c9a24a;
  --accent2:#8b6f2e;
  --violet:#7a5cc4;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:330px;flex:0 0 330px;
  background:linear-gradient(180deg,#141b29,#101725);
  border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;
  display:flex;flex-direction:column;
  transition:transform .25s ease;
  z-index:60;
}
.brand{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--line);
}
.brand h1{
  margin:0;font-size:1.05rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);font-weight:700;
}
.brand p{margin:4px 0 0;font-size:.75rem;color:var(--txt2)}
.brand .sub{font-size:.7rem;color:#6d7c96;margin-top:6px}

.searchbox{padding:12px;border-bottom:1px solid var(--line)}
.searchbox input{
  width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:#0c121d;color:var(--txt);
  font-size:.9rem;outline:none;
}
.searchbox input:focus{border-color:var(--accent)}

.navbtns{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.navbtns button{
  flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-size:.78rem;cursor:pointer;
  font-weight:600;transition:.15s;
}
.navbtns button:hover{background:var(--panel2);border-color:var(--accent)}
.navbtns button.today{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1305;border-color:transparent}

#menu{overflow-y:auto;flex:1;padding:8px 8px 40px}
#menu::-webkit-scrollbar{width:8px}
#menu::-webkit-scrollbar-thumb{background:#2c3a52;border-radius:8px}

.weekgroup{margin-bottom:6px}
.weekhead{
  display:flex;align-items:center;gap:8px;
  padding:10px 10px;margin-top:6px;border-radius:10px;
  cursor:pointer;user-select:none;font-weight:700;font-size:.82rem;
  color:var(--accent);letter-spacing:.04em;text-transform:uppercase;
  background:#131a28;
}
.weekhead:hover{background:#182134}
.weekhead .arrow{transition:.2s;font-size:.7rem;color:var(--txt2)}
.weekhead.closed .arrow{transform:rotate(-90deg)}
.daylist{display:block;padding-left:4px}
.daylist.hidden{display:none}

.dayitem{
  display:block;width:100%;text-align:left;
  padding:8px 10px;margin:2px 0;border-radius:9px;
  background:transparent;border:none;color:var(--txt2);
  cursor:pointer;font-size:.83rem;transition:.15s;
  border-left:3px solid transparent;
}
.dayitem:hover{background:#1b2436;color:var(--txt)}
.dayitem.active{background:#1e2a40;color:var(--accent);border-left-color:var(--accent);font-weight:600}
.dayitem .mini{display:block;font-size:.7rem;color:#67758f;margin-top:2px}
.dayitem.active .mini{color:#9b8b5f}

/* ---------- MAIN ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(15,20,32,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:12px;
}
#burger{
  display:none;background:var(--panel);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:1rem;
}
#crumb{font-size:.82rem;color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumb b{color:var(--accent)}
.toolbar{display:flex;gap:8px}
.toolbar button{
  background:var(--panel);border:1px solid var(--line);color:var(--txt2);
  border-radius:10px;padding:7px 11px;cursor:pointer;font-size:.78rem;
}
.toolbar button:hover{color:var(--txt);border-color:var(--accent)}

#content{padding:28px 34px 90px;max-width:900px;width:100%;margin:0 auto}

/* ---------- ARTICLE ---------- */
.doc-title{
  font-size:1.9rem;line-height:1.2;margin:0 0 6px;
  color:#fff;font-weight:700;letter-spacing:-.01em;
}
.doc-sub{color:var(--accent);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 22px;font-weight:600}
.sec{margin:0 0 26px}
.sec h3{
  font-size:.95rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin:0 0 12px;padding-bottom:8px;
  border-bottom:1px solid #26324a;font-weight:700;
  display:flex;align-items:center;gap:8px;
}
.sec h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px}
.sec p{margin:0 0 13px;color:#dbe3f0;font-size:1rem}
.sec .reading{
  background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--violet);
  border-radius:10px;padding:14px 16px;margin:0 0 16px;
}
.sec .reading .ref{
  display:block;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--violet);font-weight:700;margin-bottom:8px;
}
.sec .reading p{color:#c8d3e6;font-size:.95rem}
.sec blockquote{
  margin:0 0 14px;padding:12px 16px;background:#141c2b;
  border-left:3px solid var(--accent);border-radius:8px;
  color:#c4cfe2;font-style:italic;font-size:.95rem;
}
.sec .note{color:var(--txt2);font-size:.93rem}
.sec b{color:#fff}
.sec .prayer{color:#e6d9b8}

/* ---------- SEARCH ---------- */
.result{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.15s;
}
.result:hover{border-color:var(--accent);background:var(--panel2)}
.result .rhead{font-size:.78rem;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.result .rtext{font-size:.9rem;color:#c3cee1}
.result mark{background:rgba(201,162,74,.3);color:#ffe9b0;border-radius:3px;padding:0 2px}

/* ---------- TOC ---------- */
.tocgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.toccard{
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;cursor:pointer;transition:.15s;
}
.toccard:hover{border-color:var(--accent);transform:translateY(-2px)}
.toccard .tt{font-size:.9rem;font-weight:600;color:var(--txt)}
.toccard .ts{font-size:.74rem;color:var(--txt2);margin-top:3px}

/* ---------- BACKDROP / RESPONSIVE ---------- */
#backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);width:300px;flex:0 0 300px}
  #sidebar.open{transform:translateX(0)}
  #burger{display:block}
  #backdrop.show{display:block}
  #content{padding:20px 18px 80px}
  .doc-title{font-size:1.5rem}
}
.toplink{
  position:fixed;right:18px;bottom:18px;z-index:50;
  background:var(--panel);border:1px solid var(--line);color:var(--txt2);
  width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.1rem;
  display:none;align-items:center;justify-content:center;
}
.toplink.show{display:flex}
.toplink:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>

intro: {

  sections: [
    { t:"Presentación · La lectio divina en la vida cristiana", h:`
<p>Te sugiero un modo práctico y sencillo de vida espiritual, basado en la Palabra de Dios, para hacer del leccionario ferial y festivo tu libro de educación en la fe y de oración de cada día: el camino de la <b>lectio divina</b>. Esta práctica no es para una elite, es algo que interesa a todo cristiano y a toda la Iglesia: la Palabra de Dios es para todos. Es el momento de confrontarse personalmente con Dios. Es vivir tu vida como prolongación de la Palabra escuchada, interiorizada y orada, viviéndola en los actos de la jornada en presencia de Dios.</p>

<p>Esta «lectura de las Sagradas Escrituras» cotidiana y familiar ha sido vivamente recomendada por la Tradición de la Iglesia y más recientemente por el concilio Vaticano II afirmando:</p>

<blockquote>El Santo Sínodo recomienda insistentemente a todos los fieles, especialmente a los religiosos, la lectura asidua de la Escritura para que adquieran «la ciencia suprema de Jesucristo» (Flp 3,8), «pues desconocer la Escritura es desconocer a Cristo»… [los fieles] recuerden que a la lectura de la Sagrada Escritura debe acompañar la oración para que se realice el diálogo de Dios con el hombre, pues «a Dios hablamos cuando oramos, a Dios escuchamos cuando leemos los oráculos divinos» (DV 25).</blockquote>

<h3 style="margin-top:26px"><span class="dot"></span>1. Invoca al Espíritu Santo</h3>

<p>Antes de comenzar la lectura, invoca al Espíritu Santo para que te disponga a escuchar la Palabra de Dios con corazón dócil y disponible. Sólo el Espíritu puede abrir tu inteligencia y tu corazón al sentido de lo que lees.</p>

<h3><span class="dot"></span>2. Lee la Palabra de Dios (= lectio)</h3>

<p>Esta etapa de la lectura corresponde a la de tu búsqueda del sentido literal-histórico, tratando de ser respetuoso con el texto. Puedes utilizar algún subsidio bíblico y un comentario serio y sencillo como el que te hemos preparado en este volumen.</p>

<p>Pero recuerda siempre que en esta fase la condición fundamental para «entrar» en la Palabra es ponerte a la escucha del Señor: cuando lees los textos sagrados es Él quien te habla. El silencio inicial que debes observar no es sólo un silencio físico o psicológico: se trata del silencio de tu vida ante el don que Dios te hace y que es Él mismo. El silencio es el preámbulo de la escucha. En el silencio te ejercitarás en conjugar la Palabra con la escucha, irás adquiriendo esa capacidad de recogimiento vigilante, primer requisito para comprometerte en ese proceso complejo que es la escucha de Dios. Si comienzas a leer así las Sagradas Escrituras, «Dios vuelve a pasear en el paraíso terrenal» contigo, según indica san Ambrosio.</p>

<h3><span class="dot"></span>3. Medita la Palabra de Dios (= meditatio)</h3>

<p>La siguiente etapa es la meditación. Meditar es reflexionar en los valores permanentes del texto bíblico; es buscar el sabor de la Palabra y no lo científico; es «rumiar» la Palabra tratando de asimilarla con un esfuerzo de interioridad y concentración; es cerrar los ojos ante el Señor y confrontar el texto con la vida indicando las actitudes y sentimientos que la Palabra de Dios te transmite.</p>

<p>De hecho, puedes ayudarte planteándote preguntas sobre la página que has leído: ¿cuál es la idea y el valor fundamental de la perícopa?, ¿qué importancia tiene para mí?, ¿qué me sugiere y cómo me interpela?, ¿qué comportamientos y sentimientos me transmite?, ¿cómo puedo iluminarlos con mi vida?</p>

<p>La meditación es, pues, la reflexión de la Palabra escuchada o leída para que surja el valor, masticarla lentamente confrontándola con la vida. La Palabra no se «rumia» sólo en el tiempo dedicado a la meditación, sino a lo largo de la jornada, haciéndola resonar dentro de ti y desmenuzándola en tus acciones cotidianas. De este modo la meditación te ayuda a captar el «sentido espiritual» de las Escrituras, es decir, el sentido que el Espíritu de Dios te desea comunicar hoy por su Palabra. San Juan Casiano decía:</p>

<blockquote>Instruidos por lo que nosotros mismos sentimos, ya no nos fijamos en el texto como algo meramente escuchado, sino algo que experimentamos y palpamos; no como historia extraña e inaudita, sino como algo que toca lo más hondo del corazón, como si se tratase de sentimientos que forman nuestro propio ser.</blockquote>

<p>Repetimos: no es la lectura la que nos introduce en el sentido de las palabras, sino la experiencia adquirida anteriormente en la vida.</p>

<h3><span class="dot"></span>4. Ora la Palabra de Dios (= oratio)</h3>

<p>Si se ejecuta bien la meditación de la Palabra de Dios, necesariamente desemboca en la oración, que es la etapa siguiente en el proceso de la lectio divina. Orar es responder a Dios después de escucharle; es decir sí a su voluntad y al proyecto que tiene sobre ti. San Agustín afirmaba: «En tu oración hablas a Dios. Cuando lees la Sagrada Escritura, Dios te habla; cuando oras, tú hablas a Dios». En la meditación descubres lo que te dice Dios en el secreto de la conciencia. Ahora te toca a ti responder a su Palabra con la oración.</p>

<p>Cuando la Palabra se ha incorporado a tu mundo interior, la oración la hace «rebotar» a Dios en vocativo. La oración es el momento en el que te empapas de los sentimientos religiosos que el texto te sugiere y suscita en tu interior. La Palabra de Dios, hecha oración, se convierte en ti motivo de alabanza, de gratitud, de súplica, de confianza, de compunción, de bendición. Decía san Agustín:</p>

<blockquote>Si el texto ora, orad; si llora, llorad; si es gratitud, agradeced; si es un texto de esperanza, esperad; si muestra temor, temed. Las cosas que escucháis en el texto bíblico son vuestro propio espejo.</blockquote>

<p>La oración es devolver a Dios la Palabra que él nos ha dado. Transformar la Palabra en oración significa reflejarte por la Escritura en tus realidades cotidianas, tejidas de gozos y amarguras, conquistas y derrotas, y confrontarlas con la voluntad de Dios. Es pedir con confianza filial y perseverante la fuerza de Dios para sacar adelante las obligaciones y situaciones, como Dios quiere, deseando realmente lo que pides.</p>

<p>Mientras exista divorcio entre oración y acción no será posible lograr una oración encarnada ni una acción vivida en profundidad espiritual. De hecho sólo el que ama sinceramente transforma en la oración las realidades de la vida, puesto que orar es prepararse a la acción; orar no se reduce a sentimentalismo, sino que consiste en buscar la voluntad de Dios y practicarla con alegría y generosidad.</p>

<h3><span class="dot"></span>5. Contempla la Palabra de Dios (= contemplatio)</h3>

<p>No te debes preocupar por llegar a esta etapa de la lectio. Si has procedido correctamente en el camino anterior, será el mismo Señor quien te introduzca en ella. La contemplación no es una técnica ni una añadidura externa; es un don del Espíritu que brota de la experiencia de la lectio bien hecha: es el momento pasivo de la intimidad, en el que la acción corresponde a Dios; es conocer a Dios con la experiencia del corazón, como lo hicieron los Padres y Maestros de vida espiritual cuyo patrimonio espiritual utilizamos en este libro al presentar la etapa de la contemplación.</p>

<p>El Señor te introducirá, cuando crea oportuno, en la contemplación de su misterio de Padre, de Hijo y de Espíritu Santo. Contemplar la Palabra es olvidar los detalles para llegar a lo esencial. Entonces descubrirás, con el corazón y no con la mente, tu vida y misterio en el de Dios, en un diálogo sencillo, de adoración, de conocimiento y experiencia de un Padre que te ama como hijo. Sentirás la necesidad de mirar sólo a Jesús, de descansar en él, de abrirte al amor que te tiene, de acoger el reino de Dios dentro de ti con la certeza de estar en comunión de vida con el Señor.</p>

<p>La contemplación es mirar con admiración, en silencio, el misterio de Dios-Padre, el de Jesús-Amigo y el del Espíritu-Amor. Es encontrar la límpida y transparente participación de la realidad de Dios propia de los puros, los sencillos, los pobres de Dios. No es fruto de carismas especiales ni exige esfuerzos suplementarios, ni mucho menos entrar en éxtasis: es dejar actuar en ti al Espíritu de Dios, consciente de que todo es don y gratuidad. La contemplación, como resultado de la lectio divina, es la actitud de quien se zambulle en los acontecimientos para descubrir y gustar en ellos la presencia activa y creativa de la Palabra de Dios. Además, es la actitud del que se compromete en el proceso transformador que la Palabra obra en la historia humana. La contemplación realiza y pone en práctica la Palabra con una sabrosa experiencia, anticipando ese gozo que «Dios tiene preparado a los que le aman» (1 Cor 2,9).</p>

<p>En este punto tus situaciones personales pasan a segundo plano y la experiencia objetiva de la contemplación te llevará necesariamente a la praxis, a la evangelización, a la caridad del servicio siguiendo el modelo de la Virgen María, que va al encuentro del hombre para comunicarle a Dios su presencia y los grandes valores de la vida humana y espiritual. Entonces —como indica atinadamente E. Bianchi— la lectio divina</p>

<blockquote>llega al umbral de la visión, se hace escatología, prepara a ese momento final que es la venida de Cristo, cuando la contemplación será eterna. La lectio divina produce ese fruto que acelera el acontecimiento final y definitivo, y está junto a la profecía.</blockquote>

<h3><span class="dot"></span>6. Actúa y conserva la Palabra en la vida (= actio)</h3>

<p>Las etapas precedentes, aunque importantes en sí mismas, tienen la función de orientarse a la vida. Por eso te sugiero vivir una palabra o frase sacada de la Palabra de Dios. No se puede dar por concluido el proceso de la lectio si no logra hacer de la Palabra una escuela de vida. Conseguirás esta meta cuando experimentes los frutos del Espíritu, típicos de la lectio. Se trata de la paz interior que desemboca en el gozo y gusto por la Escritura; la capacidad de discernir entre lo que es esencial y obra de Dios y lo que es vano y obra del maligno; la decisión de elegir y actuar en concreto según los valores evangélicos.</p>

<p>Madeleine Delbrel, hablando de la Escritura, afirma una verdad digna de meditarla y vivirla:</p>

<blockquote>El evangelio es el libro de la vida del Señor y está escrito para que se convierta en el libro de nuestra vida. No se escribió sólo para entenderlo; leerlo es como encaminarse hacia el umbral del misterio. No sólo hay que leerlo, sino interiorizarlo. Cada Palabra es Espíritu y vida, está esperando un corazón ávido para precipitarse en él.<br><br>Las palabras de los libros humanos se comprenden y ponderan. Las Palabras del evangelio son inesperadas: no las asimilamos; son ellas las que nos asimilan, nos modelan, nos modifican.</blockquote>

<p>La Palabra debe convertirse en forma de tu existencia, como lo fue para Jesús. Se vive en el día a día de tu vida, y es que el evangelio se predica así, se grita con una vida coherente.</p>

<p>Como puedes comprobar en el modelo de la lectio divina diaria que tienes entre manos, te proponemos también un texto «para la lectura espiritual», sacado de autores contemporáneos o modernos. Lo hacemos con la finalidad de que resuene en tu corazón durante el día la profundidad de la Palabra de Dios. De hecho, la Biblia es la única fuente de la lectio divina. Sin embargo, junto a la Escritura, como una interpretación válida del texto sagrado, no debes olvidar los grandes comentarios escriturísticos que han dejado los Padres de la Iglesia y, además, las enseñanzas de los santos e intérpretes modernos de la historia humana.</p>

<p>Antes de cerrar la Biblia, haz un propósito concreto que te ayude a crecer en la vida cristiana, luego finaliza tu encuentro con la Palabra de Dios con una oración como la siguiente:</p>

<blockquote class="prayer">Padre bueno, tú que eres la fuente del amor, te agradezco el don que me has hecho: Jesús, palabra viva y alimento de mi vida espiritual.<br><br>
Haz que lleve a la práctica la Palabra de tu Hijo que he leído y acogido en mi interior, de suerte que sepa contrastarla con mi vida.<br><br>
Concédeme transformarla en lo cotidiano para que pueda hallar mi felicidad en practicarla y ser, entre los hermanos y hermanas con los que vivo, un signo vivo y testimonio auténtico de tu evangelio de salvación.<br><br>
Te lo pido por Cristo nuestro Señor. Amén.</blockquote>
`},

    { t:"La liturgia de la Palabra en el Tiempo de adviento", h:`
<h3><span class="dot"></span>1. El misterio de la espera y venida de Dios en el corazón del hombre actual</h3>

<p>El hombre del nuevo milenio, el hombre que se considera «posmoderno», experimenta la tensión entre espera y no-espera. En cierto modo es ya incapaz de espera, bien porque vive en lo inmediato y se conforma con ello, bien porque es consciente de sus numerosos logros, de la cantidad de proyectos hechos realidad gracias a su espíritu emprendedor.</p>

<p>Sin embargo, si juntamos tantas manifestaciones, vemos que este hombre no ha avanzado mucho respecto al hombre primitivo: se detiene a preguntar a los astros, confía a hechiceros sus males, recurre a diversos magos en busca de un suplemento de energía para poder superar los límites en los que se encuentra encerrado, se refugia en mundos artificiales que le procuran las drogas y las múltiples ofertas de las agencias turísticas. Pero, sin saberlo, lleva en el corazón una esperanza de salvación que experimenta diariamente que no está a su alcance ni en las posibilidades de su inteligencia ni en su fuerza. Esta espera de salvación ¿está destinada a estar siempre en el corazón como un vacío insaciable, o un grito en el desierto?</p>

<p>Conocemos la historia de dos mendigos que esperan a un cierto Godot que venga a remediarlos. No saben nada de él, ni siquiera conocen la fecha o el lugar de la cita. Pasan el tiempo esperando. De pronto se acerca un muchacho con un mensaje indicando que Godot llegaría al día siguiente. Pero al día siguiente llega con la misma misiva: ¡mañana! Y los dos pobretones continúan en su absurda espera.</p>

<p>Alguno podría ver reflejada en estos dos pobres de la obra <i>Esperando a Godot</i> de Samuel Beckett la situación del hombre «posmoderno»: un condenado a esperar un encuentro que nunca llegará. Sería un verdadero drama absurdo, un agitarse en un desierto sin descubrir nada, sin lograr llegar a un oasis, un continuo acariciar esperanzas irrealizables, un desear y construir proyectos con la consistencia de castillos de arena construidos en la playa.</p>

<p>Para que la espera no carezca de sentido, exige esperar a alguien, alguien que realmente viene, que se deja encontrar… de este modo la espera se transforma en un ir al encuentro, en estar preparados, vigilantes, despiertos… La espera se vive como un movimiento, un dinamismo, un anhelo gozoso.</p>

<blockquote>La espera constituye la misma trama de la vida. Es su fuerza y debilidad. Impaciente y serena, la espera es compañera de la vida en sus búsquedas y encuentros. Contiene sus secretos. A veces es su freno y su trampolín de lanzamiento, su memoria y el latido de su corazón… La espera es de algún modo nosotros mismos, con nuestras cualidades y defectos, con nuestras certezas y nuestros interrogantes, con nuestras necesidades y nuestros deseos (E. Debust).</blockquote>

<p>La espera siempre rejuvenece al hombre, dispuesto a partir, con la vieja audacia de un loco vuelo. Se alimenta con el presentimiento de una novedad inminente, que está a las puertas y no hay que dejar escapar. Los ojos están bien abiertos, la mano dispuesta: todo es tensión hacia el futuro con la seguridad íntima de que va a despuntar la luz de la mañana, que finalmente: ¡Le podremos encontrar! Y habrá fiesta.</p>

<h3><span class="dot"></span>2. El misterio de la espera y venida de Dios, proclamado en la liturgia</h3>

<p><b>El gozo de la espera y la certeza de la venida</b></p>

<p>La Palabra de Dios proclamada en adviento resume las esperas y búsquedas del hombre iluminando cuanto se agita en el corazón y en la mente del hombre; invita a perseverar en la espera y, a la vez, anuncia el cumplimiento de esta espera.</p>

<p>Desde su atalaya el lector, como atento centinela, nos asegura que no esperamos a un Godot que nunca llegará, sino a alguien que va a llegar. A nuestra pregunta: «Centinela, ¿cuánto queda de la noche?», responde: «Viene la mañana…» (Is 21,11-12).</p>

<p>Este tiempo que nos separa de la venida del Señor, este «entretiempo», está lleno de un estremecimiento de gozo, bien conocido por la esposa del Cantar de los Cantares:</p>

<blockquote>«¡La voz de mi amado!<br>Mirad cómo viene saltando por los montes,<br>brincando por las colinas…<br>Se ha parado detrás de nuestra tapia…» (Cant 2,8-9: 21 de diciembre).<br><br>
«Nosotros esperamos al Señor,<br>Él es nuestro socorro y nuestro escudo;<br>Él es la alegría de nuestro corazón» (Sal 32: 21 de diciembre).</blockquote>

<p><b>Los ritos de preparación</b></p>

<p>Es un tiempo de felicidad marcado por los ritos de preparación del corazón: preparar el camino, allanarlo, separar el grano de la paja, tomar el baño purificador…</p>

<blockquote>«Una voz grita:<br>Preparad en el desierto un camino al Señor,<br>allanad en la estepa una calzada para nuestro Dios.<br>Que se eleven los valles, y los montes y colinas se abajen;<br>que lo torcido se enderece y lo escabroso se allane» (Is 40,3-5: Segundo domingo B).<br><br>
«Arrepentíos, porque está llegando el reino de los cielos» (Mt 3,2).</blockquote>

<p>En la voz del lector resuenan las palabras y acontecimientos de los maestros y modelos del adviento: <b>Isaías, Juan Bautista, María, José</b>.</p>

<p><b>Isaías:</b> es el profeta que expresa la esperanza de Israel, suscita la espera del hombre anunciando su próximo cumplimiento en el Salvador. No hay motivo para dudar de Dios: cumplirá sus promesas, no tardará. Él, creador de cielo y tierra, tiene poder de redimir a Israel creando un nuevo éxodo (48,13). La salvación será una nueva creación (45,7-8).</p>

<p><b>Juan Bautista:</b> último de los profetas, resume en su persona y palabra la historia precedente justo en el momento de su cumplimiento. Se presenta con la misión de preparar los caminos del Señor (cf. Is 40,3), de ofrecer a Israel el «conocimiento de la salvación» consistente en «el perdón de los pecados» (cf. Lc 1,77-78); finalmente es quien puede señalar a Cristo presente en medio de su pueblo (cf. Jn 1,29-34). Desea ceder el lugar a Cristo, que debe crecer, mientras él debe menguar (cf. Jn 1,19-28). Él es la voz potente que despierta sanas inquietudes en las conciencias adormecidas de los hombres.</p>

<p><b>María</b> realiza en su persona lo que los profetas habían dicho de la «hija de Sión». En ella culmina la espera mesiánica de todo el pueblo de Dios del Antiguo Testamento. Asumiendo el proyecto de Dios y pronunciando su «sí» al ángel, inaugura el tiempo del cumplimiento y el hijo de Dios entra en el mundo como el «nacido de mujer» (Gal 4,4); así salva al mundo desde el interior mismo de la realidad humana. Las genealogías de Jesús y la anunciación nos recuerdan el misterio de la «asunción» de lo humano por parte de Dios y la «inserción» de lo humano en Dios.</p>

<p><b>José</b>, el esposo de María, hombre justo, de la estirpe de David, es el signo del cumplimiento de la promesa de Dios a su antepasado real: «mantendré después de ti el linaje salido de tus entrañas, y consolidaré su reino» (2 Sm 7,12). Es el eslabón que, a través de David del que desciende, une a Cristo con la gran «Promesa», es decir, con Abrahán. Por ser legalmente «hijo de José» (Lc 4,22) Jesús puede llamarse y ser saludado con el título mesiánico de «hijo de David» (cf. Mt 22,41-46).</p>

<h3><span class="dot"></span>El Leccionario dominical</h3>

<p>La liturgia de la Palabra fija su atención en primer lugar en la última venida de Cristo, tratando de descubrir su venida en las celebraciones litúrgicas y a lo largo de la historia humana. Esquemáticamente:</p>

<p><b>Primer domingo:</b> la liturgia nos invita a considerar seriamente la última venida de Cristo; el Señor viene como juez de paz (año A), redentor (B), libertador (C). Se nos invita a vigilar y orar.</p>

<p><b>Segundo domingo:</b> el Señor viene como juez justo (año A), con poder (B) y esplendor (C). Juan Bautista proclama al hombre de hoy el comportamiento adecuado: conversión, preparar el camino. Es una invitación a tomar las cosas en serio, a ir a la raíz, a personalizar al máximo.</p>

<p><b>Tercer domingo:</b> se desplaza el acento de la última venida de Jesús a su «próxima» venida. Sigue siendo el protagonista Juan Bautista: interrogado (año B) y él mismo se pregunta (C) sobre Jesús; lo descubre como luz (B) y como el que bautiza en el Espíritu (C). Quien recorre la experiencia de Juan descubre la actitud fundamental del adviento, el gozo que brota del Espíritu (B) y de la proximidad del Señor (C) como salvador (A).</p>

<p><b>Cuarto domingo:</b> centrado en el nacimiento de Cristo en la Virgen María, que acoge el plan de Dios. Con el anuncio a José (año A) y a María (B) comienza una nueva historia; en las dos madres que se abrazan (C) se encuentran ambos Testamentos. La realización de las profecías tiene lugar gracias a ciertas actitudes marianas: disponibilidad, acogida.</p>

<h3><span class="dot"></span>El Leccionario ferial</h3>

<p>Sintetizando al máximo: tengamos presente que en los días feriales se lee progresivamente el libro de Isaías; por consiguiente, con vistas a la interpretación deberemos partir del tema o acontecimiento que sugiere esta lectura. Por otra parte, la perícopa evangélica casi siempre es de Mateo, el evangelista que se preocupa de subrayar cómo las Escrituras se cumplen en Jesús; el anuncio de Isaías (primera lectura) se cumple en Jesús (evangelio).</p>

<p>Aparece una sabia pedagogía en la estructura del leccionario: no comienza con «denuncias» o invitación a la conversión (ver el ciclo de Juan Bautista), sino anunciando lo positivo y la belleza de las promesas, para suscitar esperanza y deseo, para abrirse al acontecimiento.</p>

<p>Finalmente podemos ver cierto desarrollo vinculado a los personajes-guía del adviento:</p>

<p><b>1. Ciclo de Isaías</b></p>

<p><b>Primera semana</b></p>
<p>Lunes: llega la salvación de todos.<br>
Is 2,1-5: el Señor reúne a todos los pueblos.<br>
Mt 8,5-11: vendrán muchos de oriente a occidente.</p>

<p>Martes: El que viene posee el Espíritu del Señor.<br>
Is 11,1-9: el Espíritu del Señor reposará sobre él.<br>
Lc 10,21-24: Jesús se alegró en el Espíritu Santo.</p>

<p>Miércoles: invitación a participar en el banquete de vida.<br>
Is 25,6-10a: El Señor invita a todos a su banquete y vence la muerte y el dolor.<br>
Mt 15,29-37: Jesús cura a muchos y multiplica los panes.</p>

<p>Jueves: la ciudad de los justos.<br>
Is 26,1-6: Abrid las puertas al pueblo justo.<br>
Mt 7,21.24-27: La casa sobre roca.</p>

<p>Viernes: ver con ojos nuevos.<br>
Is 29,17-24: Los ojos de los ciegos verán.<br>
Mt 9,27-31: Curación de dos ciegos.</p>

<p>Sábado: el Maestro que guía.<br>
Is 30,19-21.23-26: Tus ojos verán a tu Maestro.<br>
Mt 9,35-10,1.5-7: La mies es abundante.</p>

<p><b>Segunda semana (ciclo de Juan Bautista)</b></p>
<p>Jueves: Juan y la grandeza del reino del redentor.<br>
Is 41,13-20: tu Redentor es el santo de Israel.<br>
Mt 11,11-15: Juan Bautista, el más grande de los nacidos, el más pequeño del Reino.</p>

<p>Viernes: invitación a la escucha.<br>
Is 48,17-19: si hubieras atendido a mis mandatos.<br>
Mt 11,16-19: no han escuchado ni a Juan ni al Hijo del hombre.</p>

<p>Sábado: Juan, nuevo Elías, invita a reconocer los signos de la venida.<br>
Eclo 48,1-4.9-11: Elías volverá.<br>
Mt 17,10-13: en él Elías ya ha venido y no le han reconocido.</p>

<p><b>Tercera semana</b></p>
<p>Lunes: discernir la misión de Juan y la de Cristo como obra del cielo.<br>
Nm 24,2-7.15-17: oráculo de Balaán: despunta una estrella de Jacob.<br>
Mt 21,23-27: el bautismo de Juan, ¿de dónde venía, del cielo o de los hombres?</p>

<p>Martes: reconocerse pobres y pecadores para descubrir la venida del Reino.<br>
Sof 3,1-2.9-13: Se promete la salvación mesiánica a los pobres y pecadores.<br>
Mt 21,28-32: vino Juan y no le han creído.</p>

<p>Miércoles: Juan se pregunta por la venida de Cristo.<br>
Is 45,6-8.18.21-25: Cielos, destilad de lo alto.<br>
Lc 7,19-23: anunciad a Juan lo que habéis visto y oído.</p>

<p>Jueves: la fidelidad esponsal de Dios.<br>
Is 54,1-10: Como a mujer abandonada te vuelve a llamar el Señor.<br>
Lc 7,24-30: Juan es el mensajero que prepara el camino al Señor.</p>

<p>Viernes: Juan es la lámpara que guía a los pueblos al templo del Señor.<br>
Is 56,1-3.6-8: mi templo es casa de oración para todos los pueblos.<br>
Jn 5,33-36: Juan es la lámpara que arde y brilla.</p>

<p><b>3. Ciclo de María</b></p>

<p>Tengamos presente que, en este tercer ciclo, es el evangelio quien adquiere preeminencia, mientras —como se recordará— en el primer ciclo dominaba Isaías. Se trata de una lectura continua primero de Mateo y luego de Lucas.</p>

<p>La profecía se hace historia concreta. Todo lo que ha sido anunciado se realiza en Jesús; el acontecimiento de su venida se puede situar en el espacio y en el tiempo. La figura de Juan se entremezcla continuamente con la de Jesús: también su nacimiento anuncia a Cristo.</p>

<p>Este ciclo, resumiéndolo al máximo, nos presenta una gran reflexión del hecho de la maternidad, y el canto de las madres a Dios por el don recibido.</p>

<p><b>17 dic.:</b> El que viene es el hijo de David; en él converge la historia.<br>
Gn 49,2.8-10: no se apartará el cetro de Judá.<br>
Mt 1,1-17: genealogía de Jesucristo, hijo de David.</p>

<p><b>18 dic.:</b> el hijo de José es el vástago de David.<br>
Jer 23,5-8: suscitará a David un vástago legítimo.<br>
Mt 1,18-24: Jesús nació de María, esposa de José, hijo de David.</p>

<p><b>19 dic.:</b> el nacimiento, signo del paso de Dios y fruto de un plan divino (el nacimiento en Antiguo Testamento).<br>
Jue 13,2-7.24-25: nacimiento de Sansón anunciado por el ángel.<br>
Lc 1,5-25: nacimiento de Juan anunciado por el ángel.</p>

<p><b>20 dic.:</b> un ángel anuncia el nacimiento de Cristo.<br>
Is 7,10-14: La virgen concebirá.<br>
Lc 1,26-38: Concebirás y darás a luz un hijo.</p>

<p><b>21 dic.:</b> La visitación: encuentro de las dos madres, de ambos Testamentos: el Antiguo y el Nuevo.<br>
Cant 2,8-14: Mirad: mi amado viene, saltando por los montes.<br>
Lc 1,39-45: ¿Quién soy yo para que me visite la madre de mi Señor?</p>

<p><b>22 dic.:</b> Canto de las madres por el don de la maternidad.<br>
1 Sm 1,24-28: Ana agradece el nacimiento de Samuel.<br>
Lc 1,46-55: María glorifica al Señor.</p>

<p><b>23 dic.:</b> nacimiento del precursor.<br>
Mal 3,1-4.23-24: antes del día del Señor mandará al profeta Elías.<br>
Lc 1,57-66: nacimiento de Juan Bautista.</p>

<p><b>24 dic.:</b> se realiza la promesa hecha a David: nace el sol de lo alto.<br>
2 Sm 7,1-5.8-11.16: la promesa hecha a David: el reino durará eternamente.<br>
Lc 1,67-79: Nos visitará un sol que surge de lo alto, como había prometido.</p>

<h3><span class="dot"></span>3. El misterio de la espera y de la venida de Dios, celebrado en la liturgia</h3>

<p>Desde que Jesús, con su pascua, llevó a cabo nuestra redención, siempre celebramos esperando su venida; por eso aclamamos: «Anunciamos tu muerte, proclamamos tu resurrección, ven, Señor Jesús».</p>

<p>En adviento celebramos el misterio siempre en acto de la venida de Jesús, venida que cubre todo el arco de la vida personal y de toda la historia humana. Así canta la liturgia:</p>

<blockquote>— Al venir por vez primera, en la humildad de nuestra carne, realizó el plan de redención trazado desde antiguo y nos abrió el camino de la salvación.<br><br>
— Vendrá de nuevo en la majestad de su gloria y nos llamará a poseer el Reino prometido que ahora, en vigilante espera, confiamos alcanzar…<br><br>
— Viene ahora a nuestro encuentro en cada hombre y en cada acontecimiento para que lo recibamos en la fe y por el amor demos testimonio de la espera dichosa de su Reino (Prefacios I y III de adviento).</blockquote>

<p>La espera que celebramos es única y sus momentos están vinculados entre sí: el adviento de Cristo en la carne se proyecta por el adviento cotidiano a la Iglesia y al hombre; éste, a su vez, tiende hacia la vuelta de Cristo: la parusía y el fin último de la espera.</p>

<blockquote>No podríamos orar: «Ven» con tanta seguridad en el misterio si no hubiese ya venido; ni podríamos decir con tanta firmeza en el misterio: «Está aquí» si no estuviéramos convencidos en la fe de que vendrá para perfeccionar su Reino para la eternidad (O. Casel).</blockquote>

<h3><span class="dot"></span>4. El misterio de la espera y venida de Dios, vivido en la vida de cada día</h3>

<p>Las grandes visiones, los anuncios magníficos y los vivos ejemplos de los grandes maestros y modelos del adviento nos quieren llevar a no esperar nada distinto de Cristo, a acogerle con total confianza en cuanto llame a nuestra puerta, a asumir actitudes que preparan su venida. Siguiendo la liturgia podemos sintetizarlas:</p>

<p>— Mantenerse vigilantes en la fe, en la oración, con una apertura atenta y dispuestos a reconocer los «signos» de la venida del Señor en todas las circunstancias y momentos de la vida y al final de los tiempos.</p>

<p>— Caminar por el camino trazado por Dios, dejar las sendas tortuosas; «convertirse», para seguir a Jesús hacia el reino del Padre.</p>

<p>— Testimoniar el gozo que nos trae Jesús Salvador, con la caridad afable y paciente con los demás, abiertos a cualquier iniciativa buena, por las que ya se constituye el Reino futuro en el gozo sin ocaso.</p>

<p>— Tener un corazón pobre y vacío de sí, imitando a José, a la Virgen, a Juan Bautista, a Jesús, el Hijo de Dios que ha venido a salvar a los hombres.</p>

<p>— Participar en la celebración eucarística en este Tiempo de adviento significa acoger y reconocer al Señor que viene continuamente a nosotros, seguirle en el camino que conduce al Padre; para que en su venida gloriosa al final de los tiempos nos introduzca a todos en el reino, para «hacernos partícipes de la vida eterna» con los bienaventurados y santos del cielo.</p>

<p>Viviendo de este modo, los cristianos desempeñamos un papel profético de protesta contra un mundo adormecido que corre el riesgo de perder su propia alma, y testimoniamos el gozo profundo y la fe cierta de la venida de un mundo mejor por medio de la continua venida de Cristo.</p>

  <p class="note">Hay que subrayar, sin embargo, que la fuerza que empuja a los pueblos a subir es el don de la Palabra de Dios, con frecuencia olvidada, pero capaz de suscitar en los pueblos aspiraciones nobles y mover nuevas energías. No se trata de una palabra fácil; de hecho, los pueblos serán juzgados en Jerusalén. Pero dejándose juzgar y calibrar por Dios los hombres podrán encontrar la propia verdad y el valor de trabajar por la paz a costa de laboriosas transformaciones: las armas se convertirán en herramientas de trabajo y promoción.</p>

  <p class="note">Como último elemento de la visión está el pueblo de Dios, pequeño rebaño conocedor del rostro de Dios y que guiará al cortejo de las gentes caminando «a la luz del Señor» (v. 5).</p>

  <p class="note">Una exhortación inicial en el v. 11 abre las clarificadoras palabras de Pablo: «Daos cuenta del momento (kairós) en que vivís». El adviento es una buena ocasión para tomar conciencia del «tiempo» que vive el cristiano como momento de gracia. De la visión de Isaías que se situaba «al final de los tiempos», se pasa ahora al momento presente, el «del final», es decir, el tiempo decisivo, al tiempo de la luz en el que uno puede orientar la propia libertad por los magníficos y amplios caminos de la verdad y del amor.</p>

  <p class="note">Pablo invita ante todo a la comunidad cristiana a sopesar el valor del camino recorrido: desde que recibió el don de la fe se ha acercado a Dios acrecentando el deseo de vivir para él. Presenta, a continuación, una imagen que inyecta esperanza: la noche está avanzada, el día se echa encima. La señal consiste en que los creyentes ya se han pertrechado con las «armas de la luz». En el lenguaje paulino significa que ya se han revestido del Señor Jesús como de un hábito que les da nueva personalidad.</p>

  <p class="note">Pero esta nueva personalidad se robustece precisamente luchando con las armas de la luz ya descritas en otro lugar por el Apóstol: «Pero nosotros, que somos del día, debemos vivir con sobriedad, cubiertos con la coraza de la fe y del amor, y con la esperanza de la salvación como casco protector» (1 Tes 5,8). Finalmente Pablo afirma que el día, aunque próximo, todavía no ha llegado del todo; de todos modos los cristianos viven ya como «en pleno día», cultivando, no los deseos carnales, es decir, el egoísmo, sino los nuevos deseos, los de Cristo.</p>

  <p class="note">En el contexto precedente a la presente perícopa, Mateo recoge una frase de Jesús que sirve de guía a todo el discurso: «Por la maldad creciente se enfriará el amor de la mayoría» (24,12). Es la gran tentación ante la que Jesús nos pone en guardia: a lo largo de la vida, tras haber recibido la fe y el amor de Dios, se corre el peligro de dejar enfriar estos dones y perderlos. A Jesús no le importa echar mano de la imagen —severa e incluso ambigua, pero llena de fuerza— del ladrón que viene inesperadamente. ¿Es una amenaza? Ciertamente, también es una amenaza para quien, justificándose con la ignorancia de su venida, vive como la generación de Noé, en la total ignorancia del Evangelio.</p>

  <p class="note">El peligro serio es gastar el tiempo que tenemos a nuestra disposición, nuestra existencia, sin optar de verdad por algo grande, sin decidirse de veras a dar a la libertad ese gran aliento que sólo puede provenir de haber encontrado en Jesús la verdad y el amor. Para esto, el creyente goza del don de vivir en la Iglesia, custodia de la verdad del Evangelio, ya que sólo en el encuentro con la verdad del amor de Dios podemos abrirnos a una verdad de inmensos horizontes.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>«Dios todopoderoso, aviva en tus fieles, al comenzar el Adviento, el deseo de salir al encuentro de Cristo, que viene, acompañados por las buenas obras». Con estas palabras se abre la oración inicial de la liturgia de hoy. Nos indican, exactamente, el sentido de cuanto estamos viviendo. Dios, como Padre, está en el origen de todo bien y de nuestra misma vida, y nos pone como punto de llegada de nuestro camino «Cristo que viene». Nuestra existencia se desarrolla totalmente entre esta gracia de Dios que nos precede y la plena configuración con Cristo hacia la que nos encaminamos. Es, pues, su gracia la que suscita en nosotros esa capacidad para emprender el camino con obras buenas.</p>

  <p>Mientras estamos de camino, la Palabra de Dios nos exhorta a ser como el profeta capaces de tener «visiones». No en el sentido de abrigar sueños ilusorios, sino en el sentido de saber mirar a lo lejos: incluso si la ciudad está llena de idolatría, infidelidad, injusticia, el papel de la Iglesia es el de volverse hacia Dios, testimoniando que él es el único y llama a todos a sí. Orientándose y orientando a los otros a Dios, nuestra comunidad creyente manifiesta también el deseo de justicia que está en todos nosotros. Por otra parte, la Palabra nos invita a ser como el dueño prudente de una casa que sabe vigilar el tesoro que posee. Jesús no teme usar la imagen del ladrón, y es que corremos el gran riesgo de no acoger la gracia de Dios que se nos brinda y que nos la puedan robar por nuestra pereza, nuestra ignorancia, nuestra irresponsabilidad. No basta construir el signo del arca, como en tiempos de Noé, si luego esta arca no nos enseña a volver a Dios.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Es tu amor, Padre, el que nos pone de nuevo en camino hacia tu Hijo que viene. Te agradecemos este tiempo que nos regalas para poder acogerte y todas las ocasiones que nos brindas. Concédenos dejarnos visitar por tu gracia y que nuestra voluntad se deje sacudir por tu venida.</p>

  <p class="prayer">Padre, destierra de nosotros la pereza, la desgana y la desidia de ver «siempre lo mismo» y enséñanos a ponernos de nuevo en camino. Vence nuestra ignorancia que piensa conocerte ya lo suficiente. Vence nuestra tibieza que nos lleva a pensar que te amamos bastante. Vence nuestras rutinas que nos hacen creer que ya no podemos descubrir nada nuevo en tu compañía.</p>

  <p class="prayer">Después de conocer la luz, ayúdanos a no desear más el mundo de las tinieblas; después de haber intuido el camino de la paz, no permitas que seamos tentados por la arrogancia y el egoísmo; después de que nos has revestido del Señor Jesús y de introducirnos en la vida del Espíritu, no permitas que nos dejemos seducir por los deseos carnales.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Escogió para sí, aunque fuera tarde, a los que se han dejado vencer por el sueño, e incluso a los que han perdido a Cristo. De hecho, no se pierde a Cristo hasta el punto de que no vuelva si se le busca; pero vuelve a los que lo buscan.</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Muéstranos, Señor, tu misericordia»</b> (Sal 84,8).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Arsenio fue un romano culto con rango de senador que vivió en la corte del emperador Teodosio como tutor de los príncipes Arcadio y Honorio. Cuando vivía aún en el palacio, el abba Arsenio oró a Dios con estas palabras: «Señor, guíame por el camino de la salvación». Y oyó una voz que le contestó: «Arsenio, huye del mundo y te salvarás».</p>
  <p>Después de navegar secretamente de Roma a Alejandría y de vivir una vida solitaria en el desierto, Arsenio oró de nuevo: «Señor, guíame por el camino de la salvación» y de nuevo oyó una voz que le respondía: «Arsenio, huye, guarda silencio, ora continuamente porque éstas son las fuentes de la vida».</p>
  <p>Las palabras <i>huye</i>, <i>guarda silencio</i> y <i>ora</i> resumen la espiritualidad del desierto. Indican tres formas de evitar que el mundo nos configure a su imagen, tres formas, por lo tanto, de vida en el Espíritu (H. J. M. Nouwen, <i>El camino del corazón</i>, Madrid 1986, 13).</p>
  `}
 ]},

{ id:"1d-B", title:"Primer Domingo de Adviento · Año B", tag:"Primera semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 63,16b-17.19b; 64,2b-7</span>
  <p><sup>63,16</sup>Tú, Señor, eres nuestro Padre, desde siempre te invocamos como nuestro redentor. <sup>17</sup>Señor, ¿por qué nos extravías de tus caminos, y endureces nuestro corazón para que no te respetemos? Cambia de actitud, por amor a tus siervos; por amor a las tribus de tu heredad.</p>
  <p><sup>19b</sup>¡Ojalá rasgases el cielo y bajases; los montes se derretirían ante ti, <sup>64,2b</sup>Tú bajaste, y los montes se derritieron en tu presencia. <sup>3</sup>Jamás nadie vio ni oyó hablar de un Dios que actúe como tú con quien confía en él. <sup>4</sup>Tú acoges a los que actúan rectamente y no se olvidan de tus preceptos. Estabas irritado, porque habíamos pecado; persiste nuestro pecado, pero tú nos salvarás.</p>
  <p><sup>5</sup>Todos nosotros éramos impuros; nuestra justicia era un paño inmundo, nos marchitábamos todos como si fuéramos hojas y nuestras maldades nos arrastraban como el viento. <sup>6</sup>Nadie invocaba tu nombre, nadie salía del letargo para adherirse a ti, pues tú nos escondías tu rostro y nos entregabas a nuestras maldades.</p>
  <p><sup>7</sup>Con todo, Señor, tú eres nuestro Padre, nosotros somos la arcilla, y tú el alfarero, somos todos obra de tus manos.</p></div>

  <div class="reading"><span class="ref">Segunda lectura · 1 Corintios 1,3-9</span>
  <p>Hermanos: <sup>3</sup>Gracia y paz de parte de Dios nuestro Padre y de Jesucristo, el Señor.</p>
  <p><sup>4</sup>Doy gracias a Dios continuamente por vosotros pues os ha concedido su gracia mediante Cristo Jesús, <sup>5</sup>en quien habéis sido enriquecidos sobremanera con toda palabra y con todo conocimiento. <sup>6</sup>Y es tal la solidez que ha alcanzado el testimonio de Cristo entre vosotros, <sup>7</sup>que no os falta ningún don, mientras esperáis la manifestación de nuestro Señor Jesucristo. <sup>8</sup>Él también os mantendrá firmes hasta el fin para que nadie tenga de qué acusaros en el día de nuestro Señor Jesucristo. <sup>9</sup>Fiel es Dios que os ha llamado a vivir en unión con su Hijo Jesucristo, nuestro Señor.</p></div>

  <div class="reading"><span class="ref">Evangelio · Marcos 13,33-37</span>
  <p>En aquel tiempo, dijo Jesús a sus discípulos: <sup>33</sup>¡Cuidado! Vigilad, pues no sabéis cuándo es el momento preciso. <sup>34</sup>Sucederá lo mismo que con aquel hombre que se ausentó de su casa, encomendó a cada uno de los siervos su tarea y encargó al portero que vigilase. <sup>35</sup>Así que vigilad, porque no sabéis cuándo llegará el dueño de la casa, si al atardecer, a media noche, al canto del gallo o al amanecer. <sup>36</sup>No sea que llegue de improviso y os encuentre dormidos. <sup>37</sup>Lo que a vosotros os digo, lo digo a todos: ¡Vigilad!</p></div>

  <p class="note">El momento más intenso de este fragmento del libro de Isaías es ciertamente la invocación acuciante del v. 19: «¡Ojalá rasgases el cielo y bajases!» La invocación, a su vez, es una inserción del redactor profético en una serie temática que le imprimen densidad y vigor. Aparecen claramente tres temas principales.</p>

  <p class="note">Ante todo aparece el conocimiento profundo que tiene el pueblo del propio pecado; no importan tanto las desgracias en las que se encuentra inmerso Israel (entre las que cabe mencionar la profanación del templo, omitida en la perícopa litúrgica), cuanto el pecado sentido como una prisión de la que no logra liberarse el pueblo: «¿Por qué nos extravías de tus caminos?» (v. 17); «Nos entregabas a nuestras maldades» (v. 6); «Nuestra justicia era un paño inmundo» (v. 5), es decir, no logran librarse de las cadenas del pecado.</p>

  <p class="note">Es de notar que en esta situación el pueblo se dirige a Dios invocándolo como «nuestro Padre», término raro en el Antiguo Testamento pero que aparece en contextos importantes. El que Dios sea «Padre» de Israel es el motivo que justifica la liberación de Egipto (Ex 4,23: «deja salir a mi hijo»), a su vez Israel se dirige a Dios insistiendo en el vínculo de parentesco para conmover el corazón de Dios.</p>

  <p class="note">Finalmente, la invocación a Dios para que rasgue los cielos utiliza los términos basados en la memoria de las obras de Dios. Es como si Israel dijera al Señor: no recuerdes nuestras acciones, Señor, sino recuerda lo que tú has hecho y continúa haciéndolas hoy.</p>

  <p class="note">Dirigiéndose a la comunidad de Corinto, Pablo describe la situación de los cristianos. Éstos se encuentran entre dos tiempos: el pasado, en el que los corintios han podido experimentar la abundancia de los dones divinos, y el futuro, es decir, el día de la «manifestación de nuestro Señor Jesucristo». De esta realidad surgen dos actitudes: la acción de gracias y la esperanza.</p>

  <p class="note">Los comienzos de la predicación en Corinto se señalaron por una efusión copiosa de los dones del Espíritu. Nació una Iglesia particularmente activa y el Apóstol no se planteó tanto el problema de estimular la participación cuanto orientar al bien común la riqueza de los particulares. Los dones y manifestaciones de la gracia, indica Pablo, no se han concedido como adorno o motivo de vanagloria, sino como tarea y responsabilidad.</p>

  <p class="note">Así, llenos de gracia, los creyentes pueden caminar confiados hacia la manifestación final del Señor Jesús (v. 7), cuando lograrán la plena comunión con él. Pero, aun antes de su compromiso de espera vigilante, Pablo prefiere subrayar que será el mismo Dios quien los conducirá a este encuentro definitivo con su Hijo. Los cristianos, sabedores de su propia debilidad, pueden contar con la fidelidad de Dios, que quiere a toda costa llevar a buen término la «vocación» que les ha dirigido.</p>

  <p class="note">El relato evangélico comienza y concluye con la misma invitación: «Vigilad» (vv. 33.37). Siguen dos enseñanzas, la primera indica el «porqué» de la vigilancia: «Vigilad, pues no sabéis cuándo es el momento preciso» (v. 33). Una lectura superficial podría parecernos como una imposición tiránica: Jesús no revela el día y la hora, para que los cristianos vivan en continuo temor. Al contrario, no se indica la hora porque todas las horas son buenas para abrirse al evangelio de suerte que comprometa la existencia. Jesús desea vitalizar a una comunidad para que no esté obsesionada con el deseo de conocer el final, sino que se preocupe por vivir y discernir tiempos y momentos en la escucha y la obediencia. Y esto en la espera de la última cita que nos introducirá definitivamente en el Reino; ciertamente es una espera.</p>

  <p class="note">La segunda enseñanza está en el «estilo» de la vigilancia. Marcos, al narrar la parábola del hombre que se marcha de viaje lejos, indica que deja su «casa» al cuidado de sus criados (v. 34). Es posible ver en la casa una imagen de la comunidad cristiana. Cualquier creyente es, en su fidelidad cotidiana al Señor, responsable de su construcción. La vigilancia se caracteriza como «vigilancia de la casa», de la que, mientras espera a su Señor, el cristiano debe cuidar desempeñando la tarea que Dios ha confiado a cada uno.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La esperanza es la virtud por excelencia de adviento. Nos hace mirar al mañana con confianza y valentía. Sin embargo, correría el riesgo de ser una esperanza ilusoria, vana, que se disiparía en la nebulosa de nuestra fantasía si no fuese capaz de mirar con realismo la situación presente y si no estuviese arraigada en el recuerdo de las cosas buenas conocidas y vividas. Ésta es la temática común de las lecturas de hoy.</p>

  <p>En particular, la primera se fija en los beneficios realizados por Dios como base para esperar de nuevo su venida. La lectura comienza hablando de Dios, no del hombre: «Tú eres nuestro Padre, nuestro redentor» (Is 63,16); parte de la certeza de que Dios se ha vinculado a nosotros y que no puede quedarse lejos. Por lo demás, en la historia de toda relación (bien sea dentro de una pareja, entre amigos, en el seno de una comunidad…) el recuerdo de los momentos felices vividos juntos y de las dificultades afrontadas en armonía y solidaridad, puede ser fuente de fortaleza para afrontar nuevas dificultades. Lo mismo ocurre en la relación con Dios, donde nunca podemos renunciar a la memoria.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">La mejor sugerencia como oración, en este caso, es volver a leer el texto de la primera lectura, ya que el mismo texto es una súplica.</p>

  <p class="prayer">«Tú, Señor, eres nuestro Padre». Mientras vamos acercándonos a ti, Padre, sentimos estas palabras en toda su fuerza. Te has comprometido con nosotros, te has expuesto por nuestro «rescate», y así podemos apelar a este título para llamar a tu corazón. No recuerdes quiénes somos, recuerda quién eres tú, ya que nosotros somos barro y tú el alfarero. No olvides la obra de tus manos.</p>

  <p class="prayer">Señor Jesús, que nos has confiado tu casa, la Iglesia y todos nuestros hermanos para que cuidemos unos de otros en espera de tu vuelta, no dejes que decaigan nuestros brazos abatidos por el cansancio o por el sueño. No nos abandones al poder de nuestro pecado y nuestra iniquidad. Tú que nos llamas «siervos» concédenos reconocernos en ti, ya que te has hecho siervo nuestro.</p>

  <p class="prayer">«Estad alerta, vigilad», es lo que nos mandas: como quien pasa la noche de guardia atento a cualquier ruido nocturno porque puede ser precursor de algo inesperado, haz que tengamos el ojo avizor y el oído atento para percibir dónde estás y dónde nos llamas a colaborar contigo.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Una pregunta seria. Vigilar: ¿qué significa para Cristo? Estar vigilantes. No se trata solamente de creer, sino de estar alerta. ¿Sabéis lo que significa esperar a un amigo, esperar que llegue cuando se retrasa? ¿Estar ansiosos por algo que puede suceder o no? Vigilar por Cristo se asemeja algo a todo esto. Vigilar con Cristo es mirar hacia delante sin olvidar el pasado. No olvidar lo que ha sufrido por nosotros es perdernos en contemplación atraídos por la grandeza de la redención. Es renovar continuamente en el propio ser la pasión y agonía de Cristo, es revestirse con gozo del manto de aflicción que Cristo quiso llevar y luego dejarlo subiendo al cielo. Es separación del mundo sensible y vivir en el mundo invisible con el móvil de que Cristo vendrá como dijo. Es deseo afectuoso y agradecido de esta segunda venida de Cristo: esto es vigilar (J. H. Newman, <i>Diario spirituale e meditazioni</i>, Novara s.f., 91-93).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«¡Ven, Señor Jesús!»</b> (Ap 22,20).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>La espera no es una actitud muy común. No se suele pensar con mucha simpatía en la espera. De hecho, la mayor parte de la gente piensa que la espera es una pérdida de tiempo…; quizás porque la cultura que nos ha tocado vivir dice «¡Venga!, ¡haz algo! ¡Demuestra que eres capaz de actuar! No te quedes sentado esperando!» Sin embargo, esperar es una actitud enormemente radical en la vida. Es confiar en que sucederá algo que supera con mucho nuestra imaginación. Es abandonar el control de nuestro futuro y dejar que sea Dios quien determine nuestra vida. Es vivir con la convicción de que Dios nos va formando con su amor divino y no con nuestros temores. La vida espiritual es una vida en la que esperamos, estamos a la espera, activamente presentes en el momento actual, esperando la novedad que acontecerá, novedad que va más allá de nuestra propia imaginación o previsión. Esta actitud, ciertamente, es muy radical en la vida en este mundo preocupado en controlar los acontecimientos (H. J. M. Nouwen, <i>The Path of Waiting</i>, Nueva York 1995).</p>
  `}
 ]},

{ id:"1d-C", title:"Primer Domingo de Adviento · Año C", tag:"Primera semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Jeremías 33,14-16</span>
  <p><sup>14</sup>Mirad que llegan días —oráculo del Señor— en que cumpliré la promesa que hice a la casa de Israel. <sup>15</sup>Entonces, en aquellos días, suscitaré a David un germen de justicia, que practicará el derecho y la justicia en la tierra. <sup>16</sup>En aquellos días se salvará Judá, Jerusalén vivirá en paz, y le llamarán así: «Señor-nuestra-justicia».</p></div>

  <div class="reading"><span class="ref">Segunda lectura · 1 Tesalonicenses 3,12-4,2</span>
  <p>Hermanos: <sup>12</sup>¡Que el Señor os haga crecer y sobreabundar en un amor de unos hacia otros y hacia todos, tan grande como el que nosotros sentimos por vosotros! <sup>13</sup>En fin, que cuando Jesús, nuestro Señor, se manifieste junto con todos sus santos, os encuentre interiormente fuertes e irreprochables como consagrados delante de Dios, nuestro Padre.</p>
  <p><sup>4,1</sup>Por lo demás, hermanos, os rogamos y os exhortamos en el nombre de Jesús, el Señor, a que pongáis en práctica lo que aprendisteis de nosotros en lo que al comportaros y agradar al Señor se refiere, para que progreséis más y más cada día. <sup>2</sup>Sabéis qué normas os dimos de parte de Jesús, el Señor.</p></div>

  <div class="reading"><span class="ref">Evangelio · Lucas 21,25-28.34-36</span>
  <p>En aquel tiempo, dijo Jesús a sus discípulos: <sup>25</sup>Habrá señales en el sol, en la luna y en las estrellas; y en la tierra la angustia se apoderará de los pueblos, asustados por el estruendo del mar y de sus olas. <sup>26</sup>Los hombres se morirán de miedo, al ver esa conmoción del universo; pues las potencias del cielo quedarán violentamente sacudidas. <sup>27</sup>Entonces verán al Hijo del hombre venir en una nube con gran poder y majestad. <sup>28</sup>Cuando empiecen a suceder estas cosas, cobrad ánimo y levantad la cabeza, porque se acerca vuestra liberación.</p>
  <p><sup>34</sup>Procurad que vuestros corazones no se emboten por el exceso de comida, la embriaguez y las preocupaciones de la vida, porque entonces ese día caerá de improviso sobre vosotros. <sup>35</sup>Ese día será como una trampa en la que caerán atrapados todos los habitantes de la tierra. <sup>36</sup>Velad, pues, y orad en todo tiempo, para que os libréis de todo lo que ha de venir y podáis presentaros sin temor ante el Hijo del hombre.</p></div>

  <p class="note">La lectura es un breve extracto de los «oráculos de esperanza» de Jeremías (Jer 30-33) y contienen palabras de confianza para el futuro. Podemos pensar que fueron pronunciadas hacia el año 587 a.C., cuando la ciudad de Jerusalén estaba a punto de caer en manos del enemigo.</p>

  <p class="note">«Mirad que llegan días —oráculo del Señor— en que cumpliré la promesa que hice a la casa de Israel» (v. 14): Jeremías había pronunciado palabras de amenaza sobre la ciudad de Jerusalén infiel, pero ahora que el castigo es inminente, proclama que Dios tiene en su mente «palabras buenas», es decir, la promesa y el proyecto de una ciudad nueva donde habite la justicia. Jeremías, a continuación, quiere indicar que no se trata de palabras.</p>

  <p class="note">Para convertir en realidad esta promesa de bien enviará a un descendiente de David, un Mesías «germen de justicia» (v. 15), expresión que no se reduce al sentido de vástago legítimamente descendiente de David, sino como promesa de un rey que tendrá de verdad la justicia como programa.</p>

  <p class="note">En el desarrollo de este programa se manifestará el rostro de Dios como «justo». A Jerusalén se le impondrá un nombre nuevo ideal: «Señor-nuestra-justicia», es decir, será el testimonio vivo de la justicia de Dios. El nombre quizás haga alusión al último rey, Sedecías, quien no supo estar a la altura del proyecto que manifiesta su nombre (en hebreo significa «justicia del Señor»). Dios, sin embargo, se manifestará precisamente en el momento en que aparecerá su fidelidad a la promesa de edificar un pueblo nuevo, fundado en la justicia.</p>

  <p class="note">La comunidad espera la parusía, cuando «Jesús, nuestro Señor, se manifieste junto con todos sus santos» (v. 13). Todas las exhortaciones de Pablo tienen sentido bajo esta luz.</p>

  <p class="note">La iglesia de Tesalónica no es muy problemática para el Apóstol, por eso los consejos se dirigen al día a día de la vida del creyente. Exhorta a esos cristianos a seguir comportándose como ya lo hacen, pero tratando de mejorar constantemente su conducta. La exhortación fundamental es la de mantener viva la caridad (v. 12), ya que constituye el núcleo esencial de la santidad y es la auténtica «forma» de la tensión del cristiano por la venida de Jesús (v. 13).</p>

  <p class="note">Otro principio de fondo que, según Pablo, debe configurar toda la vida cristiana es el deseo de «agradar al Señor» (4,1). No hay que tener como norma la aprobación de los hombres, sino lo que agrada a Dios.</p>

  <p class="note">En el mismo versículo encontramos una invitación que puede pasar desapercibida, aunque sea bastante rara en Pablo: «Para que progreséis más y más cada día». El Apóstol piensa en una vida cristiana en continuo crecimiento y en constante profundización, ya que la hondura del amor de Dios que nos llama es inagotable.</p>

  <p class="note">El relato litúrgico del evangelio se compone de dos fragmentos del llamado «discurso apocalíptico» de Jesús en la versión de Lucas.</p>

  <p class="note">En la primera parte (vv. 25-28) el discurso se centra en la venida del Hijo del hombre. El Hijo del hombre es el que ha sido humillado y ha padecido por toda la humanidad y al que Dios ha resucitado de entre los muertos, reconociéndolo como Hijo, salvador universal. El cristiano espera el día de su manifestación «con gran poder y majestad» (v. 27), espera que aparezca, plenamente visible, su victoria sobre el mal y su señorío universal.</p>

  <p class="note">Según Lucas, el día del Hijo del hombre se anuncia con ciertos signos: «Habrá señales en el sol, en la luna y en las estrellas; y en la tierra la angustia se apoderará de los pueblos…» (v. 25). No se trata de manifestaciones que nos permitan calcular con anticipación el momento de la venida de Jesús. Se trata, por el contrario, de acontecimientos que se darán siempre, en cualquier tiempo. De hecho, siempre sucederán catástrofes naturales o desórdenes y acontecimientos dolorosos, lo cual indica que el hombre siempre debe estar a la espera de la venida de Jesús.</p>

  <p class="note">Con todo, se darán dos modos de leer los signos: el del que espera con miedo el final de un mundo encaminado a la desaparición y la nada (de ahí la angustia, la locura, el miedo: vv. 25-26); y la del que, creyendo, no infravalora el mal, pero a pesar de todo «levanta la cabeza» y abre el corazón a la esperanza porque está seguro de la liberación (v. 28).</p>

  <p class="note">En la segunda parte el evangelista resalta dos imperativos: «Procurad» (v. 34), y «velad y orad» (v. 36). Es preciso tener cuidado con lo que embota el corazón y apaga la esperanza. Hay que vigilar —y aquí aparece la añadidura de la preciosa invitación a la oración— para evitar la perversa fascinación del mal y estar lúcidos para esperar al único que da sentido a nuestra historia: al Hijo del hombre.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Sin duda, tenemos momentos en que nos centramos en los graves problemas que nos afectan directamente, o a nuestra familia o comunidad. La comunidad creyente con frecuencia precisa echar mano de los consejos más ordinarios, como los que da Pablo a los tesalonicenses. Todos necesitamos fortalecer nuestra fidelidad cotidiana al estilo que nos marca el evangelio, conscientes de que, aunque no tengamos problemas graves, no debemos vivir con una fe encogida ni debemos dar por supuesta la caridad.</p>

  <p>Las lecturas bíblicas son una invitación a esperar la venida del Señor con caridad y justicia. El amor del que habla Pablo es un amor «desbordante»: «os haga crecer y rebosar». Si ponemos límites o diques a nuestro amor, no es amor; nuestra caridad cristiana debe encontrar su mejor imagen en la de un río cuyas aguas no se pueden contener.</p>

  <p>Además se trata de un amor «recíproco», visible dentro de la Iglesia, y un amor «a todos», expresando así también amor hacia el exterior. No olvidemos que esta llamada a la caridad se da para una Iglesia donde las relaciones con la ciudad no son fáciles. Nuestra caridad con los más próximos y con los lejanos tiene una misma procedencia y una puede ser, hoy para nosotros, la medida de la autenticidad de la otra.</p>

  <p>Además es un amor que se debe manifestar más si se desempeña un ministerio en la comunidad; Pablo ha dado ejemplo: «Lo mismo que nosotros os amamos».</p>

  <p>Finalmente, aparece la caridad que nos lleva a una fe sólida y a la santidad, una solidez que resiste hasta la venida de Cristo: «Para que cuando Jesús nuestro Señor se manifieste, os encuentre interiormente fuertes e irreprochables» (1 Tes 3,13). Reconocemos y confesamos que Jesús es el Señor, sabiendo que su señorío se extiende ya ahora en el mundo donde nos encontramos viviendo su amor.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«A ti, Señor, levanto mi alma»: al comienzo del adviento renace en mí la esperanza de volver a caminar por tus sendas que con frecuencia he abandonado. Tu invitación a levantar la cabeza para ver la cercana liberación es lo que mueve mi esperanza. Por eso, a ti levanto mi alma. La promesa de tu venida sostenga de nuevo mi compromiso por obrar el bien.</p>

  <p class="prayer">«Señor, enséñame tus caminos»: al pedirte que endereces mi camino, comprendo que no puedo nada si tú mismo no me enseñas tus caminos. No sólo eso, tú mismo eres el Camino, tú eres el «germen de justicia» capaz de hacer justos nuestros caminos, tú eres el único por el que pueda decidir de nuevo gastar mis días en la caridad.</p>

  <p class="prayer">«Enseñas el camino justo a los pecadores»: Quiero ser sincero, Señor. Ante tu promesa siento todavía más fuerte el tirón de mis distracciones y los afanes que embotan el corazón, observo la capa opresora de males que afligen al mundo en el que vivo y que nos llevan con frecuencia a contentarnos con una vida ordinaria, sin relieve. Ábrenos a la esperanza, para que no dejemos de pensar noblemente y para que, en definitiva, podamos agradarte.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Esperamos el día del aniversario del nacimiento de Cristo: levántese nuestro espíritu rebosante de gozo, salga al encuentro de Cristo que viene, siempre adelante con ardor impaciente, casi incapaz de contenerse o de soportar la tardanza… Pido para vosotros, hermanos, que el Señor, antes de aparecer para todo el mundo, venga a visitar vuestro interior. Esta venida del Señor es oculta pero admirable y pone al alma que contempla en la admiración dulcísima de la adoración. Bien lo saben los que la experimentan.</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«No queda defraudado quien en ti espera»</b> (Sal 24,3).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Tendrá lugar entonces, sin duda, la Parusía sobre una Creación llevada al paroxismo de sus aptitudes para la unión. Revelándose al cabo la acción única de asimilación y de síntesis que se proseguía desde el origen de los tiempos, el Cristo universal brotará como un rayo en el seno de las nubes del Mundo lentamente consagrado. Las trompetas angélicas no son más que un débil símbolo. Agitadas por la más poderosa atracción orgánica que pueda concebirse (¡la fuerza misma de cohesión del universo!), las mónadas se precipitarán al lugar en que la maduración total de las cosas y la implacable irreversibilidad de la Historia entera del Mundo las destinarán irrevocablemente; las unas, materia espiritualizada, en el perfeccionamiento sin límites de una eterna comunión; las otras, espíritu materializado, en las ansias conscientes de una interminable descomposición.</p>
  <p>De este modo se hallará constituido el complejo orgánico: Dios y Mundo, el Pleroma, realidad misteriosa que no podemos decir sea más bella que Dios solo, puesto que Dios podía prescindir del Mundo, pero que tampoco podemos pensar como absolutamente accesoria sin hacer con ello incomprensible la Creación, absurda la Pasión de Cristo y falto de interés nuestro esfuerzo.</p>
  <p>Entonces será el final.</p>
  <p>Como una marea inmensa, el Ser habrá dominado el temblor de los seres. En el seno de un Océano tranquilizado, pero que en cada gota tendrá conciencia de seguir siendo ella misma, terminará la extraordinaria aventura del mundo. El sueño de toda mística habrá hallado su manifestación plena y legítima. Dios será todo en todos (P. Teilhard de Chardin, <i>El porvenir del hombre</i>, Madrid 1965, 378-379).</p>
  `}
 ]},

{ id:"1-lun", title:"Lunes de la primera semana", tag:"Primera semana · Lunes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 2,1-5</span>
  <p><sup>1</sup>Visión que tuvo Isaías, hijo de Amós, acerca de Judá y Jerusalén. <sup>2</sup>Al final de los tiempos estará firme el monte del templo del Señor; sobresaldrá sobre los montes, dominará sobre las colinas. Hacia él afluirán todas las naciones, <sup>3</sup>vendrán pueblos numerosos. Dirán: «Venid, subamos al monte del Señor, al templo del Dios de Jacob. Él nos enseñará sus caminos y marcharemos por sus sendas». Porque de Sión saldrá la ley, y de Jerusalén la palabra del Señor. <sup>4</sup>Él será juez de las naciones, árbitro de pueblos numerosos. De las espadas forjarán arados, de sus lanzas podaderas. No alzará la espada nación contra nación, ni se prepararán más para la guerra. <sup>5</sup>Estirpe de Jacob, venid, caminemos a la luz del Señor.</p></div>

  <p class="note">El profeta Isaías nos ofrece su mirada de creyente sobre el curso de la historia humana; para él no camina hacia una catástrofe sino hacia el don divino de la paz universal. La visión profética distingue en la historia humana un movimiento ascendente en correspondencia con el movimiento descendente de Dios, quien hace «salir» su Palabra para atraer hacia sí a los hombres (v. 3). El movimiento tiene un signo positivo: todos los pueblos tenderán a la unidad. La ruina sucedió en Babel, donde fueron confundidas las lenguas y la dispersión entró en la vida humana. Isaías ve, en cambio, el prodigio de un movimiento opuesto: los hombres convergen hacia un centro, vuelven a unirse, se supera y olvida la lejanía de Dios, Jerusalén será ciudad de Dios para siempre.</p>

  <p class="note">Para lograrlo, el Señor establece una «escuela» alternativa: la «escuela de su Palabra», que, con la fuerza de su promesa, suscita un mundo de paz y proyecta en dirección positiva las energías del hombre, inclinadas al mal y a la muerte: «De las espadas forjarán arados…» (v. 4).</p>

  <p class="note">Ciertamente, las obras humanas siempre serán parciales y frágiles, pero deben ayudar a comprender que la vida, con su proceder —a veces doloroso y con sufrimiento—, es una santa peregrinación iluminada con la luz que mana del «monte del templo del Señor» (v. 2). Se trata de una luz que no sólo iluminará con todo su esplendor al final de los tiempos, sino que ya desde ahora orienta el camino del pueblo de Israel: «Estirpe de Jacob, venid, caminemos a la luz del Señor» (v. 5).</p>

  <p class="note"><b>O bien en el ciclo A:</b></p>

  <div class="reading"><span class="ref">Primera lectura (ciclo A) · Isaías 4,2-6</span>
  <p><sup>2</sup>Aquel día el vástago del Señor será motivo de honor y de gloria; y los frutos del país constituirán el orgullo y el adorno de los supervivientes de Israel. <sup>3</sup>Al resto de Sión, a los que queden en Jerusalén, se les llamará santos: todos los inscritos para la vida en Jerusalén. <sup>4</sup>Cuando el Señor lave la inmundicia de las hijas de Sión y limpie la sangre derramada en Jerusalén con el aliento del juicio y el soplo del incendio, <sup>5</sup>el Señor creará sobre toda la extensión del monte Sión y sobre sus asambleas una nube durante el día y humo y resplandor de fuego llameante durante la noche; y sobre todo, la gloria será un dosel <sup>6</sup>y una tienda, sombra para el calor del día y refugio y abrigo contra la tormenta y la lluvia.</p></div>

  <p class="note">La promesa divina viene en auxilio de un pueblo que ha experimentado el pecado y sus trágicas consecuencias (v. 4). Espera a un hombre nuevo, indicado con el término simbólico de «vástago», que el Señor envía para sacar al país de la crisis: él es en verdad «honor, orgullo, adorno» para el país. Los caldeos también pensaban que Babilonia gozaba de esta condición de «joya y orgullo» (Is 13,19), y los israelitas decían lo mismo de Samaría (cf. Is 28,1-6). Una y otra eran para sus habitantes corona de esplendor, diadema gloriosa. Pero el Señor juzgará a ambas. Sin embargo, Jerusalén podrá contar con la presencia del «vástago», signo concreto de la fidelidad divina con la ciudad santa.</p>

  <p class="note">El profeta propone a continuación, como en Is 1,9, el tema del «resto» (v. 3). Si para los asirios «el resto» representaba despectivamente los pueblos sometidos a su dominio, para el profeta «el resto» es el remanente de Israel. Constituir parte del «resto» no es cosa humillante, porque con él el Señor puede llevar a cabo nuevos prodigios y nuevas obras de salvación, prescindiendo de que sean pocos los destinatarios. Éstos, formando parte de los rescatados y salvados de la muerte, muestran que la iniciativa proviene del amor fiel de Dios, que encuentra en ellos una respuesta fiel a la elección.</p>

  <p class="note">Los vv. 3-6 describen la condición de los que quedan en Sión. Se llamarán santos, porque la relación entre Dios y este «resto» prevé una purificación. Por eso la nueva Sión, santificada por el Espíritu del Señor, verá renovarse los prodigios del éxodo y toda la asamblea.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 8,5-11</span>
  <p><sup>5</sup>Al entrar en Cafarnaún, se le acercó un centurión suplicándole: <sup>6</sup>—Señor, tengo en casa un criado paralítico que sufre terriblemente. <sup>7</sup>Jesús le respondió: —Yo iré a curarlo. <sup>8</sup>Replicó el centurión: —Señor, yo no soy digno de que entres en mi casa, pero di una sola palabra y mi criado quedará sano. <sup>9</sup>Porque yo, que soy un subalterno, tengo soldados a mis órdenes, y digo a uno: ¡ve! y va; y a otro: ¡ven! y viene; y a mi criado: ¡haz esto! y lo hace.</p>
  <p><sup>10</sup>Al oírlo, Jesús se quedó admirado y dijo a los que le seguían: —Os aseguro que jamás he encontrado en Israel una fe tan grande. <sup>11</sup>Por eso os digo que vendrán muchos de oriente y occidente y se sentarán con Abrahán, Isaac y Jacob en el banquete del reino de los cielos.</p></div>

  <p class="note">La curación del criado del centurión es un episodio que Mateo coloca inmediatamente después del sermón de la montaña. Un centurión romano, jefe de cien soldados, intercede ante Jesús por su siervo paralítico. Su actitud es la de quien reconoce la autoridad de Jesús: basta una palabra suya. En este oficial extranjero, Jesús alaba una fe que no ha encontrado en Israel, y anuncia que muchos vendrán de oriente y occidente al banquete del Reino.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>En Jesús, dirigiéndose a la casa del centurión, descubro el rostro de nuestro Dios viniendo a visitar a nuestra humanidad. Y si Dios manifestado en el Nazareno es aquel que quiere entrar en mi casa, en mi vida, también es el que —como indica el profeta Isaías— desea llevar a cada uno de nosotros a morar en su casa, a compartir su propia vida. Si acepto su Palabra poniéndome en camino, me abrirá la intimidad de su morada. Su amor actúa para formar en mí, en mis hermanos y hermanas, una humanidad que olvide el odio, las guerras y el pecado en cualquiera de sus manifestaciones y se dirija hacia la meta de una reconciliación con él y hacia una renovada unión y comunión entre las personas, los grupos y los pueblos.</p>

  <p>Dios me invita a colaborar con su sueño, sobre todo acogiéndolo con fe, amando su voluntad y deseando sus promesas. La fe no es herencia étnica, cultural o algo por el estilo, ni siquiera un hábito religioso de algunos, sino la decisión de mi libertad humana por ser alumno en la escuela de la Palabra de Dios que me atrae a sí. Entonces, como el centurión, experimentaré en mi interior sentimientos de humildad y confianza. Humildad renunciando a salvarme por mis propios medios en un delirio de autosuficiencia; confianza consciente de que el Señor puede salir a mi encuentro en cualquier situación dirigiendo mis pasos por sus caminos de vida y de luz.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">¡Ven, Señor! El mundo te necesita y necesita tu promesa; necesita que tus palabras nos instruyan en lo hondo del corazón y nos muestren los caminos de la paz. Sin ti nuestro pobre mundo sólo conocería la prepotencia y los senderos insensatos de las incomprensiones, de las divisiones y de la violencia. Pero si tú vienes a instruirnos, veremos el nacer de una nueva humanidad, una humanidad capaz de mirar a lo alto y caminar sin prevaricaciones y en solidaridad hacia un centro de atracción común.</p>

  <p class="prayer">¡Ven, Señor! Ilumina nuestros pasos con tu luz y fortalece nuestros corazones, para que tengamos la osadía de forjar podaderas de las lanzas y arados de las espadas. Sólo con tu amor podremos emplear para el bien las energías que tenemos en vez de la fuerza terrible de laceración y disgregación. ¡Ven, Señor, no tardes!</p>
