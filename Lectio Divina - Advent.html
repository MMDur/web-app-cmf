  <p><sup>1</sup>El año quince del reinado del emperador Tiberio, siendo Poncio Pilato gobernador de Judea, Herodes tetrarca de Galilea, su hermano Filipo tetrarca de Iturea y de la región Traconítida, y Lisanias tetrarca de Abilene, <sup>2</sup>en tiempos de los sumos sacerdotes Anás y Caifás, la Palabra de Dios vino sobre Juan, el hijo de Zacarías, en el desierto.</p>
  <p><sup>3</sup>Y fue por toda la región del Jordán predicando que se convirtieran y se bautizaran para que se les perdonaran los pecados, <sup>4</sup>como está escrito en el libro de los oráculos del profeta Isaías:</p>
  <p><i>Voz del que grita en el desierto: preparad el camino al Señor; allanad sus senderos; <sup>5</sup>todo valle será rellenado y toda montaña o colina será rebajada; los caminos tortuosos se enderezarán y los ásperos se nivelarán. <sup>6</sup>Y todos verán la salvación de Dios.</i></p></div>

  <p class="note">Casi todo el fragmento es una exhortación, a la que sigue un deseo y una certeza final. Frases breves pero eficaces y salpicadas de indicaciones que Pablo desea que se traduzcan inmediatamente en la vida cotidiana de los cristianos.</p>

  <p class="note">Lucas tiene algunos aspectos originales al presentar la predicación del Bautista que permiten captar mejor su mensaje. Pone de manifiesto en primer lugar el acontecimiento de gracia de la «palabra» que viene a él: «vino la Palabra de Dios sobre Juan en el desierto». El desierto de Marcos aparece aquí como el lugar donde la Palabra divina llega al hombre convirtiéndolo en profeta (la expresión es similar a la de Jer 1,4).</p>

  <p class="note">Al «acontecimiento» de la Palabra Lucas antepone un cuadro histórico con tono muy solemne: «El año quince…» (vv. 1-2). Esta página no sólo es importante por sí misma, sino también porque enmarca la efusión de la Palabra sobre el Bautista, y cuando sobreviene la Palabra de Dios, la historia humana se convierte en historia de salvación. Lucas distingue a continuación los dos lugares en los que actúa el Bautista: el «desierto» y el «Jordán». El desierto es el lugar donde «recibe» la Palabra; el Jordán es el lugar donde proclama esta Palabra a los demás invitándolos a la conversión. Habiendo escuchado la Palabra de Dios en el desierto, Juan puede hacer resonar su invitación como oferta de salvación a todos. La palabra del Bautista se inspira en la magnífica predicación de Isaías (40,3ss): «En el desierto preparad el camino al Señor», pero a Lucas le gusta proseguir con la cita de Isaías hasta el texto en que proclama: «todos verán la salvación de Dios» (Lc 3,6) porque Dios desea verdaderamente llegar a todos.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>El comienzo de la época cristiana está marcado con el reaparecer de la profecía. Para Lucas, en Hechos, también el acontecimiento Iglesia comenzará con el don del Espíritu que nos hace profetas a todos los cristianos, hombres de la Palabra, capacitándonos, como al Bautista, para escuchar las urgencias de nuestro tiempo y proclamar la Palabra de salvación que enderece nuestros senderos humanos.</p>

  <p>¿Qué quiere decir, para nosotros, ser profetas? Ante todo y fundamentalmente significa recibir un anuncio de esperanza de parte de Dios. «Todo valle será rellenado y todo monte abajado» y Dios es el sujeto de estas acciones. Él será quien rebajará los montes y rellenará los valles de nuestra soberbia, de la injusticia social, de la incredulidad de nuestro corazón y allanará para cada uno de nosotros el camino de la conversión antes de que nos mande recorrerlo. Ciertamente que no nos faltarán cansancios cuando colaboraremos responsablemente en enderezar los caminos. Pero si es Dios quien interviene, quiere decir que ninguna de nuestras situaciones, por duras que sean, carecen de esperanza; precisamente nuestro compromiso «profético» está para que se pueda realizar nuestra esperanza.</p>

  <p>Además al profeta nunca le falta el desierto. Decir desierto significa silencio, búsqueda de la esencialidad, lucha contra la propia soberbia y contra los múltiples enemigos del alma, escucha atenta de la Palabra, distancia crítica de las «modas» y juicios demasiado precipitados. Quizás no resulte fácil pensar que ante una multitud bulliciosa sea más probable encontrar a alguno que escuche, pero el Bautista no parece que pensaba así. Juan nos enseña a amar el desierto, aunque conlleve no pocas situaciones de pobreza, indiferencia, injusticia, en las que se nos invita a hacer resonar la Palabra del consuelo y la fraternidad.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Me sorprende también este año tu promesa, Señor: mientras voy caminando con la Iglesia para preparar la Navidad, escucho que eres tú quien me abres el camino de la conversión.</p>

  <p class="prayer">Me abres un camino alcanzándome con tu Palabra, mientras yo con frecuencia la escucho distraídamente y sin entusiasmo; tú me recuerdas que el encuentro con tu Palabra es más fuerte que la potencia de los imperios y que los grandes de este mundo transformando mi vida en historia de salvación. Enséñame a escuchar, enséñame el silencio.</p>

  <p class="prayer">Me abres un camino prometiendo rebajar los montes y rellenar los valles. Si no fuera porque tú me lo dices, estaría tentado de pensar que tengo la batalla perdida de antemano: que no cese, Señor, de luchar contra las montañas del orgullo, de la ira, de los vicios y no me asuste por los fallos de mi respuesta poco generosa.</p>

  <p class="prayer">Me abres un camino indicándome tantos desiertos que encuentro a mi alrededor y los espacios vacíos que nuestra caridad no sabe cómo llenar: que pueda, Señor, hacer lo que esté de mi parte, sin desanimarme por tantas cosas como no puedo o no sé hacer.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>El amor divino sana todas las enfermedades del alma, arranca las raíces de todos los vicios, es el comienzo de todas las virtudes: ilumina la inteligencia, purifica la conciencia, serena el espíritu, revela a Dios.</p>
  <p>Quien posee el amor divino, piensa siempre en su encuentro con Dios; trata de evitar los escándalos y de encontrar la auténtica paz. Su corazón está siempre orientado a lo alto, a los bienes del cielo: en el trabajo o en el reposo, en cualquier circunstancia su corazón no se aleja nunca de Dios. En el silencio piensa en Dios, en las conversaciones sólo desea hablar de Dios y de su amor. Cuando exhorta a otros, inflama sus sentimientos, y al exaltar ante todos el amor divino, demuestra cuán dulce es con las palabras y con el ejemplo.</p>
  <p>Ven a nuestras almas, amor divino, ensancha los corazones, acrecienta los santos deseos, amplía la capacidad del espíritu para que pueda acoger a Dios como su eterno huésped (Hugo de San Víctor, <i>In lode del divino amare</i>, Milán 1987, 284-286).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Preparad el camino del Señor. Todos verán la salvación de Dios»</b> (Lc 3,4-6).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>La soledad es el horno de la transformación. Sin soledad seguimos siendo víctimas de nuestra sociedad, seguimos enredados en las ilusiones de nuestro falso yo. Jesús mismo entró en este horno (…).</p>
  <p>Para entender el verdadero significado de la soledad, es necesario desenmascarar algunas ideas deformadas de la misma. Todos admitimos la necesidad de algunos ratos de soledad. Sin embargo, lo que queremos a veces decir es la necesidad que tenemos de un tiempo y un lugar para nosotros mismos, un tiempo y un lugar en que nadie nos moleste. Soledad es a menudo para nosotros sinónimo de privado.</p>
  <p>Es más, pensamos en la soledad como una especie de estación de servicio en la que podemos cargar nuestras baterías, o como el rincón de un ring de boxeo en el que ponen aceite en nuestras heridas, dan masaje a nuestros músculos y nos animan a seguir en la lucha mediante eslóganes apropiados. Para ser breves, pensamos en la soledad como en el lugar en que reparamos nuestras fuerzas para proseguir la competencia incesante de nuestras vidas.</p>
  <p>No es ésta la soledad de Juan Bautista, san Antonio o san Benito, de Carlos de Foucauld o los hermanos de Taizé. Para ellos, la soledad no es un lugar terapéutico privado, sino el lugar de la conversión, el lugar donde muere el viejo yo y nace uno nuevo, el lugar donde emerge el hombre nuevo y la mujer nueva (H. J. M. Nouwen, <i>El camino del corazón</i>, Madrid 1986, 21-23).</p>
  `}
 ]},

{ id:"2-lun", title:"Lunes de la segunda semana", tag:"Segunda semana · Lunes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 35,1-10</span>
  <p><sup>1</sup>Se alegrarán el desierto y el yermo, la estepa se regocijará y florecerá; florecerá como el narciso, <sup>2</sup>se regocijará y dará gritos de alegría; le han dado la gloria del Líbano, el esplendor del Carmelo y del Sarón; y verán la gloria del Señor, el esplendor de nuestro Dios.</p>
  <p><sup>3</sup>Fortaleced las manos débiles, afianzad las rodillas vacilantes, <sup>4</sup>decid a los cobardes: «¡Ánimo, no temáis!; mirad a vuestro Dios: trae la venganza y el desquite; viene en persona a salvarlos».</p>
  <p><sup>5</sup>Se despegarán los ojos de los ciegos, los oídos de los sordos se abrirán, <sup>6</sup>brincará el cojo como un ciervo, la lengua del mudo cantará. Brotarán aguas en el desierto y arroyos en la estepa; <sup>7</sup>el páramo se convertirá en estanque, la tierra sedienta en manantial. En el cubil de los chacales brotarán cañas y juncos.</p>
  <p><sup>8</sup>Cruzará por allí una calzada cuyo nombre será «Vía Sacra». Los impuros no pasarán por ella. Él mismo guiará al caminante, y los inexpertos no se extraviarán. <sup>9</sup>No habrá en ella leones, ni se acercarán las bestias feroces. Los rescatados caminarán por ella, <sup>10</sup>por ella volverán los liberados del Señor. Llegarán a Sión entre gritos de júbilo; una alegría eterna iluminará su rostro, gozo y alegría los acompañarán, la tristeza y el llanto se alejarán.</p></div>

  <p class="note">En la breve escatología profética de este capítulo isaiano encontramos un auténtico «canto a la alegría» por la renovación cósmica y sobre todo antropológica que afecta a la debilidad del cuerpo mutilado y del ánimo apocado. Se trata de una renovación que lleva a cabo el Señor, creador y salvador. No se trata simplemente de una celebración de la vuelta de los deportados, sino de una proclamación de fe que reconoce en el actuar del Señor el cumplimiento de los más auténticos deseos humanos, ese anhelo de felicidad que alberga en lo hondo del corazón.</p>

  <p class="note">Este regocijo contrasta con el árido desierto y la estepa. Es la oposición entre el gozo que viene del Señor y que atraviesa, riega y vivifica toda la existencia, y el dolor y la aflicción que han pesado sobre el pueblo durante el destierro. El motivo último de la alegría es la intervención del Señor, que ha dado un vuelco a la historia y ahora guía a su pueblo por un sendero seguro. Con la ayuda del Señor, el camino del pueblo es ágil, hasta tal punto que los cojos no sólo caminan, sino que «brincan», y los mudos no sólo hablan sino que «cantan».</p>

  <p class="note">La belleza poética del texto va a la par con su profundidad teológica al releer el texto a la luz del Nuevo Testamento. Dios mismo se ha acercado a nosotros, ha venido a nuestro encuentro en Jesús.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 5,17-26</span>
  <p><sup>17</sup>Un día, mientras Jesús enseñaba, estaban allí sentados algunos fariseos y maestros de la ley que habían venido de todas las aldeas de Galilea, de Judea y de Jerusalén. Y el poder del Señor lo impulsaba a realizar curaciones.</p>
  <p><sup>18</sup>En esto, aparecieron unos hombres que traían en una camilla a un paralítico y querían introducirlo para ponerlo delante de Jesús; <sup>19</sup>pero, como no veían la manera de hacerlo a causa del gentío, subieron a la terraza, lo bajaron por el techo en la camilla y lo pusieron en medio, delante de Jesús.</p>
  <p><sup>20</sup>Viendo la fe que tenían, Jesús dijo: —Hombre, tus pecados quedan perdonados. <sup>21</sup>Los maestros de la ley y los fariseos empezaron a pensar: «¿Quién es éste que dice blasfemias? ¿Quién puede perdonar los pecados sino sólo Dios?».</p>
  <p><sup>22</sup>Pero Jesús, dándose cuenta de lo que pensaban, les dijo: —¿Qué es lo que estáis pensando? <sup>23</sup>¿Qué es más fácil, decir: Tus pecados quedan perdonados; o decir: Levántate y anda? <sup>24</sup>Pues vais a ver que el Hijo del hombre tiene en la tierra poder para perdonar los pecados. Entonces se volvió hacia el paralítico y le dijo: —Levántate, toma tu camilla y vete a tu casa.</p>
  <p><sup>25</sup>Él se levantó en el acto delante de todos, tomó la camilla en que yacía y se fue a su casa, alabando a Dios. <sup>26</sup>Todos quedaron atónitos y alababan a Dios, llenos de temor, diciendo: —Hoy hemos visto cosas extraordinarias.</p></div>

  <p class="note">Los espectadores del presente episodio evangélico se quedan sorprendidos por el hecho de que Jesús, ante este enfermo, que le presentaron de un modo un tanto rocambolesco, no lo curara inmediatamente, sino que le dirigiera unas palabras de perdón: «Hombre, tus pecados quedan perdonados» (v. 20). Sin embargo, el mismo texto evangélico proporciona un indicio que ayuda a superar el asombro: «Jesús, viendo la fe que tenían, dijo…». El evangelista nos indica con este detalle que es a la «fe» de estos camilleros que no se detienen ante ningún obstáculo a los que Jesús puede decir algo semejante. Sólo quien tiene fe sabe reconocer que el problema más grave del hombre es el pecado. Para eliminar de los hombres esta ceguera Jesús está como obligado a hacer el milagro (v. 22). Ciertamente la objeción secreta de los escribas parece oportuna, pero enmascara su indiferencia, su sentirse superiores a los demás. A juicio de los escribas, Jesús es un blasfemo porque se arroga un poder que compete sólo a Dios (v. 21). Pero tales pensamientos y su reto interior a Jesús les impiden ver dos cosas: cuál es el verdadero mal que aflige al enfermo y el hecho de que Dios no es celoso de su poder de perdón. Con la venida de su Reino desea provocar una práctica profunda y universal de perdón, teniendo como modelo y fuente el perdón que el Hijo del hombre ha venido a traer (v. 24). Esto es lo que debe suscitar la alabanza, indicada puntualmente por Lucas, el evangelista de la oración.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>El hecho de que Jesús responda con palabras de perdón a la búsqueda de los camilleros que llevan confiados al paralítico, quizás me resulte también a mí un tanto decepcionante. Y, sin embargo, si tuviese de verdad fe en Jesús, aprendería a compartir su modo de enfocar los «problemas» de la humanidad y comprendería que el perdón es más urgente que cualquier otra cosa, porque el pecado es la mayor de las desgracias que atenazan a la humanidad. Su Reino se manifiesta sobre todo como reconciliación de mi ser con Dios, como nueva posibilidad, dándome la gracia de volver a emprender el camino después de la parálisis de mi libertad causada por mi culpa.</p>

  <p>«¿Qué es más fácil?» (v. 23). Los que no tienen fe en Jesús quizás siguen pensando que son otros y más serios los problemas humanos: la defensa de la salud, la economía, la gestión del poder, el subdesarrollo, los desequilibrios ecológicos, etc. La Palabra de Dios resuena como condena de mi ceguera espiritual, que vuelve mi corazón incapaz de descubrir los auténticos signos del actuar divino en nuestra historia. La Palabra no se limita a denunciar mi pecado, sino que me brinda a la vez la gran noticia del perdón. Por esta razón mi desierto florece y la estepa árida pulula con nueva vida.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«Dios de la libertad y de la paz, que en el perdón de los pecados nos das un signo de la nueva creación, haz que toda nuestra vida, reconciliada en tu amor, sea alabanza y anuncio de tu misericordia».</p>

  <p class="prayer">Hoy, Señor, quiero unirme con mis hermanos y hermanas a la alabanza del paralítico, perdonado y sanado por ti, y proclamar la grandeza de tu don: el perdón de mis pecados. Con frecuencia también yo he pensado que mis problemas fuesen de otro tipo. ¡Era un necio sin comprender! Ahora tu Palabra me ha manifestado mi verdadero mal y me ha llevado a ti, mi salvación y mi guía. Ahora mi desierto ha florecido y mi estepa abunda de tu agua. Con el salmista también puedo proclamar: «Dichoso el que ve olvidada su culpa y perdonado su pecado… Reconocí ante ti mi pecado, no te encubrí mi falta; me dije: “confesaré al Señor mis culpas”, y tú perdonaste mi falta y mi pecado» (Sal 32).</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Tú, el más pequeño de los humanos, ¿quieres encontrar la vida? Mantén la fe y la humildad y (…) ahí encontrarás al que te custodia y vive secretamente junto a ti.</p>
  <p>Cuando te presentas a Dios en la oración, sea tu pensamiento como la hormiga, como uno que se arrastra por tierra, como un niño que balbucea. Y no digas nada ante él que pretendas saber. Acércate a Dios con corazón de niño.</p>
  <p>Ponte ante él para recibir los cuidados de padres que velan por sus niñitos. Se ha dicho: «El Señor guarda a los sencillos» (…). Cuando Dios vea que te fías más de él que de ti mismo (…), una fuerza desconocida te penetrará interiormente. Y sentirás en todo tu ser el poder del que está contigo (Isaac de Nínive, <i>Discursos ascéticos</i>, 19 passim).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«¡Ánimo! Nuestro Dios viene a salvarnos»</b> (Is 35,4).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>El Señor Jesús no vendrá rápidamente más que si lo esperamos con ardor. Lo que hará estallar la Parusía es una acumulación de deseos. Cristianos, encargados tras Israel de conservar viva sobre la tierra la llama del deseo, tan sólo veinte siglos después de la Ascensión, ¿qué hemos hecho de la espera?</p>
  <p>¿Cuál es el cristiano en el que la nostalgia impaciente por Cristo llega no a hundir (como debiera ser), sino tan siquiera a equilibrar sus cuidados de amor y sus humanos intereses? ¿Dónde está el católico tan apasionadamente vertido (por convicción y no por convención) a la esperanza de la Encarnación, que ha de extenderse, como lo están muchos humanitaristas a los sueños de una Ciudad nueva? Seguimos diciendo que velamos en expectación del Señor. Pero en realidad, si queremos ser sinceros, hemos de confesar que ya no esperamos nada.</p>
  <p>Hay que reavivar la llama a cualquier precio. A toda costa hay que renovar en nosotros el deseo y la esperanza del gran Advenimiento (P. Teilhard de Chardin, <i>El medio divino</i>, Madrid 1967, 171-172).</p>
  `}
 ]},

{ id:"2-mar", title:"Martes de la segunda semana", tag:"Segunda semana · Martes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 40,1-11</span>
  <p><sup>1</sup>Consolad, consolad a mi pueblo, dice vuestro Dios, <sup>2</sup>hablad al corazón de Jerusalén, gritadle que se ha cumplido su condena y que está perdonada su culpa, pues ha recibido del Señor doble castigo por todos sus pecados.</p>
  <p><sup>3</sup>Una voz grita: «Preparad en el desierto un camino al Señor, allanad en la estepa una calzada para nuestro Dios». <sup>4</sup>Que se eleven los valles, y los montes y colinas se abajen; que lo torcido se enderece y lo escabroso se allane. <sup>5</sup>Entonces se revelará la gloria del Señor y la verán juntos todos los hombres —lo ha dicho la boca del Señor—.</p>
  <p><sup>6</sup>Una voz dice: «¡Grita!» y yo pregunto: «¿Qué he de gritar?» «Toda carne es como hierba, todo su encanto como flor del campo». <sup>7</sup>Se seca la hierba, se marchita la flor, cuando el aliento del Señor sopla sobre ellas. Sí, el pueblo es hierba. <sup>8</sup>Se seca la hierba, se marchita la flor, pero la palabra de nuestro Dios permanece por siempre.</p>
  <p><sup>9</sup>Súbete a un monte elevado, mensajero de Sión; alza tu voz con brío, mensajero de Jerusalén; álzala sin miedo, di a las ciudades de Judá: «Aquí está vuestro Dios». <sup>10</sup>Aquí está el Señor; viene con poder y brazo dominador; viene con él su salario, le precede la paga. <sup>11</sup>Apacienta como un pastor a su rebaño y amorosamente lo reúne; lleva en brazos los corderillos, conduce despacito a las madres.</p></div>

  <p class="note">El papel del profeta y de los que se adhieran a su mensaje será precisamente preparar esta venida del Señor (v. 3). El ánimo del pueblo —rendido como un terreno accidentado por las pruebas, sufrimientos, desilusiones e infidelidades— podrá ahora acoger la revelación de la gloria de Dios igual y más que la gloria manifestada en el camino del éxodo (v. 5). Y aunque el hombre sea frágil y sus promesas efímeras (vv. 6-8), la Palabra del Señor es estable y su compromiso con la humanidad es eterno: el pueblo deportado deberá confiar en esta estabilidad de la promesa del Señor.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 18,12-14</span>
  <p>En aquel tiempo, dijo Jesús a sus discípulos: <sup>12</sup>¿Qué os parece? Si un hombre tiene cien ovejas y se le extravía una de ellas, ¿no dejará en el monte las noventa y nueve e irá a buscar la descarriada? <sup>13</sup>Y si logra encontrarla, os aseguro que se alegrará por ella más que por las noventa y nueve que no se extraviaron. <sup>14</sup>Del mismo modo vuestro Padre celestial no quiere que se pierda ni uno solo de estos pequeños.</p></div>

  <p class="note">La parábola de la oveja perdida en Lucas (15,3-7) es una exhortación a compartir la alegría del perdón que Dios otorga a los pecadores que se convierten y a la vez a disponernos al perdón. En el texto de Mateo, la misma parábola forma parte del discurso eclesial (cap. 18), en el que Jesús comunica a los discípulos algunas indicaciones preciosas acerca de la vida comunitaria: el esfuerzo por hacerse pequeños, disponibilidad a la acogida, atenciones para el que vacila en la fe…</p>

  <p class="note">En coherencia con dicho contexto, para el primer evangelista la parábola de la oveja perdida no habla directamente de Dios que se pone a buscar la oveja, sino de la comunidad, que debe ser «signo del rostro de Dios», de Dios que va a la búsqueda de la oveja perdida con una solicitud pastoral por el «pequeño» y más aún por el que se ha extraviado, por el pecador.</p>

  <p class="note">Dejar las noventa y nueve ovejas para buscar una es una locura; pero así es la locura de Jesús y debe ser la locura de la comunidad (v. 14). La comunidad no debe dejarse guiar por criterios de eficiencia, sino por el «cuidado» con el pequeño, con el insignificante, con el marginado o lejano, por el motivo que fuere. No se asegura automáticamente el éxito (v. 13: «Si logra encontrarla…»), pero se exhorta a la comunidad a no olvidar nunca el buscar la oveja perdida, porque será fuente de gran alegría: «os aseguro que se alegrará por ella más que por las noventa y nueve que no se extraviaron» (v. 13).</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Una de las imágenes más bucólicas y profundas del Dios bíblico es la del «buen Pastor». Nos sugiere su solicitud y la fuerza de su intervención para vencer a los enemigos de la libertad y dignidad de su pueblo; nos dice que es un guía seguro para el difícil y espinoso camino de nuestra vida.</p>

  <p>En nuestro vivir como comunidad de discípulos experimentamos directamente el consuelo de nuestro Dios, el ser llevados delicadamente sobre los brazos de su tierna solicitud pastoral. Ésta es la razón última para espolearnos a buscar constantemente al que se ha perdido. De hecho, nosotros somos los primeros en sentir el consuelo del Señor, y experimentamos la fidelidad del Padre con el pequeño y descarriado.</p>

  <p>En cuanto comunidad de discípulos, estamos llamados a manifestar a todos el rostro del Padre misericordioso, buscando a quien en las vicisitudes de la vida ha perdido la fe y la esperanza. Somos consolados que deben ser consoladores, haciéndonos compañeros de viaje de quien tiene el corazón abatido, fatigado por el dolor o la culpa.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Tu anuncio, Señor, es «evangelio» porque nos trae el consuelo, a nosotros débiles, descarriados, esclavos de tantos otros señores.</p>

  <p class="prayer">«Súbete a lo alto de un monte, tú que llevas buenas noticias a Sión» (Is 40,9). También hoy diriges este mensaje de amor al corazón de tu pueblo, porque eres el Dios de la alianza. Eres el divino Amante que nos dirige su invitación amorosa y nos habla a lo profundo de nuestro corazón.</p>

  <p class="prayer">Tú, Señor, eres el Padre de todo consuelo, que a nosotros, peregrinos en la tierra, nos prometes el cielo y la tierra nueva. Haz que también nosotros podamos consolar a los demás con el mismo consuelo con que tú nos consuelas. Espolea nuestros corazones para que nos pongamos contigo a la búsqueda de lo que estaba perdido: tú eres el Pastor que quiere salvar a la oveja perdida, infinitamente amada por tu corazón. Y si estamos perdidos, si estamos lejos de ti, concédenos escuchar las llamadas de la voz de tu Hijo, manso y humilde de corazón, que nos exhorta a volver a tu redil, a la verdadera vida que sólo es posible contigo.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Ven, Señor Jesús, busca a tu siervo, busca a tu oveja inválida; se ha ido errando tu oveja para que tú anduvieras recorriendo los montes. Deja las noventa y nueve y ven a buscar a esa que está perdida. Ven sin perros, ven que ya hace tiempo que espero tu venida. Ya sé que estás para llegar. Ven sin bastón, pero con amor y actitud clemente. Ven a mí que he estado vagando, lejos de tu rebaño, por los montes.</p>
  <p>Búscame, porque yo te busco. Rodéame, encuéntrame, levántame, llévame. Tú puedes encontrar lo que buscas. Tú aceptas llevar sobre ti lo que has encontrado. No te da fastidio un peso de amor. Ven, pues, Señor, porque tú eres el único que puedes hacer volver a una oveja vagabunda sin contristar a las que has dejado, porque también ellas se alegran del retorno del pecador. Ven a ejecutar la salvación a la tierra, la gloria en el cielo (San Ambrosio, <i>Comentario al Salmo 118</i>, XXII, 27-29).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«El Padre del cielo no quiere que se pierda ni uno de estos pequeños»</b> (Mt 18,14).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p><b>Gracias, Señor.</b></p>
  <p>Si me hubiese contentado con el deseo que me llevaba a buscarte, sin saber dónde te hubiera podido encontrar, estaría todavía caminando con mi deseo insatisfecho o con la ilusión de haber encontrado.</p>
  <p>Te he encontrado de verdad porque tú has salido a mi encuentro en mis caminos de pecado: hombre entre los hombres, cuerpo bendito al que yo mismo ayudaba a despojar o flagelar; rostro santo, al que mis labios como los de Judas besaron; corazón que atravesé…</p>
  <p>Ninguna sed creó nunca las fuentes ni hizo brotar agua de la arena. Tu sed, por el contrario, me ha saciado, porque si tú no hubieras venido por mis caminos, si tú no te hubieras dejado crucificar por mí, te habría quizás buscado, pero no te habría encontrado nunca (Primo Mazzolari).</p>
  `}
 ]},

{ id:"2-mie", title:"Miércoles de la segunda semana", tag:"Segunda semana · Miércoles",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 40,25-31</span>
  <p><sup>25</sup>¿A quién me podéis comparar, a quién me podéis asemejar? —dice el Santo—. <sup>26</sup>Alzad los ojos al cielo y mirad: ¿quién ha creado todo esto? Él saca en orden su ejército y llama a cada uno por su nombre; es tan grande su poder y tan robusta su fuerza, que ni uno solo se pierde.</p>
  <p><sup>27</sup>¿Por qué dices, Jacob, y afirmas, Israel: «Mi destino está oculto al Señor, mi Dios pasa por alto mi derecho»? <sup>28</sup>¿No lo sabes? ¿No lo has oído? El Señor es un Dios eterno, creador de los confines de la tierra. No se cansa ni se fatiga, y su inteligencia es insondable.</p>
  <p><sup>29</sup>Él da fuerza al cansado y acrecienta el vigor al que desfallece. <sup>30</sup>Los muchachos se cansan y se fatigan, los jóvenes tropiezan y caen; <sup>31</sup>pero los que esperan en el Señor renuevan sus fuerzas, les brotan alas como a las águilas, corren sin cansarse, caminan sin fatigarse.</p></div>

  <p class="note">El Segundo Isaías es el primer testimonio bíblico que afirma claramente un monoteísmo teórico y práctico. El profeta no ha llegado a esta conclusión con raciocinios filosóficos o lógicos, sino meditando la historia de salvación y la experiencia de fe de Israel. Este monoteísmo se expresa frecuentemente con el lenguaje de la incomparabilidad, es decir, con preguntas retóricas que subrayan la incuestionable unidad del poder salvador del Señor y su recorrido por caminos vírgenes e inéditos para socorrer a sus fieles (cf. v. 25). El discurso sobre Dios en el Segundo Isaías se guía siempre por la necesidad pragmática de convencer a sus oyentes de que Dios puede y quiere salvarlos, mejor aún «consolarlos», demostrando que cuida eficazmente de sus fieles.</p>

  <p class="note">Si así es el Dios de Israel, no hay motivo para que el pueblo elegido dude y se sienta abandonado por el Señor, aunque se encuentre en la dura situación del destierro. Pero lleva consigo la renuncia a todo tipo de autosuficiencia, ilustrada con la metáfora de las fuerzas que llegan a faltar incluso a jóvenes y adultos (v. 30), y el reconocimiento de la propia debilidad y fragilidad ante el Señor. Sólo así Israel se dará cuenta de que su fuerza le viene del mismo Dios (v. 31) y podrá revivir la experiencia del éxodo, cuando el socorro divino le haga sentir como aupado y llevado «en alas de águila» en el tiempo del duro caminar por el desierto (cf. Ex 19,4).</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 11,28-30</span>
  <p>En aquel tiempo, exclamó Jesús: <sup>28</sup>Venid a mí todos los que estáis fatigados y agobiados, y yo os aliviaré. <sup>29</sup>Cargad con mi yugo y aprended de mí, que soy sencillo y humilde de corazón, y hallaréis descanso para vuestras vidas. <sup>30</sup>Porque mi yugo es suave y mi carga ligera.</p></div>

  <p class="note">En el pasaje precedente, estrechamente vinculado con nuestro texto evangélico (Mt 11,25-27), Jesús aclara que el verdadero conocimiento de Dios como Padre es posible porque el Hijo es quien introduce en esta familiaridad a sus propios discípulos. Pero éstos, para acoger de verdad esta paternidad divina y la amistad del Hijo, deben hacerse «pequeños».</p>

  <p class="note">Y Jesús nos indica quién es el verdaderamente «pequeño»: sólo el que crea que el estilo de Jesús, «sencillo y humilde de corazón», es el único camino para introducirnos en los secretos de Dios, y que para aprender este estilo se acerque a él iniciando un camino de seguimiento («Venite a me…»). Como la Sabiduría en el Antiguo Testamento (cf. Eclo 51,26-27; 6,24ss) invita a su escuela prometiendo «descanso», es decir, esa plenitud capaz de sosegar el corazón inquieto de la humanidad, así Jesús, capaz de sosegar el corazón inquieto de la humanidad, invita a su apasionante escuela en la que descubrimos que somos hijos de Dios.</p>

  <p class="note">Por consiguiente, es necesario entrar en su escuela, acercándonos a él que habla del Padre a los propios amigos y descubrir que la familiaridad con Jesús es una escuela exigente y continua, pero también capaz de sanar, de dar paz al corazón. Ciertamente Jesús no exime al discípulo del compromiso pleno y perseverante en la observancia de la ley de Dios, como aparece cuando nos habla de «yugo» y de «carga». Pero promete que será un peso proporcionado, adecuado a quien lo debe llevar y que a la postre se manifestará como una experiencia de libertad.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Siento la necesidad de repetir a mi corazón la verdad de mi filiación porque me queda la sospecha del amor de Dios. Es la sospecha que la serpiente envidiosa de nuestra dignidad sembró en nuestros corazones humanos desde el comienzo. Se trata de una sospecha que se alimenta continuamente al presentarme un rostro de Dios enemigo de nuestra libertad, celoso de nuestra felicidad, juez duro y severo, incapaz de comprender nuestra flaqueza.</p>

  <p>Escuchando la invitación de Jesús de ir a él, se me exhorta a volver al gran amor con que Dios me ha amado para poder considerarme tal y como soy en realidad, es decir, su amigo e hijo del Padre. Para comprender mi filiación y la paternidad de Dios en mis relaciones, debo acercarme al corazón de Jesús. Así podré escuchar esas palabras suyas que desbordan la plenitud de su corazón (cf. Mt 12,34). De lo contrario, mi religiosidad será mercenaria, un cansancio ímprobo y estéril de prácticas y observancias incapaces de pacificar mi corazón.</p>

  <p>En la contemplación y escucha de Jesús «sencillo y humilde de corazón» es donde me libero del peso de una religión tejida únicamente de méritos, obras, deberes, porque en Jesús se manifiesta el rostro amable de Dios, capaz de saciar mis más profundos deseos. La fe se convierte entonces en experiencia de ser revestido de la fuerza de lo alto, de un correr sin fatigarse, porque soy como aupado sobre las alas de un águila al encuentro de un amor preexistente y, precediéndome, me enseña a desear tu promesa.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor Jesús, tú nos invitas a ir a ti. Qué hermoso es descubrir que nos quieres cercanos, alumnos de tu escuela, que deseas hacernos partícipes del misterio de tu Padre, reconociéndonos amados y hermanos tuyos.</p>

  <p class="prayer">¡Ir a ti! Ir a tu escuela exigente y fascinante. Ir a ti para aprender de ti que eres manso y humilde de corazón.</p>

  <p class="prayer">¡Ir a ti! No con nuestros méritos sino con nuestros cansancios y opresiones. Ir a ti sin fingimientos, sin ocultar nuestras miserias y debilidades. Ir a ti para poder volver a ti. Ir a ti para poner en ti nuestra esperanza, para descansar en ti y volver a caminar a tu lado sin desfallecer.</p>

  <p class="prayer">¡Ir a ti! Y en ti recobrar las fuerzas y encontrar la paz tan ansiada. Tu querer no nos aplasta porque tu yugo es suave y tu carga ligera.</p>

  <p class="prayer">Realmente es espléndida tu promesa, por la que te alabamos y bendecimos.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>«¡Venid!» Jesús, invitando, sabe que el verdadero padecimiento tiende a encerrarse en soledad y a recomerse en muda desolación. En su invitación, Jesús no puede esperar que los infelices oprimidos por el peso de sus males vayan a él; los llama amorosamente. De hecho, diciendo: «Venid a mí» es él quien va a ellos.</p>
  <p>¡Oh si aceptases su invitación! Supone que los desgraciados estén tan fatigados, desalentados, agotados, que olvidan hasta la existencia de un consuelo. Jesús lo sabe muy bien: no existe consuelo ni ayuda fuera de él. Por eso nos dirige su invitación: «¡Venid!»</p>
  <p>No importa que estés exhausto de andar el camino, tan largo y tan vano, que has recorrido hasta ahora buscando ayuda. Aunque te parezca que no puedes ya más, ni siquiera sostenerte ya por un solo instante sin desmayar: da un pasito más y lograrás el descanso. «¡Venid!» Y si alguno se encontrase tan fastidiado que ni siquiera pueda moverse, bastaría un suspiro, pues si suspiras por Él, significa ya venir a Él (S. Kierkegaard, <i>Ejercitación del cristianismo</i>, Madrid 1961, 53-55).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Venid a mí, todos los que estáis fatigados y agobiados, y yo os aliviaré»</b> (Mt 11,28).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Guíame, luz benigna, en medio de las tinieblas: guíame hacia delante. La noche está oscura y estoy lejos de casa. Por favor, te ruego: guíame. Vela mi camino. No te pido que pueda ver un horizonte lejano, un solo paso me basta.</p>
  <p>No siempre fue así, ni rogaba que me guiases. Me gustaba elegir por mí mismo y recorrer por mi cuenta la vida. Pero ahora, te ruego: guíame.</p>
  <p>Me gustaba el sol radiante y, a pesar de los temores, me guiaba el orgullo. No recuerdes los días pasados.</p>
  <p>Tu poder me ha bendecido ampliamente, y estoy seguro de que me seguirás guiando por páramos y cenagales, rocas y torrentes hasta que vuelva el día.</p>
  <p>Reaparecerán en la mañana los rostros de los ángeles, tan amados pero que aún no veo (J. H. Newman, <i>Méditations et Prières</i>, París 1906).</p>
  `}
 ]},

{ id:"2-jue", title:"Jueves de la segunda semana", tag:"Segunda semana · Jueves",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 41,13-20</span>
  <p><sup>13</sup>Yo, el Señor tu Dios, sostengo tu diestra y te digo: «No temas, yo mismo te auxilio». <sup>14</sup>No temas, gusanillo de Jacob, pobre oruga de Israel; yo te auxilio, oráculo del Señor; tu redentor es el Santo de Israel.</p>
  <p><sup>15</sup>Te convertiré en trillo afilado, trillo con piedras y sierras; trillarás los montes hasta molerlos, reducirás a paja las colinas. <sup>16</sup>Los aventarás y el viento se los llevará, el vendaval los esparcirá. Y tú podrás alegrarte gracias al Señor, gracias al Santo de Israel te gloriarás.</p>
  <p><sup>17</sup>Los desvalidos y los pobres buscan agua y no la encuentran; su lengua está reseca por la sed. Pero yo, el Señor, los atenderé; yo, el Dios de Israel, no los abandonaré. <sup>18</sup>Haré brotar ríos en las cumbres peladas y fuentes en medio de los valles, transformaré el desierto en estanque, la tierra árida en manantiales de agua. <sup>19</sup>Pondré en el desierto cedros, acacias, mirtos y olivares; plantaré en la estepa abetos, y también cipreses y olmos, <sup>20</sup>para que vean y sepan, para que reflexionen y aprendan que lo ha hecho la mano del Señor, que lo ha creado el Santo de Israel.</p></div>

  <p class="note">El tema de la redención tiene especial relieve en la profecía del Segundo Isaías. Nos lleva al contexto social del antiguo Israel e indica la persona y la acción del «redentor», o sea, del pariente que, por la afinidad de la sangre, tiene la función de rescatar a su pariente (o también la persona vinculada por un pacto) cuando éste ha sido hecho esclavo o tiene una propiedad enajenada para pagar deudas. El Señor rescata a Israel porque se ha vinculado a él con una «familiaridad» o solidaridad de parentesco fundada en la creación y más aún en el acontecimiento del éxodo.</p>

  <p class="note">Por eso el profeta recuerda al pueblo que puede y debe contar con el Señor, que puede y quiere salvarlo de los enemigos y desea colmarlo de gozo y de favores. El pueblo debe reconocerse entre los míseros sedientos, que buscan en vano agua para calmar la sed y hacia los cuales se dirige la iniciativa amorosa del Señor. Por su pueblo va a ejecutar un nuevo éxodo teniendo como escenario un desierto cubierto de abundante vegetación y regado con ríos como el Edén (v. 18). En este jardín encantador, el pueblo de Israel encontrará de nuevo a su Dios: verá, sabrá, reflexionará y finalmente comprenderá la obra del Señor (v. 20).</p>

  <p class="note">Con tan abundante recurso al tema de la creación, el profeta Isaías recuerda a los oyentes que, si la acción salvífica de Dios a favor de su pueblo se sitúa en el grandioso escenario de su actividad creadora, la salvación obrada por él no está reservada exclusivamente al pueblo elegido, sino abierta a todos y a todo.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 11,11-15</span>
  <p>En aquel tiempo, dijo Jesús a la gente: <sup>11</sup>Os aseguro que entre los hijos de mujer no ha habido uno mayor que Juan el Bautista; sin embargo, el más pequeño en el reino de los cielos es mayor que él. <sup>12</sup>Desde los días de Juan el Bautista hasta ahora, el reino de los cielos sufre violencia, y los violentos pretenden apoderarse de él. <sup>13</sup>Pues todos los profetas y la ley profetizaron hasta Juan. <sup>14</sup>Y si queréis aceptarlo, él es el Elías que tenía que venir. <sup>15</sup>El que tenga oídos que oiga.</p></div>

  <p class="note">Mateo, después de la narración del envío a Jesús de algunos discípulos por parte del Bautista y la respuesta que llevan al profeta encarcelado, refiere también las palabras de Jesús a la multitud sobre Juan.</p>

  <p class="note">Jesús formula el mayor elogio exaltando su firmeza de fe y su grandeza moral hasta el punto de definirlo como el más grande entre los mortales (v. 11), el culmen de toda la historia de fe de Israel (v. 13). Y, sin embargo, el que se pone a seguir a Jesús entra en un orden nuevo de salvación, en la economía del reino donde el más pequeño goza de la incomparable dignidad de hijo de Dios (v. 11), dignidad que sobrepasa incluso la enorme estatura moral de Juan y su altísimo papel de Precursor. Su misión no se agota con anunciar al Mesías, prevé también una anticipación, en su persona, del destino doloroso del Mesías. De hecho, lo que sucederá a Juan demostrará lo agresivas que son las tentativas de los enemigos del Reino para que éste no cale en la vida humana (v. 12).</p>

  <p class="note">Jesús, finalmente, invita a una comprensión profunda del papel y persona del Bautista a la luz de la Ley y los profetas, es decir, del plan de Dios testimoniado en las Escrituras. Una lectura atenta y dispuesta a un serio discernimiento de fe («El que tenga oídos que oiga»: v. 15) nos hará comprender que el Bautista es como el gozne entre las dos economías, la de la expectativa y la del cumplimiento, y que en él se realiza esa espera de la salvación.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Dios viene en ayuda de su pueblo y de cada uno de nosotros como ayuda distinguida que hace gala de su valentía, como el que se hace totalmente solidario y cercano. En esta proximidad de Dios a la vida del pueblo está mi riqueza, yo que por otra parte sería insignificante como un «gusanillo». Este encuentro con Dios, mi redentor, y con la profunda renovación de mi pobre corazón, que el evangelio obra en mí, no se lleva a cabo sin mi libertad, sino que exige una opción de fe, la decisión de abrirme a una comprensión más profunda de las Escrituras. Éstas me ponen frente a la radical novedad manifestada en el plan de Dios con la venida de Jesús.</p>

  <p>La meditación de la figura del Bautista se convierte en una severa provocación para que sepa reconocer la enorme oportunidad que se me brinda de entrar a formar parte del Reino y a acoger el inmenso don de la dignidad de hijo de Dios, que supera cualquier otra grandeza moral o religiosa a la que pudiera aspirar.</p>

  <p>«El reino de los cielos sufre violencia, y los violentos pretenden apoderarse de él» (Mt 11,12). Advierto que la invitación urgente de la Palabra de Dios me invita a no hacerme el remolón y a superar cualquier temor para adherirme en plenitud al que viene a librarme y rescatarme.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor, me llena de gozo y consuelo el saber que, si acojo tu amor en mi vida, aunque sea el más pequeño y el último de los humanos, sería en tu Reino mayor que el Bautista. Mis palabras son demasiado pobres para celebrar tu inmenso amor para conmigo, pero siento resonar en mi interior la voz de tu Palabra consignada por el profeta Isaías, que me enseña a orar y a alabarte.</p>

  <p class="prayer">«Tú eres el Señor mi Dios que me agarra de la diestra y me dice: “no temas, yo mismo te auxilio”. No temo, aunque soy un gusanillo de tu pueblo, porque tú me auxilias, porque eres mi redentor, el Santo de Israel. Era pobre e indigente, buscaba agua y no la había; mi lengua estaba reseca de sed; pero tú, Señor, me escuchaste y no me has abandonado. Has alumbrado ríos en las cumbres peladas de mi pecado, fuentes de agua en el yermo de mi angustia. Has cambiado mi desierto en estanque. Todo ha sido obra de tu mano». ¡A ti la alabanza por los siglos!</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Mi constante deseo ha sido llegar a ser santa; mas, por desgracia, cuantas veces me he comparado con los santos, he comprobado que existe entre ellos y yo la misma diferencia que notamos entre una montaña cuya cumbre se pierde en las nubes y el humilde grano de arena pisoteado por los caminantes.</p>
  <p>Pero en vez de desalentarme, me digo que es imposible que Dios inspire deseos irrealizables, y que, a pesar de mi pequeñez, puedo aspirar a la santidad. Me es imposible engrandecerme; debo soportarme tal como soy, con mis innumerables imperfecciones; pero quiero buscar el modo de ir al cielo por un caminito bien recto, bien corto, un caminito del todo nuevo.</p>
  <p>Estamos en el siglo de los inventos y quisiera encontrar un ascensor para elevarme hasta Jesús. He buscado en los Libros Santos y he leído: «Si alguien es muy pequeño, que venga a mí».</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Yo, el Señor tu Dios, sostengo tu diestra y te digo: “No temas, yo mismo te auxilio”»</b> (Is 41,13).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Quizás nos baste intentar. Decir nos basta: aquí estamos. Ya lo ves: no sabemos. Humildes te decimos: piénsalo tú, Señor. A ti desde nuestra nada, a ti desde nuestra nada, confiamos la carne cansada, el alma, la mente.</p>
  <p>(G. Testori, <i>Post-Hamlet</i>, acto III)</p>
  `}
 ]},

{ id:"2-vie", title:"Viernes de la segunda semana", tag:"Segunda semana · Viernes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 48,17-19</span>
  <p><sup>17</sup>Así dice el Señor, tu libertador, el Santo de Israel: Yo, el Señor tu Dios, te instruyo por tu bien, te marco el camino a seguir. <sup>18</sup>¡Ojalá hubieras atendido mis mandatos! Tu bienestar sería como un río; tu prosperidad, como las olas del mar; <sup>19</sup>tu descendencia sería como la arena; como sus granos, el fruto de tus entrañas; tu nombre no habría sido borrado ni apartado de mi presencia.</p></div>

  <p class="note">En su anuncio, el Segundo Isaías se concentra en la revelación del Señor como Dios de Israel ofreciendo una especie de «rosario» de los nombres de Dios. Además de «redentor», aparece aquí el título «Santo de Israel», expresión que cita siete veces (41,14; 43,3.14; 47,4; 48,17; 49,7; 54,5), siempre para definir al Dios de Israel que rescata a su pueblo. La acción salvífica que manifiesta la santidad divina se realiza también en adoctrinar íntimamente el corazón del pueblo, para que pueda seguir el camino de la alianza y para que logre conocer el designio amoroso, salvador, gratuito de Dios con la humanidad, con vistas a su realización creó el mundo (v. 17).</p>

  <p class="note">Esta realidad lleva al profeta a hacer una especie de balance de la historia pasada de la alianza, como tiempo en el que la falta de escucha de la Palabra divina y la transgresión de su ley de vida han arrastrado a Israel lejos de la prosperidad de las promesas incluidas en la alianza. Pero ahora Dios da nuevamente su Palabra eficaz para que obedeciéndola produzca efectos profundos y duraderos, llevando a Israel a vivir en la justicia derramada por Dios al pueblo (v. 18), garantizando el cumplimiento de la promesa hecha a los Padres (v. 19; cf. Gn 12,2-3; 22,17).</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 11,16-19</span>
  <p>En aquel tiempo, dijo Jesús a la gente: <sup>16</sup>¿Con quién compararé a esta generación? Es como esos muchachos que, sentados en la plaza, cantan a los otros esta copla: <sup>17</sup>«Os hemos tocado la flauta y no habéis danzado, hemos entonado lamentos y no habéis hecho duelo». <sup>18</sup>Porque vino Juan, que no comía ni bebía, y dicen: «Está endemoniado». <sup>19</sup>Viene el Hijo del hombre, que come y bebe, y dicen: «Ahí tenéis un comilón y un borracho, amigo de publicanos y pecadores». Pero la sabiduría ha quedado acreditada por sus obras.</p></div>

  <p class="note">El evangelista nos transmite un dicho de Jesús acerca de la radical incapacidad de sus contemporáneos a aceptar la bondad del tiempo presente, porque no están dispuestos a desear nada que sea realmente diverso. Son como niños que no entran en el juego, que ni saben lamentarse ni divertirse. La parábola presenta dos grupos de niños en conflicto entre ellos, porque el segundo grupo ha perdido interés en el juego, incluso antes de haberlo comenzado (vv. 16-17). La doble reacción de los contemporáneos con el Bautista y con Jesús (v. 18), su mala voluntad manifiesta, les asemeja a los niños caprichosos de la parábola.</p>

  <p class="note">En Mateo la sentencia final ofrece una respuesta a esa reacción contrapuesta de los estilos de devoción: el estilo sabio de Dios ha sido reconocido justamente por los que se toman seriamente en consideración su modo de actuar. Jesús es la sabiduría de Dios, la cual se manifiesta en sus obras (v. 19). En definitiva, pretende sacudir las conciencias de sus oyentes para disponerlos a acoger la «hora desconocida de Dios». Sus palabras sobre el Bautista concluyen con una llamada a la comprensión de fe, equivalente a una decisión del proyecto salvífico de Dios, en sintonía con su modo de actuar y de revelarse en la historia.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Reconocer la hora de Dios, el tiempo oportuno, es un signo de sabiduría (cf. Ecl 3,1ss). Como a los contemporáneos de Jesús, también a mí me invita la figura de Juan a hacer sinceras obras de penitencia. Reconocer la hora de Dios es para mí, ante todo, renunciar a atrincherarme en mis diversas excusas, que enmascaran mi desinterés y mi resistencia a la invitación a la conversión que la Palabra de Dios incesantemente me dirige. Las reiteradas admoniciones proféticas me exhortan a caminar por la justicia y por la fe operativa y sincera.</p>

  <p>Pero la hora de Dios no es sólo la de la penitencia y cambio de vida, es también la del gozo que nos trae el evangelio de Jesús. El gozo evangélico nacerá en mí al reconocer que él no se avergonzó de ser llamado «amigo de publicanos y pecadores». El perdón que me anuncia no se reduce a una mera palabra o una noticia genérica de Dios en mis confrontaciones, sino que es acontecimiento desconcertante de venir a celebrar una fiesta conmigo que soy pecador. No se trata de una fiesta que puedo dejar para mañana (como quisieran los niños caprichosos de la parábola evangélica); ¡para mí es hoy!</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor, tu Palabra me hace hoy pensar y reflexionar sobre mí mismo. Sé que hay un tiempo para cada cosa bajo el sol: tiempo de llorar y tiempo de bailar. Pero descubro que, con frecuencia, soy poco sabio, distraído e incapaz de reconocer tu hora en mi vida. Querría hacer todo a mi estilo, decidir los tiempos a mi gusto, y por desgracia me debo reconocer entre los niños caprichosos que no han entrado en el juego. Temo llegar a ser yo también víctima de una terca obstinación que me impida juzgar rectamente.</p>

  <p class="prayer">Te ruego, pues, que no dejes de dirigir tu Palabra a mi corazón obstinado y duro, así podré comprender tu designio sobre mí y lograr la verdadera sabiduría. Repréndeme, incluso con dureza, cuando quieras que escuche los llamamientos del Bautista a la penitencia y a la conversión. Ayúdame a saber reconocer que éste es el tiempo de tu gracia, porque eres: «El Señor mi Dios que me enseña para mi bien y me guía por el camino que debo seguir».</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>El alma que ha perdido la paz debe arrepentirse, y el Señor le perdonará los pecados, y entonces encontrará el gozo y la paz. ¿Qué más debemos esperar? ¿Pedir que alguien cante músicas celestiales? En el cielo todo vive por obra del Espíritu Santo y a nosotros en la tierra se nos ha dado el mismo Espíritu Santo, y si lo conservamos, se nos liberará de toda tiniebla y permanecerá en nosotros la vida eterna.</p>
  <p>El Señor ama al hombre y se le manifiesta como le place. Y el alma, cuando ve al Señor, se regocija humildemente de la misericordia de Dios. Para conocer al Señor, no se necesita ser rico o sabio, sino obediente, sobrio y humilde.</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Yo soy el Señor tu Dios, te enseño para tu bien»</b> (Is 48,17).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Soy un traidor, si tú no me ayudas, Jesús mío misericordioso. Tú me conoces, Señor; no te fíes de tu siervo: porque si tú no lo guardas, huirá, engañado por otro: una bestia dorada será su dios; pero, si tú le ayudas, Señor, si no le privas de la luz de tu rostro adorable, si además él no huye de tu mirada, temerá y temblará y se quedará contigo.</p>
  <p>Jesús, sobre mi cabeza está la impronta de tu sangre y, si el mundo intenta encantarme, esa sangre resplandezca a lo lejos y el mundo se apartará, sin haber extendido su mano (G. Gezelle, en A. Mor - J. Weisgerber, <i>Le letterature del Belgio</i>, Milán 1968).</p>
  `}
 ]},

{ id:"2-sab", title:"Sábado de la segunda semana", tag:"Segunda semana · Sábado",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Eclesiástico 48,1-4.9-11</span>
  <p><sup>1</sup>Entonces surgió el profeta Elías como un fuego, su palabra quemaba como antorcha. <sup>2</sup>Él hizo venir sobre ellos el hambre, y en su celo los diezmó. <sup>3</sup>Por la palabra del Señor cerró los cielos e hizo también bajar fuego tres veces. <sup>4</sup>¡Qué glorioso fuiste, Elías, con tus prodigios! ¿Quién pretenderá parecerse a ti?</p>
  <p><sup>9</sup>Fuiste arrebatado en torbellino ardiente, en un carro con caballos de fuego. <sup>10</sup>De ti está escrito que en los castigos futuros aplacarás la ira antes que estalle, para reconciliar a los padres con los hijos y restaurar las tribus de Jacob. <sup>11</sup>Felices los que te vieron y murieron fieles al amor, porque también nosotros viviremos.</p></div>

  <p class="note">El elogio de los padres es la sección más original de toda la obra del Sirácida. El autor relee el pasado con una función didáctica para el presente y nos pinta una galería de «medallones» de los grandes personajes, buenos y malos, de la historia bíblica. Entre estos héroes, recoge la figura del profeta Elías. A Elías se le parangona al fuego por su celo, por su pasión ardiente por la causa del Señor, el Dios de Israel. Su vida, de hecho, la dedicó totalmente al servicio del Dios de Israel, en cuya presencia Elías vivía continuamente (cf. 1 Re 18,15).</p>

  <p class="note">Además de su ardiente predicación para llevar al pueblo al único Dios, los rasgos trazados por el Sirácida subrayan los aspectos taumatúrgicos, de acuerdo con las tradiciones populares de su época (vv. 2-4). Pero el culmen del elogio de Elías está en la consideración de su destino singular (el rapto en el carro de fuego: v. 9), visto como una victoria sobre la muerte por obra del amor de Dios. Su figura es, pues, acicate para esperar una vida más allá de la muerte, una bienaventuranza plena que espera a los que, como Elías, «mueren fieles al amor».</p>

  <p class="note">Al motivo de su arrebato al cielo en la tradición judía (cf. Mal 3,24) se asocia el de la espera de su regreso, preparando a los hijos de Israel a la llegada de los tiempos mesiánicos (v. 10). El Nuevo Testamento heredará esta tradición judía del regreso de Elías viendo su cumplimiento en la persona de Juan Bautista.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 17,10-13</span>
  <p><sup>10</sup>Los discípulos le preguntaron: —¿Por qué dicen los maestros de la ley que primero tiene que venir Elías? <sup>11</sup>Jesús les respondió: —Sí, Elías tenía que venir a disponerlo todo. <sup>12</sup>Pero os digo que Elías ha venido ya y no lo han reconocido, sino que han hecho con él lo que han querido. Del mismo modo van a hacer padecer al Hijo del hombre. <sup>13</sup>Entonces entendieron los discípulos que se refería a Juan el Bautista.</p></div>

  <p class="note">Después de la transfiguración, Jesús, bajando del monte, mantiene con sus discípulos una conversación que trata de uno de los personajes de la visión: Elías.</p>

  <p class="note">Refiriéndose a las discusiones rabínicas del papel de Elías, sobre la verdad y el significado de su regreso anunciado por Malaquías (3,23-24), Jesús declara aceptar la tesis de los que afirman la necesidad de una venida de Elías antes del juicio. Por otra parte, Jesús niega cualquier visión fantástica, comúnmente difundida, de un regreso de Elías e invita a los discípulos a discernir el plan de Dios que está manifestándose ante sus propios ojos. Por consiguiente, afirma que Elías ya ha venido, pero no lo han conocido, y que la suerte de Elías anuncia la del Hijo del hombre (v. 12).</p>

  <p class="note">Para llevar a los discípulos a la comprensión de la urgencia de la conversión, de la sanación de las relaciones interpersonales y de la relación con Dios, Jesús identifica expresamente a Elías con el Bautista. Los discípulos comprenden tal identificación (v. 13). Resulta así claro que tal identificación no se desprende automáticamente de las Escrituras, sino que se revela a quien, desde la docilidad de la fe, está dispuesto a acoger la predicación de Juan con su invitación a convertirse y prepararse al encuentro del que viene. Por un momento, los discípulos parecen, pues, comprender; aunque muy pronto caerán de nuevo en la incomprensión, en su obstinada incredulidad (cf. Mt 15,20).</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La figura del Bautista predomina en las lecturas litúrgicas de estos días de adviento. Más que ponerme a considerar cuestiones históricas del personaje, hoy me siento llamado a meditar en el significado de su persona para mi vida, su parangón con el profeta Elías manifestado en el texto evangélico. La misión del Bautista trata, en analogía con la de Elías, dos puntos capitales también para mi vida: mi relación con Dios (que me pide volver a él) y el sanar mis relaciones con el prójimo.</p>

  <p>Debo dejarme interpelar por el Bautista, cuya voz proclamaba con valentía, como el profeta Elías, el derecho de Dios sobre nuestra humanidad: darle a él sólo culto y buscar una adhesión integral de vida a la alianza con el Señor. En este sentido Juan es, como Elías, fuego irresistible, profeta cuya palabra ilumina mi camino y el de mi comunidad y se alza como juicio severo contra el pecado, contra cualquier infidelidad a la alianza.</p>

  <p>Además, el hecho de que Elías y Juan fuesen perseguidos por los poderosos y no comprendidos por sus contemporáneos me plantea el serio riesgo que corro yo también de poner obstáculos al camino de la Palabra divina, a veces incómoda y desestabilizadora, pero me recuerda además que, a pesar de todas nuestras oposiciones humanas, la Palabra de Dios saldrá victoriosa.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«¡Dichosos los que te vieron, Elías, y murieron fieles al amor! También nosotros ciertamente viviremos».</p>

  <p class="prayer">Señor, te damos gracias por la esperanza que ilumina nuestras vidas y que da sentido a nuestras fatigas y esfuerzos por amar. Saber que vienes a encarnarte en nuestra frágil humanidad para posibilitarnos una vida llena y eterna contigo nos colma de aliento y gratitud.</p>

  <p class="prayer">Señor, te damos gracias porque eres el Dios que viene a nuestro auxilio para traernos salvación y felicidad. Señor, te damos gracias porque no has permitido que faltasen en nuestras vidas personas que, como Elías y el Bautista, han preparado de mil maneras nuestro encuentro contigo.</p>

  <p class="prayer">Te damos gracias por su constancia en los esfuerzos a pesar de las desilusiones, y te pedimos perdón si hemos sido sordos a tus llamadas, que nos diriges por medio de las palabras y vida de estos hermanos y hermanas. Señor, te damos gracias por estos testimonios que nos han hablado de ti y que con el fuego de su amor han iluminado nuestro camino.</p>

  <p class="prayer">Que tu Espíritu nos inflame, para que también nosotros podamos ser fuego tuyo en el mundo.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Si entramos con un corazón dócil en la Escritura, caminaremos de claridad en claridad bajo el firmamento de la Palabra sagrada, alegrándonos con ella por los designios eternos que descubren a nuestros ojos, admirando cada vez más a Jesucristo que se acerca, esperándolo con los patriarcas, viéndolo venir con los profetas. Bajo este prisma, el cristiano logra una comprensión de la vida que ninguna otra experiencia podría darle. Dios nunca se aleja de su obra. Se sienta cobijado en la tienda de Abrahán, lo mismo que escala el Sinaí, entre relámpagos que anuncian su presencia (…). Todo está lleno de él.</p>
  <p>¿Es posible volver de esta peregrinación sin sentirse conmovidos? ¿Es posible, para quien ha seguido estas huellas a la luz de la fe, no ser mejor? La Biblia es la fuente profunda de los consuelos de la humanidad, la boca de Dios que habla a su corazón; y, sobre todo, es el Cristo Hijo de Dios que le ha dado la salvación (H.-D. Lacordaire, <i>Deuxième lettre à Emmanuel</i>, en Études religieuses 758, Bruselas 1962, 66-67).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Felices los que te vieron y murieron fieles al amor»</b> (Eclo 48,11).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Estás muy preocupado por elegir bien tu trabajo. Tienes tantas opciones que estás constantemente abrumado por la pregunta: «¿Qué es lo que debo o no hacer?». Se te pide que respondas a muchas necesidades concretas (…).</p>
  <p>De muchas formas todavía quieres decidir tu propio orden del día. Actúas como si tuvieras que escoger entre muchas cosas, todas igualmente importantes. Pero no te has rendido completamente a la dirección de Dios. Te empeñas en pelear con Dios sobre quién tiene el control.</p>
  <p>Intenta entregar tu orden del día a Dios. Di constantemente: «Que se haga tu voluntad, no la mía». Entrega tu corazón entero y todo tu tiempo a Dios: adónde ir, cuándo y cómo responder. Dios no quiere que te destruyas. El agotamiento total, el sentirse quemado y la depresión no son signos de que estás haciendo la voluntad de Dios. Él es todo amor. Desea darte un sentido profundo de seguridad en su amor. Una vez que conscientes en experimentar ese amor completamente, podrás discernir con más exactitud a quién has sido enviado en nombre de Dios.</p>
  <p>No es fácil entregar tu orden del día a Dios. Pero, cuanto más lo hagas, el «tiempo de tu reloj» se convertirá más en «tiempo de Dios», y éste es siempre la plenitud del tiempo (H. J. M. Nouwen, <i>La voz interior del amor</i>, Madrid 1997, 117-118).</p>
  `}
 ]},

{ id:"inmaculada", title:"Inmaculada Concepción de María · 8 de diciembre", tag:"Segunda semana · 8 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Génesis 3,9-15.20</span>
  <p><sup>9</sup>Pero el Señor Dios llamó al hombre diciendo: —¿Dónde estás?</p>
  <p>El hombre respondió: <sup>10</sup>—Oí tus pasos en el huerto, tuve miedo y me escondí, porque estaba desnudo.</p>
  <p>El Señor Dios replicó: <sup>11</sup>—¿Quién te hizo saber que estabas desnudo? ¿Has comido acaso del árbol del que te prohibí comer?</p>
  <p><sup>12</sup>Respondió el hombre: —La mujer que me diste por compañera me ofreció el fruto del árbol, y comí.</p>
  <p><sup>13</sup>Entonces el Señor Dios dijo a la mujer: —¿Qué es lo que has hecho? Y ella respondió: —La serpiente me engañó, y comí.</p>
  <p><sup>14</sup>Entonces el Señor Dios dijo a la serpiente: —Por haber hecho eso, serás maldita entre todos los animales y entre todas las bestias del campo. Te arrastrarás sobre tu vientre y comerás polvo todos los días de tu vida. <sup>15</sup>Pondré enemistad entre ti y la mujer, entre tu linaje y el suyo; él te herirá en la cabeza, pero tú sólo herirás su talón.</p>
  <p><sup>20</sup>El hombre puso a su mujer el nombre de Eva —es decir, Vitalidad—, porque ella sería madre de todos los vivientes.</p></div>

  <p class="note">En el capítulo tercero del Génesis se describe el drama más profundo de la humanidad: la caída original que introduce la muerte en la creación. Tras la consumación del pecado por Adán y Eva, hay un momento de silencio en el que se oye sólo a Dios acercarse por el jardín. No es precisamente motivo de fiesta y encuentro. Ahora Adán se oculta. Pero la voz le interpela: «¿Dónde estás?» (v. 9b). Adán sale de su escondite, pero no responde a la pregunta, mostrando que no está a la altura, no está ya en Dios. Sus palabras dan testimonio de esta triste realidad. En primer lugar declara abiertamente que le domina el miedo y la vergüenza: la criatura hasta hace bien poco libre se siente ahora esclava. Luego, indirectamente, manifiesta el estado de soledad en el que vive: la relación con la mujer y la creación, antes fundada en la amistad y la ayuda recíproca, ahora está sujeta al engaño, la sospecha, la oposición. Frente al Creador, que había gozado con la belleza de la creación, aparece un universo hecho trizas, radicalmente afectado por el mal.</p>

  <p class="note">Después de escuchar a los tres culpables, Dios pronuncia la sentencia. El lector que ha seguido desde el comienzo el desarrollo del drama sagrado, esperaría la condena a muerte (de acuerdo con Gn 2,17). Por el contrario, se propone un castigo que aparece como un camino de purificación con vistas a una salvación prometida (v. 15). Dios, que comienza a revelarse como el Misericordioso, se ha puesto de parte del hombre contra la serpiente —símbolo del mal— que recibe la maldición. La humanidad será ciertamente herida, pero sólo en el calcañar, es decir, en una parte no vital y fácil de curar; la serpiente, por el contrario, será herida en la cabeza, derrotada definitivamente. Por eso se ha definido al v. 15 como «protoevangelio», primer anuncio de la victoria del hombre sobre el pecado y la muerte.</p>

  <p class="note">La victoria se atribuye al «linaje de la mujer». La versión griega de los Setenta comprendió «linaje» en sentido individual y el primitivo cristianismo legó el texto en clave mesiánica, como profecía de la encarnación de Cristo. La Vulgata atribuye directamente la victoria a la mujer; de ahí la difundida representación de María aplastando con el pie la cabeza de la serpiente.</p>

  <p class="note">Notemos, finalmente, el nombre nuevo que el hombre da a la mujer: Eva, madre de los vivientes (no de los mortales). Podemos ver aquí la prefiguración de María, la nueva Eva que cooperará en la obra de la restauración de la humanidad pecadora y Jesús la consignará como madre de la Iglesia naciente, justo en el momento de su muerte en la cruz.</p>

  <div class="reading"><span class="ref">Segunda lectura · Efesios 1,3-6.11-12</span>
  <p><sup>3</sup>Bendito sea Dios, Padre de nuestro Señor Jesucristo, que desde lo alto del cielo nos ha bendecido por medio de Cristo con toda clase de bienes espirituales. <sup>4</sup>Él nos eligió en Cristo antes de la creación del mundo, para que fuéramos santos e irreprochables ante él por el amor.</p>
  <p><sup>5</sup>Llevado de su amor, él nos destinó de antemano, conforme al beneplácito de su voluntad, a ser adoptados como hijos suyos por medio de Jesucristo, <sup>6</sup>para que la gracia que derramó sobre nosotros, por medio de su Hijo querido, se convierta en himno de alabanza a su gloria.</p>
  <p><sup>11</sup>En ese mismo Cristo también nosotros hemos sido elegidos y destinados de antemano, según el designio de quien todo lo hace conforme a su libre voluntad, <sup>12</sup>así nosotros, los que tenemos puesta nuestra esperanza en Cristo, seremos un himno de alabanza a su gloria.</p></div>

  <p class="note">La carta a los Efesios se abre con lo que se ha definido como el Magníficat de Pablo. Él que está viviendo sus duros años de prisión por la fe, en cuanto tiene ocasión de escribir a otros cristianos, deja brotar de su corazón un canto de bendición y alabanza a Dios, invocado no como «Dios de Abrahán, de Isaac, de Jacob», sino como «Padre de nuestro Señor Jesucristo». Cristo es el único Mediador. Cristo es el Mesías, plenitud de la espera de Israel. En el himno se exalta el plan de salvación, contemplado no siguiendo una exposición ordenada y doctrinal, sino cantado y admirado en sus múltiples facetas por quien experimenta su actuación a partir de la propia historia personal.</p>

  <p class="note">Cuanto Pablo refiere de sí mismo, vale para cualquier cristiano y de modo preeminente para María. En ella se realiza en plenitud el plan divino de hacernos «santos e irreprochables ante él por el amor», es decir, consagrados exclusivamente a su servicio («santos»), separados de todo lo que es mundano y pecaminoso («irreprochables»). Todo esto no por la capacidad humana, sino por puro don. Ningún mérito, esfuerzo o ascesis podrían jamás reparar el mal que corrompe la humanidad desde sus raíces. La reparación sólo puede recibirse como «herencia», o sea, como un bien recibido gratuitamente, pero que nos hace responsables.</p>

  <p class="note">María, la Virgen Inmaculada, no es un ser supra-humano, es la elegida para ser morada del Verbo, ha sido preservada del pecado original «en previsión a los méritos de Cristo Redentor» —como reza la definición del dogma— en razón de su propia vocación. Por María llega a cumplimiento el plan del que nos ha «predestinado a ser sus hijos adoptivos». Se trata de una expresión paulina, que recoge una buena noticia: la vida del hombre no ha.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,26-38</span>
  <p><sup>26</sup>Al sexto mes, envió Dios al ángel Gabriel a una ciudad de Galilea llamada Nazaret, <sup>27</sup>a una joven prometida a un hombre llamado José, de la estirpe de David; el nombre de la joven era María.</p>
  <p><sup>28</sup>El ángel entró donde estaba María y le dijo: —Alégrate, llena de gracia, el Señor está contigo. <sup>29</sup>Al oír estas palabras, ella se turbó y se preguntaba qué significaba tal saludo.</p>
  <p><sup>30</sup>El ángel le dijo: —No temas, María, pues Dios te ha concedido su favor. <sup>31</sup>Concebirás y darás a luz un hijo, al que pondrás por nombre Jesús. <sup>32</sup>Él será grande, será llamado Hijo del Altísimo; el Señor Dios le dará el trono de David, su padre, <sup>33</sup>reinará sobre la estirpe de Jacob por siempre y su reino no tendrá fin.</p>
  <p><sup>34</sup>María dijo al ángel: —¿Cómo será esto, si yo no tengo relaciones con ningún hombre?</p>
  <p><sup>35</sup>El ángel le contestó: —El Espíritu Santo vendrá sobre ti y el poder del Altísimo te cubrirá con su sombra; por eso, el que va a nacer será santo y se llamará Hijo de Dios. <sup>36</sup>Mira, tu pariente Isabel también ha concebido un hijo en su vejez, y ya está de seis meses la que todos tenían por estéril; <sup>37</sup>porque para Dios nada hay imposible.</p>
  <p><sup>38</sup>María dijo: —Aquí está la esclava del Señor, que me suceda según dices. Y el ángel la dejó.</p></div>

  <p class="note">Leyendo la perícopa de la anunciación en la solemnidad de la Inmaculada Concepción, merecen particular atención dos expresiones del saludo del ángel Gabriel a María. Entrando en su presencia, la llama: «Llena de gracia». El término griego, kecharitoméne, explica bien el significado de la palabra: literalmente significa «la agraciada», que ha sido colmada de gracia. María es la criatura humana redimida por Dios de modo radical, perfecto. Su inmaculada concepción es obra de la gracia del Redentor, que en ella ofrece a todos los hombres la imagen y modelo de la vocación de la humanidad.</p>

  <p class="note">Luego el ángel dice a María: «El Señor está contigo», usando la expresión tan frecuente en el Antiguo Testamento y que ha acompañado el caminar del pueblo elegido a lo largo de los siglos. El Señor siempre ha estado con su pueblo, aunque el pueblo no siempre ha estado con su Dios. Frecuentemente se alejó, dudó, se sintió abandonado, como en la ocasión emblemática de la rebelión en el desierto, llegando a su culmen en aquella pregunta: «¿Está Dios con nosotros, o no?» (Ex 17,7b). Aquí estas palabras asumen un sentido pleno, como si el ángel dijera: «Tú estás siempre con el Señor; tú estás unida a él en la medida en que es posible a una criatura». No se trata de un momento de gracia particular, que lentamente se debilita; al contrario, es una unión que se va haciendo más y más íntima.</p>

  <p class="note">A las palabras del ángel —indica el evangelista— María «se turbó» (v. 29). No es el temor que tuvo Adán, consciente de su pecado; aquí se trata del sagrado temor ante la misteriosa realidad de Dios; es el sentimiento que invade tanto más a la criatura cuanto más pura es. En su perfecta humildad, María comprende la grandeza de la misión recibida, la gratuidad del don, la desproporción entre la propia debilidad y la omnipotencia divina.</p>

  <p class="note">El sí que María da como respuesta resuena como la alabanza perfecta de la criatura, eco fiel del «aquí estoy, Señor, para hacer tu voluntad» (Sal 39,8) con el que el mismo Jesús se adhiere a la voluntad salvífica de Dios. En el encuentro de estas dos obediencias se cumple el plan de salvación.</p>

  {t:"MEDITATIO", h:`
  <p>En la fiesta de la Inmaculada, más que hablar de María, sentimos el deseo de acercarnos a ella para que nos introduzca en el misterio de su virginidad, que es un misterio de pureza y de entrega total.</p>

  <p>María ya está revestida con vestiduras de salvación, tiene su vestido blanqueado en la sangre del cordero antes de su nacimiento. El Padre, de algún modo, la ha bautizado de antemano en el misterio de la muerte y resurrección de Cristo para presentarla al mundo tota pulchra, toda hermosa. La fascinación de María está en ignorar su propia belleza: su humildad, su transparencia que la hacen vivir mirando fuera de sí misma, toda donación.</p>

  <p>María, virgen y madre, imprime al misterio cristiano su aspecto más sugestivo y fascinante; es un nostálgico reclamo a la pureza, a la inocencia. Incluso el hombre más experimentado en el mal difícilmente puede sustraerse a la fascinante atracción de la inocencia y la virginidad.</p>

  <p>Nuestro amor a María esencialmente debe traducirse en el deseo de vivir profundamente, sinceramente, su misterio; deseo siempre más vivo, más hondo, de sumergirnos en su pureza, como un bautismo en su inocencia para salir purificados, revestidos con vestiduras de salvación.</p>

  <p>Para cualquier alma, el contacto con la Virgen santa es un contacto que purifica y salva. De algún modo, es ya un contacto con la humanidad del Señor que tomó carne en ella. Nosotros, que nos sentimos tan pobrecillos y frágiles, debemos lograr, por la fe, descubrir cada vez más el milagro de la presencia de María entre nosotros.</p>

  {t:"CONTEMPLATIO", h:`
  <p>Inmaculada es tanto como decir fulgor de aurora. Preservada inmune de la contaminación original, María fue llena de gracia desde el primer instante de su concepción. Ya desde el seno materno, el alma de María estuvo penetrada de luz divina; tras la noche de largos siglos transcurridos desde la culpa de los progenitores, se alza esta estrella matutina, límpida y pura, transparente e inviolada, mientras en el cielo apunta la promesa del inminente día.</p>
  <p>Inmaculada significa visión del paraíso. Aquella gracia, que a ella le fue concedida en grado perfecto y sobreeminente desde el primer instante de su existencia terrena y que a nosotros también nos es dada, si bien en medida ciertamente inferior, es solamente en prenda de la beatitud eterna; para el día en que caerán los velos de la fe, que esconden la visión de Dios, y contemplaremos cara a cara al Señor. La Inmaculada preanuncia el alba de aquel día eterno, y nos guía y sostiene en el camino que todavía nos separa de Él.</p>
  <p>A este último fin, coronación de la vida de gracia, deben tender los anhelos de nuestro corazón y los más generosos esfuerzos de fidelidad cristiana (Juan XXIII, <i>Discurso del 7 de diciembre de 1959</i>).</p>

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>La aurora es un momento fabuloso: el que precede inmediatamente al salir el sol. Antes sólo eran tentativas. Un leve palidecer el cielo por oriente, apenas visible en la noche. Sigue un clarear creciente, lentamente al comienzo, luego más rápidamente, siempre más rápidamente. Finalmente un instante en el que el surgir de la luz es tan victorioso y ardiente, el esplendor tan cegador a los ojos habituados a la noche, que nos podríamos creer ante el mismo sol: apenas un instante después, como una llamarada, su luz arde en el hilo del horizonte. Y finalmente el sol. Hasta ese momento, nos podíamos haber engañado, pues ya se transparentaba en lo que sólo era la aurora. Lo mismo la Inmaculada concepción. Primero, a lo largo de los siglos precedentes, se trataba del alba de Cristo, de los comienzos de su pureza y santidad, ya maravillosos considerando que se realizaban en la naturaleza humana, pero aún oscuros respecto a Él. María es el culmen de la aurora, el surgir del día. Pero su luz ilumina a todos. La Inmaculada concepción distingue a María de los demás humanos sólo para unirla más a Cristo, que pertenece a todos (…).</p>
  <p>Tras el decreto que estableció la venida de Cristo, se da esta larga preparación que ya la realiza inicialmente y que llena toda la historia antigua de la humanidad. Ahora bien, toda esta preparación lleva a María, porque ella (…) es portadora de Cristo. La preparación es inmensa: es la única obra de Dios mismo en este mundo; se compromete con todo su amor: haciendo confluir, en virtud de su gracia, todo lo que en nuestros esfuerzos humanos hay de verdaderamente bueno: se plasma una naturaleza humana que será la suya.</p>
  <p>Llega un día en que todo está preparado. En la Virgen todo se reúne para pasar de ella al Hijo (…). María es la figura absoluta y total, y lo es para siempre, porque, siendo Madre de Dios, es la que une el Hombre-Dios con la humanidad (E. Mersch, <i>La théologie du Corps mystique</i>, I, Tournai 1944, 219-221).</p>

  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 35,1-10</span>
  <p><sup>1</sup>Se alegrarán el desierto y el yermo, la estepa se regocijará y florecerá; florecerá como el narciso, <sup>2</sup>se regocijará y dará gritos de alegría; le han dado la gloria del Líbano, el esplendor del Carmelo y del Sarón; y verán la gloria del Señor, el esplendor de nuestro Dios.</p>
  <p><sup>3</sup>Fortaleced las manos débiles, afianzad las rodillas vacilantes, <sup>4</sup>decid a los cobardes: «¡Ánimo, no temáis!; mirad a vuestro Dios: trae la venganza y el desquite; viene en persona a salvaros».</p>
  <p><sup>5</sup>Se despegarán los ojos de los ciegos, los oídos de los sordos se abrirán, <sup>6</sup>brincará el cojo como un ciervo, la lengua del mudo cantará. Brotarán aguas en el desierto y arroyos en la estepa; <sup>7</sup>el páramo se convertirá en estanque, la tierra sedienta en manantial. En el cubil de los chacales brotarán cañas y juncos.</p>
  <p><sup>8</sup>Cruzará por allí una calzada cuyo nombre será «Vía Sacra». Los impuros no pasarán por ella. Él mismo guiará al caminante, y los inexpertos no se extraviarán. <sup>9</sup>No habrá en ella leones, ni se acercarán las bestias feroces. Los rescatados caminarán por ella, <sup>10</sup>por ella volverán los liberados del Señor. Llegarán a Sión entre gritos de júbilo; una alegría eterna iluminará su rostro, gozo y alegría los acompañarán, la tristeza y el llanto se alejarán.</p></div>

  <div class="reading"><span class="ref">Segunda lectura · Santiago 5,7-10</span>
