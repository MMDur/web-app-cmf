  <p class="prayer">¡Ven, Señor! Esperamos tu venida en nuestras vidas; contigo tenemos luz, curación, paz. Con el centurión del evangelio te manifestamos la admiración y gratitud por haberte hecho compañero de viaje y nuestro huésped: «Señor, yo no soy digno de que entres en mi casa, pero di una sola palabra y mi criado quedará sano» (Mt 8,8).</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Señor, Dios mío, dime por tu misericordia quién eres para mí. Di a mi alma: «Yo soy tu salvación» (Sal 34,3). Dilo de modo que lo oiga. Ante ti están los oídos de mi corazón, Señor; ábrelos y di a mi alma: «Yo soy tu salvación». Que corra tras esta voz y me una a ti. No me escondas tu rostro: que muera porque no muero para verlo.</p>
  <p>La casa de mi alma es demasiado estrecha para que puedas entrar: dilátala. Está en ruinas: repárala. Está llena de trastos que no te agradan: lo sé, no lo niego, ¿quién podrá purificarla? A quién sino a ti gritaré: Purifícame, Señor, de mis culpas ocultas, líbrame de mis faltas. Creo, por eso hablo, Señor, tú lo sabes (San Agustín, <i>Confesiones</i>, 1,5-6, passim).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Señor, yo no soy digno de que entres en mi casa, pero di una sola palabra y mi criado quedará sano»</b> (Mt 8,8).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Cuando el Hijo vino a los suyos, éstos no le recibieron. El «patriotismo» del pueblo elegido debería consistir en la fe en Dios y su Palabra, y, por lo tanto, en su nueva Palabra. Pero el Verbo encarnado no encontró esa fe. Aquel pueblo había regulado, desde hacía mucho, su propia relación con Dios, pensando que no había que cambiar nada. Le parecía que su alianza con Dios era una razón para no dejarle acercarse más, y que su obediencia de antaño le dispensaba ahora de escucharle más de cerca lo que Dios quería decirle.</p>
  <p>El Hijo no encontró ya fe en el pueblo que creía en el Padre, porque era ya demasiado «creyente». Sin embargo, encontró esta fe en un centurión de los ejércitos paganos que ocupaban el país. El que todo lo sabe desde siempre se admiró. Durante toda su vida esta admiración permaneció en el corazón del Hijo del hombre y también la conmoción respecto a muchos que parecen estar fuera y están dentro, y otros que, nacidos ciudadanos del Reino, serán arrojados a las tinieblas exteriores. Y es que la fe sin condiciones con frecuencia brota más fácilmente del corazón de los «no creyentes» que del corazón de aquellos creyentes ortodoxos de toda la vida, y el cielo encuentra la penitencia sincera más en los pecadores que en los que piensan que no necesitan penitencia (K. Rahner, <i>Glaube, der die Erde liebt</i>, Friburgo 1971).</p>
  `}
 ]},

{ id:"1-mar", title:"Martes de la primera semana", tag:"Primera semana · Martes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 11,1-10</span>
  <p><sup>1</sup>Saldrá un renuevo del tronco de Jesé, un vástago brotará de sus raíces. <sup>2</sup>Sobre él reposará el espíritu del Señor: espíritu de inteligencia y sabiduría, espíritu de consejo y valor, espíritu de conocimiento y temor del Señor. <sup>3</sup>(Lo inspirará el temor del Señor). No juzgará por apariencias, ni sentenciará de oídas. <sup>4</sup>Juzgará con justicia a los débiles, sentenciará a los sencillos con rectitud; herirá al violento con la vara de su boca, con el soplo de sus labios matará al malvado. <sup>5</sup>Será la justicia el ceñidor de sus lomos; la fidelidad, el cinturón de sus caderas.</p>
  <p><sup>6</sup>Habitará el lobo junto al cordero, la pantera se tumbará con el cabrito, el ternero y el leoncillo pacerán juntos; un muchacho pequeño cuidará de ellos. <sup>7</sup>La vaca vivirá con el oso, sus crías se acostarán juntas; el león comerá paja, como el buey, <sup>8</sup>el niño de pecho jugará junto al escondrijo de la serpiente, el recién destetado meterá la mano en la hura del áspid. <sup>9</sup>Nadie causará ningún daño en todo mi monte santo, porque la sabiduría del Señor colma esta tierra como las aguas colman el mar. <sup>10</sup>Aquel día, la raíz de Jesé se erguirá como enseña de los pueblos: la buscarán los gentiles, y será gloriosa su morada.</p></div>

  <p class="note">En un escenario desolador, en una selva talada y algunos árboles tronchados, nace un «renuevo» (v. 1), signo de vida y de bendición. El tronco del que brota es la familia davídica, probada por las tragedias de la historia y la infidelidad del pecado. Pero Dios es fiel y recuerda la promesa hecha a David de establecer por siempre su trono. La alusión al «tronco de Jesé», padre de David, recuerda que Dios lleva a cabo sus maravillas no con el David poderoso, sino con el David pequeño, insignificante a los hombres, pero amado por Dios y elegido por él (cf. 1 Sm 16,1-13).</p>

  <p class="note">La promesa de Dios se sintetiza en el don divino por excelencia: el Espíritu (v. 2). El Espíritu que era el don de Dios a los jefes libertadores de Israel, a los jueces carismáticos, a los profetas y sacerdotes, a los sabios; aunque todavía no era un don pleno y estable. Sin embargo, según el oráculo presente, el Espíritu se concederá de modo pleno y estable al descendiente de David, a este renuevo del «tronco de Jesé»: «Sobre él reposará el Espíritu del Señor» (v. 2). La plenitud del Espíritu, manifestada en nuestro texto por la cuádruple aparición del término «espíritu», confiere al pequeño rey la totalidad de dones y carismas traducidos en un gobierno justo.</p>

  <p class="note">La última parte del texto se ensancha con dimensiones universales: el reino de este niño no se limitará a Jerusalén, sino que abrazará a todos los pueblos.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 10,21-24</span>
  <p><sup>21</sup>En aquel momento, el Espíritu Santo llenó de alegría a Jesús, que dijo: —Yo te alabo, Padre, Señor del cielo y de la tierra, porque has ocultado estas cosas a los sabios y prudentes y se las has dado a conocer a los sencillos. Sí, Padre, así te ha parecido bien. <sup>22</sup>Todo me lo ha entregado mi Padre, y nadie conoce quién es el Hijo, sino el Padre; y quién es el Padre, sino el Hijo y aquél a quien el Hijo se lo quiera revelar.</p>
  <p><sup>23</sup>Volviéndose después a los discípulos, les dijo en privado: —Dichosos los ojos que ven lo que vosotros veis. <sup>24</sup>Porque os digo que muchos profetas y reyes quisieron ver lo que vosotros veis y no lo vieron, y oír lo que oís y no lo oyeron.</p></div>

  <p class="note">Jesús reconoce la verdad de su propia vocación de Hijo a través de la fe de los pequeños, es decir, de los que —aun siendo desfavorecidos al parecer de los hombres de religión— han acogido con gratitud y humildad la predicación de los setenta y dos discípulos. Es una realidad que se descubre y celebra con la fuerza del Espíritu, el único que permite al hombre poder leer, en las situaciones más diversas, la voluntad de Dios.</p>

  <p class="note">Su grito de «júbilo en el Espíritu» (v. 21) permite intuir el tenor de los acontecimientos por los que se manifiesta la vocación filial de Jesús. Él, a pesar del fracaso de su propia misión y el éxito parcial de la de los discípulos, da gracias al Padre por sus designios insondables, que revelan el misterio del reino a los últimos, los humildes, y los oculta a los soberbios. Esta acción de gracias es reconocer la obra maravillosa de Dios, su acción que confunde la sabiduría humana.</p>

  <p class="note">Ahondando más, Jesús admira el «conocimiento» que de él tiene el Padre y, a la vez, exalta el conocimiento que le ha concedido del plan de Dios. Pero hay algo más: en este conocimiento del verdadero rostro de Dios da entrada a sus propios amigos, los que aceptan participar en la familiaridad íntima que lo une al Padre (v. 22). La verdadera felicidad de los discípulos consiste en la participación en esta familiaridad que le hace vivir no ya en el tiempo de la espera, sino en el de la presencia de la salvación (v. 23), ansiada por Israel a lo largo de los siglos.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Dios actúa de modo imprevisible, desconcertando nuestra sabiduría humana. Ciertamente, los caminos que nos hace recorrer para llevarnos a la salvación son inéditos, nuevos, inesperados, como sugiere el tema del «renuevo de Jesé». El retoño que comienza a despuntar en tronco talado, en medio de un bosque desolado, me recuerda su fidelidad, su promesa inquebrantable y el privilegio de los humildes y pequeños a sus ojos.</p>

  <p>También yo seré un privilegiado si acojo el don del Espíritu, que se posó sobre Jesús, el renuevo mesiánico. Y como Jesús, con la fuerza del Espíritu, ha podido descubrir en los éxitos controvertidos de su propia misión el plan sabio del Padre, también yo podré gozar de la atención delicada y llena de ternura que Dios reserva a los pobres y sencillos.</p>

  <p>Entonces me encontraré entre aquellos a los que el Hijo revela el misterio de amor de su Padre dándoles entrada en su misma relación de comunión e intimidad. El Hijo amado del Padre viene a regalarme la vida filial, la verdadera sabiduría, el don del Espíritu con el que Dios quiere colmarme y al mundo entero para superar los desgarrones y divisiones, que parecen ser la triste herencia de los humanos.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor Jesús, renuevo de Jesé, el Padre ha posado sobre ti el Espíritu. Derrama en nosotros el Espíritu que nos guíe en la búsqueda de la verdadera sabiduría para saber vivir bien y lograr la felicidad verdadera. Derrama en nosotros tu Espíritu, para que nos conceda comprender nuestra historia en el plan de Dios Padre. Derrama en nosotros el Espíritu de consejo y valentía, para poder tomar decisiones juiciosas y concretizarlas en hechos con perseverancia, paciencia y tenacidad.</p>

  <p class="prayer">Derrama en nosotros el Espíritu de conocimiento, para poder tener contigo una profunda familiaridad que nos permita penetrar los secretos de tu corazón manso y humilde. Derrama en nosotros el Espíritu del temor del Señor, para que la voluntad del Padre sea verdaderamente el centro de nuestros pensamientos, deseos y proyectos. Derrama en nosotros el Espíritu con el que revelas al Padre a los pequeños, a los pobres, para que nos haga pobres, gozosos y libres a imitación tuya, el Hijo que nos colma de alegría.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Soy consciente, Padre omnipotente, de que tú debes ser el fin principal de mi vida, de suerte que mis palabras y sentimientos te expresen. Permíteme dirigirme a ti, Señor, que te hable con toda libertad. Soy un pequeño en la tierra, pero encadenado por tu amor.</p>
  <p>Antes de conocerte, estaba oculto el sentido de mi vida y carecía de significado mi existencia. Gracias a tu misericordia he comenzado a vivir: he disipado mi ambigüedad. He sido instruido en la fe, inmerso en ella sin remedio. Señor, perdóname, no puedo librarme de ti, pero podría morir de ti.</p>
  <p>A lo largo del tiempo han surgido infinidad de teorías, pero han llegado tarde; antes de darles oído te he dado mi fe. Ahora soy tuyo (Hilario de Poitiers, <i>La Trinidad</i>, 1).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Yo te alabo, Padre, porque has revelado estas cosas a los sencillos»</b> (Lc 10,21).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>No nos lamentemos demasiado fácilmente de la falta de tiempo para leer y no la hagamos responsable de un estado espiritual imputable con frecuencia a nuestra falta de decisión (la decisión de llevar las cosas a la práctica). Volvamos asiduamente al evangelio, a cualquier libro sólido, y tratemos de asimilarlo para vivirlo. No dejemos que se vaya agrandando la fisura entre verdad buscada y meditada y el llevar a la práctica sus exigencias. Es preciso exponer nuestra vida a la luz del Espíritu de Jesús, esforzándonos por practicar el sermón de la montaña, el discurso de la última Cena, el Vía Crucis, las parábolas de la oración y de la fe, y sobre todo el mandamiento del amor: ahí encontraremos la verdadera ciencia de Cristo, la que poseían los apóstoles.</p>
  <p>Cualquier momento del día se nos brinda como algo único e irrepetible; por eso, los que no se han abandonado suficientemente al Espíritu y dependen de modo muy rígido de un ideal moral especulativo, no llegan a la santidad perfecta, viva, en consonancia con las exigencias de la vida. Su santidad es artificial, rígida, careciendo del impulso y espontaneidad del amor; son incapaces de un acto de locura en la pobreza, en el amor al prójimo; no viven el Evangelio del Salvador (…).</p>
  <p>La lectura de una biografía o de los escritos de un santo con frecuencia son más eficaces para una auténtica vida espiritual que la lectura de libros doctrinales. Velad constantemente por mantener un gran equilibrio en vuestra vida, para conservarla siempre en la sencillez del momento presente y para llevar a la práctica el Evangelio (R. Voillaume, <i>Come loro</i>, Turín s.f.).</p>
  `}
 ]},

{ id:"1-mie", title:"Miércoles de la primera semana", tag:"Primera semana · Miércoles",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 25,6-10a</span>
  <p><sup>6</sup>El Señor todopoderoso preparará en este monte para todos los pueblos un festín de manjares suculentos, un festín de vinos de solera, manjares exquisitos, vinos refinados. <sup>7</sup>Arrancará en este monte el velo que cubría la faz de todos los pueblos, el sudario que tapa a todas las naciones. <sup>8</sup>Destruirá la muerte para siempre, secará las lágrimas de todos los rostros, y borrará de la tierra el oprobio de su pueblo —lo ha dicho el Señor—. <sup>9</sup>Aquel día dirán: «Éste es nuestro Dios, de quien esperábamos la salvación, éste es el Señor en quien confiábamos; alegrémonos y hagamos fiesta pues él nos ha salvado». <sup>10a</sup>Se ha posado en este monte la mano del Señor.</p></div>

  <p class="note">La imagen del banquete constituye uno de los símbolos fundamentales para expresar la comunión, el encuentro festivo y la plenitud de vida.</p>

  <p class="note">El banquete anunciado por el profeta Isaías para el final de los tiempos celebra la victoria de Dios sobre los poderes que esclavizan al hombre, proclamando su realeza universal. El lugar de este banquete, abierto a todos los pueblos, es también bastante significativo: se trata de Sión, lugar simbólico de la elección de Israel.</p>

  <p class="note">En el banquete el Rey ofrece regalos a los invitados, a la usanza de los reyes y príncipes al ser entronizados. El primer regalo es su presencia, su manifestación a los pueblos que antes caminaban como ciegos: «Arrancará en este monte el velo que cubría la faz de todos los pueblos» (v. 7). A este don sigue otro más llamativo: aniquilará la muerte. A continuación Dios, amorosamente, enjuagará las lágrimas de todos los rostros, consolará a todos de su dolor. ¡Éste es un tercer regalo personalizado!</p>

  <p class="note">Esta esperanza estriba exclusivamente en la promesa de Dios y no en las conjeturas del hombre sobre su futuro, como subraya el v. 8: «Lo ha dicho el Señor». En este punto desborda el himno de alabanza por la victoria del Señor quien, aun antes de derrotar a los enemigos, se constituye en salvación del pueblo que ponga en Dios su esperanza: «Éste es nuestro Dios, de quien esperábamos la salvación» (v. 9).</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 15,29-37</span>
  <p><sup>29</sup>Jesús partió de allí y se fue a la orilla del lago de Galilea; subió al monte y se sentó allí. <sup>30</sup>Se le acercó mucha gente trayendo cojos, ciegos, sordos, mancos y otros muchos enfermos; los pusieron a sus pies y Jesús los curó. <sup>31</sup>La gente se maravillaba al ver que los mudos hablaban, los mancos quedaban sanos, los cojos caminaban y los ciegos recobraban la vista; y se pusieron a alabar al Dios de Israel.</p>
  <p><sup>32</sup>Entonces Jesús llamó a sus discípulos y les dijo: —Me da lástima de esta gente, porque llevan ya tres días conmigo y no tienen qué comer. No quiero despedirlos en ayunas, no sea que desfallezcan por el camino. <sup>33</sup>Los discípulos le dijeron: —¿De dónde vamos a sacar en un despoblado pan para dar de comer a tanta gente? <sup>34</sup>Jesús les preguntó: —¿Cuántos panes tenéis? Ellos respondieron: —Siete, y unos pocos pececillos.</p>
  <p><sup>35</sup>Entonces Jesús mandó a la gente que se sentara en el suelo. <sup>36</sup>Tomó los siete panes y los peces, dio gracias, los partió y se los iba dando a los discípulos, y éstos a la gente. <sup>37</sup>Comieron todos hasta saciarse, y recogieron siete cestos llenos de los trozos sobrantes.</p></div>

  <p class="note">El marco que encuadra el episodio de la segunda multiplicación de los panes es el de Jesús misericordioso que cura a los enfermos (v. 30) y que da a todos su alimento, signo del banquete mesiánico.</p>

  <p class="note">Su misericordia es la que se da cuenta de lo que los discípulos no advierten: el hambre y debilidad de sus oyentes. Por eso Jesús, antes de actuar, convoca a sus discípulos, para que participen en su visión compasiva con los pobres y necesitados (v. 32).</p>

  <p class="note">El hecho de que poco antes el evangelista nos haya narrado un viaje de Jesús a tierra extranjera (cf. Mt 14,13-21) nos hace pensar que el gentío le sigue desde lejos y pertenecía al mundo pagano. Mateo, aun siendo consciente de que la misión universal es postpascual (cf. Mt 28,18-20), quiere subrayar la misericordia de Dios que se manifiesta en Jesús y se proyecta a todos los pueblos. En la primera multiplicación (Mt 14,13-21) Jesús se manifestó como el buen Pastor de Israel, haciendo visible la fidelidad de Dios con su pueblo. Ahora son todos los que son invitados al banquete mesiánico, incluso los paganos por la misericordia de Dios.</p>

  <p class="note">El pan que reparte recuerda el banquete en el que hay sitio para todos: el número «siete» de las cestas de pan sobrante, como el número «cuatro mil» de los comensales (los cuatro puntos cardinales), simboliza también el tema de la salvación universal que lleva a cabo Jesús.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Las lecturas bíblicas nos ofrecen una ilustración coherente del rostro de Dios, que viene a sanar nuestra humanidad herida y a saciar nuestras ansias de salvación. Aparece el retrato de la espera de esa salvación que sólo Dios puede conceder, iluminando nuestros corazones asediados por la ignorancia de Dios y por el desaliento. De hecho, nos reconocemos en el hambre de salvación de la multitud de pobres y enfermos que se agolpan en torno a Jesús. Aparece la imagen de un Dios anfitrión que prepara el banquete para todos y nos ama a cada uno de nosotros con un amor personal que llega hasta enjugar las lágrimas de cada rostro.</p>

  <p>El misterio de la misericordia divina asume para nosotros los rasgos del rostro y gestos de Jesús que sana a los enfermos y sacia con su pan a la multitud hambrienta que le sigue desde hace días. En la hondura de esta compasión de Jesús se nos hace visible el rostro de un Dios médico que cura nuestra humanidad cansada, desmayada y enferma. En él encuentro al divino y generoso anfitrión que me acoge a su mesa y me declara lo importante y precioso que soy a sus ojos.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor Jesús, venimos a ti, fatigados por nuestras limitaciones, afligidos por nuestras culpas, desilusionados de tantas «mesas» en las que no saciamos nuestra hambre ni apagamos nuestra sed. Te pedimos nos consueles y cures con tu amor, que nos sacies con tu pan y que apagues nuestra sed en la fuente de tu Espíritu.</p>

  <p class="prayer">Accrecienta en nosotros la feliz esperanza, la tensión por el banquete de vida plena y definitiva que, con el Padre, preparas para todos los pueblos. Te bendecimos por tu compasión con los pobres y enfermos con la que nos revelas la bondad misericordiosa del Padre.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>¡Oh pan dulcísimo!, cura el paladar de mi corazón para que guste la suavidad de tu amor. Sánalo de toda enfermedad, para que no guste otra dulzura fuera de ti, no busque otro amor fuera de ti ni ame otra belleza fuera de la tuya, Señor hermosísimo.</p>
  <p>Pan purísimo que contiene en sí toda dulzura y todo sabor, que siempre nos fortaleces sin que disminuyas: haz que pueda alimentarse de ti mi corazón y la intimidad de mi alma se colme de tu dulce sabor. Que se alimente de ti el hombre que peregrina todavía, para que, recreado con este viático, no desfallezca a lo largo del camino. Que pueda llegar con tu auxilio por la senda recta a tu Reino: allí ya no te contemplaremos en el misterio, como ahora, sino cara a cara. Y nos saciaremos de modo maravilloso sin que volvamos a tener hambre o sed por toda una eternidad (Juan de Fécamp, <i>Oración para recitarla antes de Misa</i>, 10-11, passim).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite frecuentemente y vive hoy la Palabra: <b>«Me da lástima de esta gente»</b> (Mt 15,32).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Buscas maneras de encontrar a Jesús. Intentas conseguirlo, no sólo en tu mente sino también en tu cuerpo. Buscas su afecto y sabes que éste implica a su cuerpo lo mismo que al tuyo. Se hizo carne por ti, para que tú pudieras encontrarle en la carne y recibir su amor en ella.</p>
  <p>Pero hay algo en ti que impide ese encuentro. Hay todavía mucha vergüenza y mucho sentido de culpabilidad en tu cuerpo, bloqueando la presencia de Jesús. Cuando estás en tu cuerpo, no te sientes realmente en casa; vives como arrojado en él, como si no fuera un lugar suficientemente bueno, suficientemente bello o suficientemente puro para encontrar con Jesús.</p>
  <p>Cuando examinas con atención tu vida, te das cuenta de hasta qué punto se ha visto llena de miedos, especialmente de miedo a las personas con autoridad: tus padres, profesores, obispos, directores espirituales, incluso de miedo a tus amigos. Nunca te consideras igual a ellos y te colocas debajo cuando te encuentras delante de ellos. Durante la mayor parte de tu vida has sentido como si necesitaras su permiso para ser tú mismo (…).</p>
  <p>No podrás encontrarte con Jesús en tu cuerpo mientras éste siga con montones de dudas y miedos. Jesús vino para librarte de esos lazos y crear en ti un espacio en el que pudieras estar con él. Quiere que vivas la libertad de los hijos de Dios.</p>
  <p>No desesperes pensando que no puedes cambiar después de tantos años. Sencillamente entra en la presencia de Jesús como eres y pídele que te dé un corazón libre de todo miedo en el que él pueda estar contigo. No puedes hacerte a ti mismo diferente. Jesús vino para darte un corazón nuevo, un espíritu nuevo, una mente nueva y un cuerpo nuevo. Deja que él te transforme por su amor y te permita recibir su afecto en todo tu ser (H. J. M. Nouwen, <i>La voz interior del amor</i>, Madrid 1997, 54-55).</p>
  `}
 ]},

{ id:"1-jue", title:"Jueves de la primera semana", tag:"Primera semana · Jueves",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 26,1-6</span>
  <p><sup>1</sup>Aquel día se cantará este cantar en la tierra de Judá: «Tenemos una ciudad fuerte; Dios la ha protegido con fortificaciones y murallas. <sup>2</sup>¡Abrid las puertas, para que entre el pueblo justo, que se ha mantenido fiel! <sup>3</sup>Está firme su ánimo, mantiene la paz, porque ha puesto en ti su confianza. <sup>4</sup>¡Confiad siempre en el Señor, que el Señor es la roca perpetua! <sup>5</sup>Doblegó a los que habitaban en lo alto; derribó a la ciudad encumbrada, la derribó hasta el suelo, la arrojó en el polvo, <sup>6</sup>y será pisoteada por los humildes, por los pasos de los pobres».</p></div>

  <p class="note">El himno de acción de gracias del profeta es muy denso teológicamente hablando y se expresa en la doble proclamación del auxilio del Señor que da un sólido fundamento a la esperanza.</p>

  <p class="note">El himno lo cantan los habitantes de la ciudad, que necesita ser reconstruida y levantar murallas garantes de su seguridad. Pero a veces las «murallas» no sólo defienden de los enemigos; pueden convertirse en una especie de defensa del propio bienestar, en barrera contra los humildes. Aparece una imagen muy bella en la que el profeta invita a abrir las puertas de la ciudad donde mora un pueblo no encerrado en sus propias seguridades, sino abierto al mundo. La ciudad se convierte en refugio también para otros, llamados «pueblo justo» (v. 2). La descripción de la gente que puede entrar en la ciudad en busca de refugio nos lleva a pensar que los moradores, sus habitantes, no son habitualmente ni justos, ni fieles, ni interiormente seguros. Se invita a ese grupo étnico unido por vínculos de sangre, de autoridad e historia común a abrirse al «pueblo justo», «que se ha mantenido fiel» (v. 2). Solamente así, con esta apertura al otro, al pobre, los habitantes de la ciudad encontrarán la verdadera salvación y seguridad.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 7,21.24-27</span>
  <p>En aquel tiempo, dijo Jesús a sus discípulos: <sup>21</sup>—No todo el que me dice: ¡Señor, Señor! entrará en el reino de los cielos, sino el que hace la voluntad de mi Padre que está en el cielo.</p>
  <p><sup>24</sup>El que escucha estas palabras mías y las pone en práctica, es como aquel hombre sensato que edificó su casa sobre roca. <sup>25</sup>Cayó la lluvia, vinieron los torrentes, soplaron los vientos y se abatieron sobre la casa; pero no se derrumbó, porque estaba cimentada sobre roca.</p>
  <p><sup>26</sup>Sin embargo, el que escucha estas palabras mías y no las pone en práctica, es como aquel hombre necio que edificó su casa sobre arena. <sup>27</sup>Cayó la lluvia, vinieron los torrentes, soplaron los vientos, se abatieron sobre la casa, y ésta se derrumbó. Y su ruina fue grande.</p></div>

  <p class="note">Las dos imágenes evangélicas antitéticas del hombre prudente y del hombre necio y de los dos resultados contrapuestos corresponden a las fórmulas de la alianza de Dios con Israel, fórmulas que —según los diversos testimonios del Antiguo Testamento— concluyen siempre con una serie de bendiciones y maldiciones. Las frases conclusivas del sermón de la montaña nos dan a entender que bendición y maldición, salvación o destrucción no nos vienen dadas del exterior; son más bien la manifestación de la diversa consistencia del actuar humano y del cimiento en que se funda. Naturalmente que cuesta más construir sobre roca (v. 27), es mucho más cómodo edificar sobre extensas llanuras de arena, pero tales construcciones sin cimientos sólidos están destinadas a ser arrasadas por aguaceros y ventoleras (v. 27). Por consiguiente, es capital la calidad del cimiento; sólo apoyando las obras propias en una Palabra imperecedera de verdad es como la vida humana logra su realización, prescindiendo de exterioridades: «No todo el que me dice: ¡Señor, Señor! entrará en el reino de los cielos» (v. 21). Ésta fue la tentación por parte de los carismático-entusiastas de la comunidad primitiva tendente a buscar obsesivamente milagros y manifestaciones espectaculares. Estos grupos olvidan que sólo una obediencia filial y seria a la voluntad del Padre indica la calidad del seguimiento de los discípulos de Jesús (cf. Mt 7,21-23).</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Sólo viviré auténticamente mi discipulado escuchando y llevando sinceramente a la práctica la Palabra del Señor. Contra la tentación de hacer coincidir la vida cristiana con lo extraordinario —llámense exorcismos, curaciones o milagros— debo tratar de buscar los fundamentos de su firmeza: la obediencia cotidiana a la palabra del Señor encarnada en mi vida. El texto evangélico describe dos modos contrapuestos en los que puedo cimentar mi trabajo. Por una parte la búsqueda de lo sensacional, de la apariencia o vanidad de mis efímeras realizaciones. Es un modo de enmascarar la inconsistencia de mi vida, ignorando que incluso la mínima acción buena que pueda ejecutar es un don de la gracia que exige humildad y agradecimiento. Al manifestarse la fragilidad de mi cometido, me aterrorizará lo mismo que el desplome repentino de una casa. Todavía no tengo morada en la «ciudad fuerte» habitada exclusivamente por «un pueblo justo que observa la lealtad» y que pone el cimiento de su existencia en el Señor, la roca eterna.</p>

  <p>En la dirección opuesta aparece la firme decisión de no pretender apoyarme en palabras, en el peligroso juego del aparentar, sino cimentarme en la Palabra del Señor, fuente de seguridad y protección. Entonces incluso podré olvidar mis obras buenas: «Tuve hambre y me disteis de comer, sed y me disteis de beber» (Mt 25,35), manteniéndome lejos de cualquier autocomplacencia. De este modo experimentaré la verdad de lo que dice el Apocalipsis: «Dice el Espíritu, podrán descansar de sus trabajos, porque van acompañados de sus obras» (Ap 14,13). De hecho, a quien se gloría únicamente en la bondad del Señor se le abren las puertas de la «ciudad fuerte» y el Padre le concede la entrada en el Reino, como hijo amado.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">¡Señor, eres la roca eterna y tus palabras son verdad y vida!</p>
  <p class="prayer">Ayúdame a construir mi vida en tus palabras, sólo así descubriré el cimiento que no vacila, una roca en la que estaré firme, un refugio seguro en las vicisitudes de mi existencia, una lámpara para mis pasos y luz en mi camino.</p>
  <p class="prayer">Perdona mi necedad por cuantas veces he buscado mi plenitud en otra parte, mi cimiento lejos de ti; por cuantas veces he construido sobre arenas movedizas mis proyectos sin confrontarlos con los tuyos, ilusionándome con la autosuficiencia de mis palabras en vez de con una amorosa y gozosa obediencia a tu voluntad.</p>
  <p class="prayer">Señor, acepta mi alma arrepentida y mi corazón humillado, ya que deseo ser y no aparentar, quiero llegar a ser, contando con tu ayuda, un miembro vivo de tu pueblo y anhelo caminar contigo en humildad y justicia, para poder morar en tu ciudad santa.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>«Si el Señor no construye la casa, en vano se afanan los albañiles» (Sal 126,1). Sois templo de Dios y el Espíritu de Dios habita en vosotros. Ésta es la casa y éste el templo de Dios, lleno de enseñanzas y prodigios de Dios, morada capaz de la santidad del corazón de Dios. Dios es quien debe construir esta casa (…). Debe levantarse con piedras vivas, aglutinada por la piedra angular, crecer con el cemento de la comprensión mutua, hacia el estado del hombre perfecto a la medida del cuerpo de Cristo, y adornada con la hermosura y esplendor de las gracias espirituales.</p>
  <p>El sencillo comienzo de la edificación está lejos de su final, pero continuando en la construcción se llegará al culmen de la perfección (Hilario de Poitiers, <i>Tratado sobre los salmos</i>, 126,7-10, passim).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«No todo el que me dice: ¡Señor, Señor! entrará en el reino de los cielos, sino el que cumple la voluntad de mi Padre que está en el cielo»</b> (Mt 7,21).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Es el tiempo del adviento del Señor, en el que Dios viene al encuentro del hombre para redimirlo, liberarlo, justificarlo, hacerle feliz. Por eso en este tiempo sagrado debemos practicar el bien con mayor celo para merecer con su gracia ser visitados más intensamente.</p>
  <p>Esforcémonos, hermanos, por penetrar en la casa de nuestro corazón, apresurémonos a abrir las ventanas, limpiar las telarañas con la humillación de nuestro orgullo, barrer la era con la confesión de las culpas, poner tapices en las paredes con el ejercicio de la virtud, revestirnos de gala con la práctica de las buenas obras, y preparar un banquete con la lectura y meditación de la Sagrada Escritura (Hugo de San Víctor, <i>Sermón quinto de Adviento</i>).</p>
  `}
 ]},

{ id:"1-vie", title:"Viernes de la primera semana", tag:"Primera semana · Viernes",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 29,17-24</span>
  <p>Así dice el Señor: <sup>17</sup>Dentro de muy poco tiempo, el Líbano se convertirá en vergel, y el vergel se convertirá en bosque. <sup>18</sup>Aquel día, los sordos oirán las palabras del libro; los ojos de los ciegos verán sin tinieblas ni oscuridad; <sup>19</sup>volverán los humildes a alegrarse con el Señor y los más pobres exultarán con el Santo de Israel; <sup>20</sup>porque habrá desaparecido el tirano, y no quedará rastro del fanfarrón, y serán exterminados los que hacen el mal; <sup>21</sup>los que por una minucia acusan a otro, los que impiden al juez hacer justicia y hunden al inocente en la miseria.</p>
  <p><sup>22</sup>Por eso, así dice el Señor, que rescató a Abrahán, a la estirpe de Jacob: «Ya no se avergonzará Jacob, ni su rostro se sonrojará, <sup>23</sup>pues cuando vea lo que he hecho por él, santificará mi nombre, santificará al Santo de Jacob, y respetará al Dios de Israel». <sup>24</sup>Los insensatos aprenderán sabiduría y los que murmuraban recibirán instrucción.</p></div>

  <p class="note">La obra de Dios y la gran transformación de la humanidad es el tema del presente himno isaiano que está unificado con la proclamación de un profundo cambio de situación, en oposición a la perversión que nos invade.</p>

  <p class="note">La locución «aquel día» (v. 18) introduce, de hecho, una modificación profunda debida al Señor, que es quien ejecuta el paso de las tinieblas a la luz y cura una situación de ceguera profunda y de incomprensión, multiplicando sus maravillas ante el pueblo. Es fabulosa esta acción que destruirá los proyectos ocultos en los que el pueblo incrédulo basa su prudencia (cf. Is 29,15). Esta acción se lleva a cabo en tres ámbitos diversos: en la naturaleza (v. 17), en el campo de las enfermedades físicas (v. 18), y en el moral y religioso, en el que impera la justicia (vv. 19-21).</p>

  <p class="note">La salvación provoca ante todo el gozo de los «humildes» (v. 19). El término, cargado de valor teológico, no sólo sociológico, designa a los que en el momento de la angustia confían en el Señor perseverando en la espera de salvación que viene de él. Con el gozo de los necesitados y humildes y con la desaparición de los violentos, cínicos e impostores, la obra del Señor llega a su culmen, porque por ella se muestra a los ojos del pueblo creyente, que le reconoce como redentor de Abrahán y el santo de Jacob: «los ojos de los ciegos verán sin tinieblas ni oscuridad» (v. 18).</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 9,27-31</span>
  <p><sup>27</sup>Al salir Jesús de allí, lo siguieron dos ciegos gritando: —Ten piedad de nosotros, Hijo de David. <sup>28</sup>Cuando entró en la casa, se le acercaron los ciegos, y Jesús les dijo: —¿Creéis que puedo hacerlo? Ellos dijeron: —Sí, Señor. <sup>29</sup>Entonces tocó sus ojos diciendo: —Que os suceda según vuestra fe. <sup>30</sup>Y se abrieron sus ojos. Jesús les ordenó terminantemente: —Tened cuidado de que nadie lo sepa. <sup>31</sup>Pero ellos, nada más salir, lo publicaron por toda aquella comarca.</p></div>

  <p class="note">Una de las obras del Mesías consiste en dar vista a los ciegos, como signo de la salvación definitiva, anunciada por los profetas (cf. Is 29,18ss; 35,10; etc.). La narración de Mateo acerca de la curación de dos ciegos es del estilo típico del evangelista que tiende a reducir el elemento descriptivo para poner de relieve el tema de la autoridad de Jesús y la fe del discípulo o del beneficiario del milagro. La fe de quien busca la curación en Jesús se expresa sobre todo con el seguimiento (v. 27) y se convierte en súplica insistente, confiada.</p>

  <p class="note">Los dos ciegos deben entrar en casa y acercarse a Jesús, como para sugerir que sólo se logra la luz de la fe si se entra en la comunidad creyente y si nos acercamos a él para entrar en comunión con su persona escuchando su Palabra. En esta casa aparece una especie de examen sobre la fe, entendida como confianza en el poder salvador de Jesús (v. 28).</p>

  <p class="note">La palabra de curación que dirige a los dos ciegos es muy parecida a la dirigida al centurión (Mt 8,13), y parece establecer cierta proporcionalidad entre fe y curación, pero ante todo nos brinda una enseñanza a la comunidad para que supere la prueba necesaria de la fe con la oración, reconociendo que el socorro concedido es la respuesta a una súplica que brota de un corazón sincero.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>En la narración evangélica de la curación de los dos ciegos encuentro la parábola de la profunda transformación que la Buena Noticia obra en mí si la acojo con fe: el paso de la ceguera a un ver con ojos nuevos, no ofuscados.</p>

  <p>La vida vieja, existencia marcada por el pecado, me llevaba a una visión desenfocada de mí mismo, de los otros y de las situaciones de mi vida. La Buena Noticia, por el contrario, me ha abierto los ojos para ver mi ceguera, la necesidad de curación y salvación, que estaban ocultas.</p>

  <p>Como recuerda el evangelio de Juan, si creo ver, quedaré siempre en mi ceguera, porque permanece mi pecado (Jn 9,41). Si, por el contrario, como los ciegos de la curación de Mateo, pido al Señor que sane mi ceguera, recibo de él el don de la vista.</p>

  <p>Así comienzo a ver, primero un tanto borroso y luego más claramente, la acción del Señor en mi historia, en la de mis hermanos y hermanas. La fe en el Evangelio me lleva a discernir los signos luminosos de la venida de Dios en mi vida, precisamente donde de otro modo sólo aparecen fragmentos disgregados.</p>

  <p>Como los ciegos del evangelio me veo revestido de la piedad de Cristo, acogido en su casa, tocado por su mano misericordiosa. El evangelio me pone de manifiesto con nueva luz a los demás y aprendo a estimar lo que el mundo espontáneamente no aprecia: a los humildes, los pobres, los oprimidos.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">¡En tu luz veremos la luz! Padre de la luz, no permitas que el poder de las tinieblas se apodere de nuestro corazón; abre con la gracia de tu Espíritu nuestros ojos.</p>

  <p class="prayer">Cristo Jesús, verdadera luz venida a nuestro mundo para iluminarlo, sana nuestra ceguera, vence la oscuridad que nos asedia, para que aprendamos a ver las maravillas del amor de Dios con nosotros.</p>

  <p class="prayer">Espíritu Santo, luz de los corazones, renueva nuestros ojos para que podamos comprender que tú no miras como mira el hombre, sino lo que Dios ama.</p>

  <p class="prayer">Bienaventurada y Santa Trinidad, ilumínanos hasta lo más hondo para que nosotros, que en otro tiempo éramos tinieblas, podamos hoy resplandecer en el mundo como verdaderos hijos de la luz manifestando su fruto de bondad, justicia y verdad.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Ven, tú que anhelas mi pobre alma y mi alma te desea. Ven, oh Solo, del que está solo; porque, como ves, estoy solo. Te doy gracias, porque eres para mí un día sin atardecer, un sol sin ocaso…</p>
  <p>La luz ha vuelto a resplandecer para mí. La contemplo en claridad. Abre una vez más el cielo, disipa una vez más la noche. Una vez más descubre todo. Una vez más es contemplada ella sola. Y el que está sobre todo cielo, al que ninguno de los hombres ha visto jamás, éste se concentra una vez más en mi espíritu, en mí, en el cogollo de mi corazón —¡oh misterio sublime!— la luz desciende y me levanta sobre todo…</p>
  <p>En verdad, estoy aquí donde está la luz, sola y sencilla, y renazco a la inocencia contemplándola, sencillamente (Simeón el Nuevo Teólogo, <i>Canti di amore</i>, en M. Buber, <i>Confessioni estatiche</i>, Milán 1987, 74-75.82).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Hijo de David, ten compasión de nosotros»</b> (Mt 9,27).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p><b>Espiritual negro</b></p>
  <p>Cuando los santos marchen,<br>cuando los santos marchen,<br>oh Señor, me iré yo con ellos,<br>cuando los santos marchen.</p>
  <p>Cuando el sol no brille ya,<br>cuando el sol no brille ya,<br>oh Señor, me iré yo con ellos,<br>cuando el sol no brille ya.</p>
  <p>Cuando la luna se extinga,<br>cuando la luna se extinguirá,<br>oh Señor, me iré yo con ellos,<br>cuando la luna se extinga.</p>
  <p>Y las estrellas se borrarán,<br>las estrellas se borrarán,<br>oh Señor, me iré yo con ellos,<br>y las estrellas se borrarán.</p>
  <p>Cuando el Señor los premie,<br>cuando el Señor los premie,<br>oh Señor, me iré yo con ellos,<br>cuando el Señor los premie.</p>
  <p>Y un día tú los juzgarás,<br>y un día tú los juzgarás,<br>oh Señor, me iré yo con ellos,<br>y un día tú los juzgarás.</p>
  `}
 ]},

{ id:"1-sab", title:"Sábado de la primera semana", tag:"Primera semana · Sábado",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 30,19-21.23-26</span>
  <p>Así dice el Señor, el Santo de Israel: <sup>19</sup>Pueblo de Sión, que habitas en Jerusalén, ya no tendrás que llorar: se apiadará de ti al oír tu gemido, en cuanto te oiga, te responderá. <sup>20</sup>El Señor os dará pan en la aflicción, agua en la tribulación; tu Maestro no se esconderá ya, con tus ojos verás a tu Maestro; <sup>21</sup>cuando te desvíes a derecha o izquierda, oirás con tus oídos una palabra a la espalda: «Éste es el camino, seguidlo».</p>
  <p><sup>22</sup>El Señor te dará lluvia para la simiente que siembres en tu tierra; y el alimento que produzca la tierra será abundante y suculento; aquel día pastarán tus ganados en amplias praderas. <sup>23</sup>Los bueyes y asnos que trabajan la tierra comerán sabroso forraje, <sup>24</sup>aventado con la pala y el bieldo. <sup>25</sup>En todo monte elevado, y en todos los altozanos habrá arroyos y corrientes de agua el día de la gran matanza, cuando las torres caigan. <sup>26</sup>El día que el Señor vende la herida de su pueblo y cure las llagas de sus golpes, la luz de la luna será como la luz del sol, y la luz del sol será siete veces mayor.</p></div>

  <p class="note">El profeta, dirigiéndose a la comunidad que ha experimentado momentos de gran tribulación y está reunida para el culto, desea reafirmarla en la eficacia de la oración dirigida al Señor. Si sabe esperar en Dios, confiando totalmente en su Palabra, él sin duda escuchará los ruegos (v. 19). El hecho de orar al Señor no supone que éste preserve al pueblo de las dificultades, sino que en sus angustias experimentará al Dios del éxodo.</p>

  <p class="note">La comunidad podrá vivir la presencia del Señor en medio de ella como el don de una enseñanza de vida: será como su «Maestro», le enseñará como hizo frecuentemente en el pasado. La enseñanza del Señor no excluye una severa disciplina («pan de aflicción» y «agua de tribulación»: v. 20), recordando la pedagogía divina manifestada en las pruebas del desierto. La ley de Dios no será un peso o imposición, sino un guía seguro del camino de la vida (v. 22), y como experiencia de verdadera libertad y plenitud, manifestada con la imagen de la abundancia de pastos y agua.</p>

  <p class="note">La instrucción divina al corazón de la comunidad llevará a comprender lo saludable que resultó la corrección divina que no abandona al pueblo de la alianza en las tinieblas de la falsedad sino que lo cura y sana con la luz de su amor (v. 26).</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 9,35-10,1.5-7</span>
  <p><sup>9,35</sup>Jesús recorría todos los pueblos y aldeas, enseñando en sus sinagogas, anunciando la buena noticia del reino y curando todas las enfermedades y dolencias. <sup>36</sup>Al ver a la gente, sintió compasión de ellos, porque estaban cansados y abatidos como ovejas sin pastor. <sup>37</sup>Entonces dijo a sus discípulos: —La mies es abundante, pero los obreros son pocos. <sup>38</sup>Rogad por tanto al dueño de la mies que envíe obreros a su mies.</p>
  <p><sup>10,1</sup>Jesús llamó a sus doce discípulos y les dio poder para expulsar espíritus inmundos y para curar toda clase de enfermedades y dolencias. <sup>2</sup>Los nombres de los doce apóstoles son: primero Simón, llamado Pedro, y su hermano Andrés; luego Santiago el hijo de Zebedeo y su hermano Juan; <sup>3</sup>Felipe y Bartolomé; Tomás y Mateo, el publicano; Santiago, el hijo de Alfeo, y Tadeo; <sup>4</sup>Simón el cananeo, y Judas Iscariote, el que lo entregó.</p>
  <p><sup>5</sup>A estos doce los envió Jesús con las siguientes instrucciones: —No vayáis a regiones de paganos ni entréis en los pueblos de Samaría. <sup>6</sup>Id más bien a las ovejas perdidas del pueblo de Israel. <sup>7</sup>Y de camino anunciad: «Está cerca el reino de los cielos».</p></div>

  <p class="note">Jesús prepara la misión de los Doce con su ejemplo de compasión con la gente manifestado en el curar sus enfermedades, y en el cargar con sus sufrimientos. Pero además de su ejemplo de verdadera misericordia, invita a los Doce a la oración (Mt 9,37). La exhortación a rogar al dueño de la mies que mande obreros a su mies es, ante todo, una invitación a compartir la pasión profunda, total, que Jesús tiene por el plan recibido del Padre. La oración les recordará que no son más que discípulos, no dueños de la mies. Su corazón estará libre de presunción y desaliento, porque sólo el dueño de la mies es quien dispone de los tiempos y de la fecundidad de la misión.</p>

  <p class="note">Y, después de elegir a los enviados (cf. Mt 10,2-5), con vistas a la misión, Jesús les imparte algunas instrucciones sobre su actividad. Si el campo de acción de los Doce se limitará a Israel durante el tiempo de su vida terrena, es porque de este modo se significa la prioridad teológica de Israel como pueblo de la promesa y que la Iglesia debe reconocer. En cuanto al estilo de comportamiento, deberá ser como el de Jesús, es decir, de generosidad sin límites (v. 8b), en total sintonía con su Maestro. Se les manda proclamar la cercanía del reino de los cielos (v. 7), con signos concretos (curaciones, exorcismos: v. 8a) de liberación integral del hombre en nombre del que ejecuta la venida del reino de Dios a la vida de la humanidad.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>El profeta Isaías me recuerda que la súplica dirigida a Dios siempre es escuchada y Jesús me invita a llenar de contenido mi petición, no con mis sueños, sino con los deseos de su corazón.</p>

  <p>Pues bien, su deseo es que no se pierda la mies por falta de obreros. Con él debo rogar al Dueño de la mies que envíe obreros a su inmenso campo. Con la oración no pretendo convencer a Dios para que me escuche (él está siempre a la escucha); me abro al encuentro con el Señor que me libera, que actualiza conmigo los prodigios del éxodo y que, en su misericordia, se acerca a todo hombre o mujer para aliviar los sufrimientos, curar las heridas, para inyectar esperanza.</p>

  <p>Raramente, como sucede hoy, se tiene la posibilidad de experimentar de veras esta invitación de Jesús de invocar al Padre que mande obreros a su mies. Las necesidades de la evangelización son enormes, mientras los recursos humanos de la comunidad son, con frecuencia, demasiado precarios. Pero si miro la situación con los ojos de Jesús, no me siento impulsado por el desaliento sino por el conocimiento de que la misión cristiana encuentra su fuerza en la oración confiada.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor, tú que eres el Dueño de la mies y nos invitas a pedir obreros para tu campo, abre nuestro corazón a la compasión por los que están cansados y abatidos como ovejas sin pastor.</p>
  <p class="prayer">Haz que no nos dejemos llevar por la indiferencia ante el sufrimiento de los hermanos, sino que, como el Hijo de Dios, sintamos la ternura del Padre ante el dolor humano.</p>
  <p class="prayer">Danos la fuerza de anunciar con la vida y con las obras que el Reino está cerca, y haz que trabajemos generosamente en tu mies, confiando en que tú eres quien da el crecimiento.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>¡Qué sensible era el Hijo de Dios! Esa ternura le llevó a bajar del cielo; miraba a los hombres privados de su gloria; se conmovió de su desgracia.</p>
  <p>También nosotros debemos enternecernos ante los sufrimientos de nuestro prójimo participando en sus penas. ¿Cómo puedo sufrir con su enfermedad sino por una comunión recíproca con el Señor, que es nuestra cabeza? (Vicente de Paúl, <i>Entretiens spirituels aux Missionnaires</i>, París 1960, 689-691).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Gratis lo recibisteis, dadlo gratis»</b> (Mt 10,8).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Tu mayor miedo es no ser bienvenido. Este hecho está vinculado a tu miedo a nacer, a no ser bienvenido a esta vida, y a la muerte, a no ser bienvenido a la vida después de la muerte. Es el miedo, profundamente anclado en ti, de que hubiera sido preferible no haber nacido.</p>
  <p>Aquí estás enfrentándote al corazón de la lucha espiritual. ¿Te vas a entregar a las fuerzas de las tinieblas que te dicen que no eres bienvenido a la vida, o puedes confiar en la voz del que vino no a condenar sino a salvarte del miedo? Tienes que elegir la vida. En cada momento debes decidir confiar en la voz que te asegura: «Te amo. Tú formaste mis entrañas, me tejiste en el vientre de mi madre» (Sal 139,13).</p>
  <p>Todo lo que Jesús te dice puede resumirse en estas palabras: «Sé consciente de que eres bienvenido». Jesús te ofrece su vida íntima con el Padre. Quiere que sepas todo lo que él sabe, y que hagas todo lo que él hace. Sí, quiere prepararte un lugar en la casa de su Padre.</p>
  <p>Recuerda constantemente que tus sentimientos de no ser bienvenido no vienen de Dios y no te dicen la verdad.</p>
  `}
 ]}

]},

{ id:"2d-A", title:"Segundo Domingo de Adviento · Año A", tag:"Segunda semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 11,1-10</span>
  <p><sup>1</sup>Saldrá un renuevo del tronco de Jesé, un vástago brotará de sus raíces. <sup>2</sup>Sobre él reposará el espíritu del Señor: espíritu de inteligencia y sabiduría, espíritu de consejo y valor, espíritu de conocimiento y temor del Señor. <sup>3</sup>(Lo inspirará el temor del Señor). No juzgará por apariencias, ni sentenciará de oídas. <sup>4</sup>Juzgará con justicia a los débiles, sentenciará a los sencillos con rectitud; herirá al violento con la vara de su boca, con el soplo de sus labios matará al malvado. <sup>5</sup>Será la justicia el ceñidor de sus lomos; la fidelidad, el cinturón de sus caderas.</p>
  <p><sup>6</sup>Habitará el lobo junto al cordero, la pantera se tumbará con el cabrito, el ternero y el leoncillo pacerán juntos; un muchacho pequeño cuidará de ellos. <sup>7</sup>La vaca vivirá con el oso, sus crías se acostarán juntas; el león comerá paja, como el buey, <sup>8</sup>el niño de pecho jugará junto al escondrijo de la serpiente, el recién destetado meterá la mano en la hura del áspid. <sup>9</sup>Nadie causará ningún daño en todo mi monte santo, porque el país está lleno de la ciencia del Señor como las aguas colman el mar. <sup>10</sup>Aquel día, la raíz de Jesé se alzará como enseña de los pueblos; a ella se volverán las naciones y será gloriosa su morada.</p></div>

  <div class="reading"><span class="ref">Segunda lectura · Romanos 15,4-9</span>
  <p>Hermanos: <sup>4</sup>Y sabemos que cuanto fue escrito en el pasado, lo fue para enseñanza nuestra, a fin de que, a través de la perseverancia y el consuelo que proporcionan las Escrituras, tengamos esperanza. <sup>5</sup>Dios, por su parte, de quien proceden la perseverancia y el consuelo, os conceda vivir concordes a ejemplo de Cristo Jesús, <sup>6</sup>para que con un solo corazón y una sola boca alabéis a Dios, Padre de nuestro Señor Jesucristo.</p>
  <p><sup>7</sup>Por tanto, acogeos unos a otros, como también Cristo os acogió para gloria de Dios. <sup>8</sup>Porque os digo que ciertamente Cristo se hizo servidor de los judíos para probar que Dios es fiel al cumplir las promesas hechas a nuestros antepasados. <sup>9</sup>Pero también acoge misericordiosamente a los paganos para que glorifiquen a Dios, como dice la Escritura.</p></div>

  <div class="reading"><span class="ref">Evangelio · Mateo 3,1-12</span>
  <p><sup>1</sup>En aquellos días apareció Juan el Bautista predicando en el desierto de Judea. <sup>2</sup>Decía: —Convertíos, porque está cerca el Reino de los cielos.</p>
  <p><sup>3</sup>A él se refería el profeta Isaías cuando dijo: <i>Voz del que grita en el desierto: «Preparad el camino al Señor, allanad sus senderos».</i></p>
  <p><sup>4</sup>Llevaba Juan un vestido de pelo de camello y una correa de cuero a la cintura, y se alimentaba de saltamontes y miel silvestre. <sup>5</sup>Acudían a él de Jerusalén, de toda Judea y de toda la región del Jordán; <sup>6</sup>ellos reconocían sus pecados y Juan los bautizaba en el río Jordán.</p>
  <p><sup>7</sup>Viendo que muchos fariseos y saduceos venían a que los bautizara, les dijo: —¡Raza de víboras! ¿Quién os ha enseñado a escapar del juicio inminente? <sup>8</sup>Dad frutos que prueben vuestra conversión y no creáis que basta con decir: «Somos descendientes de Abrahán». Porque os digo que Dios puede sacar de estas piedras hijos de Abrahán. <sup>10</sup>Ya está el hacha puesta a la raíz de los árboles: todo árbol que no dé fruto bueno será cortado y arrojado al fuego.</p>
  <p><sup>11</sup>Yo os bautizo con agua para que os convirtáis; pero el que viene detrás de mí es más fuerte que yo, y no soy digno de llevarle las sandalias. Él os bautizará con Espíritu Santo y fuego. <sup>12</sup>En su mano tiene el bieldo para aventar su parva y recoger el trigo en su granero; pero la paja la quemará en un fuego que no se apaga.</p></div>

  <p class="note">Isaías nos presenta la imagen —todavía más sugestiva en el contexto precedente— de un renuevo que despunta en un tronco. El profeta ha descrito el itinerario de la invasión de un enemigo que entraba por el norte, y a su paso violento todo queda destruido; hasta en los bosques frondosos sólo quedan algunos troncos talados (cf. Is 10,33-34). En este panorama desolador, aparece un renuevo en un tocón, signo de que vuelve la vida y revelación de la fidelidad de Dios a sus promesas. Continuará reinando la dinastía de David marcada por muchas pruebas e infidelidades. El profeta sueña con un rey justo dedicado totalmente al servicio de Dios, que plantee proyectos prudentes y tenga fortaleza para ejecutarlos (vv. 3-4). El hecho de tratarse de un «renuevo» debe recordarnos que el personaje anunciado por Isaías no goza de la potencia político-militar de David: joven elegido por Dios y ungido por Samuel mientras pastaba el rebaño, último de sus hermanos, pero beneficiario de la elección divina. Dios quiere volver a los comienzos. El Nuevo Testamento nos dice que vuelve a comenzar en el niño de Belén y del carpintero de Nazaret: ¿quién podría pensar en que Dios actuaría de este modo?</p>

  <p class="note">A lo largo de la lectura se describe el equipo del «renuevo de Jesé»: fundamentalmente se afirma que gozará de un modo estable del Espíritu del Señor con sus dones —sabiduría, ciencia, consejo, fortaleza, piedad, temor de Dios—. El don del Espíritu no será provisional, como acontecía en los «Jueces», antiguos jefes carismáticos de Israel, sino que su presencia será permanente en el que Dios ha elegido. Lleno del Espíritu, actuará con justicia, a favor de los pobres, abriendo de este modo el mundo a la esperanza de un renovado paraíso terrenal sin violencia ni sobresaltos.</p>

  <p class="note">El culmen de la profecía está en la efusión del don de ciencia sobre todo el mundo: ciertamente que el paraíso es realizable y ya se ha anticipado en la tierra porque «el país está lleno de la ciencia del Señor» (v. 9) y desde el momento en que la humanidad conoce a Dios íntimamente, cambia la faz de la tierra.</p>

  <p class="note">Las palabras de Pablo subrayan el tema de la aceptación recíproca (v. 7) y se dirigen a los cristianos de origen pagano para enseñarles la acogida recíproca con los de origen judío. Habla a una comunidad en la que conviven «fuertes» y «débiles» en la fe, y advierte que todo lo que hace el cristiano debe estar marcado por la acogida y la edificación recíproca.</p>

  <p class="note">Desea que se esmeren en incrementarla por tres razones: la primera es la palabra de las antiguas Escrituras, que es alimento que sostiene la vida ordinaria del creyente, le robustece y hace posible perseverar en la esperanza. Pablo parece sugerir que el que está firme en la esperanza sabe también aceptar las propias limitaciones y las de los demás con paciencia.</p>

  <p class="note">En segundo lugar hay que tener siempre presente el ejemplo de Cristo: el principio inspirador de su vida no es el placer personal; fiel a la misión de revelar el amor del Padre, no trató de evitar el soportar las reacciones violentas de los hombres que lo crucificaron. Como última razón no hay que olvidar que los paganos han sido acogidos por el mismo Cristo. Hebreo, hijo de su pueblo, él ha sido el signo viviente de la fidelidad de Dios a las promesas, pero a la vez ha manifestado la misericordia de Dios también con los no hebreos para que todos pudiesen unirse en su alabanza.</p>

  <p class="note">La predicación del Bautista, con su potente invitación a la conversión y a la penitencia, es para todos los evangelistas quien introduce la predicación de Jesús. Según la presentación de Mateo, el Bautista no lanza sólo una invitación a la conversión, sino que proclama antes el acontecimiento que hace posible la misma conversión: «Está cerca el Reino de los cielos». Para que pueda generarse el gran movimiento del pueblo que sale de sus casas para dirigirse al Jordán a confesar sus pecados, es necesario que se base en la certeza inquebrantable de que Dios quiere reinar, que él está actuando realmente en este mundo y desea colmar la existencia de las personas, arrancando de cuajo la raíz de los males humanos: el pecado, las enemistades, los egoísmos. Y pueden enderezarse los senderos porque Dios lo quiere y lo hace posible.</p>

  <p class="note">El bautismo por inmersión en el Jordán aparece como el signo visible de la voluntad sincera de acoger esta cercanía de Dios. Por eso es necesario evitar todo tipo de hipocresía. Mateo pone en escena a fariseos y saduceos, que piden el bautismo sin las disposiciones adecuadas. «¡Raza de víboras!»: el bautista no exige ser justos de antemano, pues carecería de sentido su predicación; pide abandonar la hipocresía o tentativa de engañar a Dios, porque a Dios no se le puede engañar; sobre todo no se puede confiar en una justicia que proceda del mero pertenecer a la sangre o al pueblo de Dios: «No digáis: Somos descendientes de Abrahán».</p>

  <p class="note">Pero el Bautista es también consciente de su propia insuficiencia: sus palabras son auténticas y enardecedoras.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>En el inicio del movimiento multitudinario suscitado por el Bautista está la profunda convicción que transmite con energía: Dios es fiel, se ha acercado y desea cambiar nuestra vida, quiere «salvarnos». Como profeta enviado por Dios, atrae a la gente al desierto, lugar de prueba y de encuentro, de infidelidad e intimidad renovada, para que también las muchedumbres de hoy repitan la experiencia de Dios anunciada por los profetas: Dios se deja encontrar, pronuncia una palabra que nos atrae a sí; suscita en nosotros el deseo de una vida nueva y hace posible el cambio: «La llevaré al desierto y le hablaré al corazón» (Os 2,16).</p>

  <p>Los que van al desierto no son una asamblea de justos. La única condición que exige el Bautista es: no jugar con nosotros mismos ni con Dios, no ocultar el mal que tenemos dentro, sino manifestar lo que somos para poder realmente cambiar de mentalidad y de vida. Dios vuelve a comenzar con un vástago, vuelve a comenzar con quien todavía está dispuesto a cambiar, a pesar de pertenecer desde hace mucho a su pueblo, con quien hace de su pertenencia a la Iglesia no un privilegio que enarbola contra alguien, sino un don que hay que redescubrir en profundidad, recordando también las muchas veces que, en la vida de cada día, he traicionado este don.</p>

  <p>Por esta razón, otro punto fundamental del mensaje de este domingo es el Espíritu Santo: contemplado en primer lugar como Espíritu que colma al Mesías Jesús de Nazaret y luego como don en el que se nos ha insertado, que nos envuelve, en el que somos bautizados para que nuestros caminos torcidos puedan de veras enderezarse.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Suscita hoy en nosotros, Señor, el deseo vivo de volver a ti mediante una verdadera conversión. Reconocemos, Padre, las múltiples tortuosidades en las que se desvía nuestro corazón y nuestra voluntad cuando no se basan en tu Palabra de verdad, en la obra de tu gracia. Tú que eres el Dios fiel, haz firmes nuestros pasos en tus caminos.</p>

  <p class="prayer">No vemos, Señor, a nuestro alrededor habitar el lobo con el cordero, ni el niño meter la mano en la hura del áspid, y cuando hablamos de paz y justicia con frecuencia lo hacemos movidos únicamente por conveniencia o temor. Jesús, germen de David, tú vienes a nosotros como niño que no teme extender la mano a los venenos de nuestra humanidad: enséñanos a acogernos mutuamente para gloria de Dios; que no sea sólo el temor quien nos mueva a convertirnos, sino la convicción íntima de que con tu presencia Dios camina en medio de nosotros y nos convierte en su pueblo.</p>

  <p class="prayer">Ven a nosotros, Espíritu Santo, con la plenitud de tus dones para que este pueblo, que todavía se dispone a escuchar la palabra dura y austera del Bautista, no se quede tranquilo en su presunta justicia, sino que tenga la fuerza de llevar a buen término el camino emprendido.</p>
  `},

  <p>El amor es todo para ti: determina la elección, favorece el camino, da la fuerza de alcanzar la meta. Ama, y serás amado.</p>

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Los Padres del desierto consideraron la sociedad como un barco a la deriva que hay que abandonar lanzándose a nadar a fin de salvar la vida (…). Éstos eran hombres que creían que dejarse llevar por la corriente aceptando pasivamente los principios y valores de la sociedad era pura y simplemente un desastre.</p>
  <p>Nuestra sociedad no es precisamente una comunidad que irradia el amor de Cristo, sino una peligrosa red de dominación y manipulación en la cual podemos quedar atrapados y perecer. La pregunta fundamental que tendremos que hacernos es si nosotros estamos ya tan modelados por los poderes seductores del mundo de las tinieblas que nos hemos vuelto ciegos para ver nuestro desgraciado estado y el de los que nos rodean y hemos perdido ya la motivación necesaria para lanzarnos a nadar y salvar así nuestras vidas (H. J. M. Nouwen, <i>El camino del corazón</i>, Madrid 1986, 16-17).</p>

{ id:"2d-B", title:"Segundo Domingo de Adviento · Año B", tag:"Segunda semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 40,1-5.9-11</span>
  <p><sup>1</sup>Consolad, consolad a mi pueblo, dice vuestro Dios, <sup>2</sup>hablad al corazón de Jerusalén, gritadle que se ha cumplido su condena y que está perdonada su culpa, pues ha recibido del Señor doble castigo por todos sus pecados.</p>
  <p><sup>3</sup>Una voz grita: «Preparad en el desierto un camino al Señor, allanad en la estepa una calzada para nuestro Dios». <sup>4</sup>Que se eleven los valles, y los montes y colinas se abajen; que lo torcido se enderece y lo escabroso se allane. <sup>5</sup>Entonces se revelará la gloria del Señor y la verán juntos todos los hombres —lo ha dicho la boca del Señor—.</p>
  <p><sup>9</sup>Súbete a un monte elevado, mensajero de Sión; alza tu voz con brío, mensajero de Jerusalén; álzala sin miedo, di a las ciudades de Judá: «Aquí está vuestro Dios». <sup>10</sup>Aquí está el Señor; viene con poder y brazo dominador; viene con él su salario, le precede la paga. <sup>11</sup>Apacienta como un pastor a su rebaño y amorosamente lo reúne; lleva en brazos los corderillos, conduce despacito a las madres.</p></div>

  <div class="reading"><span class="ref">Segunda lectura · 2 Pedro 3,8-14</span>
  <p>Queridos hermanos: <sup>8</sup>Una cosa, queridos, no se os ha de ocultar: que un día es para el Señor como mil años, y mil años como un día. <sup>9</sup>Y no es que el Señor se retrase en cumplir su promesa como algunos creen; simplemente tiene paciencia con vosotros, porque no quiere que alguno se pierda, sino que todos se conviertan.</p>
  <p><sup>10</sup>Pero el día del Señor llegará como un ladrón. Y ese día, los cielos se derrumbarán con estrépito, los elementos del mundo se desintegrarán presa del fuego, y la tierra y todo lo que se haya hecho en ella quedará al descubierto.</p>
  <p><sup>11</sup>Si todas las cosas van a desmoronarse de este modo, ¡qué conducta tan santa y tan religiosa deberá ser la vuestra, <sup>12</sup>mientras esperáis y apresuráis la venida del día de Dios! Ese día en que los cielos se desintegrarán presa del fuego y los elementos del mundo, abrasados, se derretirán.</p>
  <p><sup>13</sup>Nosotros, sin embargo, según la promesa de Dios, esperamos unos cielos nuevos y una tierra nueva, en que habite la justicia. <sup>14</sup>Por tanto, queridos, mientras esperáis estos acontecimientos, procurad por vivir en paz con Dios, limpios e irreprochables ante él.</p></div>

  <div class="reading"><span class="ref">Evangelio · Marcos 1,1-8</span>
  <p><sup>1</sup>Comienzo de la buena noticia de Jesús, Mesías, Hijo de Dios. <sup>2</sup>Según está escrito en el profeta Isaías: <i>Mira, envío mi mensajero delante de ti, el que ha de preparar tu camino. <sup>3</sup>Voz del que grita en el desierto: ¡Preparad el camino al Señor; allanad sus senderos!</i></p>
  <p><sup>4</sup>Apareció Juan el Bautista en el desierto, predicando un bautismo de conversión para el perdón de los pecados. <sup>5</sup>Toda la región de Judea y todos los habitantes de Jerusalén acudían a él y, después de reconocer sus pecados, Juan los bautizaba en el río Jordán.</p>
  <p><sup>6</sup>Iba Juan vestido con pelo de camello, llevaba una correa de cuero a su cintura, y se alimentaba de saltamontes y de miel silvestre. <sup>7</sup>Esto era lo que proclamaba: —Detrás de mí viene uno más fuerte que yo, y no soy digno de agacharme para desatarle la correa de sus sandalias. <sup>8</sup>Yo os he bautizado con agua, pero él os bautizará con Espíritu Santo.</p></div>

  <p class="note">La conmovedora lectura de Isaías forma parte de una profecía proclamada en tiempos del retorno del exilio, cuando el edicto del rey persa Ciro permitió a los hebreos, desterrados en Babilonia, volver a su patria.</p>

  <p class="note">El oráculo da paso a diversas voces: aparece el profeta que habla, están los oyentes a los que el profeta ordena ser mediadores de consuelo con la ciudad de Jerusalén, víctima de tantas humillaciones, finalmente la misma ciudad de Jerusalén (Sión) a quien se dirige en definitiva el mensaje.</p>

  <p class="note">El mensaje central es la venida de Dios: «Aquí está el Señor» (v. 10). Sólo el Señor sabe verdaderamente consolar, y lo hace con dos actitudes: la primera, con su autoridad cambiando la suerte de este pueblo, eliminando la esclavitud (v. 2); la segunda, presentándose como pastor que guía su propio rebaño acomodándose al caminar de cada uno (v. 11: «Lleva en brazos los corderillos, conduce despacito a las madres»).</p>

  <p class="note">Sólo Dios puede consolar, pero los hombres deben ser portavoces y mensajeros de consuelo: «Consolad, consolad a mi pueblo… hablad al corazón de Jerusalén» (vv. 1-2); los que anuncian el consuelo deben compartir la pasión de Dios por su pueblo y ser capaces de «hablar al corazón».</p>

  <p class="note">El consuelo de Dios no excluye la parte correspondiente al hombre. Por eso se invita a «preparar un camino en el desierto»; literalmente hay que entenderlo como el camino que lleva a los hebreos desde el destierro de Babilonia a Jerusalén, pero la exhortación cobra un sentido más profundo: hay que abrir el corazón a Dios mediante un movimiento de auténtica conversión.</p>

  <p class="note">Las palabras de Pedro hoy están en relación con un problema concreto de la comunidad cristiana, creado por alguno que turba la fe de los creyentes al poner en duda la promesa de la vuelta del Señor, diciendo: «¿Dónde queda la promesa de su gloriosa venida?» (2 Pe 3,4). La objeción va incluso más allá cuestionando la consistencia misma de la Palabra de Dios, que parece que no hace cambiar nada en la historia humana: «¡Ya han muerto nuestros padres y todo está igual que al principio del mundo!» (3,4).</p>

  <p class="note">La primera respuesta es una cita del Sal 90,4: «Para el Señor, un día es como mil años»; la espera de la vuelta de Jesús no es cuestión de cantidad, de días o siglos.</p>

  <p class="note">Para Marcos el evangelio de Jesús, que es Cristo e Hijo (v. 1), no comienza de repente con la venida de Jesús, sino con un tiempo de preparación. En este tiempo de preparación se subrayan por lo menos tres elementos, el primero de los cuales es la Sagrada Escritura (vv. 2-3), ya que el evangelio de Jesús les dará una realización concreta y el evangelio solo se podrá comprender auténticamente meditando incesantemente las páginas de las que Dios ya había hablado. Las palabras que relata Marcos citando a Isaías, aluden a un camino que hay que preparar: el camino de Dios hacia su pueblo y el camino del pueblo hacia Dios.</p>

  <p class="note">Pasa a continuación al segundo elemento: el envío de un profeta, el Bautista, capaz de indicar a la humanidad el camino del desierto, el lugar donde Dios ofrece la posibilidad de una auténtica conversión (vv. 4.7-8). Según Marcos, el Bautista no insiste tanto en la predicación moral como, sobre todo, en la necesidad de esperar a «otro», uno que debe venir de parte de Dios.</p>

  <p class="note">El tercer elemento es el mismo pueblo que, por la predicación de Juan, camina penitente hacia el desierto, como el pueblo del éxodo (v. 5). Por consiguiente, está naciendo un pueblo nuevo, aunque se requiere una condición: que el hombre se ponga en camino, salga y se dirija al Bautista para acoger su mensaje de conversión. Y caminando juntos hacia el lugar donde resuena la Palabra de Dios es como el pueblo podrá reconstruirse.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Una metáfora domina las lecturas de hoy: es la del «camino». Correlativa a la del camino, aparece la idea de Iglesia como nuestro ser pueblo que se forma poniéndose en camino. Isaías se dirige a un pueblo desconfiado, con necesidad de consuelo y ayuda para ponerse en marcha; necesitamos profetas capaces de hablar al corazón, profetas de confianza, no de desventuras. Ante la devastación de nuestras conciencias, bombardeadas por mensajes negativos y nihilistas, es importante para cada uno de nosotros el aliento que nos llega del mensaje profético.</p>

  <p>También las palabras del Bautista apuntan en esta dirección, preparando nuestro corazón a la venida del que bautizará con Espíritu. Ciertamente su figura austera y penitente no deja de ir contra nuestro estilo de vida cuando ya no sentimos necesidad de conversión: una consolación «barata» no nos enriquecería con frutos duraderos.</p>

  <p>Es indispensable sobre todo nuestro testimonio inspirado en una fe honda en la salvación que nos ofrece Dios, nuestro querer ser pueblo de Dios atraídos por la promesa del Bautista, para después convencer a los demás de la salvación inminente. Por otra parte, siempre nos acuciará la pregunta de los escépticos: ¿es que vale la pena? La Palabra de Dios nos responde que sí vale la pena. La carta de Pedro nos recuerda que éste es un tiempo lleno de la presencia de Dios y sólo podemos verlo así creyendo de verdad y comprometiéndonos con nuestra existencia: la promesa de «cielos nuevos y tierra nueva» genera en el que cree una vida de auténtica santidad, y ella misma es anuncio y signo tangible de aquel mundo nuevo.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Tú nos hablas, Señor, a través de los profetas totalmente inmersos en las vicisitudes de su pueblo y de su tiempo capaces de estar solos o de ir al desierto a proclamar la Palabra a los que le siguen.</p>

  <p class="prayer">Tú nos hablas, Señor, por los testimonios dispuestos a compartir las angustias de sus hermanos, los temores y dramas de los hombres y llenos de fe para indicar tu presencia activa, tu promesa suscitadora de vida.</p>

  <p class="prayer">Tú nos hablas, Señor, por hombres que saben oponerse valientemente a las modas, costumbres, prejuicios, tópicos de sus contemporáneos y a la vez solidarios en el buscar tu rostro que salva, en el hablar al corazón del que desespera.</p>

  <p class="prayer">Te rogamos mires a tu Iglesia, la Iglesia de nuestros días, a nosotros que somos tu pueblo, constituidos por tu gracia en profetas y testigos de tu verdad: concédenos ser mediadores de tu consuelo en el momento mismo de denunciar las hipocresías propias y ajenas. En el desierto de nuestra sociedad haz resonar tu Palabra, para que también «salgamos», confesando nuestros pecados para ser de nuevo inmersos en la gracia de tu Espíritu.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>¡Oh grandeza del amor, por el que amamos a Dios, lo preferimos, nos dirigimos a él, le alcanzamos, lo poseemos! Si me pregunto por tus características, caigo en la cuenta de que eres el camino maestro, que acoge, dirige y guía a la meta; eres el camino del hombre a Dios y el camino de Dios a la humanidad.</p>
  <p>¡Oh camino feliz, sólo tú conociste el cambio de grandes bienes, por los que vino nuestra salvación! Tú has conducido a Dios hacia los hombres, tú diriges los hombres hacia Dios. Él descendió por este camino cuando vino a nuestro encuentro; nosotros lo recorremos hacia arriba, cuando vamos hacia él: ni Dios podía venir a nosotros, ni nosotros podíamos ir a él, sino por medio del amor.</p>
  <p>No sé cuál sea el mayor elogio que se pueda decir de ti, si afirmar que has hecho bajar a Dios del cielo, o que has hecho subir a los hombres al cielo.</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Muéstrame, Señor, tus caminos, instrúyeme en tus sendas»</b> (Sal 24,4).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Si la paciencia es la madre de la espera, es la misma espera la que produce nuevo gozo en nuestras vidas. Jesús nos ha hecho entrever no sólo nuestros sufrimientos sino también lo que está más allá de ellos. «También vosotros ahora estáis tristes, pero os veré de nuevo y vuestro corazón se llenará de gozo». Un hombre, una mujer que no alimentan su esperanza en el futuro, no están en disposición de vivir el presente con creatividad.</p>
  <p>La paradoja de la espera está precisamente en el hecho de que los que creen en el mañana están en disposición de vivir mejor el hoy; que los que esperan que de la tristeza brote el gozo están en disposición de descubrir los rasgos inaugurales de una vida nueva ya en la vejez; que los que esperan con impaciencia la vuelta del Señor pueden descubrir que él ya está aquí y ahora en medio de ellos (…).</p>
  <p>Precisamente en la espera confiada y fiel del amado es donde comprendemos cómo ya ha llenado nuestras vidas. Como el amor de una madre por su propio hijo puede crecer mientras espera su regreso, como los que se aman pueden descubrirse cada vez más durante un largo período de ausencia, así nuestra relación interior con Dios puede ser cada vez más honda, más madura mientras esperamos pacientemente su retorno (H. J. M. Nouwen, <i>Forza dalla solitudine</i>, Brescia 1998, 59-62).</p>
  `}
 ]},

{ id:"2d-C", title:"Segundo Domingo de Adviento · Año C", tag:"Segunda semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Baruc 5,1-9</span>
  <p><sup>1</sup>Jerusalén, despójate de tu vestido de luto y miseria, y vístete de gala con la gloria que Dios te concede. <sup>2</sup>Ponte el manto de la victoria de Dios, adorna tu cabeza con la diadema gloriosa del Dios eterno. <sup>3</sup>Porque Dios mostrará tu esplendor a todos los pueblos de la tierra. <sup>4</sup>Dios te dará para siempre este nombre: «Paz en la justicia, Gloria en la piedad».</p>
  <p><sup>5</sup>Levántate, Jerusalén, ponte en lo alto y mira hacia oriente; ahí están tus hijos convocados desde donde sale el sol hasta el ocaso, por la palabra del Santo, jubilosos porque Dios se ha acordado de ellos. <sup>6</sup>Salieron de ti a pie, conducidos por el enemigo, pero Dios te los devuelve con honor transportados como en trono real. <sup>7</sup>Porque Dios ha mandado abajarse a todos los montes elevados y a las colinas eternas, y rellenar los valles hasta allanar el suelo, para que Israel camine seguro en la gloria de Dios. <sup>8</sup>Los bosques y todos los árboles aromáticos darán sombra a Israel por mandato de Dios. <sup>9</sup>Porque Dios guiará a Israel con alegría a la luz de su gloria, con la misericordia y la justicia que de él proceden.</p></div>

  <p class="note">El canto de Baruc forma parte de un poema más amplio y tiene como tema el fin del destierro y la reconstrucción de la capital, Jerusalén. Probablemente se trata de una composición posterior, en la que la situación de la ciudad se convierte en paradigma, en ejemplo aplicable a diversas situaciones. El fragmento se subdivide en dos momentos, marcados por los imperativos.</p>

  <p class="note">«Jerusalén, despójate de tu vestido de luto, y vístete de gala» (vv. 1-4): se dará un cambio radical en la ciudad pasando del luto al gozo, y asumirá nombres nuevos, signo de su nueva situación («paz en la justicia, gloria en la piedad»). Para Baruc la promesa divina conlleva una vida de justicia; ésta traerá la paz y la piedad, es decir, el respeto a Dios, y será motivo de gloria para la ciudad (v. 4).</p>

  <p class="note">«Levántate, Jerusalén, y mira hacia oriente» (vv. 5-9): el renacer de la ciudad consiste en concreto en la vuelta de sus hijos, bajo la guía de Dios que los conduce.</p>

  <p class="note">En el v. 2 notamos en particular que a Dios se le llama «El Eterno». Se trata de un apelativo importante porque invita a los oyentes a tener una perspectiva amplia de las circunstancias históricas; el triunfo del mal es pasajero, aunque a veces cause trastornos al hombre. El autor inspirado enseña que Dios es Señor de la historia y puede resolver a favor del hombre los tiempos de prueba.</p>

  <div class="reading"><span class="ref">Segunda lectura · Filipenses 1,4-6.8-11</span>
  <p>Hermanos: <sup>4</sup>Doy gracias a mi Dios cada vez que me acuerdo de vosotros, <sup>5</sup>y siempre que rezo por todos vosotros lo hago con alegría, <sup>6</sup>porque habéis colaborado en la difusión del Evangelio desde el primer día hasta ahora. Y estoy convencido de que el que comenzó en vosotros esta obra buena la llevará a término hasta el día de Cristo Jesús.</p>
  <p><sup>8</sup>Dios es testigo de cuánto os quiero a todos vosotros con el entrañable amor de Cristo Jesús. <sup>9</sup>Y pido en mi oración que vuestro amor siga creciendo más y más en conocimiento y en sensibilidad, <sup>10</sup>para que sepáis discernir lo mejor y lleguéis limpios e irreprochables al día de Cristo, <sup>11</sup>llenos de los frutos de la justicia que proceden de Jesucristo, para gloria y alabanza de Dios.</p></div>

  <div class="reading"><span class="ref">Evangelio · Lucas 3,1-6</span>
