  <p class="note">El mensaje del profeta Isaías cobra un aire universalista y lleno de entusiasmo por la ciudad de Sión, concebida como el centro universal, desde el que Dios irradia su gloria. La profecía comienza con una exhortación a practicar la justicia (v. 1), porque es el camino que indica la sabiduría capaz de conducir a la dicha (v. 2). A continuación se proponen dos casos extremos, el extranjero y el eunuco, que podría pensarse que están excluidos de las promesas de Dios. Después de la respuesta al eunuco, se dirige al extranjero (vv. 6-8) y se indica la necesidad de una síntesis entre culto y vida, como condición para poder acceder al servicio divino.</p>

  <p class="note">El profeta Isaías utiliza aquí el mismo lenguaje que el Levítico usa para los levitas, más aún, hace un parangón entre la situación del levita respecto a los sacerdotes de primera fila y la de los extranjeros respecto a la comunidad cultual de Jerusalén. Así como el levita tiene derecho a ser acogido en el cuerpo sacerdotal para servir al Señor, también el extranjero tendrá derecho a entrar en la comunidad cultual. Is 66,21 avanzará más, indicando la elección de sacerdotes y levitas del Señor también entre las naciones.</p>

  <p class="note">La única condición para participar en el pueblo de Dios y en la asamblea cultual no es la pertenencia étnica, sino una vida fiel a las exigencias de la alianza, ejemplarizada en el precepto del descanso sabático. Para todos Dios abre su casa, su templo, para que todos los justos experimenten su misericordia (v. 7).</p>

  <div class="reading"><span class="ref">Evangelio · Juan 5,33-36</span>
  <p><sup>33</sup>En aquel tiempo, dijo Jesús a los judíos: —Vosotros mismos enviasteis una comisión a preguntar a Juan, y él dio testimonio a favor de la verdad. <sup>34</sup>Y no es que yo tenga necesidad de testigos humanos que testifiquen a mi favor; si digo esto, es para que vosotros podáis salvaros.</p>
  <p><sup>35</sup>Juan el Bautista era como una lámpara encendida que alumbraba; vosotros estuvisteis dispuestos, durante algún tiempo, a alegraros con su luz. <sup>36</sup>Pero yo tengo a mi favor un testimonio de mayor valor que el de Juan. Una prueba evidente de que el Padre me ha enviado es que realizo la obra que el Padre me encargó llevar a cabo.</p></div>

  <p class="note">Estamos inmersos en una controversia de Jesús contra los jefes judíos que lo acusan de haber violado el sábado, curando al paralítico (cf. Jn 5,16-18). El fondo del debate entre Jesús y los jefes es el de la fe contra la incredulidad.</p>

  <p class="note">Después de haber probado que su actuar es participación de la acción del Padre, Jesús se enfrenta con el argumento de testimonios contra él y de la importancia de su revelación sobre el Padre. Su revelación es verdadera porque el Padre testimonia a su favor por medio de sus obras. Aunque sus interlocutores no pueden acceder a este nivel de testimonio, sí pueden referirse al testimonio de Juan Bautista. El cuarto evangelio habla muchas veces del Bautista en su calidad de testigo (Jn 1,6.8.15; 1,19-35; 3,22-30). Y aquí también se reconoce, pero a la vez se relativiza. De hecho, aun afirmando que el Bautista fue «lámpara» ardiente y brillante (v. 35), se recuerda que es sólo un hombre cuyo testimonio recibe fuerza de otro, del Padre. Y es el Padre quien testimonia a favor de Jesús, con las Escrituras y con «las obras» mismas de Jesús, mostrando cómo sintonizan su hacer en favor de la vida y de la libertad de la humanidad (cf. v. 17: «Mi Padre trabaja siempre, por eso yo trabajo también»).</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Hoy la palabra del profeta Isaías nos abre al asombro y a la gratitud por la ilimitada misericordia divina que quiere la salvación de todos los hombres, rompiendo las barreras que fácilmente construimos en su nombre. También nos convoca, a nosotros que procedemos de los gentiles y no éramos su pueblo, a entrar como hijos en su casa y poder participar en la intimidad de su vida.</p>

  <p>Ya no hay razón que valga para pretender vivir alejados de su amor, aduciendo quizás la excusa de nuestra indignidad. Él no nos exige títulos de nuestros méritos, sólo la búsqueda sincera de su voluntad y el deseo de morar en su «casa de oración».</p>

  <p>En su casa encontramos la palabra de la Escritura donde late el corazón de Cristo y que da testimonio de él. A través de ella también resuena la voz del Bautista que nos señala al Esposo que está a punto de venir a nuestras vidas, y brilla para nosotros la luz de su testimonio iluminando nuestro camino hacia Cristo. De este modo empezamos a captar algo del profundísimo misterio de amor y comunión que lega el Hijo al Padre y que hace de la persona de Jesús y de sus obras la manifestación perfecta del rostro del Padre. El Padre no quiere juzgarnos, sino que apuesta incondicionalmente por la vida y la libertad de todos nosotros.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«Que tu gracia, Señor, nos preceda y nos acompañe siempre; así, a los que anhelamos vivamente la venida de tu Hijo, nos obtenga la salvación para la vida presente y para la futura». Así, Señor, oro también yo con tu Iglesia, en este día, pidiéndote que me aumentes el deseo de ti. Así podré alegrarme con la voz del Bautista que me anuncia la inminente venida de tu Hijo y gozar de la luz de su lámpara que me hace caminar al encuentro de Jesús, Dios que viene.</p>

  <p class="prayer">Pero sobre todo te alabo porque en Cristo me has concedido tantos hermanos y hermanas, que no eran de la estirpe de Israel, unos labios puros para alabarte y un corazón nuevo para adorarte, y con Jesús hemos obtenido un puesto en tu casa, un puesto como el de los hijos e hijas. Ahora con las palabras del profeta Isaías proclamo que «tu salvación está próxima a llegar; tu justicia, a punto de revelarse».</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>El hombre de Dios, el hombre que teme al Señor, no sabe desear otra cosa que la salvación de Dios, que es Cristo Jesús. Es él al que desea ardientemente, hacia él se vuelve con todas sus fuerzas, él caldea el interior de su espíritu, a él abre su corazón y se lo ofrece, y tiene un único temor: el poder perderle. De este modo, cuanto más intensamente se compromete el alma con el anhelo de estar unida a su salvación, tanto más se consume. Y atinadamente dice: «He esperado en tu palabra». Ha esperado en la Palabra el hombre que ha dado fe a la palabra celestial que anuncia la venida de nuestro Señor Jesucristo (…).</p>
  <p>Él es la salvación, la verdad, el poder y la sabiduría. Quien se consume por unirse a la verdadera fuerza, pierde lo que es suyo pero adquiere lo que es eterno (San Ambrosio, <i>Comentario al Salmo 118</i>, XI, 5-6, passim).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Así dice el Señor: Guardad el derecho, actuad con rectitud»</b> (Is 56,1).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Señor, también este año nos prometes andar al encuentro de la luz, de la fiesta de Navidad, que pone ante nuestros ojos la mayor realidad existente: tu amor, con el que has amado al mundo hasta darle tu Hijo único, para que el que crea en él no perezca sino que tenga vida eterna.</p>
  <p>¿Qué te vamos a llevar, qué te podemos ofrecer? ¡Cuánta oscuridad en nuestras relaciones humanas y en nuestro interior! ¡Cuántos pensamientos confusos, cuánta frialdad y despecho, cuánta vanidad y odio! ¡Qué cantidad de cosas de las que no puedes estar satisfecho, que nos dividen entre nosotros y no son de ningún provecho! ¡Qué de cosas, en clamoroso contraste con el mensaje de Navidad!</p>
  <p>¿Qué harás tú con tales dones y con gente como nosotros? Pero es precisamente esto, en Navidad, lo que quieres de nosotros y deseas arrancar toda esta basura y nosotros mismos como somos, para darnos a Jesús, nuestro Salvador, y, en él, un cielo y una tierra nueva, corazones nuevos y nuevas aspiraciones, una nueva claridad y nueva esperanza para nosotros y para todos los hombres.</p>
  <p>Sé tú mismo en medio de nosotros, en este último domingo anterior a la fiesta, en la que nos reunimos para preparar a recibir a tu Hijo como don. Concédenos hablar, escuchar, orar, aquí en el asombro y el agradecimiento, por todo lo que nos preparas, por todo lo que ya has decidido, por todo lo que ya has hecho. Amén (K. Barth, <i>Preghiere</i>, Turín 1987, 233).</p>
  `}
 ]}

{ id:"4d-A", title:"Cuarto Domingo de Adviento · Año A", tag:"Cuarta semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Isaías 7,10-14</span>
  <p><sup>10</sup>El Señor volvió a hablar a Acaz y le dijo: <sup>11</sup>—Pide al Señor tu Dios una señal, en lo hondo del abismo o en lo alto del cielo.</p>
  <p><sup>12</sup>Respondió Acaz: —No la pido, pues no quiero tentar al Señor.</p>
  <p><sup>13</sup>Isaías dijo: —Escucha, heredero de David, ¿os parece poco cansar a los hombres, que queréis también cansar a mi Dios? <sup>14</sup>Pues el Señor mismo os dará una señal: Mirad, la joven está encinta y da a luz un hijo, a quien pone el nombre de Enmanuel, que significa Dios con nosotros.</p></div>

  <p class="note">En esta complicada página de Isaías, aparece Acaz, el cual, asustado por la liga de los reyes vecinos que querían implicarlo en la guerra contra Asiria, acude al potente rey enemigo para que le defienda contra ellos. Pero de este modo abre las puertas al dominio asirio. El profeta Isaías le anima a tener fe y estar tranquilo, le sugiere una opción de fe preñada de sabiduría práctica, porque de este modo quedaría libre del dominio extranjero.</p>

  <p class="note">Sabiendo la dificultad de creer en un momento similar, donde están en juego cuestiones tan graves como la política y la guerra, donde Dios parece contar poco o nada, el mismo Dios está dispuesto a ofrecer un signo a Acaz para ayudar a su débil fe. Pero Acaz lo rechaza hipócritamente: pues finge recurrir a un motivo religioso («No quiero tentar al Señor») aunque en realidad rechaza asumir la actitud de fe dejándose guiar por Dios. No es que sea un ateo —de hecho cree en Dios—, pero surge aquí la espinosa cuestión de fondo: ¿Tiene que ver Dios con los grandes problemas de relaciones internacionales y, más en general, con las grandes opciones o con las decisiones de cada día, o más bien Dios es aquel a quien adoramos cuando vamos al templo y las demás opciones se toman en base a los juegos de poder de los hombres?</p>

  <p class="note">A la dramática pregunta, Dios responde ofreciendo un signo: un niño que nace de una muchacha todavía virgen y asume el nombre simbólico de «Dios con nosotros». Ciertamente es un pequeño signo que exige fe. ¿Qué es, de hecho, un niño frágil frente a los ejércitos que avanzan? Y, sin embargo, es un signo fuerte, porque nos dice que Dios cuida de la vida de este pueblo garantizándole un futuro.</p>

  <div class="reading"><span class="ref">Segunda lectura · Romanos 1,1-7</span>
  <p><sup>1</sup>Soy Pablo, siervo de Cristo Jesús, apóstol por vocación, destinado a proclamar el evangelio que Dios <sup>2</sup>había prometido por medio de sus profetas en las Escrituras santas.</p>
  <p><sup>3</sup>Este evangelio se refiere a su Hijo, nacido, en cuanto hombre, de la estirpe de David, <sup>4</sup>y constituido por su resurrección de entre los muertos Hijo poderoso de Dios según el Espíritu santificador: Jesucristo, Señor nuestro, <sup>5</sup>por quien he recibido la gracia de ser apóstol, a fin de que, para su gloria, respondan a la fe todas las naciones, <sup>6</sup>entre las cuales también estáis vosotros que habéis sido elegidos por Jesucristo.</p>
  <p><sup>7</sup>A todos los que estáis en Roma y habéis sido elegidos amorosamente por Dios para constituir su pueblo, gracia y paz de parte de Dios nuestro Padre y de Jesucristo el Señor.</p></div>

  <p class="note">Al comienzo de la carta que Pablo escribe a los Romanos, se autopresenta como «apóstol por vocación», para que quede claro que su evangelio no es fruto de obra humana, sino que proviene de Dios. Inmediatamente después presenta el elemento central de este «evangelio» y precisamente la profesión de fe en Jesús como Mesías, hijo de David, anunciado por las antiguas Escrituras y constituido Hijo de Dios, con pleno poder por la resurrección (vv. 3-4). En lo referente al título «Hijo de Dios» no significa que Jesús no lo fuera antes de la resurrección, sino que la resurrección lo constituye tal «en poder», mientras que antes había aparecido en la debilidad de la carne.</p>

  <p class="note">La Iglesia, en la fe, incesantemente lo proclama Mesías, Hijo de Dios, Señor. Los que acogen este «evangelio» obtienen un don precioso: son «amados de Dios y santos por vocación».</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 1,18-24</span>
  <p><sup>18</sup>El nacimiento de Jesús, el Mesías, fue así: su madre María estaba prometida a José y, antes de vivir juntos, resultó que había concebido por la acción del Espíritu Santo.</p>
  <p><sup>19</sup>José, su esposo, que era justo y no quería denunciarla, decidió separarse de ella en secreto.</p>
  <p><sup>20</sup>Después de tomar esta decisión, el ángel del Señor se le apareció en sueños y le dijo: —José, hijo de David, no tengas reparo en recibir a María como esposa tuya, pues el hijo que espera viene del Espíritu Santo. <sup>21</sup>Dará a luz un hijo, y le pondrás por nombre Jesús, porque él salvará a su pueblo de los pecados.</p>
  <p><sup>22</sup>Todo esto sucedió para que se cumpliera lo que había anunciado el Señor por el profeta: <sup>23</sup><i>La virgen concebirá y dará a luz un hijo, a quien pondrán por nombre Emmanuel</i> (que significa: Dios con nosotros).</p>
  <p><sup>24</sup>Cuando José despertó del sueño, hizo lo que el ángel del Señor le había mandado: recibió a su esposa.</p></div>

  <p class="note">El fragmento evangélico es continuación directa de la célebre página de la genealogía de Jesús (Mt 1,1-17). A través de la serie de nombres de los antepasados, el evangelio ya nos ha dicho que Jesús se ha insertado plenamente en la historia humana, pero la genealogía también nos deja intuir que hay un misterio especial en este niño: de hecho, no es engendrado por una sucesión directa de padre a hijo, sino que nace «de María». Quedan, pues, dos cosas por explicar, a las que da respuesta la perícopa de hoy: ¿Cuál es propiamente el origen de Jesús? y ¿cómo se puede llamar «hijo de David» si físicamente no fue engendrado por un descendiente de David?</p>

  <p class="note">Los acontecimientos narrados nos revelan el misterio de Jesús: nace de una mujer, María, como verdadero hombre insertado en la historia humana, pero su nacimiento es «obra del Espíritu Santo», aplicándole literalmente la profecía de Isaías, que llamaba a aquel niño «Dios con nosotros» (1,23). Además se le considera plenamente de la descendencia de David, porque José, hijo de David, lo toma como hijo propio: la función esencial del padre, lo que realmente le hace padre, más allá de la generación física, es la de dar nombre al hijo y es lo que precisamente hace José. Dándole el nombre, le confiere su identidad social y por esta razón Jesús es reconocido como verdadero hijo de David, como conviene al Mesías.</p>

  <p class="note">Sin embargo, al misterio de Dios se accede sólo por la fe: y en esto sobresale José, definido por su fe, con el apelativo bíblico de «justo» (v. 19).</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Las lecturas ofrecen hoy a nuestra consideración a dos personajes cuya reacción ante la promesa de Dios es diametralmente opuesta: el rey Acaz, imagen del incrédulo, y José, figura del creyente. La fe de José esboza algunos rasgos de nuestra fe. De hecho él, portador del nombre de uno de los padres de Israel, revive la fe de los patriarcas. Como Abrahán, padre en la fe, José está dispuesto a seguir el camino confiado del proyecto de Dios. Es el hombre «justo», es decir, el que cree las promesas de Dios incluso cuando éstas resultan extrañas e improbables y, de cualquier modo, incómodas: su vida se ve convulsionada por el nacimiento de aquel cuyo nombre significa salvación. Ser salvados no significa, por lo tanto, caminar por un sendero llano; exige de cada uno de nosotros la disponibilidad a dejarse modificar en pensamientos, proyectos, opciones. El justo en la Biblia es aquel que permanece firmemente anclado en Dios, a pesar de los pesares, aunque tenga que quedarse solo.</p>

  <p>Además José es el hombre obediente, dispuesto a renunciar a María y luego a acogerla en casa si ésta es la voluntad de Dios. A María, su prometida, en cierto sentido se la «quitan» para volvérsela a «dar» de modo más sublime, y él la recibe como don de Dios. La encuentra distinta de como pensaba y la acoge bajo una luz nueva porque Dios se la da, y la quiere con amor delicado, respetuoso, silencioso y desinteresado. Lo dicho vale análogamente para la relación con Jesús: José es desapropiado del hijo —porque aquel niño no es hijo de sus entrañas—, pero a la vez no es un padre «disminuido», desde el momento en que será él quien impondrá el nombre a Jesús. El justo José experimenta así lo que es el sentido de cualquier hijo, una realidad que no pertenece a sus progenitores y que, precisamente por eso, se acoge con gozo como promesa abierta a la esperanza.</p>

  <p>La fe aparece, pues, como la condición en la que descubrimos con nueva luz el sentido de las cosas y de las relaciones más preciosas que vivimos.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">«Pide un signo»: en nuestro camino, Señor, has diseminado múltiples signos de tu presencia, pero nosotros no podemos darnos cuenta de su poder sino en el momento en que de veras nos comprometemos contigo. Danos la gracia de abrirnos a ti y de acogerlos.</p>

  <p class="prayer">Tu Palabra con frecuencia se reduce para nosotros a una serie de pobres signos, trazados sobre el papel, hasta que nos decidimos a hacerla nuestra, a meditarla y a asumirla como alimento de nuestro espíritu. La Eucaristía nos parece un simple trozo de pan si no nos acercamos con fe y no lo acogemos como alimento de vida que engendra en nosotros el amor. Nuestros hermanos con frecuencia no tienen nada de excepcional, hasta que no los miramos bajo el prisma de tu amor que hace de todos nosotros tu cuerpo, una Iglesia en la que aprendemos a conocerte y a amarte.</p>

  <p class="prayer">No permitas, Señor, que pasen desapercibidos estos signos preciosos de tu presencia. Eres tú mismo quien nos los da, no dejes que los rechacemos, como Acaz, por temor a comprometernos en la vida de fe. Al contrario, refuerza y guarda en nosotros la fe obediente del justo José.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>¡Oh María, mar sereno, María dispensadora de paz, María tierra fructífera! Hoy, María, te has hecho libro en el que se escribe nuestra norma. En ti hoy se escribe la sabiduría del Padre eterno. En ti hoy se manifiesta la fortaleza y la libertad del hombre porque fue enviado un ángel a anunciarte el misterio del plan divino, y pedir tu consentimiento (…). Esperaba a la puerta de tu voluntad para que le abrieras, quería venir a ti; y nunca hubiese entrado si no le hubieses abierto diciendo: «Aquí está la esclava del Señor; hágase en mí según tu palabra» (Lc 1,38)…</p>
  <p>¡Oh María, dulcísimo amor mío! En ti está escrito el Verbo, del que recibimos la doctrina de la vida. Tú eres la tablilla que nos ofrece esa doctrina. Veo que, tan pronto como fue escrito en ti, el Verbo no estuvo sin la cruz del santo deseo, sino que, ya en el momento de su concepción en ti, le fue infundido y añadido el deseo de morir para traer al hombre la salvación, por la cual se encarnó (…).</p>
  <p>Oh María, bendita seas entre todas las mujeres: hoy nos has dado de tu harina. Hoy la deidad se ha unido y amasado con nuestra humanidad tan fuertemente, que jamás se podrá separar esta unión, ni por la muerte ni por nuestra ingratitud (Catalina de Siena, <i>Preghiere ed elevazioni</i>, Roma 1920, 116-124).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«La virgen concebirá y dará a luz un hijo, a quien pondrá por nombre Emmanuel (que significa Dios con nosotros)»</b> (Mt 1,23).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>José es del mismo temple que María: un creyente a la escucha de lo que le sucede. La noticia de la próxima maternidad de María no suscita en él ninguna reacción defensiva. No conservamos ninguna de sus palabras. No es una persona que habla o ajusta las cosas para ventaja propia: se limita a escuchar lo que le revela el ángel. La verdad de Dios es más importante de lo que José vive. Y esta verdad la respeta José sin agresividad alguna, sin pensar siquiera en defenderse. Tanto para María como para José, la anunciación es algo increíble. Nadie puede estar a la altura de semejante verdad. No obstante, no aparece asomo de escepticismo, ni de comportamiento pasivo, no hay toma de distancias, nada que nos haga pensar en un sentimiento de resarcimiento. Sólo fe y abandono. María y José han renunciado a su verdad para entrar en la de Dios.</p>
  <p>¿Y nosotros? Nosotros no podemos ser felices si no logramos leer en profundidad los acontecimientos de nuestra existencia. Dios está presente en nuestra existencia: en cada una de sus vicisitudes aparece su plan, su intención de decirnos algo. Es una verdad que debemos descubrir también ahora (G. Danneels, <i>Le stagioni della vita</i>, Brescia 1998, 210-211).</p>
  `}
 ]},

{ id:"4d-B", title:"Cuarto Domingo de Adviento · Año B", tag:"Cuarta semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · 2 Samuel 7,1-5.8b-12.14a.16</span>
  <p><sup>1</sup>Cuando David se estableció en su palacio y el Señor le dio paz con todos sus enemigos de alrededor, <sup>2</sup>dijo al profeta Natán: —Yo vivo en una casa de cedro, mientras que el arca del Señor está en una tienda.</p>
  <p><sup>3</sup>Natán le dijo: —Haz lo que te propones, porque el Señor está contigo.</p>
  <p><sup>4</sup>Pero aquella misma noche el Señor dirigió esta palabra a Natán: <sup>5</sup>—Ve a decir a mi siervo David: Esto dice el Señor: ¿Eres tú quien me va a construir una casa para que viva en ella?</p>
  <p><sup>8b</sup>Yo te tomé de la majada, de detrás de las ovejas, para que fueras caudillo de mi pueblo, Israel. <sup>9</sup>He estado contigo en todas tus empresas, he exterminado delante de ti a todos tus enemigos; y yo haré que tu nombre sea como el de los grandes de la tierra. <sup>10</sup>Daré un puesto a Israel, mi pueblo, para que viva en su casa y los malhechores no lo opriman como antes, <sup>11</sup>como en el tiempo en que yo establecí jueces sobre mi pueblo Israel; te daré paz con todos tus enemigos. Además, el Señor te anuncia que te dará una dinastía.</p>
  <p><sup>12</sup>Cuando hayas llegado al final de tu vida y descanses con tus antepasados, mantendré después de ti el linaje salido de tus entrañas, y consolidaré su reino. <sup>14a</sup>Seré para él un padre y él será para mí un hijo.</p>
  <p><sup>16</sup>Tu dinastía y tu reino subsistirán para siempre ante mí, y tu trono se afirmará para siempre.</p></div>

  <p class="note">La presente página de 2 Sm 7 es como el «manifiesto» del mesianismo real, es decir, de la espera de un Mesías davídico para los tiempos de la salvación definitiva. Tenemos que indicar ante todo las múltiples veces que aparece el término «casa», que hace las funciones de hilo conductor. Primero es David que mora seguro y estable en su casa (v. 1), luego el mismo rey que desea edificar una casa al Señor (vv. 2-5), a continuación Dios promete a David una casa (v. 11), es decir, una descendencia y un reino estable.</p>

  <p class="note">David, en la cumbre de su poder tras la aclamación como rey de Judá e Israel, acogió en la parte más alta de la ciudad, donde vive, al Arca, signo de la presencia divina. Pero le queda por realizar el sueño de construir un templo grandioso como digna morada de Dios. La palabra del profeta parece estar de acuerdo en un primer momento, pero luego pone en tela de juicio su proyecto, porque en vez del sueño de David se realizará el «sueño» de Dios: «el Señor te hará a ti una casa» (v. 11 literal). Dios será quien dará a David descendencia y estabilidad. Dentro de una vida compleja, con mezcla de lances de generosidad y de profunda rivalidad, tensiones y aventuras de todo tipo, se inserta la Palabra de Dios invitándole a recordar que es él el único que puede dar estabilidad a cualquier casa. Será David quien entre en el proyecto de Dios y no al contrario.</p>

  <p class="note">El autor bíblico recuerda que la fidelidad de Dios no se dirige sólo a David, sino que siempre mira al bien del pueblo, ese pueblo que, siempre oprimido, obtiene de Dios la promesa de salvación y la estabilidad definitiva: «Daré un puesto a Israel, mi pueblo, para que viva en su casa y los malhechores no lo opriman como antes» (v. 10).</p>

  <div class="reading"><span class="ref">Segunda lectura · Romanos 16,25-27</span>
  <p>Hermanos: <sup>25</sup>Al Dios que puede fortalecernos en la fe según el evangelio que yo anuncio y según la proclamación que hago de Cristo Jesús; al Dios que ha revelado el misterio mantenido en secreto desde la eternidad, <sup>26</sup>pero manifestado ahora por medio de las Escrituras proféticas según la disposición del Dios eterno, y dado a conocer a todas las naciones de modo que respondan a la fe; <sup>27</sup>a ese Dios, el único sabio, sea la gloria por siempre a través de Jesucristo. Amén.</p></div>

  <p class="note">Con el presente himno de alabanza Pablo cierra su carta a los Romanos. En él, a pesar de la (relativa) complicación del texto, surgen tres temas fundamentales: Dios, el misterio, el anuncio.</p>

  <p class="note">Dios es a quien va dirigida la alabanza, el que da estabilidad, «el que puede fortalecernos» (v. 25). Es el único «sabio» (v. 27), origen y fin de toda búsqueda humana.</p>

  <p class="note">El misterio: término que para Pablo designa el plan de Dios. Este plan gira en torno a Jesús. Respecto a Jesús —centro de la historia de salvación— el tiempo que le precede puede considerarse como tiempo de preparación o también tiempo del «silencio» de Dios, no precisamente porque Dios callase, sino porque su hablar no se había manifestado aún en la Palabra eterna del Hijo. El tiempo presente se valora como algo muy importante: «ahora» es el tiempo de la «revelación» (v. 25). El tiempo final ya está presente, porque en Cristo se ha dado la revelación definitiva de Dios.</p>

  <p class="note">El tercer tema fundamental es el del anuncio del evangelio, que para Pablo contradistingue el tiempo presente. Como los cristianos viven en el último tiempo, el de la revelación definitiva del Padre, esta palabra del evangelio sólo podrá ser una palabra para todos, dirigida a «todas las naciones».</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,26-38</span>
  <p><sup>26</sup>Al sexto mes, envió Dios al ángel Gabriel a una ciudad de Galilea llamada Nazaret, <sup>27</sup>a una joven prometida a un hombre llamado José, de la estirpe de David; el nombre de la joven era María.</p>
  <p><sup>28</sup>El ángel entró donde estaba María y le dijo: —Dios te salve, llena de gracia, el Señor está contigo. <sup>29</sup>Al oír estas palabras, ella se turbó y se preguntaba qué significaba tal saludo.</p>
  <p><sup>30</sup>El ángel le dijo: —No temas, María, pues Dios te ha concedido su favor. <sup>31</sup>Concebirás y darás a luz un hijo, al que pondrás por nombre Jesús. <sup>32</sup>Él será grande, será llamado Hijo del Altísimo; el Señor Dios le dará el trono de David, su padre, <sup>33</sup>reinará sobre la casa de Jacob por siempre y su reino no tendrá fin.</p>
  <p><sup>34</sup>María dijo al ángel: —¿Cómo será esto, si yo no tengo relaciones con ningún hombre?</p>
  <p><sup>35</sup>El ángel le contestó: —El Espíritu Santo vendrá sobre ti y el poder del Altísimo te cubrirá con su sombra; por eso, el que va a nacer será santo y se llamará Hijo de Dios. <sup>36</sup>Mira, tu pariente Isabel también ha concebido un hijo en su vejez, y ya está de seis meses la que todos tenían por estéril; <sup>37</sup>porque para Dios nada hay imposible.</p>
  <p><sup>38</sup>María dijo: —Aquí está la esclava del Señor, hágase en mí según tu palabra. Y el ángel la dejó.</p></div>

  <p class="note">Dos son los centros de interés fundamentales en el texto lucano de la anunciación a María: el anuncio del nacimiento de Jesús y la vocación de María a ser sierva del Señor.</p>

  <p class="note">Jesucristo se presenta como el «signo» de la fidelidad de Dios, que mantiene las promesas hechas a David: «Se llamará Hijo del Altísimo, el Señor Dios le dará el trono de David su padre, reinará sobre la casa de Jacob para siempre, y su reino no tendrá fin» (vv. 32-33). Todos los elementos de la promesa a David se funden y realizan en Jesucristo porque es el Mesías perteneciente a la familia davídica y es el Hijo hecho hombre, el nuevo templo, la casa que Dios ha preparado para que Dios y el hombre se encuentren. Además el pueblo de Dios, la casa de Jacob, encuentra finalmente en Jesús al rey que lleva a cabo el verdadero ideal del Reino, un ideal de justicia, de paz y fraternidad.</p>

  <p class="note">Por consiguiente, la obra de Dios, su fidelidad y su don es lo que constituye el centro. Pero el evangelio narra las cosas observando la actitud de María, como la que hace posible este don con su «sí». Es el polo opuesto a David: sin sueños de grandeza, no ocupa en la sociedad una posición que le permita influir en los grandes proyectos humanos, sino que su casa está abierta de par en par cuando el ángel «entra a su presencia» como mensajero divino. María cree firmemente en la fidelidad de Dios y se pone a disposición de su designio: «Aquí está la esclava del Señor, hágase en mí según tu palabra» (v. 38).</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La Palabra quiere llegar a nuestro corazón proponiéndonos el tema de la «fidelidad de Dios». Un Dios fiel significa la roca capaz de dar estabilidad a nuestras vidas, pero también un Dios que nos sorprende: David debe aceptar que no son sus proyectos sino los de Dios los que deben conformar su vida. De tal modo, no sólo cambia el arquitecto sino el sentido de todo nuestro proyecto, porque el plan divino descubre las posibles ambigüedades de nuestros proyectos humanos. Es un tema al que hoy somos particularmente sensibles, desde el momento en que experimentamos por una parte nuestra dificultad en ser fieles, sobre todo durante mucho tiempo; por otra parte, nos sentimos traicionados por los otros o por las experiencias personales, incluso hasta por Dios mismo.</p>

  <p>«El Señor está contigo»: este saludo del ángel a María es la expresión del rostro de Dios que hoy se nos ofrece también a nosotros. Él está con nosotros mucho antes de que nos demos cuenta. Puede comenzar a nacer una vida nueva tomando en serio estas palabras, pero no se conoce esta confianza de Dios si en concreto no nos ponemos a caminar con él, como María.</p>

  <p>Cada uno de nosotros, a lo largo de su vida, ha experimentado el fallo de algún proyecto, con frecuencia hasta de programas que parecían muy buenos, a los que estábamos apegados. A veces el fallo se debe sobre todo a la propia infidelidad o debilidad en perseguir la finalidad prefijada. La Palabra de Dios que hoy se nos propone arroja luz sobre estas experiencias, enseñándonos por una parte a no creernos dueños de nuestra propia vida, y por otra a vivir también el fallo como posible momento de crecimiento, diciendo incluso en esas amargas circunstancias un «sí» a ese Dios que no deja de sernos fiel.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Dios, Padre omnipotente, tú ejecutas tus planes atrayendo a ti, con la fuerza del amor, al corazón humano. Sabes suscitar siervos tuyos entre los poderosos como David y entre los humildes como María. Cólmanos también a nosotros de tu Espíritu, para que aprendamos a acoger tu Palabra.</p>

  <p class="prayer">Como María, haznos capaces de sintonizar nuestros deseos con los tuyos: «Hágase en mí según tu palabra», no es una frase pronunciada con resignación, sino que brota espontáneamente de un ánimo profundamente adherido a tu Palabra, proyectado a nuevos deseos que sólo tú puedes suscitar.</p>

  <p class="prayer">Como María, haznos a nosotros hombres y mujeres obedientes. Como miembro de tu pueblo, pueblo de la alianza, ella siempre aprendió que la vida del hombre es válida si está en comunión contigo y, en cuanto se lo pediste, dio en seguida su «sí». Escúchanos también a nosotros, miembros de tu pueblo, a no pesar sino estando en comunión contigo, a darte sin dudar los «síes» que nos pidas.</p>

  <p class="prayer">Como María, haznos siervos tuyos; que éste sea nuestro título de gloria, como lo fue para Abrahán, Moisés, David, María y todos tus amigos. La Navidad nos recuerde que éste ha sido el secreto de la vida de tu Hijo.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>La Santísima Virgen María fue la afortunada a quien se hizo esta divina salutación para concluir el «asunto» más grande e importante del mundo: la Encarnación del Verbo Eterno, la paz entre Dios y los hombres y la redención del género humano. Por la salutación angélica, Dios se hizo hombre, y la Virgen, Madre de Dios; se perdonó el pecado, se nos dio la gracia. En fin, la salutación angélica es el arco iris, el emblema de la clemencia y de la gracia que Dios ha hecho al mundo.</p>
  <p>La salutación del ángel es uno de los cánticos más hermosos que podemos dirigir a la gloria del Altísimo. Por eso repetimos esta salutación para agradecer a la Santísima Trinidad sus múltiples e inestimables beneficios. Alabamos a Dios Padre, porque tanto amó al mundo, que llegó a darle su único Hijo para salvarle. Bendecimos al Hijo, porque descendió del cielo a la tierra, porque se hizo hombre y porque nos ha redimido. Glorificamos al Espíritu Santo porque formó en el seno de la Virgen Santísima el cuerpo purísimo de Jesús, que fue la víctima de nuestros pecados.</p>
  <p>Con este espíritu de agradecimiento debemos rezar la salutación angélica, acompañándola de actos de fe, esperanza, caridad y acciones de gracias por el beneficio de nuestra salvación (Luis María Grignion de Montfort, <i>El secreto admirable del rosario</i>, Madrid 1954, 335-336).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Alégrate, llena de gracia, el Señor está contigo»</b> (Lc 1,28).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>La felicidad se basa en la verdad (…). Es imposible fabricar la verdad o someterla a los propios caprichos; se nos da y hay que inclinarse ante ella. El hombre no puede conquistarla; frente a la verdad es sólo un mendigo que debe servirla.</p>
  <p>Aunque María ha acogido el anuncio y ha pronunciado su sí, no ha hecho más que entrar en una verdad que se le comunicaba. No fue ella quien la descubre, ni se ha adueñado de la verdad. María entra en algo que le acontece. Con temor y confianza. No habla, escucha. Es toda oídos. Aunque tenga labios y lengua, Dios y el niño que va a llegar determinan totalmente su existencia. La vida es para ella espera y esperanza y ninguna actitud es tan respetuosa del tiempo como esta actitud de adviento, todo espera. En toda la narración de la anunciación se presta muy poca atención al corazón de María, a su yo, a su psicología. Aprendemos mucho más de lo que acontece en Dios que en María. Este amor a la verdad hunde sus raíces en una profunda humildad de creatura («Aquí está la esclava del Señor»). María tiene fe. Por eso da crédito ilimitado a lo que viene de Dios: «Hágase en mí según tu palabra».</p>
  <p>El único camino hacia la felicidad consiste en ser hombre, mujer de adviento: uno que escucha más que habla, sobre todo uno que es consciente de que «nada es imposible para Dios». Si Dios nos da poco, significa que hemos esperado poco; y, de hecho, es imposible alimentar a alguien que no tenga hambre (G. Danneels, <i>Le stagioni della vita</i>, Brescia 1998, 208-209.211).</p>
  `}
 ]},

{ id:"4d-C", title:"Cuarto Domingo de Adviento · Año C", tag:"Cuarta semana · Domingo",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Miqueas 5,1-4</span>
  <p>Así dice el Señor: <sup>1</sup>En cuanto a ti, Belén Efrata, la más pequeña entre los clanes de Judá, de ti sacaré al que ha de ser soberano de Israel: sus orígenes se remontan a los tiempos antiguos, a los días de antaño.</p>
  <p><sup>2</sup>Por eso el Señor abandonará a los suyos hasta el tiempo en que dé a luz la que ha de dar a luz. Entonces los que aún queden volverán a reunirse con sus hermanos israelitas.</p>
  <p><sup>3</sup>Se mantendrá firme y pastoreará con la fuerza del Señor, y con la majestad del nombre del Señor su Dios. Ellos vivirán seguros, porque extenderá su poder hasta los confines de la tierra. <sup>4</sup>Él mismo será la paz. Cuando Asiria invada nuestra tierra y entre en nuestros palacios, nos enfrentaremos a ella con siete pastores y ocho príncipes, <sup>5</sup>que pastorearán a Asiria con la espada, y al país de Nemrod con el acero. Porque cuando Asiria invada nuestras fronteras, él será quien nos libre.</p></div>

  <p class="note">Miqueas, contemporáneo de Isaías, vive en un período dramático para el reino de Judá, amenazado por el poder asirio y gobernado por descendientes de David, dedicados más a sus propios intereses que a los de sus súbditos. En este contexto aparece el presente oráculo de renacimiento. Para el profeta hay que volver a comenzar desde el principio. Dios hará renacer a su pueblo por medio de un rey justo, pero provendrá no de Jerusalén, sino del pequeño Belén (v. 1), patria chica de David. Es necesario recuperar la humildad de los orígenes, de «los días remotos», cuando David fue elegido el último, después de pasar sus siete hermanos, que —a los ojos de los hombres— parecían más adecuados que él; no habrá nuevo nacimiento si no se comienza desde abajo, desde los últimos.</p>

  <p class="note">De momento es necesario un tiempo de purificación (v. 2), un tiempo en el que Israel será sometido a otras potencias y terminará con el nacimiento del nuevo rey.</p>

  <p class="note">El profeta no da el nombre pero enumera las características esenciales (v. 3): gobernará con firmeza y a la vez con el cariño con que un pastor sigue a su propio rebaño; sobre todo actuará en nombre del «Señor su Dios». El «nombre» (YHWH) nos recuerda el relato de la revelación en el Sinaí a Moisés; así pues, el rey actuará con el espíritu de la alianza de Dios con su pueblo; de este modo el pueblo recobrará la paz (v. 4).</p>

  <p class="note">Esta profecía se ha conservado en Israel pero nunca se ha realizado en ninguno de los reyes que se sucedieron en el trono de Jerusalén. En el Nuevo Testamento, Mateo la ve realizada en Jesús, nacido en Belén (cf. Mt 2,6), verdadero pastor que se preocupa por su rebaño disperso y agotado.</p>

  <div class="reading"><span class="ref">Segunda lectura · Hebreos 10,5-10</span>
  <p>Hermanos: <sup>5</sup>Por eso, al entrar en este mundo, dice Cristo: <i>No has querido sacrificio ni ofrenda, pero me has formado un cuerpo; <sup>6</sup>no has aceptado holocaustos ni sacrificios expiatorios. <sup>7</sup>Entonces yo dije: Aquí estoy, oh Dios, para hacer tu voluntad. Así está escrito de mí en un capítulo del libro.</i></p>
  <p><sup>8</sup>En primer lugar dice: No has querido ni te agradan los sacrificios, ofrendas, holocaustos ni víctimas por el pecado, que se ofrecen según la ley. <sup>9</sup>Después añade: Aquí estoy para hacer tu voluntad. De este modo anula la primera disposición y establece la segunda.</p>
  <p><sup>10</sup>Por haber cumplido la voluntad de Dios, y gracias a la ofrenda que Jesucristo ha hecho de su cuerpo una vez para siempre, nosotros hemos quedado consagrados a Dios.</p></div>

  <p class="note">Se trata de uno de los pasajes más densos de la carta a los Hebreos en el que se presenta a Jesús como el que viene a cumplir en todo la voluntad de Dios, como el rey-Mesías que se somete completamente a la voluntad de Dios.</p>

  <p class="note">El autor de la carta nos propone una meditación sobre el misterio de la encarnación. Jesús viene, asume un cuerpo humano, para poder santificar la vida de los hombres: «y conforme a esa voluntad todos quedamos santificados» (v. 10).</p>

  <p class="note">Para santificarnos, Cristo no ofreció a Dios un sacrificio ritual, sino que ha querido que su cuerpo, su condición humana fuese el lugar donde se realizase plena y cabalmente la voluntad de Dios: «No quieres sacrificios ni ofrendas, pero me has formado un cuerpo…; entonces yo dije: Aquí estoy, ¡Oh Dios!, para hacer tu voluntad» (vv. 5-7). Es el sentido profundo de la encarnación: Cristo ha elegido para sí la condición humana para someterla totalmente al servicio de la voluntad de Dios. Su corazón ha estado enteramente orientado a Dios, su voluntad, su cuerpo, sus acciones perfectamente armonizadas en el cumplir la voluntad del Padre. En su obediencia también el hombre es capaz de obedecer.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,39-48a</span>
  <p><sup>39</sup>Por aquellos días, María se puso en camino y se fue de prisa a la montaña, a una ciudad de Judá. <sup>40</sup>Entró en casa de Zacarías y saludó a Isabel. <sup>41</sup>Y cuando Isabel oyó el saludo de María, el niño empezó a dar saltos en su seno. Entonces Isabel, llena del Espíritu Santo, <sup>42</sup>exclamó a grandes voces:</p>
  <p>—Bendita tú entre las mujeres y bendito el fruto de tu vientre. <sup>43</sup>Pero ¿cómo es posible que la madre de mi Señor venga a visitarme? <sup>44</sup>Porque en cuanto oí tu saludo, el niño empezó a dar saltos de alegría en mi seno. <sup>45</sup>¡Dichosa tú que has creído! Porque lo que te ha dicho el Señor se cumplirá.</p>
  <p><sup>46</sup>Entonces María dijo: <sup>47</sup><i>Mi alma glorifica al Señor, y mi espíritu se regocija en Dios mi Salvador, <sup>48</sup>porque ha mirado la humildad de su sierva.</i></p></div>

  <p class="note">Uno de los temas principales de la página de Lucas sobre la visitación es la alegría del encuentro entre las dos madres y la del Bautista al oír la voz de la «madre del Señor» que lleva en su seno al Hijo. En la alegría del Bautista se percibe una alusión a la alegría de David bailando por la llegada del arca de la alianza, signo de la presencia de Dios (cf. 2 Sm 6). El Bautista goza —incluso «da saltos» (v. 41)— porque María, como arca santa, lleva en su seno al Señor.</p>

  <p class="note">En el Bautista que goza por la presencia de María y Jesús está representado el Antiguo Testamento que espera y acoge la manifestación del Nuevo. Isabel, por su parte, es la mujer anciana y estéril que ve las maravillas de Dios, el cual acoge los sufrimientos y deseos de la humanidad. En esta escena está retratada la humanidad entera que espera a Cristo y saluda su llegada porque, encontrándolo, comprende que era él al que esperaba sin saberlo. El Hijo de Dios que se hace carne es la fuente de la alegría porque dice la verdad a la que todo humano está llamado: ser hijo como él.</p>

  <p class="note">En cuanto a María, ella recibe el saludo de Isabel que la proclama «bendita» (v. 42) y el elogio que la declara «dichosa» (v. 45) por haber creído en la promesa de Dios. Mientras da a la humanidad al Hijo de Dios, María nos enseña también a responder con fe a la oferta divina. Fe y humildad: «Ha mirado la humillación de su esclava» (v. 48). En María se ejecuta el programa de Dios (anunciado por Miqueas) que comienza por los últimos.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La bienaventuranza de la fe: el elogio dirigido por Isabel a María nos lleva a reflexionar, en este tiempo de espera, sobre nuestra fe. La fe de María se caracteriza como una adhesión a la promesa de Dios. María está totalmente segura de que Dios quiere y sabe ser fiel a la palabra dada. El misterio de Dios se oculta en aquel niño que, como todos los niños, se va formando en el seno de su madre. Creyendo, ha comenzado a constatar cómo Dios es fiel en realizar su promesa. También esto es cierto para nosotros: si no creemos, no experimentaremos nunca cómo el don de Dios, misteriosamente, puede ir formándose en nosotros.</p>

  <p>La fe de María se manifiesta también en el hecho de ir a visitar a Isabel: un viaje inspirado por la premura de su prima que necesita ayuda —como suele decirse comúnmente y con razón—, pero también un viaje para ir a contemplar lo que Dios está haciendo en los otros. También nuestra fe tiene mucho que aprender de esta actitud, ya que debemos tratar de darnos cuenta de lo que Dios hace en la historia de los demás. María e Isabel tienen esto en común, de lo que nos podemos aprovechar nosotros hoy: saben dialogar sobre lo que Dios hace en ellas. Ninguna de las dos habla de sí, sino de la otra, o de lo que Dios ha hecho, hasta el culmen del Magníficat.</p>

  <p>La fe de María nos exhorta a insertarnos en el clima propio de los «pobres del Señor», es decir, de las personas humildes y sencillas que confían en Dios sabiendo reconocer su obra. Se nos invita a vivir en una actitud general de disponibilidad al plan de Dios que nos invita a volver a las palabras del salmo (39,8) que el autor de la carta a los Hebreos pone en boca de Cristo: «Aquí estoy para hacer tu voluntad» (Heb 10,7).</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Has salido a mi encuentro, Señor Jesús, y me has concedido la gracia de conocerte. Llevado por la Iglesia, como por María tu madre, me has visitado y me has dado la fe. Gracias, Señor.</p>

  <p class="prayer">Concédeme que, como el Bautista, pueda alegrarme, porque sigues viniendo a mí, porque continúa la gracia de tu visitación e incesantemente se renueva la sorpresa del encuentro.</p>

  <p class="prayer">Renueva en mí el don de tu Espíritu, para que, como Isabel, esté dispuesto a acoger al que habla de ti y, sobre todo, ser constante en buscarte donde te dejas encontrar, en la Iglesia. Visitada por ti, Señor, también mi pequeña historia se convierte en una historia donde el Padre sigue hablando.</p>

  <p class="prayer">Como María, que te llevó en el seno y te engendró, te pido que te formes en mí; engendrado como hijo de Dios a tu imagen, hazme de veras cada vez más ese hombre nuevo que eres tú.</p>

  <p class="prayer">«Mi alma glorifica al Señor»: mientras vamos preparándonos a celebrar tu nacimiento, concédenos reconocernos todos en las palabras de María, contar lo que el Padre sigue haciendo hoy con los humildes que le temen.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Llevando en su seno al Señor, la Virgen corre a Isabel, y de repente el niño de ésta gozó reconociendo el saludo y con saltos de gozo aclamaba a la madre de Dios:</p>
  <p>Alégrate, germen de una cepa llena de vida.<br>Alégrate, tierra fecunda de un fruto inmortal.<br>Alégrate, tú que cultivas al cultivador amigo de los hombres.<br>Alégrate, tú que das vida al autor de la vida.<br>Alégrate, campo donde florece el gozo de todas las gracias.<br>Alégrate, mesa que ofreces abundancia de manjares.<br>Alégrate, porque haces florecer un pasto de felicidad.<br>Alégrate, porque preparas un puerto seguro a las almas.<br>Alégrate, incienso agradable de oración.<br>Alégrate, expiación de todo el universo.<br>Alégrate, benevolencia de Dios con los mortales.<br>Alégrate, seguridad de los mortales ante Dios.<br>Alégrate, virgen esposa.<br>(<i>Himno Akathistos</i>, estrofa quinta).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Dichosa tú que has creído, porque lo que te ha dicho el Señor se cumplirá»</b> (Lc 1,45).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Si la vida espiritual es una vida en la que esperamos, ¿cómo podemos esperar? Esperar es antes que nada esperar juntos.</p>
  <p>Uno de los pasajes más bellos de la Escritura es el de la visitación de María a Isabel. ¿Qué sucede cuando María recibe las palabras de la promesa? Se pone en camino a casa de Isabel. Algo le estaba pasando a Isabel, lo mismo que a María. ¿Cómo podrían vivirlo hasta el final? Se me antoja el encuentro de estas dos mujeres muy importante, porque Isabel y María se encontraron ayudando una la espera de la otra. La visita de María hizo más consciente a Isabel de lo que estaba esperando. El niño suscitó su alegría. María confirmó la espera de Isabel. Entonces Isabel dijo a María: «Dichosa tú que has creído, porque lo que te ha dicho el Señor se cumplirá». Y María responde: «Proclama mi alma la grandeza del Señor». Rebosa exultante de gozo. Estas dos mujeres se han creado recíprocamente el espacio para esperar. Se han confirmado mutuamente de que algo estaba pasando que merecía la pena esperar.</p>
  <p>Aquí tenemos un modelo de la comunidad cristiana. Es una comunidad de apoyo mutuo, de celebración y proclamación, de crecimiento de lo comenzado en nosotros. La visita de María a Isabel es una de las expresiones más hermosas de lo que significa formar comunidad, estar juntos, reunidos en torno a una promesa, proclamando lo que acontece en nosotros (H. J. M. Nouwen, <i>The Path of Waiting</i>, Nueva York 1995).</p>
  `}
 ]},

{ id:"17dic", title:"17 de diciembre", tag:"Cuarta semana · 17 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Génesis 49,1-2.8-10</span>
  <p><sup>1</sup>En aquellos días, Jacob llamó a sus hijos y les dijo: <sup>2</sup>Reuníos y escuchad, hijos de Jacob; escuchad a vuestro padre Israel:</p>
  <p><sup>8</sup><i>A ti, Judá, te alabarán tus hermanos, someterás a tus enemigos, los hijos de tu padre se inclinarán ante ti.<br>
  <sup>9</sup>Cachorro de león es Judá. De hacer presa vuelves, hijo mío. Se encorva, se echa como un león, como leona; ¿quién lo hará levantarse?<br>
  <sup>10</sup>No se apartará de Judá el cetro ni el bastón de mando de entre sus rodillas, hasta que venga aquel a quien pertenece, y a quien los pueblos obedecerán.</i></p></div>

  <p class="note">En el poema de Gn 49 se describe la despedida de Jacob moribundo rodeado de sus seres queridos. Las palabras que el patriarca dirige a sus doce hijos se consideran sagradas y proféticas, y hablan del futuro de sus hijos y sus descendientes. Los vv. 8-10 se dirigen a Judá en particular, padre de la tribu homónima, de la que nacería el Mesías. La profecía, que se remonta al tiempo de Isaías (siglos VIII-VII), es misteriosa, exalta la superioridad de Judá sobre sus hermanos por su fuerza real, similar a la de un león. Y por el «cetro» y el «bastón de mando» (v. 10a) que ejercitará sobre las tribus de Israel y sobre todos sus enemigos. El fragmento alude a la monarquía davídica, en la que reside el cetro del Ungido del Señor, que llevará la salvación ansiada cuando el verdadero rey anunciado, a quien pertenecen el poder y el reino, domine sobre todos los pueblos. Este rey ideal y definitivo aparecerá en la figura del Mesías, del que dice el libro del Apocalipsis: «Ha vencido el león de la tribu de Judá» (Ap 5,5). Él es el único poseedor del cetro de Dios, cuyo reino no es de dominio y poder, sino de servicio y amor para con todos los pueblos, que le rendirán filial obediencia.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 1,1-17</span>
  <p><sup>1</sup>Genealogía de Jesús, Mesías, Hijo de David, Hijo de Abrahán:</p>
  <p><sup>2</sup>Abrahán engendró a Isaac; Isaac engendró a Jacob; Jacob engendró a Judá y a sus hermanos. <sup>3</sup>Judá engendró, de Tamar, a Farés y a Zara; Farés engendró a Esrón; Esrón engendró a Arán; <sup>4</sup>Arán engendró a Aminadab; Aminadab engendró a Naasón; Naasón engendró a Salmón. <sup>5</sup>Salmón engendró, de Rajab, a Booz; Booz engendró, de Rut, a Obed; Obed engendró a Jesé; <sup>6</sup>Jesé engendró al rey David.</p>
  <p>David, de la mujer de Urías, engendró a Salomón. <sup>7</sup>Salomón engendró a Roboán; Roboán engendró a Abías; Abías engendró a Asá; <sup>8</sup>Asá engendró a Josafat; Josafat engendró a Jorán; Jorán engendró a Ozías; <sup>9</sup>Ozías engendró a Joatán; Joatán engendró a Acaz; Acaz engendró a Ezequías; <sup>10</sup>Ezequías engendró a Manasés; Manasés engendró a Amón; Amón engendró a Josías. <sup>11</sup>Josías engendró a Jeconías y a sus hermanos, cuando la cautividad de Babilonia.</p>
  <p><sup>12</sup>Después de la cautividad de Babilonia, Jeconías engendró a Salatiel; Salatiel engendró a Zorobabel; <sup>13</sup>Zorobabel engendró a Abiud; Abiud engendró a Eliaquín; Eliaquín engendró a Azor; <sup>14</sup>Azor engendró a Sadoc; Sadoc engendró a Ajín; Ajín engendró a Eliud; <sup>15</sup>Eliud engendró a Eleazar; Eleazar engendró a Matán; Matán engendró a Jacob. <sup>16</sup>Y Jacob engendró a José, el esposo de María, de la cual nació Jesús, llamado Cristo.</p>
  <p><sup>17</sup>Así pues, son catorce las generaciones desde Abrahán hasta David, catorce desde David hasta la cautividad de Babilonia, y catorce desde la cautividad de Babilonia hasta el Mesías.</p></div>

  <p class="note">Mateo comienza su evangelio con el «libro de las generaciones de Jesús» (literalmente), y narra los orígenes humanos del segundo Adán. Comienzan con Abrahán y concluyen con «José, el esposo de María, de la cual nació Jesús, llamado Cristo» (v. 16). El evangelista al presentarnos una síntesis de la historia de la salvación, cuya meta es la figura de Jesús-Mesías, divide la historia en tres grandes períodos: Abrahán, David, el destierro. A pesar de la monotonía del texto y el carácter artificial y rígido de los nombres que se suceden, el texto presenta un valor teológico relevante, ofreciéndonos la genealogía del que será protagonista del evangelio. Se afirma, confirmando las promesas proféticas (cf. Gn 12,3; 2 Sm 7,1-17), que Jesús desciende de Abrahán y de David y, por consiguiente, posee las bendiciones y la gloria de los antepasados.</p>

  <p class="note">Además, puesto que sus raíces se hunden en la historia humana y en el pueblo hebreo, goza de las condiciones necesarias para ser el Mesías esperado por las naciones, que anuncia e inaugura el reino de Dios. Este reino posee, sobre todo, la universalidad de la salvación en la persona de Cristo, que Mateo quiere resaltar con la presencia de cuatro mujeres, o extranjeras o pecadoras: Tamar, Rajab, Rut y Betsabé. El Mesías, de hecho, al venir a los hombres, no dudó en asumir la fragilidad humana, cubierta de oscuridad, para revestirla de su luz inmortal. La salvación se brinda no sólo a los justos, también a los pecadores.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>Hoy iniciamos los últimos días de preparación a la Navidad. La liturgia nos plantea una pregunta: ¿Cómo nos estamos preparando para acoger al que viene a nosotros? Jesús es el Mesías, el verdadero descendiente de Judá, heredero de las promesas que Dios había hecho a Abrahán, renovado a David y todos sus descendientes. En realidad la figura de Judá es el eslabón que une la primera lectura del Génesis y el evangelio de Mateo. Cristo, el segundo Adán, ha entrado en nuestra vida humana, marcada por el pecado, el dolor y la muerte, por la desobediencia de nuestros primeros padres, no para castigar a la humanidad, sino para transformarla y reconducirla a la amistad con Dios, tal como era su proyecto original. Toda la historia de Israel es el testimonio del anuncio de la venida de un redentor, esperado por los hombres como cumplimiento de la promesa: toda la ley está preñada de Cristo. En Jesús, Dios se ha hecho hombre, el sueño se hace realidad. El Dios con nosotros se ha hecho el Dios por nosotros, a pesar de nuestra infidelidad y el ser remisos a acogerle.</p>

  <p>Nosotros formamos parte de esta historia que nos vincula estrechamente con Abrahán y David, hilo de oro que con frecuencia hemos roto con nuestro pecado y que Dios reanuda en Jesús, acercándonos cada vez más a su corazón. Él, conocedor de la fragilidad del espíritu humano, sabe comprender y perdonar siempre nuestra debilidad, espera la conversión continua del corazón y el reconocimiento de aquel a quien pertenece toda realeza y a quien todos los pueblos deben acatamiento, fidelidad y amor.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Oh Señor, tú que eres el Dios de Abrahán, de Isaac y de Jacob, el Dios de Jesucristo y nuestro Dios, tú has prometido a Judá un reino sin ocaso y una realeza sobre todos los pueblos. Haz que reconozcamos sinceramente que toda la historia humana, a través del pueblo elegido, y luego por la Iglesia, heredera de las bendiciones de Israel, esté orientada a Cristo, el esperado de los pueblos, y haz que cada uno de nosotros sea instrumento apto para anunciarlo a los hermanos y hermanas que encontremos en la vida. Haz que los hombres, de cualquier raza y color, sepamos superar divisiones y diversidades para unirnos en una renovada esperanza en la venida del Salvador y con la confianza de que su mensaje de salvación y de vida es válido para todos sin distinción.</p>

  <p class="prayer">Que nuestros pecados, que tantas veces experimentamos, no nos alejen de ti, que eres la luz que ilumina nuestro camino; haznos más bien conscientes de nuestras limitaciones y abiertos a una sincera conversión de corazón.</p>

  <p class="prayer">Señor de la historia y de los pueblos, tú que comprendes nuestra miseria, llénanos de tu poder y haz que vivamos vigilantes para reconocer los signos de los tiempos y tu paso silencioso a través de las vicisitudes cotidianas de nuestra historia. Pero sobre todo haz que reconozcamos a tu Hijo Jesús, descendiente de una estirpe humana, el Mesías esperado, al que pertenecen el poder y la gloria y al que todos los pueblos obedecerán con amor.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>Hoy en el evangelio se lee: «Libro de la genealogía de Jesucristo». En estas genealogías, nace todavía en nosotros, según el espíritu, la Sabiduría. Si deseas, pues, que Cristo nazca en ti, ten en ti y llénate de las genealogías de la Sabiduría, esto es, de Cristo. Ten en ti a Abrahán, Isaac y los demás mencionados en la genealogía de Cristo. Abrahán fue perfecto en la fe, Isaac fue el hijo de la promesa, Jacob vio cara a cara al Señor.</p>
  <p>Tened por tanto en vosotros una fe perfecta y tendréis espiritualmente a Abrahán. Esperad en las promesas de los bienes futuros, despreciad los placeres de los bienes presentes, y tendréis a Isaac. Apresuraos cuanto podáis a la visión de Dios y tendréis a Jacob. Del mismo modo, si sois fervorosos de espíritu, tendréis a Abrahán, si permanecéis gozosos en la esperanza, tendréis a Isaac, si aguantáis pacientes en la tribulación, tendréis a Jacob (…). De este modo, si tenemos espiritualmente todos estos padres, de los que hoy habla el evangelio, entonces se cumplirá lo que dice la Escritura: «Seréis colmados de mis generaciones» (Elredo de Rieval, <i>Sermones inéditos</i>, XXII, 16-18, Roma 1952).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Oh Sabiduría, ven a enseñarnos el camino de la vida»</b> (de la liturgia).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Los largos y prodigiosos siglos que preceden al primer nacimiento no están vacíos de Cristo, sino penetrados por su potente influjo. Es la agitación de su concepción la que mueve las masas cósmicas y dirige las primeras corrientes biosféricas. La preparación de su nacimiento es la que acelera el progreso del instinto y hace que el pensamiento desemboque en la tierra. No nos escandalicemos ingenuamente de la interminable espera que nos ha impuesto el Mesías.</p>
  <p>Se requería nada menos que las espantosas y anónimas fatigas del hombre primitivo, la durable belleza egipcia, la espera inquieta de Israel, el perfume destilado del misticismo oriental, la sabiduría cien veces refinada de los griegos, para que del tronco de Jesé y de la humanidad germinase un retoño y pudiese abrirse la Flor. Todas estas preparaciones eran cósmicamente, biológicamente necesarias para que Cristo entrase en la escena humana. Y toda esta agitación se movía por el desvelo activo y creador de su alma en cuanto que esta alma era elegida para animar al Universo.</p>
  <p>Cuando Cristo aparece en brazos de María, en él se elevaba todo el mundo.</p>
  <p>No, yo no me escandalizo de estas esperas interminables y de estos largos preparativos. Todavía lo contemplo en el corazón de los hombres de hoy, que, de luz en luz, caminan lentamente hacia aquel que es la luz. Caminan hacia esta Palabra que ha sido pronunciada, pero todavía no escuchada, algo así como el esplendor de las estrellas que emplean tantos años para llegar a nuestros ojos (P. Teilhard de Chardin, <i>El medio divino</i>, Madrid 1998).</p>
  `}
 ]},

{ id:"18dic", title:"18 de diciembre", tag:"Cuarta semana · 18 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Jeremías 23,5-8</span>
  <p><sup>5</sup>He aquí que vienen días, oráculo del Señor, en que yo suscitaré a David un descendiente legítimo, que reinará con sabiduría, que practicará el derecho y la justicia en esta tierra. <sup>6</sup>En sus días se salvará Judá, e Israel vivirá en paz. Y le llamarán así: «El Señor nuestra justicia».</p>
  <p><sup>7</sup>Sí, vienen días, oráculo del Señor, en que no se dirá ya: «Vive el Señor que sacó a los israelitas de Egipto». <sup>8</sup>Sino que se dirá: «Vive el Señor, que sacó a la estirpe de Israel del país del norte de todos los lugares por donde los había dispersado, y los trajo a su tierra».</p></div>

  <p class="note">El libro de Jeremías es uno de los textos bíblicos más dramáticos, que comprende los momentos más trágicos de la historia de Israel. Sin embargo, el profeta en este fragmento nos presenta una profecía cargada de esperanza y recoge dos oráculos: el primero es el anuncio de un rey sabio, descendiente de David, que, como «descendiente legítimo», guiará a los suyos cual verdadero pastor (vv. 5-6); el segundo es la declaración del fin del exilio y de la dispersión del pueblo, que volverá a «habitar en su propia tierra» (vv. 7-8). La profecía nos pone ante una intervención de Dios que, manteniendo la promesa hecha a David (cf. 2 Sm 7,12-16), reagrupa al pueblo y lo guía un verdadero rey (cf. Is 11,1-9; Zac 3,8), construyendo un reino de paz y justicia; por esta razón llevará el nombre «El-Señor-nuestra-justicia» (v. 6). Las características de este sucesor de David se atribuyen al Mesías, que gobernará al pueblo con «el derecho» de su Palabra y «la justicia» de su amor misericordioso (v. 5).</p>

  <p class="note">En cuanto al anuncio de la liberación del destierro y el volver a la tierra, se describe como un nuevo éxodo, prefigurando la verdadera liberación mesiánico-escatológica, ejecutada por el Mesías, quien conducirá a todo desterrado para introducirle en la tierra de la paz sabática.</p>

  <div class="reading"><span class="ref">Evangelio · Mateo 1,18-24</span>
  <p><sup>18</sup>El nacimiento de Jesús, el Mesías, fue así: su madre María estaba prometida a José y, antes de vivir juntos, resultó que había concebido por la acción del Espíritu Santo.</p>
  <p><sup>19</sup>José, su esposo, que era justo y no quería denunciarla, decidió separarse de ella en secreto.</p>
  <p><sup>20</sup>Después de tomar esta decisión, el ángel del Señor se le apareció en sueños y le dijo: —José, hijo de David, no tengas reparo en recibir a María como esposa tuya, pues el hijo que espera viene del Espíritu Santo. <sup>21</sup>Dará a luz un hijo, y le pondrás por nombre Jesús, porque él salvará a su pueblo de los pecados.</p>
  <p><sup>22</sup>Todo esto sucedió para que se cumpliera lo que había anunciado el Señor por el profeta: <sup>23</sup><i>La virgen concebirá y dará a luz un hijo, a quien pondrán por nombre Emmanuel</i> (que significa: Dios con nosotros). <sup>24</sup>Cuando José despertó del sueño, hizo lo que el ángel del Señor le había mandado y se llevó a casa a su mujer.</p></div>

  <p class="note">El evangelista nos describe el anuncio del nacimiento de Jesús, por el ángel del Señor a José, hijo de David. María, prometida de José, se halla encinta por obra del Espíritu Santo. Mientras José piensa abandonarla en secreto, respetando con veneración silenciosa un hecho misterioso, el ángel le revela en sueños el plan de Dios: María dará a luz al Salvador esperado. José, que es «justo» (v. 19), acoge con fe y sencillez el designio de Dios, lleva consigo a María, reconoce legalmente al hijo, le transmite todos los derechos como descendiente davídico e imponiendo a Jesús el nombre que califica su misión, cumple la voluntad divina. Aunque no por línea de sangre, Jesús es descendiente de David, como demuestra Mateo citando el texto de Is 7,14: «La Virgen concebirá y dará a luz un hijo, y le pondrán por nombre Emmanuel» (v. 23).</p>

  <p class="note">Dios, para realizar su designio de amor y salvación se sirve de hombres que veneran su voluntad, con frecuencia misteriosa. José es uno de estos que, con fe y humilde obediencia, vive una vida escondida, pero colabora con Dios para llevar adelante la historia de salvación. En el hijo de María y José a punto de nacer Dios se manifiesta como el Emmanuel, es decir «Dios con nosotros».</p>
  `},

  {t:"MEDITATIO", h:`
  <p>La unión existente entre el texto de Jeremías y el evangelio de Mateo aparece en el «vástago legítimo» que florece del tronco de David y «reinará como rey prudente» (Jer 23,5). Este rey misterioso, que nace por obra del Espíritu, es el Mesías que «salvará a su pueblo de los pecados» (Mt 1,21). Pero Dios se sirve de José, hombre sencillo y de profunda fe, para sacar adelante su historia de salvación centrada en Jesús. José no obstaculiza el designio divino, entra en el misterio sin comprenderlo a fondo, se fía de su creador y colabora con docilidad y confianza.</p>

  <p>El hombre justo es el hombre de la Palabra de Dios, que no se defiende ni se queda en teorías, sino que lee los acontecimientos de su vida y los comprende, en la medida en que interioriza la Palabra y la vive en su día a día.</p>

  <p>Sin embargo, se da una condición previa para entrar en diálogo con Dios: estar dispuesto a obedecerle sin dilación, porque sólo el que se pone en actitud de escucha devota es «utilizado» por el Señor para llevar adelante sus planes en favor de los hombres, como lo fueron María y José, los verdaderos pobres, que tienen a Dios por rey. La realeza de Cristo sólo se revela a los que tienen un corazón de pobre como los anawim de Israel y de todos los tiempos. Como creyentes estamos llamados a la escuela de estos justos que, como José, creen plenamente en el amor de Dios y han experimentado su don.</p>
  `},

  {t:"ORATIO", h:`
  <p class="prayer">Señor Jesús, hijo de David, tú que has escogido el camino de la encarnación para salvarnos, apareciendo entre los hombres como todos nosotros, por medio de una madre, la virgen María, y has crecido bajo la mirada vigilante de José, hombre justo, ayuda a tu pueblo para que reconozca en tu venida el anuncio gozoso de la salvación y la vida nueva.</p>

  <p class="prayer">Tú que eres el «vástago justo», que florece en el corazón de todo hombre, haz que tu reino de justicia y paz, con la riqueza de sus valores humanos, se extienda como luz a todos los pueblos. Quisiste tener a tu lado la figura sencilla y trabajadora de José para hacernos comprender que, más allá de los vínculos de la sangre, aprecias cualquier paternidad, como reflejo de la verdadera paternidad de tu Padre que está en los cielos. También nos enseñas que el hombre humilde y rico de fe, disponible a la voluntad de Dios, siempre es agradable a tus ojos y por eso le haces colaborador de tu designio de amor.</p>

  <p class="prayer">Te pedimos que nosotros también estemos dispuestos, como José, a dar nuestro sincero y gozoso asentimiento a lo que nos pidas, aun a través de los caminos misteriosos de tu amor.</p>

  <p class="prayer">Pero sobre todo deseamos que seas siempre nuestro Emmanuel, el «Dios con nosotros», para saberte llevar en el corazón con el mismo amor que José, tu padre adoptivo, de modo que estemos disponibles a servirte en todos nuestros hermanos, especialmente en los pobres y necesitados, porque estás con ellos.</p>
  `},

  {t:"CONTEMPLATIO", h:`
  <p>No cabe concebir mayor alegría, comprendo yo, que nuestro Señor Jesucristo, Aquel que es el Altísimo, el Omnipotente, noble por excelencia y digno de todo honor, sea también el que más se humille y más se abaje; sea el más cariñoso y el más atento; y en realidad, esta alegría maravillosa nos será dada a todos sentirla cuando nos sea otorgado poder contemplarle.</p>
  <p>Y esto quiere nuestro Señor que andemos buscando llenos de confianza en Él, mediante su gracia y su ayuda, que esta búsqueda nos alegre y nos complazca, en cuanto nos sea dado, en tanto esperamos el tiempo en que veremos su realización. Porque la plenitud de la alegría que nos espera en el cielo consistirá, según pienso, en la admirable consideración y cariño de nuestro Padre celestial, nuestro Creador, en nuestro Señor Jesucristo, nuestro hermano y nuestro salvador (…).</p>
  <p>Nuestra vida se basa en la fe, junto con la esperanza y la caridad. La manifestación, hecha a aquel a quien Dios dispone, enseña completamente lo mismo, de modo manifiesto y asegurado, además de otros puntos especiales pertenecientes a la fe, cuyo conocimiento es digno de la mayor veneración (Juliana de Norwich, <i>Revelaciones del amor de Dios</i>, Barcelona 1959, 45-46).</p>
  `},

  {t:"ACTIO", h:`
  <p>Repite con frecuencia y vive hoy la Palabra: <b>«Señor, ven a librarnos con tu poder»</b> (de la liturgia).</p>
  `},

  {t:"PARA LA LECTURA ESPIRITUAL", h:`
  <p>Frente al misterio divino, José ha sabido mantener el tono justo. No se dejó llevar por sentimientos humanos. No puede comprender lo que percibe en María y no quiere penetrar el misterio. Más bien se retira aparte, con tímida y respetuosa veneración, abandonándose a la voluntad de Dios y dejando en sus manos todo lo demás.</p>
  <p>Pero en cuanto comprende cuál es la voluntad divina, no duda un instante ni opone dificultades, en seguida lleva a la práctica lo que el ángel le había mandado. Sólo él, totalmente dispuesto a obedecer al Señor, podrá escuchar su Palabra y colaborar en su obra, porque sólo sabe obedecer quien sabe escuchar. Y José obedece a la Palabra, la pone en práctica, declarándose con sus obras dócil instrumento en manos del Altísimo. José no quiere nada para sí, sólo pretende estar sencillamente a disposición de Dios.</p>
  <p>Toma consigo a María, su esposa, pero no para poseerla como esposa, sino para cumplir la voluntad de Dios, para que ella pueda dar a luz a su Hijo. Pero será él, José, también por obediencia, quien imponga el nombre al hijo. Ese nombre en torno al cual gira el universo y por cuya voluntad todo ha sido creado: Jesús, el Mesías.</p>
  <p>El Antiguo y el Nuevo Testamento, las palabras de los profetas y las de Dios, el nombre y su significado, lo divino y lo humano confluyen en aquel que une todo y a todos: Jesús, el Mesías Salvador (R. Grotzwiller, <i>Meditationen über Matthäus</i>, Einsiedeln 1957).</p>
  `}
 ]},

{ id:"19dic", title:"19 de diciembre", tag:"Cuarta semana · 19 de diciembre",
 sections:[
  {t:"LECTIO", h:`
  <div class="reading"><span class="ref">Primera lectura · Jueces 13,2-7.24-25a</span>
  <p><sup>2</sup>Había un hombre de Sorá, de la tribu de Dan, llamado Manoaj. Su mujer era estéril y no había tenido hijos.</p>
  <p><sup>3</sup>El ángel del Señor se apareció a la mujer y le dijo: —Tú eres estéril y no has tenido hijos, pero concebirás y darás a luz un hijo; <sup>4</sup>procura no beber vino ni bebidas alcohólicas, ni comas nada impuro, <sup>5</sup>porque vas a concebir y darás a luz un hijo. No pasará la navaja sobre su cabeza, porque el niño estará consagrado a Dios desde el vientre de su madre. Él comenzará a salvar a Israel de la mano de los filisteos.</p>
  <p><sup>6</sup>La mujer fue a su casa y dijo a su marido: —Ha venido a verme un hombre de Dios; su aspecto era terrible, como el de un ángel de Dios. No le he preguntado de dónde venía, ni él me ha dicho su nombre. <sup>7</sup>Pero me dijo: «Vas a concebir y darás a luz un hijo. No bebas vino ni bebidas alcohólicas, ni comas nada impuro, porque el niño estará consagrado a Dios desde el vientre de su madre hasta el día de su muerte».</p>
  <p><sup>24</sup>La mujer dio a luz un hijo y le puso el nombre de Sansón. El niño creció y el Señor lo bendecía. <sup>25a</sup>El espíritu del Señor comenzó a actuar en él.</p></div>

  <p class="note">El episodio del anuncio del nacimiento de Sansón se ajusta al género literario clásico de las anunciaciones bíblicas para celebrar el origen de los grandes personajes de la historia (cf. Gn 11,30; 18,10-11; 1 Sm 5,20). El modelo tiene las características esenciales siguientes, que siempre se repiten: la elección divina recae en personas humildes de corazón y «débiles» como en el caso de la esterilidad de la madre de Sansón y la edad avanzada del padre; el niño anunciado, como don de Dios, desempeñará una misión salvadora a favor del pueblo («Él comenzará a salvar a Israel de la mano de los filisteos» v. 5); las condiciones requeridas al elegido por parte de Dios son la plena colaboración con él en la gozosa sencillez y la total fidelidad a su proyecto amoroso: «No bebas vino ni bebidas alcohólicas, ni comas nada impuro» (vv. 4.7). Estos elementos presentes en la mujer de Sorá «que no había tenido hijos» (v. 2), de su marido Manoaj y del hijo Sansón, «nazir consagrado a Dios» (vv. 5.7), bendito del Señor y lleno del Espíritu, serán los mismos elementos que se realizarán plenamente en el acontecimiento salvífico del futuro redentor. Así, el texto de Jueces se convierte en profecía del nacimiento del Bautista y del nacimiento del Mesías.</p>

  <div class="reading"><span class="ref">Evangelio · Lucas 1,5-25</span>
  <p><sup>5</sup>En tiempos de Herodes, rey de Judea, hubo un sacerdote, llamado Zacarías, del turno de Abías, casado con una mujer de la descendencia de Aarón, llamada Isabel. <sup>6</sup>Ambos eran irreprochables ante Dios y seguían escrupulosamente todos los mandamientos y preceptos del Señor. <sup>7</sup>Pero no tenían hijos, porque Isabel era estéril, y los dos eran ya de edad avanzada.</p>
  <p><sup>8</sup>Estaba un día Zacarías ejerciendo el servicio sacerdotal tal como le correspondía por turno a su grupo. <sup>9</sup>Según el rito sacerdotal, le tocó en suerte entrar en el santuario del Señor a ofrecer el incienso. <sup>10</sup>Y todo el pueblo estaba orando fuera mientras se ofrecía el incienso.</p>
  <p><sup>11</sup>Y el ángel del Señor se le apareció, de pie, a la derecha del altar del incienso. <sup>12</sup>Al verlo, Zacarías se sobresaltó y se llenó de miedo. <sup>13</sup>Pero el ángel le dijo: —No temas, Zacarías, tu petición ha sido escuchada. Isabel, tu mujer, te dará un hijo al que pondrás por nombre Juan. <sup>14</sup>Te llenarás de gozo y alegría, y muchos se alegrarán de su nacimiento, <sup>15</sup>porque será grande ante el Señor. No beberá vino ni licor, quedará lleno del Espíritu Santo desde el seno de su madre <sup>16</sup>y convertirá a muchos hijos de Israel al Señor, su Dios. <sup>17</sup>Irá delante del Señor, con el espíritu y poder de Elías, para reconciliar a los padres con sus hijos, para inculcar a los rebeldes la sabiduría de los justos, y para preparar al Señor un pueblo bien dispuesto.</p>
  <p><sup>18</sup>Zacarías dijo al ángel: —¿Cómo sabré que va a suceder así? Porque yo soy viejo y mi mujer avanzada en años.</p>
  <p><sup>19</sup>El ángel le contestó: —Yo soy Gabriel, que estoy en la presencia de Dios, y he sido enviado para hablarte y darte esta buena noticia. <sup>20</sup>Pero tú te quedarás mudo y no podrás hablar hasta que se verifiquen estas cosas, por no haber creído en mis palabras, que se cumplirán a su tiempo.</p>
  <p><sup>21</sup>El pueblo, entre tanto, estaba esperando a Zacarías y se extrañaba de que tardase tanto en salir del santuario. <sup>22</sup>Cuando salió, no podía hablarles; y comprendieron que había quedado mudo. <sup>23</sup>Cumplidos los días de su ministerio, marchó a su casa. <sup>24</sup>Algún tiempo después, su mujer Isabel concibió, y no salió de casa durante cinco meses. Y decía: <sup>25</sup>—Al hacer esto conmigo, el Señor ha borrado mi vergüenza ante los hombres.</p></div>

  <p class="note">El anuncio del nacimiento de Juan Bautista que nos ofrece el evangelista Lucas es rico en detalles significativos a nivel teológico y aparecen múltiples contactos con escenas similares del Antiguo Testamento, donde se narra el nacimiento de personajes que ocupan un puesto importante en el designio del Señor: aparición del ángel del Señor, turbación y temor de la persona visitada; comunicación del mensaje celeste y signo de reconocimiento (cf. Jue 13,2-7.24-25; 1 Sm 1,4-23).</p>

  <p class="note">La presente narración de la visión de Zacarías, con el anuncio prodigioso del nacimiento del hijo, está construida en contraste simétrico con el anuncio del nacimiento de Jesús que el ángel Gabriel hará a María. Aquí tenemos la aparición en el marco grandioso del templo de Jerusalén, en el de Jesús en la sencilla casa de Nazaret; en nuestro texto aparece la incredulidad de Zacarías, allí la fe de María; aquí el nacimiento del Precursor de una mujer casada pero estéril, allí el nacimiento del Mesías de una Virgen; aquí el Bautista «se llenará de Espíritu Santo ya en el vientre de su madre» (v. 15) y «muchos se alegrarán de su nacimiento» (v. 14), allí Jesús será concebido por obra del Espíritu (cf. Lc 1,35) y no todos se alegrarán de su nacimiento (cf. Mt 2,13); aquí Zacarías como signo quedará mudo, allí María, por el contrario, escuchará el anuncio gozoso de la maternidad de la boca de su pariente Isabel. Al llegar la plenitud de los tiempos de la salvación sólo queda espacio para la fe sencilla y la acogida de la Palabra de Dios.</p>
  `},

  {t:"MEDITATIO", h:`
  <p>El anuncio del nacimiento de personajes excepcionales de la historia bíblica nos ayuda a reflexionar en la continua y extraordinaria acción que Dios realiza con los hombres, y en los múltiples dones que concede a cuantos acogen su Palabra con corazón humilde y confiado.</p>

  <p>En las narraciones de anunciaciones, Dios está presente en la vida de Sansón, como en la del Bautista, concediendo dones especiales en orden a una participación total del hombre en su proyecto de salvación, aunque exige una respuesta generosa y concreta. También nuestra humilde historia, desde el día del nacimiento, está marcada por la mano providente y paternal de Dios, que busca por todos los medios la comunión con nosotros.</p>

  <p>Con frecuencia nuestros acontecimientos cotidianos de salvación se esfuman y no sabemos adherirnos a la oferta divina por falta de escucha y de fe, lo mismo que no logramos leer su presencia en el misterio de la encarnación, que se manifiesta en situaciones con frecuencia humildes o con fallos.</p>

  <p>Lo que vale es percibir y adherirnos siempre a su invitación amorosa y venerar dócilmente su voluntad, aun cuando escape a nuestro control. Sólo la escucha silenciosa y la actitud de adoración de la Palabra de Dios es el camino para comprender el proyecto divino con nosotros. El silencio interior, tan necesario en nuestra vida, nos distancia de nosotros mismos para llevarnos al mundo del Espíritu, donde se da el verdadero discernimiento y la gozosa comunión de vida. Sólo entonces se conoce a Dios con la experiencia del corazón.</p>
  `},

  {t:"ORATIO", h:`
