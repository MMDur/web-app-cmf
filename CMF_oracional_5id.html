", "tags": [], "lines": [{"t": "p", "x": "Senyor i Déu nostre,"}, {"t": "p", "x": "que vau escollir Maria, la sempre Verge"}, {"t": "p", "x": "com a Mare del vostre Fill i Mare nostra;"}, {"t": "p", "x": "feu que, pel lliurament fidel al seu Cor maternal,"}, {"t": "p", "x": "ens configurem més plenament a Crist"}, {"t": "p", "x": "i cooperem amb el seu ofici maternal"}, {"t": "p", "x": "a la missió apostòlica."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "19", "num": "2.7", "title": "Lletanies de la Mare de Déu inspirades en les Constitucions", "theme": "corazon-maria", "sub": "de la Congregació", "tags": ["lletania"], "lines": [{"t": "p", "x": "Oh Maria, els Fills del vostre Cor Immaculat,"}, {"t": "p", "x": "per la vostra fe obedient i per la vostra caritat ardent"}, {"t": "p", "x": "us proclamem “Benaurada” i us invoquem:"}, {"t": "r", "x": "Mare de Déu i mare nostra."}, {"t": "r", "x": "Beneïda sou vós entre totes les dones."}, {"t": "r", "x": "Mare de Jesucrist, nostre Senyor, enviat pel Pare."}, {"t": "r", "x": "Mare del Verb, fet home per obra de l'Esperit."}, {"t": "r", "x": "Mare del Fill ungit per a evangelitzar els pobres."}, {"t": "r", "x": "Fundadora, Patrona i Titular de la nostra Congregació."}, {"t": "r", "x": "Primera deixebla de Crist."}, {"t": "r", "x": "Model nostre en el seguiment de Jesús."}, {"t": "r", "x": "Primera entre els pobres del Senyor."}, {"t": "r", "x": "Esclava consagrada totalment a la persona i a l'obra del vostre Fill."}, {"t": "r", "x": "Mare i Mestra de Missioners."}, {"t": "r", "x": "Formadora d'Apòstols."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Déu Pare nostre, us donem gràcies"}, {"t": "p", "x": "perquè ens diem i som Fills del Cor Immaculat de Maria,"}, {"t": "p", "x": "feu que venerem amb amor i confiança la nostra Mare"}, {"t": "p", "x": "i ens lliurem a Ella perquè ens configuri a Crist"}, {"t": "p", "x": "i cooperem amb el seu ofici maternal"}, {"t": "p", "x": "a la missió apostòlica que ens heu confiat."}, {"t": "p", "x": "Amén."}]}, {"id": "20", "num": "2.8", "title": "Oració filial i apostòlica al Cor de Maria", "theme": "corazon-maria", "sub": "de la Congregació", "tags": [], "lines": [{"t": "p", "x": "Oh Verge i Mare de Déu!,"}, {"t": "p", "x": "jo m’ofereixo per fill i servent vostre."}, {"t": "p", "x": "Em consagro al vostre amor maternal"}, {"t": "p", "x": "perquè formeu en mi Jesús,"}, {"t": "p", "x": "el Fill i l'Enviat del Pare,"}, {"t": "p", "x": "l’Ungit per l'Esperit Sant"}, {"t": "p", "x": "per anunciar la Bona Nova als pobres."}, {"t": "p", "x": "Em poso a les vostres mans"}, {"t": "p", "x": "per tal que Ell m’enviï a tots els homes,"}, {"t": "p", "x": "fills vostres i germans meus."}, {"t": "p", "x": "Feu que els reveli el Pare."}, {"t": "p", "x": "Ensenyeu-me a guardar, com vós, la Paraula en el cor,"}, {"t": "p", "x": "fins a transformar-me en Evangeli viu"}, {"t": "p", "x": "del vostre amor matern,"}, {"t": "p", "x": "perquè es formin nous fills per a l’Evangeli."}, {"t": "p", "x": "Demaneu la força de l'Esperit"}, {"t": "p", "x": "perquè sigui testimoni de Crist entre els homes."}, {"t": "p", "x": "Infoneu-me el vostre amor matern"}, {"t": "p", "x": "perquè els reveli el Pare"}, {"t": "p", "x": "i sentin l'alegria de ser fills de Déu"}, {"t": "p", "x": "en la comunió fraterna de l'Església."}, {"t": "p", "x": "Mare, aquí teniu el vostre fill. Formeu-me."}, {"t": "p", "x": "Mare, aquí teniu el vostre fill. Envieu-me."}, {"t": "p", "x": "Mare, aquí teniu el vostre fill. Parleu per mi. Estimeu per mi."}, {"t": "p", "x": "Guardeu-me, no sigui que anunciant a d’altres l'Evangeli,"}, {"t": "p", "x": "quedi jo exclòs del Regne."}, {"t": "p", "x": "En Vós, Mare meva,"}, {"t": "p", "x": "he posada tota la meva confiança."}, {"t": "p", "x": "Mai no quedaré confós. Amén."}]}, {"id": "21", "num": "2.9", "title": "Lletanies al Cor de Maria", "theme": "corazon-maria", "sub": "de la Congregació", "tags": ["lletania"], "lines": [{"t": "p", "x": "Senyor, tingueu pietat."}, {"t": "p", "x": "Crist, tingueu pietat."}, {"t": "p", "x": "Senyor, tingueu pietat."}, {"t": "p", "x": "Crist, oïu-nos."}, {"t": "p", "x": "Crist, escolteu-nos."}, {"t": "p", "x": "Déu, Pare celestial. Tingueu pietat de nosaltres."}, {"t": "p", "x": "Déu, Fill redemptor del món."}, {"t": "p", "x": "Déu, Esperit Sant."}, {"t": "p", "x": "Trinitat Santa, un sol Déu."}, {"t": "p", "x": "Cor de Maria, modelat pel Pare. Pregueu per nosaltres."}, {"t": "p", "x": "Cor de Maria, el més semblant al Cor de Jesús."}, {"t": "p", "x": "Cor de Maria, ornat amb tots els dons de l'Esperit Sant."}, {"t": "p", "x": "Cor de Maria, que estimeu el Pare amb amor de filla."}, {"t": "p", "x": "Cor de Maria, que estimeu el Fill amb amor de mare."}, {"t": "p", "x": "Cor de Maria, que estimeu l'Esperit Sant amb amor d'esposa."}, {"t": "p", "x": "Cor de Maria, que conserveu fidelment les paraules i accions de Jesús."}, {"t": "p", "x": "Cor de Maria, traspassat amb l'espasa de dolor."}, {"t": "p", "x": "Cor de Maria, clavat en la creu amb Crist crucificat."}, {"t": "p", "x": "Cor de Maria, vivificat per l'alegria de la resurrecció de Jesús."}, {"t": "p", "x": "Cor de Maria, curull de nova plenitud de gràcia en la vinguda de l'Esperit Sant."}, {"t": "p", "x": "Cor de Maria, morada de Déu, plena de la seva glòria."}, {"t": "p", "x": "Cor de Maria, arca de l'aliança de Déu amb els homes."}, {"t": "p", "x": "Cor de Maria, habitacle de Déu i dels homes."}, {"t": "p", "x": "Cor de Maria, que heu portat la salvació del món."}, {"t": "p", "x": "Cor de Maria, sempre Immaculat."}, {"t": "p", "x": "Cor de Maria, ple de gràcia."}, {"t": "p", "x": "Cor de Maria, beneït entre tots els cors."}, {"t": "p", "x": "Cor de Maria, abisme d'humilitat."}, {"t": "p", "x": "Cor de Maria, tron de misericòrdia."}, {"t": "p", "x": "Cor de Maria, forja d'amor diví."}, {"t": "p", "x": "Cor de Maria, que obteniu la gràcia als pecadors."}, {"t": "p", "x": "Cor de Maria, roca invencible de fe."}, {"t": "p", "x": "Cor de Maria, font d'amistat perfecta."}, {"t": "p", "x": "Cor de Maria, suport de l'Església en el seu caminar vers el Pare."}, {"t": "p", "x": "Cor de Maria, forja d'amor que ens configura amb Jesús."}, {"t": "p", "x": "Cor de Maria, Mare i formadora nostra."}, {"t": "p", "x": "Cor de Maria, consol d'afligits."}, {"t": "p", "x": "Cor de Maria, refugi de pecadors."}, {"t": "p", "x": "Cor de Maria, auxili dels agonitzants."}, {"t": "p", "x": "Cor de Maria, esperança del món."}, {"t": "p", "x": "Cor de Maria, senyora dels nostres cors."}, {"t": "p", "x": "Cor de Maria, reina de la pau."}, {"t": "p", "x": "Anyell de Déu que lleveu el pecat del món."}, {"t": "r", "x": "Perdoneu-nos, Senyor."}, {"t": "p", "x": "Anyell de Déu que lleveu el pecat del món."}, {"t": "r", "x": "Escolteu-nos, Senyor."}, {"t": "p", "x": "Anyell de Déu que lleveu el pecat del món."}, {"t": "r", "x": "Tingueu pietat de nosaltres."}, {"t": "p", "x": "Pregueu per nosaltres, Santa Mare de Déu."}, {"t": "r", "x": "perquè siguem dignes d'obtenir les promeses de Jesucrist"}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Senyor, Déu nostre,"}, {"t": "p", "x": "que vau fer del Cor Immaculat de Maria"}, {"t": "p", "x": "una mansió per al vostre Fill i un santuari de l'Esperit Sant,"}, {"t": "p", "x": "doneu-nos un cor net i dòcil,"}, {"t": "p", "x": "perquè, complint sempre la vostra voluntat,"}, {"t": "p", "x": "us estimem sobre totes les coses"}, {"t": "p", "x": "i ajudem els germans en les seves necessitats."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "22", "num": "2.10", "title": "Acció de gràcies pel Cor de Maria", "theme": "corazon-maria", "sub": "de la Congregació", "tags": [], "lines": [{"t": "p", "x": "Us donem gràcies, Pare sant,"}, {"t": "p", "x": "perquè donàreu a la Mare de Déu un cor savi i dòcil,"}, {"t": "p", "x": "disposat sempre a agradar-vos,"}, {"t": "p", "x": "un cor nou i humil,"}, {"t": "p", "x": "per a gravar-hi la llei de la nova Aliança;"}, {"t": "p", "x": "un cor senzill i net,"}, {"t": "p", "x": "que la va fer digna de concebre virginalment el vostre Fill"}, {"t": "p", "x": "i capaç de contemplar-vos eternament;"}, {"t": "p", "x": "un cor ferm i amatent"}, {"t": "p", "x": "per a suportar amb fortalesa l'espasa de dolor,"}, {"t": "p", "x": "i esperar, plena de fe, la resurrecció del seu Fill."}, {"t": "p", "x": "Doneu-nos un cor savi i dòcil, nou i humil,"}, {"t": "p", "x": "senzill i net, ferm i amatent,"}, {"t": "p", "x": "perquè l’imitem i cooperem amb més fidelitat a la vostra obra de salvació."}, {"t": "p", "x": "Amén."}]}, {"id": "23", "num": "2.11", "title": "Lliurament al Cor de Maria", "theme": "corazon-maria", "sub": "de la Congregació", "tags": [], "lines": [{"t": "p", "x": "Mare del Senyor, Cor de Maria!"}, {"t": "p", "x": "Vós que presidíreu com a Fundadora"}, {"t": "p", "x": "l'origen de la nostra Congregació,"}, {"t": "p", "x": "sigueu sempre la nostra inspiradora i"}, {"t": "p", "x": "el cor de la nostra Congregació,"}, {"t": "p", "x": "necessitada de contemplació i de noves il·lusions,"}, {"t": "p", "x": "en aquest món, tan estimat pel Pare"}, {"t": "p", "x": "i tan afectat per la increença i la injustícia;"}, {"t": "p", "x": "parleu per nosaltres"}, {"t": "p", "x": "i testifiqueu a través de la nostra vida"}, {"t": "p", "x": "el missatge del Regne."}, {"t": "p", "x": "Mare del Senyor,"}, {"t": "p", "x": "pregueu perquè vingui a nosaltres"}, {"t": "p", "x": "l'Esperit, que és impuls vers el món nou."}, {"t": "p", "x": "Mare, amb el vostre Cor"}, {"t": "p", "x": "pregueu per nosaltres!"}, {"t": "p", "x": "intercediu per nosaltres!"}]}, {"id": "24", "num": "2.12", "title": "Oferiment al Cor de Maria", "theme": "corazon-maria", "sub": "de la Congregació", "tags": [], "lines": [{"t": "p", "x": "Verge Maria, Mare de Déu i Mare nostra:"}, {"t": "p", "x": "em confio al vostre amor maternal"}, {"t": "p", "x": "perquè feu de mi un missioner"}, {"t": "p", "x": "a imatge i semblança del vostre Fill, l'Enviat del Pare,"}, {"t": "p", "x": "per a anunciar la Bona Nova als pobres."}, {"t": "p", "x": "Ensenyeu-me a creure, estimar i servir com Vós."}, {"t": "p", "x": "Feu-me generós i agraït"}, {"t": "p", "x": "per a viure amb alegria"}, {"t": "p", "x": "el do de la meva vocació missionera."}, {"t": "p", "x": "Amén."}]}, {"id": "25", "num": "2.13", "title": "Cor de Maria", "theme": "corazon-maria", "sub": "de la Congregació", "tags": [], "lines": [{"t": "p", "x": "Senyor, Déu nostre,"}, {"t": "p", "x": "que elegíreu Maria, sempre Verge"}, {"t": "p", "x": "com a Mare del vostre Fill i Mare nostra:"}, {"t": "p", "x": "feu que, per la consagració fidel al seu Cor maternal,"}, {"t": "p", "x": "ens configurem més plenament a Crist"}, {"t": "p", "x": "i, urgits per la seva caritat,"}, {"t": "p", "x": "ens dediquem amb més generositat"}, {"t": "p", "x": "a proclamar l'Evangeli a tots els homes."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "26", "num": "2.14", "title": "Mare i Mestra", "theme": "corazon-maria", "sub": "de la Congregació", "tags": [], "lines": [{"t": "p", "x": "Maria, Mare i Mestra de Missioners, intercediu davant el Pare"}, {"t": "p", "x": "perquè els fills del vostre Cor"}, {"t": "p", "x": "reproduïm els trets de Jesús"}, {"t": "p", "x": "i siguem homes universals,"}, {"t": "p", "x": "d'ulls penetrants i oïdes atentes"}, {"t": "p", "x": "a les urgències del món."}, {"t": "p", "x": "Que com Vós,"}, {"t": "p", "x": "siguem homes de misericòrdia,"}, {"t": "p", "x": "tendresa i compassió."}, {"t": "p", "x": "Que ens obrim sempre a nous horitzons missioners,"}, {"t": "p", "x": "disposats a acceptar la diversitat."}, {"t": "p", "x": "I la caritat apostòlica que brolla"}, {"t": "p", "x": "de la forja del vostre Cor"}, {"t": "p", "x": "ens impulsi en tota circumstància"}, {"t": "p", "x": "on l'Esperit ens posi."}, {"t": "p", "x": "Amén."}]}, {"id": "27", "num": "2.15", "title": "Invocació a Maria Mare de l'Església", "theme": "corazon-maria", "sub": "de la Congregació", "tags": [], "lines": [{"t": "p", "x": "Mare de Déu, Mare de l'Església,"}, {"t": "p", "x": "us confiem tota l'Església."}, {"t": "p", "x": "Recordeu-vos de tots els vostres fills;"}, {"t": "p", "x": "doneu ardor a les seves oracions davant Déu;"}, {"t": "p", "x": "conserveu sòlida llur fe;"}, {"t": "p", "x": "fortifiqueu llur esperança"}, {"t": "p", "x": "i augmenteu llur caritat."}, {"t": "p", "x": "Encomanem al vostre Cor Immaculat"}, {"t": "p", "x": "tot el gènere humà:"}, {"t": "p", "x": "conduïu-lo al coneixement"}, {"t": "p", "x": "de l'únic i veritable salvador, Crist Jesús;"}, {"t": "p", "x": "allunyeu d'ell el càstig del pecat;"}, {"t": "p", "x": "concediu a tot el món la pau en la veritat,"}, {"t": "p", "x": "en la justícia, en la llibertat i en l'amor."}, {"t": "p", "x": "I feu que tota l'Església"}, {"t": "p", "x": "pugui enlairar al Déu de les misericòrdies"}, {"t": "p", "x": "un himne de lloança, d'agraïment i d'alegria,"}, {"t": "p", "x": "ja que el Senyor ha obrat coses grans per mitjà vostre,"}, {"t": "p", "x": "oh clement, piadosa i dolça Verge Maria."}, {"t": "p", "x": "Amén."}]}, {"id": "29", "num": "3.1", "title": "Fundador i model", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor, Déu nostre,"}, {"t": "p", "x": "que vau escollir Sant Antoni Maria Claret"}, {"t": "p", "x": "perquè fundés la nostra Família,"}, {"t": "p", "x": "i el vau inflamar d’un amor tan ardent,"}, {"t": "p", "x": "que el feia viure content i joiós enmig de les privacions, calúmnies i turments;"}, {"t": "p", "x": "concediu-nos, benigne, que,"}, {"t": "p", "x": "adherint-nos fidelment als seus ensenyaments,"}, {"t": "p", "x": "proclamem la vostra glòria en tot el món"}, {"t": "p", "x": "i busquem sempre amb sol·licitud"}, {"t": "p", "x": "la salvació de tots els homes."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "30", "num": "3.2", "title": "Fidels al seu esperit", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Déu Pare nostre,"}, {"t": "p", "x": "que concedíreu a Sant Antoni Maria Claret"}, {"t": "p", "x": "un ardent i filial amor al Santíssim Sagrament"}, {"t": "p", "x": "i al Cor Immaculat de Maria,"}, {"t": "p", "x": "perquè realitzés en l'Església de Déu"}, {"t": "p", "x": "grans meravelles per a la glòria divina"}, {"t": "p", "x": "i la salvació de les ànimes:"}, {"t": "p", "x": "concediu-nos que,"}, {"t": "p", "x": "encesos a imitació seva"}, {"t": "p", "x": "en els mateixos sants amors,"}, {"t": "p", "x": "i continuant amb la més gran eficàcia"}, {"t": "p", "x": "la seva obra evangelitzadora,"}, {"t": "p", "x": "mereixem de viure i morir a la Congregació"}, {"t": "p", "x": "com a dignes Fills del Cor Immaculat de Maria."}, {"t": "p", "x": "Amén."}]}, {"id": "31", "num": "3.3", "title": "Per continuar la seva obra", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor,"}, {"t": "p", "x": "que vau fer de Sant Antoni Maria Claret, el nostre Pare,"}, {"t": "p", "x": "un fervent apòstol de la glòria de Déu i de la salvació dels homes,"}, {"t": "p", "x": "concediu-nos la caritat ardent que abrusava el seu cor,"}, {"t": "p", "x": "perquè continuem amb intensitat i eficàcia"}, {"t": "p", "x": "la seva obra apostòlica."}, {"t": "p", "x": "Feu que es multipliquin els seus fills"}, {"t": "p", "x": "per estendre el Regne de Jesucrist,"}, {"t": "p", "x": "i que a l’hora de la nostra mort"}, {"t": "p", "x": "mereixem ser reconeguts com a \"servents fidels\" de Crist i de l'Evangeli."}, {"t": "p", "x": "Amén."}]}, {"id": "157", "num": "4.1", "title": "Lletanies de Sant Josep", "theme": "san-jose", "sub": null, "tags": ["lletania"], "lines": [{"t": "p", "x": "Senyor, tingueu pietat."}, {"t": "p", "x": "Senyor, tingueu pietat."}, {"t": "p", "x": "Crist, tingueu pietat."}, {"t": "p", "x": "Crist, tingueu pietat."}, {"t": "p", "x": "Senyor, tingueu pietat."}, {"t": "p", "x": "Senyor, tingueu pietat."}, {"t": "p", "x": "Crist, oïu-nos."}, {"t": "p", "x": "Crist, oïu-nos."}, {"t": "p", "x": "Crist, escolteu-nos."}, {"t": "p", "x": "Crist, escolteu-nos."}, {"t": "p", "x": "Déu, Pare celestial."}, {"t": "p", "x": "Tingueu pietat de nosaltres."}, {"t": "p", "x": "Déu, Fill, Redemptor del món."}, {"t": "p", "x": "Déu, Esperit Sant."}, {"t": "p", "x": "Trinitat Santa, un sol Déu."}, {"t": "p", "x": "Santa Maria."}, {"t": "p", "x": "Pregueu per nosaltres."}, {"t": "p", "x": "Sant Josep."}, {"t": "p", "x": "Descendent il·lustre de David."}, {"t": "p", "x": "Llum dels Patriarques."}, {"t": "p", "x": "Espòs de la Mare de Déu."}, {"t": "p", "x": "Cast custodi de la Verge."}, {"t": "p", "x": "Educador del Fill de Déu."}, {"t": "p", "x": "Diligent defensor de Crist."}, {"t": "p", "x": "Cap de la Santa Família."}, {"t": "p", "x": "Josep justíssim."}, {"t": "p", "x": "Josep castíssim."}, {"t": "p", "x": "Josep prudentíssim."}, {"t": "p", "x": "Josep fortíssim."}, {"t": "p", "x": "Josep obedientíssim."}, {"t": "p", "x": "Josep fidelíssim."}, {"t": "p", "x": "Mirall de paciència."}, {"t": "p", "x": "Aimant de la pobresa."}, {"t": "p", "x": "Treballador exemplar."}, {"t": "p", "x": "Honor de la vida familiar."}, {"t": "p", "x": "Custodi de les verges."}, {"t": "p", "x": "Sosteniment de les famílies."}, {"t": "p", "x": "Consol dels afligits."}, {"t": "p", "x": "Esperança dels malalts."}, {"t": "p", "x": "Patró dels moribunds."}, {"t": "p", "x": "Protector de la Santa Església."}, {"t": "p", "x": "Anyell de Déu que lleveu el pecat del món"}, {"t": "r", "x": "perdoneu-nos, Senyor."}, {"t": "p", "x": "Anyell de Déu que lleveu el pecat del món"}, {"t": "r", "x": "escolteu-nos, Senyor."}, {"t": "p", "x": "Anyell de Déu que lleveu el pecat del món"}, {"t": "r", "x": "tingueu pietat de nosaltres."}, {"t": "v", "x": "El va constituir senyor de casa seva."}, {"t": "r", "x": "I cap de totes les seves possessions."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Oh Déu, que en la vostra inefable providència, us dignàreu escollir Sant Josep com a espòs de la Mare del vostre Fill, concediu-nos, us demanem, que el qui venerem a la terra com a protector, el mereixem tenir com a intercessor en el cel. Vós, que viviu i regneu pels segles dels segles."}, {"t": "p", "x": "Amén."}]}, {"id": "158", "num": "4.2", "title": "Benaurat Josep", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Benaurat Josep,"}, {"t": "p", "x": "per l'amor que us va mantenir unit a la Verge Mare de Déu"}, {"t": "p", "x": "i pel paternal amor amb què cuidàreu el Nen Jesús,"}, {"t": "p", "x": "humilment us demanem que mireu benignament la família del vostre Fill,"}, {"t": "p", "x": "adquirida per la seva sang, i amb el vostre auxili socorreu les nostres necessitats."}, {"t": "p", "x": "Aparteu de nosaltres tot error i tot pecat;"}, {"t": "p", "x": "assistiu-nos en la nostra lluita contra el poder del mal,"}, {"t": "p", "x": "i defenseu l'Església santa de Déu de tota adversitat;"}, {"t": "p", "x": "protegiu cadascun de nosaltres,"}, {"t": "p", "x": "perquè, a exemple vostre i sostinguts pel vostre auxili,"}, {"t": "p", "x": "puguem viure santament,"}, {"t": "p", "x": "morir piadosament i arribar a l'eterna benaurança."}, {"t": "p", "x": "Amén."}]}, {"id": "159", "num": "4.3", "title": "Oració a Sant Josep de Lleó XIII", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "A vós, benaurat Josep,"}, {"t": "p", "x": "acudim en la nostra necessitat"}, {"t": "p", "x": "i invoquem el vostre patrocini juntament amb el de la Verge Maria, la vostra esposa."}, {"t": "p", "x": "Pel sant amor que us va unir a Maria, Mare de Déu,"}, {"t": "p", "x": "i per la custòdia paterna del Nen Jesús,"}, {"t": "p", "x": "mireu benignament el poble que Crist va adquirir amb la seva sang;"}, {"t": "p", "x": "amb la vostra ajuda socorreu-nos en les nostres necessitats."}, {"t": "p", "x": "Custodi de la Sagrada Família,"}, {"t": "p", "x": "protegiu l'Església dels mals que afligeixen el món,"}, {"t": "p", "x": "i assistiu-nos propici en la lluita contra el poder del mal."}, {"t": "p", "x": "Ajudeu-nos a viure santament,"}, {"t": "p", "x": "a morir en pau amb Déu"}, {"t": "p", "x": "i a arribar a l'eterna benaurança del cel."}, {"t": "p", "x": "Amén."}]}, {"id": "160", "num": "4.4", "title": "Oració a Sant Josep de Joan XXIII", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Oh San Josep, custodi de Jesús,"}, {"t": "p", "x": "espòs puríssim de Maria,"}, {"t": "p", "x": "que heu viscut en el compliment perfecte del vostre deure,"}, {"t": "p", "x": "mantenint amb el treball de les vostres mans"}, {"t": "p", "x": "la sagrada Família de Natzaret,"}, {"t": "p", "x": "protegiu propici els qui a vós acudim."}, {"t": "p", "x": "Vós coneixeu les nostres aspiracions, les nostres angoixes i esperances:"}, {"t": "p", "x": "a vós venim,"}, {"t": "p", "x": "perquè sabem que trobarem en vós un protector."}, {"t": "p", "x": "També vós heu experimentat la prova i el defalliment:"}, {"t": "p", "x": "però el vostre esperit, ple de la més profunda pau,"}, {"t": "p", "x": "va exultar de goig per la intimitat amb el Fill de Déu que us va ser confiat"}, {"t": "p", "x": "i amb Maria, la seva Mare."}, {"t": "p", "x": "Ajudeu-nos a comprendre"}, {"t": "p", "x": "que no estem sols en el nostre treball,"}, {"t": "p", "x": "a saber descobrir Jesús al nostre costat,"}, {"t": "p", "x": "a acollir-lo amb la gràcia i a custodiar-lo fidelment com ho vau fer vós."}, {"t": "p", "x": "I feu que, a la nostra Congregació,"}, {"t": "p", "x": "tot sigui santificat en la caritat,"}, {"t": "p", "x": "en la paciència, en la justícia i en la recerca del bé."}, {"t": "p", "x": "Amén."}]}, {"id": "161", "num": "4.5", "title": "Oració a Sant Josep", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Salve, Josep, espòs virginal de Maria"}, {"t": "p", "x": "i pare davídic del Messies."}, {"t": "p", "x": "Sou beneït entre tots els homes"}, {"t": "p", "x": "i beneït és Jesús, el Fill de Déu que us va ser confiat."}, {"t": "p", "x": "Sant Josep,"}, {"t": "p", "x": "patró de l'Església universal i de la nostra Congregació,"}, {"t": "p", "x": "guardeu les nostres comunitats i les nostres famílies"}, {"t": "p", "x": "en la pau i en la gràcia divina"}, {"t": "p", "x": "i socorreu-nos a l'hora de la nostra mort."}, {"t": "p", "x": "Amén."}]}, {"id": "162", "num": "4.6", "title": "Oració a Sant Josep (pel ministeri)", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Pare sant, que elegíreu Sant Josep"}, {"t": "p", "x": "per a un ofici singular"}, {"t": "p", "x": "i li concedíreu les gràcies necessàries"}, {"t": "p", "x": "per a complir-lo fidelment a la casa de Natzaret;"}, {"t": "p", "x": "concediu-nos també a nosaltres"}, {"t": "p", "x": "les gràcies necessàries"}, {"t": "p", "x": "per a ser fidels en el compliment"}, {"t": "p", "x": "del nostre ministeri,"}, {"t": "p", "x": "segons el carisma i l'esperit de la Congregació."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "165", "num": "5.1", "title": "Oració als Màrtirs de Barbastre", "theme": "martires", "sub": null, "tags": ["13 agost"], "lines": [{"t": "p", "x": "Senyor, Pare sant,"}, {"t": "p", "x": "Vós que concedíreu a Felip de Jesús Munàrriz i als seus companys,"}, {"t": "p", "x": "fidelitat plena a la vocació missionera"}, {"t": "p", "x": "seguint Crist fins al martiri,"}, {"t": "p", "x": "i els féreu testimonis de caritat perfecta"}, {"t": "p", "x": "en el perdó dels seus perseguidors:"}, {"t": "p", "x": "concediu-nos, per la seva intercessió,"}, {"t": "p", "x": "fermesa perseverant en la fe,"}, {"t": "p", "x": "i una caritat sincera"}, {"t": "p", "x": "per a estimar en Crist tots els germans."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "166", "num": "5.2", "title": "Màrtirs de Barbastre", "theme": "martires", "sub": null, "tags": ["13 agost"], "lines": [{"t": "p", "x": "Déu, Pare nostre,"}, {"t": "p", "x": "que ens heu donat en els Màrtirs Claretians de Barbastre"}, {"t": "p", "x": "un model de fidelitat a la Causa de Jesús,"}, {"t": "p", "x": "d'amor al Cor de Maria i a l'Església,"}, {"t": "p", "x": "de lleialtat als germans i de perdó als enemics,"}, {"t": "p", "x": "concediu-nos d’imitar el seu exemple"}, {"t": "p", "x": "en la vivència fidel i joiosa de la nostra consagració"}, {"t": "p", "x": "i en l'anunci de l'Evangeli"}, {"t": "p", "x": "per a glòria de Déu i salvació de tots els homes."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "169", "num": "5.3", "title": "Oració (I)", "theme": "martires", "sub": "Beatificacions", "tags": [], "lines": [{"t": "p", "x": "Senyor, Pare nostre,"}, {"t": "p", "x": "que heu escollit amb predilecció"}, {"t": "p", "x": "tots els Fills del Cor de la Verge Maria"}, {"t": "p", "x": "i heu fet que alguns d'ells fossin exemples eximis en la virtut;"}, {"t": "p", "x": "fecundeu l'Església amb la seva glorificació"}, {"t": "p", "x": "i feu que siguin per a nosaltres models a imitar"}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "170", "num": "5.4", "title": "Oració (II)", "theme": "martires", "sub": "Beatificacions", "tags": [], "lines": [{"t": "p", "x": "Senyor, que voleu que siguin sants"}, {"t": "p", "x": "els qui heu cridat a la nostra Congregació,"}, {"t": "p", "x": "concediu als nostres germans missioners"}, {"t": "p", "x": "que han seguit més de prop les petjades del Sant Fundador"}, {"t": "p", "x": "i han lliurat la seva vida al servei de l'Evangeli,"}, {"t": "p", "x": "que siguin glorificats a la terra i comptats entre els sants del cel."}, {"t": "p", "x": "Per Crist Senyor nostre."}]}, {"id": "171", "num": "5.5", "title": "Oració (III)", "theme": "martires", "sub": "Beatificacions", "tags": [], "lines": [{"t": "p", "x": "Oh Déu, que exalceu els humils i rebutgeu els superbs,"}, {"t": "p", "x": "Digneu-vos glorificar el vostre servent N. i feu resplendir el seu nom entre el dels vostres sants"}, {"t": "p", "x": "Multipliqueu les vostres gràcies a favor dels qui us supliquen"}, {"t": "p", "x": "per la seva intercessió;"}, {"t": "p", "x": "i concediu que l'Església honori un dia la seva memòria,"}, {"t": "p", "x": "el proposi com a model a imitar i"}, {"t": "p", "x": "com a protector que ens ajudi a superar les dificultats de la nostra vida missionera"}, {"t": "p", "x": "i a arribar a la vida eterna."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "172", "num": "5.6", "title": "Oració per demanar la beatificació", "theme": "martires", "sub": "Beatificacions", "tags": [], "lines": [{"t": "p", "x": "Senyor, Déu nostre,"}, {"t": "p", "x": "que heu elegit alguns germans nostres,"}, {"t": "p", "x": "Fills del Cor Immaculat de Maria,"}, {"t": "p", "x": "i els heu fet resplendir"}, {"t": "p", "x": "amb l'exemple d'una santedat exímia en la vida missionera,"}, {"t": "p", "x": "digneu-vos enriquir i fecundar la santa Església amb la seva glorificació,"}, {"t": "p", "x": "i feu que cadascun de nosaltres, seguint el seu testimoniatge evangèlic,"}, {"t": "p", "x": "ens afanyem amb ardor a buscar en totes les coses"}, {"t": "p", "x": "la vostra glòria i la salvació dels nostres germans."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "32", "num": "6.1", "title": "Magníficat de la vocació", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor Déu nostre, beneït sigueu"}, {"t": "p", "x": "per haver-vos dignat escollir"}, {"t": "p", "x": "els vostres humils servents"}, {"t": "p", "x": "per a fills del Cor Immaculat de la vostra Mare!"}, {"t": "p", "x": "Oh, Mare beneïda,"}, {"t": "p", "x": "sigueu lloada mil vegades"}, {"t": "p", "x": "per la finesa del vostre Cor Immaculat"}, {"t": "p", "x": "d’haver-nos acceptat com a fills vostres!"}, {"t": "p", "x": "Feu, Mare nostra, que corresponguem a tanta bondat;"}, {"t": "p", "x": "que cada dia siguem més humils, més fervorosos"}, {"t": "p", "x": "i més zelosos de la salvació de les ànimes."}, {"t": "p", "x": "Amén."}]}, {"id": "33", "num": "6.2", "title": "Oració del claretià", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Renovelleu, Senyor, en la nostra Congregació"}, {"t": "p", "x": "i en cadascun de nosaltres"}, {"t": "p", "x": "l’esperit que animà"}, {"t": "p", "x": "Sant Antoni Maria Claret, el nostre Pare."}, {"t": "p", "x": "Feu, que els Missioners"}, {"t": "p", "x": "Fills del Cor Immaculat de Maria"}, {"t": "p", "x": "siguem homes arborats de caritat"}, {"t": "p", "x": "i que abrusem la terra per on passem."}, {"t": "p", "x": "Que desitgem eficaçment i procurem per tots els mitjans possibles"}, {"t": "p", "x": "d’encendre tothom en el foc de l’amor diví."}, {"t": "p", "x": "Que res ni ningú no ens faci enrere."}, {"t": "p", "x": "Que sapiguem gaudir en les privacions,"}, {"t": "p", "x": "abordar els treballs, abraçar els sacrificis,"}, {"t": "p", "x": "complaure'ns en les calúmnies que ens aixequin,"}, {"t": "p", "x": "alegrar-nos en els turments i dolors que hàgim de patir"}, {"t": "p", "x": "i gloriar-nos en la creu de Jesucrist."}, {"t": "p", "x": "Que no pensem sinó com seguirem"}, {"t": "p", "x": "i imitarem més de prop Jesucrist"}, {"t": "p", "x": "a pregar, treballar i sofrir"}, {"t": "p", "x": "i procurar sempre i únicament la major glòria de Déu"}, {"t": "p", "x": "i la salvació de les ànimes."}, {"t": "p", "x": "Amén."}]}, {"id": "34", "num": "6.3", "title": "Oració per a l'aniversari de la Fundació", "theme": "congregacion", "sub": null, "tags": ["16 de juliol", "aniversari"], "lines": [{"t": "p", "x": "Senyor,"}, {"t": "p", "x": "que atorgàreu a Sant Antoni Maria Claret, el nostre Pare,"}, {"t": "p", "x": "d’abrusar-se en caritat"}, {"t": "p", "x": "i una sol·licitud apostòlica"}, {"t": "p", "x": "per la salvació dels homes de tot el món."}, {"t": "p", "x": "Des de petit el vau anar conduint"}, {"t": "p", "x": "al coneixement més ple del misteri de Crist."}, {"t": "p", "x": "Empès per la caritat, es va lliurar a l'anunci de l'Evangeli,"}, {"t": "p", "x": "va ser pacient en els treballs i calúmnies,"}, {"t": "p", "x": "i va ratificar la seva vida amb la seva sang i l’exili."}, {"t": "p", "x": "Per continuar la seva obra,"}, {"t": "p", "x": "i per mitjà de la Verge Maria,"}, {"t": "p", "x": "va fundar la nostra Congregació i ens va deixar el seu esperit."}, {"t": "p", "x": "Avui, en recordar el nostre origen en l'Església,"}, {"t": "p", "x": "us demanem, per intercessió de la nostra Mare,"}, {"t": "p", "x": "que ens feu fills seus fidels"}, {"t": "p", "x": "en el ministeri de la Paraula;"}, {"t": "p", "x": "que el seu cor continuï sent per a nosaltres"}, {"t": "p", "x": "el bàcul de la confiança;"}, {"t": "p", "x": "que beneïu amb noves vocacions"}, {"t": "p", "x": "aquesta família claretiana"}, {"t": "p", "x": "i que ens doneu un amor perseverant a Jesús"}, {"t": "p", "x": "a tots els qui ens diem i som"}, {"t": "p", "x": "fills del Cor Immaculat de Maria"}, {"t": "p", "x": "i treballem per la glòria de Déu"}, {"t": "p", "x": "a l'Església."}, {"t": "p", "x": "Amén."}]}, {"id": "35", "num": "6.4", "title": "Per la nostra Congregació", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Us demanem, Senyor, que,"}, {"t": "p", "x": "per intercessió del Cor Immaculat de Maria,"}, {"t": "p", "x": "allibereu de tot mal la nostra Congregació"}, {"t": "p", "x": "perquè, amb esperit humil i generós, com Sant Antoni Maria Claret,"}, {"t": "p", "x": "es dediqui al vostre pla de salvació sobre tots els homes"}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "36", "num": "6.5", "title": "Per la nostra Congregació (lletania)", "theme": "congregacion", "sub": null, "tags": ["lletania"], "lines": [{"t": "v", "x": "Santa Maria."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sant Miquel i tots els sants Àngels."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sant Josep."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sants Apòstols."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sant Alfons-Maria de Liguori."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sant Ignasi de Loiola."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sant Francesc Xavier."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sant Vicenç de Paül."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Sant Antoni Maria Claret."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Santa Teresa de Jesús."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Santa Caterina de Siena."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Beats Màrtirs de la Família Claretiana."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Tots els Sants i Santes de Déu."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "v", "x": "Recordeu-vos, Senyor de la vostra Congregació."}, {"t": "r", "x": "Que posseíreu des del principi."}, {"t": "v", "x": "Que compleixi la seva missió d'anunciar l'Evangeli."}, {"t": "r", "x": "Perquè tots els homes se salvin."}, {"t": "v", "x": "Us preguem que vingueu en auxili dels vostres servents."}, {"t": "r", "x": "Que redimíreu amb la vostra sang preciosa."}, {"t": "v", "x": "Salveu, Senyor, la vostra Congregació."}, {"t": "r", "x": "Sigueu el seu pastor i guieu-la sempre."}, {"t": "v", "x": "Tingueu pietat de nosaltres, Senyor."}, {"t": "r", "x": "Tingueu pietat de nosaltres."}, {"t": "v", "x": "Que la vostra misericòrdia, Senyor, davalli sobre nosaltres."}, {"t": "r", "x": "Com ho esperem de Vós."}, {"t": "v", "x": "Senyor, escolteu la nostra súplica."}, {"t": "r", "x": "I arribi a Vós el nostre clam."}, {"t": "v", "x": "El Senyor sigui amb vosaltres."}, {"t": "r", "x": "I amb el vostre esperit."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Us preguem, Senyor, que,"}, {"t": "p", "x": "per la intercessió de la Verge Maria,"}, {"t": "p", "x": "allibereu de tot mal aquesta Congregació,"}, {"t": "p", "x": "vesseu abundosament la vostra gràcia sobre els seus fills,"}, {"t": "p", "x": "i ompliu-los del vostre esperit"}, {"t": "p", "x": "perquè us complaguin sempre en la veritat."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "37", "num": "6.6", "title": "Oració per la Congregació", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Pare de bondat i de misericòrdia,"}, {"t": "p", "x": "us lloem i us beneïm"}, {"t": "p", "x": "per haver enriquit la vostra Església"}, {"t": "p", "x": "amb l'estil de santificació i apostolat"}, {"t": "p", "x": "de Sant Antoni Maria Claret,"}, {"t": "p", "x": "el nostre Fundador i Pare."}, {"t": "p", "x": "Us supliquem humilment:"}, {"t": "p", "x": "envieu nous operaris a la nostra Congregació"}, {"t": "p", "x": "i infoneu el vostre Esperit en els qui heu elegit."}, {"t": "p", "x": "Confirmeu-nos a tots en la vocació missionera,"}, {"t": "p", "x": "i feu que, esperonats per la caritat de Crist,"}, {"t": "p", "x": "com a veritables Fills"}, {"t": "p", "x": "del Cor Immaculat de Maria,"}, {"t": "p", "x": "anunciem a tots els pobles"}, {"t": "p", "x": "la Bona Nova del Regne."}, {"t": "p", "x": "Per Crist Senyor nostre. Amén."}]}, {"id": "38", "num": "6.7", "title": "Per a la renovació de l'esperit claretià", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Renovelleu, Senyor, en la nostra Congregació"}, {"t": "p", "x": "l'esperit que va animar Sant Antoni Maria Claret, el nostre Pare,"}, {"t": "p", "x": "per tal que, plens d’ell i envigorits per ell,"}, {"t": "p", "x": "maldem per estimar el que ell va estimar"}, {"t": "p", "x": "i dur a la pràctica allò que ens va ensenyar."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "39", "num": "6.8", "title": "Evangelitzadors fidels", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Vós, Senyor,"}, {"t": "p", "x": "decretàreu misericordiosament"}, {"t": "p", "x": "que la vostra Paraula s'encarnés en el si de la Verge Maria;"}, {"t": "p", "x": "concediu-nos de guardar-la en els nostres cors"}, {"t": "p", "x": "de manera que siguem sempre fidels servidors"}, {"t": "p", "x": "en la proclamació de la Bona Nova de salvació a tots els homes."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "40", "num": "6.9", "title": "Constitucions", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Pare, que ens heu concedit el do"}, {"t": "p", "x": "de seguir Jesús"}, {"t": "p", "x": "i anunciar el vostre Regne entre els homes"}, {"t": "p", "x": "a l'estil de Claret i els seus deixebles."}, {"t": "p", "x": "Ajudeu-nos a observar amb tota la cura possible les nostres Constitucions,"}, {"t": "p", "x": "camí d'Evangeli per a nosaltres."}, {"t": "p", "x": "Concediu-nos d’escoltar la vostra Paraula amb tota docilitat, com la vostra Mare,"}, {"t": "p", "x": "per tal de ser Fills fidels del seu Cor,"}, {"t": "p", "x": "i cooperar amb el seu ofici maternal en la missió apostòlica."}, {"t": "p", "x": "Pel mateix Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "41", "num": "6.10", "title": "Acció de gràcies per la vocació", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Gràcies us dono, oh Mare, per la vocació rebuda."}, {"t": "p", "x": "Feu-me la gràcia de ser-hi fidel tota la meva vida."}]}, {"id": "42", "num": "6.11", "title": "Definició del Missioner Claretià", "theme": "congregacion", "sub": null, "tags": ["responsorial"], "lines": [{"t": "v", "x": "Senyor, per intercessió del Cor Immaculat de Maria, infoneu en nosaltres l'esperit d'amor perquè siguem homes abrandats de caritat i que abrusem per on passem."}, {"t": "r", "x": "Amén."}, {"t": "v", "x": "I perquè desitgem eficaçment i procurem, per tots els mitjans, d’encendre tot el món en el foc de l’amor diví."}, {"t": "r", "x": "Amén."}, {"t": "v", "x": "Senyor, per intercessió del Cor Immaculat de Maria, infoneu en nosaltres l'esperit de fortalesa per tal que res no ens espanti, ens gaudim en les privacions i abordem coratjosament els treballs apostòlics."}, {"t": "r", "x": "Amén."}, {"t": "v", "x": "I perquè abracem amb joia els sacrificis, ens complaguem en les calúmnies i ens alegrem en els turments."}, {"t": "r", "x": "Amén."}, {"t": "v", "x": "Senyor, per intercessió del Cor Immaculat de Maria, infoneu en nosaltres l'esperit missioner que animà Jesús, el vostre Fill, perquè no pensem sinó com seguir-lo i imitar-lo a pregar, treballar i sofrir."}, {"t": "r", "x": "Amén."}, {"t": "v", "x": "I perquè, com Jesús, procurem sempre i únicament la vostra major glòria i la salvació dels homes."}, {"t": "r", "x": "Amén."}]}, {"id": "43", "num": "6.12", "title": "Professió de la identitat claretiana", "theme": "congregacion", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Creiem que l'Esperit Sant"}, {"t": "p", "x": "ens ha convocat en l'Església per Sant Antoni Maria Claret"}, {"t": "p", "x": "perquè, com a Congregació,"}, {"t": "p", "x": "ens anomenem i siguem Missioners Fills del Cor Immaculat de Maria."}, {"t": "p", "x": "Creiem que el Pare ens convoca"}, {"t": "p", "x": "a viure autènticament i significativament"}, {"t": "p", "x": "el misteri i la missió apostòlica del seu Fill"}, {"t": "p", "x": "en fraternitat evangelitzada i evangelitzadora."}, {"t": "p", "x": "És ell, i no els nostres projectes,"}, {"t": "p", "x": "qui ens fa veritables deixebles de Crist."}, {"t": "p", "x": "Aquest amor que configura la nostra vida fraterna"}, {"t": "p", "x": "volem significar-lo, cada vegada més, en l'Eucaristia."}, {"t": "p", "x": "Creiem que Maria és a l'origen de la nostra vocació"}, {"t": "p", "x": "i exerceix la seva maternitat configurant les nostres vides amb la de Crist, el seu Fill."}, {"t": "p", "x": "En el seu Cor de Mare es formen els apòstols de la Congregació."}, {"t": "p", "x": "I la seva presència en nosaltres és impuls evangelitzador i amor misericordiós"}, {"t": "p", "x": "que transforma i anima els creients."}, {"t": "p", "x": "Creiem que el Pare Claret va ser elegit i proposat per Déu com el nostre prototipus"}, {"t": "p", "x": "i model de missioners al servei de l'Evangeli en l'Església universal."}, {"t": "p", "x": "Creiem que la nostra comuna vocació-missió comporta un seguiment,"}, {"t": "p", "x": "en fidelitat perfecta i en disponibilitat absoluta, a Crist en l'Església,"}, {"t": "p", "x": "segons les exigències evangèliques viscudes pel nostre Fundador i Pare,"}, {"t": "p", "x": "i transmeses pels nostres avantpassats."}, {"t": "p", "x": "Creiem que l'Esperit de Jesús ressuscitat"}, {"t": "p", "x": "ens ungeix profèticament perquè anunciem la Bona Nova als pobres,"}, {"t": "p", "x": "i, urgits per la seva mateixa caritat sacrificada i redemptora,"}, {"t": "p", "x": "abrusem per on passem."}, {"t": "p", "x": "Creiem que hem estat cridats"}, {"t": "p", "x": "com a esforçats col·laboradors del Sant Pare i dels Bisbes"}, {"t": "p", "x": "en el ministeri de la Paraula per a l’extensió del Regne de Déu per tot el món."}, {"t": "p", "x": "Per això, emprant tots els mitjans possibles,"}, {"t": "p", "x": "volem atendre allò que és més urgent, oportú i eficaç."}, {"t": "p", "x": "Creiem que la Congregació és obra de Déu"}, {"t": "p", "x": "i que Jesús i Maria no l'abandonaran, suscitant vocacions"}, {"t": "p", "x": "i donant l'Esperit als cridats,"}, {"t": "p", "x": "perquè, vivint en fraternitat la mateixa consagració i missió,"}, {"t": "p", "x": "glorifiquem el Pare, perllonguem el testimoniatge de comunió eclesial"}, {"t": "p", "x": "i fem més eficaç l'acció evangelitzadora."}, {"t": "p", "x": "Creiem, Senyor. Augmenteu-nos la fe."}]}, {"id": "68", "num": "7.1", "title": "Vós, Pare", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Vós, Pare,"}, {"t": "p", "x": "heu infós en els nostres cors"}, {"t": "p", "x": "l'amor a Vós i als germans per l'Esperit Sant,"}, {"t": "p", "x": "que ens configura amb Crist i edifica la nostra comunió."}, {"t": "p", "x": "Us demanem que acollim aquest do vostre"}, {"t": "p", "x": "per tal que tota la nostra vida missionera"}, {"t": "p", "x": "estigui regida i informada per aquest amor"}, {"t": "p", "x": "i assolim en la comunitat missionera"}, {"t": "p", "x": "la plenitud personal a la qual Vós ens crideu."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "69", "num": "7.2", "title": "Oració de la comunitat", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Us donem gràcies, Pare Sant,"}, {"t": "p", "x": "per haver-nos reunit en aquesta comunitat"}, {"t": "p", "x": "des de la qual voleu que anunciem el vostre Regne"}, {"t": "p", "x": "amb una vida perfectament consagrada"}, {"t": "p", "x": "i amb un dedicació total al servei de l'Evangeli."}, {"t": "p", "x": "Volem proclamar amb tot el nostre ser i actuar,"}, {"t": "p", "x": "com a veritables Fills del Cor de Maria,"}, {"t": "p", "x": "les meravelles del vostre amor entre els homes."}, {"t": "p", "x": "Renovem el nostre propòsit de ser millors cada dia,"}, {"t": "p", "x": "d'ajudar-nos mútuament en el seguiment del vostre Fill,"}, {"t": "p", "x": "de secundar les inspiracions del vostre Esperit Sant,"}, {"t": "p", "x": "i de col·laborar en el acompliment de la Missió"}, {"t": "p", "x": "que ens heu confiat en l'Església."}, {"t": "p", "x": "No permeteu, Senyor, que aquesta bona voluntat"}, {"t": "p", "x": "es vagi esmorteint inadvertidament"}, {"t": "p", "x": "per l'egoisme, la rutina o la inconstància."}, {"t": "p", "x": "Revifeu la fe i l'esperança d'aquesta comunitat apostòlica"}, {"t": "p", "x": "a l'hora de discernir les inevitables diferències,"}, {"t": "p", "x": "i eixampleu els nostres cors per al necessari perdó."}, {"t": "p", "x": "Des de la consciència de la nostra debilitat"}, {"t": "p", "x": "us demanem que ens mantingueu atents a la vostra gràcia:"}, {"t": "p", "x": "que l'assídua meditació de la vostra Paraula ens recreï,"}, {"t": "p", "x": "i que la convivència fraterna ens estimuli"}, {"t": "p", "x": "a donar aquell testimoniatge d'amor que el món necessita per a creure,"}, {"t": "p", "x": "i que les necessitats i urgències dels més pobres"}, {"t": "p", "x": "ens estimulin a sortir de nosaltres mateixos"}, {"t": "p", "x": "i ens obliguin a treballar per ells sens parar."}, {"t": "p", "x": "Ens encomanem a Maria, la Mare de Jesús,"}, {"t": "p", "x": "exemple de vida consagrada,"}, {"t": "p", "x": "per tal que ens formi en el seu mateix Cor"}, {"t": "p", "x": "i ens faci seguir el camí de perfecció i de servei apostòlic"}, {"t": "p", "x": "que Sant Antoni Maria Claret, amb la seva vida i doctrina,"}, {"t": "p", "x": "ens va traçar en l'Església i en el món."}, {"t": "p", "x": "Segelleu, Pare, amb la vostra fidelitat eterna"}, {"t": "p", "x": "això que ara és la nostra aspiració més sincera."}, {"t": "p", "x": "Per Crist Senyor nostre."}]}, {"id": "70", "num": "7.3", "title": "Caritat fraterna", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Us supliquem humilment, Senyor Déu nostre,"}, {"t": "p", "x": "que uniu en uns mateixos sentiments els qui compartim l'esperit"}, {"t": "p", "x": "del vostre servent Antoni Maria;"}, {"t": "p", "x": "perquè d’acord amb l’amor mutu,"}, {"t": "p", "x": "puguem ser testimonis de la vostra caritat"}, {"t": "p", "x": "entre els homes."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "71", "num": "7.4", "title": "Oració per la pròpia comunitat", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Pare, avui vull demanar-vos pels meus germans de comunitat."}, {"t": "p", "x": "Vós els coneixeu personalment:"}, {"t": "p", "x": "coneixeu els seus noms i els seus cognoms,"}, {"t": "p", "x": "les seves virtuts i els seus defectes,"}, {"t": "p", "x": "les seves alegries i les seves penes,"}, {"t": "p", "x": "la seva fortalesa i la seva feblesa, sabeu tota la seva història;"}, {"t": "p", "x": "els accepteu com són,"}, {"t": "p", "x": "i els vivifiqueu amb el vostre Esperit."}, {"t": "p", "x": "Vós, Senyor, els estimeu"}, {"t": "p", "x": "no perquè siguin bons"}, {"t": "p", "x": "sinó perquè són fills vostres."}, {"t": "p", "x": "Ensenyeu-me a estimar-los de debò, a imitació de Jesucrist,"}, {"t": "p", "x": "no per llurs paraules o per llurs obres, sinó per ells mateixos,"}, {"t": "p", "x": "descobrint en cadascun,"}, {"t": "p", "x": "especialment en els més febles,"}, {"t": "p", "x": "el misteri del vostre amor infinit."}, {"t": "p", "x": "Us agraeixo, Pare,"}, {"t": "p", "x": "que m’hàgiu donat germans."}, {"t": "p", "x": "Tots són un regal per a mi, un veritable sagrament,"}, {"t": "p", "x": "signe sensible i eficaç de la presència del vostre Fill."}, {"t": "p", "x": "Doneu-me la mirada de Jesús per contemplar-los,"}, {"t": "p", "x": "i doneu-me el seu cor per estimar-los fins a l'extrem,"}, {"t": "p", "x": "perquè també jo vull ser per a cadascun d'ells"}, {"t": "p", "x": "sagrament viu de la presència de Jesús."}, {"t": "p", "x": "Pel mateix Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "72", "num": "8.1", "title": "Oració apostòlica", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Déu meu i Pare meu!"}, {"t": "p", "x": "Que us conegui i us faci conèixer;"}, {"t": "p", "x": "que us estimi i us faci estimar;"}, {"t": "p", "x": "que us serveixi i us faci servir;"}, {"t": "p", "x": "que us lloï i us faci lloar de totes les criatures."}, {"t": "p", "x": "Concediu-me, Pare meu, que tots els pecadors es converteixin,"}, {"t": "p", "x": "que tots els justos perseverin en la gràcia"}, {"t": "p", "x": "i tots aconseguim l'eterna glòria."}, {"t": "p", "x": "Amén."}]}, {"id": "73", "num": "8.2", "title": "Conèixer Déu per servir-lo", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Concediu-me, Senyor,"}, {"t": "p", "x": "que tots coneguin la vostra bondat i proximitat"}, {"t": "p", "x": "per tal que us estimin i serveixin amb tota fidelitat,"}, {"t": "p", "x": "perquè sou bo i la vostra misericòrdia és infinita."}, {"t": "p", "x": "Amén."}]}, {"id": "74", "num": "8.3", "title": "Instrument del Regne", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Aquí em teniu, Senyor,"}, {"t": "p", "x": "si ho voleu, feu de mi un instrument per a l'anunci del vostre Regne."}, {"t": "p", "x": "Feu, Senyor, que el menjar sigui per tenir força i servir-vos millor;"}, {"t": "p", "x": "que usi de les coses d'aquest món en quant les necessiti,"}, {"t": "p", "x": "que estudiï per a conèixer-vos i estimar-vos i per ajudar els meus germans;"}, {"t": "p", "x": "que el meu descans sigui per a refer les forces gastades i servir-vos millor."}, {"t": "p", "x": "Amén."}]}, {"id": "75", "num": "8.4", "title": "Pel fruit apostòlic dels Missioners", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Pare de bondat,"}, {"t": "p", "x": "que sense cap mèrit nostre ens heu elegit i ens envieu com enviàreu el vostre Fill Jesús."}, {"t": "p", "x": "Comuniqueu-nos el vostre Esperit,"}, {"t": "p", "x": "feu-nos ministres idonis de l'Evangeli,"}, {"t": "p", "x": "i concediu-nos la força necessària"}, {"t": "p", "x": "perquè exercim eficaçment el ministeri de la salvació dels homes."}, {"t": "p", "x": "Doneu, Senyor, increment als nostres treballs,"}, {"t": "p", "x": "i feu que la vostra Paraula, Crist, parli per nosaltres."}, {"t": "p", "x": "Beneïu-nos i ajudeu-nos,"}, {"t": "p", "x": "perquè tots els homes acceptin l'Evangeli"}, {"t": "p", "x": "i us estimin cada dia més."}, {"t": "p", "x": "No permeteu, Senyor, que us ofenguem;"}, {"t": "p", "x": "preserveu-nos de tots els perills i enfortiu-nos amb la vostra gràcia."}, {"t": "p", "x": "Amén."}]}, {"id": "76", "num": "8.5", "title": "Missioners", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor,"}, {"t": "p", "x": "que ens crideu com als Apòstols,"}, {"t": "p", "x": "feu que ens esforcem amb tots els nostres mitjans i recursos"}, {"t": "p", "x": "per aconseguir que sigueu estimat, conegut i servit per tots."}, {"t": "p", "x": "Doneu-nos un cor obert"}, {"t": "p", "x": "per estimar tots els homes sense excepció,"}, {"t": "p", "x": "procurant-los la benaurança del Regne,"}, {"t": "p", "x": "que ja s'ha iniciat a la terra."}, {"t": "p", "x": "Que, de tots els dons que creiem posseir,"}, {"t": "p", "x": "us en donem únicament a Vós la glòria,"}, {"t": "p", "x": "procurant fer-los fructificar copiosament,"}, {"t": "p", "x": "i recordem les nostres pròpies limitacions i defectes,"}, {"t": "p", "x": "reconeixent així la nostra total dependència de Vós."}, {"t": "p", "x": "Que expressem aquest convenciment"}, {"t": "p", "x": "en la nostra manera d'obrar i en les nostres relacions amb els altres,"}, {"t": "p", "x": "estant disposats a demanar perdó per les nostres faltes i equivocacions."}, {"t": "p", "x": "Que busquem brindar als nostres germans"}, {"t": "p", "x": "els serveis del nostre amor,"}, {"t": "p", "x": "de manera que cadascun de nosaltres s’estigui enmig d'ells com qui serveix."}, {"t": "p", "x": "Per Crist Senyor nostre. Amén."}]}, {"id": "77", "num": "8.6", "title": "Missió Claretiana", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Pare sant,"}, {"t": "p", "x": "Vós vau cridar Sant Antoni Maria Claret a seguir al vostre Fill,"}, {"t": "p", "x": "i ell, urgit pel seu amor,"}, {"t": "p", "x": "va esmerçar totalment la seva vida a lluitar per la seva Causa: el Regne."}, {"t": "p", "x": "Desvetlleu en nosaltres el seu esperit evangelitzador"}, {"t": "p", "x": "per tal que copsem allò que és més urgent, oportú i eficaç"}, {"t": "p", "x": "i realitzem la missió de propagar la fe, dòcils a l'Esperit,"}, {"t": "p", "x": "i obedients a la vostra voluntat."}, {"t": "p", "x": "Animats, com Claret, per la força del vostre Esperit,"}, {"t": "p", "x": "també nosaltres volem optar per la Causa del Regne"}, {"t": "p", "x": "i acceptar els riscos de la denúncia i el compromís profètic"}, {"t": "p", "x": "que comporta la nostra missió evangelitzadora."}, {"t": "p", "x": "Volem solidaritzar-nos i compartir les angoixes,"}, {"t": "p", "x": "les privacions i les esperances dels homes"}, {"t": "p", "x": "als quals som enviats."}, {"t": "p", "x": "I, tot confessant que el vostre Fill està viu entre els homes,"}, {"t": "p", "x": "volem treballar per acabar amb la incredulitat, l'odi, la injustícia,"}, {"t": "p", "x": "la mentida, l'opressió, el dolor, la solitud, la fam, la ignorància"}, {"t": "p", "x": "i tantes altres urgències d'amor que són urgències del Regne."}, {"t": "p", "x": "Us ho demanem pel vostre Fill Jesucrist, que viu i regna pels segles dels segles."}, {"t": "p", "x": "Amén."}]}, {"id": "78", "num": "8.7", "title": "Oració missionera", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Oh Pare,"}, {"t": "p", "x": "que heu vessat els dons del vostre Esperit"}, {"t": "p", "x": "sobre la benaurada Verge Maria,"}, {"t": "p", "x": "quan pregava amb els Apòstols al Cenacle,"}, {"t": "p", "x": "feu que perseverem unànimes en l'oració"}, {"t": "p", "x": "amb Maria, la nostra Mare, per a dur al món,"}, {"t": "p", "x": "amb la força de l'Esperit,"}, {"t": "p", "x": "la Bona Nova de la salvació."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "78b", "num": "8.8", "title": "Per les missions populars", "theme": "mision", "sub": null, "tags": ["missió popular"], "lines": [{"t": "p", "x": "Senyor, Déu i Pare nostre!"}, {"t": "p", "x": "Vós ens heu enviat el vostre Fill Jesucrist:"}, {"t": "p", "x": "Ell ens ensenya a caminar vers Vós."}, {"t": "p", "x": "Escolteu benigne la nostra pregària:"}, {"t": "p", "x": "Feu-nos oberts a rebre i anunciar"}, {"t": "p", "x": "la vostra Paraula de Vida."}, {"t": "p", "x": "Ajudeu tots aquell que se senten"}, {"t": "p", "x": "indecisos, indiferents o allunyats."}, {"t": "p", "x": "Que la missió evangelitzadora... (Lloc on es fa)"}, {"t": "p", "x": "doni fruits abundosos d’una fe renovellada,"}, {"t": "p", "x": "d’una esplèndida unió en comunitat cristiana,"}, {"t": "p", "x": "d’una ferma dedicació en el servei als altres,"}, {"t": "p", "x": "principalment els més febles."}, {"t": "p", "x": "Que la Verge Maria, amb el seu Cor de Mare,"}, {"t": "p", "x": "vetlli perquè la Paraula de Jesús"}, {"t": "p", "x": "sigui ben acollida i viscuda"}, {"t": "p", "x": "per tots els fills i veïns de... (Lloc de la missió)."}, {"t": "p", "x": "Amén."}]}, {"id": "79", "num": "8.9", "title": "Per l'Església", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor Jesús,"}, {"t": "p", "x": "que per amor als homes"}, {"t": "p", "x": "pregàreu per la fe dels vostres deixebles,"}, {"t": "p", "x": "intercedíreu pels pecadores,"}, {"t": "p", "x": "i us compadíreu de tota misèria humana:"}, {"t": "p", "x": "acolliu les súpliques que us elevem a favor de l'Església,"}, {"t": "p", "x": "escolteu les nostres oracions per la vida del món"}, {"t": "p", "x": "i admeteu-nos a tots en el goig del Regne etern,"}, {"t": "p", "x": "on viviu i regneu pels segles dels segles."}, {"t": "p", "x": "Amén."}]}, {"id": "80", "num": "8.10", "title": "El Senyor, present a la Missió", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor Jesús,"}, {"t": "p", "x": "el vostre mandat de missió ens va dispersar un dia arreu del món."}, {"t": "p", "x": "La vostra Paraula de comunió ens aplega avui en aquesta cruïlla de tots els camins,"}, {"t": "p", "x": "on trobar-nos és trobar-vos,"}, {"t": "p", "x": "on estimar-nos és donar testimoni de Vós,"}, {"t": "p", "x": "on encendre esperances és anunciar la vostra vinguda."}, {"t": "p", "x": "Com els Dotze,"}, {"t": "p", "x": "tornem a Vós des de les senderes de la nostra missió,"}, {"t": "p", "x": "portant a la vostra presència el dolor i les humiliacions dels nostres pobles,"}, {"t": "p", "x": "el clam dels pobres que ens heu enviat a evangelitzar,"}, {"t": "p", "x": "les esperances dels humils que han obert el seu cor al vostre missatge"}, {"t": "p", "x": "i que per onsevulla el fan florir en fraternitat, a l'Església."}, {"t": "p", "x": "Concediu-nos que, celebrant i contemplant la vostra Paraula,"}, {"t": "p", "x": "aprenguem a discernir en la fe els signes d'aquest temps,"}, {"t": "p", "x": "i a proclamar-vos a Vós, que sou la Veritat completa -sempre nova-,"}, {"t": "p", "x": "enmig de les ambigüitats i contradiccions d'aquest món."}, {"t": "p", "x": "Que la vostra presència ressuscitada entre nosaltres"}, {"t": "p", "x": "esvaeixi les nostres pors i desànims,"}, {"t": "p", "x": "i ens faci optar amb llibertat i fortalesa,"}, {"t": "p", "x": "per la vostra proposta de vida, de justícia i de fraternitat,"}, {"t": "p", "x": "allà on es coven projectes de destrucció, d'opressió i de violència."}, {"t": "p", "x": "Envieu-nos el vostre Esperit"}, {"t": "p", "x": "per tal que, com en Maria, la Mare Verge,"}, {"t": "p", "x": "creeu en nosaltres un cor nou,"}, {"t": "p", "x": "encès en caritat apostòlica,"}, {"t": "p", "x": "disponible davant els desafiaments de la nova evangelització,"}, {"t": "p", "x": "fecund en obres d'amor i de servei als més necessitats."}, {"t": "p", "x": "Feu que siguem instruments de comunió i de reconciliació"}, {"t": "p", "x": "a fi que en els pobles als quals ens heu enviat,"}, {"t": "p", "x": "la comunitat dels qui creuen en Vós"}, {"t": "p", "x": "sigui transparència del vostre designi de salvació i glorifiqui el vostre nom."}, {"t": "p", "x": "Amén."}]}, {"id": "83", "num": "8.11", "title": "Volem fer la vostra voluntat", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Pare nostre,"}, {"t": "p", "x": "Pare de bondat i misericòrdia:"}, {"t": "p", "x": "som aquí reunits en nom de l'amor que ens teniu."}, {"t": "p", "x": "Us lloem, us beneïm i us donem gràcies."}, {"t": "p", "x": "Amb goig responem a la crida que per mitjà del vostre Fill ens dirigiu"}, {"t": "p", "x": "i encoratjats per la força de l'Esperit,"}, {"t": "p", "x": "us diem confiats: “Volem fer la vostra voluntat”."}, {"t": "p", "x": "Doneu-nos una mirada neta, una intel·ligència oberta i un cor ardent"}, {"t": "p", "x": "per a comprendre i abraçar el designi que teniu sobre nosaltres."}, {"t": "p", "x": "Quan pensem en la missió que ens confieu,"}, {"t": "p", "x": "ens adonem de les profundes i constants exigències que hem de complir."}, {"t": "p", "x": "Augmenteu en nosaltres la generositat i l'esperança"}, {"t": "p", "x": "i obriu-nos a les necessitats més urgents dels homes."}, {"t": "p", "x": "Que encertem a expressar en la nostra vida"}, {"t": "p", "x": "l'amor universal de Jesucrist, el seu incondicional lliurament"}, {"t": "p", "x": "i el total oblit que va tenir de si mateix"}, {"t": "p", "x": "en la realització de la seva missió salvadora en aquest món."}, {"t": "p", "x": "Confirmeu-nos en la veritat; doneu-nos set de la vostra justícia"}, {"t": "p", "x": "i feu-nos instruments idonis per a la pau."}, {"t": "p", "x": "Que siguem forces vives de comunió en aquesta Església pelegrina"}, {"t": "p", "x": "i aconseguim ser testimonis del poder sobirà de Crist ressuscitat"}, {"t": "p", "x": "enmig d'aquest poble que sofreix la seva passió de llibertat."}, {"t": "p", "x": "Que siguem responsables en tota acció i compromís,"}, {"t": "p", "x": "i no permeteu que, proclamant l'Evangeli, busquem els nostres propis interessos."}, {"t": "p", "x": "Concediu-nos, Senyor, la caritat apostòlica de Sant Antoni Maria Claret, el nostre Pare."}, {"t": "p", "x": "Ensenyeu-nos, com a ell, a discernir sempre el que us agrada,"}, {"t": "p", "x": "el que és just i el que construeix el vostre Regne entre els homes."}, {"t": "p", "x": "Us ho demanem per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "45", "num": "9.1", "title": "Caritat apostòlica", "theme": "consagracion", "sub": "Virtuts", "tags": [], "lines": [{"t": "p", "x": "Oh Déu meu!"}, {"t": "p", "x": "Doneu-me caritat apostòlica,"}, {"t": "p", "x": "de manera que actuï en tot amb fortalesa i suaument,"}, {"t": "p", "x": "amb mansuetud i caritat."}, {"t": "p", "x": "Amén."}]}, {"id": "46", "num": "9.2", "title": "Pràctica de les virtuts", "theme": "consagracion", "sub": "Virtuts", "tags": [], "lines": [{"t": "p", "x": "Jesús, doneu-me la vostra gràcia per a imitar-vos fidelment"}, {"t": "p", "x": "en la pràctica de totes les virtuts."}, {"t": "p", "x": "Amb Vós tot ho puc, sense Vós absolutament res."}, {"t": "p", "x": "Amén."}]}, {"id": "47", "num": "9.3", "title": "Pobresa", "theme": "consagracion", "sub": "Pobresa", "tags": [], "lines": [{"t": "p", "x": "Salvador nostre,"}, {"t": "p", "x": "que us vàreu fer pobre,"}, {"t": "p", "x": "que vàreu voler néixer pobre,"}, {"t": "p", "x": "viure pobrament i morir en la major pobresa."}, {"t": "p", "x": "Feu que els vostres missioners coneguem el valor de la pobresa,"}, {"t": "p", "x": "que l'estimem i la practiquem com Vós ens ensenyeu,"}, {"t": "p", "x": "amb obres i paraules;"}, {"t": "p", "x": "que, a exemple dels Apòstols,"}, {"t": "p", "x": "ho deixem tot per a seguir-vos en l'anunci de l'Evangeli."}, {"t": "p", "x": "Amén."}]}, {"id": "48", "num": "9.4", "title": "Mansuetud", "theme": "consagracion", "sub": "Virtuts", "tags": [], "lines": [{"t": "p", "x": "Oh Déu meu,"}, {"t": "p", "x": "Doneu-me un zel discret i prudent"}, {"t": "p", "x": "a fi que actuï en totes les coses"}, {"t": "p", "x": "amb fortalesa i suaument,"}, {"t": "p", "x": "amb mansuetud i bones formes."}, {"t": "p", "x": "Ajudeu-me a comportar-me en tot amb una santa prudència,"}, {"t": "p", "x": "conreada per l'estudi,"}, {"t": "p", "x": "fortificada amb l'edat,"}, {"t": "p", "x": "discernida amb el diàleg,"}, {"t": "p", "x": "i consumada amb l'experiència dels esdeveniments."}, {"t": "p", "x": "Amén."}]}, {"id": "49", "num": "9.5", "title": "Mortificació", "theme": "consagracion", "sub": "Virtuts", "tags": [], "lines": [{"t": "p", "x": "Oh Senyor!,"}, {"t": "p", "x": "sé que les penes, dolors i treballs"}, {"t": "p", "x": "són la divisa de l'apòstol."}, {"t": "p", "x": "Amb la vostra gràcia els abraço"}, {"t": "p", "x": "Ajudeu-me Vós, Senyor,"}, {"t": "p", "x": "a beure el calze de penes interiors"}, {"t": "p", "x": "i a rebre aquest baptisme de penes exteriors."}, {"t": "p", "x": "Feu que no em gloriï en altra cosa"}, {"t": "p", "x": "que en la Creu on Vós esteu clavat per mi."}, {"t": "p", "x": "Amén."}]}, {"id": "50", "num": "9.6", "title": "La nostra consagració", "theme": "consagracion", "sub": "Consagració", "tags": ["renovació de vots", "professió"], "lines": [{"t": "p", "x": "Déu i Pare meu,"}, {"t": "p", "x": "responent a la vostra crida"}, {"t": "p", "x": "vull procurar amb la major dedicació"}, {"t": "p", "x": "que sempre es compleixi la vostra voluntat."}, {"t": "p", "x": "Desitjo amb tot el cor dedicar-me plenament a Vós,"}, {"t": "p", "x": "seguint Jesús, com els Apòstols,"}, {"t": "p", "x": "perquè tots els homes tinguin vida en abundància."}, {"t": "p", "x": "Impulsat per l'Esperit Sant"}, {"t": "p", "x": "renovo el meu lliurament a Vós, Pare,"}, {"t": "p", "x": "perquè em configureu a imatge i semblança del vostre Fill Jesús."}, {"t": "p", "x": "Confiat en l’ajut maternal del Cor Immaculat de Maria,"}, {"t": "p", "x": "us prometo viure en aquesta comunitat de vida apostòlica"}, {"t": "p", "x": "cast, pobre, obedient,"}, {"t": "p", "x": "observant les Constitucions de la nostra Congregació"}, {"t": "p", "x": "amb tota la cura possible."}, {"t": "p", "x": "Ungiu-me, Pare Sant, amb el vostre Esperit de santedat,"}, {"t": "p", "x": "perquè en el servei de la Paraula"}, {"t": "p", "x": "sigui fidel al carisma de Sant Antoni Maria Claret"}, {"t": "p", "x": "i assoleixi la perfecció en el manament de l'amor."}, {"t": "p", "x": "Amén."}]}, {"id": "51", "num": "9.7", "title": "Configuració amb Crist", "theme": "consagracion", "sub": "Consagració", "tags": [], "lines": [{"t": "p", "x": "Gràcies, Pare, perquè ens heu ungit pel vostre Esperit"}, {"t": "p", "x": "i ens heu fet participar de la plenitud de Crist, el vostre Fill."}, {"t": "p", "x": "Beneït sigueu per haver-nos cridat a seguir-lo"}, {"t": "p", "x": "i a col·laborar amb Ell en l'obra que Vós li vau encomanar."}, {"t": "p", "x": "Us demanem que, moguts pel seu Esperit,"}, {"t": "p", "x": "no siguem nosaltres els qui visquem,"}, {"t": "p", "x": "sinó que sigui Crist el qui realment visqui en nosaltres,"}, {"t": "p", "x": "a fi de ser instruments aptes per anunciar el Regne del cel."}, {"t": "p", "x": "Que maldem per aconseguir la nostra configuració amb Ell"}, {"t": "p", "x": "a la nostra comunitat missionera,"}, {"t": "p", "x": "segons el nostre carisma propi en l'Església."}, {"t": "p", "x": "Ell, que viu i regna pels segles dels segles."}, {"t": "p", "x": "Amén."}]}, {"id": "53", "num": "9.8", "title": "El do de la castedat", "theme": "consagracion", "sub": "Castedat", "tags": [], "lines": [{"t": "p", "x": "Us beneïm, Déu nostre, per haver-nos concedit"}, {"t": "p", "x": "el do de la castedat pel Regne del cel,"}, {"t": "p", "x": "pel qual podem consagrar-nos de tot cor a les coses del Pare,"}, {"t": "p", "x": "a imitació del vostre Fill Jesucrist"}, {"t": "p", "x": "i segons l'exemple de la Verge Maria."}, {"t": "p", "x": "Demanem, Senyor, la vostra ajuda amb humilitat"}, {"t": "p", "x": "per a dominar les inclinacions de la nostra naturalesa,"}, {"t": "p", "x": "rebre amb goig el do de la castedat"}, {"t": "p", "x": "i conrear-lo amb tota diligència."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "54", "num": "9.9", "title": "Castedat", "theme": "consagracion", "sub": "Castedat", "tags": [], "lines": [{"t": "p", "x": "Beneït sigueu, Senyor,"}, {"t": "p", "x": "perquè pel do de la castedat pel Regne del cel,"}, {"t": "p", "x": "es manifesta el poder de la vostra glòria"}, {"t": "p", "x": "en la fragilitat de la nostra naturalesa,"}, {"t": "p", "x": "a fi de desvetllar en els homes l'esperança de la vida futura."}, {"t": "p", "x": "Feu que la castedat que professem"}, {"t": "p", "x": "afavoreixi una nova comunió fraterna en Crist"}, {"t": "p", "x": "i construeixi una comunitat que no es fonamenta ni en la carn ni en la sang,"}, {"t": "p", "x": "sinó en la vostra voluntat."}, {"t": "p", "x": "I que, com a signe d'amor perfecte,"}, {"t": "p", "x": "es converteixi en una font especial de fecunditat espiritual per al món"}, {"t": "p", "x": "i ens inflami en amor a Vós i a tots els homes."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "55", "num": "9.10", "title": "Vós, essent ric", "theme": "consagracion", "sub": "Pobresa", "tags": [], "lines": [{"t": "p", "x": "Vós, essent ric,"}, {"t": "p", "x": "us heu fet pobre per nosaltres"}, {"t": "p", "x": "a fi que nosaltres ens enriquíssim."}, {"t": "p", "x": "Dedicat a anunciar la Bona Nova del Regne,"}, {"t": "p", "x": "no teníeu on reposar el cap."}, {"t": "p", "x": "Concediu-nos de compartir la vostra pobresa,"}, {"t": "p", "x": "per a recordar als homes els béns del món futur,"}, {"t": "p", "x": "viure com Maria, la primera entre els pobres del Senyor,"}, {"t": "p", "x": "i a semblança dels Apòstols que, abandonant-ho tot, us van seguir."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles."}, {"t": "p", "x": "Amén."}]}, {"id": "56", "num": "9.11", "title": "Buscar primer de tot el Regne de Déu", "theme": "consagracion", "sub": "Pobresa", "tags": [], "lines": [{"t": "p", "x": "Us demanem, Senyor,"}, {"t": "p", "x": "que posant tota la nostra confiança en Vós,"}, {"t": "p", "x": "i mai en el poder i les riqueses,"}, {"t": "p", "x": "busquem primer de tot el Regne que pertany als pobres."}, {"t": "p", "x": "Amén."}]}, {"id": "57", "num": "9.12", "title": "Comunió de béns", "theme": "consagracion", "sub": "Pobresa", "tags": [], "lines": [{"t": "p", "x": "Concediu-nos, Senyor,"}, {"t": "p", "x": "que amb la nostra pobresa voluntària"}, {"t": "p", "x": "construïm la comunitat fraterna"}, {"t": "p", "x": "en la unitat de cor i d’esperit"}, {"t": "p", "x": "i l'expressem en la comunió de béns,"}, {"t": "p", "x": "espirituals i materials,"}, {"t": "p", "x": "amb els pobres i en el seu servei."}, {"t": "p", "x": "Amén."}]}, {"id": "58", "num": "9.13", "title": "Pobresa", "theme": "consagracion", "sub": "Pobresa", "tags": [], "lines": [{"t": "p", "x": "Us donem gràcies, Pare sant,"}, {"t": "p", "x": "perquè heu volgut manifestar-nos el valor de la pobresa"}, {"t": "p", "x": "i la benaurança dels qui no posen el seu guany en les riqueses."}, {"t": "p", "x": "Concediu-nos que tota la nostra vida i activitat."}, {"t": "p", "x": "estiguin informades per l'esperit de pobresa."}, {"t": "p", "x": "Que siguem pobres de fet i d'esperit"}, {"t": "p", "x": "i ens sentim obligats a la llei universal del treball,"}, {"t": "p", "x": "compartint la condició dels pobres."}, {"t": "p", "x": "Que tinguem els nostres béns a disposició dels altres,"}, {"t": "p", "x": "i ens alegrem quan experimentem alguns efectes de la pobresa,"}, {"t": "p", "x": "no dubtant de la vostra providència."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "59", "num": "9.14", "title": "Per fer la vostra voluntat", "theme": "consagracion", "sub": "Obediència", "tags": [], "lines": [{"t": "p", "x": "Per a fer la vostra voluntat, Pare, ens enviàreu el vostre Fill Jesús."}, {"t": "p", "x": "A exemple de la Verge Santíssima,"}, {"t": "p", "x": "que es va consagrar totalment com a esclava del Senyor"}, {"t": "p", "x": "a l'obra del Fill,"}, {"t": "p", "x": "us oferim, Senyor,"}, {"t": "p", "x": "la lliure facultat de disposar de la nostra vida"}, {"t": "p", "x": "per a configurar-nos amb Jesucrist,"}, {"t": "p", "x": "que es va fer obedient fins a la mort de creu,"}, {"t": "p", "x": "i unir-nos en tot a la vostra voluntat salvífica."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "60", "num": "9.15", "title": "Obedients en la missió", "theme": "consagracion", "sub": "Obediència", "tags": [], "lines": [{"t": "p", "x": "Compartint la mateixa vocació,"}, {"t": "p", "x": "volem buscar junts, Senyor, la vostra voluntat"}, {"t": "p", "x": "per dur a terme la nostra missió en l'Església."}, {"t": "p", "x": "Il·lumineu els qui expressen la unitat d'amor"}, {"t": "p", "x": "i de missió en la comunitat"}, {"t": "p", "x": "perquè promoguin la cooperació de tots"}, {"t": "p", "x": "en bé de l'Església i de la Congregació,"}, {"t": "p", "x": "i feu que tots, impulsats per l'amor,"}, {"t": "p", "x": "sapiguem obeir promptament i perfecta."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "61", "num": "9.16", "title": "Obediència", "theme": "consagracion", "sub": "Obediència", "tags": [], "lines": [{"t": "p", "x": "Us donem gràcies, Pare,"}, {"t": "p", "x": "perquè ens concediu la lliure facultat"}, {"t": "p", "x": "de disposar de la nostra vida,"}, {"t": "p", "x": "i ens moveu a oferir-vos-la per la força del vostre Esperit."}, {"t": "p", "x": "Gràcies per haver-nos cridat a configurar-nos"}, {"t": "p", "x": "amb vostre Fill Jesucrist"}, {"t": "p", "x": "en la seva obediència fins a la mort en creu."}, {"t": "p", "x": "Beneït sigueu per haver volgut que"}, {"t": "p", "x": "en Ell participem de la vostra voluntat salvadora."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "62", "num": "9.17", "title": "Obediència en comunió", "theme": "consagracion", "sub": "Obediència", "tags": [], "lines": [{"t": "p", "x": "Concediu-nos, Senyor,"}, {"t": "p", "x": "de buscar, conèixer i fer junts la vostra voluntat"}, {"t": "p", "x": "a fi de poder realitzar la missió comuna"}, {"t": "p", "x": "que tenim en l'Església."}, {"t": "p", "x": "Concediu-nos que en la recerca i el compliment de la vostra voluntat,"}, {"t": "p", "x": "ens comprometem a oferir la nostra ajuda als germans"}, {"t": "p", "x": "amb l'oració, el consell i el diàleg fratern."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "63", "num": "9.18", "title": "Pels superiors", "theme": "consagracion", "sub": "Obediència", "tags": [], "lines": [{"t": "p", "x": "Enfortiu, Senyor, els nostres Superiors"}, {"t": "p", "x": "perquè busquin abans de tot la vostra voluntat,"}, {"t": "p", "x": "exerceixin l'autoritat segons les Constitucions"}, {"t": "p", "x": "i en esperit de servei,"}, {"t": "p", "x": "donant la seva vida pels germans."}, {"t": "p", "x": "I concediu-nos a tots d’obeir-vos"}, {"t": "p", "x": "impulsats per l'amor,"}, {"t": "p", "x": "promptament i perfecta,"}, {"t": "p", "x": "sotmetent-nos als homes per Vós."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "64", "num": "9.19", "title": "Disponibilitat", "theme": "consagracion", "sub": "Obediència", "tags": [], "lines": [{"t": "p", "x": "Doneu-nos, Senyor, el do de la disponibilitat"}, {"t": "p", "x": "per a ser enviats a qualsevol part del món,"}, {"t": "p", "x": "a fi de posar totes les nostres energies al servei del ministeri"}, {"t": "p", "x": "que ens sigui encomanat per la Congregació."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "65", "num": "9.20", "title": "Imitar l'oració de Jesús", "theme": "consagracion", "sub": "Oració", "tags": [], "lines": [{"t": "p", "x": "Déu omnipotent i etern"}, {"t": "p", "x": "que us heu dignat associar-nos"}, {"t": "p", "x": "a l'obra missionera de Crist:"}, {"t": "p", "x": "obriu el nostre cor"}, {"t": "p", "x": "perquè ens convertim a l'Evangeli,"}, {"t": "p", "x": "i doneu-nos constància perquè l’imitem"}, {"t": "p", "x": "en la seva oració assídua."}, {"t": "p", "x": "Pel mateix Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "66", "num": "9.21", "title": "Progrés en la caritat", "theme": "consagracion", "sub": "Virtuts", "tags": [], "lines": [{"t": "p", "x": "Pare misericordiós,"}, {"t": "p", "x": "concediu-nos que la caritat de Crist ens urgeixi"}, {"t": "p", "x": "amb el mateix amor amb què Vós ens estimeu,"}, {"t": "p", "x": "i que, amb d'esperit ferm,"}, {"t": "p", "x": "estiguem disposats a morir cada dia pels germans."}, {"t": "p", "x": "Feu, que, com a estrangers i pelegrins,"}, {"t": "p", "x": "ens abstinguem dels desigs de la carn,"}, {"t": "p", "x": "que guardem amb molta cura"}, {"t": "p", "x": "els nostres sentits,"}, {"t": "p", "x": "i que ens alegrem en tota adversitat."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "67", "num": "9.22", "title": "L'amor de Crist ens esperona", "theme": "consagracion", "sub": "Virtuts", "tags": [], "lines": [{"t": "p", "x": "Pare sant,"}, {"t": "p", "x": "Jesucrist, urgit per un ardent a Vós i als homes,"}, {"t": "p", "x": "es va lliurar als treballs, a la passió, i fins i tot a la mort."}, {"t": "p", "x": "Concediu-nos la caritat apostòlica i el goig de l'Esperit"}, {"t": "p", "x": "perquè aconseguim"}, {"t": "p", "x": "que tots els homes us coneguin, us estimin i us serveixin,"}, {"t": "p", "x": "i arribin a la benaurança del vostre Regne."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "113", "num": "9.23", "title": "Il·lumineu, Senyor, els nostres cors", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "Il·lumineu, Senyor, amb la llum de la fe els nostres cors"}, {"t": "p", "x": "i inflameu-los amb el foc de la caritat"}, {"t": "p", "x": "perquè adorem, en esperit i en veritat,"}, {"t": "p", "x": "a qui reconeixem en aquest Sagrament"}, {"t": "p", "x": "com el nostre Déu i Senyor."}, {"t": "p", "x": "Ell que viu i reina pels segles dels segles."}]}, {"id": "114", "num": "9.24", "title": "Memorial de la nostra redempció", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "Oh Déu que redimíreu tots els homes"}, {"t": "p", "x": "amb el misteri pasqual de Crist,"}, {"t": "p", "x": "que en aquest Sagrament s'ofereix Ell mateix pels germans,"}, {"t": "p", "x": "concediu-nos que, venerant constantment el misteri de la nostra redempció,"}, {"t": "p", "x": "mereixem d’aconseguir el seu fruit"}, {"t": "p", "x": "i desvetllar en els homes el record de la presència del Senyor."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "rub", "x": "O bé:"}, {"t": "p", "x": "Oh Déu, Vós ens heu deixat un sagrament admirable per memorial de la vostra Passió. Concediu-nos una devoció tan gran als misteris del vostre Cos i de la vostra Sang, que experimentem constantment en nosaltres els efectes de la vostra redempció."}, {"t": "p", "x": "Vós que viviu i regneu dels segles dels segles."}]}, {"id": "115", "num": "9.25", "title": "L'Eucaristia i el zel apostòlic", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "Que el Sagrament de l'Eucaristia, Senyor,"}, {"t": "p", "x": "ompli del vostre amor i de zel apostòlic els nostres cors"}, {"t": "p", "x": "perquè ens esperonin a desitjar"}, {"t": "p", "x": "que tots els homes us coneguin, us estimin i us serveixin,"}, {"t": "p", "x": "i a procurar-los la benaurança d'aquest Regne"}, {"t": "p", "x": "iniciada ja a la terra."}, {"t": "p", "x": "Per Crist Senyor nostre."}]}, {"id": "116", "num": "9.26", "title": "Partícips d'un mateix pa", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "Senyor, Vós que ens heu fet partícips d'un mateix pa i d’un mateix Esperit,"}, {"t": "p", "x": "concediu-nos que, units a Vós com les sarments al cep,"}, {"t": "p", "x": "siguem u amb Vós per a edificar la nostra comunió"}, {"t": "p", "x": "i perquè el món cregui."}, {"t": "p", "x": "Per Crist Senyor nostre."}]}, {"id": "117", "num": "9.27", "title": "Solidaris amb els qui sofreixen", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "Senyor Jesús, que us identificàreu plenament amb els qui sofreixen"}, {"t": "p", "x": "i ens heu dit “veniu a mi tots els cansats i aclaparats sota la càrrega, i jo us faré reposar”,"}, {"t": "p", "x": "solidaris amb els homes que pateixen malaltia, dolor, injustícia i opressió, venim a la vostra presència"}, {"t": "p", "x": "perquè ens inflameu en la vostra caritat"}, {"t": "p", "x": "fins que ens alegrem en els sofriments"}, {"t": "p", "x": "i ens gloriem en la vostra creu."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles."}]}, {"id": "118", "num": "9.28", "title": "Adorar el misteri pasqual", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "Senyor, que pel misteri pasqual"}, {"t": "p", "x": "heu realitzat la salvació dels homes,"}, {"t": "p", "x": "concediu-nos d’adorar-vos present en aquest Sagrament"}, {"t": "p", "x": "i proclamar amb fe el que ara venerem."}, {"t": "p", "x": "Per Crist Senyor nostre."}]}, {"id": "119", "num": "9.29", "title": "Inflameu-nos en la fe", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "Senyor Jesús,"}, {"t": "p", "x": "inflameu-nos en la fe"}, {"t": "p", "x": "que va moure a tants predicadors de la divina paraula"}, {"t": "p", "x": "a abraçar amb ànim alegre"}, {"t": "p", "x": "la pobresa, l'abnegació i el sacrifici"}, {"t": "p", "x": "per a dilatar el vostre Regne"}, {"t": "p", "x": "Us ho demanem units de cor a Vós,"}, {"t": "p", "x": "present ara en el misteri eucarístic que venerem"}, {"t": "p", "x": "i amb qui compartim la vida i ministeri"}, {"t": "p", "x": "Vós que viviu i regneu amb el Pare i l'Esperit
