Sant"}, {"t": "p", "x": "pels segles dels segles."}]}, {"id": "144", "num": "9.30", "title": "Oració del P. Fundador al començament dels exercicis", "theme": "consagracion", "sub": "Exercicis espirituals", "tags": ["recés"], "lines": [{"t": "p", "x": "Mare de Déu, Mare meva,"}, {"t": "p", "x": "Vós que tinguéreu el consol de veure reunits"}, {"t": "p", "x": "els Apòstols i deixebles en el Cenacle"}, {"t": "p", "x": "i finalment el goig de veure'ls tots"}, {"t": "p", "x": "plens de l'Esperit Sant;"}, {"t": "p", "x": "amb tota confiança us demano"}, {"t": "p", "x": "que m'obtingueu totes les gràcies que necessito"}, {"t": "p", "x": "per a fer bé aquests Exercicis"}, {"t": "p", "x": "sota la vostra direcció."}, {"t": "p", "x": "Refermeu-me en el meu propòsit de fer tot el que conegui que sigui profitós per a major glòria de Déu i bé de la meva ànima."}, {"t": "p", "x": "Mare meva, socorreu-me i empareu-me ara i sempre."}, {"t": "p", "x": "Amén."}]}, {"id": "84", "num": "10.1", "title": "Per les vocacions", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor Jesucrist, que vàreu dir:"}, {"t": "p", "x": "“Pregueu el Senyor dels sembrats que enviï obrers als seus sembrats”:"}, {"t": "p", "x": "Us demanem humilment"}, {"t": "p", "x": "que us digneu enviar molts missioners a la nostra Congregació."}, {"t": "p", "x": "Infoneu el vostre Esperit en els qui heu elegit"}, {"t": "p", "x": "i confirmeu-los en la vocació,"}, {"t": "p", "x": "per tal que anunciant dignament i fructuosament el sant Evangeli"}, {"t": "p", "x": "ens anomenem i siguem de veritat"}, {"t": "p", "x": "Fills del Cor Immaculat de la Santíssima Verge Maria,"}, {"t": "p", "x": "us estimem de tot cor, de paraula i d'obra,"}, {"t": "p", "x": "i no defallim mai en la vostra lloança."}, {"t": "p", "x": "Amén."}]}, {"id": "85", "num": "10.2", "title": "Vocació", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor, Vós, que cridàreu els Apòstols"}, {"t": "p", "x": "perquè fossin pescadors d'homes,"}, {"t": "p", "x": "crideu a la Família Claretiana"}, {"t": "p", "x": "nous membres"}, {"t": "p", "x": "que siguin sal de la terra i llum del món"}, {"t": "p", "x": "i difonguin per tot arreu la caritat"}, {"t": "p", "x": "que urgia el vostre servent Antoni Maria."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "86", "num": "10.3", "title": "Per intercessió del Cor Immaculat de Maria", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor Déu nostre, que pel Cor Immaculat de Maria,"}, {"t": "p", "x": "ornàreu Sant Antoni Maria Claret"}, {"t": "p", "x": "d’un gran amor vers el vostre Fill Jesús"}, {"t": "p", "x": "i l’inspiràreu la fundació de la Congregació de Missioners,"}, {"t": "p", "x": "per a salvar tots els homes,"}, {"t": "p", "x": "beneïu amb noves vocacions la Congregació Claretiana,"}, {"t": "p", "x": "i concediu-nos de perseverar fins a la fi"}, {"t": "p", "x": "en l'anunci de l'Evangeli."}, {"t": "p", "x": "Amén."}]}, {"id": "87", "num": "10.4", "title": "Pregària per a demanar al Senyor vocacions claretianes", "theme": "vocaciones", "sub": null, "tags": ["responsorial"], "lines": [{"t": "p", "x": "Senyor, per a continuar la gran obra de Sant Antoni Maria Claret en tot el món"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners."}, {"t": "p", "x": "Senyor, per a santificar els pobles cristians amb la predicació i altres treballs apostòlics,"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners."}, {"t": "p", "x": "Senyor, per a dur la llum de l'Evangeli als qui no us coneixen,"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners."}, {"t": "p", "x": "Senyor, per a instaurar el Regnat del Cor Immaculat de Maria,"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners."}, {"t": "p", "x": "Senyor, per tal que per mitjà del Cor Immaculat de Maria es compleixi sempre la vostra voluntat,"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners."}, {"t": "p", "x": "Senyor, perquè totes les persones siguin educades cristianament i tinguem una societat més justa i més humana, segons la vostra voluntat,"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners."}, {"t": "p", "x": "Jesús, primer Fills del Cor Immaculat de Maria,"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners"}, {"t": "p", "x": "Cor Immaculat de Maria, mare de tots els homes,"}, {"t": "r", "x": "Envieu-nos molts i sants Missioners."}, {"t": "rub", "x": "Oració:"}, {"t": "p", "x": "Pare nostre,"}, {"t": "p", "x": "que voleu que tots els homes se salvin"}, {"t": "p", "x": "i arribin al coneixement de la veritat,"}, {"t": "p", "x": "us preguem que envieu obrers als vostres sembrats"}, {"t": "p", "x": "i els concediu de predicar amb confiança la vostra Paraula,"}, {"t": "p", "x": "perquè la veritat es difongui i resplendeixi"}, {"t": "p", "x": "i tots els homes us coneguin a Vós, únic Déu veritable."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "88", "num": "10.5", "title": "Per les vocacions missioneres", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Oh Déu,"}, {"t": "p", "x": "que voleu que tots els homes se salvin"}, {"t": "p", "x": "i arribin al coneixement de la veritat,"}, {"t": "p", "x": "atraieu cap a Vós seguidors del vostre Fill,"}, {"t": "p", "x": "a l'estil de Sant Antoni Maria Claret,"}, {"t": "p", "x": "i envieu-los al camp del món"}, {"t": "p", "x": "perquè hi prediquin l'Evangeli a tota criatura,"}, {"t": "p", "x": "i el vostre poble, congregat per la Paraula de vida"}, {"t": "p", "x": "i sostingut per la força dels sagraments,"}, {"t": "p", "x": "camini per les sendes de la salvació i de l'amor."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "89", "num": "10.6", "title": "Oració per les vocacions i la perseverança", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Vós, Senyor, que heu dit que la collita és abundant, i els treballadors pocs,"}, {"t": "p", "x": "i voleu que es multipliqui el nombre d'apòstols i evangelitzadors"}, {"t": "p", "x": "que eixamplin el vostre Regne i transformin la faç de la terra;"}, {"t": "p", "x": "us preguem que augmenteu el nombre"}, {"t": "p", "x": "i la qualitat evangèlica dels qui treballen pel bé dels homes."}, {"t": "p", "x": "Us donem gràcies per les vocacions que ens heu concedit"}, {"t": "p", "x": "pel Cor Immaculat de Maria, la nostra Mare."}, {"t": "p", "x": "Concediu-nos la vostra presència i la vostra intercessió"}, {"t": "p", "x": "perquè vinguin moltes vocacions al nostre Institut,"}, {"t": "p", "x": "i ajudeu-nos a tots a perseverar en la nostra vocació."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "90", "num": "10.7", "title": "Per les vocacions a tots els estats de vida i ministeris", "theme": "vocaciones", "sub": null, "tags": ["responsorial"], "lines": [{"t": "p", "x": "Il·luminats i animats per la vostra Paraula,"}, {"t": "p", "x": "us demanem, Senyor, per tots aquells"}, {"t": "p", "x": "que ja han escoltat la vostra crida i l'han seguida."}, {"t": "r", "x": "Us preguem que ens escolteu."}, {"t": "p", "x": "Pel papa, els bisbes, preveres, diaques"}, {"t": "p", "x": "i pels missioners i tots els consagrats"}, {"t": "p", "x": "perquè visquin amb goig la seva vocació"}, {"t": "p", "x": "i amb la seva vida i la seva paraula us facin present enmig dels homes."}, {"t": "r", "x": "Us preguem que ens escolteu."}, {"t": "p", "x": "Pels laics i els seglars que"}, {"t": "p", "x": "treballen generosament en els ministeris"}, {"t": "p", "x": "instituïts per l'Església"}, {"t": "p", "x": "i en els serveis necessaris per a la comunitat."}, {"t": "r", "x": "Us preguem que ens escolteu."}, {"t": "p", "x": "Sosteniu-los en les dificultats,"}, {"t": "p", "x": "Conforteu-los en els sofriments,"}, {"t": "p", "x": "assistiu-los en la solitud,"}, {"t": "p", "x": "protegiu-los en la persecució"}, {"t": "p", "x": "i confirmeu-los en la fidelitat."}, {"t": "r", "x": "Us preguem que ens escolteu."}, {"t": "p", "x": "Us demanem, Senyor, per aquells"}, {"t": "p", "x": "que obren el seu cor a la vostra crida"}, {"t": "p", "x": "i es preparen per a seguir-la."}, {"t": "r", "x": "Us preguem que ens escolteu."}, {"t": "p", "x": "Que la vostra Paraula els il·lumini,"}, {"t": "p", "x": "la vostra persona els captivi,"}, {"t": "p", "x": "i el vostre Esperit els guiï fins a arribar"}, {"t": "p", "x": "a la professió religiosa o els ordes sagrats."}, {"t": "r", "x": "Us preguem que ens escolteu."}, {"t": "p", "x": "Sigueu per a ells, Senyor, suport ferm"}, {"t": "p", "x": "i feu que trobin qui els pugui"}, {"t": "p", "x": "aconsellar, acompanyar i ajudar"}, {"t": "p", "x": "amb la força de convicció i amor"}, {"t": "p", "x": "que només Vós podeu comunicar."}, {"t": "r", "x": "Us preguem que ens escolteu."}, {"t": "p", "x": "Us ho demanem per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "139b", "num": "10.8", "title": "Envieu, Senyor, el vostre Esperit", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Envieu, Senyor, el vostre Esperit"}, {"t": "p", "x": "sobre els cors dels vostres elegits"}, {"t": "p", "x": "per tal que, coneixent la vostra crida"}, {"t": "p", "x": "a la santedat i al servei,"}, {"t": "p", "x": "abracin el sacerdoci i la vida consagrada"}, {"t": "p", "x": "a fi que la vostra Església"}, {"t": "p", "x": "sigui testimoni de santedat i d’amor"}, {"t": "p", "x": "i la Bona Nova sigui predicada en tot el món."}, {"t": "p", "x": "Us ho demanem per Jesucrist, el vostre Fill,"}, {"t": "p", "x": "que viu i regna pels segles dels segles."}, {"t": "p", "x": "Amén."}]}, {"id": "183", "num": "11.1", "title": "Oració pel capítol (o durant la seva celebració)", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Veniu, oh Esperit Sant, ompliu el cor dels vostres fidels"}, {"t": "p", "x": "i enceneu-hi la flama del vostre amor."}, {"t": "r", "x": "Envieu el vostre Esperit i renaixerà la creació."}, {"t": "v", "x": "I renovareu la vida sobre la terra."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Oh Déu, que heu il·luminat el cor dels vostres fidels"}, {"t": "p", "x": "amb la claror de l'Esperit Sant,"}, {"t": "p", "x": "concediu-nos de fruir sempre de la llum de la seva veritat"}, {"t": "p", "x": "i de ser consolats amb els fruits de la seva presència."}, {"t": "p", "x": "Per Crist, Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "186", "num": "11.2", "title": "Oració pel capítol", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Oh Esperit Divinal,"}, {"t": "p", "x": "que enviat pel Pare en el nom de Jesús,"}, {"t": "p", "x": "assistiu i guieu infal·liblement la vostra Església,"}, {"t": "p", "x": "infoneu sobre el Capítol la plenitud dels vostres dons."}, {"t": "p", "x": "Oh Mestre dolç i Consolador,"}, {"t": "p", "x": "il·lumineu les ments dels Capitulars;"}, {"t": "p", "x": "feu que d'aquest Capítol brollin fruits abundants,"}, {"t": "p", "x": "nou vigor en el compromís de santificació i d’apostolat,"}, {"t": "p", "x": "sobretot en la difusió de la llum"}, {"t": "p", "x": "i de la força de l'Evangeli entre els homes."}, {"t": "p", "x": "Oh dolç hoste de les ànimes,"}, {"t": "p", "x": "confirmeu les ments en la veritat,"}, {"t": "p", "x": "disposeu a l'obediència el cor de tots"}, {"t": "p", "x": "a fi que les conclusions del Capítol"}, {"t": "p", "x": "trobin generós acolliment i total acompliment."}, {"t": "p", "x": "Renoveu en la nostra Congregació,"}, {"t": "p", "x": "i en cadascun de nosaltres,"}, {"t": "p", "x": "l'esperit que animà Sant Antoni Maria Claret, el nostre Pare."}, {"t": "p", "x": "Concediu-nos, que,"}, {"t": "p", "x": "reunits en unànime i intensa pregària,"}, {"t": "p", "x": "entorn del Cor de Maria, la nostra Mare,"}, {"t": "p", "x": "procurem sempre i únicament"}, {"t": "p", "x": "la major glòria de Déu i la salvació de les ànimes."}, {"t": "p", "x": "Amén."}]}, {"id": "187", "num": "11.3", "title": "Pregàries pel capítol", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor i Pare nostre,"}, {"t": "p", "x": "per la intercessió de Maria,"}, {"t": "p", "x": "Mare i Fundadora de la nostra Congregació,"}, {"t": "p", "x": "envieu-nos el vostre Esperit"}, {"t": "p", "x": "per a sentir-nos empesos com el vostre Fill Jesús"}, {"t": "p", "x": "per l'amor a Vós i als homes,"}, {"t": "p", "x": "per a tenir ulls penetrants i oïdes atentes"}, {"t": "p", "x": "a les urgències del món,"}, {"t": "p", "x": "mantenir la unitat per damunt de les diferències,"}, {"t": "p", "x": "congregats en la mateixa comunitat"}, {"t": "p", "x": "i realitzant la missió que hem rebut"}, {"t": "p", "x": "a través de Sant Antoni Maria Claret, el nostre Pare."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles."}, {"t": "p", "x": "Amén."}]}, {"id": "188", "num": "11.4", "title": "Pregària pel XXVII capítol general", "theme": "capitulos", "sub": null, "tags": ["XXVII capítol"], "lines": [{"t": "p", "x": "Veniu, Esperit Sant,"}, {"t": "p", "x": "alè del Pare"}, {"t": "p", "x": "i foc viu del Fill ressuscitat:"}, {"t": "p", "x": "renoveu la nostra Congregació."}, {"t": "p", "x": "Feu de la preparació del Capítol General"}, {"t": "p", "x": "un temps de gràcia, escolta i discerniment."}, {"t": "p", "x": "Vesseu sobre nosaltres una nova Pentecosta"}, {"t": "p", "x": "perquè puguem caminar junts en comunió,"}, {"t": "p", "x": "com a missioners místics i profètics"}, {"t": "p", "x": "al servei de l'única Missió de Crist."}, {"t": "p", "x": "Units a Maria, la nostra Mare,"}, {"t": "p", "x": "a Sant Antoni Maria Claret,"}, {"t": "p", "x": "i al testimoni fidel dels nostres màrtirs,"}, {"t": "p", "x": "ensenyeu-nos a escoltar la vostra veu en el crit dels pobres,"}, {"t": "p", "x": "en les ferides del món,"}, {"t": "p", "x": "i en la vida de les nostres comunitats."}, {"t": "p", "x": "Forgeu-nos a la Farga del Cor Immaculat de Maria"}, {"t": "p", "x": "perquè, guiats pel vostre Esperit,"}, {"t": "p", "x": "ens convertim en signes de fraternitat,"}, {"t": "p", "x": "d'esperança i foc missioner"}, {"t": "p", "x": "per a l'Església i per al món."}, {"t": "p", "x": "Amén."}]}, {"id": "131", "num": "12.1", "title": "Veni, Sancte Spiritus", "theme": "reuniones", "sub": "Per començar", "tags": ["Esperit Sant"], "lines": [{"t": "p", "x": "Veniu, Esperit Sant, ompliu els cors dels vostres fidels"}, {"t": "p", "x": "i enceneu-hi el foc del vostre amor."}, {"t": "v", "x": "Envieu el vostre Esperit i seran creats."}, {"t": "r", "x": "I renovareu la faç de la terra."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Oh Déu,"}, {"t": "p", "x": "que heu il·luminat els cors dels vostres fidels"}, {"t": "p", "x": "amb la llum de l'Esperit Sant;"}, {"t": "p", "x": "feu-nos sempre dòcils a aquest mateix Esperit,"}, {"t": "p", "x": "perquè puguem fer sempre el bé"}, {"t": "p", "x": "i gaudir del seu consol."}, {"t": "p", "x": "Per Crist Senyor nostre. Amén."}]}, {"id": "132", "num": "12.2", "title": "Reunits en el vostre nom", "theme": "reuniones", "sub": "Per començar", "tags": [], "lines": [{"t": "p", "x": "Senyor, ara que ens reunim en nom vostre,"}, {"t": "p", "x": "volem estar a la vostra presència;"}, {"t": "p", "x": "concediu-nos un esperit dialogant,"}, {"t": "p", "x": "il·lumineu les nostres ments amb la llum de la vostra veritat"}, {"t": "p", "x": "i enfortiu el nostre esperit fraternal"}, {"t": "p", "x": "perquè, sempre units, maldem per conèixer i fer la vostra voluntat."}, {"t": "p", "x": "Per Crist Senyor nostre. Amén."}]}, {"id": "133", "num": "12.3", "title": "Doneu-nos la saviesa (Sa 9,1-6.9-11)", "theme": "reuniones", "sub": "Per començar", "tags": [], "lines": [{"t": "p", "x": "Déu dels pares i Senyor misericordiós,"}, {"t": "p", "x": "que heu fet l’univers amb la vostra paraula,"}, {"t": "p", "x": "i amb la vostra saviesa heu format l'home,"}, {"t": "p", "x": "perquè sotmeti totes les criatures que han vingut a l’existència,"}, {"t": "p", "x": "perquè governi el món de manera santa i justa,"}, {"t": "p", "x": "i administri la justícia amb rectitud de cor."}, {"t": "p", "x": "Doneu-me la Saviesa que seu amb vós en el vostre tron."}, {"t": "p", "x": "No em tingueu per indigne de ser comptat entre els vostres fills,"}, {"t": "p", "x": "perquè jo sóc el vostre servent, fill de la vostra serventa,"}, {"t": "p", "x": "home feble i de curta durada,"}, {"t": "p", "x": "poc intel·ligent per a exercir la justícia i aplicar les lleis."}, {"t": "p", "x": "Ja que, per molt madur que sigui un home, el tindran per no res si li manca la Saviesa que ve de Vós."}, {"t": "p", "x": "Amb Vós hi ha la saviesa, que coneix les vostres obres,"}, {"t": "p", "x": "I era present quan creàveu el món."}, {"t": "p", "x": "Ella sap què us complau"}, {"t": "p", "x": "què és conforme als vostres manaments."}, {"t": "p", "x": "Envieu-la des de les altures santes del cel,"}, {"t": "p", "x": "feu-la baixar del vostre tron gloriós,"}, {"t": "p", "x": "perquè treballi fent-me costat i jo conegui allò que us plau."}, {"t": "p", "x": "Ella que ho sap tot i ho comprèn tot,"}, {"t": "p", "x": "em guiarà assenyadament en les meves empreses,"}, {"t": "p", "x": "i em guardarà en la seva presència gloriosa."}, {"t": "rub", "x": "Gloria al Pare."}]}, {"id": "134", "num": "12.4", "title": "Cercar i complir junts la voluntat de Déu", "theme": "reuniones", "sub": "Per començar", "tags": [], "lines": [{"t": "rub", "x": "Antífona:"}, {"t": "p", "x": "Diu el Senyor: on dos o tres estan reunits en el meu nom, jo estic enmig d'ells."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Déu i Pare nostre, el vostre Fill va prometre la seva presència"}, {"t": "p", "x": "a aquells que es reunissin en el seu nom:"}, {"t": "p", "x": "Feu que el sentim present ara entre nosaltres,"}, {"t": "p", "x": "que expressem la comunió de vida i missió"}, {"t": "p", "x": "de tot l'Institut,"}, {"t": "p", "x": "perquè caminem en una vida nova"}, {"t": "r", "x": "en obediència a l'Esperit"}, {"t": "p", "x": "i amb plena fidelitat al nostre carisma missioner -,"}, {"t": "p", "x": "i, una vegada coneguda la vostra voluntat,"}, {"t": "p", "x": "la complim amb un mateix sentir i voler"}, {"t": "p", "x": "per a realitzar la nostra comuna missió en l'Església."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "135", "num": "12.5", "title": "Gràcia i disposicions per al diàleg", "theme": "reuniones", "sub": "Per començar", "tags": ["discerniment", "diàleg"], "lines": [{"t": "p", "x": "Ens trobem aquí, Senyor,"}, {"t": "p", "x": "reunits en el vostre nom i desitjosos de dilatar el vostre Regne."}, {"t": "p", "x": "Que l'Esperit Sant que heu enviat als nostres cors"}, {"t": "p", "x": "i manté viva la vostra presència en nosaltres,"}, {"t": "p", "x": "ens ensenyi què hem de fer"}, {"t": "p", "x": "i vers on ens cal caminar"}, {"t": "p", "x": "per tal que, enfortits amb la vostra gràcia,"}, {"t": "p", "x": "puguem realitzar els vostres designis."}, {"t": "p", "x": "Sigueu Vós, Esperit Sant,"}, {"t": "p", "x": "l'inspirador i animador del nostre discerniment."}, {"t": "p", "x": "Ensenyeu-nos a escoltar els altres,"}, {"t": "p", "x": "a deixar-nos il·luminar per les seves llums;"}, {"t": "p", "x": "ensenyeu-nos a proposar i a no imposar;"}, {"t": "p", "x": "i feu que cerquem sempre la veritat."}, {"t": "p", "x": "Allibereu-nos de la ceguesa de qui creu que sempre té raó,"}, {"t": "p", "x": "dels favoritismes i de tota accepció de persones."}, {"t": "p", "x": "Uniu-nos a Vós perquè mai no ens apartem de la veritat."}, {"t": "p", "x": "Amén."}]}, {"id": "136", "num": "12.6", "title": "Llum per descobrir l'exigència de l'Evangeli", "theme": "reuniones", "sub": "Per començar", "tags": [], "lines": [{"t": "p", "x": "Mireu, Pare de bondat,"}, {"t": "p", "x": "a aquesta comunitat reunida en el vostre nom"}, {"t": "p", "x": "per compartir la fraternitat i dialogar en la veritat,"}, {"t": "p", "x": "concediu-li que descobreixi amb major claredat les exigències de l'Evangeli"}, {"t": "p", "x": "per a ser llum del món i sal de la terra."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "137", "num": "12.7", "title": "Oració per a iniciar una reunió", "theme": "reuniones", "sub": "Per començar", "tags": [], "lines": [{"t": "p", "x": "Senyor, que la vostra gràcia inspiri, sostingui i acompanyi les nostres obres,"}, {"t": "p", "x": "perquè el nostre treball comenci en Vós, com la seva font,"}, {"t": "p", "x": "i tendeixi sempre a Vós, com a la seva fi."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "138", "num": "12.8", "title": "Acció de gràcies per la trobada", "theme": "reuniones", "sub": "Per acabar", "tags": [], "lines": [{"t": "p", "x": "Pare de bondat,"}, {"t": "p", "x": "us donem gràcies per aquesta trobada"}, {"t": "p", "x": "en la que hem compartit les nostres il·lusions i desil·lusions,"}, {"t": "p", "x": "els nostres projectes i dificultats."}, {"t": "p", "x": "Feu que responguem sempre eficaçment"}, {"t": "p", "x": "a la nostra vocació i missió en l'Església,"}, {"t": "p", "x": "a imitació de Claret, el nostre Pare."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "139", "num": "12.9", "title": "Un sol cor i una sola ànima", "theme": "reuniones", "sub": "Per acabar", "tags": [], "lines": [{"t": "p", "x": "Senyor, us regraciem"}, {"t": "p", "x": "per aquesta trobada comunitària,"}, {"t": "p", "x": "per la vostra bondat i la vostra presència entre nosaltres,"}, {"t": "p", "x": "feu que amb esperit fraternal"}, {"t": "p", "x": "tinguem un sol cor i una sola ànima per a ser una comunitat"}, {"t": "p", "x": "evangelitzada i evangelitzadora."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "91", "num": "13.1", "title": "Pels germans que pateixen malaltia", "theme": "enfermos-difuntos", "sub": null, "tags": ["responsorial"], "lines": [{"t": "v", "x": "Mireu, Senyor, amb amor els nostres germans malalts."}, {"t": "r", "x": "Que esperen confiadament en Vós."}, {"t": "v", "x": "Assistiu-los amb la vostra bondat."}, {"t": "r", "x": "Consoleu els seus cors i alleugeriu-los els sofriments."}, {"t": "v", "x": "Escolteu, Pare, les seves oracions i súpliques."}, {"t": "r", "x": "I doneu-los força i pau per a complir la vostra voluntat."}, {"t": "v", "x": "Feu que els malalts es recordin sempre de Vós."}, {"t": "r", "x": "I en les hores de vetlla i insomni meditin en Vós."}, {"t": "v", "x": "Perquè heu estat el seu auxili."}, {"t": "r", "x": "Que perseverin sempre units a Vós."}, {"t": "v", "x": "Recordeu-vos, Pare, de tots els homes i dones que sofreixen."}, {"t": "r", "x": "Reconforteu-los i feu que ens en sentim solidaris, ajudant-los i assistint-los amb amor."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Us demanem, Pare de bondat, que alleugeriu el dolor dels nostres germans malalts,"}, {"t": "p", "x": "guariu la seva malaltia, aviveu la seva esperança,"}, {"t": "p", "x": "reconforteu-los i consoleu-los amb la vostra gràcia,"}, {"t": "p", "x": "per tal que, restablerts segons la vostra voluntat i misericòrdia,"}, {"t": "p", "x": "s'incorporin novament a la vida de la comunitat i al servei de l'Evangeli"}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}, {"t": "rub", "x": "O bé:"}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Vós volguéreu, Pare de bondat,"}, {"t": "p", "x": "que el vostre Fill suportés les nostres febleses,"}, {"t": "p", "x": "per palesar el valor de la malaltia i de la paciència;"}, {"t": "p", "x": "escolteu les pregàries que us adrecem"}, {"t": "p", "x": "pels nostres germans malalts de la Congregació,"}, {"t": "p", "x": "i concediu a tots els qui es troben sotmesos al dolor, l'aflicció o la malaltia"}, {"t": "p", "x": "la gràcia d'unir-se a la passió de Crist per a la redempció del món."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}, {"t": "rub", "x": "O bé:"}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Déu i Senyor nostre,"}, {"t": "p", "x": "salvació de tots els qui creuen en Vós,"}, {"t": "p", "x": "escolteu les oracions que us dirigim pels nostres germans malalts de la Congregació (comunitat),"}, {"t": "p", "x": "alleugeu-los amb l'auxili de la vostra misericòrdia"}, {"t": "p", "x": "per tal que, recuperada la salut, puguin servir-vos en la realització del vostre Regne."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "92", "num": "13.2", "title": "Pels nostres germans malalts", "theme": "enfermos-difuntos", "sub": null, "tags": ["responsorial"], "lines": [{"t": "v", "x": "Salveu, Senyor els vostres servents,"}, {"t": "r", "x": "Que esperen en Vós."}, {"t": "v", "x": "Envieu-los el vostre auxili des del Santuari."}, {"t": "r", "x": "I protegiu-los des de Sió."}, {"t": "v", "x": "Sigueu el seu baluard, Senyor,"}, {"t": "r", "x": "Enfront de l'enemic"}, {"t": "v", "x": "Concediu-los la vostra fortalesa,"}, {"t": "r", "x": "En el llit del dolor"}, {"t": "v", "x": "Senyor, escolteu la nostra pregària."}, {"t": "r", "x": "I el nostre clam arribi a Vós."}, {"t": "v", "x": "El Senyor sigui amb vosaltres."}, {"t": "r", "x": "I amb el vostre esperit."}, {"t": "rub", "x": "Preguem:"}, {"t": "p", "x": "Oh Déu,"}, {"t": "p", "x": "que sempre us compadiu i perdoneu,"}, {"t": "p", "x": "acolliu la nostra pregària"}, {"t": "p", "x": "per tal que la vostra pietat misericordiosa ens absolgui benignament"}, {"t": "p", "x": "a nosaltres i als vostres servents malalts."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}, {"t": "rub", "x": "O bé:"}, {"t": "p", "x": "Oh Déu, empara singular de la debilitat humana,"}, {"t": "p", "x": "mostreu la força del vostre auxili sobre els vostres servents malalts,"}, {"t": "p", "x": "perquè, ajudats per la vostra misericòrdia, puguin novament presentar-se restablerts davant la vostra Església."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}, {"t": "rub", "x": "O bé:"}, {"t": "p", "x": "Us demanem, Senyor,"}, {"t": "p", "x": "que nosaltres, els vostres servents, gaudim sempre de salut"}, {"t": "p", "x": "en el cos i l’esperit"}, {"t": "p", "x": "i, per la intercessió de la sempre Verge Maria,"}, {"t": "p", "x": "allibereu-nos de les tristeses de la vida present i doneu-nos l’alegria de la vida futura."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "s-n", "num": "13.3", "title": "Oració pels claretians difunts", "theme": "enfermos-difuntos", "sub": "Difunts", "tags": [], "lines": [{"t": "p", "x": "Oh Déu, que manteniu l'esperança de la nostra felicitat futura,"}, {"t": "p", "x": "en el misteri pasqual del vostre Fill,"}, {"t": "p", "x": "us supliquem humilment, que"}, {"t": "p", "x": "tots els qui a la terra participaren de la nostra fraternitat claretiana"}, {"t": "p", "x": "i esmerçaren la seva vida en la propagació del Regne,"}, {"t": "p", "x": "arribin al goig de la felicitat eterna amb els estadants de la pàtria celestial."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "95", "num": "13.4", "title": "Oració pels pares difunts", "theme": "enfermos-difuntos", "sub": "Difunts", "tags": [], "lines": [{"t": "p", "x": "Oh Déu, que ens heu manat honorar pare i mare,"}, {"t": "p", "x": "tingueu misericòrdia dels nostres pares:"}, {"t": "p", "x": "perdoneu els seus pecats i feu que ens reunim"}, {"t": "p", "x": "un dia amb ells en la claror de la vostra glòria."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "96", "num": "13.5", "title": "Oració pels familiars i benefactors", "theme": "enfermos-difuntos", "sub": "Difunts", "tags": [], "lines": [{"t": "p", "x": "Oh Déu, que pel misteri pasqual del vostre Fill"}, {"t": "p", "x": "manteniu l'esperança de la nostra resurrecció,"}, {"t": "p", "x": "us demanem humilment"}, {"t": "p", "x": "que tots els qui van participar a la terra"}, {"t": "p", "x": "de la nostra fraternitat claretiana"}, {"t": "p", "x": "i van col·laborar en la nostra missió d'anunciar l'Evangeli"}, {"t": "p", "x": "arribin al goig de la felicitat eterna."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "97", "num": "13.6", "title": "Oració pels germans, parents i benefactors", "theme": "enfermos-difuntos", "sub": "Difunts", "tags": [], "lines": [{"t": "p", "x": "Oh Déu que concediu el perdó dels pecats"}, {"t": "p", "x": "i voleu la salvació dels homes:"}, {"t": "p", "x": "per intercessió de Santa Maria Verge i de tots els sants,"}, {"t": "p", "x": "concediu als nostres germans, parents i benefactors"}, {"t": "p", "x": "que han sortit ja d'aquest món"}, {"t": "p", "x": "arribar a l'eterna benaurança."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "p", "x": "Amén."}]}, {"id": "201", "num": "14.1", "title": "Festes de la Verge Maria", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Alegreu-vos, Maria, plena de gràcia. El Senyor és amb vós."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor Jesús, que per intercessió de la vostra Mare a Canà de Galilea"}, {"t": "p", "x": "vàreu convertir l'aigua en vi,"}, {"t": "p", "x": "beneïu aquests aliments que anem a prendre,"}, {"t": "p", "x": "i concediu-nos, en recordar avui la Verge Maria,"}, {"t": "p", "x": "de posar-nos, com ella, al servei del vostre pla de salvació per a tots els homes."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles."}, {"t": "r", "x": "Amén."}]}, {"id": "202", "num": "14.2", "title": "Sant Josep (19 març / 1 maig)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "El Senyor el va estimar perquè fou l’home just"}, {"t": "p", "x": "i va donar el cent per u en el seu treball."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Déu provident, que confiàreu a la fidel custòdia"}, {"t": "p", "x": "de Sant Josep el vostre Fill Unigènit i la seva Mare, Maria,"}, {"t": "p", "x": "beneïu el pa fruit de la nostra suor i concediu-nos"}, {"t": "p", "x": "treballar sense descans en l'extensió del vostre Regne."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "203", "num": "14.3", "title": "Festa del Cor de Maria", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Us donem gràcies, Senyor, i us beneïm"}, {"t": "p", "x": "pel do inestimable d'anomenar-nos i ser de veritat “Fills del Cor Immaculat de Maria”."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor, Déu nostre,"}, {"t": "p", "x": "que us heu dignat convocar-nos en la Congregació,"}, {"t": "p", "x": "fent-nos fills del Cor Immaculat de la vostra Mare,"}, {"t": "p", "x": "concediu-nos de viure intensament la pietat filial a Maria"}, {"t": "p", "x": "i beneïu-nos ara que ens trobem reunits entorn d'aquesta taula"}, {"t": "p", "x": "en la qual expressem i compartim la nostra fraternitat"}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "204", "num": "14.4", "title": "Santa Caterina de Siena (29 abril)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Us lloem, Senyor, perquè en Santa Caterina de Siena"}, {"t": "p", "x": "ens doneu una mostra del vostre poder i de la vostra saviesa."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor Déu nostre,"}, {"t": "p", "x": "que inflamàreu d'amor a Vós i a l'Església"}, {"t": "p", "x": "santa Caterina de Siena,"}, {"t": "p", "x": "en beneir ara els aliments que anem a prendre,"}, {"t": "p", "x": "concediu-nos que ens mantinguem sempre en la vostra presència"}, {"t": "p", "x": "i que siguem agents de comunió en la vostra Església."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "205", "num": "14.5", "title": "Festes dels apòstols (I)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Beneït sigueu, Jesús, enviat i testimoni del Pare."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Beneït sigueu, Senyor, pels fruits de la terra i del treball de l'home:"}, {"t": "p", "x": "que ajudin a aquesta comunitat de vida apostòlica a mantenir-se fidel en el vostre sant servei."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "206", "num": "14.6", "title": "Festes dels apòstols (II)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Us lloem i beneïm, Crist,"}, {"t": "p", "x": "que perllongueu la vostra presència i la vostra Paraula en el món"}, {"t": "p", "x": "per mitjà dels apòstols."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor"}, {"t": "p", "x": "Senyor Jesús, que ens envieu com enviàreu els Apòstols"}, {"t": "p", "x": "a predicar la Bona Nova del Regne,"}, {"t": "p", "x": "beneïu aquests aliments que anem a prendre"}, {"t": "p", "x": "i feu-nos ministres idonis de la vostra Paraula, apòstols incansables del vostre Regne."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles"}, {"t": "r", "x": "Amén."}]}, {"id": "207", "num": "14.7", "title": "Festes dels apòstols (III)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Senyor Jesús, esperat pels profetes"}, {"t": "p", "x": "i anunciat pels Apòstols i evangelistes:"}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor"}, {"t": "p", "x": "Senyor Jesús, que per amor al Pare i als germans,"}, {"t": "p", "x": "us vàreu lliurar als treballs i fins i tot a la mort"}, {"t": "p", "x": "i féreu dels Apòstols testimonis de la vostra vida i la vostra resurrecció,"}, {"t": "p", "x": "beneïu aquesta taula nostra, i doneu-nos el goig de la vostra presència viva entre nosaltres."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles"}, {"t": "r", "x": "Amén."}]}, {"id": "208", "num": "14.8", "title": "Festes dels apòstols (IV)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Senyor Jesús, que elegíreu els Apòstols."}, {"t": "p", "x": "perquè estiguessin amb Vós i per a enviar-los a predicar:"}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor"}, {"t": "p", "x": "Vós, Senyor, que confiàreu als Apòstols"}, {"t": "p", "x": "l'anar per tot el món predicant la Bona Nova,"}, {"t": "p", "x": "i a nosaltres ens heu cridat a una vida plenament apostòlica,"}, {"t": "p", "x": "beneïu la nostra taula i feu-nos participar un dia en el banquet del vostre Regne."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles"}, {"t": "r", "x": "Amén."}]}, {"id": "209", "num": "14.9", "title": "Aniversari de la fundació (16 juliol)", "theme": "mesa", "sub": null, "tags": ["benedicció", "aniversari"], "lines": [{"t": "p", "x": "Beneïm al Senyor, que ha suscitat en l'Església"}, {"t": "p", "x": "la nostra Congregació de Missioners."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor Déu nostre que,"}, {"t": "p", "x": "per a la vostra major glòria, la nostra santificació i la salvació dels homes,"}, {"t": "p", "x": "fundàreu la nostra Congregació amb una intervenció especial de la Verge Maria i per mitjà de Sant Antoni Maria Claret,"}, {"t": "p", "x": "en donar-vos gràcies per aquests aliments amb què avui ens beneïu,"}, {"t": "p", "x": "us demanem que ens concediu de ser cada dia més fidels a la vostra crida,"}, {"t": "p", "x": "segons el nostre carisma missioner en l'Església."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "210", "num": "14.10", "title": "Sant Ignasi de Loiola (31 juliol)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Glorifiquem i lloem el Senyor"}, {"t": "p", "x": "que ho disposa tot per al bé dels qui estima."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor, Déu nostre, que heu suscitat en la vostra Església"}, {"t": "p", "x": "Sant Ignasi de Loiola per estendre pel món"}, {"t": "p", "x": "la glòria del vostre nom:"}, {"t": "p", "x": "beneïu aquests aliments i doneu-nos fam i set de justícia"}, {"t": "p", "x": "per cercar en tot la vostra major glòria"}, {"t": "p", "x": "i la salvació dels nostres germans."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "211", "num": "14.11", "title": "Sant Alfons Maria de Liguori (1 agost)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Els sants són els amics de Déu"}, {"t": "p", "x": "que donen testimoni de la santedat divina."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor, Déu nostre,"}, {"t": "p", "x": "que heu fet de Sant Alfons Maria de Liguori"}, {"t": "p", "x": "un savi i fervent predicador de la vostra Paraula:"}, {"t": "p", "x": "vesseu la vostra benedicció sobre nosaltres"}, {"t": "p", "x": "en compartir els aliments que ens han preparat"}, {"t": "p", "x": "com a signe de la nostra mateixa fe i de la nostra missió apostòlica."}, {"t": "p", "x": "Feu, també, que compartim amb els necessitats"}, {"t": "p", "x": "la vostra divina Paraula i els béns amb què ens beneïu."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "212", "num": "14.12", "title": "Beats Màrtirs de Barbastre (13 agost)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Senyor Jesús, que ens heu permès de ser batejats amb el vostre baptisme"}, {"t": "p", "x": "i ens heu concedit de poder beure el calze que el Pare us ha donat:"}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor que heu donat la fe als profetes i als Apòstols,"}, {"t": "p", "x": "i als Màrtirs Claretians de Barbastre"}, {"t": "p", "x": "la generositat en el seu lliurament a Vós fins al martiri:"}, {"t": "p", "x": "enfortiu el nostre cos amb els aliments que anem a prendre"}, {"t": "p", "x": "i infoneu-nos la fortalesa necessària per viure sempre de la fe"}, {"t": "p", "x": "i entregats al vostre servei."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "213", "num": "14.13", "title": "Sants Arcàngels, Àngels Custodis (29 set / 2 oct)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Amb el cor dels Àngels us lloem i beneïm, Senyor:"}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Senyor, Déu nostre, que ens assistiu sempre amb la vostra providència,"}, {"t": "p", "x": "beneïu la nostra taula, signe de la vostra generositat envers nosaltres."}, {"t": "p", "x": "I feu que no ens falti mai l'ajuda dels qui us serveixen al cel"}, {"t": "p", "x": "per a lloar-vos també nosaltres per tota l'eternitat."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "214", "num": "14.14", "title": "Santa Teresa de Jesús (15 octubre)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "El nostre esperit, Senyor, té set de Vós, com terra agostada i sense aigua."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Oh Déu, que heu suscitat en la vostra Església Santa Teresa de Jesús"}, {"t": "p", "x": "i per ella ens heu mostrat un camí de perfecció:"}, {"t": "p", "x": "feu que ens delim, no només per l'aliment corporal,"}, {"t": "p", "x": "sinó també pel pa diari de la vostra Paraula i del vostre Cos"}, {"t": "p", "x": "per tal de realitzar eficaçment la nostra santificació"}, {"t": "p", "x": "en l'anunci del vostre Regne segons el nostre carisma en l'Església."}, {"t": "p", "x": "Per Crist Senyor nostre."}, {"t": "r", "x": "Amén."}]}, {"id": "215", "num": "14.15", "title": "Sant Antoni Maria Claret (24 octubre)", "theme": "mesa", "sub": null, "tags": ["benedicció"], "lines": [{"t": "p", "x": "Beneït sigueu Senyor Jesús,"}, {"t": "p", "x": "Fill i Enviat del Pare."}, {"t": "r", "x": "Beneït sigueu per sempre, Senyor."}, {"t": "p", "x": "Beneïu, Senyor, aquests aliments que anem a prendre"}, {"t": "p", "x": "i infoneu en nosaltres el mateix esperit"}, {"t": "p", "x": "que va animar Sant Antoni Maria Claret, el nostre Pare,"}, {"t": "p", "x": "perquè, esperonats per ell,"}, {"t": "p", "x": "estiguem sempre disposats a proclamar la vostra Paraula"}, {"t": "p", "x": "i a donar la vida pels germans."}, {"t": "p", "x": "Vós que viviu i regneu pels segles dels segles."}, {"t": "r", "x": "Amén."}]}],

    dades: [{"id": "1", "num": "1.1", "title": "Preghiera apostolica", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore e mio Padre,"}, {"t": "p", "x": "che io ti conosca e ti faccia conoscere,"}, {"t": "p", "x": "ti ami e ti faccia amare,"}, {"t": "p", "x": "ti serva e ti faccia servire,"}, {"t": "p", "x": "ti lodi e ti faccia lodare da"}, {"t": "p", "x": "tutte le creature."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "(Sant’Antonio M. Claret)"}]}, {"id": "2", "num": "1.2", "title": "Provvidenza di Dio", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Sii benedetto per la tua provvidenza, Signore,"}, {"t": "p", "x": "e per la cura che sempre e in ogni luogo"}, {"t": "p", "x": "hai avuto di me."}, {"t": "p", "x": "Amen."}]}, {"id": "3", "num": "1.3", "title": "Amare e servire Dio", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Sii benedetto, o Signore, per il tuo amore e la tua misericordia per me. Ch’io ti ami e ti serva."}, {"t": "p", "x": "Ch’io ti faccia amare e servire da tutte le creature."}, {"t": "p", "x": "Amen."}]}, {"id": "4", "num": "1.4", "title": "Richiesta del dono dell’amore", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Fuoco che sempre bruci e mai ti estingui,"}, {"t": "p", "x": "amore che sempre ardi e mai ti plachi,"}, {"t": "p", "x": "infiammami, perché io t’ami."}, {"t": "p", "x": "Ti amo, Gesù, con tutto il mio cuore,"}, {"t": "p", "x": "con tutta la mia anima, con tutte le mie forze."}, {"t": "p", "x": "Vorrei amarti più ancora, vorrei che tutti ti amassero."}, {"t": "p", "x": "Vorrei amarti per me e per tutte le tue creature."}, {"t": "p", "x": "Vergine Santissima, concedimi la grazia"}, {"t": "p", "x": "che tutti si salvino e che nessuno sia condannato."}, {"t": "p", "x": "Amen."}]}, {"id": "5", "num": "1.5", "title": "Unione con Dio", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Come l’acqua nell’eucaristia si unisce al vino,"}, {"t": "p", "x": "così, Signore, desidero unirmi a Te; e con Te, offrirmi"}, {"t": "p", "x": "alla Santissima Trinità."}, {"t": "p", "x": "Amen."}]}, {"id": "6", "num": "1.6", "title": "Dio Padre, vita, amore e speranza", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signor mio, Tu sei mio amore, mio onore,"}, {"t": "p", "x": "mia speranza, mio rifugio."}, {"t": "p", "x": "Sei mia vita, mia gloria, mio fine,"}, {"t": "p", "x": "mio Maestro, mio Padre, mio amore."}, {"t": "p", "x": "Amen."}]}, {"id": "7", "num": "1.7", "title": "Dio provvidente e salvatore", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Grazie, Signore, per la tua bontà"}, {"t": "p", "x": "e perché ti avvali di ogni mezzo"}, {"t": "p", "x": "per la conversione dei peccatori."}, {"t": "p", "x": "Sia benedetta la tua provvidenza, che sempre veglia su me."}, {"t": "p", "x": "Canterò ora e sempre la tua eterna misericordia."}, {"t": "p", "x": "Amen."}]}, {"id": "8", "num": "1.8", "title": "Solo Dio", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Tu sei mio amore, Signore, mio onore,"}, {"t": "p", "x": "mia speranza e mio rifugio."}, {"t": "p", "x": "Tu sei mia gloria e mio fine. Mio Maestro e mio Padre."}, {"t": "p", "x": "Aiutami a non cercare altra cosa che Te,"}, {"t": "p", "x": "a non saper d’altro che della tua volontà, per compierla."}, {"t": "p", "x": "Amo solo Te, e in Te e per Te,"}, {"t": "p", "x": "ogni altra cosa."}, {"t": "p", "x": "Tu mi basti assolutamente."}, {"t": "p", "x": "Fa’ che io ti ami come Tu ami me,"}, {"t": "p", "x": "come vuoi che io ti ami."}, {"t": "p", "x": "Amen."}]}, {"id": "9", "num": "1.9", "title": "Tutto per la gloria di Dio", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Dio mio, voglio amarti"}, {"t": "p", "x": "con tutto il mio cuore, con tutto il mio essere,"}, {"t": "p", "x": "con tutte le mie forze:"}, {"t": "p", "x": "ti consacro i miei pensieri, i desideri,"}, {"t": "p", "x": "le parole e le azioni,"}, {"t": "p", "x": "ciò che possiedo, ciò che potrei possedere."}, {"t": "p", "x": "Fa’ che io usi ciò che possiedo"}, {"t": "p", "x": "per il tuo onore e per la tua gloria,"}, {"t": "p", "x": "secondo la tua volontà."}, {"t": "p", "x": "Amen."}]}, {"id": "10", "num": "1.10", "title": "Per poter seguire Gesù", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore, ti supplico:"}, {"t": "p", "x": "fragile qual sono, mandami il tuo Spirito,"}, {"t": "p", "x": "affinché m’illumini e mi accenda nel tuo amore,"}, {"t": "p", "x": "mi diriga e mi instradi sul cammino retto di Gesù Cristo"}, {"t": "p", "x": "e della Vergine Maria, Madre di Dio e Madre mia."}, {"t": "p", "x": "Amen."}]}, {"id": "11", "num": "1.11", "title": "Per chiedere le virtù", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Credo, Signore, ma che io creda più fermamente."}, {"t": "p", "x": "Spero, Signore, ma che io speri con più grande verità."}, {"t": "p", "x": "Amo, Signore, ma che io ami con più ardore."}, {"t": "p", "x": "Soffro, Signore, ma che il mio dolore sia più forte."}, {"t": "p", "x": "Ti supplico, Signore: che vuoi che io faccia?"}, {"t": "p", "x": "Insegnami a compiere la tua volontà: sii Tu il mio Dio."}, {"t": "p", "x": "Concedimi un cuore desto per guidare il tuo popolo,"}, {"t": "p", "x": "per distinguere tra il bene e il male."}, {"t": "p", "x": "Padre, concedimi umiltà, mansuetudine,"}, {"t": "p", "x": "castità, pazienza e carità."}, {"t": "p", "x": "Insegnami la bontà, la scienza e la disciplina."}, {"t": "p", "x": "Donami il tuo amore, la tua grazia,"}, {"t": "p", "x": "ed io sarò ricco in abbondanza."}, {"t": "p", "x": "Dio mio, Gesù mio, mio tutto."}, {"t": "p", "x": "Vivo sulla croce e sulla croce voglio morire,"}, {"t": "p", "x": "e spero di discendere dalla croce, non con le mie mani,"}, {"t": "p", "x": "ma aiutato da mani altrui,"}, {"t": "p", "x": "dopo essermi consumato in sacrificio."}, {"t": "p", "x": "Né mai mi accada, Signore, di gloriarmi d’altra cosa"}, {"t": "p", "x": "se non della croce di nostro Signore Gesù Cristo,"}, {"t": "p", "x": "per la quale il mondo è stato crocifisso per me"}, {"t": "p", "x": "ed io per il mondo."}, {"t": "p", "x": "Amen."}]}, {"id": "12", "num": "1.12", "title": "Esercizio d’amor di Dio", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Dio mio, sii Dio come sei, in eterno e per sempre:"}, {"t": "p", "x": "godo sapendo che Tu lo sei."}, {"t": "p", "x": "Hai potere infinito:"}, {"t": "p", "x": "sii Dio Onnipotente come sei."}, {"t": "p", "x": "Hai sapienza infinita:"}, {"t": "p", "x": "sii lodato;"}, {"t": "p", "x": "abbi sapienza infinita come hai."}, {"t": "p", "x": "Tu hai bontà infinita, carità infinita e infinita clemenza."}, {"t": "p", "x": "Abbi bontà, Signore,"}, {"t": "p", "x": "carità e clemenza infinita come hai."}, {"t": "p", "x": "Signore, Tu sei glorioso e benedetto senza fine:"}, {"t": "p", "x": "sii glorioso e benedetto come sei."}, {"t": "p", "x": "Tu sei Trino ed Uno, Signore,"}, {"t": "p", "x": "Padre, Figlio e Spirito Santo,"}, {"t": "p", "x": "tre Persone distinte e un solo vero Dio:"}, {"t": "p", "x": "sii Trino e Uno come sei."}, {"t": "p", "x": "Sei Salvatore e glorificatore nostro"}, {"t": "p", "x": "e di tutte le creature:"}, {"t": "p", "x": "sii lodato."}, {"t": "p", "x": "Tu, Signore, sei Signore universale"}, {"t": "p", "x": "che gli angeli amano, lodano e servono"}, {"t": "p", "x": "come i beati in cielo"}, {"t": "p", "x": "e gli uomini sulla terra;"}, {"t": "p", "x": "Tu sei il Signore di tutti"}, {"t": "p", "x": "e tutti ti amiamo nei cieli e sulla terra,"}, {"t": "p", "x": "tutti ti lodiamo e ti serviamo senza fine."}, {"t": "p", "x": "Cuore di Gesù, ama Dio per me."}, {"t": "p", "x": "Cuore di Maria, ama Dio per me."}, {"t": "p", "x": "Cuore di tutti i Santi, amate Dio per me."}, {"t": "p", "x": "Cori degli Angeli tutti amate Dio per me."}, {"t": "p", "x": "Creature tutte, amate Dio per me."}, {"t": "p", "x": "O fuoco divino che sempre ardi e mai ti appaghi."}, {"t": "p", "x": "O Cuore di Gesù che sempre bruci e mai ti plachi,"}, {"t": "p", "x": "fa’ che il mio cuore arda sempre"}, {"t": "p", "x": "nel fuoco del divino amore."}, {"t": "p", "x": "Amen."}]}, {"id": "13", "num": "2.1", "title": "Litania clarettiana di invocazioni a Maria", "theme": "corazon-maria", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Santa Maria, Figlia del Padre"}, {"t": "r", "x": "prega per noi"}, {"t": "p", "x": "Santa Maria, Madre del Figlio"}, {"t": "p", "x": "Santa Maria, Tempio dello Spirito Santo"}, {"t": "p", "x": "Termine e coronamento della Trinità"}, {"t": "p", "x": "Delizia di Dio"}, {"t": "p", "x": "Opera di Dio, la più perfetta"}, {"t": "p", "x": "Concepita in grazia"}, {"t": "p", "x": "Colei in cui brillano onnipotenza, sapienza e bontà di Dio"}, {"t": "p", "x": "Concepita in grazia, confermata in grazia e piena di grazia"}, {"t": "p", "x": "Esentata da ogni contagio di peccato"}, {"t": "p", "x": "Creatura singolarissima e prediletta"}, {"t": "p", "x": "Purificata e santificata nella sua stessa concezione"}, {"t": "p", "x": "Preservata da ogni colpa"}, {"t": "p", "x": "Erede del cielo"}, {"t": "p", "x": "Confermata in grazia"}, {"t": "p", "x": "Sublimata a dignità quasi infinita"}, {"t": "p", "x": "Piena di grazia"}, {"t": "p", "x": "La più pura e la più caritatevole"}, {"t": "p", "x": "Madre di Dio e degli uomini"}, {"t": "p", "x": "Madre di Dio fatto uomo"}, {"t": "p", "x": "Madre vera"}, {"t": "p", "x": "Madre spirituale"}, {"t": "p", "x": "Madre del bell’amore"}, {"t": "p", "x": "Madre della carità"}, {"t": "p", "x": "Madre della pietà e della misericordia"}, {"t": "p", "x": "Madre dei viventi"}, {"t": "p", "x": "Madre affettuosa"}, {"t": "p", "x": "Madre, maestra e guida"}, {"t": "p", "x": "Madre cui Dio ci donò come figli"}, {"t": "p", "x": "Formatrice e guida di apostoli e missionari"}, {"t": "p", "x": "Madre e avvocata dei peccatori"}, {"t": "p", "x": "Madre, sollievo, fortezza e consolazione"}, {"t": "p", "x": "Dispensatrice delle misericordie"}, {"t": "p", "x": "Canale di grazia"}, {"t": "p", "x": "Rifugio dei derelitti"}, {"t": "p", "x": "Stella polare dei naviganti"}, {"t": "p", "x": "Salute degli infermi"}, {"t": "p", "x": "Coraggio di chi muore"}, {"t": "p", "x": "Riscatto dei prigionieri"}, {"t": "p", "x": "Avvocata sempre disposta"}, {"t": "p", "x": "Consolazione degli afflitti"}, {"t": "p", "x": "Scala del cielo"}, {"t": "p", "x": "Finestra del paradiso"}, {"t": "p", "x": "Regina dei cieli e della terra"}, {"t": "p", "x": "Regina e Signora della grazia"}, {"t": "p", "x": "Cuore della Chiesa"}, {"t": "p", "x": "Cuore del mondo cristiano"}]}, {"id": "14", "num": "2.2", "title": "Supplica a Maria", "theme": "corazon-maria", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "O Vergine e Madre di Dio,"}, {"t": "p", "x": "rivolgi i tuoi occhi misericordiosi"}, {"t": "p", "x": "a noi che viviamo in questa valle di lacrime,"}, {"t": "p", "x": "e che in te, come figli, confidiamo."}, {"t": "p", "x": "Aiutaci ad annunziare la Buona Novella del Regno"}, {"t": "p", "x": "in fedeltà e con fortezza"}, {"t": "p", "x": "poiché molti vi si oppongono,"}, {"t": "p", "x": "per l’ambizione del potere, per l’affanno delle ricchezze,"}, {"t": "p", "x": "per l’ansia del piacere."}, {"t": "p", "x": "Disponi di me, perché nella missione apostolica"}, {"t": "p", "x": "io collabori con il tuo materno ufficio."}, {"t": "p", "x": "Amen."}]}, {"id": "15", "num": "2.3", "title": "Invocazioni a Maria", "theme": "corazon-maria", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Ave, o Maria Immacolata, Figlia di Dio Padre."}, {"t": "p", "x": "Ave, o Maria Immacolata, Madre di Dio Figlio."}, {"t": "p", "x": "Ave, o Maria Immacolata, Tempio di Dio, Spirito Santo."}, {"t": "p", "x": "Ave, o Maria, madre e avvocata dei peccatori."}, {"t": "p", "x": "Benedetta te fra tutte le donne."}, {"t": "p", "x": "Tu sei la gloria di Gerusalemme,"}, {"t": "p", "x": "la gioia di Israele e l’onore del nostro popolo."}, {"t": "p", "x": "Tu sei il rifugio dei peccatori,"}, {"t": "p", "x": "la consolazione degli afflitti, la stella polare dei naviganti."}, {"t": "p", "x": "Tu sei la salute degli infermi,"}, {"t": "p", "x": "il coraggio dei moribondi,"}, {"t": "p", "x": "la porta del cielo."}, {"t": "p", "x": "Tu sei, dopo il Signore frutto benedetto del tuo seno,"}, {"t": "p", "x": "ogni nostra speranza."}, {"t": "p", "x": "O clemente, o pia, o dolce Immacolata Maria."}, {"t": "p", "x": "Amen."}]}, {"id": "16", "num": "2.4", "title": "Madre del Divin Amore", "theme": "corazon-maria", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Maria, Madre mia, Madre del Divin Amore!"}, {"t": "p", "x": "Nulla posso chiederti che ti sia più gradito"}, {"t": "p", "x": "e più facile concedere"}, {"t": "p", "x": "che il Divino Amore."}, {"t": "p", "x": "Concedimelo, Madre mia. Madre mia, mio amore."}, {"t": "p", "x": "Madre mia, ho fame e sete di amore."}, {"t": "p", "x": "Soccorrimi, saziami."}, {"t": "p", "x": "O Cuore di Maria, fucina e strumento di amore,"}, {"t": "p", "x": "accendimi nell’amore di Dio e del prossimo."}, {"t": "p", "x": "Amen."}]}, {"id": "17", "num": "2.5", "title": "Figlio e ministro di Maria", "theme": "corazon-maria", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "O Vergine e Madre di Dio!,"}, {"t": "p", "x": "sai bene che siamo tuoi figli e tuoi ministri,"}, {"t": "p", "x": "da te stessa formati"}, {"t": "p", "x": "nella fucina della tua misericordia e del tuo amore."}, {"t": "p", "x": "Siamo come una freccia pronta nella tua mano potente."}, {"t": "p", "x": "Scagliaci, Madre nostra,"}, {"t": "p", "x": "contro tutto ciò che si oppone al Regno di Dio."}, {"t": "p", "x": "Fidenti nella tua protezione,"}, {"t": "p", "x": "annunciamo il Vangelo"}, {"t": "p", "x": "senza altre armi che la divina Parola,"}, {"t": "p", "x": "senza altri titoli che l’esser figli del tuo Cuore Immacolato."}, {"t": "p", "x": "La vittoria, Madre, sarà tua."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "b) DELLA CONGREGAZIONE"}]}, {"id": "18", "num": "2.6", "title": "Configurazione a Cristo", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore e Dio nostro,"}, {"t": "p", "x": "che hai scelto la sempre Vergine Maria"}, {"t": "p", "x": "come Madre del tuo Figlio e Madre nostra,"}, {"t": "p", "x": "fa’ che, fedeli al suo Cuore materno cui siamo consacrati,"}, {"t": "p", "x": "ci configuriamo più pienamente a Cristo"}, {"t": "p", "x": "e cooperiamo alla missione apostolica"}, {"t": "p", "x": "con il suo ufficio materno."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "19", "num": "2.7", "title": "Litanie della Vergine Maria", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "fondate sulle Costituzioni"}, {"t": "p", "x": "O Maria, noi, Figli del tuo Cuore Immacolato,"}, {"t": "p", "x": "per la tua fede obbediente e per il tuo ardente amore"}, {"t": "p", "x": "ti proclamiamo «beata»"}, {"t": "p", "x": "e ti invochiamo:"}, {"t": "v", "x": "Madre di Dio e Madre nostra."}, {"t": "r", "x": "Tu sei benedetta fra tutte le donne."}, {"t": "v", "x": "Madre di Gesù Cristo, Signore nostro, inviato dal Padre"}, {"t": "v", "x": "Madre del Verbo, fatto uomo per opera dello Spirito Santo"}, {"t": "v", "x": "Madre del Figlio, unto per evangelizzare i poveri"}, {"t": "v", "x": "Fondatrice, Patrona e Titolare della nostra Congregazione"}, {"t": "v", "x": "Prima discepola di Cristo"}, {"t": "v", "x": "Nostro Modello nella sequela di Cristo"}, {"t": "v", "x": "Prima fra i poveri del Signore"}, {"t": "v", "x": "Serva totalmente consacrata alla persona e all’opera"}, {"t": "p", "x": "del Figlio tuo"}, {"t": "v", "x": "Madre e Maestra dei missionari"}, {"t": "v", "x": "Formatrice di apostoli"}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Dio Padre nostro, ti ringraziamo"}, {"t": "p", "x": "per chiamarci e per essere Figli"}, {"t": "p", "x": "del Cuore Immacolato di Maria."}, {"t": "p", "x": "Fa’ che veneriamo con amore e fiducia la Madre nostra"}, {"t": "p", "x": "e che ci doniamo a Lei perché ci configuri a Cristo,"}, {"t": "p", "x": "così che cooperiamo col suo ufficio materno"}, {"t": "p", "x": "nella missione apostolica che ci hai affidato."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "20", "num": "2.8", "title": "Preghiera filiale e apostolica al Cuore di Maria", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "O Vergine e Madre di Dio!,"}, {"t": "p", "x": "mi dono a Te come tuo figlio e tuo ministro."}, {"t": "p", "x": "Mi consacro al tuo amore materno"}, {"t": "p", "x": "perché Tu formi in me Gesù,"}, {"t": "p", "x": "il Figlio e l’Inviato del Padre,"}, {"t": "p", "x": "l’Unto dallo Spirito Santo"}, {"t": "p", "x": "per annunciare la Buona Novella ai poveri."}, {"t": "p", "x": "Insegnami a conservare, come Te, la Parola nel cuore,"}, {"t": "p", "x": "fino a trasformarmi in Vangelo vivo."}, {"t": "p", "x": "La forza dello Spirito"}, {"t": "p", "x": "faccia di me testimone di Cristo fra gli uomini."}, {"t": "p", "x": "Infondimi il tuo amore materno"}, {"t": "p", "x": "perché io riveli loro il Padre"}, {"t": "p", "x": "ed essi sentano la gioia di essere figli di Dio"}, {"t": "p", "x": "nella comunione fraterna della Chiesa."}, {"t": "p", "x": "Madre, ecco tuo figlio: formami."}, {"t": "p", "x": "Madre, ecco tuo figlio: inviami."}, {"t": "p", "x": "Madre, ecco tuo figlio: parla Tu in me, ama Tu in me."}, {"t": "p", "x": "Custodiscimi, e non sia che annunciando agli altri"}, {"t": "p", "x": "il Vangelo,"}, {"t": "p", "x": "io rimanga escluso dal tuo Regno."}, {"t": "p", "x": "In Te, Madre mia,"}, {"t": "p", "x": "ho posto tutta la mia fiducia."}, {"t": "p", "x": "Non resterò mai deluso."}, {"t": "p", "x": "Amen."}]}, {"id": "21", "num": "2.9", "title": "Litanie al Cuore di Maria", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore, pietà"}, {"t": "p", "x": "Cristo, pietà"}, {"t": "p", "x": "Signore, pietà"}, {"t": "p", "x": "Cristo, ascoltaci"}, {"t": "p", "x": "Cristo, esaudiscici"}, {"t": "p", "x": "Dio, Padre celeste"}, {"t": "r", "x": "Abbi pietà di noi"}, {"t": "p", "x": "Dio, Figlio Redentore del mondo"}, {"t": "p", "x": "Dio, Spirito Santo"}, {"t": "p", "x": "Santa Trinità, unico Dio"}, {"t": "p", "x": "Cuore di Maria, modellato dal Padre"}, {"t": "r", "x": "Prega per noi"}, {"t": "p", "x": "Cuore di Maria,"}, {"t": "p", "x": "adornato con tutti i doni dello Spirito Santo"}, {"t": "p", "x": "Cuore di Maria, che ami il Padre con amore di figlia"}, {"t": "p", "x": "Cuore di Maria, che ami il Figlio con amore di madre"}, {"t": "p", "x": "Cuore di Maria, che ami lo Spirito Santo con amore di sposa"}, {"t": "p", "x": "Cuore di Maria, che conservi"}, {"t": "p", "x": "fedelmente le parole e le azioni di Gesù"}, {"t": "p", "x": "Cuore di Maria, trapassato dalla spada del dolore"}, {"t": "p", "x": "Cuore di Maria, inchiodato sulla croce con Cristo crocifisso"}, {"t": "p", "x": "Cuore di Maria, vivificato dalla gioia della Resurrezione"}, {"t": "p", "x": "di Gesù"}, {"t": "p", "x": "Cuore di Maria, ricolmato di nuova pienezza di grazia"}, {"t": "p", "x": "nella discesa dello Spirito Santo"}, {"t": "p", "x": "Cuore di Maria, dimora di Dio, piena della sua gloria"}, {"t": "p", "x": "Cuore di Maria, arca dell’alleanza di Dio con gli uomini"}, {"t": "p", "x": "Cuore di Maria, grembo di Dio e degli uomini"}, {"t": "p", "x": "Cuore di Maria, che hai permesso la salvezza degli uomini"}, {"t": "p", "x": "Cuore di Maria, pieno di grazia"}, {"t": "p", "x": "Cuore di Maria, benedetto tra tutti i cuori"}, {"t": "p", "x": "Cuore di Maria, abisso di umiltà"}, {"t": "p", "x": "Cuore di Maria, trono di misericordia"}, {"t": "p", "x": "Cuore di Maria, fucina del divin amore"}, {"t": "p", "x": "Cuore di Maria, che meriti grazia per i peccatori"}, {"t": "p", "x": "Cuore di Maria, invincibile rocca di fede"}, {"t": "p", "x": "Cuore di Maria, fonte di perfetta amicizia"}, {"t": "p", "x": "Cuore di Maria, sostegno della Chiesa nel suo ritorno"}, {"t": "p", "x": "al Padre"}, {"t": "p", "x": "Cuore di Maria, fucina di amore che ci configura a Cristo"}, {"t": "p", "x": "Cuore di Maria, nostra Madre e formatrice"}, {"t": "p", "x": "Cuore di Maria, consolazione degli afflitti"}, {"t": "p", "x": "Cuore di Maria, rifugio dei peccatori"}, {"t": "p", "x": "Cuore di Maria, aiuto degli agonizzanti"}, {"t": "p", "x": "Cuore di Maria, speranza del mondo"}, {"t": "p", "x": "Cuore di Maria, padrona dei nostri cuori"}, {"t": "p", "x": "Cuore di Maria, regina della pace"}, {"t": "p", "x": "Agnello di Dio, che togli i peccati del mondo"}, {"t": "p", "x": "Perdonaci, Signore"}, {"t": "p", "x": "Agnello di Dio, che togli i peccati del mondo"}, {"t": "p", "x": "Ascoltaci, Signore"}, {"t": "p", "x": "Agnello di Dio, che togli i peccati del mondo"}, {"t": "p", "x": "Abbi pietà di noi"}, {"t": "v", "x": "Prega per noi, Santa Madre di Dio."}, {"t": "r", "x": "Perché siamo fatti degni delle promesse di Cristo."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Signore, Dio nostro"}, {"t": "p", "x": "che hai fatto del Cuore Immacolato di Maria"}, {"t": "p", "x": "una dimora per il tuo Figlio"}, {"t": "p", "x": "e il santuario dello Spirito Santo,"}, {"t": "p", "x": "donaci un cuore limpido e docile,"}, {"t": "p", "x": "affinché, sempre sottomessi alla tua volontà,"}, {"t": "p", "x": "ti amiamo sopra tutte le cose"}, {"t": "p", "x": "e aiutiamo i fratelli nelle loro necessità."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "22", "num": "2.10", "title": "Azione di grazie al Cuore di Maria", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Ti rendiamo grazie, Padre santo,"}, {"t": "p", "x": "perché hai dato alla Vergine Maria un cuore saggio e docile,"}, {"t": "p", "x": "sempre disposto a compiacerti;"}, {"t": "p", "x": "un cuore nuovo ed umile"}, {"t": "p", "x": "per fissarvi la legge della nuova Alleanza;"}, {"t": "p", "x": "un cuore semplice e limpido,"}, {"t": "p", "x": "che la rese degna di concepire candidamente il Figlio tuo"}, {"t": "p", "x": "e la rese capace di compiacerti in eterno;"}, {"t": "p", "x": "un cuore forte e disposto"}, {"t": "p", "x": "a sopportare con forza la spada del dolore"}, {"t": "p", "x": "e ad aspettare, gonfia di fede, la risurrezione del Figlio tuo."}, {"t": "p", "x": "Donaci un cuore sapiente e docile, nuovo ed umile,"}, {"t": "p", "x": "semplice e limpido, forte e disposto,"}, {"t": "p", "x": "perché sappiamo imitarla"}, {"t": "p", "x": "e cooperiamo con più grande fedeltà"}, {"t": "p", "x": "alla tua opera di salvezza."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "23", "num": "2.11", "title": "Atto di abbandono al Cuore di Maria", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Madre del Signore, o Cuore di Maria!"}, {"t": "p", "x": "Tu che hai presieduto come Fondatrice"}, {"t": "p", "x": "all’inizio della nostra Congregazione,"}, {"t": "p", "x": "sii sempre nostra ispiratrice,"}, {"t": "p", "x": "sii sempre il Cuore della nostra Congregazione,"}, {"t": "p", "x": "così bisognosa di contemplazione e di nuove speranze"}, {"t": "p", "x": "in questo mondo tanto amato dal Padre"}, {"t": "p", "x": "e così segnato dalla mancanza di fede e dall’ingiustizia;"}, {"t": "p", "x": "parla per noi"}, {"t": "p", "x": "e testimonia attraverso la nostra vita"}, {"t": "p", "x": "il messaggio del Regno."}, {"t": "p", "x": "Madre del Signore,"}, {"t": "p", "x": "prega perché venga a noi lo Spirito,"}, {"t": "p", "x": "che è spinta al mondo nuovo."}, {"t": "p", "x": "Col tuo Cuore, Madre, prega per noi!,"}, {"t": "p", "x": "intercedi per noi!"}, {"t": "p", "x": "Amen."}]}, {"id": "24", "num": "2.12", "title": "Offerta al Cuore di Maria", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Vergine Maria, Madre di Dio e Madre nostra:"}, {"t": "p", "x": "mi affido al tuo amore materno"}, {"t": "p", "x": "perché Tu faccia di me un missionario"}, {"t": "p", "x": "a immagine e somiglianza del tuo Figlio,"}, {"t": "p", "x": "l’Inviato del Padre,"}, {"t": "p", "x": "per annunciare la Buona Novella ai poveri."}, {"t": "p", "x": "Insegnami a credere, ad amare e a servire come Te."}, {"t": "p", "x": "Fammi generoso e grato"}, {"t": "p", "x": "per vivere nella gioia"}, {"t": "p", "x": "il dono della mia vocazione missionaria."}, {"t": "p", "x": "Amen."}]}, {"id": "25", "num": "2.13", "title": "Cuore di Maria", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore, Dio nostro,"}, {"t": "p", "x": "che hai scelto la sempre Vergine Maria,"}, {"t": "p", "x": "come Madre di tuo Figlio e Madre nostra:"}, {"t": "p", "x": "fa’ che per la fedele donazione al suo Cuore materno,"}, {"t": "p", "x": "ci configuriamo più pienamente a Cristo"}, {"t": "p", "x": "e, spinti dal suo amore,"}, {"t": "p", "x": "ci dedichiamo con più grande generosità"}, {"t": "p", "x": "a proclamare il Vangelo a tutti gli uomini."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "26 Madre e Maestra dei Missionari"}, {"t": "p", "x": "Maria, Madre e Maestra dei Missionari,"}, {"t": "p", "x": "intercedi presso il Padre"}, {"t": "p", "x": "affinché noi, figli del tuo Cuore,"}, {"t": "p", "x": "riproduciamo gli stessi atteggiamenti di Gesù"}, {"t": "p", "x": "e siamo uomini universali,"}, {"t": "p", "x": "dagli occhi penetranti e dalle orecchie attente"}, {"t": "p", "x": "ai bisogni del mondo."}, {"t": "p", "x": "Che noi siamo anche, come Te,"}, {"t": "p", "x": "uomini di misericordia,"}, {"t": "p", "x": "di tenerezza e compassione;"}, {"t": "p", "x": "che ci apriamo sempre a nuovi orizzonti missionari,"}, {"t": "p", "x": "disposti ad accettare ciò che è diverso."}, {"t": "p", "x": "E la carità apostolica che fluisce"}, {"t": "p", "x": "dalla fucina del tuo Cuore"}, {"t": "p", "x": "ci dia forza in ogni circostanza"}, {"t": "p", "x": "in cui lo Spirito ci collochi."}, {"t": "p", "x": "Amen."}]}, {"id": "27", "num": "2.14", "title": "Invocazione a Maria Madre della Chiesa", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Vergine Maria, Madre della Chiesa,"}, {"t": "p", "x": "la Chiesa noi ti raccomandiamo."}, {"t": "p", "x": "Ricordati di tutti i Tuoi figli;"}, {"t": "p", "x": "da’ forza alle loro orazioni davanti a Dio;"}, {"t": "p", "x": "mantieni solida la loro fede; fortifica la loro speranza"}, {"t": "p", "x": "e aumenta la loro carità."}, {"t": "p", "x": "Al tuo Cuore Immacolato noi raccomandiamo"}, {"t": "p", "x": "l’intero genere umano:"}, {"t": "p", "x": "conducilo al conoscimento dell’unico"}, {"t": "p", "x": "e vero salvatore, Gesù Cristo;"}, {"t": "p", "x": "allontanalo dal castigo del peccato;"}, {"t": "p", "x": "concedi a tutti la pace nella verità,"}, {"t": "p", "x": "nella giustizia, nella libertà e nell’amore."}, {"t": "p", "x": "E fa’ che tutta la Chiesa"}, {"t": "p", "x": "possa elevare al Dio delle misericordie"}, {"t": "p", "x": "un inno di lode, di gioia e di riconoscenza,"}, {"t": "p", "x": "perché grandi cose ha operato il Signore per tuo mezzo,"}, {"t": "p", "x": "o clemente, o pia, o dolce Vergine Maria."}, {"t": "p", "x": "Amen."}]}, {"id": "28", "num": "2.15", "title": "Giaculatorie", "theme": "corazon-maria", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Dolce Cuore di Maria"}, {"t": "r", "x": "Sii la salvezza mia."}, {"t": "p", "x": "Cuore di Maria"}, {"t": "r", "x": "Intercedi per noi."}, {"t": "p", "x": "Maria, cuore della Chiesa."}, {"t": "r", "x": "Prega per noi"}, {"t": "p", "x": "Madre e formatrice di apostoli"}, {"t": "r", "x": "Prega per noi"}, {"t": "p", "x": "Cuore fedele di Maria"}, {"t": "r", "x": "Intercedi per noi."}]}, {"id": "29", "num": "3.1", "title": "Fondatore e modello", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore, Dio nostro,"}, {"t": "p", "x": "che hai scelto S. Antonio Maria Claret"}, {"t": "p", "x": "come Fondatore della nostra Famiglia"}, {"t": "p", "x": "e hai voluto che, ardendo di carità,"}, {"t": "p", "x": "godesse degli delle calunnie e dei tormenti;"}, {"t": "p", "x": "concedi benigno che,"}, {"t": "p", "x": "aderendo fedelmente ai suoi insegnamenti,"}, {"t": "p", "x": "proclamiamo la tua gloria in ogni parte del mondo"}, {"t": "p", "x": "e ricerchiamo sempre e con sollecitudine"}, {"t": "p", "x": "la salvezza di tutti gli uomini."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "30", "num": "3.2", "title": "Fedeltà al suo spirito", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Dio Padre nostro,"}, {"t": "p", "x": "che hai concesso a S. Antonio Maria Claret"}, {"t": "p", "x": "un ardente e filiale amore al Santissimo Sacramento"}, {"t": "p", "x": "e al Cuore Immacolato di Maria"}, {"t": "p", "x": "per realizzare nella Chiesa di Dio"}, {"t": "p", "x": "grandi meraviglie per la gloria divina"}, {"t": "p", "x": "e per la salvezza delle anime:"}, {"t": "p", "x": "ottieni a noi che,"}, {"t": "p", "x": "a imitazione di lui ardendo"}, {"t": "p", "x": "negli stessi santi amori"}, {"t": "p", "x": "e continuando con la più grande efficacia"}, {"t": "p", "x": "la sua opera evangelizzatrice,"}, {"t": "p", "x": "meritiamo di vivere e morire nella Congregazione"}, {"t": "p", "x": "come Figli degni del Cuore Immacolato di Maria."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "31", "num": "3.3", "title": "Preghiera per continuare la sua opera", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore,"}, {"t": "p", "x": "che hai fatto di S. Antonio Maria Claret, nostro Padre,"}, {"t": "p", "x": "uno zelante apostolo della gloria di Dio"}, {"t": "p", "x": "e della salvezza degli uomini,"}, {"t": "p", "x": "concedici la stessa carità ardente"}, {"t": "p", "x": "che infiammava il suo cuore,"}, {"t": "p", "x": "affinché continuiamo con intensità ed efficacia"}, {"t": "p", "x": "la sua opera apostolica."}, {"t": "p", "x": "Fa’ che i suoi figli si moltiplichino"}, {"t": "p", "x": "per dilatare il Regno del Signore,"}, {"t": "p", "x": "e che nel momento della nostra morte"}, {"t": "p", "x": "meritiamo di essere riconosciuti «servi fedeli»"}, {"t": "p", "x": "di Cristo e del Vangelo."}, {"t": "p", "x": "Per lo stesso Gesù Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "157", "num": "4.1", "title": "Litanie di San Giuseppe", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore, pietà"}, {"t": "p", "x": "Cristo, pietà"}, {"t": "p", "x": "Signore, pietà"}, {"t": "p", "x": "Cristo, ascoltaci"}, {"t": "p", "x": "Cristo, esaudiscici"}, {"t": "p", "x": "Dio, Padre celeste"}, {"t": "r", "x": "abbi pietà di noi"}, {"t": "p", "x": "Figlio, Redentore del mondo, Dio"}, {"t": "p", "x": "Spirito Santo, Dio"}, {"t": "p", "x": "Santa Trinità, unico Dio"}, {"t": "p", "x": "Santa Maria"}, {"t": "r", "x": "prega per noi"}, {"t": "p", "x": "San Giuseppe"}, {"t": "p", "x": "Discendente illustre di Davide"}, {"t": "p", "x": "Luce dei patriarchi"}, {"t": "p", "x": "Sposo della Madre di Dio"}, {"t": "p", "x": "Casto custode della Vergine"}, {"t": "p", "x": "Educatore del Figlio di Dio"}, {"t": "p", "x": "Difensore diligente di Cristo"}, {"t": "p", "x": "Capo della Sacra Famiglia"}, {"t": "p", "x": "Giusepe giustissimo"}, {"t": "p", "x": "Giuseppe castissimo"}, {"t": "p", "x": "Giuseppe prudentissimo"}, {"t": "p", "x": "Giuseppe fortissimo"}, {"t": "p", "x": "Giuseppe obbedientissimo"}, {"t": "p", "x": "Giuseppe fedelissimo"}, {"t": "p", "x": "Specchio di pazienza"}, {"t": "p", "x": "Amante della povertà"}, {"t": "p", "x": "Esemplare lavoratore"}, {"t": "p", "x": "Onore della vita familiare"}, {"t": "p", "x": "Custode delle vergini"}, {"t": "p", "x": "Sostegno delle famiglie"}, {"t": "p", "x": "Consolazione degli afflitti"}, {"t": "p", "x": "Speranza degli infermi"}, {"t": "p", "x": "Patrono dei moribondi"}, {"t": "p", "x": "Protettore della Sacra Famiglia"}, {"t": "p", "x": "Agnello di Dio,"}, {"t": "p", "x": "che togli il peccato del mondo, perdonaci, Signore"}, {"t": "p", "x": "Agnello di Dio,"}, {"t": "p", "x": "che togli il peccato del mondo, ascoltaci, Signore"}, {"t": "p", "x": "Agnello di Dio,"}, {"t": "p", "x": "che togli il peccato del mondo,"}, {"t": "r", "x": "abbi pietà di noi"}, {"t": "v", "x": "Lo costituì signore della sua casa"}, {"t": "p", "x": "R. E lo mise a capo dei suo beni."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "O Dio, che nella tua ineffabile provvidenza ti sei degnato di scegliere San Giuseppe come sposo della Madre di tuo Figlio, concedi a noi che lo veneriamo sulla terra come protettore, di averlo come intercessore nel cielo. Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "PREGHIERE A SAN GIUSEPPE"}]}, {"id": "158", "num": "4.2", "title": "Beato Giuseppe", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Beato Giuseppe,"}, {"t": "p", "x": "per quell’amore che ti mantenne unito"}, {"t": "p", "x": "alla Vergine Madre di Dio"}, {"t": "p", "x": "e per l’amore paterno con cui curasti il Bambino Gesù,"}, {"t": "p", "x": "ti preghiamo umilmente di guardare"}, {"t": "p", "x": "alla famiglia del tuo Figlio,"}, {"t": "p", "x": "da lui acquistata a prezzo del suo sangue,"}, {"t": "p", "x": "e col tuo aiuto, soccorri, ti preghiamo, alle nostre necessità."}, {"t": "p", "x": "Allontana da noi ogni errore ed ogni peccato;"}, {"t": "p", "x": "assistici nella lotta contro il potere del male,"}, {"t": "p", "x": "e difendi la Santa Chiesa di Dio da ogni avversità;"}, {"t": "p", "x": "proteggi ciascuno di noi,"}, {"t": "p", "x": "affinché, col tuo esempio, e sostenuti dal tuo patrocinio,"}, {"t": "p", "x": "possiamo santamente vivere,"}, {"t": "p", "x": "piamente morire e conseguire la beatitudine eterna."}, {"t": "p", "x": "Amen."}]}, {"id": "159", "num": "4.3", "title": "Preghiera a San Giuseppe di Leone XIII", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "A te, o Beato Giuseppe,"}, {"t": "p", "x": "stretti dalla tribolazione ricorriamo,"}, {"t": "p", "x": "e, fiduciosi,"}, {"t": "p", "x": "invochiamo il tuo patrocinio"}, {"t": "p", "x": "con quello della tua santissima Sposa."}, {"t": "p", "x": "Per quel vincolo di carità"}, {"t": "p", "x": "che ti strinse all’Immacolata Vergine Maria, Madre di Dio,"}, {"t": "p", "x": "e per l’amore paterno che portasti al fanciullo Gesù,"}, {"t": "p", "x": "guarda, te ne preghiamo, con occhio benigno"}, {"t": "p", "x": "la cara eredità che Gesù Cristo acquistò col suo Sangue"}, {"t": "p", "x": "e col tuo potere ed aiuto sovvieni ai nostri bisogni."}, {"t": "p", "x": "Proteggi, o provvido custode della divina Famiglia,"}, {"t": "p", "x": "l’eletta prole di Gesù Cristo:"}, {"t": "p", "x": "allontana da noi, o Padre amatissimo,"}, {"t": "p", "x": "gli errori e i vizi che corrompono il mondo,"}, {"t": "p", "x": "assistici propizio dal cielo in questa lotta col potere del male,"}, {"t": "p", "x": "o nostro fortissimo protettore:"}, {"t": "p", "x": "e come un tempo salvasti dalla morte"}, {"t": "p", "x": "la minacciata vita del Bambino Gesù,"}, {"t": "p", "x": "così ora difendi la Santa Chiesa di Dio"}, {"t": "p", "x": "dalle ostili insidie e da ogni avversità;"}, {"t": "p", "x": "e copri ciascuno di noi con il tuo continuo patrocinio,"}, {"t": "p", "x": "affinché sul tuo esempio e col tuo soccorso"}, {"t": "p", "x": "possiamo virtuosamente vivere,"}, {"t": "p", "x": "piamente morire"}, {"t": "p", "x": "e conseguire l’eterna beatitudine in cielo."}, {"t": "p", "x": "Amen."}]}, {"id": "160", "num": "4.4", "title": "Preghiera a San Giuseppe di Giovanni XXIII", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "“O san Giuseppe, custode di Gesù, sposo castissimo di Maria,"}, {"t": "p", "x": "che hai trascorso la vita nell’adempimento perfetto del dovere,"}, {"t": "p", "x": "sostenendo con il lavoro delle tue mani"}, {"t": "p", "x": "la Sacra Famiglia di Nazaret,"}, {"t": "p", "x": "proteggi propizio noi tutti che, con fiducia, a te ci rivolgiamo."}, {"t": "p", "x": "Tu conosci le nostre aspirazioni,"}, {"t": "p", "x": "le nostre angustie,"}, {"t": "p", "x": "e le nostre speranze: e noi a te ricorriamo,"}, {"t": "p", "x": "perché sappiamo di trovare in te chi ci capisce e ci protegge."}, {"t": "p", "x": "Anche tu hai sperimentato la prova,"}, {"t": "p", "x": "la fatica, la stanchezza;"}, {"t": "p", "x": "ma, pure in mezzo alle preoccupazioni della vita materiale,"}, {"t": "p", "x": "il tuo animo ricolmo della più profonda pace,"}, {"t": "p", "x": "esultò di gioia indicibile per l’intimità con il Figlio di Dio,"}, {"t": "p", "x": "a te affidato, e con Maria, sua dolcissima Madre."}, {"t": "p", "x": "Fa’ che anche noi comprendiamo"}, {"t": "p", "x": "di non essere soli nel nostro lavoro,"}, {"t": "p", "x": "ma sappiamo scoprire Gesù accanto a noi,"}, {"t": "p", "x": "accoglierlo con la grazia, custodirlo fedelmente"}, {"t": "p", "x": "come tu hai fatto."}, {"t": "p", "x": "E ottieni che in ogni famiglia, in ogni officina,"}, {"t": "p", "x": "in ogni laboratorio, nella nostra Congregazione,"}, {"t": "p", "x": "ovunque un cristiano lavora,"}, {"t": "p", "x": "tutto sia santificato, nel
