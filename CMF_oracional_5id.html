, {"t": "p", "x": "para que todos los hombres acepten el Evangelio"}, {"t": "p", "x": "y te amen cada día más."}, {"t": "p", "x": "No permitas, Señor, que te ofendamos;"}, {"t": "p", "x": "presérvanos de todos los peligros y fortalécenos con tu gracia."}, {"t": "p", "x": "Amén."}]}, {"id": "76", "num": "8.5", "title": "Misioneros", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Señor,"}, {"t": "p", "x": "que nos llamas como a los Apóstoles,"}, {"t": "p", "x": "haz que nos esforcemos con todos nuestros medios y recursos"}, {"t": "p", "x": "por conseguir que seas amado, conocido y servido por todos."}, {"t": "p", "x": "Danos un corazón abierto"}, {"t": "p", "x": "para amar a todos los hombres sin excepción,"}, {"t": "p", "x": "procurándoles la bienaventuranza del Reino,"}, {"t": "p", "x": "que ya se ha iniciado en la tierra."}, {"t": "p", "x": "Que de todos los dones que creemos poseer,"}, {"t": "p", "x": "te demos únicamente a Ti la gloria,"}, {"t": "p", "x": "procurando hacerlos fructificar copiosamente,"}, {"t": "p", "x": "y recordemos nuestras propias limitaciones y defectos,"}, {"t": "p", "x": "reconociendo así nuestra total dependencia de Ti."}, {"t": "p", "x": "Que expresemos este convencimiento"}, {"t": "p", "x": "en nuestra forma de obrar y en nuestras relaciones con los demás,"}, {"t": "p", "x": "estando dispuestos a pedir perdón por nuestras faltas y equivocaciones."}, {"t": "p", "x": "Que busquemos prestar a nuestros hermanos"}, {"t": "p", "x": "los servicios de nuestro amor,"}, {"t": "p", "x": "de modo que cada uno de nosotros esté en medio de ellos como quien sirve."}, {"t": "p", "x": "Amén."}]}, {"id": "77", "num": "8.6", "title": "Misión Claretiana", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Padre santo,"}, {"t": "p", "x": "Tú llamaste a Antonio María Claret a seguir a tu Hijo,"}, {"t": "p", "x": "y él, urgido por su amor,"}, {"t": "p", "x": "entregó totalmente su vida a la lucha por su Causa: el Reino."}, {"t": "p", "x": "Despierta en nosotros su espíritu evangelizador"}, {"t": "p", "x": "para captar lo más urgente, oportuno y eficaz"}, {"t": "p", "x": "y realizar la misión de propagar la fe, dóciles al Espíritu,"}, {"t": "p", "x": "y obedientes a tu voluntad."}, {"t": "p", "x": "Animados, como Claret, por la fuerza de tu Espíritu,"}, {"t": "p", "x": "también nosotros queremos optar por la Causa del Reino"}, {"t": "p", "x": "y aceptar los riesgos de la denuncia y el compromiso profético"}, {"t": "p", "x": "que comporta nuestra misión evangelizadora."}, {"t": "p", "x": "Queremos solidarizarnos y compartir las angustias,"}, {"t": "p", "x": "las privaciones y las esperanzas de los hombres"}, {"t": "p", "x": "a los que somos enviados."}, {"t": "p", "x": "Y, a la vez que confesamos que tu Hijo está vivo entre los hombres,"}, {"t": "p", "x": "queremos trabajar por acabar con la incredulidad, el odio, la injusticia,"}, {"t": "p", "x": "la mentira, la opresión, el dolor, la soledad, el hambre, la ignorancia"}, {"t": "p", "x": "y tantas otras urgencias de amor que son urgencias del Reino."}, {"t": "p", "x": "Te lo pedimos por tu Hijo Jesucristo, que vive y reina por los siglos de los siglos."}, {"t": "p", "x": "Amén."}]}, {"id": "78", "num": "8.7", "title": "Oración misionera", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Oh Padre,"}, {"t": "p", "x": "que has derramado los dones de tu Espíritu"}, {"t": "p", "x": "sobre la bienaventurada Virgen María,"}, {"t": "p", "x": "orante con los Apóstoles en el Cenáculo,"}, {"t": "p", "x": "haz que perseveremos unánimes en la oración"}, {"t": "p", "x": "con María, nuestra Madre, para llevar al mundo,"}, {"t": "p", "x": "con la fuerza del Espíritu,"}, {"t": "p", "x": "la Buena Nueva de la salvación."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "79", "num": "8.8", "title": "Por la Iglesia", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Señor Jesús,"}, {"t": "p", "x": "que por amor a los hombres"}, {"t": "p", "x": "oraste por la fe de tus discípulos,"}, {"t": "p", "x": "intercediste por los pecadores,"}, {"t": "p", "x": "y te compadeciste de toda miseria humana:"}, {"t": "p", "x": "acoge las súplicas que elevamos a ti en favor de la Iglesia,"}, {"t": "p", "x": "atiende nuestras oraciones por la vida del mundo,"}, {"t": "p", "x": "y admítenos a todos en el gozo del Reino eterno,"}, {"t": "p", "x": "donde vives y reinas por los siglos de los siglos."}, {"t": "p", "x": "Amén."}]}, {"id": "80", "num": "8.9", "title": "El Señor presente en la Misión", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Señor Jesús,"}, {"t": "p", "x": "tu mandato de misión nos dispersó un día por el mundo entero."}, {"t": "p", "x": "Tu Palabra de comunión nos reúne hoy en este cruce de todos los caminos,"}, {"t": "p", "x": "donde encontrarnos es encontrarte,"}, {"t": "p", "x": "donde amarnos es dar testimonio de Ti,"}, {"t": "p", "x": "donde encender esperanzas es anunciar tu venida."}, {"t": "p", "x": "Como los Doce,"}, {"t": "p", "x": "volvemos a ti desde los senderos de nuestra misión,"}, {"t": "p", "x": "trayendo a tu presencia el dolor y las humillaciones de nuestros pueblos,"}, {"t": "p", "x": "el clamor de los pobres que nos enviaste a evangelizar,"}, {"t": "p", "x": "las esperanzas de los humildes que abrieron su corazón a tu mensaje"}, {"t": "p", "x": "y que por doquier lo hacen florecer en fraternidad, en la Iglesia."}, {"t": "p", "x": "Concédenos que, celebrando y contemplando tu Palabra,"}, {"t": "p", "x": "aprendamos a discernir en la fe los signos de este tiempo,"}, {"t": "p", "x": "y a proclamarte a Ti, que eres verdad completa siempre nueva,"}, {"t": "p", "x": "en medio de las ambigüedades y contradicciones de este mundo."}, {"t": "p", "x": "Que tu presencia resucitada entre nosotros"}, {"t": "p", "x": "disipe temores y desalientos,"}, {"t": "p", "x": "y nos haga optar con libertad y fortaleza,"}, {"t": "p", "x": "por tu propuesta de vida, de justicia y de fraternidad,"}, {"t": "p", "x": "allí donde se cultivan proyectos de destrucción, de opresión y de violencia."}, {"t": "p", "x": "Envíanos tu Espíritu"}, {"t": "p", "x": "para que, como en María, la Virgen Madre,"}, {"t": "p", "x": "cree en nosotros un corazón nuevo,"}, {"t": "p", "x": "encendido en caridad apostólica,"}, {"t": "p", "x": "disponible ante los desafíos de la nueva evangelización,"}, {"t": "p", "x": "fecundo en obras de amor y de servicio a los más necesitados."}, {"t": "p", "x": "Haz que seamos instrumentos de comunión y de reconciliación"}, {"t": "p", "x": "para que en los pueblos a los que nos enviaste,"}, {"t": "p", "x": "la comunidad de los que creen en Ti"}, {"t": "p", "x": "sea transparencia de tu designio de salvación y glorifique tu nombre."}, {"t": "p", "x": "Amén."}]}, {"id": "83", "num": "8.10", "title": "Queremos hacer tu voluntad", "theme": "mision", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Padre nuestro,"}, {"t": "p", "x": "Padre de bondad y misericordia:"}, {"t": "p", "x": "estamos aquí reunidos en nombre del amor que tú nos tienes."}, {"t": "p", "x": "Te alabamos, te bendecimos y te damos gracias."}, {"t": "p", "x": "Con gozo respondemos a la llamada que en tu Hijo nos diriges"}, {"t": "p", "x": "y, alentados por la fuerza del Espíritu,"}, {"t": "p", "x": "te decimos confiados: «queremos hacer tu voluntad»."}, {"t": "p", "x": "Danos una mirada limpia, una inteligencia abierta y un corazón ardiente"}, {"t": "p", "x": "para comprender y abrazar el designio que tienes sobre nosotros."}, {"t": "p", "x": "Al pensar en la misión que nos confías,"}, {"t": "p", "x": "advertimos las profundas y constantes exigencias que tenemos que cumplir."}, {"t": "p", "x": "Aumenta en nosotros la generosidad y la esperanza"}, {"t": "p", "x": "y ábrenos a las necesidades más urgentes de los hombres."}, {"t": "p", "x": "Que acertemos a expresar en nuestra vida"}, {"t": "p", "x": "el amor universal de Jesucristo, su incondicional entrega"}, {"t": "p", "x": "y el completo olvido que tuvo de sí mismo"}, {"t": "p", "x": "en la realización de su misión salvadora en este mundo."}, {"t": "p", "x": "Confírmanos en la verdad; danos sed de tu justicia"}, {"t": "p", "x": "y haznos útiles instrumentos para la paz."}, {"t": "p", "x": "Que seamos fuerzas vivas de comunión en esta Iglesia peregrina"}, {"t": "p", "x": "y consigamos ser testigos del soberano poder de Cristo resucitado"}, {"t": "p", "x": "en medio de este pueblo que sufre su pasión de libertad."}, {"t": "p", "x": "Que seamos responsables en toda acción y compromiso,"}, {"t": "p", "x": "y no permitas que, proclamando el Evangelio, busquemos nuestros propios intereses."}, {"t": "p", "x": "Concédenos, Señor, la caridad apostólica de San Antonio María Claret, nuestro Padre."}, {"t": "p", "x": "Enséñanos, como a él, a discernir en todo tiempo lo que te agrada,"}, {"t": "p", "x": "lo que es justo y lo que construye tu Reino entre los hombres."}, {"t": "p", "x": "Te lo pedimos por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "45", "num": "9.1", "title": "Caridad apostólica", "theme": "consagracion", "sub": "Virtudes", "tags": [], "lines": [{"t": "p", "x": "¡Oh Dios mío!"}, {"t": "p", "x": "Dame caridad apostólica,"}, {"t": "p", "x": "de modo que obre en todo con fortaleza y suavemente,"}, {"t": "p", "x": "con mansedumbre y caridad."}, {"t": "p", "x": "Amén."}]}, {"id": "46", "num": "9.2", "title": "Práctica de las virtudes", "theme": "consagracion", "sub": "Virtudes", "tags": [], "lines": [{"t": "p", "x": "Jesús, dame tu gracia para imitarte fielmente"}, {"t": "p", "x": "en la práctica de todas las virtudes."}, {"t": "p", "x": "Contigo todo lo puedo, sin Ti nada absolutamente."}, {"t": "p", "x": "Amén."}]}, {"id": "47", "num": "9.3", "title": "Pobreza", "theme": "consagracion", "sub": "Pobreza", "tags": [], "lines": [{"t": "p", "x": "Salvador nuestro,"}, {"t": "p", "x": "que te hiciste pobre,"}, {"t": "p", "x": "que quisiste nacer pobre,"}, {"t": "p", "x": "vivir pobremente y morir en la mayor pobreza."}, {"t": "p", "x": "Haz que tus misioneros conozcamos el valor de la pobreza,"}, {"t": "p", "x": "que la amemos y la practiquemos como Tú nos enseñas,"}, {"t": "p", "x": "con obras y palabras;"}, {"t": "p", "x": "que, a ejemplo de los Apóstoles,"}, {"t": "p", "x": "lo dejemos todo para seguirte en el anuncio del Evangelio."}, {"t": "p", "x": "Amén."}]}, {"id": "48", "num": "9.4", "title": "Mansedumbre", "theme": "consagracion", "sub": "Virtudes", "tags": [], "lines": [{"t": "p", "x": "Oh Dios mío,"}, {"t": "p", "x": "dame un celo discreto y prudente"}, {"t": "p", "x": "a fin de que obre en todas las cosas"}, {"t": "p", "x": "con fortaleza y suavemente,"}, {"t": "p", "x": "con mansedumbre y buen modo."}, {"t": "p", "x": "Ayúdame a comportarme en todo con una santa prudencia,"}, {"t": "p", "x": "cultivada por el estudio,"}, {"t": "p", "x": "fortificada con la edad,"}, {"t": "p", "x": "aclarada por el diálogo,"}, {"t": "p", "x": "y consumada con la experiencia de los acontecimientos."}, {"t": "p", "x": "Amén."}]}, {"id": "49", "num": "9.5", "title": "Mortificación", "theme": "consagracion", "sub": "Virtudes", "tags": [], "lines": [{"t": "p", "x": "¡Oh Señor!,"}, {"t": "p", "x": "conozco que las penas, dolores y trabajos"}, {"t": "p", "x": "son la divisa del apóstol."}, {"t": "p", "x": "Con tu gracia los abrazo."}, {"t": "p", "x": "Ayúdame Tú, Señor,"}, {"t": "p", "x": "a beber el cáliz de penas interiores"}, {"t": "p", "x": "y a recibir ese bautismo de penas exteriores."}, {"t": "p", "x": "Haz que no me gloríe en otra cosa"}, {"t": "p", "x": "que en la Cruz en la que Tú estás clavado por mí."}, {"t": "p", "x": "Amén."}]}, {"id": "50", "num": "9.6", "title": "Nuestra consagración", "theme": "consagracion", "sub": "Consagración", "tags": ["renovación de votos", "profesión"], "lines": [{"t": "p", "x": "Dios y Padre mío,"}, {"t": "p", "x": "respondiendo a tu llamada"}, {"t": "p", "x": "quiero procurar con el mayor empeño"}, {"t": "p", "x": "que siempre se cumpla tu voluntad."}, {"t": "p", "x": "Deseo con todo el corazón dedicarme plenamente a Ti,"}, {"t": "p", "x": "siguiendo a Jesús, como los Apóstoles,"}, {"t": "p", "x": "para que todos los hombres tengan vida en abundancia."}, {"t": "p", "x": "Impulsado por el Espíritu Santo"}, {"t": "p", "x": "renuevo mi entrega a Ti, Padre,"}, {"t": "p", "x": "para que me configures a imagen y semejanza de tu Hijo Jesús."}, {"t": "p", "x": "Confiado en la maternal asistencia del Inmaculado Corazón de María,"}, {"t": "p", "x": "te prometo vivir en esta comunidad de vida apostólica"}, {"t": "p", "x": "casto, pobre, obediente,"}, {"t": "p", "x": "observando las Constituciones de nuestra Congregación"}, {"t": "p", "x": "con todo el cuidado posible."}, {"t": "p", "x": "Úngeme, Padre Santo, con tu Espíritu de santidad"}, {"t": "p", "x": "para que en el servicio de la Palabra"}, {"t": "p", "x": "sea fiel al carisma de San Antonio María Claret"}, {"t": "p", "x": "y alcance la perfección en el mandamiento del amor."}, {"t": "p", "x": "Amén."}]}, {"id": "51", "num": "9.7", "title": "Configuración con Cristo", "theme": "consagracion", "sub": "Consagración", "tags": [], "lines": [{"t": "p", "x": "Gracias, Padre, porque nos has ungido por tu Espíritu"}, {"t": "p", "x": "y nos has hecho partícipes de la plenitud de Cristo, tu Hijo."}, {"t": "p", "x": "Bendito seas por habernos llamado a seguirlo"}, {"t": "p", "x": "y a colaborar con Él en la obra que Tú le encomendaste."}, {"t": "p", "x": "Te pedimos que, penetrados de su Espíritu,"}, {"t": "p", "x": "no seamos nosotros los que vivamos,"}, {"t": "p", "x": "sino que sea Cristo quien realmente viva en nosotros,"}, {"t": "p", "x": "a fin de ser válidos instrumentos para anunciar el Reino de los cielos."}, {"t": "p", "x": "Que intentemos conseguir nuestra configuración con Él"}, {"t": "p", "x": "en nuestra comunidad misionera,"}, {"t": "p", "x": "según nuestro carisma propio en la Iglesia."}, {"t": "p", "x": "Él, que vive y reina por los siglos de los siglos."}, {"t": "p", "x": "Amén."}]}, {"id": "53", "num": "9.8", "title": "El don de la castidad", "theme": "consagracion", "sub": "Castidad", "tags": [], "lines": [{"t": "p", "x": "Te bendecimos, Dios nuestro, por habernos concedido"}, {"t": "p", "x": "el don de la castidad por el Reino de los cielos,"}, {"t": "p", "x": "por el que podemos consagrarnos de todo corazón a las cosas del Padre,"}, {"t": "p", "x": "a imitación de tu Hijo Jesucristo"}, {"t": "p", "x": "y según el ejemplo de la Virgen María."}, {"t": "p", "x": "Pedimos, Señor, tu ayuda con humildad"}, {"t": "p", "x": "para dominar las inclinaciones de nuestra naturaleza,"}, {"t": "p", "x": "recibir con gozo el don de la castidad"}, {"t": "p", "x": "y cultivarlo con toda diligencia."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "54", "num": "9.9", "title": "Castidad", "theme": "consagracion", "sub": "Castidad", "tags": [], "lines": [{"t": "p", "x": "Bendito seas, Señor,"}, {"t": "p", "x": "porque por el don de la castidad por el Reino de los cielos,"}, {"t": "p", "x": "se manifiesta el poder de tu gloria"}, {"t": "p", "x": "en la fragilidad de nuestra naturaleza,"}, {"t": "p", "x": "a fin de alentar en los hombres la esperanza de la vida futura."}, {"t": "p", "x": "Haz que la castidad que profesamos"}, {"t": "p", "x": "favorezca una nueva comunión fraterna en Cristo"}, {"t": "p", "x": "y construya una comunidad que no se funda ni en la carne ni en la sangre,"}, {"t": "p", "x": "sino en tu voluntad."}, {"t": "p", "x": "Y que, como signo de amor perfecto,"}, {"t": "p", "x": "se convierta en una especial fuente de fecundidad espiritual para el mundo"}, {"t": "p", "x": "y nos inflame en amor a Ti y a todos los hombres."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "55", "num": "9.10", "title": "Tú, siendo rico", "theme": "consagracion", "sub": "Pobreza", "tags": [], "lines": [{"t": "p", "x": "Tú, siendo rico,"}, {"t": "p", "x": "te has hecho pobre por nosotros"}, {"t": "p", "x": "a fin de que nosotros nos enriqueciéramos."}, {"t": "p", "x": "Dedicado a anunciar la Buena Nueva del Reino,"}, {"t": "p", "x": "no tenías dónde reclinar la cabeza."}, {"t": "p", "x": "Danos compartir tu pobreza,"}, {"t": "p", "x": "para recordar a los hombres los bienes del mundo futuro,"}, {"t": "p", "x": "vivir como María, la primera entre los pobres del Señor,"}, {"t": "p", "x": "y a semejanza de los Apóstoles que, abandonándolo todo, te siguieron."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}, {"t": "p", "x": "Amén."}]}, {"id": "56", "num": "9.11", "title": "Buscar ante todo el Reino de Dios", "theme": "consagracion", "sub": "Pobreza", "tags": [], "lines": [{"t": "p", "x": "Te pedimos, Señor,"}, {"t": "p", "x": "que poniendo toda nuestra confianza en Ti,"}, {"t": "p", "x": "y nunca en el poder y las riquezas,"}, {"t": "p", "x": "busquemos ante todo el Reino que pertenece a los pobres."}, {"t": "p", "x": "Amén."}]}, {"id": "57", "num": "9.12", "title": "Comunión de bienes", "theme": "consagracion", "sub": "Pobreza", "tags": [], "lines": [{"t": "p", "x": "Concédenos, Señor,"}, {"t": "p", "x": "que con nuestra pobreza voluntaria"}, {"t": "p", "x": "construyamos la comunidad fraterna"}, {"t": "p", "x": "en la unidad de corazón y espíritu"}, {"t": "p", "x": "y la expresemos en la comunión de bienes,"}, {"t": "p", "x": "espirituales y materiales,"}, {"t": "p", "x": "con los pobres y en su servicio."}, {"t": "p", "x": "Amén."}]}, {"id": "58", "num": "9.13", "title": "Pobreza", "theme": "consagracion", "sub": "Pobreza", "tags": [], "lines": [{"t": "p", "x": "Te damos gracias, Padre santo,"}, {"t": "p", "x": "porque has querido manifestarnos el valor de la pobreza"}, {"t": "p", "x": "y la bienaventuranza de los que no ponen su interés en las riquezas."}, {"t": "p", "x": "Concédenos que toda nuestra vida y actividad"}, {"t": "p", "x": "estén informadas por el espíritu de pobreza."}, {"t": "p", "x": "Que seamos pobres de hecho y de espíritu"}, {"t": "p", "x": "y nos sintamos obligados a la ley común del trabajo,"}, {"t": "p", "x": "compartiendo la condición de los pobres."}, {"t": "p", "x": "Que tengamos nuestros bienes a disposición de los demás,"}, {"t": "p", "x": "y nos alegremos cuando experimentemos algunos efectos de la pobreza,"}, {"t": "p", "x": "no dudando de tu providencia."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "59", "num": "9.14", "title": "Para hacer tu voluntad", "theme": "consagracion", "sub": "Obediencia", "tags": [], "lines": [{"t": "p", "x": "Para hacer tu voluntad, Padre, nos enviaste a tu Hijo Jesús."}, {"t": "p", "x": "A ejemplo de la Santísima Virgen,"}, {"t": "p", "x": "que se consagró totalmente como esclava del Señor"}, {"t": "p", "x": "a la obra del Hijo,"}, {"t": "p", "x": "te ofrecemos, Señor,"}, {"t": "p", "x": "la libre facultad de ordenar nuestra vida"}, {"t": "p", "x": "para configurarnos con Jesucristo,"}, {"t": "p", "x": "que se hizo obediente hasta la muerte de cruz,"}, {"t": "p", "x": "y unirnos en todo a tu voluntad salvífica."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "60", "num": "9.15", "title": "Obedientes en la misión", "theme": "consagracion", "sub": "Obediencia", "tags": [], "lines": [{"t": "p", "x": "Compartiendo la misma vocación,"}, {"t": "p", "x": "queremos buscar juntos, Señor, tu voluntad"}, {"t": "p", "x": "para llevar a cabo nuestra misión en la Iglesia."}, {"t": "p", "x": "Ilumina a quienes expresan la unidad de amor"}, {"t": "p", "x": "y de misión en la comunidad"}, {"t": "p", "x": "para que promuevan la cooperación de todos"}, {"t": "p", "x": "en bien de la Iglesia y de la Congregación,"}, {"t": "p", "x": "y haz que todos, impulsados por el amor,"}, {"t": "p", "x": "sepamos obedecer pronta y perfectamente."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "61", "num": "9.16", "title": "Obediencia", "theme": "consagracion", "sub": "Obediencia", "tags": [], "lines": [{"t": "p", "x": "Te damos gracias, Padre,"}, {"t": "p", "x": "porque nos concedes la libre facultad"}, {"t": "p", "x": "de disponer de nuestra vida,"}, {"t": "p", "x": "y nos mueves a ofrecértela por la fuerza de tu Espíritu."}, {"t": "p", "x": "Gracias por habernos llamado a configurarnos"}, {"t": "p", "x": "con tu Hijo Jesucristo"}, {"t": "p", "x": "en su obediencia hasta la muerte en cruz."}, {"t": "p", "x": "Bendito seas por haber querido que"}, {"t": "p", "x": "en Él participemos de tu voluntad salvadora."}, {"t": "p", "x": "Amén."}]}, {"id": "62", "num": "9.17", "title": "Obediencia en comunión", "theme": "consagracion", "sub": "Obediencia", "tags": [], "lines": [{"t": "p", "x": "Concédenos, Señor,"}, {"t": "p", "x": "buscar, conocer y hacer juntos tu voluntad"}, {"t": "p", "x": "a fin de poder realizar la misión común"}, {"t": "p", "x": "que tenemos en la Iglesia."}, {"t": "p", "x": "Concédenos que en la búsqueda y el cumplimiento de tu voluntad,"}, {"t": "p", "x": "nos obliguemos a ofrecer nuestra ayuda a los hermanos"}, {"t": "p", "x": "con la oración, el consejo y el diálogo fraterno."}, {"t": "p", "x": "Amén."}]}, {"id": "63", "num": "9.18", "title": "Por los superiores", "theme": "consagracion", "sub": "Obediencia", "tags": [], "lines": [{"t": "p", "x": "Fortalece, Señor, a nuestros Superiores"}, {"t": "p", "x": "para que busquen ante todo tu voluntad,"}, {"t": "p", "x": "ejerzan la autoridad según las Constituciones"}, {"t": "p", "x": "y en espíritu de servicio,"}, {"t": "p", "x": "dando su vida por los hermanos."}, {"t": "p", "x": "Y concédenos a todos obedecerte"}, {"t": "p", "x": "impulsados por el amor,"}, {"t": "p", "x": "pronta y perfectamente,"}, {"t": "p", "x": "sometiéndonos a los hombres por Ti."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "64", "num": "9.19", "title": "Disponibilidad", "theme": "consagracion", "sub": "Obediencia", "tags": [], "lines": [{"t": "p", "x": "Danos, Señor, el don de la disponibilidad"}, {"t": "p", "x": "para ser enviados a cualquier parte del mundo,"}, {"t": "p", "x": "para poner todas nuestras energías al servicio del ministerio"}, {"t": "p", "x": "que nos sea encomendado por la Congregación."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "65", "num": "9.20", "title": "Imitar la oración de Jesús", "theme": "consagracion", "sub": "Oración", "tags": [], "lines": [{"t": "p", "x": "Dios omnipotente y eterno"}, {"t": "p", "x": "que has tenido a bien asociarnos"}, {"t": "p", "x": "a la obra misionera de Cristo:"}, {"t": "p", "x": "abre nuestro corazón"}, {"t": "p", "x": "para que nos convirtamos al Evangelio,"}, {"t": "p", "x": "y danos constancia para que le imitemos"}, {"t": "p", "x": "en su oración asidua."}, {"t": "p", "x": "Por el mismo Jesucristo nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "66", "num": "9.21", "title": "Progreso en la caridad", "theme": "consagracion", "sub": "Virtudes", "tags": [], "lines": [{"t": "p", "x": "Padre misericordioso,"}, {"t": "p", "x": "concédenos que la caridad de Cristo nos apremie"}, {"t": "p", "x": "con el mismo amor con que Tú nos amas,"}, {"t": "p", "x": "y con fortaleza de espíritu"}, {"t": "p", "x": "estemos dispuestos a morir cada día por los hermanos."}, {"t": "p", "x": "Haz que, como extranjeros y peregrinos,"}, {"t": "p", "x": "nos abstengamos de los deseos de la carne,"}, {"t": "p", "x": "guardemos con diligente cuidado"}, {"t": "p", "x": "nuestros sentidos,"}, {"t": "p", "x": "y que nos alegremos en toda adversidad."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "67", "num": "9.22", "title": "La caridad de Cristo nos urge", "theme": "consagracion", "sub": "Virtudes", "tags": [], "lines": [{"t": "p", "x": "Padre santo,"}, {"t": "p", "x": "Jesucristo, urgido por un ardiente amor a Ti y a los hombres,"}, {"t": "p", "x": "se entregó a los trabajos, a la pasión, e incluso a la muerte."}, {"t": "p", "x": "Concédenos la caridad apostólica y el gozo del Espíritu"}, {"t": "p", "x": "para que consigamos"}, {"t": "p", "x": "que todos los hombres te conozcan, te amen y te sirvan,"}, {"t": "p", "x": "y alcancen la bienaventuranza de tu Reino."}, {"t": "p", "x": "Amén."}]}, {"id": "113", "num": "9.23", "title": "Ilumina, Señor, nuestros corazones", "theme": "consagracion", "sub": "Eucaristía", "tags": [], "lines": [{"t": "p", "x": "Ilumina, Señor, con la luz de la fe nuestros corazones"}, {"t": "p", "x": "y abrásalos con el fuego de la caridad"}, {"t": "p", "x": "para que adoremos, en espíritu y en verdad,"}, {"t": "p", "x": "a quien reconocemos en este Sacramento"}, {"t": "p", "x": "como nuestro Dios y Señor."}, {"t": "p", "x": "Él que vive y reina por los siglos de los siglos."}]}, {"id": "114", "num": "9.24", "title": "Memorial de nuestra redención", "theme": "consagracion", "sub": "Eucaristía", "tags": [], "lines": [{"t": "p", "x": "Oh Dios que redimiste a todos los hombres"}, {"t": "p", "x": "con el misterio pascual de Cristo,"}, {"t": "p", "x": "que en este Sacramento se ofrece a Sí mismo por los hermanos,"}, {"t": "p", "x": "concédenos que, venerando constantemente el misterio de nuestra redención,"}, {"t": "p", "x": "merezcamos conseguir su fruto"}, {"t": "p", "x": "y suscitar en los hombres el recuerdo de la presencia del Señor."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}]}, {"id": "115", "num": "9.25", "title": "La Eucaristía y el celo apostólico", "theme": "consagracion", "sub": "Eucaristía", "tags": [], "lines": [{"t": "p", "x": "Que el Sacramento de la Eucaristía, Señor,"}, {"t": "p", "x": "llene de tu amor y de celo apostólico nuestros corazones"}, {"t": "p", "x": "para que nos impulsen a desear"}, {"t": "p", "x": "que todos los hombres te conozcan, te amen y te sirvan,"}, {"t": "p", "x": "y a procurarles la bienaventuranza de ese Reino"}, {"t": "p", "x": "iniciada ya en la tierra."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}]}, {"id": "116", "num": "9.26", "title": "Partícipes de un mismo pan", "theme": "consagracion", "sub": "Eucaristía", "tags": [], "lines": [{"t": "p", "x": "Señor, tú que nos has hecho partícipes de un mismo pan y un mismo Espíritu,"}, {"t": "p", "x": "concédenos que, unidos a Ti como los sarmientos a la vid,"}, {"t": "p", "x": "seamos uno contigo para edificar nuestra comunión"}, {"t": "p", "x": "y para que el mundo crea."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}]}, {"id": "117", "num": "9.27", "title": "Solidarios con los que sufren", "theme": "consagracion", "sub": "Eucaristía", "tags": [], "lines": [{"t": "p", "x": "Señor Jesús, que te identificaste plenamente con los que sufren"}, {"t": "p", "x": "y nos has dicho «venid a mí los cansados y agobiados, que yo os aliviaré»,"}, {"t": "p", "x": "solidarios de los hombres que padecen enfermedad, dolor, injusticia y opresión,"}, {"t": "p", "x": "venimos a tu presencia"}, {"t": "p", "x": "para que nos inflames en tu caridad"}, {"t": "p", "x": "hasta que nos alegremos en los padecimientos"}, {"t": "p", "x": "y nos gloriemos en tu cruz."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}]}, {"id": "118", "num": "9.28", "title": "Adorar el misterio pascual", "theme": "consagracion", "sub": "Eucaristía", "tags": [], "lines": [{"t": "p", "x": "Señor, que por el misterio pascual"}, {"t": "p", "x": "has realizado la salvación de los hombres,"}, {"t": "p", "x": "concédenos adorarte presente en este Sacramento"}, {"t": "p", "x": "y proclamar con fe lo que ahora veneramos."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}]}, {"id": "119", "num": "9.29", "title": "Inflámanos en la fe", "theme": "consagracion", "sub": "Eucaristía", "tags": [], "lines": [{"t": "p", "x": "Señor Jesús,"}, {"t": "p", "x": "inflámanos en la fe"}, {"t": "p", "x": "que movió a tantos predicadores de la divina palabra"}, {"t": "p", "x": "a abrazar con ánimo alegre"}, {"t": "p", "x": "la pobreza, la abnegación y el sacrificio"}, {"t": "p", "x": "para dilatar tu Reino."}, {"t": "p", "x": "Te lo pedimos unidos de corazón a Ti,"}, {"t": "p", "x": "cuya vida y ministerio compartimos,"}, {"t": "p", "x": "y presente ahora en el misterio eucarístico que veneramos."}, {"t": "p", "x": "Tú vives y reinas con el Padre y el Espíritu Santo"}, {"t": "p", "x": "por los siglos de los siglos."}]}, {"id": "144", "num": "9.30", "title": "Oración del P. Fundador al comienzo de los ejercicios", "theme": "consagracion", "sub": "Ejercicios Espirituales", "tags": ["retiro"], "lines": [{"t": "p", "x": "Virgen María, Madre mía,"}, {"t": "p", "x": "tú que tuviste el consuelo de ver reunidos"}, {"t": "p", "x": "a los Apóstoles y discípulos en el Cenáculo"}, {"t": "p", "x": "y finalmente el gozo de verlos a todos"}, {"t": "p", "x": "llenos del Espíritu Santo;"}, {"t": "p", "x": "con toda confianza te pido"}, {"t": "p", "x": "que me alcances todas las gracias que necesito"}, {"t": "p", "x": "para hacer bien estos Ejercicios"}, {"t": "p", "x": "bajo tu dirección."}, {"t": "p", "x": "Sosténme en mi propósito de hacer todo lo que conozca"}, {"t": "p", "x": "sea para mayor gloria de Dios y bien de mi alma."}, {"t": "p", "x": "Madre mía, socórreme y ampárame ahora y siempre."}, {"t": "p", "x": "Amén."}]}, {"id": "84", "num": "10.1", "title": "Por las vocaciones", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Señor Jesucristo, que dijiste:"}, {"t": "p", "x": "«Rogad al Señor de la mies para que envíe obreros a su mies»:"}, {"t": "p", "x": "Te pedimos humildemente"}, {"t": "p", "x": "que te dignes enviarlos a nuestra Congregación."}, {"t": "p", "x": "Infunde tu Espíritu en los que has elegido"}, {"t": "p", "x": "y confírmalos en la vocación,"}, {"t": "p", "x": "para que anunciando digna y fructuosamente tu santo Evangelio"}, {"t": "p", "x": "nos llamemos y seamos de verdad"}, {"t": "p", "x": "Hijos del Inmaculado Corazón de la Santísima Virgen María,"}, {"t": "p", "x": "te amemos de todo corazón, de palabra y de obra,"}, {"t": "p", "x": "y no cesemos nunca en tu alabanza."}, {"t": "p", "x": "Amén."}]}, {"id": "85", "num": "10.2", "title": "Vocación", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Señor, Tú, que llamaste a los Apóstoles"}, {"t": "p", "x": "para que fueran pescadores de hombres,"}, {"t": "p", "x": "llama a la Familia Claretiana"}, {"t": "p", "x": "nuevos miembros"}, {"t": "p", "x": "que sean sal de la tierra y luz del mundo"}, {"t": "p", "x": "y difundan en todas partes la caridad"}, {"t": "p", "x": "que apremiaba a tu siervo Antonio María."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "86", "num": "10.3", "title": "Por intercesión del Corazón Inmaculado de María", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Señor Dios nuestro, que por el Corazón Inmaculado de María,"}, {"t": "p", "x": "diste a San Antonio María Claret"}, {"t": "p", "x": "un gran amor a tu Hijo Jesús"}, {"t": "p", "x": "y le inspiraste la fundación de la Congregación de Misioneros,"}, {"t": "p", "x": "para salvar a todos los hombres,"}, {"t": "p", "x": "bendice con nuevas vocaciones a la Congregación Claretiana,"}, {"t": "p", "x": "e intercede ante el Señor"}, {"t": "p", "x": "para que todos los misioneros Hijos del Corazón de María"}, {"t": "p", "x": "perseveremos hasta el fin"}, {"t": "p", "x": "en el anuncio del Evangelio."}, {"t": "p", "x": "Amén."}]}, {"id": "87", "num": "10.4", "title": "Plegaria para pedir al Señor vocaciones claretianas", "theme": "vocaciones", "sub": null, "tags": ["responsorial"], "lines": [{"t": "p", "x": "Señor, para continuar la gran obra de San Antonio María Claret en todo el mundo,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "p", "x": "Señor, para santificar a los pueblos cristianos con la predicación y demás trabajos apostólicos,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "p", "x": "Señor, para llevar la luz del Evangelio a los que no te conocen,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "p", "x": "Señor, para procurar el Reinado del Inmaculado Corazón de María,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "p", "x": "Señor, para que por medio del Inmaculado Corazón de María se cumpla siempre tu voluntad,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "p", "x": "Señor, para que todas las personas sean educadas cristianamente y tengamos una sociedad más justa y más humana, siguiendo tu voluntad,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "p", "x": "Jesús, primer Hijo del Inmaculado Corazón de María,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "p", "x": "Corazón Inmaculado de María, madre de todos los hombres,"}, {"t": "r", "x": "Envíanos muchos y santos Misioneros."}, {"t": "rub", "x": "Oración:"}, {"t": "p", "x": "Padre nuestro,"}, {"t": "p", "x": "que quieres que todos los hombres se salven"}, {"t": "p", "x": "y lleguen al conocimiento de la verdad,"}, {"t": "p", "x": "te rogamos que envíes obreros a tu mies"}, {"t": "p", "x": "y les concedas predicar con confianza tu Palabra,"}, {"t": "p", "x": "para que la verdad se difunda y se esclarezca"}, {"t": "p", "x": "y todas las gentes te conozcan a ti, único Dios verdadero."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "88", "num": "10.5", "title": "Por las vocaciones misioneras", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Oh Dios,"}, {"t": "p", "x": "que quieres que todos los hombres se salven"}, {"t": "p", "x": "y lleguen al conocimiento de la verdad,"}, {"t": "p", "x": "atrae hacia Ti seguidores de tu Hijo,"}, {"t": "p", "x": "al estilo de San Antonio María Claret,"}, {"t": "p", "x": "y envíalos al campo del mundo"}, {"t": "p", "x": "para que prediquen el Evangelio a toda criatura,"}, {"t": "p", "x": "y tu pueblo, congregado por la Palabra de vida"}, {"t": "p", "x": "y sostenido por la fuerza de los sacramentos,"}, {"t": "p", "x": "camine por las sendas de la salvación y del amor."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "89", "num": "10.6", "title": "Oración por las vocaciones y la perseverancia", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Tú, Señor, que has dicho que la mies es abundante, y los trabajadores pocos,"}, {"t": "p", "x": "y quieres que se multiplique el número de apóstoles y evangelizadores"}, {"t": "p", "x": "que dilaten tu Reino y transformen la faz de la tierra;"}, {"t": "p", "x": "te rogamos que aumentes el número"}, {"t": "p", "x": "y la calidad evangélica de quienes trabajan por el bien de los hombres."}, {"t": "p", "x": "Te damos gracias por las vocaciones que nos has concedido"}, {"t": "p", "x": "por el Corazón Inmaculado de María, nuestra Madre."}, {"t": "p", "x": "Concédenos tu presencia y tu asistencia"}, {"t": "p", "x": "para que vengan muchas vocaciones a nuestro Instituto,"}, {"t": "p", "x": "y ayúdanos a todos a perseverar en nuestra vocación."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "90", "num": "10.7", "title": "Por las vocaciones a todos los estados de vida y ministerios", "theme": "vocaciones", "sub": null, "tags": ["responsorial"], "lines": [{"t": "p", "x": "Iluminados y animados por tu Palabra,"}, {"t": "p", "x": "te pedimos, Señor, por todos aquellos"}, {"t": "p", "x": "que ya han oído tu llamada y la han seguido."}, {"t": "r", "x": "Te rogamos, óyenos."}, {"t": "p", "x": "Por el Papa, los obispos, presbíteros, diáconos"}, {"t": "p", "x": "y por los misioneros y todos los consagrados"}, {"t": "p", "x": "para que vivan con gozo su vocación"}, {"t": "p", "x": "y con su vida y su palabra te hagan presente en medio de los hombres."}, {"t": "r", "x": "Te rogamos, óyenos."}, {"t": "p", "x": "Por los laicos y los seglares que"}, {"t": "p", "x": "trabajan generosamente en los ministerios"}, {"t": "p", "x": "instituidos por la Iglesia"}, {"t": "p", "x": "y en los servicios necesarios para la comunidad."}, {"t": "r", "x": "Te rogamos, óyenos."}, {"t": "p", "x": "Sosténlos en las dificultades,"}, {"t": "p", "x": "confórtalos en los sufrimientos,"}, {"t": "p", "x": "asístelos en la soledad,"}, {"t": "p", "x": "protégelos en la persecución"}, {"t": "p", "x": "y confírmalos en la fidelidad."}, {"t": "r", "x": "Te rogamos, óyenos."}, {"t": "p", "x": "Te pedimos, Señor, por aquellos"}, {"t": "p", "x": "que abren su corazón a tu llamada"}, {"t": "p", "x": "y se preparan para seguirla."}, {"t": "r", "x": "Te rogamos, óyenos."}, {"t": "p", "x": "Que tu Palabra los ilumine,"}, {"t": "p", "x": "tu personalidad los conquiste,"}, {"t": "p", "x": "y tu Espíritu los guíe a la meta"}, {"t": "p", "x": "de la profesión religiosa o de las órdenes sagradas."}, {"t": "r", "x": "Te rogamos, óyenos."}, {"t": "p", "x": "Sé para ellos, Señor, apoyo firme"}, {"t": "p", "x": "y haz que encuentren quien les pueda"}, {"t": "p", "x": "aconsejar, acompañar y sostener"}, {"t": "p", "x": "con la fuerza de convicción y amor"}, {"t": "p", "x": "que sólo Tú puedes comunicar."}, {"t": "r", "x": "Te rogamos, óyenos."}, {"t": "p", "x": "Te lo pedimos por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "183", "num": "11.1", "title": "Oración por el Capítulo (o durante su celebración)", "theme": "capitulos", "sub": "", "tags": ["Espíritu Santo"], "lines": [{"t": "p", "x": "Ven Espíritu Santo, llena el corazón de tus fieles"}, {"t": "p", "x": "y enciende en ellos el fuego de tu amor."}, {"t": "r", "x": "R/. Manda tu Espíritu y serán creadas"}, {"t": "v", "x": "V/. Y renovarás la faz de la tierra."}, {"t": "rub", "x": "Oremos."}, {"t": "p", "x": "Oh Dios, que has iluminado el corazón de tus fieles"}, {"t": "p", "x": "con la luz del Espíritu Santo,"}, {"t": "p", "x": "concédenos gozar siempre de la luz de su verdad"}, {"t": "p", "x": "y ser consolados con los frutos de su presencia."}, {"t": "p", "x": "Por Cristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "186", "num": "11.2", "title": "Oración por el Capítulo", "theme": "capitulos", "sub": "", "tags": [], "lines": [{"t": "p", "x": "Oh Divino Espíritu,"}, {"t": "p", "x": "que enviado por el Padre en el nombre de Jesús,"}, {"t": "p", "x": "asistes y guías infaliblemente a la Iglesia,"}, {"t": "p", "x": "infunde sobre el Capítulo la plenitud de tus dones."}, {"t": "p", "x": "Oh suave Maestro y Consolador,"}, {"t": "p", "x": "ilumina las mentes de los Capitulares,"}, {"t": "p", "x": "haz que de este Capítulo broten frutos abundantes,"}, {"t": "p", "x": "nuevo vigor en el empeño de santificación y de apostolado,"}, {"t": "p", "x": "especialmente la difusión de la luz"}, {"t": "p", "x": "y de la fuerza del Evangelio entre los hombres."}, {"t": "p", "x": "Oh dulce huésped de las almas,"}, {"t": "p", "x": "confirma las mentes en la verdad,"}, {"t": "p", "x": "dispón a la obediencia el corazón de todos"}, {"t": "p", "x": "a fin de que las conclusiones del Capítulo"}, {"t": "p", "x": "encuentren generosa acogida y pleno cumplimiento;"}, {"t": "p", "x": "renueva en nuestra Congregación,"}, {"t": "p", "x": "y, en cada uno de nosotros,"}, {"t": "p", "x": "el espíritu que animó a San Antonio María Claret, nuestro Padre."}, {"t": "p", "x": "Concédenos, que,"}, {"t": "p", "x": "reunidos en unánime e intensa plegaria,"}, {"t": "p", "x": "en torno al Corazón de María, nuestra Madre,"}, {"t": "p", "x": "procuremos siempre y únicamente"}, {"t": "p", "x": "la mayor gloria de Dios y la salvación de las almas."}, {"t": "p", "x": "Amén."}]}, {"id": "187", "num": "11.3", "title": "Preces por el Capítulo", "theme": "capitulos", "sub": "", "tags": [], "lines": [{"t": "p", "x": "Señor y Padre nuestro,"}, {"t": "p", "x": "por la intercesión de María,"}, {"t": "p", "x": "Madre y Fundadora de nuestra Congregación,"}, {"t": "p", "x": "envíanos tu Espíritu"}, {"t": "p", "x": "para sentirnos urgidos como tu Hijo Jesús"}, {"t": "p", "x": "por el amor a Ti y a los hombres,"}, {"t": "p", "x": "para tener ojos penetrantes y oídos atentos"}, {"t": "p", "x": "a las urgencias del mundo,"}, {"t": "p", "x": "mantener la unidad por encima de las diferencias,"}, {"t": "p", "x": "congregados en la misma comunidad"}, {"t": "p", "x": "y realizando la misión que hemos recibido"}, {"t": "p", "x": "a través de San Antonio María Claret, nuestro Padre."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}, {"t": "p", "x": "Amén."}]}, {"id": "xxvii", "num": "11.4", "title": "Por el XXVII Capítulo General", "theme": "capitulos", "sub": "", "tags": ["XXVII", "Capítulo General", "2026"], "lines": [{"t": "p", "x": "Ven, Espíritu Santo,"}, {"t": "p", "x": "aliento del Padre y fuego vivo del Hijo resucitado,"}, {"t": "p", "x": "renueva nuestra Congregación."}, {"t": "p", "x": "Haz de la preparación del Capítulo General"}, {"t": "p", "x": "un tiempo de gracia, escucha y discernimiento."}, {"t": "p", "x": "Derrama sobre nosotros un nuevo Pentecostés"}, {"t": "p", "x": "para que podamos caminar juntos en comunión,"}, {"t": "p", "x": "como misioneros místicos y proféticos"}, {"t": "p", "x": "al servicio de la única Misión de Cristo."}, {"t": "p", "x": "Unidos a María, nuestra Madre,"}, {"t": "p", "x": "San Antonio María Claret,"}, {"t": "p", "x": "y el fiel testimonio de nuestros mártires,"}, {"t": "p", "x": "enséñanos a escuchar Tu voz en el clamor de los pobres,"}, {"t": "p", "x": "en las heridas del mundo,"}, {"t": "p", "x": "y en la vida de nuestras comunidades."}, {"t": "p", "x": "Moldéanos en la fragua del Inmaculado Corazón de María"}, {"t": "p", "x": "para que, guiados por Tu Espíritu,"}, {"t": "p", "x": "nos convirtamos en signos de fraternidad,"}, {"t": "p", "x": "esperanza y fuego misionero"}, {"t": "p", "x": "para la Iglesia y para el mundo."}, {"t": "p", "x": "Amén."}]}, {"id": "131", "num": "12.1", "title": "Veni Sancte Spiritus", "theme": "reuniones", "sub": "Para comenzar", "tags": ["Espíritu Santo"], "lines": [{"t": "p", "x": "Ven, Espíritu Santo, llena los corazones de tus fieles"}, {"t": "p", "x": "y enciende en ellos el fuego de tu amor."}, {"t": "v", "x": "V/. Envía tu Espíritu y serán creados"}, {"t": "r", "x": "R/. Y renovarás la faz de la tierra."}, {"t": "rub", "x": "Oremos."}, {"t": "p", "x": "Oh Dios,"}, {"t": "p", "x": "que has iluminado los corazones de tus fieles"}, {"t": "p", "x": "con la luz del Espíritu Santo;"}, {"t": "p", "x": "haznos siempre dóciles a este mismo Espíritu,"}, {"t": "p", "x": "para que podamos hacer siempre el bien"}, {"t": "p", "x": "y gozar de su consuelo."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "132", "num": "12.2", "title": "Reunidos en tu nombre", "theme": "reuniones", "sub": "Para comenzar", "tags": [], "lines": [{"t": "p", "x": "Señor, al reunirnos en tu nombre,"}, {"t": "p", "x": "queremos estar en tu presencia,"}, {"t": "p", "x": "concédenos un espíritu dialogante,"}, {"t": "p", "x": "ilumina nuestras mentes con la luz de tu verdad"}, {"t": "p", "x": "y fortalece nuestro espíritu fraternal"}, {"t": "p", "x": "para que siempre busquemos juntos conocer y hacer tu voluntad."}, {"t": "p", "x": "Por Jesucristo nuestro Señor. Amén."}]}, {"id": "133", "num": "12.3", "title": "Danos la sabiduría (Sab 9,1-6.9-11)", "theme": "reuniones", "sub": "Para comenzar", "tags": ["sabiduría"], "lines": [{"t": "p", "x": "Dios de los padres y Señor de la misericordia,"}, {"t": "p", "x": "que con tu palabra hiciste todas las cosas,"}, {"t": "p", "x": "y en tu sabiduría formaste al hombre,"}, {"t": "p", "x": "para que dominase sobre tus criaturas,"}, {"t": "p", "x": "y para regir el mundo con santidad y justicia,"}, {"t": "p", "x": "y para administrar justicia con rectitud de corazón."}, {"t": "p", "x": "Dame la sabiduría asistente de tu trono"}, {"t": "p", "x": "y no me excluyas del número de tus siervos,"}, {"t": "p", "x": "porque siervo tuyo soy, hijo de tu sierva,"}, {"t": "p", "x": "hombre débil y de pocos años,"}, {"t": "p", "x": "demasiado pequeño para conocer el juicio y las leyes."}, {"t": "p", "x": "Pues, aunque uno sea perfecto"}, {"t": "p", "x": "entre los hijos de los hombres,"}, {"t": "p", "x": "sin la sabiduría, que procede de ti,"}, {"t": "p", "x": "será estimado en nada."}, {"t": "p", "x": "Contigo está la sabiduría, conocedora de tus obras,"}, {"t": "p", "x": "que te asistió cuando hacías el mundo,"}, {"t": "p", "x": "y que sabe lo que es grato a tus ojos"}, {"t": "p", "x": "y lo que es recto según tus preceptos."}, {"t": "p", "x": "Mándala de tus santos cielos,"}, {"t": "p", "x": "y de tu trono de gloria envíala,"}, {"t": "p", "x": "para que me asista en mis trabajos"}, {"t": "p", "x": "y venga yo a saber lo que te es grato."}, {"t": "p", "x": "Porque ella conoce y entiende todas las cosas,"}, {"t": "p", "x": "y me guiará prudentemente en mis obras,"}, {"t": "p", "x": "y me guardará en su esplendor."}, {"t": "rub", "x": "Gloria al Padre."}]}, {"id": "134", "num": "12.4", "title": "Buscar y cumplir juntos la voluntad de Dios", "theme": "reuniones", "sub": "Para comenzar", "tags": [], "lines": [{"t": "rub", "x": "Antífona:"}, {"t": "p", "x": "Dice el Señor: donde dos o tres están reunidos en mi nombre, estoy yo en medio de ellos."}, {"t": "rub", "x": "Oremos:"}, {"t": "p", "x": "Dios y Padre nuestro, tu Hijo prometió su presencia"}, {"t": "p", "x": "a cuantos se reunieran en su nombre:"}, {"t": "p", "x": "haz que lo sintamos presente ahora entre nosotros,"}, {"t": "p", "x": "que expresamos la comunión de vida y misión"}, {"t": "p", "x": "de todo el Instituto,"}, {"t": "p", "x": "para que caminemos en una vida nueva"}, {"t": "p", "x": "en obediencia al Espíritu"}, {"t": "p", "x": "y con plena fidelidad a nuestro carisma misionero,"}, {"t": "p", "x": "y, una vez conocida tu voluntad,"}, {"t": "p", "x": "la cumplamos con un mismo sentir y querer"}, {"t": "p", "x": "para realizar nuestra común misión en la Iglesia."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "135", "num": "12.5", "title": "Gracia y disposiciones para el diálogo", "theme": "reuniones", "sub": "Para comenzar", "tags": ["discernimiento", "diálogo"], "lines": [{"t": "p", "x": "Aquí estamos, Señor,"}, {"t": "p", "x": "reunidos en tu nombre y deseosos de dilatar tu Reino."}, {"t": "p", "x": "Que el Espíritu Santo que has enviado a nuestros corazones"}, {"t": "p", "x": "y mantiene viva tu presencia en nosotros,"}, {"t": "p", "x": "nos enseñe qué hemos de tratar"}, {"t": "p", "x": "y hacia dónde hemos de caminar"}, {"t": "p", "x": "para que, fortalecidos con tu gracia,"}, {"t": "p", "x": "podamos realizar tus designios."}, {"t": "p", "x": "Sé Tú, Espíritu Santo,"}, {"t": "p", "x": "el inspirador y animador de nuestro discernimiento."}, {"t": "p", "x": "Enséñanos a escuchar a los demás,"}, {"t": "p", "x": "a dejarnos iluminar por sus luces;"}, {"t": "p", "x": "enséñanos a proponer y a no imponer;"}, {"t": "p", "x": "danos equidad."}, {"t": "p", "x": "Líbranos de la ceguera de quien siempre cree tener razón,"}, {"t": "p", "x": "de los favoritismos y de toda acepción de personas."}, {"t": "p", "x": "Únenos a ti para que nunca nos apartemos de la verdad."}, {"t": "p", "x": "Amén."}]}, {"id": "136", "num": "12.6", "title": "Luz para descubrir la exigencia del Evangelio", "theme": "reuniones", "sub": "Para comenzar", "tags": [], "lines": [{"t": "p", "x": "Mira, Padre de bondad,"}, {"t": "p", "x": "a esta comunidad reunida en tu nombre"}, {"t": "p", "x": "para compartir la fraternidad y dialogar en la verdad,"}, {"t": "p", "x": "concédele descubrir con mayor claridad las exigencias del Evangelio"}, {"t": "p", "x": "para ser luz del mundo y sal de la tierra."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "137", "num": "12.7", "title": "Oración para iniciar una reunión", "theme": "reuniones", "sub": "Para comenzar", "tags": [], "lines": [{"t": "p", "x": "Señor, que tu gracia inspire, sostenga y acompañe nuestras obras"}, {"t": "p", "x": "para que nuestro trabajo comience en ti, como de su fuente,"}, {"t": "p", "x": "y tienda siempre a ti, como a su fin."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "138", "num": "12.8", "title": "Acción de gracias por el encuentro", "theme": "reuniones", "sub": "Para concluir", "tags": [], "lines": [{"t": "p", "x": "Padre de bondad,"}, {"t": "p", "x": "te damos gracias por este encuentro"}, {"t": "p", "x": "en el que hemos compartido nuestras ilusiones y desilusiones,"}, {"t": "p", "x": "nuestros proyectos y dificultades,"}, {"t": "p", "x": "haz que respondamos siempre eficazmente"}, {"t": "p", "x": "a nuestra vocación y misión en la Iglesia,"}, {"t": "p", "x": "a ejemplo de Claret, nuestro Padre."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "139", "num": "12.9", "title": "Un solo corazón y una sola alma", "theme": "reuniones", "sub": "Para concluir", "tags": [], "lines": [{"t": "p", "x": "Señor, te damos gracias"}, {"t": "p", "x": "por este encuentro comunitario,"}, {"t": "p", "x": "por tu bondad y tu presencia entre nosotros,"}, {"t": "p", "x": "haz que con espíritu fraternal"}, {"t": "p", "x": "tengamos un solo corazón y una sola alma para ser una comunidad"}, {"t": "p", "x": "evangelizada y evangelizadora."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "92", "num": "13.1", "title": "Por nuestros hermanos enfermos", "theme": "enfermos-difuntos", "sub": null, "tags": ["responsorial"], "lines": [{"t": "v", "x": "Salva, Señor, a tus siervos,"}, {"t": "r", "x": "que esperan en Ti."}, {"t": "v", "x": "Envíales tu auxilio desde el Santuario"}, {"t": "r", "x": "y protégelos desde Sión."}, {"t": "v", "x": "Sé su baluarte, Señor,"}, {"t": "r", "x": "frente al enemigo."}, {"t": "v", "x": "Concédeles tu fortaleza"}, {"t": "r", "x": "en el lecho del dolor."}, {"t": "v", "x": "Señor, escucha nuestra oración"}, {"t": "r", "x": "y llegue a Ti nuestro clamor."}, {"t": "v", "x": "El Señor esté con vosotros"}, {"t": "r", "x": "y con tu espíritu."}, {"t": "rub", "x": "Oremos:"}, {"t": "p", "x": "Oh Dios,"}, {"t": "p", "x": "que siempre te compadeces y perdonas,"}, {"t": "p", "x": "acoge nuestra plegaria"}, {"t": "p", "x": "para que tu piedad misericordiosa nos absuelva benignamente"}, {"t": "p", "x": "a nosotros y a tus siervos enfermos."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}, {"t": "rub", "x": "O bien:"}, {"t": "p", "x": "Oh Dios, amparo singular de la debilidad humana,"}, {"t": "p", "x": "muestra la fuerza de tu auxilio sobre tus siervos enfermos,"}, {"t": "p", "x": "para que, ayudados por tu misericordia,"}, {"t": "p", "x": "merezcan de nuevo presentarse sanos ante tu Iglesia."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}, {"t": "rub", "x": "O bien:"}, {"t": "p", "x": "Te pedimos, Señor,"}, {"t": "p", "x": "que nosotros, tus siervos, gocemos siempre de salud de alma y cuerpo"}, {"t": "p", "x": "y, por la intercesión de Santa María, la Virgen,"}, {"t": "p", "x": "líbranos de las tristezas de este mundo y concédenos las alegrías del cielo."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "93", "num": "13.2", "title": "Por nuestros hermanos difuntos", "theme": "enfermos-difuntos", "sub": "Difuntos", "tags": [], "lines": [{"t": "p", "x": "Oh Dios, que mantienes la esperanza de nuestra felicidad futura,"}, {"t": "p", "x": "en el misterio pascual de tu Hijo,"}, {"t": "p", "x": "humildemente te pedimos que"}, {"t": "p", "x": "cuantos en la tierra participaron de nuestra fraternidad claretiana"}, {"t": "p", "x": "y gastaron su vida en la propagación de tu Reino,"}, {"t": "p", "x": "alcancen el gozo de la felicidad eterna con los moradores de la patria celestial."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "95", "num": "13.3", "title": "Oración por los padres difuntos", "theme": "enfermos-difuntos", "sub": "Difuntos", "tags": [], "lines": [{"t": "p", "x": "Oh Dios, que nos has mandado honrar padre y madre,"}, {"t": "p", "x": "ten misericordia de nuestros padres:"}, {"t": "p", "x": "perdona sus pecados y haz que nos reunamos"}, {"t": "p", "x": "un día con ellos en la claridad de tu gloria."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "96", "num": "13.4", "title": "Oración por los familiares y bienhechores", "theme": "enfermos-difuntos", "sub": "Difuntos", "tags": [], "lines": [{"t": "p", "x": "Oh Dios, que por el misterio pascual de tu Hijo"}, {"t": "p", "x": "mantienes la esperanza de nuestra resurrección,"}, {"t": "p", "x": "te pedimos humildemente"}, {"t": "p", "x": "que todos los que participaron en la tierra"}, {"t": "p", "x": "de nuestra fraternidad claretiana"}, {"t": "p", "x": "y colaboraron en nuestra misión de anunciar el Evangelio"}, {"t": "p", "x": "alcancen el gozo de la felicidad eterna."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "97", "num": "13.5", "title": "Oración por los hermanos, parientes y bienhechores", "theme": "enfermos-difuntos", "sub": "Difuntos", "tags": [], "lines": [{"t": "p", "x": "Oh Dios que concedes el perdón de los pecados"}, {"t": "p", "x": "y quieres la salvación de los hombres:"}, {"t": "p", "x": "por intercesión de Santa María la Virgen y de todos los santos,"}, {"t": "p", "x": "concede a nuestros hermanos, parientes y bienhechores"}, {"t": "p", "x": "que han salido ya de este mundo"}, {"t": "p", "x": "alcanzar la eterna bienaventuranza."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "p", "x": "Amén."}]}, {"id": "201", "num": "14.1", "title": "Fiestas de la Virgen María", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Alégrate, María, llena de gracia. El Señor está contigo."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor Jesús, que por intercesión de tu Madre en Caná de Galilea"}, {"t": "p", "x": "convertiste el agua en vino,"}, {"t": "p", "x": "bendice estos alimentos que vamos a tomar,"}, {"t": "p", "x": "y concédenos al recordar en este día a la Virgen María,"}, {"t": "p", "x": "ponernos, como ella, al servicio de tu plan de salvación"}, {"t": "p", "x": "para los hombres."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}, {"t": "r", "x": "Amén."}]}, {"id": "202", "num": "14.2", "title": "San José (19 marzo / 1 mayo)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "El Señor lo amó porque fue varón justo y dio el ciento por uno a su labor."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Dios providente, que confiaste a la fiel custodia"}, {"t": "p", "x": "de San José a tu Hijo Unigénito y a su Madre, María,"}, {"t": "p", "x": "bendice el pan de nuestro sudor y concédenos"}, {"t": "p", "x": "trabajar sin descanso en la extensión de tu Reino."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "203", "num": "14.3", "title": "Fiesta del Corazón de María", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Te damos gracias, Señor, y te bendecimos por el don inestimable de ser y llamarnos «Hijos del Inmaculado Corazón de María»."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor, Dios nuestro,"}, {"t": "p", "x": "que te has dignado convocarnos en la Congregación"}, {"t": "p", "x": "haciéndonos hijos del Corazón Inmaculado de tu Madre,"}, {"t": "p", "x": "concédenos vivir intensamente la piedad filial hacia María"}, {"t": "p", "x": "y bendícenos ahora reunidos en torno a esta mesa"}, {"t": "p", "x": "en la que expresamos y compartimos nuestra fraternidad."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "204", "num": "14.4", "title": "Santa Catalina de Siena (29 abril)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Te alabamos, Señor, porque en Santa Catalina de Siena nos das una muestra de tu poder y de tu sabiduría."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor Dios nuestro,"}, {"t": "p", "x": "que hiciste arder de amor a Ti y a la Iglesia"}, {"t": "p", "x": "a santa Catalina de Siena,"}, {"t": "p", "x": "al bendecir ahora los alimentos que vamos a tomar,"}, {"t": "p", "x": "concédenos mantenernos siempre en tu presencia"}, {"t": "p", "x": "y ser agentes de comunión en tu Iglesia."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "205", "num": "14.5", "title": "Fiestas de los apóstoles (I)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Bendito seas, Jesús, enviado y testigo del Padre."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Bendito seas, Señor, por los frutos de la tierra y del trabajo del hombre:"}, {"t": "p", "x": "que ayuden a mantener fiel en tu santo servicio"}, {"t": "p", "x": "a esta comunidad de vida apostólica."}, {"t": "p", "x": "Por Jesucristo nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "206", "num": "14.6", "title": "Fiestas de los apóstoles (II)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Te alabamos y bendecimos, Cristo, que prolongas tu presencia y tu Palabra en el mundo por medio de los apóstoles."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor Jesús, que nos envías como enviaste a los Apóstoles"}, {"t": "p", "x": "a predicar la Buena Nueva del Reino,"}, {"t": "p", "x": "bendice estos alimentos que vamos a tomar"}, {"t": "p", "x": "y haznos ministros idóneos de tu Palabra, apóstoles incansables de tu Reino."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}, {"t": "r", "x": "Amén."}]}, {"id": "207", "num": "14.7", "title": "Fiestas de los apóstoles (III)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Señor Jesús, esperado por los profetas y anunciado por los Apóstoles y evangelistas:"}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor Jesús, que por amor al Padre y a los hermanos,"}, {"t": "p", "x": "te entregaste a los trabajos e incluso a la muerte"}, {"t": "p", "x": "e hiciste de los Apóstoles testigos de tu vida y tu resurrección,"}, {"t": "p", "x": "bendice esta nuestra mesa y danos el gozo de tu presencia viva entre nosotros."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}, {"t": "r", "x": "Amén."}]}, {"id": "208", "num": "14.8", "title": "Fiestas de los apóstoles (IV)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Señor Jesús que llamaste a los Apóstoles para que estuvieran contigo y para enviarlos a predicar:"}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Tú, Señor, que has confiado a los Apóstoles"}, {"t": "p", "x": "el ir por todo el mundo predicando la Buena Nueva,"}, {"t": "p", "x": "y a nosotros nos has llamado a una vida perfectamente apostólica"}, {"t": "p", "x": "bendice nuestra mesa y haznos participar un día en el banquete de tu Reino."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}, {"t": "r", "x": "Amén."}]}, {"id": "209", "num": "14.9", "title": "Aniversario de la fundación (16 julio)", "theme": "mesa", "sub": "", "tags": ["bendición", "aniversario"], "lines": [{"t": "v", "x": "Bendigamos al Señor, que ha suscitado en la Iglesia nuestra Congregación de Misioneros."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor Dios nuestro que,"}, {"t": "p", "x": "para tu mayor gloria, nuestra santificación y la salvación de los hombres,"}, {"t": "p", "x": "fundaste nuestra Congregación con una intervención especial de"}, {"t": "p", "x": "la Virgen María y por medio de San Antonio María Claret,"}, {"t": "p", "x": "al darte gracias por estos alimentos con que hoy nos bendices"}, {"t": "p", "x": "te pedimos nos concedas ser cada día más fieles a tu llamada,"}, {"t": "p", "x": "según nuestro carisma misionero en la Iglesia."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "210", "num": "14.10", "title": "San Ignacio de Loyola (31 julio)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Glorifiquemos y alabemos al Señor que lo dispone todo para el bien de los que ama."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor, Dios nuestro, que has suscitado en tu Iglesia"}, {"t": "p", "x": "a San Ignacio de Loyola para extender por el mundo"}, {"t": "p", "x": "la gloria de tu nombre:"}, {"t": "p", "x": "bendice estos alimentos y danos hambre y sed de justicia"}, {"t": "p", "x": "para buscar en todo tu mayor gloria"}, {"t": "p", "x": "y la salvación de nuestros hermanos."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "211", "num": "14.11", "title": "San Alfonso María de Ligorio (1 agosto)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Los santos son los amigos de Dios que dan testimonio de la santidad divina."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor, Dios nuestro,"}, {"t": "p", "x": "que has hecho de San Alfonso María de Ligorio"}, {"t": "p", "x": "un sabio y celoso predicador de tu Palabra:"}, {"t": "p", "x": "derrama tu bendición sobre nosotros"}, {"t": "p", "x": "al compartir los alimentos que nos han preparado"}, {"t": "p", "x": "como signo de nuestra fe común y de nuestra misión apostólica."}, {"t": "p", "x": "Haz que también compartamos con los necesitados"}, {"t": "p", "x": "tu divina Palabra y los bienes con que nos bendices."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "212", "num": "14.12", "title": "Beatos Mártires de Barbastro (13 agosto)", "theme": "mesa", "sub": "", "tags": ["bendición", "13 agosto"], "lines": [{"t": "v", "x": "Señor Jesús, que nos has permitido ser bautizados con tu bautismo y nos has dado poder beber el cáliz que el Padre te ha dado:"}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor que has dado la fe a los profetas y a los Apóstoles,"}, {"t": "p", "x": "y a los Mártires Claretianos de Barbastro"}, {"t": "p", "x": "la generosidad en su entrega a Ti hasta el martirio:"}, {"t": "p", "x": "fortalece nuestro cuerpo con los alimentos que vamos a tomar"}, {"t": "p", "x": "e infúndenos la fortaleza necesaria para vivir siempre de la fe"}, {"t": "p", "x": "y entregados a tu servicio."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "213", "num": "14.13", "title": "Santos Arcángeles y Ángeles Custodios (29 sept / 2 oct)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Con el coro de los Ángeles te alabamos y bendecimos, Señor:"}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Señor, Dios nuestro, que nos muestras siempre tu providencia,"}, {"t": "p", "x": "bendice nuestra mesa, signo de tu generosidad para con nosotros."}, {"t": "p", "x": "Y haz que no nos falte nunca la ayuda de quienes te sirven en el cielo"}, {"t": "p", "x": "para alabarte también nosotros por toda la eternidad."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "214", "num": "14.14", "title": "Santa Teresa de Jesús (15 octubre)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Nuestro espíritu, Señor, tiene sed de Ti, como tierra agostada y sin agua."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Oh Dios, que has suscitado en tu Iglesia a Santa Teresa de Jesús"}, {"t": "p", "x": "y por ella nos has mostrado un camino de perfección:"}, {"t": "p", "x": "haz que deseemos no sólo el alimento del cuerpo,"}, {"t": "p", "x": "sino también el pan diario de tu Palabra y de tu Cuerpo"}, {"t": "p", "x": "para desear eficazmente nuestra santificación"}, {"t": "p", "x": "en el anuncio de tu Reino según nuestro carisma en la Iglesia."}, {"t": "p", "x": "Por Jesucristo, nuestro Señor."}, {"t": "r", "x": "Amén."}]}, {"id": "215", "num": "14.15", "title": "San Antonio María Claret (24 octubre)", "theme": "mesa", "sub": "", "tags": ["bendición"], "lines": [{"t": "v", "x": "Bendito seas Señor Jesús, Hijo y Enviado del Padre."}, {"t": "r", "x": "Bendito seas por siempre, Señor."}, {"t": "p", "x": "Bendice, Señor, estos alimentos que vamos a tomar"}, {"t": "p", "x": "e infunde en nosotros el mismo espíritu"}, {"t": "p", "x": "que animó a San Antonio María Claret, nuestro Padre,"}, {"t": "p", "x": "para que, urgidos por él,"}, {"t": "p", "x": "estemos siempre dispuestos a proclamar tu Palabra"}, {"t": "p", "x": "y a dar la vida por los hermanos."}, {"t": "p", "x": "Tú que vives y reinas por los siglos de los siglos."}, {"t": "r", "x": "Amén."}]}],

    dades: [{"id": "1", "num": "1.1", "title": "Pregària apostòlica", "theme": "oraciones-claret", "sub": "de Sant Antoni Maria Claret", "tags": [], "lines": [{"t": "p", "x": "Senyor i Pare meu,"}, {"t": "p", "x": "que us conegui i us faci conèixer,"}, {"t": "p", "x": "que us estimi i us faci estimar,"}, {"t": "p", "x": "que us serveixi i us faci servir,"}, {"t": "p", "x": "que us lloï i us faci lloar de totes les criatures."}, {"t": "p", "x": "Amén."}]}, {"id": "2", "num": "1.2", "title": "Providència de Déu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Beneït sigueu, Senyor, per la vostra providència"}, {"t": "p", "x": "i per la cura que sempre i a tot arreu heu tingut de mi. Amén."}]}, {"id": "3", "num": "1.3", "title": "Estimar i servir Déu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Beneït sigueu, Senyor, pel vostre amor i misericòrdia amb mi."}, {"t": "p", "x": "Feu que us estimi i us serveixi"}, {"t": "p", "x": "i que us faci estimar i servir de totes les criatures. Amén."}]}, {"id": "4", "num": "1.4", "title": "Petició del do de l'amor", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Foc, que sempre cremeu i mai no us apagueu,"}, {"t": "p", "x": "amor, que sempre bulliu i mai no us esmorteïu,"}, {"t": "p", "x": "abruseu-me perquè us estimi."}, {"t": "p", "x": "Us estimo, Jesús, amb tot el meu cor,"}, {"t": "p", "x": "amb tota la meva ànima, amb totes les meves forces."}, {"t": "p", "x": "Voldria estimar-vos més i que tots us estimessin."}, {"t": "p", "x": "Voldria estimar-vos per mi i per totes les vostres criatures."}, {"t": "p", "x": "Verge Santíssima, concediu-me la gràcia"}, {"t": "p", "x": "que tots se salvin i ningú no es condemni. Amén."}]}, {"id": "5", "num": "1.5", "title": "Unió amb Déu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor, així com l'aigua s'ajunta al vi en l'eucaristia,"}, {"t": "p", "x": "així desitjo unir-me a Vós i oferir-me amb Vós a la Santíssima Trinitat. Amén."}]}, {"id": "6", "num": "1.6", "title": "Déu Pare, vida, amor i esperança", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor meu, Vós sou el meu amor, la meva honra, la meva esperança, el meu refugi."}, {"t": "p", "x": "Vós la meva vida, la meva glòria, la meva fi, el meu Mestre, el meu Pare, el meu amor. Amén."}]}, {"id": "7", "num": "1.7", "title": "Déu provident i salvador", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Gràcies, Senyor per la vostra bondat,"}, {"t": "p", "x": "perquè us valeu de tots els mitjans per a la conversió dels pecadors."}, {"t": "p", "x": "Beneïda sigui la vostra providència, que sempre vetlla per mi."}, {"t": "p", "x": "Ara i sempre cantaré la vostra eterna misericòrdia. Amén."}]}, {"id": "8", "num": "1.8", "title": "Només Déu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Senyor, Vós sou el meu amor, la meva honra, la meva esperança i el meu refugi."}, {"t": "p", "x": "Vós sou la meva glòria i la meva fi. El meu mestre, el meu Pare."}, {"t": "p", "x": "Ajudeu-me a no buscar-vos, només a Vós, ni saber res que no sigui la vostra voluntat per complir-la."}, {"t": "p", "x": "Només us vull a Vós, i en Vós i per Vós i per a Vós, les altres coses."}, {"t": "p", "x": "Vós sou per a mi suficientíssim."}, {"t": "p", "x": "Feu que us estimi com Vós m'estimeu, i com voleu que jo us estimi. Amén."}]}, {"id": "9", "num": "1.9", "title": "Tot per a la glòria de Déu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Vull estimar-vos, Déu meu,"}, {"t": "p", "x": "amb tot el meu cor, amb tot el meu ésser, amb totes les meves forces:"}, {"t": "p", "x": "us consagro els meus pensaments, desigs, paraules i accions,"}, {"t": "p", "x": "tot el que tinc i el que pugui tenir."}, {"t": "p", "x": "Feu que esmerci tot el que tinc per a major honra i glòria vostra segons la vostra voluntat. Amén."}]}, {"id": "10", "num": "1.10", "title": "Per demanar l'Esperit", "theme": "oraciones-claret", "sub": null, "tags": ["Esperit Sant"], "lines": [{"t": "p", "x": "Us demano, Senyor, que, a causa de la meva fragilitat,"}, {"t": "p", "x": "m'envieu el vostre Esperit perquè m'il·lumini i encengui en el vostre amor,"}, {"t": "p", "x": "em dirigeixi i encamini pel camí recte de Jesucrist"}, {"t": "p", "x": "i de la Verge Maria, Mare de Déu i mare meva. Amén."}]}, {"id": "11", "num": "1.11", "title": "Per demanar les virtuts", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Crec, Senyor, però que la meva fe sigui més ferma."}, {"t": "p", "x": "Espero, Senyor, però que esperi amb més seguretat."}, {"t": "p", "x": "Estimo, Senyor, però que estimi amb més ardor."}, {"t": "p", "x": "Tinc dolor, Senyor, però que el tingui més vehement."}, {"t": "p", "x": "Us demano, Senyor, què voleu que faci?"}, {"t": "p", "x": "Ensenyeu-me a complir la vostra voluntat, perquè Vós sou el meu Déu."}, {"t": "p", "x": "Concediu-me un cor despert per jutjar el vostre poble,"}, {"t": "p", "x": "i discernir entre el bé i el mal."}, {"t": "p", "x": "Pare, doneu-me humilitat, mansuetud,"}, {"t": "p", "x": "castedat, paciència i caritat."}, {"t": "p", "x": "Pare, ensenyeu-me la bondat, la ciència i la disciplina."}, {"t": "p", "x": "Pare, doneu-me el vostre amor amb la vostra gràcia i seré ric amb escreix."}, {"t": "p", "x": "Déu meu, Jesús meu i totes les meves coses."}, {"t": "p", "x": "Visc en la creu i en la creu vull morir,"}, {"t": "p", "x": "i espero davallar de la creu, no per les mans meves, sinó per les d’altri,"}, {"t": "p", "x": "un cop s’haurà consumat el meu sacrifici."}, {"t": "p", "x": "Ara el que és jo, Déu me’n guard de posar la meva glòria en res més"}, {"t": "p", "x": "que en la creu del Senyor meu Jesucrist,"}, {"t": "p", "x": "pel qual el món és per a mi un crucificat i jo sóc un crucificat per al món."}, {"t": "p", "x": "Amén."}]}, {"id": "12", "num": "1.12", "title": "Exercici d'amor de Déu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Déu meu, sigueu Déu com sou i per sempre:"}, {"t": "p", "x": "m'alegro que ho sigueu."}, {"t": "p", "x": "Vós teniu poder infinit:"}, {"t": "p", "x": "sigueu Déu Totpoderós com ho sou."}, {"t": "p", "x": "Vós teniu saviesa infinita:"}, {"t": "p", "x": "lloat sigueu;"}, {"t": "p", "x": "tingueu infinita saviesa com la teniu."}, {"t": "p", "x": "Vós teniu bondat infinita,"}, {"t": "p", "x": "caritat infinita i clemència infinita."}, {"t": "p", "x": "Tingueu, Senyor, bondat,"}, {"t": "p", "x": "caritat i clemència infinita com la teniu."}, {"t": "p", "x": "Vós, Senyor, tingueu misericòrdia,"}, {"t": "p", "x": "providència i liberalitat com la teniu."}, {"t": "p", "x": "Vós, Senyor, sou gloriós i benaurat per sempre més;"}, {"t": "p", "x": "sigueu gloriós i benaurat com ho sou."}, {"t": "p", "x": "Vós, Senyor, sou Tri i U,"}, {"t": "p", "x": "Pare, Fill i Esperit Sant,"}, {"t": "p", "x": "tres persones distintes i un sol Déu veritable;"}, {"t": "p", "x": "sigueu Tri i U com ho sou."}, {"t": "p", "x": "Sou Salvador i glorificador nostre"}, {"t": "p", "x": "i de totes les criatures; lloat sigueu."}, {"t": "p", "x": "Vós, Senyor, sou Senyor universal"}, {"t": "p", "x": "a qui estimen, lloen i serveixen els àngels"}, {"t": "p", "x": "i els benaurats al cel i els homes a la terra;"}, {"t": "p", "x": "sigueu Vós Senyor de tots,"}, {"t": "p", "x": "i tots al cel i a la terra us estimem,"}, {"t": "p", "x": "lloem i servim per sempre."}, {"t": "p", "x": "Cor de Jesús, estimeu Déu per mi."}, {"t": "p", "x": "Cor de Maria, estimeu Déu per mi."}, {"t": "p", "x": "Cor de tots els sants, estimeu Déu per mi."}, {"t": "p", "x": "Cors de tots els àngels, estimeu Déu per mi."}, {"t": "p", "x": "Criatures totes, estimeu Déu per mi."}, {"t": "p", "x": "Foc diví que sempre cremeu i mai no us extingiu."}, {"t": "p", "x": "Cor de Jesús, que sempre cremeu i mai no us esmorteïu,"}, {"t": "p", "x": "feu que el meu cor cremi sempre en el foc de l’amor diví. Amén."}]}, {"id": "13", "num": "2.1", "title": "Lletania claretiana d'invocacions a Maria", "theme": "corazon-maria", "sub": "del P. Fundador", "tags": ["lletania"], "lines": [{"t": "p", "x": "Santa Maria, Filla del Pare."}, {"t": "r", "x": "Pregueu per nosaltres."}, {"t": "p", "x": "Santa Maria, Mare del Fill."}, {"t": "p", "x": "Santa Maria, Temple de l'Esperit Sant."}, {"t": "p", "x": "Terme i coronació de la Trinitat."}, {"t": "p", "x": "Delícia de Déu."}, {"t": "p", "x": "L'obra més perfecta de Déu."}, {"t": "p", "x": "Concebuda en gràcia."}, {"t": "p", "x": "En qui brillen l’omnipotència, saviesa i bondat de Déu."}, {"t": "p", "x": "Concebuda en gràcia, confirmada en gràcia i plena de gràcia."}, {"t": "p", "x": "Exempta de tot contagi de pecat."}, {"t": "p", "x": "Criatura singularíssima i predilecta."}, {"t": "p", "x": "Purificada i santificada en la seva mateixa concepció."}, {"t": "p", "x": "Preservada de tota culpa."}, {"t": "p", "x": "Hereva del cel."}, {"t": "p", "x": "Confirmada en gràcia."}, {"t": "p", "x": "Enlairada a dignitat gairebé infinita."}, {"t": "p", "x": "Plena de gràcia."}, {"t": "p", "x": "La més pura i de més encesa caritat."}, {"t": "p", "x": "Mare de Déu i dels homes."}, {"t": "p", "x": "Mare de Déu humanat."}, {"t": "p", "x": "Mare veritable."}, {"t": "p", "x": "Mare espiritual."}, {"t": "p", "x": "Mare del bell amor."}, {"t": "p", "x": "Mare de caritat."}, {"t": "p", "x": "Mare de pietat i de misericòrdia."}, {"t": "p", "x": "Mare dels vivents."}, {"t": "p", "x": "Mare entranyable."}, {"t": "p", "x": "Mare, mestra i directora."}, {"t": "p", "x": "Mare que ens va rebre de Déu com a fills."}, {"t": "p", "x": "Formadora i guia d'apòstols i missioners."}, {"t": "p", "x": "Mare i advocada dels pecadors."}, {"t": "p", "x": "Mare, alleujament, fortalesa i consol."}, {"t": "p", "x": "Dispensadora de misericòrdies."}, {"t": "p", "x": "Canal de gràcia."}, {"t": "p", "x": "Refugi de desvalguts."}, {"t": "p", "x": "Nord de navegants."}, {"t": "p", "x": "Salut de malalts."}, {"t": "p", "x": "Alè de moribunds."}, {"t": "p", "x": "Redemptora de captius."}, {"t": "p", "x": "Insigne advocada."}, {"t": "p", "x": "Consol d'afligits."}, {"t": "p", "x": "Escala del cel."}, {"t": "p", "x": "Finestra del paradís."}, {"t": "p", "x": "Reina de cel i terra."}, {"t": "p", "x": "Reina i senyora de la gràcia."}, {"t": "p", "x": "Cor de l'Església."}, {"t": "p", "x": "Cor del món cristià."}]}, {"id": "14", "num": "2.2", "title": "Súplica a Maria", "theme": "corazon-maria", "sub": "del P. Fundador", "tags": [], "lines": [{"t": "p", "x": "Verge i Mare de Déu,"}, {"t": "p", "x": "gireu els vostres ulls misericordiosos vers nosaltres"}, {"t": "p", "x": "que ens trobem en aquesta vall de llàgrimes,"}, {"t": "p", "x": "i que confiem en vós perquè som els vostres fills."}, {"t": "p", "x": "Ajudeu-nos a anunciar la Bona Nova del Regne"}, {"t": "p", "x": "en fidelitat i fortalesa,"}, {"t": "p", "x": "perquè són molts els qui s'hi oposen"}, {"t": "p", "x": "per ambició de poder, per afany de riqueses o per ànsia de plaers."}, {"t": "p", "x": "Disposeu de mi per a cooperar amb el vostre ofici maternal"}, {"t": "p", "x": "a la missió apostòlica."}, {"t": "p", "x": "Amén."}]}, {"id": "15", "num": "2.3", "title": "Invocacions a Maria", "theme": "corazon-maria", "sub": "del P. Fundador", "tags": [], "lines": [{"t": "p", "x": "Déu vos salve, Immaculada Maria, Filla de Déu Pare."}, {"t": "p", "x": "Déu vos salve, Immaculada Maria, Mare de Déu Fill."}, {"t": "p", "x": "Déu vos salve, Immaculada Maria, Temple de Déu Esperit Sant."}, {"t": "p", "x": "Déu vos salve Maria, mare i advocada dels pecadors."}, {"t": "p", "x": "Beneïda sou entre totes les dones."}, {"t": "p", "x": "Vós sou la glòria de Jerusalem,"}, {"t": "p", "x": "l'alegria d'Israel i l'honor del nostre poble."}, {"t": "p", "x": "Vós sou l'empara dels desvalguts,"}, {"t": "p", "x": "el consol dels afligits, el nord dels navegants."}, {"t": "p", "x": "Vós sou la salut dels malalts, l'alè dels moribunds,"}, {"t": "p", "x": "i la porta del cel."}, {"t": "p", "x": "Vós sou, després de Jesucrist, fruit beneït del vostre ventre,"}, {"t": "p", "x": "tota la nostra esperança."}, {"t": "p", "x": "Oh clement, oh pia, oh dolça i Immaculada Maria."}]}, {"id": "16", "num": "2.4", "title": "Mare de l'Amor diví", "theme": "corazon-maria", "sub": "del P. Fundador", "tags": [], "lines": [{"t": "p", "x": "Maria, Mare meva, Mare de l’Amor diví! No puc demanar res que us sigui més agradable ni més fàcil de concedir"}, {"t": "p", "x": "que l’amor diví."}, {"t": "p", "x": "Concediu-me'l, Mare meva."}, {"t": "p", "x": "Mare meva, tinc fam i set d'amor."}, {"t": "p", "x": "Socorreu-me, sacieu-me."}, {"t": "p", "x": "Oh, Cor de Maria, farga i instrument de l'amor,"}, {"t": "p", "x": "enceneu-me en l'amor de Déu i del proïsme!"}]}, {"id": "17", "num": "2.5", "title": "Fill i Ministre de Maria", "theme": "corazon-maria", "sub": "del P. Fundador", "tags": [], "lines": [{"t": "p", "x": "Oh Verge i Mare de Déu!,"}, {"t": "p", "x": "sabeu prou bé que som fills i ministres vostres,"}, {"t": "p", "x": "formats per Vós mateixa"}, {"t": "p", "x": "en la farga de la vostra misericòrdia i amor."}, {"t": "p", "x": "Som com una fletxa posada en la vostra mà poderosa."}, {"t": "p", "x": "Llanceu-nos, Mare nostra,"}, {"t": "p", "x": "contra tot el que s'oposa al Regne de Déu."}, {"t": "p", "x": "Confiats en la vostra protecció,"}, {"t": "p", "x": "anunciarem l'Evangeli"}, {"t": "p", "x": "sense més armes que l’espasa de dos talls"}, {"t": "p", "x": "de la Paraula divina,"}, {"t": "p", "x": "sense més títols que el de fills del vostre Cor Immaculat."}, {"t": "p", "x": "Vostra serà, Mare, la victòria."}, {"t": "p", "x": "Amén."}]}, {"id": "18", "num": "2.6", "title": "Configuració amb Crist", "theme": "corazon-maria", "sub": "de la Congregació
