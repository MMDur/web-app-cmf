, {"t": "p", "x": "Sollecitati da ciò che è più opportuno ed efficace nel compimento della nostra missione, attese le circostanze di luogo, di tempo e di persone,"}, {"t": "v", "x": "ti chiediamo, Signore: aiutaci a determinare un buon programma di azione e di vita missionaria, in comunione con tutta Congregazione."}, {"t": "p", "x": "Signore e Padre nostro, per l’intercessione di Maria, Madre e Fondatrice della nostra Congregazione, mandaci il tuo Spirito perché sull’esempio del tuo Figlio Gesù, ci sentiamo spinti, dall’amore verso di Te e verso gli uomini, ad avere occhi penetranti ed orecchie attente sulle necessità del mondo, a mantenere l’unità nonostante le differenze, congregati come siamo nella stessa comunità, e a realizzare la missione che abbiamo ricevuto attraverso Sant’Antonio Maria Claret, nostro Padre."}, {"t": "p", "x": "Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "**P****reghiera**** per ****il**** XXVII ****capitolo**** ****generale**"}, {"t": "p", "x": "Vieni, Spirito Santo,"}, {"t": "p", "x": "soffio del Padre"}, {"t": "p", "x": "e fuoco vivo del Figlio risorto:"}, {"t": "p", "x": "rinnova la nostra Congregazione."}, {"t": "p", "x": "Fa’ che la preparazione al Capitolo Generale"}, {"t": "p", "x": "sia un tempo di grazia, di ascolto e di discernimento."}, {"t": "p", "x": "Effondi su di noi una rinnovata Pentecoste,"}, {"t": "p", "x": "perché possiamo camminare insieme nella comunione,"}, {"t": "p", "x": "come missionari mistici e profetici"}, {"t": "p", "x": "al servizio dell’unica missione di Cristo."}, {"t": "p", "x": "Uniti a Maria, nostra Madre,"}, {"t": "p", "x": "a sant’Antonio Maria Claret"}, {"t": "p", "x": "e alla testimonianza fedele dei nostri martiri,"}, {"t": "p", "x": "insegnaci ad ascoltare la tua voce"}, {"t": "p", "x": "nel grido dei poveri,"}, {"t": "p", "x": "nelle ferite del mondo"}, {"t": "p", "x": "e nella vita delle nostre comunità."}, {"t": "p", "x": "Plasmaci nella fucina del Cuore Immacolato di Maria,"}, {"t": "p", "x": "perché, guidati dal tuo Spirito,"}, {"t": "p", "x": "diventiamo segni di fraternità, di speranza"}, {"t": "p", "x": "e di ardore missionario"}, {"t": "p", "x": "per la Chiesa e per il mondo."}, {"t": "p", "x": "Amen."}]}, {"id": "xxvii", "num": "11.3", "title": "Preghiera per il XXVII Capitolo Generale", "theme": "capitulos", "sub": null, "tags": ["capitolo"], "lines": [{"t": "p", "x": "Vieni, Spirito Santo,"}, {"t": "p", "x": "soffio del Padre e fuoco vivo del Figlio risorto:"}, {"t": "p", "x": "rinnova la nostra Congregazione."}, {"t": "p", "x": "Fa' che la preparazione al Capitolo Generale"}, {"t": "p", "x": "sia un tempo di grazia, di ascolto e di discernimento."}, {"t": "p", "x": "Effondi su di noi una rinnovata Pentecoste,"}, {"t": "p", "x": "perché possiamo camminare insieme nella comunione,"}, {"t": "p", "x": "come missionari mistici e profetici"}, {"t": "p", "x": "al servizio dell'unica missione di Cristo."}, {"t": "p", "x": "Uniti a Maria, nostra Madre,"}, {"t": "p", "x": "a sant'Antonio Maria Claret"}, {"t": "p", "x": "e alla testimonianza fedele dei nostri martiri,"}, {"t": "p", "x": "insegnaci ad ascoltare la tua voce"}, {"t": "p", "x": "nel grido dei poveri,"}, {"t": "p", "x": "nelle ferite del mondo"}, {"t": "p", "x": "e nella vita delle nostre comunità."}, {"t": "p", "x": "Plasmaci nella fucina del Cuore Immacolato di Maria,"}, {"t": "p", "x": "perché, guidati dal tuo Spirito,"}, {"t": "p", "x": "diventiamo segni di fraternità, di speranza"}, {"t": "p", "x": "e di ardore missionario per la Chiesa e per il mondo."}, {"t": "p", "x": "Amen."}]}, {"id": "131", "num": "12.1", "title": "Veni, Sancte Spiritus", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Vieni, Santo Spirito, riempi il cuore dei tuoi fedeli,"}, {"t": "p", "x": "accendi in essi il fuoco del tuo amore"}, {"t": "v", "x": "Manda il tuo Spirito: tutto sarà ricreato,"}, {"t": "p", "x": "R. E rinnoverai la faccia della terra."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "O Dio,"}, {"t": "p", "x": "che hai illuminato i cuori dei tuoi fedeli"}, {"t": "p", "x": "con la luce dello Spirito Santo,"}, {"t": "p", "x": "rendici a Lui docili"}, {"t": "p", "x": "perché possiamo agire sempre bene"}, {"t": "p", "x": "e godere della sua consolazione."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "132", "num": "12.2", "title": "Radunati nel tuo nome", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Radunati nel tuo nome, o Signore,"}, {"t": "p", "x": "vogliamo stare alla tua presenza!"}, {"t": "p", "x": "Concedi a noi uno spirito capace di dialogo,"}, {"t": "p", "x": "illumina le nostre menti con la luce della tua verità"}, {"t": "p", "x": "e rafforza il nostro spirito fraterno"}, {"t": "p", "x": "affinché cerchiamo, sempre insieme,"}, {"t": "p", "x": "di conoscere e di compiere la tua volontà."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "133", "num": "12.3", "title": "Donaci la sapienza (Sap 9, 1-6.9-11)", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Dio dei padri e Signore di misericordia,"}, {"t": "p", "x": "che tutto hai creato con la tua parola,"}, {"t": "p", "x": "che con la tua sapienza hai formato l’uomo,"}, {"t": "p", "x": "perché domini sulle creature fatte da te,"}, {"t": "p", "x": "e governi il mondo con santità e giustizia,"}, {"t": "p", "x": "e pronunzi giudizi con animo retto,"}, {"t": "p", "x": "dammi la sapienza che siede in trono accanto a te"}, {"t": "p", "x": "e non mi escludere dal numero dei tuoi figli,"}, {"t": "p", "x": "perché io sono tuo servo e figlio della tua ancella,"}, {"t": "p", "x": "uomo debole e di vita breve,"}, {"t": "p", "x": "incapace di comprendere la giustizia e le leggi."}, {"t": "p", "x": "Se anche uno fosse il più perfetto tra gli uomini,"}, {"t": "p", "x": "mancandogli la tua sapienza, sarebbe stimato un nulla."}, {"t": "p", "x": "Con te è la sapienza che conosce le tue opere,"}, {"t": "p", "x": "che era presente quando creavi il mondo;"}, {"t": "p", "x": "essa conosce che cosa è gradito ai tuoi occhi"}, {"t": "p", "x": "e ciò che è conforme ai tuoi decreti."}, {"t": "p", "x": "Inviala dai cieli santi, mandala dal tuo trono glorioso"}, {"t": "p", "x": "perché mi assista e mi affianchi nella mia fatica"}, {"t": "p", "x": "e io sappia ciò che ti è gradito."}, {"t": "p", "x": "Essa infatti tutto conosce e tutto comprende,"}, {"t": "p", "x": "e mi guiderà prudentemente nelle mie azioni"}, {"t": "p", "x": "e mi proteggerà con la sua gloria."}, {"t": "p", "x": "Amen."}]}, {"id": "134", "num": "12.4", "title": "Cercare e compiere insieme la volontà di Dio", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Antifona"}, {"t": "p", "x": "Dice il Signore: Dove due o tre si riuniranno nel mio nome,"}, {"t": "p", "x": "là sono io in mezzo a loro."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Dio e Padre nostro, il tuo Figlio ha promesso la sua presenza"}, {"t": "p", "x": "nel cuore di quanti sono radunati nel suo nome:"}, {"t": "p", "x": "fa’ che lo sentiamo presente in mezzo a noi;"}, {"t": "p", "x": "che esprimiamo la comunione di vita"}, {"t": "p", "x": "e la missione di tutto l’Istituto,"}, {"t": "p", "x": "al fine di cominciare una vita nuova"}, {"t": "v", "x": "obbedienti allo Spirito"}, {"t": "p", "x": "e in piena fedeltà al nostro carisma missionario -;"}, {"t": "p", "x": "e fa’ che, conosciuta la tua volontà,"}, {"t": "p", "x": "la compiamo in un unico volere e sentire"}, {"t": "p", "x": "per realizzare la nostra comune missione nella Chiesa."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "135", "num": "12.5", "title": "Grazia e disposizioni per il dialogo", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Siamo qui, o Signore,"}, {"t": "p", "x": "riuniti nel tuo nome e desiderosi di realizzare il tuo Regno."}, {"t": "p", "x": "Lo Spirito Santo, che hai inviato"}, {"t": "p", "x": "nei nostri cuori"}, {"t": "p", "x": "e che mantiene viva la tua presenza fra di noi"}, {"t": "p", "x": "ci insegni ciò che dobbiamo approfondire"}, {"t": "p", "x": "e fin dove dobbiamo camminare,"}, {"t": "p", "x": "affinché, rafforzati dalla tua grazia,"}, {"t": "p", "x": "possiamo realizzare i tuoi disegni."}, {"t": "p", "x": "Sii tu, Spirito Santo,"}, {"t": "p", "x": "l’ispiratore e l’animatore del nostro discernimento."}, {"t": "p", "x": "Insegnaci ad ascoltare gli altri,"}, {"t": "p", "x": "a lasciarci illuminare dalle loro luci,"}, {"t": "p", "x": "a proporre e a non imporre."}, {"t": "p", "x": "Donaci l’equità."}, {"t": "p", "x": "Liberaci dalla cecità di chi ritiene di aver sempre ragione,"}, {"t": "p", "x": "dai favoritismi e da ogni giudizio sulle persone."}, {"t": "p", "x": "Uniti a Te, fa’ che non ci allontaniamo mai dalla verità."}, {"t": "p", "x": "Amen."}]}, {"id": "136", "num": "12.6", "title": "Luce per scoprire le esigenze del Vangelo", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Padre buono,"}, {"t": "p", "x": "guarda questa comunità radunata nel tuo nome"}, {"t": "p", "x": "per condividere la fraternità e dialogare nella verità."}, {"t": "p", "x": "Concedile di scoprire con maggiore chiarezza"}, {"t": "p", "x": "le esigenze del Vangelo"}, {"t": "p", "x": "per essere luce del mondo e sale della terra."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "137", "num": "12.7", "title": "Preghiera per iniziare una riunione", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "La tua grazia, Signore, ispiri,"}, {"t": "p", "x": "sostenga ed accompagni le nostre opere"}, {"t": "p", "x": "perché il nostro lavoro cominci da Te, come da sua fonte,"}, {"t": "p", "x": "e tenda a Te, come a suo termine."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "138", "num": "12.8", "title": "Ringraziamento per un incontro", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Padre di bontà,"}, {"t": "p", "x": "ti ringraziamo per questo incontro"}, {"t": "p", "x": "nel quale abbiamo condiviso"}, {"t": "p", "x": "le nostre attese e le nostre disillusioni,"}, {"t": "p", "x": "i nostri progetti e le nostre fatiche."}, {"t": "p", "x": "Fa’ che rispondiamo sempre efficacemente"}, {"t": "p", "x": "alla nostra vocazione e alla nostra missione nella Chiesa,"}, {"t": "p", "x": "sull’esempio del Claret, nostro Padre e Fondatore."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "139", "num": "12.9", "title": "Un cuor solo e un’anima sola", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Ti ringraziamo per questo incontro comunitario, Signore;"}, {"t": "p", "x": "e per la tua bontà,"}, {"t": "p", "x": "per la tua presenza fra noi."}, {"t": "p", "x": "Fa’ che con spirito fraterno"}, {"t": "p", "x": "conserviamo un sol cuore e un’anima sola"}, {"t": "p", "x": "per essere una comunità"}, {"t": "p", "x": "evangelizzata ed evangelizzante."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "**Preghiere per iniziare gli esercizi spirituali**"}]}, {"id": "91", "num": "13.1", "title": "Per i fratelli infermi", "theme": "enfermos-difuntos", "sub": null, "tags": [], "lines": [{"t": "v", "x": "Guarda con amore, Signore, ai nostri fratelli infermi."}, {"t": "r", "x": "Sperino fiduciosamente in Te."}, {"t": "v", "x": "Assistili con la tua bontà."}, {"t": "r", "x": "Consola il loro cuore e allevia le loro sofferenze."}, {"t": "v", "x": "Ascolta le loro preghiere e suppliche, Padre."}, {"t": "r", "x": "Dona loro forza e pace per compiere la tua volontà."}, {"t": "v", "x": "Fa’ che, a letto, si ricordino sempre di Te."}, {"t": "r", "x": "E che vegliando meditino su di Te."}, {"t": "v", "x": "Sei stato loro aiuto."}, {"t": "r", "x": "Restino sempre uniti a Te."}, {"t": "v", "x": "Ricordati, Padre, di tutti gli uomini e di tutte le donne che soffrono."}, {"t": "r", "x": "Allevia le loro sofferenze e fa’ che ci sentiamo solidali, noi stessi aiutandoli ed assistendoli amorevolmente."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Padre di bontà, che plachi il dolore"}, {"t": "p", "x": "dei nostri fratelli infermi,"}, {"t": "p", "x": "cura la loro malattia, ravviva la loro speranza,"}, {"t": "p", "x": "confortali e consolali con la tua grazia"}, {"t": "p", "x": "affinché, ristabiliti secondo la tua volontà e misericordia,"}, {"t": "p", "x": "si incorporino nuovamente alla vita della comunità"}, {"t": "p", "x": "e al servizio del Vangelo."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "rub", "x": "Oppure:"}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Padre di bontà, che hai voluto"}, {"t": "p", "x": "che il tuo Figlio sopportasse le nostre debolezze,"}, {"t": "p", "x": "per manifestare"}, {"t": "p", "x": "il valore della malattia e della pazienza,"}, {"t": "p", "x": "ascolta le preghiere che rivolgiamo a Te"}, {"t": "p", "x": "per i nostri fratelli di Congregazione infermi,"}, {"t": "p", "x": "e per quanti vivono oppressi dal dolore,"}, {"t": "p", "x": "dall’afflizione o dalla malattia."}, {"t": "p", "x": "Concedi loro la grazia di unirsi alla passione di Cristo"}, {"t": "p", "x": "per la redenzione del mondo."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "rub", "x": "Oppure"}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Dio e Signore nostro,"}, {"t": "p", "x": "salvezza di quanti credono in Te,"}, {"t": "p", "x": "ascolta le preghiere che ti rivolgiamo"}, {"t": "p", "x": "per i nostri fratelli di Congregazione:"}, {"t": "p", "x": "sostienili con l’aiuto della tua misericordia"}, {"t": "p", "x": "affinché, ricuperata la salute, possano servirti"}, {"t": "p", "x": "nella costruzione del tuo Regno."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "92", "num": "13.2", "title": "Per i nostri fratelli ammalati", "theme": "enfermos-difuntos", "sub": null, "tags": [], "lines": [{"t": "v", "x": "Salva i tuoi servi, Signore."}, {"t": "r", "x": "Sperino in Te."}, {"t": "v", "x": "Manda loro l’aiuto dal tuo Santuario."}, {"t": "r", "x": "Proteggili da Sion."}, {"t": "v", "x": "Sii loro baluardo, Signore."}, {"t": "r", "x": "Dinanzi al nemico."}, {"t": "v", "x": "Concedi loro la tua forza."}, {"t": "r", "x": "Sul letto del dolore."}, {"t": "v", "x": "Ascolta, Signore, la nostra preghiera."}, {"t": "r", "x": "E il nostro grido giunga fino a Te."}, {"t": "v", "x": "Il Signore sia con voi."}, {"t": "r", "x": "E con il tuo spirito."}, {"t": "rub", "x": "Preghiamo"}, {"t": "p", "x": "O Dio,"}, {"t": "p", "x": "che compatisci sempre e sempre perdoni,"}, {"t": "p", "x": "accogli la nostra preghiera"}, {"t": "p", "x": "perché la tua pietà misericordiosa"}, {"t": "p", "x": "assolva benignamente"}, {"t": "p", "x": "noi e i nostri fratelli ammalati."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "rub", "x": "Oppure"}, {"t": "p", "x": "O Dio, difesa singolare contro l’umana debolezza,"}, {"t": "p", "x": "manifesta la forza del tuo aiuto sui nostri fratelli ammalati,"}, {"t": "p", "x": "affinché, sostenuti dalla tua misericordia,"}, {"t": "p", "x": "meritino di presentarsi nuovamente sani dinanzi alla tua Chiesa."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "rub", "x": "Oppure"}, {"t": "p", "x": "Ti chiediamo, Signore,"}, {"t": "p", "x": "che noi tuoi servi godiamo sempre la salute"}, {"t": "p", "x": "dell’anima e del corpo"}, {"t": "p", "x": "e, per l’intercessione della Santa Vergine Maria,"}, {"t": "p", "x": "liberaci dalle tristezze di questo mondo"}, {"t": "p", "x": "e donaci le gioie del paradiso."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "94", "num": "13.3", "title": "Preghiera per i defunti della Congregazione", "theme": "enfermos-difuntos", "sub": "Defunti", "tags": [], "lines": [{"t": "v", "x": "Dona loro, Signore, il riposo eterno."}, {"t": "r", "x": "E splenda ad essi la luce perpetua."}, {"t": "v", "x": "Riposino in pace."}, {"t": "r", "x": "Amen."}, {"t": "v", "x": "Le anime di tutti i fedeli defunti,"}, {"t": "p", "x": "per la misericordia di Dio, riposino in pace."}, {"t": "r", "x": "Amen."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "O Dio, che nel mistero pasquale del tuo Figlio"}, {"t": "p", "x": "mantieni desta la speranza"}, {"t": "p", "x": "della nostra felicità futura,"}, {"t": "p", "x": "umilmente ti chiediamo"}, {"t": "p", "x": "che quanti sulla terra hanno partecipato"}, {"t": "p", "x": "della nostra fraternità clarettiana"}, {"t": "p", "x": "e hanno speso la loro vita per la propagazione del tuo Regno"}, {"t": "p", "x": "raggiungano la gioia dell’eterna felicità"}, {"t": "p", "x": "nel cielo dei Santi e dei Beati."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "95", "num": "13.4", "title": "Preghiera per i genitori defunti", "theme": "enfermos-difuntos", "sub": "Defunti", "tags": [], "lines": [{"t": "p", "x": "O Dio, che ci hai comandato di onorare il padre e la madre,"}, {"t": "p", "x": "abbi misericordia dei nostri genitori:"}, {"t": "p", "x": "perdona i loro peccati e fa’ che un giorno"}, {"t": "p", "x": "ci raduniamo insieme con loro nella chiarità della tua gloria."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen,"}]}, {"id": "96", "num": "13.5", "title": "Preghiera per i familiari e i benefattori", "theme": "enfermos-difuntos", "sub": "Defunti", "tags": [], "lines": [{"t": "p", "x": "O Dio, che nel mistero pasquale del tuo Figlio"}, {"t": "p", "x": "mantieni desta la speranza della nostra resurrezione,"}, {"t": "p", "x": "ti chiediamo umilmente"}, {"t": "p", "x": "che quanti sulla terra hanno partecipato"}, {"t": "p", "x": "della nostra fraternità clarettiana"}, {"t": "p", "x": "e hanno collaborato nella nostra missione di annunciare il Vangelo"}, {"t": "p", "x": "ricevano la gioia dell’eterna felicità."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "97", "num": "13.6", "title": "Preghiera per i fratelli, i parenti e i benefattori", "theme": "enfermos-difuntos", "sub": "Defunti", "tags": [], "lines": [{"t": "p", "x": "O Dio, che concedi il perdono dei peccati"}, {"t": "p", "x": "e vuoi la salvezza degli uomini,"}, {"t": "p", "x": "per intercessione della Vergine Maria"}, {"t": "p", "x": "e di tutti i Santi,"}, {"t": "p", "x": "concedi ai nostri fratelli, parenti e benefattori"}, {"t": "p", "x": "che hanno lasciato questo mondo"}, {"t": "p", "x": "di raggiungere la beatitudine eterna."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "III. PREGHIERA QUOTIDIANA"}]}, {"id": "201", "num": "14.1", "title": "Ave, Maria, piena di grazia.", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Il Signore è con te"}, {"t": "p", "x": "Sii benedetto per sempre, Signore"}, {"t": "p", "x": "Signore, Gesù, che a Cana di Galilea,"}, {"t": "p", "x": "per intercessione della Madre tua,"}, {"t": "p", "x": "mutasti l’acqua in vino"}, {"t": "p", "x": "benedici il cibo che stiamo per prendere,"}, {"t": "p", "x": "e concedici, mentre quest’oggi ricordiamo la Vergine Maria,"}, {"t": "p", "x": "di dedicarci, come elle fece,"}, {"t": "p", "x": "al servizio del tuo disegno di salvezza"}, {"t": "p", "x": "per tutti gli uomini."}, {"t": "p", "x": "Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "SAN GIUSEPPE"}, {"t": "p", "x": "(19 MARZO – 1 MAGGIO)"}]}, {"id": "202", "num": "14.2", "title": "Il Signore lo amò perché fu uomo giusto", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "e rese al suo lavoro il cento per uno."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore*"}, {"t": "p", "x": "Dio provvidente, che affidasti alla fedele custodia"}, {"t": "p", "x": "di San Giuseppe il tuo Figlio unigenito e sua Madre, Maria,"}, {"t": "p", "x": "benedici il pane del nostro sudore e concedici"}, {"t": "p", "x": "di lavorare senza riposo all’espansione del tuo Regno."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "FESTA DEL CUORE DI MARIA"}]}, {"id": "203", "num": "14.3", "title": "Ti ringraziamo e ti benediciamo, Signore,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "per il dono inestimabile di essere e di chiamarci"}, {"t": "p", "x": "Figli del Cuore Immacolato di Maria."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore*"}, {"t": "p", "x": "Signore, Dio nostro,"}, {"t": "p", "x": "che ti sei degnato di convocarci nella Congregazione"}, {"t": "p", "x": "facendoci Figli del Cuore Immacolato della Madre tua,"}, {"t": "p", "x": "concedi ai tuoi fedeli di vivere intensamente la pietà filiale verso Maria"}, {"t": "p", "x": "e benedici noi ora riuniti intorno a questa mensa"}, {"t": "p", "x": "dove esprimiamo e dividiamo la nostra fraternità."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "SANTA CATERINA DA SIENA, COMPATRONA"}, {"t": "p", "x": "(29 APRILE)"}]}, {"id": "204", "num": "14.4", "title": "Ti lodiamo, Signore, perché in Santa Caterina da Siena", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "ci doni prova di potenza e sapienza."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore.*"}, {"t": "p", "x": "Signore Dio nostro,"}, {"t": "p", "x": "che donasti a Santa Caterina da Siena"}, {"t": "p", "x": "di ardere di amore per Te e per la Chiesa,"}, {"t": "p", "x": "benedici questo cibo che stiamo per prendere"}, {"t": "p", "x": "e concedi a noi di mantenerci sempre alla tua presenza"}, {"t": "p", "x": "e di essere nella tua Chiesa agenti di comunione."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "FESTE DEGLI APOSTOLI"}]}, {"id": "205", "num": "14.5", "title": "Sii benedetto, Gesù, inviato e testimone del Padre.", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Sii benedetto per sempre, Signore"}, {"t": "p", "x": "Sii benedetto, Signore, per i frutti della terra"}, {"t": "p", "x": "e del lavoro dell’uomo:"}, {"t": "p", "x": "aiutino questa comunità di vita apostolica"}, {"t": "p", "x": "a mantenersi fedele al tuo santo servizio."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}]}, {"id": "206", "num": "14.6", "title": "Ti lodiamo e ti benediciamo, Cristo,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "che prolunghi la tua presenza e la tua parola nel mondo"}, {"t": "p", "x": "per mezzo degli Apostoli."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore.*"}, {"t": "p", "x": "Signore Gesù, che ci invii come inviasti gli Apostoli"}, {"t": "p", "x": "a predicare la Buona Novella del Regno,"}, {"t": "p", "x": "benedici questo cibo che stiamo per prendere"}, {"t": "p", "x": "e rendici ministri idonei della tua Parola,"}, {"t": "p", "x": "apostoli instancabili del tuo Regno."}, {"t": "p", "x": "Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen"}]}, {"id": "207", "num": "14.7", "title": "Signore Gesù, atteso dai profeti", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "e annunciato dagli apostoli e dagli evangelisti."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore.*"}, {"t": "p", "x": "Signore Gesù, che per amore al Padre e ai fratelli,"}, {"t": "p", "x": "hai voluto offrirti al sacrificio e alla morte"}, {"t": "p", "x": "e fare degli apostoli testimoni della tua vita"}, {"t": "p", "x": "e della tua risurrezione,"}, {"t": "p", "x": "benedici il nostro cibo e donaci la gioia"}, {"t": "p", "x": "della tua presenza viva in mezzo a noi."}, {"t": "p", "x": "Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen"}]}, {"id": "208", "num": "14.8", "title": "Signore Gesù, che chiamasti gli Apostoli", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "perché stessero con te e per inviarli a predicare."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore.*"}, {"t": "p", "x": "Tu, o Signore, che hai affidato agli Apostoli"}, {"t": "p", "x": "il compito di andare nel mondo intero"}, {"t": "p", "x": "a predicare la Buona Novella"}, {"t": "p", "x": "e hai chiamato noi"}, {"t": "p", "x": "ad una vita perfettamente apostolica,"}, {"t": "p", "x": "benedici la nostra mensa e concedi che un giorno"}, {"t": "p", "x": "possiamo partecipare al banchetto del tuo Regno."}, {"t": "p", "x": "Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "ANNIVERSARIO DELLA FONDAZIONE DELLA CONGREGAZIONE (16 LUGLIO)"}]}, {"id": "209", "num": "14.9", "title": "Benediciamo il Signore, che ha suscitato nella Chiesa", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "la nostra Congregazione di Missionari."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore.*"}, {"t": "p", "x": "Signore Dio nostro che,"}, {"t": "p", "x": "a tua maggior gloria, per la nostra santificazione"}, {"t": "p", "x": "e per la salvezza degli uomini,"}, {"t": "p", "x": "hai fondato la nostra Congregazione"}, {"t": "p", "x": "con l’intervento speciale"}, {"t": "p", "x": "della Vergine Maria"}, {"t": "p", "x": "e per mezzo di S. Antonio Maria Claret,"}, {"t": "p", "x": "mentre ti ringraziamo per questo cibo"}, {"t": "p", "x": "col quale oggi ci benedici,"}, {"t": "p", "x": "ti chiediamo di concederci"}, {"t": "p", "x": "di essere ogni giorno più fedeli alla tua chiamata,"}, {"t": "p", "x": "secondo il nostro carisma missionario nella Chiesa."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "SANT’IGNAZIO DI LOYOLA"}, {"t": "p", "x": "(31 LUGLIO)"}]}, {"id": "210", "num": "14.10", "title": "Glorifichiamo e lodiamo il Signore", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "che tutto dispone al bene di coloro che ama."}, {"t": "p", "x": "Sii benedetto per sempre, Signore."}, {"t": "p", "x": "Signore, Dio nostro, che hai suscitato nella tua Chiesa"}, {"t": "p", "x": "Sant’Ignazio di Loyola per estendere in tutto il mondo"}, {"t": "p", "x": "la gloria del tuo nome:"}, {"t": "p", "x": "benedici questi alimenti e donaci fame e sete di giustizia"}, {"t": "p", "x": "per cercare in ogni cosa la tua gloria"}, {"t": "p", "x": "e la salvezza dei nostri fratelli."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "SANT’ALFONSO MARIA DE’ LIGUORI,"}, {"t": "p", "x": "COMPATRONO (1 AGOSTO)"}]}, {"id": "211", "num": "14.11", "title": "I santi sono gli amici di Dio", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "che rendono testimonianza della santità divina."}, {"t": "p", "x": "Sii benedetto per sempre, Signore."}, {"t": "p", "x": "Signore, Dio nostro,"}, {"t": "p", "x": "che hai fatto di Sant’Alfonso Maria de’ Liguori"}, {"t": "p", "x": "un saggio e zelante predicatore della tua Parola:"}, {"t": "p", "x": "riversa su di noi la tua benedizione"}, {"t": "p", "x": "mentre condividiamo questo cibo che per noi hai preparato"}, {"t": "p", "x": "come segno della nostra fede comune"}, {"t": "p", "x": "e della nostra missione apostolica."}, {"t": "p", "x": "Fa’ che condividiamo con i bisognosi"}, {"t": "p", "x": "la tua divina Parola e i beni con i quali ci benedici."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "BEATI MARTIRI DI BARBASTRO"}, {"t": "p", "x": "(13 AGOSTO)"}]}, {"id": "212", "num": "14.12", "title": "Signore Gesù,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "che hai voluto fossimo battezzati col tuo battesimo"}, {"t": "p", "x": "e ci hai concesso di poter bere al calice che il Padre ti ha dato."}, {"t": "p", "x": "Sii benedetto per sempre, Signore."}, {"t": "p", "x": "Signore Gesù che hai dato fede ai Profeti e agli Apostoli,"}, {"t": "p", "x": "generosità ai Martiri Clarettiani di Barbastro"}, {"t": "p", "x": "nella loro offerta a Te fino al martirio,"}, {"t": "p", "x": "rafforza il nostro corpo"}, {"t": "p", "x": "con il cibo che stiamo per prendere"}, {"t": "p", "x": "e infondici la forza necessaria"}, {"t": "p", "x": "per vivere sempre di fede,"}, {"t": "p", "x": "dedicati al tuo servizio."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "SANTI MICHELE, RAFFAELE, GABRIELE ED ANGELI CUSTODI, COMPATRONI"}, {"t": "p", "x": "(29 SETTEMBRE e 2 OTTOBRE)"}]}, {"id": "213", "num": "14.13", "title": "Con il coro degli angeli", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "ti lodiamo e ti benediciamo, Signore"}, {"t": "p", "x": "Sii benedetto per sempre, Signore."}, {"t": "p", "x": "Signore, Dio nostro,"}, {"t": "p", "x": "che manifesti sempre la tua provvidenza,"}, {"t": "p", "x": "benedici la nostra tavola, segno della tua generosità"}, {"t": "p", "x": "per noi."}, {"t": "p", "x": "E fa’ che non ci manchi mai"}, {"t": "p", "x": "l’aiuto di coloro che ti servono in cielo"}, {"t": "p", "x": "perché ti possiamo lodare anche noi per tutta l’eternità."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "SANTA TERESA DI GESU’ COMPATRONA"}, {"t": "p", "x": "(15 OTTOBRE)"}]}, {"id": "214", "num": "14.14", "title": "Il nostro spirito, Signore ha sete di te,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "come terra arida e senz’acqua."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore.*"}, {"t": "p", "x": "O Dio, che hai suscitato nella tua Chiesa"}, {"t": "p", "x": "Santa Teresa di Gesù"}, {"t": "p", "x": "e attraverso di lei ci hai manifestato una via alla perfezione:"}, {"t": "p", "x": "fa’ che desideriamo non soltanto il cibo per il corpo,"}, {"t": "p", "x": "ma anche il pane quotidiano della tua Parola e del tuo Corpo"}, {"t": "p", "x": "per crescere efficacemente nella nostra santificazione"}, {"t": "p", "x": "annunciando il tuo Regno"}, {"t": "p", "x": "secondo il nostro carisma nella Chiesa."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}, {"t": "p", "x": "SANT’ANTONIO MARIA CLARET, FONDATORE"}, {"t": "p", "x": "(24 OTTOBRE)"}]}, {"id": "215", "num": "14.15", "title": "Sii benedetto Signore Gesù,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Figlio e inviato del Padre."}, {"t": "p", "x": "*Sii benedetto per sempre, Signore.*"}, {"t": "p", "x": "Benedici questo cibo che stiamo per prendere, Signore,"}, {"t": "p", "x": "e infondi in noi lo stesso spirito"}, {"t": "p", "x": "che animò Sant’Antonio Maria Claret, nostro Padre,"}, {"t": "p", "x": "perché, da lui sollecitati,"}, {"t": "p", "x": "siamo sempre disposti a proclamare la tua Parola"}, {"t": "p", "x": "e a dare la vita per i fratelli."}, {"t": "p", "x": "Tu che vivi e regni, nei secoli dei secoli."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "1"}]}],

    dades: [{"id": "1", "num": "1.1", "title": "Prière apostolique", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Mon Seigneur et mon Père,"}, {"t": "p", "x": "fais que je te connaisse et te fasse connaître,"}, {"t": "p", "x": "que je t'aime et te fasse aimer,"}, {"t": "p", "x": "que je te serve et te fasse servir,"}, {"t": "p", "x": "que je te loue et que je fasse"}, {"t": "p", "x": "que toutes les créatures te louent."}, {"t": "p", "x": "*(Saint Antoine-Marie Claret)*"}]}, {"id": "2", "num": "1.2", "title": "La Providence de Dieu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Béni soistu, Seigneur, pour ta providence  et pour le soin"}, {"t": "p", "x": "que tu as pris  de moi toujours et partout. Amen."}]}, {"id": "3", "num": "1.3", "title": "Aimer et servir Dieu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Béni soistu, Seigneur, pour ton amour et ta miséricorde."}, {"t": "p", "x": "Fais que je t'aime et te serve, et que je te fasse"}, {"t": "p", "x": "aimer et servir de toutes les créatures. Amen."}]}, {"id": "4", "num": "1.4", "title": "Demande du don de l'amour", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Feu toujours brûlant sans jamais s’éteindre,"}, {"t": "p", "x": "amour toujours ardent sans jamais s'attiédir,"}, {"t": "p", "x": "embrasemoi afin que je t'aime."}, {"t": "p", "x": "Je t'aime, Jésus, de tout mon cœur,"}, {"t": "p", "x": "de toute mon âme, de toutes mes forces."}, {"t": "p", "x": "Je voudrais t'aimer davantage et que tous t'aiment."}, {"t": "p", "x": "Je voudrais t'aimer pour moimême et pour toutes les créatures."}, {"t": "p", "x": "Très Sainte Vierge, accorde-moi la grâce que tous soient sauvés"}, {"t": "p", "x": "et que  personne soit  damné. Amen."}]}, {"id": "5", "num": "1.5", "title": "Union à Dieu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, comme l'eau s'unit au vin dans l'eucharistie,"}, {"t": "p", "x": "c'est ainsi que je désire m'unir à toi"}, {"t": "p", "x": "et m'offrir avec toi à la très sainte Trinité. Amen"}]}, {"id": "6", "num": "1.6", "title": "Dieu le Père, vie, amour et espérance", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, tu es mon amour, mon honneur,"}, {"t": "p", "x": "mon espérance, mon refuge."}, {"t": "p", "x": "Tu es ma vie, ma gloire, ma fin,"}, {"t": "p", "x": "mon maître, mon père, mon amour. Amen."}]}, {"id": "7", "num": "1.7", "title": "Dieu Providence et sauveur", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Merci, Seigneur, pour ta bonté,"}, {"t": "p", "x": "car tu te sers de tous les moyens pour convertir les pécheurs."}, {"t": "p", "x": "Bénie soit ta providence, qui veille toujours sur moi."}, {"t": "p", "x": "Je chanterai ta miséricorde  maintenant et toujours. Amen"}]}, {"id": "8", "num": "1.8", "title": "Dieu seul", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, tu es mon amour, mon honneur,"}, {"t": "p", "x": "mon espérance et mon refuge."}, {"t": "p", "x": "Tu es ma gloire et ma fin. Mon Maître, mon Père."}, {"t": "p", "x": "Aidemoi à ne chercher rien d’autre que toi,"}, {"t": "p", "x": "à rien connaître si ce n'est ta volonté pour l'accomplir."}, {"t": "p", "x": "Je ne désire que toi et, en toi  et pour toi, je désire tout le reste."}, {"t": "p", "x": "Tu es pour moi largement suffisant. Fais que je t'aime"}, {"t": "p", "x": "comme tu m'aimes et comme tu veux que je t'aime. Amen."}]}, {"id": "9", "num": "1.9", "title": "Tout pour la gloire de Dieu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Je veux t'aimer, mon Dieu, de tout mon cœur,"}, {"t": "p", "x": "de tout mon être, de toutes mes forces :"}, {"t": "p", "x": "je te consacre toutes mes pensées, tous mes désirs,"}, {"t": "p", "x": "toutes mes paroles et mes actions,"}, {"t": "p", "x": "tout ce que j’ai et tout ce que je pourrais avoir."}, {"t": "p", "x": "Fais que j'emploie tout ce que je possède à ton  honneur"}, {"t": "p", "x": "et ta plus grande gloire selon ta volonté. Amen."}]}, {"id": "10", "num": "1.10", "title": "Pour demander l'Esprit", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Je te supplie, Seigneur, de m'envoyer ton Esprit,"}, {"t": "p", "x": "pour qu’il soit ma force et  ma lumière"}, {"t": "p", "x": "et qu’il m'embrase en ton amour,"}, {"t": "p", "x": "qu’il me dirige par le chemin de Jésus Christ"}, {"t": "p", "x": "et de la Vierge Marie, la Mère de Dieu et ma mère. Amen."}]}, {"id": "11", "num": "1.11", "title": "Pour demander les vertus", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Je crois, Seigneur, fais que je croie plus fermement."}, {"t": "p", "x": "J'espère, Seigneur, que mon espérance soit plus sûre."}, {"t": "p", "x": "J'aime, Seigneur, que mon amour soit plus ardent."}, {"t": "p", "x": "Je regrette de t’avoir offensé; augmente mon regret."}, {"t": "p", "x": "Seigneur, que veuxtu que je fasse?"}, {"t": "p", "x": "Enseignemoi à accomplir ta volonté, car tu es mon Dieu."}, {"t": "p", "x": "Accordemoi un cœur sage pour juger ton peuple,"}, {"t": "p", "x": "pour discerner entre le bien et le mal."}, {"t": "p", "x": "Père, accorde-moi l'humilité, la douceur,"}, {"t": "p", "x": "la chasteté, la patience et la charité."}, {"t": "p", "x": "Père, enseignemoi la bonté, la science et la discipline."}, {"t": "p", "x": "Père, donnemoi ton amour avec ta grâce."}, {"t": "p", "x": "Ce sera mon plus grand trésor."}, {"t": "p", "x": "Mon Dieu, mon Jésus et mon tout."}, {"t": "p", "x": "Je vis sur la croix et sur la croix je veux mourir,"}, {"t": "p", "x": "et j'espère descendre de   la croix,"}, {"t": "p", "x": "après avoir consommé mon sacrifice,"}, {"t": "p", "x": "non pas par mes mains, mais par celles des autres."}, {"t": "p", "x": "Fais que je ne me glorifie que dans la croix de Jésus Christ,"}, {"t": "p", "x": "par qui le monde est crucifié pour moi et moi, pour le monde."}, {"t": "p", "x": "Amen."}]}, {"id": "12", "num": "1.12", "title": "Exercice de l'amour de Dieu", "theme": "oraciones-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Mon Dieu, tu es l’Éternel. Loué sois-tu!"}, {"t": "p", "x": "Mon Dieu, tu es infiniment puissant. Loué sois-tu!"}, {"t": "p", "x": "Ta sagesse et ta bonté sont infinies. Loué sois-tu!"}, {"t": "p", "x": "Ta miséricorde est inépuisable. Loué sois-tu!"}, {"t": "p", "x": "Ton amour est un feu inextinguible. Loué sois-tu|"}, {"t": "p", "x": "Tu es créateur du monde. Loué sois-tu!"}, {"t": "p", "x": "Tu es le père de tous les hommes. Loué sois-tu!"}, {"t": "p", "x": "Pour nous sauver, tu nous as envoyé ton Fils. Loué sois-tu!"}, {"t": "p", "x": "Dieu-Trinité : Père, Fils et Saint-Esprit :"}, {"t": "p", "x": "trois Personnes et un seul Dieu. Loué sois-tu!"}, {"t": "p", "x": "Avec le Cœur Immaculé de Marie,  nous t’aimons, Seigneur!"}, {"t": "p", "x": "Avec tous les Anges et les Saints, nous t’adorons, Seigneur!."}, {"t": "p", "x": "Avec tout le ciel et toute la terre, nous t’acclamons, Seigneur!"}, {"t": "p", "x": "Jésus-sauveur, chemin, vérité et vie,"}, {"t": "p", "x": "enseigne-nous à aimer ton Père et notre Père,"}, {"t": "p", "x": "et à être, comme  tes Apôtres, des messagers de ton amour,"}, {"t": "p", "x": "afin que tous les hommes  connaissent  ton Père,"}, {"t": "p", "x": "l’aiment et le glorifient pour les siècle des siècles. Amen"}, {"t": "p", "x": "Prières au Cœur de Marie"}, {"t": "p", "x": "Du Père Fondateur"}]}, {"id": "13", "num": "2.1", "title": "Litanie clarétaine d'invocations à Marie", "theme": "corazon-maria", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Sainte Marie, Fille du Père,  R/ prie pour nous"}, {"t": "p", "x": "Sainte Marie, Mère du Fils,"}, {"t": "p", "x": "Sainte Marie, temple de l'EspritSaint,"}, {"t": "p", "x": "Terme et couronnement de la Trinité,"}, {"t": "p", "x": "Délices de Dieu,"}, {"t": "p", "x": "Conçue en grâce, confirmée en grâce et pleine de grâce,"}, {"t": "p", "x": "Marie, réflet de la puissance, la sagesse et la bonté de Dieu,"}, {"t": "p", "x": "Préservée de tout péché,"}, {"t": "p", "x": "Femme bénie entre toutes les femmes,"}, {"t": "p", "x": "Purifiée et sanctifiée à la conception même,"}, {"t": "p", "x": "Héritière du ciel,"}, {"t": "p", "x": "Créature sublime,"}, {"t": "p", "x": "Pleine de grâce,"}, {"t": "p", "x": "Modèle de pureté et de charité,"}, {"t": "p", "x": "Mère de Dieu et Mère des hommes,"}, {"t": "p", "x": "Mère de Jésus Christ,"}, {"t": "p", "x": "Mère spirituelle,"}, {"t": "p", "x": "Mère du bel amour,"}, {"t": "p", "x": "Mère de charité,"}, {"t": "p", "x": "Mère de pitié et de miséricorde,"}, {"t": "p", "x": "Mère de tous les vivants,"}, {"t": "p", "x": "Mère très tendre,"}, {"t": "p", "x": "Mère, maîtresse et directrice,"}, {"t": "p", "x": "Formatrice et guide d'apôtres et de missionnaires,"}, {"t": "p", "x": "Mère et avocate des pécheurs,"}, {"t": "p", "x": "Force et consolation de ceux qui souffrent,"}, {"t": "p", "x": "Dispensatrice de la miséricorde,"}, {"t": "p", "x": "Canal de la grâce,"}, {"t": "p", "x": "Abri des malheureux,"}, {"t": "p", "x": "Nord des matelots,"}, {"t": "p", "x": "Santé des malades,"}, {"t": "p", "x": "Souffle des mourants,"}, {"t": "p", "x": "Rachat des captifs"}, {"t": "p", "x": "Notre douce  avocate,"}, {"t": "p", "x": "Consolatrice des affligés,"}, {"t": "p", "x": "Échelle du ciel,"}, {"t": "p", "x": "Fenêtre du paradis,"}, {"t": "p", "x": "Reine des cieux et de la terre,"}, {"t": "p", "x": "Reine et Dame de la grâce,"}, {"t": "p", "x": "Cœur de l'Église,"}, {"t": "p", "x": "Cœur du monde chrétien,"}]}, {"id": "14", "num": "2.2", "title": "Supplication à Marie", "theme": "corazon-maria", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Vierge et Mère de Dieu, tourne tes yeux miséricordieux"}, {"t": "p", "x": "vers nous qui restons en cette vallée de larmes"}, {"t": "p", "x": "et mettons notre confiance en toi, car nous sommes tes enfnts."}, {"t": "p", "x": "Aidenous à annoncer la Bonne Nouvelle du Royaume"}, {"t": "p", "x": "avec fidélité et assurance, car ils sont nombreux ceux"}, {"t": "p", "x": "qui s'y opposent, à cause de l'ambition du pouvoir"}, {"t": "p", "x": "et de la recherche effrénée des richesses ou des plaisirs."}, {"t": "p", "x": "Aide-nous à coopérer à ton rôle maternel"}, {"t": "p", "x": "par notre  mission apostolique. Amen."}]}, {"id": "15", "num": "2.3", "title": "Invocations à Marie", "theme": "corazon-maria", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Je te salue, Marie Immaculée, Fille de Dieu, le Père."}, {"t": "p", "x": "Je te salue, Marie Immaculée, Mère du Fils de Dieu."}, {"t": "p", "x": "Je te salue, Marie Immaculée, Temple de l’Esprit Saint."}, {"t": "p", "x": "Je te salue Marie, mère et avocate des pécheurs."}, {"t": "p", "x": "Tu es bénie entre toutes les femmes."}, {"t": "p", "x": "Tu es la gloire de Jérusalem,"}, {"t": "p", "x": "la joie d'Israël et l'honneur de notre peuple."}, {"t": "p", "x": "Tu es le refuge des abandonnés, le nord des matelots."}, {"t": "p", "x": "Tu es la santé des malades."}, {"t": "p", "x": "Tu es le souffle des mourants et la porte du ciel."}, {"t": "p", "x": "Tu es, après Jésus Christ, le fruit béni de tes entrailles,"}, {"t": "p", "x": "toute notre espérance."}, {"t": "p", "x": "O Clémente, ô pieuse, ô douce Vierge Marie."}]}, {"id": "16", "num": "2.4", "title": "Mère du Divin amour", "theme": "corazon-maria", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "O Marie, ma Mère, Mère du Divin amour!"}, {"t": "p", "x": "Je ne peux rien demander qui te soit plus agréable"}, {"t": "p", "x": "et plus facile d'accorder que l'amour divin."}, {"t": "p", "x": "Accordele-moi, ma Mère ! Ma Mère, amour!"}, {"t": "p", "x": "Ma Mère, j'ai faim et soif d'amour."}, {"t": "p", "x": "Viens à mon secours, rassasiemoi."}, {"t": "p", "x": "O Cœur de Marie, forge et instrument de l'amour,"}, {"t": "p", "x": "embrasemoi d'amour pour Dieu et pour mon prochain!"}, {"t": "p", "x": "Amen."}]}, {"id": "17", "num": "2.5", "title": "Fils et serviteur de Marie", "theme": "corazon-maria", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "O Vierge et Mère de Dieu!"}, {"t": "p", "x": "tu sais bien que nous sommes tes fils et tes serviteurs,"}, {"t": "p", "x": "ceux que tu as formés"}, {"t": "p", "x": "dans la forge de ta miséricorde et de ton amour."}, {"t": "p", "x": "Nous sommes comme un javelot dans ta main puissante ;"}, {"t": "p", "x": "lancenous, ô notre Mère,"}, {"t": "p", "x": "contre tous  ceux qui s'opposent au Royaume de Dieu."}, {"t": "p", "x": "Forts de ta protection,"}, {"t": "p", "x": "nous annoncerons l'Évangile"}, {"t": "p", "x": "sans autres armes que la Parole divine,"}, {"t": "p", "x": "sans autres titres que ceux d'être fils de ton Cœur."}, {"t": "p", "x": "A toi, ô notre Mère, la victoire. Amen."}, {"t": "p", "x": "b) De la Congrégation"}, {"t": "p", "x": "b) De la Congrégation"}]}, {"id": "18", "num": "2.6", "title": "Configuration au Christ", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Notre Seigneur et notre Dieu,"}, {"t": "p", "x": "toi qui as choisi Marie toujours Vierge"}, {"t": "p", "x": "comme Mère de ton Fils et notre Mère,"}, {"t": "p", "x": "fais que, par notre donation fidèle à son Cœur maternel,"}, {"t": "p", "x": "nous nous configurions pleinement au Christ"}, {"t": "p", "x": "et que nous coopérions à son rôle maternel"}, {"t": "p", "x": "par la mission apostolique."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "19", "num": "2.7", "title": "Litanies de la Vierge Marie,", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "inspirées des les Constitutions."}, {"t": "p", "x": "O Marie, les Fils de ton Cœur Immaculé,"}, {"t": "p", "x": "nous te proclamons «bienheureuse»"}, {"t": "p", "x": "pour ta foi obéissante et ton ardente charité,"}, {"t": "p", "x": "et nous t'invoquons:"}, {"t": "p", "x": "Mère de Dieu et notre mère."}, {"t": "r", "x": ": Bénie soistu entre toutes les femmes."}, {"t": "p", "x": "Mère de Jésus Christ, l’envoyé du Père."}, {"t": "p", "x": "Mère du Verbe, fait homme par l’oeuvre de l'Esprit."}, {"t": "p", "x": "Mère du Fils, oint pour évangéliser les pauvres."}, {"t": "p", "x": "Fondatrice, patronne et titulaire de notre Congrégation."}, {"t": "p", "x": "Première disciple du Christ."}, {"t": "p", "x": "Notre modèle dans la suite de Jésus."}, {"t": "p", "x": "Servante totalement consacrée à la personne"}, {"t": "p", "x": "et à l’œuvre de ton Fils."}, {"t": "p", "x": "Mère et Maîtresse de Missionnaires."}, {"t": "p", "x": "Formatrice d'Apôtres."}, {"t": "p", "x": "Prions : Dieu notre Père, nous te rendons grâce"}, {"t": "p", "x": "parce que nous nous appelons et que nous sommes"}, {"t": "p", "x": "Fils du Cœur Immaculé de Marie ;"}, {"t": "p", "x": "fais que nous vénérions avec amour  notre Mère"}, {"t": "p", "x": "et que nous nous donnions à elle,"}, {"t": "p", "x": "afin qu'elle nous configure au Christ"}, {"t": "p", "x": "et que nous coopérions à son rôle maternel"}, {"t": "p", "x": "dans la mission apostolique qu'Il nous a confiée."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "20", "num": "2.8", "title": "Prière filiale et apostolique au Cœur de Marie", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "O Vierge et Mère de Dieu !"}, {"t": "p", "x": "Je m’offre à toi comme ton fils."}, {"t": "p", "x": "Je me consacre à ton amour maternel,"}, {"t": "p", "x": "afin que tu formes en moi Jésus,"}, {"t": "p", "x": "le Fils et l'envoyé du Père,"}, {"t": "p", "x": "l'Oint par l'Esprit Saint pour annoncer"}, {"t": "p", "x": "la Bonne Nouvelle aux pauvres."}, {"t": "p", "x": "Enseignemoi à garder, comme toi,"}, {"t": "p", "x": "la Parole dans mon cœur, jusqu'à me transformer"}, {"t": "p", "x": "en Évangile de Dieu. Convertis-moi"}, {"t": "p", "x": "en instrument docile de ton amour maternel"}, {"t": "p", "x": "Obtiens-moi la force de l'Esprit,"}, {"t": "p", "x": "afin que je devienne un courageux témoin du Christ."}, {"t": "p", "x": "Remplismoi de ton amour maternel,"}, {"t": "p", "x": "afin que je  révèle le Père aux hommes,"}, {"t": "p", "x": "de sorte qu’ils sentent la joie d'être les fils de Dieu"}, {"t": "p", "x": "en communion fraternelle dans l'Église."}, {"t": "p", "x": "Mère, voici ton fils. Formemoi."}, {"t": "p", "x": "Mère voici ton fils. Envoiemoi."}, {"t": "p", "x": "Mère, voici ton fils. Parle par moi. Aime par moi."}, {"t": "p", "x": "Veille sur moi, afin qu'ayant annoncé à d'autres l'Évangile,"}, {"t": "p", "x": "je ne sois pas  exclu du Royaume."}, {"t": "p", "x": "J'ai mis en toi, ô ma Mère, toute ma confiance."}, {"t": "p", "x": "Je ne serai jamais confondu. Amen."}]}, {"id": "21", "num": "2.9", "title": "Litanies au Cœur de Marie", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Seigneur, prends pitié,Seigneur, prends pitié."}, {"t": "p", "x": "O Christ, prends pitié,ô Christ, prends pitié."}, {"t": "p", "x": "Seigneur, prends pitié,Seigneur, prends pitié."}, {"t": "p", "x": "O Christ, écoutenous,ô Christ, écoutenous."}, {"t": "p", "x": "O Christ, exaucenous,ô Christ, exaucenous."}, {"t": "p", "x": "Dieu, le Père des cieux,    aie pitié de nous."}, {"t": "p", "x": "Dieu, le Fils, rédempteur du monde,"}, {"t": "p", "x": "Dieu, Esprit Saint, sanctificateur,"}, {"t": "p", "x": "Trinité Sainte, un seul Dieu,"}, {"t": "p", "x": "Cœur de Marie, formé par le Père,      prie pour nous."}, {"t": "p", "x": "Cœur de Marie, le plus semblable au Cœur de Jésus,"}, {"t": "p", "x": "Cœur de Marie, orné de tous les dons de l'Esprit Saint,"}, {"t": "p", "x": "Cœur de Marie, qui aimes le Père d'un amour filial,"}, {"t": "p", "x": "Cœur de Marie, qui aimes le Fils d'un amour maternel,"}, {"t": "p", "x": "Cœur de Marie, qui aimes l'Esprit-Saint"}, {"t": "p", "x": "d'un amour d'épouse,"}, {"t": "p", "x": "Cœur de Marie, qui conserves fidèlement"}, {"t": "p", "x": "les paroles et les actions de Jésus,"}, {"t": "p", "x": "Cœur de Marie, transpercé par le glaive de la douleur,"}, {"t": "p", "x": "Cœur de Marie, cloué à la croix avec le Christ crucifié,"}, {"t": "p", "x": "Cœur de Marie, vivifié par la joie"}, {"t": "p", "x": "de la résurrection de Jésus,"}, {"t": "p", "x": "Cœur  de Marie, comblé d'une nouvelle plénitude de grâce"}, {"t": "p", "x": "à la venue du Saint Esprit,"}, {"t": "p", "x": "Cœur de Marie, demeure de Dieu, pleine de sa gloire,"}, {"t": "p", "x": "Cœur de Marie, arche de l'alliance"}, {"t": "p", "x": "de Dieu avec les hommes,"}, {"t": "p", "x": "Cœur de Marie, giron de Dieu et des hommes,"}, {"t": "p", "x": "Cœur de Marie, qui as apporté le salut au monde,"}, {"t": "p", "x": "Cœur de Marie, toujours immaculé,"}, {"t": "p", "x": "Cœur de Marie, plein de grâce,"}, {"t": "p", "x": "Cœur de Marie, béni parmi tous les cœurs,"}, {"t": "p", "x": "Cœur de Marie, abîme d'humilité,"}, {"t": "p", "x": "Cœur de Marie, trône de la miséricorde,"}, {"t": "p", "x": "Cœur de Marie, forge de l'amour divin,"}, {"t": "p", "x": "Cœur de Marie, qui obtient la grâce à tous les pécheurs,"}, {"t": "p", "x": "Cœur de Marie, rocher invincible de foi,"}, {"t": "p", "x": "Cœur de Marie, source de l'amitié parfaite,"}, {"t": "p", "x": "Cœur de Marie, appui de l'Église"}, {"t": "p", "x": "en sa marche vers le Père,"}, {"t": "p", "x": "Cœur de Marie, forge d'amour qui nous configure à Jésus,"}, {"t": "p", "x": "Cœur de Marie, notre Mère et notre formatrice,"}, {"t": "p", "x": "Cœur de Marie, consolation des affligés,"}, {"t": "p", "x": "Cœur de Marie, refuge des pécheurs,"}, {"t": "p", "x": "Cœur de Marie, secours des agonisants,"}, {"t": "p", "x": "Cœur de Marie, espérance du monde,"}, {"t": "p", "x": "Cœur de Marie, dame de nos cœurs,"}, {"t": "p", "x": "Cœur de Marie, reine de la paix,"}, {"t": "p", "x": "Agneau de Dieu qui enlèves le péché du monde,"}, {"t": "p", "x": "pardonnenous, Seigneur"}, {"t": "p", "x": "Agneau de Dieu qui enlèves le péché du monde ,"}, {"t": "p", "x": "écoutenous, Seigneur"}, {"t": "p", "x": "Agneau de Dieu qui enlèves le péché du monde,"}, {"t": "p", "x": "prends pitié de nous"}, {"t": "v", "x": ": Prie pour nous, Sainte Mère de Dieu,"}, {"t": "r", "x": ": Afin que nous soyons dignes d'obtenir"}, {"t": "p", "x": "les promesses de Jésus Christ."}, {"t": "p", "x": "Prions :"}, {"t": "p", "x": "Seigneur, toi qui as fait du Cœur Immaculé de Marie"}, {"t": "p", "x": "une demeure pour ton Fils et un sanctuaire de l'Esprit-Saint,"}, {"t": "p", "x": "donnenous un cœur pur et docile, afin que,"}, {"t": "p", "x": "toujours soumis à ta volonté, nous t'aimions par dessus tout"}, {"t": "p", "x": "et que nous aidions nos frères dans leurs besoins."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "22", "num": "2.10", "title": "Action de grâce pour le Cœur de Marie", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Nous te rendons grâce, Père saint,"}, {"t": "p", "x": "parce que tu as donné à la Vierge un cœur sage et docile,"}, {"t": "p", "x": "toujours prêt à te rendre grâce,"}, {"t": "p", "x": "un cœur humble et neuf,"}, {"t": "p", "x": "pour y graver la loi de la Nouvelle Alliance,"}, {"t": "p", "x": "un cœur simple et pur, qui l'a rendue digne"}, {"t": "p", "x": "de concevoir virginalement ton Fils"}, {"t": "p", "x": "et  de le contempler éternellement;"}, {"t": "p", "x": "un cœur ferme et disposé à supporter avec courage"}, {"t": "p", "x": "le glaive de la douleur tout en  attendant, dans la foi,"}, {"t": "p", "x": "la résurrection de ton Fils."}, {"t": "p", "x": "Donnenous un cœur sage, neuf et humble, simple et pur,"}, {"t": "p", "x": "ferme et toujours docile, afin que nous l’imitions"}, {"t": "p", "x": "et que nous coopérions fidèlement à ton oeuvre de salut."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "23", "num": "2.11", "title": "Offrande au Cœur de Marie", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Mère du Seigneur, Cœur de Marie !"}, {"t": "p", "x": "Toi qui as présidé à la fondation de notre Congrégation,"}, {"t": "p", "x": "sois toujours  le cœur de notre Congrégation."}, {"t": "p", "x": "Elle a besoin de  grands rêves missionnaires"}, {"t": "p", "x": "en ce monde, si aimé du Père"}, {"t": "p", "x": "et si affligé par l'incroyance et l'injustice."}, {"t": "p", "x": "Parle à travers nous et rends témoignage, par notre vie,"}, {"t": "p", "x": "du message du Royaume."}, {"t": "p", "x": "O Mère du Seigneur,"}, {"t": "p", "x": "prie pour nous, afin que descende sur nous l'Esprit"}, {"t": "p", "x": "et qu’il nous impulse vers le monde nouveau."}, {"t": "p", "x": "Mère du Seigneur, Cœur de Marie,"}, {"t": "p", "x": "prie pour nous, intercède en notre faveur!"}, {"t": "p", "x": "Amen."}]}, {"id": "24", "num": "2.12", "title": "Offrande au Cœur de Marie", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Vierge Marie, Mère de Dieu et notre Mère,"}, {"t": "p", "x": "je me confie à ton amour maternel,"}, {"t": "p", "x": "afin que tu fasses de moi un missionnaire"}, {"t": "p", "x": "à l'image de ton Fils, l'envoyé du Père,"}, {"t": "p", "x": "pour annoncer la Bonne nouvelle aux pauvres."}, {"t": "p", "x": "Apprendsmoi à croire, à aimer et à servir comme toi."}, {"t": "p", "x": "Rendsmoi généreux et reconnaissant, afin que je vive avec joie"}, {"t": "p", "x": "le don de ma vocation missionnaire. Amen."}]}, {"id": "25", "num": "2.13", "title": "Le Cœur de Marie", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Seigneur, notre Dieu, toi qui as choisi la Vierge Marie"}, {"t": "p", "x": "pour Mère de ton Fils et Notre Mère,"}, {"t": "p", "x": "fais que, par le don fidèle à son Cœur maternel,"}, {"t": "p", "x": "nous soyons davantage configurés au Christ"}, {"t": "p", "x": "et que, pressés par sa charité, nous travaillons"}, {"t": "p", "x": "à proclamer l'Évangile à tous les hommes."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "26", "num": "2.14", "title": "Mère et Maîtresse de Missionnaires", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Marie, mère et maîtresse de missionnaires,"}, {"t": "p", "x": "intercède auprès du Père,"}, {"t": "p", "x": "afin que nous, les Fils de ton Cœur Immaculé,"}, {"t": "p", "x": "nous reproduisions les traits de Jésus"}, {"t": "p", "x": "au cœur grand comme celui de Claret,"}, {"t": "p", "x": "au  regard pénétrant et aux oreilles attentives"}, {"t": "p", "x": "à toutes les urgences du monde."}, {"t": "p", "x": "Que nous soyons, comme toimême,"}, {"t": "p", "x": "guidés et poussés par la miséricorde,"}, {"t": "p", "x": "la tendresse et la compassion."}, {"t": "p", "x": "Que nous restions toujours en marche"}, {"t": "p", "x": "vers de nouveaux horizons missionnaires,"}, {"t": "p", "x": "prêts à accepter la nouveauté d’autres cultures."}, {"t": "p", "x": "Que le feu apostolique qui jaillit de la forge de ton Cœur"}, {"t": "p", "x": "nous anime partout où nous placera l'Esprit. Amen"}]}, {"id": "27", "num": "2.15", "title": "Invocation à Marie, Mère de l'Église", "theme": "corazon-maria", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Vierge Marie,  nous te  confions toute l'Église."}, {"t": "p", "x": "Souvienstoi de tous tes enfants; intercède pour eux ;"}, {"t": "p", "x": "augmente  leur foi et leur espérance et ranime leur charité."}, {"t": "p", "x": "Nous confions à ton Cœur Immaculé tout le genre humain:"}, {"t": "p", "x": "mènele à la connaissance du seul  sauveur, Jésus Christ;"}, {"t": "p", "x": "éloigne de lui le châtiment du péché; et accorde-lui"}, {"t": "p", "x": "la paix dans la vérité, la justice, la liberté et l'amour."}, {"t": "p", "x": "fais que l'Église puisse faire monter jusqu’à Dieu"}, {"t": "p", "x": "un hymne de louange, de reconnaissance et de joie,"}, {"t": "p", "x": "car le Seigneur a fait de grandes choses en toi,"}, {"t": "p", "x": "ô clémente, ô pieuse, ô douce Vierge Marie. Amen."}]}, {"id": "29", "num": "3.1", "title": "Fondateur et modèle", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, notre Dieu,"}, {"t": "p", "x": "toi qui as choisi Saint Antoine-Marie Claret"}, {"t": "p", "x": "comme fondateur de notre Famille,"}, {"t": "p", "x": "et qui as fait de lui un homme qui brûlait de charité"}, {"t": "p", "x": "et se réjouissait dans les calomnies et les tourments:"}, {"t": "p", "x": "accordenous, dans ta bienveillance, que,"}, {"t": "p", "x": "adhérant fidèlement à ses enseignements,"}, {"t": "p", "x": "nous proclamions ta gloire dans tout l'univers"}, {"t": "p", "x": "et cherchions avec ardeur le salut de tous les hommes."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "30", "num": "3.2", "title": "Fidèles à son esprit", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Ô Dieu, qui as accordé à saint Antoine-Marie Claret"}, {"t": "p", "x": "un ardent et filial amour au très saint Sacrement"}, {"t": "p", "x": "et au Cœur Immaculé de Marie,"}, {"t": "p", "x": "pour qu'il puisse réaliser dans l'Église de Dieu"}, {"t": "p", "x": "des merveilles pour ta gloire et le salut des âmes:"}, {"t": "p", "x": "accordenous que, brûlant du même amour"}, {"t": "p", "x": "et continuant fidèlement son oeuvre évangélisatrice,"}, {"t": "p", "x": "nous méritions de vivre et de mourir dans la Congrégation"}, {"t": "p", "x": "comme  dignes Fils du Cœur Immaculé de Marie."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur."}, {"t": "p", "x": "Amen."}]}, {"id": "31", "num": "3.3", "title": "Pour continuer l’œuvre de notre Fondateur", "theme": "san-antonio-claret", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur,"}, {"t": "p", "x": "Toi qui as fait de saint-Antoine Marie Claret, notre Père,"}, {"t": "p", "x": "un apôtre plein de zèle pour la gloire de Dieu"}, {"t": "p", "x": "et le salut des hommes,"}, {"t": "p", "x": "accordenous la charité ardente qui embrasait son cœur,"}, {"t": "p", "x": "afin que nous continuions fermement son oeuvre ."}, {"t": "p", "x": "Multiplie ses fils pour élargir le Règne du Christ,"}, {"t": "p", "x": "et que, au moment de notre mort, nous méritions"}, {"t": "p", "x": "d’être reconnus comme des «serviteurs fidèles»"}, {"t": "p", "x": "du Christ et de l'Évangile."}, {"t": "p", "x": "Par le même Jésus Christ, notre Seigneur. Amen."}]}, {"id": "157", "num": "4.1", "title": "Litanies de Saint Joseph", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, prends pitié,Seigneur, prends pitié."}, {"t": "p", "x": "O Christ, prends pitié,Ô Christ, prends pitié."}, {"t": "p", "x": "Seigneur, Prends pitié,Seigneur, prends pitié."}, {"t": "p", "x": "Christ, écoutenous,Christ, écoute-nous."}, {"t": "p", "x": "Christ exaucenous,Christ, exauce-nous."}, {"t": "p", "x": "Père du Ciel, Seigneur Dieu, prends pitié de nous."}, {"t": "p", "x": "Fils, Rédempteur du monde, prends pitié de nous."}, {"t": "p", "x": "SaintEsprit, Seigneur Dieu, prends pitié de nous."}, {"t": "p", "x": "Sainte Trinité, un seul Dieu, prends pitié de nous."}, {"t": "p", "x": "Sainte Marie, prie pour nous."}, {"t": "p", "x": "Saint Joseph, prie pour nous."}, {"t": "p", "x": "Illustre fils de David,prie pour nous."}, {"t": "p", "x": "Lumière de Patriarches,prie pour nous."}, {"t": "p", "x": "Époux de la Mère de Dieu,prie pour nous."}, {"t": "p", "x": "Chaste gardien de la Vierge,prie pour nous."}, {"t": "p", "x": "Père nourricier du Fils de Dieu,prie pour nous."}, {"t": "p", "x": "Protecteur dévoué du Christ,prie pour nous."}, {"t": "p", "x": "Chef de la sainte Famille,prie pour nous."}, {"t": "p", "x": "Joseph parfaitement juste,prie pour nous."}, {"t": "p", "x": "Joseph plein de prudence,prie pour nous."}, {"t": "p", "x": "Joseph plein de force,prie pour nous."}, {"t": "p", "x": "Joseph parfaitement obéissant,prie pour nous."}, {"t": "p", "x": "Joseph parfaitement fidèle,prie pour nous."}, {"t": "p", "x": "Miroir de patience,prie pour nous."}, {"t": "p", "x": "Ami de la pauvreté,prie pour nous"}, {"t": "p", "x": "Modèle des ouvriers,prie pour nous"}, {"t": "p", "x": "Gloire de la vie de famille,prie pour nous"}, {"t": "p", "x": "Gardien des vierges,prie pour nous."}, {"t": "p", "x": "Soutien des familles, prie pour nous."}, {"t": "p", "x": "Réconfort des malheureux,prie pour nous."}, {"t": "p", "x": "Espoir des malades, prie pour nous."}, {"t": "p", "x": "Patron des mourants,prie pour nous."}, {"t": "p", "x": "Terreur des démons,prie pour nous."}, {"t": "p", "x": "Protecteur de la sainte Église,prie pour nous."}, {"t": "p", "x": "Agneau de Dieu,"}, {"t": "p", "x": "qui enlèves le péché du monde,pardonne-nous, Seigneur."}, {"t": "p", "x": "Agneau de Dieu,"}, {"t": "p", "x": "qui enlèves le péché du monde,        exauce-nous, Seigneur."}, {"t": "p", "x": "Agneau de Dieu,"}, {"t": "p", "x": "qui enlèves le péché du monde,         prends pitié de nous."}, {"t": "p", "x": "Prions le Seigneur."}, {"t": "p", "x": "Seigneur Dieu, ton ineffable providence a daigné choisir saint Joseph pour époux de la Mère de ton Fils. Fais qu’ intercède pour nous dans le ciel celui que nous honorons comme protecteur sur la terre. Toi qui vis et règnes dans les siècles des siècles. Amen."}, {"t": "p", "x": "Prières à saint Joseph"}]}, {"id": "159", "num": "4.2", "title": "Prière de Léon XIII à saint Joseph", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "C'est vers toi, bienheureux Joseph,"}, {"t": "p", "x": "que nous recourons dans nos besoins"}, {"t": "p", "x": "et  invoquons ta protection"}, {"t": "p", "x": "avec celle de la Vierge Marie, ton épouse."}, {"t": "p", "x": "Par le saint amour qui t'a uni à Marie, la Mère de Dieu,"}, {"t": "p", "x": "et ta garde paternelle de l'Enfant Jésus,"}, {"t": "p", "x": "regarde avec bonté le peuple"}, {"t": "p", "x": "que le Christ s'est acquis par son sang."}, {"t": "p", "x": "Viens nous aider avec ton secours dans nos nécessités."}, {"t": "p", "x": "Gardien de la Sainte Famille, protège l'Église"}, {"t": "p", "x": "de tous les fléaux qui frappent le monde,"}, {"t": "p", "x": "et soutiens-nous dans la lutte contre le pouvoir du mal. Aide-nous à vivre saintement, à mourir dans la paix de Dieu"}, {"t": "p", "x": "et à obtenir la béatitude éternelle du Ciel. Amen."}]}, {"id": "160", "num": "4.3", "title": "Prière à Saint Joseph de Jean XXIII", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Ô Saint Joseph, gardien de Jésus,"}, {"t": "p", "x": "époux très chaste de Marie,"}, {"t": "p", "x": "qui as vécu en accomplissant parfaitement ton devoir,"}, {"t": "p", "x": "nourrissant avec le travail de tes mains"}, {"t": "p", "x": "la sainte Famille de Nazareth,"}, {"t": "p", "x": "protège-nous favorablement, nous qui nous adressons à toi."}, {"t": "p", "x": "Tu connais nos aspirations,"}, {"t": "p", "x": "nos angoisses et nos espérances."}, {"t": "p", "x": "Nous venons vers toi, parce que nous connaissons"}, {"t": "p", "x": "que nous trouverons en toi un protecteur."}, {"t": "p", "x": "Tu as aussi expérimenté l'épreuve et la fatigue,"}, {"t": "p", "x": "mais ton esprit, rempli de la paix la plus profonde,"}, {"t": "p", "x": "exulta de joie, parce que Dieu t’accorda la grâce"}, {"t": "p", "x": "de vivre intimement uni à son Fils et à Marie ton épouse."}, {"t": "p", "x": "Aide-nous à bien comprendre"}, {"t": "p", "x": "que nous ne sommes pas seuls en notre travail,"}, {"t": "p", "x": "à découvrir Jésus près de nous, à l'accueillir avec la grâce"}, {"t": "p", "x": "et  à le garder fidèlement comme tu l'as fait."}, {"t": "p", "x": "Obtiens-nous que, dans notre Congrégation,"}, {"t": "p", "x": "tout soit sanctifié dans la charité, la patience, la justice et la recherche du bien. Amen."}]}, {"id": "161", "num": "4.4", "title": "Prière à saint Joseph", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Nous te saluons, Joseph,"}, {"t": "p", "x": "époux virginal de Marie et père davidique du Messie."}, {"t": "p", "x": "Tu es béni entre tous les hommes"}, {"t": "p", "x": "et béni est Jésus, le Fils de Dieu qui te fut confié."}, {"t": "p", "x": "Saint Joseph, patron de l'Église et de notre Congrégation,"}, {"t": "p", "x": "garde nos communautés et nos familles"}, {"t": "p", "x": "dans la paix et la grâce divine ;"}, {"t": "p", "x": "et viens à notre secours à l'heure de notre mort. Amen."}]}, {"id": "162", "num": "4.5", "title": "Prière à saint Joseph", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Père Saint, qui as choisi saint Joseph"}, {"t": "p", "x": "pour une mission singulière"}, {"t": "p", "x": "et qui lui as accordé les grâces nécessaires"}, {"t": "p", "x": "pour la réaliser dans la maison de Nazareth;"}, {"t": "p", "x": "accorde, à nous aussi, les grâces dont nous avons besoin"}, {"t": "p", "x": "pour accomplir fidèlement notre travail missionnaire"}, {"t": "p", "x": "selon le charisme et l'esprit de la Congrégation."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "166", "num": "5.1", "title": "Au Martyrs de Barbastro", "theme": "martires", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Dieu, notre Père, qui nous as donné"}, {"t": "p", "x": "dans les Martyrs Clarétains de Barbastro"}, {"t": "p", "x": "un modèle de fidélité à la cause de Jésus,"}, {"t": "p", "x": "d'amour au Cœur de Marie et à l'Église,"}, {"t": "p", "x": "de fidélité aux frères et de pardon aux ennemis,"}, {"t": "p", "x": "accorde-nous la grâce d'imiter leur exemple,"}, {"t": "p", "x": "dans le partage fidèle et joyeux de notre consécration"}, {"t": "p", "x": "et de l'annonce de l'Évangile"}, {"t": "p", "x": "pour la gloire de Dieu et le salut de tous les hommes."}, {"t": "p", "x": "Par Jésus le Christ, notre Seigneur. Amen."}]}, {"id": "168", "num": "5.2", "title": "Prière à la bienheureuse martyre", "theme": "martires", "sub": null, "tags": [], "lines": [{"t": "p", "x": "María Patrocinio Giner, RMI"}, {"t": "p", "x": "Dieu grand et miséricordieux,"}, {"t": "p", "x": "qui as accordé à la bienheureuse María Patrocinio, vierge,"}, {"t": "p", "x": "la grâce de se montrer généreuse au service de ses frères"}, {"t": "p", "x": "et forte dans le martyre et le pardon ;"}, {"t": "p", "x": "accorde-nous, par son intercession, de suivre fermement"}, {"t": "p", "x": "les traces du Christ  sur le chemin de la croix,"}, {"t": "p", "x": "afin de pouvoir ainsi prendre part un jour"}, {"t": "p", "x": "à la gloire de la résurrection."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen"}]}, {"id": "168", "num": "5.3", "title": "bis. Prière aux Bienheureux André Solà", "theme": "martires", "sub": null, "tags": [], "lines": [{"t": "p", "x": "et compagnons martyrs."}, {"t": "p", "x": "Dieu tout-puissant et misércordieux,"}, {"t": "p", "x": "qui as accordé la grâce de mouir pour le Christ"}, {"t": "p", "x": "aux bienheureux Joseph Rangel, André Solá et Léonard López,"}, {"t": "p", "x": "viens en aide à notre faiblesse,"}, {"t": "p", "x": "afin que la célébration de leur martyre nous donne"}, {"t": "p", "x": "la joie et la force de témoigner de notre foi."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "169", "num": "5.4", "title": "Prière", "theme": "martires", "sub": "Béatifications", "tags": [], "lines": [{"t": "p", "x": "Seigneur, notre Père, toi qui as choisi avec prédilection"}, {"t": "p", "x": "tous les Fils du Cœur de la Vierge Marie"}, {"t": "p", "x": "et fait que quelques-uns deviennent"}, {"t": "p", "x": "des exemples insignes de vertu,"}, {"t": "p", "x": "féconde ton Église par leur glorification et"}, {"t": "p", "x": "fais qu'ils soient pour nous des modèles à imiter."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "170", "num": "5.5", "title": "Prière", "theme": "martires", "sub": "Béatifications", "tags": [], "lines": [{"t": "p", "x": "Seigneur, qui veux qu'ils soient saints"}, {"t": "p", "x": "tous ceux que tu as appelés à notre Congrégation,"}, {"t": "p", "x": "accorde à nos frères missionnaires,"}, {"t": "p", "x": "qui ont suivi de plus près les traces de notre saint Fondateur"}, {"t": "p", "x": "et qui ont donné leur vie au service de l'Évangile,"}, {"t": "p", "x": "d'être glorifiés sur la terre et comptés parmi les saints du Ciel."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "171", "num": "5.6", "title": "Prière", "theme": "martires", "sub": "Béatifications", "tags": [], "lines": [{"t": "p", "x": "Ô Dieu, qui élèves les humbles et rejettes les superbes,"}, {"t": "p", "x": "daigne glorifier ton serviteur N. et fais resplendir son nom"}, {"t": "p", "x": "dans la liste de ceux dont la sainteté a été reconnue par ton Église. Multiple tes grâces en faveur de ceux qui t'adressent"}, {"t": "p", "x": "des supplications par son intercession."}, {"t": "p", "x": "Et accorde-nous de voir l'Église honorer un jour sa mémoire en le proposant comme un modèle à imiter et un protecteur à invoquer dans les difficultés de notre vie missionnaire. Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "172", "num": "5.7", "title": "Prière pour demander une béatification", "theme": "martires", "sub": "Béatifications", "tags": [], "lines": [{"t": "p", "x": "Seigneur, notre Dieu, qui as élu quelques-uns de nos frères,"}, {"t": "p", "x": "Fils du Cœur Immaculé de Marie, et les as fait resplendir"}, {"t": "p", "x": "par l'exemple d'une particulière sainteté dans la vie missionnaire ;"}, {"t": "p", "x": "daigne enrichir et féconder la sainte Église avec leur glorification"}, {"t": "p", "x": "et accorde-nous la grâce de suivre leur témoignage évangélique, en travaillant avec ardeur à chercher en toutes choses"}, {"t": "p", "x": "ta gloire et le salut de nos frères."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "IX. PROFESSIONS"}, {"t": "p", "x": "ET RÉNOVATION DES VŒUX"}, {"t": "p", "x": "XI. PRIÈRES POUR LE CHAPITRE"}]}, {"id": "32", "num": "6.1", "title": "Magnificat de la vocation", "theme": "congregacion", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "r", "x": "Magnificat, magnificat anima mea Dominum!"}, {"t": "p", "x": "Merci, Seigneur, d’avoir daigné choisir tes humbles serviteurs"}, {"t": "p", "x": "pour devenir les Fils du Cœur Immaculé de ta Mère!"}, {"t": "p", "x": "Ô Mère mille fois bénie, reçois toutes nos louanges"}, {"t": "p", "x": "pour la délicatesse"}, {"t": "p", "x": "que ton Cœur Immaculé nous a montrée"}, {"t": "p", "x": "en nous adoptant pour tes enfants."}, {"t": "p", "x": "Fais que nous répondions à ta grande bonté"}, {"t": "p", "x": "et que nous soyons toujours humbles, fervents et zélés"}, {"t": "p", "x": "pour le salut du monde."}, {"t": "r", "x": "Magnificat, magnificat anima mea Dominum!"}]}, {"id": "33", "num": "6.2", "title": "Prière du clarétain", "theme": "congregacion", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Fais, Seigneur, que les Missionnaires"}, {"t": "p", "x": "Fils du Cœur Immaculé de Marie,"}, {"t": "p", "x": "nous soyons des hommes qui brûlent de charité"}, {"t": "p", "x": "et qui embrasent partout où ils passent."}, {"t": "p", "x": "Que nous souhaitions ardemment"}, {"t": "p", "x": "et essayons par tous les moyens d’embraser le monde"}, {"t": "p", "x": "du  feu de l'amour divin."}, {"t": "p", "x": "Que rien ne nous arrête."}, {"t": "p", "x": "Que nous sachions nous réjouir dans les privations,"}, {"t": "p", "x": "aborder les travaux, embrasser les sacrifices,"}, {"t": "p", "x": "nous complaire dans les calomnies,"}, {"t": "p", "x": "nous réjouir dans nos souffrances"}, {"t": "p", "x": "et nous glorifier dans la croix de Jésus Christ."}, {"t": "p", "x": "Que nous ne pensions à rien d'autre qu'à suivre"}, {"t": "p", "x": "et  imiter  le Christ dans la prière, le travail et la souffrance"}, {"t": "p", "x": "en cherchant toujours et uniquement"}, {"t": "p", "x": "la plus grande gloire de Dieu et le salut des âmes."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "b) De la Congrégation"}]}, {"id": "34", "num": "6.3", "title": "Prière pour l'anniversaire de la Fondation", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Seigneur, tu as accordé à Saint Antoine-Marie Claret"}, {"t": "p", "x": "de brûler de charité apostolique"}, {"t": "p", "x": "pour le salut des hommes du monde entier."}, {"t": "p", "x": "Dès son enfance, tu l'as conduit"}, {"t": "p", "x": "à la pleine connaissance du mystère du Christ."}, {"t": "p", "x": "Poussé par la charité, il s'est livré à l'annonce de l'Évangile."}, {"t": "p", "x": "Il fut patient dans les travaux et les calomnies"}, {"t": "p", "x": "et ratifia sa mission par son sang et par l'exil."}, {"t": "p", "x": "Pour continuer son œuvre,"}, {"t": "p", "x": "et par l'intervention de la Vierge Marie,"}, {"t": "p", "x": "il fonda notre Congrégation"}, {"t": "p", "x": "et nous transmit son esprit en héritage."}, {"t": "p", "x": "Aujourd'hui, nous souvenant de notre origine dans l'Église,"}, {"t": "p", "x": "nous te demandons, par l'intercession de notre Mère,"}, {"t": "p", "x": "de nous rendre fidèles à l’esprit du Fondateur"}, {"t": "p", "x": "dans le ministère de la Parole."}, {"t": "p", "x": "Que  son esprit missionnaire"}, {"t": "p", "x": "nous inspire et nous soutienne dans notre apostolat."}, {"t": "p", "x": "Seigneur, bénis de nouvelles vocations la famille clarétaine."}, {"t": "p", "x": "Accorde-nous un grand amour  envers Jésus et son Église."}, {"t": "p", "x": "Fais que, pressés par cet amour,"}, {"t": "p", "x": "nous, les fils du Cœur Immaculé de Marie,"}, {"t": "p", "x": "travaillions infatigablement pour la gloire de Dieu"}, {"t": "p", "x": "et le salut du monde."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "35.Pour notre Congrégation"}, {"t": "v", "x": ": Regarde du haut du ciel notre Congrégation"}, {"t": "p", "x": "et vient la visiter."}, {"t": "r", "x": ": Prends soin d'elle, arrosela, enrichisla sans mesure."}, {"t": "v", "x": ": Souvienstoi, Seigneur, de chacun de nous."}, {"t": "r", "x": ": Envoienous ta lumière et ta vérité."}, {"t": "v", "x": ": Donnenous vie, afin que nous invoquions ton nom."}, {"t": "r", "x": ":  Et que nous accomplissions la mission"}, {"t": "p", "x": "d'annoncer l'Évangile à tous les  peuples."}, {"t": "p", "x": "Nous te prions, Seigneur,"}, {"t": "p", "x": "par l'intercession du Cœur Immaculé de Marie,"}, {"t": "p", "x": "de libérer de tout mal notre Congrégation,"}, {"t": "p", "x": "afin que, avec un esprit humble et généreux,"}, {"t": "p", "x": "comme celui de saint Antoine-Marie Claret,"}, {"t": "p", "x": "elle se voue à ton projet de salut pour tous les hommes."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "36", "num": "6.4", "title": "Pour la Congrégation", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "v", "x": ": Sainte Marie,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Saint Michel et tous les saints Anges,"}, {"t": "r", "x": ": priez pour nous."}, {"t": "v", "x": ": Saint Joseph,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Tous les Saints Apôtres,"}, {"t": "r", "x": ": priez pour nous."}, {"t": "v", "x": ": Saint Alphonse de Liguori,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Saint Ignace de Loyola,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Saint François Xavier,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Saint Vincent de Paul,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Saint Antoine-Marie Claret,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Sainte Thérèse de Jésus,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Sainte Catherine de Sienne,"}, {"t": "r", "x": ": prie pour nous."}, {"t": "v", "x": ": Les Bienheureux Martyrs de la famille Clarétaine,"}, {"t": "r", "x": ": priez pour nous."}, {"t": "v", "x": ": Tous les Saints et toutes les Saintes de Dieu,"}, {"t": "r", "x": ": priez pour nous."}, {"t": "v", "x": ": Souvienstoi, Seigneur, de ta Congrégation,"}, {"t": "r", "x": ": vigne plantée par ta main."}, {"t": "v", "x": ": Qu'elle remplisse  sa mission d'annoncer l'Évangile,"}, {"t": "r", "x": ": afin que tous les hommes soient sauvés."}, {"t": "v", "x": ": Nous te prions de venir au secours de tes serviteurs,"}, {"t": "r", "x": ": que tu as rachetés par ton précieux sang."}, {"t": "v", "x": ": Sauve, Seigneur, ta Congrégation,"}, {"t": "r", "x": ": Sois son berger et guidela toujours."}, {"t": "v", "x": ": Prends pitié de nous, Seigneur,"}, {"t": "r", "x": ": prends pitié de nous."}, {"t": "v", "x": ": Que ta miséricorde, Seigneur, soit sur nous,"}, {"t": "r", "x": ": comme notre espoir est en toi."}, {"t": "v", "x": ": Seigneur, écoute notre prière,"}, {"t": "r", "x": ": que notre cri parvienne jusqu'à toi."}, {"t": "v", "x": ": Le Seigneur soit avec vous."}, {"t": "r", "x": ": et avec ton esprit."}, {"t": "rub", "x": "Prions."}, {"t": "p", "x": "Par l'intercession de la Vierge Marie,"}, {"t": "p", "x": "nous te prions, Seigneur, de bénir cette Congrégation;"}, {"t": "p", "x": "répands abondamment ta grâce sur ses fils"}, {"t": "p", "x": "et remplisles de ton esprit, afin qu'ils puissent"}, {"t": "p", "x": "se complaire toujours dans la vérité."}, {"t":
