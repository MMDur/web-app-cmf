 ne manquions jamais de l’aide de"}, {"t": "p", "x": "ceux qui sont tes serviteurs dans le  ciel,"}, {"t": "p", "x": "pour te louer, nous aussi, toujours et à jamais."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "Pour la fête de sainte Thérèse de Jésus (le 15 octobre)"}, {"t": "p", "x": "Sainte Thérèse de Jésus, copatronne (15 octobre)"}]}, {"id": "214", "num": "14.13", "title": "Notre âme, Seigneur, a soif de Toi,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "comme une terre desséchée et sans eau."}, {"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Ô Dieu, qui as suscité en ton Église sainte Thérèse de Jésus et nous as montré par elle le chemin de la perfection;"}, {"t": "p", "x": "fais-nous désirer non seulement notre nourriture corporelle,"}, {"t": "p", "x": "mais aussi le pain quotidien de ta Parole et de ton Corps, afin que nous cherchions de tout notre coeurt notre sanctification"}, {"t": "p", "x": "et le salut de nos frères, en accomplissant fidèlement"}, {"t": "p", "x": "notre mission dans l’Église."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "Pour la fête de saint Antoine-Marie Claret  (24 octobre)"}, {"t": "p", "x": "Saint Antoine-Marie Claret, Fondateur (24 octobre)"}]}, {"id": "215", "num": "14.14", "title": "Béni sois-tu, Seigneur Jésus,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "le Fils et Envoyé du Père."}, {"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Bénis, Seigneur, ces aliments que nous allons prendre"}, {"t": "p", "x": "et mets dans nos cœurs le même esprit"}, {"t": "p", "x": "qui anima saint Antoine-Marie Claret, notre Père,"}, {"t": "p", "x": "afin que, pressés par son esprit, nous soyons toujours prêts"}, {"t": "p", "x": "à proclamer ta Parole et à communiquer la vie à nos frères."}, {"t": "p", "x": "Toi qui vis et règnes pour les siècles des siècles. Amen." hori, hona hemen zure semea. Bidal nazazu."}, {"t": "p", "x": "Ama hori, hona hemen zure semea. Hitz ezazu nire bitartez."}, {"t": "p", "x": "Gorde nazazu"}, {"t": "p", "x": "gainontzekoei Ebanjelioa iragartzen diedan bitartean"}, {"t": "p", "x": "Jainkoaren Erregetzatik alde ez egiteko."}, {"t": "p", "x": "Zuregan, ene Ama hori,"}, {"t": "p", "x": "nire konfiantza osoa oinarritu dut."}, {"t": "p", "x": "Ez naiz behin ere suntsiturik ibiliko. Amen."}]}, {"id": "3", "num": 3, "title": "Eskerretako ekintza Mariaren Bihotza dela eta", "theme": "mariaren-bihotza", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Eskerrak ematen dizkizugu, Aita Santu Hori,"}, {"t": "p", "x": "Maria Birjinari"}, {"t": "p", "x": "bihotz jakintsu eta esaneko eman zeniolako"}, {"t": "p", "x": "Zu atsegintzeko prest egon dadin beti;"}, {"t": "p", "x": "bihotz berri eta apala,"}, {"t": "p", "x": "Itun Berriaren legea bertan iragartzeko;"}, {"t": "p", "x": "bihotz xume eta garbia,"}, {"t": "p", "x": "zeinek gauzatu zuen zure Semea birjinen eran sortzea"}, {"t": "p", "x": "eta behin betiko Zu kontenplatzeko gaitasunez hornitu;"}, {"t": "p", "x": "bihotz sendo eta ausart bat"}, {"t": "p", "x": "minaren ezpata, indarrez, jasan ahal izateko"}, {"t": "p", "x": "eta, fedez beterik, zure Semearen Berpizkundea itxaroteko."}, {"t": "p", "x": "Emaiguzu"}, {"t": "p", "x": "bihotz jakintsu eta esaneko bat,"}, {"t": "p", "x": "berri eta apala,"}, {"t": "p", "x": "xume eta garbia,"}, {"t": "p", "x": "sendo eta ausarta"}, {"t": "p", "x": "Bera atzeman dezagun"}, {"t": "p", "x": "eta zure salbamen-eginkizunean leialtasun haundiagoz"}, {"t": "p", "x": "lan egin."}, {"t": "p", "x": "Amen"}]}, {"id": "4", "num": 4, "title": "Ama Mariaren Bihotza", "theme": "mariaren-bihotza", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Jauna, gure Jainko"}, {"t": "p", "x": "Ama Maria Birjina aukeratu zenuen"}, {"t": "p", "x": "zure Semearen Ama eta gure Ama bezala;"}, {"t": "p", "x": "egizu, bere amaren Bihotzarekiko l let DADES = [], TEMES = [], CIRCUMS = [], UI = {};

function setLang(code, save) {
  const pack = LANG_PACKS[code];
  if (!pack) return;
  DADES = pack.dades; TEMES = pack.temes; CIRCUMS = pack.circums;
  UI = { storageKey:pack.storageKey, myPrayers:pack.myPrayers,
    myPrayersDesc:pack.myPrayersDesc, noPrayers:pack.noPrayers,
    noPrayersHint:pack.noPrayersHint, backToThemes:pack.backToThemes,
    searchCount:pack.searchCount, searchNone:pack.searchNone,
    searchHint:pack.searchHint, homeSubtitle:pack.homeSubtitle,
    homeTitle:pack.homeTitle, homeIntro:pack.homeIntro,
    readingMode:pack.readingMode, exitReadingMode:pack.exitReadingMode,
    markFav:pack.markFav, markedFav:pack.markedFav,
    copyText:pack.copyText, copied:pack.copied, print:pack.print,
    prev:pack.prev, next:pack.next, textSmaller:pack.textSmaller,
    textLarger:pack.textLarger, searchLabel:pack.searchLabel,
    searchPlaceholder:pack.searchPlaceholder, preparations:pack.preparations,
    themes:pack.themes, themeIndex:pack.themeIndex, hideIndex:pack.hideIndex };
  document.documentElement.lang = pack.lang;
  document.getElementById('appTitle').textContent = '\u2720 ' + pack.appTitle;
  document.getElementById('appSubtitle').textContent = pack.subTitle;
  document.getElementById('toggleIdx').textContent = UI.themeIndex;
  document.getElementById('toggleIdx').setAttribute('aria-label', UI.themeIndex);
  document.querySelectorAll('.lang-btn').forEach(b => {
    const on = b.dataset.lang === code;
    b.classList.toggle('actiu', on);
    b.setAttribute('aria-pressed', on);
  });
  if (save !== false) { try { window.storage.set('cmf-lang', code); } catch(e) {} }
  carregaFavs().then(render);
}

async function init() {
  let lang = 'es';
  try { const r = await window.storage.get('cmf-lang');
        if (r && r.value && LANG_PACKS[r.value]) lang = r.value; } catch(e) {}
  setLang(lang, false);
}

/* ---------- utilidades ---------- */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const perTema = id => DADES.filter(p=>p.theme===id);
const idxDe = p => DADES.indexOf(p);
const troba = id => DADES.find(p=>String(p.id)===String(id));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const incipit = p => { const l=p.lines.find(l=>l.t==='p'||l.t==='v'); return l?l.x:''; };

/* ---------- favoritos ---------- */
let favs = new Set(); let favsMem = true;
async function carregaFavs(){
  try{ const r = await window.storage.get(UI.storageKey); if(r&&r.value){favs=new Set(JSON.parse(r.value)); favsMem=false;} else {favsMem=false;} }
  catch(e){ favsMem=false; /* clave inexistente: ok */ }
}
async function desaFavs(){
  try{ await window.storage.set(UI.storageKey, JSON.stringify([...favs])); }catch(e){}
}
function toggleFav(id){ if(favs.has(id)) favs.delete(id); else favs.add(id); desaFavs(); render(); }

/* ---------- tamaño del texto ---------- */
let mida = 1.28;
function canviaMida(d){ mida = Math.min(2.4, Math.max(.95, mida + d)); document.documentElement.style.setProperty('--fs-preg', mida+'rem'); }

/* ---------- índice lateral ---------- */
function pintaIdx(temaActiu){
  const nav = document.getElementById('idxNav');
  let h = `<div class="idx-titol">${UI.themes}</div>`;
  for(const t of TEMES){
    const n = perTema(t.id).length;
    h += `<a href="#/tema/${t.id}" class="${temaActiu===t.id?'actiu':''}${t.temporal?' tmp-idx':''}">${t.temporal?"":TEMES.indexOf(t)+1+". "}${esc(t.nom)}<span class="n">${n}</span></a>`;
  }
  if(favs.size) h += `<div class="idx-titol">${UI.preparations}</div><a href="#/favorits" class="${temaActiu==='__fav'?'actiu':''}">${UI.myPrayers}<span class="n">${favs.size}</span></a>`;
  nav.innerHTML = h;
}

/* ---------- búsqueda ---------- */
function cercaHTML(valor){
  return `<div class="cerca-wrap"><span class="cerca-ico">⌕</span>
  <input id="cerca" class="cerca" type="search" value="${esc(valor||'')}" placeholder="${UI.searchPlaceholder}" aria-label="${UI.searchLabel}" autocomplete="off"></div>`;
}
function lligaCerca(){
  const el = document.getElementById('cerca'); if(!el) return;
  el.addEventListener('input', ()=>{ const q=el.value.trim();
    history.replaceState(null,'', q? '#/cerca/'+encodeURIComponent(q) : '#/');
    pintaResultats(q);
  });
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const q=el.value.trim(); const ex=DADES.find(p=>String(p.num)===q); if(ex) location.hash='#/p/'+ex.id; } });
}
function cercaPreg(q){
  const nq = norm(q); if(!nq) return [];
  const res = DADES.map(p=>{
    let s=0;
    if(String(p.num||'')===q.trim()) s+=100;
    else if(String(p.num||'').startsWith(q.trim()) && /^\d/.test(q)) s+=40;
    if(norm(p.title).includes(nq)) s+=30;
    if(norm(p.sub||'').includes(nq)) s+=14;
    if((p.tags||[]).some(t=>norm(t).includes(nq))) s+=14;
    const cos = norm(p.lines.map(l=>l.x).join(' '));
    if(cos.includes(nq)) s+=8;
    return {p,s};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.p);
  return res;
}
function itemHTML(p, mostraTema){
  const t = TEMES.find(t=>t.id===p.theme);
  return `<li class="preg-item"><a href="#/p/${p.id}">
    <span class="foli">${p.num?esc(String(p.num)):'·'}</span>
    <span><span class="tt">${esc(p.title)}${favs.has(String(p.id))?' <span class="fav-cinta">❧</span>':''}</span>
    <span class="inc">${esc(incipit(p))}</span></span>
    ${mostraTema&&t?`<span class="res-tema">${esc(t.nom)}</span>`:(p.sub?`<span class="etq">${esc(p.sub)}</span>`:'')}
  </a></li>`;
}
function pintaResultats(q){
  const cont = document.getElementById('resultats'); if(!cont) return;
  if(!q){ cont.innerHTML = portadaCos(); return; }
  const res = cercaPreg(q);
  cont.innerHTML = res.length
    ? `<div class="res-cap">${UI.searchCount(res.length)}</div><ul class="llista">${res.map(p=>itemHTML(p,true)).join('')}</ul>`
    : `<div class="buit">${UI.searchNone} «${esc(q)}».<br>${UI.searchHint}</div>`;
}

function portadaCos(){

    <div class="temes-grid">${TEMES.map(t=>`<a class="tema-card" href="#/tema/${t.id}">
      ${t.temporal?`<h3 class="tmp-h">${esc(t.nom)}</h3>`:`${t.temporal?`<h3 class="tmp-h">${esc(t.nom)}</h3>`:`<h3><span class="tema-ord">${TEMES.indexOf(t)+1}.</span> ${esc(t.nom)}</h3>`}`}<div class="desc">${esc(t.desc)}</div>
      <div class="compta">${perTema(t.id).length} ${UI.prayerUnit}</div></a>`).join('')}

  return h;
}
function vistaPortada(q){
  pintaIdx(null);
  document.getElementById('pagina').innerHTML = cercaHTML(q) + `<div id="resultats"></div>`;
  lligaCerca();
  pintaResultats(q||'');
  if(q){ const el=document.getElementById('cerca'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
}
function vistaTema(id){
  const t = TEMES.find(t=>t.id===id); if(!t){ location.hash='#/'; return; }
  pintaIdx(id);
  const pl = perTema(id);
  const subs = [...new Set(pl.map(p=>p.sub).filter(Boolean))];
  let llista='';
  if(subs.length>1){
    for(const s of subs){ llista += `<div class="sub-grup">${esc(s)}</div><ul class="llista">${pl.filter(p=>p.sub===s).map(p=>itemHTML(p)).join('')}</ul>`; }
    const sense = pl.filter(p=>!p.sub);
    if(sense.length) llista = `<ul class="llista">${sense.map(p=>itemHTML(p)).join('')}</ul>` + llista;
  } else {
    llista = `<ul class="llista">${pl.map(p=>itemHTML(p)).join('')}</ul>`;
  }
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/">${UI.backToThemes}</a>
    <div class="tema-cap">${t.temporal?`<h2 class="tmp-h">${esc(t.nom)}</h2>`:`${t.temporal?`<h2 class="tmp-h">${esc(t.nom)}</h2>`:`<h2><span class="tema-ord">${TEMES.indexOf(t)+1}.</span> ${esc(t.nom)}</h2>`}`}<div class="desc">${esc(t.desc)}</div></div>${llista}`;
  lligaCerca();
  window.scrollTo(0,0);
}
function vistaFavorits(){
  pintaIdx('__fav');
  const pl = DADES.filter(p=>favs.has(String(p.id)));
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/">${UI.backToThemes}</a>
    <div class="tema-cap"><h2>${UI.myPrayers}</h2><div class="desc">${UI.myPrayersDesc}</div></div>` +
   (pl.length?`<ul class="llista">${pl.map(p=>itemHTML(p,true)).join('')}</ul>`
    :`<div class="buit">${UI.noPrayers}<br>${UI.noPrayersHint}</div>`);
  lligaCerca(); window.scrollTo(0,0);
}
function liniaHTML(l, prev){
  if(l.t==='rub') return `<p class="rub">${esc(l.x)}</p>`;
  if(l.t==='v') return `<p class="vers${prev&&prev.t==='r'?' espai':''}">${esc(l.x)}</p>`;
  if(l.t==='r') return `<p class="resp">${esc(l.x)}</p>`;
  const espai = prev && (prev.t==='r') ? ' espai':'';
  return `<p class="${espai.trim()}">${esc(l.x)}</p>`;
}
function vistaPreg(id){
  const p = troba(id); if(!p){ location.hash='#/'; return; }
  pintaIdx(p.theme);
  const t = TEMES.find(t=>t.id===p.theme);
  const i = idxDe(p), ant = DADES[i-1], seg = DADES[i+1];
  let cos=''; let prev=null;
  for(const l of p.lines){ cos += liniaHTML(l, prev); prev=l; }
  const fav = favs.has(String(p.id));
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/tema/${p.theme}">← ${esc(t?t.nom:UI.themes)}</a>
    <article class="preg-full">
      <div class="preg-meta">${t?(t.temporal?esc(t.nom):(t.temporal?esc(t.nom):TEMES.indexOf(t)+1+'. '+esc(t.nom))):''}${p.sub?' · '+esc(p.sub):''}</div>
      ${p.num?`<div class="preg-num">${esc(String(p.num))}</div>`:''}
      <h2 class="preg-titol">${esc(p.title)}</h2>
      <div class="preg-eines">
        <button class="eina surt-lectura" id="btnLectura">${UI.readingMode}</button>
        <button class="eina ${fav?'fav-actiu':''}" id="btnFav">${fav?UI.markedFav:UI.markFav}</button>
        <button class="eina" id="btnCopia">${UI.copyText}</button>
        <button class="eina" onclick="window.print()">${UI.print}</button>
        <span class="mida-grup"><button class="eina mida" id="btnMenys" aria-label="${UI.textSmaller}">A−</button><button class="eina mida" id="btnMes" aria-label="${UI.textLarger}">A+</button></span>
      </div>
      <div class="preg-cos" id="cosPreg">${cos}</div>
    </article>
    <nav class="nav-pn">
      ${ant?`<a href="#/p/${ant.id}"><span class="pn-l">${UI.prev}</span><span class="pn-t">${ant.num?ant.num+'. ':''}${esc(ant.title)}</span></a>`:'<span></span>'}
      ${seg?`<a class="seg" href="#/p/${seg.id}"><span class="pn-l">${UI.next}</span><span class="pn-t">${seg.num?seg.num+'. ':''}${esc(seg.title)}</span></a>`:''}
    </nav>`;
  lligaCerca();
  document.getElementById('btnFav').onclick = ()=>toggleFav(String(p.id));
  document.getElementById('btnMes').onclick = ()=>canviaMida(.12);
  document.getElementById('btnMenys').onclick = ()=>canviaMida(-.12);
  document.getElementById('btnCopia').onclick = e=>{
    const txt = (p.num?p.num+'. ':'')+p.title+'\n\n'+p.lines.map(l=>{
      if(l.t==='v')return 'V/. '+l.x; if(l.t==='r')return 'R/. '+l.x; return l.x;}).join('\n');
    navigator.clipboard.writeText(txt).then(()=>{e.target.textContent=UI.copied; setTimeout(()=>e.target.textContent=UI.copyText,1600);}).catch(()=>{});
  };
  const bl = document.getElementById('btnLectura');
  bl.onclick = ()=>{
    document.body.classList.toggle('lectura');
    const on = document.body.classList.contains('lectura');
    bl.textContent = on ? '✕ Salir del modo oración' : '📖 Modo oración';
    if(on && mida<1.6){ mida=1.6; document.documentElement.style.setProperty('--fs-preg',mida+'rem'); }
    window.scrollTo(0,0);
  };
  window.scrollTo(0,0);
}

/* ---------- router ---------- */
function render(){
  document.body.classList.remove('lectura');
  const h = location.hash || '#/';
  const m1 = h.match(/^#\/tema\/(.+)$/);
  const m2 = h.match(/^#\/p\/(.+)$/);
  const m3 = h.match(/^#\/cerca\/(.+)$/);
  if(m1) vistaTema(decodeURIComponent(m1[1]));
  else if(m2) vistaPreg(decodeURIComponent(m2[1]));
  else if(m3) vistaPortada(decodeURIComponent(m3[1]));
  else if(h==='#/favorits') vistaFavorits();
  else vistaPortada('');
}
window.addEventListener('hashchange', render);
document.getElementById('toggleIdx').addEventListener('click', function(){
  const sp = document.querySelector('.spine'); sp.classList.toggle('open');
  this.setAttribute('aria-expanded', sp.classList.contains('open'));
  this.textContent = sp.classList.contains('open') ? UI.hideIndex : UI.themeIndex;
});
document.querySelector('.idx').addEventListener('click', ()=>{ if(innerWidth<=900){ document.querySelector('.spine').classList.remove('open'); }});

carregaFavs().then(render);
render();

document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});
init();
</script>
</body>
</html>
