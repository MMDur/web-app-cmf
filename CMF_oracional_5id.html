"p", "x": "Par Jésus, le Christ, notre Seigneur. Amen"}]}, {"id": "37", "num": "6.5", "title": "Prière pour la Congrégation", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Père de bonté et de miséricorde,"}, {"t": "p", "x": "nous te louons et nous te bénissons,"}, {"t": "p", "x": "parce que tu as enrichi ton Église"}, {"t": "p", "x": "avec le charisme apostolique d’Antoine-Marie Claret,"}, {"t": "p", "x": "notre Fondateur et Père."}, {"t": "p", "x": "Nous te supplions humblement d'envoyer"}, {"t": "p", "x": "de nouveaux ouvriers à notre Congrégation"}, {"t": "p", "x": "et d’envoyer ton Esprit sur ceux que tu as choisis."}, {"t": "p", "x": "Confirme-nous tous dans la vocation missionnaire"}, {"t": "p", "x": "et fais que, pressés par la charité du Christ,"}, {"t": "p", "x": "comme de vrais Fils du Cœur Immaculé de Marie,"}, {"t": "p", "x": "nous annoncions à tous les peuples"}, {"t": "p", "x": "la Bonne Nouvelle du Royaume."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "38", "num": "6.6", "title": "Pour rénover l'esprit clarétain", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Renouvelle, Seigneur, en notre Congrégation"}, {"t": "p", "x": "l'esprit qui anima saint Antoine-Marie Claret, notre Père,"}, {"t": "p", "x": "afin qu’enflammé par lui, nous nous efforcions"}, {"t": "p", "x": "d’aimer ce qu'il a aimé et de pratiquer"}, {"t": "p", "x": "ce qu'il nous a enseigné."}, {"t": "p", "x": "Par Jésus, le Christ, Notre Seigneur. Amen."}]}, {"id": "39", "num": "6.7", "title": "Évangélisateurs fidèles", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Toi, Seigneur, tu as décidé miséricordieusement"}, {"t": "p", "x": "que ta Parole prenne chair dans le sein de  Marie;"}, {"t": "p", "x": "accordenous de garder cette Parole en nos cœurs,"}, {"t": "p", "x": "de sorte que nous soyons toujours de fidèles serviteurs"}, {"t": "p", "x": "de l'annonce de sa Bonne Nouvelle du salut."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "40", "num": "6.8", "title": "Les Constitutions", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Notre Père, qui nous as accordé le don de suivre Jésus"}, {"t": "p", "x": "et d'annoncer ton Royaume parmi les hommes"}, {"t": "p", "x": "à la manière de Claret et de ses premiers disciples,"}, {"t": "p", "x": "aidenous à observer avec tout le soin possible"}, {"t": "p", "x": "nos Constitutions, chemin de l'Évangile pour nous."}, {"t": "p", "x": "Fais que nous écoutions ta Parole  comme ta Mère,"}, {"t": "p", "x": "afin que nous soyons de fidèles Fils de son Cœur"}, {"t": "p", "x": "et coopérions à son rôle maternel"}, {"t": "p", "x": "dans la mission apostolique."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "41", "num": "6.9", "title": "Action de grâces pour la vocation", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Je te rends grâce, ô ma Mère, pour la vocation reçue ;"}, {"t": "p", "x": "faismoi la grâce d'y rester fidèle toute ma vie. Amen."}]}, {"id": "42", "num": "6.10", "title": "Définition du Missionnaire Clarétain", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "v", "x": ": Seigneur, par l'intercession du Cœur  de Marie,"}, {"t": "p", "x": "mets en nous l'esprit d'amour, afin que nous soyons"}, {"t": "p", "x": "des hommes brûlant de charité"}, {"t": "p", "x": "qui embrasent partout où ils passent."}, {"t": "r", "x": ": Amen"}, {"t": "v", "x": ": Fais que nous essayions  par tous les moyens"}, {"t": "p", "x": "d’embraser  le monde entier du feu de l'amour divin."}, {"t": "r", "x": ": Amen."}, {"t": "v", "x": ": Seigneur, par l'intercession du Cœur de Marie,"}, {"t": "p", "x": "mets en nous l'esprit de force,"}, {"t": "p", "x": "afin que rien ne nous épouvante,"}, {"t": "p", "x": "et que nous nous réjouissions dans les privations"}, {"t": "p", "x": "et abordions vaillamment les travaux."}, {"t": "r", "x": ": Amen."}, {"t": "v", "x": ": Seigneur, fais que nous acceptions  les sacrifices,"}, {"t": "p", "x": "les calomnies et toute sorte de souffrance."}, {"t": "r", "x": ": Amen."}, {"t": "v", "x": ": Seigneur, par l'intercession du Cœur  de Marie,"}, {"t": "p", "x": "mets en nous l'esprit missionnaire qui anima Jésus,"}, {"t": "p", "x": "afin que nous ne pensions qu’à le suivre"}, {"t": "p", "x": "et l'imiter dans la prière, le travail et la souffrance."}, {"t": "r", "x": ": Amen"}, {"t": "v", "x": ": Et pour que, comme Jésus, nous cherchions"}, {"t": "p", "x": "toujours et uniquement  ta plus grande gloire"}, {"t": "p", "x": "et le salut des hommes."}, {"t": "r", "x": ": Amen."}]}, {"id": "43", "num": "6.11", "title": "Profession d'identité clarétaine", "theme": "congregacion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Nous croyons que le Saint-Esprit nous a convoqués"}, {"t": "p", "x": "dans l'Église par Saint Antoine-Marie Claret,"}, {"t": "p", "x": "afin que, comme Congrégation, nous nous appelions"}, {"t": "p", "x": "et soyons Missionnaires Fils du Cœur de Marie."}, {"t": "p", "x": "Nous croyons que le Père nous appelle ensemble à vivre,"}, {"t": "p", "x": "de manière authentique et significative,"}, {"t": "p", "x": "le mystère et la mission apostolique de son Fils"}, {"t": "p", "x": "en fraternité évangélisée et évangélisatrice."}, {"t": "p", "x": "C'est Lui qui fait de nous de vrais disciples du Christ."}, {"t": "p", "x": "L’amour qui configure notre vie fraternelle,"}, {"t": "p", "x": "nous voulons le signifier, de plus en plus, dans l'eucharistie."}, {"t": "p", "x": "Nous croyons que Marie est à l'origine de notre vocation"}, {"t": "p", "x": "et qu'elle exerce sa maternité en configurant notre vie"}, {"t": "p", "x": "avec celle du Christ, son Fils."}, {"t": "p", "x": "En son Cœur se forment les apôtres de la Congrégation."}, {"t": "p", "x": "Sa présence nous invite à évangéliser, et son amour"}, {"t": "p", "x": "transforme et accompagne les croyants."}, {"t": "p", "x": "Nous croyons que le Père Claret fut choisi  par Dieu"}, {"t": "p", "x": "pour qu’il soit notre prototype et modèle"}, {"t": "p", "x": "comme missionnaires au service de l'Évangile"}, {"t": "p", "x": "dans l'Église universelle."}, {"t": "p", "x": "Nous croyons que notre vocation  comporte"}, {"t": "p", "x": "la suite fidèle du Christ, messager du Père,"}, {"t": "p", "x": "selon les exigences évangéliques vécues par Claret"}, {"t": "p", "x": "et transmises par lui à la Congrégation."}, {"t": "p", "x": "Nous croyons que l'Esprit de Jésus ressuscité"}, {"t": "p", "x": "nous rend prophètes pour annoncer aux pauvres"}, {"t": "p", "x": "l’amour infini que le Christ nous manifesta sur la croix."}, {"t": "p", "x": "Nous croyons que nous sommes appelés,"}, {"t": "p", "x": "comme de vaillants collaborateurs du Pape et des Évêques"}, {"t": "p", "x": "dans le ministère de la Parole, pour l’expansion"}, {"t": "p", "x": "du règne de Dieu dans le monde."}, {"t": "p", "x": "C'est pourquoi, en employant tous les moyens possibles,"}, {"t": "p", "x": "nous ferons ce qui est le plus urgent, opportun et efficace."}, {"t": "p", "x": "Nous croyons que la Congrégation est l’œuvre de Dieu"}, {"t": "p", "x": "et que Jésus et Marie ne l'abandonneront jamais."}, {"t": "p", "x": "Ils accorderont l’Esprit  à ceux qui seront appelés,"}, {"t": "p", "x": "afin que, vivant tous en fraternité la même consécration,"}, {"t": "p", "x": "nous glorifions le Père, en travaillant tous ensemble"}, {"t": "p", "x": "pour que la lumière de l’Évangile de Jésus arrive"}, {"t": "p", "x": "aux quatre coins du monde."}, {"t": "p", "x": "Nous croyons, Seigneur. Augmente en nous la foi."}]}, {"id": "68", "num": "7.1", "title": "Supplication au Père", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Père, tu nous as envoyé l’Esprit Saint pour allumer"}, {"t": "p", "x": "dans nos cœurs le feu de l’amour envers toi"}, {"t": "p", "x": "et envers nos frères. Il nous configure au Christ"}, {"t": "p", "x": "et édifie notre communion."}, {"t": "p", "x": "Fais que nous sachions l’accueillir  et lui être fidèles,"}, {"t": "p", "x": "afin que toute notre vie missionnaire"}, {"t": "p", "x": "soit animée par la charité et que nous obtenions ainsi,"}, {"t": "p", "x": "dans la communauté missionnaire,"}, {"t": "p", "x": "la plénitude personnelle à laquelle tu nous appelles."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "69", "num": "7.2", "title": "Prière de la communauté", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Nous te rendons grâce, Père Saint,"}, {"t": "p", "x": "pour nous avoir rassemblés en cette communauté,"}, {"t": "p", "x": "dans laquelle tu veux que nous annoncions ton Royaume"}, {"t": "p", "x": "par une vie fraternelle  au service de  l'Évangile."}, {"t": "p", "x": "Nous voulons proclamer, avec la  Marie et les Apôtres,"}, {"t": "p", "x": "les merveilles de ton amour parmi les hommes."}, {"t": "p", "x": "Nous renouvelons notre résolution de devenir meilleurs,"}, {"t": "p", "x": "de nous aider mutuellement à suivre ton Fils,"}, {"t": "p", "x": "de seconder les inspirations du Saint-Esprit et de collaborer"}, {"t": "p", "x": "à l’acomplissement de la mission"}, {"t": "p", "x": "que tu nous as confiée dans l'Église."}, {"t": "p", "x": "Ne permets pas, Seigneur, que cette bonne volonté"}, {"t": "p", "x": "commence à s'étioler par manque d'attention,"}, {"t": "p", "x": "par égoïsme, routine ou inconstance."}, {"t": "p", "x": "Ravive la foi et l'espérance de cette communauté"}, {"t": "p", "x": "à l'heure de discerner les inévitables différences,"}, {"t": "p", "x": "et dispose nos cœurs pour le nécessaire pardon."}, {"t": "p", "x": "Conscients de notre fragilité, nous te demandons"}, {"t": "p", "x": "de nous garder attentifs à ta grâce."}, {"t": "p", "x": "Que la méditation assidue de ta Parole nous recrée,"}, {"t": "p", "x": "et que la convivialité fraternelle nous stimule"}, {"t": "p", "x": "à porter le témoignage d'amour"}, {"t": "p", "x": "dont le monde a besoin pour croire."}, {"t": "p", "x": "Que les besoins et les urgences des plus pauvres"}, {"t": "p", "x": "nous pressent à sortir de nousmêmes"}, {"t": "p", "x": "et nous obligent à travailler sans répit en leur faveur."}, {"t": "p", "x": "Nous nous confions à Marie, modèle de vie consacrée,"}, {"t": "p", "x": "pour qu'elle nous forme en son Cœur et nous aide à marcher"}, {"t": "p", "x": "sur le chemin de la perfection et du service apostolique,"}, {"t": "p", "x": "que le Père Claret nous a tracé dans l'Église et dans le monde."}, {"t": "p", "x": "Père, daigne bénir ce qui est maintenant"}, {"t": "p", "x": "notre aspiration la plus sincère."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "70.La charité fraternelle"}, {"t": "p", "x": "Nous te supplions humblement, Seigneur notre Dieu,"}, {"t": "p", "x": "d'unir dans un même cœur tous ceux qui partageons"}, {"t": "p", "x": "l'esprit de ton serviteur Antoine-Marie,"}, {"t": "p", "x": "afin que, accordés dans un même amour mutuel,"}, {"t": "p", "x": "nous soyons les témoins de ta charité parmi les hommes."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "71", "num": "7.3", "title": "Prière pour ma communauté", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Mon Père, je veux te prier aujourd'hui"}, {"t": "p", "x": "pour mes frères de communauté. Tu connais"}, {"t": "p", "x": "leurs noms et leurs prénoms, leurs vertus et leurs défauts,"}, {"t": "p", "x": "leurs joies et leurs peines, leur force et leur faiblesse."}, {"t": "p", "x": "Tu les aimes  comme ils sont et tu les vivifies par ton Esprit."}, {"t": "p", "x": "Seigneur, tu les aimes  parce qu'ils sont tes enfants."}, {"t": "p", "x": "Enseignemoi à les aimer vraiment, comme Jésus les aime :"}, {"t": "p", "x": "non pas à cause de leurs paroles ou de leurs oeuvres,"}, {"t": "p", "x": "mais pour eux-mêmes, en découvrant, en chacun d'eux,"}, {"t": "p", "x": "le mystère de ton amour infini."}, {"t": "p", "x": "Père, je te rends grâce, parce que tu m'as donné des frères."}, {"t": "p", "x": "Ils sont tous pour moi un cadeau, un vrai sacrement,"}, {"t": "p", "x": "un signe sensible et efficace de la présence de ton Fils."}, {"t": "p", "x": "Donnemoi le regard de Jésus pour les contempler."}, {"t": "p", "x": "Donne-moi son cœur pour les aimer toujours."}, {"t": "p", "x": "Je veux aussi devenir, pour chacun d'eux,"}, {"t": "p", "x": "un sacrament vivant, un signe  de la présence de Jésus."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "73", "num": "8.1", "title": "Connaître Dieu pour le servir", "theme": "mision", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Accordemoi, Seigneur,"}, {"t": "p", "x": "que tous connaissent ta bonté et ta présence,"}, {"t": "p", "x": "afin qu'ils t'aiment et te servent fidèlement,"}, {"t": "p", "x": "parce que tu es bon et ta miséricorde est infinie. Amen."}]}, {"id": "74", "num": "8.2", "title": "Instrument du Royaume", "theme": "mision", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Seigneur, si tu veux faire de moi un instrument"}, {"t": "p", "x": "pour annoncer ton royaume, me voici."}, {"t": "p", "x": "Que la nourriture me donne des forces pour mieux te servir."}, {"t": "p", "x": "Que je me serve des choses de ce monde"}, {"t": "p", "x": "dans la mesure où elles me sont nécessaires."}, {"t": "p", "x": "Que j'étudie pour mieux te connaître, pour mieux t'aimer"}, {"t": "p", "x": "et pour mieux aider mes frères."}, {"t": "p", "x": "Que le repos serve à refaire les forces,"}, {"t": "p", "x": "afin de mieux te servir. Amen."}, {"t": "p", "x": "b)   De la Congrégation"}]}, {"id": "75", "num": "8.3", "title": "Pour le fruit apostolique des missionnaires", "theme": "mision", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Père bon, tu nous as choisis sans aucun mérite de notre part"}, {"t": "p", "x": "et tu nous  envoies comme tu as envoyé ton Fils Jésus."}, {"t": "p", "x": "Donne-nous ton Esprit, pour que nou soyons"}, {"t": "p", "x": "des ministres idoines de l'Évangile,"}, {"t": "p", "x": "et accordenous la force nécessaire pour exercer avec brio"}, {"t": "p", "x": "le ministère du salut pour tous les hommes."}, {"t": "p", "x": "Fais fructifier, Seigneur, nos labeurs."}, {"t": "p", "x": "Fais que ta Parole parle en nous et par nous."}, {"t": "p", "x": "Aidenous à faire que  tout le monde accueille l'Évangile"}, {"t": "p", "x": "et t'aime chaque jour davantage."}, {"t": "p", "x": "Ne permets pas, Seigneur, que nous t'offensions;"}, {"t": "p", "x": "préservenous de tous les dangers,  rends-nous forts."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen"}]}, {"id": "76", "num": "8.4", "title": "Missionnaires", "theme": "mision", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Seigneur, tu nous appelles comme tu as appelé les Apôtres;"}, {"t": "p", "x": "aidenous à travailler de toutes nos forces"}, {"t": "p", "x": "pour  que tu sois aimé, connu et servi par tous."}, {"t": "p", "x": "Donnenous un cœur généreux"}, {"t": "p", "x": "pour aimer tous les hommes sans exception,"}, {"t": "p", "x": "leur procurant la béatitude de ton Règne,"}, {"t": "p", "x": "qui est déjà initié sur terre."}, {"t": "p", "x": "Que tous les dons que tu nous as faits, nous les employions"}, {"t": "p", "x": "à te rendre gloire en les faisant fructifier,"}, {"t": "p", "x": "tout en étant conscients de nos propres limites et défauts,"}, {"t": "p", "x": "et en reconnaissant que nous dépendons totalement de toi."}, {"t": "p", "x": "Fais que, dans toutes nos actions et nos relations,"}, {"t": "p", "x": "nous soyons toujours prêts à demander pardon."}, {"t": "p", "x": "Que nous cherchions à rendre à nos frères"}, {"t": "p", "x": "les services de notre charité, de sorte que chacun de nous"}, {"t": "p", "x": "soit au milieu des autres comme celui qui sert."}, {"t": "p", "x": "Par Jésus le Christ, notre Seigneur. Amen."}]}, {"id": "77", "num": "8.5", "title": "Mission Clarétaine", "theme": "mision", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Père saint, tu as appelé notre Fondateur à suivre ton Fils."}, {"t": "p", "x": "Pressé par la charité, il  consacra toute sa vie"}, {"t": "p", "x": "à l’annonce de ton Royaume."}, {"t": "p", "x": "Éveille en nous son esprit évangélisateur pour saisir"}, {"t": "p", "x": "ce qui est le plus urgent, opportun et efficace  pour réaliser"}, {"t": "p", "x": "-dociles à l'Esprit- la mission de propager la foi."}, {"t": "p", "x": "Animés, comme Claret, par la force de ton Esprit,"}, {"t": "p", "x": "nous voulons aussi  opter pour la cause du Royaume"}, {"t": "p", "x": "en acceptant les risques"}, {"t": "p", "x": "que comporte notre mission évangélisatrice."}, {"t": "p", "x": "Nous voulons être solidaires des hommes en partageant"}, {"t": "p", "x": "les angoisses, les privations et les espérances"}, {"t": "p", "x": "des hommes auxquels nous sommes envoyés."}, {"t": "p", "x": "En même temps que nous confessons que ton Fils"}, {"t": "p", "x": "est vivant parmi les hommes, nous voulons travailler"}, {"t": "p", "x": "pour en finir avec l'incrédulité, la haine, l'injustice,"}, {"t": "p", "x": "le mensonge, l'oppression, la souffrance, la solitude,"}, {"t": "p", "x": "la faim, l'ignorance et tant d'autres absences  d’amour"}, {"t": "p", "x": "qui sont des urgences du Royaume."}, {"t": "p", "x": "Nous te le demandons par le Christ, notre Seigneur. Amen."}]}, {"id": "78", "num": "8.6", "title": "Prière missionnaire", "theme": "mision", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Père, Toi qui as répandu les dons de ton Esprit"}, {"t": "p", "x": "sur la bienheureuse Vierge Marie,"}, {"t": "p", "x": "qui priait avec les Apôtres au Cénacle,"}, {"t": "p", "x": "aide nous à prier unanimement avec Marie, notre Mère,"}, {"t": "p", "x": "pour porter au monde, par la force de l'Esprit,"}, {"t": "p", "x": "la Bonne Nouvelle du salut."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "79", "num": "8.7", "title": "Pour l'Église", "theme": "mision", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Seigneur,  qui, par l’amour envers les hommes, as prié"}, {"t": "p", "x": "pour la foi de tes disciples, intercéde pour les pécheurs"}, {"t": "p", "x": "et compatis à toutes les souffrances humaines."}, {"t": "p", "x": "Accueille les supplications que nous élevons"}, {"t": "p", "x": "en faveur de toute l'Église, écoute nos prières"}, {"t": "p", "x": "pour la vie du monde et accueillenous tous"}, {"t": "p", "x": "dans le bonheur du Royaume éternel,"}, {"t": "p", "x": "où Tu vis et règnes pour les siècles des siècles. Amen."}]}, {"id": "80", "num": "8.8", "title": "Pour une rencontre de misionnaires", "theme": "mision", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Seigneur Jésus, ton envoi en mission"}, {"t": "p", "x": "nous a dispersés un jour par le monde entier."}, {"t": "p", "x": "Ta Parole de communion nous rassemble aujourd'hui"}, {"t": "p", "x": "en ce grand carrefour de chemins,"}, {"t": "p", "x": "où nous trouver, c'est te retrouver,"}, {"t": "p", "x": "où nous aimer, c'est te rendre témoignage,"}, {"t": "p", "x": "où allumer l'espérance, c'est annoncer ta venue."}, {"t": "p", "x": "Comme les douze, nous revenons vers toi"}, {"t": "p", "x": "des sentiers de notre mission, et nous apportons devant toi"}, {"t": "p", "x": "la souffrance et les humiliations de nos peuples,"}, {"t": "p", "x": "la clameur des pauvres vers lesquels tu nous as envoyés,"}, {"t": "p", "x": "1'espérance des humbles qui ont ouvert leur cœur"}, {"t": "p", "x": "à ton message et l’ont fait fleurir en fraternité"}, {"t": "p", "x": "un peu partout dans l'Église."}, {"t": "p", "x": "Accordenous que, dans cette célébration de ta Parole,"}, {"t": "p", "x": "nous apprenions à discerner dans la foi"}, {"t": "p", "x": "les signes de ce temps, et à te proclamer,"}, {"t": "p", "x": "au milieu des contradictions de ce monde,"}, {"t": "p", "x": "que tu es la vérité totale, toujours nouvelle."}, {"t": "p", "x": "Que ta présence parmi nous dissipe  le découragement"}, {"t": "p", "x": "et nous pousse à opter, avec liberté et force,"}, {"t": "p", "x": "pour ton plan de vie, de justice et de fraternité,"}, {"t": "p", "x": "là où l'on poursuit des projets de destruction,"}, {"t": "p", "x": "d'oppression et de violence."}, {"t": "p", "x": "Envoie sur nous ton Esprit, pour qu’il fasse en nous,"}, {"t": "p", "x": "comme il a fait en Marie, ta mère et notre mère :"}, {"t": "p", "x": "qu’il crée en nous un cœur nouveau en allumant en nous"}, {"t": "p", "x": "la charité apostolique. Qu’il nous aide à relever les défis"}, {"t": "p", "x": "d’une nouvelle évangélisation,"}, {"t": "p", "x": "féconde en oeuvres d'amour et de service"}, {"t": "p", "x": "en faveur des plus nécessiteux."}, {"t": "p", "x": "Que l’Esprit fasse de nous des instruments de communion,"}, {"t": "p", "x": "afin que, partout où tu nous envoies,"}, {"t": "p", "x": "la communauté de ceux qui croient en toi"}, {"t": "p", "x": "soit transparence de ton dessein de salut"}, {"t": "p", "x": "et glorifie ton nom. Amen."}, {"t": "p", "x": "83.Nous voulons faire ta volonté"}, {"t": "p", "x": "Père de bonté et de miséricorde: nous sommes ici réunis"}, {"t": "p", "x": "au nom de l'amour dont tu nous aimes."}, {"t": "p", "x": "Nous te louons, nous te bénissons et nous te rendons grâce."}, {"t": "p", "x": "Nous répondons, avec joie,"}, {"t": "p", "x": "à l'appel que tu nous adresses en ton Fils."}, {"t": "p", "x": "Animés par la force de l'Esprit, nous te disons :"}, {"t": "p", "x": "«Nous voulons faire ta volonté». Accordenous"}, {"t": "p", "x": "un regard limpide, un esprit ouvert et un cœur  ardent"}, {"t": "p", "x": "pour comprendre et embrasser"}, {"t": "p", "x": "le dessein que tu as formé sur nous."}, {"t": "p", "x": "Lorsque nous pensons à la mission que tu nous confies,"}, {"t": "p", "x": "nous prenons conscience des exigences profondes"}, {"t": "p", "x": "qu'il nous faut embrasser."}, {"t": "p", "x": "Augmente en nous la générosité et l'espérance"}, {"t": "p", "x": "et ouvrenous aux besoins les plus urgents des hommes."}, {"t": "p", "x": "Que nous parvenions à exprimer par notre vie"}, {"t": "p", "x": "l'amour universel de Jésus Christ,"}, {"t": "p", "x": "le don inconditionnel et le total oubli de luimême,"}, {"t": "p", "x": "qu'il a manifesté dans la réalisation de sa mission sur terre."}, {"t": "p", "x": "Confirmenous dans la vérité,  donne-nous soif de ta justice"}, {"t": "p", "x": "et fais de nous des instruments utiles de la paix."}, {"t": "p", "x": "Fais de nous des forces vives de communion"}, {"t": "p", "x": "en cette Église pèlerine, et que nous parvenions à être"}, {"t": "p", "x": "témoins de la puissance souveraine du Christ ressuscité"}, {"t": "p", "x": "au milieu de ce peuple qui souffre sa passion de liberté."}, {"t": "p", "x": "Rends-nous responsables en toute action et engagement,"}, {"t": "p", "x": "et ne permets pas que, en proclamant l'Évangile,"}, {"t": "p", "x": "nous cherchions nos propres intérêts."}, {"t": "p", "x": "Accordenous, Seigneur, la charité apostolique"}, {"t": "p", "x": "de saint Antoine-Marie Claret, notre Père et fondateur."}, {"t": "p", "x": "Enseignenous à discerner en tout temps, comme lui,"}, {"t": "p", "x": "ce qui est pour toi le plus agréable, ce qui est juste"}, {"t": "p", "x": "et tout ce qui construit ton Royaume parmi les hommes."}, {"t": "p", "x": "Nous te le demandons par  le Christ, notre Seigneur. Amen."}]}, {"id": "46", "num": "9.1", "title": "La pratique des vertus", "theme": "consagracion", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Jésus, donnemoi la grâce  de t'imiter fidèlement"}, {"t": "p", "x": "en la pratique de toutes les vertus."}, {"t": "p", "x": "Avec toi, je peux tout ; sans toi, je ne peux absolument rien."}, {"t": "p", "x": "Amen."}]}, {"id": "47", "num": "9.2", "title": "La Pauvreté", "theme": "consagracion", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Jésus, notre Sauveur, tu t'es fait pauvre,"}, {"t": "p", "x": "tu as voulu naître pauvre, vivre pauvrement"}, {"t": "p", "x": "et mourir dans la plus grande pauvreté."}, {"t": "p", "x": "Fais que nous, tes missionnaires, nous aimions la pauvreté,"}, {"t": "p", "x": "et que nous l'aimions et la pratiquions"}, {"t": "p", "x": "comme tu nous enseignes, en paroles et en actes;"}, {"t": "p", "x": "que, à l'exemple des Apôtres, nous abandonnions tout"}, {"t": "p", "x": "pour te suivre en annonçant l'Évangile. Amen."}]}, {"id": "48", "num": "9.3", "title": "La mansuétude", "theme": "consagracion", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Mon Dieu, accordemoi un zèle discret et prudent,"}, {"t": "p", "x": "afin que j'agisse en toutes choses avec force et douceur."}, {"t": "p", "x": "Aidemoi à me comporter en tout avec une sainte prudence,"}, {"t": "p", "x": "cultivée par l'étude, fortifiée par la vie,"}, {"t": "p", "x": "éclairée par le dialogue et consommée par l'expérience."}, {"t": "p", "x": "Amen."}]}, {"id": "49", "num": "9.4", "title": "La mortification", "theme": "consagracion", "sub": "du Père Fondateur", "tags": [], "lines": [{"t": "p", "x": "Seigneur, les peines, les souffrances et les travaux"}, {"t": "p", "x": "sont la devise de l'apôtre. Avec ta grâce, je les embrasse."}, {"t": "p", "x": "Aidemoi, Seigneur, à boire la coupe des peines intérieures"}, {"t": "p", "x": "et à recevoir le baptême des peines extérieures."}, {"t": "p", "x": "Fais que je me glorifie  dans la Croix"}, {"t": "p", "x": "où tu a été cloué pour moi. Amen."}, {"t": "p", "x": "b) De la Congrégation"}]}, {"id": "50", "num": "9.5", "title": "Notre consécration", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Mon Dieu et mon Père, répondant à ton appel,"}, {"t": "p", "x": "je veux travailler avec toutes mes forces,"}, {"t": "p", "x": "afin que ta volonté soit faite."}, {"t": "p", "x": "Je désire me consacrer à toi de tout mon coeur"}, {"t": "p", "x": "en suivant Jésus, comme les Apôtres,"}, {"t": "p", "x": "pour que tous les hommes aient la vie en abondance."}, {"t": "p", "x": "Poussé par l'Esprit Saint, je renouvelle ma consécration"}, {"t": "p", "x": "et me donne à toi, Père, pour que tu me formes"}, {"t": "p", "x": "selon l'image et la ressemblance de ton Fils, Jésus."}, {"t": "p", "x": "Confiant en l'assistance maternelle du Cœur de Marie,"}, {"t": "p", "x": "je promets de vivre chaste, pauvre et obéissant,"}, {"t": "p", "x": "en cette communauté de vie apostolique, en y observant"}, {"t": "p", "x": "les Constitutions de l’Intitut avec tout le soin possible."}, {"t": "p", "x": "Consacre-moi, Père,  par  ton Esprit de sainteté,"}, {"t": "p", "x": "afin que, dans le service de la Parole,"}, {"t": "p", "x": "je sois fidèle au charisme de saint Antoine-Marie Claret"}, {"t": "p", "x": "et que je parvienne à la perfection de la charité."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "51", "num": "9.6", "title": "Configuration au Christ", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Merci, Père, parce que tu nous as consacrés par ton Esprit"}, {"t": "p", "x": "et nous as fait participants de la plénitude du Christ, ton Fils."}, {"t": "p", "x": "Béni soistu, parce que tu nous as appelés à le suivre"}, {"t": "p", "x": "et à collaborer avec lui dans l’œuvre que tu lui as confiée."}, {"t": "p", "x": "Nous te demandons que, pénétrés de son Esprit,"}, {"t": "p", "x": "ce ne soit pas nous qui vivions mais que ce soit le Christ"}, {"t": "p", "x": "qui vive réellement en nous, pour que nous devenions"}, {"t": "p", "x": "des instruments idoines pour annoncer le Royaume des cieux."}, {"t": "p", "x": "Que nous cherchions à atteindre notre configuration avec lui"}, {"t": "p", "x": "en notre communauté missionnaire"}, {"t": "p", "x": "selon notre charisme propre dans l'Église."}, {"t": "p", "x": "Lui qui vit et règne pour les siècles des siècles. Amen."}]}, {"id": "53", "num": "9.7", "title": "Le don de la chasteté", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Nous te bénissons, Seigneur, pour nous avoir accordé"}, {"t": "p", "x": "le don de la chasteté pour le Royaume des cieux."}, {"t": "p", "x": "Par ce don, nous pouvons  nous consacrer de tout cœur"}, {"t": "p", "x": "aux choses du Père à imitation de ton Fils Jésus Christ"}, {"t": "p", "x": "et suivant l'exemple de la Vierge Marie."}, {"t": "p", "x": "Nous te demandons, Seigneur,  de nous accorder"}, {"t": "p", "x": "ton secours pour maîtriser les penchants de notre nature,"}, {"t": "p", "x": "pour vivre avec joie la chasteté et la cultiver avec soin."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "54", "num": "9.8", "title": "La Chasteté", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Béni sois-tu, Seigneur, parce que le don de la chasteté"}, {"t": "p", "x": "manifeste la puissance de ta gloire dans notre fragilité"}, {"t": "p", "x": "et suscite chez les hommes  l'espérance de la vie future."}, {"t": "p", "x": "Fais que notre vœu de chasteté  favorise en nous"}, {"t": "p", "x": "une nouvelle communion fraternelle en JésusChrist"}, {"t": "p", "x": "et construise une communauté qui n'a pas son fondement"}, {"t": "p", "x": "dans la chair ni dans le sang, mais dans ta volonté."}, {"t": "p", "x": "Qu’elle devienne, comme signe d'un amour parfait,"}, {"t": "p", "x": "une source spéciale de fécondité spirituelle pour le monde"}, {"t": "p", "x": "et nous embrase en ton amour et en celui des hommes."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "55", "num": "9.9", "title": "Toi, qui étant riche", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Toi, qui étant riche,"}, {"t": "p", "x": "t'es fait pauvre pour nous pour que nous devenions riches."}, {"t": "p", "x": "Consacré à annoncer la Bonne Nouvelle"}, {"t": "p", "x": "du royaume des cieux, tu n'avais pas où reposer la tête."}, {"t": "p", "x": "Donnenous de partager ta pauvreté,"}, {"t": "p", "x": "pour rappeler aux hommes les biens du monde à venir,"}, {"t": "p", "x": "comme Marie, la première parmi les pauvres du Seigneur,"}, {"t": "p", "x": "et les Apôtres qui, laissant tout, t'ont suivi,"}, {"t": "p", "x": "toi qui vis et règnes pour les siècles des siècles. Amen."}]}, {"id": "56", "num": "9.10", "title": "Chercher d'abord le Règne de Dieu", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Nous te demandons, Seigneur,"}, {"t": "p", "x": "que, mettant toute notre confiance en toi"}, {"t": "p", "x": "et ne cherchant jamais ni le pouvoir ni les richesses,"}, {"t": "p", "x": "nous cherchions toujours et avant tout"}, {"t": "p", "x": "le Règne qui appartient aux pauvres. Amen."}]}, {"id": "57", "num": "9.11", "title": "Communauté des biens", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Accordenous, Seigneur, de bâtir,"}, {"t": "p", "x": "avec notre pauvreté volontaire,"}, {"t": "p", "x": "la communauté fraternelle dans l'unité de cœur et d'esprit"}, {"t": "p", "x": "et de l'exprimer par la communication des biens,"}, {"t": "p", "x": "en nous mettant au service des pauvres. Amen."}]}, {"id": "58", "num": "9.12", "title": "Pauvreté", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Nous te rendons grâce, Père saint, parce que tu as voulu"}, {"t": "p", "x": "nous montrer la valeur de la pauvreté et le bonheur de ceux"}, {"t": "p", "x": "qui ne mettent pas leur coeur dans les richesses."}, {"t": "p", "x": "Accordenous de laisser toute notre vie et notre activité"}, {"t": "p", "x": "s’empreigner de l'esprit de pauvreté."}, {"t": "p", "x": "Que nous soyons pauvres en esprit et en actes"}, {"t": "p", "x": "et que nous nous acceptions la loi commune du travail,"}, {"t": "p", "x": "partageant ainsi la condition des pauvres."}, {"t": "p", "x": "Que nous mettions nos biens à disposition des autres"}, {"t": "p", "x": "et que nous nous réjouissions quand nous épprouverons"}, {"t": "p", "x": "les effets de la pauvreté, ne doutant jamais de ta providence."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "59", "num": "9.13", "title": "Pour faire ta volonté", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Pour faire ta volonté, Père, tu nous as envoyé ton Fils, Jésus."}, {"t": "p", "x": "À l'exemple de la très sainte Vierge Marie,"}, {"t": "p", "x": "qui s'est donnée tout entière, comme servante du Seigneur,"}, {"t": "p", "x": "à l’œuvre du Fils, nous t'offrons la faculté de régler notre vie"}, {"t": "p", "x": "de sorte que nous nous configurions au Christ,"}, {"t": "p", "x": "qui s'est fait obéissant jusqu'à la mort sur la croix,"}, {"t": "p", "x": "et de nous unir en tout à ta sainte volonté."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "60", "num": "9.14", "title": "Obéissants dans la mission", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Partageant la même vocation, nous voulons, Seigneur,"}, {"t": "p", "x": "chercher ensemble ta volonté"}, {"t": "p", "x": "pour mener à bien notre mission."}, {"t": "p", "x": "Nous voulons que notre vie  manifeste aux hommes"}, {"t": "p", "x": "l'unité dans l'amour et la mission."}, {"t": "p", "x": "Aide-nous à promouvoir la coopération de tous"}, {"t": "p", "x": "pour le bien de l'Église et de la Congrégation."}, {"t": "p", "x": "Fais que nous tous, poussés par l'amour fraternel,"}, {"t": "p", "x": "sachions obéir avec promptitude et perfection."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "61", "num": "9.15", "title": "Obéissance", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Nous te rendons grâce, Père, parce que tu nous a donné"}, {"t": "p", "x": "la faculté de disposer librement de notre vie."}, {"t": "p", "x": "et nous invites, par l’action de ton Esprit,  à te l'offrir."}, {"t": "p", "x": "Merci de nous avoir appelés"}, {"t": "p", "x": "à nous configurer à ton Fils Jésus Christ,"}, {"t": "p", "x": "qui a été obéissant jusqu'à la mort sur la croix."}, {"t": "p", "x": "Béni soistu parce que tu as voulu qu'en lui"}, {"t": "p", "x": "nous participions à ta volonté rédemptrice."}, {"t": "p", "x": "Par Jésus le Christ, notre Seigneur. Amen."}]}, {"id": "62", "num": "9.16", "title": "Obéissance en communion", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Accordenous, Seigneur, de chercher, de connaître"}, {"t": "p", "x": "et d'accomplir ta volonté, afin de pouvoir réaliser"}, {"t": "p", "x": "la mission commune qui nous a été confiée dans l'Église."}, {"t": "p", "x": "Accordenous qu’en cherchant et accomplissant ta volonté,"}, {"t": "p", "x": "nous nous obligions à offrir notre aide à nos frères"}, {"t": "p", "x": "par la prière, le conseil et le dialogue fraternel."}, {"t": "p", "x": "Par Jésus le Christ, notre Seigneur. Amen."}]}, {"id": "63", "num": "9.17", "title": "Pour les supérieurs", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Rends forts, Seigneur, nos supérieurs,"}, {"t": "p", "x": "afin qu'ils cherchent avant tout ta volonté,"}, {"t": "p", "x": "en exerçant l'autorité avec un esprit de service"}, {"t": "p", "x": "et en donnant leur vie pour leurs frères."}, {"t": "p", "x": "Et accorde à nous tous de t'obéir par l'amour,"}, {"t": "p", "x": "avec promptitude et perfection,"}, {"t": "p", "x": "en nous soumettant aux hommes à cause de toi."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "64", "num": "9.18", "title": "Disponibilité", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Accordenous, Seigneur, l’esprit de disponibilité"}, {"t": "p", "x": "pour être envoyés n'importe où dans le monde"}, {"t": "p", "x": "et pour mettre toutes nos forces au service du ministère"}, {"t": "p", "x": "qui nous est confié par la Congrégation."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "65", "num": "9.19", "title": "Imitons la prière de Jésus", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Dieu toutpuissant et éternel, qui as  voulu nous associer"}, {"t": "p", "x": "à l’œuvre missionnaire du Christ : ouvre notre cœur"}, {"t": "p", "x": "pour nous convertir à l'Évangile, et donnenous la grâce"}, {"t": "p", "x": "de l'imiter dans sa prière assidue."}, {"t": "p", "x": "Par le même Jésus Christ, notre Seigneur. Amen."}]}, {"id": "66", "num": "9.20", "title": "Progrès dans la charité", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Père miséricordieux, fais que  la charité du Christ"}, {"t": "p", "x": "nous presse à aimer notre prochain comme tu nous aimes"}, {"t": "p", "x": "et que, soutenus par ta force divine, nous soyons prêts"}, {"t": "p", "x": "à mourir chaque jour pour nos frères."}, {"t": "p", "x": "Fais que, comme des étrangers et des pèlerins,"}, {"t": "p", "x": "nous nous abstenions des désirs de la chair,"}, {"t": "p", "x": "que nous gardions avec un soin diligent nos sens"}, {"t": "p", "x": "et  nous réjouissions dans l'adversité."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "67", "num": "9.21", "title": "La charité du Christ nous presse", "theme": "consagracion", "sub": "de la Congrégation", "tags": [], "lines": [{"t": "p", "x": "Père saint, Jésus Christ, pressé par un amour ardent"}, {"t": "p", "x": "envers toi et envers les hommes, s'est livré aux travaux,"}, {"t": "p", "x": "à la passion et même à la mort. Accordenous la charité,"}, {"t": "p", "x": "pour travailler à ce que tous les hommes te connaissent,"}, {"t": "p", "x": "t'aiment et te servent, et qu'ils obtiennent"}, {"t": "p", "x": "la béatitude de ton Royaume."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "113", "num": "9.22", "title": "Illumine, Seigneur, avec la lumière de la foi,", "theme": "consagracion", "sub": "Eucharistie", "tags": [], "lines": [{"t": "p", "x": "nos cœurs et embraseles du feu de la charité"}, {"t": "p", "x": "afin que nous adorions, en esprit et en vérité,"}, {"t": "p", "x": "celui que nous reconnaissons en ce Sacrement"}, {"t": "p", "x": "comme notre Seigneur et notre Dieu."}, {"t": "p", "x": "Lui qui vit et règne pour les siècles. Amen."}]}, {"id": "114", "num": "9.23", "title": "Dieu, qui as racheté tous les hommes", "theme": "consagracion", "sub": "Eucharistie", "tags": [], "lines": [{"t": "p", "x": "par le mystère pascal du Christ, qui s'offre luimême"}, {"t": "p", "x": "en ce Sacrement pour ses frères;"}, {"t": "p", "x": "accordenous que, vénérant constamment"}, {"t": "p", "x": "le mystère de notre rédemption, nous méritions"}, {"t": "p", "x": "recueillir ses fruits et susciter en tous les hommes"}, {"t": "p", "x": "le souvenir de la présence du Seigneur."}, {"t": "p", "x": "Par le même Jésus Christ, notre Seigneur. Amen."}]}, {"id": "115", "num": "9.24", "title": "Que le sacrement de l'Eucharistie, Seigneur,", "theme": "consagracion", "sub": "Eucharistie", "tags": [], "lines": [{"t": "p", "x": "remplisse nos cœurs de ton amour et du zèle apostolique,"}, {"t": "p", "x": "afin que nous y trouvions la force qui nous pousse"}, {"t": "p", "x": "à désirer que tous les hommes te connaissent,"}, {"t": "p", "x": "t'aiment et te servent, et à leur procurer ainsi"}, {"t": "p", "x": "la béatitude de ce Royaume initié déjà sur la terre."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "116", "num": "9.25", "title": "Seigneur, toi qui nous fais participants", "theme": "consagracion", "sub": "Eucharistie", "tags": [], "lines": [{"t": "p", "x": "d'un même pain et d'un même Esprit, accordenous"}, {"t": "p", "x": "que, comme les sarments sont unis à la vigne,"}, {"t": "p", "x": "nous  soyons unis avec toi,"}, {"t": "p", "x": "pour édifier notre communion"}, {"t": "p", "x": "et  que le monde croie."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "117", "num": "9.26", "title": "Seigneur Jésus, toi qui t'identifies pleinement", "theme": "consagracion", "sub": "Eucharistie", "tags": [], "lines": [{"t": "p", "x": "avec ceux qui souffrent et qui nous as dit :"}, {"t": "p", "x": "«Venez à moi, vous tous qui peinez"}, {"t": "p", "x": "sous le poids du fardeau,"}, {"t": "p", "x": "et moi, je vous donnerai le repos»."}, {"t": "p", "x": "Solidaires des hommes qui souffrent la maladie,"}, {"t": "p", "x": "l'injustice et l'oppression, nous venons en ta présence,"}, {"t": "p", "x": "afin que tu nous embrases dans ta charité,"}, {"t": "p", "x": "jusqu'à ce que nous nous réjouissions dans les tourments"}, {"t": "p", "x": "et que nous nous glorifions dans ta croix."}, {"t": "p", "x": "Toi qui vis et règnes pour les siècles des siècles. Amen."}]}, {"id": "118", "num": "9.27", "title": "Seigneur, qui, par le mystère pascal,", "theme": "consagracion", "sub": "Eucharistie", "tags": [], "lines": [{"t": "p", "x": "as réalisé le salut des hommes, accordenous la grâce"}, {"t": "p", "x": "de savoir t'adorer présent en ce Sacrement"}, {"t": "p", "x": "et de proclamer avec foi"}, {"t": "p", "x": "ce que nous vénérons maintenant."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "119", "num": "9.28", "title": "Seigneur Jésus, daigne nous enflammer dans la foi", "theme": "consagracion", "sub": "Eucharistie", "tags": [], "lines": [{"t": "p", "x": "qui poussa tant de prédicateurs de la Parole divine"}, {"t": "p", "x": "à embrasser la pauvreté, l'abnégation et le sacrifice,"}, {"t": "p", "x": "pour étendre le Règne du Christ."}, {"t": "p", "x": "Nous te le demandons, unis à toi de tout notre cœur,"}, {"t": "p", "x": "toi qui es présent dans le mystère eucharistique,"}, {"t": "p", "x": "que nous vénérons maintenant,"}, {"t": "p", "x": "et dont nous partageons la vie et le ministère."}, {"t": "p", "x": "Toi qui vis et règnes dans l'unité"}, {"t": "p", "x": "du Père et de l'Esprit Saint,"}, {"t": "p", "x": "pour les siècles des siècles. Amen."}]}, {"id": "144", "num": "9.29", "title": "Prière du P. Fondateur au commencement des exercices", "theme": "consagracion", "sub": "Exercices spirituels", "tags": [], "lines": [{"t": "p", "x": "Vierge Marie, ma Mère, toi qui as eu le bonheur"}, {"t": "p", "x": "de voir réunis les Apôtres et les disciples au Cénacle"}, {"t": "p", "x": "et de les voir tous remplis de l'Esprit Saint,"}, {"t": "p", "x": "je te demande, plein de confiance, de me donner"}, {"t": "p", "x": "toutes les grâces dont j’ai besoin"}, {"t": "p", "x": "pour bien  faire ces exercices sous ta direction."}, {"t": "p", "x": "Affermismoi dans ma résolution de faire"}, {"t": "p", "x": "ce qui est le plus conforme à la volonté de Dieu"}, {"t": "p", "x": "et ce qui contribue le plus  à sa plus grande gloire"}, {"t": "p", "x": "et au bien de mon âme."}, {"t": "p", "x": "O ma Mère, viens à mon secours"}, {"t": "p", "x": "et gardemoi maintenant et à jamais. Amen."}, {"t": "p", "x": "VIII.  LES FÊTES DE LA CONGRÉGATION,"}, {"t": "p", "x": "LES BÉATIFICATIONS ET CANONISATIONS"}, {"t": "p", "x": "4) Prières à Saint Joseph"}]}, {"id": "84", "num": "10.1", "title": "Pour les vocations", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur Jésus, qui as dit: «Priez le Maître de la moisson"}, {"t": "p", "x": "d'envoyer des ouvriers à sa moisson»:"}, {"t": "p", "x": "Nous te demandons humblement de daigner en envoyer"}, {"t": "p", "x": "à notre Congrégation. Répands ton Esprit sur ceux"}, {"t": "p", "x": "que tu as déjà choisis et confirmeles dans la vocation,"}, {"t": "p", "x": "afin que, en  annonçant avec dignité et fruit ton  Évangile,"}, {"t": "p", "x": "nous nous appelions et soyons vraiment"}, {"t": "p", "x": "des Fils du Cœur Immaculé de Marie,"}, {"t": "p", "x": "que nous t'aimions de tout notre cœur,"}, {"t": "p", "x": "et que nous ne cessions jamais de te louer. Amen."}]}, {"id": "85", "num": "10.2", "title": "La Vocation", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, toi qui as appelé les Apôtres"}, {"t": "p", "x": "à devenir des pêcheurs d'hommes,"}, {"t": "p", "x": "appelle de nouveaux membres à la Famille Clarétaine,"}, {"t": "p", "x": "qui soient le sel de la terre et la lumière du monde"}, {"t": "p", "x": "et qui répandent partout la charité qui animait"}, {"t": "p", "x": "ton serviteur Antoine-Marie Claret."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "86", "num": "10.3", "title": "Par l'intercession du Cœur Immaculé de Marie", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, qui par l'intercession du Cœur de Marie"}, {"t": "p", "x": "as daigné donner à saint Antoine-Marie Claret"}, {"t": "p", "x": "un grand amour à ton Fils et lui as  inspiré la fondation"}, {"t": "p", "x": "de notre  Congrégation des Missionnaires"}, {"t": "p", "x": "pour le salut des hommes du monde entier."}, {"t": "p", "x": "Bénis notre Congrégation avec de nouvelles vocations,"}, {"t": "p", "x": "et accordenous de persévérer jusqu'à la fin"}, {"t": "p", "x": "dans l'annonce de l'Évangile. Amen."}]}, {"id": "87", "num": "10.4", "title": "Prière pour demander au Seigneur des vocations", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, pour continuer dans tout le monde"}, {"t": "p", "x": "la grande œuvre de saint Antoine-Marie Claret,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Seigneur, pour sanctifier les peuples"}, {"t": "p", "x": "par la prédication et autres travaux apostoliques,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Seigneur, pour porter la lumière de l'Évangile"}, {"t": "p", "x": "à tous ceux qui ne te connaissent pas,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Seigneur, pour répandre le Règne du Cœur de Marie,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Seigneur, afin que, par l'intercession du Cœur de Marie,"}, {"t": "p", "x": "s'accomplisse toujours ta volonté,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Seigneur, afin que tous les croyants reçoivent"}, {"t": "p", "x": "une formation profondement chrétienne"}, {"t": "p", "x": "et que notre société soit plus juste et plus humaine,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Jésus, le premier Fils du Cœur Immaculé de Marie,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Cœur Immaculé de Marie, Mère de tous les hommes,"}, {"t": "p", "x": "Envoie-nous de nombreux et saints Missionnaires."}, {"t": "p", "x": "Prions. Notre Père, toi qui veux que tous les hommes"}, {"t": "p", "x": "soient sauvés et parviennent à la connaissance de la vérité,"}, {"t": "p", "x": "nous te prions d'envoyer des ouvriers à ta moisson"}, {"t": "p", "x": "et de leur accorder de prêcher avec confiance ta Parole,"}, {"t": "p", "x": "afin que la vérité resplendisse et se propage"}, {"t": "p", "x": "et que tous te connaissent, toi, le Dieu unique et vrai."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "88", "num": "10.5", "title": "Pour les vocations missionnaires", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "O Dieu, toi qui veux que tous les hommes soient sauvés,"}, {"t": "p", "x": "et parviennent à la connaissance de la vérité,"}, {"t": "p", "x": "attire à toi encore des hommes qui suivent ton Fils"}, {"t": "p", "x": "à la manière de saint Antoine-Marie Claret,"}, {"t": "p", "x": "et envoie-les sur le champ du monde,"}, {"t": "p", "x": "afin qu'ils prêchent l'Évangile à toute créature,"}, {"t": "p", "x": "et que ton peuple, réuni par la Parole de vie"}, {"t": "p", "x": "et soutenu par la force des sacrements,"}, {"t": "p", "x": "chemine par les sentiers du salut et de l'amour."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur, Amen."}]}, {"id": "89", "num": "10.6", "title": "Prière pour les vocations et la persévérance", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, tu as dit que la moisson est abondante"}, {"t": "p", "x": "et les ouvriers, peu nombreux, et qui veux que se multiplie"}, {"t": "p", "x": "le nombre d’apôtres et d’évangélisateurs,"}, {"t": "p", "x": "afin qu'ils étendent ton Règne et transforment  la terre."}, {"t": "p", "x": "Nous te prions d'augmenter le nombre"}, {"t": "p", "x": "et la qualité évangélique"}, {"t": "p", "x": "de ceux qui travaillent pour le bien des hommes."}, {"t": "p", "x": "Nous te rendons grâce pour les vocations"}, {"t": "p", "x": "que tu nous as envoyées par le Cœur de Marie, notre Mère."}, {"t": "p", "x": "Accordenous ta présence et ton secours,"}, {"t": "p", "x": "afin que de nombreuses vocations viennent à notre Institut;"}, {"t": "p", "x": "et aidenous tous à persévérer dans notre vocation."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "90", "num": "10.7", "title": "Pour les vocations à tous les états de vie chrétienne", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Éclairés et animés par ta Parole, nous te prions, Seigneur,"}, {"t": "p", "x": "pour tous ceux qui ont déjà entendu ton appel et l'ont suivi."}, {"t": "p", "x": "Nous te prions, écoutenous."}, {"t": "p", "x": "Pour le Pape, les évêques, les prêtres, les diacres,"}, {"t": "p", "x": "les missionnaires et pour tous les consacrés,"}, {"t": "p", "x": "afin que nous vivions tous notre vocation avec joie"}, {"t": "p", "x": "et que, avec notre vie et notre parole,"}, {"t": "p", "x": "nous te rendions présent au milieu des hommes."}, {"t": "p", "x": "Nous te prions, écoutenous."}, {"t": "p", "x": "Pour les laïcs qui travaillent généreusement"}, {"t": "p", "x": "dans les ministères institués par l'Église"}, {"t": "p", "x": "et dans les services nécessaires à la communauté."}, {"t": "p", "x": "Nous te prions, écoutenous."}, {"t": "p", "x": "Soutiensles dans les difficultés,"}, {"t": "p", "x": "réconforteles dans leurs souffrances,"}, {"t": "p", "x": "soutiensles dans la solitude,"}, {"t": "p", "x": "protégeles dans la persécution et augmente leur fidélité."}, {"t": "p", "x": "Nous te prions, écoutenous."}, {"t": "p", "x": "Nous te prions, Seigneur, pour tous ceux"}, {"t": "p", "x": "qui ouvrent leur cœur à ton appel et se préparent à le suivre."}, {"t": "p", "x": "Nous te prions, écoutenous."}, {"t": "p", "x": "Que ta Parole les éclaire, ta présence les captive"}, {"t": "p", "x": "et ton Esprit les guide jusqu'au bout"}, {"t": "p", "x": "de la profession religieuse ou des ordres sacrés."}, {"t": "p", "x": "Nous te prions, écoutenous."}, {"t": "p", "x": "Sois pour eux, Seigneur, un appui solide,"}, {"t": "p", "x": "fais qu'ils rencontrent quelqu’un pour les conseiller,"}, {"t": "p", "x": "les accompagner et les soutenir avec la force de conviction"}, {"t": "p", "x": "et avec l'amour que Toi seul peux communiquer."}, {"t": "p", "x": "Nous te prions, écoutenous."}]}, {"id": "183", "num": "11.1", "title": "Prière pour le Chapitre (ou pendant sa célébration)", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Viens, Esprit Saint, remplis le cœur de tes fidèles et allume en eux le feu de ton amour."}, {"t": "v", "x": ". : Envoie ton Esprit et tout sera créé"}, {"t": "r", "x": ". : Et tu renouvelleras la face de la terre."}, {"t": "rub", "x": "Prions"}, {"t": "p", "x": "O Dieu, qui as illuminé le cœur de tes fidèles"}, {"t": "p", "x": "de la lumière de l'Esprit Saint,"}, {"t": "p", "x": "accorde-nous de jouir toujours de la lumière de sa vérité"}, {"t": "p", "x": "et d'être consolés avec les fruits de sa présence."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen"}]}, {"id": "186", "num": "11.2", "title": "Prière pour le Chapitre", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Esprit Divin,"}, {"t": "p", "x": "qui, envoyé par le Père au nom de Jésus,"}, {"t": "p", "x": "assistes et guides infailliblement l'Église,"}, {"t": "p", "x": "repands sur le Chapitre la plénitude de tes dons."}, {"t": "p", "x": "Doux Maître et Consolateur,"}, {"t": "p", "x": "illumine les intelligences des membres du Chapitre."}, {"t": "p", "x": "Fais que le Chapitre produise des fruits abondants"}, {"t": "p", "x": "et une nouvelle vigueur"}, {"t": "p", "x": "pour notre vie spirituelle et  apostolique,"}, {"t": "p", "x": "afin de mieux diffuser parmi les hommes"}, {"t": "p", "x": "la lumière et la force de l’Évangile."}, {"t": "p", "x": "Hôte très doux de nos âmes,"}, {"t": "p", "x": "confirme nos intelligences dans la vérité,"}, {"t": "p", "x": "incline nos coeurs à l'obéissance,"}, {"t": "p", "x": "afin que les conclusions du Chapitre trouvent"}, {"t": "p", "x": "un accueil généreux"}, {"t": "p", "x": "et un plein accomplissement."}, {"t": "p", "x": "Renouvelle, dans notre Congrégation"}, {"t": "p", "x": "et en chacun de nous, l'esprit qui anima"}, {"t": "p", "x": "saint Antoine-Marie Claret, notre Père."}, {"t": "p", "x": "Esprit Saint, transforme nos cœurs,"}, {"t": "p", "x": "afin que, rassemblés dans une prière unanime,"}, {"t": "p", "x": "autour du Cœur de Marie, notre Mère,"}, {"t": "p", "x": "nous cherchions toujours et uniquement"}, {"t": "p", "x": "la plus grande gloire de Dieu et le salut des âmes."}, {"t": "p", "x": "Amen."}]}, {"id": "187", "num": "11.3", "title": "Prières pour le Chapitre", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Glorifions le Père qui nous a appelés en son Fils Jésus"}, {"t": "p", "x": "à partager la vie missionnaire et disons-lui:"}, {"t": "r", "x": ". Accorde-nous l'onction de ton Esprit."}, {"t": "p", "x": "Nous te remercions, Seigneur, de nous avoir appelés"}, {"t": "p", "x": "à une Congrégation missionnaire, et nous te demandons :"}, {"t": "v", "x": "que les membres du Chapitre, guidés par lEsprit,"}, {"t": "p", "x": "cherchent à promouvoir la fidélité de la Congrégation"}, {"t": "p", "x": "à sa mission d’annoncer le Règne de Dieu."}, {"t": "r", "x": ". Accorde-nous l’onctionde ton Esprit."}, {"t": "p", "x": "Appelés à suivre Jésus, l'envoyé du Père,"}, {"t": "v", "x": "nous te demandons de nous consacrer par ton Esprit,"}, {"t": "p", "x": "afin que nous soyons des témoins courageux"}, {"t": "p", "x": "de la Résurrection."}, {"t": "r", "x": ". Acorde-nous l’onction de ton Esprit."}, {"t": "p", "x": "Fortifiés par la mémoire vivante de notre Père Fondateur,"}, {"t": "p", "x": "saint Antoine-Marie Claret,"}, {"t": "v", "x": "nous te demandons d'accorder à ce Chapitre"}, {"t": "p", "x": "la grâce de chercher la gloire de Dieu,"}, {"t": "p", "x": "la sanctification des missionnaires"}, {"t": "p", "x": "et le salut des hommes du monde entier."}, {"t": "r", "x": ". Accorde-nous l’onction de ton Esprit."}, {"t": "p", "x": "Poussés par l'amour à Dieu et aux frères, répandu dans nos cœurs,"}, {"t": "v", "x": "nous te demandons"}, {"t": "p", "x": "de pouvoir construire nos communnautés"}, {"t": "p", "x": "sur un projet commun de mission,"}, {"t": "p", "x": "pour annoncer et vivre 1’Évangile."}, {"t": "r", "x": ". Accorde-nous l’oooonction de ton Esprit."}, {"t": "p", "x": "Pressés par ce qui est le plus urgent, opportun et efficace"}, {"t": "p", "x": "dans la réalisation de notre mission,"}, {"t": "p", "x": "compte tenu des circonstances"}, {"t": "p", "x": "de temps, de lieu et de personnes, nous te demandons"}, {"t": "v", "x": "de venir à notre aide, Seigneur,"}, {"t": "p", "x": "afin que nous traciona un bon programme d'action"}, {"t": "p", "x": "dans notre vie missionnaire,"}, {"t": "p", "x": "en communion avec toute la Congrégation."}, {"t": "r", "x": ". Accorde-nous l’onction de ton Esprit."}, {"t": "p", "x": "Notre Seigneur et notre Père,"}, {"t": "p", "x": "par l'intercession de Marie, notre Mère et  Fondatrice,"}, {"t": "p", "x": "envoie sur nous ton Esprit,"}, {"t": "p", "x": "afin que, pressés par la charité de ton Fils Jésus,"}, {"t": "p", "x": "nos yeux sachent voir et nos oreilles entendre"}, {"t": "p", "x": "les urgences du monde. Aide-nous à garder l'unité,"}, {"t": "p", "x": "rassemblés dans la même communauté"}, {"t": "p", "x": "au-delà de toutes les différences,"}, {"t": "p", "x": "pour accomplir la mission que nous avons reçue"}, {"t": "p", "x": "à travers saint-Antoine Marie Claret, notre Père."}, {"t": "p", "x": "Toi qui vis et règnes pour les siècles des siècles. Amen."}]}, {"id": "xxvii", "num": "11.4", "title": "Prière pour le XXVII Chapitre Général", "theme": "capitulos", "sub": null, "tags": ["chapitre"], "lines": [{"t": "p", "x": "Viens, Esprit Saint,"}, {"t": "p", "x": "souffle du Père et feu vif du Fils ressuscité :"}, {"t": "p", "x": "renouvelle notre Congrégation."}, {"t": "p", "x": "Fais que la préparation au Chapitre Général"}, {"t": "p", "x": "soit un temps de grâce, d'écoute et de discernement."}, {"t": "p", "x": "Répands sur nous une nouvelle Pentecôte,"}, {"t": "p", "x": "pour que nous marchions ensemble dans la communion,"}, {"t": "p", "x": "comme missionnaires mystiques et prophétiques"}, {"t": "p", "x": "au service de l'unique mission du Christ."}, {"t": "p", "x": "Unis à Marie, notre Mère,"}, {"t": "p", "x": "à saint Antoine-Marie Claret"}, {"t": "p", "x": "et au témoignage fidèle de nos martyrs,"}, {"t": "p", "x": "apprends-nous à écouter ta voix"}, {"t": "p", "x": "dans le cri des pauvres,"}, {"t": "p", "x": "dans les blessures du monde"}, {"t": "p", "x": "et dans la vie de nos communautés."}, {"t": "p", "x": "Façonne-nous dans la fournaise du Cœur Immaculé de Marie,"}, {"t": "p", "x": "pour que, guidés par ton Esprit,"}, {"t": "p", "x": "nous devenions signes de fraternité, d'espérance"}, {"t": "p", "x": "et d'ardeur missionnaire pour l'Église et pour le monde."}, {"t": "p", "x": "Amen."}]}, {"id": "131", "num": "12.1", "title": "Viens, Esprit Saint", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Viens, Esprit Saint, remplis le cœur de tes fidèles et allume en eux le feu de ton amour."}, {"t": "v", "x": "/ Envoie ton Esprit et tout sera créé"}, {"t": "r", "x": "/ Et tu renouvelleras la face de la terre."}, {"t": "p", "x": "Prions. O Dieu qui as illuminé le cœur de tes fidèles de la lumière de l'Esprit Saint, rend-nous dociles à ce même Esprit pour que nous puissions  faire toujours  le bien, et jouir de la lumière de sa vérité et de la joie de sa présence. Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "132", "num": "12.2", "title": "Réunis en ton nom", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, réunis en ton nom, nous voulons vivre en ta présence. Accordenous un esprit de dialogue, illumine nos esprits par la lumière de ta vérité et renforce notre esprit fraternel, afin que nous cherchions toujours ensemble à connaître et à faire ta volonté. Par Jésus le Christ, notre Seigneur. Amen."}]}, {"id": "133", "num": "12.3", "title": "Dans la sagesse (Sg 9, 16. 911)", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Dieu de nos pères et Seigneur de miséricorde,"}, {"t": "p", "x": "qui, par ta parole, as fait toutes les choses."}, {"t": "p", "x": "Tu as formé l'homme dans ta sagesse,"}, {"t": "p", "x": "pour qu'il devienne le maître de toutes les créatures,"}, {"t": "p", "x": "en régissant le monde avec sainteté et justice"}, {"t": "p", "x": "et en pratiquant la justice avec un cœur droit."}, {"t": "p", "x": "Donnemoi la sagesse assise près de toi"}, {"t": "p", "x": "et ne m'exclue pas du nombre de tes serviteurs,"}, {"t": "p", "x": "parce que je suis ton serviteur, le fils de ta servante,"}, {"t": "p", "x": "un homme faible, qui ne compte pas beaucoup d'années,"}, {"t": "p", "x": "trop petit pour connaître le jugement et les lois."}, {"t": "p", "x": "Car, même si quelqu’un est parfait"}, {"t": "p", "x": "parmi les enfants des hommes,"}, {"t": "p", "x": "sans la sagesse qui vient de toi,"}, {"t": "p", "x": "il sera compté pour rien ."}, {"t": "p", "x": "La sagesse est avec toi, qui connaît tes oeuvres,"}, {"t": "p", "x": "qui était avec toi quand tu créas le monde,"}, {"t": "p", "x": "et qui connaît tout ce qui plaît à tes yeux"}, {"t": "p", "x": "et tout ce qui est droit selon tes préceptes."}, {"t": "p", "x": "Envoiela de tes cieux saints,"}, {"t": "p", "x": "et, de ton trône de gloire, daigne l'envoyer"}, {"t": "p", "x": "afin qu'elle soit avec moi dans mon travail"}, {"t": "p", "x": "et que je sache ce qui est agréable à tes yeux."}, {"t": "p", "x": "Parce qu’elle connaît et comprend toutes les choses,"}, {"t": "p", "x": "me guidera prudemment dans toutes mes œuvres"}, {"t": "p", "x": "et me gardera dans sa splendeur."}, {"t": "p", "x": "Amen;"}]}, {"id": "134", "num": "12.4", "title": "Chercher et accomplir ensemble la volonté de Dieu", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Antienne : Le Seigneur a dit: « là ou deux ou trois"}, {"t": "p", "x": "sont réunis en mon nom, j'y suis au milieu d'eux »."}, {"t": "p", "x": "Prions. Dieu, notre Père, ton Fils a promis"}, {"t": "p", "x": "d'être présent au milieu de tous ceux"}, {"t": "p", "x": "qui se rassemblent en son nom."}, {"t": "p", "x": "Faisnous sentir maintenant sa présence parmi nous,"}, {"t": "p", "x": "afin que nous manifestions au monde"}, {"t": "p", "x": "la communion de vie et de mission de tout l'Institut."}, {"t": "p", "x": "Accorde-nous de cheminer dans une vie nouvelle"}, {"t": "p", "x": "en obéissant à l'Esprit  et en exerçant fidèlement"}, {"t": "p", "x": "notre charisme missionnaire."}, {"t": "p", "x": "Accorde-nous la grâce de connaître ta volonté"}, {"t": "p", "x": "et de l'accomplir fidèlement."}, {"t": "p", "x": "Fais que, animés d’un même idéal et  d’un amour fraternel,"}, {"t": "p", "x": "nous accomplissions notre commune mission dans l'Église."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "135", "num": "12.5", "title": "La grâce et les dispositions au dialogue", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Nous voici, Seigneur, réunis en ton nom"}, {"t": "p", "x": "avec le désir d’étendre ton Royaume."}, {"t": "p", "x": "Que le Saint-Esprit, que tu as envoyé dans nos cœurs"}, {"t": "p", "x": "et qui maintient vivante ta présence en nous,"}, {"t": "p", "x": "nous enseigne ce que nous avons à traiter"}, {"t": "p", "x": "et le but vers lequel nous devons cheminer, afin que,"}, {"t": "p", "x": "fortifiés par ta grâce, nous puissions réaliser tes  desseins."}, {"t": "p", "x": "Esprit Saint, inspire et guide notre discernement."}, {"t": "p", "x": "Enseignenous à écouter les autres"}, {"t": "p", "x": "et à nous laisser éclairer par leurs lumières."}, {"t": "p", "x": "Apprendsnous à proposer sans imposer."}, {"t": "p", "x": "Délivrenous de l'aveuglement"}, {"t": "p", "x": "du désir de vouloir toujours avoir raison,"}, {"t": "p", "x": "de tout favoritisme et de l'acception des personnes."}, {"t": "p", "x": "Fais que nous restions fermement unis à toi,"}, {"t": "p", "x": "afin que nous nous laisions toujours guider par la vérité. Amen."}]}, {"id": "136", "num": "12.6", "title": "Lumière pour découvrir les exigences de l'Évangile", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Regarde, Père de bonté, cette communauté"}, {"t": "p", "x": "réunie en ton nom pour partager la fraternité"}, {"t": "p", "x": "et pour dialoguer dans la vérité;"}, {"t": "p", "x": "accordelui de découvrir avec grande clarté"}, {"t": "p", "x": "les exigences de l'Évangile pour devenir"}, {"t": "p", "x": "lumière du monde et sel de la terre."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "137", "num": "12.7", "title": "Prière pour commencer une réunion", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, que ta grâce nous inspire toujours,"}, {"t": "p", "x": "qu'elle soutienne et accompagne nos œuvres,"}, {"t": "p", "x": "pour qu’elles commencent en toi, comme en leur source,"}, {"t": "p", "x": "et tendent toujours vers toi, comme à leur  fin."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "138", "num": "12.8", "title": "Action de grâce pour cette rencontre", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Père de bonté, nous te rendons grâce pour cette rencontre"}, {"t": "p", "x": "où nous avons partagé nos rêves et nos déceptions,"}, {"t": "p", "x": "nos projets et nos difficultés."}, {"t": "p", "x": "Aidenous à répondre toujours efficacement"}, {"t": "p", "x": "à notre vocation et à notre mission dans l'Église,"}, {"t": "p", "x": "suivant les traces de Claret, notre Père."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "139", "num": "12.9", "title": "Un seul cœur et une seule âme", "theme": "reuniones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Seigneur, nous te rendons grâce pour cette rencontre,"}, {"t": "p", "x": "pour ta bonté et ta présence parmi nous ;"}, {"t": "p", "x": "fais que, unis par l’esprit communautaire,"}, {"t": "p", "x": "nous n'ayons qu'un seul cœur et une seule âme,"}, {"t": "p", "x": "pour former une communauté évangélisée et évangélisatrice."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "VII. RÉCOLLECTIONS  ET  RETRAITES"}, {"t": "p", "x": "SPIRITUELLES"}]}, {"id": "92", "num": "13.1", "title": "Pour nos frères malades", "theme": "enfermos-difuntos", "sub": null, "tags": [], "lines": [{"t": "v", "x": ": Sauve, Seigneur, tes serviteurs,"}, {"t": "r", "x": ": car ils espèrent en toi."}, {"t": "v", "x": ": De ton Sanctuaire, envoie sur eux ton secours;"}, {"t": "r", "x": ": et de Sion, protègeles."}, {"t": "v", "x": ": Sois leur rempart, Seigneur,"}, {"t": "r", "x": ": face à l'ennemi."}, {"t": "v", "x": ": Accordeleur ta force"}, {"t": "r", "x": ": au lit de la douleur."}, {"t": "v", "x": ": Seigneur, entends notre prière,"}, {"t": "r", "x": ": et que notre clameur parvienne jusqu'à Toi."}, {"t": "v", "x": ": Le Seigneur soit avec vous."}, {"t": "r", "x": ": Et avec votre esprit."}, {"t": "p", "x": "Prions. O Dieu, toi qui compatis toujours et qui pardonnes,"}, {"t": "p", "x": "accueille notre prière. Dans ton infinie bonté,"}, {"t": "p", "x": "prends pitié de nous et de tes serviteurs malades."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}, {"t": "rub", "x": "Ou bien:"}, {"t": "p", "x": "O Dieu, seul  rempart pour la faiblesse humaine,"}, {"t": "p", "x": "montre la force de ton secours sur tes serviteurs malades,"}, {"t": "p", "x": "afin que, aidés par ta miséricorde, ils méritent à nouveau"}, {"t": "p", "x": "de se présenter sains devant ton Église."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}, {"t": "rub", "x": "Ou bien:"}, {"t": "p", "x": "Nous te demandons, Seigneur, que tes serviteurs"}, {"t": "p", "x": "jouissent toujours de la santé de l'âme et du corps."}, {"t": "p", "x": "Par l'intercession de sainte Marie, Vierge, délivrenous"}, {"t": "p", "x": "des tristesses de ce monde et accordenous les joies du ciel."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "95", "num": "13.2", "title": "Prière pour les parents  défunts", "theme": "enfermos-difuntos", "sub": "Défunts", "tags": [], "lines": [{"t": "p", "x": "O Dieu, qui nous as commandé d'honorer nos parents,"}, {"t": "p", "x": "sois miséricordieux envers eux: pardonne leurs péchés"}, {"t": "p", "x": "et fais que nous soyons réunis un jour avec eux"}, {"t": "p", "x": "dans la clarté de ta gloire."}, {"t": "p", "x": "Par Jésus Christ, notre Seigneur. Amen."}]}, {"id": "96", "num": "13.3", "title": "Pour les familiers et bienfaiteurs", "theme": "enfermos-difuntos", "sub": "Défunts", "tags": [], "lines": [{"t": "p", "x": "Seigneur notre Dieu, par le mystère pascal de ton Fils,"}, {"t": "p", "x": "maintiens en nous l'espérance de notre résurrection."}, {"t": "p", "x": "Nous te demandons humblement que tous ceux"}, {"t": "p", "x": "qui ont partagé sur cette terre notre fraternité clarétaine"}, {"t": "p", "x": "et collaboré à notre mission d'annoncer l'Évangile"}, {"t": "p", "x": "parviennent à la joie du bonheur éternel."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "97", "num": "13.4", "title": "Prière pour les frères, parents et bienfaiteurs", "theme": "enfermos-difuntos", "sub": "Défunts", "tags": [], "lines": [{"t": "p", "x": "Seigneur, notre Dieu, qui accordes le pardon des péchés"}, {"t": "p", "x": "et le salut à tous les hommes:"}, {"t": "p", "x": "accorde à nos frères, parents et bienfaiteurs,"}, {"t": "p", "x": "qui ont quitté ce monde, d’obtenir, par l'intercession"}, {"t": "p", "x": "de la Vierge  et de tous les saints, le bonnheur du ciel."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "III. LA PRIÈRE JOURNALIÈRE"}]}, {"id": "202", "num": "14.1", "title": "Le Seigneur l'a aimé, parce qu'il fut un homme juste et", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "qu'il donna dans son travail le cent pour un."}, {"t": "r", "x": ". Béni sois-tu, Seigneur, à jamais."}, {"t": "p", "x": "Dieu qui, dans ta providence, as confié à saint Joseph"}, {"t": "p", "x": "la garde fidèle de ton Fils Unique et de sa Mère, Marie,"}, {"t": "p", "x": "bénis le pain, fruit de la terre et du travail des hommes."}, {"t": "p", "x": "Accorde-nous de travailler sans relâche à l'extension de ton Royaume. Par Jésus, le Christ, notre Seigneur.  Amen."}, {"t": "p", "x": "Pour la fête du Cœur de Marie"}, {"t": "p", "x": "Fête du Cœur de Marie"}]}, {"id": "203", "num": "14.2", "title": "Seigneur, nous te rendons grâce et nous te bénissons", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "pour le don inestimable de nous appeler et d'être"}, {"t": "p", "x": "Fils du Cœur Immaculé de Marie."}, {"t": "r", "x": ". Béni sois-tu, Seigneur, à jamais."}, {"t": "p", "x": "Seigneur, notre Dieu,"}, {"t": "p", "x": "qui nous as réunis dans la Congrégation"}, {"t": "p", "x": "comme fils du Cœur Immaculé de Marie, Mère de Jésus,"}, {"t": "p", "x": "accorde-nous la grâce de vivre intensément"}, {"t": "p", "x": "la piété filiale envers elle."}, {"t": "p", "x": "Bénis-nous maintenant que nous sommes"}, {"t": "p", "x": "rassemblés autour de cette table,"}, {"t": "p", "x": "où nous manifestons et partageons notre fraternité."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "Pour la fête de sainte Catherine de Sienne ( le 29 avril)."}, {"t": "p", "x": "Sainte Catherine de Sienne, copatronne (29 avril)"}]}, {"id": "204", "num": "14.3", "title": "Nous te louons, Seigneur, parce que, en sainte Catherine,", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "tu nous donnes un exemple"}, {"t": "p", "x": "de ta puissance et de ta sagesse."}, {"t": "r", "x": ". Béni sois-tu, Seigneur, à jamais."}, {"t": "p", "x": "Seigneur, notre Dieu,"}, {"t": "p", "x": "qui as allumé dans le cœur de sainte Cathérine"}, {"t": "p", "x": "un amour ardent envers toi et envers l'Église,"}, {"t": "p", "x": "daigne bénir maintenant cette nourriture"}, {"t": "p", "x": "que nous allons prendre,"}, {"t": "p", "x": "et accorde-nous de vivre toujours en ta présence"}, {"t": "p", "x": "et d'être des agents de communion dans ton Église."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "Dans les fêtes des Apôtres et des co-patrons"}, {"t": "p", "x": "( Les 3 et 14 mai, le 29 juin, les 3 et 25 juillet, le 24 août, le 21 septembre, le 28 octobre, le 30 novembre et le 27 décembre)."}, {"t": "p", "x": "Fêtes des Apôtres, copatrons"}]}, {"id": "205", "num": "14.4", "title": "Béni sois-tu, Jésus, l'envoyé et le témoin du Père", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Béni sois-tu, Seigneur, pour les fruits de la terre"}, {"t": "p", "x": "et le travail des hommes qui aident cette communauté"}, {"t": "p", "x": "de vie apostolique à se maintenir fidèle à ton saint service."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}]}, {"id": "206", "num": "14.5", "title": "O Christ, nous te louons et nous te bénissons, toi qui", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "prolonges ta présence et ta Parole dans le monde"}, {"t": "p", "x": "par le moyen de tes apôtres."}, {"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Seigneur, toi qui nous envoies,"}, {"t": "p", "x": "comme tu as envoyé tes Apôtres,"}, {"t": "p", "x": "prêcher la Bonne Nouvelle du Royaume,"}, {"t": "p", "x": "bénis ces aliments que nous allons prendre"}, {"t": "p", "x": "et fais de nous des ministres fidèles de ta Parole"}, {"t": "p", "x": "et des apôtres infatigables de ton Royaume."}, {"t": "p", "x": "Toi qui vis et règnes pour les siècles des siècles.  Amen."}]}, {"id": "207", "num": "14.6", "title": "Seigneur Jésus, attendu par les prophètes", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "et annoncé par  les Apôtres et les évangélistes."}, {"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Seigneur Jésus,  par amour au Père et aux frères,"}, {"t": "p", "x": "tu as embrassé les travaux et la mort même"}, {"t": "p", "x": "et as fait des Apôtres les témoins de ta vie et ta résurrection. Bénis cette table, et accorde-nous la joie"}, {"t": "p", "x": "de jouir de ta présence vivante parmi nous."}, {"t": "p", "x": "Toi qui vis et règnes pour les siècles des siècles. Amen."}]}, {"id": "208", "num": "14.7", "title": "Seigneur Jésus, tu as appelé les Apôtres", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "pour vivre avec toi et pour aller prêcher"}, {"t": "p", "x": "la Bonne Nouvelle dans le monde entier."}, {"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Toi, Seigneur, qui as confié aux Apôtres la mission"}, {"t": "p", "x": "de parcourir le monde en y prêchant la Bonne Nouvelle,"}, {"t": "p", "x": "et qui nous as appelés, nous aussi, à la vie apostolique,"}, {"t": "p", "x": "bénis maintenant notre table, et accorde-nous"}, {"t": "p", "x": "de prendre part un jour au banquet de ton Royaume."}, {"t": "p", "x": "Toi qui vis et règnes pour les siècles des siècles. Amen"}, {"t": "p", "x": "Dans l’anniversaire de la fondation de la Congrégation (16 juillet)"}, {"t": "p", "x": "Anniversaire de la fondation de la Congrégation (16 juillet)"}]}, {"id": "209", "num": "14.8", "title": "Bénissons le Seigneur pour avoir suscité dans l'Église", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "notre Congrégation de Missionnaires."}, {"t": "r", "x": ". Berni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Seigneur notre Dieu, qui, pour ta plus grande gloire,"}, {"t": "p", "x": "notre sanctification et le salut des hommes,"}, {"t": "p", "x": "as fondé notre Congrégation par l'intervention spéciale"}, {"t": "p", "x": "de la Vierge Marie et par l'esprit missionnaire"}, {"t": "p", "x": "de saint Antoine-Marie Claret ;"}, {"t": "p", "x": "nous te rendons grâce pour cette nourriture"}, {"t": "p", "x": "que tu nous donnes aujourd’hui."}, {"t": "p", "x": "Bénis-la et accorde-nous chaque jour"}, {"t": "p", "x": "une fidélité constante à ton appel"}, {"t": "p", "x": "selon notre charisme missionnaire dans l'Église."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur.  Amen."}, {"t": "p", "x": "Pour la fête de saint Ignace de Loyola ( le 31 juillet)"}, {"t": "p", "x": "Saint Ignace de Loyola, copatron (31 juillet)"}]}, {"id": "210", "num": "14.9", "title": "Louons et glorifions le Seigneur qui dispose tout", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "pour le bien de ceux qu'il aime."}, {"t": "r", "x": ". Béni sois-tu pour toujoiurs,  Seigneur."}, {"t": "p", "x": "Seigneur, notre Dieu, qui as suscité dans l'Église"}, {"t": "p", "x": "saint Ignace de Loyola pour étendre dans le monde"}, {"t": "p", "x": "la gloire de ton nom; bénis ces aliments et donne-nous"}, {"t": "p", "x": "faim et soif de justice, pour chercher en tout"}, {"t": "p", "x": "ta plus grande gloire et le salut de nos frères."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "Pour la fête de saint Alphonse de Liguori ( le 1 août)"}, {"t": "p", "x": "Saint Alphonse de Liguori, copatron (1er août)"}]}, {"id": "211", "num": "14.10", "title": "Les saints sont les amis de Dieu", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "et ils rendent témoignage de la sainteté divine."}, {"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Seigneur, notre Dieu, qui as fait de Saint Alphonse de Liguori"}, {"t": "p", "x": "un sage et zélé prédicateur de ta Parole,"}, {"t": "p", "x": "répands ta bénédiction sur nous et sur cette nourriture"}, {"t": "p", "x": "que nous allons partager comme signe"}, {"t": "p", "x": "de notre foi commune et de notre mission apostolique."}, {"t": "p", "x": "Fais aussi que nous sachions partager avec les pauvres"}, {"t": "p", "x": "ta Parole divine et ces biens que tu nous donnes."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur.  Amen."}, {"t": "p", "x": "Pour la fête des Bienheureux Martyrs de Barbastro"}, {"t": "p", "x": "( le 13 août)"}, {"t": "p", "x": "Bienheureux Martyrs de Barbastro (13 août)"}]}, {"id": "212", "num": "14.11", "title": "Seigneur Jésus, qui as voulu", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "que nous soyons baptisés avec ton baptême"}, {"t": "p", "x": "et qui nous rends capables de boire au calice que le Père"}, {"t": "p", "x": "t'a donné à boire ;"}, {"t": "r", "x": ". Béni sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Seigneur, tu as accordé aux Prophètes, aux Apôtres"}, {"t": "p", "x": "et à nos Martyrs Clarétains de Barbastro"}, {"t": "p", "x": "la générosité dans le don d’eux-mêmes jusqu'au martyre."}, {"t": "p", "x": "Fortifie nos corps avec les aliments que nous allons prendre"}, {"t": "p", "x": "et communique-nous la force de vivre comme eux notre foi"}, {"t": "p", "x": "en nous donnant entièrement à ton service"}, {"t": "p", "x": "et au salut des hommes."}, {"t": "p", "x": "Par Jésus, le Christ, notre Seigneur. Amen."}, {"t": "p", "x": "Pour la fête des Archanges Michel, Raphaël et Gabriel et des Anges Gardiens. ( le 29 septembre et le 2 octobre)"}, {"t": "p", "x": "Saints Michel, Raphaël et Gabriel, Anges gardiens, copatrons (29 septembre / 2 octobre)"}]}, {"id": "213", "num": "14.12", "title": "Avec les chœurs des Anges", "theme": "mesa", "sub": null, "tags": [], "lines": [{"t": "p", "x": "nous te louons et nous te bénissons, Seigneur."}, {"t": "r", "x": "Bénis sois-tu pour toujours, Seigneur."}, {"t": "p", "x": "Seigneur, notre Dieu,"}, {"t": "p", "x": "tu nous manifestes toujours ta providence;"}, {"t": "p", "x": "bénis notre table, qui est un signe de ta générosité envers nous. Fais que nous
