la carità,"}, {"t": "p", "x": "nella pazienza, nella giustizia,"}, {"t": "p", "x": "nella ricerca del ben fare,"}, {"t": "p", "x": "affinché abbondanti discendano i doni della celeste predilezione."}, {"t": "p", "x": "Amen."}]}, {"id": "161", "num": "4.5", "title": "Preghiera a San Giuseppe", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Ave, Giuseppe, sposo verginale di Maria"}, {"t": "p", "x": "e Padre putativo del Signore."}, {"t": "p", "x": "Tu sei benedetto fra tutti gli uomini"}, {"t": "p", "x": "e benedetto è Gesù, il Figlio di Dio che a te si affidò."}, {"t": "p", "x": "San Giuseppe,"}, {"t": "p", "x": "patrono della Chiesa universale e della nostra Congregazione,"}, {"t": "p", "x": "mantieni nella pace e nella grazia di Dio"}, {"t": "p", "x": "le nostre comunità e famiglie,"}, {"t": "p", "x": "e soccorrici nell’ora della nostra morte."}, {"t": "p", "x": "Amen."}]}, {"id": "162", "num": "4.6", "title": "Preghiera a San Giuseppe", "theme": "san-jose", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Padre Santo, che hai scelto San Giuseppe"}, {"t": "p", "x": "per un compito così singolare"}, {"t": "p", "x": "e gli hai concesso le grazie necessarie"}, {"t": "p", "x": "a realizzarlo nella casa di Nazaret,"}, {"t": "p", "x": "concedi anche a noi"}, {"t": "p", "x": "le grazie necessarie"}, {"t": "p", "x": "per essere fedeli nell’attuazione"}, {"t": "p", "x": "del nostro ministero"}, {"t": "p", "x": "secondo il carisma e lo spirito della Congregazione."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen"}]}, {"id": "168", "num": "5.1", "title": "Preghiera alla Beata Martire Maria", "theme": "martires", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Patrocinio Giner RMI"}, {"t": "p", "x": "Dio grande e misericordioso,"}, {"t": "p", "x": "che donasti alla vergine Beata Maria Patrocinio"}, {"t": "p", "x": "la grazia d’esser generosa nel servizio dei fratelli"}, {"t": "p", "x": "e forte nel martirio, fino al perdono,"}, {"t": "p", "x": "concedi a noi, per sua intercessione,"}, {"t": "p", "x": "di seguire prontamente le orme di Cristo"}, {"t": "p", "x": "sul cammino della croce"}, {"t": "p", "x": "per partecipare un giorno alla gloria della risurrezione."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "169", "num": "5.2", "title": "Preghiera", "theme": "martires", "sub": "Beatificazioni", "tags": [], "lines": [{"t": "p", "x": "Signore, Padre nostro,"}, {"t": "p", "x": "che hai scelto con amore di predilezione"}, {"t": "p", "x": "tutti i Figli del Cuore della Vergine Maria"}, {"t": "p", "x": "e hai voluto che alcuni di loro"}, {"t": "p", "x": "fossero esempio esimio di virtù,"}, {"t": "p", "x": "feconda la Chiesa con la loro glorificazione"}, {"t": "p", "x": "e fa’ che siano per noi modelli da imitare."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "170", "num": "5.3", "title": "Preghiera", "theme": "martires", "sub": "Beatificazioni", "tags": [], "lines": [{"t": "p", "x": "Signore,"}, {"t": "p", "x": "che vuoi santi"}, {"t": "p", "x": "coloro che hai chiamati nella nostra Congregazione,"}, {"t": "p", "x": "concedi ai nostri fratelli missionari"}, {"t": "p", "x": "che più da vicino hanno seguito le orme del Santo Fondatore"}, {"t": "p", "x": "ed hanno donato la loro vita al servizio del Vangelo,"}, {"t": "p", "x": "di essere glorificati sulla terra"}, {"t": "p", "x": "e annoverati fra i santi del cielo."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "171", "num": "5.4", "title": "Preghiera", "theme": "martires", "sub": "Beatificazioni", "tags": [], "lines": [{"t": "p", "x": "Dio, che esalti gli umili e disperdi i superbi,"}, {"t": "p", "x": "degnati di glorificare il tuo servo N."}, {"t": "p", "x": "e fa’ che il suo nome risplenda fra i tuoi santi in cielo."}, {"t": "p", "x": "Moltiplica le tue grazie a favore di quanti ti invocano"}, {"t": "p", "x": "per sua intercessione."}, {"t": "p", "x": "E concedi che la Chiesa onori, un giorno, la sua memoria,"}, {"t": "p", "x": "proponendolo come modello da imitare"}, {"t": "p", "x": "e come protettore che ci aiuti a sopportare"}, {"t": "p", "x": "le difficoltà della nostra vita missionaria"}, {"t": "p", "x": "e a meritare la vita eterna."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "172", "num": "5.5", "title": "Preghiera per impetrare la beatificazione", "theme": "martires", "sub": "Beatificazioni", "tags": [], "lines": [{"t": "p", "x": "Signore, Dio nostro, che hai scelto alcuni nostri fratelli,"}, {"t": "p", "x": "Figli del Cuore Immacolato di Maria,"}, {"t": "p", "x": "e li hai fatti risplendere"}, {"t": "p", "x": "nella vita missionaria"}, {"t": "p", "x": "con l’esempio di una speciale santità,"}, {"t": "p", "x": "degnati di arricchire e di fecondare la Santa Chiesa"}, {"t": "p", "x": "con la sua glorificazione;"}, {"t": "p", "x": "e fa’ che tutti noi,"}, {"t": "p", "x": "seguendo la sua testimonianza evangelica,"}, {"t": "p", "x": "ci impegniamo ardentemente a cercare in tutte le cose"}, {"t": "p", "x": "la tua gloria e la salvezza dei nostri fratelli."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "XI. PREGHIERE PER IL CAPITOLO"}]}, {"id": "32", "num": "6.1", "title": "Magnificat della vocazione", "theme": "congregacion", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Signore, Dio nostro, ti benediciamo"}, {"t": "p", "x": "perché ci hai scelti"}, {"t": "p", "x": "per essere Figli del Cuore Immacolato di tua Madre!"}, {"t": "p", "x": "Madre tre volte benedetta,"}, {"t": "p", "x": "ti lodiamo per la finezza del tuo Cuore Immacolato"}, {"t": "p", "x": "e perché ci hai voluti come tuoi figli."}, {"t": "p", "x": "Fa’, o Madre nostra, che corrispondiamo a tanta bontà;"}, {"t": "p", "x": "che siamo ogni giorno più umili, più fervorosi"}, {"t": "p", "x": "e più zelanti della salvezza delle anime."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "33", "num": "6.2", "title": "Preghiera del clarettiano", "theme": "congregacion", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Fa’, o Signore, che noi, Missionari"}, {"t": "p", "x": "Figli del Cuore Immacolato di Maria,"}, {"t": "p", "x": "siamo uomini ardenti in carità"}, {"t": "p", "x": "e capaci di bruciare ovunque passiamo."}, {"t": "p", "x": "Fa’ che desideriamo efficacemente"}, {"t": "p", "x": "e procuriamo con ogni mezzo possibile"}, {"t": "p", "x": "di accendere il mondo intero nel fuoco del divino amore."}, {"t": "p", "x": "Che nulla e nessuno ci spingano indietro."}, {"t": "p", "x": "Che sappiamo godere nelle privazioni,"}, {"t": "p", "x": "affrontare il lavoro, abbracciare i sacrifici,"}, {"t": "p", "x": "compiacerci nelle calunnie che ci si levino contro,"}, {"t": "p", "x": "rallegrarci nei tormenti e nei dolori,"}, {"t": "p", "x": "gloriarci nella croce del Signore."}, {"t": "p", "x": "E che non pensiamo ad altro se non a come seguire"}, {"t": "p", "x": "e imitare più da vicino il Signore Gesù"}, {"t": "p", "x": "nella preghiera, nel lavoro e nella sofferenza;"}, {"t": "p", "x": "e a procurare sempre e soltanto la maggior gloria di Dio"}, {"t": "p", "x": "e la salvezza delle anime."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "b) DELLA CONGREGAZIONE"}]}, {"id": "34", "num": "6.3", "title": "Preghiera per l’anniversario della fondazione", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore,"}, {"t": "p", "x": "Tu hai concesso a S. Antonio Maria Claret, nostro Padre,"}, {"t": "p", "x": "di ardere in carità"}, {"t": "p", "x": "e di vivere una sollecitudine apostolica"}, {"t": "p", "x": "per la salvezza degli uomini di tutto il mondo."}, {"t": "p", "x": "Fin da bimbo lo accompagnasti"}, {"t": "p", "x": "nella conoscenza più piena del mistero di Cristo."}, {"t": "p", "x": "Spinto dalla carità,"}, {"t": "p", "x": "egli si donò all’annuncio del Vangelo;"}, {"t": "p", "x": "fu paziente nel lavoro e nelle calunnie,"}, {"t": "p", "x": "confermò la sua vita col sangue e con l’esilio."}, {"t": "p", "x": "Per continuare la sua opera,"}, {"t": "p", "x": "e per intervento delle Vergine Maria,"}, {"t": "p", "x": "fondò la nostra Congregazione e ci consegnò il suo spirito."}, {"t": "p", "x": "Oggi, ricordando il nostro inizio nella Chiesa,"}, {"t": "p", "x": "per intercessione di Maria, nostra Madre,"}, {"t": "p", "x": "ti preghiamo che ci renda fedeli figli suoi"}, {"t": "p", "x": "nel ministero della Parola,"}, {"t": "p", "x": "che il suo Cuore continui ad essere per noi"}, {"t": "p", "x": "il pastorale della fiducia;"}, {"t": "p", "x": "che benedica con nuove vocazioni"}, {"t": "p", "x": "questa Famiglia Clarettiana"}, {"t": "p", "x": "e che dia un amore perseverante verso Gesù"}, {"t": "p", "x": "a noi che ci chiamiamo"}, {"t": "p", "x": "e siamo Figli del Cuore Immacolato di Maria"}, {"t": "p", "x": "e lavoriamo nella Chiesa"}, {"t": "p", "x": "per la gloria di Dio."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "35", "num": "6.4", "title": "Per la nostra Congregazione", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "v", "x": "Guarda dal cielo la nostra Congregazione, volgiti ad essa e vieni a visitarla."}, {"t": "r", "x": "Curala, irrigala e arricchiscila senza misura."}, {"t": "v", "x": "Ricordati, Signore, di ciascuno di noi."}, {"t": "r", "x": "Mandaci la tua luce e la tua verità."}, {"t": "v", "x": "Donaci vita affinché invochiamo il tuo nome."}, {"t": "r", "x": "E compiamo la missione di annunciare il Vangelo a tutti i popoli."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Ti preghiamo, Signore:"}, {"t": "p", "x": "per intercessione del Cuore Immacolato di Maria,"}, {"t": "p", "x": "libera la nostra Congregazione da ogni male,"}, {"t": "p", "x": "affinché, con spirito umile e generoso,"}, {"t": "p", "x": "come S. Antonio Maria Claret,"}, {"t": "p", "x": "si dedichi al tuo piano di salvezza per tutti gli uomini."}, {"t": "p", "x": "Per Cristo nostra Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "36", "num": "6.5", "title": "Per la Congregazione", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "v", "x": "Santa Maria"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "San Michele e santi Angeli tutti"}, {"t": "r", "x": "Pregate per noi."}, {"t": "v", "x": "San Giuseppe"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "Santi Apostoli"}, {"t": "r", "x": "Pregate per noi"}, {"t": "v", "x": "Sant’Alfonso Maria de’ Liguori"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "Sant’Ignazio di Loyola"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "San Francesco Saverio."}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "San Vincenzo de’ Paoli"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "Sant’Antonio Maria Claret"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "Santa Teresa di Gesù"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "Santa Caterina da Siena"}, {"t": "r", "x": "Prega per noi."}, {"t": "v", "x": "Beati Martiri della Famiglia Clarettiana"}, {"t": "r", "x": "Pregate per noi"}, {"t": "v", "x": "Sante e Santi tutti di Dio"}, {"t": "r", "x": "Pregate per noi"}, {"t": "v", "x": "Ricordati, Signore, della tua Congregazione"}, {"t": "r", "x": "Fu tua fin dal principio"}, {"t": "v", "x": "Compia la sua missione di annunciare il Vangelo"}, {"t": "r", "x": "Perché tutti gli uomini si salvino"}, {"t": "v", "x": "Ti preghiamo: Vengano in aiuto dei tuoi servi"}, {"t": "r", "x": "Coloro che hai redento con il tuo sangue prezioso"}, {"t": "v", "x": "Salva la tua Congregazione, Signore"}, {"t": "r", "x": "Sii suo pastore e guidala per sempre."}, {"t": "v", "x": "Abbi pietà di noi, Signore"}, {"t": "r", "x": "Abbi pietà di noi"}, {"t": "v", "x": "Discenda su di noi la tua misericordia, Signore."}, {"t": "r", "x": "Che da Te speriamo."}, {"t": "v", "x": "Signore, ascolta la nostra preghiera."}, {"t": "r", "x": "E il nostro grido giunga fino a Te."}, {"t": "v", "x": "Il Signore sia con voi"}, {"t": "r", "x": "E con il tuo Spirito."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Signore, ti preghiamo:"}, {"t": "p", "x": "per intercessione della Vergine Maria,"}, {"t": "p", "x": "libera da ogni male questa Congregazione,"}, {"t": "p", "x": "versa abbondantemente la tua grazia sui tuoi figli,"}, {"t": "p", "x": "e riempili del tuo Spirito"}, {"t": "p", "x": "affinché si compiacciano sempre nella verità."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "37", "num": "6.6", "title": "Preghiera per la Congregazione", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Padre di bontà e di misericordia,"}, {"t": "p", "x": "noi ti lodiamo e ti benediciamo"}, {"t": "p", "x": "perché hai voluto arricchire la tua Chiesa"}, {"t": "p", "x": "con lo stile di santificazione e di apostolato"}, {"t": "p", "x": "di S. Antonio Maria Claret,"}, {"t": "p", "x": "nostro Fondatore e Padre."}, {"t": "p", "x": "Ti supplichiamo umilmente:"}, {"t": "p", "x": "manda nuovi operai alla nostra Congregazione"}, {"t": "p", "x": "e infondi il tuo Spirito in coloro che hai scelto."}, {"t": "p", "x": "Confermaci, tutti, nella vocazione missionaria,"}, {"t": "p", "x": "e fa’ che, spinti dalla carità di Cristo,"}, {"t": "p", "x": "come veri Figli del Cuore Immacolato di Maria,"}, {"t": "p", "x": "annunciamo a tutti i popoli"}, {"t": "p", "x": "la Buona Novella del Regno."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "38", "num": "6.7", "title": "Per rinnovare lo spirito clarettiano.", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Rinnova, Signore, nella nostra Congregazione,"}, {"t": "p", "x": "lo spirito che infiammò S. Antonio Maria Claret,"}, {"t": "p", "x": "nostro Padre perché, animati"}, {"t": "p", "x": "e fortificati dal suo stesso spirito,"}, {"t": "p", "x": "amiamo ciò che egli ha amato"}, {"t": "p", "x": "e traduciamo nella vita quanto ci ha insegnato."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "39", "num": "6.8", "title": "Evangelizzatori fedeli.", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Tu, o Signore,"}, {"t": "p", "x": "hai misericordiosamente decretato"}, {"t": "p", "x": "che la tua Parola s’incarnasse nel seno della Vergine Maria:"}, {"t": "p", "x": "concedici di osservarla con i nostri cuori"}, {"t": "p", "x": "così che siamo sempre servitori fedeli"}, {"t": "p", "x": "nella proclamazione della sua Buona Novella di salvezza."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "40", "num": "6.9", "title": "Costituzioni.", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Padre, Tu ci hai concesso il dono"}, {"t": "p", "x": "di seguire Gesù"}, {"t": "p", "x": "e di annunciare il tuo Regno fra gli uomini"}, {"t": "p", "x": "allo stile di Claret, di essere suoi discepoli."}, {"t": "p", "x": "Aiutaci ad osservare con tutta la cura possibile"}, {"t": "p", "x": "le nostre Costituzioni,"}, {"t": "p", "x": "nostra via del Vangelo."}, {"t": "p", "x": "Concedici di ascoltare la tua Parola con tutta docilità,"}, {"t": "p", "x": "come tua Madre,"}, {"t": "p", "x": "per essere fedeli Figli del suo Cuore,"}, {"t": "p", "x": "e cooperare con il suo compito materno"}, {"t": "p", "x": "nella missione apostolica."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "41", "num": "6.10", "title": "Ringraziamento per la vocazione.", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Io vi ringrazio della vocazione ricevuta, Madre mia!"}, {"t": "p", "x": "Fatemi la grazia d’esser fedele ad essa tutta la mia vita."}, {"t": "p", "x": "Amen."}]}, {"id": "42", "num": "6.11", "title": "Definizione del missionario clarettiano.", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "v", "x": "Signore, per intercessione del Cuore Immacolato di Maria, infondi in noi lo spirito dell’amore, affinché siamo uomini brucianti di carità,"}, {"t": "p", "x": "capaci di infiammare ovunque passiamo..."}, {"t": "r", "x": "Amen."}, {"t": "v", "x": "E affinché desideriamo efficacemente e procuriamo"}, {"t": "p", "x": "con tutti i mezzi possibili"}, {"t": "p", "x": "di accendere tutto il mondo nel fuoco del divino amore."}, {"t": "r", "x": "Amen."}, {"t": "v", "x": "Signore, per intercessione del Cuore Immacolato di Maria, infondi in noi lo spirito di fortezza, affinché nulla ci spinga indietro,"}, {"t": "p", "x": "ma godiamo nelle privazioni ed affrontiamo coraggiosamente le fatiche..."}, {"t": "r", "x": "Amen."}, {"t": "v", "x": "E affinché abbracciamo con gioia i sacrifici, godiamo nelle calunnie e ci rallegriamo nei tormenti."}, {"t": "r", "x": "Amen."}, {"t": "v", "x": "Signore, per intercessione del Cuore Immacolato di Maria, infondi in noi lo spirito missionario che infiammò Gesù, tuo Figlio,"}, {"t": "p", "x": "affinché non pensiamo ad altro"}, {"t": "p", "x": "se non a come seguirlo e imitarlo nella preghiera,"}, {"t": "p", "x": "nel lavoro e nella sofferenza."}, {"t": "r", "x": "Amen."}, {"t": "v", "x": "E affinché, come Gesù, procuriamo sempre e unicamente la tua maggior gloria e la salvezza degli uomini."}, {"t": "r", "x": "Amen."}]}, {"id": "43", "num": "6.12", "title": "Professione dell’identità clarettiana.", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Crediamo che lo Spirito Santo"}, {"t": "p", "x": "ci ha convocati nella Chiesa"}, {"t": "p", "x": "in S. Antonio Maria Claret"}, {"t": "p", "x": "affinché, come Congregazione,"}, {"t": "p", "x": "ci chiamiamo e siamo"}, {"t": "p", "x": "Missionari Figli del Cuore Immacolato di Maria."}, {"t": "p", "x": "Crediamo che il Padre ci convoca"}, {"t": "p", "x": "a vivere in modo autentico e significativo"}, {"t": "p", "x": "il mistero e la missione apostolica del Figlio suo"}, {"t": "p", "x": "in fraternità evangelizzata ed evangelizzatrice."}, {"t": "p", "x": "È lui, e non i nostri progetti,"}, {"t": "p", "x": "che ci rende veri discepoli di Cristo."}, {"t": "p", "x": "Questo amore che configura la nostra vita fraterna,"}, {"t": "p", "x": "vogliamo significarlo, ogni giorno più, nell’Eucaristia."}, {"t": "p", "x": "Crediamo che Maria è all’origine della nostra vocazione"}, {"t": "p", "x": "e che esercita la sua maternità configurando le nostre vite"}, {"t": "p", "x": "a Cristo, suo Figlio."}, {"t": "p", "x": "Nel suo Cuore di Madre"}, {"t": "p", "x": "si formano gli apostoli della Congregazione."}, {"t": "p", "x": "La sua presenza in noi è impulso evangelizzatore"}, {"t": "p", "x": "e amore misericordioso"}, {"t": "p", "x": "capaci di trasformare ed animare i credenti."}, {"t": "p", "x": "Crediamo che il Padre Claret fu scelto da Dio"}, {"t": "p", "x": "e proposto come nostro prototipo"}, {"t": "p", "x": "e modello di missionari al servizio del Vangelo"}, {"t": "p", "x": "nella Chiesa universale."}, {"t": "p", "x": "Crediamo che la nostra comune vocazione-missione"}, {"t": "p", "x": "comporta una sequela,"}, {"t": "p", "x": "in perfetta fedeltà e in assoluta disponibilità"}, {"t": "p", "x": "a Cristo e alla Chiesa,"}, {"t": "p", "x": "secondo le esigenze evangeliche vissute"}, {"t": "p", "x": "dal nostro Fondatore e Padre,"}, {"t": "p", "x": "e trasmesse dai nostri anziani."}, {"t": "p", "x": "Crediamo che lo Spirito di Gesù risorto"}, {"t": "p", "x": "ci spinge profeticamente ad annunciare"}, {"t": "p", "x": "la Buona Novella ai popoli,"}, {"t": "p", "x": "e a bruciare,"}, {"t": "p", "x": "ancora spinti dalla sua stessa carità sacrificata e redentrice,"}, {"t": "p", "x": "ovunque passiamo."}, {"t": "p", "x": "Crediamo d’essere stati chiamati come coraggiosi"}, {"t": "p", "x": "collaboratori del Sommo Pontefice"}, {"t": "p", "x": "e dei Vescovi"}, {"t": "p", "x": "nel ministero della Parola, per l’espansione"}, {"t": "p", "x": "del Regno di Dio in tutto il mondo."}, {"t": "p", "x": "A questo scopo, impiegando tutti i mezzi possibili,"}, {"t": "p", "x": "vogliamo guardare con attenzione a ciò che è più urgente,"}, {"t": "p", "x": "opportuno ed efficace."}, {"t": "p", "x": "Crediamo che la Congregazione è opera di Dio"}, {"t": "p", "x": "e che Gesù e Maria non l’abbandoneranno,"}, {"t": "p", "x": "suscitando vocazioni"}, {"t": "p", "x": "e fornendo ai chiamati lo Spirito,"}, {"t": "p", "x": "perché, vivendo tutti in fraternità"}, {"t": "p", "x": "la stessa consacrazione e missione,"}, {"t": "p", "x": "glorifichiamo il Padre,"}, {"t": "p", "x": "prolunghiamo la testimonianza della comunione ecclesiale"}, {"t": "p", "x": "e rendiamo più efficace l’azione evangelizzatrice."}, {"t": "p", "x": "Crediamo, Signore. Aumenta la nostra fede."}]}, {"id": "44", "num": "6.13", "title": "Il clarettiano e la sua spiritualità personale.", "theme": "congregacion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Poiché la nostra missione di evangelizzatori non può essere intesa né vissuta senza una spiritualità centrata nella sulla sequela di Gesù, Figlio di Dio, sentendoci suoi fratelli, lo supplichiamo dicendo:"}, {"t": "p", "x": "Insegnaci a stare nelle cose del Padre."}, {"t": "p", "x": "Signore Gesù, che ci inviti a vivere la nostra spiritualità nella prospettiva della missione,"}, {"t": "v", "x": "aiutaci affinché le nostre esigenze e opzioni di evangelizzazione siano parte integrante della nostra spiritualità."}, {"t": "p", "x": "Signore Gesù, che ci inviti a configurarci a Te in una spiritualità missionaria, profetica, inculturata ed evangelizzatrice,"}, {"t": "v", "x": "ridesta in noi attitudine di disponibilità, di itineranza e di docilità allo Spirito."}, {"t": "p", "x": "Signore Gesù, che ci chiami ad essere ministri della Parola di fra il nostro popolo bisognoso di evangelizzazione,"}, {"t": "v", "x": "aiutaci perché essa occupi un luogo fondamentale nella nostra preghiera, nella meditazione e nella contemplazione."}, {"t": "p", "x": "Signore Gesù, Parola definitiva del Padre verso i suoi i figli,"}, {"t": "v", "x": "alimenta in noi l’attitudine a lasciarci interpellare da essa e ad imparare a leggerla nella luce degli avvenimenti che circondano il nostro servizio missionario."}, {"t": "p", "x": "Signore Gesù, che sperimentasti la tentazione,"}, {"t": "v", "x": "rafforza il nostro spirito, perché non scendiamo a patti con la mediocrità, con l’edonismo, la consuetudine e la routine."}, {"t": "p", "x": "Signore Gesù, Pane di Vita che alimenti la nostra identificazione con Te,"}, {"t": "v", "x": "fa’ che vivendo il Mistero eucaristico, come il Claret, ci disponiamo ad opporci alla presenza del male nella nostra storia."}, {"t": "p", "x": "Signore Gesù, che ci insegni e raccomandi la preghiera assidua,"}, {"t": "v", "x": "aiutaci ad impegnarci più seriamente nella preghiera personale e comunitaria."}, {"t": "p", "x": "Signore Gesù, che ci hai donato Maria come Madre, Fondatrice della nostra Congregazione e modello della tua sequela,"}, {"t": "v", "x": "insegnaci a potenziare la dimensione mariana della nostra spiritualità, vivendola ed esprimendola nella concretezza dei fatti."}]}, {"id": "68", "num": "7.1", "title": "Preghiera al Padre", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Tu, Padre,"}, {"t": "p", "x": "per lo Spirito Santo che ci configura a Cristo"}, {"t": "p", "x": "e che edifica la nostra comunione,"}, {"t": "p", "x": "hai riversato nei nostri cuori"}, {"t": "p", "x": "l’amore a Te e ai fratelli."}, {"t": "p", "x": "Ti chiediamo: rendici capaci di accogliere questo tuo dono"}, {"t": "p", "x": "affinché tutta la nostra vita missionaria"}, {"t": "p", "x": "sia retta ed informata da questo stesso amore"}, {"t": "p", "x": "e conseguiamo nella comunità missionaria"}, {"t": "p", "x": "la pienezza personale cui Tu ci chiami."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "69", "num": "7.2", "title": "Preghiera della comunità", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Ti ringraziamo, Padre santo,"}, {"t": "p", "x": "perché ci hai riuniti in questa tua comunità"}, {"t": "p", "x": "donde vuoi che annunciamo il tuo Regno"}, {"t": "p", "x": "con una vita perfettamente consacrata"}, {"t": "p", "x": "e con un deciso dono al sevizio del Vangelo."}, {"t": "p", "x": "Vogliamo proclamare"}, {"t": "p", "x": "con tutto il nostro essere e il nostro agire,"}, {"t": "p", "x": "come veri Figli del Cuore di Maria,"}, {"t": "p", "x": "le meraviglie del tuo amore fra gli uomini."}, {"t": "p", "x": "Rinnoviamo il nostro proposito"}, {"t": "p", "x": "di essere ogni giorno migliori,"}, {"t": "p", "x": "di aiutarci mutuamente nella sequela del tuo Figlio,"}, {"t": "p", "x": "di assecondare le ispirazioni dello Spirito Santo"}, {"t": "p", "x": "e di collaborare al compimento della missione"}, {"t": "p", "x": "che ci hai affidato nella Chiesa."}, {"t": "p", "x": "Non permettere, Signore, che questa buona volontà"}, {"t": "p", "x": "sfumi quasi inavvertitamente"}, {"t": "p", "x": "a causa dell’egoismo, dell’abitudine,"}, {"t": "p", "x": "della mancata continuità."}, {"t": "p", "x": "Ravviva la fede e la speranza di questa comunità apostolica"}, {"t": "p", "x": "al momento di discernere le inevitabili differenze"}, {"t": "p", "x": "e dilata i nostri cuori al perdono necessario."}, {"t": "p", "x": "Dalla coscienza della nostra debolezza,"}, {"t": "p", "x": "ti chiediamo di mantenerci attenti alla tua grazia:"}, {"t": "p", "x": "che l’assidua meditazione della tua Parola ci ricrei,"}, {"t": "p", "x": "e che la convivenza fraterna ci stimoli"}, {"t": "p", "x": "a dare quella testimonianza di amore"}, {"t": "p", "x": "di cui il mondo ha bisogno per credere,"}, {"t": "p", "x": "e che le necessità dei più poveri"}, {"t": "p", "x": "ci stimolino ad uscire da noi stessi"}, {"t": "p", "x": "e ci obblighino a lavorare per loro senza riposo."}, {"t": "p", "x": "Ci raccomandiamo a Maria, Madre di Gesù,"}, {"t": "p", "x": "esempio di vita consacrata,"}, {"t": "p", "x": "perché ci formi nel suo Cuore"}, {"t": "p", "x": "e ci faccia proseguire sulla via della perfezione"}, {"t": "p", "x": "e del servizio apostolico"}, {"t": "p", "x": "che S. Antonio Maria Claret, con la vita e la dottrina,"}, {"t": "p", "x": "tracciò per noi nella Chiesa e nel mondo."}, {"t": "p", "x": "Suggella con la tua fedeltà eterna, Padre,"}, {"t": "p", "x": "ciò che in questo momento"}, {"t": "p", "x": "costituisce la nostra più sincera aspirazione."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "70", "num": "7.3", "title": "Carità fraterna", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Ti supplichiamo umilmente, Signore Dio nostro,"}, {"t": "p", "x": "di unire in un solo cuore noi che condividiamo lo spirito"}, {"t": "p", "x": "del tuo servo S. Antonio Maria Claret,"}, {"t": "p", "x": "affinché, nel mutuo amore concordi,"}, {"t": "p", "x": "possiamo essere testimoni della tua carità"}, {"t": "p", "x": "fra gli uomini."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "71", "num": "7.4", "title": "Preghiera per la mia comunità", "theme": "comunidad", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Padre, voglio pregarti quest’oggi"}, {"t": "p", "x": "per i miei fratelli di comunità."}, {"t": "p", "x": "Tu li conosci personalmente:"}, {"t": "p", "x": "conosci i loro nomi e i loro cognomi,"}, {"t": "p", "x": "le loro virtù e i loro difetti,"}, {"t": "p", "x": "le loro gioie e le loro pene,"}, {"t": "p", "x": "la loro fortezza e la loro debolezza,"}, {"t": "p", "x": "tutta la loro storia;"}, {"t": "p", "x": "e li accetti come sono,"}, {"t": "p", "x": "li vivifichi con il tuo Spirito."}, {"t": "p", "x": "Insegnami ad amarli nella verità,"}, {"t": "p", "x": "ad imitazione di Gesù Cristo;"}, {"t": "p", "x": "non per le loro parole o per le loro opere,"}, {"t": "p", "x": "ma per se stessi,"}, {"t": "p", "x": "scoprendo in ciascuno di loro,"}, {"t": "p", "x": "e specialmente nei più deboli,"}, {"t": "p", "x": "il mistero del tuo amore infinito."}, {"t": "p", "x": "Ti ringrazio, Padre,"}, {"t": "p", "x": "perché mi hai dato tanti fratelli."}, {"t": "p", "x": "Tutti sono un dono per me, un vero sacramento,"}, {"t": "p", "x": "segno sensibile ed efficace della presenza del tuo Figlio."}, {"t": "p", "x": "Dammi lo sguardo di Gesù per contemplarli,"}, {"t": "p", "x": "il suo cuore per amarli fino in fondo,"}, {"t": "p", "x": "perché anch’io voglio essere per ciascuno di loro"}, {"t": "p", "x": "sacramento vivo della presenza di Gesù."}, {"t": "p", "x": "Egli vive e regna nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "72", "num": "8.1", "title": "Preghiera apostolica", "theme": "mision", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Dio mio e Padre mio!"}, {"t": "p", "x": "Che ti conosca e ti faccia conoscere;"}, {"t": "p", "x": "che ti ami e ti faccia amare;"}, {"t": "p", "x": "che ti serva e ti faccia servire;"}, {"t": "p", "x": "che ti lodi e ti faccia lodare da tutte le creature."}, {"t": "p", "x": "Concedimi, Padre mio, che tutti i peccatori si convertano,"}, {"t": "p", "x": "che tutti i giusti perseverino nella grazia,"}, {"t": "p", "x": "che tutti conseguano l’eterna gloria."}, {"t": "p", "x": "Amen."}]}, {"id": "73", "num": "8.2", "title": "Conoscere Dio per servirlo", "theme": "mision", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Concedimi, Signore,"}, {"t": "p", "x": "che tutti conoscano la tua bontà e vicinanza,"}, {"t": "p", "x": "e ti amino e ti servano con ogni fedeltà,"}, {"t": "p", "x": "perché Tu sei buono e la tua misericordia è infinita."}, {"t": "p", "x": "Amen."}]}, {"id": "74", "num": "8.3", "title": "Strumento del Regno", "theme": "mision", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Sono qui, o Signore,"}, {"t": "p", "x": "se vuoi far di me uno strumento"}, {"t": "p", "x": "per l’annunzio del tuo Regno."}, {"t": "p", "x": "Fa’, o Signore, che io mangi solo per aver forza"}, {"t": "p", "x": "e servirti meglio;"}, {"t": "p", "x": "che usi delle cose di questo mondo secondo necessità,"}, {"t": "p", "x": "che studi per conoscerti e amarti,"}, {"t": "p", "x": "per aiutare i miei fratelli:"}, {"t": "p", "x": "che il mio riposo sia per riequilibrare le forze spese"}, {"t": "p", "x": "e per servirti meglio."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "b) DELLA CONGREGAZIONE"}]}, {"id": "75", "num": "8.4", "title": "Per il frutto apostolico dei Missionari", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Padre di bontà,"}, {"t": "p", "x": "senza nostro merito ci hai scelti e ci invii"}, {"t": "p", "x": "come a suo tempo tuo Figlio Gesù."}, {"t": "p", "x": "Comunicaci il tuo Spirito,"}, {"t": "p", "x": "rendici ministri idonei del Vangelo,"}, {"t": "p", "x": "e concedi a noi la forza necessaria"}, {"t": "p", "x": "per esercitare efficacemente il ministero"}, {"t": "p", "x": "della salvezza degli uomini."}, {"t": "p", "x": "Da’ incremento, Signore, alle nostre opere,"}, {"t": "p", "x": "e fa’ che Cristo, tua Parola, parli attraverso di noi."}, {"t": "p", "x": "Donaci la tua benedizione e aiutaci"}, {"t": "p", "x": "perché tutti gli uomini accettino il Vangelo"}, {"t": "p", "x": "e ti amino ogni giorno di più."}, {"t": "p", "x": "Non permettere, Signore, che ti offendiamo;"}, {"t": "p", "x": "preservaci da tutti i pericoli"}, {"t": "p", "x": "e fortificaci con la tua grazia."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "76", "num": "8.5", "title": "Missionari", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore,"}, {"t": "p", "x": "che ci chiami come gli Apostoli,"}, {"t": "p", "x": "fa’ che ci sforziamo"}, {"t": "p", "x": "con tutti i nostri mezzi e con tutte le nostre risorse"}, {"t": "p", "x": "ad ottenere che sia amato, conosciuto"}, {"t": "p", "x": "e servito da tutti."}, {"t": "p", "x": "Donaci un cuore aperto"}, {"t": "p", "x": "per amare tutti gli uomini senza eccezione alcuna,"}, {"t": "p", "x": "procurando loro la beatitudine del Regno,"}, {"t": "p", "x": "già presente su questa terra."}, {"t": "p", "x": "Dei doni che crediamo di possedere,"}, {"t": "p", "x": "vogliamo rendere gloria unicamente a Te,"}, {"t": "p", "x": "procurando di farli fruttificare abbondantemente;"}, {"t": "p", "x": "fa’ che ricordiamo i nostri limiti e i nostri difetti,"}, {"t": "p", "x": "così riconoscendo la nostra assoluta dipendenza da Te."}, {"t": "p", "x": "Che manifestiamo, Signore, questo convincimento"}, {"t": "p", "x": "nel nostro modo di agire"}, {"t": "p", "x": "e nelle nostre relazioni con gli altri,"}, {"t": "p", "x": "disposti a chiedere perdono"}, {"t": "p", "x": "per i nostri errori e i nostri contrappunti."}, {"t": "p", "x": "Che prestiamo ai nostri fratelli"}, {"t": "p", "x": "il servizio del nostro amore,"}, {"t": "p", "x": "così che ciascuno di noi stia in mezzo a loro"}, {"t": "p", "x": "come uno che serve."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "77", "num": "8.6", "title": "Missione clarettiana", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Padre santo,"}, {"t": "p", "x": "tu chiamasti Antonio Maria Claret a seguire il Figlio tuo,"}, {"t": "p", "x": "ed egli, spinto dal suo amore,"}, {"t": "p", "x": "impegnò completamente la vita alla lotta per la Causa di Lui:"}, {"t": "p", "x": "il Regno."}, {"t": "p", "x": "Ridesta in noi il suo spirito evangelizzatore"}, {"t": "p", "x": "per cogliere ciò che è più urgente,"}, {"t": "p", "x": "più opportuno ed efficace"}, {"t": "p", "x": "e di realizzare, docili allo Spirito"}, {"t": "p", "x": "e obbedienti alla tua volontà,"}, {"t": "p", "x": "la missione di propagare la fede."}, {"t": "p", "x": "Animati come il Claret dalla forza del tuo Spirito,"}, {"t": "p", "x": "anche noi vogliamo deciderci per la Causa del Regno"}, {"t": "p", "x": "e accettare i rischi della denuncia"}, {"t": "p", "x": "e il compromesso profetico"}, {"t": "p", "x": "che la nostra missione evangelizzatrice comporta."}, {"t": "p", "x": "Vogliamo renderci solidali e condividere le angustie,"}, {"t": "p", "x": "le privazioni e le speranze degli uomini"}, {"t": "p", "x": "ai quali siamo inviati."}, {"t": "p", "x": "E mentre confessiamo che tuo Figlio è vivo tra gli uomini,"}, {"t": "p", "x": "vogliamo lavorare per allontanare la non credulità,"}, {"t": "p", "x": "l’odio, l’ingiustizia,"}, {"t": "p", "x": "la menzogna, l’oppressione, il dolore,"}, {"t": "p", "x": "la solitudine, la fame, l’ignoranza"}, {"t": "p", "x": "e tante altre urgenze d’amore"}, {"t": "p", "x": "che sono urgenze del Regno."}, {"t": "p", "x": "Te lo chiediamo per Gesù Cristo tuo Figlio"}, {"t": "p", "x": "che vive e regna nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "78", "num": "8.7", "title": "Preghiera missionaria", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "O Padre,"}, {"t": "p", "x": "che hai riversato i doni del tuo Spirito"}, {"t": "p", "x": "sulla Beata Vergine Maria,"}, {"t": "p", "x": "in preghiera nel Cenacolo con gli Apostoli,"}, {"t": "p", "x": "fa’ che noi pure perseveriamo unanimi nella preghiera"}, {"t": "p", "x": "con Maria, nostra Madre, per portare al mondo,"}, {"t": "p", "x": "con la forza dello Spirito,"}, {"t": "p", "x": "la Buona Novella della salvezza."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "79", "num": "8.8", "title": "Per la Chiesa", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore Gesù,"}, {"t": "p", "x": "per amore verso gli uomini"}, {"t": "p", "x": "pregasti per la fede dei tuoi discepoli,"}, {"t": "p", "x": "intercedesti per i peccatori"}, {"t": "p", "x": "e ti movesti a compassione per tutta l’umana miseria:"}, {"t": "p", "x": "accogli le preghiere che per la Chiesa eleviamo a te,"}, {"t": "p", "x": "rispondi alle nostre preghiere per la vita del mondo"}, {"t": "p", "x": "e ricevi tutti nella gioia del Regno eterno"}, {"t": "p", "x": "dove vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "80", "num": "8.9", "title": "Il Signore è presente nella Missione", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore Gesù, il tuo mandato missionario"}, {"t": "p", "x": "un giorno ci disperse per il mondo intero."}, {"t": "p", "x": "La tua Parola di comunione oggi ci raduna qui,"}, {"t": "p", "x": "dove s’incrociano tutte le nostre strade,"}, {"t": "p", "x": "dove incontrarci è incontrarTi,"}, {"t": "p", "x": "dove amarci è renderTi testimonianza,"}, {"t": "p", "x": "dove accendere speranze è annunciare la Tua venuta."}, {"t": "p", "x": "Come i Dodici,"}, {"t": "p", "x": "ritorniamo a Te dai sentieri della nostra missione,"}, {"t": "p", "x": "portando alla Tua presenza il dolore"}, {"t": "p", "x": "e le umiliazioni dei nostri popoli,"}, {"t": "p", "x": "il lamento dei poveri che ci hai mandato ad evangelizzare,"}, {"t": "p", "x": "le speranze degli umili che hanno aperto"}, {"t": "p", "x": "il loro cuore al tuo messaggio"}, {"t": "p", "x": "e che dovunque lo fanno fiorire in fraternità,"}, {"t": "p", "x": "nella Chiesa."}, {"t": "p", "x": "Concedici che, celebrando e contemplando la tua Parola,"}, {"t": "p", "x": "impariamo a discernere nella fede i segni dei tempi,"}, {"t": "p", "x": "e a proclamare Te che sei verità completa"}, {"t": "v", "x": "sempre nuova -,"}, {"t": "p", "x": "in mezzo alle ambiguità e alle contraddizioni"}, {"t": "p", "x": "di questo mondo."}, {"t": "p", "x": "Che la tua presenza risuscitata tra di noi"}, {"t": "p", "x": "sciolga timori e disinganni,"}, {"t": "p", "x": "e ci faccia decidere,"}, {"t": "p", "x": "con libertà e fortezza,"}, {"t": "p", "x": "a favore della tua proposta di vita, di giustizia e di fraternità,"}, {"t": "p", "x": "là dove si coltivano progetti di distruzione,"}, {"t": "p", "x": "d’oppressione e di violenza."}, {"t": "p", "x": "Mandaci il tuo Spirito"}, {"t": "p", "x": "perché come in Maria, la Vergine Madre,"}, {"t": "p", "x": "crei anche in noi un cuore nuovo,"}, {"t": "p", "x": "acceso in carità apostolica,"}, {"t": "p", "x": "disponibile dinanzi alle sfide della nuova evangelizzazione,"}, {"t": "p", "x": "fecondo nelle opere di amore e di servizio"}, {"t": "p", "x": "ai più bisognosi."}, {"t": "p", "x": "Fa’ che siamo strumenti di comunione"}, {"t": "p", "x": "e di riconciliazione"}, {"t": "p", "x": "affinché, tra i popoli ai quali ci hai inviato,"}, {"t": "p", "x": "la comunità di coloro che credono in Te"}, {"t": "p", "x": "sia trasparenza del tuo disegno di salvezza"}, {"t": "p", "x": "e glorifichi il tuo nome."}, {"t": "p", "x": "Amen."}]}, {"id": "81", "num": "8.10", "title": "Il ministero della Parola", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Ti ringraziamo, Signore, perché, senza nostro merito, ci hai concesso il dono di annunciare il Vangelo. Che la tua grazia non sia sterile in noi."}, {"t": "p", "x": "Signore, rendici ministri idonei della tua Parola."}, {"t": "p", "x": "La nostra speciale vocazione nel Popolo di Dio è il ministero della Parola con cui comunichiamo agli uomini il mistero del Cristo totale:"}, {"t": "v", "x": "Ti chiediamo, Signore, che ci conceda di compiere degnamente e fruttuosamente il ministero che ci hai affidato nella Chiesa."}, {"t": "p", "x": "Mossi dallo zelo apostolico e dalla gioia dello Spirito, vogliamo sforzarci con tutti i nostri mezzi e tutte le nostre possibilità, di conseguire che Tu sia conosciuto, amato e servito da tutti:"}, {"t": "v", "x": "Signore, ti chiediamo, con le parole del nostro Fondatore che ti conosciamo e ti facciamo conoscere, ti amiamo e ti facciamo amare, ti serviamo e ti facciamo servire, ti lodiamo e ti facciamo lodare da ogni creatura."}, {"t": "p", "x": "Desideriamo ardentemente, o Signore, la tua giustizia; e ci sforziamo di giungere alla maturità della pienezza in Cristo, per comunicare con più grande efficacia agli altri la grazia del Vangelo:"}, {"t": "v", "x": "Signore, vogliamo praticare ciò che predichiamo. Trasformaci pienamente in tuo Vangelo, perché siamo davvero fedeli evangelizzati ed efficaci evangelizzatori."}]}, {"id": "82", "num": "8.11", "title": "Per coltivare la nostra vocazione missionaria", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Con la gioia di saperci inviati dallo Spirito di Gesù ad annunciare il Regno, condividendo le speranze e le gioie degli uomini, chiediamo al Signore Gesù la forza di realizzare la nostra missione, supplicandolo così:"}, {"t": "p", "x": "Donaci lo Spirito, e risponderemo con amore e fedeltà."}, {"t": "p", "x": "Signore, consapevoli che l’evangelizzazione è il nostro servizio all’uomo, al mondo, alla Chiesa e alla costruzione del Regno:"}, {"t": "v", "x": "Concedici di esaltare la nostra evangelizzazione missionaria «allo stile degli Apostoli» rispondendo a «ciò che è più urgente, più opportuno e più efficace»."}, {"t": "p", "x": "Signore, il dinamismo della tua incarnazione fra gli uomini vuole da noi una evangelizzazione inculturata:"}, {"t": "v", "x": "Donaci il cuore e la mente aperti ai popoli che dobbiamo servire, per essere capaci di trasmettere il messaggio evangelico a partire dagli specifici loro valori culturali:"}, {"t": "p", "x": "Signore, la nostra Congregazione è presente in regioni dove tanti squilibri e tante ingiustizie distruggono la dignità dell’uomo:"}, {"t": "v", "x": "Fa’ che la nostra opzione sia per una evangelizzazione profetica e liberatrice e con la nostra vita e parola portiamo la luce del Vangelo con tutto il suo contenuto di annuncio di salvezza:"}, {"t": "p", "x": "Signore, che hai fatto di S. Antonio Maria Claret un uomo che percepì e annunciò il disegno di salvezza nelle concrete situazioni del suo tempo:"}, {"t": "v", "x": "Aiutaci ad essere segno e forza liberatrice da ogni schiavitù che impedisca all’uomo di essere persona in comunione con Dio e con i fratelli."}, {"t": "p", "x": "Signore, con la Chiesa del nostro tempo, abbiamo preso coscienza nuova che i poveri sono i primi destinatari della tua missione:"}, {"t": "v", "x": "Ti chiediamo che, fedeli alla tua sequela e alla Chiesa, la nostra evangelizzazione sia sempre nella prospettiva dei poveri e dei bisognosi."}, {"t": "p", "x": "Signore, se davvero questa preferenza per i poveri ci chiede di revisionare i nostri criteri, le nostre attitudini, le nostre strutture e soprattutto il nostro stile di vita:"}, {"t": "v", "x": "Disponici alla tua insistente chiamata alla conversione della mentalità e dei comportamenti."}, {"t": "p", "x": "Signore, l’urgenza dell’evangelizzazione nella Chiesa di oggi esige da noi l’attualizzazione della sensibilità che fu del Claret per la promozione di evangelizzatori:"}, {"t": "v", "x": "Fa’ che la nostra evangelizzazione moltiplichi guide evangelizzatrici: sacerdoti, religiosi e laici."}]}, {"id": "83", "num": "8.12", "title": "Vogliamo compiere la tua volontà", "theme": "mision", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Padre nostro,"}, {"t": "p", "x": "Padre di bontà e di misericordia:"}, {"t": "p", "x": "siamo qui riuniti in nome dell’amore"}, {"t": "p", "x": "che nutri per noi."}, {"t": "p", "x": "Ti lodiamo, ti benediciamo, ti ringraziamo."}, {"t": "p", "x": "Rispondiamo con gioia alla chiamata"}, {"t": "p", "x": "del tuo Figlio Gesù"}, {"t": "p", "x": "e sostenuti dalla forza dello Spirito,"}, {"t": "p", "x": "ti diciamo fidenti: «Vogliamo compiere la tua volontà»."}, {"t": "p", "x": "Donaci occhi limpidi, intelligenza aperta"}, {"t": "p", "x": "e cuore ardente"}, {"t": "p", "x": "per comprendere ed abbracciare il disegno"}, {"t": "p", "x": "che maturi su di noi."}, {"t": "p", "x": "Pensando alla missione che ci affidi,"}, {"t": "p", "x": "sentiamo le profonde e costanti esigenze"}, {"t": "p", "x": "cui dobbiamo rispondere."}, {"t": "p", "x": "Aumenta in noi la generosità e la speranza"}, {"t": "p", "x": "ed aprici alla necessità più urgenti degli uomini."}, {"t": "p", "x": "Fa’ che ci distinguiamo esprimendo nella nostra vita"}, {"t": "p", "x": "l’amore universale di Cristo Signore,"}, {"t": "p", "x": "la sua incondizionata donazione"}, {"t": "p", "x": "e la dimenticanza totale di se stesso"}, {"t": "p", "x": "nella realizzazione della sua missione"}, {"t": "p", "x": "di salvezza in questo mondo."}, {"t": "p", "x": "Confermaci nella verità: dacci sete della tua giustizia"}, {"t": "p", "x": "e rendici strumenti utili della pace."}, {"t": "p", "x": "Che noi siamo forze vive di comunione"}, {"t": "p", "x": "in questa Chiesa pellegrina"}, {"t": "p", "x": "e che giungiamo ad essere testimoni del potere sovrano"}, {"t": "p", "x": "di Cristo risorto"}, {"t": "p", "x": "fra di un popolo che soffre passione di libertà."}, {"t": "p", "x": "Che siamo responsabili, in ogni azione e impegno,"}, {"t": "p", "x": "e non permettere che, proclamando il Vangelo,"}, {"t": "p", "x": "ricerchiamo il nostro interesse."}, {"t": "p", "x": "Concedici, Signore, la carità apostolica"}, {"t": "p", "x": "di S. Antonio Maria Claret, nostro Padre."}, {"t": "p", "x": "Insegnaci in ogni tempo, come egli fece,"}, {"t": "p", "x": "ciò che hai a cuore,"}, {"t": "p", "x": "ciò che è giusto e ciò che costruisce il tuo Regno"}, {"t": "p", "x": "in mezzo agli uomini."}, {"t": "p", "x": "Te lo chiediamo per Gesù Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "45", "num": "9.1", "title": "Carità apostolica", "theme": "consagracion", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Dio mio!"}, {"t": "p", "x": "Donami carità apostolica,"}, {"t": "p", "x": "così da operare sempre con fortezza e soavemente,"}, {"t": "p", "x": "con mitezza e carità."}, {"t": "p", "x": "Amen."}]}, {"id": "46", "num": "9.2", "title": "Pratica delle virtù", "theme": "consagracion", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Gesù, donami grazia per imitarti fedelmente"}, {"t": "p", "x": "nella pratica di ogni virtù."}, {"t": "p", "x": "Con te posso tutto, senza di te assolutamente nulla."}, {"t": "p", "x": "Amen."}]}, {"id": "47", "num": "9.3", "title": "Povertà", "theme": "consagracion", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Salvatore nostro,"}, {"t": "p", "x": "ti sei fatto povero,"}, {"t": "p", "x": "povero volesti nascere,"}, {"t": "p", "x": "poveramente vivere e morire nella più assoluta povertà."}, {"t": "p", "x": "Fa’ che noi tuoi missionari conosciamo"}, {"t": "p", "x": "il valore della povertà, che l’amiamo e la pratichiamo"}, {"t": "p", "x": "come Tu insegni,"}, {"t": "p", "x": "con le parole e coi fatti;"}, {"t": "p", "x": "e che, ad esempio degli Apostoli,"}, {"t": "p", "x": "lasciamo tutto per seguirti nell’annuncio del Vangelo."}, {"t": "p", "x": "Amen."}]}, {"id": "48", "num": "9.4", "title": "Mitezza", "theme": "consagracion", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "Dio mio,"}, {"t": "p", "x": "donami uno zelo discreto e prudente"}, {"t": "p", "x": "perché operi in ogni cosa"}, {"t": "p", "x": "fortemente e soavemente,"}, {"t": "p", "x": "con mansuetudine e buone maniere."}, {"t": "p", "x": "Aiutami a comportarmi sempre"}, {"t": "p", "x": "con santa prudenza,"}, {"t": "p", "x": "coltivata nello studio,"}, {"t": "p", "x": "resa forte dall’età,"}, {"t": "p", "x": "schiarita nel dialogo"}, {"t": "p", "x": "e consumata nell’esperienza degli avvenimenti."}, {"t": "p", "x": "Amen."}]}, {"id": "49", "num": "9.5", "title": "Mortificazione", "theme": "consagracion", "sub": "del Padre Fondatore", "tags": [], "lines": [{"t": "p", "x": "O Signore,"}, {"t": "p", "x": "so bene che le pene, i dolori e le fatiche"}, {"t": "p", "x": "sono la divisa dell’apostolo."}, {"t": "p", "x": "Con la tua grazia,"}, {"t": "p", "x": "abbraccio tutto."}, {"t": "p", "x": "Aiutami Tu, Signore,"}, {"t": "p", "x": "a bere il calice di pene interiori"}, {"t": "p", "x": "e a ricevere il battesimo delle pene esteriori."}, {"t": "p", "x": "Fa’ che io non mi glori d’altra cosa"}, {"t": "p", "x": "se non della croce sulla quale Tu sei inchiodato per me."}, {"t": "p", "x": "Amen."}, {"t": "p", "x": "b) DELLA CONGREGAZIONE"}]}, {"id": "50", "num": "9.6", "title": "La nostra consacrazione", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Dio e Padre mio,"}, {"t": "p", "x": "rispondendo alla tua chiamata"}, {"t": "p", "x": "voglio procurare con maggiore impegno"}, {"t": "p", "x": "che si compia sempre la tua volontà."}, {"t": "p", "x": "Desidero con tutto il cuore di dedicarmi pienamente a Te,"}, {"t": "p", "x": "seguendo Gesù, come gli Apostoli,"}, {"t": "p", "x": "perché tutti gli uomini abbiano vita in abbondanza."}, {"t": "p", "x": "Spinto dallo Spirito Santo,"}, {"t": "p", "x": "rinnovo la mia donazione a Te, Padre,"}, {"t": "p", "x": "perché mi configuri ad immagine e somiglianza"}, {"t": "p", "x": "del tuo Figlio Gesù."}, {"t": "p", "x": "Fiducioso nella materna assistenza"}, {"t": "p", "x": "del Cuore Immacolato di Maria,"}, {"t": "p", "x": "ti prometto di vivere in questa comunità di vita apostolica,"}, {"t": "p", "x": "casto, povero ed obbediente,"}, {"t": "p", "x": "osservando le Costituzioni della nostra Congregazione"}, {"t": "p", "x": "con tutta la cura possibile."}, {"t": "p", "x": "Mi unga, Padre Santo, il tuo Spirito di santità,"}, {"t": "p", "x": "perché nel servizio della Parola"}, {"t": "p", "x": "sia fedele al carisma di S. Antonio Maria Claret"}, {"t": "p", "x": "e raggiunga la perfezione nel comandamento dell’amore."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "51", "num": "9.7", "title": "Configurazione a Cristo", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Grazie o Padre, perché ci hai unto col tuo Spirito"}, {"t": "p", "x": "e ci hai reso partecipi della pienezza di Cristo, tuo Figlio."}, {"t": "p", "x": "Sii benedetto per averci chiamato a seguirlo,"}, {"t": "p", "x": "e a collaborare con Lui nell’opera che Tu gli affidasti."}, {"t": "p", "x": "Ti chiediamo che, penetrati dal suo Spirito,"}, {"t": "p", "x": "non siamo noi più a vivere,"}, {"t": "p", "x": "ma sia Cristo che realmente viva in noi,"}, {"t": "p", "x": "al fine di essere validi strumenti nell’annuncio"}, {"t": "p", "x": "del Regno dei cieli."}, {"t": "p", "x": "Fa’ che conseguiamo la configurazione a Cristo"}, {"t": "p", "x": "nella nostra comunità missionaria"}, {"t": "p", "x": "secondo il nostro specifico carisma nella Chiesa."}, {"t": "p", "x": "Egli, che vive e regna nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "52", "num": "9.8", "title": "Identificazione con Cristo Gesù", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Preghiamo il Padre che ci ha unti con lo Spirito Santo e ci ha resi partecipi della pienezza del suo Figlio Gesù Cristo:"}, {"t": "p", "x": "Santifica i tuoi fratelli, Signore!"}, {"t": "p", "x": "Perché ci lasciamo invadere dalla grazia, fino a che non siamo più noi a vivere, ma sia Cristo a vivere in noi, onde così essere strumenti validi nell’annuncio del Regno. Preghiamo."}, {"t": "p", "x": "Perché, come Gesù, spinti da un ardente amore al Padre e agli uomini, ci sforziamo con tutti i nostri mezzi di conseguire che Dio sia amato, conosciuto e servito da tutti. Preghiamo."}, {"t": "p", "x": "Perché diamo gloria a Dio per tutti i doni che riteniamo di possedere e li facciamo fruttificare copiosamente. Preghiamo."}, {"t": "p", "x": "Perché siamo disposti a confessare i nostri difetti ed errori, a chiedere perdono ai nostri fratelli e a stare in mezzo a loro come coloro che servono. Preghiamo."}, {"t": "p", "x": "Perché ci sforziamo di imitare la mitezza proposta nel Vangelo come segno della nostra vocazione apostolica. Preghiamo."}, {"t": "p", "x": "Perché, come stranieri e pellegrini, ci asteniamo dai cattivi desideri e custodiamo con cura diligente i nostri sensi, glorificando Dio e riflettendo nel nostro corpo la sua santità. Preghiamo."}, {"t": "p", "x": "Perché i nostri infermi sopportino la malattia umilmente e sottomessi alla volontà di Dio, sapendo che con la loro debolezza completano ciò che manca alla passione di Cristo. Preghiamo."}]}, {"id": "53", "num": "9.9", "title": "Il dono della castità", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Ti benediciamo, Dio nostro, perché ci hai concesso"}, {"t": "p", "x": "il dono della castità per il Regno dei cieli,"}, {"t": "p", "x": "grazie al quale possiamo consacrarci con tutto il cuore"}, {"t": "p", "x": "alle cose del Padre,"}, {"t": "p", "x": "ad imitazione di Gesù Cristo"}, {"t": "p", "x": "e secondo l’esempio della Vergine Maria."}, {"t": "p", "x": "Chiediamo umilmente il tuo aiuto, Signore,"}, {"t": "p", "x": "per dominare le inclinazioni della nostra natura,"}, {"t": "p", "x": "ricevere con gioia il dono della castità"}, {"t": "p", "x": "e coltivarlo con ogni diligenza."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "54", "num": "9.10", "title": "Castità", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Benedetto sii, Signore,"}, {"t": "p", "x": "perché, col dono della castità per il Regno dei cieli,"}, {"t": "p", "x": "si manifesti il potere della tua gloria"}, {"t": "p", "x": "nella fragilità della nostra natura"}, {"t": "p", "x": "al fine di incoraggiare negli uomini la speranza"}, {"t": "p", "x": "della vita futura."}, {"t": "p", "x": "Fa’ che la castità che professiamo"}, {"t": "p", "x": "favorisca in Cristo una nuova comunione fraterna"}, {"t": "p", "x": "e costruisca una comunità"}, {"t": "p", "x": "che non si fondi nella carne o nel sangue,"}, {"t": "p", "x": "ma sulla tua volontà."}, {"t": "p", "x": "E, come segno di amore perfetto,"}, {"t": "p", "x": "diventi una fonte speciale di fecondità spirituale"}, {"t": "p", "x": "per il mondo"}, {"t": "p", "x": "e ci infiammi d’amore per Te e per tutti gli uomini."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "55", "num": "9.11", "title": "Tu, da ricco che eri", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Tu, da ricco che eri,"}, {"t": "p", "x": "ti sei fatto povero per noi"}, {"t": "p", "x": "perché noi diventassimo ricchi."}, {"t": "p", "x": "Dedito all’annuncio della Buona Novella del Regno,"}, {"t": "p", "x": "non avevi dove reclinare il capo."}, {"t": "p", "x": "Donaci di condividere la tua povertà,"}, {"t": "p", "x": "per ricordare agli uomini i beni del mondo futuro,"}, {"t": "p", "x": "per vivere come Maria, la prima fra i poveri del Signore,"}, {"t": "p", "x": "e a somiglianza degli Apostoli che, abbandonando tutto,"}, {"t": "p", "x": "ti seguirono."}, {"t": "p", "x": "Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "56", "num": "9.12", "title": "Cercare prima di tutto il Regno di Dio", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Ti preghiamo, Signore,"}, {"t": "p", "x": "che riponendo in Te tutta la nostra fiducia,"}, {"t": "p", "x": "e mai nel potere e nelle ricchezze,"}, {"t": "p", "x": "cerchiamo prima di tutto il Regno che appartiene ai poveri."}, {"t": "p", "x": "Amen."}]}, {"id": "57", "num": "9.13", "title": "Comunione dei beni", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Concedici, Signore,"}, {"t": "p", "x": "che con la nostra povertà volontaria"}, {"t": "p", "x": "costruiamo la comunità fraterna"}, {"t": "p", "x": "nell’unità di cuore e di spirito"}, {"t": "p", "x": "e la esprimiamo nella comunione dei beni,"}, {"t": "p", "x": "spirituali e materiali,"}, {"t": "p", "x": "con i poveri e al loro servizio."}, {"t": "p", "x": "Amen."}]}, {"id": "58", "num": "9.14", "title": "Povertà", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Ti rendiamo grazie, Padre santo,"}, {"t": "p", "x": "perché hai voluto manifestarci il valore della povertà"}, {"t": "p", "x": "e la beatitudine di coloro che non pongono il loro interesse"}, {"t": "p", "x": "nelle ricchezze."}, {"t": "p", "x": "Concedici che tutta la nostra vita e la nostra attività"}, {"t": "p", "x": "siano informate dallo spirito della povertà."}, {"t": "p", "x": "Fa’ che siamo poveri di fatto e di spirito"}, {"t": "p", "x": "e che ci sentiamo obbligati dalla comune legge del lavoro,"}, {"t": "p", "x": "condividendo la condizione dei poveri."}, {"t": "p", "x": "Che i nostri beni, inoltre, siano a disposizione degli altri,"}, {"t": "p", "x": "e ci rallegriamo quando sperimentiamo"}, {"t": "p", "x": "alcuni effetti della povertà,"}, {"t": "p", "x": "non dubitando mai della tua provvidenza."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "59", "num": "9.15", "title": "Per compiere la tua volontà", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Per compiere la tua volontà, Padre,"}, {"t": "p", "x": "ci hai mandato tuo Figlio Gesù."}, {"t": "p", "x": "A esempio della Santissima Vergine,"}, {"t": "p", "x": "che, come serva del Signore, si consacrò totalmente"}, {"t": "p", "x": "all’opera del Figlio,"}, {"t": "p", "x": "ti offriamo"}, {"t": "p", "x": "la libera facoltà di ordinare la nostra vita"}, {"t": "p", "x": "per configurarci a Gesù Cristo,"}, {"t": "p", "x": "che si fece obbediente fino alla morte di croce,"}, {"t": "p", "x": "e unirci in tutto alla tua volontà salvifica."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "60", "num": "9.16", "title": "Obbedienti nella missione", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Condividendo la stessa vocazione,"}, {"t": "p", "x": "vogliamo cercare insieme, Signore, la tua volontà"}, {"t": "p", "x": "per portare a compimento la nostra missione nella Chiesa."}, {"t": "p", "x": "Illumina coloro che esprimono l’unità di amore"}, {"t": "p", "x": "e di missione nella comunità"}, {"t": "p", "x": "perché promuovano la cooperazione di tutti"}, {"t": "p", "x": "al bene della Chiesa e della Congregazione;"}, {"t": "p", "x": "e fa’ che tutti, spinti dall’amore,"}, {"t": "p", "x": "sappiamo obbedire con prontezza e perfettamente."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "61", "num": "9.17", "title": "Obbedienza", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Ti rendiamo grazie, Padre,"}, {"t": "p", "x": "perché ci concedi la libera facoltà"}, {"t": "p", "x": "di disporre della nostra vita"}, {"t": "p", "x": "e con la forza del tuo Spirito ci muovi a donartela."}, {"t": "p", "x": "Grazie per averci chiamati a configurarci"}, {"t": "p", "x": "al tuo Figlio Gesù Cristo"}, {"t": "p", "x": "nella sua obbedienza fino alla morte di croce."}, {"t": "p", "x": "Sii benedetto per aver voluto"}, {"t": "p", "x": "che in Lui partecipiamo della tua volontà salvifica."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "62", "num": "9.18", "title": "Obbedienza in comunione", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Signore, concedi a noi"}, {"t": "p", "x": "di cercare, conoscere e compiere insieme la tua volontà,"}, {"t": "p", "x": "al fine di realizzare la missione comune"}, {"t": "p", "x": "che ci caratterizza nella Chiesa."}, {"t": "p", "x": "Concedici che nella ricerca"}, {"t": "p", "x": "e nel compimento della tua volontà,"}, {"t": "p", "x": "ci obblighiamo ad offrire il nostro aiuto ai fratelli"}, {"t": "p", "x": "con la preghiera, il consiglio e il dialogo solidale."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "63", "num": "9.19", "title": "Per i Superiori", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Rafforza i nostri Superiori, Signore,"}, {"t": "p", "x": "perché ricerchino prima di tutto la tua volontà,"}, {"t": "p", "x": "esercitino l’autorità secondo le Costituzioni"}, {"t": "p", "x": "e in spirito di servizio,"}, {"t": "p", "x": "fino a dare la vita per i fratelli."}, {"t": "p", "x": "E concedi a noi tutti che,"}, {"t": "p", "x": "spinti dall’amore,"}, {"t": "p", "x": "ti obbediamo con prontezza e perfettamente,"}, {"t": "p", "x": "sottomettendoci agli uomini per Te."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "64", "num": "9.20", "title": "Disponibilità", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Concedi a noi il dono della disponibilità, Signore,"}, {"t": "p", "x": "per essere inviati in qualunque parte del mondo,"}, {"t": "p", "x": "per porre tutte le nostre energie"}, {"t": "p", "x": "al servizio del ministero"}, {"t": "p", "x": "che ci sia affidato dalla Congregazione."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "65", "num": "9.21", "title": "Imitare la preghiera di Gesù", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Dio onnipotente ed eterno"}, {"t": "p", "x": "che hai ritenuto cosa buona associarci"}, {"t": "p", "x": "all’opera missionaria di Gesù Cristo:"}, {"t": "p", "x": "apri il nostro cuore"}, {"t": "p", "x": "perché ci convertiamo al Vangelo,"}, {"t": "p", "x": "e donaci costanza per imitarlo"}, {"t": "p", "x": "nella sua preghiera assidua."}, {"t": "p", "x": "Per lo stesso Gesù Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "66", "num": "9.22", "title": "Progresso nella carità", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Padre misericordioso,"}, {"t": "p", "x": "concedi che la carità di Cristo ci solleciti"}, {"t": "p", "x": "con lo stesso amore con cui Tu ci ami,"}, {"t": "p", "x": "e che con fortezza di spirito"}, {"t": "p", "x": "siamo disposti ogni giorno"}, {"t": "p", "x": "a morire per i nostri fratelli."}, {"t": "p", "x": "Fa’ che, come stranieri e pellegrini,"}, {"t": "p", "x": "ci asteniamo dai desideri della carne,"}, {"t": "p", "x": "custodiamo con diligente attenzione"}, {"t": "p", "x": "i nostri sensi"}, {"t": "p", "x": "e ci rallegriamo in ogni avversità."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "67", "num": "9.23", "title": "La carità di Cristo ci spinge", "theme": "consagracion", "sub": "della Congregazione", "tags": [], "lines": [{"t": "p", "x": "Padre santo,"}, {"t": "p", "x": "Gesù Cristo, spinto da un ardente amore per Te"}, {"t": "p", "x": "e per gli uomini,"}, {"t": "p", "x": "si donò al lavoro, alla passione e alla morte."}, {"t": "p", "x": "Concedi a noi la carità apostolica e la gioia dello Spirito"}, {"t": "p", "x": "al fine di conseguire"}, {"t": "p", "x": "che tutti gli uomini ti conoscano, ti amino, ti servano"}, {"t": "p", "x": "e raggiungano la beatitudine del tuo Regno."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "113", "num": "9.24", "title": "Illumina con la luce della fede i nostri cuori, o Signore,", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "e accendili nel fuoco della carità,"}, {"t": "p", "x": "affinché adoriamo, in spirito e verità,"}, {"t": "p", "x": "Colui che riconosciamo presente in questo Sacramento,"}, {"t": "p", "x": "nostro Dio e Signore."}, {"t": "p", "x": "Egli vive e regna nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "114", "num": "9.25", "title": "O Dio, che hai redento tutti gli uomini", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "col mistero pasquale di Cristo"}, {"t": "p", "x": "che in questo Sacramento offre se stesso per i fratelli,"}, {"t": "p", "x": "concedi a noi che, venerando costantemente"}, {"t": "p", "x": "il mistero della nostra redenzione,"}, {"t": "p", "x": "meritiamo di conseguirne il frutto"}, {"t": "p", "x": "e di suscitare negli uomini"}, {"t": "p", "x": "il ricordo della presenza del Signore."}, {"t": "p", "x": "Per lo stesso Gesù Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "115", "num": "9.26", "title": "Che il Sacramento dell’Eucaristia, o Signore,", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "riempia i nostri cuori del tuo amore e di zelo apostolico"}, {"t": "p", "x": "e ci spinga a desiderare"}, {"t": "p", "x": "che tutti gli uomini ti conoscano,"}, {"t": "p", "x": "ti amino, ti servano"}, {"t": "p", "x": "e vivano la beatitudine del Regno"}, {"t": "p", "x": "già presente sulla nostra terra."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "116", "num": "9.27", "title": "O Signore, che ci hai resi partecipi", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "di uno stesso pane e di uno stesso Spirito,"}, {"t": "p", "x": "concedi a noi che, uniti a Te, come i tralci alla vite,"}, {"t": "p", "x": "siamo con Te una sola cosa, ed edifichiamo"}, {"t": "p", "x": "la nostra comunione perché il mondo creda."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "117", "num": "9.28", "title": "Signore Gesù, tu che ti sei identificato pienamente", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "con coloro che soffrono"}, {"t": "p", "x": "e che hai detto: “Venite a me"}, {"t": "p", "x": "voi tutti che siete affaticati ed oppressi"}, {"t": "p", "x": "ed io vi ristorerò”,"}, {"t": "p", "x": "noi, solidali con gli uomini che patiscono malattia,"}, {"t": "p", "x": "dolore, ingiustizia ed oppressione,"}, {"t": "p", "x": "veniamo alla tua presenza,"}, {"t": "p", "x": "perché Tu ci accenda nella tua carità"}, {"t": "p", "x": "e noi godiamo nei patimenti,"}, {"t": "p", "x": "ci gloriamo della croce."}, {"t": "p", "x": "Tu che vivi e regni nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "118", "num": "9.29", "title": "Signore, che nel mistero pasquale hai realizzato la salvezza degli uomini,", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "concedi a noi di adorarti presente in questo Sacramento"}, {"t": "p", "x": "e di proclamare con fede ciò che ora veneriamo."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "119", "num": "9.30", "title": "Signore Gesù, infiammaci in quella fede che mosse", "theme": "consagracion", "sub": "Eucaristia", "tags": [], "lines": [{"t": "p", "x": "tanti predicatori della divina Parola"}, {"t": "p", "x": "ad abbracciare con animo lieto"}, {"t": "p", "x": "la povertà, l’abnegazione e il sacrificio,"}, {"t": "p", "x": "al fine di dilatare il tuo Regno."}, {"t": "p", "x": "Te lo chiediamo uniti con tutto il cuore a Te,"}, {"t": "p", "x": "che sei presente nel mistero eucaristico"}, {"t": "p", "x": "che ora veneriamo,"}, {"t": "p", "x": "e la cui vita e ministero condividiamo."}, {"t": "p", "x": "Tu che vivi e regni con il Padre e con lo Spirito Santo"}, {"t": "p", "x": "Nei secoli dei secoli."}, {"t": "p", "x": "Amen."}]}, {"id": "144", "num": "9.31", "title": "Preghiera del P. Fondatore", "theme": "consagracion", "sub": "Esercizi spirituali", "tags": [], "lines": [{"t": "p", "x": "all’inizio degli esercizi"}, {"t": "p", "x": "A te, Vergine Maria, Madre mia,"}, {"t": "p", "x": "che hai conosciuto la consolazione"}, {"t": "p", "x": "di vedere riuniti nel Cenacolo gli Apostoli e i discepoli,"}, {"t": "p", "x": "e la gioia di saperli tutti pieni di Spirito Santo,"}, {"t": "p", "x": "con tutta confidenza, io ti chiedo"}, {"t": "p", "x": "mi ottenga tutte le grazie necessarie"}, {"t": "p", "x": "a far bene e sotto la tua protezione questi esercizi spirituali."}, {"t": "p", "x": "Sostienimi nel proposito di compiere tutto ciò che"}, {"t": "p", "x": "riconosca sia per la maggior gloria di Dio"}, {"t": "p", "x": "e per il bene dell’anima mia."}, {"t": "p", "x": "Soccorrimi e proteggimi, Madre mia, ora e sempre."}, {"t": "p", "x": "Amen."}]}, {"id": "84", "num": "10.1", "title": "Per le vocazioni", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore Gesù Cristo, che hai detto:"}, {"t": "p", "x": "«Pregate il padrone della messe"}, {"t": "p", "x": "perché mandi operai nella sua messe»:"}, {"t": "p", "x": "Ti chiediamo umilmente:"}, {"t": "p", "x": "manda operai nella nostra Congregazione."}, {"t": "p", "x": "Infondi il tuo Spirito in coloro che hai chiamato"}, {"t": "p", "x": "e confermali nella vocazione"}, {"t": "p", "x": "perché annunziando degnamente e fruttuosamente"}, {"t": "p", "x": "il tuo santo Vangelo"}, {"t": "p", "x": "ci chiamiamo e siamo realmente"}, {"t": "p", "x": "Figli del Cuore Immacolato della beata Vergine Maria,"}, {"t": "p", "x": "ti amiamo con tutto il cuore, con le parole e nei fatti,"}, {"t": "p", "x": "e non cessiamo mai di lodarti."}, {"t": "p", "x": "Amen."}]}, {"id": "85", "num": "10.2", "title": "Preghiera per le vocazioni", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore, Tu che chiamasti gli Apostoli"}, {"t": "p", "x": "perché fossero pescatori di uomini,"}, {"t": "p", "x": "chiama alla Famiglia Clarettiana"}, {"t": "p", "x": "nuovi membri"}, {"t": "p", "x": "che siano sale della terra e luce del mondo"}, {"t": "p", "x": "e diffondano in ogni parte la carità"}, {"t": "p", "x": "che incalzava il tuo servo Antonio Maria Claret."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "86", "num": "10.3", "title": "Per intercessione del Cuore Immacolato di Maria", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Dio e Signore nostro,"}, {"t": "p", "x": "che attraverso il Cuore Immacolato di Maria"}, {"t": "p", "x": "hai dato a S. Antonio Maria Claret"}, {"t": "p", "x": "un grande amore verso il tuo Figlio Gesù"}, {"t": "p", "x": "e gli hai ispirato la fondazione"}, {"t": "p", "x": "della Congregazione dei missionari,"}, {"t": "p", "x": "per la salvezza di tutti gli uomini,"}, {"t": "p", "x": "benedici con nuove vocazioni"}, {"t": "p", "x": "la Congregazione Clarettiana,"}, {"t": "p", "x": "e concedici di perseverare sino alla fine"}, {"t": "p", "x": "nell’annuncio del Vangelo."}, {"t": "p", "x": "Amen."}]}, {"id": "87", "num": "10.4", "title": "Preghiera per chiedere al Signore vocazioni clarettiane", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Signore, per continuare nel mondo intero la grande opera di S. Antonio Maria Claret."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "p", "x": "Signore, per santificare i popoli cristiani con la predicazione ed altre opere apostoliche."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "p", "x": "Signore, per portare la luce del Vangelo a coloro che non lo conoscono."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "p", "x": "Signore, per realizzare il trionfo del Cuore Immacolato di Maria."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "p", "x": "Signore, perché per mezzo del Cuore Immacolato di Maria si compia sempre la tua volontà."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "p", "x": "Signore, affinché tutti siano educati cristianamente e si realizzi una società più giusta e più umana, nel segno della tua volontà."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "p", "x": "Gesù, Tu che sei il primo tra i Figli del Cuore Immacolato di Maria."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "p", "x": "Cuore Immacolato di Maria, Madre di tutti gli uomini."}, {"t": "v", "x": "Mandaci molti e santi Missionari."}, {"t": "rub", "x": "Preghiamo."}, {"t": "p", "x": "Padre nostro,"}, {"t": "p", "x": "che vuoi che tutti gli uomini siano salvi"}, {"t": "p", "x": "e giungano alla conoscenza della verità,"}, {"t": "p", "x": "ti preghiamo:"}, {"t": "p", "x": "manda operai nella tua messe"}, {"t": "p", "x": "e concedi loro di predicare fiduciosamente la tua Parola,"}, {"t": "p", "x": "affinché la verità risplenda e si diffonda;"}, {"t": "p", "x": "e tutti gli uomini conoscano Te, unico e vero Dio."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "88", "num": "10.5", "title": "Per le vocazioni missionarie", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Padre,"}, {"t": "p", "x": "che vuoi che tutti gli uomini siano salvi"}, {"t": "p", "x": "e giungano alla conoscenza della verità,"}, {"t": "p", "x": "attira a Te nuovi seguaci del Figlio tuo,"}, {"t": "p", "x": "sullo stile di S. Antonio Maria Claret,"}, {"t": "p", "x": "ed inviali nel campo del mondo"}, {"t": "p", "x": "perché predichino il Vangelo a tutte le creature,"}, {"t": "p", "x": "e il tuo popolo, radunato dalla Parola di vita"}, {"t": "p", "x": "e sostenuto dalla forza dei sacramenti,"}, {"t": "p", "x": "cammini sui sentieri della salvezza e dell’amore."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "89", "num": "10.6", "title": "Preghiera per le vocazioni e la perseveranza", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Tu hai detto, Signore, che la messe è molta,"}, {"t": "p", "x": "gli operai sono pochi,"}, {"t": "p", "x": "e vuoi che si moltiplichi"}, {"t": "p", "x": "il numero di apostoli e di evangelizzatori"}, {"t": "p", "x": "che dilatino il tuo Regno e trasformino la faccia della terra."}, {"t": "p", "x": "Ti preghiamo: aumenta il numero"}, {"t": "p", "x": "e la qualità evangelica di coloro che lavorano"}, {"t": "p", "x": "al bene degli uomini."}, {"t": "p", "x": "Ti ringraziamo delle vocazioni che ci hai concesso"}, {"t": "p", "x": "per l’intercessione del Cuore Immacolato di Maria, nostra Madre."}, {"t": "p", "x": "Concedici la tua presenza e la tua assistenza,"}, {"t": "p", "x": "perché tante vocazioni bussino ancora al nostro Istituto,"}, {"t": "p", "x": "e aiutaci tutti a perseverare nella nostra vocazione."}, {"t": "p", "x": "Per Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "90", "num": "10.7", "title": "Per le vocazioni a tutti gli stati di vita e a tutti i ministeri", "theme": "vocaciones", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Illuminati e sostenuti dalla tua Parola, Signore,"}, {"t": "p", "x": "ti preghiamo per tutti coloro"}, {"t": "p", "x": "che hanno già udito la tua chiamata e l’hanno seguita."}, {"t": "p", "x": "Ti preghiamo, ascoltaci."}, {"t": "p", "x": "Per il Papa, i Vescovi, i Presbiteri, i Diaconi,"}, {"t": "p", "x": "e per i Missionari e tutti i Consacrati,"}, {"t": "p", "x": "perché vivano gioiosamente la loro vocazione"}, {"t": "p", "x": "e con la loro vita e la loro parola ti rendano presente"}, {"t": "p", "x": "in mezzo agli uomini."}, {"t": "p", "x": "Ti preghiamo, ascoltaci."}, {"t": "p", "x": "Per i Laici e i Secolari"}, {"t": "p", "x": "che lavorano generosamente"}, {"t": "p", "x": "nei ministeri istituiti della Chiesa"}, {"t": "p", "x": "e nelle opere necessarie alla comunità."}, {"t": "p", "x": "Ti preghiamo, ascoltaci."}, {"t": "p", "x": "Sostienili nelle difficoltà,"}, {"t": "p", "x": "confortali nelle sofferenze,"}, {"t": "p", "x": "assistili nella solitudine,"}, {"t": "p", "x": "proteggili nella persecuzione"}, {"t": "p", "x": "e confermali nella fedeltà"}, {"t": "p", "x": "Ti preghiamo, ascoltaci."}, {"t": "p", "x": "Ti preghiamo, Signore,"}, {"t": "p", "x": "per coloro che aprono il loro cuore alla tua chiamata"}, {"t": "p", "x": "e si preparano a seguirla."}, {"t": "p", "x": "Ti preghiamo, ascoltaci."}, {"t": "p", "x": "Che la tua Parola li illumini,"}, {"t": "p", "x": "la tua persona li conquisti,"}, {"t": "p", "x": "il tuo Spirito li guidi alla meta"}, {"t": "p", "x": "della professione religiosa o degli ordini sacri."}, {"t": "p", "x": "Ti preghiamo, ascoltaci."}, {"t": "p", "x": "Sii per loro, Signore, rocca e roccia"}, {"t": "p", "x": "e fa’ che trovino chi li possa"}, {"t": "p", "x": "consigliare, accompagnare e sostenere"}, {"t": "p", "x": "con la forza di convinzione e di amore"}, {"t": "p", "x": "che Tu solo puoi comunicare."}, {"t": "p", "x": "Ti preghiamo, ascoltaci."}, {"t": "p", "x": "Te lo chiediamo per Gesù Cristo nostro Signore."}, {"t": "p", "x": "Amen."}]}, {"id": "186", "num": "11.1", "title": "PREGHIERA PER IL CAPITOLO", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "O Spirito Divino,"}, {"t": "p", "x": "che inviato dal Padre nel nome di Gesù,"}, {"t": "p", "x": "assisti e guidi infallibilmente la Chiesa,"}, {"t": "p", "x": "infondi sul Capitolo la pienezza dei tuoi doni."}, {"t": "p", "x": "O soave Maestro e Consolatore,"}, {"t": "p", "x": "illumina le menti dei Capitolari;"}, {"t": "p", "x": "fa’ che da questo Capitolo scaturiscano frutti abbondanti,"}, {"t": "p", "x": "nuovo vigore nell’impegno alla santificazione"}, {"t": "p", "x": "e all’apostolato,"}, {"t": "p", "x": "specialmente alla diffusione della luce"}, {"t": "p", "x": "e della forza del Vangelo fra gli uomini."}, {"t": "p", "x": "Ospite dolce dei cuori,"}, {"t": "p", "x": "conferma le menti nella verità,"}, {"t": "p", "x": "disponi il cuore di tutti all’obbedienza"}, {"t": "p", "x": "perché le conclusioni del Capitolo"}, {"t": "p", "x": "trovino accoglienza generosa e compimento."}, {"t": "p", "x": "Rinnova nella nostra Congregazione,"}, {"t": "p", "x": "e in ciascuno di noi,"}, {"t": "p", "x": "lo spirito che animò Sant’Antonio Maria Claret,"}, {"t": "p", "x": "nostro Padre."}, {"t": "p", "x": "Concedici che,"}, {"t": "p", "x": "riuniti in preghiera unanime ed intensa"}, {"t": "p", "x": "intorno al Cuore di Maria, nostra Madre,"}, {"t": "p", "x": "procuriamo sempre e soltanto"}, {"t": "p", "x": "la maggior gloria di Dio e la salvezza delle anime."}, {"t": "p", "x": "Amen."}]}, {"id": "187", "num": "11.2", "title": "PRECI PER IL CAPITOLO", "theme": "capitulos", "sub": null, "tags": [], "lines": [{"t": "p", "x": "Glorifichiamo il Padre che ci ha chiamati nel suo Figlio Gesù a condividere la vita missionaria, e diciamogli:"}, {"t": "p", "x": "Donaci l’unzione del tuo Spirito."}, {"t": "p", "x": "Ci hai chiamati in una Congregazione missionaria,"}, {"t": "v", "x": "fa’ che, guidati dallo Spirito, i capitolari cerchino la fedeltà all’annuncio del Regno."}, {"t": "p", "x": "Ci hai chiamati a seguire Gesù, l’inviato del Padre,"}, {"t": "v", "x": "l’unzione del tuo Spirito ci abiliti ad essere testimoni della sua Risurrezione."}, {"t": "p", "x": "Resi forti dalla viva memoria del nostro Padre Fondatore, Sant’Antonio Maria Claret,"}, {"t": "v", "x": "ti preghiamo: il Capitolo ricerchi la gloria di Dio, la santificazione dei missionari e la salvezza degli uomini di tutto il mondo."}, {"t": "p", "x": "Spinti dall’amore per Dio e per i fratelli, che è stato riversato nei nostri cuori,"}, {"t": "v", "x": "ti chiediamo: concedi a noi di costruire le nostre comunità in un progetto comune di missione, per annunciare e per vivere il Vangelo."}
