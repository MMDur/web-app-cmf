s circunstancias del propio país235."}, {"num": 241, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Se establece un período de seis meses de preparación para la profesión perpetua, durante el cual el candidato intensificará el tiempo de su oración personal, renovará los fundamentos teóricos y vivenciales de la vida religiosa y hará evaluación de su vida misionera en diálogo más asiduo con el formador. La aplicación de esta norma es más necesaria para quienes residen fuera del centro de formación."}, {"num": 242, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Para que nuestros estudiantes puedan ser promovidos a las Órdenes se requiere: a) La edad prescrita para cada Orden; b) Vocación para las Órdenes en la Congregación; c) Que, después de haber sido examinados, hayan sido considerados idóneos para el ministerio; d) Formación teológica y pastoral prescrita por la Iglesia; e) Que tengan las virtudes exigidas para el ejercicio del ministerio; f) Antes del diaconado haber emitido la profesión perpetua (can 1037); g) Haber realizado la preparación inmediata indicada por nuestras normas236."}, {"num": 243, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Los Superiores Mayores: a) No están obligados a promover a sus estudiantes a las Órdenes. b) Deberán cerciorarse en todo caso sobre la idoneidad de los mismos para ser promovidos. Para ello los miembros de la comunidad están obligados a informar al Superior Mayor sobre la idoneidad de los candidatos al diaconado y presbiterado. c) Necesitan el voto deliberativo de sus consultores para la aprobación (n. 457 f). d) Pueden conceder las letras dimisorias a los miembros de los respectivos Organismos que hayan de ordenarse (can 1019 § 1). e) Pueden conferir los Ministerios a sus súbditos profesos237 y delegar a otro. f) Comunicarán la ordenación al párroco del lugar donde fue bautizado el ordenado (can 1054, 535 § 2)."}, {"num": 244, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "El título de ordenación de los nuestros es el de \"Mesa común\"."}, {"num": 245, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "En los últimos años de los estudios es necesario orientar a cada formando hacia un área determinada de la pastoral y decidir la especialización más conveniente, en diálogo del Superior Mayor y del formador con el interesado y en sintonía con las opciones de la Congregación, teniendo en cuenta las necesidades del Organismo y de la Congregación en general."}, {"num": 246, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Corresponde al Superior Mayor del formando determinar el lugar, tiempo, modo y programa de la formación \"pastoral\" en sentido estricto, teniendo presente las normas de los cánones 255-258 y las orientaciones dadas por las Conferencias de Obispos o Superiores religiosos del propio país."}, {"num": 247, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Es necesario y urgente que las Provincias y Delegaciones Independientes procuren la formación de verdaderos especialistas en ciencias eclesiásticas, pastorales y antropológicas, para una acción misionera más profunda y para contribuir a la formación primera y permanente de los miembros de la Congregación."}, {"num": 248, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "2", "articulo_title": "El Prefecto de los misioneros en formación", "seccion": null, "text": "Los Prefectos son nombrados por el Superior Mayor con el consentimiento de su Consejo (n. 457 a)."}, {"num": 249, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "2", "articulo_title": "El Prefecto de los misioneros en formación", "seccion": null, "text": "El Prefecto y el equipo de formadores han de tener la necesaria madurez humana, vida espiritual seria, ejemplaridad, amor a la Congregación y a su propia vocación, sentido eclesial y sensibilidad misionera, una adecuada experiencia pastoral, así como capacidad de adaptación y de sintonía con los jóvenes."}, {"num": 250, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "2", "articulo_title": "El Prefecto de los misioneros en formación", "seccion": null, "text": "Deberes del Prefecto son: - amar igualmente a todos y conocer las necesidades de cada uno (CC 77) - inspirar a los formandos, con su vida y con su palabra, el amor a la Iglesia y a la Congregación y exponerles su vida y misión en el mundo; - ayudar personalmente a los formandos a afianzarse en su vocación y a vivirla con gozo; - coordinar todos los aspectos de la formación; - fomentar la responsabilidad y disciplina interior de cada formando y animar la comunión de vida entre todos."}, {"num": 251, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "2", "articulo_title": "El Prefecto de los misioneros en formación", "seccion": null, "text": "Aunque la formación de los Misioneros está directamente confiada al Prefecto, éste cumplirá su misión en comunión con el Superior Local. Ambos han de ser para los formandos ejemplo de unidad y concordia. Cada uno desde la misión que le ha sido confiada buscará la mejor formación de los jóvenes misioneros238. Previo diálogo con el Superior, el Prefecto informará periódicamente al Superior Mayor sobre la marcha de la comunidad formativa y sobre cada uno de los formandos."}, {"num": 252, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": null, "articulo_title": null, "seccion": null, "text": "a) En conformidad con el propósito del Fundador y con la enseñanza de la Iglesia239, nuestra comunidad se compone de clérigos y laicos que comparten un único proyecto misionero que los asocia íntimamente en la vida, la acción apostólica y las obras comunes de la Congregación para el servicio del Reino (CC 7). b) En la Congregación se reconocen tres categorías estables de personas: Hermanos, Diáconos permanentes y Presbíteros240 . c) Cada una de estas tres categorías expresa una vocación completa desde el punto de vista eclesial y religioso y, al mismo tiempo, con su don peculiar enriquece la índole pluriforme de nuestra comunidad y la capacita para su servicio misionero."}, {"num": 253, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "1", "articulo_title": "Los Misioneros Hermanos", "seccion": null, "text": "Por su profesión religiosa nuestros Misioneros Hermanos participan plenamente de la naturaleza de la Congregación y son llamados a actuar la misión evangelizadora de ésta mediante sus propias funciones laicales y en unión con los diáconos y presbíteros241."}, {"num": 254, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "1", "articulo_title": "Los Misioneros Hermanos", "seccion": null, "text": "Dentro de la normal planificación de nuestros Organismos se procurará que los Hermanos participen eficazmente en la obra evangelizadora de la Congregación con diversas actividades, como son la catequesis, la animación litúrgica, la educación cristiana y otras acciones propias de ministros no ordenados242. La \"misión ad gentes\" ofrece extraordinarias oportunidades a nuestros Misioneros Hermanos en los diversos ámbitos de la vida laical para una acción apostólica particularmente incisiva243. cf XXII CapGen, acta 17, pp. 63-64. Hay también tareas que, con mucha propiedad son asumidas por los Hermanos, en cuanto estrechamente vinculadas a la organización misionera de la Congregación en sus diversas obras, y que, en muchos casos, piden una capacitación más connatural con los laicos244. Asimismo, pueden colaborar en la misión apostólica de la Congregación con tareas de orden comunitario interno, si la comunidad así lo acordara vistas las cualidades y aptitudes técnicas de cada uno y las necesidades de la comunidad misma, y con la conveniente preparación (n. 152)."}, {"num": 255, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "1", "articulo_title": "Los Misioneros Hermanos", "seccion": null, "text": "Es obligación de los Superiores Mayores cuidar que nuestros Misioneros Hermanos tengan la formación común a todos los miembros del Instituto y que se respeten todos los períodos y modalidades que para ella se han señalado más arriba (cap. IX-XI). Deben también procurarles una formación específica que los prepare para los servicios misioneros y oficios que han de desempeñar. Por su parte, esfuércense los Hermanos, durante toda su vida, en perfeccionar su cultura doctrinal, espiritual y técnica, aprovechando las oportunidades que para ello se les ofrezcan según los planes de formación permanente que deben existir en todo organismo (nn. 144- 149)245."}, {"num": 256, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "1", "articulo_title": "Los Misioneros Hermanos", "seccion": null, "text": "Cultiven una vida espiritual basada en el conocimiento y aceptación de la índole propia de su vocación misionera, laical y religiosa. Como por vocación han de dar testimonio del Evangelio en las realidades temporales, procuren buscar siempre la unión íntima con Cristo y renovar de continuo su espíritu misionero, conscientes de que el mundo no puede ser transformado ni ofrecido a Dios sin el espíritu de las bienaventuranzas246. A través de las actividades que dentro de la comunidad se les confían, traten los Misioneros Hermanos de ser un fermento de fraternidad que facilite la armonía y potencie la dedicación de todos a las obras de servicio misionero."}, {"num": 257, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "2", "articulo_title": "Los Misioneros Diáconos", "seccion": null, "text": "El diaconado permanente ha sido establecido en la Congregación por razón de su connaturalidad con nuestra vocación especial en el Pueblo de Dios, que es \"el ministerio de la Palabra, por el que comunicamos a los hombres el misterio íntegro de Cristo\" (CC 46). De ahí que, entre las múltiples funciones propias del orden diaconal247, nuestros Misioneros Diáconos hayan de privilegiar la colaboración en la evangelización de los pueblos (CC 50)."}, {"num": 258, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "2", "articulo_title": "Los Misioneros Diáconos", "seccion": null, "text": "Con vistas a este ministerio al que son llamados, nuestros candidatos al diaconado permanente deben realizar un período de formación específica con la duración y cf Pablo VI, Sacrum Diaconatus Ordinem (1967) 22. características señaladas por la competente autoridad eclesiástica y por nuestra Congregación (can 236). Además de los estudios, esta preparación debe incluir la práctica pastoral apropiada."}, {"num": 259, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "2", "articulo_title": "Los Misioneros Diáconos", "seccion": null, "text": "Es competencia del Superior Mayor, con el voto deliberativo de su Consejo, admitir al diaconado permanente a un miembro de la Congregación (n. 457 f). Corresponde también a dicho Superior cuidar de que se cumpla lo que está prescrito por el derecho universal y por la respectiva Conferencia Episcopal, tanto para la concesión como para el ejercicio de este sagrado Orden (can 236, 1031)."}, {"num": 260, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "2", "articulo_title": "Los Misioneros Diáconos", "seccion": null, "text": "En el ejercicio de su ministerio los Misioneros Diáconos han de cultivar la espiritualidad que les es propia, anunciando el Evangelio no sólo con la palabra sino particularmente con el testimonio de la vida. Esta responsabilidad han de sentirla sobre todo cuando, por exigencias de planificación pastoral, les sea confiada más directamente la animación de una comunidad cristiana con el consiguiente cultivo de la misma por medio de los sacramentos que pueden conferir y por un más intenso servicio de la Palabra. De palabra y con el ejemplo deben promover la comunión eclesial, estando íntimamente unidos con el Obispo y los Presbíteros y alentando a los fieles a la activa participación en las iniciativas de la comunidad y en el culto divino. Al dedicarse a obras de caridad y promoción (He 6,1-3), trabajan por reavivar en la comunidad cristiana el sentido de la justicia para que el amor fraterno, sostenido y significado por la Eucaristía, sea ley de vida entre los creyentes. Nuestros Diáconos permanentes deben ser muy asiduos en la lectura espiritual, sobre todo en la Sagrada Escritura y en la oración. Todos los días han de celebrar o rezar aquellas partes de la Liturgia de las Horas que determine la Conferencia Episcopal (can 276 § 2. 3)248."}, {"num": 261, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "Los Misioneros Presbíteros comparten con los Misioneros Hermanos y Diáconos la vida y la misión congregacionales. Como presbíteros son portadores de un peculiar servicio que han de prestar a la fraternidad claretiana, en cuya vida deben participar también asumiendo las tareas comunes que en ella se han de cumplir (n. 152)."}, {"num": 262, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "A los Misioneros Presbíteros incumbe una especial responsabilidad en orden a la creación y maduración de comunidades eclesiales. A esto han de ordenar su servicio de la Palabra, la celebración de la Eucaristía y el empeño por suscitar nuevos evangelizadores, cualquiera sea la estructura pastoral por la que haya optado la Congregación en la diócesis. La función evangelizadora y profética está íntimamente relacionada con las funciones pastoral y sacramental. Por eso, los misioneros presbíteros deben cuidar también la atención pastoral de las comunidades encomendadas y, sobre todo, la celebración de la Eucaristía249. cf ib. 27."}, {"num": 263, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "Tanto en la predicación como en la celebración de los sacramentos y en todo ministerio han de expresar la comunión eclesial mediante la fidelidad al Romano Pontífice y a los Obispos. Asimismo, deben ser activamente partícipes en el presbiterio local y en la vida de la Iglesia diocesana."}, {"num": 264, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "Todo ministerio debe ser realizado con la adecuada preparación. Nuestros Presbíteros han de cuidar particularmente la preparación para el ministerio de la Palabra, mediante la oración y la meditación, el estudio de las ciencias eclesiásticas, el análisis crítico de las situaciones que pasan las comunidades cristianas a las que sirven, y el cultivo de un lenguaje a ellas adecuado. Los Superiores cuidarán que los nuevos Presbíteros sean iniciados en los diversos ministerios de manera progresiva, de forma que dispongan de tiempo para la preparación inmediata y no les falte el acompañamiento de los más expertos."}, {"num": 265, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "Los Presbíteros, en cuanto destinados al ministerio de la divina alabanza, han de hacer propia la oración de la Iglesia. De ahí que hayan de asumir con responsabilidad el deber de la recitación íntegra y cotidiana de la Liturgia de las Horas y enriquecer continuamente a la comunidad con su experiencia de vida litúrgica."}, {"num": 266, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "Conforme a la práctica enseñada por el Padre Fundador, las limosnas o estipendios que se reciben por la celebración de la misa se destinan al sustento de la comunidad250. A este fin habrá en cada comunidad un encargado de recibir esas limosnas y todos celebrarán a su intención. Lo habrá también a nivel provincial y general para facilitar la distribución de las limosnas y las obligaciones adquiridas con sentido de comunicación fraterna. La gestión de estos encargados se regirá por las normas comunes que más adelante se dan para nuestras administraciones (nn. 541 ss)."}, {"num": 267, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "Todos los Presbíteros de la Congregación, a imitación de nuestro Padre Fundador, han de ser asiduos en el ministerio de la reconciliación, facilitando este sacramento a toda clase de personas. Aun aquellos misioneros que, por razón de su edad u otras circunstancias, se encuentran impedidos para otras obras apostólicas, pueden ayudar eficazmente al crecimiento espiritual del Pueblo de Dios administrando el sacramento de la Penitencia."}, {"num": 268, "parte": "PARTE SEGUNDA", "capitulo": "XII", "capitulo_title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "articulo": "3", "articulo_title": "Los Misioneros Presbíteros", "seccion": null, "text": "Cuando estén impedidos para dedicarse a las obras propias de su ministerio, los Presbíteros, así como también los Diáconos, han de dedicarse a trabajos en servicio de la comunidad o colaborar en las obras apostólicas de ésta251."}, {"num": 269, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Es deber de todos ayudar al misionero que pueda encontrarse en dificultad. Una vida comunitaria de auténtica familia unida en el nombre del Señor252 estimula al cumplimiento de las propias obligaciones y favorece la perseverancia en la vocación."}, {"num": 270, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Consideren los Superiores como su primordial obligación salvaguardar a los misioneros contra las dificultades que puedan encontrar en su perseverancia. Antes de proceder a la separación definitiva o temporal de un misionero, agoten los medios de persuasión y de ayuda que estén a su alcance, teniendo siempre en cuenta el bien común."}, {"num": 271, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los postulantes y novicios pueden abandonar libremente y en cualquier momento la Congregación o ser despedidos por el Superior Mayor por cualquier causa justa (can 653 § 1; Los profesos de votos temporales, cumplido el tiempo de profesión, pueden abandonar libremente la Congregación; asimismo, el Superior Mayor, por causas justas y razonables, oído su Consejo, puede excluirlos de la renovación (can 688 § 1, 689 § 1)."}, {"num": 272, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Superior Mayor, con el consentimiento de su Consejo, puede, al cumplirse el tiempo de los votos, excluir de la renovación o de la emisión de la profesión perpetua al profeso que, a juicio de los peritos, no sea idóneo para vivir en nuestro Instituto por causa de enfermedad, física o psíquica, aun contraída después de la profesión (n. 457 g), a no ser que la enfermedad se hubiere contraído por negligencia del Instituto o por el trabajo realizado en éste (can 689 § 2). No puede ser despedido un profeso de votos temporales que haya caído en demencia, aunque no sea capaz de renovar la profesión (can 689 § 3)."}, {"num": 273, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Superior General, con el consentimiento de su Consejo, puede conceder a los profesos de votos temporales que libre y voluntariamente lo soliciten, el indulto de dejar la Congregación (can 688 § 2; Dir 496 k). Los profesos de votos perpetuos que deseen abandonar la Congregación procederán conforme al can 691 y 692."}, {"num": 274, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Superior Mayor, con el consentimiento de su Consejo (n. 457 i), y con justa causa, puede permitir a un miembro de su jurisdicción que viva fuera de una casa del Instituto, pero no más de un año, a no ser por motivos de enfermedad, de estudios o para ejercer el apostolado en nombre del mismo Instituto, debiendo comunicar al Gobierno General las razones y circunstancias de esta concesión. Si se trata de un clérigo, necesita también las licencias ministeriales otorgadas por el Ordinario del lugar. Para los efectos que señala el canon 665 § 1, ha de considerarse prolongada una ausencia que supere los tres meses. El permiso de ausencia no separa al religioso de la Congregación; solamente le otorga la facultad de permanecer fuera de la casa religiosa por el tiempo señalado en la concesión, manteniéndose plenamente las obligaciones religiosas compatibles con su situación (n. 326)."}, {"num": 275, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Si alguno se ausentara ilegítimamente de la casa religiosa, el Superior Local informará al Superior Mayor. Se indagará con solicitud acerca de su paradero y se le ayudará para que vuelva y persevere en su vocación (can 665 § 2). Si, a pesar de la diligencia de los Superiores, persistiera en su actitud, se le advertirá que, de extenderse a más de seis meses su ausencia, se podrá proceder a su expulsión, conforme al canon 696 § 1. Después de seis meses de ausencia ilegítima, el Superior Mayor debe informar al Superior General. Cuando se hayan superado los dos años de ausencia ilegítima, si no se ha hecho antes, deberá proceder a la expulsión."}, {"num": 276, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Superior General, por causa grave y con el voto deliberativo de su Consejo, puede conceder a un profeso perpetuo indulto de exclaustración, por no más de tres años (n. 496 i). Si se trata de un sacerdote o diácono, es preciso el consentimiento del Ordinario del lugar en que vaya a residir (can 686 § 1). El religioso exclaustrado sigue obligado a los votos, a la vigilancia y cuidado de los Superiores y del Ordinario del lugar (can 687), pero queda libre de las obligaciones que no son compatibles con su nueva condición de vida."}, {"num": 277, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Al religioso claretiano, a quien la Sede Apostólica le impusiera la exclaustración (n. 496 j), se le ayudará caritativamente, en la medida y modo que sea posible, a resolver las dificultades espirituales, morales y materiales que pudiera encontrar en su nueva condición de vida, teniendo en cuenta el género de causas que hubieran motivado la exclaustración (can 686 § 3)."}, {"num": 278, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El sacerdote o diácono que obtuviere rescripto de exclaustración sin ejercicio del ministerio, con la suspensión de sus obligaciones sacerdotales o diaconales y religiosas, conservando solamente las que provienen del voto de castidad, mantiene su incorporación radical a la Congregación, según las modalidades del rescripto."}, {"num": 279, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El diácono o sacerdote que desea pasar al clero secular (secularización), al formular su petición en tal sentido, debe acompañarla con las letras del Obispo que le recibe en su diócesis. Una vez obtenido el rescripto de la Sede Apostólica y mientras no adquiera la plena incardinación en la diócesis, conserva su radical pertenencia a la Congregación, según las modalidades y condiciones señaladas en el rescripto mismo y a ella debe volver si el Obispo receptor le rechazara antes de cumplirse el tiempo de prueba (can 693)."}, {"num": 280, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Si algún sacerdote deseara obtener la dispensa del celibato sacerdotal, que lleva consigo la reintegración en el estado laical y la dispensa de los votos religiosos, podrá ser obligado, a juicio del Superior Mayor, a suspender el ejercicio del ministerio sacerdotal y abandonar la vida de comunidad desde el momento en que presente su solicitud."}, {"num": 281, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "En la expulsión, ya sea de los que \"ipso facto\" se han de considerar expulsados a tenor del derecho universal, ya sea de los profesos temporales o perpetuos, que por causas canónicas puedan o deban ser dimitidos de la Congregación, se observarán fielmente las normas establecidas por el derecho universal (can 694-703). En los casos contemplados en el documento “Orientaciones capitulares sobre algunos asuntos relacionados con el voto de castidad”253, se darán los pasos y se tomarán las decisiones pertinentes en estrecho diálogo con el Superior General."}, {"num": 282, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cualquier prolongación del permiso de ausencia, que supere un año, y que no sea por motivo de enfermedad, estudio o ministerio, según lo dicho en el n. 274, así como la petición de exclaustración o separación de la Congregación, deben ser presentadas al Superior General por el Superior Mayor correspondiente con el voto consultivo de su Consejo, acompañadas de los informes, documentación y pruebas que fueren necesarios según los casos."}, {"num": 283, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "En cada seminario y curia provincial se llevará un registro con una ficha personal de todos los que, por cualquier concepto, se separaron de nuestra Congregación. Hemos de mantener actitudes de apertura y comunión con quienes pertenecieron a la Congregación y, desde su nuevo estado de vida cristiana, desean mantener lazos de fraternidad y de cooperación misionera con ella254."}, {"num": 284, "parte": "PARTE SEGUNDA", "capitulo": "ANEXO", "capitulo_title": "ANEXO A LA PARTE SEGUNDA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La readmisión de quien después de haber profesado, o por iniciativa propia ha dejado legítimamente la Congregación o por decisión de los Superiores ha sido separado de ella, está siempre reservada al Superior General y su Consejo, observadas las normas del derecho universal (can 690 § 1; Dir. 496 h). El mismo Superior General con su Consejo puede dispensarle de la obligación de repetir el noviciado (n. 496 h). En este caso el Superior General le señalará, antes de que sea admitido a la profesión por su Superior Mayor, un tiempo de prueba, transcurrido el cual, podrá ser admitido a los votos temporales por el tiempo que señale el Superior General y que en ningún caso será inferior a un año ni al que le faltaba para la profesión perpetua (can 690 § 1, 655, 657). Carta Circular del Superior General a los Superiores Mayores (11 noviembre 2003). cf XXII CapGen, acta 17."}, {"num": 285, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "1", "articulo_title": "Los Organismos de la Congregación", "seccion": null, "text": "La Congregación está dotada de todos los elementos institucionales necesarios para la realización de su misión (CC 86). Entre estos elementos están los Organismos, que pueden ser Mayores o Menores. a) Son Organismos Mayores: las Provincias y las Delegaciones independientes. b) Son Organismos Menores: las casas y las residencias. c) Las Delegaciones Dependientes, de que hablan las Constituciones (CC 88), no están equiparadas a las Provincias ni se consideran incluidas entre los Organismos Mayores de nuestra legislación, fuera de los casos en los que expresamente se diga. d) Las \"Misiones\" pueden ser Organismos Mayores y Menores, siendo propio de ellas tener un régimen peculiar. Las características especiales de este régimen, además de las indicadas en las Constituciones (CC 109, 121) y en el Directorio (n. 334), serán determinadas en el documento de constitución o en un documento complementario."}, {"num": 286, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "1", "articulo_title": "Los Organismos de la Congregación", "seccion": null, "text": "La declaración de \"Misión\" para un Organismo Mayor o Menor es atribución del Superior General con su Consejo (n. 496 e), cuya decisión habrá de ponerse más tarde en conocimiento del Capítulo General. Este régimen especial habitual se podrá aplicar, aun fuera de los territorios propiamente de misión, siempre que las circunstancias, a juicio del Gobierno General, lo exijan, tanto a las Provincias y Delegaciones como a las casas que encuentren dificultades especiales para la evangelización. Para que la palabra \"Misión\" se entienda en el sentido expresado en este número, se ha de declarar explícitamente."}, {"num": 287, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "2", "articulo_title": "Organismos Mayores", "seccion": null, "text": "En la Congregación puede haber: a) Provincias, y b) Delegaciones Independientes (CC 88). a) Supuesto lo dicho en las Constituciones sobre la Provincia en general (CC 88), para que en la Congregación pueda constituirse un Organismo Mayor como Provincia ha de tener más de 40 miembros profesos perpetuos incardinados255 y un grado de desarrollo que le permita actuar con la debida autonomía el propio régimen directivo, formativo y económico de cara a la misión claretiana dentro de la Iglesia local. Este desarrollo se ha de manifestar no solamente en las obras y en el número de personas en actividad, sino también en el cultivo de las vocaciones del lugar, en un número de formandos que garantice la vitalidad futura del Organismo y su participación en los compromisos universales de la Congregación. Las Provincias pueden establecer, formando parte de las mismas, Delegaciones Dependientes; éstas se constituyen por la unión de varias casas y residencias que presentan . Cf. Annales sept-dic. 1998 p.908 características peculiares de personal, territorio o actividades y son regidas por un superior delegado del Superior Provincial . b) Delegación Independiente es la unión de varias casas y residencias en un determinado territorio, bajo un mismo Superior que la gobierna con potestad delegada del Superior General."}, {"num": 288, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "2", "articulo_title": "Organismos Mayores", "seccion": null, "text": "Siendo los Organismos Mayores la instancia en que las personas ejercen la voz activa a nivel general, se ha de procurar una armonía entre la configuración numérica y la categoría jurídica de los mismos que favorezca también una representación equitativa del Instituto en el Capítulo General."}, {"num": 289, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "2", "articulo_title": "Organismos Mayores", "seccion": null, "text": "La erección y modificación de la condición jurídica de los Organismos Mayores y de las Delegaciones Dependientes pertenece al Superior General con el voto deliberativo de los Consultores (CC 91; Dir 496 d) y ha de hacerse siempre mediante decreto formal. En los procesos de reorganización de Organismos, el Gobierno General podrá determinar una estructura jurídica y un modo de funcionamiento particular, según las circunstancias, con carácter provisional."}, {"num": 290, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "2", "articulo_title": "Organismos Mayores", "seccion": null, "text": "No debe erigirse ni modificarse ningún Organismo Mayor dentro del año que precede a la celebración del Capítulo General Ordinario. Un año antes de la celebración del Capítulo General, el Gobierno General ajustará la condición jurídica de las Provincias que no cuenten con el número de profesos perpetuos requeridos para mantener esta condición jurídica. No debe erigirse ninguna Delegación Dependiente dentro del año que precede al Capítulo Provincial Ordinario."}, {"num": 291, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "2", "articulo_title": "Organismos Mayores", "seccion": null, "text": "Para evitar la erección de Organismos Mayores no viables, procédase gradualmente según las pruebas que ofrezcan de su viabilidad256."}, {"num": 292, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "2", "articulo_title": "Organismos Mayores", "seccion": null, "text": "Cuanto aquí se prescribe para la organización de un Organismo Mayor ha de observarse proporcionalmente para la supresión o modificación (n. 496 d). Cuando un Organismo carece de los elementos arriba descritos, toca al Gobierno General estimular su recuperación e iniciar un período de revisión que permita ajustar la condición jurídica a la realidad en conformidad con nuestra legislación (CC 88)257."}, {"num": 293, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "2", "articulo_title": "Organismos Mayores", "seccion": null, "text": "La división de la Congregación en Organismos Mayores se rige por el principio de territorialidad. El territorio de cada Organismo debe estar bien definido en su decreto de erección y limitado geográficamente en conformidad con las posibilidades reales del Organismo. Dichos límites deberán ajustarse cuando convenga. Para adscribir una casa o residencia a un Organismo Mayor, obsérvense los límites ya legítimamente establecidos. En el momento de encomendar a una determinada Provincia un territorio misional, se establecerán las aplicaciones prácticas del principio de territorialidad en relación con dicha Provincia y con los demás Organismos interesados258. Cf. 1RG 105. El Superior General, con el consentimiento de sus consultores, puede, por razones graves, permitir a un Organismo Mayor fundar una casa en el territorio de otro (n. 496 g), habiendo oído antes al Superior de éste."}, {"num": 294, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "La casa ha de constar, al menos, de tres miembros profesos perpetuos (can 115 § 2)259."}, {"num": 295, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "La residencia es una comunidad sin estabilidad fija (CC 89 y 103), regida por un Delegado del Superior Mayor, revocable \"ad nutum\". a) En el decreto de constitución deberán señalarse las normas especiales por que habrá de regirse. b) Al cesar en su cargo el Superior principal, cesa por el mismo hecho el Delegado; pero de no constar lo contrario, entiéndase que se prorroga la potestad hasta que sea sustituido o confirmado."}, {"num": 296, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "Es causa suficiente para crear una residencia: a) el preparar la fundación de una casa; b).el ejercicio temporal de determinados ministerios; c) el servir de habitación a estudiantes profesos o a encargados de negocios y otras cosas semejantes."}, {"num": 297, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "Todas las casas y residencias deben formar parte de un Organismo Mayor, a no ser que una verdadera necesidad exija que dependan directamente del Superior General o de varios Superiores Mayores o de una Conferencia de Superiores Mayores. Es competencia del Superior General, con el consentimiento de su Consejo, adscribir una casa o residencia a un determinado Organismo, oídas las partes interesadas (n. 496 g)."}, {"num": 298, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "Casas generalicias son aquellas que dependen directamente del Superior General. La constitución de casas generalicias la hará el Superior General con el consentimiento de sus Consultores y oídos los Superiores Mayores a quienes tal vez interese (n. 496 g). Entre las razones que pueden justificar las casas generalicias cabe enumerar las siguientes: a) Una misión peculiar que supere las posibilidades de una Provincia o grupo de Provincias. b) Nuevas fundaciones estratégicas en lugares que no caen bajo la jurisdicción de un Organismo Mayor o que por razones geográficas, étnicas, políticas, etc. no pueden serle encomendadas. c) Casas ya fundadas por un Organismo Mayor, pero que por los motivos mencionados o por otros semejantes no pueden seguir dependiendo del mismo260."}, {"num": 299, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "La urgencia cada vez mayor de planificaciones que rebasan los límites de un Organismo Mayor, especialmente dentro de un mismo país, hacen necesaria la colaboración de varios Organismos en obras comunes. Dichas obras adquieren, por consiguiente, el carácter de interprovinciales y deben ser llevadas a cabo mediante acuerdo entre los Superiores Mayores XXIV CapGen. acta 18. interesados261. La gestión y permanencia de dichas obras podrán exigir también la existencia de casas interprovinciales262. La constitución de casas y residencias interprovinciales corresponde al Superior General con el voto deliberativo de su Consejo (n. 496 g)263. Los Estatutos particulares por los que se rige una comunidad interprovincial han de ser aprobados por el Gobierno General (n. 496 g)264."}, {"num": 300, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "Sobre la constitución y supresión de Organismos Menores: a) La erección, supresión, innovación jurídica o cambio de destino de una casa es competencia del Superior General con el voto deliberativo de su Consejo, a tenor de la Constitución 91 (n. 496 g). Lo solicita el Superior Mayor oído su Consejo (n. 458 f). b) La erección, supresión, innovación jurídica o cambio de destino de una residencia es competencia del Superior Provincial con el voto deliberativo de su Consejo (n. 457 k) y la previa licencia escrita del Superior General c) Para establecer una comunidad en una diócesis, sea casa o residencia, o para cambiar su finalidad apostólica se requiere el consentimiento previo del Obispo diocesano dado por escrito (can 609 § 1; 612). No es necesario, sin embargo, para cambiar la condición jurídica de la comunidad."}, {"num": 301, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "Si pasare un año sin que las casas tengan el número de miembros o los demás requisitos de su condición jurídica, el Superior Mayor deberá informar del caso al Superior General, para que él tome la oportuna determinación."}, {"num": 302, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "En los archivos local, provincial y general se conservará el decreto de constitución o la declaración auténtica, hecha por el Superior Mayor propio, de la condición jurídica de todas y cada una de las comunidades de su jurisdicción."}, {"num": 303, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "Durante los seis meses inmediatamente anteriores a la celebración del Capítulo Provincial Ordinario no se puede cambiar la condición jurídica de las comunidades."}, {"num": 304, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "En la expansión de la Congregación ténganse en cuenta las siguientes normas: a) Asegúrese el adecuado desarrollo de los Organismos existentes antes de crear otros nuevos. b) Cada Organismo tenga un plan de desarrollo preparado según un estudio objetivo de la situación y según el plan de la Congregación. c) Todos los Organismos Mayores participarán en la misión universal de la Congregación, en la medida de sus posibilidades, sea a través de su misión propia a la que han de proveer de personal y medios económicos265, sea a través de una colaboración con otros bajo la coordinación del Gobierno General."}, {"num": 305, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "3", "articulo_title": "Organismos Menores", "seccion": null, "text": "En orden a la fundación o supresión de las casas: a) Adóptese un criterio selectivo estratégico que no impida el desarrollo indispensable de los Organismos en formación y permita responder a los servicios que, en determinados casos, nos pida la Iglesia266. b) Suprímanse o transfórmense las casas que objetivamente ya no responden a las exigencias o características de nuestro servicio267, informando y escuchando antes a los Obispos diocesanos interesados (can 616 § 1)."}, {"num": 306, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "4", "articulo_title": "Mutua ayuda entre los Organismos de la Congregación", "seccion": null, "text": "El servicio común a la Iglesia, la unidad de toda la Congregación y la fraternidad entre todos sus miembros exigen solidaridad, colaboración y mutua ayuda en todas las necesidades268."}, {"num": 307, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "4", "articulo_title": "Mutua ayuda entre los Organismos de la Congregación", "seccion": null, "text": "Es incumbencia del Gobierno General estimular y dirigir la cooperación entre los diversos Organismos de la Congregación269. Los Superiores Mayores tengan presente no sólo las necesidades del propio Organismo, sino también las de otros, especialmente de las Misiones270. Promuévase este espíritu de solidaridad y cooperación entre todos los miembros de la Congregación, ya desde el noviciado271."}, {"num": 308, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "4", "articulo_title": "Mutua ayuda entre los Organismos de la Congregación", "seccion": null, "text": "En virtud de su pertenencia a la Congregación, todos los miembros del Instituto han de estar dispuestos a aceptar cualquier destino, para cubrir las necesidades más urgentes de la Iglesia y de la Congregación272. En casos particulares, previa la aprobación del Superior General, se pueden estipular acuerdos especiales de mutua ayuda entre diversos Organismos273."}, {"num": 309, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "4", "articulo_title": "Mutua ayuda entre los Organismos de la Congregación", "seccion": null, "text": "La mutua ayuda exige una equitativa distribución de las personas y de los recursos económicos274, realizada bajo la dirección del Superior General."}, {"num": 310, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "4", "articulo_title": "Mutua ayuda entre los Organismos de la Congregación", "seccion": null, "text": "Con el fin de expresar y fomentar mejor la comunión en un mismo espíritu y para colaborar mutuamente en la planificación y puesta en práctica de la acción apostólica, es de desear que los Organismos Mayores de la Congregación se coordinen de diversas formas275. a) A través de la constitución de Conferencias interprovinciales 276 que constituyen un ámbito de colaboración importante entre Organismos que guardan entre sí especiales c f 2RG 120; HAC 64.6. 276 cf 1RG 118; AD 12.b. 2RG 85; HAC 64.5. 63 relaciones de afinidad por razones geográficas, culturales o de parecida situación pastoral o religiosa277. Dichas Conferencias interprovinciales tendrán unos Estatutos que regularán sus características y funcionamiento, y que deberán ser siempre aprobados por el Gobierno General. No son, sin embargo, estructuras con carácter jurídico supraprovincial. b) A través de proyectos interprovinciales, llevados a cabo por dos o más Organismos Mayores. Se regularán por unos Estatutos que deberán ser aprobados siempre por el Superior General, oído su Consejo. c) Los Estatutos que reglamenten la composición de los diversos órganos de la federación habrán de recibir la aprobación del Gobierno General (n. 496 c)278. d) Ni la Conferencia Interprovincial ni las comisiones y consejos interprovinciales son estructuras de carácter jurídico supraprovincial279."}, {"num": 311, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": "Incorporación a la Congregación", "text": "Por la primera profesión se adquiere la incorporación general a la Congregación."}, {"num": 312, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": null, "text": "Los profesos y novicios de la Congregación tienen el derecho de ser hospedados en cualquier casa de la Congregación, observando las normas generales y especiales dadas por los Superiores competentes. De no existir una justa causa, hospédense en las casas de la Congregación. Cuando uno va a residir en el territorio de otro Organismo por un período de dos meses o más, por razón de estudio, vacaciones o ministerio, el propio Superior Mayor debe avisar al Superior Mayor de este Organismo280."}, {"num": 313, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": "Incardinación a un Organismo Mayor", "text": "Todos los profesos deben estar incardinados a un Organismo Mayor281 . Por la primera profesión el profeso queda incorporado a la Congregación e incardinado a aquella Provincia o Delegación Independiente para la cual el Superior Mayor le ha admitido (cf. 276). En casos particulares y a modo de excepción, el Superior General podrá incardinar algunos individuos directamente a una casa generalicia."}, {"num": 314, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": null, "text": "Compete al Superior General la facultad de cambiar la incardinación a los miembros de la Congregación de un Organismo Mayor a otro, teniendo en cuenta las necesidades de la Iglesia y fomentando la disponibilidad de las personas282. a) Antes de realizar el cambio, oiga a los Superiores Mayores respectivos y a los individuos interesados. XXIII CapGen, acta 14, Ann. 66, p. 426.429. b) El cambio de la incardinación provincial se hace con decreto formal, que produce sus efectos desde el día de la incorporación del profeso a una casa del nuevo Organismo Mayor, a no ser que se disponga diversamente en el decreto de adscripción. c) La designación de una persona para formar parte del gobierno de una Provincia o de una Delegación Independiente distinta de la suya, lleva consigo la incardinación al nuevo Organismo (n. 440). d) Excepto cuando se trate de servicios ocasionales de cierta duración, es conveniente que el destino se haga por un tiempo suficientemente largo o con incardinación para que los destinados a otro Organismo sientan como suyo el proyecto de misión de éste283."}, {"num": 315, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": null, "text": "La constitución de un nuevo Organismo Mayor produce desde la fecha de erección la incardinación al mismo de todos los profesos domiciliados en alguna de sus casas o residencias. Lo mismo sucede si una casa o residencia es desmembrada de un Organismo para ser incorporada a otro."}, {"num": 316, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": "Adscripción local", "text": "Todos los miembros de la Congregación deben estar adscritos a alguna casa o residencia, salvo lo que se dice de los exclaustrados y ausentes en el n. 318."}, {"num": 317, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": null, "text": "La adscripción local se realiza por el destino permanente dado por el Superior Mayor legítimo para una determinada casa o residencia y produce sus efectos desde el momento en que se incorpora a ella."}, {"num": 318, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": null, "text": "En cuanto a la adscripción local: a) Los exclaustrados pierden su adscripción local, que adquirirán de nuevo al volver a la vida común. b) Los \"ausentes\" se atendrán a lo determinado en el documento en que se les concede el permiso para permanecer fuera de la casa religiosa (n. 274). 4. Efectos de la incardinación provincial y de la adscripción local"}, {"num": 319, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": null, "text": "Por la incardinación a un Organismo Mayor y la adscripción a una casa o residencia, salvo las excepciones que se establezcan: a) El religioso pasa a depender del propio Superior Mayor inmediato y del local, obtiene derecho de voz activa y pasiva y debe recibir del respectivo Organismo lo necesario para la vida espiritual y temporal, lo mismo que los sufragios en caso de defunción . b) Está obligado a ponerse a disposición del respectivo Organismo."}, {"num": 320, "parte": "PARTE TERCERA", "capitulo": "XIII", "capitulo_title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "articulo": "5", "articulo_title": "De las personas físicas", "seccion": null, "text": "La permanencia en una casa, a la cual no se está adscrito, no suspende los efectos de la propia adscripción local, pero pone al religioso bajo la dependencia del Superior Local de la misma y le obliga a observar el orden doméstico dentro de los límites del mandato recibido del propio superior (n. 83). Si la permanencia hubiere de ser larga, deben los Superiores interesados establecer un acuerdo sobre los gastos, ministerios y otros particulares. cf XXII CapGen, acta 21."}, {"num": 321, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": null, "articulo_title": null, "seccion": null, "text": "El misionero claretiano, habiéndose comprometido por su consagración a vivir según la llamada del Espíritu con los demás hermanos, debe tomar parte activa en todo lo referente a su vida misionera en unión con los otros miembros de la comunidad284. Esta participación y corresponsabilidad debe manifestarse en todos los planos de su intervención en la comunidad claretiana: local, provincial y general285."}, {"num": 322, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": "Normas generales", "text": "Todos los profesos de votos perpetuos gozan de voz activa y pasiva en nuestra Congregación, según las normas siguientes286."}, {"num": 323, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "A los profesos de votos temporales se les escuchará en aquellos asuntos que especialmente les afecten287."}, {"num": 324, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Nadie puede gozar de doble voz activa y pasiva288."}, {"num": 325, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Solamente por causa grave y culpable reconocida por el derecho universal o propio se puede privar a alguien de la voz activa o pasiva289. Decretar la privación compete al Capítulo, si durante él ocurriese el caso; al Superior Provincial con su Consejo, si el derecho se ejercita en la instancia local (n. 457 i) y al Superior General con el suyo para las instancias provincial y general."}, {"num": 326, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Los legalmente ausentes conservan durante la ausencia el ejercicio de la voz activa y pasiva. Sin embargo, el Superior Mayor, con el consentimiento de su Consejo, puede, por serias razones, privarles de este derecho (n. 457 i)290."}, {"num": 327, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "No gozan de voz activa ni pasiva los profesos de votos perpetuos con rescripto de exclaustración (can 687). cf XX CapGen, acta 20."}, {"num": 328, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": "Normas particulares", "text": "Salvadas las excepciones que se establezcan, los miembros de la Congregación ejercerán sus derechos de voz activa y pasiva en el Organismo Mayor y en la comunidad local a que están adscritos291."}, {"num": 329, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Los adscritos a una casa interprovincial ejercen en la misma sus derechos de voz activa y pasiva en lo referente al régimen local y a la participación en la vida de la comunidad. Su participación en las instancias superiores se realizará a través del Organismo Mayor al que cada uno está adscrito292. No podrán ser escogidos para cargos permanentes en la propia Provincia, sino en conformidad con los estatutos de la casa (n. 299)."}, {"num": 330, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Quienes tienen adscripción a una casa de régimen generalicio de modo permanente, participan dentro de la misma de todo lo referente a la comunidad. Pero si tienen además adscripción en una Provincia o Delegación Independiente, ejercerán sus derechos de voz activa y pasiva en la misma (n. 469 a), excepto el caso de elección de Delegado al Capítulo General, para el cual forman colegio electoral propio293. La elección o designación de los mismos para cargos permanentes en la propia Provincia, aunque válida, no tendrá efecto sin el permiso o la confirmación del Superior General Quienes residan en casas generalicias, por razón de estudios sin estar adscritos a ellas de modo permanente, se atendrán a lo que se establece en el n. 332294 ."}, {"num": 331, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Quienes residan en Organismos dependientes de una Provincia, en ésta ejercerán sus derechos de voz activa y pasiva, como miembros de la misma, conforme a las normas generales (n. 334)295."}, {"num": 332, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Quienes tienen adscripción local en casas que no pertenecen al propio Organismo de adscripción, por razón de estudios o de ministerios en servicio de éste, participan dentro de dichas casas de todo lo referente a la comunidad local. En cambio, su participación en las instancias superiores se realizará a través de su Organismo propio296."}, {"num": 333, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Quienes tienen adscripción local en casas que no pertenecen al propio Organismo, por razón de un servicio que prestan a dicha comunidad o al Organismo al que la casa pertenece, ejercerán en éste sus derechos de voz activa y pasiva en la instancia provincial y general297."}, {"num": 334, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Los residentes en Organismos dependientes de una Provincia (Delegación Dependiente o Misión) participarán en la elección de los delegados al Capítulo Provincial de alguna de estas maneras: a) con el resto de la Provincia siguiendo la norma general; b) constituyendo ellos un colegio electoral para elegir el número de delegados que establezca el Superior Provincial con su Consejo (n. 457 d); c) mediante otras normas que determine el mismo Gobierno Provincial y sean aprobadas por el Superior General con su Consejo (n. 457 d). Corresponde al Superior Provincial con su Consejo decidir cuál de estos modos se aplicará en cada circunstancia. En cualquier caso, sin embargo, habrá de prevalecer el principio general de derecho de todos a hacerse representar por un delegado libremente elegido298."}, {"num": 335, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Los formandos de votos perpetuos ejercerán sus derechos en las mismas condiciones que los demás miembros de la comunidad en que residen299."}, {"num": 336, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Los formandos de votos perpetuos en régimen colegial votarán personalmente para los asuntos de voto deliberativo en la reunión plenaria local. En casos particulares podrá proveer el Superior Mayor, oído su Consejo300."}, {"num": 337, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "En los asuntos y elecciones de carácter general y provincial los formandos de votos perpetuos ejercerán personalmente su derecho de voz activa y pasiva301."}, {"num": 338, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "En cada Provincia o Delegación Independiente habrá Escrutadores que, junto con el Superior Mayor, verificarán el escrutinio cuantas veces hayan de hacerse a nivel de Organismo Mayor elecciones por el sistema de cédulas. La designación de escrutadores se hará en Capítulo Provincial, al cual corresponde también señalar el número y la forma de suplencia302. La duración en el cargo será hasta el siguiente Capítulo Provincial303. En las Delegaciones Independientes la designación de escrutadores la hace el Gobierno de la Delegación por el tiempo de su mandato. Para evitar posibles fallos o dificultades en el desarrollo de las funciones de los escrutadores y sus suplentes, sería de desear que para dicho cometido no se indicaran nombres de personas sino titulares de cargos cercanos a las curias."}, {"num": 339, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Derecho de voz activa y pasiva", "seccion": null, "text": "Si se diera el caso de que los escrutadores no pudieran ejercitar su función ocasional o habitualmente, el Superior Mayor con el voto consultivo de su Consejo tiene la competencia para remediar la falta."}, {"num": 340, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Constitución de cargos", "seccion": null, "text": "Son órganos de régimen: los Capítulos Generales y Provinciales y los Gobiernos General, Provincial, de la Delegación Independiente y Local."}, {"num": 341, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Constitución de cargos", "seccion": null, "text": "En este Directorio se entiende por Gobierno General o Provincial el respectivo Superior con sus Consultores quienes participan en el gobierno con voto deliberativo o consultivo o de otras formas, según los casos."}, {"num": 342, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Constitución de cargos", "seccion": null, "text": "Son cargos incompatibles: a) El de Superior, con todos los que llevan aneja la administración de bienes. El cargo de Ecónomo Local, aunque es mejor separarlo del de Superior Local, se puede unir con él si la necesidad lo exige (can 636; CC 108; Dir 427). b) El de Maestro de novicios y el de Prefecto de los misioneros en formación con el de Superior Mayor. c) El de Superior Provincial con otros cargos provinciales y con el de Superior Local, fuera del caso de necesidad y con anuencia del Superior General. d) El de Consultor u Oficial General con cargos en las Provincias."}, {"num": 343, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Constitución de cargos", "seccion": null, "text": "La incompatibilidad, si es de derecho propio nuestro, puede ser dispensada por el superior a quien corresponde la provisión o confirmación respectiva."}, {"num": 344, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Constitución de cargos", "seccion": null, "text": "No es conveniente la acumulación de cargos, aunque sean compatibles, especialmente si es con perjuicio para el recto cumplimiento de los mismos."}, {"num": 345, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Cuando en nuestra legislación se dice que una elección es canónica, se ha de entender que ha de llevarse a cabo en conformidad con el canon 119, salvo en aquello en que nuestras normas explícitamente introducen alguna variante."}, {"num": 346, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Para dirimir el resultado de empate en votaciones electivas, al término de los escrutinios previstos para cada caso, rige el criterio de la antigüedad en la primera profesión y, en segundo lugar, el de la edad."}, {"num": 347, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Cuando la voz pasiva haya de restringirse a los dos candidatos que obtuvieron mayor número de votos y sean de hecho más de dos por haber obtenido paridad, entonces los más jóvenes en profesión o, si en ésta coinciden, en edad, quedarán excluidos, de modo que queden solamente dos para esa última votación. En dicho caso, los dos candidatos deben abstenerse de votar. Para las elecciones por el sistema de cédulas se tendrá presente lo que se dice en el n. 383 a)."}, {"num": 348, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "En nuestro derecho son elecciones en sentido canónico solamente las siguientes: a) En el Capítulo General: la elección del Superior General, Consultores, Ecónomo y Secretario del Capítulo. b) En el Capítulo Provincial: la elección del Superior Provincial, Consultores, Ecónomo y Secretario Capitular. c) En la Provincia: la elección de Delegados al Capítulo Provincial y al Capítulo General, la elección directa del Provincial, Consultores y Ecónomo, cuando fuere autorizada (n. 447 c)304. d) En las Delegaciones Independientes y en el colegio electoral de las casas generalicias: la elección de Delegado al Capítulo GeneraI. e) En la comunidad local: la elección de Superior, de Vicario y de Ecónomo, donde se haya adoptado el sistema electivo (CC 106-107)."}, {"num": 349, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Necesitan confirmación: a) del Superior General con el consentimiento del Consejo la elección del Superior Provincial (can 625 § 3; CC 114), y con voto consultivo la de los Consultores y Ecónomo provinciales. b) del Superior Provincial con el voto consultivo de su Consejo la elección del Superior (can 625 § 3), Vicario y Ecónomo locales (CC 106-107) realizada por la comunidad local (n. 458 b)."}, {"num": 350, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Antes de recibir la confirmación, los elegidos no pueden tomar posesión del cargo ni entrar en funciones (can 179 § 4)."}, {"num": 351, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "En orden a su confirmación, además de la idoneidad del elegido, que se ha de interpretar en conformidad con el espíritu del Instituto y su manera peculiar de régimen, han de tenerse en cuenta las exigencias del bien común de la Congregación305."}, {"num": 352, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Las demás designaciones para cargos no son elecciones canónicas en sentido propio. Si alguno de los que tienen derecho a intervenir lo pidiera, se harán por votación secreta los nombramientos de mayor importancia, como son los de gobierno de un Organismo Mayor, los de Superior Local y Maestro de novicios. Del mismo modo se procederá también en cualquier otro nombramiento si alguno de los que tienen derecho a intervenir en el mismo así lo pidiera."}, {"num": 353, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Antes de proceder a las elecciones o nombramientos, pídanse informes en la forma establecida para el caso. Todos, por amor al bien común y a la Congregación, den los predichos informes de buen grado y con toda verdad (can 626)306."}, {"num": 354, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Antes de proceder a las elecciones canónicas o designaciones colegiales, si se juzga útil o conveniente, se puede tener un sondeo previo, con votación indicativa, y abrir un diálogo fraterno con las personas más señaladas en el sondeo, a fin de que éstas puedan manifestar su disposición, sus dificultades o inconvenientes y ser ayudadas en su discernimiento."}, {"num": 355, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "De cualquier elección o nombramiento levántese Acta firmada por el Presidente y el Secretario. En las elecciones capitulares y en las de la reunión plenaria de la comunidad firmarán el Acta el Presidente, los Escrutadores y el Secretario (can 173 § 4). Si el elegido o nombrado está ausente, comuníquesele cuanto antes la elección o nombramiento (can 177 § 1). Hágase mención de la notificación y aceptación o no aceptación en las Actas. Posteriormente, el elegido debe dejar constancia por escrito de la aceptación o no del cargo para el que fue elegido. cf XIX CapGen, ses. 56."}, {"num": 356, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Los miembros de la Congregación acepten por espíritu de disponibilidad cualquier cargo para el que fueren legítimamente designados (CC 32), salvo siempre el derecho de exponer las razones que tengan para no aceptarlo o para renunciar al mismo. a) En caso de no aceptación del nombramiento, si el Superior persiste en el nombramiento, el nombrado debe aceptar. b) En caso de no aceptación de la elección, si el colegio electoral persiste en la designación, el elegido queda designado, pero conserva la facultad de aceptar o de recurrir a la instancia superior (can 177)."}, {"num": 357, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Respecto a la renuncia a los cargos téngase en cuenta lo siguiente: a) Es lícito renunciar, por justa causa, a un cargo que se está ejerciendo (can 187). b) Para la validez de la renuncia a un cargo de gobierno, se requiere que el renunciante lo haga por escrito firmado o de palabra ante dos testigos, a la autoridad competente para hacer el nombramiento o conceder la confirmación de la elección (can 189). c) La renuncia, una vez que ha sido presentada y ha surtido efecto, no puede ser retractada . d) No se acepte la renuncia hecha sin causa justa y proporcionada. e) Si la renuncia es aceptada, comuníquese cuanto antes esta aceptación al renunciante. f) El cargo queda vacante cuando el renunciante conoce la comunicación oficial de la aceptación de la renuncia. Sin embargo, el renunciante debe permanecer en el mismo, con potestad prorrogada, hasta que su sucesor tome posesión, a menos que quien acepta la renuncia provea de otra manera. g) Levántese acta del resultado de la renuncia."}, {"num": 358, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "En cuanto a los nombramientos: a) El período o tiempo de duración del nombramiento para un cargo se cuenta desde la fecha del documento que se transmite al designado. b) La fecha del nombramiento sea la misma para todos los nombrados en las renovaciones periódicas de los cargos. c) En orden a nueva inmediata designación de un Superior Local para la misma comunidad, no obsta el anterior mandato si los períodos no han sido íntegros y completos . d) Al nombrar, elegir o confirmar a un Superior, téngase en cuenta el criterio del canon 624 para evitar que se permanezca mucho tiempo en el cargo sin interrupción. Sobre este punto los Capítulos Provinciales y Asambleas de las Delegaciones Independientes deberán determinar normas concretas para sus respectivos organismos, quedando siempre a salvo las normas de nuestro derecho propio307."}, {"num": 359, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "La formal toma de posesión sólo se prescribe para el cargo de Superior. En los casos de elección, basta la notificación y publicación de la confirmación, si es necesaria; si es nombramiento hecho por el correspondiente gobierno superior, basta la lectura del documento hecha a la comunidad. La toma de posesión debe completarse con la emisión de la profesión de fe (can 833 § 8; CC 94), la entrega y aceptación de todos los libros pertenecientes al régimen y a la administración. Los libros se entregan y aceptan poniendo en ellos la firma y fecha con el sello del Organismo. La entrega de los libros de administración debe ir acompañada del arqueo. XX CapGen, acta 22."}, {"num": 360, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Aunque los Superiores, Consultores, Oficiales y cuantos ejercen un cargo han de permanecer en su función por todo el tiempo prescrito en nuestro derecho, pueden, sin embargo, ser removidos por aquel que los nombró o que confirmó su elección, habiendo causa grave y proporcionada o por exigencias del bien común (can 624 § 3; CC 96; Dir 457 a, 496 a). No se haga la remoción sin haber oído al interesado y siempre con el voto deliberativo o consultivo del consejo respectivo, según el requerido para su designación."}, {"num": 361, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Los Superiores, Consultores, Oficiales y cuantos ejercen un cargo pueden ser trasladados de éste a otro por el Superior Mayor con el voto deliberativo o consultivo de su Consejo, en conformidad con el requerido para su designación, y después de oídos los interesados, si no se ve inconveniente en ello, por el bien de la Congregación, de la Provincia o de la Casa (nn. 426, 457 a, 496 a)."}, {"num": 362, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Transcurrido el período de tiempo para el cual fueron nombrados, tanto los superiores como los consultores y oficiales cesan en sus cargos. Deben, sin embargo, continuar en el ejercicio del mismo con potestad prorrogada, hasta que sus sucesores tomen posesión."}, {"num": 363, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Elecciones y nombramientos, renuncia y duración de los cargos", "seccion": null, "text": "Cuando un Superior Provincial o un Superior de una Delegación Independiente cesa por cualquier causa durante el pe
