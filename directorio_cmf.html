el Visitador es delegado; b) al Superior General, si el Visitador es un Superior Mayor; c) a la Sede Apostólica, si el Visitador es el mismo Superior General. Por tanto, en todos estos casos y no obstante el recurso, se ha de obedecer hasta tanto que el Superior al que se recurre revoque o modifique el mandato, decreto u otro acto administrativo del Visitador."}, {"num": 475, "parte": "PARTE TERCERA", "capitulo": "XVII", "capitulo_title": "LOS VISITADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "El cargo de los Visitadores que lo sean en nombre de otro o por comisión, se entiende que es siempre revocable ad nutum, aun después de haber comenzado la visita."}, {"num": 476, "parte": "PARTE TERCERA", "capitulo": "XVII", "capitulo_title": "LOS VISITADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Todos los Visitadores, una vez concluidas sus visitas, darán cuenta al Superior delegante, adjuntando los documentos de las mismas o sus copias."}, {"num": 477, "parte": "PARTE TERCERA", "capitulo": "XVII", "capitulo_title": "LOS VISITADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Superior de la Delegación Independiente, en lo tocante a la visita canónica de su Organismo, se equipara al Superior Provincial (CC 113. 4)."}, {"num": 478, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "1", "articulo_title": "El Superior General", "seccion": null, "text": "El que haya de ser elegido Superior General debe ser sacerdote y profeso de votos perpetuos desde al menos cinco años (CC 137)."}, {"num": 479, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "1", "articulo_title": "El Superior General", "seccion": null, "text": "El Superior General puede delegar a otros miembros de la Congregación la representación canónica y civil de la misma, en conformidad con el derecho universal y el nuestro propio; mas el Delegado obraría inválida e ilícitamente si excediera los límites del mandato y del derecho (n. 368). La Congregación en su conjunto sólo puede quedar obligada canónica, civil y moralmente en virtud de los legítimos actos, ya del Superior General y su Delegado, o bien por los del Ecónomo General, tratándose de actos de administración ordinaria."}, {"num": 480, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "1", "articulo_title": "El Superior General", "seccion": null, "text": "Fuera del Capítulo General, la aceptación de la renuncia del Superior General queda reservada a la Sede Apostólica."}, {"num": 481, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "1", "articulo_title": "El Superior General", "seccion": null, "text": "En las casas que dependen inmediatamente del Superior General, ejercerá éste por sí mismo o por Delegado, los derechos y deberes que el derecho asigna a los Superiores Provinciales respecto de la propia Provincia. Si un miembro del Gobierno General preside la elección del gobierno local en una casa generalicia puede confirmar a los elegidos por designación del Gobierno General sin tener que recurrir al mismo346."}, {"num": 482, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "2", "articulo_title": "El Vicario y demás Consultores Generales", "seccion": null, "text": "El Capítulo General, después de oír el parecer del nuevo Superior General y habida cuenta de las necesidades de la Congregación, fijará el número de Consultores347. Antes de proceder a la elección de los Consultores Generales, el Capítulo habrá de tener en cuenta los criterios de especialización y de representación de áreas geográficas y culturales que el nuevo Superior General exponga. En todo caso, deben elegirse de entre las diversas partes del mundo en donde se halla establecida la Congregación (CC 145), no sólo por razones prácticas, sino para que el Gobierno General exprese en su propia estructura interna la universalidad y comunión de la Congregación348. El Vicario General es designado a tenor del n. 517. XXIII CapGen, acta 17. XIX CapGen, ses. 18. Ib."}, {"num": 483, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "3", "articulo_title": "Oficiales Generales", "seccion": "El Ecónomo General", "text": "Todas las Administraciones de la Congregación están subordinadas a la Administración General. En virtud de ello: a) El Ecónomo General recibirá trimestralmente cuenta de las administraciones de las casas y actividades generalicias y, al menos una vez al año, de las administraciones de las Provincias y Delegaciones Independientes; una vez recibidas esas cuentas y revisada la de la propia Administración, informará al Superior General y su Consejo. b) La visita canónica generalicia irá acompañada de una visita pericial económica realizada por el Ecónomo General o su delegado. Cuando el Gobierno General lo estime necesario o conveniente, se harán otras visitas periciales a Organismos o actividades349."}, {"num": 484, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "3", "articulo_title": "Oficiales Generales", "seccion": null, "text": "Todo esto se aplica proporcionalmente a los Ecónomos de los Organismos Mayores, con respecto a las Administraciones subordinadas y dependientes de ellos."}, {"num": 485, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "3", "articulo_title": "Oficiales Generales", "seccion": "El Secretario General", "text": "El Secretario General, una vez designado, ha de prestar juramento de fidelidad y de secreto. Está al frente de la Secretaría General y coordina todas las actividades de la misma."}, {"num": 486, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "3", "articulo_title": "Oficiales Generales", "seccion": null, "text": "Es deber y oficio del Secretario General: a) preparar los Consejos anotando lo que haya de ser comunicado al Superior General y Consultores y sometido al Consejo; distribuir oportunamente a los Consultores los asuntos que requieran estudio particular; convocarlos para el día y hora de las sesiones; b) elaborar y presentar oportunamente al Superior General el elenco de asuntos que se hayan de tratar en Consejo; c) redactar las actas de las sesiones y presentarlas en la sesión siguiente para su aprobación; d) comunicar a los interesados los decretos y respuestas que el Superior haya dictado con el consentimiento o consejo de sus Consultores, excepto en los casos en los que el Superior determinase otra cosa; e) redactar los documentos que, en nombre del Superior General, con el consentimiento o consejo de sus Consultores, hayan de publicarse o promulgarse; f) informar periódicamente a la Congregación a través de los medios de comunicación, oficiales y oficiosos, de los que dispone el Gobierno General y de los que será responsable . g) confeccionar el catálogo de los individuos y de las casas y el necrologio."}, {"num": 487, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "3", "articulo_title": "Oficiales Generales", "seccion": null, "text": "Dirige el Archivo General y, aunque se nombre un Archivero general, éste ejercerá el cargo bajo la dependencia del Secretario, a quien, en todo caso, estará reservada la sección secreta del Archivo. Mantiene la comunicación y coordinación de todas las Secretarías y Archivos de la Congregación."}, {"num": 488, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "3", "articulo_title": "Oficiales Generales", "seccion": null, "text": "Todos los deberes señalados aquí para el Secretario General y el modo de ordenar y desempeñar su oficio, tanto por lo que hace a las personas como a los asuntos, han de ser proporcional y respectivamente observados por los Secretarios de los Organismos Mayores."}, {"num": 489, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "4", "articulo_title": "Colaboradores del Gobierno General", "seccion": null, "text": "Todos los asuntos referentes a la Congregación, a las Provincias, a las Casas y a los particulares que hayan de tratarse ante la Sede Apostólica se tramitarán por medio del Procurador General, designado por el Superior General, luego de oír a los Consultores. Queda siempre a salvo el derecho del Superior General de tratar directamente con la Sede Apostólica y el de los particulares de acudir a la misma."}, {"num": 490, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "4", "articulo_title": "Colaboradores del Gobierno General", "seccion": null, "text": "Está obligado a la estricta ley del secreto acerca de los asuntos de la Congregación y de los particulares y no tratará de ellos más que con los Superiores correspondientes."}, {"num": 491, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "4", "articulo_title": "Colaboradores del Gobierno General", "seccion": null, "text": "Ante la Curia Romana habrá también un Postulador General de las Causas de Beatificación y Canonización, designado por el Superior General, oído su Consejo."}, {"num": 492, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "4", "articulo_title": "Colaboradores del Gobierno General", "seccion": null, "text": "El Postulador, con el consentimiento del Superior General y oídos aquellos a quienes interese, podrá nombrar los necesarios Vice-Postuladores, en los diversos lugares, delegando en ellos las facultades del caso, dirigiendo y estimulando su actividad."}, {"num": 493, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "4", "articulo_title": "Colaboradores del Gobierno General", "seccion": null, "text": "Tanto el Procurador como el Postulador Generales tendrán su sello propio para autenticar los respectivos documentos oficiales (n. 407); administrarán los fondos de su respectiva competencia y ambos presentarán al Superior General la relación anual prescrita (n. 377). b) Secretariados"}, {"num": 494, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "4", "articulo_title": "Colaboradores del Gobierno General", "seccion": null, "text": "El Gobierno General puede establecer algunos Secretariados fijando el objetivo y competencia de cada uno, lo mismo que la vinculación con una determinada Prefectura o con el Gobierno General en su conjunto. Los responsables de estos Secretariados actuarán en conformidad con las directrices y facultades que reciban del mismo Gobierno General350."}, {"num": 495, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "5", "articulo_title": "Los Consejos", "seccion": null, "text": "Las decisiones que deben tomarse en forma colegial vienen descritas en el n. 380. El Superior General necesita el voto deliberativo de su Consejo, con asistencia de todos los miembros del mismo, entre otros, en los siguientes casos: a) para pedir a la Sede Apostólica la suspensión temporal de alguna norma constitucional (n. 6), y para dispensar a toda la Congregación de algún artículo de las Constituciones (n. 7); b) para dar una interpretación provisional al texto de las Constituciones (n. 8); para dispensar de algún artículo disciplinar de ellas (n. 10) y de las normas del Directorio (n. 15 b); c) para escoger a los que han de asistir al Capítulo General con voz y voto por libre disposición del Gobierno General (CC 156. 5; Dir 385 b); XIX CapGen, ses. 19. d) para adelantar o retrasar el Capítulo General Ordinario más de tres meses (n. 501); e) para convocar un Capítulo General extraordinario (CC 154); o para convocar el ordinario el Superior General en funciones (n. 386 a); f) para dar al Presidente del Capítulo de una Provincia las facultades delegadas de que se habla en los nn. 443, 445, 447 e."}, {"num": 496, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "5", "articulo_title": "Los Consejos", "seccion": null, "text": "Estando presente la mayoría de los que tienen derecho a voto, el Consejo General debe expresarse con voto deliberativo: a) para conceder la designación del Gobierno Provincial según alguno de los otros modos contemplados por nuestro derecho (CC 114; Dir. 447); para nombrar los Gobiernos de Organismos Mayores (CC 118, 120; Dir. 447 a y b) y escoger el modo de designación de los Gobiernos Locales de las casas generalicias y de las Delegaciones Independientes (CC 106; Dir 417 c), y removerlos y trasladarlos (nn. 360-361); para conceder a un miembro del Gobierno General que pueda confirmar la elección del gobierno local de una comunidad generalicia, cuando presida la votación351. b) para completar el quórum necesario para una votación en el Consejo aun con personas ajenas al Gobierno (399 d) y conceder la facultad de hacerlo durante todo el sexenio352; para designar a los Prefectos Generales (n. 413) y suplir la vacante de Consultores y Ecónomos Provinciales producida durante el período para el que fueron elegidos por los respectivos Capítulos (n. 451 c); para permitir la designación de un Superior Local para un tercer trienio consecutivo en la misma casa (CC 106; Dir 424 c); c) para dar decretos generales (n. 17), aprobar los decretos y preceptos dados por los Capítulos Provinciales (CC 126; Dir 465), aprobar los estatutos de las Conferencias (n. 310 c); d) para erigir, suprimir o modificar Organismos Mayores (CC 91; Dir 289, 292); e) para dar categoría de \"Misión\" a un organismo (n. 286); f ) para erigir, trasladar y suprimir un noviciado (n. 198); g) para erigir, suprimir e innovar casas (n. 300 a) y permitir su fundación en territorio de otro Organismo (n. 293); h) para readmitir a un novicio, completado el noviciado o a un profeso salido legítimamente del Instituto, sin que hayan de repetir el noviciado (can 690; Dir 216, 284); i) para conceder, por causa grave, a un profeso perpetuo indulto de exclaustración por un período no superior a tres años (can 686 § 1; Dir 276); j) para pedir a la Sede Apostólica la imposición de la exclaustración a un profeso perpetuo (can 686 § 3); k) para conceder a un profeso temporal, por causa grave, el indulto de dejar la Congregación (can 688 § 2; Dir 273); l) para permitir que un religioso de votos perpetuos pase a otro instituto religioso (can 684 § 1); m) para conceder, en casos particulares, que un candidato pueda hacer el noviciado en una casa distinta de la casa noviciado (can 647 § 2; Dir 205); n) para enajenar bienes de la Congregación, contraer deudas y obligaciones y autorizar que puedan hacerlo los demás Organismos (can 638 § 3; Dir 528); y para pedir el beneplácito de la Sede Apostólica cuando los actos excedan la cantidad autorizada por ella para cada país (nn. 528-529); o) para aceptar cargas o fundaciones de misas perpetuas (n. 557); XXIII CapGen, acta 17. XIV CapGen, acta 12. p) para autorizar la renuncia a los bienes patrimoniales (n. 72); q) para aprobar los balances y presupuestos de la Administración General, de los Organismos Mayores y de las casas generalicias (nn. 575-576)."}, {"num": 497, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "5", "articulo_title": "Los Consejos", "seccion": null, "text": "El Superior General necesita el voto consultivo de su Consejo para todos los asuntos en los que, supuesta la necesidad del voto, el derecho universal o el nuestro propio : a) exigen expresamente el voto consultivo; b) exigen pedir el consejo o el parecer o simplemente oír a los Consultores; c) exigen la intervención del Consejo General sin que conste claramente que el voto haya de ser deliberativo."}, {"num": 498, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": "Función y competencia del Capítulo General", "text": "El Capítulo General es la suprema autoridad de la Congregación y su competencia se halla determinada en las Constituciones (CC 153)."}, {"num": 499, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "La convocación del Capítulo General, tanto ordinario como extraordinario, la hace el Superior General o quien le sustituya, a tenor de nuestro derecho (CC 154; Dir 495 e)."}, {"num": 500, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Ante todo, el Capítulo debe mantenerse en su actitud de supremo servicio de la Congregación para impulsar en ella la vida misionera claretiana y su desarrollo como institución aprobada por la Iglesia353. Esta actitud fundamental inspira todas las funciones del Capítulo General, a norma de las Constituciones (CC 155)."}, {"num": 501, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Durante el sexto año, el Superior General, oídos los Consultores, puede, con justa causa, adelantar o retrasar tres meses la celebración del nuevo Capítulo; para más de tres meses, hasta un máximo de seis, se requiere el consentimiento de los Consultores (n. 495 d)."}, {"num": 502, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Si mientras se está celebrando el Capítulo ordinario queda vacante el cargo de Superior General, se elegirá un nuevo Superior General; si se trata de un Capítulo extraordinario, éste determinará lo referente a la elección."}, {"num": 503, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Las disposiciones de los Capítulos Generales obligan desde el día en que el Superior General las promulgue, según las normas dadas por el Capítulo mismo. Publíquense cuanto antes."}, {"num": 504, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "El Gobierno General, para promover la comunicación y comunión congregacional, actuará dinamismos y medios en la Congregación o en las distintas áreas, como Asambleas, encuentros de Superiores Mayores, reuniones zonales u otros semejantes."}, {"num": 505, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": "Participantes", "text": "Todos los que, según la Constitución 156, son vocales del Capítulo General, asisten tanto al ordinario como al extraordinario, y en ambos gozan de todos los derechos. cf 2RG 109"}, {"num": 506, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "El Superior de la Delegación Independiente no tiene, en cuanto tal, derecho de asistencia al Capítulo General; pero esos Organismos tienen representación en él mediante un vocal elegido por sus miembros (CC 156. 3)."}, {"num": 507, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Si el Capítulo General, por cualquier causa, no señalase el número de Delegados de las Provincias, en orden a guardar la representación proporcional de que habla la Constitución (CC 156. 4) o el número de Capitulares que han de elegir las casas generalicias o ha de designar el Gobierno General, se guardará la norma establecida por el Capítulo precedente (CC 156. 5)."}, {"num": 508, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "La elección de los Delegados al Capítulo General por parte de los Organismos Mayores se hará ordinariamente por votación directa de los profesos perpetuos, por el sistema de cédulas (n. 383). Al efecto, en cada Organismo Mayor gozan de voz activa y pasiva, para elegir y ser elegidos Delegados al Capítulo General, todos los indicados en el n. 469, salvo lo que para residentes en casas generalicias se dice en el n. 509."}, {"num": 509, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Los adscritos a casas generalicias de modo permanente para la elección directa de sus propios delegados formarán uno o más colegios electorales según lo determine el Gobierno General en atención al número de miembros, al conocimiento mutuo u otras causas (CC 156. 5; Dir 330-332)354."}, {"num": 510, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "El resultado de las elecciones de los Delegados al Capítulo General ha de comunicarse por medio de documento auténtico, con las debidas formalidades, tanto al Superior General o a su Vicario, según los casos, como a los elegidos. Se comunicarán también a toda la Provincia u Organismo por medio del Boletín Oficial."}, {"num": 511, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": "Peritos e invitados", "text": "a) La representación de las actividades y ministerios en el Capítulo General puede lograrse en la fase precapitular y por medio de peritos durante el Capítulo355. b) Si el Gobierno General estimase conveniente proponer el nombre de alguno que puede asistir al Capítulo General en calidad de invitado, requerirá el parecer de los Capitulares durante la fase preparatoria del Capítulo356. c) El Capítulo, una vez constituido, podrá invitar a aquellas personas que puedan ayudar en las tareas propias del mismo. Le corresponde también determinar qué género de intervención han de tener los posibles invitados, tanto en las Comisiones como en las sesiones plenarias357. d) Estas mismas normas se guardarán, con la debida proporción, en relación con los Capítulos Provinciales. XIX CapGen, ses. 55. Ib."}, {"num": 512, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": "Las elecciones en Capítulo General", "text": "Para la elección del Superior General las votaciones se reiterarán cuantas veces sea necesario hasta que se obtenga la mayoría absoluta o, si se trata de un tercer sexenio consecutivo, las dos terceras partes (CC 139)."}, {"num": 513, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Si el que ha sido elegido para un cargo manifiesta inmediatamente después de la elección su determinación de no aceptarla, deberá manifestar al Capítulo o a una Comisión compuesta de tres vocales al menos, los motivos de su no aceptación, y después de examinarlos diligentemente, estando fuera el interesado, el Capítulo resolverá por votación secreta si acepta o no la renuncia. Si el Capítulo no se la admite, deberá el elegido aceptar el cargo, y aun podrá el Presidente, en nombre del Capítulo, obligarle a ello en virtud del voto de obediencia. Mas si el Capítulo la admite, se procederá a nueva elección358."}, {"num": 514, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Si los elegidos no estuvieran en el Capítulo, se les notificará al momento su elección. Si aceptan, deberán incorporarse al Capítulo. Su no aceptación sólo podrá admitirla, y según la forma prescrita, el Capítulo General que, en este caso, deberá hacer nueva elección. Esto mismo ha de observarse proporcionalmente en las elecciones de los Capítulos Provinciales."}, {"num": 515, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Realizada la elección del Superior General, el Presidente publicará su nombre y le declarará elegido con estas palabras: \"Yo, ..., Presidente de este Capítulo y en su nombre, proclamo a ..., elegido Superior General de nuestra Congregación de Misioneros Hijos del Inmaculado Corazón de la Santísima Virgen María. En el nombre del Padre y del Hijo y del Espíritu Santo. Amén\". Pero si el elegido fuera el mismo Presidente, pronunciará el decreto de elección el que le siga en orden de precedencia."}, {"num": 516, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Los Consultores son elegidos también por mayoría absoluta de votos, pero las votaciones no serán nunca más de cuatro. Por eso, si nadie obtuvo la mayoría absoluta en las tres primeras votaciones, en la cuarta votación se restringe el derecho de voz pasiva a los dos que en la votación precedente hayan obtenido mayor número de votos. En caso de empate, se procederá a norma del n. 346."}, {"num": 517, "parte": "PARTE TERCERA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "El Vicario General será libremente designado por el Superior General de entre los Consultores elegidos por el Capítulo mismo359."}, {"num": 518, "parte": "PARTE CUARTA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Los bienes temporales de la Congregación son fruto de nuestro trabajo y de la caridad de los fieles. Como medios necesarios y útiles para nuestra vida y misión, y el servicio a los pobres, usaremos de ellos bajo la dirección de los Superiores y en conformidad con las exigencias de la pobreza claretiana360."}, {"num": 519, "parte": "PARTE CUARTA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Los bienes patrimoniales, propiedad de los profesos, son aquellos que estos adquieren, por título gratuito, herencia o legado de sus parientes, ya sea por consanguinidad o por afinidad, pasando a formar parte de su patrimonio, pudiendo conservar su nuda propiedad, cediendo su uso y usufructo conforme a derecho. El resto de los bienes tendrán la consideración de no patrimoniales (CC 27)."}, {"num": 520, "parte": "PARTE CUARTA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Los bienes de la Congregación, por ser bienes eclesiásticos, serán administrados, con diligencia y transparencia, según las normas del derecho universal, del nuestro propio y en concordancia con las leyes civiles de cada país. Observadas dichas normas y los principios éticos y evangélicos que han de regir nuestra administración haremos uso de los diversos mecanismos económicos361, aunque teniendo siempre presente la razón de medio y no de fin de los mismos."}, {"num": 521, "parte": "PARTE CUARTA", "capitulo": "XVIII", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD GENERAL", "articulo": "6", "articulo_title": "Capítulo General", "seccion": null, "text": "Nuestra pobreza apostólica construye la comunidad fraterna y se expresa en la comunión de bienes (CC 24-25; Dir 64-65). Por ello: a) La gestión económica debe responder a las exigencias de la vida común, procurar una efectiva comunicación de bienes entre las personas, las comunidades, los Organismos Mayores y la Congregación entera y promover una cultura de solidaridad especialmente con los pobres362. b) Al inicio de su mandato el Gobierno del Organismo Mayor, con la colaboración del Consejo de Economía, elaborará un detallado Plan económico-financiero, que será sometido a discusión en alguna instancia de participación del Organismo (asamblea, reunión de superiores, etc.) antes de su aprobación; finalmente será elevado al Gobierno General. Con la ayuda de la Congregación, todo Organismo Mayor debe buscar su autofinanciación, entendida ésta como capacidad de generar recursos económicos propios para atender a su vida y misión, y para colaborar en la misión universal de la Congregación (n. 287 a, 304 c). Para ello, debe contar fundamentalmente con su propio empeño, su creatividad y trabajo, con su ahorro, la efectiva puesta en común de los bienes y la ayuda del Gobierno General363."}, {"num": 522, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "1", "articulo_title": "Sujetos de esta capacidad", "seccion": null, "text": "Todos los Organismos de la Congregación que gozan de personalidad jurídica o las asociaciones civiles que los representen (CC 100; Dir 524), y estén debidamente reconocidas en derecho, tienen capacidad de adquirir, poseer, hipotecar, enajenar y administrar bienes y ejercer sobre ellos cualquier acto de propiedad, sometiéndose siempre a nuestras disposiciones y ajustándose a la legislación de cada país. Cualquier otra corporación, entidad, asociación o fundación, tanto de interés público como privado, sean canónicas, civiles, mercantiles o industriales, a las que la ley les conceda personalidad jurídica propia, con capacidad jurídica para actuar económicamente, que se establezcan en el ámbito de los Organismos de la Congregación, se consideran pertenecientes a la Congregación o al Organismo que se adscriba. Si no se estipula expresamente lo contrario, sus bienes tendrán la consideración de vinculados a la Congregación. Sin embargo, en caso de contracción de deudas, se aplicarán las responsabilidades y obligaciones sentadas por el canon 639, recogidas en CC 101 y aplicadas por los nn. 532-533 del Directorio."}, {"num": 523, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "1", "articulo_title": "Sujetos de esta capacidad", "seccion": null, "text": "La representación de las personas jurídicas de la Congregación está conferida a sus legítimos Superiores, conforme a las Constituciones (CC 97, 105). Ellos están facultados para ejercer en nombre de la persona jurídica de la Congregación a la que representan, los actos de disposición descritos en n. 522. Los Superiores pueden delegar esta facultad según derecho, pero el Delegado no podrá en ningún caso traspasar los límites del mandato, no quedando la Congregación obligada en lo que se haya excedido, a no ser que expresamente lo ratifique el Superior."}, {"num": 524, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "2", "articulo_title": "Titularidad de los bienes", "seccion": null, "text": "La titularidad de los bienes de cualquier clase, como escrituras públicas, inscripción de los mismos en los Registros civiles, títulos y cuentas bancarias, se dispondrá de forma que quede claramente garantizada la propiedad de la Congregación, adoptando para ello las medidas adecuadas, conforme a la legislación de cada país, que garanticen el derecho de disponer de los bienes temporales para sus fines. Con esta finalidad, en cuanto fuere posible, úsese la traducción a la lengua vernácula de uno de los títulos oficiales de la Congregación (n. 24) aplicado a la Congregación, al Organismo Mayor o a la Casa. Cuando esto no fuere posible, úsese el título legalmente reconocido para la Congregación en cada país, sea a modo de asociación o institución civil. En todo caso deberá siempre evitarse la titularidad a nombre de persona física ajena o propia de la Congregación; para el supuesto que no fuese posible deberán tomarse las precauciones necesarias para asegurar en todo momento la propiedad real y permanente de la Congregación, consultando en caso necesario al Gobierno General."}, {"num": 525, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "3", "articulo_title": "Competencias y autorizaciones", "seccion": null, "text": "Incumbe al Gobierno General y, proporcionalmente a los demás Gobiernos, estimular y dirigir la cooperación entre los diversos Organismos (nn. 307, 309), poner en práctica la subordinación de la propiedad de los bienes en el ámbito universal de la Congregación (CC 100; Dir 580) y promover una justa administración y redistribución de los bienes al servicio de la misión y de la fraternidad364."}, {"num": 526, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "3", "articulo_title": "Competencias y autorizaciones", "seccion": null, "text": "No habiendo contracción de deudas, el Gobierno General puede hacer y autorizar adquisiciones, gastos y obras necesarias sin limitación de cantidad. Lo mismo puede hacer el Gobierno del Organismo Mayor dentro de su jurisdicción, previa aprobación del Gobierno General cuando la cuantía de la operación exceda el 20 % del presupuesto anual de la entidad respectiva (n. 457 q)."}, {"num": 527, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "3", "articulo_title": "Competencias y autorizaciones", "seccion": null, "text": "En cuanto al Gobierno Local, aténgase a lo determinado en los nn. 572 y 574. Pero para inversiones en bienes inmuebles ha de contar siempre con la autorización expresa del Superior Mayor con su Consejo."}, {"num": 528, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "4", "articulo_title": "Enajenaciones y contracción de deudas", "seccion": null, "text": "El Superior General, con el voto deliberativo de sus Consultores, podrá, dentro del ámbito de su jurisdicción, disponer tanto a título gratuito como oneroso de los bienes de la Congregación, así como constituir derechos reales, gravarlos, contraer deudas, y autorizar para que puedan efectuar estos actos los Organismos Mayores y las Casas, hasta la cantidad que la Sede Apostólica haya autorizado para el respectivo país (can 638 § 3). Para actos que excedan la predicha cantidad, debe pedir el beneplácito de la Sede Apostólica, previo voto deliberativo de los Consultores (n. 496 n)."}, {"num": 529, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "4", "articulo_title": "Enajenaciones y contracción de deudas", "seccion": null, "text": "El Superior Mayor, con voto deliberativo de los Consultores (n. 457 q), dentro del ámbito de su jurisdicción y conforme al n. 526, podrá disponer, tanto a título gratuito como oneroso de los bienes de la Congregación así como gravarlos, contraer deudas y autorizar para que puedan efectuar estos actos las casas de su jurisdicción, siempre que no excedan el 75% de la cantidad que haya autorizado la Sede Apostólica para el respectivo país. Para los actos que excedan esa cantidad, ha de recurrir al Gobierno General (n. 496 n)"}, {"num": 530, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "4", "articulo_title": "Enajenaciones y contracción de deudas", "seccion": null, "text": "El Superior Local, previo el voto deliberativo de la comunidad en reunión plenaria (n. 433 b) y dentro de su jurisdicción, ha de recurrir siempre al Superior Mayor y su Consejo (n. 457 q) para disponer, tanto a título gratuito como oneroso de los bienes de la Congregación así como para gravarlos o contraer deudas."}, {"num": 531, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "4", "articulo_title": "Enajenaciones y contracción de deudas", "seccion": null, "text": "Las deudas existentes en las Casas y en las Provincias se consideran acumulativas en régimen interno; para conceder la contracción de una nueva deuda a Casas ya adeudadas en la cantidad máxima arriba señalada, se ha de recurrir al Gobierno General."}, {"num": 532, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "4", "articulo_title": "Enajenaciones y contracción de deudas", "seccion": null, "text": "Las personas jurídicas de la Congregación sólo responderán moral, civil y canónicamente de las obligaciones contraídas mediante actos legítimos de sus Superiores, a tenor del derecho (CC 101)."}, {"num": 533, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "4", "articulo_title": "Enajenaciones y contracción de deudas", "seccion": null, "text": "La responsabilidad y deudas contraídas por cada persona jurídica de la Congregación recae exclusivamente sobre ella, aun cuando el Superior de grado más alto hubiera dado la licencia necesaria a norma del derecho universal (can 639) o propio (CC 101)."}, {"num": 534, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "5", "articulo_title": "Incremento del patrimonio de la Congregación y capitalización", "seccion": null, "text": "Acrecienta el patrimonio y bienes de la Congregación como persona jurídica reconocida en cada país: a) El patrimonio y bienes de las Provincias, Delegaciones Independientes, Casas e instituciones generalicias que se supriman. b) Los bienes dejados a la Congregación en general o a algún Organismo o individuo de la misma, ya sea por legado, herencia, donación o cualquier otro título, siempre que lo sean para dar cumplimiento a algún fin que afecte a toda la Congregación. c) Las obras audiovisuales, literarias, artísticas o científicas, ya sean derechos de propiedad intelectual o industrial, indemnizaciones por accidente, así como cuentas, depósitos o cualquier otro contrato bancario formalizado sobre bienes no patrimoniales y sus liquidaciones, de los claretianos fallecidos cuando estaban incardinados a alguna casa generalicia, debiendo para ello tomar las medidas oportunas que garanticen a la Congregación como beneficiaria. d) Las pensiones e indemnizaciones por accidentes, las obras audiovisuales, literarias, artísticas o científicas, ya sean derechos de propiedad intelectual o industrial, así como cuentas, depósitos o cualquier otro contrato bancario formalizado sobre bienes no patrimoniales y sus liquidaciones, de los incardinados en una casa generalicia antes de su salida definitiva de la Congregación. Lo producido por estos conceptos a partir de su salida se resolverá por el Gobierno General teniendo en cuenta el canon 702."}, {"num": 535, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "5", "articulo_title": "Incremento del patrimonio de la Congregación y capitalización", "seccion": null, "text": "Acrecienta el patrimonio de la Provincia o Delegación Independiente: a) El patrimonio y bienes de las Delegaciones Dependientes y Casas de su jurisdicción que se suprimieren. b) Los bienes dejados al Organismo o individuo del mismo, ya sea por legado, herencia, donación o cualquier otro título, hechos expresamente al Organismo. c) Los bienes dejados al Organismo o individuo del mismo, ya sea por legado, herencia, donación o cualquier otro título, hechos indeterminadamente a la Congregación en la Provincia o Delegación Independiente. d) Los bienes y derechos indicados en el n. 534 c cuando se trate de claretianos fallecidos durante su incardinación al Organismo, teniendo en cuenta lo qiue allí mismo se indica. e) Todo lo enumerado en el n. 534 d si se trata de individuos incardinados en el Organismo en el momento de su salida de la Congregación, observando en su aplicación lo que allí mismo se prescribe."}, {"num": 536, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "5", "articulo_title": "Incremento del patrimonio de la Congregación y capitalización", "seccion": null, "text": "Acrecienta el patrimonio de la Casa: a) Todas las ganancias y emolumentos que los individuos de la comunidad adquieran con su industria o trabajo, como también los estipendios de misas. b) Todo lo que perciban por cualquier género de pensión, subvención o seguro que les corresponda por una actividad o título adquirido posteriormente a la profesión religiosa, o que tenga relación directa con su condición de religiosos. c) Los legados, herencias, donaciones, etc. dejados a cualquiera de sus miembros, que no tengan una finalidad determinada ajena a la Congregación. Se exceptúan las herencias patrimoniales y otros bienes de los que se habla en el n. 73. d) Los libros, obras de arte, etc. publicados o creados por los miembros de la comunidad, con todos los derechos de reedición, traducción y reproducción, y los manuscritos preparados para su publicación."}, {"num": 537, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "5", "articulo_title": "Incremento del patrimonio de la Congregación y capitalización", "seccion": null, "text": "Los derechos de autor devengarán a favor de la Casa a la que esté permanentemente adscrito el autor; en caso de traslado, devengarán a favor de la nueva Casa a partir de la fecha de adscripción a la misma. Podrán estipularse acuerdos especiales en esta materia entre la Casa y el autor cuando lo aconsejen situaciones particulares del autor, de la Casa o de la misma publicación."}, {"num": 538, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "5", "articulo_title": "Incremento del patrimonio de la Congregación y capitalización", "seccion": null, "text": "Quedando firme lo anteriormente dicho, la Congregación, por exigencias de pobreza y de testimonio, debe evitar la capitalización propiamente dicha. Sin embargo: a) No se considera capitalización propiamente dicha sino ahorro, tener un fondo prudencial de reserva, proporcional a las necesidades de cada Organismo. b) En un momento determinado, cualquier Organismo Menor, competentemente autorizado, puede acumular fondos para un fin concreto de inversión próxima365. Estos fondos estarán depositados en la Administración General o Provincial, según los casos. c) Todos los Organismos y sus administraciones deberán constituir fondos de reserva para cubrir las actuales o potenciales obligaciones por cargas sociales de sus empleados y otras obligaciones."}, {"num": 539, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "5", "articulo_title": "Incremento del patrimonio de la Congregación y capitalización", "seccion": null, "text": "Las Casas no pueden capitalizar ni acumular fondos, teniendo en cuenta, sin embargo, lo dicho en el n. 538. Las Provincias y Delegaciones Independientes podrán tener y acumular fondos con prudente medida, según las exigencias de las necesidades de los centros de formación, apostolados gratuitos, misiones, etc., y en previsión de casos de emergencia. Corresponde al Gobierno General vigilar para que estos fondos no sobrepasen una justa medida. El Gobierno General podrá hacer esto mismo con la amplitud conveniente, en la misma línea que las Provincias y Delegaciones Independientes; además consolidará la Procura General para ayuda de las Misiones366 y mantendrá el Fondo de Ayuda en beneficio, sobre todo, de los Organismos necesitados367."}, {"num": 540, "parte": "PARTE CUARTA", "capitulo": "XIX", "capitulo_title": "LA CAPACIDAD DE ADQUIRIR, POSEER, ADMINISTRAR Y ENAJENAR BIENES", "articulo": "5", "articulo_title": "Incremento del patrimonio de la Congregación y capitalización", "seccion": null, "text": "Por regla general, no se ha de prestar dinero ni avalar préstamos a los extraños a la Congregación. Si algún motivo razonable lo aconsejare, ha de hacerse con las debidas garantías y han de aplicarse las normas de los nn. 529 y 531. E 5-6. cf E 7-9; EMP 31.1."}, {"num": 541, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los encargados de la administración y control de los bienes temporales de la Congregación pueden ser Ecónomos o Administradores. Los primeros tienen a su cuidado los bienes materiales de la Congregación, Provincia o Casa; los segundos son encargados de la gestión económica de alguna obra o actividad especial, de carácter local, provincial o general. Unos y otros deben tener cualidades para este trabajo y en su servicio deben hermanar la justicia y la caridad."}, {"num": 542, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los Ecónomos y Administradores, por razón de su cargo, pueden hacer lícita y válidamente los actos de administración ordinaria, en conformidad con los presupuestos aprobados y bajo la dependencia y dirección del superior respectivo. Podrán realizar igualmente actos de administración extraordinaria, siempre que estos hayan sido aprobados. En cambio, no podrán hacer otros actos de administración extraordinaria por sí mismos. Estos serán inválidos o ilícitos si lo hicieran sin la licencia expresa de sus Superiores."}, {"num": 543, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Corresponde al Ecónomo General el cuidado y la administración, en conformidad con las Constituciones, de los bienes que pertenecen a la Congregación, como persona jurídica estrictamente considerada. Por lo mismo, ha de colocar con cautela y en forma segura y productiva los bienes de la Congregación, custodiar y gestionar las obligaciones, títulos, depósitos, etc., confiados al cuidado de la misma, a no ser que, en casos particulares, el Superior General con su Consejo provea de otro modo."}, {"num": 544, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Ecónomo General ha de ejercer una prudente vigilancia sobre las Administraciones Provinciales, pudiendo para ello verificar por sí mismo o por un Delegado visitas periciales, en conformidad con lo dicho en el n. 483 b. Cuando se estime oportuno, podrán realizarse con la colaboración de asesores técnicos profesionales."}, {"num": 545, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Corresponde también al Ecónomo General informar convenientemente y del modo más prudente posible a la Congregación de la marcha de la Administración General, proyectos, perspectivas, orientaciones, etc. y sobre todo de las aportaciones recibidas de los Organismos y las ayudas prestadas a los mismos."}, {"num": 546, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Para colaborar con la Administración General habrá un Consejo General de Economía. a) El Consejo General de Economía se compondrá del Presidente, que será el Ecónomo General, y al menos seis vocales, nombrados por el Gobierno General. Durarán en el cargo por tres años, pero podrán ser confirmados para otros períodos. La reunión de los vocales con el Presidente forma el Consejo Pleno, y ha de tenerse una vez al año. b) Entre los miembros del Consejo, se podrán conformar diversas comisiones, cada una dedicada al tratamiento de algún tema específico de la economía de la Congregación. Estarán constituídas por el Presidente y algunos de los vocales, designados por el Gobierno General. Sus reuniones -presenciales o telemáticas- deberán verificarse siempre que el Gobierno General o el Ecónomo General lo requieran368. XXIV CapGen, acta 12. c) Es cometido del Consejo General de Economía emitir su dictamen técnico sobre cuantos asuntos económicos de importancia se presenten a la aprobación del Gobierno General, diseñar líneas de inversión369, asesorar en la formación y aprobación de los presupuestos, inversión de fondos, revisión de la Memoria Económica General para el Capítulo General y otros temas de índole económico-administrativa. d) Cada año informará al Gobierno General sobre la marcha de la Administración General y el cumplimiento de nuestra legislación sobre economía y administración en todos los Organismos370."}, {"num": 547, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cuanto se ha dicho del Ecónomo General, se aplica proporcionalmente a los Ecónomos Provinciales y Locales."}, {"num": 548, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "En todas las Provincias, y en las Delegaciones Independientes funcionará un Consejo de Economía371, nombrado por el respectivo Gobierno, el cual constará al menos de tres vocales y el Ecónomo Provincial como Presidente. Tendrá proporcionalmente los mismos cometidos que el Consejo General de Economía y se reunirá al menos dos veces al año."}, {"num": 549, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los Administradores de actividades especiales dependen en su función de la comunidad, del Gobierno Provincial o General, según que la actividad tenga carácter local, provincial o generalicio. El Gobierno Provincial determina en el ámbito de su Provincia el carácter local o provincial de una actividad, y el Gobierno General determina su carácter generalicio. En cada caso, los Administradores han de tener perfectamente definidas sus funciones y atribuciones y sus relaciones con los Ecónomos respectivos."}, {"num": 550, "parte": "PARTE CUARTA", "capitulo": "XX", "capitulo_title": "LOS ECÓNOMOS Y ADMINISTRADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "El trabajo y la función administrativa requieren siempre una preparación y técnica adecuada. Por eso, cuantos en la Congregación desempeñan cargos de Ecónomos y Administradores deben tener esta preparación y ponerse al día, perfeccionando cuidadosamente la técnica administrativa, en consonancia con los importantes objetivos del cargo que desempeñan. Para ello: a) Se procurará que durante los años de formación, los formandos adquieran los conocimientos elementales de economía y administración372 b) Se organizarán cursillos de especialización obligatorios para los Ecónomos y Administradores en ejercicio, en el ámbito local, provincial, interprovincial y aun general373. cf E 10-13. XXIV CapGen, acta 13. cf E 14.a. cf E 14.b."}, {"num": 551, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Fuera de las administraciones ordinarias admitidas por el uso, no se constituirán otras a no requerirlo una causa justa y mediante el oportuno decreto del Superior Mayor con el consentimiento de sus Consultores (n. 457 p). El Superior Mayor que constituye alguna administración ha de establecer para ella un estatuto especial que garantice su funcionamiento y control en conformidad con el derecho universal y el nuestro propio, y salvando las exigencias de nuestra pobreza."}, {"num": 552, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Los Ecónomos y Administradores asumirán su cargo respectivo y tomarán posesión de él mediante un acto de formal entrega y recepción del libro de inventario de bienes y de todos los demás libros de administración, con la comprobación de los saldos y fondos existentes (n. 359)."}, {"num": 553, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Cada administración tendrá el inventario de los bienes que administra, así como todos los libros necesarios para el debido control de las operaciones correspondientes (can 1283 § 2)."}, {"num": 554, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Todas las administraciones deben ser convenientemente revisadas y controladas por los Superiores competentes mediante la revisión y firma periódica de los libros y la comprobación de fondos. Firman los libros, además de los Ecónomos y Administradores, el Superior y los Consultores o el Superior y el Director de la actividad administrada. La periodicidad será generalmente mensual, a no ser que la naturaleza de la actividad aconseje o exija un período más largo. La revisión y firma de los libros y la comprobación de fondos se deberán hacer también en las visitas canónicas de los Superiores Mayores."}, {"num": 555, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "La administración de bienes no pertenecientes a la Congregación, y ejercida por los nuestros y con responsabilidad jurídica de la Congregación, debe regularse por las normas del derecho universal y del nuestro propio."}, {"num": 556, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "A ninguno de los nuestros le será lícito ejercer cargos públicos que lleven consigo ejercicio de administración ni encargarse de administrar bienes pertenecientes a personas extrañas a la Congregación. Si en algún caso hubiera causa grave para aceptar la administración de bienes de los extraños, es necesaria licencia previa, dada por escrito, del Superior Mayor respectivo, oído su Consejo, el cual señalará las normas necesarias para que por ello no provenga ninguna responsabilidad a la Congregación."}, {"num": 557, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "No se acepten cargas o Fundaciones de Misas perpetuas si no es con la autorización del Superior Mayor dada por escrito con el consentimiento de sus consultores (n. 457 r, 496 o). Cúmplanse fielmente las disposiciones canónicas sobre el particular. Las comunidades que habitualmente no reciban estipendios de misas, pueden prescindir del libro de misas. No obstante, las intenciones que se reciben, su estipendio y las misas celebradas con ese estipendio se tienen que anotar en una cuenta propia en el libro de administración de la comunidad."}, {"num": 558, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Cuando fuera necesario obtener préstamos externos, cúmplanse rigurosamente, además de nuestras disposiciones y del Derecho de la Iglesia (can 639 § 5), las leyes del país, realizando esas operaciones con instituciones de crédito de reconocida solvencia. Exclúyanse siempre los préstamos de particulares, aun cuando éstos estuvieran legalmente admitidos y tuvieran menores costos."}, {"num": 559, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Las cuentas bancarias, títulos y bienes de la Congregación figurarán, en cuanto sea posible y las leyes de cada país lo consientan, a nombre de la correspondiente entidad de la Congregación, y no a nombre de particulares, y en ella figurarán dos o más firmas, que normalmente serán las del Superior, Ecónomo, Consultores o Directores de actividades."}, {"num": 560, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Cuando por razones especiales, por ejemplo por exigencias de la Administración Pública, fuera necesario tener cuentas a nombre de particulares, hágase siempre con el permiso de los Superiores y uniendo a la firma del particular la del Superior o Ecónomo correspondiente (n. 559)."}, {"num": 561, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Para el movimiento ordinario de fondos se podrá utilizar indistintamente cualquiera de las firmas que figuren en la cuenta o título. Con respecto al movimiento de cantidades importantes e inversión de valores, el Gobierno General y los Gobiernos de los Organismos Mayores determinarán la cantidad y el modo de proceder; en cualquier caso, para realizar estas operaciones se requerirá la autorización de los respectivos Consejos y el registro de dos firmas."}, {"num": 562, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Las Administraciones de los Organismos Mayores enviarán, al menos, una vez al año el Balance general de situación, con detalle de su desenvolvimiento económico anual, a la Administración General."}, {"num": 563, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Las Administraciones Provinciales y la Administración General presentarán a los Capítulos respectivos una Memoria económica detallada y técnica que refleje con exactitud la situación económica de las Casas y de la Provincia en los Capítulos Provinciales, y de las Provincias y de la Congregación en el Capítulo General (n. 378). Previamente, las Casas y las Provincias enviarán los datos según esquemas técnicos y unificados."}, {"num": 564, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "1", "articulo_title": "Las administraciones", "seccion": null, "text": "Todos los Ecónomos y Administradores, según los casos, y en todos los órdenes, cumplan con fidelidad los mandatos de la autoridad legítima en materia de impuestos, tributos, etc."}, {"num": 565, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "El \"plan de cuentas\" se realiza en todas las instancias de la Congregación, por un sistema general de contabilidad, cuyo objeto es asegurar la eficacia administrativa. Este sistema, salvando algunas peculiaridades de cada país, permite unificar conceptos, valorar criterios operativos y organizar el estado de cuentas, libros, etc., con uniformidad congregacional."}, {"num": 566, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "A ese plan general deben acomodarse todas las Administraciones de los distintos Organismos Mayores del Instituto, ya sea de una manera sencilla por partida simple, ya de una forma más técnica por partida doble bien llevada en libros, fichas o de alguna forma mecanizada."}, {"num": 567, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Cada Organismo Mayor, según el grado de centralización que se adopte, pedirá la rendición de cuentas de las casas con la frecuencia que le pareciere oportuno; pero, al menos una vez cada trimestre, todas las comunidades enviarán a la Administración Provincial el estado trimestral con sus ingresos y gastos y su balance de situación según los módulos establecidos."}, {"num": 568, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Cada año, antes de terminar el ejercicio económico, los Ecónomos y Administradores han de formalizar los presupuestos de ingresos y gastos para el año siguiente y presentarlos dentro de las fechas señaladas por los Superiores respectivos para su aprobación (n. 457 p)."}, {"num": 569, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Los presupuestos de la comunidad serán confeccionados, previa información de lo realizado en el ejercicio anterior, con la participación de los miembros de la Comunidad y serán aprobados en reunión plenaria de comunidad (n. 433 a)."}, {"num": 570, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Los presupuestos de las actividades (colegios, parroquias, editoriales, procuras, etc.): a) dependientes de la comunidad local, deberán formalizarse por separado del presupuesto de la Comunidad local, cada uno con sus programas anuales, bien delimitados y definidos. Serán aprobados oída la comunidad, por el Gobierno Local con los responsables de estas actividades, que los enviará, junto con el presupuesto de la comunidad, al Gobierno Provincial para su aprobación (n. 571). b) dependientes de la Provincia o Delegación, serán elaborados por sus administradores, con el aporte de los respectivos equipos directivos. c) Los presupuestos de las entidades jurídicas a que se refiere el n. 522, los han de elaborar los responsables de las mismas y deben ser sometidos a la aprobación del Gobierno General o del Organismo Mayor, según corresponda. Todos los presupuestos serán elaborados a partir de lo realizado en el ejercicio anterior."}, {"num": 571, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Los presupuestos de la comunidad firmados por el Gobierno Local, y de las actividades, firmados por sus respectivos responsables, serán presentados al Gobierno de la Provincia o Delegación para su aprobación (n. 457 p). Una vez aprobados, las cifras consignadas en ellos serán norma de gobierno en la Comunidad y en la actividad para el ejercicio actual detallado."}, {"num": 572, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Todos los gastos extraordinarios o de inversión que se prevé habrán de realizarse durante el ejercicio económico deberán incluirse en el presupuesto de la comunidad y en el de las actividades. En el concepto de imprevistos puede consignarse como máximo hasta un 10% de los gastos ordinarios previstos en los presupuestos."}, {"num": 573, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "A lo largo del año económico, mensual o trimestralmente, se irá realizando el control del presupuesto en todas las comunidades y actividades, al objeto de ir analizando el desarrollo del mismo y evitar desviaciones y desfases tanto en gastos como en ingresos."}, {"num": 574, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Si durante el ejercicio económico surgieran algunos gastos extraordinarios no previstos ni consignados en el presupuesto, el Gobierno Local podrá llevarlos a cabo con cargo al capítulo de imprevistos en el presupuesto. Pero si las cantidades consignadas no llegasen a cubrir este gasto extraordinario, debe pedir permiso al Gobierno del Organismo con un presupuesto adicional detallado y aprobado por la comunidad en reunión plenaria (nn. 433 c, 457 p). Tratándose de las actividades serán los responsables de las mismas los que aprobarán el presupuesto adicional para presentarlo a la aprobación del respectivo Gobierno de la Provincia o de la Delegación Independiente (n. 570)."}, {"num": 575, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "Los Ecónomos de las Provincias y Delegaciones Independientes también formalizarán los propios presupuestos y los presentarán al respectivo Gobierno. El presupuesto del Organismo, una vez aprobado y firmado por el Gobierno de la Provincia o Delegación (n. 457 n), será enviado, en las fechas señaladas, al Gobierno General para su aprobación (n. 496 q)."}, {"num": 576, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "2", "articulo_title": "Plan de cuentas y presupuestos", "seccion": null, "text": "El Ecónomo General, los Administradores generales y las casas generalicias harán sus propios presupuestos de ingresos y gastos necesarios, recogiendo las consignaciones de los Organismos inferiores, y los presentarán al Gobierno General para su aprobación (n. 496 q)."}, {"num": 577, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "3", "articulo_title": "Balances, Inventarios y Archivos", "seccion": null, "text": "El Ecónomo General, los Ecónomos Provinciales y Locales, y aun los Administradores de todos los órdenes, deberán llevar sus administraciones con todas las anotaciones al día, de forma que fácilmente puedan formalizar los Balances, o Estadísticas que sean necesarias o requeridas, para informar a las comunidades y Organismos correspondientes."}, {"num": 578, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "3", "articulo_title": "Balances, Inventarios y Archivos", "seccion": null, "text": "Todos los Ecónomos y Administradores deberán poner al corriente al finalizar cada año, los inventarios de las respectivas administraciones, anotando en ellos las altas habidas durante el ejercicio y restando las bajas y los correspondientes porcentajes de amortización de los valores del inmovilizado."}, {"num": 579, "parte": "PARTE CUARTA", "capitulo": "XXI", "capitulo_title": "LA GESTIÓN ADMINISTRATIVA", "articulo": "3", "articulo_title": "Balances, Inventarios y Archivos", "seccion": null, "text": "El Gobierno General, todos los Organismos mayores y menores, y todas las actividades han de tener de la forma más conveniente a las propias necesidades, un archivo administrativo en el que estén conservados diligentemente los títulos de propiedad, testamentos, contratos, escrituras públicas y otros documentos semejantes, además de los que, por razón de exigencias tributarias, hayan de guardarse durante el tiempo exigido. El original de las escrituras públicas, testamentos y contratos importantes debe guardarse en el archivo provincial, dejando fotocopia legalizada de los mismos en el archivo local correspondiente."}, {"num": 580, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "La propiedad de los bienes en la Congregación es subordinada (CC 100). Por ello, el Superior General y los Superiores Mayores, con el consentimiento de sus Consultores (nn. 457 o, 496 n) y oídos previamente los interesados, pueden con causa justa y proporcionada, observando las normas del derecho y en el ámbito de su respectiva jurisdicción, transferir de una persona jurídica a otra la propiedad de los bienes."}, {"num": 581, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "La comunicación de bienes se actúa en la Congregación, ordinariamente mediante aportaciones, ayudas y préstamos, que se consignarán en los presupuestos. El Gobierno General, una vez comprobada la necesidad en los presupuestos, ayudará a los Organismos Mayores que lo soliciten. El Gobierno General señalará la aportación mínima obligatoria con que todos los Organismos Mayores y Casas Generalicias, han de contribuir a la Administración General, como símbolo de fraternidad y de comunicación de bienes. Corresponde, asimismo, al Gobierno General, señalar las aportaciones especiales con que los Organismos Mayores económicamente fuertes han de contribuir a las necesidades generales de la Congregación, previo estudio de los presupuestos por el Consejo General de Economía y una vez oídos los interesados. Lo que se ha dicho del Gobierno General se aplicará a los Organismos Mayores con relación a las Casas, tanto en las ayudas que se han de prestar como en las cuotas que se han de señalar. Además, dado que las Casas no pueden capitalizar (n. 539), al final de cada ejercicio, los saldos o remanentes de las Casas pasarán al proprio Organismo Mayor, salvo un prudente fondo de funcionamiento."}, {"num": 582, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Una Casa o un Organismo Mayor pueden ayudar directamente, en casos excepcionales, a otra casa u Organismo con préstamos o donaciones o de cualquiera otra forma de comunicación de bienes, previa autorización del Gobierno inmediatamente superior correspondiente (n. 457 o)."}, {"num": 583, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Todos los Organismos Mayores de la Congregación deben preocuparse de sus enfermos y ancianos. Para ello, es conveniente utilizar alguna forma de seguros y pensiones (n. 53), en el modo que mejor pareciere en cada Organismo374. Los gastos de aseguración y pensión de los miembros de las casas generalicias los abonarán o la misma casa o el Gobierno General."}, {"num": 584, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cuando un enfermo, un inválido o uno en edad de jubilación: a) sea destinado de un Organismo Mayor a otro, el Organismo del que procede pasará a aquel que le acoge, en conformidad con los años de servicio y el tipo de enfermedad o invalidez, una pensión, o parte proporcional de la misma, equivalente a la de los demás pensionados del Organismo que lo recibe, si la tienen, o una cantidad convenida entre los Organismos interesados375. b) Cuando uno sea destinado de una casa generalicia a un Organismo Mayor y no cuente con ningún tipo de pensión al regresar al mismo, el Gobierno General le pasará una pensión teniendo en cuenta la normativa del país y el tiempo que ha trabajado a su servicio376."}, {"num": 585, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Procúrese atender con equidad y caridad a los que dejen de pertenecer a la Congregación, ayudándoles, sobre todo en las primeras necesidades, teniendo en cuenta las circunstancias de cada uno. Esta obligación recae y debe cumplirla el Organismo Mayor al que pertenecía el individuo o la Administración General si estaba adscrito a una casa generalicia."}, {"num": 586, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Las ayudas prolongadas a los familiares necesitados de los miembros de la Congregación correrán por cuenta del Organismo Mayor respectivo o del Gobierno General para los de las Casas generalicias. cf E 16. cf ib."}, {"num": 587, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Con los empleados de nuestras comunidades y actividades cúmplanse las normas legales, tanto en lo que concierne a remuneración como a seguridad social o asistencial, y superándolas cuando la caridad o la justicia lo exijan, pero siempre dentro del marco jurídico laboral y evitando lo que pueda suponer en el futuro un peso insostenible en la relación contractual o laboral."}, {"num": 588, "parte": "PARTE CUARTA", "capitulo": "XXII", "capitulo_title": "COMUNICACIÓN DE BIENES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Consígnese en los presupuestos de los diversos Organismos una cantidad proporcionada y significativa, destinada a socorrer a las Iglesias particulares necesitadas, a los pobres, misiones y obras sociales (n. 67). La distribución efectiva la realizará la propia comunidad en las casas y residencias y el gobierno respectivo en los Organismos Mayores377."}, {"num": 589, "parte": "PARTE CUARTA", "capitulo": "XXIII", "capitulo_title": "LA INFORMACIÓN ECONÓMICA EN LA CONGREGACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "La transparencia y claridad de la gestión administrativa que debe existir en la Congregación se consigue mediante una conveniente información periódica a todos los niveles. Esta información se hará realidad: a) En la formulación y elaboración del presupuesto comunitario. b) En la realización y el control periódico del mismo presupuesto. c) En las reuniones de carácter económico que, a nivel de Ecónomos, se deberán tener en cada Organismo Mayor. d) Con una comunicación anual a nivel local, provincial y general de las acciones administrativas y de las realidades económicas de ingresos, gastos e inversiones y la comunicación de bienes, con la prudencia exigida por las circunstancias."}], "chapters": [{"roman": "PRELIMINAR", "title": null, "parte": null}, {"roman": "I", "title": "COMUNIDAD MISIONERA", "parte": "PARTE PRIMERA"}, {"roman": "II", "title": "CASTIDAD", "parte": "PARTE PRIMERA"}, {"roman": "III", "title": "POBREZA", "parte": "PARTE PRIMERA"}, {"roman": "IV", "title": "OBEDIENCIA", "parte": "PARTE PRIMERA"}, {"roman": "V", "title": "ORACIÓN", "parte": "PARTE PRIMERA"}, {"roman": "VI", "title": "CONFIGURACIÓN CON CRISTO", "parte": "PARTE PRIMERA"}, {"roman": "VII", "title": "NUESTRA MISIÓN", "parte": "PARTE PRIMERA"}, {"roman": "VIII", "title": "EL PROGRESO EN LA VIDA MISIONERA", "parte": "PARTE PRIMERA"}, {"roman": "IX", "title": "LOS LLAMADOS A LA VIDA MISIONERA", "parte": "PARTE SEGUNDA"}, {"roman": "X", "title": "LOS NOVICIOS Y SU MAESTRO", "parte": "PARTE SEGUNDA"}, {"roman": "XI", "title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "parte": "PARTE SEGUNDA"}, {"roman": "XII", "title": "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBÍTEROS", "parte": "PARTE SEGUNDA"}, {"roman": "ANEXO", "title": "ANEXO A LA PARTE SEGUNDA", "parte": "PARTE SEGUNDA"}, {"roman": "XIII", "title": "CONSTITUCIÓN ORGÁNICA DE LA CONGREGACIÓN", "parte": "PARTE TERCERA"}, {"roman": "XIV", "title": "NORMAS Y ÓRGANOS DE GOBIERNO", "parte": "PARTE TERCERA"}, {"roman": "XV", "title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "parte": "PARTE TERCERA"}, {"roman": "XVI", "title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "parte": "PARTE TERCERA"}, {"roman": "XVII", "title"
