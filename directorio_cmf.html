ríodo para el cual fue elegido o nombrado, el sucesor designado comienza un nuevo período. Mas si resultara elegido el mismo que presentó la renuncia, su reelección o nuevo nombramiento solamente durará hasta completar el período anterior. Tratándose de un Superior Local, el elegido o nombrado para sucederle, lo es solamente para completar el trienio. La vacante del Superior General o Provincial ha de ser provista a la mayor brevedad posible mediante la convocatoria del correspondiente Capítulo (CC 123, 142; Dir 385 a). Para la vacante de un Superior Local corresponde al Superior Mayor con el voto consultivo de su Consejo determinar el modo de designación del superior que complete el trienio (nn. 419, 458 d)."}, {"num": 364, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "La autoridad en nuestro Instituto debe ser considerada como un servicio a la Iglesia, a la Congregación y a todos sus miembros y ha de ser ejercida según las normas del derecho universal y el nuestro propio."}, {"num": 365, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Si en algún caso y a tenor de los cánones 1427 y 1438 § 3, hubiera de realizarse en nuestra Congregación un proceso canónico, se observarán las normas procesuales del derecho universal."}, {"num": 366, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "El Superior General puede ejercer actos de jurisdicción, en orden al gobierno y disciplina interna en toda la Congregación (can 596, 622)."}, {"num": 367, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Los Superiores Provinciales tienen potestad ordinaria y propia, aunque subordinada, (CC 96, 111) para el gobierno de sus respectivas Provincias, según las normas del Derecho y de nuestras Constituciones . Los Superiores de Delegaciones Independientes gobiernan su Organismo con potestad delegada del Superior General (CC 88, 118). Tienen las facultades del Superior Mayor, salvo aquellas que el Superior General se hubiere reservado."}, {"num": 368, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Pueden delegar: a) Los Capítulos, mediante acto legítimo, y los superiores libremente o con el voto consultivo o deliberativo de su Consejo, según los casos, pueden delegar los derechos y facultades que poseen a personas o entidades de la Congregación, dejando a salvo la normativa de nuestra legislación (n. 496 c). b) Los Consejos, en casos extraordinarios, pueden delegar a sus respectivos superiores para que ejerzan los actos para los que necesitarían el voto deliberativo o consultivo. En los casos señalados por nuestro derecho (n. 229) o en otros de índole semejante (n. 457 f), el Superior Mayor y los consultores podrán delegar su derecho en el Superior Mayor y consultores de otro Organismo. Los Superiores no pueden delegar todas sus facultades ni pueden constituir Vicarios o sustitutos suyos en lugar de aquellos a quienes por su cargo o de derecho compete esta condición salvando lo dicho en el n. 370 b. Por lo demás, en la concesión y uso de las delegaciones, así como también en la facultad de subdelegar, se observen las normas del derecho universal (can 129-144)."}, {"num": 369, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "El servicio que los superiores han de prestar a los hermanos exige de ellos la presencia más o menos frecuente o continuada, según las características o circunstancias de la propia misión; por eso, la residencia en la propia casa, que es norma canónica para todos los superiores (can. 629), obliga de un modo especial a los locales."}, {"num": 370, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Para los casos de ausencia de la curia o de la propia casa, se establecen las siguientes normas de suplencia: a) Al Superior General y a los Superiores Mayores ausentes o impedidos, los suple el Vicario respectivo, o los otros Consultores presentes en curia y no impedidos, según el orden. b) A los Superiores Locales, ausentes o impedidos, los suple el Vicario y, en su defecto, el otro miembro del Gobierno Local; si no estuviera ninguno de los dos, el individuo designado por el mismo Superior, y si no hay tal designación, aquel a quien corresponda por orden de precedencia. c) El orden de precedencia, incluso para los casos de suplencia en la responsabilidad de los cargos, lo establecen: primero, la antigüedad de la primera profesión y segundo, la edad. d) Todos los Superiores pueden designar un sustituto para los oficiales ausentes o impedidos."}, {"num": 371, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "El Superior General ausente o impedido: a) conserva su autoridad y, por lo mismo, la puede ejercitar; b) puede reservarse los casos ordinarios que le pareciere. Durante su ausencia o impedimento, el Vicario o sustituto ejercen la autoridad para los casos urgentes y ordinarios. La autoridad del Superior General y de su Vicario o sustituto que le suplen es cumulativa y se supone ejercida cumulativamente en todos los casos no reservados. Los conflictos que se presenten se resolverán aplicando el principio de la prevención (can 1415) a partir de la fecha en que se realizó el acto."}, {"num": 372, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Lo que se dice en el número anterior se aplica también, guardando la debida proporción, a los Superiores Mayores o Locales."}, {"num": 373, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Los Vicarios, sustitutos y delegados aténganse en el ejercicio de la autoridad a los mandatos y a la mente del superior."}, {"num": 374, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Cuando un Superior de cualquier grado cesa en su cargo antes del término de su mandato, hace sus veces el respectivo Vicario (CC 117, 146) hasta que el cargo quede provisto mediante elección capitular (CC 123, 142; Dir n. 386 a; 389) o mediante determinación del respectivo Gobierno, según los casos (n. 419)."}, {"num": 375, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "Los superiores inmediatos asuman con decisión la responsabilidad de sus cargos y no acudan a los superiores de más alto grado para la resolución de los asuntos de su propia competencia. No obstante, pueden siempre solicitar orientación y criterios. De este modo se conseguirá un gobierno más adecuado a las circunstancias de cada comunidad308."}, {"num": 376, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "La autoridad en la Congregación", "seccion": null, "text": "El superior de régimen más elevado puede, con justa causa, avocar a sí mismo un acto propio del superior de régimen inferior al suyo."}, {"num": 377, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Relaciones que se han de dar", "seccion": null, "text": "Para mayor eficiencia y acierto en el gobierno religioso y para favorecer la corresponsabilidad de todos en el mismo, los responsables de los diferentes cargos y oficios presentarán a sus respectivos superiores una relación sobre la gestión a ellos encomendada, según los formularios y la periodicidad que determinare el superior. Los Secretarios General y Provincial informarán a la Congregación y a las Provincias sobre el estado de las mismas."}, {"num": 378, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Relaciones que se han de dar", "seccion": null, "text": "Antes del Capítulo Provincial, el Superior Local, ayudado por la comunidad, ha de enviar al Superior Provincial una relación sobre el estado de la casa, con miras a una relación sobre toda la Provincia que se ha de presentar al Capítulo Provincial (nn. 388, 563). Con este mismo fin, al terminar el período trienal del gobierno, tanto en las Provincias como en las Delegaciones Independientes, el Superior Local hará por duplicado la debida relación del trienio: uno de los ejemplares lo enviará al Superior Mayor respectivo y el otro lo depositará en el archivo local. TÍTULO II. EJERCICIO ORGÁNICO DEL GOBIERNO"}, {"num": 379, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Relaciones que se han de dar", "seccion": null, "text": "En el ejercicio orgánico del gobierno: a) La participación en la autoridad y gobierno se expresa por el ejercicio del derecho de voz y voto (nn. 322 ss)309. b) La emisión del voto en los Capítulos y Consejos por parte de cuantos legítimamente los componen, es no sólo un derecho que la ley les reconoce, sino también un deber que les impone el bien común, al que todos deben cooperar y, más especialmente, los designados como representantes de la comunidad (can 127 § 3)310. c) La participación en la gestión de gobierno mediante el voto tiene lugar, en los órganos correspondientes, a través de actos tanto colegiales como no colegiales, conforme se especifica en el derecho."}, {"num": 380, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Relaciones que se han de dar", "seccion": null, "text": "Son actos colegiales: a) todos los actos realizados en Capítulo General o Provincial; b) las elecciones hechas en la reunión plenaria de la comunidad local; c) la aceptación de la renuncia y designación de un cargo generalicio conferido por el Capítulo General que, por cualquier causa viniera a quedar vacante fuera del tiempo del Capítulo, con la única excepción del cargo de Superior General (CC 145). Para dicha aceptación y designación se requiere la presencia colegial de todo el Gobierno General; d) la dimisión de un profeso a norma del canon 699 § 1."}, {"num": 381, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Relaciones que se han de dar", "seccion": null, "text": "Los actos colegiales han de regularse por el canon 119, siempre que nuestro derecho propio no contenga una normativa particular. En los actos no colegiales el voto será deliberativo o consultivo, según esté previsto para cada caso en el mismo derecho."}, {"num": 382, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "Todos los que gozan de voz activa en Capítulo han de ser legítimamente convocados y tienen obligación de asistir. Si alguno cree tener una causa justa y proporcionada para no asistir, debe presentar su renuncia ante el Superior competente. La renuncia la aceptará o rechazará definitivamente el Superior General con sus Consultores o el Provincial con los suyos, según sea el Capítulo de que se trate, cuando renuncie quien asiste al Capítulo por derecho propio, o un Delegado concluido el período electoral. Pero si el Delegado renuncia durante el período electoral, el cuerpo de electores (a quienes se comunicará la renuncia) manifestará en las siguientes votaciones si la acepta o no."}, {"num": 383, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "La elección de Delegados se regirá por las siguientes normas: a) La elección de los Delegados a los Capítulos Provincial y General se hará ordinariamente por el sistema de cédulas. Para ello la comunidad celebrará reunión plenaria, durante la cual se hará la votación, cuyas papeletas incluirá el superior en sobre, que cerrará en presencia de la comunidad, y hará llegar rápidamente y en forma segura a los Escrutadores del respectivo Organismo Mayor. b) Quien por causa justa no haya podido asistir a dicha reunión plenaria y, asimismo, quien resida en comunidad fuera de la propia Provincia enviará directamente su voto a los Escrutadores, acompañándolo con documento autógrafo que justifique la votación . c) Para ejercer el derecho a voto por correo electrónico, el Superior Mayor solicitará permiso al Gobierno General para cada caso particular, indicando las razones que lo justifican. Concedido el permiso, el Superior Mayor notificará a la Secretaría General quiénes ejercitarán así el derecho al voto y su dirección personal de correo electrónico desde la cual cada uno enviará el voto a Secretaría General, así como las fechas en que se realizarán los escrutinios. El Secretario General hará el recuento de todos los votos recibidos con un miembro del Gobierno General, y enviará el resultado a los escrutadores311. d) Las votaciones serán sucesivas, previa información a los votantes del resultado de las anteriores. Todas ellas se harán en forma canónica y en los plazos debidamente señalados. e) Tanto para el Capítulo General como para el Provincial, se votará a la vez a todos los delegados sobre una lista única de quienes gozan de voz pasiva en el Organismo. Completada la elección de éstos, se considerarán sustitutos o suplentes, por orden, los que siguen en número de votos en la última votación o, subsidiariamente, en la precedente. f) En la primera y segunda votación se requiere la mayoría absoluta, a norma de canon 119. Para el tercer escrutinio la voz pasiva se reduce a los que han tenido más votos en el anterior, en número doble al de candidatos que quedan por elegir."}, {"num": 384, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "En la asistencia al Capítulo se observarán estas normas: a) Quien asista al Capítulo por doble o múltiple título, no puede emitir en él más que un solo voto. b) Si alguien viniera a ser vocal por derecho propio después de haber sido elegido Delegado de la Provincia, cesa el mandato como Delegado y entra en su lugar el sustituto. c) Quien por derecho propio sea vocal del Capítulo no puede ser elegido ni enviado como Delegado. d) Impedido el Superior Provincial para asistir al Capítulo, pasa el derecho de asistencia al que le sigue en orden (n. 370 a); impedido el Superior Local, pasa al Vicario, y en su defecto al otro miembro del Gobierno Local; o a quien corresponda según el orden de precedencia en el caso de que ninguno de los dos anteriores pueda (nn. 222, 370 c)312. A los Delegados impedidos los suplen por orden los sustitutos elegidos (n. 383 d). e) Una vez abierto el Capítulo, los participantes en él quedan inmutables. Por lo mismo, si, en marcha ya el Capítulo, un Capitular sustituido por el suplente quedara disponible, no recupera su derecho de asistencia; y si algún Capitular quedara impedido o se tuviera que ausentar definitivamente, no se le suple ni se le sustituye, a no ser que fuera el único representante del Organismo, en cuyo caso decidirá el mismo Capítulo. No obstante lo dicho, si alguno que no es Capitular resultara elegido para algún cargo del Gobierno General o Provincial, por el mismo hecho quedaría constituido vocal del respectivo Capítulo. 385 El período previo a los Capítulos comprende dos etapas. La primera es el anuncio del Capítulo: a) Ordinariamente se anuncia el Capítulo General un año antes de su celebración, y el Capítulo Provincial seis meses antes. Se hará siempre por medio de carta o circular del Superior General o Provincial o de su sustituto, si ocurriera el caso. Cuando vaca el cargo de Superior General o Provincial por muerte u otra causa legítima, el anuncio oficial de esta situación hecho a la Congregación o a la Provincia, es anuncio del Capítulo General o Provincial. b) Efecto del anuncio del Capítulo es que ya desde ese momento vayan realizándose todos los actos previos al Capítulo, como las elecciones de los Delegados, la designación de los XX CapGen, acta 12. Vocales que corresponde al Superior General o Provincial con sus Consultores (nn. 457 c, 495 c) y otros actos por el estilo. 386 La segunda etapa es la convocación del Capítulo: a) La hace el Superior General o Provincial, una vez concluida la elección de los vocales del Capítulo; si faltare alguno de ellos, la hace el sustituto con el consentimiento o consejo de los Consultores, según los casos (nn. 457 b, 463, 495 e, 499). b) Ha de hacerse por medio de una carta circular enviada oficialmente a la Congregación o a la Provincia. c) Da inicio desde la fecha de la carta de convocatoria al período propiamente capitular, durante el cual se han de rezar las preces señaladas por el Superior General o Provincial, según los casos, y tienen lugar los demás actos propios de dicho período capitular. d) Se ha de enviar a cada uno de los Capitulares. Sin embargo, es válida y suficiente la convocación que se hizo oficialmente a toda la Congregación o Provincia, aunque por cualquier causa no llegara en particular a alguno de los Capitulares. e) Podrá cambiarse en cuanto a los aspectos accidentales (el tiempo, el lugar, etc.) por el sustituto con los demás consultores si por cualquier causa viniera a faltar el Superior que convocó el Capítulo. 387 En la organización y preparación de los Capítulos se tendrá en cuenta que: a) La preparación de los Capítulos corresponde, respectivamente, al Gobierno General o Provincial313. b) Para que la labor de los Capítulos pueda prepararse oportunamente, todos los asuntos, cuestiones o temas de discusión, las relaciones de los Organismos independientes y de las casas generalicias (si se trata del Capítulo General) o de las Delegaciones Dependientes y de las casas (si se trata del Capítulo Provincial), habrán de estar en poder del Gobierno General o Provincial al menos cuatro meses antes del día señalado para la inauguración del Capítulo. c) Las personas y los Organismos de la Congregación pueden hacer llegar sugerencias y propuestas al Capítulo General (can 631 § 3) o Provincial, según los casos. d) El Superior General o el Provincial preparará los asuntos por medio de las convenientes comisiones y, una vez preparados, los presentará a los Capitulares al menos treinta días antes del comienzo del Capítulo. 388 A los Capítulos General y Provincial se presentarán dos relaciones: una acerca del estado de la Congregación o Provincia, otra sobre la situación económica. Su preparación corresponde, respectivamente, al Secretario sirviéndose de las Prefecturas y al Ecónomo, y serán previamente examinadas y aprobadas por los respectivos Consejos General y Provincial. Para la elaboración habrán de tenerse en cuenta las que previamente habrán presentado los Organismos inferiores (nn. 378, 563)."}, {"num": 389, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "La Mesa Presidencial del Capítulo la forman: a) en el Capítulo General, el Superior General, o su sustituto como Presidente, el Vicario (o si éste preside, el Consultor que le siga según derecho) y el Secretario Capitular; b) en el Capítulo Provincial: el Superior General, o su Delegado como Presidente, el Superior Provincial (y si éste preside o faltara, el Vicario) como Vicepresidente, y el Secretario Capitular. El nuevo Superior Provincial no forma parte de la mesa presidencial hasta que no tome posesión del cargo (n. 446). Hasta la elección del Secretario Capitular, el Secretario General o Provincial forma parte de la Mesa presidencial y cumple el oficio de Escrutador."}, {"num": 390, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "De Escrutadores Capitulares actúan los miembros de la Mesa Presidencial."}, {"num": 391, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "El Secretario Capitular debe ser elegido al principio del Capítulo, de entre los vocales del mismo, conforme a las normas del derecho universal (can 119)."}, {"num": 392, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "Si el Presidente cree oportuno que haya Moderadores éstos son ayudantes suyos, pudiendo nombrarlos él mismo o dejar al Capítulo que los designe."}, {"num": 393, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "Dada la importancia de los Capítulos, se deben celebrar en un ambiente que permita la dedicación exclusiva y plena de todos a las tareas capitulares. El Capítulo no se limita a las sesiones, sino que debe haber un amplio margen para una más intensa oración comunitaria y una continuada convivencia fraterna. Nadie se ausentará del Capítulo sin causa grave, reconocida por la Mesa Presidencial."}, {"num": 394, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "1", "articulo_title": "Normas comunes para los Capítulos", "seccion": null, "text": "Las elecciones en Capítulo se realizan en conformidad con el derecho (can 164-183) y con nuestra propia legislación. Si un vocal estuviera ausente, no podrá deputar a otro como procurador suyo ni dar su voto por escrito (can 167 § 1). Si estuviera presente en la casa, pero ausente de la sesión por enfermedad, los escrutadores recogerán su voto escrito (can 167 § 2)."}, {"num": 395, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Normas comunes para los Consejos", "seccion": null, "text": "Por Consejo se entiende la reunión del Superior o del que haga sus veces con sus Consultores."}, {"num": 396, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Normas comunes para los Consejos", "seccion": null, "text": "Los Consejos Generales, Provinciales, de las Delegaciones Independientes y locales han de celebrarse con la periodicidad que se establezca y, además, cuando el Superior lo juzgue oportuno, previa siempre la debida convocatoria. Tienen derecho y obligación de asistir a los Consejos, además del Superior, todos los Consultores con voz y voto; asisten también el Secretario y el Ecónomo, aunque no sean Consultores, pero en este caso sin voto. Preside el Superior respectivo o el Vicario, cuando aquél está ausente o impedido, y, en ausencia de ambos, el Consultor que haya sido designado o el que siga por orden de precedencia. Los Consejos han de ser convocados oralmente, por escrito o por otros medios, con la debida antelación para que puedan asistir todos los que tienen derecho y obligación de participar en ellos. Recibida la convocación, deben asistir todos los que tienen derecho a participar, a no ser que estuvieran legítimamente impedidos, en cuyo caso manifestarán oportunamente el impedimento al Superior."}, {"num": 397, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Normas comunes para los Consejos", "seccion": null, "text": "En los actos colegiales, el Consejo y el Superior que lo preside han de regularse por el canon 119, siempre que nuestro derecho propio no contenga una normativa particular. Salvo los casos en que el derecho exija un quorum más cualificado, se requiere la presencia de la mayoría de los que han de ser convocados, teniendo en cuenta para este cómputo lo que se dice más abajo, n. 399 c."}, {"num": 398, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Normas comunes para los Consejos", "seccion": null, "text": "En los actos no colegiales, la participación de los Consultores se regula por el canon 127 § 1 y se expresa principalmente, según los casos, con el voto deliberativo o con el voto consultivo (nn. 399-400, 404)."}, {"num": 399, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Normas comunes para los Consejos", "seccion": null, "text": "Para los actos de voto deliberativo. a) Hecha la convocación de los que tienen derecho a voto (n. 396), se requiere y es suficiente la presencia de la mayoría de los mismos, a menos que en algún caso el derecho exija un quorum más cualificado. b) Los Consultores ausentes de la casa no pueden votar por escrito o por teléfono ni por procurador. c) Los Consultores impedidos de asistir a la reunión, pero presentes en la casa, se consideran presentes en la reunión a todos los efectos y pueden hacer llegar su voto a la misma en la manera que el Superior juzgue más oportuna y segura, tutelando siempre el secreto del voto cuando éste sea tal. d) Si los ausentes, debidamente convocados, no pueden participar en el voto, puede el Superior, con el consentimiento de los otros Consultores, completar el quorum exigido mediante la convocación de otro profeso perpetuo, que actuará como sustituto (Dir 496 b). e) Un asunto queda aprobado si obtiene la mayoría absoluta de votos de los presentes (can 127 § 1). f) Después de cinco escrutinios ineficaces se puede diferir la decisión si así lo acuerda el Superior presidente; de lo contrario, la decisión se considera negativa. El asunto podrá ser nuevamente presentado sólo si surgen nuevos elementos."}, {"num": 400, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "2", "articulo_title": "Normas comunes para los Consejos", "seccion": null, "text": "En los actos de voto consultivo. a) Es necesaria la presencia de al menos dos Consultores, además del Superior o de quien haga sus veces. b) El Superior debe pedir el parecer de todos los Consultores presentes; de lo contrario, el acto sería nulo. c) Los Consultores ausentes pueden enviar su parecer por escrito o por otro medio de comunicación. La misma norma se aplica al caso en que esté ausente el Superior. d) El Superior no tiene obligación de seguir el parecer de su Consejo. Sin embargo, no se aparte del mismo, sobre todo si fuera unánime, sin una razón que a su juicio sea más poderosa (can 127)."}, {"num": 401, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Los Consultores y su voto", "seccion": null, "text": "Los Consultores han de ser eficaces colaboradores del Superior con el consejo, con el apoyo moral, con la ayuda en los trabajos y con el aviso fraternal314."}, {"num": 402, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Los Consultores y su voto", "seccion": null, "text": "En el desempeño de su cargo han de proceder: con prudencia para examinar maduramente los asuntos y dar un sabio y justo consejo; con rectitud y religiosa sinceridad, para manifestar al Superior, dejando a un lado toda consideración y afectos humanos, lo que ante Dios juzgaren conveniente al bien de la Congregación; con escrupulosa fidelidad al secreto de oficio, sobre todo cuando el bien de la Congregación o del individuo lo exijan, o el Superior en uso de su derecho (can 127 § 3) lo imponga."}, {"num": 403, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Los Consultores y su voto", "seccion": null, "text": "Los Consultores y Oficiales de las curias provincial y general están sujetos al Superior Local de su domicilio, en cuanto al orden doméstico y a la disciplina religiosa; no lo están en las cosas propias de su cargo y en la gestión de las mismas."}, {"num": 404, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "3", "articulo_title": "Los Consultores y su voto", "seccion": null, "text": "El voto de los Consultores unas veces es optativo por no estar el Superior obligado a pedirlo, y otras es obligatorio, porque el derecho universal o propio le obliga a pedirlo para que su decisión sea válida. Si el voto obligatorio es deliberativo, el Superior no puede actuar válidamente contra el mismo; si es consultivo, el Superior debe, al menos, pedirlo para actuar válidamente, pero no está obligado a seguirlo. El voto deliberativo exigido para un asunto taxativamente determinado, se ha de restringir al mismo, sin ampliarlo con interpretaciones extensivas."}, {"num": 405, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "Las Curias", "seccion": null, "text": "Por \"curia\" se entiende en sentido jurídico la casa en la que reside habitualmente el Superior General o Provincial. La curia ha de estar constituida de modo que se pueda fácilmente acudir a la autoridad del Superior o de su sustituto e igualmente puedan éstos ejercitarla. En la curia generalicia han de residir habitualmente el Superior General, el Vicario y el Secretario. En las curias provinciales deberá residir además del Superior Mayor otro miembro del Consejo. En caso de dificultad recúrrase al Gobierno General."}, {"num": 406, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "Las Curias", "seccion": null, "text": "Para trasladar la sede de la curia provincial, se requiere permiso del Superior General con su Consejo (n. 457 l)."}, {"num": 407, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "Las Curias", "seccion": null, "text": "El Gobierno General y el Gobierno de los Organismos Mayores e igualmente todas las casas han de tener un propio sello. También lo tendrán el Procurador y Postulador Generales y otros a quienes los Superiores se lo concedan por razón del cargo o servicio que desempeñan. El sello ha de llevar la inscripción y el título oficial de la Congregación (n. 24) y del oficio o cargo de cada uno. El sello será cuidadosamente guardado por el responsable de cada cargo."}, {"num": 408, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "4", "articulo_title": "Las Curias", "seccion": null, "text": "Para evitar que, sobre todo en las curias, sufra perjuicio la tramitación de los asuntos por la dilación en el examen de la correspondencia epistolar, las cartas oficiales dirigidas a los Superiores pueden ser abiertas por el sustituto según las normas que el mismo Superior habrá de dar para los casos de ausencia o enfermedad. Quien desee que sus cartas no sean abiertas por los sustitutos del Superior, indique en el sobre el carácter personal de la carta o bien envíelas en dos sobres, indicando la reserva en el interior."}, {"num": 409, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Libros de comunidad y archivo", "seccion": null, "text": "Incumbe especialmente a los Superiores cuidar de que en nuestras comunidades se tengan y lleven fielmente los Libros que según nuestra legislación y costumbres, debe haber: de actos de Gobierno, de Secretaría y Crónica y de Administración e Inventarios."}, {"num": 410, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Libros de comunidad y archivo", "seccion": null, "text": "En cuanto al archivo y su encargado se tendrá en cuenta lo siguiente: a) En las curias general y provinciales, lo mismo que en las Delegaciones, casas y residencias haya un archivo convenientemente ordenado, en el cual se recojan y conserven, además de los documentos que el derecho universal manda archivar (can 1053, 1284-1306), todos aquellos documentos escritos, grabados o filmados que se refieren al Organismo y pueden tener interés histórico. También se archivarán los libros de gobierno y administración, una vez concluidos. b) Todo archivo ha de estar dotado de un índice o inventario suficientemente detallado, de todos los libros y documentos que en él se conservan, con las indicaciones necesarias en orden a conocer rápidamente el contenido del archivo (can 486 § 3). c) Guárdense en el archivo separadamente y con gran cautela las escrituras e informaciones que deben mantenerse en secreto, especialmente si afectan a la fama de alguno (can 489 § 1). d) No se permita a nadie sacar documentos del archivo o fotocopia de los mismos sin licencia del Superior respectivo y sin firmar el correspondiente recibo. e) El oficio de archivero corresponde normalmente al respectivo Secretario, a no ser que por especiales motivos se haya designado otro, principalmente para los archivos mayores. En todo caso, el archivero dependerá del secretario. f) Ningún encargado de los archivos puede destruir o inutilizar documentos o libros custodiados en los mismos sin permiso expreso del Superior respectivo."}, {"num": 411, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "5", "articulo_title": "Libros de comunidad y archivo", "seccion": null, "text": "Tanto lo referente al archivo como lo referente a libros ha de ser objeto de especial atención del Visitador durante la visita canónica."}, {"num": 412, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "6", "articulo_title": "Las Prefecturas", "seccion": null, "text": "En el Gobierno General y en los Gobiernos Provinciales han de constituirse diversas Prefecturas según lo acordado por los respectivos Capítulos General o Provincial. A estas Prefecturas pueden asociarse otras diversas secciones (secretariados, procuraduría, comisiones, etc.), temporales o perpetuas, según las diversas actividades315."}, {"num": 413, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "6", "articulo_title": "Las Prefecturas", "seccion": null, "text": "Las Prefecturas Generales de Economía y Secretaría van unidas respectivamente al cargo de Ecónomo y Secretario Generales, por el mismo hecho del nombramiento de éstos. El mismo Capítulo, al elegir a los otros Consultores con vistas a las Prefecturas, orienta la designación de los Prefectos, pero ésta corresponde al Superior General con su Consejo (n. 496 b)316; pudiendo también encomendar las Prefecturas a personas que no formen parte del Gobierno General317 ."}, {"num": 414, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "6", "articulo_title": "Las Prefecturas", "seccion": null, "text": "Prefectos Provinciales pueden ser los mismos Consultores, elegidos o nombrados con miras a las Prefecturas, o pueden ser distintos de los Consultores318. a) Si fueren Consultores-Prefectos por elección capitular o por nombramiento del Gobierno General, para designar posteriormente un Prefecto no Consultor o establecer nuevas Prefecturas u organizar diversamente las ya aprobadas, el Superior Mayor necesita el voto deliberativo de su Consejo (n. 457 e). b) Si no son Consultores, la designación corresponde al Superior Mayor, oído su Consejo (n. 458 a). c) El Ecónomo y el Secretario provinciales, por el mismo hecho de su nombramiento, son Prefectos de economía y de secretaría."}, {"num": 415, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "6", "articulo_title": "Las Prefecturas", "seccion": null, "text": "Además de las reuniones o consultas que se celebren en su propia Provincia, conviene que las Prefecturas organicen cursillos o reuniones interprovinciales, de acuerdo con los Superiores Mayores respectivos319."}, {"num": 416, "parte": "PARTE TERCERA", "capitulo": "XIV", "capitulo_title": "NORMAS Y ÓRGANOS DE GOBIERNO", "articulo": "6", "articulo_title": "Las Prefecturas", "seccion": null, "text": "Los Prefectos ayudan directamente al Superior en el gobierno y en la animación. Los Prefectos gozarán de las facultades suficientes para cumplir la misión específica de su Prefectura."}, {"num": 417, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "1", "articulo_title": "Constitución del Gobierno", "seccion": null, "text": "De entre las opciones que ofrecen las Constituciones (CC 106-107) para la designación de los gobiernos locales, corresponde escoger: a) A los Capítulos Provinciales para las casas de sus Provincias (CC 106), a excepción de las casas de formación, que serán nombrados por el Gobierno Provincial. b) A la Junta de Provinciales correspondiente para las casas interprovinciales con aprobación del Superior General. c) Al Superior General con su Consejo para las casas generalicias y las pertenecientes a las Delegaciones Independientes (CC 106; Dir 496 a). d) Al Superior Mayor con su Consejo en las Misiones, oídos previamente los miembros de las mismas (CC 109; Dir 457 a). XIX CapGen, ses. 19."}, {"num": 418, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "1", "articulo_title": "Constitución del Gobierno", "seccion": null, "text": "En las residencias el delegado es nombrado por el Superior Mayor con su Consejo, previa consulta a la comunidad (nn. 295 b, 363, 421, 457 a)."}, {"num": 419, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "1", "articulo_title": "Constitución del Gobierno", "seccion": null, "text": "Si, durante el período para el que fue elegido, un Superior Local cesara por cualquier causa, cesan en sus cargos el Vicario y el Ecónomo, pero habrán de continuar en ellos, con potestad prorrogada, hasta que los sucesores tomen posesión. Corresponde al Superior Provincial con el consejo de sus Consultores determinar el modo de designación de quienes han de completar el trienio (nn. 363, 458 d)."}, {"num": 420, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "1", "articulo_title": "Constitución del Gobierno", "seccion": null, "text": "Si un Capítulo Provincial no determina el modo de designar los gobiernos locales, debe seguirse lo aprobado para el caso en el Capítulo precedente."}, {"num": 421, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "1", "articulo_title": "Constitución del Gobierno", "seccion": null, "text": "Cuando el Superior Provincial nombra a los Superiores Locales (CC 106), ha de hacer un sondeo previo (can 625 § 3), no sólo general de la Provincia sino también particular de la misma comunidad320. En esta información participarán todos los profesos del Organismo."}, {"num": 422, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "Para poder desempeñar el cargo de Superior Local se necesita ser profeso de votos perpetuos y haber transcurrido, por lo menos, un año desde la profesión perpetua."}, {"num": 423, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "En la designación del Superior, Vicario y Ecónomo Locales, por elección comunitaria, solamente gozan de voz pasiva los profesos de votos perpetuos de la propia comunidad, previamente constituida por el Superior Mayor respectivo con su Consejo. Gozan de voz activa todos los sacerdotes, diáconos permanentes, hermanos y estudiantes de votos perpetuos, adscritos a la respectiva casa, estén o no estén incardinados a la Provincia."}, {"num": 424, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "Modo de elección: a) La elección debe hacerse en la reunión plenaria de la comunidad. Por lo mismo, será convocada con la conveniente antelación por el Superior Local o quien le sustituya en el gobierno de la comunidad. La elección se realizará en forma canónica y según las normas de nuestro derecho propio (n. 348) por los vocales presentes, sin que puedan los ausentes enviar el voto por escrito o por teléfono, ni nombrar procurador que vote en su lugar (n. 397). b) En la elección del Superior Local, realizados seis escrutinios sin haberse obtenido mayoría absoluta, el derecho de nombramiento pasa al Superior Mayor, quien lo ejerce a tenor del derecho (n. 457 a).321 El Superior, elegido por la comunidad, necesita siempre ser confirmado por el Superior Mayor, del que depende inmediatamente la casa (can 625). c) Solamente el Superior General con su Consejo puede conceder permiso para que un Superior Local sea designado para un tercer trienio consecutivo para la misma casa (can 624; d) En la designación del Superior local han de tenerse en cuenta las normas establecidas por el Capítulo Provincial respecto a la permanencia en el cargo de Superior por trienios consecutivos (n. 358 d)."}, {"num": 425, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "En la elección del Vicario y Ecónomo se requiere también mayoría absoluta de votos322, pero las votaciones no serán nunca más de cuatro. En la cuarta votación se restringe el derecho de voz pasiva a los dos que en la votación precedente hayan obtenido mayor número de votos, resolviéndose los empates según los nn. 346 y 347. En caso de empate en la cuarta votación se habrá de considerar como elegido el más antiguo por profesión o, en caso de igualdad en ésta, por la edad. El Vicario y el Ecónomo necesitan siempre ser confirmados por el Superior Mayor del que depende inmediatamente la casa (can 625)."}, {"num": 426, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "La elección del Superior, Vicario y Ecónomo hecha por la propia comunidad no anula la facultad que el Gobierno Provincial tiene, también mientras duran los cargos locales, de disponer de esas personas para otra comunidad, según las necesidades de la Provincia (can 624 § 3; CC 96; Dir 361, 457 a). En tal caso, se procederá conforme a derecho (nn. 363, 419)."}, {"num": 427, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "En las comunidades donde, a juicio del Gobierno Provincial, se crea necesario unir en la persona del Superior o del Vicario el cargo de Ecónomo (nn. 342 a, 458 c), se debe elegir entre sus miembros otro Consultor, que deberá ser confirmado por el Superior Provincial (n. 425)."}, {"num": 428, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "Aunque la comunidad entera ha de participar y corresponsabilizarse en todo lo referente a su vida misionera, corresponde al Superior Local y a su Consejo: tratar los casos personales que afecten a algún miembro de su comunidad (n. 435); tomar decisiones de común interés cuando no pueda ser convocada la comunidad; promover activamente la animación, sobre todo en comunidades numerosas; presentar a la comunidad los presupuestos anuales, particularmente de los gastos extraordinarios (nn. 569-570, 572, 574), y evaluarlos periódicamente (n. 573); aprobar con los responsables los presupuestos de las actividades que dependen de la comunidad (n. 570), así como el posible proyecto adicional previsto en el n. 574; aprobar, revisar y firmar periódicamente los libros de la comunidad, principalmente los de administración (n. 554)."}, {"num": 429, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "2", "articulo_title": "Del Superior, Consultores y Oficiales Locales", "seccion": null, "text": "En toda comunidad debe haber un Secretario, designado por la misma comunidad (n. 432 c), cuyos deberes son: a) Redactar las actas de las reuniones plenarias, que leerá y someterá a la aprobación en la inmediata siguiente. b) Preparar la crónica mensual de la casa, que firmará juntamente con el Superior. c) Llevar con fidelidad y diligencia todos los libros correspondientes. d) Tener cuidado del archivo local y procurar que no falte en él ninguno de los documentos que interesen a la casa, completándolos con los debidos índices (n. 410 e). e) Comunicar a la Secretaría Provincial las profesiones y renovaciones de votos, si se hubieran realizado en ella, y las salidas de los estudiantes de votos temporales adscritos a la comunidad."}, {"num": 430, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "3", "articulo_title": "Reunión plenaria de la comunidad", "seccion": null, "text": "La participación y corresponsabilidad de todos en la totalidad de la vida misionera de la comunidad se expresa principalmente en la reunión plenaria que se ha de tener en todas las casas conforme a nuestras Constituciones (CC 110). Cuando la reunión plenaria haya de actuar con voto deliberativo (n. 433) se procederá en conformidad con lo que se dice en los nn. 323, 333-336 y 396."}, {"num": 431, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "3", "articulo_title": "Reunión plenaria de la comunidad", "seccion": null, "text": "Los asuntos que deban tratarse en la reunión plenaria se anunciarán previamente a la comunidad. Uno de los temas más importantes es la planificación anual de la vida misionera de la comunidad y su evaluación periódica a lo largo del año. Dicha planificación atenderá principalmente a los siguientes puntos: a) La vivencia de los compromisos evangélicos; b) la vida de oración; c) la vida comunitaria en sus expresiones hacia dentro y hacia fuera323; d) la acción pastoral desde la comunidad en la Iglesia y en el contexto social del lugar; e) el uso de los medios de comunicación; f) la dimensión económica. Esta planificación debe someterse a la aprobación del Gobierno del Organismo Mayor al comienzo de cada curso324."}, {"num": 432, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "3", "articulo_title": "Reunión plenaria de la comunidad", "seccion": null, "text": "La reunión plenaria de la comunidad interviene en cuantos asuntos de importancia deben tratarse en comunidad, especialmente en los casos siguientes: a) En el examen y control de la ejecución del presupuesto anual de la casa y sus actividades (nn. 569, 573). b) En la aprobación de las relaciones oficiales enviadas por el Superior Local al Superior Mayor, especialmente de las relaciones trienales y sexenales (n. 378). c) En la designación de los cargos menores de la Comunidad."}, {"num": 433, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "3", "articulo_title": "Reunión plenaria de la comunidad", "seccion": null, "text": "Corresponde a la reunión plenaria de la comunidad decidir con voto deliberativo: a) La aprobación previa de los presupuestos anuales de la comunidad (n. 569). b) La aprobación de las deudas que se van a contraer conforme a lo prescrito en el derecho (n. 530). c) La aprobación de gastos extraordinarios, a tenor del n. 574."}, {"num": 434, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "3", "articulo_title": "Reunión plenaria de la comunidad", "seccion": null, "text": "En la reunión plenaria de la comunidad desempeñarán el oficio de escrutadores el Superior en funciones, el más antiguo y el más joven por orden de profesión. El oficio de secretario lo desempeñará el que lo sea de la casa y, en su defecto o ausencia, el que elija con mayoría relativa la propia asamblea."}, {"num": 435, "parte": "PARTE TERCERA", "capitulo": "XV", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD LOCAL", "articulo": "3", "articulo_title": "Reunión plenaria de la comunidad", "seccion": null, "text": "No entran en la competencia de la reunión plenaria de comunidad los casos o responsabilidades de especial reserva, sobre todo si afectan a las personas (CC 107; Dir 428)."}, {"num": 436, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "1", "articulo_title": "Elementos de funcionamiento", "seccion": null, "text": "La estructura de la comunidad provincial debe expresar y favorecer la comunicación y la unión entre las comunidades locales. La comunidad provincial y la de la Delegación Independiente deben permanecer abiertas a la comunidad del Instituto, del que son parte. El Superior Mayor debe animar y desarrollar esta relación de universalidad, haciendo que su Organismo se abra a los demás Organismos de la Congregación bajo la guía del Superior General325."}, {"num": 437, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "1", "articulo_title": "Elementos de funcionamiento", "seccion": null, "text": "Las Provincias y Delegaciones Independientes pueden adquirir, poseer, capitalizar, enajenar, obligar y obligarse, de suerte que con los bienes propios puedan atender a las necesidades comunes de ellas mismas, y principalmente a los centros de formación326."}, {"num": 438, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "1", "articulo_title": "Elementos de funcionamiento", "seccion": null, "text": "Es derecho y deber de los Organismos Mayores el admitir y formar sus propios miembros. Si algún Organismo pudiera admitir y formar más miembros de los que precisa para sus necesidades, mirando al bien general de la Congregación, se le ayudará en la formación de los mismos con los medios oportunos, si fuese necesario. Si las circunstancias lo aconsejan, pueden varios Organismos servirse de centros comunes, contando con la aprobación del Superior General."}, {"num": 439, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "Los Superiores de los Organismos Mayores tienen la representación de su respectivo Organismo, según nuestras Constituciones (CC 97), pero pueden delegar esta representación a miembros del propio Organismo (n. 368) y de forma ocasional a otros, sean o no de la Congregación."}, {"num": 440, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "Pueden ser elegidos para miembros del Gobierno Provincial quienes tienen derecho de voz pasiva en la Provincia (nn. 322 ss). Excepcionalmente, en el caso de ser votado un individuo de otro Organismo con derecho de voz pasiva en otra Provincia, el voto se considera válido cuanto al cómputo general de votos válidos. Pero en el caso de obtener él la mayoría absoluta, se entiende que el Capítulo renuncia a la elección en sentido estricto y eleva su petición al Gobierno General para que éste vea si conviene nombrarle; en cuyo caso el nombramiento lleva consigo la adscripción a la nueva Provincia de cuyo gobierno ha sido designado miembro (n. 314 c). cf E 8."}, {"num": 441, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "Los que hayan de ser elegidos o nombrados Superiores Mayores deben ser presbíteros y con cinco años, al menos, de profesión perpetua (can 623; CC 112)."}, {"num": 442, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "El Superior de la Delegación Independiente es nombrado por el Superior General con su Consejo (CC 118). Normalmente el Superior Provincial es elegido en Capítulo Provincial, previo sondeo de todos los profesos de la Provincia (CC 114)327. La duración de su mandato será de seis años (CC 114)328. Observando las normas de los nn. 443-444, el Superior Provincial podrá ser reelegido para períodos inmediatos hasta completar un máximo de doce años329."}, {"num": 443, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "Antes de proceder a la elección, el Capítulo Provincial puede solicitar del Gobierno General, y éste aprobar, que el tiempo de gobierno del Superior Provincial sea de tres años. Esta aprobación la podrá conceder también el Presidente del Capítulo si el Gobierno General le hubiera otorgado previa delegación para ello330. Asimismo, antes de la elección del Superior Provincial, el Capítulo puede conceder al que sea elegido para este cargo la facultad de aplazar la toma de posesión por un período no superior a tres meses. En caso de que el nuevo Superior Provincial decida usar dicha facultad, deberá proponer al Capítulo, para su confirmación, la fecha de toma de posesión. Esta norma no es aplicable en caso de reelección para un período de tiempo inmediato331."}, {"num": 444, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "Para la elección del Superior Provincial: a) No se tendrán más de siete escrutinios. En los seis primeros se requiere mayoría absoluta de votos. b) Para el séptimo escrutinio se reduce la voz pasiva a los dos más votados en el anterior, a tenor del n. 347, y, si se da todavía empate, quedaría elegido el más antiguo en conformidad con el n. 346. c) Si el elegido renunciara, se observará lo que se dice en el n. 513, y si estuviera ausente del Capítulo, lo que se dice en el n. 514."}, {"num": 445, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "La confirmación de la elección del Superior Provincial corresponde siempre al Superior General con sus Consultores (CC 114)332, que podrán delegar esta facultad al Presidente del Capítulo aunque no sea miembro del Gobierno General333."}, {"num": 446, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "Si tuviera lugar el aplazamiento previsto (n. 443), el nuevo Superior Provincial emitirá la profesión de fe prescrita al comenzar a ejercer el cargo (can 833; CC 94; Dir 359) en presencia de los Consejos Provinciales entrante y saliente y de la comunidad de la Curia."}, {"num": 447, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "Los otros modos de designar al Superior Provincial que, a tenor de las Constituciones, puede conceder el Gobierno General (CC 114; Dir 496 a), previa expresa propuesta del Capítulo Provincial, obtenido por mayoría absoluta de votos, son: XIX CapGen, ses. 56; 1RG 67; 2RG 65. XXII CapGen, acta 19. XXIII CapGen, acta 18. XXII CapGen, acta 17. XXIII CapGen, acta 18. a) Por nombramiento del Gobierno General, después de consultar a todos los profesos de la Provincia334. b) Por designación del Gobierno General de entre los nombres de una terna presentada por la Provincia. Para ello, cada profeso de votos perpetuos elegirá un nombre o candidato, y los Escrutadores Provinciales formarán la terna con los tres que hayan obtenido mayor número de votos, resolviendo el empate, si se verificara, según la norma del n. 346. c) Por elección directa y conforme a derecho por todos los profesos de votos perpetuos; la confirmación corresponde al Gobierno General (n. 349 a). d) En caso de optar por alguno de estos tres modos, el Capítulo Provincial debe recurrir al Gobierno General (CC 114). e) El Capítulo Provincial no podrá proceder a aplicar esta opción hasta que haya decidido el Gobierno General o el Presidente, si fuera un miembro del Gobierno General y hubiera recibido del mismo previa delegación para resolver335."}, {"num": 448, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "2", "articulo_title": "Los Superiores de los Organismos Mayores", "seccion": null, "text": "El sistema de elección directa en la práctica sólo es de aconsejar donde resulte fácil reunir la Asamblea de toda la Provincia para hacer en ella la elección, y en la cual habrán de tomar parte los indicados en el n. 467336. a) Recibida la aprobación del Gobierno General a la propuesta del Capítulo Provincial, se suspende éste, y se dirige convocatoria especial a quienes, además de los Capitulares propiamente dichos, tienen voz activa en la elección (a no ser que se les haya convocado anticipadamente, al convocar el Capítulo); pero en ambos casos, se ha de indicar claramente el lugar, los días y las horas en que tendrán lugar las elecciones, a las que acudirán también los Capitulares propiamente dichos (n. 467). b) Para la validez del acto de elección han de estar presentes en la asamblea conjunta al menos las dos terceras partes de los profesos perpetuos con derecho a voto, excluyéndose el envío del voto por los ausentes. c) Las votaciones se verifican conforme a lo establecido en los nn. 444 y 451 (según se trate del Superior o de los Consultores). d) Efectuadas las elecciones y recibidas las correspondientes confirmaciones del Gobierno General (n. 349 a), se reanuda el Capítulo con solos los Capitulares."}, {"num": 449, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "El Consejo Provincial lo constituyen el Provincial con los Consultores. Sus funciones son: animar, promover y gobernar la Comunidad Provincial en orden al cumplimiento de la misión de la Congregación."}, {"num": 450, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "En las Provincias, el Ecónomo no puede desempeñar el cargo de Vicario sin autorización del Gobierno General (can 636 § 1). Los Consultores y Oficiales de los Organismos Mayores pueden ser reelegidos para sucesivos períodos."}, {"num": 451, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "Los Consultores Provinciales y el Ecónomo son elegidos en Capítulo Provincial por mayoría absoluta de votos, previo sondeo de la Provincia. En su elección nunca podrá haber más de cuatro votaciones y, si nadie obtuvo la mayoría absoluta en las tres primeras, en la XIII CapGen, acta 18. cf Asamblea de Costa Rica, Ann 52 (1976) 453. cuarta votación se restringe el derecho de voz pasiva a los dos que en la votación precedente hayan obtenido mayor número de votos, conforme se ha dicho arriba (nn. 346-347) para la elección del Provincial . a) Para su designación caben también, como excepción, los tres modos indicados en el n. 447. Pero en el segundo modo, de entre los candidatos elegidos con mayoría de votos por los profesos perpetuos, los Escrutadores formarán una lista de tres nombres por cada Consultoría para presentarla al Gobierno General; éste escogerá de ella los Consultores, dándoselos antes a conocer al nuevo Provincial por si tuviera alguna objeción que hacer337. b) La confirmación de la elección corresponde al Superior General (n. 349 a) o al Presidente del Capítulo si hubiera recibido delegación para ello. c) Si durante el mandato viniere a faltar un Consultor Provincial o el Ecónomo, el sustituto será designado por el Gobierno General (n. 496 b)."}, {"num": 452, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "Teniendo en cuenta cuanto se dice en las Constituciones (CC 116), el Capítulo Provincial decidirá el número de Consultores Provinciales que en las Provincias formadas podrá llegar hasta un máximo de cuatro."}, {"num": 453, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "El Ecónomo y el Secretario Provinciales pueden ser Consultores o no serlo (CC 117). Será el Capítulo Provincial quien lo decida respecto del Ecónomo, el cual, en todo caso, ha de ser elegido o designado del mismo modo que los Consultores. Pero tanto el Ecónomo como el Secretario, aunque no sean Consultores, tienen voz y voto en el Capítulo Provincial (CC 124. 2)."}, {"num": 454, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "El Secretario Provincial es designado por el Superior Provincial de entre los Consultores. Para nombrar a un Secretario que no sea Consultor del gobierno, el Superior Provincial necesita el consentimiento de su Consejo (n. 457 a). Las dotes, derechos y deberes del Secretario Provincial deben ser los mismos que se establecen para el Secretario General, guardada la debida proporción338."}, {"num": 455, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "En las Delegaciones Independientes tanto los Consultores como el Ecónomo, aunque no sea Consultor, son nombrados del mismo modo que el Superior Delegado (CC 120; Dir 442)."}, {"num": 456, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "3", "articulo_title": "Los Consultores y Oficiales de los Organismos Mayores", "seccion": null, "text": "En las Delegaciones Dependientes, tanto el Ecónomo como el Secretario, han de ser al mismo tiempo Consultores."}, {"num": 457, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "4", "articulo_title": "Los Consejos", "seccion": null, "text": "El Superior Mayor necesita el voto deliberativo de su Consejo para los asuntos en los que el derecho universal o nuestro propio dicen claramente que el Superior Mayor necesita voto deliberativo, o su consentimiento, o encomienda un asunto al Superior Provincial o Mayor con su Consejo, o también al Gobierno Provincial, de entre los cuales están los siguientes: a) Para el nombramiento de Superior, Consultores y Oficiales en las Delegaciones Dependientes; del Secretario Provincial cuando no es Consultor (n. 454); de Superiores, Vicarios y Ecónomos Locales (CC 106; Dir 421) y del Superior delegado en las residencias (n. 418), del Maestro de novicios (CC 68; Dir 210) y del Prefecto de formandos (n. 248), y el traslado o remoción de todos ellos (nn. 360, 361, 426); determinar la opción a seguir en la designación de los Gobiernos Locales en las Misiones dependientes del Organismo y su nombramiento si es el caso (CC 106-107, 109; Dir 417 d). b) Para anticipar o diferir el Capítulo Provincial ordinario más de tres meses; convocar un Capítulo Provincial extraordinario (n. 463); y para convocarlo el Superior Provincial en funciones (n. 386 a). c) Para escoger los que han de asistir al Capítulo Provincial por designación del Gobierno Provincial (CC 124. 5; Dir 385 b). d) Para determinar el número de Delegados al Capítulo Provincial de los residentes en Delegaciones o Misiones dependientes en caso de que formen colegio electoral (334 b) y solicitar del Gobierno General la aprobación de las normas para su elección (n. 334 c). e) Para designar Prefectos Provinciales en el caso previsto en el n. 414 a. f) Para la admisión a la profesión primera y perpetua (can 656; CC 70-71; Dir 228) y para la promoción al Diaconado (n. 243 c), al Diaconado permanente (n. 259) y al Presbiterado (n. 243 c). g) Para excluir de la renovación de votos y de la profesión perpetua al profeso de votos temporales a causa de enfermedad (n. 272). h) Para aprobar el Plan formativo (n. 168) y determinar la forma de constituir el Consejo de Formación (n. 166). i) Para conceder a los profesos permiso de ausencia (can 665 § 1; Dir 274) y privarlos del ejercicio de voz activa y pasiva (nn. 325-326). j) Para solicitar del Gobierno General la erección, supresión e innovación de las casas (n. 300 a). k) Para la erección, supresión, innovación jurídica o cambio de destino de una residencia (n. 300 b). l) Para solicitar del Gobierno General el traslado de la curia provincial a otra casa (n. 406). m) Para solicitar del Gobierno General la erección, traslado o supresión del noviciado (n.198). n) Para el examen y aprobación de los presupuestos provinciales para el año siguiente y del estado de cuentas de la administración provincial con el correspondiente arqueo (n. 575). o) Para transferir bienes de una casa o de una persona jurídica a otra dentro del Organismo (n. 580); y para permitir préstamos entre ellas (n. 582); para la resolución de pleitos (canon 1427 § 1). p) Para la aprobación de los presupuestos anuales de las casas y actividades (n. 571), de los presupuestos adicionales si es el caso (n. 574) y para constituir administraciones nuevas (n. 551). q) Para realizar o autorizar los actos contemplados en nn. 526, 529-530. r) Para aceptar cargas o fundaciones de misas perpetuas (n. 557). s) Para dispensar de cualquier artículo disciplinar de las Constituciones (n. 10) y de cualquier norma del Directorio (n. 15 a). t) Para determinar la frecuencia y modalidades de celebración de las asambleas provinciales (CC 127; Dir 466)."}, {"num": 458, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "4", "articulo_title": "Los Consejos", "seccion": null, "text": "El Superior Mayor necesita el voto consultivo de su Consejo para los siguientes casos: a) Para designar Prefectos Provinciales no Consultores (n. 414 b). b) Para la confirmación de los Superiores, Vicarios, Ecónomos y Consultores Locales (n. 349 b) y la aceptación de sus renuncias (n. 419). c) Para unir en una persona el cargo de Ecónomo al de Superior o Vicario (n. 427). d) Para determinar el modo de designación, hasta completar el trienio, del Superior, Vicario y Ecónomo cuando alguno de ellos viniere a faltar (nn. 363, 419). e) Para la admisión de los aspirantes al noviciado (n. 202); y para prorrogar el tiempo del noviciado; para la admisión de los profesos de votos temporales a su renovación (n. 228); para la dimisión de los novicios (can 653 § 1; Dir 271) y la no admisión de los profesos a la renovación temporal con la consiguiente dimisión de la Congregación (can 689 § 1; Dir 271) y para la admisión a los ministerios. f) Para todos los demás asuntos en los que deba intervenir su Consejo y no se requiere voto deliberativo."}, {"num": 459, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "4", "articulo_title": "Los Consejos", "seccion": null, "text": "Los casos de voto deliberativo o consultivo especificados en los números anteriores (nn. 457-458), así como el procedimiento a seguir en los mismos (nn. 398-400), valen también para los gobiernos de las Provincias y de las Delegaciones independientes en los asuntos que sean de su competencia."}, {"num": 460, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "4", "articulo_title": "Los Consejos", "seccion": null, "text": "Cada Provincia en Capítulo Provincial decidirá acerca de la existencia, constitución y funcionamiento de la Junta Permanente, como cauce de participación y responsabilidad (can 633)339. Donde exista, ésta actúa bajo la dirección del Gobierno Provincial."}, {"num": 461, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "El Capítulo Provincial representa a la Provincia actuando colegialmente en su nombre dentro de la competencia que le asignan las Constituciones (CC 126)."}, {"num": 462, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "El Capítulo Provincial ha de realizar en su ámbito o circunscripción cuanto se dice para el Capítulo General respecto de toda la Congregación."}, {"num": 463, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "Corresponde al Superior Provincial, después de oír al Superior General y con su anuencia (CC 123), convocar el Capítulo Provincial de cualquier clase, según la norma del n. 386 a. Si el Capítulo fuera extraordinario se necesita, además, el consentimiento de los Consultores provinciales (CC 123; Dir 457 b). El Superior Provincial puede anticipar o retardar el Capítulo Provincial ordinario por tres meses desde la fecha del último Capítulo ordinario, oídos sus Consultores; para adelantarlo o retrasarlo hasta seis meses, debe obtener el consentimiento de sus Consultores (n. 457 b). Y en ambos casos se requiere la anuencia del Superior General."}, {"num": 464, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "El Capítulo Provincial no puede considerarse clausurado antes de que el Gobierno General haya confirmado la elección del nuevo Gobierno Provincial340."}, {"num": 465, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "El Capítulo no priva ni suspende ni ejerce la potestad ejecutiva ordinaria que, según el derecho universal y nuestro propio, corresponde al Superior y Gobierno Provincial, ni puede anular o rescindir los actos del Gobierno Provincial que se demuestren realizados válidamente. Cuando el Capítulo Provincial dicte normas sobre asuntos pertenecientes al XIX CapGen, ses. 56. orden ejecutivo, la actuación del Gobierno Provincial debe conformarse a las mismas, a no ser que surjan dificultades graves, en cuyo caso el Gobierno Provincial informará a la Provincia y lo pondrá en conocimiento del Gobierno General. Los decretos y preceptos dados por el Capítulo Provincial, no tienen fuerza jurídica antes de ser aprobados por el Superior General con su Consejo (CC 126; Dir 496 c)."}, {"num": 466, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "Las asambleas a las que se refieren las Constituciones (CC 127), aunque no tienen el carácter decisorio, propio de los Capítulos Provinciales, son medios importantes de participación, corresponsabilidad y comunión. Entre sus fines destacan la convivencia, el diálogo, el conocimiento y estímulo mutuos, la aportación de sugerencias, la revisión y orientación de la vida de la Provincia (can 633)341. El Gobierno Provincial determinará la frecuencia y modalidades de su celebración (CC 127; Dir 457 t). Estas asambleas periódicas son particularmente recomendadas en las Delegaciones Independientes, a las que no corresponde celebrar Capítulo."}, {"num": 467, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": "Vocales de los Capítulos Provinciales", "text": "Son vocales tanto en el Capítulo ordinario como en el extraordinario, los previstos por las Constituciones (CC 124). El Superior de la Delegación Dependiente, en cuanto tal, no tiene derecho de asistencia al Capítulo Provincial. Si el último Capítulo Provincial, por cualquier causa, no hubiere señalado el número de vocales de designación del Gobierno Provincial para el siguiente Capítulo (CC 124. 5), se guardará la norma establecida para el Capítulo inmediatamente anterior."}, {"num": 468, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "La elección de los Delegados al Capítulo Provincial se hará ordinariamente por cédulas y en forma verdaderamente canónica, conforme a lo dicho en el n. 383."}, {"num": 469, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "En conformidad con las normas establecidas para el ejercicio de la voz activa y pasiva (nn. 330 ss.), en cada Provincia gozan de voz activa o pasiva para elegir o ser elegidos Delegados a su Capítulo Provincial los siguientes: a) Todos los profesos de votos perpetuos incardinados a la Provincia de que se trata y residentes en ella342 o en casas interprovinciales o generalicias, a excepción de los miembros del Gobierno General343. b) Los incardinados a la Provincia, pero que tienen adscripción en una casa de otro Organismo por razón de estudio o de ministerio en servicio de su propia Provincia. c) Los profesos perpetuos no incardinados a la Provincia, pero que gozan de adscripción local en alguna casa de la misma por razón de un servicio que prestan a dicha comunidad o a la Provincia a que la casa pertenece344. No pudiendo nadie gozar de doble voz activa y pasiva (n. 324), los comprendidos en la letra b) la tienen solamente en la Provincia de incardinación. Los de la letra c), sólo en la de residencia."}, {"num": 470, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "Para que todos cuantos gozan de voz activa y pasiva en la elección de Delegados, puedan fácilmente ejercitar ese derecho, los Secretarios Provinciales procurarán preparar oportunamente las listas correspondientes y cuidar de que los avisos o comunicados les lleguen con la debida antelación."}, {"num": 471, "parte": "PARTE TERCERA", "capitulo": "XVI", "capitulo_title": "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL", "articulo": "5", "articulo_title": "Capítulo Provincial", "seccion": null, "text": "El resultado de cada una de las elecciones de los Delegados al Capítulo Provincial será comunicado cuanto antes a la Provincia por medio de documento auténtico; el resultado final se ha de comunicar por medio de documento auténtico a los interesados, y a la Provincia por el Boletín Oficial."}, {"num": 472, "parte": "PARTE TERCERA", "capitulo": "XVII", "capitulo_title": "LOS VISITADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Son Visitadores por derecho propio: el Superior General en toda la Congregación, y cada Superior Mayor en el territorio de su jurisdicción. Por delegación, son Visitadores los que recibieron de un Superior Mayor legítimo un mandato de visita, general o particular. Además de la Visita canónica es conveniente que haya otras visitas (oficiales o no oficiales) y en particular pueden hacerse visitas periciales. Puede también encomendarse a alguien un determinado asunto referente a la Provincia, a las personas o a las casas, sin que por ello se delegue una propia y verdadera visita canónica."}, {"num": 473, "parte": "PARTE TERCERA", "capitulo": "XVII", "capitulo_title": "LOS VISITADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Visitador canónico, aunque sólo sea delegado, tiene oficio y derechos de Superior Mayor durante todo el tiempo que dura el mandato de visita, y durante ella goza el favor del derecho."}, {"num": 474, "parte": "PARTE TERCERA", "capitulo": "XVII", "capitulo_title": "LOS VISITADORES", "articulo": null, "articulo_title": null, "seccion": null, "text": "Contra los actos administrativos del Visitador sólo se concede recurso \"in devolutivo\" y no \"in suspensivo\"345: a) al Superior Mayor delegante, si
