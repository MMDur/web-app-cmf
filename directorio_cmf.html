<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio CMF 2011</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,18..36,400;0,18..36,500;0,18..36,600;1,18..36,400&display=swap" rel="stylesheet">
<style>
:root{
  --garnet:#7a1f2e;
  --garnet-dark:#5c1622;
  --garnet-light:#a33b4a;
  --gold:#c9a961;
  --gold-light:#e4d3a3;
  --cream:#f7f2e9;
  --paper:#fffdf8;
  --ink:#2a1f1f;
  --ink-soft:#5c4f4a;
  --line:#e3d7c2;
  --shadow: 0 4px 20px rgba(90,40,30,0.08);
  --radius:10px;
  --font-display:'Cormorant Garamond', serif;
  --font-body:'Literata', serif;
  --content-size:1rem;
}
[data-theme="dark"]{
  --garnet:#c9505f;
  --garnet-dark:#8a2f3a;
  --garnet-light:#e07a86;
  --gold:#d9bc7c;
  --gold-light:#eddcae;
  --cream:#1c1614;
  --paper:#241c19;
  --ink:#efe6db;
  --ink-soft:#c8b9ab;
  --line:#3d302a;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  transition:background .25s ease, color .25s ease;
}
a{color:var(--garnet); text-decoration:none;}
a:hover{text-decoration:underline;}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg, var(--garnet) 0%, var(--garnet-dark) 100%);
  color:var(--gold-light);
  padding:14px 20px;
  box-shadow:var(--shadow);
}
.top-row{
  display:flex; align-items:center; gap:16px; max-width:1200px; margin:0 auto;
}
.brand{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.5rem;
  letter-spacing:.02em;
  color:#fff;
  cursor:pointer;
  white-space:nowrap;
}
.brand small{display:block; font-size:.62rem; letter-spacing:.18em; font-weight:500; text-transform:uppercase; color:var(--gold-light); opacity:.85;}
.searchwrap{flex:1; position:relative; min-width:120px;}
#searchbox{
  width:100%; padding:9px 14px 9px 38px; border-radius:20px; border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12); color:#fff; font-family:var(--font-body); font-size:.95rem;
  outline:none;
}
#searchbox::placeholder{color:rgba(255,255,255,.65);}
#searchbox:focus{background:rgba(255,255,255,.2); border-color:var(--gold);}
.searchwrap::before{
  content:"⌕"; position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:rgba(255,255,255,.7); font-size:1.1rem; pointer-events:none;
}
.icon-btn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff;
  width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:1rem; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,.25);}
.jumpbox{display:flex; align-items:center; gap:4px;}
.jumpbox input{
  width:64px; padding:8px 8px; border-radius:16px; border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.12); color:#fff; font-family:var(--font-body); text-align:center;
}
.jumpbox input::placeholder{color:rgba(255,255,255,.55); font-size:.8rem;}
.menu-toggle{display:none;}
.sidebar-overlay{display:none;}

/* ---------- Layout ---------- */
.shell{
  display:flex; max-width:1200px; margin:0 auto; align-items:flex-start;
}
nav.sidebar{
  width:290px; flex-shrink:0; padding:22px 14px 60px 20px; position:sticky; top:70px;
  max-height:calc(100vh - 70px); overflow-y:auto;
}
nav.sidebar::-webkit-scrollbar{width:6px;}
nav.sidebar::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
.nav-section-title{
  font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--garnet);
  font-weight:600; margin:18px 0 6px 0;
}
.nav-section-title:first-child{margin-top:0;}
.parte-block{margin-bottom:6px;}
.parte-label{font-size:.68rem; text-transform:uppercase; letter-spacing:.1em; color:var(--gold); font-weight:700; margin:14px 0 2px 0;}
.cap-link{
  display:block; font-family:var(--font-display); font-size:1.02rem; font-weight:600;
  color:var(--ink); padding:5px 8px; border-radius:6px; cursor:pointer; line-height:1.25;
}
.cap-link:hover{background:var(--paper);}
.cap-link.active{background:var(--garnet); color:#fff !important;}
.cap-num{color:var(--garnet); margin-right:6px; font-style:italic;}
[data-theme="dark"] .cap-link.active{color:#fff !important;}
.static-links{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.static-links a{display:block; padding:6px 8px; font-size:.9rem; color:var(--ink-soft); border-radius:6px;}
.static-links a:hover{background:var(--paper); text-decoration:none; color:var(--garnet);}

main{
  flex:1; min-width:0; padding:26px 26px 80px 26px;
}
.crumbs{font-size:.8rem; color:var(--ink-soft); margin-bottom:14px; letter-spacing:.02em;}
.crumbs a{color:var(--garnet);}

.card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px 30px; margin-bottom:18px;
}
h1.page-title{font-family:var(--font-display); font-size:2rem; color:var(--garnet); margin:0 0 4px 0;}
.subtitle{font-family:var(--font-display); font-style:italic; color:var(--ink-soft); font-size:1.1rem; margin-bottom:20px;}

/* paragraph card */
.para-num-badge{
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:1.3rem; color:#fff;
  background:var(--garnet); border-radius:50%; width:46px; height:46px; flex-shrink:0;
}
.para-head{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
.para-context{font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); font-weight:700;}
.para-seccion{font-family:var(--font-display); font-style:italic; color:var(--ink-soft); font-size:1rem;}
.para-text{font-size:calc(var(--content-size)); line-height:1.75;}
.para-nav{display:flex; justify-content:space-between; margin-top:10px; font-size:.85rem;}

.para-row{
  border-bottom:1px solid var(--line); padding:16px 0; display:flex; gap:16px; align-items:flex-start;
}
.para-row:last-child{border-bottom:none;}
.para-row .num{
  font-family:var(--font-display); font-weight:700; color:var(--garnet); font-size:1.15rem; flex-shrink:0; width:38px; text-align:right;
}
.para-row .txt{font-size:.97rem; line-height:1.6;}
.para-row .txt .meta{display:block; font-size:.72rem; color:var(--gold); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; font-weight:600;}

/* index */
.az-tabs{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.az-tabs a{
  width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:var(--paper); border:1px solid var(--line); font-weight:600; font-size:.85rem; color:var(--garnet);
}
.az-tabs a.active, .az-tabs a:hover{background:var(--garnet); color:#fff !important; text-decoration:none;}
.idx-entry{margin-bottom:14px;}
.idx-term{font-family:var(--font-display); font-weight:700; color:var(--garnet); font-size:1.1rem;}
.idx-body{font-size:.92rem; line-height:1.6; color:var(--ink);}
.idx-body a{font-weight:600;}

/* siglas */
.sigla-group h3{font-family:var(--font-display); color:var(--garnet); margin-bottom:8px; border-bottom:1px solid var(--line); padding-bottom:4px;}
.sigla-row{display:flex; gap:10px; padding:4px 0; font-size:.92rem;}
.sigla-code{font-weight:700; color:var(--garnet); width:90px; flex-shrink:0; font-family:var(--font-display);}

/* search results */
.result-item{padding:14px 0; border-bottom:1px solid var(--line);}
.result-item:last-child{border-bottom:none;}
.result-meta{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gold); font-weight:700; margin-bottom:4px;}
.result-snippet{font-size:.93rem; line-height:1.55;}
mark{background:var(--gold-light); color:var(--ink); padding:0 2px; border-radius:3px;}
.empty-state{color:var(--ink-soft); font-style:italic; padding:30px 0; text-align:center;}

/* controls panel (font size + settings) */
.settings-pop{
  position:absolute; right:20px; top:60px; background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px; z-index:60; display:none; min-width:200px;
}
.settings-pop.open{display:block;}
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:.85rem;}
.fs-btns button{
  border:1px solid var(--line); background:var(--cream); color:var(--ink); width:28px; height:28px; border-radius:6px; cursor:pointer; font-weight:700;
}
.fs-btns button:hover{background:var(--garnet); color:#fff;}

footer.app-footer{text-align:center; padding:30px 20px 60px; color:var(--ink-soft); font-size:.8rem;}

@media (max-width: 860px){
  .menu-toggle{display:flex;}
  .top-row{flex-wrap:wrap;}
  .jumpbox{order:3; width:100%; justify-content:center; margin-top:8px;}
  main{padding:18px;}
  .card{padding:18px 18px;}

  nav.sidebar{
    display:block;
    position:fixed; top:0; left:0; bottom:0; z-index:200;
    width:min(82vw, 320px);
    max-height:none;
    background:var(--cream);
    box-shadow:var(--shadow);
    transform:translateX(-100%);
    transition:transform .25s ease;
    padding-top:70px;
  }
  nav.sidebar.open{transform:translateX(0);}

  .sidebar-overlay{
    display:none;
    position:fixed; inset:0; background:rgba(20,10,10,.45); z-index:150;
  }
  .sidebar-overlay.open{display:block;}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <button class="icon-btn menu-toggle" id="menuToggle" title="Menú" aria-label="Menú">☰</button>
    <div class="brand" onclick="location.hash='#/inicio'">Directorio CMF<small>Misioneros Claretianos · 2011</small></div>
    <div class="searchwrap">
      <input id="searchbox" type="text" placeholder="Cercar per paraula, frase o tema…" autocomplete="off">
    </div>
    <div class="jumpbox">
      <input id="jumpnum" type="text" inputmode="numeric" placeholder="núm.">
      <button class="icon-btn" title="Anar al número" onclick="jumpToNum()">→</button>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Preferències">Aa</button>
  </div>
  <div class="settings-pop" id="settingsPop">
    <div class="settings-row">
      <span>Mida del text</span>
      <div class="fs-btns">
        <button onclick="changeFont(-1)">A-</button>
        <button onclick="changeFont(1)">A+</button>
      </div>
    </div>
    <div class="settings-row">
      <span>Mode fosc</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle" onchange="toggleDark(this.checked)">
      </label>
    </div>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<footer class="app-footer">Directorio de los Misioneros Hijos del Inmaculado Corazón de María · Roma, 2011 — text integral digitalitzat per a consulta interna.</footer>

uestro estilo de vida3 y el tipo de gobierno propio de una Congregación misionera. Las Constituciones han de ser el eje central de nuestro impulso renovador en el seguimiento de Cristo4. 5 El texto latino es el único reconocido como auténtico. Las versiones en otras lenguas han de ser examinadas y declaradas fieles por el Superior General con su Consejo."}, {"num": 6, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "En caso de grave necesidad, el Superior General con el consentimiento de su Consejo puede pedir a la Sede Apostólica la suspensión de alguna norma constitucional hasta el próximo Capítulo General (n. 495 a)."}, {"num": 7, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "En caso de grave necesidad, el Superior General, con el consentimiento de su Consejo, puede dispensar a toda la Congregación de algún artículo de las Constituciones (n. 495 a), por el tiempo que falte hasta la celebración del inmediato Capítulo General, salvo cuanto se dispone en el número 11."}, {"num": 8, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Es derecho del Capítulo General aclarar el sentido de las Constituciones. En caso urgente y de grave necesidad, el Superior General, con el consentimiento de su Consejo, puede dar una interpretación provisional, valedera hasta la celebración del próximo Capítulo General (CC 155. 4, 157; Dir 495 b)."}, {"num": 9, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Ninguna norma o uso puede prevalecer contra las Constituciones, ni los Superiores pueden dar su consentimiento para la formación de una costumbre contraria a las mismas."}, {"num": 10, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Los Superiores Mayores de la Congregación, con el consentimiento de los respectivos Consejos, pueden, con justa y proporcionada causa, dispensar a sus súbditos de cualquier artículo disciplinar de las Constituciones si no les está expresamente prohibido (nn. 457 s, 495 b)."}, {"num": 11, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Se prohíbe expresamente la dispensa de las Constituciones: a) que sean repetición o aplicación del derecho universal, si no es a norma del canon 87 § 2 y 14; b) que afectan a puntos esenciales de la vida religiosa (can 86) y que reglamentan la incorporación a la Congregación y formación (can 587 § 1); c) que pertenecen directamente al régimen (can 587 § 1), como son las que regulan los cargos de superiores mayores y locales, determinan el número y nombramiento de los consultores y oficiales, prescriben los capítulos, los consejos, los plazos o períodos de los gobiernos, y fijan el modo de proceder de los consejos5."}, {"num": 12, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": "El Directorio", "text": "El Directorio es el conjunto de criterios y normas de carácter general para toda la Congregación que, sistemáticamente ordenados, constituyen el complemento de las Constituciones. Es un medio importante para consolidar nuestra vida en comunión y para dinamizar la espiritualidad y la acción misionera de la Congregación."}, {"num": 13, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Las normas del Directorio son de duración indefinida y, por lo mismo, continúan vigentes mientras no sean revocadas expresamente por normas abrogatorias o derogatorias de la autoridad competente."}, {"num": 14, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "La interpretación auténtica del Directorio corresponde al Capítulo General y, fuera del Capítulo, al Superior General, oído su Consejo."}, {"num": 15, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Fuera de lo que queda expresamente prohibido, y salvando siempre las normas del n. 11, a) Los Superiores Mayores de la Congregación, con el consentimiento de su Consejo (n. 457 s), pueden, con justa y proporcionada causa, dispensar a sus súbditos individualmente de cualquier norma del Directorio. b) Solamente el Superior General, con el consentimiento de su Consejo, puede dispensar a toda la Congregación o a una Provincia o Delegación de las normas del Directorio (n. 495 b)."}, {"num": 16, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": "Documentos del Capítulo General", "text": "Los Documentos Capitulares, además de normas propiamente dichas que pasan a nuestra legislación, contienen evaluaciones y orientaciones sobre el ser y quehacer de la Congregación. Por ello deben apreciarse grandemente, tratando de conocerlos y asimilarlos como un autorizado pensamiento de la Congregación entera y el mejor comentario de las Constituciones."}, {"num": 17, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": "Decretos, Estatutos y Circulares", "text": "Decretos generales son las normas de carácter general para toda la Congregación o para una categoría de miembros dadas por el Superior General con el voto deliberativo del Consejo (n. 496 c). Deben ser promulgados o comunicados en la forma que el Superior General estime conveniente. Recójanse en \"Annales\", órgano oficial de la Congregación. Caducan al cesar en su cargo el Superior General que los dio, a no ser que el nuevo Superior General los confirme implícita o explícitamente."}, {"num": 18, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Los Superiores Provinciales pueden dispensar a sus súbditos de los decretos generales si la dispensa urge y no es fácil el recurso al Superior General. Los Superiores Locales sólo pueden hacerlo en un caso particular si no pueden recurrir al Provincial."}, {"num": 19, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Estatutos son las normas mediante las cuales la autoridad competente establece y regula legítima y orgánicamente el fin, la constitución, el régimen y la forma de actuar de aquellas instituciones, colegios, personas jurídicas, asociaciones, así como las distintas áreas o sectores en que debe expresarse la vida y misión de la Congregación, de sus comunidades y personas (can 94 § 1). Las fundaciones o corporaciones se regirán por unos Estatutos, cuya aprobación es competencia de la autoridad misma que las crea o erige."}, {"num": 20, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "1", "articulo_title": "Normas generales", "seccion": null, "text": "Los Superiores Mayores promueven y orientan la vida de la Congregación, también mediante Circulares. En ellas desarrollan temas doctrinales de nuestro carisma y misión o proponen iniciativas orgánicas para su crecimiento y desarrollo, o bien convocan, declaran, establecen o comunican oficialmente cuanto debe hacerse o saberse, según el ámbito de su autoridad y competencia."}, {"num": 21, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "La Congregación ha mantenido viva la conciencia de haber nacido en la Iglesia como una comunidad convocada y consagrada bajo la acción del Espíritu Santo y por mediación de San Antonio María Claret. Heredera de su espíritu misionero, la Congregación se siente responsable de actualizar sus iniciativas misioneras y de promover aquellas que él personalmente no pudo realizar6. Nuestro Fundador nos ha introducido en una peculiar comprensión y vivencia del Cristo ungido y enviado por el Padre, cuya consagración y misión se continúa en la Iglesia. Así es como Claret ejerce su paternidad sobre nuestra familia misionera7. La vivencia de nuestro carisma integra las riquezas espirituales y los valores culturales de los pueblos en que vivimos8."}, {"num": 22, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "La experiencia espiritual que el Padre Fundador tuvo de su vocación misionera fue el principio organizador de su existencia y la motivación profunda que orientó toda su vida y actividad apostólica. Dicha experiencia se convierte para nosotros en fuente de inspiración y estímulo a la respuesta que hemos de dar hoy a nuestra vocación en la Iglesia y en el mundo9. Por lo mismo tiene que ser por nosotros vivida, custodiada, profundizada y desarrollada constantemente en sintonía con el Cuerpo de Cristo en crecimiento perenne10. Los Superiores de la Congregación tienen la obligación grave de fomentar por todos los medios a su alcance la fidelidad al carisma claretiano y de promover la adecuada renovación que exigen los tiempos11. Corresponde al Gobierno General y a los Gobiernos Provinciales y de las Delegaciones Independientes planificar las acciones pertinentes12 en orden a impulsar una vivencia más honda y siempre renovada de nuestro carisma13."}, {"num": 23, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Nuestra Congregación de Misioneros, que obtuvo el decreto de alabanza del Papa Pío IX el 21 de noviembre de 1860 y fue aprobada por el mismo Romano Pontífice el 22 de diciembre de 1865, es un Instituto religioso apostólico de derecho pontificio."}, {"num": 24, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "La Congregación tiene dos nombres oficiales que pueden usarse indistintamente en cualquier clase de documentos, públicos o privados (CC 1). El primero, tomado del sentido y espíritu primitivo dado por nuestro Padre Fundador, es: Congregatio Missionariorum Filiorum Immaculati Cordis Beatae Mariae Virginis. El segundo se forma con la palabra Misioneros y un adjetivo derivado de Claret, según las reglas de cada idioma, pero debiendo corresponder al latino Missionarii Claretiani."}, {"num": 25, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Los miembros de la Congregación usen la sigla C.M.F. (Cordis Mariae Filius) añadida al nombre propio14."}, {"num": 26, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "La palabra \"misionero\", entendida desde la experiencia espiritual de San Antonio María Claret, define nuestra identidad carismática. El título de \"Misionero Apostólico\", que él recibió, sintetiza su ideal de vivir al estilo de los Apóstoles. Este modo de vida implica ser discípulo y seguir al Maestro, vivir los consejos evangélicos en comunidad de vida con Jesús y con el grupo de los llamados, ser enviado y anunciar a todo el mundo la Buena Nueva del Reino. La unción del Espíritu para anunciar la Buena Nueva y la comunión con Cristo, el profeta por excelencia, nos hacen partícipes de su función profética15."}, {"num": 27, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Por ser esforzados auxiliares de los Obispos en el ministerio de la Palabra, ante todo hemos de reconocer en ellos la personal autoridad y responsabilidad que les incumbe como Pastores del Pueblo de Dios en sus Iglesias particulares; consiguientemente hemos de secundar sus normas y directrices colaborando con creatividad y sentido profético en la pastoral de conjunto16."}, {"num": 28, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Esta característica de nuestra identidad claretiana la hemos de afirmar y aplicar también en nuestras relaciones con los miembros del clero secular, con las familias religiosas y demás agentes de evangelización. Formando parte de una Iglesia particular, todos, cada uno según su vocación, hemos de prestar nuestra colaboración a la única misión de la Iglesia (n. 43)."}, {"num": 29, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Nuestra vocación se expresa indistintamente tanto en la Iglesia latina, como en cualquiera otra Iglesia \"sui iuris\" (can 111-112; CCEO 27). El rito es personal. Todos debemos vivir con entusiasmo nuestras propias tradiciones eclesiales de acuerdo con la enseñanza de la Iglesia, estando siempre dispuestos a participar en la misión universal de la Congregación. Un candidato que se integre en una Provincia o Delegación bajo una Iglesia “sui iuris” distinta de la propia, deberá pedir el privilegio del “biritualismo” antes de la ordenación diaconal. Del mismo modo, quienes sean destinados al servicio de un Organismo Mayor bajo una Iglesia “sui iuris” distinta de la propia deberán pedir también el mismo privilegio."}, {"num": 30, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Juntamente con las \"Religiosas de María Inmaculada Misioneras Claretianas\", \"Filiación Cordimariana\" y los \"Seglares Claretianos\" formamos la Familia Claretiana en sentido estricto. Todos tenemos a San Antonio María Claret como Padre y entre todos continuamos la misión para la que el Espíritu le suscitó en la Iglesia. Todos somos claretianos, pero cada institución tiene una manera peculiar de serlo17. También otros Institutos y grupos pueden formar parte de la gran Familia Claretiana por su vinculación con el Fundador o con la Congregación y por su sintonía con el espíritu misionero de Claret."}, {"num": 31, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "La fraternidad en la Familia Claretiana se expresa y se acrecienta en las relaciones personales, en la comunión inter-institucional, en la contribución al desarrollo de las demás ramas de la Familia y en la mutua colaboración en obras, proyectos y acciones de evangelización 18."}, {"num": 32, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "La consagración al Corazón de María, propuesta por el Padre Fundador como el primer vínculo de cohesión de nuestro Instituto, se ordena al objeto total de la Congregación. Por lo mismo, se ha de considerar como nota característica de nuestra vida misionera el empeño por alcanzar dicho objeto por medio del Inmaculado Corazón de María19."}, {"num": 33, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Esta consagración expresa también la experiencia espiritual del Fundador que, como discípulo y apóstol de Cristo, se reconoce formado gracias a una peculiar intervención materna de María. Nuestra espiritualidad adquiere un carácter filial ya que por María el Espíritu nos configura con el Hijo Misionero del Padre. La presencia del Corazón de María en nuestra espiritualidad da a nuestro apostolado un sello de humildad, mansedumbre, ternura y amor materno20."}, {"num": 34, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Como Misioneros Hijos del Inmaculado Corazón de María, Ella nos forma en la fragua de su misericordia y amor y nos hace instrumentos de su amor maternal para con los hombres en el ejercicio de nuestro servicio apostólico21. Como el ser Hijos del Corazón de María pertenece al carisma de la Congregación: a) hemos de integrar vitalmente esta realidad en nuestra vocación; b) tenemos que cuidar el culto litúrgico y la piedad popular mariana; c) en el apostolado, al anunciar el misterio íntegro de Cristo, debemos hacer notar la función que en él tiene María, Madre suya y nuestra; d) para esto hemos de profundizar en el conocimiento teológico, ya con el estudio personal ya con cursos especializados, e intensificar la vivencia mariana, personal y comunitaria, con días de espiritualidad, meditaciones, lecturas y en la oración compartida."}, {"num": 35, "parte": null, "capitulo": "PRELIMINAR", "capitulo_title": null, "articulo": "2", "articulo_title": "Sobre la Constitución Fundamental", "seccion": null, "text": "Nuestro Fundador nos dejó el retrato espiritual y carismático que describe su propia experiencia de vida misionera a través del breve texto contenido en la Autobiografía (494) y que indistintamente llamamos \"definición\", \"forma\" o \"memorial\" del misionero. Lo entregó a la Congregación para que cada misionero lo llevara consigo22 y lo tuviera como pauta de vida.23 20 cf El Corazón de María y la Congregación en el momento actual, Ann 53 (1978) 197-209; MCH 150-151; HAC 3216."}, {"num": 36, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los claretianos somos una comunidad convocada por el Espíritu para el anuncio misionero de la Palabra24. La vida en comunión, que es el primer hecho de misión, debe ser adecuadamente valorada por todos25. Nuestra comunidad, formada por Presbíteros, Diáconos, Hermanos y Estudiantes (CC 7), está llamada a vivir una comunión que integre de modo creativo los diferentes carismas26 y las diversas culturas presentes en la Congregación27. La comunión es un rasgo profético que hará más creíble nuestro servicio misionero de la Palabra28."}, {"num": 37, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Nuestras comunidades deben tener en la manera de establecerse aquella flexibilidad que les permita el mejor desarrollo de sus actividades. Pueden, por consiguiente, formar una sola comunidad diversos grupos que viven en lugares próximos y que se unen no sólo en el superior, sino con la totalidad de la comunidad29. En este caso, y para que sientan realmente la fraternidad claretiana, dichos grupos se reunirán con frecuencia con los demás hermanos de la comunidad a la que pertenecen, especialmente en torno a la mesa eucarística30."}, {"num": 38, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La comunitariedad del carisma claretiano no permite que nuestros hermanos vivan habitualmente solos. Sin embargo, no se excluye que pueda haber razones ministeriales o personales que aconsejen a los Superiores Mayores autorizar por un tiempo determinado algunas excepciones (can 665 § 1). En todo caso, el religioso deberá estar adscrito a una comunidad local, a la que acudirá frecuentemente para vivir con sus hermanos la fraternidad claretiana31."}, {"num": 39, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La comunidad local debe estar abierta a la comunión con las demás comunidades32. Como expresión del espíritu comunitario, la comunidad local debe mostrarse dispuesta a aceptar el traslado de uno de sus miembros cuando así lo reclama un bien mayor, a juicio de los Superiores. Lo mismo se ha de decir con respecto a la comunidad provincial33."}, {"num": 40, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El misionero claretiano alcanza en la comunidad su plenitud por la fraterna convivencia efectiva, dirección y autoridad comunes en el ejercicio perfecto de la caridad según los consejos evangélicos, entera comunicación de bienes, ordenamiento comunitario de la vida: todo ello en orden a un ejercicio más perfecto, testimoniante y fructuoso del ministerio apostólico34. Para crecer en comunión, las Constituciones y otros documentos congregacionales establecen diversos dinamismos como el compartir la Palabra, los ritmos de oración, la reunión plenaria de la comunidad, el proyecto comunitario, el trabajo en equipo, el proyecto o plan personal de formación continua, el presupuesto económico y otros que los superiores locales y provinciales cuidarán de que mantengan su vitalidad y eficacia35."}, {"num": 41, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El espíritu de la vida de familia se manifiesta en la mesa común, donde nos alimentamos con los manjares que el Padre celestial proporciona a sus hijos, oímos la lectura espiritual, o nos comunicamos con los hermanos en una fraterna conversación."}, {"num": 42, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La caridad debe llevar al sacrificio y hacerse práctica con las obras de misericordia, continuando una tradición de la Congregación y creando entre nosotros una cultura de solidaridad: visitando cárceles, hospitales y asilos; también con la limosna y la ayuda moral a cuantos padecen necesidad36."}, {"num": 43, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El carisma de Claret que compartimos es fuente de fraternidad entre nosotros y con otras personas y grupos, particularmente con los miembros de la familia claretiana37. Por eso, la caridad debe manifestarse especialmente con las comunidades de otros Organismos Mayores, los miembros de la Familia Claretiana y de otros Institutos, los sacerdotes del clero secular, los evangelizadores seglares; de modo que bajo la obediencia de los Obispos y de los propios Superiores, nos integremos todos, según la vocación del Instituto, en la obra del Reino de Dios (n. 28)38."}, {"num": 44, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Debemos manifestar nuestro reconocimiento a nuestros bienhechores con nuestra amistad y con la ayuda espiritual y material ."}, {"num": 45, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "En cada una de nuestras Casas y en las Curias de los Organismos Mayores habrá un registro donde se inscriban los nombres de los bienhechores con sus datos personales."}, {"num": 46, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Nuestras obras misioneras deben asumir como prioridad la inculturación del Evangelio por medio del diálogo ecuménico, interreligioso e intercultural39. Por otra parte, la solidaridad con los pobres y excluidos exige un acercamiento a su realidad que ha de encontrar expresión concreta en el estilo de vida personal y comunitario40. Se animará a la creación de comunidades adecuadas para responder a los desafíos de la realidad en la que se pretende evangelizar41."}, {"num": 47, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "En cuanto al modo de vivir, acomódense los misioneros a las costumbres sanas de la región, como signo de eficacia y de preocupación pastoral, atendiendo a dar testimonio evangélico."}, {"num": 48, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Como en la Iglesia naciente perseveraban todos unánimes en la oración y comunicación de bienes \"con María la Madre de Jesús\" (Act 1,14), así, entre los que nos sabemos unidos por el lazo común de la condición de Hijos del Inmaculado Corazón de María, ha de reinar una caridad afectiva y efectiva más intensa, porque son mayores las exigencias de delicadeza, de mansedumbre y servicio mutuo, reclamadas por nuestro mismo título 42."}, {"num": 49, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Al margen de sus responsabilidades jurídicas y morales, imitando la bondad y misericordia de Jesucristo, dése la mano a los caídos en cualquier falta; hágaseles ver con la obra que todo está perdonado y olvidado, y que siguen siendo miembros vitales y eficientes de la comunidad, la cual no repara tanto en lo pasado como en lo presente y en el porvenir43."}, {"num": 50, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cuando un Superior Mayor envíe a un miembro de su Organismo a una comunidad de otro Organismo a estudiar o a cumplir otra misión, debe resolver de antemano y en contacto con los respectivos Superiores todo lo concerniente a su situación económica, comunitaria y apostólica. Por su parte, las comunidades recíbanlo con toda comprensión y caridad fraterna44."}, {"num": 51, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "En la Congregación no existe un límite de edad para cesar en la actividad misionera. Sin embargo, alcanzada la edad establecida en la región para la jubilación de los eclesiásticos, se podrá pedir al Superior Mayor pasar a situación de reposo o podrá decidirlo el mismo Superior Mayor si así lo juzga conveniente."}, {"num": 52, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Amen de una manera especial a los hermanos enfermos, como miembros que son del Cristo doliente. Procuren visitarlos y ayudarlos de buen grado viendo en ellos a Cristo. Por su parte, los Superiores y aquellos a quienes se confiare su cuidado, preocúpense de que a los hermanos enfermos se les proporcione con toda diligencia y caridad cuanto sea necesario para que recuperen la salud o para que soporten la enfermedad con serenidad de espíritu y paciencia cristiana45."}, {"num": 53, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Para favorecer eficazmente la caridad con los enfermos, todos los Misioneros tendrán un seguro de enfermedad e invalidez, según lo indicado en los nn. 583-58446."}, {"num": 54, "parte": "PARTE PRIMERA", "capitulo": "I", "capitulo_title": "COMUNIDAD MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Al morir un misionero se le enterrará en el panteón del Organismo claretiano más cercano al lugar de su fallecimiento y se celebrarán las exequias según lo prescrito en las Constituciones n. 19. cf E 20. Se ofrecerán los siguientes sufragios en favor de los difuntos: a) Por los difuntos de la Congregación, tanto profesos como novicios: 1) Sesenta misas por cada difunto de la propia comunidad. Si los miembros de ésta no las pueden celebrar, las harán decir por medio de la Colecturía provincial o general. 2) Una misa en el primer aniversario por cada difunto de la propia comunidad, si es posible en concelebración comunitaria. 3) Cuatro misas anuales en cada comunidad por los difuntos de la Congregación en general. b) Una misa anual en cada comunidad por los padres difuntos de los miembros de la misma. c) Cuando ocurra la muerte del padre o de la madre de alguno de los nuestros, se le aplicarán tres misas en la comunidad en que resida alguno de sus hijos. d) Por nuestros bienhechores difuntos se ofrecerá en cada comunidad una misa anual."}, {"num": 55, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "La castidad consagrada es un verdadero carisma, es decir, un don gratuito de Dios (1 Cor 7, 7; Mt 19, 12). No todos son llamados a recibir este don, ni todos lo pueden comprender (Mt 19, 11). Supone, por tanto, vocación divina47. Es un don que hemos recibido en vasos frágiles y que por lo mismo requiere la continua asistencia del poder de Cristo y del Espíritu Santo, que obra admirablemente en su Iglesia, y nuestra continua correspondencia48."}, {"num": 56, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "Como virtud verdadera, tiene ante todo un fundamento espiritual. Por eso, ha de apoyarse en una grande fe, en un amor ardiente y apasionado a Cristo; ha de abrazarse tras una elección consciente, libre y gozosa, sabiendo lo que incluye de elección divina y de generosa respuesta por parte del que la profesa49."}, {"num": 57, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "La castidad enciende más y más el celo y da testimonio del amor a todos los hombres. En la práctica del apostolado, la castidad, acompañada de la madurez y serenidad apostólica, capacita al misionero a ejemplo de Jesucristo (Lc 8, 2-3; Mt 27, 55; Jo 11, 5; Mc 15, 40-41), de los Apóstoles (Rom 16, 1-16; 1 Cor 9, 5) y de nuestro Fundador para cooperar en la obra del Reino de Dios y de su Iglesia50."}, {"num": 58, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "La práctica de la castidad perfecta ha de ser diligente, total, firme, confiada, fuente de alegría que sostenga el celo misionero, fundada en una sólida y profunda piedad51. Por otra parte debe ir acompañada de la prudencia que reconoce la realidad de los peligros y la propia debilidad (2 Cor 4, 7)52."}, {"num": 59, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "La propia conciencia dirá al religioso lo que, atendiendo a su estado particular, le es lícito hacer en materia de estudio, actividades, diversiones, lecturas, espectáculos, uso de medios de comunicación social, etc., dentro naturalmente de las normas que haya dado sobre puntos concretos la autoridad competente de la Iglesia o de la Congregación53."}, {"num": 60, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "Para vencer las tentaciones contra la castidad, sírvanse de los medios oportunos: la ayuda de algún hermano o acompañante espiritual, la oración, el trabajo, la vigilancia, el ejercicio de la presencia de Dios, el recuerdo de los novísimos y de la pasión de Jesucristo, su invocación, la de la Santísima Virgen y los Santos; la mortificación de los sentidos y de la imaginación, la templanza y sobriedad y la práctica de alguna mortificación corporal54."}, {"num": 61, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los misioneros deben adoptar también aquellos medios naturales que favorecen la salud mental y corporal55. Cada uno debe cuidar de su salud física y emocional, y estar dispuesto a reconocer las señales de alarma que pudieran anunciar una crisis en su vida. En tales ocasiones debe buscar la ayuda de sus Superiores o de experimentados consejeros, expertos también en psicología. Los Superiores, por su parte, deben actuar con sensibilidad ante las señales que indican que alguno de los miembros de su comunidad no se siente feliz, o manifiesta una preocupación personal prolongada o un desajuste emocional serio. Sobre todo, deben esforzarse por cuantos medios sean posibles para crear una vida de comunidad llena de verdadero calor y afecto fraterno, para que los sentimientos de soledad, que son un grandísimo peligro para la castidad, queden reducidos al mínimo en nuestras casas56."}, {"num": 62, "parte": "PARTE PRIMERA", "capitulo": "II", "capitulo_title": "CASTIDAD", "articulo": null, "articulo_title": null, "seccion": null, "text": "Todas las Provincias y Delegaciones Independientes deben elaborar una normativa propia a seguir en los casos de comportamientos indebidos en materia sexual, tomando en cuenta las normas dadas por la Congregación, la Iglesia universal, el episcopado local, la Conferencia de religiosos y la legislación del país. Estas normas habrán de ser aprobadas por el Gobierno General57."}, {"num": 63, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "San Antonio María Claret es para nosotros modelo siempre actual y auténtico de nuestro modo de vivir la pobreza evangélica. El consideró la pobreza como un elemento primordial y XXIV CapGen, acta 13. característico de su vocación apostólica y así la vivió, ya como seguimiento de Cristo e imitación de los Apóstoles, ya como testimonio del valor y veracidad de su ministerio58. El auténtico sentido claretiano de la pobreza nos ha de impulsar al trabajo cotidiano, a un estilo de vida austero, al trato con los más sencillos y humildes, y a no inspirar nuestras empresas apostólicas en intereses materiales, buscando únicamente en el uso de los bienes un mejor servicio a la difusión del Evangelio59. El santo Fundador escribía de la vida primitiva de la Congregación: \"Vivimos en comunidad... vida verdaderamente pobre y apostólica\"60."}, {"num": 64, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La pobreza ha de ser para nosotros medio de expresión de la perfecta fraternidad de nuestra vocación61. La pobreza efectiva, poniendo en común los bienes, testimonia la comunión espiritual que une a los miembros de la comunidad62. Por eso, nuestra pobreza excluye cualquier forma de peculio y apropiación privada63."}, {"num": 65, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La comunicación de bienes ha de practicarse con verdadero espíritu religioso entre las comunidades y Organismos de la Congregación, no sea que unos pasen necesidades mientras otros anden sobrados 64. Conviene informar a la Congregación entera de los casos en que nuestros hermanos pasen especial necesidad y que a veces pueden afectar a regiones y Organismos Mayores enteros65. Cuando fuere conveniente, puede la comunidad extender esa comunicación a otras personas o instituciones extrañas a la Congregación, prestando incluso nuestros edificios o locales66. Con mayor razón debe hacerse esto en caso de calamidades públicas. La hospitalidad y la misericordia deben formar parte de nuestra pobreza compartida67."}, {"num": 66, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La Congregación puede y debe realizar su apostolado usando de los medios económicos que sean necesarios, pero sin embarcarse en empresas económicas que pudieran llegar a distraernos de los verdaderos intereses del Reino de Cristo68. Se recomienda la revisión periódica de nuestras obras y empresas y la eliminación prudente de las que no estén conformes con los criterios de pobreza heredados del Padre Fundador69."}, {"num": 67, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "En el presupuesto administrativo de nuestras comunidades se destinará con generosidad una cantidad proporcionada para atender a las necesidades de los pobres (n. 588)70 y apoyar proyectos que los favorezcan71."}, {"num": 68, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cuiden los Superiores de que estén todos religiosamente atendidos, según las propias necesidades, sin diferencias injustificadas. Los Ecónomos y Administradores ejerzan su función sin espíritu de propiedad, conscientes de que administran bienes de todos. Sirvan a sus hermanos con caridad; por lo mismo, vivan solícitos de sus necesidades72."}, {"num": 69, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Hay que considerar el trabajo no sólo como una exigencia de la vocación apostólica y de servicio a la comunidad73, sino también como parte integrante de la pobreza apostólica. Los nuestros pueden aceptar un trabajo retribuido, ya sea como medio para preparar los caminos del Evangelio en algunos ambientes, ya sea para poder ejercer después gratuitamente el ministerio apostólico74."}, {"num": 70, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Recibir para la comunidad la remuneración por un trabajo, los estipendios, los derechos parroquiales, los derechos de autor, las subvenciones y limosnas, no es contrario al testimonio colectivo de pobreza; evítese, sin embargo, todo afán de lucro75. Procúrese crear un patrimonio estable que permita efectuar gratuitamente algunos ministerios76."}, {"num": 71, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los \"presupuestos personales\" se pueden autorizar si razones proporcionales lo aconsejan, quedando siempre a salvo las exigencias de la pobreza y comunidad de bienes, que exponen con sencillez y radicalidad las Constituciones, y guardando las siguientes orientaciones: a) Que se trate de presupuestos previamente presentados a la aprobación de la comunidad y periódicamente revisados. b) Que se trate de gastos determinados, ordinarios y habituales. c) Que se adecuen a las necesidades reales de cada religioso. d) En todo caso, se debe rechazar la acumulación de remanentes. e) En conformidad con lo prescrito, las pensiones, seguros, etc. de los Misioneros forman parte de los bienes de la comunidad."}, {"num": 72, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La libre renuncia de los bienes patrimoniales (CC 26) que, si es posible, ha de hacerse en forma civilmente válida, sólo podrá concederse a los que hayan cumplido, al menos, diez años de profesión perpetua77. El Superior legítimo para conceder esta renuncia es el Superior General con el consentimiento de su Consejo (can 668 § 4; Dir 496 p). Quienes no renuncien a los bienes patrimoniales podrán acumular los intereses al capital, para defenderlo contra la depreciación de la moneda78; pero no podrán acumular los frutos de los bienes inmuebles, cedidos en uso y en usufructo."}, {"num": 73, "parte": "PARTE PRIMERA", "capitulo": "III", "capitulo_title": "POBREZA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Las herencias, legados y donaciones semejantes que reciba un profeso de personas extrañas a la familia, los adquiere para la Congregación; mas si proceden de parientes, ya lo sean por consanguinidad, ya por afinidad, entran en su patrimonio, y de ellos puede conservar el dominio radical, cediendo la administración y disponiendo del uso y usufructo conforme a derecho (n. 536 c)."}, {"num": 74, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Hemos de vivir la obediencia como consagración y misión79, recordando las palabras y ejemplos de nuestro santo Fundador que nos quiere perfectos en la obediencia ya desde el comienzo de nuestra vida religiosa80."}, {"num": 75, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Por amor a Jesucristo hemos de obedecer en todas las cosas, aun en las no obligatorias y difíciles, y no sólo a los Superiores, sino también a sus delegados en su respectivo orden y oficio, aun cuando no impongan expresamente precepto, sino a una simple insinuación de su voluntad81."}, {"num": 76, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los misioneros claretianos hemos de mirar la obediencia como virtud esencialmente apostólica, recordando las palabras y los ejemplos de nuestro Padre Fundador, quien como misionero, actuó siempre bajo el gobierno y la dirección de sus Superiores82. Y esto vale para toda ocupación y ministerio83. Evítese, por tanto, el aceptar ministerios apostólicos, cargos u oficios eclesiásticos o civiles al margen de los Superiores (can. 671; CC 50) o de la comunidad84."}, {"num": 77, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Toda la comunidad tiene la misión de buscar y cumplir la voluntad de Dios. Superiores y hermanos constituyen una unidad desde sus funciones diferentes y siempre complementarias."}, {"num": 78, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El diálogo exige disposiciones de acogida, comprensión y respeto mutuo, lo mismo que una actitud fundamental de conversión y debe desarrollarse siempre en un clima de caridad85. Cuando sea menester y en virtud de las funciones de toda autoridad, los Superiores pueden y deben adoptar posturas claras, dar las debidas orientaciones y tomar la decisión que, en su prudencia, juzguen más conveniente86."}, {"num": 79, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "La facultad de mandar y obligar a sus respectivos súbditos en virtud de obediencia y por razón del voto compete por propia autoridad a todos nuestros Superiores, que en rigor lo sean, aun los locales. Los Vicarios y Consultores de régimen mayor pueden gozar de ella por legítima y probada delegación o sustitución del Superior respectivo."}, {"num": 80, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Para que el mandato o precepto obligue en razón del voto, debe darse por escrito, con fórmula clara e inequívoca (can 37, 51). Estos preceptos no se den sin la debida ponderación y guárdense las formalidades prescritas por el derecho (can 50)."}, {"num": 81, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Quien se considere perjudicado por lo mandado por un Superior puede recurrir, alegando los motivos del caso, ante el propio Superior o ante el Superior más elevado, a tenor y a los efectos de los cánones 1734 y 1737. a) El recurso tiene efecto solamente \"in devolutivo\" y no \"in suspensivo\", si en cada caso no se dice expresamente lo contrario; por tanto, el súbdito, elevado ya y pendiente el recurso, debe obedecer hasta que las partes tengan conocimiento oficial de lo proveído. b) En el recurso a un Superior más elevado se ha de proceder con el debido orden, es decir, sin prescindir de los Superiores intermedios, a menos que se trate de algún caso reservado al Superior más elevado. c) No se recurra al Superior ausente yendo a él personalmente, sin previo consentimiento del mismo. d) En los recursos contra los Visitadores obsérvese la norma del n. 474."}, {"num": 82, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Generalmente el Superior Mayor no conceda a sus súbditos permisos o licencias sin haber oído antes al Superior inmediato del peticionario; y si los concede, comuníquelo en forma legítima a dicho Superior. Este no está obligado a reconocer el permiso o facultad que el súbdito tiene concedida por el Superior Mayor, a no ser que le presente el legítimo documento de concesión."}, {"num": 83, "parte": "PARTE PRIMERA", "capitulo": "IV", "capitulo_title": "OBEDIENCIA", "articulo": null, "articulo_title": null, "seccion": null, "text": "Todos los individuos de la Congregación que se hallan de paso en alguna de nuestras comunidades, respetarán el reglamento y disciplina de la comunidad que los recibe, en cuanto lo permita el cumplimiento de la misión u oficio que ha motivado su presencia ."}, {"num": 84, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Nuestros actos de piedad han de expresar, según las orientaciones de la Iglesia, las características de nuestro patrimonio espiritual claretiano. Entre los elementos característicos heredados de nuestro Padre Fundador destacan: el cristocentrismo, la piedad eucarística, el amor a la Palabra de Dios, el modo de vivir la filiación cordimariana en estrecha relación con su vocación misionera, la devoción a los Apóstoles y a los Santos que se han distinguido especialmente por su celo apostólico87. Y cada uno personalmente y en todas las comunidades estos rasgos se deben cultivar con esmero88"}, {"num": 85, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "La piedad de nuestras comunidades debe dar la primacía a la Sagrada Liturgia, especialmente a la Eucaristía y a la Liturgia de las Horas (CC 35). Las demás formas de piedad comunitaria deben organizarse de modo que vayan de acuerdo con la Liturgia y, en cierto modo, deriven de ella y a ella conduzcan89. Cada comunidad dedicará todos los días media hora, como mínimo, a la oración en común, preferentemente con el rezo de la Liturgia de las Horas90."}, {"num": 86, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Se recomienda encarecidamente a la conciencia y control íntimo de cada uno la fidelidad e intensidad de oración que piden nuestras Constituciones91."}, {"num": 87, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Se considera imprescindible (CC 37) la oración personal o meditación durante una hora diaria, o media hora excepcionalmente o en circunstancias especiales92."}, {"num": 88, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Conservando una sana tradición (CC 36) del Instituto, procúrese rezar el Rosario y visitar al Santísimo Sacramento individualmente cuando no se haga en comunidad93."}, {"num": 89, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Como expresión tradicional de nuestra piedad han de celebrarse comunitariamente la novena al Corazón de María y el triduo al Santo Fundador. Con el mismo sentido se recomiendan también otras devociones como el mes mariano y el triduo a San José. Háganse de modo sencillo e inspirado en la Liturgia94."}, {"num": 90, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "El examen de conciencia, según la mente y la práctica de nuestro Santo Padre Fundador, se concreta en dos tiempos fundamentales: hacia la mitad de la jornada, con carácter predominante de oración mental, y, por la noche, con carácter de revisión general del día, que puede unirse al rezo de Completas95."}, {"num": 91, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cada mes, la comunidad consagra un día a renovarse en el espíritu (CC 52). Puede hacerse de diferentes modos, según la diferente condición de las casas. La ordenación concreta del retiro, en cuanto a la fecha y horario, compete al Superior Local, oída la comunidad. En este día téngase la meditación sobre un tema de nuestra vida misionera, una plática y un examen que puede hacerse en forma de revisión comunitaria de vida. Donde sea posible, téngase concelebración o un acto eucarístico96."}, {"num": 92, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Los ejercicios espirituales (CC 52) se practicarán normalmente fuera del propio lugar de trabajo, observando en ellos el silencio y el retiro97. Se acepta la práctica de otros tipos de Ejercicios, además de los ignacianos, por criterios de eficacia o por otras circunstancias diversas98. La ordenación concreta de los Ejercicios se deja al Director con la aprobación del Superior99."}, {"num": 93, "parte": "PARTE PRIMERA", "capitulo": "V", "capitulo_title": "ORACIÓN", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cada comunidad debe revisar con alguna frecuencia su propia vida de oración, la fidelidad a los actos de piedad prescritos y la creación de un ambiente favorable a la misma 100. De esta revisión comunitaria se responsabilizará el Superior, como un servicio eminente de su misión en la comunidad."}, {"num": 94, "parte": "PARTE PRIMERA", "capitulo": "VI", "capitulo_title": "CONFIGURACIÓN CON CRISTO", "articulo": null, "articulo_title": null, "seccion": null, "text": "La centralidad de Cristo en nuestra vida es la raíz de nuestra identidad misionera, crea y renueva constantemente la comunión fraterna y sostiene nuestro compromiso en la transformación del mundo por medio del servicio misionero de la Palabra. Por ser la Congregación un Instituto plenamente apostólico, el Santo Padre Fundador tiene muy en cuenta el valor testimoniante de la vida del misionero en orden a la edificación del Pueblo de Dios101. Este testimonio, como toda nuestra actividad apostólica, brota de una real configuración exterior e interior con Cristo Evangelizador y de una íntima comunión y amistad con Él102."}, {"num": 95, "parte": "PARTE PRIMERA", "capitulo": "VI", "capitulo_title": "CONFIGURACIÓN CON CRISTO", "articulo": null, "articulo_title": null, "seccion": null, "text": "Como el Señor Jesús mostró siempre en su exterior la interna plenitud de gracia con que el Padre le había colmado, así nosotros por la afabilidad, alegría espiritual y modestia, hemos de poner de manifiesto la presencia de Dios en el mundo. Hemos de usar con moderación de nuestros sentidos, de manera que no sólo evitemos la ocasión del pecado, sino también ofrezcamos un sacrificio agradable a Dios y demos testimonio apostólico al prójimo. Guárdense con fidelidad, como prácticas comunitarias de penitencia, la tradición del ayuno semanal y otras obras de caridad o ejercicios de piedad (can 1249)103."}, {"num": 96, "parte": "PARTE PRIMERA", "capitulo": "VI", "capitulo_title": "CONFIGURACIÓN CON CRISTO", "articulo": null, "articulo_title": null, "seccion": null, "text": "Guardémonos de los vicios de la lengua que tanto lesionan la caridad, la justicia o la prudencia, teniendo presentes las palabras de Santiago: \"Si alguno piensa ser hombre religioso no refrenando su lengua, es vana su religión\" (Sant 1, 26). Hemos sido llamados para vivir en alabanza de Dios, para predicar el Evangelio del Hijo y para animarnos mutuamente en el camino del Señor104."}, {"num": 97, "parte": "PARTE PRIMERA", "capitulo": "VI", "capitulo_title": "CONFIGURACIÓN CON CRISTO", "articulo": null, "articulo_title": null, "seccion": null, "text": "Llevemos por doquier en nuestro cuerpo la muerte de Jesús, padeciendo juntamente con Aquel con quien nos gloriamos. Esto es necesario a aquellos que son enviados a anunciar el misterio de la cruz de Cristo y de la gloria del Señor (2Cor 4, 10)105."}, {"num": 98, "parte": "PARTE PRIMERA", "capitulo": "VI", "capitulo_title": "CONFIGURACIÓN CON CRISTO", "articulo": null, "articulo_title": null, "seccion": null, "text": "Fieles a la tradición de la Congregación, que desde sus comienzos dio un testimonio colectivo de mortificación en sus casas, en el modo de vivir, viajar, comida y bebida, vestido y ajuar, diversiones y juegos, excursiones, etc., los misioneros manifiesten su misión de ser signo evangélico teniendo en cuenta los diversos ambientes en que la Congregación está y los cambios de sensibilidad en cada tiempo106."}, {"num": 99, "parte": "PARTE PRIMERA", "capitulo": "VI", "capitulo_title": "CONFIGURACIÓN CON CRISTO", "articulo": null, "articulo_title": null, "seccion": null, "text": "La asistencia a espectáculos, el uso de internet y de los medios de comunicación social deben estar regulados por el provecho cultural, la debida información y la conveniente recreación. Evítese cuidadosamente en esta materia lo que puede causar daño a la propia vocación, a la vida espiritual, al testimonio y al trabajo apostólico (CC 57)."}, {"num": 100, "parte": "PARTE PRIMERA", "capitulo": "VI", "capitulo_title": "CONFIGURACIÓN CON CRISTO", "articulo": null, "articulo_title": null, "seccion": null, "text": "Cada comunidad hará materia de revisión el uso de los medios de comunicación social y de los espectáculos de que se habla en el número anterior107."}, {"num": 101, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "El ministerio de la Palabra, con el que anunciamos a los hombres el Misterio íntegro de Jesucristo (CC 46), es lo que especifica nuestra misión en el Pueblo de Dios y por el que nos constituimos en Instituto apostólico en la Iglesia. Nuestro carisma en la Iglesia es una experiencia del Espíritu, que nos configura con Jesucristo-Evangelizador, al estilo de Claret108. Hemos de vivirlo según el espíritu y el estilo profético heredados del Fundador y enriquecidos por la tradición del Instituto109. Esta vocación misionera es la fuente de nuestro apostolado y el criterio fundamental para la selección de las obras apostólicas110. Él debe inspirar y orientar siempre a los misioneros y cada una de sus obras111."}, {"num": 102, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Nuestro carisma misionero incluye la consagración y la misión112, y comporta ser totalmente de Dios y estar entregados del todo al Reino. Así, el ministerio de la Palabra implica un auténtico modo de ser, de actuar y de significar113. Imitando a Jesús, el Profeta por excelencia, nosotros hemos de convertirnos en signo y expresión de la Palabra de Dios114."}, {"num": 103, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "La consagración a Dios constituye por sí misma nuestra primera y primigenia forma de evangelizar115. Nuestra entrega al servicio de los hombres nos exige una sólida espiritualidad de la acción, cultivar en profundidad la experiencia de Dios; discernir, a la luz del Espíritu, los desafíos de nuestro tiempo y traducirlos con valentía y audacia en opciones y proyectos XVIII CapGen, ses. 36. cf DC 23-25; EMP 19. coherentes tanto con el carisma original como con las exigencias de la situación histórica concreta116. Así, nuestro ministerio de la Palabra se ordena al anuncio íntegro del misterio de Jesús para que el Reino del Padre crezca en el mundo117."}, {"num": 104, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Somos comunidad misionera. La comunidad es nuestra primera “palabra misionera”118 que anuncia la llegada del Reino y es germen de relaciones más fraternas entre las personas y los pueblos119. La vida fraterna en comunidad forma parte de nuestro anuncio misionero y, por ello, la misión no se puede vivir al margen de la comunidad sino en el seno de la misma, participando de su vida y de su proyección apostólica."}, {"num": 105, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Nuestra comunidad está al servicio de la Iglesia. Esto nos exige un esfuerzo constante por identificarnos. Esto nos exige un esfuerzo constante para identificarnos vocacionalmente en la comunión congregacional y en la disponibilidad para la misión universal120. Toda obra apostólica tiene que quedar enmarcada en el ámbito comunitario y en apertura universal, aun aquellas que puedan ser llevadas a cabo por una sola persona. Por eso, el envío eclesial lo recibimos normalmente a través de la comunidad claretiana."}, {"num": 106, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Nuestra misión forma parte de la misión de la Iglesia al servicio de los hombres. Por lo mismo, sin el estudio atento y participativo de la realidad del hombre en cada época y en cada lugar, no podemos conocer sus necesidades de evangelización ni las características que ha de tener nuestra misión para responder a las mismas. Hemos de ser especialmente sensibles a todos aquellos aspectos que interpelan más directamente nuestra identidad misionera, como la ausencia de evangelización, la posibilidad de suscitar evangelizadores, las situaciones de pobreza y opresión, los movimientos culturales, ideológicos o políticos (CC 14, 46)121."}, {"num": 107, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "La observación atenta y el estudio de la realidad debe llevarnos a una actitud de constante discernimiento y de revisión de nuestras posiciones (CC 48)122, buscando la forma más apropiada para anunciar y hacer que crezca el Reino en el mundo123. Esta actitud se ha de fomentar tanto a nivel personal como comunitario."}, {"num": 108, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "La naturaleza eclesial de nuestra misión nos exige estar siempre atentos a la realidad de la Iglesia y a la conciencia que ella tiene de su misión en cada época y lugar124."}, {"num": 109, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Como nuestro servicio a la Iglesia se realiza en el seno de las Iglesias particulares, es de suma importancia conocer la situación real de cada una de ellas en orden a una adecuada y fructuosa inserción en las mismas125. Nos comprometemos en la consolidación de una 120 cf. EN 21; VFC 54; EMP 28; HAC 16. 121 HAC 16. Iglesia de comunión y participación, de diálogo y servicio, de solidaridad, justicia y fraternidad, que lleva a creer en la Palabra126."}, {"num": 110, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Entendemos nuestra misión, desde la clave del amor, como participación en la “misio Dei”127, como colaboración en la misión que el Espíritu lleva adelante en la historia. Nuestro apostolado y la selección de nuestras obras deben desarrollarse desde unas opciones que manifiesten nuestro fundamental compromiso de misión, sirviéndonos de todos los medios y siguiendo el criterio de lo más urgente128, oportuno y eficaz. Tales opciones son actitudes apostólicas constantes, que deben guiar y articular toda nuestra acción misionera129. Estas opciones son: - una evangelización misionera (n. 111) - una evangelización inculturada (n. 112) - una evangelización profética y liberadora (n. 113) - una evangelización en “misión compartida” (n. 114) - una evangelización multiplicadora de líderes evangelizadores (n. 115)."}, {"num": 111, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Dentro de la Iglesia, optamos por la evangelización misionera según el espíritu de Claret. Por medio del anuncio de la Palabra nos comprometemos a ser instrumentos del Espíritu para llevar a los hombres y a las comunidades el mensaje de la conversión; para invitarlos constantemente a mantenerse en el fervor de la primera conversión y finalmente, para ayudar a las Iglesias a conservar la apertura misionera a la Iglesia universal. Haremos que la animación y la pastoral bíblicas dinamicen siempre nuestro compromiso evangelizador130."}, {"num": 112, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Fieles al principio de la encarnación, hemos de realizar una evangelización inculturada, integrando como criterio y clave de todos nuestros ministerios el “diálogo de vida” que tiene siempre en cuenta a los demás y no excluye a nadie131. Nos esforzaremos en escuchar lo que el Señor nos dice a través de las otras tradiciones religiosas y en abrirnos a los valores culturales de los pueblos132. Todo ello en perfecta fidelidad al contenido del Evangelio y en total comunión con la Iglesia universal133."}, {"num": 113, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Solidarios con los sufrimientos y angustias de la humanidad, nuestra evangelización ha de ser profética y liberadora para ayudarla a salir de toda clase de alienaciones y opresiones, como son la pérdida del sentido de la transcendencia, las situaciones infrahumanas de pobreza y de injusticia, la falta de libertad religiosa134. Conocemos y aceptamos los riesgos que semejante anuncio profético comporta135. El Gobierno General para toda la Congregación, y los Gobiernos de los Organismos Mayores para su ámbito propio, crearán el Secretariado de Justicia, Paz y Salvaguardia de la Creación. Integraremos estos desafíos en nuestros proyectos comunitarios tratando, al mismo tiempo, de colaborar con otras organizaciones que trabajen en estos ámbitos136. Imitando la preferencia de Jesús por los pobres, secundando el llamamiento de la Iglesia y siguiendo el ejemplo del Fundador, queremos hacer llegar a todos los hombres el mensaje de salvación proclamado desde la perspectiva de los pobres y necesitados, que son la mayor parte de la humanidad137."}, {"num": 114, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Como miembros de una Iglesia que se constituye en la comunión de vocaciones, carismas y ministerios, asumimos la “misión compartida” como nuestro modo normal de misión. Por ello, tanto el Gobierno General como los Gobiernos de los Organismos Mayores promoverán y apoyarán estructuras pastorales e itinerarios formativos que plasmen este compromiso138."}, {"num": 115, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "En sintonía con el espíritu del Fundador nos sentimos urgidos a hacer del anuncio misionero del Evangelio una fuerza multiplicadora de líderes evangelizadores según las diversas vocaciones que hay en la Iglesia139 ."}, {"num": 116, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "Aunque nuestra vocación apostólica es universal y no excluye a ninguna clase de personas (CC 2), sin embargo, en cada tiempo y lugar se realiza mediante la dedicación preferencial a determinados destinatarios. Cada comunidad provincial y local haga un discernimiento en orden a determinar los sujetos preferenciales de su misión dentro de los que se vayan señalando a nivel general140, como pueden ser los que no han recibido el anuncio del Evangelio141, quienes se han alejado de la Iglesia142, los pobres y excluidos143, los jóvenes144, la familia145 y los nuevos evangelizadores146 ."}, {"num": 117, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "1", "articulo_title": "Naturaleza y características de nuestra misión", "seccion": null, "text": "En este momento en que los seglares han recobrado en la Iglesia el protagonismo y las responsabilidades que les corresponden, nos sentimos más vivamente urgidos a impulsar el movimiento de Seglares Claretianos, colaborando generosamente en su formación cristiana, apostólica y claretiana. Hemos de acompañarlos en el proceso de maduración y autonomía que nuestro común Fundador pensó para ellos147. Seglar Claretiano es aquel cristiano que ha recibido de Dios la vocación de evangelizador para vivirla como seglar según el carisma misionero de Claret. El Asociado Claretiano, en cambio, es aquel que, individualmente o en grupo, se vincula a alguna de nuestras obras, proyectos o tareas de evangelización, sea laico o sacerdote, tenga o no vocación a alguna de las ramas de la Familia Claretiana 148. 4. MJSC, Ann 54 (1979) 245-248; cf 1AP 84; AS 2,"}, {"num": 118, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Las estructuras y las posiciones en que nuestra Congregación desarrolla su actividad misionera deben ser mantenidas, reforzadas, renovadas o suprimidas según respondan o no a las urgencias tanto de la Igle
