<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data-blob').textContent);
const paragraphs = DATA.paragraphs; // array
const chapters = DATA.chapters;
const index = DATA.index;
const siglas = DATA.siglas;

const byNum = {};
paragraphs.forEach(p => byNum[p.num] = p);

// group chapters by parte, preserving order & dedup consecutive same parte
const partes = [];
let curParte = null;
chapters.forEach(c => {
  if (!curParte || curParte.label !== c.parte) {
    curParte = {label: c.parte, chapters: []};
    partes.push(curParte);
  }
  curParte.chapters.push(c);
});

const PARTE_NAMES = {
  'PARTE PRIMERA':'I · Vida misionera de la Congregación',
  'PARTE SEGUNDA':'II · Las personas de la Congregación',
  'PARTE TERCERA':'III · Régimen de la Congregación',
  'PARTE CUARTA':'IV · La gestión de bienes temporales'
};

// ---------- Preferences ----------
function loadPrefs(){
  try{
    const raw = localStorage.getItem('directorio_cmf_prefs');
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function savePrefs(p){
  try{ localStorage.setItem('directorio_cmf_prefs', JSON.stringify(p)); }catch(e){}
}
let prefs = Object.assign({fontStep:0, dark:false}, loadPrefs());

function applyPrefs(){
  document.documentElement.setAttribute('data-theme', prefs.dark ? 'dark':'light');
  document.getElementById('darkToggle').checked = !!prefs.dark;
  const base = 1;
  const size = base + prefs.fontStep*0.1;
  document.documentElement.style.setProperty('--content-size', size+'rem');
}
window.toggleDark = function(v){ prefs.dark = v; savePrefs(prefs); applyPrefs(); };
window.changeFont = function(delta){
  prefs.fontStep = Math.max(-2, Math.min(6, (prefs.fontStep||0)+delta));
  savePrefs(prefs); applyPrefs();
};

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  document.getElementById('settingsPop').classList.toggle('open');
});

// ---------- Mobile sidebar drawer ----------
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
document.getElementById('menuToggle').addEventListener('click', ()=>{
  const sb = document.getElementById('sidebar');
  sb.classList.contains('open') ? closeSidebar() : openSidebar();
});
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
document.addEventListener('click', (e)=>{
  const pop = document.getElementById('settingsPop');
  if (!pop.contains(e.target) && e.target.id !== 'settingsBtn') pop.classList.remove('open');
});

// ---------- Sidebar ----------
function renderSidebar(){
  const nav = document.getElementById('sidebar');
  let html = '';
  partes.forEach(parte=>{
    html += `<div class="nav-section-title">${PARTE_NAMES[parte.label]||parte.label||''}</div>`;
    parte.chapters.forEach(c=>{
      const label = c.roman === 'ANEXO' ? 'Anexo' : ('Cap. '+c.roman);
      html += `<div class="cap-link" data-cap="${c.roman}-${escAttr(c.title||'')}" onclick="location.hash='#/capitulo/${encodeURIComponent(c.roman)}'"><span class="cap-num">${label}</span>${c.title? titleCase(c.title):''}</div>`;
    });
  });
  html += `<div class="static-links">
    <a href="#/index">Índex alfabètic de matèries</a>
    <a href="#/siglas">Sigles i abreviatures</a>
  </div>`;
  nav.innerHTML = html;
}
function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function titleCase(s){
  if(!s) return '';
  return s.charAt(0)+s.slice(1).toLowerCase().replace(/^./,c=>c); // keep as-is mostly, light touch
}
function niceTitle(s){
  if(!s) return '';
  // convert ALL CAPS chapter titles to elegant capitalized form
  return s.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, c=>c.toUpperCase());
}

// ---------- Rendering helpers ----------
function highlightRefs(text){
  // make "n. 123", "nn. 123", "Dir 123", "CC 123" clickable when the number exists
  return text.replace(/\b(n\.{1,2}|nn\.|Dir|CC)\s+(\d{1,3})\b/g, (m, tag, num)=>{
    if (byNum[num]) return `${tag} <a href="#/n/${num}" class="ref-link">${num}</a>`;
    return m;
  });
}

function paraCardHTML(p, showNav){
  const chapTitle = p.capitulo_title ? niceTitle(p.capitulo_title) : '';
  const chapLabel = p.capitulo === 'ANEXO' ? 'Anexo' : (p.capitulo ? 'Capítulo '+p.capitulo : '');
  const context = [chapLabel, chapTitle].filter(Boolean).join(' — ');
  const artLine = p.articulo_title ? `Art. ${p.articulo}°. ${p.articulo_title}` : '';
  let nav = '';
  if (showNav){
    const nums = paragraphs.map(x=>x.num);
    const i = nums.indexOf(p.num);
    const prev = i>0 ? nums[i-1] : null;
    const next = i<nums.length-1 ? nums[i+1] : null;
    nav = `<div class="para-nav">
      <span>${prev? `<a href="#/n/${prev}">← n. ${prev}</a>`:''}</span>
      <span>${p.capitulo? `<a href="#/capitulo/${encodeURIComponent(p.capitulo)}">veure capítol sencer</a>`:''}</span>
      <span>${next? `<a href="#/n/${next}">n. ${next} →</a>`:''}</span>
    </div>`;
  }
  return `<div class="card">
    <div class="crumbs">${context}${artLine? ' · '+artLine:''}</div>
    <div class="para-head">
      <div class="para-num-badge">${p.num}</div>
      <div>${p.seccion? `<div class="para-seccion">${p.seccion}</div>`:''}</div>
    </div>
    <div class="para-text">${highlightRefs(p.text)}</div>
    ${nav}
  </div>`;
}

// ---------- Views ----------
function viewInicio(){
  const main = document.getElementById('main');
  main.innerHTML = `
  <div class="card">
    <h1 class="page-title">Directorio de los Misioneros Hijos del Inmaculado Corazón de María</h1>
    <div class="subtitle">Edición 2011 · Roma — buscador i lector per a consulta ràpida</div>
    <p style="line-height:1.7">Aquesta eina permet cercar per paraula o tema, navegar per capítols i articles, saltar directament a un número marginal, o consultar l'índex alfabètic de matèries original del Directorio.</p>
    <p style="line-height:1.7; color:var(--ink-soft); font-size:.9rem;">${paragraphs.length} números articulats en ${chapters.length} capítols. Els números omesos en aquesta edició (5, 146, 148, 385–388) corresponen a la renumeració feta pel mateix Directorio respecte a l'edició de 1999.</p>
  </div>`;
}

function viewParagraph(num){
  const p = byNum[num];
  const main = document.getElementById('main');
  if (!p){ main.innerHTML = `<div class="card"><p class="empty-state">No existeix el número ${num} en aquesta edició.</p></div>`; return; }
  main.innerHTML = paraCardHTML(p, true);
}

function viewChapter(roman){
  const c = chapters.find(x=>x.roman===roman);
  const main = document.getElementById('main');
  if (!c){ main.innerHTML = `<div class="card"><p class="empty-state">Capítol no trobat.</p></div>`; return; }
  const paras = paragraphs.filter(p=>p.capitulo===roman);
  let curArt = null, curSec = null;
  let rows = '';
  paras.forEach(p=>{
    if (p.articulo_title && p.articulo_title !== curArt){
      curArt = p.articulo_title;
      rows += `<div class="nav-section-title" style="margin-top:22px;">Art. ${p.articulo}°. ${curArt}</div>`;
      curSec = null;
    }
    if (p.seccion && p.seccion !== curSec){
      curSec = p.seccion;
      rows += `<div class="para-seccion" style="margin:10px 0 4px 0;">${curSec}</div>`;
    }
    rows += `<div class="para-row"><div class="num">${p.num}</div><div class="txt">${highlightRefs(p.text)}</div></div>`;
  });
  const label = roman==='ANEXO' ? 'Anexo' : ('Capítulo '+roman);
  main.innerHTML = `<div class="card">
    <div class="crumbs">${c.parte? (PARTE_NAMES[c.parte]||c.parte):''}</div>
    <h1 class="page-title">${label}</h1>
    <div class="subtitle">${niceTitle(c.title||'')}</div>
    ${rows}
  </div>`;
}

function viewIndexLetter(letter){
  const main = document.getElementById('main');
  const letters = [...new Set(index.map(e=>e.term.trim()[0]))].sort();
  let tabs = `<div class="az-tabs">` + letters.map(l=>`<a href="#/index/${l}" class="${l===letter?'active':''}">${l}</a>`).join('') + `</div>`;
  let entries = index;
  if (letter) entries = index.filter(e=>e.term.trim()[0]===letter);
  let body = entries.map(e=>{
    const linked = e.text.replace(/\b(\d{1,3})(\s*[-–]\s*(\d{1,3}))?\b/g, (m, a, dash, b)=>{
      let out = byNum[a] ? `<a href="#/n/${a}">${a}</a>` : a;
      if (b) out += '–' + (byNum[b] ? `<a href="#/n/${b}">${b}</a>` : b);
      return out;
    });
    return `<div class="idx-entry"><span class="idx-term">${e.term}</span><span class="idx-body"> ${linked}</span></div>`;
  }).join('');
  main.innerHTML = `<div class="card">
    <h1 class="page-title">Índex alfabètic de matèries</h1>
    <div class="subtitle">Es remet als números marginals del Directorio</div>
    ${tabs}
    ${body || '<p class="empty-state">Sense entrades.</p>'}
  </div>`;
}

function viewSiglas(){
  const main = document.getElementById('main');
  function group(title, obj){
    return `<div class="sigla-group"><h3>${title}</h3>` +
      Object.entries(obj).map(([k,v])=>`<div class="sigla-row"><span class="sigla-code">${k}</span><span>${v}</span></div>`).join('') +
      `</div>`;
  }
  main.innerHTML = `<div class="card">
    <h1 class="page-title">Sigles i abreviatures</h1>
    ${group("Documents de l'Església", siglas.iglesia)}
    ${group('Documents de la Congregació', siglas.congregacion)}
    ${group('Altres documents', siglas.otros)}
  </div>`;
}

function escapeHtml(s){
  return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function snippetAround(text, q, len){
  const low = text.toLowerCase();
  const i = low.indexOf(q.toLowerCase());
  if (i<0) return escapeHtml(text.slice(0,len))+'…';
  const start = Math.max(0, i-60);
  const end = Math.min(text.length, i+q.length+140);
  let snip = text.slice(start, end);
  if (start>0) snip = '…'+snip;
  if (end<text.length) snip = snip+'…';
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return escapeHtml(snip).replace(re, '<mark>$1</mark>');
}

function viewSearch(q){
  const main = document.getElementById('main');
  if (!q || q.trim().length<2){
    main.innerHTML = `<div class="card"><p class="empty-state">Escriu almenys 2 caràcters per cercar.</p></div>`;
    return;
  }
  const qlow = q.toLowerCase();
  const paraHits = paragraphs.filter(p=>p.text.toLowerCase().includes(qlow));
  const idxHits = index.filter(e=> e.term.toLowerCase().includes(qlow) || e.text.toLowerCase().includes(qlow));
  let html = `<div class="card"><h1 class="page-title">Resultats per «${escapeHtml(q)}»</h1>
    <div class="subtitle">${paraHits.length} números del Directorio · ${idxHits.length} entrades de l'índex</div>`;
  if (paraHits.length===0 && idxHits.length===0){
    html += `<p class="empty-state">Cap resultat. Prova amb una altra paraula.</p>`;
  }
  if (idxHits.length){
    html += `<div class="nav-section-title">Índex de matèries</div>`;
    idxHits.slice(0,15).forEach(e=>{
      html += `<div class="result-item"><div class="result-meta">Índex · ${e.term}</div><div class="result-snippet">${snippetAround(e.text,q,180)}</div></div>`;
    });
  }
  if (paraHits.length){
    html += `<div class="nav-section-title" style="margin-top:20px;">Text del Directorio</div>`;
    paraHits.slice(0,50).forEach(p=>{
      const ctx = (p.capitulo==='ANEXO'?'Anexo':'Cap. '+p.capitulo) + (p.articulo_title? ' · Art. '+p.articulo+'°':'');
      html += `<div class="result-item">
        <div class="result-meta">n. ${p.num} · ${ctx}</div>
        <div class="result-snippet"><a href="#/n/${p.num}">${snippetAround(p.text,q,220)}</a></div>
      </div>`;
    });
    if (paraHits.length>50) html += `<p style="color:var(--ink-soft); font-size:.85rem;">…i ${paraHits.length-50} resultats més. Afina la cerca.</p>`;
  }
  html += `</div>`;
  main.innerHTML = html;
}

// ---------- Router ----------
function router(){
  const hash = location.hash.replace(/^#/,'') || '/inicio';
  const parts = hash.split('/').filter(Boolean);
  document.querySelectorAll('.cap-link').forEach(el=>el.classList.remove('active'));
  window.scrollTo(0,0);
  closeSidebar();
  if (parts[0]==='inicio' || parts.length===0){ viewInicio(); return; }
  if (parts[0]==='n' && parts[1]){ viewParagraph(parseInt(parts[1],10)); return; }
  if (parts[0]==='capitulo' && parts[1]){
    const roman = decodeURIComponent(parts[1]);
    viewChapter(roman);
    const el = document.querySelector(`.cap-link[data-cap^="${roman}-"]`);
    if (el) el.classList.add('active');
    return;
  }
  if (parts[0]==='index'){ viewIndexLetter(parts[1]||null); return; }
  if (parts[0]==='siglas'){ viewSiglas(); return; }
  if (parts[0]==='cerca'){ viewSearch(decodeURIComponent(parts[1]||'')); return; }
  viewInicio();
}
window.addEventListener('hashchange', router);

// ---------- Search box & jump ----------
let searchTimer=null;
document.getElementById('searchbox').addEventListener('input', (e)=>{
  const val = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    if (val.trim().length>=2){ location.hash = '#/cerca/'+encodeURIComponent(val); }
  }, 300);
});
document.getElementById('searchbox').addEventListener('keydown', (e)=>{
  if (e.key==='Enter'){ location.hash = '#/cerca/'+encodeURIComponent(e.target.value); }
});
window.jumpToNum = function(){
  const v = document.getElementById('jumpnum').value.trim();
  if (v) location.hash = '#/n/'+v;
};
document.getElementById('jumpnum').addEventListener('keydown', (e)=>{
  if (e.key==='Enter') jumpToNum();
});

// ---------- Init ----------
renderSidebar();
applyPrefs();
router();
})();

</script>
</body>
</html>
