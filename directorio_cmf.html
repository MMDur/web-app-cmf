sia particular como universal en la línea de nuestro carisma y nuestra herencia claretiana (n. 22)149. Hemos de favorecer las posiciones que faciliten el desplazamiento de nuestros ministerios hacia los más pobres y necesitados150."}, {"num": 119, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "De acuerdo con los tiempos y lugares, buscando siempre un modelo de Iglesia cada vez más participativo, nuestro espíritu de creatividad claretiana debe manifestarse en la búsqueda y creación de nuevas formas de apostolado151."}, {"num": 120, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Dentro del conjunto del compromiso evangelizador de la Congregación, las misiones deben estimarse como una de nuestras obras primordiales y todos los miembros del Instituto deben estar dispuestos a ejercer este apostolado. Los que se sientan especialmente llamados a ellas, ofrézcanse a los Superiores, a imitación de nuestro Fundador152."}, {"num": 121, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Los compromisos misionales que la Congregación y algunos Organismos Mayores han tomado, han de ser considerados como propios por todos los miembros de la respectiva comunidad general o provincial. Y esto debe manifestarse, no sólo en el apoyo material y espiritual, sino en la efectiva disponibilidad de todos para cubrir generosamente la necesidad de misioneros de estas Iglesias, que deben ser objeto de nuestra preferencia153."}, {"num": 122, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Los territorios de Misiones dependientes de una Provincia pueden formar una Delegación dependiente bajo un Superior delegado al cual se le han de conferir las facultades necesarias para un eficaz gobierno de la Delegación154."}, {"num": 123, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "En la Congregación y en los Organismos Mayores estarán organizadas las respectivas Procuras de Misiones con los siguientes fines: a) Animar la conciencia misional y la disponibilidad de todos los miembros del Organismo Mayor. b) Estimular a la oración por las misiones y ofrecer una información actualizada sobre su planificación, problemática y realizaciones. c) Animar misioneramente a las comunidades cristianas e incentivar la participación en nuestro trabajo de misioneros seglares, especialmente nativos, y hacer de enlace entre las Misiones y las comunidades que preparan seglares para enviarlos a territorios misionales155. d) Promover la ayuda económica mediante la creación de fondos y la presentación de proyectos para la Congregación y otras instituciones156. e) Estar en estrecha relación y coordinación con el Secretariado de Justicia y Paz e Integridad de la Creación (JPIC)."}, {"num": 124, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Para el crecimiento de la Iglesia en las Misiones es muy valiosa la ayuda de los seglares. Estos pueden asociarse a nuestra misión, sea como voluntarios que se dedican solamente a la promoción humana según sus posibilidades, sea como evangelizadores. Es necesario que los misioneros claretianos tomemos conciencia de la importancia que tiene la acción de los seglares en la tarea pastoral y que, por lo tanto, se les ofrezcan cauces de participación y corresponsabilidad157. Antes de integrar seglares a nuestras Misiones, el Organismo Mayor que los envía debe hacer una cuidadosa selección de los candidatos y proporcionarles la preparación adecuada para asumir las responsabilidades para las que son enviados. Los seglares han de suscribir un contrato de servicio y colaboración, en el que consten las condiciones de su trabajo y las obligaciones que el Organismo Mayor asume para cubrir los gastos de desplazamiento y estancia, la seguridad social y los riesgos de enfermedad y accidentes, mientras dure su servicio."}, {"num": 125, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "El servicio misionero de la Palabra puede ejercerse en estructuras estables de pastoral ordinaria y en formas móviles en orden a potenciarla158, como son los equipos misioneros especializados159."}, {"num": 126, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Es necesario revitalizar en la Congregación el servicio itinerante de la Palabra, que ofrece en muchas partes grandes posibilidades en orden a la reevangelización del pueblo, a la revitalización de las instituciones diocesanas y parroquiales y a la promoción de agentes de evangelización entre los consagrados160. Las misiones populares, que fueron la primera expresión histórica de nuestro carisma, deben ser renovadas y adaptadas a los distintos tiempos y lugares161 o sustituidas por otras iniciativas de evangelización (talleres, cursos bíblicos, etc.). Los ejercicios espirituales y otras formas similares de servicio misionero de la Palabra continúan de lleno en la línea de nuestro carisma claretiano162."}, {"num": 127, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "La urgencia, oportunidad y eficacia apostólica de los medios de comunicación social, tan valorados por nuestro Fundador y tradicionalmente usados por el Instituto, nos obliga a utilizarlos con creatividad valiéndonos de las nuevas posibilidades que nos ofrece las nuevas tecnologías de la comunicación163, teniendo siempre en cuenta las normas del derecho universal (can 831 § 2). Internet ha de ser, para nosotros, cada vez más un instrumento habitual de evangelización164."}, {"num": 128, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Se recomienda vivamente a todos el apostolado de la palabra escrita, tanto de divulgación como de especialización. Para la publicación de sus escritos, los nuestros observarán las normas dadas por el Ordinario local (can 824 § 1). Las licencias del Instituto pueden ser concedidas por el Superior General o por el propio Superior Mayor (can 832; CC 113. 7)."}, {"num": 129, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "La educación cristiana165, que puede ofrecerse a través de estructuras diversas, es un medio muy apto para el servicio misionero de la Palabra; por lo mismo, nuestra Congregación la asume como ministerio propio. Nuestros centros de educación deben manifestar en su Ideario nuestra identidad cristiana y claretiana con referencia a las opciones evangelizadoras (n. 110-115) para lo cual contarán con un Proyecto educativo y un Proyecto pastoral que las expliciten. En todos ellos ha de estar debidamente organizado el departamento de pastoral que fomente y coordine la participación de todos en la formación cristiana y apostólica de los educadores, los alumnos y sus familiares, impulsando también ámbitos y procesos no formales de educación en la fe. Se prestará especial atención a la elección y formación de los profesores de tal manera que sean personas idóneas para asumir los rasgos del carisma claretiano y profundizar en ellos."}, {"num": 130, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Es derecho del Superior Mayor con su Consejo aprobar los centros de educación cristiana en su territorio, pero si se trata de Escuelas Superiores -y lo mismo si la fundación del colegio implica erección de una nueva comunidad- es necesaria la licencia del Superior General, a norma de nuestro derecho."}, {"num": 131, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "La actividad misionera de la educación cristiana no se realiza únicamente dentro de las estructuras de nuestros centros, sino también en centros ajenos, públicos o privados, e incluso fuera de toda estructura escolar. Es necesario impulsar una línea nueva de educación cristiana para todos aquellos jóvenes que viven al margen de los centros escolares."}, {"num": 132, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "En todas nuestras parroquias se debe impulsar la creación de comunidades cristianas que sean fermento de evangelización y hagan de la parroquia claretiana una comunidad de comunidades al servicio del anuncio del Evangelio166. Existirá un Consejo pastoral parroquial que sea expresión de la diversidad de funciones y ministerios de la parroquia, que haga visible la complementariedad, la fraternidad y la misión común."}, {"num": 133, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "Compete al Superior Mayor con su Consejo admitir parroquias, a no ser que la admisión lleve consigo la erección de una nueva comunidad, en cuyo caso corresponde al Superior General, a norma de nuestro derecho. En su aceptación se ha de dar preferencia a las de tipo estrictamente misionero, acogiendo con generosidad el encargo temporal de las mismas167."}, {"num": 134, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "2", "articulo_title": "Estructuras para la evangelización", "seccion": null, "text": "La Parroquia se confía al Instituto o al Organismo Mayor, con la condición de que un sacerdote sea el párroco (can 520) o el moderador del que habla el canon 517 § 1. La \"cura animarum\" la da el Obispo al párroco y vicario parroquial. Los dedicados al trabajo parroquial deben constituir un equipo integrado y eficiente en el que todos contribuyan a una acción pastoral actualizada168. Toda la comunidad debe sentirse responsable en esta misión que se confía a sus miembros. En el acuerdo escrito entre el Obispo diocesano y el Superior Mayor (can 520 § 2) se procurará garantizar la fidelidad a nuestro espíritu claretiano y se especificará el tiempo para el que se asume la parroquia y las condiciones en las cuales se desarrollará su servicio. En todas las parroquias existirá un proyecto parroquial que integrará las líneas fuerza, las opciones y destinatarios prioritarios del proyecto evangelizador claretiano (Dir. 110-116)."}, {"num": 135, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "3", "articulo_title": "Planificación apostólica", "seccion": null, "text": "La acción apostólica de la Congregación ha de estar planificada, programada y evaluada a todos los niveles: generalicio, de Organismos mayores, de cada una de nuestras comunidades locales y actividades. La planificación en orden a objetivos es un instrumento de gran eficacia, que hemos de utilizar siempre guiados por la Palabra de Dios y animados por el Espíritu. La programación es un medio de crecimiento de la comunidad misionera porque estimula y encauza la participación y corresponsabilidad de todos . En la planificación nos proponemos determinadas metas y establecemos los medios más aptos para alcanzarlas. Téngase también en cuenta la planificación pastoral de la Iglesia particular."}, {"num": 136, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "3", "articulo_title": "Planificación apostólica", "seccion": null, "text": "La Prefectura General de Apostolado es el órgano que anima las actividades apostólicas de la Congregación. Para ello deberá: a) conocer la realidad del apostolado congregacional, b) impulsar la comunión y la colaboración entre los organismos, c) ser vehículo de comunicación de las diversas iniciativas pastorales, d) promover y apoyar los proyectos apostólicos de los organismos, en fidelidad a las iniciativas que la Iglesia propone como exigencia de constante y renovada evangelización169. e) impulsar las opciones y proyectos congregacionales en las Conferencias y Organismos Mayores. f) promover la coordinación de los Prefectos de cada Conferencia interprovincial a partir del “Proyecto Misionero Claretiano” para esa zona."}, {"num": 137, "parte": "PARTE PRIMERA", "capitulo": "VII", "capitulo_title": "NUESTRA MISIÓN", "articulo": "3", "articulo_title": "Planificación apostólica", "seccion": null, "text": "El Prefecto Provincial de Apostolado debe ser el animador de todos los apostolados de su Organismo y, según las características del mismo, a juicio del Gobierno Provincial, organizará y moderará el correspondiente Consejo de Pastoral170."}, {"num": 138, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": null, "articulo_title": null, "seccion": null, "text": "El Señor invita a sus seguidores a ser perfectos como el Padre celestial. Esfuércense, pues, nuestros misioneros en tender a la perfección de su propia vocación. Para ello pidan humildemente la gracia, tengan una actitud de formación continua y pongan los medios prácticos para una adecuada formación permanente."}, {"num": 139, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Crecimiento espiritual", "seccion": null, "text": "La vida de comunidad ha de ser un estímulo continuo a la perfección de la caridad. Un medio de fomentar comunitariamente la vitalidad y el crecimiento espiritual y apostólico es el cuidado de los espacios y momentos que favorecen la acogida cálida, la comunicación profunda, la oración y la recreación171 como pueden ser las reuniones de comunidad y, con las debidas adaptaciones a nuestra propia índole, la revisión de vida172. Las reuniones de comunidades vecinas pueden ser también un medio de fomentar la vitalidad, el crecimiento espiritual y el apostolado."}, {"num": 140, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Crecimiento espiritual", "seccion": null, "text": "Se recomienda vivamente la dirección o acompañamiento espiritual como medio para discernir la voluntad de Dios y mantenerse fieles hasta el fin (CC 54, 73)173."}, {"num": 141, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Crecimiento espiritual", "seccion": null, "text": "El testimonio de los misioneros que se santificaron en la vida consagrada y en el ministerio apostólico debe impulsarnos eficazmente a una mayor fidelidad y entrega a nuestra vocación. Para ello, promuevan el conocimiento de sus vidas y propónganse sus ejemplos vivos, que nos apremien a una vida espiritual más intensa y a un apostolado más dinámico en la Iglesia de Dios174."}, {"num": 142, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Crecimiento espiritual", "seccion": null, "text": "Las tentaciones pueden ser una dificultad para el progreso en la santidad de vida. Para superarlas, ayúdense de los siguientes medios: manifestarlas a quien les pueda ayudar; resistirlas prontamente; examinar cuál sea la parte más débil de su alma y fortalecerla con meditaciones, súplicas y actos de las virtudes. Mientras dure la tentación, no hacer mudanza alguna en el método de vida, ni tomar ninguna resolución nueva ni formar ningún nuevo propósito; procurando, entre tanto, no omitir ni disminuir ni abreviar los ejercicios espirituales, antes bien aumentarlos o prolongarlos175."}, {"num": 143, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Crecimiento espiritual", "seccion": null, "text": "Procuren los Superiores Mayores animar eficazmente la vida espiritual de las personas y comunidades, por sí o por sus colaboradores. Para esta tarea de animación, se pueden establecer, tanto en el Gobierno General como en los gobiernos de los Organismos Mayores, prefecturas de espiritualidad, con objeto de: a) Impulsar un mayor conocimiento y asimilación de nuestras fuentes carismáticas y de la historia del Instituto. 70.3. cf El Colegial Instruido I, cap. 34; SP 13.5; EMP 21.2; PTV b) Promover el estudio de nuestra espiritualidad en diálogo con las tradiciones espirituales y culturales de los distintos pueblos en los que estamos insertos (cf. HAC 55.3). c) Organizar o coordinar experiencias de renovación espiritual y formación permanente, así como actualizar y distribuir materiales (impresos o audiovisuales) que ayuden al crecimiento en la vida misionera."}, {"num": 144, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Renovación ministerial", "seccion": null, "text": "El misionero ha de cultivar asiduamente las ciencias sagradas y profanas, esforzándose por alcanzar el grado de perfección que se pide normalmente a todo hombre culto, y por procurar estar siempre al día en el estudio de las ciencias (CC 56), ya que un saludable cultivo de la mente es poderosa ayuda para el sagrado ministerio. Siendo por vocación oyentes y servidores de la Palabra, practicaremos diariamente la lectura de la Biblia al estilo del Fundador y haremos de su estudio una de nuestras preocupaciones centrales176."}, {"num": 145, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Renovación ministerial", "seccion": null, "text": "Para que nuestros hermanos puedan perfeccionarse sin cesar en las ciencias sagradas y profanas, haya en todas las casas una biblioteca especializada en los ministerios apostólicos de la comunidad177. En la reunión plenaria de la comunidad se ha de designar un encargado, al cual, además de la conservación y enriquecimiento de la biblioteca, corresponderá especialmente tener todos los libros bien ordenados y asimismo los índices convenientes. Por regla general no se prestarán a los extraños de la comunidad libros de la biblioteca178. 146 Sólo una comunidad que acoge el don de Dios, escucha los signos de los tiempos y se deja rejuvenecer constantemente, puede realizar el anuncio del Evangelio de modo creíble y atrayente179. Por ello, es necesario que todos vivamos en un proceso continuo de renovación para responder adecuadamente a las exigencias de nuestra vocación180."}, {"num": 147, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Renovación ministerial", "seccion": null, "text": "Para llevar a cabo la formación continua es necesario distinguir dos modos de realización181: 1) Uno ordinario, mediante lecturas, conferencias, reuniones comunitarias, retiros etc. Así mismo deberemos potenciar los procesos evangelizadores como lugar privilegiado de la formación permanente182. Cada claretiano tendrá que hacer su plan personal de formación integrado en el proyecto comunitario183 . cf As.Teques nn. 89-94, Ann 56 (1983-84) 3-70; CPR 67; SP 13.3; EMP 34.3; HAC 55.1. 2) Otro extraordinario, para poner a todos los individuos de cada Organismo en una actitud general de permanente renovación184. Podría tener, entre otras, las siguientes alternativas: a) Cursos intensivos, organizados por la misma Congregación. b) Cursos organizados por otros Organismos extracongregacionales. c) Ofrecer a cada individuo, al cabo de algunos años, mediante un sistema de suplencias, la posibilidad de quedar libre de las tareas y ocupaciones comunes, para poder dedicarse a una seria renovación especializada en los centros competentes185. 148 Por tratarse de una etapa muy decisiva en la consolidación de la vocación misionera, se ha de cuidar con gran esmero la formación continua de los jóvenes claretianos durante los cinco primeros años de su ministerio, en el caso de los Diáconos y Presbíteros, y los cinco años siguientes a su profesión perpetua, en el caso de los Hermanos186."}, {"num": 149, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Renovación ministerial", "seccion": null, "text": "Como parte de su plan de acción para cada sexenio, los Organismos Mayores elaborarán su proyecto de formación continua (can 659, 661) que no ha de reducirse a la simple formación doctrinal o pastoral, sino que ha de llegar a una profunda renovación espiritual y claretiana187."}, {"num": 150, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Organización comunitaria", "seccion": null, "text": "Cada comunidad local debe hacer una planificación de su vida misionera (n. 431)188; debe, además, establecer una distribución del tiempo (CC 57), que sea fruto de un diálogo en caridad, que asegure normalmente a todos la posibilidad de asistir a los actos comunitarios de oración, comidas, recreo, permita el ejercicio del ministerio o trabajo y su correspondiente preparación y tenga en cuenta la necesidad de ofrecer a todos el conveniente tiempo de descanso, físico y psicológico, y algún momento para sí mismos. Ténganse en cuenta, a este fin, las costumbres del país y las características de cada comunidad. Según esto, los horarios y reglamentos no serán necesariamente iguales en todas las comunidades ni, en determinados casos, para todos los miembros de la misma casa189."}, {"num": 151, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Organización comunitaria", "seccion": null, "text": "El silencio tiene especial importancia en nuestra vida misionera. Ambientados en él, acogemos y meditamos la Palabra de Dios en nuestros corazones como la Santísima Virgen (Lc 2,19.51), nos preparamos para el ministerio y rehacemos nuestras fuerzas. La caridad y el respeto a los hermanos que oran, trabajan o descansan nos estimulan a cultivarlo190. Llevados de ese mismo espíritu de caridad y de respeto, se ha de procurar también acudir a las recreaciones comunes y en ellas buscar no sólo el propio esparcimiento, sino también fomentar la mutua amistad. cf XVIII CapGen, ses. 36; CC (l973) 15."}, {"num": 152, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Organización comunitaria", "seccion": null, "text": "Como signo y expresión del amor y servicio fraternos, participen todos los miembros de la comunidad en los trabajos comunes y en las tareas domésticas, como exigencias de la vida común, a fin de crear y mantener un auténtico clima de familia191. Sirvan a los hermanos como a Jesucristo, que dijo: \"Cuanto hicisteis con alguno de estos mis más pequeños hermanos, conmigo lo hicisteis\" (Mt 25, 40)."}, {"num": 153, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Organización comunitaria", "seccion": null, "text": "Al determinar las horas de descanso, téngase en cuenta la salud de los individuos, las exigencias de la vida apostólica y el espíritu de mortificación religiosa192."}, {"num": 154, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Organización comunitaria", "seccion": null, "text": "Los Superiores han de procurar que todos los miembros de la Congregación disfruten de un tiempo debido y suficiente de vacaciones193. En esta materia cada Organismo debe considerar con seriedad su situación particular y aplicar a conciencia y con exigencia evangélica los criterios que juzgue oportunos, de acuerdo con nuestra vocación claretiana194. Cada comunidad debe revisar este punto y comprometerse solidariamente a mantenerse en un estilo propio de gente que necesita vivir de su trabajo y es, además, consagrada y debe dar testimonio, también colectivo, de pobreza."}, {"num": 155, "parte": "PARTE PRIMERA", "capitulo": "VIII", "capitulo_title": "EL PROGRESO EN LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Organización comunitaria", "seccion": null, "text": "Para los misioneros que trabajan en el extranjero se autoriza que puedan regresar periódicamente a su país de origen para disfrutar allí, en conformidad con los criterios arriba indicados, de algún tiempo de descanso y renovación195. La periodicidad y duración serán determinadas por el Capítulo Provincial, o la Asamblea en las Delegaciones Independientes. cf IVR 109. cf XVIII CapGen, ses. 37. Ib. cf 1RV 112."}, {"num": 156, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "El plan de formación para los llamados a la vida misionera claretiana (can 650 § 1) está integrado por los elementos que se expresan a continuación y que han sido recogidos y desarrollados en nuestro Plan General de Formación denominado \"Formación de Misioneros\"196. Objetivo fundamental de la formación es promover el crecimiento en la unión y configuración con Cristo según el carisma claretiano de un modo responsable y creativo197. La formación no consiste solamente en el estudio de una serie de temas, sino en un proceso experiencial en el que el encuentro con Dios y la Congregación ayudan al individuo a identificar y expresar su propia identidad a partir de la llamada que ha recibido de Dios. Además del discernimiento vocacional, la formación inicial ha de ofrecer al formando los elementos necesarios para construir un fundamento sobre el que pueda mantener durante toda su vida el compromiso por un continuo crecimiento personal y espiritual."}, {"num": 157, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "La formación deberá ser: - personalizada, apelando a la conciencia y responsabilidad personales, así como a la interiorización personalizada de los valores de la comunidad claretiana y el respeto de los dones del sujeto - integradora de los diversos aspectos esenciales de la vida misionera, buscando unidad personal, evitando toda dicotomía o extremismo; - transformadora que lleve a niveles cada vez mayores de madurez humana y espiritual a medida que el formando avanza en su proceso formativo. - fuertemente sensible a las necesidades y características del hombre de hoy; - gradual y progresiva, respetando las etapas formativas, así como el ritmo y madurez de cada uno."}, {"num": 158, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Los destinatarios de la labor formativa descrita en los tres capítulos siguientes son, mientras no se diga otra cosa, los llamados a la vida misionera en la Congregación, sea en el ministerio sacerdotal o diaconal, sea en los ministerios laicales."}, {"num": 159, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "El ambiente en que nuestros candidatos han de realizar su formación en los diversos períodos de su carrera, será de manera privilegiada la comunidad formativa, que se ha de 197 Formación de Misioneros. Plan General de Formación. Madrid,1994; cf PI 66; VC 68; XXI CapGen, acta. 14, A nn 60 (1991) 253. 36 mantener en relación con el resto de la Congregación, abierta a la realidad y a la Iglesia local y, cuando se juzgue oportuno, inserta entre los pobres198."}, {"num": 160, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Todos los miembros de la Congregación en sus diferentes niveles son responsables de la importante tarea de la formación misionera tanto a través de su testimonio de vida como por su colaboración (can 652 § 4; CC 76)199."}, {"num": 161, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Aunque los agentes principales de la formación son el Espíritu Santo y el formando mismo, los formadores, que pueden ser Clérigos o Hermanos, juegan un papel importantísimo de acompañantes del proceso. Por tanto, todo formando, aunque no resida en una comunidad formativa, ha de tener su formador. Se entiende por formadores aquellos sobre quienes recae una responsabilidad inmediata sobre la formación integral de los candidatos (can 647, 650, 651). En nuestra tradición el Maestro de novicios y el Prefecto son las personas que la Congregación ofrece a cada formando para la dirección espiritual, dejando siempre al formando la libertad de elegir a otro (can 239 § 2)200."}, {"num": 162, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Para que la función formativa sea más completa, donde sea posible, habrá un equipo de formadores con capacidades complementarias. A los formadores se les debe ofrecer los medios y recursos necesarios para cualificar su trabajo, y ellos han de entregarse a él sin reservas201."}, {"num": 163, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "La función del formador o equipo de formadores será la de: - discernir con el formando la obra que Dios actúa en él y los caminos por los cuales le quiere hacer avanzar; - acompañarle en sus distintas etapas de crecimiento respetando su ritmo y ofreciéndole en cada momento el apoyo y los cuestionamientos que necesita para su desarrollo; - ofrecerle en cada etapa formativa fundamentos sólidos doctrinales y prácticos según sus necesidades personales y sus responsabilidades futuras; - verificar los resultados obtenidos y juzgar si el llamado posee las capacidades exigidas en este momento por la Iglesia y la Congregación."}, {"num": 164, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "La Comunidad Formativa es la que tiene como finalidad principal la formación. Se sentirá obligada a alcanzar los objetivos del plan de formación, a fomentar las relaciones interpersonales basadas principalmente en la fe y en la caridad, así como a cuidar que cada uno cumpla fielmente la propia responsabilidad mediante el servicio personal202."}, {"num": 165, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Es aconsejable implicar en la labor formativa a seglares de ambos sexos que, con sus conocimientos y experiencia, puedan contribuir a la formación integral de nuestros formandos203. cf OT 5; 1F 75; HAC 63.5; PGF 416; cf. Ann. 67 (2005)24 ss.; HAC 63,4."}, {"num": 166, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Se recomienda que en los Organismos Mayores haya un Consejo de Formación constituido en la forma que determine el Gobierno Provincial (n. 457 h)204. Donde exista, al Consejo de Formación le competirá también realizar una labor animadora y evaluadora de la formación en sus distintos campos205. Para asegurar una continuidad en el proceso formativo debe haber una buena comunicación entre los encargados de la distintas etapas del mismo, y ofrecer los informes actualizados sobre los candidatos a sus nuevos formadores."}, {"num": 167, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Donde este Consejo no exista, foméntense reuniones del personal dedicado a la formación y estudios. Reuniones semejantes han de ser también convocadas a nivel interprovincial y general para ocuparse del estudio, de la profundización, del intercambio de experiencias y de la planificación general206."}, {"num": 168, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Cada Organismo Mayor deberá tener un plan formativo elaborado en conformidad con el PGF y aprobado por el Superior Provincial con su Consejo (n. 457 h), que incluya la pastoral vocacional, contemple las distintas etapas formativas y la formación permanente. Cada centro aplicará el Plan Provincial de Formación a su situación y confeccionará su correspondiente planificación. Asimismo cada Organismo Mayor seleccionará, preparará y acompañará a quienes deberán asumir la tarea formativa207."}, {"num": 169, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "1", "articulo_title": "Cuestiones generales de formación", "seccion": null, "text": "Nuestros centros académicos deberán confeccionar sus propios estatutos (can 659 § 3), en los que se determinen los objetivos de los mismos, su orientación, selección y nombramiento de profesores, formación del consejo académico, participación de los alumnos, gestión económica, etc. Estos estatutos serán elaborados por los responsables del centro con la participación de la comunidad y serán aprobados por el Superior Mayor. En estos Centros, la responsabilidad del Rector o Director se circunscribe al ámbito académico. Debe, sin embargo, procurar una buena coordinación con el formador, el equipo formativo y el superior de la comunidad. Los profesores claretianos en estos centros deberán ser conscientes no sólo de su contribución a la formación académica, sino también de su incidencia en la formación integral de los formandos."}, {"num": 170, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "La Pastoral vocacional es la actividad específica por la que la comunidad se compromete a suscitar, acoger y acompañar a quienes sienten una inquietud vocacional208. Ha de ser prioritaria en cada Organismo Mayor y comunidad, y para cada claretiano (CC 58). Todo DV 49. claretiano es responsable de la Pastoral vocacional, ante todo sirviendo de modelo para cuantos puedan ser llamados por el Señor a la vida claretiana209. Cada comunidad debe ser acogedora de las vocaciones y dentro de su proyecto de vida comunitaria y planificación pastoral deberá incluirla, designando algún miembro de la comunidad que se responsabilice más directamente de dicha pastoral."}, {"num": 171, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "La finalidad de la Pastoral vocacional es que el candidato descubra su vocación en la Iglesia, y quien se sienta atraído a la Congregación haga una opción por el seguimiento de Jesús según el carisma claretiano210. Una pastoral juvenil que no llevase a los jóvenes a asumir su propia opción ante el Señor se debe considerar incompleta."}, {"num": 172, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "Para que esta opción sea viable, es necesario impulsar en la Provincia o Delegación una “cultura vocacional”211, presentar a los jóvenes las vocaciones que hay en la Iglesia, interpelarles y acompañarles en la maduración de su opción vocacional. Esto supone en quienes trabajan en pastoral juvenil capacidad de orientar al joven o adolescente en el discernimiento progresivo de la propia vocación, respeto a la voz de Dios que llama y firmeza en exigir la fidelidad debida al Señor212. Con verdadero sentido eclesial y en colaboración con la Iglesia particular, trataremos de integrar en la Pastoral vocacional a las familias, los sacerdotes, personas consagradas y educadores213."}, {"num": 173, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "En todas las Provincias y, en cuanto sea posible, en las Delegaciones Independientes habrá al menos un Claretiano, específicamente preparado y dedicado a tiempo pleno a la Pastoral vocacional. En todos los Organismos Mayores deberá constituirse el Equipo de Pastoral vocacional claretiana214 al que se procurará incorporar también algunos seglares."}, {"num": 174, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "Dicho equipo será el responsable de la animación vocacional de toda la Provincia o Delegación estimulando la participación de todos y elaborará el proyecto de Pastoral vocacional. Lo hará explicitando la triple modalidad de nuestro Instituto: sacerdotal, diaconal y laical. No debe olvidar la tarea de promover vocaciones para los diversos grupos de la Familia Claretiana215. Para poder cumplir su misión dispondrá de los recursos necesarios. El Gobierno Provincial estimulará y evaluará la labor del equipo y de las comunidades locales."}, {"num": 175, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "Dentro del Equipo de Pastoral vocacional de la Provincia o Delegación habrá quienes se encarguen del estudio serio y responsable de los candidatos según su edad y desarrollo, en orden a un discernimiento lo más acertado posible, teniendo en cuenta su sinceridad, libertad de elección, idoneidad física, psíquica, intelectual, moral, religiosa, apostólica y comunitaria y la disponibilidad universal requerida por nuestro carisma. Para este discernimiento sírvanse, si se juzga necesario, de los medios psicotécnicos y curriculum vitae, quedando a salvo el derecho a la intimidad de cada persona (can 220, 642). Tendrán en cuenta los criterios expresados en el Directorio Vocacional y las orientaciones de la Congregación216."}, {"num": 176, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "Es de desear una colaboración interprovincial entre los distintos equipos de Pastoral vocacional, en orden a un intercambio de experiencias, de clarificación de objetivos y de los mismos medios de acción de la Pastoral vocacional. Para ello se procurará tener encuentros periódicos informando ampliamente a todas nuestras comunidades de su actividad 217. Nuestra pastoral vocacional estará abierta a la colaboración con todos los grupos de la Familia Claretiana, con otros Institutos religiosos y con las Diócesis."}, {"num": 177, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "2", "articulo_title": "Pastoral vocacional", "seccion": null, "text": "En cada Organismo Mayor se determinará la ubicación de la pastoral vocacional dentro del organigrama del Organismo y su relación con las Prefecturas y Secretariados. Lo mismo se aplicará al Gobierno General. El responsable general de la pastoral vocacional procurará promover actividades vocacionales en los distintos ámbitos de la Congregación y la tendrá informada de las experiencias, los logros y las dificultades en este campo."}, {"num": 178, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "La comunidad claretiana realiza la acogida y el desarrollo inicial de las vocaciones a través de formas institucionalizadas como es el Seminario Menor y otras semejantes, y mediante cauces de acogida no institucionalizados como grupos parroquiales, juveniles, movimientos apostólicos, etc., de aquellos adolescentes y jóvenes que han manifestado deseos de ser claretianos218."}, {"num": 179, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "La admisión al Seminario Menor o al Centro de acogida vocacional corresponde al Superior Local, teniendo en cuenta el parecer del animador y del equipo provincial de pastoral vocacional; o a quien determinen los estatutos legítimamente aprobados. La dimisión corresponde siempre al Superior Local, oído los formadores o responsables219. B. Prenoviciado"}, {"num": 180, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "El prenoviciado en la Congregación es una institución educativa erigida para ayudar a los candidatos, que presentan signos o gérmenes de vocación claretiana, a discernirla y responder de ella. Acoge también a quienes han concluido la etapa del Seminario menor u otras experiencias de acogida vocacional."}, {"num": 181, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "Objetivos específicos de esta etapa serán: - procurar la formación humana integral de los candidatos, el desarrollo armónico de las condiciones físicas, intelectuales y morales correspondientes a esta edad; 217 DVC 232; “Orientaciones capitulares sobre algunos asuntos relacionados con el voto de castidad” n. 3 (11 n21o8viembre 2003). - cuidar la vivencia del don de la fe, de forma que se exprese en la oración, en la entrega personal al Padre por Cristo en el Espíritu, y en una sensibilidad ante las necesidades de los demás; - capacitar a los candidatos para que, como fruto de su vida de fe y como preparación a una posible consagración religiosa e inserción en la comunidad claretiana, orienten maduramente su afectividad y sexualidad, sepan compartir y usar con austeridad los bienes materiales y asuman la dimensión comunitaria en sus decisiones personales; - proseguir el discernimiento y cultivo vocacional. Presentar de forma clara y adecuada las características de nuestro servicio en la Iglesia, tomando como punto de referencia la figura del Fundador; - ejercitar a los candidatos en alguna actividad apostólica."}, {"num": 182, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "La formación en el prenoviciado debe realizarse dentro de una dinámica adecuada: - el prenoviciado establezca en todos los ámbitos de su actividad un estilo de vida adecuado a la edad, situación y momento educativo de los alumnos y desarróllelo según las normas de la psicología y de la pedagogía; - la formación se impartirá en un clima de amistad, de disciplina y de comunidad creyente. Hay que pedir a los alumnos sensibilidad religiosa y piedad sincera, de forma que, profesando y celebrando su fe con los compañeros, realicen la experiencia de la unión íntima con Dios y de la unidad entre los hombres, y así descubran de forma viva el misterio de Cristo y de la Iglesia; - los formadores deben potenciar el acompañamiento y la formación personalizada de los formandos, prestando especial atención a la experiencia de fe, la integración afectivo-sexual y las relaciones humanas220; - la familia debe incorporarse al proceso educativo mediante una adecuada relación de los alumnos con ella y procurando su presencia en el Seminario; - la formación estará abierta a la realidad social y eclesial y a las personas, obras y comunidades de la Congregación y a su naturaleza multicultural221; - hay que procurar una incorporación del alumno al proceso educativo. Esta incorporación ha de ser personal, progresiva, integral y objetivamente verificable."}, {"num": 183, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "Para que un candidato pueda ser admitido al prenoviciado debe: - presentar indicios o gérmenes de vocación claretiana que sean discernibles a través de sus aptitudes básicas personales, de una elemental vida de fe y sensibilidad religiosa (n. 180). - manifiestar una incipiente voluntad de seguimiento de Cristo en la Congregación, ya porque se dirige abiertamente a nuestra vida misionera, ya porque la admite como posible para él."}, {"num": 184, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "La admisión al prenoviciado y la dimisión de él corresponde al Superior Mayor, teniendo en cuenta el parecer de los formadores."}, {"num": 185, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "3", "articulo_title": "Acogida vocacional y prenoviciado", "seccion": null, "text": "Los formadores de esta etapa posean suficiente preparación pedagógica, apostólica y religiosa222 que les permita llevar a cabo su labor formativa. El equipo de formadores debe ser un verdadero modelo de identificación para los seminaristas por la autenticidad, la alegría, la fraternidad y entrega con que cumplen su misión formadora."}, {"num": 186, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "El postulantado claretiano es la etapa de formación inmediatamente preparatoria para el noviciado. Tiene como finalidad: - formar un juicio sobre la madurez, aptitud y vocación misionera del candidato; - comprobar el nivel de su instrucción religiosa y, en caso necesario, complementarla; - lograr que el candidato llegue a tener un conocimiento de la Congregación que le permita hacer una primera opción seria por ella; - introducirle en el estado de vida que va a llevar en el noviciado; - iniciarle en la adquisición de hábitos disciplinares, comunitarios y de estudio."}, {"num": 187, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "La formación impartida en esta etapa debe discurrir dentro de una dinámica peculiar más decididamente marcada por la vocación claretiana. Por tanto, deberá realizarse en un clima de apertura a la Palabra de Dios, de valoración creciente y gusto por la vida espiritual, de experiencia comunitaria, de compromiso apostólico y de apertura confiada al director espiritual. Este ambiente permitirá un juicio más exacto sobre las aptitudes, vocación, preparación, maduración humana y afectiva del candidato que dé fundadas esperanzas de que podrá asumir las obligaciones de la vocación claretiana que luego deberá esclarecerse en el noviciado."}, {"num": 188, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "Además de los requisitos necesarios para la admisión al prenoviciado (n. 183), el candidato debe tener voluntad positiva de seguir a Jesús en la Congregación."}, {"num": 189, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "Corresponde al Superior Mayor, debidamente asesorado por los responsables del prenoviciado, y teniendo presente la finalidad y objetivos del postulantado: a) determinar las condiciones que deban tener los candidatos para este período formativo; b) admitir a los candidatos al mismo y dimitirlos; c) determinar su modalidad y su duración, conforme lo que se indica en el n. 193."}, {"num": 190, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "El candidato, en el acto de admisión, presentará por escrito, firmado por él mismo y dos testigos, una declaración conformada en lo posible a las leyes del país, en la que se haga constar: a) que su ingreso en la Congregación y las tareas que en ella realizará no tienen carácter de contrato laboral y, por lo tanto, si más tarde saliera del Instituto, no podrá exigir ninguna compensación por los trabajos que haya realizado ni por los daños que haya sufrido durante su permanencia en la Congregación (CC 59); b) que conoce y acepta las normas de la Congregación en lo que se refiere a los comportamientos indebidos en materia sexual o económica, y que la Congregación no se hace responsable de las consecuencias morales y jurídicas de dichos actos; c) que no le consta tener impedimento canónico alguno para entrar en la Congregación (can. 597; 693); d) que no tiene contraídas responsabilidades por comportamientos indebidos en materia sexual o por delitos económicos."}, {"num": 191, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "Se puede hacer coincidir el postulantado con el último período del prenoviciado. Si alguno ingresara directamente al postulantado, el Gobierno del Organismo Mayor ha de prever la forma más oportuna y eficaz de realizar esta etapa, teniendo en cuenta las circunstancias del candidato, y organizando en ella una experiencia en nuestras comunidades, a ser posible en grupo."}, {"num": 192, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "Se recomienda que el tiempo de postulantado se viva fuera de la casa noviciado. Si se tuviera en el noviciado, constitúyase una sección diferente del mismo. En algunos casos, con el permiso del Superior Mayor, podría hacerse incluso fuera de nuestras casas, pero siempre bajo la guía de un religioso experto."}, {"num": 193, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "Corresponde al Superior Mayor determinar la duración del postulantado223. En cualquiera de las formas en que se realice el postulantado, la duración deberá tender a ser amplia para permitir un ritmo adecuado en la consecución de la finalidad y objetivos de este período formativo. En ningún caso debe ser menor de seis meses ni sobrepasar generalmente los dos años224."}, {"num": 194, "parte": "PARTE SEGUNDA", "capitulo": "IX", "capitulo_title": "LOS LLAMADOS A LA VIDA MISIONERA", "articulo": "4", "articulo_title": "Postulantado", "seccion": null, "text": "Los formadores de los postulantes deben tener la adecuada preparación y, para asegurar la continuidad en la formación, han de estar en contacto asiduo con el Maestro de novicios, y con los responsables de las etapas formativas previas y de la pastoral vocacional225."}, {"num": 195, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "El noviciado tiene como finalidad iniciar en la experiencia del seguimiento de Jesús, según el carisma claretiano, a fin de discernir, tanto la Congregación como los candidatos, si ellos han sido verdaderamente llamados y pueden por lo mismo realizar su incorporación a la Congregación."}, {"num": 196, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "El noviciado, como institución formativa, debe posibilitar que los novicios pongan el fundamento de: - una vida de unión con Jesucristo, el Hijo y enviado del Padre, hecho hombre de la Virgen María por obra del Espíritu Santo; - un conocimiento y una práctica de las exigencias esenciales de la vida religiosa claretiana, como seguimiento de Jesucristo pobre, virgen y obediente en el anuncio del Evangelio; - un estilo de vida comunitaria verdaderamente claretiana; cf Decr. Appl. RC 14. - un espíritu misionero y una preparación para el apostolado según el carisma de la Congregación (can 652)."}, {"num": 197, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "La consecución de estos objetivos exige: - un contexto interno y externo que posibilite la suficiente \"ruptura\" y desierto; - una escucha y acogida, en la liturgia y en el silencio de la oración, de la Palabra de Dios, que es el núcleo de nuestra espiritualidad; - una conversión creciente a las actitudes existenciales de Jesús evangelizador; - una progresiva corresponsabilidad en la programación, realización y evaluación de la vida comunitaria. - una aceptación de la guía del Maestro para iniciarse en la vida de la Congregación y responder fielmente a la propia vocación; - una dedicación al estudio de aquellas materias relacionadas con la finalidad del noviciado. Durante los doce meses canónicos los novicios no deben ocuparse en estudios o rabajos que no contribuyan directamente a la formación propia del noviciado (can 652 § 5)."}, {"num": 198, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "Para que el noviciado sea válido debe realizarse en una casa debidamente destinada a esta finalidad (can. 647 § 2). La erección, traslado o supresión del noviciado se harán mediante decreto escrito del Superior General con el consentimiento de su Consejo (can 647 § 1; Dir 496 f). Lo solicita el Superior Mayor con el consentimiento de su Consejo (n. 457 m)."}, {"num": 199, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "Admítase al noviciado solamente a aquellos candidatos que, no teniendo impedimento canónico (can 643), quieren ser misioneros claretianos y poseen las necesarias dotes de edad, salud física y psíquica, aptitud y madurez humana, espiritual y vocacional (can 642). Se tendrá por idóneos a quienes vayan progresando en el cumplimiento de los compromisos de la vida religiosa y de las actividades del Instituto."}, {"num": 200, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "Todos los candidatos, antes de ser admitidos al noviciado, deben presentar el certificado de bautismo y confirmación y el de estado libre (can 645 § 1). Los candidatos clérigos y los que provienen de otros seminarios o Institutos religiosos deben presentar un informe escrito del respectivo superior (cf. can. 645 & 2 & 3)."}, {"num": 201, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "El postulante presentará por escrito la solicitud de admisión al noviciado al Superior Mayor al menos con un mes de antelación."}, {"num": 202, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "La admisión al noviciado corresponde al Superior Mayor con el voto consultivo de su Consejo (can 641; CC 69; Dir 458 e). Pero tratándose de un clérigo, seminarista o ex religioso, cuyos informes presenten alguna duda, el Superior Mayor debe contar con el voto deliberativo de su Consejo. Por cualquier causa justa, el novicio puede ser despedido por el Superior Mayor (can 653;"}, {"num": 203, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "El inicio del noviciado irá precedido de no menos de cinco días íntegros de ejercicios espirituales."}, {"num": 204, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "El noviciado canónico comienza cuando el Superior Mayor, o aquel en quien él delegue, lo declare iniciado (CC 69). Para este acto es conveniente celebrar el rito de iniciación en la vida religiosa propio de la Congregación."}, {"num": 205, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "Pueden promoverse, bajo la dirección del Gobierno del Organismo Mayor, diversos modos y formas de organización del noviciado, atendiendo a las necesidades y conveniencias de cada territorio, pero respetando las características fundamentales de nuestro Instituto y observando las normas del derecho universal. Sólo a modo de excepción y en casos particulares, por concesión del Superior General con el consentimiento de su Consejo, se puede conceder a un candidato que haga el noviciado en una casa del Instituto distinta de la del noviciado y siempre bajo la dirección de un religioso que haga las veces de Maestro (can 647 § 2; Dir 496 m)."}, {"num": 206, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "El noviciado es único e igualmente válido para todos, independientemente de su vocación clerical o laical. Sin embargo, antes de la primera profesión en la Congregación, cada uno manifestará por escrito al Superior Mayor su conciencia actual de misionero claretiano según la vocación laical, diaconal o presbiteral."}, {"num": 207, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "La índole peculiar y el fin del noviciado pide conjugar, en las relaciones de los novicios con los miembros profesos, la necesaria cercanía que lleve al conocimiento y amor a la Congregación con la oportuna separación que salvaguarde su condición de novicios. El Gobierno del Organismo Mayor determinará las líneas generales de estas relaciones."}, {"num": 208, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "El noviciado termina con la primera profesión. Pero si, completado el tiempo ordinario, queda todavía alguna duda sobre la idoneidad del candidato, el Superior Mayor, oído su Consejo, se lo puede prolongar por otros seis meses (can 653 § 2)."}, {"num": 209, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "1", "articulo_title": "Los novicios", "seccion": null, "text": "Si algún novicio enferma gravemente con peligro de muerte, puede ser admitido por el Superior Mayor o también por el Superior de la casa a emitir la profesión \"in articulo mortis\" según la norma y los efectos determinados por la Sede Apostólica."}, {"num": 210, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "2", "articulo_title": "El Maestro de novicios", "seccion": null, "text": "El Maestro es designado por el Superior Mayor con el consentimiento de su Consejo (CC 68; Dir 457 a). Ha de ser profeso de votos perpetuos, dotado de cualidades humanas, religiosas y apostólicas que le permitan cumplir plenamente su misión."}, {"num": 211, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "2", "articulo_title": "El Maestro de novicios", "seccion": null, "text": "El Maestro desempeña la función de ayudar a los novicios, con su palabra y obra, a formarse y fundamentarse en la vida misionera de la Congregación. Para ello conozca y acompañe el proceso personal de cada novicio. Inícielos con paciencia y constancia en los caminos del Espíritu de Cristo. Cree y anime una verdadera comunidad de fe y amor entre los novicios. Explique la doctrina de nuestra vida misionera según la enseñanza de la Iglesia y de la Congregación (can 650-651)."}, {"num": 212, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "2", "articulo_title": "El Maestro de novicios", "seccion": null, "text": "La dirección de los novicios queda reservada sólo al Maestro, bajo la autoridad de los Superiores Mayores. A fin de que pueda dedicarse enteramente a un oficio de tanta importancia debe estar libre de todas las obligaciones y cargos que le impidan el cuidado de los novicios. El Maestro puede contar con colaboradores que trabajen en equipo y compartan responsabilidades y funciones. Estos dependen de él en lo que se refiere a la dirección del noviciado y a la aplicación del plan de formación (can 650, 651 § 2)."}, {"num": 213, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "2", "articulo_title": "El Maestro de novicios", "seccion": null, "text": "Tendrá informado periódicamente al Superior Mayor de la marcha del noviciado y de cada uno de los novicios."}, {"num": 214, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": "Naturaleza", "text": "La incorporación a la Congregación se efectúa por la profesión religiosa (can 654; CC 70)."}, {"num": 215, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "La profesión religiosa se realiza en la Congregación por la consagración a Dios, mediante la emisión de los votos de pobreza, castidad y obediencia y por un acto público de entrega al Corazón de María en orden a realizar el fin de la Congregación según las Constituciones (CC 159). La primera profesión y las profesiones temporales incluyen la voluntad de emitir la profesión perpetua y preparan a la misma."}, {"num": 216, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Los que, una vez cumplido el noviciado y no hayan emitido la profesión, han dejado legítimamente la Congregación, pueden ser admitidos de nuevo por el Superior General con el consentimiento de su Consejo, sin obligación de repetir el noviciado (can 690 § 1; Dir. 496 h). El mismo Superior General debe señalar en estos casos un tiempo de prueba, transcurrido el cual, podrán ser admitidos a la primera profesión por el Superior Mayor con su Consejo (can 690 § 1; Dir. 457 f)."}, {"num": 217, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": "Proceso de incorporación", "text": "El novicio, tres meses antes de la fecha prevista para terminar el noviciado, pedirá al Superior Mayor, por escrito, la admisión a la profesión religiosa en la Congregación, expresando al mismo tiempo claramente su voluntad de perseverancia y disponibilidad para el cumplimiento de las Constituciones y demás normas de nuestra Congregación."}, {"num": 218, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Antes de la incorporación a la Congregación se ha de advertir a los novicios de manera explícita que los superiores no tienen voluntad de admitir a ella a quienes hubieren callado alguno de los impedimentos excluyentes u ocultado algún defecto notable o no tuvieran voluntad de permanecer en la Congregación, de suerte que en tales casos sería inválida la profesión (can 643). Asimismo se les debe informar sobre los cauces y criterios de la separación, como se explica en los nn. 271-282."}, {"num": 219, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "En el noviciado se hará saber a los novicios que la Congregación no se hace responsable de las consecuencias morales y jurídicas de los actos contra la castidad consagrada. Antes de la primera profesión, los novicios declararán por escrito que conocen y aceptan la voluntad de la Congregación, según lo indicado en el n. 190."}, {"num": 220, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Antes de la primera profesión, cuando están aprobados para la misma, los novicios deben ceder libremente la administración de sus bienes y disponer, también libremente, del uso y usufructo de los mismos (CC 27), observando si es posible las formalidades civiles que regulan estos actos. Si alguno, por una causa legítima, no hizo tal cesión y disposición, hágalas cuando dicha causa haya desaparecido. El testamento civil ha de hacerse necesariamente antes de la profesión perpetua (CC 27), pero puede hacerse en todo el tiempo anterior a dicha profesión. Si alguien, antes de la primera profesión tuviese ya hecho el testamento civil, no está obligado a hacerlo de nuevo (can 668 § 1). Para modificar por causa justa cualquiera de las disposiciones ya hechas en materia de bienes patrimoniales, se necesita licencia del Superior Mayor."}, {"num": 221, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "La profesión temporal se hará durante el primer trienio, por períodos anuales; posteriormente, si fuera necesario, podrá hacerse por un tiempo más largo, que determinará el Superior Mayor después de haber oído al interesado y al responsable de la formación (can 657 § 2; CC 70)."}, {"num": 222, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Para determinar la antigüedad, y la precedencia se contará a partir de la primera profesión religiosa, si no se dice expresamente lo contrario (n. 370 c)."}, {"num": 223, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Tres meses antes de expirar el plazo para el que se hizo la profesión temporal, los candidatos han de solicitar por escrito al Superior Mayor su renovación."}, {"num": 224, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Seis meses antes de la profesión perpetua, los candidatos la solicitarán libremente y por escrito, al Superior Mayor. El Superior Mayor estimará si ha llegado el momento de comenzar el período de preparación inmediata a la profesión perpetua y determinará el lugar y el modo de realizarlo (n. 241)."}, {"num": 225, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Quienes soliciten la profesión perpetua, en el mes que precede a la misma, deben escribir al Superior General para manifestarle sus disposiciones y aspiraciones de cara al servicio misionero de la Congregación. El Superior Mayor de los candidatos, a su vez, enviará al Superior General una ficha completa de cada uno de éstos226."}, {"num": 226, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "La profesión perpetua no puede hacerse antes de haber cumplido los 21 años de edad (can 658)."}, {"num": 227, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Todos los miembros de la comunidad, especialmente el superior, formadores y compañeros, están obligados a informar acerca de los candidatos a la profesión, particularmente a la primera y a la perpetua. En todos estos casos y también cuando se trate de abandonar la Congregación, no se podrá pedir informes al director espiritual y a los confesores (can 240 § 2)."}, {"num": 228, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": "Admisión", "text": "La admisión a la primera profesión, así como a la profesión perpetua, corresponde al Superior Mayor con el consentimiento de su Consejo (CC 70-71). La admisión a la renovación corresponde al Superior Mayor, oídos sus Consultores (n. 458 e). Por Superior Mayor se entiende el Superior del Organismo Mayor al que se adscribe el candidato, aun cuando estuviere haciendo el noviciado en alguna casa de otro Organismo Mayor."}, {"num": 229, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "El Superior Mayor propio y sus Consultores pueden delegar su derecho de admitir al Superior y a los Consultores del Organismo Mayor donde vive el que pide la profesión; en este caso todos y cada uno de los miembros del Consejo deben delegar su derecho de admitir. Queda salvo el derecho del candidato a que su petición sea tratada por su propio Superior Mayor."}, {"num": 230, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Es derecho también del Superior Mayor propio recibir las profesiones. Pero por delegación habitual, los Superiores de las casas donde se realizan las profesiones, pueden recibirlas y subdelegar para ello a otros miembros de la Congregación y aun a extraños a la misma. De la misma facultad goza el Superior Mayor en su demarcación respecto a los formandos de otros Organismos que en ella hagan la profesión."}, {"num": 231, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Las profesiones háganse en días señalados y con el rito propio."}, {"num": 232, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "Levántese acta de la profesión, firmada por el propio religioso, el Superior que recibió la profesión, el Secretario de la comunidad y dos testigos. En las casas donde se hagan habitualmente las profesiones, debe haber un libro especial para su registro."}, {"num": 233, "parte": "PARTE SEGUNDA", "capitulo": "X", "capitulo_title": "LOS NOVICIOS Y SU MAESTRO", "articulo": "3", "articulo_title": "Incorporación y profesión", "seccion": null, "text": "El Superior Local de la casa donde se realice la profesión comunicará al Secretario Provincial del profeso todas las profesiones. El Secretario Provincial debe comunicar al Secretario General las profesiones primeras y perpetuas, y al párroco donde fue bautizado el profeso las profesiones perpetuas (can 535 § 2)."}, {"num": 234, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "En el período de postnoviciado debe proseguirse la labor iniciada en el noviciado y profundizar de manera integral en todos los aspectos de la vida misionera claretiana en orden a la incorporación definitiva a la Congregación y a un servicio misionero en la Iglesia227."}, {"num": 235, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Los objetivos de la formación en esta etapa han de ser: - lograr una madurez humana integral, adecuada al proceso formativo de cada uno en orden a una opción definitiva; - identificarse plenamente con la propia vocación claretiana, con la Congregación y sus opciones; - poseer una intensa vida espiritual que, especialmente a través de la oración, les lleve a una plena comunión con Cristo, enviado por el Padre para la salvación de los hombres; - capacitarse mediante una sólida preparación intelectual para cumplir su misión evangelizadora en el mundo; - ejercitar la actividad apostólica con responsabilidad, creatividad y con sentido de equipo; - atender, junto a los elementos comunes, los aspectos peculiares de la formación específica para el ministerio presbiteral o diaconal o para la vida religiosa laical."}, {"num": 236, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Para alcanzar estos objetivos ténganse en cuenta las pautas siguientes: - La Palabra de Dios será uno de los ejes de todo el proceso formativo228. - Los formandos, a ejemplo de María, deben integrar la escucha y contemplación de la Palabra de Dios con la atención a la realidad histórica y con la sensibilidad hacia los problemas del hombre de hoy. - El estudio exigente de las ciencias humanas, teológicas y pastorales ha de proporcionar una comprensión viva del misterio de Cristo y de la Iglesia y suscitar una disponibilidad personal para desempeñar su misión evangelizadora. Este estudio de las ciencias eclesiásticas no puede simultanearse con otras carreras. - El trabajo y la experiencia apostólica, tanto a lo largo del curso como en vacaciones, debe ayudarles a conectar con el mundo e irles capacitando como servidores de la Palabra. Por eso las actividades deben ser verdaderamente apostólicas, en línea con la misión y opción de la Congregación, planeadas, realizadas y evaluadas en equipo y acompañadas por un asesor. Para ello se dispondrá de un programa sistemático de iniciación apostólica229. - Dado el carácter universal de la Congregación se debe impulsar decididamente el aprendizaje de lenguas en los centros formativos230. - Los jóvenes claretianos han de formarse para la evangelización en comunidad misionera, asumiendo desde el principio un estilo de vida comunitario pobre e inculturado231. Progresivamente deben irse integrando en la comunidad provincial. - Procuren los Superiores que en los centros de formación haya sacerdotes idóneos a quienes puedan acudir los formandos para el sacramento de la reconciliación. - Para que la formación sea eficaz, además de la dirección espiritual (CC 73), se hace imprescindible un diálogo personal y frecuente con el formador y la elaboración del plan personal de formación232."}, {"num": 237, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "La formación académica puede hacerse en centros propios de la Congregación o en Seminarios o Universidades. En todo caso debe cuidarse la formación claretiana y, además, para los aspirantes a las Órdenes, la adecuada preparación a los sagrados ministerios."}, {"num": 238, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Para la formación de los Misioneros Hermanos se confeccionará previamente un plan formativo en el marco del Plan Provincial de Formación; a través de él se garantizará la formación tanto teológica y pastoral como profesional. El período formativo en sentido estricto durará hasta la profesión perpetua. Antes de la misma, se orientará al formando hacia una determinada área apostólica."}, {"num": 239, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Razones formativas o de otro orden pueden aconsejar la fórmula de centros de formación interprovinciales. Conviene que estos tengan un acompañamiento cercano del Gobierno Provincial en cuyo territorio esté ubicado el Centro y que se cuide convenientemente la relación entre los formandos y sus propios Organismos. Por el carácter universal y multicultural de la Congregación se seguirán creando y consolidando centros formativos interculturales en todos los continentes, con criterios claros de funcionamiento y con equipos formativos adecuados233."}, {"num": 240, "parte": "PARTE SEGUNDA", "capitulo": "XI", "capitulo_title": "LOS MISIONEROS EN FORMACIÓN Y SU PREFECTO", "articulo": "1", "articulo_title": "Los misioneros en formación", "seccion": null, "text": "Los Superiores Mayores determinarán en cada caso el tiempo y modo de llevar a cabo una eventual interrupción de los estudios eclesiásticos, pero observando siempre las normas de la Sede Apostólica, las indicaciones de la Congregación234, y la
