<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constituciones CMF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --garnet: #7B1A1A;
  --garnet-light: #9B2A2A;
  --garnet-deep: #5a1212;
  --gold: #C4922A;
  --gold-pale: #e8c97a;
  --bg: #f5f0e8;
  --bg2: #ede6d6;
  --bg3: #e2d8c4;
  --text: #2a1f1a;
  --text2: #5a4a3a;
  --text3: #8a7a6a;
  --sidebar-bg: #f0e8d8;
  --border: #d4c4a4;
  --fn-bg: #f9f5ec;
  --link: #7B1A1A;
  --shadow: rgba(42,31,26,0.15);
  --font-body: 'EB Garamond', Georgia, serif;
  --font-title: 'Cormorant Garamond', Georgia, serif;
  --base-size: 17px;
  --sidebar-w: 280px;
}
[data-dark="1"] {
  --bg: #1a1614; --bg2: #231e1b; --bg3: #2c2622;
  --text: #e8dcc8; --text2: #b8a88a; --text3: #7a6a58;
  --sidebar-bg: #1e1a17; --border: #3a3028;
  --fn-bg: #241f1c; --link: #e8c97a; --shadow: rgba(0,0,0,0.4);
  --gold-pale: #c4922a; --garnet: #c44a4a; --garnet-light: #e05555;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: var(--base-size); scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body);
       min-height: 100vh; display: flex; flex-direction: column; }

/* ── Top bar ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  background: var(--garnet); color: #fff;
  display: flex; align-items: center; gap: 0; height: 52px;
  box-shadow: 0 2px 8px var(--shadow);
}
#topbar-toggle {
  width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.4rem; flex-shrink: 0; border: none;
  background: transparent; color: #fff; transition: background .2s;
}
#topbar-toggle:hover { background: var(--garnet-deep); }
#topbar-title {
  flex: 1; font-family: var(--font-title); font-size: 1.25rem;
  font-weight: 600; letter-spacing: .04em; padding: 0 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#lang-toggle {
  margin: 0 4px; border: 1.5px solid rgba(255,255,255,.5); border-radius: 4px;
  background: transparent; color: #fff; font-family: var(--font-body);
  font-size: .85rem; padding: 4px 10px; cursor: pointer; letter-spacing: .06em;
  transition: background .2s;
}
#lang-toggle:hover { background: rgba(255,255,255,.15); }
#btn-search, #btn-index, #btn-dark, #btn-font-down, #btn-font-up {
  width: 40px; height: 52px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.05rem; border: none; background: transparent;
  color: #fff; transition: background .2s; flex-shrink: 0;
}
#btn-search:hover, #btn-index:hover, #btn-dark:hover,
#btn-font-down:hover, #btn-font-up:hover { background: var(--garnet-deep); }
#font-controls { display: flex; align-items: center; }

/* ── Sidebar ── */
#sidebar {
  position: fixed; top: 52px; left: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--sidebar-bg); border-right: 1px solid var(--border);
  overflow-y: auto; z-index: 100; transition: transform .3s ease;
  padding-bottom: 40px;
}
#sidebar.closed { transform: translateX(calc(-1 * var(--sidebar-w))); }
#sidebar-inner { padding: 16px 0; }

.nav-section { margin-bottom: 2px; }
.nav-part-header {
  padding: 8px 18px 6px; font-family: var(--font-title); font-size: .78rem;
  font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text3); cursor: pointer; display: flex; align-items: center;
  gap: 6px; user-select: none; transition: color .2s;
}
.nav-part-header:hover { color: var(--gold); }
.nav-part-header .chevron { font-size: .7rem; transition: transform .2s; margin-left: auto; }
.nav-part-header.open .chevron { transform: rotate(90deg); }

.nav-chapters { display: none; }
.nav-chapters.open { display: block; }

.nav-link {
  display: block; padding: 7px 18px 7px 28px; font-size: .87rem;
  color: var(--text2); cursor: pointer; text-decoration: none;
  transition: background .15s, color .15s; border-left: 3px solid transparent;
  line-height: 1.3;
}
.nav-link:hover { background: var(--bg3); color: var(--text); }
.nav-link.active { border-left-color: var(--garnet); background: var(--bg3);
                    color: var(--garnet); font-weight: 500; }
.nav-link .art-range { font-size: .75rem; color: var(--text3); display: block; }

.nav-cf-link {
  display: block; padding: 10px 18px; font-family: var(--font-title);
  font-size: .95rem; font-weight: 600; color: var(--garnet);
  cursor: pointer; border-left: 3px solid transparent;
  transition: background .15s; letter-spacing: .02em;
}
.nav-cf-link:hover, .nav-cf-link.active {
  background: var(--bg3); border-left-color: var(--garnet);
}

.nav-annex-link {
  display: block; padding: 7px 18px 7px 22px; font-size: .87rem;
  color: var(--text3); cursor: pointer; font-style: italic;
  transition: color .15s; border-left: 3px solid transparent;
}
.nav-annex-link:hover, .nav-annex-link.active {
  color: var(--text); background: var(--bg3); border-left-color: var(--gold);
}

/* ── Main content ── */
#main {
  margin-left: var(--sidebar-w); margin-top: 52px;
  transition: margin-left .3s ease;
  padding: 40px 48px 80px;
  max-width: 760px;
}
#main.sidebar-closed { margin-left: 0; }

/* ── Section / article rendering ── */
.section-block { margin-bottom: 48px; }
.part-heading {
  font-family: var(--font-title); font-size: .78rem; font-weight: 400;
  letter-spacing: .2em; text-transform: uppercase; color: var(--text3);
  margin-bottom: 4px; margin-top: 48px;
}
.chapter-heading {
  font-family: var(--font-title); font-size: 1.5rem; font-weight: 600;
  color: var(--garnet); margin-bottom: 28px; line-height: 1.25;
  border-bottom: 1px solid var(--border); padding-bottom: 12px;
}
.chapter-heading.cf { font-size: 1.6rem; letter-spacing: .04em; }

.article {
  margin-bottom: 24px; padding: 18px 24px;
  border-radius: 4px; transition: background .2s;
  border-left: 2px solid transparent;
}
.article:target, .article.highlight {
  background: var(--fn-bg); border-left-color: var(--gold);
}
.article-num {
  font-family: var(--font-title); font-size: .78rem; font-weight: 600;
  letter-spacing: .1em; color: var(--gold); margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.article-num .num-badge {
  display: inline-block; background: var(--garnet); color: #fff;
  font-family: var(--font-title); font-size: .75rem; font-weight: 600;
  padding: 1px 7px; border-radius: 2px; letter-spacing: .05em;
}
.article-text { line-height: 1.75; font-size: 1rem; }
.article-text p { margin-bottom: .75em; }
.article-text p:last-child { margin-bottom: 0; }
.article-subs { margin-top: 10px; padding-left: 20px; }
.article-subs li { margin-bottom: 8px; line-height: 1.7; font-size: .97rem; }

sup.fn-ref {
  font-family: var(--font-body); font-size: .65rem; color: var(--garnet);
  cursor: pointer; font-weight: 600; vertical-align: super;
  text-decoration: underline dotted; text-underline-offset: 1px;
  transition: color .15s;
}
sup.fn-ref:hover { color: var(--gold); }

/* ── Footnote panel ── */
#fn-panel {
  position: fixed; bottom: 0; left: var(--sidebar-w); right: 0;
  background: var(--fn-bg); border-top: 2px solid var(--gold);
  padding: 14px 24px 16px; z-index: 150; display: none;
  box-shadow: 0 -4px 16px var(--shadow);
  max-height: 200px; overflow-y: auto;
  transition: left .3s;
}
#fn-panel.sidebar-closed { left: 0; }
#fn-panel.visible { display: block; }
#fn-panel-close {
  position: absolute; top: 10px; right: 16px; background: none;
  border: none; cursor: pointer; font-size: 1.1rem; color: var(--text3);
}
#fn-panel-close:hover { color: var(--text); }
#fn-panel-label {
  font-family: var(--font-title); font-size: .75rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 6px;
}
#fn-panel-text { font-size: .92rem; line-height: 1.6; color: var(--text2); }

/* ── Search overlay ── */
#search-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 300; align-items: flex-start; justify-content: center; padding-top: 80px;
}
#search-overlay.open { display: flex; }
#search-box {
  background: var(--bg); border-radius: 8px; width: 100%; max-width: 600px;
  box-shadow: 0 8px 40px rgba(0,0,0,.4); overflow: hidden;
}
#search-input {
  width: 100%; padding: 18px 20px; font-family: var(--font-body);
  font-size: 1.05rem; border: none; background: transparent; color: var(--text);
  outline: none; border-bottom: 1px solid var(--border);
}
#search-results { max-height: 400px; overflow-y: auto; padding: 8px 0; }
.search-result {
  padding: 10px 20px; cursor: pointer; border-bottom: 1px solid var(--border);
  transition: background .15s;
}
.search-result:hover { background: var(--bg2); }
.search-result-num {
  font-family: var(--font-title); font-size: .78rem; color: var(--garnet);
  font-weight: 600; margin-bottom: 3px;
}
.search-result-text { font-size: .88rem; color: var(--text2); line-height: 1.4; }
.search-result-text mark { background: #ffeb9e; color: #2a1f1a; border-radius: 2px; }
#search-empty { padding: 24px; text-align: center; color: var(--text3); font-style: italic; }

/* ── Index panel ── */
#index-panel {
  display: none; position: fixed; top: 52px; right: 0; bottom: 0;
  width: 360px; background: var(--sidebar-bg); border-left: 1px solid var(--border);
  z-index: 150; overflow-y: auto; padding: 0;
  box-shadow: -4px 0 16px var(--shadow);
}
#index-panel.open { display: block; }
#index-panel-header {
  position: sticky; top: 0; background: var(--garnet); color: #fff;
  padding: 14px 18px; display: flex; align-items: center; gap: 10px;
}
#index-panel-header h2 {
  font-family: var(--font-title); font-size: 1.05rem; font-weight: 600;
  flex: 1; letter-spacing: .04em;
}
#btn-index-close {
  background: none; border: none; color: #fff; cursor: pointer;
  font-size: 1.1rem; padding: 0;
}
#index-search-wrap { padding: 12px 16px; border-bottom: 1px solid var(--border); }
#index-search {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border);
  border-radius: 4px; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: .9rem; outline: none;
}
#index-search:focus { border-color: var(--garnet); }
#index-list { padding: 8px 0; }
.idx-entry {
  padding: 8px 16px 8px 18px; border-bottom: 1px solid var(--border);
  font-size: .85rem; line-height: 1.55;
}
.idx-entry:last-child { border-bottom: none; }
.idx-term {
  font-family: var(--font-title); font-weight: 600; color: var(--text);
  font-size: .92rem; margin-bottom: 2px;
}
.idx-desc { color: var(--text2); }
.idx-desc a, .idx-link {
  color: var(--link); text-decoration: underline dotted; cursor: pointer;
  text-underline-offset: 2px;
}
.idx-desc a:hover, .idx-link:hover { color: var(--gold); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Responsive ── */
@media (max-width: 900px) {
  :root { --sidebar-w: 260px; }
  #main { padding: 28px 24px 60px; }
}
@media (max-width: 640px) {
  #sidebar { transform: translateX(calc(-1 * var(--sidebar-w))); }
  #sidebar.open { transform: none; }
  #main { margin-left: 0 !important; padding: 20px 16px 60px; }
  #fn-panel { left: 0 !important; }
  #index-panel { width: 100%; }
  #topbar-title { font-size: 1.05rem; }
}

/* progress bar */
#progress-bar {
  position: fixed; top: 52px; left: 0; height: 2px;
  background: var(--gold); z-index: 199; width: 0; transition: width .1s;
}
</style>
</head>
<body>

<!-- Top Bar -->
<header id="topbar">
  <button id="topbar-toggle" title="Menú">☰</button>
  <div id="topbar-title">Constituciones CMF</div>
  <button id="lang-toggle" title="Cambiar idioma">CA</button>
  <button id="btn-search" title="Buscar">🔍</button>
  <button id="btn-index" title="Índice analítico">☰≡</button>
  <div id="font-controls">
    <button id="btn-font-down" title="Texto más pequeño">A−</button>
    <button id="btn-font-up" title="Texto más grande">A+</button>
  </div>
  <button id="btn-dark" title="Modo oscuro">◑</button>
</header>

<div id="progress-bar"></div>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-inner"></div>
</nav>

<!-- Main content -->
<main id="main">
  <div id="content"></div>
</main>

<!-- Footnote panel -->
<div id="fn-panel">
  <button id="fn-panel-close" title="Cerrar">✕</button>
  <div id="fn-panel-label">Nota</div>
  <div id="fn-panel-text"></div>
</div>

<!-- Search overlay -->
<div id="search-overlay">
  <div id="search-box">
    <input id="search-input" type="text" placeholder="Buscar en las Constituciones…" autocomplete="off">
    <div id="search-results"></div>
  </div>
</div>

<!-- Index panel -->
<div id="index-panel">
  <div id="index-panel-header">
    <h2 id="index-panel-title">Índice Analítico</h2>
    <button id="btn-index-close">✕</button>
  </div>
  <div id="index-search-wrap">
    <input id="index-search" type="text" placeholder="Filtrar términos…">
  </div>
  <div id="index-list"></div>
</div>

<script>
const CMF_DATA = {"es": {"articles": [{"n": 1, "text": "Nuestra Congregación de Misioneros fue fundada por el Arzobispo San Antonio María Claret en Vic (España) el 16 de julio de 1849 y fue aprobada por Pío IX el 22 de diciembre de 1865. Nos llamamos Hijos de Inmaculado Corazón de María o Misioneros Claretianos.", "paras": [], "subs": []}, {"n": 2, "text": "El objeto de nuestra Congregación es buscar en todo la gloria de Dios la santificación de sus miembros y la salvación de los hombres de todo el mundo según nuestro carisma misionero en la Iglesia.", "paras": [], "subs": []}, {"n": 3, "text": "Jesucristo nuestro Señor enviado por el Padre <sup class=\"fn-ref\" data-fn=\"1\">[1]</sup> y hecho hombre de la Virgen María <sup class=\"fn-ref\" data-fn=\"2\">[2]</sup> por obra del Espíritu Santo fue ungido por el mismo Espíritu para evangelizar a los pobres <sup class=\"fn-ref\" data-fn=\"3\">[3]</sup>. Entregado por entero a las cosas del Padre <sup class=\"fn-ref\" data-fn=\"4\">[4]</sup> predicó la Buena Nueva del Reino <sup class=\"fn-ref\" data-fn=\"5\">[5]</sup>.", "paras": ["Queriendo asociar consigo a los hombres para realizar esta obra de salvación, llamó a Sí a los que El quiso e instituyó a Doce para que convivieran con El y los envió a predicar <sup class=\"fn-ref\" data-fn=\"6\">[6]</sup>. Al completar en sí mismo la obra de nuestra redención fundó la Iglesia como sacramento universal de salvación y envió a los Apóstoles y a otros para que dieran testimonio de la resurrección <sup class=\"fn-ref\" data-fn=\"7\">[7]</sup>.", "Algunos de éstos, guiados por el Espíritu Santo, comenzaron a representar en la Iglesia el mismo género de vida que Jesús había elegido para Sí, dando testimonio evangélico."], "subs": []}, {"n": 4, "text": "A nosotros, Hijos del Inmaculado Corazón de María, llamados a semejanza de los Apóstoles, se nos ha concedido también el don de seguir a Cristo en comunión de vida y de proclamar el Evangelio a toda creatura, yendo por el mundo entero <sup class=\"fn-ref\" data-fn=\"8\">[8]</sup>.", "paras": ["El seguimiento de Cristo, tal como se propone en el Evangelio, es, pues, para nosotros la regla suprema. Por eso, escuchamos con toda docilidad la palabra con que el Señor llama a los discípulos a la perfección del Padre <sup class=\"fn-ref\" data-fn=\"9\">[9]</sup>, promulga el mandamiento del amor fraterno <sup class=\"fn-ref\" data-fn=\"10\">[10]</sup>, recomienda la oración, propone las reglas de la vida apostólica y proclama partícipes de su propia bienaventuranza a los pobres de espíritu, a los que lloran, a los mansos, a los que tienen hambre y sed de justicia, a los misericordiosos, a los limpios de corazón, a los que trabajan por la paz y a los que sufren persecución por la justicia y por su causa son injuriados <sup class=\"fn-ref\" data-fn=\"11\">[11]</sup>."], "subs": []}, {"n": 5, "text": "Nosotros, respondiendo a esta divina vocación, hacemos nuestro el modo de vida de Jesús, que abrazó también en fe la Virgen María. De esta manera, nos proponemos representar en la Iglesia la virginidad, la pobreza y la obediencia de Cristo, dedicados a la predicación del Evangelio. Por la profesión de los consejos evangélicos, mediante votos públicos, nos entregamos a Dios y somos consagrados por El, formando en la Iglesia un Instituto verdadera y plenamente apostólico.", "paras": [], "subs": []}, {"n": 6, "text": "Hemos de ser en la Iglesia esforzados auxiliares de los Pastores en el ministerio de la palabra, empleando todos los medios que nos sean posibles para extender por el mundo entero la Buena Nueva del Reino. Profesamos amor y obediencia, incluso en virtud del voto, al Supremo Pastor para bien de todo el Cuerpo de Cristo. En comunión con los Obispos y bajo su dirección pretendemos servir a la edificación e incremento de la Iglesia.", "paras": [], "subs": []}, {"n": 7, "text": "Formamos la Congregación presbíteros, diáconos, hermanos y estudiantes, compartiendo todos la misma vocación. Y todos nos congregamos en la misma comunidad, realizamos la misma misión y según el don del propio orden y la función de cada uno en la Congregación, participamos de los mismos derechos y obligaciones que dimanan de la profesión religiosa.", "paras": ["Han recibido también un don apostólico otros que de modos diversos están en comunión con nuestra Congregación."], "subs": []}, {"n": 8, "text": "La fundación de la Congregación se atribuye a la intervención de la Santísima Virgen, a quien tenemos como Patrona bajo el título de su Inmaculado Corazón. Siendo y llamándonos Hijos de su Corazón, la veneramos con amor y confianza. Y nos entregamos a Ella para ser configurados con el misterio de Cristo y para cooperar con su oficio maternal en la misión apostólica.", "paras": [], "subs": []}, {"n": 9, "text": "Hemos de tener siempre ante nuestros ojos la definición del Misionero: «Un Hijo del Inmaculado Corazón de María es un hombre que arde en caridad y que abrasa por donde pasa. Que desea eficazmente y procura por todos los medios encender a todos los hombres en el fuego del divino amor. Nada le arredra; se goza en las privaciones; aborda los trabajos; abraza los sacrificios; se complace en las calumnias; se alegra en los tormentos y dolores que sufre y se gloría en la cruz de Jesucristo <sup class=\"fn-ref\" data-fn=\"12\">[12]</sup>, No piensa sino cómo seguirá e imitará a Cristo en orar, en trabajar, en sufrir, en procurar siempre y únicamente la mayor gloria de Dios y la salvación de los hombres».", "paras": ["PARTE PRIMERA", "LA VIDA MISIONERA DE LA CONGREGACION", "Capítulo I", "LA COMUNIDAD MISIONERA"], "subs": []}, {"n": 10, "text": "Así como Jesucristo es uno con el Padre y con el Espíritu, así también nosotros misioneros debemos ser uno en Ellos, para que el mundo crea en Cristo <sup class=\"fn-ref\" data-fn=\"13\">[13]</sup>. Imitemos la comunión de vida de los Apóstoles con Cristo y la primera comunidad de creyentes, que tenían un solo corazón y una sola alma <sup class=\"fn-ref\" data-fn=\"14\">[14]</sup>.", "paras": ["El amor a Dios y a los hermanos <sup class=\"fn-ref\" data-fn=\"15\">[15]</sup> ha sido derramado en nuestros corazones por el Espíritu Santo <sup class=\"fn-ref\" data-fn=\"16\">[16]</sup> y edifica nuestra comunión. Es el don primero y el más necesario, por el que nos configuramos como verdaderos discípulos de Cristo. Por tanto, toda nuestra vida misionera estará regida e informada por este amor."], "subs": []}, {"n": 11, "text": "En virtud de la común vocación que hemos asumido, nuestra Congregación comprende a todos los miembros y a todas las Comunidades. Sin embargo, cada uno de nosotros, manteniendo aquella disponibilidad propia de la naturaleza universal de la Congregación, se asocia con los hermanos por medio de la vida familiar y el ministerio en una comunidad local.", "paras": [], "subs": []}, {"n": 12, "text": "La vida fraterna se significa sobre todo y se realiza plenamente en la Eucaristía, que es signo de unidad y vínculo de caridad <sup class=\"fn-ref\" data-fn=\"17\">[17]</sup>. Nuestra fraternidad se alimenta también con la oración común, principalmente litúrgica; se fomenta con un estilo de vida familiar en el que convivimos todos con Espíritu sincero", "paras": ["y abierto; y se expresa además en la participación en el gobierno y en la ordenación de la Comunidad. Fortalecidos por todos estos medios, intentamos conseguir en la Comunidad misionera la plenitud personal a la que hemos sido llamados."], "subs": []}, {"n": 13, "text": "La colaboración en el ministerio de la palabra pertenece al origen mismo de nuestra vida comunitaria. Sin embargo, compartimos la misión de la Comunidad de diversos modos: ya sea por la unión de varios hermanos para realizar en equipo una tarea, ya sea en el desempeño del cargo encomendado a cada uno por la Comunidad, o bien orando y sufriendo por la Iglesia. Por tanto, el ministerio encomendado a cada uno ha de cumplirse de tal modo que todos nos sintamos comprometidos en el mismo y, a la vez, que cada uno de nosotros lo realicemos como una obra asumida por la Comunidad.", "paras": [], "subs": []}, {"n": 14, "text": "Esta nuestra comunidad debe desarrollar el carisma originario al servicio de la Iglesia y del mundo, de tal forma que se encarne verdaderamente en la situación y en las necesidades de la Iglesia particular y del mundo que la rodea, tanto en el modo de vivir como en el modo de ejercer e ministerio.", "paras": [], "subs": []}, {"n": 15, "text": "Como imágenes de Dios <sup class=\"fn-ref\" data-fn=\"18\">[18]</sup> y miembros de un mismo Cuerpo <sup class=\"fn-ref\" data-fn=\"19\">[19]</sup>, hemos de amarnos mutuamente, cumpliendo así el precepto del Señor: «Este es mi mandamiento, que os améis los unos a los otros como Yo os he amado» <sup class=\"fn-ref\" data-fn=\"20\">[20]</sup>. Este amor fraterno implica el ejercicio de todas las virtudes, porque «la caridad es paciente, es servicial; la caridad no es envidiosa, no es jactanciosa, no se engríe, no es descortés, no busca su interés, no se irrita, no toma en cuenta el mal, no se alegra de la injusticia, se alegra con la verdad. Lo excusa todo. Todo lo cree. Todo lo espera. Todo lo soporta» <sup class=\"fn-ref\" data-fn=\"21\">[21]</sup>. Seamos, por tanto, solícitos los unos para con los otros, llevando mutuamente nuestras cargas <sup class=\"fn-ref\" data-fn=\"22\">[22]</sup>.", "paras": [], "subs": []}, {"n": 16, "text": "Colaboremos todos y cada uno incesantemente en la edificación de la Comunidad. Usemos siempre palabras llenas de humildad y caridad. No lesionemos nunca la amistad, ni sembremos discordias, ni discutamos entre nosotros, ni murmuremos de cosa alguna. No juzguemos nunca a los hermanos, ya que el Señor es el único juez <sup class=\"fn-ref\" data-fn=\"23\">[23]</sup>, ni nos atrevamos a sospechar de ellos. Excusemos la intención, aun cuando no podamos justificar la obra. Sepamos perdonar a todos con espíritu generoso, si alguno tiene contra otro algún motivo de queja.", "paras": [], "subs": []}, {"n": 17, "text": "Con los hermanos que son de distinto origen, edad, cultura u opinión, mantengamos siempre la unidad del espíritu en el vínculo de la paz <sup class=\"fn-ref\" data-fn=\"24\">[24]</sup>. En la diversidad de carismas y ministerios usemos de nuestra libertad en conformidad con el don que hayamos recibido del mismo y único Espíritu para utilidad de todos <sup class=\"fn-ref\" data-fn=\"25\">[25]</sup>. Recibamos con amor fraterno a los hermanos que vengan a nuestra Comunidad <sup class=\"fn-ref\" data-fn=\"26\">[26]</sup>. Y nosotros mismos, cuando vayamos a otra casa, llevemos a ella la paz del Señor <sup class=\"fn-ref\" data-fn=\"27\">[27]</sup>.", "paras": [], "subs": []}, {"n": 18, "text": "Tratemos con amor y respeto a los ancianos y a los que han gastado ya su vida en el servicio de Dios, y deseemos enriquecernos con su experiencia <sup class=\"fn-ref\" data-fn=\"28\">[28]</sup>. Y ellos procuren dar siempre testimonio de una perenne juventud de corazón <sup class=\"fn-ref\" data-fn=\"29\">[29]</sup>.", "paras": ["Amemos todos de una manera especial a los hermanos enfermos, como miembros de Cristo paciente, visitándoles y asistiéndoles de buen grado <sup class=\"fn-ref\" data-fn=\"30\">[30]</sup>."], "subs": []}, {"n": 19, "text": "Cuando haya fallecido un Misionero, celebremos sus exequias con devoción, con fraterna caridad y con sencillez. Encomendemos al Señor con los sufragios prescritos, especialmente en la celebración de la Eucaristía, a los hermanos que nos precedieron en el servicio del Evangelio.", "paras": ["Manifestemos idéntica piedad para con nuestros familiares y colaboradores de la Congregación fallecidos.", "Capítulo II", "LA CASTIDAD"], "subs": []}, {"n": 20, "text": "A imitación de Jesucristo, que con sus palabras, y sobre todo con el testimonio de su vida, propone la castidad por el Reino de los cielos <sup class=\"fn-ref\" data-fn=\"31\">[31]</sup>, y a ejemplo de la Virgen María <sup class=\"fn-ref\" data-fn=\"32\">[32]</sup>, también nosotros abrazamos esta castidad como un don <sup class=\"fn-ref\" data-fn=\"33\">[33]</sup> para consagrarnos de todo corazón a las cosas del Padre <sup class=\"fn-ref\" data-fn=\"34\">[34]</sup>. Por medio del don de esta castidad, el Señor Jesús manifiesta el poder de su gloria en la fragilidad de nuestra carne a fin de alentar en todos la esperanza de la vida futura <sup class=\"fn-ref\" data-fn=\"35\">[35]</sup>.", "paras": [], "subs": []}, {"n": 21, "text": "La castidad que nosotros profesamos favorece una nueva comunión fraterna en Cristo y construye una comunidad que no se funda ni en la carne ni en la sangre, sino en la voluntad de Dios <sup class=\"fn-ref\" data-fn=\"36\">[36]</sup>. Como signo de amor perfecto, se convierte en una peculiar fuente de fecundidad espiritual en el mundo <sup class=\"fn-ref\" data-fn=\"37\">[37]</sup>; por ello nos libera de modo singular para inflamarnos en amor a Dios y a todos los hombres; fortalece nuestro espíritu para luchar contra las potestades del maligno en el ministerio apostólico <sup class=\"fn-ref\" data-fn=\"38\">[38]</sup>.", "paras": [], "subs": []}, {"n": 22, "text": "Amemos, pues, la castidad como un don de Dios, recibámosla con gozo y cultivémosla con toda diligencia. En virtud de nuestra profesión nos obligamos con voto a observar perfecta continencia en el celibato.", "paras": ["Como la observancia de esta castidad afecta a las más profundas inclinaciones de nuestra naturaleza y nos impone algunas", "renuncias <sup class=\"fn-ref\" data-fn=\"39\">[39]</sup>, confiemos en el Señor y pidamos su ayuda con humilde oración. Fomentemos la vida comunitaria, ya que el verdadero amor fraterno conserva la castidad y la lleva a su plenitud.", "Evitemos los peligros como por un cierto instinto espiritual, sin presumir de nuestras propias fuerzas. Empleemos medios oportunos para este fin, como son la ocupación asidua, la prudencia pastoral, el cuidado por la salud del alma y del cuerpo.", "Capítulo III", "LA POBREZA"], "subs": []}, {"n": 23, "text": "A imitación de Jesucristo profesamos la pobreza evangélica. El, siendo rico, se hizo pobre por nosotros a fin de que nosotros nos enriqueciéramos <sup class=\"fn-ref\" data-fn=\"40\">[40]</sup>. Dedicado a anunciar la Buena Nueva del Reino, no tenía dónde reclinar su cabeza <sup class=\"fn-ref\" data-fn=\"41\">[41]</sup>. Por la profesión compartimos esta su pobreza y el ejemplo de la Bienaventurada Virgen María, que es la primera entre los pobres del Señor <sup class=\"fn-ref\" data-fn=\"42\">[42]</sup>, y a semejanza de los Apóstoles que, abandonándolo todo, siguieron al Señor <sup class=\"fn-ref\" data-fn=\"43\">[43]</sup>, recordamos a los hombres los bienes del mundo futuro.", "paras": [], "subs": []}, {"n": 24, "text": "Poniendo toda nuestra confianza en el Señor, y nunca en el poder y las riquezas, buscamos ante todo el Reino de Dios <sup class=\"fn-ref\" data-fn=\"44\">[44]</sup>, que pertenece a los pobres <sup class=\"fn-ref\" data-fn=\"45\">[45]</sup>. La pobreza voluntaria construye la Comunidad fraterna en unidad de corazón y Espíritu. Se expresa en la comunión de bienes, tanto materiales como espirituales, con los pobres y en su servicio.", "paras": [], "subs": []}, {"n": 25, "text": "Nuestra pobreza es apostólica <sup class=\"fn-ref\" data-fn=\"46\">[46]</sup>, de tal forma que nuestra vida y actividad estén informadas por el espíritu de pobreza. Pero las formas de la pobreza han de responder", "paras": ["verdaderamente a nuestra vida misionera y constituir un signo, a la vez personal y comunitario, del Evangelio. Por eso, tanto la Congregación, como cada una de nuestras Comunidades, atendiendo a las circunstancias de los distintos lugares, deben preocuparse por dar testimonio colectivo de pobreza: evitando toda clase de lujo y de lucro inmoderado, lo mismo que la acumulación de bienes; el mobiliario, la comida y el vestido han de ser al estilo de los pobres. Tengamos siempre nuestros bienes a disposición de los demás, principalmente para las necesidades de la propia Congregación y del Pueblo de Dios."], "subs": []}, {"n": 26, "text": "Procuren nuestros Misioneros ser verdaderamente pobres, de hecho y de Espíritu. No retengan ni adquieran para sí nada contrario a la profesión de pobreza, ni usen de cosa alguna como propia <sup class=\"fn-ref\" data-fn=\"47\">[47]</sup>. Siéntanse obligados a la ley común del trabajo <sup class=\"fn-ref\" data-fn=\"48\">[48]</sup>, compartiendo la condición de los pobres. Y no acepten los sagrados ministerios en vista de la retribución <sup class=\"fn-ref\" data-fn=\"49\">[49]</sup>.", "paras": ["Alégrense cuando experimenten algunos efectos de la pobreza, no dudando de la providencia de aquel que dijo: «Buscad primero el Reino de Dios y su Justicia y todo lo demás se os dará por añadidura» <sup class=\"fn-ref\" data-fn=\"50\">[50]</sup>.", "En orden a fomentar la pobreza religiosa, el legítimo Superior puede conceder a los profesos de votos perpetuos que renuncien libremente a sus bienes patrimoniales, según las normas del Derecho."], "subs": []}, {"n": 27, "text": "Por el voto de pobreza los miembros de la Congregación renuncian a su derecho de disponer de los bienes temporales y de usar de ellos sin permiso de los Superiores.", "paras": ["11,7-15; 12,13.", "Antes de la primera profesión cedan la administración de sus bienes a quien prefieran y dispongan libremente de su uso y usufructo conforme a nuestro derecho. Antes de la profesión perpetua hagan libremente testamento civil de los bienes actuales o que tal vez les puedan sobrevenir. No les es lícito sin permiso de los Superiores hacer ningún acto de propiedad acerca de los bienes cuyo dominio radical conservan, ni respecto de la aceptación de otros bienes que de cualquier manera puedan sobrevenirles después de la profesión.", "Capítulo IV", "LA OBEDIENCIA"], "subs": []}, {"n": 28, "text": "A imitación de Jesucristo, que fue enviado para hacer la voluntad del Padre <sup class=\"fn-ref\" data-fn=\"51\">[51]</sup>, y a ejemplo de la Santísima Virgen, que se consagró totalmente como esclava del Señor <sup class=\"fn-ref\" data-fn=\"52\">[52]</sup> a la persona y a la obra del Hijo, también nosotros, movidos por el Espíritu Santo, nos proponemos cumplir la voluntad del Padre dentro de nuestra Congregación.", "paras": ["Por la profesión de obediencia ofrecemos a Dios la libre facultad de ordenar nuestra vida, y por el voto nos obligamos a obedecer al precepto del legítimo Superior en aquellas cosas que pertenecen directa o indirectamente a la vida del Instituto, o sea, al cumplimiento de nuestra misión y a la observancia de los votos y de las Constituciones. Nos configuramos con Jesucristo, que se hizo por nosotros obediente hasta la muerte, y una muerte de cruz <sup class=\"fn-ref\" data-fn=\"53\">[53]</sup>, y en todo nos unimos a la voluntad salvífica de Dios."], "subs": []}, {"n": 29, "text": "Como al verdadero Misionero se le reconoce en la obediencia, todos nosotros, que compartimos la misma vocación,", "paras": ["buscamos juntos conocer y hacer la voluntad de Dios, a fin de poder realizar la común misión que tenemos en la Iglesia, atendidas las distintas circunstancias de tiempos, lugares y personas. En la búsqueda y en el cumplimiento de la voluntad divina todos estamos obligados a ofrecer nuestra ayuda a los hermanos con la oración, el consejo y el diálogo fraterno."], "subs": []}, {"n": 30, "text": "La unidad de amor y de misión de las Comunidades se expresa visiblemente en nuestros Superiores. Ellos, por tanto, busquen ante todo la voluntad del Padre <sup class=\"fn-ref\" data-fn=\"54\">[54]</sup> y después propónganla a los demás. Escuchen los Superiores de buen grado a sus hermanos y promuevan además la cooperación de los mismos para el bien de la Congregación y de la Iglesia, quedando, no obstante, en firme su autoridad para decidir y ordenar lo que se debe hacer. Ejerzan la autoridad según las Constituciones y en espíritu de servicio, dando su vida por los hermanos <sup class=\"fn-ref\" data-fn=\"55\">[55]</sup>.", "paras": [], "subs": []}, {"n": 31, "text": "Acostúmbrense los Misioneros a obedecer al Señor impulsados por el amor, pronta y perfectamente, sometiéndose a los hombres por El <sup class=\"fn-ref\" data-fn=\"56\">[56]</sup>.", "paras": ["No impugnen, sino, más bien, defiendan lo que haya sido determinado por los Superiores; y si les pareciere conveniente en el Señor proponer algo contrario a lo mandado, háganlo libremente, pero siempre después de haberlo consultado con Dios y dispuestos a aceptar lo que se determine. En la ejecución de lo mandado y en el cumplimiento de los cargos que se les encomienden, contribuyan con todas las energías personales."], "subs": []}, {"n": 32, "text": "Con esta disposición de espíritu, los Misioneros estarán libres para que puedan ser enviados a cualquier parte del mundo y preparados para cualquier ministerio que les sea encomendado por la Congregación a través de los Superiores.", "paras": ["Capítulo V", "LA ORACION"], "subs": []}, {"n": 33, "text": "Quienes hemos asumido la obra misionera de Cristo debemos también imitarle en su oración asidua <sup class=\"fn-ref\" data-fn=\"57\">[57]</sup>, y escucharle cuando recomienda y enseña <sup class=\"fn-ref\" data-fn=\"58\">[58]</sup> la oración incesante <sup class=\"fn-ref\" data-fn=\"59\">[59]</sup>.", "paras": [], "subs": []}, {"n": 34, "text": "Por eso, tenemos que cultivar el Espíritu de hijos adoptivos que nos hace exclamar: «Abbá, Padre» <sup class=\"fn-ref\" data-fn=\"60\">[60]</sup>. Guiados por la luz de la fe, busquemos en todos los acontecimientos los signos de su voluntad y de este modo seremos cada día más dóciles a nuestra misión.", "paras": ["La Palabra de Dios que debemos proclamar, escuchémosla antes en asidua contemplación <sup class=\"fn-ref\" data-fn=\"61\">[61]</sup> y compartámosla con los hermanos, para que nosotros mismos nos convirtamos al Evangelio, nos configuremos con Cristo y seamos inflamados por su caridad que nos ha de apremiar <sup class=\"fn-ref\" data-fn=\"62\">[62]</sup>. Intercedamos también ante Dios en favor de la Iglesia y por la vida del mundo con oraciones y suplicas <sup class=\"fn-ref\" data-fn=\"63\">[63]</sup>."], "subs": []}, {"n": 35, "text": "Ante todo, celebremos diariamente y con plenitud de espíritu el misterio de la Eucaristía, uniéndonos a Cristo Señor, que proclama palabras de vida, se ofrece a Sí mismo por los hermanos, honra al Padre y edifica la unidad de la Iglesia. Tengamos en gran estima el diálogo con Cristo en la visita y en el culto a la Santísima Eucaristía. Hagamos fielmente cada día la oración en nombre de la Iglesia.", "paras": ["En los tiempos sagrados y en los días festivos procuremos acomodar nuestra oración al espíritu de la Iglesia, que en la", "Jn 17,9-26.", "Liturgia propone a la contemplación de los fieles todo el misterio de Cristo. De la celebración de la Eucaristía y de la alabanza a Dios recibiremos la fortaleza necesaria para que nuestra vida en Cristo vaya creciendo y nuestro ministerio se haga cada vez más fecundo.", "Nos asociamos de manera especial al culto de la Iglesia celeste, unidos en comunión y venerando la memoria, ante todo, de la Santísima Virgen María, la de San José, San Miguel y todos los Angeles, de los Apóstoles y de aquellos otros santos que, por su espíritu verdaderamente misionero, tradicionalmente tenemos por Patronos: San Alfonso María de Ligorio, San Ignacio de Loyola, Santa Teresa de Jesús, Santa Catalina de Siena."], "subs": []}, {"n": 36, "text": "Veneremos con amor filial a la Santísima Virgen María, Madre de Dios, asociada de todo corazón a la obra salvífica de su Hijo, ya con el culto litúrgico, ya con los ejercicios de piedad recibidos de la tradición, como el Santo Rosario y otros semejantes.", "paras": [], "subs": []}, {"n": 37, "text": "Meditando la palabra de Dios en el corazón <sup class=\"fn-ref\" data-fn=\"64\">[64]</sup>, dediquémonos los Misioneros diariamente, y en cuanto sea posible por una hora, a la oración mental, y a la lectura espiritual especialmente de los Libros sagrados <sup class=\"fn-ref\" data-fn=\"65\">[65]</sup>; y examinémonos de nuestra fidelidad al Evangelio.", "paras": ["La oración diaria, hecha con fidelidad, sigue siendo una necesidad primaria tanto para la Comunidad como para cada uno de los Misioneros; por eso se le debe conceder un puesto prioritario en nuestra vida."], "subs": []}, {"n": 38, "text": "Celebremos frecuentemente el Sacramento de la reconciliación, en el cual se significa y se completa el espíritu de una permanente conversión a Dios. En virtud de este Sacramento,", "paras": ["a la vez que nos reconciliamos con la Iglesia, a la que hemos herido al pecar, morimos al pecado <sup class=\"fn-ref\" data-fn=\"66\">[66]</sup> con Cristo, que no conoció pecado <sup class=\"fn-ref\" data-fn=\"67\">[67]</sup>.", "Capítulo VI", "LA CONFIGURACION CON CRISTO"], "subs": []}, {"n": 39, "text": "La unción del Espíritu Santo <sup class=\"fn-ref\" data-fn=\"68\">[68]</sup>, con la que hemos sido ungidos para evangelizar a los pobres, es participación de la plenitud de Cristo <sup class=\"fn-ref\" data-fn=\"69\">[69]</sup>. Por eso, los que hemos sido llamados a seguir al Señor y a colaborar con El en la obra que el Padre le encomendó, tenemos que contemplar asiduamente a Cristo e imitarlo, penetrados de su Espíritu, hasta que ya no seamos nosotros mismos los que vivamos, sino que sea Cristo quien realmente viva en nosotros <sup class=\"fn-ref\" data-fn=\"70\">[70]</sup>. Sólo de este modo seremos válidos instrumentos del Señor para anunciar el Reino de los cielos.", "paras": ["Intentamos conseguir nuestra configuración con Cristo por medio de los votos religiosos en una Comunidad misionera. La alcanzamos también y la expresamos por medio de otras virtudes, según nuestro carisma propio en la Iglesia."], "subs": []}, {"n": 40, "text": "La caridad apostólica es la virtud más necesaria al misionero. De tal modo que, si carece de ella, será como una campana que suena o un címbalo que retiñe <sup class=\"fn-ref\" data-fn=\"71\">[71]</sup>.", "paras": ["Jesucristo, ungido por un ardiente amor al Padre y a los hombres, se entregó a los trabajos, a la pasión e incluso a la muerte <sup class=\"fn-ref\" data-fn=\"72\">[72]</sup>. Del mismo modo, los Apóstoles, testigos de la alegría de la Resurreción de Cristo <sup class=\"fn-ref\" data-fn=\"73\">[73]</sup>, impulsados por el fuego del Espíritu Santo, recorrieron el mundo entero.", "Ef 5,2.25.", "Movidos por el celo apostólico y por el gozo del Espíritu, esforcémonos también nosotros, con todos nuestros medios y recursos, por conseguir que Dios sea conocido, amado y servido por todos. Amemos a todos los hombres, deseándoles y procurándoles la bienaventuranza del Reino ya iniciada en la tierra."], "subs": []}, {"n": 41, "text": "Para tener los mismos sentimientos que tuvo Jesucristo, que se anonadó a Sí mismo, tomando la forma de siervo <sup class=\"fn-ref\" data-fn=\"74\">[74]</sup>, procuremos la humildad que, por disponernos a la gracia de Dios, es el fundamento de la perfección cristiana y, por lo tanto, una virtud muy necesaria a los ministros del evangelio. De todos los dones que cada uno crea poseer, dé únicamente a Dios toda la gloria, procurando hacerlos fructificar copiosamente <sup class=\"fn-ref\" data-fn=\"75\">[75]</sup>. Recuerde cada uno sus pecados y defectos y reconozca íntimamente la propia dependencia de Dios. Exprese este conocimiento en el modo de actuar y en sus relaciones con los demás. Confiese sus errores y defectos, pida perdón a los hermanos y présteles los servicios de caridad, de modo que esté en medio de los hermanos como quien sirve <sup class=\"fn-ref\" data-fn=\"76\">[76]</sup>.", "paras": [], "subs": []}, {"n": 42, "text": "Esforcémonos por imitar la mansedumbre propuesta por el Señor <sup class=\"fn-ref\" data-fn=\"77\">[77]</sup>, que es señal de vocación apostólica. Es ciertamente necesario que la caridad de Cristo nos apremie <sup class=\"fn-ref\" data-fn=\"78\">[78]</sup>, de modo que amemos a nuestros hermanos con el mismo amor con que Dios los ama <sup class=\"fn-ref\" data-fn=\"79\">[79]</sup> y con fortaleza de espíritu muramos cada día", "paras": ["por ellos; sin embargo, a fin de ganar a los más posibles para Cristo, debemos estar siempre animados por su mansedumbre", "en el ejercicio de nuestro ministerio."], "subs": []}, {"n": 43, "text": "Asociados a la obra de la Redención, procuremos configurarnos con Cristo, que dijo: «Si alguno quiere venir en", "paras": ["pos de Mí, niéguese a sí mismo y tome su cruz» <sup class=\"fn-ref\" data-fn=\"82\">[82]</sup>.", "Los auténticos Misioneros, como extranjeros y peregrinos, han de abstenerse de los deseos de la carne que combaten contra el alma <sup class=\"fn-ref\" data-fn=\"83\">[83]</sup>. Por eso, guarden con diligente cuidado sus sentidos, glorificando y llevando a Dios en su cuerpo <sup class=\"fn-ref\" data-fn=\"84\">[84]</sup>. En la comida y bebida y en el uso de aquellas cosas que favorecen el deleite, elijan las formas de templanza más conformes a las circunstancias de tiempo y de lugar y que mejor corresponden a hombres apostólicos. De este modo, en su frugalidad quedará manifiesto que el cuerpo es de Cristo, por cuya virtud Dios nos resucitará <sup class=\"fn-ref\" data-fn=\"85\">[85]</sup>."], "subs": []}, {"n": 44, "text": "Recordando las palabras del Señor: «Quien pierda su vida por mí y por el Evangelio, la salvará» <sup class=\"fn-ref\" data-fn=\"86\">[86]</sup>, importa en gran manera que procuren alegrarse en toda adversidad, en el hambre, en la sed, en la desnudez, en los trabajos, en las calumnias, en las persecuciones y en toda tribulación <sup class=\"fn-ref\" data-fn=\"87\">[87]</sup>, hasta que puedan decir con el Apóstol: «Lejos de mí gloriarme sino en la cruz de nuestro Señor Jesucristo, por quien el mundo está crucificado para mí y yo para el mundo» <sup class=\"fn-ref\" data-fn=\"88\">[88]</sup>.", "paras": ["El mismo Señor, que se identificó plenamente con los que sufren, nos invita a reconocerle como paciente en ellos y a prestarles una ayuda eficaz <sup class=\"fn-ref\" data-fn=\"89\">[89]</sup>, dando incluso nuestra vida por nuestros hermanos <sup class=\"fn-ref\" data-fn=\"90\">[90]</sup>. Solidarios de los hombres que padecen enfermedad, dolor, injusticia y opresión, soportémoslo todo por ellos, para que también ellos consigan la salvación <sup class=\"fn-ref\" data-fn=\"91\">[91]</sup>."], "subs": []}, {"n": 45, "text": "Ya que Jesucristo padeció por nosotros, dejándonos su ejemplo <sup class=\"fn-ref\" data-fn=\"92\">[92]</sup>, cuando estemos enfermos soportemos la", "paras": ["enfermedad y los dolores con humildad y sumisión al divino beneplácito, sabiendo que con nuestra dolencia completamos lo que falta a la pasión de Cristo <sup class=\"fn-ref\" data-fn=\"93\">[93]</sup>. Llevemos, pues, con gran paciencia la enfermedad y todas las deficiencias provenientes de la pobreza, predicando a todos con el testimonio de la vida.", "Cuando alguien esté gravemente enfermo, únase más estrechamente con Cristo, también por medio de los Sacramentos de los enfermos, ofrezca su vida por la salvación de todos y ponga toda su esperanza en aquel que es nuestra resurrección y nuestra vida <sup class=\"fn-ref\" data-fn=\"94\">[94]</sup>.", "Capítulo VII", "NUESTRA MISION"], "subs": []}, {"n": 46, "text": "Nuestra vocación especial en el Pueblo de Dios es el ministerio de la palabra, con el que comunicamos a los hombres el misterio íntegro de Cristo. En efecto, hemos sido enviados a anunciar la vida, muerte y resurrección del Señor, hasta que vuelva, a fin de que todos los hombres se salven por la fe en El <sup class=\"fn-ref\" data-fn=\"95\">[95]</sup>.", "paras": ["Compartiendo las esperanzas y los gozos, las tristezas y las angustias de los hombres, principalmente de los pobres, pretendemos ofrecer una estrecha colaboración a todos los que buscan la transformación del mundo según el designio de Dios.", "Debemos anunciar la Buena Nueva del Reino en fidelidad y fortaleza, sobre todo porque son muchos los que a él se oponen, por ambición de poder, por afán de riquezas o por ansia de placeres <sup class=\"fn-ref\" data-fn=\"96\">[96]</sup>."], "subs": []}, {"n": 47, "text": "Nuestra Congregación cumple su misión suscitando y consolidando comunidades de creyentes, sea convirtiendo a los", "paras": ["hombres a Dios por la fe, sea renovando su vida en Cristo y llevándola hasta la perfección."], "subs": []}, {"n": 48, "text": "Para cumplir esta misión, empleen los Misioneros todos los medios que les sean posibles; pero, ante todo, han de fomentar en sí mismos:", "paras": [], "subs": ["El sentido de intuición para captar lo más urgente, oportuno y eficaz, atendidas las circunstancias de tiempos, lugares y personas, sin anclarse en métodos o instrumentos de apostolado inadecuados;", "el sentido de disponibilidad, de modo que estén dispuestos a renunciar a todo lo que hasta ahora han tenido, con el fin de realizar la misión de propagar la fe, tanto dentro como fuera de las fronteras de la patria, dóciles al Espíritu y obedientes a la misión <sup class=\"fn-ref\" data-fn=\"97\">[97]</sup>;", "el sentido de catolicidad para ir a todas las partes del mundo y con espíritu abierto estimar grandemente las costumbres de los pueblos y sus valores culturales y religiosos <sup class=\"fn-ref\" data-fn=\"98\">[98]</sup>. La acción misionera debe dirigirse, ante todo, a aquellos que más necesitados están de evangelización o a quienes ya son agentes de la misma evangelización o pueden serlo. De buen grado asociamos en el Señor a nuestras obras apostólicas a todos y cada uno de los que, impulsados por espíritu misionero, desean colaborar con nosotros."]}, {"n": 49, "text": "Los miembros de la Congregación deben entregarse plenamente a la obra del Evangelio, dejando incluso la propia familia <sup class=\"fn-ref\" data-fn=\"99\">[99]</sup>: recuerden, en efecto, que tienen un Padre en el cielo a quien más que a nadie deben agradar <sup class=\"fn-ref\" data-fn=\"100\">[100]</sup>. Cuiden, asimismo, que un amor desordenado a la patria o a la propia cultura no impida la adaptación a las gentes que van a evangelizar. Y para que se consagren más libremente a su vocación misionera, no quieran", "paras": ["implicarse en partidos políticos, ni en aquellas cosas que sirvan de impedimento a su vocación."], "subs": []}, {"n": 50, "text": "Entre las funciones del ministerio, como son el gobierno, la santificación y la evangelización, el primero de todos para nosotros, porque somos misioneros, es la colaboración en la evangelización del pueblo. Por consiguiente, ninguno de nosotros acepte cargos de gobierno eclesiástico, a no ser con el consentimiento del Superior General o por mandato del Sumo Pontífice.", "paras": ["Capítulo VIII", "EL PROGRESO EN LA VIDA MISIONERA"], "subs": []}, {"n": 51, "text": "Nuestros Misioneros, deseando ardientemente la justicia del Señor <sup class=\"fn-ref\" data-fn=\"101\">[101]</sup>, esfuércense por llegar a la plena madurez de Cristo <sup class=\"fn-ref\" data-fn=\"102\">[102]</sup> para que puedan comunicar con mayor eficacia a los demás la gracia del Evangelio. Puesto que Dios nos ha llamado, no por nuestras obras, sino según su determinación <sup class=\"fn-ref\" data-fn=\"103\">[103]</sup>, y nos ha justificado en Jesucristo <sup class=\"fn-ref\" data-fn=\"104\">[104]</sup>, estamos firmemente convencidos de que el mismo que inició en nosotros la buena obra la irá consumando hasta el día de Cristo Jesús <sup class=\"fn-ref\" data-fn=\"105\">[105]</sup>.", "paras": [], "subs": []}, {"n": 52, "text": "Con la decisión de caminar en una vida nueva <sup class=\"fn-ref\" data-fn=\"106\">[106]</sup>, orientando el corazón hacia Dios, hagan todas las cosas con recta intención y con verdadero fervor de espíritu y por El soporten todas las adversidades. Renueven cada día el propósito de adelantar en el camino del Señor. Cada mes dedíquense con empeño al retiro espiritual en el que mediten sobre la propia vocación y renueven en sí mismos la esperanza de la gloria futura para prepararse mejor a la venida del Señor. Cada año practiquen,", "paras": ["Cf. Rom 3,24", "Cf. Flp 1,6.", "Cf. Rom 6,4.", "de modo especial y con el debido esmero, los Ejercicios Espirituales."], "subs": []}, {"n": 53, "text": "Del mismo modo que nuestro Señor Jesucristo fue llevado por el Espíritu al desierto para ser tentado por el diablo <sup class=\"fn-ref\" data-fn=\"107\">[107]</sup>, nosotros, discípulos suyos, seremos también tentados muchas veces <sup class=\"fn-ref\" data-fn=\"108\">[108]</sup>. Durante las mismas tentaciones, sin embargo, debemos permanecer unidos a Cristo, que todavía es tentado en nosotros <sup class=\"fn-ref\" data-fn=\"109\">[109]</sup>.", "paras": ["Revistámonos todos de las armas de Dios <sup class=\"fn-ref\" data-fn=\"110\">[110]</sup>, sin presumir de nuestras propias fuerzas, sino confiando con inquebrantable esperanza en Dios, que en las mismas tentaciones se muestra fiel <sup class=\"fn-ref\" data-fn=\"111\">[111]</sup>. Vigilemos, pues, según la palabra del Señor"], "subs": []}, {"n": 54, "text": "Para promover eficazmente el progreso espiritual, pidan la ayuda de los hermanos, ya sea en la dirección espiritual, ya sea en el discernimiento comunitario y por otros medios. Deseen vivamente y pidan ser corregidos y avisados; y respondan a todas las correcciones con acción de gracias y con íntimo reconocimiento.", "paras": [], "subs": []}, {"n": 55, "text": "Solícitos los unos por los otros, si vieran que un hermano se desvía del recto camino y que comete defectos que pueden ser verdaderamente perjudiciales para él o para otros, avísenle en privado <sup class=\"fn-ref\" data-fn=\"114\">[114]</sup> con caridad llena de mansedumbre y humildad, acordándose de la fragilidad propia. Pero si él se niega a escuchar o su propio bien o el de los demás lo exige de manera inmediata, indíquenselo al Superior para que ponga el conveniente remedio;", "paras": ["y, por su parte, encomienden el asunto a Dios. Acojan todos con sincero amor al hermano arrepentido y confórtenlo para que prosiga con mayor seguridad el camino del Señor."], "subs": []}, {"n": 56, "text": "Es necesario que nuestros hermanos progresen al mismo tiempo en virtud y ciencia, para estar a la altura de los tiempos y ser idóneos para ejercer fructuosamente el ministerio. Cultiven con toda diligencia las ciencias sagradas y las humanas y sigan constantemente el progreso de las mismas. Procuren los Superiores que, en cuanto lo permita nuestra condición, haya en cada Comunidad los instrumentos y medios convenientes para continuar eficazmente los estudios. Todos los miembros de la Comunidad tengan en gran aprecio la Biblioteca.", "paras": [], "subs": []}, {"n": 57, "text": "Teniendo en cuenta las exigencias de nuestra vida misionera, resérvese alguna parte de la casa sólo para sus miembros; cada Comunidad establezca su reglamentación interna, determine el ritmo de su oración comunitaria y organice los demás aspectos de su vida, de tal modo que los actos comunes se distribuyan de acuerdo con las exigencias de la acción apostólica; y que además del tiempo dedicado a las cosas espirituales y al trabajo, tengan los Misioneros algún tiempo para sí mismos y puedan también disfrutar de la conveniente recreación, de silencio y de descanso. En el uso de los medios de comunicación guárdese la necesaria discreción y evítense aquellas cosas que pueden causar detrimento a la vida espiritual o al testimonio apostólico.", "paras": ["En cuanto al hábito religioso, obsérvense las prescripciones del Derecho universal.", "PARTE SEGUNDA", "LAS PERSONAS DE LA CONGREGACION", "Capítulo IX", "LOS LLAMADOS A LA VIDA MISIONERA"], "subs": []}, {"n": 58, "text": "Vivan gozosamente todos los Misioneros el don de la propia vocación. Además, deben desear ardientemente que ese mismo don les sea concedido también a otros y que nuestra Congregación crezca más cada día para anunciar el Reino de Dios <sup class=\"fn-ref\" data-fn=\"115\">[115]</sup>.", "paras": ["Consideren todos dirigida a sí mismos la exhortación divina: «Rogad al Señor de la mies que envíe obreros a su mies» <sup class=\"fn-ref\" data-fn=\"116\">[116]</sup>. Recuerden también que nuestras palabras y el estilo de la vida misionera son la mejor invitación a abrazar la vocación del Señor. Todos y cada uno tenemos el deber le fomentar las vocaciones."], "subs": []}, {"n": 59, "text": "Con aquellos que creen haber percibido en sí mismos la vocación, se ha de iniciar un proceso de discernimiento, a través de la escucha de la palabra de Dios, de la oración y del diálogo fraterno.", "paras": ["Pero quienes descubren que son llamados a una plena comunión con nuestra Congregación, conozcan profundamente y experimenten de alguna manera nuestra vida y nuestra misión <sup class=\"fn-ref\" data-fn=\"117\">[117]</sup>.", "Aquellos que solicitan ingresar en nuestra Congregación deben hacer el Postulantado, prosiguiendo el discernimiento de la propia vocación bajo la guía de un Misionero experimentado.", "En el acto de admisión el Postulante declarará que, mientras permanezca en la Congregación, realizará los trabajos gratuitamente y sin retribución, según la norma del estado religioso; y que por lo mismo si abandonara la Congregación nada pedirá por ellos."], "subs": []}, {"n": 60, "text": "Cada uno de nosotros ponga el máximo esmero en asegurar, por medio de las buenas obras, su propia vocación y elección <sup class=\"fn-ref\" data-fn=\"118\">[118]</sup>.", "paras": ["Pero si alguno, después de la profesión religiosa, juzgare necesario dejar la Congregación, prepare la decisión de separarse de ella en diálogo fraterno, buscando sinceramente la voluntad de Dios.", "Si los Superiores de la Congregación creyeran necesario desligar a algún hermano de los derechos y obligaciones de la profesión, háganlo siempre con caridad y discreción.", "Cuando alguno debe abandonar la Congregación, ya sea por propia voluntad, ya sea por la decisión de los Superiores, procédase según las normas del Derecho universal y del propio.", "Todos los Misioneros, y especialmente los Superiores, procuren con caridad cristiana ayudar cuanto puedan al que sale o es dimitido de la Congregación, para que pueda vivir dignamente en el mundo.", "Capítulo X", "LOS NOVICIOS Y SU MAESTRO"], "subs": []}, {"n": 61, "text": "Los Novicios, puesto que se preparan para profesar en nuestra Congregación, procuren poner los fundamentos de la vida", "paras": ["misionera y conozcan los elementos esenciales de la misma; ejercítense también en la práctica de los consejos evangélicos. Y así, únanse de todo corazón, principalmente en el Misterio Eucarístico, a Cristo Señor, cuya vida y ministerio van a compartir un día. Acojan como madre y como Maestra a la Bienaventurada Virgen María <sup class=\"fn-ref\" data-fn=\"119\">[119]</sup>, que fue la primera discípula de Cristo."], "subs": []}, {"n": 62, "text": "Aunque los Misioneros necesiten todas las virtudes, ante todo para poder responder a la propia vocación, deben tener una fe viva. Pues ella fue la que inflamó a los Profetas, Apóstoles y Mártires y la que movió a muchos predicadores de la divina palabra a abrazar con ánimo alegre la pobreza, la abnegación y el sacrificio para dilatar el Reino de Cristo. Por eso, los Novicios deben afianzarse profundamente en la fe, más aun, vivir de la fe <sup class=\"fn-ref\" data-fn=\"120\">[120]</sup>, especialmente cuando experimenten dudas en la fidelidad a su vocación.", "paras": [], "subs": []}, {"n": 63, "text": "Tendrán gran confianza en Dios, esperando de El la aptitud para cumplir bien la misión <sup class=\"fn-ref\" data-fn=\"121\">[121]</sup>. Anímense, por tanto, cuando tengan tentaciones de desconfianza o cuando experimenten las propias limitaciones, recordando que Dios siempre suele elegir instrumentos frágiles y débiles para confundir a los fuertes <sup class=\"fn-ref\" data-fn=\"122\">[122]</sup>.", "paras": [], "subs": []}, {"n": 64, "text": "Guarden la vocación misionera con humildad evangélica. Adviertan que nada tienen que no hayan recibido de Dios y de lo que no tengan que darle cuenta <sup class=\"fn-ref\" data-fn=\"123\">[123]</sup>. Por eso, reconozcan los dones recibidos, procuren que fructifiquen <sup class=\"fn-ref\" data-fn=\"124\">[124]</sup> y que, por consiguiente, sirvan a todos los hombres.", "paras": [], "subs": []}, {"n": 65, "text": "Los jóvenes misioneros, dóciles al Espíritu Santo en la búsqueda de la voluntad de Dios, cooperen responsablemente con", "paras": ["Cor 12,9-10.", "el Maestro y con los Superiores y acojan sus decisiones en fe y amor."], "subs": []}, {"n": 66, "text": "Procuren en todo la gloria de Dios como su razón de obrar, ya se dediquen al estudio, coman o se recreen, ya hagan otra cosa cualquiera <sup class=\"fn-ref\" data-fn=\"125\">[125]</sup>. Para ello, cultiven la oración incesantemente y sin tibieza. De este modo, saldrán con provecho del año de noviciado.", "paras": [], "subs": []}, {"n": 67, "text": "Estimen grandemente los Novicios la vocación misionera y continuar el proceso de discernimiento para ver si son llamados verdaderamente a la Congregación. Una vez convencidos de este llamamiento, esfuércense por responder con su propia fidelidad a la fidelidad de Dios, con Espíritu alegre y generoso.", "paras": [], "subs": []}, {"n": 68, "text": "Para que los Novicios puedan fundamentar sólidamente su vida misionera, son encomendados a un Maestro, que, de palabra y obra, ha de formarles en el Espíritu de la Congregación.", "paras": ["El Maestro es designado por el Superior Mayor con su Consejo. Debe ser un hombre verdaderamente espiritual y lleno de amor a la Congregación. Ha de estar dotado de madurez, amabilidad, prudencia y sólida doctrina acerca de la naturaleza y misión de nuestra Congregación en la Iglesia, como también de una conveniente experiencia apostólica.", "Oriente a los Novicios de tal manera que su madurez de juicio y su firmeza de carácter se vayan desarrollando del modo más conforme a cada uno. Incúlqueles aquellas virtudes que son más apreciadas entre los hombres y que den más credibilidad al discípulo de Cristo. Procure que los Novicios lleguen a conseguir aquella unidad de la vida misionera en virtud de la cual quedan perfectamente integrados el Espíritu de unión con Dios y la acción apostólica."], "subs": []}, {"n": 69, "text": "El Postulante es admitido al Noviciado por el Superior Mayor, oído el Consejo.", "paras": ["El tiempo de Noviciado comienza cuando el Superior Mayor o su Delegado lo determine.", "Para que el Noviciado sea válido debe durar doce meses, que han de transcurrir en la casa canónicamente destinada para ello.", "Para perfeccionar la formación de los Novicios, además del tiempo predicho, los Superiores pueden establecer, en conformidad con nuestro derecho, uno o más períodos de tiempo para ejercer el apostolado fuera de la comunidad del Noviciado. El Noviciado no debe durar nunca más de dos años.", "Salvando estas prescripciones, la ausencia del Noviciado que supere los tres meses, continuos o interrumpidos, hace inválido el Noviciado; La ausencia que supere los quince días debe suplirse."], "subs": []}, {"n": 70, "text": "El candidato, una vez que ha comprobado suficientemente, durante el tiempo de Noviciado, su vocación a la Congregación, previa la aprobación del Superior Mayor con su Consejo, se incorpora a la misma. Esta incorporación que se realiza por la emisión de votos públicos, primero es temporal.", "paras": ["Terminado el trienio de esta profesión temporal, quien espontáneamente lo pida y sea juzgado idóneo, sea admitido a la renovación incluso por otro trienio o a la profesión perpetua; de lo contrario, abandone la Congregación.", "Pero si parece oportuno, el Superior General puede prorrogar el período de profesión temporal para algún individuo, pero de manera que la totalidad de la incorporación temporal nunca supere los nueve años."], "subs": []}, {"n": 71, "text": "Obtenida la aprobación del Superior Mayor con su Consejo, el candidato se incorpora definitivamente a la", "paras": ["Congregación por los votos perpetuos. Para que alguien pueda emitir los votos perpetuos, tiene que haber alcanzado aquella madurez personal que le permita conocer y vivir la vocación divina como un bien de la persona en su totalidad.", "Nuestra Profesión religiosa se realiza con la emisión de los votos de castidad, pobreza y obediencia y con un acto por el que públicamente nos consagramos a Dios y nos entregamos al Inmaculado Corazón de María para el ministerio de la salvación. De este modo se expresa claramente que nosotros profesamos la vida religiosa en una Congregación fundada para desempeñar el ministerio de la palabra. Con esta entrega, aceptada por la Congregación y por la Iglesia, cada uno de los miembros participa de nuestra misión en el Pueblo de Dios.", "Capítulo XI", "LOS MISIONEROS EN FORMACION Y SU PREFECTO"], "subs": []}, {"n": 72, "text": "El período institucional es un tiempo destinado a la formación para poder cumplir nuestra misión.", "paras": ["La preparación para la profesión religiosa perpetua ha de prolongarse, al menos, por tres años.", "Además de esta formación básica, cada uno ha de prepararse específicamente para desempeñar el servicio correspondiente a su propio estado en la Iglesia, ya sea sacerdotal, diaconal o laical, procurando compartir todos el mismo Espíritu de Cristo, aunque de diverso modo según el don de gracia propio de cada uno <sup class=\"fn-ref\" data-fn=\"126\">[126]</sup>.", "Los Misioneros que se encuentran en el período de formación, cultiven con gran esmero y abran a la acción del", "Espíritu su corazón y su inteligencia, según nuestro propio plan de formación. Los Estudiantes cultiven, ante todo y con la mayor diligencia, las ciencias sagradas."], "subs": []}, {"n": 73, "text": "Para ser cada día más madura y profundamente conscientes de su propia vocación, aprendan por experiencia, en medio de los cambios del mundo, a vivir firme y constantemente unidos a Cristo, según nuestro carisma, tal como esta propuesto en estas Constituciones.", "paras": ["Sírvanse con confianza de la ayuda del Prefecto y del Director espiritual.", "Pidan incesantemente a Dios que los haga ministros idóneos de la divina palabra <sup class=\"fn-ref\" data-fn=\"127\">[127]</sup> para dar a conocer su nombre y propagar el Reino de los cielos por toda la tierra.", "Amen y reverencien con filial confianza a la Bienaventurada Virgen María, formadora de apóstoles."], "subs": []}, {"n": 74, "text": "Los Misioneros en formación deben adquirir un justo conocimiento de las condiciones sociales y políticas de los hombres y de los tiempos, de tal modo que juzgando sabiamente a la luz de la fe la situación del mundo y ardiendo en celo apostólico, puedan responder con mayor eficacia a las necesidades de los hombres.", "paras": [], "subs": []}, {"n": 75, "text": "Para determinar el ministerio al que cada uno se va a dedicar, ténganse en cuenta su inclinación, su talento y las necesidades de la Congregación y de la Iglesia. Durante el tiempo de formación se debe aprender y ejercitar prácticamente la técnica del apostolado.", "paras": [], "subs": []}, {"n": 76, "text": "La responsabilidad de la formación misionera, por su extraordinaria importancia, corresponde a toda la Congregación, a la Provincia y a la Comunidad formativa.", "paras": ["34"], "subs": []}, {"n": 77, "text": "El cargo de Prefecto es muy importante por su fin y por sus consecuencias. Pues si la conversión de un pecador es una obra grandemente meritoria, cuánto más lo será la formación de ministros idóneos que, a su debido tiempo, serán como instrumentos de la salvación de muchos. Aquel, pues, a quien se encomiende cargo de tanta importancia, instrúyase bien en su oficio y procure desempeñarlo con toda solicitud.", "paras": ["Ame igualmente a todos y conozca las necesidades de cada uno . En sus instrucciones expóngales la doctrina acerca de nuestra vida misionera. Con su ejemplo, más aún que con sus palabras, procure que todos asuman este modo de vida por íntimo convencimiento de fe.", "Capítulo XII", "LOS MISIONEROS HERMANOS, DIÁCONOS Y PRESBITEROS"], "subs": []}, {"n": 78, "text": "Todos los miembros de la Congregación, tendiendo unánimemente al mismo fin, según la gracia que les ha sido otorgada <sup class=\"fn-ref\" data-fn=\"128\">[128]</sup>, colaboran al bien de todo el Cuerpo. Cada uno, al vivir su vocación, debe apreciar grandemente y defender el propio don y las gracias concedidas a los demás por el mismo Espíritu <sup class=\"fn-ref\" data-fn=\"129\">[129]</sup>.", "paras": [], "subs": []}, {"n": 79, "text": "Los Misioneros Hermanos sepan que su carisma está marcado por el carácter laical. Desde el principio hubo laicos que abrazaron nuestra Congregación para ser, de un modo propio suyo, cooperadores de su misión.", "paras": ["Esta vocación a compartir la vida misionera de la Congregación, en calidad de laicos, debe ser el verdadero motivo de su consagración. Tengan, pues, en gran estima todas las notas", "características laicales y vívanlas según nuestro Espíritu misionero.", "Los Hermanos aportan, para bien de la misión de la Congregación, las preocupaciones y esperanzas del mundo de hoy, a ellos tan cercanas."], "subs": []}, {"n": 80, "text": "En la evangelización de todo el mundo, los Misioneros Hermanos tienen un quehacer de gran importancia: ser cooperadores de la verdad <sup class=\"fn-ref\" data-fn=\"130\">[130]</sup>. En esta obra, el apostolado de los laicos y el ministerio pastoral se completan mutuamente.", "paras": ["Renueven constantemente en sí mismos el Espíritu misionero, de modo que Cristo tenga siempre la primacía en todo"], "subs": []}, {"n": 81, "text": "Los Misioneros Diáconos, que por una específica vocación han sido ordenados para el Diaconado permanente, fortalecidos por la gracia sacramental, sirvan evangélicamente al Pueblo de Dios y a la propia Comunidad en el ministerio de la palabra, de la Liturgia y de la caridad, imitando a Jesús, que no vino a ser servido, sino a servir <sup class=\"fn-ref\" data-fn=\"133\">[133]</sup>.", "paras": ["Anuncien a todos los hombres la Buena Nueva de Jesús <sup class=\"fn-ref\" data-fn=\"134\">[134]</sup>, siguiéndole a El, a fin de que, llenos de gracia y fortaleza <sup class=\"fn-ref\" data-fn=\"135\">[135]</sup>, puedan dar eficaz testimonio de su gloria <sup class=\"fn-ref\" data-fn=\"136\">[136]</sup>. Por la fuerza del Espíritu Santo <sup class=\"fn-ref\" data-fn=\"137\">[137]</sup>, que es amor, consoliden entre los fieles el amor fraterno y susciten en ellos el sentido de justicia <sup class=\"fn-ref\" data-fn=\"138\">[138]</sup>."], "subs": []}, {"n": 82, "text": "Los Misioneros Presbíteros, que participan del ministerio de los Apóstoles, son enviados como eficaces colaboradores de los Obispos a predicar la palabra de Dios a todas las gentes con un estilo de vida evangélico y profético. Por eso, su peculiar deber es dedicarse, con Espíritu misionero, al bien de todas las Iglesias.", "paras": [], "subs": []}, {"n": 83, "text": "Configurados por medio del Sacramento del Orden con Cristo Sacerdote, cuya persona representan principalmente en la celebración de la Eucaristía, compartan su muerte y su vida, de modo que conviviendo con los hombres susciten en los demás el recuerdo de la presencia del Señor.", "paras": ["Y ya que han sido tomados de entre los hombres y constituidos en favor de ellos en todo lo que se refiere a Dios <sup class=\"fn-ref\" data-fn=\"139\">[139]</sup>, para que puedan servir con mayor eficacia a los mismos hombres, no permanezcan ajenos a su vida y vicisitudes, antes bien, convivan con ellos como con hermanos, haciéndose todo para todos <sup class=\"fn-ref\" data-fn=\"140\">[140]</sup>. Preocúpense pastoralmente de los enfermos y de aquellos que, por cualquier motivo, están marginados."], "subs": []}, {"n": 84, "text": "Pidan al Señor y procuren ejercitar aquella caridad pastoral que les haga estar dispuestos a dar su vida por los hermanos <sup class=\"fn-ref\" data-fn=\"141\">[141]</sup>. Por consiguiente, rueguen todos los días a Dios Padre por la Iglesia y por la salvación del mundo, sobre todo cuando celebren la Memoria del Señor y en el rezo de la Liturgia de las Horas. Estén siempre dispuestos a prestar los auxilios propios de su ministerio sacerdotal.", "paras": [], "subs": []}, {"n": 85, "text": "En la predicación y en cualquier acción pastoral, como verdaderos ministros de Dios <sup class=\"fn-ref\" data-fn=\"142\">[142]</sup>, guíense por el Espíritu de la Iglesia; tengan una gran fraternidad los unos para con los otros, trabajando gustosamente en equipo.", "paras": ["PARTE TERCERA", "EL GOBIERNO DE LA CONGREGACION", "Capítulo XIII", "LA CONSTITUCION ORGANICA DE LA CONGREGACION"], "subs": []}, {"n": 86, "text": "Nuestra Congregación, suscitada por el Espíritu Santo y erigida por la Iglesia, en virtud de la común vocación y misión de todos sus miembros, es una comunidad carismática e institucional, a semejanza de la misma Iglesia; y además se cuenta entre los Institutos clericales. Por tanto, tiene también todos aquellos elementos institucionales que son necesarios para mejor cumplir su misión.", "paras": ["Todos estos elementos y todas las normas de gobierno están al servicio de la caridad fraterna; al mismo tiempo, tienen como fin que la Congregación esté disponible para el servicio de la Iglesia universal."], "subs": []}, {"n": 87, "text": "Nuestra Congregación consta de Provincias, Delegaciones, Casas y Residencias.", "paras": [], "subs": []}, {"n": 88, "text": "Provincia es la unión de varias Comunidades locales, Casas, Residencias, que tienen entre sí una peculiar relación y una real comunicación. Constituye una parte de la Congregación bajo un mismo Superior que la gobierna con potestad ordinaria. Las Provincias pueden ser formadas o en formación.", "paras": ["Delegación Independiente es la misma unión entre sí de Comunidades locales, bajo un mismo Superior que la gobierna con potestad delegada por el Superior General.", "Se llama, en cambio, Delegación Dependiente cuando la gobierna un Superior con potestad delegada por el Superior Provincial."], "subs": []}, {"n": 89, "text": "Casa es la Comunidad constituida establemente en un lugar, en la cual se realiza la vida misionera, y consta al menos de tres miembros profesos que comparten la fraternidad bajo la autoridad de un superior que la gobierna con potestad ordinaria.", "paras": ["Residencia es una Comunidad sin la predicha estabilidad", ", constituida con el fin de ejercer algún sagrado ministerio o por otra razón, a tenor de nuestro derecho, y que es gobernada por un delegado del Superior Mayor."], "subs": []}, {"n": 90, "text": "Se llaman Misiones las Provincias, Delegaciones, Casas y Residencias que gozan de un régimen privilegiado.", "paras": [], "subs": []}, {"n": 91, "text": "La erección y supresión de las Casas está reservada al Superior General con su Consejo, oídas las personas interesadas y observadas las prescripciones del Derecho universal.", "paras": ["La erección, innovación y supresión de las Provincias y Delegaciones compete al Superior General con el voto deliberativo de los Consultores, habiendo oído a las personas y a los Gobiernos provinciales a quienes les afecta esta decisión."], "subs": []}, {"n": 92, "text": "Nuestra Congregación es gobernada por un Superior General, Superiores provinciales, Delegados y Superiores locales; cada uno con su Consejo.", "paras": ["Es dirigida por los Capítulos, ya sean Generales o Provinciales.", "Capítulo XIV", "PRINCIPIOS DE GOBIERNO"], "subs": []}, {"n": 93, "text": "La legislación y el estilo de nuestro gobierno deben responder a la naturaleza plenamente apostólica de la", "paras": ["Congregación y basarse en los criterios de la vida misionera. Debe lograrse una mutua relación y dependencia entre Comunidad y régimen en todas las estructuras de gobierno. Por eso, en el gobierno han de participar todos con una voluntad de cooperación y debe ser ejercido ordenadamente."], "subs": []}, {"n": 94, "text": "Nuestros Superiores son designados por nombramiento o por elección, de acuerdo con el derecho propio. Al comenzar a ejercer el cargo, emitirán la profesión de fe según la f6rmula aprobada por la Sede Apostólica, ante la Comunidad o, si fueron elegidos en Capítulo, ante el mismo Capítulo.", "paras": ["Los Superiores, expresando el amor con que Dios ama a los hermanos y con respeto a la persona humana, guíenles de tal manera que, ellos, en el cumplimiento de sus cargos y en el tomar las propias iniciativas, cooperen con obediencia activa y responsable, incluso en virtud del voto."], "subs": []}, {"n": 95, "text": "La autoridad se ha de ejercer ordenadamente. A quien se le haya encomendado algún cargo o asunto, déjesele libertad para que pueda cumplirlo íntegramente y sin interferencias, a no ser que el bien común exija la conveniente intervención del Superior inmediato o, según los casos, del Superior Mayor.", "paras": [], "subs": []}, {"n": 96, "text": "Ya que toda autoridad en nuestra Congregación se ejerce subordinadamente, cualquier Superior, si así lo aconseja una causa grave o lo exige el bien común, puede ser removido por aquel que lo nombró y, en caso de elección, por aquel que tiene el derecho de confirmación, observadas las normas del Derecho y oído el interesado.", "paras": [], "subs": []}, {"n": 97, "text": "Los Superiores Mayores, cada uno en su grado y dentro de su jurisdicción, gozan de potestad eclesiástica legislativa, ejecutiva y judicial conforme al derecho, tanto para el fuero externo como para el interno. El Superior Local goza de potestad de régimen solamente ejecutiva.", "paras": ["Asimismo, el Superior General, el Provincial, el de la Delegación en su grado y dentro de su jurisdicción, representan por derecho propio a toda la Congregación, a la Provincia y a la Delegación y hacen sus veces, y las pueden obligar y liberar tanto canónica y civilmente como moralmente, siempre según las normas del Derecho universal y del propio nuestro."], "subs": []}, {"n": 98, "text": "Las Provincias y las Casas compleméntense mutuamente por medio de la comunicación de personas y de bienes temporales, bajo la dirección de los Superiores, de modo que las que tienen más ayuden a las que padecen necesidad.", "paras": [], "subs": []}, {"n": 99, "text": "La Congregación considera los bienes temporales como medios que debe usar para su fin apostólico. Y dada su condición de bienes eclesiásticos, han de ser administrados según las normas del Derecho universal de la Iglesia y del propio nuestro, y con sentido de pobreza evangélica.", "paras": [], "subs": []}, {"n": 100, "text": "No sólo la Congregación, sino también las Provincias, las Delegaciones y las Casas son personas jurídicas y pueden, a tenor del Derecho, adquirir cualquier clase de bienes temporales, poseerlos, administrarlos y enajenarlos. La propiedad de bienes en la Congregación es subordinada.", "paras": [], "subs": []}, {"n": 101, "text": "Las personas jurídicas de la Congregación responderán solamente de aquellas deudas, obligaciones y contratos que hayan sido contraídos en nombre de las mismas en virtud de cargo o mandato, según las normas del Derecho universal y del propio nuestro. De todas las demás deberán responder moral, jurídica y económicamente ante la Congregación, la Iglesia y la autoridad civil aquellos que las han contraído inválida o ilícitamente.", "paras": ["Sin embargo, cada persona jurídica de la Congregación debe responder civilmente sólo de sus propias deudas, obligaciones y contratos.", "Capítulo XV", "EL GOBIERNO DE LA COMUNIDAD LOCAL"], "subs": []}, {"n": 102, "text": "La vida misionera se realiza de modo peculiar en la Comunidad local. En ella, en efecto, unidos fraternalmente, realizamos nuestra misión para el servicio del Pueblo de Dios.", "paras": [], "subs": []}, {"n": 103, "text": "El Superior local, signo de comunión y vínculo de unidad, está al frente de cada una de las Casas de la Congregación para el servicio de la misión. En las Residencias estos oficios los desempeña un Delegado, designado por el Superior.", "paras": ["Es necesario que el Superior sea verdaderamente espiritual y lleno de celo por las almas, muy adicto a la Congregación y dotado de discreción y del conveniente talento."], "subs": []}, {"n": 104, "text": "El Superior, que debe impulsar y dirigir la Comunidad a una intensa vida y actividad misionera, presta su servicio:", "paras": ["y suministrándoles la palabra de Dios, con la ayuda de los hermanos, o de otros llamados para ello, según la oportunidad."], "subs": ["Promoviendo con gran caridad el bien de los hermanos.", "Buscando y discerniendo juntamente con los demás la voluntad de Dios sobre la Comunidad y sobre cada uno de los hermanos; y tomando él mismo la decisión oportuna, que obligue a la Comunidad, cuando no obstante la búsqueda de la voluntad de Dios o el intento de discernimiento , no se ha llegado a un acuerdo.", "Decidiendo personalmente, cuando convenga, en asuntos necesarios; adviértalo, sin embargo, a la Comunidad en cuanto pueda hacerlo y parezca oportuno.", "Confortando a los hermanos con su ejemplo y con sinceras palabras de aliento y de alabanza y guiándoles, incluso con el aviso y corrección si fuera necesario, a que permanezcan fieles a sus promesas y a las demás obligaciones de nuestra vida;", "Manteniendo la Comunidad en estrecha unión con el Gobierno de la Provincia o Delegación, con las demás Comunidades de la misma Provincia o Delegación e incluso con las de la Congregación.", "Teniendo la Comunidad disponible para el servicio de la Iglesia particular, prestando también colaboración a las asocia
