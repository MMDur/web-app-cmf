ciones de laicos."]}, {"n": 105, "text": "El Superior representa por derecho propio a la Casa o Comunidad y hace sus veces en todos los actos jurídicos, ya canónicos, ya civiles, según las normas del Derecho universal y del propio nuestro.", "paras": [], "subs": []}, {"n": 106, "text": "El modo de designar los Superiores locales lo determina el Capítulo Provincial en cada una de las Provincias. La designación puede hacerse o por nombramiento del Superior Provincial con su Consejo, o por elección hecha por la Comunidad. En ambos casos se ha de proceder a tenor del Derecho.", "paras": ["En las Delegaciones Independientes y para cada una de las Casas Generalicias, el modo de designación lo determina el Gobierno General.", "El nombramiento o la elección del Superior local es para un trienio, terminado el cual podrá ser designado para un segundo trienio y, por razones especiales, para un tercer trienio en la misma Casa, según las normas del Derecho."], "subs": []}, {"n": 107, "text": "En todas las Casas habrá también un Vicario y un Ecónomo. Para determinar el modo de designarlos se sigue el mismo procedimiento que para los Superiores locales. Ambos, a tenor del Derecho, ejercen el oficio de Consultores y junto con el Superior, han de asumir aquellos cometidos propios del cargo", "paras": ["que, ni fácil ni oportunamente, pueden ser ejercidos por toda la Comunidad. Además, han de ayudar al Superior en la tarea de fomentar la vida y misión de la Comunidad."], "subs": []}, {"n": 108, "text": "Corresponde al Vicario suplir al Superior cuando éste cesa, o esté ausente o impedido. El principal deber del Ecónomo es procurar con Espíritu de servicio el bien de los hermanos y de la misión de la Comunidad, cuidando de los bienes temporales de la misma Comunidad; con este fin puede hacer gastos y realizar actos de administración ordinaria. Observe fielmente la pobreza, evitando al mismo tiempo la prodigalidad y la tacañería.", "paras": [], "subs": []}, {"n": 109, "text": "En las Misiones, el Superior Mayor con su Consejo, después de haber oído a los miembros de las mismas, determinará el modo de designación del Superior, Vicario y Ecónomo. El Superior local puede desempeñar el cargo de Ecónomo. A veces, las Casas pueden constituirse y regirse al modo de las Residencias.", "paras": [], "subs": []}, {"n": 110, "text": "La Reunión Plenaria, que nace de la naturaleza misma de la Comunidad local, la constituyen todos los hermanos profesos de la Comunidad. En ella la Comunidad participa y se responsabiliza en la realización de los compromisos y en la orientación, evaluación y discernimiento de todo aquello que afecta a su propio ser y hacer. La misma Comunidad determine el modo y la frecuencia de esta Reunión, que ha de tenerse por lo menos una vez al mes.", "paras": ["Capítulo XVI", "EL GOBIERNO DE LA COMUNIDAD PROVINCIAL"], "subs": []}, {"n": 111, "text": "Las Provincias y Delegaciones, que se denominan Organismos Mayores, forman parte de una única Congregación. De este modo, se comparte ordenadamente la misión universal de la Congregación y se obtiene más eficazmente la unión de cada una de las Comunidades entre sí y con la Congregación. A", "paras": ["este fin, se ponen al frente de las Provincias y Delegaciones, Superiores que son vínculo de unidad y al mismo tiempo de comunión con toda la Congregación bajo la guía del Superior General.", "Art. 1. El Superior Provincial y su Consejo"], "subs": []}, {"n": 112, "text": "El Superior Provincial, además de tener los requisitos exigidos por el Derecho universal, ha de ser varón escogido, lleno de celo apostólico y de probada fidelidad a la Iglesia y a la Congregación, a la cual ha de estar unido por la profesión perpetua al menos desde cinco años antes.", "paras": [], "subs": []}, {"n": 113, "text": "Deberes del Superior Provincial son:", "paras": [], "subs": ["Mantener la Provincia disponible al servicio de la Iglesia, principalmente en su demarcación territorial y según la pastoral de conjunto, pero conservando la unidad de carisma con toda la Congregación.", "Ser propulsor y guía de la vida misionera en cada una de las Comunidades y corregir con caridad los abusos que tal vez se hubieran introducido.", "Fomentar con apropiadas estructuras de comunicación y participación la responsabilidad de las Comunidades en la misión de la Provincia.", "Conocer bien a los miembros de su Provincia: para ello, visitar frecuentemente cada una de las Casas, además de hacer la visita canónica por lo menos cada dos años.", "Procurar con empeño que toda la Provincia se responsabilice y se comprometa en la promoción vocacional y que se ponga la máxima diligencia en el perfeccionamiento de los formandos y de los demás religiosos.", "Cumplir las exigencias de una plena comunión con el Superior General y ejecutar con exactitud cuanto él le encargue.", "Promover entre sus religiosos el servicio misionero de la palabra, ejercido incluso por escrito, y concederles la necesaria licencia para que puedan publicar, según las normas de derecho, escritos sobre cuestiones de religión o costumbres."]}, {"n": 114, "text": "El Superior Provincial, previa consulta a todos los miembros de la Provincia, es elegido en Capítulo Provincial por mayoría absoluta de votos, según las normas de nuestro Derecho, y es confirmado por el Superior General con su Consejo.", "paras": ["El Gobierno General tiene facultad, para conceder a alguna Provincia, cuyo Capítulo expresamente lo pida, poder designar el Superior Provincial de otro modo, según las normas de nuestro Derecho.", "Tanto en las Provincias formadas como en las Provincias en formación, el Superior Provincial es elegido o designado para el tiempo que determina nuestra legislación."], "subs": []}, {"n": 115, "text": "El Superior Provincial es ayudado por sus Consultores, con los cuales trata frecuentemente sobre el estado de la Provincia y consulta los asuntos de mayor importancia. Los Consultores expresan su participación en el gobierno, sobre todo, con el voto deliberativo o consultivo según los casos. Procuren asistir en todo al Superior Provincial, quedando a salvo la libertad de avisarle y aun de informar al Superior General, si el caso lo exigiera.", "paras": [], "subs": []}, {"n": 116, "text": "Los Consultores Provinciales, que han de ser al menos dos, son elegidos o designados del mismo modo que el Superior Provincial, a norma de nuestro Derecho, y siguen su misma suerte en la duración del cargo.", "paras": [], "subs": []}, {"n": 117, "text": "El Superior Provincial escogerá entre los Consultores designados al Vicario, quien ocupara entre éstos el primer lugar. Y además de actuar por delegación en lo que el Superior Provincial le encomiende, el Vicario hace las veces del mismo Superior cuando éste cesa o está impedido o ausente.", "paras": ["El Ecónomo Provincial, aun cuando no fuera Consultor, es elegido o designado del mismo modo que los Consultores. Sus cualidades derechos y deberes deben ser, en el ámbito de la Provincia, los mismos que se establecen para el Ecónomo General.", "El Secretario Provincial es designado por el Superior Provincial, según las normas de nuestro Derecho.", "Art. 2 El Superior de la Delegación y su Consejo"], "subs": []}, {"n": 118, "text": "Los Superiores de las Delegaciones Independientes deben tener las mismas cualidades que los Superiores Provinciales. Son nombrados para un determinado período de tiempo por el Superior General con su Consejo. Sus facultades habituales están determinadas en nuestro Derecho, pero en el uso de las mismas dependen de un modo especial del Superior delegante, quien además les podrá conceder otras según su criterio.", "paras": [], "subs": []}, {"n": 119, "text": "Los Superiores de las Delegaciones Dependientes, cuya circunscripción constituye parte de alguna Provincia, son nombrados para un determinado período de tiempo por el Superior Provincial con su Consejo. El nombramiento ha de ser aprobado por el Superior General. Sus derechos y deberes se determinan en el mismo nombramiento.", "paras": [], "subs": []}, {"n": 120, "text": "El Superior de la Delegación tiene dos Consultores, que pueden ejercer el cargo de Ecónomo y Secretario. Son nombrados del mismo modo que el Superior Delegado.", "paras": ["Art. 3. El Superior de la Misión y su Consejo"], "subs": []}, {"n": 121, "text": "El Superior de una Provincia o Delegación que se denomina «Misión», como también sus Consultores y Oficiales, son designados según las mismas normas. Pero tratándose de Provincias, si así lo requiere el bien de la Misión, por derecho excepcional, pueden también ser nombrados por el Superior General con su Consejo, habiendo oído a los miembros de la Misión.", "paras": ["Art. 4. El Capítulo Provincial"], "subs": []}, {"n": 122, "text": "El Capítulo Provincial es el órgano de gobierno que representa a la Provincia y que expresa la participación, la corresponsabilidad y la comunión de la Provincia entera. Realícese con el mayor cuidado, de tal modo que con su ayuda la Comunidad Provincial consiga el máximo e íntimo vigor de la vida misionera, se adapte y se mantenga abierta a la Comunidad General del Instituto.", "paras": [], "subs": []}, {"n": 123, "text": "El Capítulo Provincial será convocado por el Superior Provincial, habiendo oído al Superior General sobre el tiempo y lugar de su celebración. El Capítulo Ordinario se celebrará cuando haya de ser elegido el Superior Provincial. El Extraordinario, cuantas veces lo requiera el bien espiritual o temporal de la Provincia, a juicio del Gobierno Provincial, aprobado por el Superior General con sus Consultores.", "paras": [], "subs": []}, {"n": 124, "text": "Asisten al Capítulo Provincial:", "paras": [], "subs": ["El Superior General o su Delegado, como Presidente.", "El Superior Provincial con los Consultores, el Ecónomo y el Secretario, aunque no sean Consultores.", "Los Superiores locales.", "Tantos Delegados cuantos Superiores locales hay en la Provincia; estos Delegados son elegidos según se establece en nuestro Derecho.", "Los designados por el Superior Provincial con su Consejo, según el numero que le haya concedido el Capítulo Provincial anterior."]}, {"n": 125, "text": "El Capítulo Provincial:", "paras": [], "subs": ["Examina el estado de la Provincia para determinar el programa de acción en el futuro.", "Aplica las normas y directrices del Capítulo General acerca de la vida misionera, según las peculiares circunstancias de lugares y personas, teniendo en cuenta la pastoral de conjunto con el clero diocesano y religioso.", "Elige al Superior Provincial, a sus Consultores y al Ecónomo, o determina otro modo de designarlos conforme a nuestro Derecho.", "Establece el modo como han de designarse los Superiores, Vicarios y Ecónomos locales, según las opciones previstas en nuestro Derecho."]}, {"n": 126, "text": "El Capítulo Provincial es Capítulo en sentido verdadero y propio, y sus decisiones tienen fuerza jurídica, pero necesitan la aprobación del Superior General con su Consejo.", "paras": [], "subs": []}, {"n": 127, "text": "Conviene que los Superiores Mayores, en el tiempo y modo convenientes, convoquen Asambleas de superiores y de otros miembros y aun de toda la Provincia con su Consejo Provincial o con el de la Delegación.", "paras": ["Capítulo XVII", "LOS VISITADORES"], "subs": []}, {"n": 128, "text": "La Visita de los Superiores Mayores, como acto extraordinario de gobierno, está establecida por el Derecho universal y por el nuestro para reforzar el vínculo de unión en la Congregación y para dirigir a su fin su vida y misión.", "paras": [], "subs": []}, {"n": 129, "text": "Tome parte el Visitador en la vida ordinaria con los hermanos, procure conocer sus deseos y dificultades, escúchelos de buen grado y, de este modo. promueva la unánime cooperación de todos al bien del Instituto y de la Iglesia.", "paras": [], "subs": []}, {"n": 130, "text": "En las Visitas, convóquese la reunión plenaria de la Comunidad para fomentar la unión y la fraternidad, para definir e", "paras": ["ilustrar la misión propia y singular de la Comunidad, para examinar si se han cumplido o no los planes anteriores, y determinar los futuros proyectos de vida y de actividades y, finalmente, para estimular las mentes y voluntades de todos a la fidelidad."], "subs": []}, {"n": 131, "text": "Las disposiciones de los Visitadores constituyen el final del diálogo de la Visita. Con ellas, además de los avisos y correcciones que tal vez deban hacerse, confirmen a todos los hermanos en el gozo de la vocación misionera y ofrezcan a la Comunidad nuevos estímulos y sugerencias pastorales.", "paras": [], "subs": []}, {"n": 132, "text": "El Superior General hará la Visita de las Casas y Residencias de la Congregación, personalmente o por medio de un Delegado, con esmerada solicitud, al menos una vez cada seis años. Con mayor frecuencia visitará él mismo personalmente, en cuanto le sea posible, la Curia y las Casas de formación de las Provincias.", "paras": [], "subs": []}, {"n": 133, "text": "El Superior Mayor legítimamente impedido para hacer las Visitas establecidas en las Constituciones, podrá delegar a otro miembro idóneo del mismo Organismo Mayor, habiendo oído a su Consejo.", "paras": [], "subs": []}, {"n": 134, "text": "Además de las Visitas «de oficio», es conveniente que los Superiores Mayores hagan de vez en cuando otras visitas, especialmente a las Casas de formación.", "paras": ["Capítulo XVIII", "EL GOBIERNO DE LA COMUNIDAD GENERAL"], "subs": []}, {"n": 135, "text": "Nuestra Congregación expresa un carisma del Espíritu, reconocido por la Iglesia, por el que todos nosotros hemos sido llamados a realizar ordenadamente una misión universal. Pero una Comunidad de misión requiere una constitución orgánica, a fin de que pueda mantenerse mejor la comunión de todos sus", "paras": ["miembros y se coordinen del modo más adecuado las iniciativas y proyectos de cada uno.", "Art. 1. El Superior General"], "subs": []}, {"n": 136, "text": "Para que toda la Congregación realice fielmente su propia misión, es gobernada por un Superior General, que debe poner cuidado especialísimo en mantenerla siempre pronta para el servicio de la Iglesia y de todo el género humano, según las necesidades de tiempos y lugares. Pues él es signo de comunión y vínculo de unidad para toda la Congregación, en la que ejerce la suprema autoridad con potestad ordinaria.", "paras": [], "subs": []}, {"n": 137, "text": "El que ha de ser elegido Superior General, además de cumplir los requisitos exigidos por el Derecho universal, debe ser un hombre que haya dado pruebas de prudencia, talento, celo apostólico, amor a la Congregación, observancia de las Constituciones y ejercicio de las virtudes. Además, ha de llevar al menos cinco años de profeso perpetuo.", "paras": [], "subs": []}, {"n": 138, "text": "Los deberes del Superior General son:", "paras": [], "subs": ["Dirigir eficazmente la Congregación a su fin apostólico y fomentar en ella el vigor de la vida religiosa.", "Alentar el Espíritu de comunión fraterna en la vida y en el ministerio de la Congregación y promover entre todos el trabajo en equipo.", "Llevar a la práctica la mente y voluntad del Capítulo General e iluminar nuestro carisma.", "Procurar la conservación e incremento de la Congregación. Promover en todas partes las vocaciones y velar por la formación de los nuestros.", "Preocuparse con Espíritu verdaderamente apostólico por la extensión de la Congregación, principalmente en las misiones.", "Fomentar por medio de apropiadas estructuras de comunicación y participación la responsabilidad de los Superiores Mayores en la misión tanto de la Provincia como de toda la Congregación.", "Promover, cuanto le sea posible, el bien espiritual y temporal de todos los miembros de la Congregación, y excardinarlos o incardinarlos según las necesidades de la misión del Instituto.", "Personalmente o por medio de Delegados realizar las Visitas generalicias y presidir los Capítulos Provinciales.", "Tratar por sí mismo o por medio de otro los asuntos de la Congregación ante la Sede Apostólica."]}, {"n": 139, "text": "El Superior General es elegido en Capítulo General por mayoría absoluta de votos para seis años, transcurridos los cuales podrá ser reelegido para otro sexenio también por mayoría absoluta de votos. Para que pueda ser elegido para un tercer sexenio consecutivo se requieren los dos tercios de los votos.", "paras": [], "subs": []}, {"n": 140, "text": "La elección del Superior General se hará en forma verdaderamente canónica y del modo legítimamente establecido. Realizada la elección, el Presidente del Capítulo anunciara el nombre del electo y, con la f6rmula prescrita, lo declarará elegido. Seguidamente prestarán todos reverencia al Superior General.", "paras": [], "subs": []}, {"n": 141, "text": "Si lo que Dios no permita, fuera necesario deponer de su cargo al Superior General, por resultar su gobierno muy perjudicial a la Congregación, a juicio del Vicario y de los demás Consultores Generales, expóngase el caso a la Sede Apostólica y antes de reunir el Capítulo General para deponer al Superior General, persuádasele con bondad  a que renuncie espontáneamente a su cargo.", "paras": [], "subs": []}, {"n": 142, "text": "Vacante el cargo de Superior General por su fallecimiento, renuncia o destitución, el Vicario General o, en su", "paras": ["defecto, el primero que le sigue en el orden de los Consultores Generales, convocará el Capítulo General en la forma legítimamente establecida para elegir al Superior General.", "Art. 2 El Vicario y los demás Consultores Generales"], "subs": []}, {"n": 143, "text": "Los Consultores Generales son verdaderos colaboradores del Superior General, constituyen con él el Gobierno General de la Congregación y expresan la fraternidad y la misión apostólica de todo el Instituto.", "paras": [], "subs": []}, {"n": 144, "text": "Para el cargo de Consultor General puede ser elegido quien haya emitido los votos perpetuos y se distinga especialmente por su prudencia, Espíritu misionero, amor a la Iglesia y a la Congregación y aptitud para lograr y mantener la unidad de acción con los compañeros de gobierno.", "paras": [], "subs": []}, {"n": 145, "text": "Los Consultores Generales, que siempre serán al menos dos, se eligen en Capítulo General, de entre las diversas partes del mundo donde se halla establecida la Congregación, en forma verdaderamente canónica, en el número y del modo legítimamente establecidos. Son elegidos por el mismo tiempo para el que es elegido el Superior General y cesan con él. Pueden, no obstante, ser reelegidos. Cuando faltare alguno de ellos, debe ser nombrado otro por el Superior General y los restantes Consultores.", "paras": [], "subs": []}, {"n": 146, "text": "El Superior General nombra como Vicario suyo uno de los Consultores Generales. Este es el primero entre los mismos Consultores y, además de actuar por delegación en lo que el Superior General le encomiende, hace sus veces cuando éste cesa, o esté ausente o impedido.", "paras": [], "subs": []}, {"n": 147, "text": "Los deberes especiales de los Consultores Generales son:", "paras": [], "subs": ["Tratar con el Superior General los asuntos de mayor importancia y ayudarle en el gobierno de la Congregación.", "Llevar a efecto la programación señalada por el Capítulo General, o preparada por el mismo Gobierno General.", "Impulsar y animar los Organismos Mayores y sus federaciones, como también, cuando convenga, cada una de las Comunidades.", "Revisar y evaluar la marcha de la vida misionera de la Congregación y al mismo tiempo señalar lo más urgente y prioritario en el cumplimiento de nuestra misión.", "Con la debida reverencia, avisar al Superior General, ya privada, ya colectivamente, acerca de las cosas que tal vez haya realizado menos rectamente."]}, {"n": 148, "text": "Los Consultores Generales expresan su participación en el gobierno sobre todo con el voto deliberativo o consultivo. El voto deliberativo se requiere en el Consejo General siempre que expresamente se dice en el Derecho universal o en el propio nuestro o cuando el asunto de que se trata se encomienda para resolverlo al Superior General con su Consejo o también al Gobierno General.", "paras": ["El Superior General está obligado a pedir el voto consultivo a sus Consultores sólo cuando se dice expresamente en el Derecho universal o en el propio. Se aconseja, no obstante, que lo pida en los casos importantes y oscuros que pueden presentarse.", "Art. 3. Los Oficiales Generales"], "subs": []}, {"n": 149, "text": "El Ecónomo y el Secretario son Oficiales Generales de la Congregación.", "paras": [], "subs": []}, {"n": 150, "text": "El Ecónomo General es elegido por el Capítulo General y se cuenta entre los Consultores Generales. Sus deberes son:", "paras": [], "subs": ["Administrar los bienes temporales de la Congregación con Espíritu de justicia, de caridad y de pobreza, para el servicio de toda la Congregación y de sus miembros bajo la dirección del Superior General.", "Emplear las donaciones y legados para los fines designados por los bienhechores o, si falta esa designación, emplearlos conforme a las normas que le haya dado el Superior General o, si el caso lo requiere, el Superior General con su Consejo.", "Dar cuenta, al menos una vez al año, al Gobierno General de la administración de los bienes de la Congregación, de su estado y de las rentas y del empleo de las mismas."]}, {"n": 151, "text": "El Secretario General puede ser designado por el Superior General de entre los Consultores. Para que pueda ser nombrado Secretario General un miembro de la Congregación que no pertenece al Consejo General, el Superior General necesita el consentimiento de sus Consultores. El Secretario debe estar dotado de diligencia, prudencia y amabilidad.", "paras": [], "subs": []}, {"n": 152, "text": "Bajo la dirección del Gobierno General, también se pueden constituir, en conformidad con nuestro derecho, otros cargos para el servicio de toda la Congregación.", "paras": ["Art. 4. El Capítulo General"], "subs": []}, {"n": 153, "text": "El Capítulo General -en obediencia al Espíritu y con plena fidelidad a nuestro carisma misionero, reconocido por la Iglesia- es la autoridad suprema en la Congregación, como servidor del carisma para los hermanos. Es también la suprema expresión de la comunión de vida y de misión de todo el Instituto. Representa auténticamente a toda la Congregación y expresa colegialmente la participación y el cuidado de todos los miembros respecto de la vida de la Congregación y de su acción en la Iglesia.", "paras": [], "subs": []}, {"n": 154, "text": "El Capítulo General es convocado por el Superior General. El Ordinario se celebra siempre que se haya de proceder a la elección del Superior General. El Extraordinario cuando, a juicio del Superior General y de sus Consultores, se estime necesario para la misión, crecimiento, dilatación o renovación de", "paras": ["la Congregación, o por cualquier otra causa muy beneficiosa para la misma."], "subs": []}, {"n": 155, "text": "El Capítulo General, con la mente fija en el Señor y en las aspiraciones de toda la Comunidad, trata de los asuntos que conciernen a la Congregación entera. Por tanto:", "paras": [], "subs": ["Examina con toda diligencia el estado de la Congregación y promueve solícitamente su adecuada renovación, ofreciendo programas concretos de acción.", "Aplica a la Congregación la doctrina de la Iglesia sobre la vida religiosa y el apostolado.", "Ejerce función magisterial acerca del patrimonio espiritual de la Congregación.", "Interpreta de modo declarativo las dudas y dificultades que puedan surgir sobre el sentido y observancia de las Constituciones.", "Promulga los decretos y disposiciones que parezcan necesarios u oportunos.", "Corresponde también al Capítulo General elegir al Superior General y a sus Consultores."]}, {"n": 156, "text": "Asisten al Capítulo General:", "paras": ["ANOTACIONES ACERCA DE ESTAS CONSTITUCIONES"], "subs": ["El Superior General como Presidente, los Consultores y los Oficiales Generales.", "Los Superiores Provinciales.", "Un Vocal por cada Provincia y un Vocal por cada Delegación Independiente.", "Cuantos en el precedente Capítulo General hayan sido fijados para guardar la debida proporción en la representación de los miembros de cada Provincia.", "Cuantos haya determinado el anterior Capítulo General para la representación de las Casas Generalicias y cuantos haya concedido designar al Superior General con su Consejo."]}, {"n": 157, "text": "La Sede Apostólica se reserva la interpretación auténtica de estas Constituciones. Para cambiar las normas de las mismas es necesaria una decisión del Capítulo General por las dos terceras partes de los votos y a la cual siga después la aprobación de la Sede Apostólica.", "paras": [], "subs": []}, {"n": 158, "text": "Los miembros de la Congregación estamos obligados a las prescripciones de estas Constituciones para progresar en el camino del Señor y en el servicio del Reino de Dios. La fuerza de esta obligación se ha de deducir de la misma naturaleza de cada prescripción. La Iglesia nos exhorta encarecidamente a todos a que busquemos en las Constituciones el vigor de nuestra vida misionera.", "paras": ["FORMULA DE LA PROFESION", "CON LA QUE NOS CONSAGRAMOS A DIOS Y NOS INCORPORAMOS A LA CONGREGACION"], "subs": []}, {"n": 159, "text": "Respondiendo a la vocación divina, yo,\t,", "paras": ["quiero procurar con el mayor empeño la gloria de Dios, dedicarme plenamente a El y seguir más de cerca a Cristo Señor, como los Apóstoles, en el ministerio de la salvación de los hombres de todo el mundo.", "Por eso, en presencia de la familia de Dios aquí reunida, por tus manos,\t, me consagro en el Espíritu", "Santo a Dios Padre por su Hijo Jesucristo y me entrego en especial servicio al Inmaculado Corazón de la Bienaventurada Virgen María en orden a conseguir el objeto para el que esta Congregación ha sido constituida en la Iglesia.", "Por tanto, hago voto a Dios de CASTIDAD, POBREZA y OBEDIENCIA para siempre (o por un año, por un trienio) y me comprometo a vivir en la comunidad de vida apostólica de esta Congregación de Misioneros Hijos del Inmaculado Corazón de María, según sus Constituciones, que observaré con todo el cuidado posible.", "Os ruego, pues, hermanos, que os dignéis ser testigos de mi Profesión.", "Orad por mí, para que en el servicio de Dios y de la Iglesia sea fiel al espíritu del Fundador, San Antonio María Claret, y alcance la caridad perfecta.", "AMEN"], "subs": []}], "footnotes": {"1": "Cf. Jn 3,16-17; 17,3.", "2": "Cf. Mt 1,20; Gál 4,4.", "3": "Cf. Le 4,18; 1s 61,1-2.", "4": "Cf. Le 2,49.", "5": "Cf. Mt 4,23; 9,35; Me 1,14.", "6": "Me 3,13-14.", "7": "Cf. 1 Cor 15, 13-15; Heh 2,32; 4,2.", "8": "Cf. Me 16,15.", "9": "Cf. Mt 5,48; Le 6,36.", "10": "Cf. Jn 13,14-17; 13,34-35", "11": "Cf. Mt 5,1-12; Le 6,20-23.", "12": "Cf. Gá1 6,14.", "13": "Cf. Jn 10,30; 17,20-22.", "14": "Cf. Heh 4,32. [15] Cf. Me 12,29-31.", "16": "Cf. Rom 5,5.", "17": "Cf. 1 Cor 10,16-17.", "18": "Cf. 1 Cor 11,7; 15,49; Col. 3,10.", "19": "Cf. Ef 5.30. [20] Jn 15,12.", "21": "Cor 13,4-7.", "22": "Cf. 1 Cor 12,25; Gál 6,2.", "23": "Cf. 1 Cor 4,4.", "24": "Cf. Ef 4, 3.", "25": "Cf. 1 Cor 12,7.", "26": "Cf. Mt 10,40-42; Heb 13,2.", "27": "Cf. Le 10,5.", "28": "Cf. Eeel 3,14; Prov 15,5.", "29": "Cf. 2 Cor 4.16. [30] Cf Mt 25,32.36.39", "31": "Cf. Mt 19,11-12.", "32": "Cf. Le 1,34-37.", "33": "Cf. 1 Cor 7,7. [34] Cf. 1 Cor 7,32-35", "35": "Cf Mt 19,29; Le 20,35-38.", "36": "Cf. Jn 1,13.", "37": "Cf. 1 Cor 4,15", "38": "Cf. Ef 6,12", "39": "Cf Le 14,26; 18,29-30.", "40": "Cf. 2 Cor 8,9", "41": "Cf. Le 9,58. [42] Cf Le 1,48-55", "43": "Cf. Le 5,11", "44": "Cf. Mt 6,33", "45": "Cf. Mt 5,3.", "46": "Cf. Mt 10,7-10; Me 6,7-9.", "47": "Cf Heh 2, 44; 4,32.", "48": "Cf 2 Ts 3 7-14; 1 Cor 4,12.", "49": "Cf. 1 Cor 9,15-18; 2 Cor", "50": "Le 12,31.", "51": "Cf. Jn 4,34; 5,30; Heb 10,7.", "52": "Cf. Le 1 73, 78]}, {"term": "VOCACIONES", "desc": "a todos y a eada uno ineumbe el deber de fomentarlas, <a href=\"#\" class=\"idx-link\" data-art=\"58\">58</a>; promuévalas por todas partes el Superior General, <a href=\"#\" class=\"idx-link\" data-art=\"138\">138</a>,<a href=\"#\" class=\"idx-link\" data-art=\"4\">4</a>; la mejor propaganda es el testimonio de la vida, <a href=\"#\" class=\"idx-link\" data-art=\"58\">58</a>; proeure el Provineial que todos se responsabilieen en la promoeión voeaeional, <a href=\"#\" class=\"idx-link\" data-art=\"1\">1</a> <a href=\"#\" class=\"idx-link\" data-art=\"1\">1</a> <a href=\"#\" class=\"idx-link\" data-art=\"3\">3</a>, <a href=\"#\" class=\"idx-link\" data-art=\"5\">5</a>.", "nums": [1, 3, 4, 5, 58, 138]}, {"term": "VOTO", "desc": "la participación en el gobierno se expresa por el v. eonsultivo o deliberativo, <a href=\"#\" class=\"idx-link\" data-art=\"148\">148</a>; euándo se requiere en el Gobierno General, <a href=\"#\" class=\"idx-link\" data-art=\"148\">148</a>; en el Gobierno Provineial, <a href=\"#\" class=\"idx-link\" data-art=\"115\">115</a>; en el Gobierno Loeal, ef. <a href=\"#\" class=\"idx-link\" data-art=\"107\">107</a>.", "nums": [107, 115, 148]}, {"term": "VOTOS", "desc": "nos entregan a Dios, <a href=\"#\" class=\"idx-link\" data-art=\"5\">5</a>; eon ellos pretendemos eonfigurarnos eon Cristo, <a href=\"#\" class=\"idx-link\" data-art=\"39\">39</a>; objeto del voto de eastidad, <a href=\"#\" class=\"idx-link\" data-art=\"22\">22</a>; del de pobreza, <a href=\"#\" class=\"idx-link\" data-art=\"27\">27</a>; del de obedieneia, <a href=\"#\" class=\"idx-link\" data-art=\"28\">28</a>; Jesús y María, modelo y ejemplar en su eumplimiento, <a href=\"#\" class=\"idx-link\" data-art=\"20\">20</a>, <a href=\"#\" class=\"idx-link\" data-art=\"24\">24</a>, <a href=\"#\" class=\"idx-link\" data-art=\"28\">28</a>; eon su emisión nos ineorporamos a la Congregación, <a href=\"#\" class=\"idx-link\" data-art=\"70\">70</a>, <a href=\"#\" class=\"idx-link\" data-art=\"7\">7</a> <a href=\"#\" class=\"idx-link\" data-art=\"1\">1</a>; en la fórmula de profesión, <a href=\"#\" class=\"idx-link\" data-art=\"159\">159</a>; ejereítense en su práetiea los novieios, <a href=\"#\" class=\"idx-link\" data-art=\"61\">61</a>; v. Pobreza, Castidad, Obedieneia.", "nums": [1, 5, 7, 20, 22, 24, 27, 28, 39, 61, 70, 159]}]}, "ca": {"articles": [{"n": 1, "text": "La nostra Congregació de Missioners fou fundada per l’Arquebisbe sant Antoni Maria Claret a Vic, el 16 de juliol de 1849, i fou aprovada per Pius IX el 22 de desembre del 1865. Ens anomenem Fills de l’Immaculat Cor de Maria o Missioners Claretians.", "paras": [], "subs": []}, {"n": 2, "text": "L’objectiu de la nostra Congregació és cercar en tot la glòria de Déu, la santificació dels seus membres i la salvació de tota la humanitat, d’acord amb el nostre carisma missioner a l’Església.", "paras": [], "subs": []}, {"n": 3, "text": "Nostre Senyor Jesucrist fou enviat pel Pare<sup class=\"fn-ref\" data-fn=\"2\">[2]</sup> i es féu home, Fill de la Verge Maria, per obra de l’Esperit Sant<sup class=\"fn-ref\" data-fn=\"3\">[3]</sup>. El mateix Esperit Sant va ungir-lo perquè portés la Bona Nova als pobres<sup class=\"fn-ref\" data-fn=\"4\">[4]</sup>. Consagrat plenament als interessos del seu Pare<sup class=\"fn-ref\" data-fn=\"5\">[5]</sup> , va predicar la Bona Nova del Regne<sup class=\"fn-ref\" data-fn=\"6\">[6]</sup>.", "paras": ["Volent-se associar els homes en aquesta obra de salvació, va convocar els qui Ell va voler i constituí els Dotze perquè s’estiguessin amb Ell i per enviar-los a predicar<sup class=\"fn-ref\" data-fn=\"7\">[7]</sup>. Un cop acomplerta en Ell mateix l’obra de la nostra redempció, va fundar la seva Església com a Sagrament universal de salvació i va enviar els apòstols i d’altres a donar testimoniatge de la resurrecció<sup class=\"fn-ref\" data-fn=\"8\">[8]</sup>.", "Alguns d’aquests, sota el guiatge de l’Esperit Sant, van començar d’actualitzar en l’Església el tipus de vida que Jesús havia triat per a Ell, i donaven així testimoniatge a favor de l’Evangeli."], "subs": []}, {"n": 4, "text": "També a nosaltres, Fills de l’Immaculat Cor de Maria, cridats com els apòstols, se’ns ha fet el do de seguir el Crist, per a conviure amb Ell i anunciar la Bona Nova del Regne d’un cap de món a l’altre<sup class=\"fn-ref\" data-fn=\"9\">[9]</sup>.", "paras": ["Això vol dir que el seguiment de Crist –tal com l’Evangeli ens el proposa– és per a nosaltres la regla suprema. Vet aquí per què escoltem amb gran docilitat la Paraula del Senyor. Aquella Paraula amb què el Senyor ens crida a ser bons del tot com el Pare<sup class=\"fn-ref\" data-fn=\"10\">[10]</sup>, promulga el manament de l’amor fratern<sup class=\"fn-ref\" data-fn=\"11\">[11]</sup>, recomana la pregària, dóna les regles de la vida apostòlica i proclama participants de la seva felicitat els pobres que ho són de cor, els qui ploren, els humiliats, els qui tenen fam d’ajustar-se al voler de Déu, els misericordiosos, els de cor transparent, els pacificadors, i els qui pateixen persecució per la seva fidelitat a Déu<sup class=\"fn-ref\" data-fn=\"12\">[12]</sup>."], "subs": []}, {"n": 5, "text": "En resposta a aquesta vocació divina fem nostre l’ideal de vida de Jesús, el mateix ideal que la Verge Maria va abraçar amb tanta fidelitat. Per això intentem fer present en l’Església la virginitat, la pobresa i l’obediència de Crist en la predicació de l’Evangeli. Per la professió dels consells evangèlics ens vinculem amb vots públics al servei de Déu i Ell ens consagra. Així constituïm dins l’Església un Institut apostòlic en el ple sentit de la paraula.", "paras": [], "subs": []}, {"n": 6, "text": "En l’Església volem ser auxiliars eficaços dels Pastors en el servei de la Paraula, a fi d’estendre la Bona Nova del Regne de Déu per tot el món, utilitzant tots els mitjans al nostre abast. Professem –fins i tot en virtut del vot– amor i obediència al Pastor Suprem en bé de tot el Cos de Crist. En comunió amb els bisbes i sota el seu guiatge, pretenem de servir a la construcció i al progrés de l’Església.", "paras": [], "subs": []}, {"n": 7, "text": "Com a participants que som de la mateixa vocació, formem la Congregació preveres, diaques, germans i estudiants. Tots junts ens apleguem en la mateixa comunitat, acomplim la mateixa missió i compartim els mateixos drets i deures que deriven de la professió religiosa, segons el do propi de cada estament i la funció especifica dins la Congregació.", "paras": ["També han rebut el mateix carisma apostòlic d’altres persones que de forma vària es relacionen amb la Congregació."], "subs": []}, {"n": 8, "text": "Hom atribueix la fundació de la Congregació a la intervenció de la Verge Santa Maria, que tenim com a Patrona amb el tao’ del Cor Immaculat. Ens diem i som fills del seu Cor: per això posem en Ella el nostre amor i la nostra confiança. Ens posem a la seva disposició perquè siguem configurats al misteri de Crist i per a col·laborar a la seva funció maternal en la missió apostòlica.", "paras": [], "subs": []}, {"n": 9, "text": "Hem de tenir sempre a la vista l’ideal del Missioner: Un Fill del Cor Immaculat de Maria és un home encès d’amor i que cala foc arreu on passa. Desitja eficaçment i procura per tots els mitjans encendre tothom amb el foc de l’amor diví. Res no l’espanta. Frueix en les privacions, aborda els treballs, abraça els sacrificis. Es complau en les calúmnies i s’alegra en els turments i dolors que sofreix. La seva glòria és la creu de Jesucrist<sup class=\"fn-ref\" data-fn=\"13\">[13]</sup>. Només pensa com seguirà i imitarà Jesucrist a pregar, a treballar, a sofrir i a procurar sempre i únicament la més gran glòria de Déu i la salvació de tota la humanitat.", "paras": ["La comunitat missionera"], "subs": []}, {"n": 10, "text": "Com Jesucrist és u amb el Pare i l’Esperit, així també nosaltres els missioners hem de ser u en Ells, a fi que el món cregui en Crist<sup class=\"fn-ref\" data-fn=\"14\">[14]</sup>. Hem d’imitar la comunió de vida dels apòstols amb Crist i la primera comunitat de cristians que feien un sol cos i una sola ànima<sup class=\"fn-ref\" data-fn=\"15\">[15]</sup>.", "paras": ["L’amor –tant a Déu com als germans<sup class=\"fn-ref\" data-fn=\"16\">[16]</sup>– ha estat vessat en els nostres cors per l’Esperit Sant<sup class=\"fn-ref\" data-fn=\"17\">[17]</sup> i és la base de la nostra comunió. És el do primordial i de primera necessitat que ens marca com a autèntics deixebles de Crist. Això vol dir que aquest amor ha de dirigir i amarar tota la nostra vida missionera."], "subs": []}, {"n": 11, "text": "A partir d’una vocació idèntica, assumida per tots, la nostra Congregació comprèn tots el germans, un per un, i totes les comunitats. Això sí, cadascun de nosaltres, tot mantenint la disponibilitat exigida pel caràcter d’universalitat de la Congregació, s’uneix amb els germans en la comunitat local feta de vida familiar i de servei apostòlic.", "paras": [], "subs": []}, {"n": 12, "text": "La vida fraterna pren el seu significat ple i el seu coronament en l’Eucaristia, que és el signe de la unitat i el lligam de la caritat<sup class=\"fn-ref\" data-fn=\"18\">[18]</sup>. La nostra fraternitat s’alimenta també amb la pregària comunitària –la litúrgica sobretot– i és afavorida amb un clima de família que crea una convivència sincera i oberta; i s’expressa també en la participació en el govern i en la reglamentació de la comunitat. Envigorits amb tots aquests elements, intentem d’assolir dins la comunitat missionera la plena realització personal a què som cridats.", "paras": [], "subs": []}, {"n": 13, "text": "La col·laboració en el servei de la Paraula pertany a la mateixa arrel de la nostra vida comunitària. Val a dir, tanmateix, que participem de formes diverses en la missió de la comunitat: treballant en equip en una mateixa feina, o bé amb la tasca que la comunitat confia a cadascú, o bé pregant i sofrint pel bé de l’Església. Això vol dir que el ministeri confiat a cadascú s’ha d’exercir de forma que tots ens en sentim solidaris, i, al mateix temps, cadascú l’ha d’acomplir com una tasca assumida per la Comunitat.", "paras": [], "subs": []}, {"n": 14, "text": "Aquesta Comunitat nostra ha de desplegar el seu carisma primordial al servei de l’Església i del món. És així com s’insereix de debò en les situacions i necessitats de l’Església local i del món ambiental, tant en l’estil de vida com en la manera d’exercir el ministeri.", "paras": [], "subs": []}, {"n": 15, "text": "Som imatges de Déu<sup class=\"fn-ref\" data-fn=\"19\">[19]</sup> i membres d’un mateix cos<sup class=\"fn-ref\" data-fn=\"20\">[20]</sup>. Cal, doncs, que ens estimem mútuament per complir el manament del Senyor: «El meu manament és aquest: estimeu-vos mútuament tal com jo us he estimat»<sup class=\"fn-ref\" data-fn=\"21\">[21]</sup>. Aquest amor fratern comporta la pràctica de totes les virtuts. Perquè «l’amor és sofert, l’amor és servicial, exclou l’enveja; l’amor no és presumit, no s’estarrufa d’orgull, no és barroer, no és egoista, no s’exaspera, oblida i perdona el mal, no es complau quan els altres són tractats injustament; el seu goig és l’autenticitat de la conducta. Sap excusar-ho tot, s’obre sempre a la confiança, no perd mai l’esperança, és capaç d’aguantar-ho tot»<sup class=\"fn-ref\" data-fn=\"22\">[22]</sup>. Tinguem doncs, la mateixa preocupació els uns pels altres, ajudem-nos recíprocament a dur les càrregues<sup class=\"fn-ref\" data-fn=\"23\">[23]</sup>.", "paras": [], "subs": []}, {"n": 16, "text": "La construcció de la comunitat és obra de tots i de cada u; no ens estiguem mai de col·laborar-hi. Les nostres paraules han d’estar amarades d’humilitat, i de caritat. No feríssim l’amistat ni sembréssim discòrdies; ni ens baralléssim tampoc ni murmuréssim de res. Mai no fem de jutges dels germans, perquè jutge és el Senyor<sup class=\"fn-ref\" data-fn=\"24\">[24]</sup>. Tampoc no hem de gosar sospitar-ne. Excusem la intenció, baldament no puguem excusar l’obra. Sapiguem perdonar generosament tothom, si algú té contra l’altre cap motiu de queixa.", "paras": [], "subs": []}, {"n": 17, "text": "Amb els germans de diferent origen, edat, cultura o mentalitat, hem de mantenir la unitat de l’esperit amb el lligam de la pau<sup class=\"fn-ref\" data-fn=\"25\">[25]</sup>. Ens hem de servir amb llibertat dels dons i serveis diversos, segons el carisma que hem rebut d’un mateix i únic Esperit per al bé de tots<sup class=\"fn-ref\" data-fn=\"26\">[26]</sup>. Hem d’acollir amb amor fraternal els germans que ens arriben a casa<sup class=\"fn-ref\" data-fn=\"27\">[27]</sup>. I, quan ens presentem en una altra casa, portem-hi la pau del Senyor<sup class=\"fn-ref\" data-fn=\"28\">[28]</sup>.", "paras": [], "subs": []}, {"n": 18, "text": "Hem d’estimar i respectar els ancians o els qui han esmerçat la seva vida en el servei de Déu: tinguem delit d’enriquir-nos de llur experiència<sup class=\"fn-ref\" data-fn=\"29\">[29]</sup>. Pel seu cantó, ells mirin de donar sempre un testimoniatge de l’eterna joventut del cor<sup class=\"fn-ref\" data-fn=\"30\">[30]</sup>.", "paras": ["Tots hem d’estimar de manera especial, visitar de bon grat i ajudar els germans malalts: són membres del Crist sofrent!<sup class=\"fn-ref\" data-fn=\"31\">[31]</sup>"], "subs": []}, {"n": 19, "text": "Quan s’hagi mort un missioner, se li faran les exèquies amb devoció, germanívolament i amb senzillesa. Encomanem al Senyor amb els sufragis prescrits –sobretot en la celebració de l’Eucaristia– els germans que ens han precedit en el servei de l’Evangeli.", "paras": ["La mateixa pietat hem de tenir amb els nostres pares difunts i amb els col·laboradors de la Congregació.", "La castedat"], "subs": []}, {"n": 20, "text": "A imitació de Jesucrist que, de paraula i sobretot amb el testimoniatge de la seva vida, proposà la castedat pel servei del Regne de Déu<sup class=\"fn-ref\" data-fn=\"32\">[32]</sup>, nosaltres abracem la castedat com un do<sup class=\"fn-ref\" data-fn=\"33\">[33]</sup> amb la intenció de consagrar-nos de tot cor als interessos del Pare<sup class=\"fn-ref\" data-fn=\"34\">[34]</sup>, seguint l’exemple de la Verge Maria<sup class=\"fn-ref\" data-fn=\"35\">[35]</sup>. En efecte, amb el do d’aquesta castedat, el Senyor Jesús manifesta la força de la seva glòria en la feblesa de la nostra condició humana, a fi d’enlairar tothom vers l’esperança de la vida futura<sup class=\"fn-ref\" data-fn=\"36\">[36]</sup>.", "paras": [], "subs": []}, {"n": 21, "text": "La castedat que professem afavoreix una nova comunió fraternal en Crist; construeix la comunitat sobre el fonament de la voluntat de Déu, no pas sobre els lligams de carn o sang<sup class=\"fn-ref\" data-fn=\"37\">[37]</sup>. Com a signe que és de l’amor perfecte, esdevé en el món una deu de fecunditat espiritual<sup class=\"fn-ref\" data-fn=\"38\">[38]</sup>; per això, ens allibera de manera excepcional per tal que cremem d’amor envers Déu i envers la humanitat entera; enforteix el nostre esperit en la lluita contra els poders del maligne en et servei apostòlic<sup class=\"fn-ref\" data-fn=\"39\">[39]</sup>.", "paras": [], "subs": []}, {"n": 22, "text": "Estimem, doncs, la castedat com un do de Déu, acollim-la amb joia, guardem-la amb el màxim interès. En virtut de la nostra professió ens obliguem amb vot a guardar la continència perfecta en el celibat i, per un nou títol encara, o sia pel vot, a guardar la castedat que et celibat demana.", "paras": ["Com que la vivència de la castedat afecta les tendències més profundes de la nostra natura i ens imposa no pas poques renúncies<sup class=\"fn-ref\" data-fn=\"40\">[40]</sup>, hem de confiar-nos al Senyor i demanar-li humilment et seu ajut amb la pregària. Fomentem la vida de comunitat, ja que l’amor fraternal autèntic guarda la castedat i la perfecciona.", "No ens refiem de les nostres forces i evitem amb una mena d’esma espiritual les ocasions. Utilitzem els mitjans adients, com són ara el treball constant, la prudència pastoral, l’atenció a la salut psíquica i física", "La pobresa"], "subs": []}, {"n": 23, "text": "Professem la pobresa evangèlica seguint l’exemple de Jesucrist. Ell, ric com era, es va fer pobre per nosaltres, a fi d’enriquir-nos a tots<sup class=\"fn-ref\" data-fn=\"41\">[41]</sup>. Quan proclamava la Bona Nova del Regne, no tenia on reposar et seu cap<sup class=\"fn-ref\" data-fn=\"42\">[42]</sup>. Amb la professió religiosa participem d’aquesta seva pobresa i de l’exemple de la Verge Santa Maria, que sobresurt entre els pobres de Jahvè<sup class=\"fn-ref\" data-fn=\"43\">[43]</sup>, i, a la manera dels Apòstols que ho van deixar tot per seguir el Senyor<sup class=\"fn-ref\" data-fn=\"44\">[44]</sup>, recordem a la gent els béns del món a venir.", "paras": [], "subs": []}, {"n": 24, "text": "Com que posem tota la confiança en el Senyor –i de cap manera en el poder o en les riqueses– busquem primer de tot<sup class=\"fn-ref\" data-fn=\"45\">[45]</sup> el Regne de Déu que pertany als pobres<sup class=\"fn-ref\" data-fn=\"46\">[46]</sup>. La pobresa voluntària construeix la comunitat fraterna en la unitat de cor i d’esperit. S’expressa en la comunió de béns tant materials com espirituals amb els pobres i al seu servei.", "paras": [], "subs": []}, {"n": 25, "text": "La nostra pobresa és apostòlica<sup class=\"fn-ref\" data-fn=\"47\">[47]</sup> i, així, tota la nostra vida i activitat han d’estar amarades de l’esperit de pobresa. Ara bé, les formes concretes de la nostra pobresa han de respondre de debò a la vida missionera i han de constituir un signe visible –tant persona] com comunitari– de l’Evangeli. Per això la Congregació i les nostres comunitats, tenint en compte les circumstàncies locals, maldin per donar un testimoniatge col·lectiu de pobresa: el parament de la casa, l’alimentació i el vestit han d’estar al nivell dels pobres, bandejada tota aparença de luxe o de guany desmesurat i la capitalització. Hem de tenir els nostres béns a disposició dels altres, per atendre les necessitats sobretot de la pròpia Congregació i del Poble de Déu.", "paras": [], "subs": []}, {"n": 26, "text": "Els nostres missioners han de mirar de ser realment pobres de fet i d’esperit. No han de retenir o de procurar-se res contra aquesta professió de pobresa, ni han de fer servir cap cosa com si fos propietat seva<sup class=\"fn-ref\" data-fn=\"48\">[48]</sup>. Han de sentir-se obligats a la llei universal del treball<sup class=\"fn-ref\" data-fn=\"49\">[49]</sup> per compartir la situació dels pobres. I no acceptin cap ministeri amb vista a la paga<sup class=\"fn-ref\" data-fn=\"50\">[50]</sup>.", "paras": ["Estaran contents quan experimentin els efectes de la pobresa, sense dubtar de la Providència d’Aquell que va dir: «Que el vostre afany primer sigui el Regne de Déu i la fidelitat al seu designi, i tot això altre us ho afegiran d’escreix»<sup class=\"fn-ref\" data-fn=\"51\">[51]</sup>.", "Per tal d’afavorir la pobresa religiosa, el superior legítim pot concedir als professos perpetus la lliure renúncia als seus béns patrimonials, segons la norma del dret."], "subs": []}, {"n": 27, "text": "Pel vot de pobresa, els membres de la Congregació renuncien al dret de disposar dels béns temporals i d’usar-los sense el permís dels superiors.", "paras": ["Abans de la primera professió cedeixin a qui vulguin l’administració dels seus béns i disposin lliurement del seu ús i usdefruit, segons la norma del dret nostre. Abans de la professió perpètua, facin lliurement testament civil dels béns actuals o que els puguin venir més endavant. Sense la llicència dels superiors, no poder fer lícitament cap acte de propietat ni sobre els béns dels quals conserven el domini radical, ni sobre l’acceptació de béns que comsevulla els sobrevinguin després de la professió.", "L’obediència"], "subs": []}, {"n": 28, "text": "A imitació de Jesucrist que fou enviat per fer la voluntat del Pare<sup class=\"fn-ref\" data-fn=\"52\">[52]</sup>, i seguint el model de la Verge Maria que, com a esclava del Senyor<sup class=\"fn-ref\" data-fn=\"53\">[53]</sup>, es va consagrar totalment a la persona i a l’obra del seu Fill, també nosaltres intentem d’acomplir la voluntat del Pare dins la Congregació.", "paras": ["Sota l’impuls de l’Esperit Sant, amb l’obediència oferim a Déu la lliure facultat de disposar de la pròpia vida, i ens obliguem amb vot a obeir el manament del superior legítim en tot allò que es refereixi directament o indirecta a la vida de l’Institut, o sia, a l’assoliment de la nostra missió i a l’observança dels vots i de les Constitucions. Ens emmotllem a Jesucrist que per nosaltres es va fer obedient fins a la mort –una mort de creu!<sup class=\"fn-ref\" data-fn=\"54\">[54]</sup>–, i ens unim en tot a la voluntat salvífica de Déu."], "subs": []}, {"n": 29, "text": "L’autèntic missioner és reconegut per la seva obediència: per això, com que tots participem d’una mateixa vocació, busquem tots plegats de conèixer i realitzar el voler de Déu, a fi que puguem acomplir a l’Església la missió que ens concerneix a tots, en les circumstàncies vàries de temps, de lloc i de persones. A l’hora de cercar i de realitzar aquest voler de Déu, tots estem obligats a brindar el nostre ajut als germans, mitjançant la pregària, el consell i el diàleg fraternal.", "paras": [], "subs": []}, {"n": 30, "text": "La unitat d’amor i de missió de les comunitats, la trobem expressada visiblement en els nostres superiors. Els superiors, doncs, cerquin per damunt de tot el voler del Pare<sup class=\"fn-ref\" data-fn=\"55\">[55]</sup>, i, a partir d’aquí, el proposaran als altres. Escoltin de bon grat els germans. Promoguin llur participació activa en bé de la Congregació i de l’Església: això si, salvant sempre la seva autoritat de decidir i de manar allò que cal fer. Exerciran aquesta autoritat d’acord amb les Constitucions i amb esperit de servei, lliurant la pròpia vida pels germans<sup class=\"fn-ref\" data-fn=\"56\">[56]</sup>.", "paras": [], "subs": []}, {"n": 31, "text": "Els nostres missioners s’han d’avesar a obeir el Senyor a impulsos de l’amor, amb promptitud i amb perfecció, sotmetent-se als homes per amor a Ell<sup class=\"fn-ref\" data-fn=\"57\">[57]</sup>.", "paras": ["No ataquin les decisions dels superiors; més aviat les defensaran. Si els sembla en el Senyor que han de fer alguna proposta contrària, ho faran amb llibertat: això si, ho consultaran primer amb Déu, disposats també a acceptar la decisió que es prengui. Esmercin les Seves energies personals en l’execució dels mandats i en l’acompliment dels càrrecs que els hagin assignat."], "subs": []}, {"n": 32, "text": "Amb aquesta disponibilitat, els missioners estaran lliures per a ser enviats arreu del món i a punt per a qualsevol ministeri que la Congregació els confiï a través dels superiors.", "paras": ["L’oració"], "subs": []}, {"n": 33, "text": "Ja que hem emprès l’obra missionera de Crist, hem d’imitar-lo també en la seva pregària assídua<sup class=\"fn-ref\" data-fn=\"58\">[58]</sup> i escoltar-lo quan recomana i ensenya<sup class=\"fn-ref\" data-fn=\"59\">[59]</sup> de pregar en tot moment<sup class=\"fn-ref\" data-fn=\"60\">[60]</sup>.", "paras": [], "subs": []}, {"n": 34, "text": "Per això, ens cal conrear l’esperit d’adopció filial que ens fa clamar: Abba, Pare!<sup class=\"fn-ref\" data-fn=\"61\">[61]</sup>. Guiats per la llum de la fe, cerquem en qualsevol esdeveniment els indicis de la seva voluntat: serà la manera de fer-nos cada dia més dòcils a la nostra missió.", "paras": ["Escoltem primer en una contemplació assídua<sup class=\"fn-ref\" data-fn=\"62\">[62]</sup> les Paraules del Senyor que hem d’anunciar, i compartim-les també amb els germans, a fi que ens convertim nosaltres mateixos a l’Evangeli, ens configurem al Crist i ens arborem del seu amor que ens ha d’empènyer<sup class=\"fn-ref\" data-fn=\"63\">[63]</sup>. Finalment, amb pregàries i súpliques, intercedim davant Déu per l’Església i per la vida del món<sup class=\"fn-ref\" data-fn=\"64\">[64]</sup>."], "subs": []}, {"n": 35, "text": "Primer de tot, celebrem cada dia de tot cor el misteri de l’Eucaristia, adherint-nos al Crist Senyor que hi proclama paraules de vida, s’hi ofereix ell mateix pels germans, hi honora el Pare, i hi construeix la unitat de l’Església. Hem d’estimar molt la conversa amb Crist Senyor amb la visita i el culte al Santíssim Sagrament. Fem fidelment cada dia la pregària en nom de l’Església.", "paras": ["Als temps sagrats i a les festes, mirem d’acomodar la nostra pregària a l’esperit de l’Església que en la Litúrgia proposa a la contemplació dels fidels et misteri de Crist en la seva integritat. De la celebració de l’Eucaristia i de la lloança a Déu, rebrem la força que acreixerà la nostra vida en Crist i farà més fecund el nostre apostolat.", "La nostra unió al culte de l’Església celestial ateny el seu grau més alt quan entrem en comunió i venerem la memòria, en primer lloc, de la Verge santa Maria, i també de sant Josep, de sant Miguel i de tots els àngels, dels apòstols i dels altres sants que la tradició ens dóna com a Patrons per llur esperit verament missioner, és a dir: sant Alfons de Liguori, sant Ignasi de Loiola, santa Teresa de Jesús, santa Caterina de Siena."], "subs": []}, {"n": 36, "text": "Hem de mostrar el nostre amor filial a la Verge Maria, Mare de Déu, vinculada ben de cor a l’obra salvadora del seu Fill, tant amb el culte litúrgic com amb els exercicis de pietat tradicionals, com són ara el rosari i semblants.", "paras": [], "subs": []}, {"n": 37, "text": "Els missioners ens hem d’esmerçar en l’oració mental, i això cada dia, i si és possible tota una bora, confrontant en el nostre cor la Paraula de Déu<sup class=\"fn-ref\" data-fn=\"65\">[65]</sup>. Ocupem-nos també en la lectura espiritual, sobretot de la Bíblia<sup class=\"fn-ref\" data-fn=\"66\">[66]</sup>. I examinem-nos de la nostra fidelitat a l’Evangeli.", "paras": ["L’oració diària feta amb fidelitat esdevé una necessitat primària tant per a la comunitat com per a cada missioner: vet aquí perquè hem de reservar-li un lloc prioritari en la nostra vida."], "subs": []}, {"n": 38, "text": "Hem de celebrar sovint el sagrament de la reconciliació, que significa i perfecciona l’esperit de conversió continua a Déu. En efecte, en virtut d’aquest sagrament, mentre tornem a l’amistat amb una Església que hem ferit quan pecàvem, morim al pecat<sup class=\"fn-ref\" data-fn=\"67\">[67]</sup> amb Crist, que mai no cometé pecat<sup class=\"fn-ref\" data-fn=\"68\">[68]</sup>.", "paras": ["Configuració amb el Crist"], "subs": []}, {"n": 39, "text": "La unció de l’Esperit Sant<sup class=\"fn-ref\" data-fn=\"69\">[69]</sup>, –amb la qual hem estat ungits per a anunciar la Bona Nova als pobres– és participació en la plenitud del Crist<sup class=\"fn-ref\" data-fn=\"70\">[70]</sup>. Per això els qui ens sentim cridats a seguir el Senyor i a col·laborar amb Ell en l’obra que el Pare li ha confiat, tenim l’obligació de contemplar assíduament el Crist i d’imitar-lo, tan xops del seu Esperit, que ja no siguem nosaltres els qui visquem, sinó que sigui Crist el qui de debò viu en nosaltres<sup class=\"fn-ref\" data-fn=\"71\">[71]</sup>. Només d’aquesta manera serem instruments eficaços en mans del Senyor per anunciar el Regne de Déu.", "paras": ["La nostra configuració amb Crist, intentem d’assolir-la amb els vots religiosos, dins la comunitat missionera. També l’assolim i l’expressem amb les altres virtuts, segons el nostre carisma propi a l’Església."], "subs": []}, {"n": 40, "text": "La caritat apostòlica és una virtut tan necessària, que, sense ella, el missioner no serà més que una campana que retruny o el ximxim d’uns platerets<sup class=\"fn-ref\" data-fn=\"72\">[72]</sup>.", "paras": ["Crist, endut pel seu amor abrandat al Pare i als homes, es lliurà als sofriments, a la passió i fins i tot a la mort<sup class=\"fn-ref\" data-fn=\"73\">[73]</sup>. Igualment els Apòstols, que foren testimonis de la joia de la resurrecció de Crist<sup class=\"fn-ref\" data-fn=\"74\">[74]</sup>, van recórrer tota la terra empesos pel foc de l’Esperit Sant.", "També nosaltres, moguts pel zel apostòlic i el goig de l’Esperit, ens hem de basquejar perquè Déu sigui de tothom conegut, estimat i servit. L’amor a tots els homes ens ha de fer desitjar i procurar per a ells aquella benaurança del Regne que ja comença ací a la terra."], "subs": []}, {"n": 41, "text": "Crist Jesús s’anorreà fins a fer-se la imatge viva del Servent<sup class=\"fn-ref\" data-fn=\"75\">[75]</sup>. A fi, doncs, d’apropiar-nos els seus mateixos sentiments, hem de cercar la humilitat, la qual, per tal com disposa a la gràcia de Déu, és el fonament de la perfecció cristiana; per això és tan necessària als servidors de l’Evangeli. Que cadascú doni Únicament a Déu tota la glòria de qualssevol qualitats que li sembli tenir, i que les faci rendir copiosament<sup class=\"fn-ref\" data-fn=\"76\">[76]</sup>.", "paras": ["Recordi cadascú els seus pecats i reconegui ben de cor la seva dependència de Déu. I que això es faci palès en la manera de captenir-se i de tractar els altres. Que sàpiga confessar els seus defectes i errors, demanar-ne perdó als germans i tenir amb ells totes les atencions que demana la caritat, de tal manera que sigui entre ells com el qui serveix<sup class=\"fn-ref\" data-fn=\"77\">[77]</sup>."], "subs": []}, {"n": 42, "text": "Esforcem-nos a practicar la mansuetud que el Senyor proclama<sup class=\"fn-ref\" data-fn=\"78\">[78]</sup> i que és signe de vocació apostòlica. L’amor de Crist ens ha d’esperonar<sup class=\"fn-ref\" data-fn=\"79\">[79]</sup>, de manera que sentim pels nostres germans la gelosia de Déu<sup class=\"fn-ref\" data-fn=\"80\">[80]</sup> i tinguem el coratge de morir cada dia per ells<sup class=\"fn-ref\" data-fn=\"81\">[81]</sup>; amb tot, en l’apostolat, ens hem de moure sempre inspirats per la mansuetud de Crist<sup class=\"fn-ref\" data-fn=\"82\">[82]</sup>, a fi de guanyar-los a tots per a Ell.", "paras": [], "subs": []}, {"n": 43, "text": "Associats com estem a l’obra de la Redempció, maldem per identificar-nos amb el Crist que va dir: «Si algú vol ser deixeble meu, que s’oblidi d’ell mateix i que prengui la seva creu»<sup class=\"fn-ref\" data-fn=\"83\">[83]</sup>.", "paras": ["Els autèntics missioners, com a forasters i gent de pas que són, s’han d’abstenir de les passions instintives en guerra contra l’ànima<sup class=\"fn-ref\" data-fn=\"84\">[84]</sup>. Per això, guardin amb molt de compte els sentits, glorificant i portant Déu en el seu cos<sup class=\"fn-ref\" data-fn=\"85\">[85]</sup>. En el menjar i en el beure, com també en l’os de les coses delitoses, han d’escollir les formes de temprança més conformes a les circumstàncies de Hoc i de temps, i més adients a uns homes apostòlics. Així, llur frugalitat palesarà que el cos pertany a Crist, per la força del qual Déu ens ressuscitarà<sup class=\"fn-ref\" data-fn=\"86\">[86]</sup>."], "subs": []}, {"n": 44, "text": "Recordin les paraules del Senyor: «Qui per mi i per la Bona Nova no es reservi, es realitzarà»<sup class=\"fn-ref\" data-fn=\"87\">[87]</sup>. Per això, importa sobre manera que procurin alegrar-se en qualsevol adversitat, en la fam, en la set, en la nuesa, en els treballs, en les calúmnies, en les persecucions i en tota mena de tribulacions<sup class=\"fn-ref\" data-fn=\"88\">[88]</sup>, fins que puguin dir amb l’Apòstol: «El que és jo, Déu me’n guard de polar la meva glòria en res més que en la creu del Senyor nostre Jesucrist, pel qual et món és per a mi un crucificat i jo sóc un crucificat per al món»<sup class=\"fn-ref\" data-fn=\"89\">[89]</sup>.", "paras": ["El mateix Senyor –que es va igualar i fins identificar amb els sofrents– ens invita que el reconeguem sofrint en ells i que els prestem un auxili eficaç<sup class=\"fn-ref\" data-fn=\"90\">[90]</sup>, fins donant la nostra vida pels germans<sup class=\"fn-ref\" data-fn=\"91\">[91]</sup>. En solidaritat amb els qui sofreixen malalties, penes, injustícies o opressió, suportem-ho tot per ells, a fi que també ells assoleixin la salvació<sup class=\"fn-ref\" data-fn=\"92\">[92]</sup>."], "subs": []}, {"n": 45, "text": "Ja que Crist va patir per nosaltres, deixant-nos exemple<sup class=\"fn-ref\" data-fn=\"93\">[93]</sup>, quan ens trobem malalts, suportem la malaltia i els dolors amb humilitat i submissió al voler de Déu, conscients que suplim amb la nostra malaltia la part de sofriments no acomplerta pel Crist<sup class=\"fn-ref\" data-fn=\"94\">[94]</sup>. Suportem, doncs, la malaltia i totes les deficiències –efectes de la pobresa– amb gran paciència, predicant a tothom amb el testimoniatge de la nostra vida.", "paras": ["Quan algun emmalalteixi de gravetat, que s’uneixi més estretament amb Crist també amb els sagraments dels malalts, ofereixi la seva vida per la salvació de tothom i posi tota l’esperança en Aquell que és la nostra resurrecció i la nostra vida<sup class=\"fn-ref\" data-fn=\"95\">[95]</sup>.", "Acompliment de la nostra missió"], "subs": []}, {"n": 46, "text": "La nostra vocació especifica en el poble de Déu, rau en el servei de la Paraula, amb la qual comuniquem als homes el misteri de Crist en la seva integritat. En efecte, hem estat enviats a anunciar la vida, la mort i la resurrecció del Senyor fins que tornarà, a fi que tots se salvin per la fe en Ell<sup class=\"fn-ref\" data-fn=\"96\">[96]</sup>.", "paras": ["Sentint-nos solidaris del goig i de l’esperança, dels plors i de les angoixes de la humanitat, dels pobres sobretot, intentem de prestar la nostra col·laboració a tots el qui cerquen la transformació del món segons el projecte de Déu. Això sí, ens cal anunciar la Bona Nova del Regne amb fidelitat i fortalesa, sobretot quan són tants els qui s’hi oposen amb llurs plans de domini, amb el seu afany de riquesa o de satisfer les seves passions<sup class=\"fn-ref\" data-fn=\"97\">[97]</sup>."], "subs": []}, {"n": 47, "text": "La nostra Congregació acompleix la seva missió suscitant comunitats cristianes o consolidant-les, adés convertint la gent a Déu per la fe, adés renovellant-ne la vida en Crist i duent-la a plena maduresa.", "paras": [], "subs": []}, {"n": 48, "text": "Per tal d’acomplir aquesta missió, els missioners se serviran de tots els mitjans al seu abast, però sobretot hauran d’afinar:", "paras": ["– la intuïció per a copsar allò que és més urgent, oportú i eficaç, vistes les circumstàncies de temps, llocs i persones, sense aferrar-se a mètodes i mitjans d’apostolat inadequats.", "– et sentit de la disponibilitat, de manera que – dòcils a l’Esperit i obedients a la missió<sup class=\"fn-ref\" data-fn=\"98\">[98]</sup>– estiguin disposats a renunciar a tot el que tenien fins ara per a assumir l’encàrrec de sembrar la fe tant a fora com a dintre dels confins de la pàtria.", "– el sentit de la catolicitat, que, vagin on vagin, els faci apreciar com cal i amb amplitud de mires els costums dels diversos països i llurs valors religiosos i culturals<sup class=\"fn-ref\" data-fn=\"99\">[99]</sup>. El treball missional s’ha d’orientar sobretot cap als més necessitats d’evangelització o bé cap als agents -actuals o possibles- de la mateixa evangelització. Associem de bon grat en el Senyor amb vista a les nostres obres apostòliques, tots i cada un dels qui -a impulsos del seu esperit missional- cerquen de col·laborar amb nosaltres."], "subs": []}, {"n": 49, "text": "Els membres de la Congregació s’han de dedicar de ple a l’obra de l’Evangeli, deixant fins i tot la pròpia família<sup class=\"fn-ref\" data-fn=\"100\">[100]</sup>: recordin que tenen al cel un Pare a qui han de plaure per damunt de tots<sup class=\"fn-ref\" data-fn=\"101\">[101]</sup>. Vigilin també que l’amor desordenat a la pàtria o a la pròpia cultura no els destorbi d’adaptar-se als pobles que han d’evangelitzar. I perquè puguin dedicar-se més lliurement a la seva vocació missionera, no s’emboliquin amb partits politics ni amb afers que signifiquin una nosa per a llur vocació.", "paras": [], "subs": []}, {"n": 50, "text": "Entre les funcions del ministeri -com són ara el govern, la santificació i l’evangelització- la més nostra de totes, com a missioners que som, és la col·laboració en l’evangelització del poble. Per això, ningú no accepti càrrecs de govern eclesiàstic sense consentiment del Superior General o manament del Papa.", "paras": ["El progrés en la vida missionera"], "subs": []}, {"n": 51, "text": "Els nostres missioners, delejant d’ajustar-se al voler de Déu<sup class=\"fn-ref\" data-fn=\"102\">[102]</sup> s’han de basquejar per assolir el ple desenrotllament en Crist<sup class=\"fn-ref\" data-fn=\"103\">[103]</sup>; així es capacitaran per a comunicar més eficaçment la gràcia de l’Evangeli als altres. Ara bé, Déu ens ha cridat no pas mirant els nostres mereixements, sinó seguint el seu designi<sup class=\"fn-ref\" data-fn=\"104\">[104]</sup> i ens ha fet amics seus en Jesucrist<sup class=\"fn-ref\" data-fn=\"105\">[105]</sup>. Tenim la confiança que Ell menarà a bon terme fins al dia de Jesucrist la bona obra que ha iniciat en nosaltres<sup class=\"fn-ref\" data-fn=\"106\">[106]</sup>.", "paras": [], "subs": []}, {"n": 52, "text": "Maldant per caminar segons les exigències de la vida nova<sup class=\"fn-ref\" data-fn=\"107\">[107]</sup> i dirigint el seu cor a Déu, ho faran tot amb rectitud d’intenció i amb veritable fervor d’esperit, i suportaran les adversitats per amor a Ell. Renovin cada dia el propòsit de progressar en el camí del Senyor. Facin cada mes un retir espiritual, per a revifar la pròpia vocació i renovellar en si l’esperança de la glòria futura per sortir més ben preparats a l’encontre del Senyor. Cada any es dedicaran als exercicis espirituals de manera especial i amb l’interès degut.", "paras": [], "subs": []}, {"n": 53, "text": "Tal i com el Crist Senyor fou endut per l’Esperit Sant al desert per a ser-hi posat a prova pel diable<sup class=\"fn-ref\" data-fn=\"108\">[108]</sup>, també nosaltres, deixebles seus al capdavall, ens veurem temptats tot sovint<sup class=\"fn-ref\" data-fn=\"109\">[109]</sup>. Aixà si, enmig de les temptacions, hem de romandre amb Crist<sup class=\"fn-ref\" data-fn=\"110\">[110]</sup> que encara és temptat en nosaltres.", "paras": ["Revestim-nos, doncs, l’armadura de Déu<sup class=\"fn-ref\" data-fn=\"111\">[111]</sup> sense presumir de les nostres forces, però confiant amb una esperança sense fissures en el Senyor que es mostra fidel enmig mateix de les temptacions<sup class=\"fn-ref\" data-fn=\"112\">[112]</sup>. Per aixà, hem de vigilar, seguint l’avís del Senyor<sup class=\"fn-ref\" data-fn=\"113\">[113]</sup>, i hem de pregar al Pare celestial perquè no ens exposi a la temptació<sup class=\"fn-ref\" data-fn=\"114\">[114]</sup>."], "subs": []}, {"n": 54, "text": "Per a promoure eficaçment el progrés espiritual, demanin l’ajut dels germans, ja sigui en la direcció espiritual, ja sigui valent-se del discerniment comunitari i d’altres mitjans. Desitgin i demanin de cor que els altres els corregeixin i els avisin. I agraeixin interiorment i exteriorment totes les correccions.", "paras": [], "subs": []}, {"n": 55, "text": "Amb gran sol·licitud dels uns pels altres, si mai veuen que un germà es desvia del camí dret i cau en defectes de conseqüències dolentes per a ell o per als altres, l’avisaran en particular, amb amor humil i bondadós<sup class=\"fn-ref\" data-fn=\"115\">[115]</sup>, bo i recordant la pròpia feblesa. Però, si ell no vol saber-ne res o en el ce que ho urgeixin el seu bé o el del proïsme, ho faran avinent al superior, per tal que hi posi el remei adequat. Mentrestant encomanaran l’afer al Senyor. Acullin i confortin amb cor sincer el germà penedit, a fi que pugui seguir amb més seguretat el camí del Senyor.", "paras": [], "subs": []}, {"n": 56, "text": "Els nostres germans han de progressar amb pas igual en la virtut i en el saber, si volen estar a l’altura dels temps i a punt per a exercir un ministeri fructuós. Conrearan amb gran interès els estudis sagrats i profans i estaran sempre al corrent de llur progrés. Procurin els superiors que, en la mesura que la nostra condició ho permeti, cada comunitat tingui els instruments i mitjans adequats per a prosseguir eficaçment els estudis. La biblioteca ha de merèixer el màxim interès de tots el membres de la comunitat.", "paras": [], "subs": []}, {"n": 57, "text": "Segons les exigències de la vida missionera, s’ha de reservar una part de la casa per a exclusiu dels membres de la Congregació. La comunitat ha d’establir el propi reglament intern, determinar el seu ritme de pregària comunitària i ordenar els altres aspectes de la vida, de manera que els actes comuns es distribueixin segons les exigències del treball apostòlic. Ultra el temps dedicat a l’esperit i al treball, els missioners han de poder tenir també els seus lleures i fruir de l’esplai convenient, del silenci i del descans. Pel que fa a dels mitjans de comunicació, cal procedir amb la discreció necessària i evitar tot allò que pugui perjudicar la vida espiritual o el testimoniatge apostòlic.", "paras": ["Quant a l’hàbit religiós, observin les prescripcions del dret universal.", "Els cridats a la vida missionera"], "subs": []}, {"n": 58, "text": "Tots els missioners viuran amb goig el do de la vocació. A més, es deliran perquè aquest mateix do sigui atorgat també a d’altres, i la nostra Congregació creixi dia rere dia per a anunciar el Regne de Déu<sup class=\"fn-ref\" data-fn=\"116\">[116]</sup>.", "paras": ["Tots han de considerar com adreçada a ells l’exhortació de Jesús: «Demaneu a l’Amo dels sembrats que enviï treballadors als seus sembrats»<sup class=\"fn-ref\" data-fn=\"117\">[117]</sup>. Recordin també que la millor invitació a abraçar la crida del Senyor són les nostres paraules i l’estil de la nostra vida missionera.", "La promoció de les vocacions és un deure de tots i de cada u."], "subs": []}, {"n": 59, "text": "El procés de discerniment vocacional amb els qui creuen haver sentit la nostra mateixa vocació, cal iniciar-lo amb l’escolta de la Paraula de Déu, la pregària i el diàleg fraternal.", "paras": ["Però els qui comprenen que són cridats a integrar-se plenament a la nostra Congregació han de conèixer ben bé i fins a cert punt experimentar la nostra vida i missió<sup class=\"fn-ref\" data-fn=\"118\">[118]</sup>.", "Els qui demanin l’ingrés a la Congregació han de fer el postulantat, durant el qual continuaran l’examen de la pròpia vocació sota el guiatge d’un missioner experimentat.", "Al moment de l’admissió, el postulant declararà que, durant el temps que passi a la Congregació, farà de franc i sense retribució el seu treball, d’acord amb la llei de l’estat religiós; i que, per tant, si surt de la Congregació, no reclamarà res pel treball fet."], "subs": []}, {"n": 60, "text": "Cadascun de nosaltres maldi per assegurar amb el bon comportament la seva vocació i elecció<sup class=\"fn-ref\" data-fn=\"119\">[119]</sup>.", "paras": ["Si, després ja de la professió, algú arriba al convenciment que ha de deixar la Congregació, maduri aquesta decisió amb el diàleg fraternal, cercant sincerament la voluntat de Déu.", "Si es dóna el cas que els superiors creuen necessari separar algun germà dels drets i deures de la professió, ho faran sempre amb caritat i discreció.", "Quan algú hagi d’abandonar la Congregació –tant si és per pròpia iniciativa com per decisió dels superiors–, caldrà procedir segons les normes del dret universal i particular.", "Tots els missioners, sobretot els superiors, procurin fer el possible per ajudar amb caritat cristiana aquell qui ha sortit o ha estat exclòs, perquè pugui viure en el segle honestament.", "Els novicis i llur mestre"], "subs": []}, {"n": 61, "text": "Els novicis es preparen a professar en la nostra Congregació. Procuraran, doncs, assentar els fonaments de la vida missionera, coneixent-ne els elements essencials i practicaran els consells evangèlics. Per això, s’adheriran ben de cor, sobretot en el misteri eucarístic, al Crist Senyor, puix que n’hauran de compartir la vida", "paras": ["i el ministeri. Prenguin com a Mare i Mestra<sup class=\"fn-ref\" data-fn=\"120\">[120]</sup> la Verge santa Maria, que fou la primera deixebla de Jesús."], "subs": []}, {"n": 62, "text": "Totes les virtuts són necessàries als missioners; però, si volen respondre a la pròpia vocació, han de tenir, primer de tot, una fe viva. En efecte, la fe abrandà profetes, apòstols i màrtirs, i impulsà molts predicadors de la Paraula de Déu, a abraçar amb alegria la pobresa, l’abnegació i el sacrifici per estendre el Regne de Crist. Per això mateix els novicis s’han d’arrelar bé en la fe, oi més, n’han de viure<sup class=\"fn-ref\" data-fn=\"121\">[121]</sup>, especialment si mai els fibla el dubte de la fidelitat a la vocació.", "paras": [], "subs": []}, {"n": 63, "text": "Tinguin gran confiança en Déu, de qui han d’esperar la capacitat per al bell acompliment de la missió<sup class=\"fn-ref\" data-fn=\"122\">[122]</sup>. Per això, han de fer el cor fort davant les temptacions de desconfiança o de les pròpies limitacions: recordin la manera habitual de fer de Déu que és d’escollir instruments dèbils o poc aptes per a confondre els forts<sup class=\"fn-ref\" data-fn=\"123\">[123]</sup>.", "paras": [], "subs": []}, {"n": 64, "text": "Defensin la vocació missionera amb la humilitat evangèlica. Sàpiguen reconèixer que, si tenen res, ho han rebut de Déu, i que a sobre, n’hauran de donar compte<sup class=\"fn-ref\" data-fn=\"124\">[124]</sup>. Per això, reconeguin els dons que han rebut i vegin de fer-los fructificar<sup class=\"fn-ref\" data-fn=\"125\">[125]</sup>, bo i posant-los al servei de tothom.", "paras": [], "subs": []}, {"n": 65, "text": "Els joves missioners, amb gran docilitat a l’Esperit, en la recerca de la voluntat de Déu, col·laborin amb la seva activitat responsable amb el mestre i els superiors, les decisions dels quals acataran amb fe i amor.", "paras": [], "subs": []}, {"n": 66, "text": "Cerquin en tot la glòria de Déu com a norma de la seva actuació personal, tant si estudien, mengen o es diverteixen, com si fan qualsevol altra cosa<sup class=\"fn-ref\" data-fn=\"126\">[126]</sup>. Per això, practiquin l’oració sense defalliment ni tebiesa, i d’aquesta manera sortiran de l’any de prova amb profit de debò.", "paras": [], "subs": []}, {"n": 67, "text": "Els novicis han de valorar com cal la vocació missionera, tot continuant el procés de discerniment de la seva vocació a la Congregació. Un cop aclarida aquesta qüestió, maldin per respondre a la fidelitat de Déu amb la pròpia fidelitat, joiosa i prompta.", "paras": [], "subs": []}, {"n": 68, "text": "Per tal de posar un fonament sòlid a la vida missionera, els novicis són confiats a un Mestre que els formarà, amb paraules i fets, en l’esperit de la Congregació.", "paras": ["El superior major amb el seu consell elegeix el Mestre de novicis. Ha de ser un home verament espiritual i ple d’amor a la Congregació. Les qualitats que l’han d’adornar són la maduresa, l’amabilitat, el seny i un sòlid coneixement de la natura i missió de la nostra Congregació a l’Església, amb la corresponent experiència apostòlica.", "Dirigeixi els novicis de manera que desenrotllin la maduresa de judici i la fermesa de caràcter, segons el ritme personal de cadascun. Els inculcarà les virtuts que més valora la gent d’avui i que donen més credibilitat a un deixeble de Crist. Procuri que els novicis siguin capaços de realitzar la unitat de vida missionera que agermana i integra l’esperit d’unió amb Déu i l’activitat apostòlica."], "subs": []}, {"n": 69, "text": "El postulant és admès al noviciat pel superior major amb el parer del consell.", "paras": ["El temps del noviciat comença quan ho determina el superior major o el seu delegat.", "Perquè tingui validesa, el noviciat ha de durar dotze mesos i s’ha de fer en una casa degudament designada per a aquest fi. Per tal de completar la formació dels novicis, els superiors poden establir, d’acord amb el nostre dret, un o més períodes de temps a més de l’assenyalat, en què els novicis s’exercitin en pràctiques apostòliques fora de la comunitat del noviciat. Però el noviciat,no ha d’ultrapassar mai els dos anys.", "Llevat d’això, el noviciat és invàlid si hi ha hagut una absència de més de tres mesos seguits o discontinus fora de la casa del noviciat. I, si l’absència ha estat de més de quinze dies, s’han de recuperar."], "subs": []}, {"n": 70, "text": "El candidat, un cop haurà comprovat suficientment durant el noviciat la seva vocació a la Congregació, s’hi vincula, prèvia l’aprovació del Superior Major amb el seu Consell. Aquesta vinculació, que es realitza amb l’emissió dels vots públics, es fa temporalment.", "paras": ["Passats tres anys d’aquesta professió temporal, el germà, que espontàniament ho demani i sigui considerat idoni, serà admès a la renovació fins i tot per a un altre trienni o bé a la professió perpètua. Altrament se n’haurà d’anar.", "Però si semblava oportú, el Superior General podria allargar per a algun germà el període de professió temporal, de tal manera però, que tot el temps de vinculació temporal no passi mai dels nou anys."], "subs": []}, {"n": 71, "text": "Amb l’aprovació del Superior Major amb el seu Consell, el germà s’incorpora definitivament a la Congregació mitjançant els vots perpetus. Perquè pugui fer els vots perpetus, cal que hagi assolit el grau de maduresa personal que li possibiliti el reconeixement i la vivència de la vocació divina com un bé integral de la seva persona. La nostra professió religiosa es realitza amb l’emissió dels vots de castedat, pobresa i obediència, i amb un acte amb el qual ens consagrem públicament a Déu i ens lliurem al Cor Immaculat de la Verge santa Maria per al ministeri de la salvació. Amb aquest acte es remarca expressament que professem la vida religiosa en una Congregació fundada justament per al ministeri de la Paraula. En virtut d’aquesta donació, acceptada per la Congregació i per l’Església, cada membre participa de la nostra missió dins el poble de Déu.", "paras": ["Els missioners en formació i llur prefecte"], "subs": []}, {"n": 72, "text": "El període institucional és un temps de formació amb vista a la nostra missió.", "paras": ["La preparació per a la professió religiosa perpètua s’allarga tres anys, almenys.", "Ultra aquesta formació bàsica, cadascú s’ha de preparar específicament a l’exercici de la funció del propi estat sacerdotal, diaconal o laïcal, dins l’Església, cercant de participar de forma diversa de l’únic esperit de Crist segons el propi carisma<sup class=\"fn-ref\" data-fn=\"127\">[127]</sup>.", "Els missioners en període de formació conrearan i obriran a l’acció de l’Esperit Sant el cor i l’enteniment, bo i observant les normes del nostre sistema formatiu. Els estudiants conrearan les ciències, les sagrades sobretot, amb el més gran interès."], "subs": []}, {"n": 73, "text": "A fi de prendre consciència cada cop més madura i pregona de la seva vocació –enmig d’un món en canvi–, aprenguin vitalment a donar la seva adhesió a Crist amb fermesa i constància, segons el carisma que ens és proposat en les Constitucions.", "paras": ["Aprofitin confiadament l’ajut del prefecte i del director espiritual.", "Demanin a Déu sense parar que els faci servidors idonis de la divina Paraula<sup class=\"fn-ref\" data-fn=\"128\">[128]</sup> per a estendre el seu nom i propagar arreu del món el Regne de Déu.", "Estimin i venerin amb confiança filial la Verge santa Maria, formadora d’apòstols."], "subs": []}, {"n": 74, "text": "Els missioners en formació han d’adquirir un coneixement adient de la situació social i política dels homes i les circumstàncies: així, discernint críticament a la llum de la fe les situacions del món i arborats de zel apostòlic, podran respondre més eficaçment a les necessitats de la gent."
