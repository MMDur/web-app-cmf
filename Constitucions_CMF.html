, "paras": [], "subs": []}, {"n": 75, "text": "El destí al futur ministeri haurà de tenir en compte tant les inclinacions i el tarannà de cadascú com les necessitats de l’Església i de la Congregació. Durant el període de formació, cal aprendre teòricament i pràctica l’art de l’apostolat.", "paras": [], "subs": []}, {"n": 76, "text": "La responsabilitat de la formació missionera, donada la seva importància, recau sobre tota la Congregació, la província i la comunitat educativa.", "paras": [], "subs": []}, {"n": 77, "text": "El càrrec de prefecte és molt important, tant pel seu fi com per les conseqüències. Perquè, si la conversió d’un sol pecador és una obra tan meritòria, molt més ho és la formació de ministres idonis que al seu temps seran, com qui diu, instruments de la salvació de molts. Per això, aquell a qui es confiarà un càrrec de tanta importància, s’instruirà bé en el seu ofici i mirarà d’acomplir-lo amb el màxim interès.", "paras": ["Estimi tots per igual i conegui les necessitats de cadascun. En les seves instruccions, exposi la doctrina referent a la nostra vida missionera. Amb l’exemple més que no pas amb paraules, treballi perquè assimilin aquest tipus de vida amb un convenciment íntim de fe.", "Els missioners germans, diaques, preveres"], "subs": []}, {"n": 78, "text": "Tots els membres de la Congregació, tendint com tendeixen unànimement vers el mateix fi segons la gràcia que els ha estat donada<sup class=\"fn-ref\" data-fn=\"129\">[129]</sup>, col·laboren al bé de tot el cos. Això sí, tots i cada u en l’acompliment de la seva vocació, estan obligats a apreciar i a defensar com cal el propi carisma i les gràcies que el mateix Esperit ha atorgat als altres<sup class=\"fn-ref\" data-fn=\"130\">[130]</sup>.", "paras": [], "subs": []}, {"n": 79, "text": "Els missioners germans sàpiguen que el seu carisma ve marcat pel caràcter laïcal. Des del bell principi ingressaren en la nostra Congregació uns laics amb la intenció de cooperar a la seva missió d’una manera pròpia d’ells.", "paras": ["Aquesta vocació a compartir la vida missionera de la Congregació en tant que laics, ha de ser el motiu autèntic de llur consagració. Apreciïn doncs, com cal tots els trets característics del laïcat per a viure’ls segons el nostre esperit missioner.", "Els germans aporten en bé de la missió de la Congregació, les preocupacions i expectatives d’aquest món, ells que les viuen tan de prop."], "subs": []}, {"n": 80, "text": "En l’evangelització de tot el món, els missioners germans hi tenen un paper importantíssim: ser cooperadors de la veritat<sup class=\"fn-ref\" data-fn=\"131\">[131]</sup>. En aquesta obra, l’apostolat dels laics i el ministeri pastoral es completen mútuament.", "paras": ["Renovellin constantment en- ells mateixos l’esperit missioner, a fi que Crist ocupi en tot el primer lloc<sup class=\"fn-ref\" data-fn=\"132\">[132]</sup> i donin testimoniatge enmig dels oficis i professions temporals. En efecte, qualsevol col·laboració seva en la comunitat missionera, té sempre un valor plenament apostòlic<sup class=\"fn-ref\" data-fn=\"133\">[133]</sup>."], "subs": []}, {"n": 81, "text": "Els missioners diaques, ordenats per vocació específica a ser-ho pel diaconat permanent, envigorits com estan per la gràcia sacramental, serveixen evangèlicament el Poble de Déu i la pròpia comunitat en el servei de la Paraula, de la litúrgia i de la caritat, a imitació de Jesús que no ha vingut pas a ser servit, sinó a servir<sup class=\"fn-ref\" data-fn=\"134\">[134]</sup>. Portin a tothom la Bona Nova de Jesús<sup class=\"fn-ref\" data-fn=\"135\">[135]</sup>, bo i seguint-lo: així, plens de gràcia i de fortalesa<sup class=\"fn-ref\" data-fn=\"136\">[136]</sup>, podran donar testimoniatge eficaç de la seva glòria<sup class=\"fn-ref\" data-fn=\"137\">[137]</sup>. Enfortits per l’Esperit Sant<sup class=\"fn-ref\" data-fn=\"138\">[138]</sup> –que és amor– refermin l’amor entre els fidels i desvetllin en ells el sentit de la justícia<sup class=\"fn-ref\" data-fn=\"139\">[139]</sup>.", "paras": [], "subs": []}, {"n": 82, "text": "Els missioners preveres que comparteixen la funció dels Apòstols, són enviats, com a valuosos col·laboradors dels bisbes, a anunciar la Paraula de Déu, amb un estil de vida evangèlic i profètic. Per això, és deure peculiar seu dedicar-se amb esperit missioner al bé de totes les comunitats eclesials.", "paras": [], "subs": []}, {"n": 83, "text": "Configurats pel sagrament de l’Orde a Crist Sacerdot, el representen sobretot en la celebració de l’Eucaristia. En compartiran, doncs, la mort i la vida, de manera que, enmig de la comunitat humana, desvetllin en els altres el memorial de la presència del Senyor.", "paras": ["Escollits d’entre els homes, són posats a favor dels homes en allò que pertoca a Déu<sup class=\"fn-ref\" data-fn=\"140\">[140]</sup>. Així, per tal de servir-los amb més eficàcia, no visquin al marge de la vida i de les situacions dels altres homes; tractin amb ells com amb germans, fent-se tot a tots<sup class=\"fn-ref\" data-fn=\"141\">[141]</sup>. Atenguin pastoralment els malalts i els qui es troben marginats per qualsevol causa."], "subs": []}, {"n": 84, "text": "Demanin al Senyor i mirin de practicar un amor pastoral que els disposi a donar generosament la vida pels germans<sup class=\"fn-ref\" data-fn=\"142\">[142]</sup>. Preguin, doncs, cada dia Déu Pare per l’Església i per la salvació del món, sobretot en la celebració del memorial del Senyor i en la recitació de la litúrgia de les hores. Estiguin sempre a punt a prestar els auxilis propis del ministeri sacerdotal.", "paras": [], "subs": []}, {"n": 85, "text": "En la predicació i en qualsevol actuació pastoral –com a autèntics servents de Déu<sup class=\"fn-ref\" data-fn=\"143\">[143]</sup>– es guiaran per l’esperit de l’Església i mantindran una germanor gran entre ells, treballant de bon grat en equip.", "paras": ["Constitució orgànica de la Congregació"], "subs": []}, {"n": 86, "text": "La nostra Congregació, suscitada per l’Esperit Sant i erigida per l’Església, gràcies a la vocació i missió comunes a tots els germans, és, com l’Església mateixa, una comunitat carismàtica i institucional, i es classifica entre les clericals. Vet aquí per què ella comprèn també tots els elements institucionals necessaris per al millor acompliment de la seva missió.", "paras": ["Tots aquests elements i totes les normes de govern estan al servei de la caritat fraterna alhora, tenen com a objectiu mantenir la Congregació ben disponible al servei de l’Església universal."], "subs": []}, {"n": 87, "text": "La nostra Congregació consta de Províncies, delegacions, cases i residències.", "paras": [], "subs": []}, {"n": 88, "text": "Província és el conjunt de diverses comunitats locals —cases i residències— que mantenen entre elles una relació especial i comunicació veritable. Forma una part de la Congregació sota un mateix superior que la governa amb potestat ordinària. Les províncies poden ser formades o en vies de formació.", "paras": ["Delegació independent és el mateix conjunt de comunitats locals unides sota un mateix superior que les governa amb potestat delegada del Superior General.", "Delegació dependent, en canvi, és quan la governa un superior amb potestat delegada del superior provincial."], "subs": []}, {"n": 89, "text": "Casa és la comunitat fundada de manera estable en un lloc. És en ella on es desenrotlla la vida missionera. Consta almenys de tres professos, que comparteixen la fraternitat sota l’autoritat d’un superior que la regeix amb potestat ordinària.", "paras": ["Residència és una comunitat sense l’esmentada estabilitat, fundada segons la norma del dret nostre amb vista a l’exercici d’algun ministeri o per alguna altra raó. És governada per un delegat del Superior Major."], "subs": []}, {"n": 90, "text": "S’anomenen missions les províncies, delegacions, cases i residències que frueixen d’un règim especial.", "paras": [], "subs": []}, {"n": 91, "text": "L’erecció i supressió de cases queden reservades al Superior General amb el seu Consell, un cop escoltats els individus interessats i observades les prescripcions del dret universal.", "paras": ["L’erecció, transformació o supressió de províncies i delegacions, les fa el Superior General amb el vot deliberatiu dels consellers, un cop escoltats els individus i els governs provincials afectats per aquesta decisió."], "subs": []}, {"n": 92, "text": "La nostra Congregació és governada pel Superior General, pels superiors provincials, pels delegats i pels superiors locals, cadascú amb el consell corresponent.", "paras": ["I rep l’orientació dels capítols, general o provincial.", "Principis de govern"], "subs": []}, {"n": 93, "text": "La legislació i la nostra forma de govern han de respondre a la naturalesa plenament apostòlica de la Congregació i han de recolzar en els criteris de la vida missionera. La interrelació i la interdependència entre comunitat i govern s’han d’estendre a totes les estructures de govern. Per això el govern ha de ser compartit per tots amb esperit de col·laboració i s’ha d’exercir amb l’ordre degut.", "paras": [], "subs": []}, {"n": 94, "text": "Els nostres superiors són designats per nomenament o elecció, segons la norma del dret propi. En prendre possessió del càrrec, faran la professió de fe segons la fórmula aprovada per la Seu Apostòlica, davant la comunitat, o, si han estat elegits en Capítol, davant el Capítol mateix.", "paras": ["Els Superiors, expressant l’amor amb què Déu estima els germans i amb respecte a la persona humana, menin els germans cap a una col·laboració feta d’obediència activa i responsable, fins en virtut del vot, en l’acompliment dels càrrecs i en les iniciatives noves que es prenguin."], "subs": []}, {"n": 95, "text": "L’autoritat s’ha d’exercir ordenadament. Deixi’s, doncs, a la persona a la qual s’hagi confiat algun càrrec o empresa, el marge de llibertat necessari per a dur a terme íntegrament i sense traves la seva obra, excepte quan el bé comú demani la intervenció del superior, l’immediat o el major, segons els casos.", "paras": [], "subs": []}, {"n": 96, "text": "Puix que tota autoritat en la nostra Congregació s’exerceix subordinadament, qualsevol superior pot ser remogut per aquell que el nomenà, quan una causa greu ho aconselli o ho exigeixi el bé comú, segons les normes del dret i un cop escoltat l’interessat. En cas d’elecció, el pot remoure el qui té el dret de confirmació.", "paras": [], "subs": []}, {"n": 97, "text": "Els superiors majors, cadascun en el seu grau i jurisdicció, frueixen de potestat eclesiàstica legislativa, executiva i judicial, segons la norma del dret, tant per al fur extern com per a l’intern. El Superior local frueix de potestat de règim només executiva.", "paras": ["Així també, el Superior General, provincial i de delegació, en el seu grau i jurisdicció, representen per dret propi tota la Congregació, la província o la delegació, actuen en el seu nom i poden afranquir-les o obligar-les tant canònicament i civilment com moralment, sempre segons la norma del dret universal i del propi nostre."], "subs": []}, {"n": 98, "text": "Província i cases s’han de complementar mútuament amb la comunicació de persones i de béns temporals, sota la direcció dels superiors, de manera que les que més tinguin ajudin les qui passen necessitat.", "paras": [], "subs": []}, {"n": 99, "text": "La Congregació considera els béns temporals com uns ajuts que li cal esmerçar en el seu fi apostòlic. Com que també són béns eclesiàstics, els ha d’administrar atenint-se a les normes del dret universal de l’Església i del propi nostre com també d’acord amb el sentit de la pobresa evangèlica.", "paras": [], "subs": []}, {"n": 100, "text": "No solament la Congregació, sinó també les províncies, delegacions i cases són persones jurídiques i poden adquirir qualssevol béns temporals, posseir-los, administrar-los i alienar-los, segons la norma del dret. La propietat dels béns de la Congregació és subordinada.", "paras": [], "subs": []}, {"n": 101, "text": "Les persones jurídiques de la Congregació solament respondran dels deutes, obligacions i contractes que hagin estat contrets d’acord amb les normes del dret universal i del propi nostre, en nom seu, en virtut del càrrec o d’un mandat. De tots els altres n’hauran de respondre moralment, jurídicament i econòmicament davant la Congregació, l’Església i l’autoritat civil, els qui els hauran contrets invàlidament o il·lícita.", "paras": ["Però cada persona jurídica de la Congregació ha de respondre civilment només dels propis deutes, obligacions i contractes.", "Govern de la comunitat local"], "subs": []}, {"n": 102, "text": "La vida missionera es realitza de forma especial en la comunitat local. És en ella on, ben agermanats, acomplim la nostra missió de servei al Poble de Déu.", "paras": [], "subs": []}, {"n": 103, "text": "Al front de les cases de la Congregació, al servei de la missió, hi ha el superior local, signe de comunió i vincle d’unitat. En les residències, acompleix aquestes funcions un delegat, designat pel superior.", "paras": ["El superior ha de ser un home verament espiritual i ple de zel de les ànimes, addicte de debò a la Congregació, assenyat i dotat amb el talent corresponent."], "subs": []}, {"n": 104, "text": "El superior, que ha d’esperonar la comunitat i dirigir-la cap a una intensa vida i activitat missionera, presta el seu servei:", "paras": ["1) Promovent amb gran amor el bé dels germans.", "2) Cercant i esbrinant conjuntament amb els altres la voluntat de Déu sobre la comunitat i sobre cada germà, quan s’escaigui, decidint personalment i de forma obligatòria per a la comunitat, si no s’arriba a l’acord després que s’ha cercat la voluntat de Déu o s’ha intentat el discerniment comunitari.", "3) Si convé, decidint sota la seva responsabilitat els afers necessaris. Tanmateix ho farà saber a la comunitat si és possible i sembla oportú.", "4) Confortar els germans amb el seu exemple i amb les seves paraules sinceres d’encoratjament i d’elogi, i conduint-los també amb avisos i correccions, si cal, perquè es mantinguin fidels a les seves promeses i a les altres obligacions de la nostra vida. Els servirà també la paraula de Déu, amb la col·laboració dels germans i, si convé, cridant-n’hi d’altres.", "5) Mantenint la comunitat vinculada al govern de la província o delegació i amb les altres comunitats de la província i delegació, i fins i tot de la Congregació.", "6) Tenint la comunitat ben disponible al servei de l’Església local, prestant la seva lleial col·laboració també a les associacions de laics."], "subs": []}, {"n": 105, "text": "El superior representa per dret propi la casa o comunitat i n’exerceix la personalitat jurídica en tots els actes jurídics, canònics o civils, segons la norma del dret universal i del propi nostre.", "paras": [], "subs": []}, {"n": 106, "text": "La forma d’elecció dels superiors locals és determinada pel Capítol Provincial en les províncies respectives. La designació es pot fer per nomenament del superior provincial amb el seu consell o per elecció de la comunitat. En qualsevol cas, cal procedir segons la norma del dret.", "paras": ["En les delegacions independents i en cada casa generalícia, el Govern General fixarà la forma de designació.", "El nomenament o elecció del superior local és per a un trienni, prorrogable per a un segon trienni si hi ha alguna raó especial, per a un tercer trienni consecutiu en la mateixa casa, segons la norma del dret."], "subs": []}, {"n": 107, "text": "En totes les cases  ha d’haver-hi també un vicari i un ecònom. Per a determinar-ne la forma de designació, es procedeix de la mateixa manera que per als superiors locals. Segons la norma del dret ells fan l’ofici de consellers juntament amb el superior, assumeixen els deures del càrrec que la comunitat en conjunt no pot exercir fàcilment o escaientment. Ajudin encara el superior quan es tracta d’afavorir la vida i la missió de la comunitat.", "paras": [], "subs": []}, {"n": 108, "text": "Toca al vicari suplir el superior cessant, absent o impedit. El principal deure de l’ecònom és de cercar, amb esperit de servei, el bé dels germans i el de la missió de la comunitat, tenint-ne cura de les coses temporals. Amb aquesta finalitat, pot fer les despeses i actes d’administració ordinària. Guardi fidelment la pobresa, evitant alhora la prodigalitat i la gasiveria.", "paras": [], "subs": []}, {"n": 109, "text": "En les missions, el superior major amb el seu consell, després d’escoltar els qui en formen part, determinarà la forma de designació del superior, vicari i ecònom. El superior local pot fer les funcions d’ecònom. Alguna vegada les cases poden ser constituïdes segons la norma de les residències.", "paras": [], "subs": []}, {"n": 110, "text": "La junta plenària, que neix de la naturalesa mateixa de la comunitat local, consta de tots els germans professos de la comunitat. En ella la comunitat participa i es responsabilitza dels compromisos contrets i de l’orientació, avaluació i discerniment de tot allò que pertany al seu caràcter i al seu programa d’acció. La mateixa comunitat en fixa la manera i la freqüència, d’un cop al mes, com a mínim.", "paras": ["El govern de la comunitat provincial"], "subs": []}, {"n": 111, "text": "Les províncies i delegacions, que s’anomenen organismes majors, són parts de l’única Congregació. Així es comparteix de forma ordenada la missió universal de la Congregació i s’assoleix més eficaçment la vinculació de les comunitats entre elles i amb la Congregació. Per això són posats al davant de les províncies i delegacions els superiors que representen el vincle d’unitat i també de comunió amb tota la Congregació sota el guiatge del Superior General.", "paras": [], "subs": []}, {"n": 112, "text": "El Superior provincial, a més dels requisits prescrits pel dret universal, ha de ser un home escollit, ple de zel apostòlic i de provada fidelitat a l’Església i a la Congregació, amb la qual ha d’estar vinculat amb cinc anys almenys de professió perpètua.", "paras": [], "subs": []}, {"n": 113, "text": "És deure del superior provincial:", "paras": ["1) Tenir la província ben disponible al servei de l’Església, sobretot en la seva demarcació, segons les exigències de la pastoral de conjunt; guardant tanmateix la unitat del carisma amb tota la Congregació.", "2) Ser el motor i capdavanter de la vida missionera en totes i cadascuna de les comunitats i corregir amb amor els possibles abusos.", "3) Fomentar, mitjançant estructures adients de comunicació i de participació, la responsabilitat de les comunitats en la missió de la província.", "4) Conèixer bé el personal de la província doncs, visitar sovint casa per casa, a part de la visita canònica preceptiva almenys un any sí i l’altre no.", "5) Maldar perquè tota la província es faci responsable i es comprometi en la promoció de vocacions i que s’esmerci el màxim interès en el progrés dels qui s’estan formant i de tots els altres germans.", "6) Ser fidel a les exigències que comporta la plena comunió amb el Superior General i acomplir acuradament tots els encàrrecs que en rebi.", "7) Promoure el servei de la paraula, també escrita, i atorgar als germans la necessària llicència per poder publicar escrits sobre qüestions religioses o morals, segons la norma del dret."], "subs": []}, {"n": 114, "text": "El superior provincial és elegit segons la norma del nostre dret, en capítol provincial i amb majoria absoluta de vots, prèvia consulta a tots els membres de la província, i és confirmat pel Superior General amb el seu consell.", "paras": ["El Govern General pot concedir a alguna província –si el seu capítol li ho demana expressament– que el superior provincial sigui designat d’una altra forma, segons la norma del nostre dret.", "Tant en les províncies formades com en les que estan en vies de formació, el provincial és elegit o designat per al temps que determina la nostra legislació."], "subs": []}, {"n": 115, "text": "El superior provincial és ajudat pels consellers, amb els quals tracta sovint de la situació de la província; amb ells ventila els assumptes més importants. Els consellers expressen llur participació en el govern sobretot amb el vot deliberatiu o consultiu segons els casos. Facin costat en tot al superior provincial, salvada la llibertat d’avisar-lo o també, si s’escau, d’informar-ne el Superior General.", "paras": [], "subs": []}, {"n": 116, "text": "Els consellers provincials, que han de ser almenys dos, són elegits o designats de la mateixa manera que el superior provincial, segons la norma del nostre dret, i segueixen la sort d’aquest quant a la durada del càrrec.", "paras": [], "subs": []}, {"n": 117, "text": "El Superior provincial escull entre els consellers designats el seu vicari que és el primer dels consellers ultra les delegacions que li faci el Superior provincial, el supleix quan cessa, en les absències o quan es troba impedit.", "paras": ["L’ecònom provincial és elegit o designat de la mateixa manera que els consellers, fins i tot quan no és del consell. Les seves qualitats, drets i deures en l’àmbit de la província, han de ser els mateixos que es determinen per a l’ecònom general.", "El secretari provincial és designat pel superior provincial, segons la norma del nostre dret."], "subs": []}, {"n": 118, "text": "Els superiors de les delegacions independents han de tenir les mateixes qualitats que els superiors provincials. Són nomenats pel Superior General amb el seu consell per a un període determinat. El nostre dret defineix les seves facultats habituals. Però en l’ús d’aquestes facultats depenen de manera especial del superior delegant, que també li’n pot concedir d’altres, segons el seu criteri.", "paras": [], "subs": []}, {"n": 119, "text": "Els superiors de les delegacions dependents, que tenen una circumscripció que forma part d’una província, són nomenats «ad tempus» pel superior provincial amb el seu consell. El nomenament, però, ha de tenir el vist-i-plau del Superior General. Els drets i deures dels delegats vénen definits en el mateix nomenament.", "paras": [], "subs": []}, {"n": 120, "text": "El superior de la delegació té dos consellers, que poden fer l’ofici d’ecònom i de secretari. Són nomenats de la mateixa forma que el superior delegat.", "paras": [], "subs": []}, {"n": 121, "text": "El superior de la província o delegació designades amb el nom de missió, com també els consellers o oficials, són constituïts segons les mateixes normes. Això sí, per un dret excepcional, si es tracta de províncies i el bé de la missió ho reclama, poden ser nomenats també pel Superior General amb el seu consell, un cop escoltats els individus de la missió.", "paras": [], "subs": []}, {"n": 122, "text": "El capítol provincial és l’òrgan de govern que representa la província i n’expressa la participació, la corresponsabilitat i la plena comunió. Cal vetllar en gran manera perquè gràcies a ell, la comunitat provincial assoleixi el grau més alt i pregon de vigor de la vida missionera i s’ajusti i s’obri a la comunitat general de l’Institut.", "paras": [], "subs": []}, {"n": 123, "text": "El Capítol provincial serà convocat pel Superior provincial després d’escoltar el Superior General pel que fa a la data i al lloc de la celebració. L’ordinari es farà quan s’hagi d’elegir Superior provincial. L’extraordinari sempre que el demani el bé espiritual o temporal de la província, a judici del govern provincial, aprovat pel Superior General amb els seus consellers.", "paras": [], "subs": []}, {"n": 124, "text": "Intervenen en el capítol provincial:", "paras": ["1) El Superior General o bé el seu delegat, com a president.", "2) El superior provincial amb els seus consellers, l’ecònom i el secretari, baldament aquests no siguin consellers.", "3) Els superiors locals.", "4) Tants delegats com superiors locals hi hagi a la província. La forma d’elecció dels delegats ve determinada pel nostre dret.", "5) Els designats pel superior provincial amb el seu consell segons el nombre que li haurà permès de designar el capítol provincial anterior."], "subs": []}, {"n": 125, "text": "El capítol provincial:", "paras": ["1) Examina l’estat de la província per a definir el programa d’acció de cara al futur.", "2) Aplica les normes í directrius del Capítol General a les circumstàncies pròpies dels llocs i de les persones, pel que fa a la vida missionera, tenint en compte la pastoral de conjunt amb l’altre clergat, diocesà i religiós.", "3) Elegeix el superior provincial amb els seus consellers i l’ecònom, o bé en determina una altra forma d’elecció, segons la norma del nostre dret.", "4) Determina la manera d’elegir els superiors, vicaris i ecònoms locals segons les diverses opcions que preveu el nostre dret."], "subs": []}, {"n": 126, "text": "El capítol provincial és un capítol en el veritable i precís sentit de la paraula, i els seus decrets tenen força jurídica; necessiten, tanmateix, l’aprovació del Superior General amb el seu consell.", "paras": [], "subs": []}, {"n": 127, "text": "És bo que els superiors majors convoquin assemblees de superiors i altres germans, fins i tot de tota la província, amb el consell provincial o de la delegació, en el temps i la manera convenients.", "paras": ["Els visitadors"], "subs": []}, {"n": 128, "text": "El dret universal i el propi nostre estableixen la visita dels superiors majors com a acte de govern extraordinari, per tal d’enfortir els lligams d’unió en la Congregació i dirigir-ne la vida i missió vers el seu objectiu.", "paras": [], "subs": []}, {"n": 129, "text": "El visitador comparteixi amb els germans la vida de cada dia, maldi per conèixer llurs aspiracions i dificultats, escolti’ls de bon grat, d’aquesta manera, promogui la cooperació unànime de tots al bé de l’Institut i de l’Església.", "paras": [], "subs": []}, {"n": 130, "text": "Durant les visites, se celebrarà junta plenària de la comunitat per a fomentar la unió i la germanor, per a definir i il·luminar la missió pròpia i característica de la comunitat. També per a esbrinar si s’han acomplert o no els programes anteriors, i per a formular nous projectes de vida i d’acció. Finalment per a estimular l’esperit i la voluntat de tots a la fidelitat.", "paras": [], "subs": []}, {"n": 131, "text": "Les prescripcions dels visitadors seran com l’epíleg del diàleg de la visita; un epíleg que, endemés dels avisos i correccions que tal volta calguin, els confirmi a tots en el goig de la vocació missionera i forneixi a la comunitat nous estímuls i iniciatives pastorals.", "paras": [], "subs": []}, {"n": 132, "text": "El Superior General, una vegada almenys durant el sexenni, visitarà personalment o per delegat, amb l’atenció que es mereixen, les cases i les residències de la Congregació. Si és possible, però, visitarà personalment més sovint la cúria i les cases de formació de les províncies.", "paras": [], "subs": []}, {"n": 133, "text": "El superior major legítimament impedit de fer les visites prescrites a les Constitucions, podrà, prèvia consulta al consell, delegar un altre individu idoni del mateix organisme major.", "paras": [], "subs": []}, {"n": 134, "text": "Ultra les visites d’obligació, convé que els superiors majors visitin de tant en tant les cases, sobretot les de formació.", "paras": ["El govern de la comunitat general"], "subs": []}, {"n": 135, "text": "La nostra Congregació expressa el do de l’Esperit que l’Església ha sancionat i amb el qual tots plegats hem estat cridats a acomplir ordenadament la missió universal. Ara bé, la comunitat de missió reclama una constitució orgànica per tal de conservar millor la comunió de tots els germans i coordinar més adequadament les iniciatives i projectes de cadascú.", "paras": [], "subs": []}, {"n": 136, "text": "Perquè tota la Congregació acompleixi fidelment la seva missió, és governada per un Superior General que tindrà la missió principalíssima de tenir la Congregació disponible a l’Església i a tota la humanitat, segons les necessitats de temps i de llocs.", "paras": ["En efecte, ell és el signe de comunió i el lligam d’unitat per a tota la Congregació, sobre la qual exerceix la suprema autoritat amb potestat ordinària."], "subs": []}, {"n": 137, "text": "Ultra les condicions exigides pel dret universal, cal elegir per a Superior General un home amb proves evidents de prudència, talent, zel apostòlic, amor a la Congregació, observança de les Constitucions i pràctica de les altres virtuts. I a més porti cinc anys almenys de professió perpètua.", "paras": [], "subs": []}, {"n": 138, "text": "Els deures del Superior General són:", "paras": ["1) Dirigir eficaçment la Congregació cap al seu objectiu apostòlic i afavorir-hi el vigor de la vida religiosa.", "2) Nodrir l’esperit de comunió fraterna en la vida i ministeri de la Congregació, i promoure entre tots el treball d’equip.", "3) Aplicar pràcticament l’esperit i la voluntat del Capítol General i il·luminar el carisma.", "4) Procurar la conservació i augment de la Congregació. Promoure pertot arreu les vocacions i vetllar per la formació dels nostres.", "5) Amb un esperit autènticament apostòlic, atendre a l’extensió de la Congregació, sobretot en les missions.", "6) Amb unes estructures adients de comunicació i participació, fomentar la responsabilitat dels superiors majors en la missió, tant de la província com de tota la Congregació.", "7) Promoure, en la mesura de les possibilitats, el bé espiritual i temporal de tots els germans de la Congregació, i excardinar-los o incardinar-los segons les necessitats de la missió de la Congregació.", "8) Fer personalment o pels delegats les visites generals i presidir els capítols provincials.", "9) Tractar personalment o per algun altre els afers de la Congregació davant la Seu Apostòlica."], "subs": []}, {"n": 139, "text": "El Superior General és elegit en Capítol General per majoria absoluta de vots, per a sis anys, després dels quals podrà ser elegit per a un altre sexenni, també per majoria absoluta de vots.", "paras": ["Per a poder-lo reelegir per a un tercer sexenni consecutiu, s’exigeixen els dos terços dels vots."], "subs": []}, {"n": 140, "text": "L’elecció del Superior General es farà de forma verament canònica i de la manera legítimament establerta. Un cop feta, el president del Capítol proclamarà el nom de l’elegit, amb la fórmula prescrita. Seguidament tots retran homenatge al Superior General.", "paras": [], "subs": []}, {"n": 141, "text": "Ara, però, si –Déu nos en guard!– calia remoure del seu càrrec el Superior General, per tal com, a judici del vicari i dels altres consellers generals, el seu govern esdevé un desastre per a la Congregació, es portarà l’assumpte a la Seu Apostòlica. Abans de reunir-se el Capítol General, hom l’aconsellarà de bones maneres que prengui ell la iniciativa de renunciar al seu càrrec.", "paras": [], "subs": []}, {"n": 142, "text": "Vacant el càrrec de Superior General, per mort, renúncia o destitució, el vicari general o, si no n’hi ha, el primer conseller general que el segueixi, convocarà Capítol General per a l’elecció del Superior General, de la manera legítimament establerta.", "paras": [], "subs": []}, {"n": 143, "text": "Els consellers generals són veritables col·laboradors del Superior General i formen amb ell el Govern General de la Congregació i expressen la fraternitat i la missió apostòlica de tota la Congregació.", "paras": [], "subs": []}, {"n": 144, "text": "Per al càrrec de conseller general pot ser elegit qualsevol profés perpetu mentre excel·leixi per la prudència, l’esperit missioner, l’amor a l’Església i a la Congregació, i per la seva capacitat per a aconseguir i mantenir la unitat d’acció amb els companys de govern.", "paras": [], "subs": []}, {"n": 145, "text": "Els consellers generals, que sempre han de ser almenys dos, són elegits en Capítol General, de forma verament canònica i en nombre i en el mode legítimament establerts, d’entre les distintes parts del món on és implantada la Congregació. Són elegits per al temps en què és elegit el Superior General i cessen amb ell. Poden, però, ser reelegits. Quan en falti algun, el Superior General i els altres consellers han de nomenar-ne un altre.", "paras": [], "subs": []}, {"n": 146, "text": "El Superior General nomena com a Vicari seu un dels seus Consellers. Aquest és el Conseller en cap ultra les delegacions que el Superior General li confiï, supleix el mateix Superior cessant, absent o impedit.", "paras": [], "subs": []}, {"n": 147, "text": "Deures específics dels consellers generals són:", "paras": ["1) Tractar amb el Superior General els assumptes de més importància i ajudar-lo en el govern de la Congregació.", "2) Aplicar el programa d’acció elaborat pel Capítol General o preparat pel mateix Govern General.", "3) Animar i encoratjar els organismes majors i llurs federacions si s’escau, les comunitats particulars.", "4) Examinar i valorar la marxa de la vida missionera de la Congregació alhora, assenyalar l’ordre d’urgència i les prioritats en l’acompliment de la missió.", "5) Individualment o col·lectivament, amb el degut respecte, això sí, avisar el Superior General d’allò que potser no hagi fet tan bé."], "subs": []}, {"n": 148, "text": "Els consellers generals expressen llur participació en el Govern, sobretot amb el vot deliberatiu o consultiu. Es requereix el vot deliberatiu en el consell general sempre que es diu expressament en el dret universal o en el nostre dret propi, i també quan la solució de l’assumpte es deixa al Superior amb el seu consell o simplement al consell general.", "paras": ["El Superior General té obligació de demanar el vot consultiu dels consellers només quan es diu expressament en el dret universal o en el nostre dret propi. S’aconsella, però, que els demani el parer en els afers més greus o no tan clars que es puguin presentar."], "subs": []}, {"n": 149, "text": "L’ecònom i el secretari són els oficials generals de la Congregació.", "paras": [], "subs": []}, {"n": 150, "text": "L’ecònom general és elegit pel Capítol General i entra en el nombre dels consellers generals.", "paras": ["Els seus deures són:", "1) Administrar els béns temporals de la Congregació amb esperit de justícia, caritat i pobresa, al servei de tota la Congregació i dels seus membres, sota la direcció del Superior General.", "2) Esmerçar les donacions i llegats en els usos designats pels benefactors o bé, si no consta tal designació, fer-ne ús segons les orientacions del Superior General si la cosa s’ho val, dels Superior General amb el seu consell.", "3) Retre comptes al Govern General, un cop l’any almenys, de l’administració dels béns de la Congregació, de llur estat, dels rèdits i de l’ús que se n’ha fet."], "subs": []}, {"n": 151, "text": "El Superior General pot designar com a secretari general un dels seus consellers. Per a nomenar-ne un que no formi part del consell general, el Superior General necessita el consentiment dels seus consellers. El secretari ha de ser sol·lícit, prudent i amable.", "paras": [], "subs": []}, {"n": 152, "text": "Per al servei de tota la Congregació es poden constituir també altres càrrecs o oficis sota la direcció del Govern General, segons la norma del nostre dret.", "paras": [], "subs": []}, {"n": 153, "text": "El Capítol General, en la línia de l’obediència a l’Esperit i de fidelitat plena al nostre carisma missioner sancionat per l’Església, és la suprema autoritat de la Congregació per a servir el carisma als germans. Es el signe més alt de la comunió de vida i de missió de tota la Congregació. Representa autènticament la Congregació en el seu conjunt i expressa col·legialment la participació i l’interès de tots els germans en la vida de la Congregació i de la seva actuació a l’Església.", "paras": [], "subs": []}, {"n": 154, "text": "El Capítol General és convocat pel Superior General. El Capítol General Ordinari se celebrarà sempre que calgui procedir a l’elecció de Superior General. L’Extraordinari, sempre que, segons el parer del Superior General i els consellers, es vegi necessari per a la missió, creixement, extensió o renovellament de la Congregació o per qualsevol altre motiu de gran interès per a ella.", "paras": [], "subs": []}, {"n": 155, "text": "El Capítol General, amb l’esperit obert al Senyor i a les aspiracions de tota la Comunitat, tracta dels afers que afecten la Congregació entera. Per això:", "paras": ["1) Sospesa la situació real de la Congregació i promou sol·lícitament el seu renovellament adequat, tot oferint programes d’acció.", "2) Aplica a la Congregació la doctrina de l’Església sobre la vida religiosa i l’apostolat.", "3) Exerceix la funció del magisteri sobre el patrimoni espiritual de la Congregació.", "4) Interpreta de forma declarativa els dubtes i dificultats que sorgeixin sobre el sentit o l’observança de les Constitucions.", "5) Promulga els decrets i ordenacions que consideri necessaris o oportuns.", "6) Toca també al Capítol General l’elecció del Superior General i dels seus consellers i oficials."], "subs": []}, {"n": 156, "text": "Assisteixen al Capítol general:", "paras": ["1) El Superior General com a president, els consellers i oficials generals.", "2) Els superiors provincials.", "3) Un vocal de cada província i un altre de cada delegació independent.", "4) Els qui hagi decidit el Capítol General anterior per a guardar la proporció de la representació del personal de cada província.", "5) Aquells que el precedent Capítol hagi decretat per a representar les cases generalícies i tots aquells que hagi permès al Superior General amb el seu consell designar."], "subs": []}, {"n": 157, "text": "La Seu Apostòlica es reserva la interpretació autèntica d’aquestes Constitucions. Perquè sigui possible de canviar-ne alguna norma, es necessita l’aprovació de la Seu Apostòlica després d’una decisió presa pels dos terços dels vots en un Capítol General.", "paras": [], "subs": []}, {"n": 158, "text": "Les prescripcions d’aquestes Constitucions ens obliguen com a membres de la Congregació a fi de poder créixer en els camins del Senyor i en el servei del Regne de Déu. La força, però, d’aquesta obligació, cal entendre-la segons la naturalesa mateixa de cadascuna de les prescripcions. L’Església ens exhorta en gran manera a tots a pouar en les Constitucions el vigor de la nostra vida missionera.", "paras": ["amb què ens consagrem a Déu i ens incorporem a la Congregació"], "subs": []}, {"n": 159, "text": "Jo, N. N., com a resposta a la crida de Déu, vull cercar amb més dedicació la glòria de Déu, vull consagrar-m’hi plenament i seguir més de prop el Crist Senyor com els Apòstols, en el ministeri de la salvació dels homes de tot el món.", "paras": ["Per això, davant la família de Déu ací aplegada, a les vostres mans, N. N., em consagro a Déu Pare pel seu Fill Jesucrist en l’Esperit Sant i em lliuro per a un servei especial al Cor Immaculat de la Verge santa Maria a fi d’assolir l’objectiu per al qual ha estat fundada aquesta Congregació dins l’Església.", "Així, doncs, faig vot a Déu */ per sempre (per un any / per dos anys / per tres anys*) de castedat, pobresa i obediència i prometo viure en la comunitat de vida apostòlica d’aquesta Congregació de Missioners Fills de l’Immaculat Cor de la Verge Maria, segons les Constitucions que compliré amb tot el compte possible.", "Us prego, doncs, germans, que vulgueu ser testimonis de la meva Professió.", "Demaneu per mi que en el servei de Déu i de l’Església sigui fidel a l’esperit del Fundador sant Antoni Maria Claret i aconsegueixi la caritat perfecta.", "Amén", "| De l’Antic Testament | nn. CC |", "| Nb | 14,19 | 34 |", "| Prov | 15,5 | 18 |", "| Eccli | 3,14 | 18 |", "| Is | 6,5-8 | 63 |", "|  | 61,1. | 39 |", "|  | 61,1-2 | 3 |", "| Ez | 4,4-8 | 34 |", "|  | 22,30 | 34 |", "| Del Nou Testament | nn. CC |", "| Mt | 1,2 | 3 |", "|  | 4,1 | 53 |", "|  | 4,23 | 3 |", "|  | 5,1-12 | 4 |", "|  | 5,3 | 24 |", "|  | 5,4 | 42 |", "|  | 5,6 | // ════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════
let lang = localStorage.getItem('cmf_lang') || 'es';
let darkMode = localStorage.getItem('cmf_dark') === '1';
let fontSize = parseFloat(localStorage.getItem('cmf_fs') || '17');
let sidebarOpen = window.innerWidth > 640;
let indexOpen = false;

const $  = id => document.getElementById(id);
const qs = sel => document.querySelector(sel);
const qsa = sel => document.querySelectorAll(sel);

// ════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════
function init() {
  applyDark(darkMode);
  applyFontSize(fontSize);
  applyLang(lang, false);
  renderSidebar();
  renderContent();
  bindEvents();
  restoreScroll();
}

function applyDark(on) {
  document.documentElement.dataset.dark = on ? '1' : '0';
  $('btn-dark').title = on ? 'Modo claro' : 'Modo oscuro';
}
function applyFontSize(sz) {
  document.documentElement.style.setProperty('--base-size', sz + 'px');
}
function applyLang(l, rerender = true) {
  lang = l;
  const s = CMF_STRUCT[lang];
  document.documentElement.lang = lang;
  $('topbar-title').textContent = s.title;
  $('lang-toggle').textContent = lang === 'es' ? 'CA' : 'ES';
  $('lang-toggle').title = lang === 'es' ? 'Llegir en català' : 'Leer en español';
  $('search-input').placeholder = lang === 'es' ? 'Buscar en las Constituciones…' : 'Cercar a les Constitucions…';
  $('index-panel-title').textContent = lang === 'es' ? 'Índice Analítico' : 'Índex de Matèries';
  localStorage.setItem('cmf_lang', lang);
  if (rerender) { renderSidebar(); renderContent(); renderIndex(); }
}

// ════════════════════════════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════════════════════════════
function renderSidebar() {
  const s = CMF_STRUCT[lang];
  let html = '';

  // CF link
  html += `<div class="nav-section">
    <a class="nav-cf-link" data-art="${s.cf.range[0]}" onclick="goToArt(${s.cf.range[0]}); return false">
      ${s.cf.title}
      <span class="art-range">nn. ${s.cf.range[0]}–${s.cf.range[1]}</span>
    </a>
  </div>`;

  // Parts
  s.parts.forEach((part, pi) => {
    html += `<div class="nav-section">
      <div class="nav-part-header" onclick="togglePart(${pi})">
        <span>${part.title}</span>
        <span class="chevron">▶</span>
      </div>
      <div class="nav-chapters" id="nav-part-${pi}">`;
    part.chapters.forEach(ch => {
      html += `<a class="nav-link" onclick="goToArt(${ch.range[0]}); return false">
        <strong>${ch.title}</strong> — ${ch.long}
        <span class="art-range">nn. ${ch.range[0]}–${ch.range[1]}</span>
      </a>`;
    });
    html += '</div></div>';
  });

  // Annexes
  html += '<div class="nav-section" style="margin-top:8px">';
  s.annexes.forEach(a => {
    html += `<a class="nav-annex-link" onclick="goToArt(${a.range[0]}); return false">
      ${a.title}
      <span class="art-range">${a.range[0] === a.range[1] ? 'n. ' + a.range[0] : 'nn. ' + a.range[0] + '–' + a.range[1]}</span>
    </a>`;
  });
  html += '</div>';

  $('sidebar-inner').innerHTML = html;
}

function togglePart(pi) {
  const el = $(`nav-part-${pi}`);
  const hdr = el.previousElementSibling;
  el.classList.toggle('open');
  hdr.classList.toggle('open');
}

function goToArt(n) {
  const el = document.getElementById(`art${n}`);
  if (!el) return;
  const offset = 52 + 16;
  const top = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top, behavior: 'smooth' });
  // Close sidebar on mobile
  if (window.innerWidth <= 640) { sidebarOpen = false; updateSidebar(); }
  highlightArt(n);
}

function highlightArt(n) {
  qsa('.article.highlight').forEach(e => e.classList.remove('highlight'));
  const el = document.getElementById(`art${n}`);
  if (el) {
    el.classList.add('highlight');
    setTimeout(() => el.classList.remove('highlight'), 2000);
  }
}

// ════════════════════════════════════════════════════════════════════
// CONTENT
// ════════════════════════════════════════════════════════════════════
function renderContent() {
  const s = CMF_STRUCT[lang];
  const articles = CMF_DATA[lang].articles;
  const artMap = {};
  articles.forEach(a => artMap[a.n] = a);
  let html = '';

  function renderRange(range, chTitle, partLabel, isCF) {
    html += `<div class="section-block">`;
    if (partLabel) html += `<div class="part-heading">${partLabel}</div>`;
    html += `<h2 class="chapter-heading${isCF ? ' cf' : ''}">${chTitle}</h2>`;
    for (let n = range[0]; n <= range[1]; n++) {
      const a = artMap[n];
      if (!a) continue;
      html += renderArticle(a);
    }
    html += '</div>';
  }

  // CF
  renderRange(s.cf.range, s.cf.title, '', true);

  // Parts
  s.parts.forEach(part => {
    part.chapters.forEach((ch, ci) => {
      const partLabel = ci === 0 ? `${part.title} · ${part.subtitle}` : '';
      renderRange(ch.range, `${ch.title} · ${ch.long}`, partLabel, false);
    });
  });

  // Annexes
  s.annexes.forEach(a => {
    renderRange(a.range, a.title, '', false);
  });

  $('content').innerHTML = html;

  // Bind footnote clicks
  qsa('.fn-ref').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      showFootnote(el.dataset.fn);
    });
  });

  // Bind index links
  bindIndexLinks();
}

function renderArticle(a) {
  let inner = `<p>${a.text}</p>`;
  if (a.paras && a.paras.length) {
    a.paras.forEach(p => { inner += `<p>${p}</p>`; });
  }
  let subs = '';
  if (a.subs && a.subs.length) {
    subs = '<ul class="article-subs">';
    a.subs.forEach(s => { subs += `<li>${s}</li>`; });
    subs += '</ul>';
  }
  return `<div class="article" id="art${a.n}">
    <div class="article-num"><span class="num-badge">${a.n}</span></div>
    <div class="article-text">${inner}${subs}</div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
// FOOTNOTES
// ════════════════════════════════════════════════════════════════════
function showFootnote(num) {
  const fns = CMF_DATA[lang].footnotes;
  const text = fns[num] || '—';
  $('fn-panel-label').textContent = `[${num}]`;
  $('fn-panel-text').textContent = text;
  const panel = $('fn-panel');
  panel.classList.add('visible');
  panel.classList.toggle('sidebar-closed', !sidebarOpen);
  // Highlight the ref
  qsa('.fn-ref.active').forEach(e => e.classList.remove('active'));
  qsa(`.fn-ref[data-fn="${num}"]`).forEach(e => e.classList.add('active'));
}
$('fn-panel-close').onclick = () => {
  $('fn-panel').classList.remove('visible');
  qsa('.fn-ref.active').forEach(e => e.classList.remove('active'));
};

// ════════════════════════════════════════════════════════════════════
// INDEX
// ════════════════════════════════════════════════════════════════════
function renderIndex() {
  const idx = CMF_DATA[lang].index;
  renderIndexFiltered(idx);
}

function renderIndexFiltered(entries) {
  let html = '';
  entries.forEach(e => {
    html += `<div class="idx-entry">
      <div class="idx-term">${e.term}</div>
      <div class="idx-desc">${e.desc}</div>
    </div>`;
  });
  $('index-list').innerHTML = html || '<div style="padding:20px;color:var(--text3);text-align:center">—</div>';
  bindIndexLinks();
}

function bindIndexLinks() {
  qsa('.idx-link, .idx-desc a').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      const n = parseInt(el.dataset.art || el.getAttribute('href')?.replace('#art','') || 0);
      if (n) {
        // Close index on mobile
        if (window.innerWidth <= 640) { indexOpen = false; $('index-panel').classList.remove('open'); }
        goToArt(n);
      }
    });
  });
}

$('index-search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const idx = CMF_DATA[lang].index;
  if (!q) { renderIndexFiltered(idx); return; }
  renderIndexFiltered(idx.filter(e => e.term.toLowerCase().includes(q) || e.desc.toLowerCase().includes(q)));
});

// ════════════════════════════════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════════════════════════════════
function doSearch(q) {
  if (!q.trim()) { $('search-results').innerHTML = ''; return; }
  const articles = CMF_DATA[lang].articles;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  const results = [];
  for (const a of articles) {
    const allText = (a.text + ' ' + (a.paras||[]).join(' ') + ' ' + (a.subs||[]).join(' '))
      .replace(/<[^>]+>/g,'');
    if (re.test(allText)) {
      const snippet = allText.replace(re, m => `<mark>${m}</mark>`).slice(0, 180);
      results.push({ n: a.n, snippet });
    }
  }
  if (!results.length) {
    $('search-results').innerHTML = `<div id="search-empty">${lang==='es'?'Sin resultados':'Sense resultats'}</div>`;
    return;
  }
  let html = '';
  results.slice(0,30).forEach(r => {
    const sectionLabel = getSectionLabel(r.n);
    html += `<div class="search-result" onclick="selectResult(${r.n})">
      <div class="search-result-num">n. ${r.n} · <span style="font-weight:400">${sectionLabel}</span></div>
      <div class="search-result-text">…${r.snippet}…</div>
    </div>`;
  });
  $('search-results').innerHTML = html;
}

function selectResult(n) {
  $('search-overlay').classList.remove('open');
  $('search-input').value = '';
  $('search-results').innerHTML = '';
  goToArt(n);
}

function getSectionLabel(n) {
  const s = CMF_STRUCT[lang];
  if (n >= s.cf.range[0] && n <= s.cf.range[1]) return s.cf.title;
  for (const part of s.parts) {
    for (const ch of part.chapters) {
      if (n >= ch.range[0] && n <= ch.range[1]) return `${ch.title} — ${ch.long}`;
    }
  }
  for (const a of s.annexes) {
    if (n >= a.range[0] && n <= a.range[1]) return a.title;
  }
  return '';
}

// ════════════════════════════════════════════════════════════════════
// EVENTS & CONTROLS
// ════════════════════════════════════════════════════════════════════
function updateSidebar() {
  const sb = $('sidebar');
  const mn = $('main');
  const fnp = $('fn-panel');
  if (window.innerWidth <= 640) {
    sb.classList.toggle('open', sidebarOpen);
    sb.classList.remove('closed');
    mn.classList.remove('sidebar-closed');
    fnp.classList.remove('sidebar-closed');
  } else {
    sb.classList.toggle('closed', !sidebarOpen);
    mn.classList.toggle('sidebar-closed', !sidebarOpen);
    fnp.classList.toggle('sidebar-closed', !sidebarOpen);
  }
}

function bindEvents() {
  $('topbar-toggle').onclick = () => { sidebarOpen = !sidebarOpen; updateSidebar(); };
  $('lang-toggle').onclick = () => applyLang(lang === 'es' ? 'ca' : 'es');
  $('btn-dark').onclick = () => { darkMode = !darkMode; applyDark(darkMode); localStorage.setItem('cmf_dark', darkMode?'1':'0'); };
  $('btn-font-down').onclick = () => { fontSize = Math.max(13, fontSize - 1); applyFontSize(fontSize); localStorage.setItem('cmf_fs', fontSize); };
  $('btn-font-up').onclick = () => { fontSize = Math.min(24, fontSize + 1); applyFontSize(fontSize); localStorage.setItem('cmf_fs', fontSize); };

  $('btn-search').onclick = () => {
    $('search-overlay').classList.add('open');
    $('search-input').focus();
  };
  $('search-overlay').onclick = e => { if (e.target === $('search-overlay')) $('search-overlay').classList.remove('open'); };
  $('search-input').addEventListener('input', function() { doSearch(this.value); });
  $('search-input').addEventListener('keydown', e => { if (e.key === 'Escape') $('search-overlay').classList.remove('open'); });

  $('btn-index').onclick = () => {
    indexOpen = !indexOpen;
    $('index-panel').classList.toggle('open', indexOpen);
    if (indexOpen) renderIndex();
  };
  $('btn-index-close').onclick = () => { indexOpen = false; $('index-panel').classList.remove('open'); };

  // Progress bar
  window.addEventListener('scroll', () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
    $('progress-bar').style.width = pct + '%';
    // Save scroll position
    sessionStorage.setItem('cmf_scroll_' + lang, window.scrollY);
    // Update active nav link
    updateActiveNav();
  });

  // Keyboard shortcut: / for search
  document.addEventListener('keydown', e => {
    if (e.key === '/' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      $('search-overlay').classList.add('open');
      $('search-input').focus();
    }
    if (e.key === 'Escape') {
      $('search-overlay').classList.remove('open');
      $('fn-panel').classList.remove('visible');
    }
  });

  updateSidebar();
}

function updateActiveNav() {
  const els = qsa('.article');
  let active = 1;
  const offset = 100;
  els.forEach(el => {
    if (el.getBoundingClientRect().top <= offset) {
      active = parseInt(el.id.replace('art',''));
    }
  });
  // Update nav
  qsa('.nav-link.active, .nav-cf-link.active, .nav-annex-link.active')
    .forEach(e => e.classList.remove('active'));
  const s = CMF_STRUCT[lang];
  let found = false;
  if (active >= s.cf.range[0] && active <= s.cf.range[1]) {
    qs('.nav-cf-link')?.classList.add('active'); found = true;
  }
  if (!found) {
    for (const [pi, part] of Object.entries(s.parts)) {
      for (const ch of part.chapters) {
        if (active >= ch.range[0] && active <= ch.range[1]) {
          // Find and activate
          qsa('.nav-link').forEach(el => {
            if (el.textContent.includes(ch.title.split('.')[1]?.trim() || ch.title)) {
              el.classList.add('active');
            }
          });
          found = true;
        }
      }
    }
  }
}

function restoreScroll() {
  const saved = sessionStorage.getItem('cmf_scroll_' + lang);
  if (saved) {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => { window.scrollTo(0, parseInt(saved)); });
    });
  }
}

// Hash navigation
function checkHash() {
  const hash = location.hash;
  if (hash?.startsWith('#art')) {
    const n = parseInt(hash.replace('#art',''));
    if (n) setTimeout(() => goToArt(n), 300);
  }
}

// Start
document.addEventListener('DOMContentLoaded', () => { init(); checkHash(); });
</script>
</body>
</html>
