<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TreeNotes</title>

<style>
:root {
  --bg: #f3f4f6;
  --panel: white;
  --text: #222;
  --border: #d9dde3;
  --blue: #2864dc;
  --light-blue: #e8efff;
  --muted: #697586;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
}

body.dark {
  --bg: #111827;
  --panel: #1f2937;
  --text: #f3f4f6;
  --border: #374151;
  --light-blue: #263b68;
  --muted: #aeb7c4;
}

button,
input,
select {
  font: inherit;
}

button {
  padding: 8px 11px;
  cursor: pointer;
  border: 0;
  border-radius: 6px;
}

button:hover {
  opacity: .85;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  color: white;
  background: #1d2939;
}

header h1 {
  margin: 0;
  font-size: 20px;
}

.header-buttons,
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.primary {
  color: white;
  background: var(--blue);
}

.light {
  color: var(--text);
  background: #edf0f3;
}

.danger {
  color: white;
  background: #c0392b;
}

.workspace {
  display: flex;
  flex: 1;
  min-height: 0;
}

aside {
  display: flex;
  flex-direction: column;
  width: 300px;
  background: var(--panel);
  border-right: 1px solid var(--border);
}

.sidebar {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.search {
  width: 100%;
  padding: 10px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.tree {
  flex: 1;
  padding: 8px;
  overflow-y: auto;
}

.tree-row {
  display: flex;
  align-items: center;
  min-height: 38px;
  border-radius: 6px;
}

.tree-row:hover {
  background: #f0f2f5;
}

.dark .tree-row:hover {
  background: #293548;
}

.tree-row.selected {
  background: var(--light-blue);
}

.tree-row button {
  color: var(--text);
  background: transparent;
}

.arrow {
  width: 28px;
  padding: 5px;
  color: var(--muted) !important;
}

.note-name {
  flex: 1;
  overflow: hidden;
  padding: 8px 3px !important;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
}

main {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  background: var(--panel);
}

.editor-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
}

.status {
  color: var(--muted);
  font-size: 13px;
}

.editor {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 12px;
  padding: 25px;
  overflow-y: auto;
}

.title {
  width: 100%;
  padding: 8px 0;
  color: var(--text);
  background: transparent;
  border: 0;
  border-bottom: 2px solid var(--border);
  outline: none;
  font-size: 28px;
  font-weight: bold;
}

.toolbar {
  padding: 7px;
  background: #eef1f4;
  border: 1px solid var(--border);
  border-radius: 6px;
}

.dark .toolbar {
  background: #111827;
}

.toolbar button,
.toolbar select {
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
}

.rich-text {
  flex: 1;
  min-height: 300px;
  padding: 15px;
  overflow-y: auto;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  font-size: 16px;
  line-height: 1.6;
}

.rich-text:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px var(--light-blue);
}

.rich-text h1,
.rich-text h2,
.rich-text h3 {
  line-height: 1.2;
}

.rich-text blockquote {
  padding-left: 14px;
  color: var(--muted);
  border-left: 4px solid var(--blue);
}

.empty {
  display: grid;
  flex: 1;
  place-items: center;
  color: var(--muted);
  text-align: center;
}

.hidden {
  display: none !important;
}

@media (max-width: 700px) {
  aside {
    width: 220px;
  }

  .editor {
    padding: 15px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>🌳 TreeNotes</h1>

  <div class="header-buttons">
    <button id="newButton" class="primary">＋ Nova nota</button>
    <button id="themeButton" class="light">🌙 Fosc</button>
    <button id="exportButton" class="light">Exportar</button>
<button id="importButton" class="light">Importar</button>
<input id="importFile" type="file" accept=".json" hidden>

  </div>
</header>

<div class="workspace">

<aside>
  <div class="sidebar">
    <input id="search" class="search" placeholder="Cerca notes...">
  </div>

  <div id="tree" class="tree"></div>
</aside>

<main>
  <div id="empty" class="empty">
    <div>
      <h2>Selecciona una nota</h2>
      <p>O crea una nota nova.</p>
    </div>
  </div>

  <section id="editorSection" class="hidden">
    <div class="editor-header">
      <span id="status" class="status">Desat</span>

      <div class="header-buttons">
        <button id="childButton" class="light">＋ Subnota</button>
        <button id="deleteButton" class="danger">Eliminar</button>
      </div>
    </div>

    <div class="editor">
      <input id="title" class="title" placeholder="Títol de la nota">

      <div class="toolbar">
        <button data-command="bold"><b>B</b></button>
        <button data-command="italic"><i>I</i></button>
        <button data-command="underline"><u>U</u></button>
        <button data-command="strikeThrough"><s>S</s></button>

        <select id="format">
          <option value="p">Text normal</option>
          <option value="h1">Títol gran</option>
          <option value="h2">Títol mitjà</option>
          <option value="h3">Títol petit</option>
        </select>

        <button data-command="insertUnorderedList">☷ Llista</button>
        <button data-command="insertOrderedList">1. Numerada</button>
        <button id="linkButton">🔗 Enllaç</button>
        <button data-command="removeFormat">Netejar</button>
      </div>

      <div id="content" class="rich-text" contenteditable="true"></div>
    </div>
  </section>
</main>

</div>
</div>

<script>
const DATA_KEY = "treenotes-simple";

let notes = carregarNotes();
let selectedId = notes[0] ? notes[0].id : null;
let closed = new Set();

const tree = document.getElementById("tree");
const search = document.getElementById("search");
const title = document.getElementById("title");
const content = document.getElementById("content");
const status = document.getElementById("status");
const empty = document.getElementById("empty");
const editorSection = document.getElementById("editorSection");

function idNou() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function carregarNotes() {
  const saved = localStorage.getItem(DATA_KEY);

  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (Array.isArray(data) && data.length) return data;
    } catch (e) {}
  }

  return [{
    id: idNou(),
    parent: null,
    title: "Benvingut a TreeNotes",
    content: "<h1>Benvingut a TreeNotes</h1><p>Escriu aquí la teva primera nota.</p>"
  }];
}

function guardar(missatge = "Desat automàticament") {
  localStorage.setItem(DATA_KEY, JSON.stringify(notes));
  status.textContent = missatge;

  clearTimeout(window.timer);
  window.timer = setTimeout(() => {
    status.textContent = "Desat";
  }, 1500);
}

function notaActual() {
  return notes.find(nota => nota.id === selectedId);
}

function fills(parent) {
  return notes.filter(nota => nota.parent === parent);
}

function pintarArbre() {
  tree.innerHTML = "";

  const text = search.value.toLowerCase().trim();

  if (text) {
    notes
      .filter(nota =>
        (nota.title + " " + nota.content)
          .toLowerCase()
          .includes(text)
      )
      .forEach(nota => tree.appendChild(filaNota(nota, 0, false)));

    return;
  }

  fills(null).forEach(nota => branca(nota, 0));
}

function branca(nota, nivell) {
  const children = fills(nota.id);

  tree.appendChild(filaNota(nota, nivell, children.length > 0));

  if (!closed.has(nota.id)) {
    children.forEach(child => branca(child, nivell + 1));
  }
}

function filaNota(nota, nivell, teFills) {
  const row = document.createElement("div");
  row.className = "tree-row";
  row.style.paddingLeft = (8 + nivell * 18) + "px";

  if (nota.id === selectedId) {
    row.classList.add("selected");
  }

  const arrow = document.createElement("button");
  arrow.className = "arrow";
  arrow.textContent = teFills
    ? (closed.has(nota.id) ? "▸" : "▾")
    : "";

  arrow.onclick = event => {
    event.stopPropagation();

    if (closed.has(nota.id)) {
      closed.delete(nota.id);
    } else {
      closed.add(nota.id);
    }

    pintarArbre();
  };

  const name = document.createElement("button");
  name.className = "note-name";
  name.textContent = "📄 " + (nota.title || "Sense títol");
  name.onclick = () => seleccionar(nota.id);

  row.appendChild(arrow);
  row.appendChild(name);

  return row;
}

function seleccionar(id) {
  selectedId = id;
  pintarArbre();

  const nota = notaActual();

  if (!nota) {
    empty.classList.remove("hidden");
    editorSection.classList.add("hidden");
    return;
  }

  empty.classList.add("hidden");
  editorSection.classList.remove("hidden");

  title.value = nota.title || "";
  content.innerHTML = nota.content || "";
}

function crearNota(parent = null) {
  const nova = {
    id: idNou(),
    parent: parent,
    title: parent ? "Nova subnota" : "Nova nota",
    content: "<p></p>"
  };

  notes.push(nova);
  selectedId = nova.id;

  if (parent) closed.delete(parent);

  guardar("Nota creada");
  pintarArbre();
  seleccionar(nova.id);

  setTimeout(() => {
    title.focus();
    title.select();
  }, 50);
}

function eliminarNota() {
  const nota = notaActual();
  if (!nota) return;

  const ids = new Set([nota.id]);
  let canvi = true;

  while (canvi) {
    canvi = false;

    notes.forEach(item => {
      if (ids.has(item.parent) && !ids.has(item.id)) {
        ids.add(item.id);
        canvi = true;
      }
    });
  }

  if (!confirm("Vols eliminar aquesta nota i les seves subnotes?")) {
    return;
  }

  notes = notes.filter(item => !ids.has(item.id));
  selectedId = notes[0] ? notes[0].id : null;

  guardar("Nota eliminada");
  pintarArbre();
  seleccionar(selectedId);
}

function actualitzarNota() {
  const nota = notaActual();
  if (!nota) return;

  nota.title = title.value || "Sense títol";
  nota.content = content.innerHTML;

  guardar();
  pintarArbre();
}

document.getElementById("newButton").onclick = () => crearNota();
document.getElementById("childButton").onclick = () => crearNota(selectedId);
document.getElementById("deleteButton").onclick = eliminarNota;
search.oninput = pintarArbre;

title.oninput = actualitzarNota;
content.oninput = actualitzarNota;

document.querySelectorAll("[data-command]").forEach(button => {
  button.onmousedown = event => event.preventDefault();

  button.onclick = () => {
    content.focus();
    document.execCommand(button.dataset.command, false, null);
    actualitzarNota();
  };
});

document.getElementById("format").onchange = event => {
  content.focus();
  document.execCommand("formatBlock", false, event.target.value);
  actualitzarNota();
};

document.getElementById("linkButton").onclick = () => {
  const url = prompt("Escriu l'adreça de l'enllaç:");

  if (url) {
    content.focus();
    document.execCommand("createLink", false, url);
    actualitzarNota();
  }
};

document.getElementById("themeButton").onclick = () => {
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "treenotes-theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
};

document.getElementById("exportButton").onclick = () => {
  const file = new Blob(
    [JSON.stringify(notes, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(file);
  const link = document.createElement("a");

  link.href = url;
  link.download = "copia-treenotes.json";
  link.click();

  URL.revokeObjectURL(url);
};

document.getElementById("importButton").onclick = () => {
  document.getElementById("importFile").click();
};

document.getElementById("importFile").onchange = event => {
  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const importedNotes = JSON.parse(reader.result);

      if (!Array.isArray(importedNotes)) {
        throw new Error("Format incorrecte");
      }

      notes = importedNotes;
      selectedId = notes[0] ? notes[0].id : null;

      guardar("Notes recuperades");
      pintarArbre();
      seleccionar(selectedId);

      alert("Notes recuperades correctament.");
    } catch (error) {
      alert("No s'ha pogut importar la còpia.");
    }

    event.target.value = "";
  };

  reader.readAsText(file);
};

if (localStorage.getItem("treenotes-theme") === "dark") {
  document.body.classList.add("dark");
}

pintarArbre();
seleccionar(selectedId);
</script>

</body>
</html>
