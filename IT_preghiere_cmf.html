{"t":"p","x":"del mondo ascoltaci, Signore"},
{"t":"p","x":"Agnello di Dio, che togli i peccati"},
{"t":"p","x":"del mondo"},
{"t":"r","x":"abbi pietà di noi"},
{"t":"v","x":"Prega per noi, Santa Madre di Dio"},
{"t":"r","x":"Affinché siamo fatti degni delle promesse di Cristo"},
{"t":"p","x":"Preghiamo:"},
{"t":"p","x":"Concedi ai tuoi fedeli, Signore Dio nostro,"},
{"t":"p","x":"di godere sempre la salute del corpo e dello spirito,"},
{"t":"p","x":"e per la gloriosa intercessione di Maria santissima sempre vergine,"},
{"t":"p","x":"salvaci dai mali che ora ci rattristano"},
{"t":"p","x":"e guidaci alla gioia senza fine."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"IV. EUCARISTIA"}
]},
{id:"113",num:113,title:"Illumina con la luce della fede i nostri cuori, o Signore,",theme:"eucaristia",sub:null,tags:[],lines:[
{"t":"p","x":"e accendili nel fuoco della carità,"},
{"t":"p","x":"affinché adoriamo, in spirito e verità,"},
{"t":"p","x":"Colui che riconosciamo presente in questo Sacramento,"},
{"t":"p","x":"nostro Dio e Signore."},
{"t":"p","x":"Egli vive e regna nei secoli dei secoli."},
{"t":"p","x":"Amen."}
]},
{id:"114",num:114,title:"O Dio, che hai redento tutti gli uomini",theme:"eucaristia",sub:null,tags:[],lines:[
{"t":"p","x":"col mistero pasquale di Cristo"},
{"t":"p","x":"che in questo Sacramento offre se stesso per i fratelli,"},
{"t":"p","x":"concedi a noi che, venerando costantemente"},
{"t":"p","x":"il mistero della nostra redenzione,"},
{"t":"p","x":"meritiamo di conseguirne il frutto"},
{"t":"p","x":"e di suscitare negli uomini"},
{"t":"p","x":"il ricordo della presenza del Signore."},
{"t":"p","x":"Per lo stesso Gesù Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"115",num:115,title:"Che il Sacramento dell’Eucaristia, o Signore,",theme:"eucaristia",sub:null,tags:[],lines:[
{"t":"p","x":"riempia i nostri cuori del tuo amore e di zelo apostolico"},
{"t":"p","x":"e ci spinga a desiderare"},
{"t":"p","x":"che tutti gli uomini ti conoscano,"},
{"t":"p","x":"ti amino, ti servano"},
{"t":"p","x":"e vivano la beatitudine del Regno"},
{"t":"p","x":"già presente sulla nostra terra."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"116",num:116,title:"O Signore, che ci hai resi partecipi",theme:"eucaristia",sub:null,tags:[],lines:[
{"t":"p","x":"di uno stesso pane e di uno stesso Spirito,"},
{"t":"p","x":"concedi a noi che, uniti a Te, come i tralci alla vite,"},
{"t":"p","x":"siamo con Te una sola cosa, ed edifichiamo"},
{"t":"p","x":"la nostra comunione perché il mondo creda."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"117",num:117,title:"Signore Gesù, tu che ti sei identificato pienamente",theme:"eucaristia",sub:null,tags:[],lines:[
{"t":"p","x":"con coloro che soffrono"},
{"t":"p","x":"e che hai detto: “Venite a me"},
{"t":"p","x":"voi tutti che siete affaticati ed oppressi"},
{"t":"p","x":"ed io vi ristorerò”,"},
{"t":"p","x":"noi, solidali con gli uomini che patiscono malattia,"},
{"t":"p","x":"dolore, ingiustizia ed oppressione,"},
{"t":"p","x":"veniamo alla tua presenza,"},
{"t":"p","x":"perché Tu ci accenda nella tua carità"},
{"t":"p","x":"e noi godiamo nei patimenti,"},
{"t":"p","x":"ci gloriamo della croce."},
{"t":"p","x":"Tu che vivi e regni nei secoli dei secoli."},
{"t":"p","x":"Amen."}
]},
{id:"118",num:118,title:"Signore, che nel mistero pasquale hai realizzato la salvezza degli uomini,",theme:"eucaristia",sub:null,tags:[],lines:[
{"t":"p","x":"concedi a noi di adorarti presente in questo Sacramento"},
{"t":"p","x":"e di proclamare con fede ciò che ora veneriamo."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"119",num:119,title:"Signore Gesù, infiammaci in quella fede che mosse",theme:"eucaristia",sub:null,tags:[],lines:[
{"t":"p","x":"tanti predicatori della divina Parola"},
{"t":"p","x":"ad abbracciare con animo lieto"},
{"t":"p","x":"la povertà, l’abnegazione e il sacrificio,"},
{"t":"p","x":"al fine di dilatare il tuo Regno."},
{"t":"p","x":"Te lo chiediamo uniti con tutto il cuore a Te,"},
{"t":"p","x":"che sei presente nel mistero eucaristico"},
{"t":"p","x":"che ora veneriamo,"},
{"t":"p","x":"e la cui vita e ministero condividiamo."},
{"t":"p","x":"Tu che vivi e regni con il Padre e con lo Spirito Santo"},
{"t":"p","x":"Nei secoli dei secoli."},
{"t":"p","x":"Amen."}
]},
{id:"131",num:131,title:"Veni, Sancte Spiritus",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Vieni, Santo Spirito, riempi il cuore dei tuoi fedeli,"},
{"t":"p","x":"accendi in essi il fuoco del tuo amore"},
{"t":"v","x":"Manda il tuo Spirito: tutto sarà ricreato,"},
{"t":"p","x":"R. E rinnoverai la faccia della terra."},
{"t":"rub","x":"Preghiamo."},
{"t":"p","x":"O Dio,"},
{"t":"p","x":"che hai illuminato i cuori dei tuoi fedeli"},
{"t":"p","x":"con la luce dello Spirito Santo,"},
{"t":"p","x":"rendici a Lui docili"},
{"t":"p","x":"perché possiamo agire sempre bene"},
{"t":"p","x":"e godere della sua consolazione."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"132",num:132,title:"Radunati nel tuo nome",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Radunati nel tuo nome, o Signore,"},
{"t":"p","x":"vogliamo stare alla tua presenza!"},
{"t":"p","x":"Concedi a noi uno spirito capace di dialogo,"},
{"t":"p","x":"illumina le nostre menti con la luce della tua verità"},
{"t":"p","x":"e rafforza il nostro spirito fraterno"},
{"t":"p","x":"affinché cerchiamo, sempre insieme,"},
{"t":"p","x":"di conoscere e di compiere la tua volontà."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"133",num:133,title:"Donaci la sapienza (Sap 9, 1-6.9-11)",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Dio dei padri e Signore di misericordia,"},
{"t":"p","x":"che tutto hai creato con la tua parola,"},
{"t":"p","x":"che con la tua sapienza hai formato l’uomo,"},
{"t":"p","x":"perché domini sulle creature fatte da te,"},
{"t":"p","x":"e governi il mondo con santità e giustizia,"},
{"t":"p","x":"e pronunzi giudizi con animo retto,"},
{"t":"p","x":"dammi la sapienza che siede in trono accanto a te"},
{"t":"p","x":"e non mi escludere dal numero dei tuoi figli,"},
{"t":"p","x":"perché io sono tuo servo e figlio della tua ancella,"},
{"t":"p","x":"uomo debole e di vita breve,"},
{"t":"p","x":"incapace di comprendere la giustizia e le leggi."},
{"t":"p","x":"Se anche uno fosse il più perfetto tra gli uomini,"},
{"t":"p","x":"mancandogli la tua sapienza, sarebbe stimato un nulla."},
{"t":"p","x":"Con te è la sapienza che conosce le tue opere,"},
{"t":"p","x":"che era presente quando creavi il mondo;"},
{"t":"p","x":"essa conosce che cosa è gradito ai tuoi occhi"},
{"t":"p","x":"e ciò che è conforme ai tuoi decreti."},
{"t":"p","x":"Inviala dai cieli santi, mandala dal tuo trono glorioso"},
{"t":"p","x":"perché mi assista e mi affianchi nella mia fatica"},
{"t":"p","x":"e io sappia ciò che ti è gradito."},
{"t":"p","x":"Essa infatti tutto conosce e tutto comprende,"},
{"t":"p","x":"e mi guiderà prudentemente nelle mie azioni"},
{"t":"p","x":"e mi proteggerà con la sua gloria."},
{"t":"p","x":"Amen."}
]},
{id:"134",num:134,title:"Cercare e compiere insieme la volontà di Dio",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Antifona"},
{"t":"p","x":"Dice il Signore: Dove due o tre si riuniranno nel mio nome,"},
{"t":"p","x":"là sono io in mezzo a loro."},
{"t":"rub","x":"Preghiamo."},
{"t":"p","x":"Dio e Padre nostro, il tuo Figlio ha promesso la sua presenza"},
{"t":"p","x":"nel cuore di quanti sono radunati nel suo nome:"},
{"t":"p","x":"fa’ che lo sentiamo presente in mezzo a noi;"},
{"t":"p","x":"che esprimiamo la comunione di vita"},
{"t":"p","x":"e la missione di tutto l’Istituto,"},
{"t":"p","x":"al fine di cominciare una vita nuova"},
{"t":"v","x":"obbedienti allo Spirito"},
{"t":"p","x":"e in piena fedeltà al nostro carisma missionario -;"},
{"t":"p","x":"e fa’ che, conosciuta la tua volontà,"},
{"t":"p","x":"la compiamo in un unico volere e sentire"},
{"t":"p","x":"per realizzare la nostra comune missione nella Chiesa."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"135",num:135,title:"Grazia e disposizioni per il dialogo",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Siamo qui, o Signore,"},
{"t":"p","x":"riuniti nel tuo nome e desiderosi di realizzare il tuo Regno."},
{"t":"p","x":"Lo Spirito Santo, che hai inviato"},
{"t":"p","x":"nei nostri cuori"},
{"t":"p","x":"e che mantiene viva la tua presenza fra di noi"},
{"t":"p","x":"ci insegni ciò che dobbiamo approfondire"},
{"t":"p","x":"e fin dove dobbiamo camminare,"},
{"t":"p","x":"affinché, rafforzati dalla tua grazia,"},
{"t":"p","x":"possiamo realizzare i tuoi disegni."},
{"t":"p","x":"Sii tu, Spirito Santo,"},
{"t":"p","x":"l’ispiratore e l’animatore del nostro discernimento."},
{"t":"p","x":"Insegnaci ad ascoltare gli altri,"},
{"t":"p","x":"a lasciarci illuminare dalle loro luci,"},
{"t":"p","x":"a proporre e a non imporre."},
{"t":"p","x":"Donaci l’equità."},
{"t":"p","x":"Liberaci dalla cecità di chi ritiene di aver sempre ragione,"},
{"t":"p","x":"dai favoritismi e da ogni giudizio sulle persone."},
{"t":"p","x":"Uniti a Te, fa’ che non ci allontaniamo mai dalla verità."},
{"t":"p","x":"Amen."}
]},
{id:"136",num:136,title:"Luce per scoprire le esigenze del Vangelo",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Padre buono,"},
{"t":"p","x":"guarda questa comunità radunata nel tuo nome"},
{"t":"p","x":"per condividere la fraternità e dialogare nella verità."},
{"t":"p","x":"Concedile di scoprire con maggiore chiarezza"},
{"t":"p","x":"le esigenze del Vangelo"},
{"t":"p","x":"per essere luce del mondo e sale della terra."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"137",num:137,title:"Preghiera per iniziare una riunione",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"La tua grazia, Signore, ispiri,"},
{"t":"p","x":"sostenga ed accompagni le nostre opere"},
{"t":"p","x":"perché il nostro lavoro cominci da Te, come da sua fonte,"},
{"t":"p","x":"e tenda a Te, come a suo termine."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"138",num:138,title:"Ringraziamento per un incontro",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Padre di bontà,"},
{"t":"p","x":"ti ringraziamo per questo incontro"},
{"t":"p","x":"nel quale abbiamo condiviso"},
{"t":"p","x":"le nostre attese e le nostre disillusioni,"},
{"t":"p","x":"i nostri progetti e le nostre fatiche."},
{"t":"p","x":"Fa’ che rispondiamo sempre efficacemente"},
{"t":"p","x":"alla nostra vocazione e alla nostra missione nella Chiesa,"},
{"t":"p","x":"sull’esempio del Claret, nostro Padre e Fondatore."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"139",num:139,title:"Un cuor solo e un’anima sola",theme:"riunioni",sub:null,tags:[],lines:[
{"t":"p","x":"Ti ringraziamo per questo incontro comunitario, Signore;"},
{"t":"p","x":"e per la tua bontà,"},
{"t":"p","x":"per la tua presenza fra noi."},
{"t":"p","x":"Fa’ che con spirito fraterno"},
{"t":"p","x":"conserviamo un sol cuore e un’anima sola"},
{"t":"p","x":"per essere una comunità"},
{"t":"p","x":"evangelizzata ed evangelizzante."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."},
{"t":"p","x":"**Preghiere per iniziare gli esercizi spirituali**"}
]},
{id:"144",num:144,title:"Preghiera del P. Fondatore",theme:"esercizi",sub:null,tags:[],lines:[
{"t":"p","x":"all’inizio degli esercizi"},
{"t":"p","x":"A te, Vergine Maria, Madre mia,"},
{"t":"p","x":"che hai conosciuto la consolazione"},
{"t":"p","x":"di vedere riuniti nel Cenacolo gli Apostoli e i discepoli,"},
{"t":"p","x":"e la gioia di saperli tutti pieni di Spirito Santo,"},
{"t":"p","x":"con tutta confidenza, io ti chiedo"},
{"t":"p","x":"mi ottenga tutte le grazie necessarie"},
{"t":"p","x":"a far bene e sotto la tua protezione questi esercizi spirituali."},
{"t":"p","x":"Sostienimi nel proposito di compiere tutto ciò che"},
{"t":"p","x":"riconosca sia per la maggior gloria di Dio"},
{"t":"p","x":"e per il bene dell’anima mia."},
{"t":"p","x":"Soccorrimi e proteggimi, Madre mia, ora e sempre."},
{"t":"p","x":"Amen."}
]},
{id:"157",num:157,title:"Litanie di San Giuseppe",theme:"san-giuseppe",sub:null,tags:[],lines:[
{"t":"p","x":"Signore, pietà"},
{"t":"p","x":"Cristo, pietà"},
{"t":"p","x":"Signore, pietà"},
{"t":"p","x":"Cristo, ascoltaci"},
{"t":"p","x":"Cristo, esaudiscici"},
{"t":"p","x":"Dio, Padre celeste"},
{"t":"r","x":"abbi pietà di noi"},
{"t":"p","x":"Figlio, Redentore del mondo, Dio"},
{"t":"p","x":"Spirito Santo, Dio"},
{"t":"p","x":"Santa Trinità, unico Dio"},
{"t":"p","x":"Santa Maria"},
{"t":"r","x":"prega per noi"},
{"t":"p","x":"San Giuseppe"},
{"t":"p","x":"Discendente illustre di Davide"},
{"t":"p","x":"Luce dei patriarchi"},
{"t":"p","x":"Sposo della Madre di Dio"},
{"t":"p","x":"Casto custode della Vergine"},
{"t":"p","x":"Educatore del Figlio di Dio"},
{"t":"p","x":"Difensore diligente di Cristo"},
{"t":"p","x":"Capo della Sacra Famiglia"},
{"t":"p","x":"Giusepe giustissimo"},
{"t":"p","x":"Giuseppe castissimo"},
{"t":"p","x":"Giuseppe prudentissimo"},
{"t":"p","x":"Giuseppe fortissimo"},
{"t":"p","x":"Giuseppe obbedientissimo"},
{"t":"p","x":"Giuseppe fedelissimo"},
{"t":"p","x":"Specchio di pazienza"},
{"t":"p","x":"Amante della povertà"},
{"t":"p","x":"Esemplare lavoratore"},
{"t":"p","x":"Onore della vita familiare"},
{"t":"p","x":"Custode delle vergini"},
{"t":"p","x":"Sostegno delle famiglie"},
{"t":"p","x":"Consolazione degli afflitti"},
{"t":"p","x":"Speranza degli infermi"},
{"t":"p","x":"Patrono dei moribondi"},
{"t":"p","x":"Protettore della Sacra Famiglia"},
{"t":"p","x":"Agnello di Dio,"},
{"t":"p","x":"che togli il peccato del mondo, perdonaci, Signore"},
{"t":"p","x":"Agnello di Dio,"},
{"t":"p","x":"che togli il peccato del mondo, ascoltaci, Signore"},
{"t":"p","x":"Agnello di Dio,"},
{"t":"p","x":"che togli il peccato del mondo,"},
{"t":"r","x":"abbi pietà di noi"},
{"t":"v","x":"Lo costituì signore della sua casa"},
{"t":"p","x":"R. E lo mise a capo dei suo beni."},
{"t":"rub","x":"Preghiamo."},
{"t":"p","x":"O Dio, che nella tua ineffabile provvidenza ti sei degnato di scegliere San Giuseppe come sposo della Madre di tuo Figlio, concedi a noi che lo veneriamo sulla terra come protettore, di averlo come intercessore nel cielo. Tu che vivi e regni nei secoli dei secoli."},
{"t":"p","x":"Amen."},
{"t":"p","x":"PREGHIERE A SAN GIUSEPPE"}
]},
{id:"158",num:158,title:"Beato Giuseppe",theme:"san-giuseppe",sub:null,tags:[],lines:[
{"t":"p","x":"Beato Giuseppe,"},
{"t":"p","x":"per quell’amore che ti mantenne unito"},
{"t":"p","x":"alla Vergine Madre di Dio"},
{"t":"p","x":"e per l’amore paterno con cui curasti il Bambino Gesù,"},
{"t":"p","x":"ti preghiamo umilmente di guardare"},
{"t":"p","x":"alla famiglia del tuo Figlio,"},
{"t":"p","x":"da lui acquistata a prezzo del suo sangue,"},
{"t":"p","x":"e col tuo aiuto, soccorri, ti preghiamo, alle nostre necessità."},
{"t":"p","x":"Allontana da noi ogni errore ed ogni peccato;"},
{"t":"p","x":"assistici nella lotta contro il potere del male,"},
{"t":"p","x":"e difendi la Santa Chiesa di Dio da ogni avversità;"},
{"t":"p","x":"proteggi ciascuno di noi,"},
{"t":"p","x":"affinché, col tuo esempio, e sostenuti dal tuo patrocinio,"},
{"t":"p","x":"possiamo santamente vivere,"},
{"t":"p","x":"piamente morire e conseguire la beatitudine eterna."},
{"t":"p","x":"Amen."}
]},
{id:"159",num:159,title:"Preghiera a San Giuseppe di Leone XIII",theme:"san-giuseppe",sub:null,tags:[],lines:[
{"t":"p","x":"A te, o Beato Giuseppe,"},
{"t":"p","x":"stretti dalla tribolazione ricorriamo,"},
{"t":"p","x":"e, fiduciosi,"},
{"t":"p","x":"invochiamo il tuo patrocinio"},
{"t":"p","x":"con quello della tua santissima Sposa."},
{"t":"p","x":"Per quel vincolo di carità"},
{"t":"p","x":"che ti strinse all’Immacolata Vergine Maria, Madre di Dio,"},
{"t":"p","x":"e per l’amore paterno che portasti al fanciullo Gesù,"},
{"t":"p","x":"guarda, te ne preghiamo, con occhio benigno"},
{"t":"p","x":"la cara eredità che Gesù Cristo acquistò col suo Sangue"},
{"t":"p","x":"e col tuo potere ed aiuto sovvieni ai nostri bisogni."},
{"t":"p","x":"Proteggi, o provvido custode della divina Famiglia,"},
{"t":"p","x":"l’eletta prole di Gesù Cristo:"},
{"t":"p","x":"allontana da noi, o Padre amatissimo,"},
{"t":"p","x":"gli errori e i vizi che corrompono il mondo,"},
{"t":"p","x":"assistici propizio dal cielo in questa lotta col potere del male,"},
{"t":"p","x":"o nostro fortissimo protettore:"},
{"t":"p","x":"e come un tempo salvasti dalla morte"},
{"t":"p","x":"la minacciata vita del Bambino Gesù,"},
{"t":"p","x":"così ora difendi la Santa Chiesa di Dio"},
{"t":"p","x":"dalle ostili insidie e da ogni avversità;"},
{"t":"p","x":"e copri ciascuno di noi con il tuo continuo patrocinio,"},
{"t":"p","x":"affinché sul tuo esempio e col tuo soccorso"},
{"t":"p","x":"possiamo virtuosamente vivere,"},
{"t":"p","x":"piamente morire"},
{"t":"p","x":"e conseguire l’eterna beatitudine in cielo."},
{"t":"p","x":"Amen."}
]},
{id:"160",num:160,title:"Preghiera a San Giuseppe di Giovanni XXIII",theme:"san-giuseppe",sub:null,tags:[],lines:[
{"t":"p","x":"“O san Giuseppe, custode di Gesù, sposo castissimo di Maria,"},
{"t":"p","x":"che hai trascorso la vita nell’adempimento perfetto del dovere,"},
{"t":"p","x":"sostenendo con il lavoro delle tue mani"},
{"t":"p","x":"la Sacra Famiglia di Nazaret,"},
{"t":"p","x":"proteggi propizio noi tutti che, con fiducia, a te ci rivolgiamo."},
{"t":"p","x":"Tu conosci le nostre aspirazioni,"},
{"t":"p","x":"le nostre angustie,"},
{"t":"p","x":"e le nostre speranze: e noi a te ricorriamo,"},
{"t":"p","x":"perché sappiamo di trovare in te chi ci capisce e ci protegge."},
{"t":"p","x":"Anche tu hai sperimentato la prova,"},
{"t":"p","x":"la fatica, la stanchezza;"},
{"t":"p","x":"ma, pure in mezzo alle preoccupazioni della vita materiale,"},
{"t":"p","x":"il tuo animo ricolmo della più profonda pace,"},
{"t":"p","x":"esultò di gioia indicibile per l’intimità con il Figlio di Dio,"},
{"t":"p","x":"a te affidato, e con Maria, sua dolcissima Madre."},
{"t":"p","x":"Fa’ che anche noi comprendiamo"},
{"t":"p","x":"di non essere soli nel nostro lavoro,"},
{"t":"p","x":"ma sappiamo scoprire Gesù accanto a noi,"},
{"t":"p","x":"accoglierlo con la grazia, custodirlo fedelmente"},
{"t":"p","x":"come tu hai fatto."},
{"t":"p","x":"E ottieni che in ogni famiglia, in ogni officina,"},
{"t":"p","x":"in ogni laboratorio, nella nostra Congregazione,"},
{"t":"p","x":"ovunque un cristiano lavora,"},
{"t":"p","x":"tutto sia santificato, nella carità,"},
{"t":"p","x":"nella pazienza, nella giustizia,"},
{"t":"p","x":"nella ricerca del ben fare,"},
{"t":"p","x":"affinché abbondanti discendano i doni della celeste predilezione."},
{"t":"p","x":"Amen."}
]},
{id:"161",num:161,title:"Preghiera a San Giuseppe",theme:"san-giuseppe",sub:null,tags:[],lines:[
{"t":"p","x":"Ave, Giuseppe, sposo verginale di Maria"},
{"t":"p","x":"e Padre putativo del Signore."},
{"t":"p","x":"Tu sei benedetto fra tutti gli uomini"},
{"t":"p","x":"e benedetto è Gesù, il Figlio di Dio che a te si affidò."},
{"t":"p","x":"San Giuseppe,"},
{"t":"p","x":"patrono della Chiesa universale e della nostra Congregazione,"},
{"t":"p","x":"mantieni nella pace e nella grazia di Dio"},
{"t":"p","x":"le nostre comunità e famiglie,"},
{"t":"p","x":"e soccorrici nell’ora della nostra morte."},
{"t":"p","x":"Amen."}
]},
{id:"162",num:162,title:"Preghiera a San Giuseppe",theme:"san-giuseppe",sub:null,tags:[],lines:[
{"t":"p","x":"Padre Santo, che hai scelto San Giuseppe"},
{"t":"p","x":"per un compito così singolare"},
{"t":"p","x":"e gli hai concesso le grazie necessarie"},
{"t":"p","x":"a realizzarlo nella casa di Nazaret,"},
{"t":"p","x":"concedi anche a noi"},
{"t":"p","x":"le grazie necessarie"},
{"t":"p","x":"per essere fedeli nell’attuazione"},
{"t":"p","x":"del nostro ministero"},
{"t":"p","x":"secondo il carisma e lo spirito della Congregazione."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"}
]},
{id:"168",num:168,title:"Preghiera alla Beata Martire Maria",theme:"martiri",sub:null,tags:[],lines:[
{"t":"p","x":"Patrocinio Giner RMI"},
{"t":"p","x":"Dio grande e misericordioso,"},
{"t":"p","x":"che donasti alla vergine Beata Maria Patrocinio"},
{"t":"p","x":"la grazia d’esser generosa nel servizio dei fratelli"},
{"t":"p","x":"e forte nel martirio, fino al perdono,"},
{"t":"p","x":"concedi a noi, per sua intercessione,"},
{"t":"p","x":"di seguire prontamente le orme di Cristo"},
{"t":"p","x":"sul cammino della croce"},
{"t":"p","x":"per partecipare un giorno alla gloria della risurrezione."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"169",num:169,title:"Preghiera",theme:"beatificazione",sub:null,tags:[],lines:[
{"t":"p","x":"Signore, Padre nostro,"},
{"t":"p","x":"che hai scelto con amore di predilezione"},
{"t":"p","x":"tutti i Figli del Cuore della Vergine Maria"},
{"t":"p","x":"e hai voluto che alcuni di loro"},
{"t":"p","x":"fossero esempio esimio di virtù,"},
{"t":"p","x":"feconda la Chiesa con la loro glorificazione"},
{"t":"p","x":"e fa’ che siano per noi modelli da imitare."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"170",num:170,title:"Preghiera",theme:"beatificazione",sub:null,tags:[],lines:[
{"t":"p","x":"Signore,"},
{"t":"p","x":"che vuoi santi"},
{"t":"p","x":"coloro che hai chiamati nella nostra Congregazione,"},
{"t":"p","x":"concedi ai nostri fratelli missionari"},
{"t":"p","x":"che più da vicino hanno seguito le orme del Santo Fondatore"},
{"t":"p","x":"ed hanno donato la loro vita al servizio del Vangelo,"},
{"t":"p","x":"di essere glorificati sulla terra"},
{"t":"p","x":"e annoverati fra i santi del cielo."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"171",num:171,title:"Preghiera",theme:"beatificazione",sub:null,tags:[],lines:[
{"t":"p","x":"Dio, che esalti gli umili e disperdi i superbi,"},
{"t":"p","x":"degnati di glorificare il tuo servo N."},
{"t":"p","x":"e fa’ che il suo nome risplenda fra i tuoi santi in cielo."},
{"t":"p","x":"Moltiplica le tue grazie a favore di quanti ti invocano"},
{"t":"p","x":"per sua intercessione."},
{"t":"p","x":"E concedi che la Chiesa onori, un giorno, la sua memoria,"},
{"t":"p","x":"proponendolo come modello da imitare"},
{"t":"p","x":"e come protettore che ci aiuti a sopportare"},
{"t":"p","x":"le difficoltà della nostra vita missionaria"},
{"t":"p","x":"e a meritare la vita eterna."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"172",num:172,title:"Preghiera per impetrare la beatificazione",theme:"beatificazione",sub:null,tags:[],lines:[
{"t":"p","x":"Signore, Dio nostro, che hai scelto alcuni nostri fratelli,"},
{"t":"p","x":"Figli del Cuore Immacolato di Maria,"},
{"t":"p","x":"e li hai fatti risplendere"},
{"t":"p","x":"nella vita missionaria"},
{"t":"p","x":"con l’esempio di una speciale santità,"},
{"t":"p","x":"degnati di arricchire e di fecondare la Santa Chiesa"},
{"t":"p","x":"con la sua glorificazione;"},
{"t":"p","x":"e fa’ che tutti noi,"},
{"t":"p","x":"seguendo la sua testimonianza evangelica,"},
{"t":"p","x":"ci impegniamo ardentemente a cercare in tutte le cose"},
{"t":"p","x":"la tua gloria e la salvezza dei nostri fratelli."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."},
{"t":"p","x":"XI. PREGHIERE PER IL CAPITOLO"}
]},
{id:"186",num:186,title:"PREGHIERA PER IL CAPITOLO",theme:"capitolo",sub:null,tags:[],lines:[
{"t":"p","x":"O Spirito Divino,"},
{"t":"p","x":"che inviato dal Padre nel nome di Gesù,"},
{"t":"p","x":"assisti e guidi infallibilmente la Chiesa,"},
{"t":"p","x":"infondi sul Capitolo la pienezza dei tuoi doni."},
{"t":"p","x":"O soave Maestro e Consolatore,"},
{"t":"p","x":"illumina le menti dei Capitolari;"},
{"t":"p","x":"fa’ che da questo Capitolo scaturiscano frutti abbondanti,"},
{"t":"p","x":"nuovo vigore nell’impegno alla santificazione"},
{"t":"p","x":"e all’apostolato,"},
{"t":"p","x":"specialmente alla diffusione della luce"},
{"t":"p","x":"e della forza del Vangelo fra gli uomini."},
{"t":"p","x":"Ospite dolce dei cuori,"},
{"t":"p","x":"conferma le menti nella verità,"},
{"t":"p","x":"disponi il cuore di tutti all’obbedienza"},
{"t":"p","x":"perché le conclusioni del Capitolo"},
{"t":"p","x":"trovino accoglienza generosa e compimento."},
{"t":"p","x":"Rinnova nella nostra Congregazione,"},
{"t":"p","x":"e in ciascuno di noi,"},
{"t":"p","x":"lo spirito che animò Sant’Antonio Maria Claret,"},
{"t":"p","x":"nostro Padre."},
{"t":"p","x":"Concedici che,"},
{"t":"p","x":"riuniti in preghiera unanime ed intensa"},
{"t":"p","x":"intorno al Cuore di Maria, nostra Madre,"},
{"t":"p","x":"procuriamo sempre e soltanto"},
{"t":"p","x":"la maggior gloria di Dio e la salvezza delle anime."},
{"t":"p","x":"Amen."}
]},
{id:"187",num:187,title:"PRECI PER IL CAPITOLO",theme:"capitolo",sub:null,tags:[],lines:[
{"t":"p","x":"Glorifichiamo il Padre che ci ha chiamati nel suo Figlio Gesù a condividere la vita missionaria, e diciamogli:"},
{"t":"p","x":"Donaci l’unzione del tuo Spirito."},
{"t":"p","x":"Ci hai chiamati in una Congregazione missionaria,"},
{"t":"v","x":"fa’ che, guidati dallo Spirito, i capitolari cerchino la fedeltà all’annuncio del Regno."},
{"t":"p","x":"Ci hai chiamati a seguire Gesù, l’inviato del Padre,"},
{"t":"v","x":"l’unzione del tuo Spirito ci abiliti ad essere testimoni della sua Risurrezione."},
{"t":"p","x":"Resi forti dalla viva memoria del nostro Padre Fondatore, Sant’Antonio Maria Claret,"},
{"t":"v","x":"ti preghiamo: il Capitolo ricerchi la gloria di Dio, la santificazione dei missionari e la salvezza degli uomini di tutto il mondo."},
{"t":"p","x":"Spinti dall’amore per Dio e per i fratelli, che è stato riversato nei nostri cuori,"},
{"t":"v","x":"ti chiediamo: concedi a noi di costruire le nostre comunità in un progetto comune di missione, per annunciare e per vivere il Vangelo."},
{"t":"p","x":"Sollecitati da ciò che è più opportuno ed efficace nel compimento della nostra missione, attese le circostanze di luogo, di tempo e di persone,"},
{"t":"v","x":"ti chiediamo, Signore: aiutaci a determinare un buon programma di azione e di vita missionaria, in comunione con tutta Congregazione."},
{"t":"p","x":"Signore e Padre nostro, per l’intercessione di Maria, Madre e Fondatrice della nostra Congregazione, mandaci il tuo Spirito perché sull’esempio del tuo Figlio Gesù, ci sentiamo spinti, dall’amore verso di Te e verso gli uomini, ad avere occhi penetranti ed orecchie attente sulle necessità del mondo, a mantenere l’unità nonostante le differenze, congregati come siamo nella stessa comunità, e a realizzare la missione che abbiamo ricevuto attraverso Sant’Antonio Maria Claret, nostro Padre."},
{"t":"p","x":"Tu che vivi e regni nei secoli dei secoli."},
{"t":"p","x":"Amen."},
{"t":"p","x":"**P****reghiera**** per ****il**** XXVII ****capitolo**** ****generale**"},
{"t":"p","x":"Vieni, Spirito Santo,"},
{"t":"p","x":"soffio del Padre"},
{"t":"p","x":"e fuoco vivo del Figlio risorto:"},
{"t":"p","x":"rinnova la nostra Congregazione."},
{"t":"p","x":"Fa’ che la preparazione al Capitolo Generale"},
{"t":"p","x":"sia un tempo di grazia, di ascolto e di discernimento."},
{"t":"p","x":"Effondi su di noi una rinnovata Pentecoste,"},
{"t":"p","x":"perché possiamo camminare insieme nella comunione,"},
{"t":"p","x":"come missionari mistici e profetici"},
{"t":"p","x":"al servizio dell’unica missione di Cristo."},
{"t":"p","x":"Uniti a Maria, nostra Madre,"},
{"t":"p","x":"a sant’Antonio Maria Claret"},
{"t":"p","x":"e alla testimonianza fedele dei nostri martiri,"},
{"t":"p","x":"insegnaci ad ascoltare la tua voce"},
{"t":"p","x":"nel grido dei poveri,"},
{"t":"p","x":"nelle ferite del mondo"},
{"t":"p","x":"e nella vita delle nostre comunità."},
{"t":"p","x":"Plasmaci nella fucina del Cuore Immacolato di Maria,"},
{"t":"p","x":"perché, guidati dal tuo Spirito,"},
{"t":"p","x":"diventiamo segni di fraternità, di speranza"},
{"t":"p","x":"e di ardore missionario"},
{"t":"p","x":"per la Chiesa e per il mondo."},
{"t":"p","x":"Amen."}
]},
{id:"201",num:201,title:"Ave, Maria, piena di grazia.",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"Il Signore è con te"},
{"t":"p","x":"Sii benedetto per sempre, Signore"},
{"t":"p","x":"Signore, Gesù, che a Cana di Galilea,"},
{"t":"p","x":"per intercessione della Madre tua,"},
{"t":"p","x":"mutasti l’acqua in vino"},
{"t":"p","x":"benedici il cibo che stiamo per prendere,"},
{"t":"p","x":"e concedici, mentre quest’oggi ricordiamo la Vergine Maria,"},
{"t":"p","x":"di dedicarci, come elle fece,"},
{"t":"p","x":"al servizio del tuo disegno di salvezza"},
{"t":"p","x":"per tutti gli uomini."},
{"t":"p","x":"Tu che vivi e regni nei secoli dei secoli."},
{"t":"p","x":"Amen"},
{"t":"p","x":"SAN GIUSEPPE"},
{"t":"p","x":"(19 MARZO – 1 MAGGIO)"}
]},
{id:"202",num:202,title:"Il Signore lo amò perché fu uomo giusto",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"e rese al suo lavoro il cento per uno."},
{"t":"p","x":"*Sii benedetto per sempre, Signore*"},
{"t":"p","x":"Dio provvidente, che affidasti alla fedele custodia"},
{"t":"p","x":"di San Giuseppe il tuo Figlio unigenito e sua Madre, Maria,"},
{"t":"p","x":"benedici il pane del nostro sudore e concedici"},
{"t":"p","x":"di lavorare senza riposo all’espansione del tuo Regno."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"FESTA DEL CUORE DI MARIA"}
]},
{id:"203",num:203,title:"Ti ringraziamo e ti benediciamo, Signore,",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"per il dono inestimabile di essere e di chiamarci"},
{"t":"p","x":"Figli del Cuore Immacolato di Maria."},
{"t":"p","x":"*Sii benedetto per sempre, Signore*"},
{"t":"p","x":"Signore, Dio nostro,"},
{"t":"p","x":"che ti sei degnato di convocarci nella Congregazione"},
{"t":"p","x":"facendoci Figli del Cuore Immacolato della Madre tua,"},
{"t":"p","x":"concedi ai tuoi fedeli di vivere intensamente la pietà filiale verso Maria"},
{"t":"p","x":"e benedici noi ora riuniti intorno a questa mensa"},
{"t":"p","x":"dove esprimiamo e dividiamo la nostra fraternità."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"SANTA CATERINA DA SIENA, COMPATRONA"},
{"t":"p","x":"(29 APRILE)"}
]},
{id:"204",num:204,title:"Ti lodiamo, Signore, perché in Santa Caterina da Siena",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"ci doni prova di potenza e sapienza."},
{"t":"p","x":"*Sii benedetto per sempre, Signore.*"},
{"t":"p","x":"Signore Dio nostro,"},
{"t":"p","x":"che donasti a Santa Caterina da Siena"},
{"t":"p","x":"di ardere di amore per Te e per la Chiesa,"},
{"t":"p","x":"benedici questo cibo che stiamo per prendere"},
{"t":"p","x":"e concedi a noi di mantenerci sempre alla tua presenza"},
{"t":"p","x":"e di essere nella tua Chiesa agenti di comunione."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"FESTE DEGLI APOSTOLI"}
]},
{id:"205",num:205,title:"Sii benedetto, Gesù, inviato e testimone del Padre.",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"Sii benedetto per sempre, Signore"},
{"t":"p","x":"Sii benedetto, Signore, per i frutti della terra"},
{"t":"p","x":"e del lavoro dell’uomo:"},
{"t":"p","x":"aiutino questa comunità di vita apostolica"},
{"t":"p","x":"a mantenersi fedele al tuo santo servizio."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"}
]},
{id:"206",num:206,title:"Ti lodiamo e ti benediciamo, Cristo,",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"che prolunghi la tua presenza e la tua parola nel mondo"},
{"t":"p","x":"per mezzo degli Apostoli."},
{"t":"p","x":"*Sii benedetto per sempre, Signore.*"},
{"t":"p","x":"Signore Gesù, che ci invii come inviasti gli Apostoli"},
{"t":"p","x":"a predicare la Buona Novella del Regno,"},
{"t":"p","x":"benedici questo cibo che stiamo per prendere"},
{"t":"p","x":"e rendici ministri idonei della tua Parola,"},
{"t":"p","x":"apostoli instancabili del tuo Regno."},
{"t":"p","x":"Tu che vivi e regni nei secoli dei secoli."},
{"t":"p","x":"Amen"}
]},
{id:"207",num:207,title:"Signore Gesù, atteso dai profeti",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"e annunciato dagli apostoli e dagli evangelisti."},
{"t":"p","x":"*Sii benedetto per sempre, Signore.*"},
{"t":"p","x":"Signore Gesù, che per amore al Padre e ai fratelli,"},
{"t":"p","x":"hai voluto offrirti al sacrificio e alla morte"},
{"t":"p","x":"e fare degli apostoli testimoni della tua vita"},
{"t":"p","x":"e della tua risurrezione,"},
{"t":"p","x":"benedici il nostro cibo e donaci la gioia"},
{"t":"p","x":"della tua presenza viva in mezzo a noi."},
{"t":"p","x":"Tu che vivi e regni nei secoli dei secoli."},
{"t":"p","x":"Amen"}
]},
{id:"208",num:208,title:"Signore Gesù, che chiamasti gli Apostoli",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"perché stessero con te e per inviarli a predicare."},
{"t":"p","x":"*Sii benedetto per sempre, Signore.*"},
{"t":"p","x":"Tu, o Signore, che hai affidato agli Apostoli"},
{"t":"p","x":"il compito di andare nel mondo intero"},
{"t":"p","x":"a predicare la Buona Novella"},
{"t":"p","x":"e hai chiamato noi"},
{"t":"p","x":"ad una vita perfettamente apostolica,"},
{"t":"p","x":"benedici la nostra mensa e concedi che un giorno"},
{"t":"p","x":"possiamo partecipare al banchetto del tuo Regno."},
{"t":"p","x":"Tu che vivi e regni nei secoli dei secoli."},
{"t":"p","x":"Amen"},
{"t":"p","x":"ANNIVERSARIO DELLA FONDAZIONE DELLA CONGREGAZIONE (16 LUGLIO)"}
]},
{id:"209",num:209,title:"Benediciamo il Signore, che ha suscitato nella Chiesa",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"la nostra Congregazione di Missionari."},
{"t":"p","x":"*Sii benedetto per sempre, Signore.*"},
{"t":"p","x":"Signore Dio nostro che,"},
{"t":"p","x":"a tua maggior gloria, per la nostra santificazione"},
{"t":"p","x":"e per la salvezza degli uomini,"},
{"t":"p","x":"hai fondato la nostra Congregazione"},
{"t":"p","x":"con l’intervento speciale"},
{"t":"p","x":"della Vergine Maria"},
{"t":"p","x":"e per mezzo di S. Antonio Maria Claret,"},
{"t":"p","x":"mentre ti ringraziamo per questo cibo"},
{"t":"p","x":"col quale oggi ci benedici,"},
{"t":"p","x":"ti chiediamo di concederci"},
{"t":"p","x":"di essere ogni giorno più fedeli alla tua chiamata,"},
{"t":"p","x":"secondo il nostro carisma missionario nella Chiesa."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"SANT’IGNAZIO DI LOYOLA"},
{"t":"p","x":"(31 LUGLIO)"}
]},
{id:"210",num:210,title:"Glorifichiamo e lodiamo il Signore",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"che tutto dispone al bene di coloro che ama."},
{"t":"p","x":"Sii benedetto per sempre, Signore."},
{"t":"p","x":"Signore, Dio nostro, che hai suscitato nella tua Chiesa"},
{"t":"p","x":"Sant’Ignazio di Loyola per estendere in tutto il mondo"},
{"t":"p","x":"la gloria del tuo nome:"},
{"t":"p","x":"benedici questi alimenti e donaci fame e sete di giustizia"},
{"t":"p","x":"per cercare in ogni cosa la tua gloria"},
{"t":"p","x":"e la salvezza dei nostri fratelli."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"SANT’ALFONSO MARIA DE’ LIGUORI,"},
{"t":"p","x":"COMPATRONO (1 AGOSTO)"}
]},
{id:"211",num:211,title:"I santi sono gli amici di Dio",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"che rendono testimonianza della santità divina."},
{"t":"p","x":"Sii benedetto per sempre, Signore."},
{"t":"p","x":"Signore, Dio nostro,"},
{"t":"p","x":"che hai fatto di Sant’Alfonso Maria de’ Liguori"},
{"t":"p","x":"un saggio e zelante predicatore della tua Parola:"},
{"t":"p","x":"riversa su di noi la tua benedizione"},
{"t":"p","x":"mentre condividiamo questo cibo che per noi hai preparato"},
{"t":"p","x":"come segno della nostra fede comune"},
{"t":"p","x":"e della nostra missione apostolica."},
{"t":"p","x":"Fa’ che condividiamo con i bisognosi"},
{"t":"p","x":"la tua divina Parola e i beni con i quali ci benedici."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"BEATI MARTIRI DI BARBASTRO"},
{"t":"p","x":"(13 AGOSTO)"}
]},
{id:"212",num:212,title:"Signore Gesù,",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"che hai voluto fossimo battezzati col tuo battesimo"},
{"t":"p","x":"e ci hai concesso di poter bere al calice che il Padre ti ha dato."},
{"t":"p","x":"Sii benedetto per sempre, Signore."},
{"t":"p","x":"Signore Gesù che hai dato fede ai Profeti e agli Apostoli,"},
{"t":"p","x":"generosità ai Martiri Clarettiani di Barbastro"},
{"t":"p","x":"nella loro offerta a Te fino al martirio,"},
{"t":"p","x":"rafforza il nostro corpo"},
{"t":"p","x":"con il cibo che stiamo per prendere"},
{"t":"p","x":"e infondici la forza necessaria"},
{"t":"p","x":"per vivere sempre di fede,"},
{"t":"p","x":"dedicati al tuo servizio."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"SANTI MICHELE, RAFFAELE, GABRIELE ED ANGELI CUSTODI, COMPATRONI"},
{"t":"p","x":"(29 SETTEMBRE e 2 OTTOBRE)"}
]},
{id:"213",num:213,title:"Con il coro degli angeli",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"ti lodiamo e ti benediciamo, Signore"},
{"t":"p","x":"Sii benedetto per sempre, Signore."},
{"t":"p","x":"Signore, Dio nostro,"},
{"t":"p","x":"che manifesti sempre la tua provvidenza,"},
{"t":"p","x":"benedici la nostra tavola, segno della tua generosità"},
{"t":"p","x":"per noi."},
{"t":"p","x":"E fa’ che non ci manchi mai"},
{"t":"p","x":"l’aiuto di coloro che ti servono in cielo"},
{"t":"p","x":"perché ti possiamo lodare anche noi per tutta l’eternità."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"SANTA TERESA DI GESU’ COMPATRONA"},
{"t":"p","x":"(15 OTTOBRE)"}
]},
{id:"214",num:214,title:"Il nostro spirito, Signore ha sete di te,",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"come terra arida e senz’acqua."},
{"t":"p","x":"*Sii benedetto per sempre, Signore.*"},
{"t":"p","x":"O Dio, che hai suscitato nella tua Chiesa"},
{"t":"p","x":"Santa Teresa di Gesù"},
{"t":"p","x":"e attraverso di lei ci hai manifestato una via alla perfezione:"},
{"t":"p","x":"fa’ che desideriamo non soltanto il cibo per il corpo,"},
{"t":"p","x":"ma anche il pane quotidiano della tua Parola e del tuo Corpo"},
{"t":"p","x":"per crescere efficacemente nella nostra santificazione"},
{"t":"p","x":"annunciando il tuo Regno"},
{"t":"p","x":"secondo il nostro carisma nella Chiesa."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen"},
{"t":"p","x":"SANT’ANTONIO MARIA CLARET, FONDATORE"},
{"t":"p","x":"(24 OTTOBRE)"}
]},
{id:"215",num:215,title:"Sii benedetto Signore Gesù,",theme:"mensa",sub:null,tags:[],lines:[
{"t":"p","x":"Figlio e inviato del Padre."},
{"t":"p","x":"*Sii benedetto per sempre, Signore.*"},
{"t":"p","x":"Benedici questo cibo che stiamo per prendere, Signore,"},
{"t":"p","x":"e infondi in noi lo stesso spirito"},
{"t":"p","x":"che animò Sant’Antonio Maria Claret, nostro Padre,"},
{"t":"p","x":"perché, da lui sollecitati,"},
{"t":"p","x":"siamo sempre disposti a proclamare la tua Parola"},
{"t":"p","x":"e a dare la vita per i fratelli."},
{"t":"p","x":"Tu che vivi e regni, nei secoli dei secoli."},
{"t":"p","x":"Amen."},
{"t":"p","x":"1"}
]},

];

const TEMES = [
 {id:'dio-padre',   nom:'A Dio Padre',   desc:'Preghiere del Padre Fondatore: lode, fiducia e abbandono a Dio.'},
 {id:'cuore-maria', nom:'Al Cuore di Maria', desc:'Litanie, suppliche e offerte al Cuore Immacolato di Maria.'},
 {id:'claret',      nom:'Sant\'Antonio M.ª Claret', desc:'Per intercessione del Padre Fondatore.'},
 {id:'congregazione', nom:'Per la Congregazione', desc:'Identità clarettiana, anniversario della Fondazione e rinnovamento dello spirito.'},
 {id:'consigli',    nom:'Consigli evangelici e virtù apostoliche', desc:'Povertà, castità, obbedienza e virtù apostoliche.'},
 {id:'comunita',    nom:'Vita di comunità', desc:'Carità fraterna e preghiera per la propria comunità.'},
 {id:'missione',    nom:'Missione e apostolato', desc:'Zelo evangelizzatore, missioni e servizio alla Chiesa.'},
 {id:'vocazioni',   nom:'Vocazioni', desc:'Per chiedere al Signore vocazioni missionarie e la perseveranza.'},
 {id:'infermi',     nom:'Per gli infermi', desc:'Per i fratelli che soffrono la malattia.'},
 {id:'defunti',     nom:'Per i defunti', desc:'Per i clarettiani defunti, genitori, familiari e benefattori.'},
 {id:'angelus',     nom:'Angelus e antifone mariane', desc:'L\'Angelus, il Regina caeli e le antifone di Compieta.'},
 {id:'eucaristia',  nom:'Eucaristia', desc:'Preghiere davanti al Santissimo Sacramento.'},
 {id:'riunioni',    nom:'Riunioni e incontri', desc:'Per iniziare e concludere una riunione comunitaria.'},
 {id:'esercizi',    nom:'Esercizi spirituali', desc:'Per iniziare un ritiro o gli esercizi spirituali.'},
 {id:'san-giuseppe',nom:'San Giuseppe', desc:'Litanie e preghiere al patrono della Congregazione.'},
 {id:'martiri',     nom:'Martiri clarettiani', desc:'Ai Beati Martiri della Famiglia Clarettiana.'},
 {id:'beatificazione', nom:'Beatificazioni', desc:'Petizioni per la beatificazione e canonizzazione.'},
 {id:'capitolo',    nom:'Capitolo', desc:'Prima del Capitolo, durante la sua celebrazione e per il XXVII Capitolo Generale.'},
 {id:'mensa',       nom:'Benedizione della mensa', desc:'Per le feste proprie dell\'anno clarettiano.'}
];

const CIRCUMS = [
 {t:'Iniziare una riunione',    h:'#/tema/riunioni'},
 {t:'Concludere una riunione',  h:'#/cerca/Per concludere'},
 {t:'Benedizione della mensa',  h:'#/tema/mensa'},
 {t:'Un fratello infermo',      h:'#/tema/infermi'},
 {t:'Un defunto',               h:'#/tema/defunti'},
 {t:'Per le vocazioni',         h:'#/tema/vocazioni'},
 {t:'Rinnovo dei voti',         h:'#/p/50'},
 {t:'Anniversario della Fondazione', h:'#/cerca/anniversario'},
 {t:'Litanie',                  h:'#/cerca/Litanie'},
 {t:'Angelus',                  h:'#/p/101'},
 {t:'Capitolo Generale',        h:'#/tema/capitolo'}
];

/* ---------- utilidades ---------- */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const perTema = id => DADES.filter(p=>p.theme===id);
const idxDe = p => DADES.indexOf(p);
const troba = id => DADES.find(p=>String(p.id)===String(id));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const incipit = p => { const l=p.lines.find(l=>l.t==='p'||l.t==='v'); return l?l.x:''; };

/* ---------- favoritos ---------- */
let favs = new Set(); let favsMem = true;
async function carregaFavs(){
  try{ const r = await window.storage.get('cmf-favoriti'); if(r&&r.value){favs=new Set(JSON.parse(r.value)); favsMem=false;} else {favsMem=false;} }
  catch(e){ favsMem=false; /* clave inexistente: ok */ }
}
async function desaFavs(){
  try{ await window.storage.set('cmf-favoriti', JSON.stringify([...favs])); }catch(e){}
}
function toggleFav(id){ if(favs.has(id)) favs.delete(id); else favs.add(id); desaFavs(); render(); }

/* ---------- tamaño del texto ---------- */
let mida = 1.28;
function canviaMida(d){ mida = Math.min(2.4, Math.max(.95, mida + d)); document.documentElement.style.setProperty('--fs-preg', mida+'rem'); }

/* ---------- índice lateral ---------- */
function pintaIdx(temaActiu){
  const nav = document.getElementById('idxNav');
  let h = '<div class="idx-titol">Temi</div>';
  for(const t of TEMES){
    const n = perTema(t.id).length;
    h += `<a href="#/tema/${t.id}" class="${temaActiu===t.id?'actiu':''}">${esc(t.nom)}<span class="n">${n}</span></a>`;
  }
  if(favs.size) h += `<div class="idx-titol">Preparazione</div><a href="#/favorits" class="${temaActiu==='__fav'?'actiu':''}">Le mie preghiere<span class="n">${favs.size}</span></a>`;
  nav.innerHTML = h;
}

/* ---------- búsqueda ---------- */
function cercaHTML(valor){
  return `<div class="cerca-wrap"><span class="cerca-ico">⌕</span>
  <input id="cerca" class="cerca" type="search" value="${esc(valor||'')}" placeholder="Cerca per numero, titolo o parole… (es. «33», «infermi», «Cuore di Maria»)" aria-label="Búsqueda de preghiere" autocomplete="off"></div>`;
}
function lligaCerca(){
  const el = document.getElementById('cerca'); if(!el) return;
  el.addEventListener('input', ()=>{ const q=el.value.trim();
    history.replaceState(null,'', q? '#/cerca/'+encodeURIComponent(q) : '#/');
    pintaResultats(q);
  });
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const q=el.value.trim(); const ex=DADES.find(p=>String(p.num)===q); if(ex) location.hash='#/p/'+ex.id; } });
}
function cercaPreg(q){
  const nq = norm(q); if(!nq) return [];
  const res = DADES.map(p=>{
    let s=0;
    if(String(p.num||'')===q.trim()) s+=100;
    else if(String(p.num||'').startsWith(q.trim()) && /^\d/.test(q)) s+=40;
    if(norm(p.title).includes(nq)) s+=30;
    if(norm(p.sub||'').includes(nq)) s+=14;
    if((p.tags||[]).some(t=>norm(t).includes(nq))) s+=14;
    const cos = norm(p.lines.map(l=>l.x).join(' '));
    if(cos.includes(nq)) s+=8;
    return {p,s};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.p);
  return res;
}
function itemHTML(p, mostraTema){
  const t = TEMES.find(t=>t.id===p.theme);
  return `<li class="preg-item"><a href="#/p/${p.id}">
    <span class="foli">${p.num?esc(String(p.num)):'·'}</span>
    <span><span class="tt">${esc(p.title)}${favs.has(String(p.id))?' <span class="fav-cinta">❧</span>':''}</span>
    <span class="inc">${esc(incipit(p))}</span></span>
    ${mostraTema&&t?`<span class="res-tema">${esc(t.nom)}</span>`:(p.sub?`<span class="etq">${esc(p.sub)}</span>`:'')}
  </a></li>`;
}
function pintaResultats(q){
  const cont = document.getElementById('resultats'); if(!cont) return;
  if(!q){ cont.innerHTML = portadaCos(); return; }
  const res = cercaPreg(q);
  cont.innerHTML = res.length
    ? `<div class="res-cap">${res.length} preghier${res.length===1?'a trovata':'e trovate'}</div><ul class="llista">${res.map(p=>itemHTML(p,true)).join('')}</ul>`
    : `<div class="buit">Non è stata trovata nessuna preghiera con «${esc(q)}».<br>Prova con il numero, una parola del titolo o del testo.</div>`;
}

/* ---------- vistas ---------- */
function portadaCos(){
  let h = `<div class="portada">
    <div class="eyebrow">Raccolta per la preghiera comunitaria</div>
    <h2>Trova la preghiera per ogni momento</h2>
    <p class="intro">Ogni preghiera conserva il numero e il titolo della raccolta: chi guida la preghiera può invitare dicendo, ad esempio, «preghiamo con la preghiera 33, La preghiera del clarettiano».</p>
    <div class="chips">${CIRCUMS.map(c=>`<a class="chip" href="${c.h}">${esc(c.t)}</a>`).join('')}</div>
    <div class="temes-grid">${TEMES.map(t=>`<a class="tema-card" href="#/tema/${t.id}">
      <h3>${esc(t.nom)}</h3><div class="desc">${esc(t.desc)}</div>
      <div class="compta">${perTema(t.id).length} preghiere</div></a>`).join('')}
    </div></div>`;
  return h;
}
function vistaPortada(q){
  pintaIdx(null);
  document.getElementById('pagina').innerHTML = cercaHTML(q) + `<div id="resultats"></div>`;
  lligaCerca();
  pintaResultats(q||'');
  if(q){ const el=document.getElementById('cerca'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
}
function vistaTema(id){
  const t = TEMES.find(t=>t.id===id); if(!t){ location.hash='#/'; return; }
  pintaIdx(id);
  const pl = perTema(id);
  const subs = [...new Set(pl.map(p=>p.sub).filter(Boolean))];
  let llista='';
  if(subs.length>1){
    for(const s of subs){ llista += `<div class="sub-grup">${esc(s)}</div><ul class="llista">${pl.filter(p=>p.sub===s).map(p=>itemHTML(p)).join('')}</ul>`; }
    const sense = pl.filter(p=>!p.sub);
    if(sense.length) llista = `<ul class="llista">${sense.map(p=>itemHTML(p)).join('')}</ul>` + llista;
  } else {
    llista = `<ul class="llista">${pl.map(p=>itemHTML(p)).join('')}</ul>`;
  }
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/">← Tutti i temi</a>
    <div class="tema-cap"><h2>${esc(t.nom)}</h2><div class="desc">${esc(t.desc)}</div></div>${llista}`;
  lligaCerca();
  window.scrollTo(0,0);
}
function vistaFavorits(){
  pintaIdx('__fav');
  const pl = DADES.filter(p=>favs.has(String(p.id)));
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/">← Tutti i temi</a>
    <div class="tema-cap"><h2>Le mie preghiere</h2><div class="desc">Preghiere contrassegnate per preparare la preghiera comunitaria.</div></div>` +
   (pl.length?`<ul class="llista">${pl.map(p=>itemHTML(p,true)).join('')}</ul>`
    :`<div class="buit">Non hai ancora contrassegnato nessuna preghiera.<br>Aprila e tocca «Segna» per salvarla qui.</div>`);
  lligaCerca(); window.scrollTo(0,0);
}
function liniaHTML(l, prev){
  if(l.t==='rub') return `<p class="rub">${esc(l.x)}</p>`;
  if(l.t==='v') return `<p class="vers${prev&&prev.t==='r'?' espai':''}">${esc(l.x)}</p>`;
  if(l.t==='r') return `<p class="resp">${esc(l.x)}</p>`;
  const espai = prev && (prev.t==='r') ? ' espai':'';
  return `<p class="${espai.trim()}">${esc(l.x)}</p>`;
}
function vistaPreg(id){
  const p = troba(id); if(!p){ location.hash='#/'; return; }
  pintaIdx(p.theme);
  const t = TEMES.find(t=>t.id===p.theme);
  const i = idxDe(p), ant = DADES[i-1], seg = DADES[i+1];
  let cos=''; let prev=null;
  for(const l of p.lines){ cos += liniaHTML(l, prev); prev=l; }
  const fav = favs.has(String(p.id));
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/tema/${p.theme}">← ${esc(t?t.nom:'Temi')}</a>
    <article class="preg-full">
      <div class="preg-meta">${esc(t?t.nom:'')}${p.sub?' · '+esc(p.sub):''}</div>
      ${p.num?`<div class="preg-num">${esc(String(p.num))}</div>`:''}
      <h2 class="preg-titol">${esc(p.title)}</h2>
      <div class="preg-eines">
        <button class="eina surt-lectura" id="btnLectura">📖 Modo preghiera</button>
        <button class="eina ${fav?'fav-actiu':''}" id="btnFav">${fav?'❧ Segnata':'❧ Segna'}</button>
        <button class="eina" id="btnCopia">Copia testo</button>
        <button class="eina" onclick="window.print()">Stampa</button>
        <span class="mida-grup"><button class="eina mida" id="btnMenys" aria-label="Testo più piccolo">A−</button><button class="eina mida" id="btnMes" aria-label="Testo più grande">A+</button></span>
      </div>
      <div class="preg-cos" id="cosPreg">${cos}</div>
    </article>
    <nav class="nav-pn">
      ${ant?`<a href="#/p/${ant.id}"><span class="pn-l">← Precedente</span><span class="pn-t">${ant.num?ant.num+'. ':''}${esc(ant.title)}</span></a>`:'<span></span>'}
      ${seg?`<a class="seg" href="#/p/${seg.id}"><span class="pn-l">Successiva →</span><span class="pn-t">${seg.num?seg.num+'. ':''}${esc(seg.title)}</span></a>`:''}
    </nav>`;
  lligaCerca();
  document.getElementById('btnFav').onclick = ()=>toggleFav(String(p.id));
  document.getElementById('btnMes').onclick = ()=>canviaMida(.12);
  document.getElementById('btnMenys').onclick = ()=>canviaMida(-.12);
  document.getElementById('btnCopia').onclick = e=>{
    const txt = (p.num?p.num+'. ':'')+p.title+'\n\n'+p.lines.map(l=>{
      if(l.t==='v')return 'V/. '+l.x; if(l.t==='r')return 'R/. '+l.x; return l.x;}).join('\n');
    navigator.clipboard.writeText(txt).then(()=>{e.target.textContent='Copiato ✓'; setTimeout(()=>e.target.textContent='Copia testo',1600);}).catch(()=>{});
  };
  const bl = document.getElementById('btnLectura');
  bl.onclick = ()=>{
    document.body.classList.toggle('lectura');
    const on = document.body.classList.contains('lectura');
    bl.textContent = on ? '✕ Salir del modo preghiera' : '📖 Modo preghiera';
    if(on && mida<1.6){ mida=1.6; document.documentElement.style.setProperty('--fs-preg',mida+'rem'); }
    window.scrollTo(0,0);
  };
  window.scrollTo(0,0);
}

/* ---------- router ---------- */
function render(){
  document.body.classList.remove('lectura');
  const h = location.hash || '#/';
  const m1 = h.match(/^#\/tema\/(.+)$/);
  const m2 = h.match(/^#\/p\/(.+)$/);
  const m3 = h.match(/^#\/cerca\/(.+)$/);
  if(m1) vistaTema(decodeURIComponent(m1[1]));
  else if(m2) vistaPreg(decodeURIComponent(m2[1]));
  else if(m3) vistaPortada(decodeURIComponent(m3[1]));
  else if(h==='#/favorits') vistaFavorits();
  else vistaPortada('');
}
window.addEventListener('hashchange', render);
document.getElementById('toggleIdx').addEventListener('click', function(){
  const sp = document.querySelector('.spine'); sp.classList.toggle('open');
  this.setAttribute('aria-expanded', sp.classList.contains('open'));
  this.textContent = sp.classList.contains('open') ? "Nascondi l'indice" : 'Indice dei temi';
});
document.querySelector('.idx').addEventListener('click', ()=>{ if(innerWidth<=900){ document.querySelector('.spine').classList.remove('open'); }});

carregaFavs().then(render);
render();

</script>
</body>
</html>
