<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preghiere Clarettiane · CMF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --granat:#6E1423; --granat-fosc:#520E1A; --granat-clar:#8C2333;
  --or:#A87B2D; --or-clar:#C9A45C;
  --paper:#FAF6ED; --paper-2:#F3EDDF; --paper-3:#ECE4D2;
  --tinta:#26211A; --tinta-2:#5A5246; --tinta-3:#8A8070;
  --linia:#DDD3BE;
  --fs-preg:1.28rem;
  --serif:'EB Garamond',Georgia,serif;
  --display:'Cormorant Garamond',Georgia,serif;
  --ui:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--tinta);font-family:var(--serif);min-height:100vh}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:inherit}

/* ============ LAYOUT ============ */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}

/* ============ SIDEBAR (llom del llibre) ============ */
.spine{background:linear-gradient(175deg,var(--granat) 0%,var(--granat-fosc) 100%);color:#F5E9D7;padding:2rem 1.5rem 2.5rem;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--granat-clar) transparent}
.spine::after{content:'';position:fixed;left:296px;top:0;bottom:0;width:4px;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent);pointer-events:none}
@media(max-width:900px){
  .spine{position:relative;height:auto;padding:1.4rem 1.2rem 1.2rem}
  .spine::after{display:none}
  .spine .idx{display:none}
  .spine.open .idx{display:block}
}
.marca{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.35rem}
.marca .creu{font-family:var(--display);font-size:1.5rem;color:var(--or-clar)}
.marca h1{font-family:var(--display);font-weight:600;font-size:1.62rem;line-height:1.1;letter-spacing:.01em}
.marca h1 a{text-decoration:none}
.sub-marca{font-family:var(--ui);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--or-clar);margin-bottom:1.6rem}
.idx-titol{font-family:var(--ui);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,233,215,.55);margin:1.5rem 0 .55rem;padding-bottom:.4rem;border-bottom:1px solid rgba(245,233,215,.18)}
.idx a{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;text-decoration:none;padding:.34rem .5rem;margin:0 -.5rem;border-radius:4px;font-size:1.02rem;line-height:1.25;transition:background .15s}
.idx a:hover,.idx a:focus-visible{background:rgba(255,255,255,.09);outline:none}
.idx a.actiu{background:rgba(255,255,255,.13)}
.idx a .n{font-family:var(--ui);font-size:.66rem;color:var(--or-clar);letter-spacing:.05em;flex-shrink:0}
.toggle-idx{display:none;font-family:var(--ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--or-clar);border:1px solid rgba(201,164,92,.5);border-radius:20px;padding:.42rem 1rem;margin-top:.8rem}
@media(max-width:900px){.toggle-idx{display:inline-block}}

/* ============ PÀGINA ============ */
.pagina{padding:2.6rem clamp(1.2rem,5vw,4.5rem) 5rem;max-width:880px;width:100%;margin:0 auto}
@media(max-width:900px){.pagina{padding-top:1.6rem}}

/* cerca */
.cerca-wrap{position:relative;margin-bottom:1.8rem}
.cerca{width:100%;font-family:var(--serif);font-size:1.12rem;padding:.85rem 1.1rem .85rem 2.9rem;border:1px solid var(--linia);border-radius:8px;background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(60,45,20,.06)}
.cerca:focus{outline:2px solid var(--granat);outline-offset:-1px}
.cerca::placeholder{color:var(--tinta-3);font-style:italic}
.cerca-ico{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--tinta-3);pointer-events:none}

/* portada */
.eyebrow{font-family:var(--ui);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--granat);margin-bottom:.5rem}
.portada h2{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.12;margin-bottom:.7rem}
.portada p.intro{font-size:1.12rem;color:var(--tinta-2);max-width:56ch;line-height:1.55;margin-bottom:2rem}

.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.4rem}
.chip{font-family:var(--ui);font-size:.78rem;font-weight:500;padding:.42rem .95rem;border:1px solid var(--linia);border-radius:100px;background:#fff;color:var(--tinta-2);transition:all .15s;text-decoration:none;display:inline-block}
.chip:hover,.chip:focus-visible{border-color:var(--granat);color:var(--granat);outline:none}

.temes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:.9rem}
.tema-card{position:relative;background:#fff;border:1px solid var(--linia);border-radius:8px;padding:1.2rem 1.15rem 1.05rem;text-align:left;text-decoration:none;transition:border-color .15s, box-shadow .15s;overflow:hidden;display:block}
.tema-card:hover,.tema-card:focus-visible{border-color:var(--granat);box-shadow:0 3px 12px rgba(110,20,35,.09);outline:none}
.tema-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--granat)}
.tema-card h3{font-family:var(--display);font-weight:600;font-size:1.28rem;line-height:1.15;margin-bottom:.3rem}
.tema-card .desc{font-size:.95rem;font-style:italic;color:var(--tinta-2);line-height:1.35;margin-bottom:.55rem}
.tema-card .compta{font-family:var(--ui);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--or)}

/* llista de pregàries */
.torna{font-family:var(--ui);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--granat);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.4rem}
.torna:hover{text-decoration:underline}
.tema-cap h2{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:.35rem}
.tema-cap .desc{font-size:1.08rem;font-style:italic;color:var(--tinta-2);margin-bottom:1.7rem;max-width:60ch;line-height:1.5}
.sub-grup{font-family:var(--ui);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--granat);margin:1.8rem 0 .6rem;display:flex;align-items:center;gap:.8rem}
.sub-grup::after{content:'';flex:1;height:1px;background:var(--linia)}
.llista{list-style:none}
.preg-item{border-bottom:1px solid var(--linia)}
.preg-item a{display:flex;gap:1rem;align-items:baseline;padding:.85rem .4rem;text-decoration:none;transition:background .12s}
.preg-item a:hover,.preg-item a:focus-visible{background:rgba(110,20,35,.045);outline:none}
.foli{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--granat);min-width:2.6rem;text-align:right;flex-shrink:0;font-variant-numeric:oldstyle-nums}
.preg-item .tt{font-size:1.16rem;line-height:1.3}
.preg-item .inc{display:block;font-size:.92rem;font-style:italic;color:var(--tinta-3);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58ch}
.preg-item .etq{font-family:var(--ui);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin-left:auto;flex-shrink:0}
.buit{padding:2.5rem 0;text-align:center;color:var(--tinta-3);font-style:italic;font-size:1.08rem}

/* resultat de cerca */
.res-cap{font-family:var(--ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:.8rem}
.res-tema{font-family:var(--ui);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin-left:auto;flex-shrink:0}

/* ============ PREGÀRIA ============ */
.preg-full{background:#fff;border:1px solid var(--linia);border-radius:10px;padding:clamp(1.6rem,4vw,3.2rem) clamp(1.3rem,4.5vw,3.6rem) clamp(2rem,4vw,3rem);box-shadow:0 2px 14px rgba(60,45,20,.07);position:relative}
.preg-full::before{content:'';position:absolute;top:-1px;left:clamp(1.3rem,4.5vw,3.6rem);width:26px;height:44px;background:var(--granat);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.preg-meta{font-family:var(--ui);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--or);margin-bottom:.9rem;padding-left:3.2rem}
.preg-num{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--granat);float:left;margin:-.3rem 1rem .2rem 0;font-variant-numeric:oldstyle-nums}
.preg-titol{font-family:var(--display);font-weight:600;font-size:clamp(1.55rem,3vw,2.05rem);line-height:1.15;margin-bottom:1.4rem}
.preg-cos{clear:both;font-size:var(--fs-preg);line-height:1.62;border-top:1px solid var(--linia);padding-top:1.5rem}
.preg-cos p{margin-bottom:.16em}
.preg-cos p.espai{margin-top:.9em}
.preg-cos .rub{font-family:var(--ui);font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--or);margin:1.1em 0 .5em;font-style:normal}
.preg-cos .vers{position:relative;padding-left:1.9em}
.preg-cos .vers::before{content:'V/.';position:absolute;left:0;font-style:italic;color:var(--tinta-3);font-size:.85em;top:.15em}
.preg-cos .resp{position:relative;padding-left:1.9em;color:var(--granat);font-style:italic;font-weight:500;margin-bottom:.45em}
.preg-cos .resp::before{content:'R/.';position:absolute;left:0;color:var(--granat);font-size:.85em;font-style:italic;top:.15em}
.preg-eines{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.3rem 0 1.6rem;align-items:center}
.eina{font-family:var(--ui);font-size:.76rem;font-weight:500;padding:.48rem .95rem;border:1px solid var(--linia);border-radius:6px;background:#fff;color:var(--tinta-2);display:inline-flex;align-items:center;gap:.45rem;transition:all .15s}
.eina:hover,.eina:focus-visible{border-color:var(--granat);color:var(--granat);outline:none}
.eina.fav-actiu{background:var(--granat);border-color:var(--granat);color:#F5E9D7}
.mida-grup{display:inline-flex;border:1px solid var(--linia);border-radius:6px;overflow:hidden;margin-left:auto}
.mida-grup .eina{border:none;border-radius:0;padding:.48rem .8rem}
.mida-grup .eina+.eina{border-left:1px solid var(--linia)}
.nav-pn{display:flex;justify-content:space-between;gap:1rem;margin-top:1.6rem}
.nav-pn a{font-family:var(--ui);font-size:.78rem;color:var(--tinta-2);text-decoration:none;display:flex;flex-direction:column;gap:.15rem;max-width:46%}
.nav-pn a:hover .pn-t{color:var(--granat)}
.nav-pn .pn-l{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3)}
.nav-pn .pn-t{font-family:var(--serif);font-size:1.02rem;line-height:1.25;transition:color .15s}
.nav-pn a.seg{text-align:right;margin-left:auto}

/* mode lectura */
body.lectura .spine,body.lectura .cerca-wrap,body.lectura .torna,body.lectura .preg-eines .eina:not(.surt-lectura):not(.mida),body.lectura .nav-pn,body.lectura .preg-meta{display:none}
body.lectura .shell{grid-template-columns:1fr}
body.lectura .pagina{max-width:820px;padding-top:2.2rem}
body.lectura .preg-full{border:none;box-shadow:none;background:var(--paper)}
body.lectura .preg-full::before{display:none}
body.lectura{--fs-preg:1.6rem}
body.lectura .preg-eines{position:sticky;top:0;background:var(--paper);padding:.6rem 0;z-index:5;margin-top:0}

/* favorits ribbon on list */
.fav-cinta{color:var(--granat);flex-shrink:0;font-size:.85rem}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{
  .spine,.cerca-wrap,.torna,.preg-eines,.nav-pn,.toggle-idx{display:none!important}
  .shell{display:block}
  body{background:#fff}
  .preg-full{border:none;box-shadow:none;padding:0}
  .preg-full::before{display:none}
  .pagina{padding:0;max-width:none}
}

</style>
</head>
<body>
<div class="shell">
  <aside class="spine">
    <div class="marca"><span class="creu">✠</span><h1><a href="#/">Preghiere Clarettiane</a></h1></div>
    <div class="sub-marca">Missionari Figli del Cuore di Maria</div>
    <button class="toggle-idx" id="toggleIdx" aria-expanded="false">Indice dei temi</button>
    <nav class="idx" id="idxNav" aria-label="Indice dei temi"></nav>
  </aside>
  <main class="pagina" id="pagina"></main>
</div>
<script>
const DADES = [
{id:"1",num:1,title:"Preghiera apostolica",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Signore e mio Padre,"},
{"t":"p","x":"che io ti conosca e ti faccia conoscere,"},
{"t":"p","x":"ti ami e ti faccia amare,"},
{"t":"p","x":"ti serva e ti faccia servire,"},
{"t":"p","x":"ti lodi e ti faccia lodare da"},
{"t":"p","x":"tutte le creature."},
{"t":"p","x":"Amen."},
{"t":"p","x":"(Sant’Antonio M. Claret)"}
]},
{id:"2",num:2,title:"Provvidenza di Dio",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Sii benedetto per la tua provvidenza, Signore,"},
{"t":"p","x":"e per la cura che sempre e in ogni luogo"},
{"t":"p","x":"hai avuto di me."},
{"t":"p","x":"Amen."}
]},
{id:"3",num:3,title:"Amare e servire Dio",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Sii benedetto, o Signore, per il tuo amore e la tua misericordia per me. Ch’io ti ami e ti serva."},
{"t":"p","x":"Ch’io ti faccia amare e servire da tutte le creature."},
{"t":"p","x":"Amen."}
]},
{id:"4",num:4,title:"Richiesta del dono dell’amore",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Fuoco che sempre bruci e mai ti estingui,"},
{"t":"p","x":"amore che sempre ardi e mai ti plachi,"},
{"t":"p","x":"infiammami, perché io t’ami."},
{"t":"p","x":"Ti amo, Gesù, con tutto il mio cuore,"},
{"t":"p","x":"con tutta la mia anima, con tutte le mie forze."},
{"t":"p","x":"Vorrei amarti più ancora, vorrei che tutti ti amassero."},
{"t":"p","x":"Vorrei amarti per me e per tutte le tue creature."},
{"t":"p","x":"Vergine Santissima, concedimi la grazia"},
{"t":"p","x":"che tutti si salvino e che nessuno sia condannato."},
{"t":"p","x":"Amen."}
]},
{id:"5",num:5,title:"Unione con Dio",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Come l’acqua nell’eucaristia si unisce al vino,"},
{"t":"p","x":"così, Signore, desidero unirmi a Te; e con Te, offrirmi"},
{"t":"p","x":"alla Santissima Trinità."},
{"t":"p","x":"Amen."}
]},
{id:"6",num:6,title:"Dio Padre, vita, amore e speranza",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Signor mio, Tu sei mio amore, mio onore,"},
{"t":"p","x":"mia speranza, mio rifugio."},
{"t":"p","x":"Sei mia vita, mia gloria, mio fine,"},
{"t":"p","x":"mio Maestro, mio Padre, mio amore."},
{"t":"p","x":"Amen."}
]},
{id:"7",num:7,title:"Dio provvidente e salvatore",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Grazie, Signore, per la tua bontà"},
{"t":"p","x":"e perché ti avvali di ogni mezzo"},
{"t":"p","x":"per la conversione dei peccatori."},
{"t":"p","x":"Sia benedetta la tua provvidenza, che sempre veglia su me."},
{"t":"p","x":"Canterò ora e sempre la tua eterna misericordia."},
{"t":"p","x":"Amen."}
]},
{id:"8",num:8,title:"Solo Dio",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Tu sei mio amore, Signore, mio onore,"},
{"t":"p","x":"mia speranza e mio rifugio."},
{"t":"p","x":"Tu sei mia gloria e mio fine. Mio Maestro e mio Padre."},
{"t":"p","x":"Aiutami a non cercare altra cosa che Te,"},
{"t":"p","x":"a non saper d’altro che della tua volontà, per compierla."},
{"t":"p","x":"Amo solo Te, e in Te e per Te,"},
{"t":"p","x":"ogni altra cosa."},
{"t":"p","x":"Tu mi basti assolutamente."},
{"t":"p","x":"Fa’ che io ti ami come Tu ami me,"},
{"t":"p","x":"come vuoi che io ti ami."},
{"t":"p","x":"Amen."}
]},
{id:"9",num:9,title:"Tutto per la gloria di Dio",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Dio mio, voglio amarti"},
{"t":"p","x":"con tutto il mio cuore, con tutto il mio essere,"},
{"t":"p","x":"con tutte le mie forze:"},
{"t":"p","x":"ti consacro i miei pensieri, i desideri,"},
{"t":"p","x":"le parole e le azioni,"},
{"t":"p","x":"ciò che possiedo, ciò che potrei possedere."},
{"t":"p","x":"Fa’ che io usi ciò che possiedo"},
{"t":"p","x":"per il tuo onore e per la tua gloria,"},
{"t":"p","x":"secondo la tua volontà."},
{"t":"p","x":"Amen."}
]},
{id:"10",num:10,title:"Per poter seguire Gesù",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Signore, ti supplico:"},
{"t":"p","x":"fragile qual sono, mandami il tuo Spirito,"},
{"t":"p","x":"affinché m’illumini e mi accenda nel tuo amore,"},
{"t":"p","x":"mi diriga e mi instradi sul cammino retto di Gesù Cristo"},
{"t":"p","x":"e della Vergine Maria, Madre di Dio e Madre mia."},
{"t":"p","x":"Amen."}
]},
{id:"11",num:11,title:"Per chiedere le virtù",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Credo, Signore, ma che io creda più fermamente."},
{"t":"p","x":"Spero, Signore, ma che io speri con più grande verità."},
{"t":"p","x":"Amo, Signore, ma che io ami con più ardore."},
{"t":"p","x":"Soffro, Signore, ma che il mio dolore sia più forte."},
{"t":"p","x":"Ti supplico, Signore: che vuoi che io faccia?"},
{"t":"p","x":"Insegnami a compiere la tua volontà: sii Tu il mio Dio."},
{"t":"p","x":"Concedimi un cuore desto per guidare il tuo popolo,"},
{"t":"p","x":"per distinguere tra il bene e il male."},
{"t":"p","x":"Padre, concedimi umiltà, mansuetudine,"},
{"t":"p","x":"castità, pazienza e carità."},
{"t":"p","x":"Insegnami la bontà, la scienza e la disciplina."},
{"t":"p","x":"Donami il tuo amore, la tua grazia,"},
{"t":"p","x":"ed io sarò ricco in abbondanza."},
{"t":"p","x":"Dio mio, Gesù mio, mio tutto."},
{"t":"p","x":"Vivo sulla croce e sulla croce voglio morire,"},
{"t":"p","x":"e spero di discendere dalla croce, non con le mie mani,"},
{"t":"p","x":"ma aiutato da mani altrui,"},
{"t":"p","x":"dopo essermi consumato in sacrificio."},
{"t":"p","x":"Né mai mi accada, Signore, di gloriarmi d’altra cosa"},
{"t":"p","x":"se non della croce di nostro Signore Gesù Cristo,"},
{"t":"p","x":"per la quale il mondo è stato crocifisso per me"},
{"t":"p","x":"ed io per il mondo."},
{"t":"p","x":"Amen."}
]},
{id:"12",num:12,title:"Esercizio d’amor di Dio",theme:"dio-padre",sub:null,tags:[],lines:[
{"t":"p","x":"Dio mio, sii Dio come sei, in eterno e per sempre:"},
{"t":"p","x":"godo sapendo che Tu lo sei."},
{"t":"p","x":"Hai potere infinito:"},
{"t":"p","x":"sii Dio Onnipotente come sei."},
{"t":"p","x":"Hai sapienza infinita:"},
{"t":"p","x":"sii lodato;"},
{"t":"p","x":"abbi sapienza infinita come hai."},
{"t":"p","x":"Tu hai bontà infinita, carità infinita e infinita clemenza."},
{"t":"p","x":"Abbi bontà, Signore,"},
{"t":"p","x":"carità e clemenza infinita come hai."},
{"t":"p","x":"Signore, Tu sei glorioso e benedetto senza fine:"},
{"t":"p","x":"sii glorioso e benedetto come sei."},
{"t":"p","x":"Tu sei Trino ed Uno, Signore,"},
{"t":"p","x":"Padre, Figlio e Spirito Santo,"},
{"t":"p","x":"tre Persone distinte e un solo vero Dio:"},
{"t":"p","x":"sii Trino e Uno come sei."},
{"t":"p","x":"Sei Salvatore e glorificatore nostro"},
{"t":"p","x":"e di tutte le creature:"},
{"t":"p","x":"sii lodato."},
{"t":"p","x":"Tu, Signore, sei Signore universale"},
{"t":"p","x":"che gli angeli amano, lodano e servono"},
{"t":"p","x":"come i beati in cielo"},
{"t":"p","x":"e gli uomini sulla terra;"},
{"t":"p","x":"Tu sei il Signore di tutti"},
{"t":"p","x":"e tutti ti amiamo nei cieli e sulla terra,"},
{"t":"p","x":"tutti ti lodiamo e ti serviamo senza fine."},
{"t":"p","x":"Cuore di Gesù, ama Dio per me."},
{"t":"p","x":"Cuore di Maria, ama Dio per me."},
{"t":"p","x":"Cuore di tutti i Santi, amate Dio per me."},
{"t":"p","x":"Cori degli Angeli tutti amate Dio per me."},
{"t":"p","x":"Creature tutte, amate Dio per me."},
{"t":"p","x":"O fuoco divino che sempre ardi e mai ti appaghi."},
{"t":"p","x":"O Cuore di Gesù che sempre bruci e mai ti plachi,"},
{"t":"p","x":"fa’ che il mio cuore arda sempre"},
{"t":"p","x":"nel fuoco del divino amore."},
{"t":"p","x":"Amen."}
]},

{"t":"p","x":"Madre e avvocata dei peccatori"},

{"t":"p","x":"Consolazione degli afflitti"},

{id:"14",num:14,title:"Supplica a Maria",theme:"cuore-maria",sub:"del Padre Fondatore",tags:[],lines:[
{"t":"p","x":"O Vergine e Madre di Dio,"},
{"t":"p","x":"rivolgi i tuoi occhi misericordiosi"},
{"t":"p","x":"a noi che viviamo in questa valle di lacrime,"},
{"t":"p","x":"e che in te, come figli, confidiamo."},
{"t":"p","x":"Aiutaci ad annunziare la Buona Novella del Regno"},
{"t":"p","x":"in fedeltà e con fortezza"},
{"t":"p","x":"poiché molti vi si oppongono,"},
{"t":"p","x":"per l’ambizione del potere, per l’affanno delle ricchezze,"},
{"t":"p","x":"per l’ansia del piacere."},
{"t":"p","x":"Disponi di me, perché nella missione apostolica"},
{"t":"p","x":"io collabori con il tuo materno ufficio."},
{"t":"p","x":"Amen."}
]},
{id:"15",num:15,title:"Invocazioni a Maria",theme:"cuore-maria",sub:"del Padre Fondatore",tags:[],lines:[
{"t":"p","x":"Ave, o Maria Immacolata, Figlia di Dio Padre."},
{"t":"p","x":"Ave, o Maria Immacolata, Madre di Dio Figlio."},
{"t":"p","x":"Ave, o Maria Immacolata, Tempio di Dio, Spirito Santo."},
{"t":"p","x":"Ave, o Maria, madre e avvocata dei peccatori."},
{"t":"p","x":"Benedetta te fra tutte le donne."},
{"t":"p","x":"Tu sei la gloria di Gerusalemme,"},
{"t":"p","x":"la gioia di Israele e l’onore del nostro popolo."},
{"t":"p","x":"Tu sei il rifugio dei peccatori,"},
{"t":"p","x":"la consolazione degli afflitti, la stella polare dei naviganti."},
{"t":"p","x":"Tu sei la salute degli infermi,"},
{"t":"p","x":"il coraggio dei moribondi,"},
{"t":"p","x":"la porta del cielo."},
{"t":"p","x":"Tu sei, dopo il Signore frutto benedetto del tuo seno,"},
{"t":"p","x":"ogni nostra speranza."},
{"t":"p","x":"O clemente, o pia, o dolce Immacolata Maria."},
{"t":"p","x":"Amen."}
]},
{id:"16",num:16,title:"Madre del Divin Amore",theme:"cuore-maria",sub:"del Padre Fondatore",tags:[],lines:[
{"t":"p","x":"Maria, Madre mia, Madre del Divin Amore!"},
{"t":"p","x":"Nulla posso chiederti che ti sia più gradito"},
{"t":"p","x":"e più facile concedere"},
{"t":"p","x":"che il Divino Amore."},
{"t":"p","x":"Concedimelo, Madre mia. Madre mia, mio amore."},
{"t":"p","x":"Madre mia, ho fame e sete di amore."},
{"t":"p","x":"Soccorrimi, saziami."},
{"t":"p","x":"O Cuore di Maria, fucina e strumento di amore,"},
{"t":"p","x":"accendimi nell’amore di Dio e del prossimo."},
{"t":"p","x":"Amen."}
]},
{id:"17",num:17,title:"Figlio e ministro di Maria",theme:"cuore-maria",sub:"del Padre Fondatore",tags:[],lines:[
{"t":"p","x":"O Vergine e Madre di Dio!,"},
{"t":"p","x":"sai bene che siamo tuoi figli e tuoi ministri,"},
{"t":"p","x":"da te stessa formati"},
{"t":"p","x":"nella fucina della tua misericordia e del tuo amore."},
{"t":"p","x":"Siamo come una freccia pronta nella tua mano potente."},
{"t":"p","x":"Scagliaci, Madre nostra,"},
{"t":"p","x":"contro tutto ciò che si oppone al Regno di Dio."},
{"t":"p","x":"Fidenti nella tua protezione,"},
{"t":"p","x":"annunciamo il Vangelo"},
{"t":"p","x":"senza altre armi che la divina Parola,"},
{"t":"p","x":"senza altri titoli che l’esser figli del tuo Cuore Immacolato."},
{"t":"p","x":"La vittoria, Madre, sarà tua."},
{"t":"p","x":"Amen."},
{"t":"p","x":"b) DELLA CONGREGAZIONE"}
]},
{id:"18",num:18,title:"Configurazione a Cristo",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"Signore e Dio nostro,"},
{"t":"p","x":"che hai scelto la sempre Vergine Maria"},
{"t":"p","x":"come Madre del tuo Figlio e Madre nostra,"},
{"t":"p","x":"fa’ che, fedeli al suo Cuore materno cui siamo consacrati,"},
{"t":"p","x":"ci configuriamo più pienamente a Cristo"},
{"t":"p","x":"e cooperiamo alla missione apostolica"},
{"t":"p","x":"con il suo ufficio materno."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"19",num:19,title:"Litanie della Vergine Maria",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"fondate sulle Costituzioni"},
{"t":"p","x":"O Maria, noi, Figli del tuo Cuore Immacolato,"},
{"t":"p","x":"per la tua fede obbediente e per il tuo ardente amore"},
{"t":"p","x":"ti proclamiamo «beata»"},
{"t":"p","x":"e ti invochiamo:"},
{"t":"v","x":"Madre di Dio e Madre nostra."},
{"t":"r","x":"Tu sei benedetta fra tutte le donne."},
{"t":"v","x":"Madre di Gesù Cristo, Signore nostro, inviato dal Padre"},
{"t":"v","x":"Madre del Verbo, fatto uomo per opera dello Spirito Santo"},
{"t":"v","x":"Madre del Figlio, unto per evangelizzare i poveri"},
{"t":"v","x":"Fondatrice, Patrona e Titolare della nostra Congregazione"},
{"t":"v","x":"Prima discepola di Cristo"},
{"t":"v","x":"Nostro Modello nella sequela di Cristo"},
{"t":"v","x":"Prima fra i poveri del Signore"},
{"t":"v","x":"Serva totalmente consacrata alla persona e all’opera"},
{"t":"p","x":"del Figlio tuo"},
{"t":"v","x":"Madre e Maestra dei missionari"},
{"t":"v","x":"Formatrice di apostoli"},
{"t":"rub","x":"Preghiamo."},
{"t":"p","x":"Dio Padre nostro, ti ringraziamo"},
{"t":"p","x":"per chiamarci e per essere Figli"},
{"t":"p","x":"del Cuore Immacolato di Maria."},
{"t":"p","x":"Fa’ che veneriamo con amore e fiducia la Madre nostra"},
{"t":"p","x":"e che ci doniamo a Lei perché ci configuri a Cristo,"},
{"t":"p","x":"così che cooperiamo col suo ufficio materno"},
{"t":"p","x":"nella missione apostolica che ci hai affidato."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"20",num:20,title:"Preghiera filiale e apostolica al Cuore di Maria",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"O Vergine e Madre di Dio!,"},
{"t":"p","x":"mi dono a Te come tuo figlio e tuo ministro."},
{"t":"p","x":"Mi consacro al tuo amore materno"},
{"t":"p","x":"perché Tu formi in me Gesù,"},
{"t":"p","x":"il Figlio e l’Inviato del Padre,"},
{"t":"p","x":"l’Unto dallo Spirito Santo"},
{"t":"p","x":"per annunciare la Buona Novella ai poveri."},
{"t":"p","x":"Insegnami a conservare, come Te, la Parola nel cuore,"},
{"t":"p","x":"fino a trasformarmi in Vangelo vivo."},
{"t":"p","x":"La forza dello Spirito"},
{"t":"p","x":"faccia di me testimone di Cristo fra gli uomini."},
{"t":"p","x":"Infondimi il tuo amore materno"},
{"t":"p","x":"perché io riveli loro il Padre"},
{"t":"p","x":"ed essi sentano la gioia di essere figli di Dio"},
{"t":"p","x":"nella comunione fraterna della Chiesa."},
{"t":"p","x":"Madre, ecco tuo figlio: formami."},
{"t":"p","x":"Madre, ecco tuo figlio: inviami."},
{"t":"p","x":"Madre, ecco tuo figlio: parla Tu in me, ama Tu in me."},
{"t":"p","x":"Custodiscimi, e non sia che annunciando agli altri"},
{"t":"p","x":"il Vangelo,"},
{"t":"p","x":"io rimanga escluso dal tuo Regno."},
{"t":"p","x":"In Te, Madre mia,"},
{"t":"p","x":"ho posto tutta la mia fiducia."},
{"t":"p","x":"Non resterò mai deluso."},
{"t":"p","x":"Amen."}
]},

{"t":"p","x":"Ascoltaci, Signore"},
{"t":"p","x":"Agnello di Dio, che togli i peccati del mondo"},
{"t":"p","x":"Abbi pietà di noi"},

{"t":"r","x":"Perché siamo fatti degni delle promesse di Cristo."},
{"t":"rub","x":"Preghiamo."},
{"t":"p","x":"Signore, Dio nostro"},
{"t":"p","x":"che hai fatto del Cuore Immacolato di Maria"},
{"t":"p","x":"una dimora per il tuo Figlio"},
{"t":"p","x":"e il santuario dello Spirito Santo,"},
{"t":"p","x":"donaci un cuore limpido e docile,"},
{"t":"p","x":"affinché, sempre sottomessi alla tua volontà,"},
{"t":"p","x":"ti amiamo sopra tutte le cose"},
{"t":"p","x":"e aiutiamo i fratelli nelle loro necessità."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"22",num:22,title:"Azione di grazie al Cuore di Maria",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"Ti rendiamo grazie, Padre santo,"},
{"t":"p","x":"perché hai dato alla Vergine Maria un cuore saggio e docile,"},
{"t":"p","x":"sempre disposto a compiacerti;"},
{"t":"p","x":"un cuore nuovo ed umile"},
{"t":"p","x":"per fissarvi la legge della nuova Alleanza;"},
{"t":"p","x":"un cuore semplice e limpido,"},
{"t":"p","x":"che la rese degna di concepire candidamente il Figlio tuo"},
{"t":"p","x":"e la rese capace di compiacerti in eterno;"},
{"t":"p","x":"un cuore forte e disposto"},
{"t":"p","x":"a sopportare con forza la spada del dolore"},
{"t":"p","x":"e ad aspettare, gonfia di fede, la risurrezione del Figlio tuo."},
{"t":"p","x":"Donaci un cuore sapiente e docile, nuovo ed umile,"},
{"t":"p","x":"semplice e limpido, forte e disposto,"},
{"t":"p","x":"perché sappiamo imitarla"},
{"t":"p","x":"e cooperiamo con più grande fedeltà"},
{"t":"p","x":"alla tua opera di salvezza."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."}
]},
{id:"23",num:23,title:"Atto di abbandono al Cuore di Maria",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"Madre del Signore, o Cuore di Maria!"},
{"t":"p","x":"Tu che hai presieduto come Fondatrice"},
{"t":"p","x":"all’inizio della nostra Congregazione,"},
{"t":"p","x":"sii sempre nostra ispiratrice,"},
{"t":"p","x":"sii sempre il Cuore della nostra Congregazione,"},
{"t":"p","x":"così bisognosa di contemplazione e di nuove speranze"},
{"t":"p","x":"in questo mondo tanto amato dal Padre"},
{"t":"p","x":"e così segnato dalla mancanza di fede e dall’ingiustizia;"},
{"t":"p","x":"parla per noi"},
{"t":"p","x":"e testimonia attraverso la nostra vita"},
{"t":"p","x":"il messaggio del Regno."},
{"t":"p","x":"Madre del Signore,"},
{"t":"p","x":"prega perché venga a noi lo Spirito,"},
{"t":"p","x":"che è spinta al mondo nuovo."},
{"t":"p","x":"Col tuo Cuore, Madre, prega per noi!,"},
{"t":"p","x":"intercedi per noi!"},
{"t":"p","x":"Amen."}
]},
{id:"24",num:24,title:"Offerta al Cuore di Maria",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"Vergine Maria, Madre di Dio e Madre nostra:"},
{"t":"p","x":"mi affido al tuo amore materno"},
{"t":"p","x":"perché Tu faccia di me un missionario"},
{"t":"p","x":"a immagine e somiglianza del tuo Figlio,"},
{"t":"p","x":"l’Inviato del Padre,"},
{"t":"p","x":"per annunciare la Buona Novella ai poveri."},
{"t":"p","x":"Insegnami a credere, ad amare e a servire come Te."},
{"t":"p","x":"Fammi generoso e grato"},
{"t":"p","x":"per vivere nella gioia"},
{"t":"p","x":"il dono della mia vocazione missionaria."},
{"t":"p","x":"Amen."}
]},
{id:"25",num:25,title:"Cuore di Maria",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"Signore, Dio nostro,"},
{"t":"p","x":"che hai scelto la sempre Vergine Maria,"},
{"t":"p","x":"come Madre di tuo Figlio e Madre nostra:"},
{"t":"p","x":"fa’ che per la fedele donazione al suo Cuore materno,"},
{"t":"p","x":"ci configuriamo più pienamente a Cristo"},
{"t":"p","x":"e, spinti dal suo amore,"},
{"t":"p","x":"ci dedichiamo con più grande generosità"},
{"t":"p","x":"a proclamare il Vangelo a tutti gli uomini."},
{"t":"p","x":"Per Cristo nostro Signore."},
{"t":"p","x":"Amen."},
{"t":"p","x":"26 Madre e Maestra dei Missionari"},
{"t":"p","x":"Maria, Madre e Maestra dei Missionari,"},
{"t":"p","x":"intercedi presso il Padre"},
{"t":"p","x":"affinché noi, figli del tuo Cuore,"},
{"t":"p","x":"riproduciamo gli stessi atteggiamenti di Gesù"},
{"t":"p","x":"e siamo uomini universali,"},
{"t":"p","x":"dagli occhi penetranti e dalle orecchie attente"},
{"t":"p","x":"ai bisogni del mondo."},
{"t":"p","x":"Che noi siamo anche, come Te,"},
{"t":"p","x":"uomini di misericordia,"},
{"t":"p","x":"di tenerezza e compassione;"},
{"t":"p","x":"che ci apriamo sempre a nuovi orizzonti missionari,"},
{"t":"p","x":"disposti ad accettare ciò che è diverso."},
{"t":"p","x":"E la carità apostolica che fluisce"},
{"t":"p","x":"dalla fucina del tuo Cuore"},
{"t":"p","x":"ci dia forza in ogni circostanza"},
{"t":"p","x":"in cui lo Spirito ci collochi."},
{"t":"p","x":"Amen."}
]},
{id:"27",num:27,title:"Invocazione a Maria Madre della Chiesa",theme:"cuore-maria",sub:"della Congregazione",tags:[],lines:[
{"t":"p","x":"Vergine Maria, Madre della Chiesa,"},
{"t":"p","x":"la Chiesa noi ti raccomandiamo."},
{"t":"p","x":"Ricordati di tutti i Tuoi figli;"},
{"t":"p","x":"da’ forza alle loro orazioni davanti a Dio;"},
{"t":"p","x":"mantieni solida la loro fede; fortifica la loro speranza"},
{"t":"p","x":"e aumenta la loro carità."},
{"t":"p","x":"Al tuo Cuore Immacolato noi raccomandiamo"},
{"t":"p","x":"l’intero genere umano:"},
{"t":"p","x":"conducilo al conoscimento dell’unico"},
{"t":"p","x":"e vero salvatore, Gesù Cristo;"},
{"t":"p","x":"allontanalo dal castigo del peccato;"},
{"t":"p","x":"concedi a tutti la pace nella verità,"},
{"t":"p","x":"nella giustizia, nella libertà e nell’amore."},
{"t":"p","x":"E fa’ che tutta la Chiesa"},
{"t":"p","x":"possa elevare al Dio delle misericordie"},
{"t":"p","x":"un inno di lode, di gioia e di riconoscenza,"},
{"t":"p","x":"perché grandi cose ha operato il Signore per tuo mezzo,"},
{"t":"p","x":"o clemente, o pia, o dolce Vergine Maria."},
{"t":"p","x":"Amen."}
]},

{"t":"p","x":"Cuore di Maria"},
