<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio · Buscador</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f3f4f7;--panel:#ffffff;--panel-2:#fafbfc;--text:#14171c;--muted:#6b7480;
  --border:#e4e7ec;--border-2:#d3d8e0;--accent:#b3202a;--accent-2:#8c161f;
  --accent-soft:#fdecec;--shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 6px 24px rgba(16,24,40,.12);--radius:12px;
}
[data-theme="dark"]{
  --bg:#0d0f13;--panel:#151920;--panel-2:#1a1f27;--text:#e8ebef;--muted:#98a1ae;
  --border:#252b35;--border-2:#333b47;--accent:#f26a75;--accent-2:#ff97a0;
  --accent-soft:#3a1c20;--shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 8px 28px rgba(0,0,0,.5);
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit}

/* ---------- Cabecera ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.5px}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sub{margin:2px 0 0;font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}

.btn{border:1px solid var(--border-2);background:var(--panel);color:var(--text);
  padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border-2);
  background:var(--panel);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:15px}
.icon-btn:hover{background:var(--panel-2)}

/* ---------- Buscador ---------- */
.search-row{display:flex;gap:10px;align-items:center;padding:12px 18px 0;flex:none}
.search-wrap{position:relative;flex:1;min-width:0}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--muted);pointer-events:none}
#q{width:100%;padding:12px 40px 12px 40px;border-radius:11px;border:1px solid var(--border-2);
  background:var(--panel);color:var(--text);font-size:14px;outline:none;transition:.15s;
  box-shadow:var(--shadow-sm)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q::placeholder{color:var(--muted)}
.clear-q{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;
  background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px}
.clear-q:hover{background:var(--panel-2);color:var(--text)}

/* ---------- Layout ---------- */
.layout{flex:1;display:grid;grid-template-columns:288px minmax(0,1fr);gap:14px;
  padding:14px 18px 18px;min-height:0}
.sidebar{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.sidebar::-webkit-scrollbar,.table-wrap::-webkit-scrollbar{width:9px;height:9px}
.sidebar::-webkit-scrollbar-thumb,.table-wrap::-webkit-scrollbar-thumb{
  background:var(--border-2);border-radius:9px;border:2px solid var(--bg)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow-sm)}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:0 0 9px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card h2 .link{font-size:10.5px;text-transform:none;letter-spacing:0;color:var(--accent);
  background:none;border:0;cursor:pointer;font-weight:600;padding:0}
.card h2 .link:hover{text-decoration:underline}
.card h2 .h2-actions{display:flex;gap:8px;align-items:center}

.mini-input{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:12.5px;outline:none;margin-bottom:8px}
.mini-input:focus{border-color:var(--accent);background:var(--panel)}

.check-list{max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:-3px -4px}
.check-item{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;
  cursor:pointer;font-size:12.5px;line-height:1.3;user-select:none}
.check-item:hover{background:var(--panel-2)}
.check-item input{accent-color:var(--accent);width:14px;height:14px;flex:none;cursor:pointer;margin:0}
.check-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check-item .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;
  background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:0 6px;flex:none}
.check-item.active{background:var(--accent-soft)}
.check-item.active .cnt{background:var(--panel);border-color:var(--accent);color:var(--accent)}

.range-row{display:flex;align-items:center;gap:7px}
.range-row input{width:100%;min-width:0;padding:7px 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-size:12.5px;outline:none;text-align:center}
.range-row input:focus{border-color:var(--accent);background:var(--panel)}
.range-row span{color:var(--muted);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{border:1px solid var(--border);background:var(--panel-2);color:var(--muted);
  border-radius:20px;padding:3px 9px;font-size:11px;cursor:pointer;font-weight:600;transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- Contenido ---------- */
.content{display:flex;flex-direction:column;min-height:0;gap:10px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.count strong{color:var(--text);font-variant-numeric:tabular-nums}
.stat-pill{background:var(--panel);border:1px solid var(--border);border-radius:20px;
  padding:4px 10px;font-size:11.5px;color:var(--muted);box-shadow:var(--shadow-sm)}
.stat-pill b{color:var(--text);font-weight:700}
.spacer{flex:1}

.table-wrap{flex:1;overflow:auto;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);min-height:0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
thead th{position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer;
  white-space:nowrap;user-select:none;font-weight:700}
thead th:hover{color:var(--text)}
thead th.num{text-align:center}
thead th::after{content:"";display:inline-block;width:0;margin-left:4px}
thead th.sorted{color:var(--accent)}
thead th.sorted[data-dir="asc"]::after{content:"▲";font-size:8px}
thead th.sorted[data-dir="desc"]::after{content:"▼";font-size:8px}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
td.date{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
td.date.has{color:var(--text)}

.name-cell{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:32px;height:32px;border-radius:9px;flex:none;background:var(--accent-soft);
  color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:11px;letter-spacing:.3px}
.name-main{font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name-sub{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--panel-2);
  border:1px solid var(--border);font-size:11.5px;color:var(--muted);white-space:nowrap;
  transition:.12s;max-width:230px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.tag:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:32px;margin-bottom:10px;opacity:.4}
.empty b{color:var(--text)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(8,10,14,.55);backdrop-filter:blur(3px)}
.modal-card{position:relative;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;max-width:660px;width:100%;max-height:86vh;overflow:auto;
  box-shadow:var(--shadow-md);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal-close{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;
  border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;
  font-size:14px;display:grid;place-items:center;z-index:2}
.modal-close:hover{background:var(--panel-2);color:var(--text)}

.detail-head{padding:24px 24px 16px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--accent-soft),transparent)}
.detail-head h3{margin:0;font-size:20px;letter-spacing:-.02em;line-height:1.2}
.detail-head .com{margin-top:8px;display:inline-block;padding:4px 11px;border-radius:20px;
  background:var(--panel);border:1px solid var(--border);font-size:12px;color:var(--muted)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-top:0}
.detail-grid .cell{background:var(--panel);padding:14px 24px}
.detail-grid .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);font-weight:700;margin-bottom:4px}
.detail-grid .v{font-size:14px;font-weight:600;line-height:1.35}
.detail-grid .v.muted{color:var(--muted);font-weight:500;font-style:italic}
.detail-foot{padding:16px 24px 22px;display:flex;gap:8px;flex-wrap:wrap;
  border-top:1px solid var(--border);background:var(--panel-2)}
.mini-stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:9px 13px;min-width:120px}
.mini-stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.mini-stat .v{font-size:17px;font-weight:800;margin-top:2px;color:var(--accent)}

/* ---------- Ayuda ---------- */
.help-body{padding:24px}
.help-body h3{margin:0 0 4px;font-size:19px}
.help-body p.lead{margin:0 0 18px;color:var(--muted);font-size:13px}
.help-body h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin:20px 0 9px}
.help-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--border);align-items:baseline}
.help-row:last-child{border-bottom:0}
.help-row code{background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:nowrap;font-weight:600}
.help-row span{color:var(--muted);font-size:12.5px}

/* ---------- Responsive ---------- */
@media (max-width:920px){
  body{height:auto;overflow:visible;display:block}
  .top{padding:10px 12px}
  h1{font-size:13.5px}
  .search-row{padding:10px 12px 0;flex-wrap:wrap}
  .layout{display:block;padding:12px}
  .sidebar{margin-bottom:12px;overflow:visible}
  .check-list{max-height:none}
  .table-wrap{overflow:visible;max-height:none}
  .hide-sm{display:none}
  .detail-grid{grid-template-columns:1fr}
  .stat-pill.opt{display:none}
}
</style>

<body>

<header class="top">
  <div class="brand">
    <div class="logo">CMF</div>
    <div>
      <h1>Directorio de misioneros</h1>
      <p class="sub" id="subtitle">Cargando…</p>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn" id="helpBtn">Sintaxis</button>
    <button class="btn" id="exportBtn">Exportar CSV</button>
    <button class="icon-btn" id="themeBtn" title="Cambiar tema">◐</button>
  </div>
</header>

<div class="search-row">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
      placeholder="Buscar…  nombre, comunidad:Vic, edad:&gt;70, nacimiento:1930-1945, ordenacion:&lt;1970">
    <button class="clear-q" id="clearQ" hidden>✕</button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar">

    <section class="card">
      <h2>
        <span>Comunidad</span>
        <span class="h2-actions">
          <button class="link" id="comAll" title="Marcar todas las comunidades (equivale a no filtrar)">Todas</button>
          <button class="link" id="comNone" title="Desmarcar todas (equivale a no filtrar)">Ninguna</button>
        </span>
      </h2>
      <input class="mini-input" id="comSearch" placeholder="Filtrar comunidades…" autocomplete="off">
      <div class="check-list" id="comList"></div>
    </section>

    <section class="card">
      <h2>Edad <button class="link" id="clearEdad">limpiar</button></h2>
      <div class="range-row">
        <input type="number" id="edadMin" placeholder="mín" min="0" max="120">
        <span>–</span>
        <input type="number" id="edadMax" placeholder="máx" min="0" max="120">
      </div>
      <div class="chips">
        <button class="chip" data-edad="0-39">≤39</button>
        <button class="chip" data-edad="40-59">40–59</button>
        <button class="chip" data-edad="60-79">60–79</button>
        <button class="chip" data-edad="80-200">80+</button>
      </div>
    </section>

    <section class="card">
      <h2>Año de nacimiento <button class="link" id="clearNac">limpiar</button></h2>
      <div class="range-row">
        <input type="number" id="nacMin" placeholder="desde" min="1900" max="2030">
        <span>–</span>
        <input type="number" id="nacMax" placeholder="hasta" min="1900" max="2030">
      </div>
      <div class="chips" id="chipsNac"></div>
    </section>

    <section class="card">
      <h2>Ordenación presbiteral <button class="link" id="clearOrd">limpiar</button></h2>
      <div class="range-row">
        <input type="number" id="ordMin" placeholder="desde" min="1900" max="2030">
        <span>–</span>
        <input type="number" id="ordMax" placeholder="hasta" min="1900" max="2030">
      </div>
      <div class="chips" id="chipsOrd"></div>
    </section>

  </aside>

  <section class="content">
    <div class="toolbar">
      <span class="count" id="count">—</span>
      <span class="stat-pill opt" id="pillEdad">—</span>
      <span class="stat-pill opt" id="pillCom">—</span>
      <span class="spacer"></span>
      <span class="stat-pill" id="pillFiltros">Sin filtros</span>
      <button class="btn" id="clearAll" style="display:none">Limpiar todo</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="nombre">Nombre y apellidos</th>
            <th data-key="edad" class="num">Edad</th>
            <th data-key="nacYear">Nacimiento</th>
            <th data-key="profYear" class="hide-sm">1.ª profesión</th>
            <th data-key="ordYear">Ordenación</th>
            <th data-key="comunidad">Comunidad</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" data-close>✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ==================== UTILIDADES ==================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').replace(/[·•]/g, ' ')
  .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
function yearOf(s){
  const m = String(s ?? '').match(/\b(1[89]\d{2}|20\d{2})\b/);
  return m ? +m[1] : null;
}
function initials(name){
  const parts = String(name).replace(/,/g, ' ').split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
}

/* ==================== CARGA DE DATOS ==================== */
const DATA = (() => {
  const raw = document.getElementById('csvData').textContent.replace(/^\uFEFF/, '');
  const lines = raw.split(/\r?\n/).map(l => l.replace(/\s+$/, '')).filter(l => l.trim() !== '');
  lines.shift();
  return lines.map((line, i) => {
    const c = line.split(';');
    const rec = {
      id: i + 1,
      nombre:      (c[0] || '').trim(),
      edadTexto:   (c[1] || '').trim(),
      nacimiento:  (c[2] || '').trim(),
      onomastica:  (c[3] || '').trim(),
      profesion:   (c[4] || '').trim(),
      ordenacion:  (c[5] || '').trim(),
      comunidad:   (c[6] || '').trim()
    };
    rec.edad     = /^\d+$/.test(rec.edadTexto) ? +rec.edadTexto : null;
    rec.nacYear  = yearOf(rec.nacimiento);
    rec.profYear = yearOf(rec.profesion);
    rec.ordYear  = yearOf(rec.ordenacion);
    rec.tokens = norm([rec.nombre, rec.edadTexto, rec.nacimiento, rec.onomastica,
                       rec.profesion, rec.ordenacion, rec.comunidad].join(' '));
    return rec;
  });
})();

/* ==================== MOTOR DE BÚSQUEDA ==================== */
const FIELD_ALIASES = {
  nombre:      ['nombre','nombres','nom','name','apellido','apellidos','apellido1'],
  comunidad:   ['comunidad','comunidades','com','casa','destino','lugar','zona','sede'],
  edad:        ['edad','edades','anos','año','años'],
  nacimiento:  ['nacimiento','nac','nacido','fnac','ano','año','cumple','nacimientoano'],
  onomastica:  ['onomastica','onom','santo','fiesta','santoral','celebracion'],
  profesion:   ['profesion','prof','primera','1profesion','misionero','profesion1'],
  ordenacion:  ['ordenacion','orden','ord','presbiteral','presbiterado','sacerdocio'],
  todo:        ['todo','todos','any','cualquiera','all']
};
const FIELD_LOOKUP = {};
for (const [key, list] of Object.entries(FIELD_ALIASES))
  list.forEach(a => FIELD_LOOKUP[norm(a)] = key);

const TEXT_FIELDS = new Set(['nombre','comunidad','onomastica','todo']);

function tokenizeQuery(q){
  const out = [];
  let cur = '', inQ = false, quoted = false;
  for (const ch of q){
    if (ch === '"'){ inQ = !inQ; quoted = true; continue; }
    if (/\s/.test(ch) && !inQ){
      if (cur){ out.push({ s: cur, quoted }); cur = ''; quoted = false; }
    } else cur += ch;
  }
  if (cur) out.push({ s: cur, quoted });
  return out;
}

function splitField(tok){
  const m = tok.match(/^([A-Za-zÀ-ÿÑñ]+)\s*(>=|<=|>|<|=|:)\s*(.*)$/);
  if (!m) return null;
  const key = FIELD_LOOKUP[norm(m[1])];
  if (!key) return null;
  return { field: key, op: m[2], value: m[3] };
}

function parseQuery(q){
  const raw = tokenizeQuery(q);
  const out = [];
  for (let i = 0; i < raw.length; i++){
    let t = raw[i], neg = false;
    if (t.s.startsWith('-') && t.s.length > 1 && !t.quoted){
      neg = true; t = { s: t.s.slice(1), quoted: t.quoted };
    }
    let sf = splitField(t.s);
    if (sf && TEXT_FIELDS.has(sf.field) && !t.quoted){
      let j = i + 1;
      while (j < raw.length && !raw[j].quoted && !raw[j].s.startsWith('-') && !splitField(raw[j].s)){
        sf.value += ' ' + raw[j].s; j++;
      }
      i = j - 1;
    }
    if (sf) out.push({ neg, field: sf.field, op: sf.op, value: sf.value.trim() });
    else    out.push({ neg, field: 'todo',    op: ':',  value: t.s.trim() });
  }
  return out.filter(t => t.value !== '');
}

function matchNumber(n, op, value){
  if (n == null) return false;
  const v = String(value).trim();
  const range = v.match(/^(-?\d+)\s*(?:\.\.|-|–|\ba\b)\s*(-?\d+)$/i);
  if (range) return n >= +range[1] && n <= +range[2];
  const cmp = v.match(/^(>=|<=|>|<|=)?\s*(-?\d+)$/);
  if (!cmp) return false;
  const o = cmp[1] || (op === ':' ? '=' : op);
  const num = +cmp[2];
  switch (o){
    case '>':  return n >  num;
    case '>=': return n >= num;
    case '<':  return n <  num;
    case '<=': return n <= num;
    default:   return n === num;
  }
}

function matchesToken(rec, tk){
  let ok;
  if (tk.field === 'todo'){
    ok = rec.tokens.includes(norm(tk.value));
  } else if (TEXT_FIELDS.has(tk.field)){
    const hay = norm(rec[tk.field]);
    ok = tk.value.split('|').map(norm).filter(Boolean).some(v => hay.includes(v));
  } else {
    ok = matchNumber(rec[tk.field], tk.op, tk.value);
  }
  return tk.neg ? !ok : ok;
}

/* ==================== ESTADO ==================== */
const state = {
  query: '',
  tokens: [],
  comunidades: new Set(),   // VACÍO = sin filtro
  edadMin: null, edadMax: null,
  nacMin: null, nacMax: null,
  ordMin: null, ordMax: null,
  sortKey: 'nombre', sortDir: 1,
  comFilter: ''
};

const inRange = (v, min, max) => {
  if (min == null && max == null) return true;
  if (v == null) return false;
  if (min != null && v < min) return false;
  if (max != null && v > max) return false;
  return true;
};

function filterAll(opts = {}){
  const skipCom = !!opts.skipComunidad;
  return DATA.filter(rec => {
    for (const tk of state.tokens) if (!matchesToken(rec, tk)) return false;
    if (!skipCom && state.comunidades.size && !state.comunidades.has(rec.comunidad)) return false;
    if (!inRange(rec.edad,    state.edadMin, state.edadMax)) return false;
    if (!inRange(rec.nacYear, state.nacMin,  state.nacMax))  return false;
    if (!inRange(rec.ordYear, state.ordMin,  state.ordMax))  return false;
    return true;
  });
}

const collator = new Intl.Collator('es', { sensitivity: 'base' });

function sortRows(rows){
  const k = state.sortKey, d = state.sortDir;
  return [...rows].sort((a, b) => {
    const va = a[k], vb = b[k];
    if (k === 'nombre' || k === 'comunidad') return collator.compare(va, vb) * d;
    if (va == null && vb == null) return collator.compare(a.nombre, b.nombre);
    if (va == null) return 1;
    if (vb == null) return -1;
    return (va - vb) * d || collator.compare(a.nombre, b.nombre);
  });
}

/* ==================== RENDER ==================== */
const $ = id => document.getElementById(id);
const tbody = $('tbody');

function render(){
  state.tokens = parseQuery(state.query);
  const rows = sortRows(filterAll());
  renderTable(rows);
  renderStats(rows);
  renderComunidades();
  renderHead();
}

function renderTable(rows){
  if (!rows.length){
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty">
      <div class="big">🔍</div>
      <b>Sin resultados</b><br>Prueba a cambiar o limpiar los filtros.
    </div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr data-id="${r.id}">
      <td>
        <div class="name-cell">
          <div class="avatar">${esc(initials(r.nombre))}</div>
          <div style="min-width:0">
            <div class="name-main">${esc(r.nombre)}</div>
            <div class="name-sub">${esc(r.onomastica)}</div>
          </div>
        </div>
      </td>
      <td class="num">${r.edad ?? '—'}</td>
      <td class="date ${r.nacYear ? 'has' : ''}">${esc(r.nacimiento)}</td>
      <td class="date ${r.profYear ? 'has' : ''} hide-sm">${esc(r.profesion)}</td>
      <td class="date ${r.ordYear ? 'has' : ''}">${esc(r.ordenacion)}</td>
      <td><span class="tag" data-com="${esc(r.comunidad)}" title="${esc(r.comunidad)}">${esc(r.comunidad)}</span></td>
    </tr>`).join('');
}

function renderHead(){
  document.querySelectorAll('thead th').forEach(th => {
    const k = th.dataset.key;
    th.classList.toggle('sorted', state.sortKey === k);
    th.dataset.dir = state.sortKey === k ? (state.sortDir > 0 ? 'asc' : 'desc') : '';
  });
}

function renderStats(rows){
  const edades = rows.map(r => r.edad).filter(v => v != null);
  const media = edades.length ? Math.round(edades.reduce((a, b) => a + b, 0) / edades.length) : null;
  const rango = edades.length ? `${Math.min(...edades)}–${Math.max(...edades)}` : '—';
  const coms = new Set(rows.map(r => r.comunidad)).size;

  $('count').innerHTML = `<strong>${rows.length}</strong> de ${DATA.length} registros`;
  $('pillEdad').innerHTML = `Edad media <b>${media ?? '—'}</b> · rango <b>${rango}</b>`;
  $('pillCom').innerHTML = `Comunidades <b>${coms}</b>`;

  let n = state.tokens.length;
  n += state.comunidades.size ? 1 : 0;
  n += (state.edadMin != null || state.edadMax != null) ? 1 : 0;
  n += (state.nacMin != null || state.nacMax != null) ? 1 : 0;
  n += (state.ordMin != null || state.ordMax != null) ? 1 : 0;
  $('pillFiltros').textContent = n ? `${n} filtro${n > 1 ? 's' : ''} activo${n > 1 ? 's' : ''}` : 'Sin filtros';
  $('clearAll').style.display = n ? '' : 'none';
}

function renderComunidades(){
  const base = filterAll({ skipComunidad: true });
  const counts = new Map();
  base.forEach(r => counts.set(r.comunidad, (counts.get(r.comunidad) || 0) + 1));
  // Conservar seleccionadas aunque no aparezcan en el filtro base
  state.comunidades.forEach(c => { if (!counts.has(c)) counts.set(c, 0); });

  let list = [...counts.entries()].sort((a, b) => b[1] - a[1] || collator.compare(a[0], b[0]));
  const f = norm(state.comFilter);
  if (f) list = list.filter(([c]) => norm(c).includes(f));

  $('comList').innerHTML = list.length ? list.map(([c, n]) => `
    <label class="check-item ${state.comunidades.has(c) ? 'active' : ''}">
      <input type="checkbox" data-com="${esc(c)}" ${state.comunidades.has(c) ? 'checked' : ''}>
      <span class="lbl" title="${esc(c)}">${esc(c)}</span>
      <span class="cnt">${n}</span>
    </label>`).join('') : `<div style="padding:10px;font-size:12px;color:var(--muted)">Sin coincidencias</div>`;
}

function buildDecadeChips(container, key){
  const counts = {};
  DATA.forEach(r => {
    const v = r[key];
    if (v == null) return;
    const d = Math.floor(v / 10) * 10;
    counts[d] = (counts[d] || 0) + 1;
  });
  const ds = Object.keys(counts).map(Number).sort((a, b) => a - b);
  container.innerHTML = ds.map(d =>
    `<button class="chip" data-dec="${d}" data-key="${key}">${d}s <span style="opacity:.6">${counts[d]}</span></button>`
  ).join('');
}

/* ==================== MODAL ==================== */
const modal = $('modal');
const modalBody = $('modalBody');

function openModal(html){
  modalBody.innerHTML = html;
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  modal.hidden = true;
  modalBody.innerHTML = '';
  document.body.style.overflow = '';
}

function showDetail(rec){
  const edadOrd = (rec.nacYear && rec.ordYear) ? rec.ordYear - rec.nacYear : null;
  const aniosOrd = rec.ordYear ? 2026 - rec.ordYear : null;

  openModal(`
    <div class="detail-head">
      <h3>${esc(rec.nombre)}</h3>
      <div class="com">${esc(rec.comunidad)}</div>
    </div>
    <div class="detail-grid">
      <div class="cell"><div class="k">Edad</div><div class="v ${rec.edad == null ? 'muted' : ''}">${rec.edad ?? '—'}</div></div>
      <div class="cell"><div class="k">Fecha de nacimiento</div><div class="v ${rec.nacYear ? '' : 'muted'}">${esc(rec.nacimiento)}</div></div>
      <div class="cell" style="grid-column:1/-1"><div class="k">Onomástica</div><div class="v ${rec.onomastica ? '' : 'muted'}">${esc(rec.onomastica)}</div></div>
      <div class="cell"><div class="k">1.ª profesión</div><div class="v ${rec.profYear ? '' : 'muted'}">${esc(rec.profesion)}</div></div>
      <div class="cell"><div class="k">Ordenación presbiteral</div><div class="v ${rec.ordYear ? '' : 'muted'}">${esc(rec.ordenacion)}</div></div>
      <div class="cell" style="grid-column:1/-1"><div class="k">Comunidad</div><div class="v">${esc(rec.comunidad)}</div></div>
    </div>
    <div class="detail-foot">
      ${edadOrd != null ? `<div class="mini-stat"><div class="k">Edad al ordenarse</div><div class="v">${edadOrd} años</div></div>` : ''}
      ${aniosOrd != null ? `<div class="mini-stat"><div class="k">Años de ministerio</div><div class="v">${aniosOrd}</div></div>` : ''}
      ${aniosProf != null ? `<div class="mini-stat"><div class="k">Años desde 1.ª profesión</div><div class="v">${aniosProf}</div></div>` : ''}

}

      <p class="lead">Escribe palabras sueltas (busca en todos los campos) o combina campos con filtros.

      <div class="help-row"><code>onomastica:</code><span>onomástica / santo · <code>onomastica:jordi</code></span></div>

/* ==================== EXPORTAR ==================== */
function exportCSV(){
  const rows = sortRows(filterAll());
  const head = ['Nombre y apellidos','Edad','Fecha de nacimiento','Onomástica','1.ª profesión','Ordenación presbiteral','Comunidad'];
  const csv = [head, ...rows.map(r => [r.nombre, r.edadTexto, r.nacimiento, r.onomastica, r.profesion, r.ordenacion, r.comunidad])]
    .map(row => row.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';'))
    .join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `directorio_filtrado_${rows.length}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ==================== EVENTOS ==================== */
$('q').addEventListener('input', e => {
  state.query = e.target.value;
  $('clearQ').hidden = !e.target.value;
  render();
});

$('clearQ').addEventListener('click', () => {
  state.query = '';
  $('q').value = '';
  $('clearQ').hidden = true;
  render();
  $('q').focus();
});

$('comSearch').addEventListener('input', e => {
  state.comFilter = e.target.value;
  renderComunidades();
});

$('comList').addEventListener('change', e => {
  const cb = e.target.closest('input[data-com]');
  if (!cb) return;
  const com = cb.dataset.com;
  if (cb.checked) state.comunidades.add(com); else state.comunidades.delete(com);
  render();
});

/* *** NUEVO: botones Todas / Ninguna *** */
$('comAll').addEventListener('click', () => {
  // Añade todas las comunidades del directorio → equivale a no filtrar
  DATA.forEach(r => { if (r.comunidad) state.comunidades.add(r.comunidad); });
  render();
});
$('comNone').addEventListener('click', () => {
  // Vacía la selección → equivale a no filtrar, deja el panel limpio
  state.comunidades.clear();
  render();
});

function numVal(el){ const v = el.value.trim(); return v === '' ? null : Number(v); }

['edadMin','edadMax','nacMin','nacMax','ordMin','ordMax'].forEach(id => {
  $(id).addEventListener('input', () => {
    state.edadMin = numVal($('edadMin')); state.edadMax = numVal($('edadMax'));
    state.nacMin  = numVal($('nacMin'));  state.nacMax  = numVal($('nacMax'));
    state.ordMin  = numVal($('ordMin'));  state.ordMax  = numVal($('ordMax'));
    render();
  });
});

$('clearEdad').addEventListener('click', () => {
  $('edadMin').value = ''; $('edadMax').value = '';
  state.edadMin = state.edadMax = null; render();
});
$('clearNac').addEventListener('click', () => {
  $('nacMin').value = ''; $('nacMax').value = '';
  state.nacMin = state.nacMax = null; render();
});
$('clearOrd').addEventListener('click', () => {
  $('ordMin').value = ''; $('ordMax').value = '';
  state.ordMin = state.ordMax = null; render();
});

document.querySelectorAll('.chip[data-edad]').forEach(btn => {
  btn.addEventListener('click', () => {
    const [a, b] = btn.dataset.edad.split('-').map(Number);
    $('edadMin').value = a; $('edadMax').value = b;
    state.edadMin = a; state.edadMax = b;
    render();
  });
});

document.addEventListener('click', e => {
  const chip = e.target.closest('.chip[data-dec]');
  if (!chip) return;
  const d = +chip.dataset.dec;
  const key = chip.dataset.key;
  const minId = key === 'nacYear' ? 'nacMin' : 'ordMin';
  const maxId = key === 'nacYear' ? 'nacMax' : 'ordMax';
  $(minId).value = d; $(maxId).value = d + 9;
  if (key === 'nacYear'){ state.nacMin = d; state.nacMax = d + 9; }
  else { state.ordMin = d; state.ordMax = d + 9; }
  render();
});

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.key;
    if (state.sortKey === k) state.sortDir *= -1;
    else { state.sortKey = k; state.sortDir = 1; }
    render();
  });
});

tbody.addEventListener('click', e => {
  const tag = e.target.closest('.tag[data-com]');
  if (tag){
    e.stopPropagation();
    const com = tag.dataset.com;
    if (state.comunidades.has(com)) state.comunidades.delete(com);
    else state.comunidades.add(com);
    render();
    return;
  }
  const tr = e.target.closest('tr[data-id]');
  if (!tr) return;
  const rec = DATA.find(r => r.id === +tr.dataset.id);
  if (rec) showDetail(rec);
});

$('clearAll').addEventListener('click', () => {
  state.query = ''; $('q').value = ''; $('clearQ').hidden = true;
  state.comunidades.clear(); state.comFilter = ''; $('comSearch').value = '';
  state.edadMin = state.edadMax = state.nacMin = state.nacMax = state.ordMin = state.ordMax = null;
  ['edadMin','edadMax','nacMin','nacMax','ordMin','ordMax'].forEach(id => $(id).value = '');
  render();
});

$('exportBtn').addEventListener('click', exportCSV);
$('helpBtn').addEventListener('click', showHelp);

$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('dir-theme', next); } catch(e){}
});

modal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!modal.hidden) closeModal();
    else if (document.activeElement === $('q') && $('q').value){
      $('q').value = ''; state.query = ''; $('clearQ').hidden = true; render();
    }
  }
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    e.preventDefault(); $('q').focus();
  }
});

/* ==================== INICIO ==================== */
(function init(){
  try {
    const saved = localStorage.getItem('dir-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.setAttribute('data-theme', 'dark');
  } catch(e){}

  const coms = new Set(DATA.map(r => r.comunidad)).size;
  $('subtitle').textContent = `${DATA.length} registros · ${coms} comunidades · snapshot 13 oct 2026`;

  buildDecadeChips($('chipsNac'), 'nacYear');
  buildDecadeChips($('chipsOrd'), 'ordYear');
  render();
})();
</script>
