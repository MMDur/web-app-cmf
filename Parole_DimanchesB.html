1", "text": "Pére Saint... sanctifie-les par la vérité... Pour eux, je me sanctifie moi-méme... (Pére sacré...) consacre-les par la vérité... Pour eux, je me consacre moi-méme...", "page": 123, "kind": "h"}, {"id": "r22p2", "text": "Entre le dernier repas de la Céne, ot Jésus a « consacré» le pain et le vin en son Corps et son Sang, leur disant de « manger ces choses saintes»... et !'agonie de Gethsémani, ou Jésus va se consacrer, se vouer totalement, a la volonté du Pére... Jésus prie pour ses disciples.", "page": 123, "kind": "p"}, {"id": "r22p3", "text": "Jésus, dans le passage que nous lisions dimanche dernier, avait demandé que «l'amour» du Pére, passant par Lui, le Fils, remplisse les disciples et les fasse aimer a leur tour «comme Lui». Maintenant, Jésus demande au Pére « Saint» que ses disciples participent a la Sainteté du Pére, dont Lui-méme est tout pénétré.", "page": 123, "kind": "p"}, {"id": "r22p4", "text": "En grec, il y a exactement le méme mot «agios» (saint) pour qualifier le Pére, les disciples, et Jésus: « Pére saint... rends-les saints... comme je suis saint...»", "page": 123, "kind": "p"}, {"id": "r22p5", "text": "La «sainteté» de Jésus, sa « consécration», c’est son indéfectible obéissance au Pére. En Jésus, il n’y a pas un atome de son étre qui ne soit pas totalement consacré au Pére, voué au Pére. Quand nous chantons le Sanctus, quand nous chantons que Dieu est «trois fois Saint», nous voulons dire que Dieu est le « tout-autre», le « séparé de tout», «le transcendant». Une comparaison peut, sans doute, nous introduire a cette idée de transcendance. Les savants calculent, aujourd’hui, que P'univers a commencé par des températures supérieures a 100.000 milliards de milliards de milliards de degrés K. Or, personne n’a actuellement la moindre idée de ce, qui peut se produire dans la matiére, a ces températures-la! De méme, personne ne peut se faire la moindre idée de ce qu’est réellement. Dieu: quand nous essayons de l’aborder, tout brile, tout flambe... Dieu est saint, Dieu est tout-autre !", "page": 123, "kind": "p"}, {"id": "r22p6", "text": "Garde mes disciples dans la fidélité 4 ton nom que tu m’as donné en partage... Quand j’étais avec eux, je les gardais dans la fidélité 4 ton nom. J’ai veillé sur eux et aucun ne sest perdu, sauf celui qui s’en va a sa perte...", "page": 124, "kind": "h"}, {"id": "r22p7", "text": "Jésus répéte trois fois ce mot « garder», dans cette page d’évangile. Paradoxe de la situation des croyants: ils ont été appelés par Jésus, et Jésus s’en va! Jésus a conscience de la difficulté dans laquelle il met ses amis en disparaissant. « Garder » ne signifie pas préserver, mettre a l’abri, figer au congélateur : Jésus ne demande pas au Pére de mettre ses disciples en conserve, mais de les affermir pour qu’ils puissent affronter le monde en restant « fidéles».", "page": 124, "kind": "p"}, {"id": "r22p8", "text": "Pour quills soient un comme nous-mémes.", "page": 124, "kind": "h"}, {"id": "r22p9", "text": "Nous ne contemplerons jamais assez le mystére interne de Dieu, mystére trinitaire. Trois personnes! Mais trois qui ne font qu’un, dans amour. Dieu n’existe qu’a plusieurs, mais dans une transparence totale. Le réve de homme, c’est «a plusieurs ne faire qu’un». Réve de l’amitié. Réve du couple. Réve de la fusion. L’-humanité, créée a limage de Dieu, nest qu'une infime étincelle de cette « température fantastique» qui brile au coeur de Dieu, fusionnant dans lunité le Pére, le Fils et Esprit.", "page": 124, "kind": "p"}, {"id": "r22p10", "text": "Or, cette unité inaccessible, Jésus l’a vécue tout au long de sa vie terrestre. «Lorsque jétais avec eux, je les gardais dans Ton nom, que Tu m’as donné.» Toute action de Jésus a été de les amener au seul lieu ot ’Amour est totalement vrai, totalement saint... c’est-a-dire sans la moindre parcelle de non-amour.", "page": 124, "kind": "p"}, {"id": "r22p11", "text": "Réaliser un peu d’amour, dans nos relations humaines, dans notre travail professionnel, dans notre vie de famille, dans nos engagements divers au service des autres, « nous aimer les uns les autres, selon son commandement»... c’est réaliser ici-bas un peu de la « température fantastique» qui est le secret de la Trinité.", "page": 124, "kind": "p"}, {"id": "r22p12", "text": "Maintenant que je viens 4a toi, je parle ainsi, en ce monde, pour qu’ils aient en eux ma joie, et qu’ils en soient combleés.", "page": 125, "kind": "h"}, {"id": "r22p13", "text": "La joie de Jésus.", "page": 125, "kind": "p"}, {"id": "r22p14", "text": "Jessaie de la deviner, bréilant en lui. C’est la joie de l'amour. C’est la joie d’étre aimé du Pére et d’aimer le Pére. Cest la joie de Esprit Saint. Joie paradoxale! N’oublions pas que Jésus prononce ces mots au moment ou il se dirige librement vers sa mort: mais il meurt d’amour du Pére et des fréres... comment pourrait-il en étre triste?", "page": 125, "kind": "p"}, {"id": "r22p15", "text": "La joie chrétienne.", "page": 125, "kind": "p"}, {"id": "r22p16", "text": "Est-ce bien vrai? Comment se traduit-elle?", "page": 125, "kind": "p"}, {"id": "r22p17", "text": "Je leur ai fait don de ta parole.", "page": 125, "kind": "h"}, {"id": "r22p18", "text": "Jésus prie toujours. C’est sa priére qui continue. II est tourné vers le Pére.", "page": 125, "kind": "p"}, {"id": "r22p19", "text": "Jésus a été la «révélation» du Pére, sa «parole», sa « déclaration» d’amour aux hommes. En Jésus, le toutautre s’est fait le tout-proche... le transcendant s'est fait le confident et lami... ’inaccessible flamme qui brilerait tout sest fait douce présence...", "page": 125, "kind": "p"}, {"id": "r22p20", "text": "Et le monde les a pris en haine parce quiils ne sont pas du monde, de méme que moi je ne suis pas du monde...", "page": 125, "kind": "h"}, {"id": "r22p21", "text": "De méme que Tu m’as envoyé dans le monde, moi aussi je les ai envoyés dans le monde.", "page": 125, "kind": "h"}, {"id": "r22p22", "text": "Telle est la tension paradoxale dans laquelle Jésus a introduit ses disciples: étre «dans le monde», sans étre «du monde».", "page": 125, "kind": "p"}, {"id": "r22p23", "text": "Dans ces deux phrases, le mot «monde» a deux sens différents :", "page": 125, "kind": "p"}, {"id": "r22p24", "text": "En un premier sens, le monde, c’est le lieu ot vivent les hommes. De ce point de vue, les disciples de Jésus ne sont pas «a part». Ils sont comme tous les autres hommes, soumis aux difficultés communes, et aux joies habituelles. Mais, dans un deuxiéme sens, le monde, c’est la puissance hostile 4 Dieu, c’est tout ce qui dans ’homme rejette Dieu! Tout ce qui, dans homme, est non-amour!", "page": 125, "kind": "p"}, {"id": "r22p25", "text": "Je ne demande pas que Tu les retires du monde, mais que Tu les gardes du « Mauvais».", "page": 126, "kind": "h"}, {"id": "r22p26", "text": "Ne pas étre «hors du monde»! Etre «inséré» dans le monde! Jésus souhaite que ses disciples ne soient pas «retirés du monde»!", "page": 126, "kind": "p"}, {"id": "r22p27", "text": "Le Concile Vatican II a beaucoup insisté sur cette exigence de Jésus: «Le propre de l’état des laics chrétiens est de mener leur vie au milieu du monde et des affaires profanes. Ils sont appelés par Dieu a exercer leur apostolat dans le monde a la maniére d’un « ferment», grace a la vigueur de leur esprit chrétien. »", "page": 126, "kind": "p"}, {"id": "r22p28", "text": "Quelles sont mes présences au monde? mes lieux d’engagements ?", "page": 126, "kind": "p"}, {"id": "r22p29", "text": "Jésus est « parti»... ce sont ses disciples qui continuent son ceuvre. Et moi? Qu’est-ce que je fais dans le monde?", "page": 126, "kind": "p"}, {"id": "r22p30", "text": "Un grand combat se déroule dans le monde: «amour» contre «non-amour»... Dieu contre le mal... Suis-je dans le combat ? Saint Jean, a la suite de Jésus, utilise ici un nom personnel, le Mauvais! La solution de la question «comment étre dans le monde, sans étre du monde», elle est la: il ne s’agit pas de se retirer du monde qui est massivement «sans-dieu»... il s'agit d’étre « pour Dieu», dans ce monde qui est contre.", "page": 126, "kind": "p"}, {"id": "r22p31", "text": "Consacre-les...", "page": 126, "kind": "h"}, {"id": "r22p32", "text": "Le mot grec, nous l’avons vu, est le méme que « sanctifieles»: le Pere Saint communique quelque chose de sa sainteté aux croyants. Saint Jean, dans son évangile, n’a pas raconté la consécration du pain et du vin au cours de la Céne, mais, immédiatement aprés, il parle d’une « consécration» des disciples.", "page": 126, "kind": "p"}, {"id": "r22p33", "text": "Dans la vérité... Ta parole est vérité.", "page": 126, "kind": "h"}, {"id": "r22p34", "text": "Pour eux, je me consacre moi-méme, afin quiils soient eux aussi consacrés par la vérité.", "page": 126, "kind": "h"}, {"id": "r22p35", "text": "Le chrétien, le disciple de Jésus, sil est un «homme» comme tout le monde... est aussi un «saint», un étre qui participe a la flamme incandescente de Dieu... Jésus ne cesse pas de faire une sorte d’assimilation permanente entre Lui et ses disciples. Et c’est la « vérité », dit Jésus, qui fait cela en eux. Le mot grec traduit par « parole», c’est le mot «logos», «verbe». Jésus est la Parole du Pére aux hommes. Qui écoute cette Parole devient «saint», c’est-adire participe a lincandescence méme de Dieu, a Amour qui unit les trois personnes entre elles.", "page": 126, "kind": "p"}, {"id": "r22p36", "text": "Combien de chrétiens, hélas, ont peu conscience de cette dignité extraordinaire! Moi-méme, ai-je conscience d’étre en communion, en participation avec le Dieu saint ? Questce que cela changerait dans ma vie, si j'y pensais davantage? Quel désir de perfection m’habite ? Quelle faim d’absolu? Est-ce que je me laisse travailler de lintérieur par lintensité de la « température» divine qui veut transformer mon métal plein de gangue en un or pur... en un amour sans aucun mélange de non-amour.", "page": 127, "kind": "p"}, {"id": "r22p37", "text": "La «consécration» de Jésus au Pére, a Amour, ce fut Pheure de sa croix. «A ceci nous avons connu l'amour: celui-la a donné sa vie pour nous, et nous devons, nous aussi, donner notre vie pour nos fréres» (I Jean 3/16). Ma vie est-elle « consacrée » ?", "page": 127, "kind": "p"}, {"id": "r22p38", "text": "De méme que Tu m’as envoyé dans le monde, moi", "page": 127, "kind": "h"}, {"id": "r22p39", "text": "aussi je les ai envoyés dans le monde.", "page": 127, "kind": "p"}, {"id": "r22p40", "text": "Etre chrétien, c’est avoir regu la communication du dessein de Dieu, c’est avoir recu la Parole de Jésus qui révéle le Pére, c’est donc « étre dans la vérité de Dieu». Mais, étant imprégné de ce projet divin qui est de tout transformer en Lui-méme, qui est Amour, c’est aussi « étre envoyé dans le monde» pour y faire ce que Jésus a fait : communiquer ce projet a d'autres, a notre tour. Seigneur Jésus, que le Pére exauce ta priére, et fasse en nous ce que tu dis.", "page": 127, "kind": "p"}]}, {"id": 23, "title": "Pentecôte", "group": "Pascua", "page": 128, "ref": "Jean 20/19.23", "paragraphs": [{"id": "r23p1", "text": "Le soir du premier jour de la semaine...", "page": 128, "kind": "h"}, {"id": "r23p2", "text": "Dans lévangile selon saint Jean, c’est le soir méme de Paques, dans la foulée méme de la résurrection, que IEsprit Saint est donné aux apdtres, et que l’Eglise nait, du souffle méme de Jésus. Dans ce récit, comparativement au texte de Luc dans les Actes des Apétres, Jésus semble tenir plus de place que Esprit Saint. Saint Jean nous a habitués 4 trouver dans son évangile une grande densité théologique, sous couvert de symboles bibliques.", "page": 128, "kind": "p"}, {"id": "r23p3", "text": "«Le premier jour de la semaine»! Un nouveau monde commence, une création neuve. C’est une nouvelle Genése. Dieu a repris «homme» en mains, et l’a re-pétri dans une «glaise» toute nouvelle.", "page": 128, "kind": "p"}, {"id": "r23p4", "text": "Et les chrétiens, depuis ce jour-la, n’ont pas cessé de se réunir, de « premier jour de la semaine», en « premier jour de la semaine»... de dimanche en dimanche. L’Eglise nait de ce rassemblement rythmé au cours des temps, aujourdhui encore. Il en faut des dimanches, pour faire un chrétien, progressivement... au rythme des « venues» de Jésus. Nous sommes loin de la terne « obligation de la messe du dimanche» avec son aspect trop juridique: il s’agit d’une nécessité vitale! «Il est obligatoire de respirer, de reprendre son souffle!» Et pas seulement une fois par an.", "page": 128, "kind": "p"}, {"id": "r23p5", "text": "Les disciples avaient verrouillé les portes du lieu ou ils étaient, car ils avaient peur...", "page": 128, "kind": "h"}, {"id": "r23p6", "text": "La peur! Notre monde est toujours construit sur la peur. La dissuasion atomique, c’est «faire peur».", "page": 128, "kind": "p"}, {"id": "r23p7", "text": "Avant daller plus loin dans ma priére, il me faut regarder en face, dans ma propre vie, quelles sont mes peurs. Le lieu du «surgissement pascal», c’est ce lieu ot les disciples s’enfermaient, se protégeaient, ce lieu de leur peur.", "page": 128, "kind": "p"}, {"id": "r23p8", "text": "Le «lieu» ot PEsprit de Dieu peut surgir, dans ma vie, c’est ce point de blessure intérieure, la ot il y a vulnérabilité, risque, souffrance.", "page": 129, "kind": "p"}, {"id": "r23p9", "text": "Quelle est ma situation « verrouillée», a moi?", "page": 129, "kind": "p"}, {"id": "r23p10", "text": "Quelle est la circonstance, le péché, langoisse, qui m’enferment ?", "page": 129, "kind": "p"}, {"id": "r23p11", "text": "Saint Paul avait conscience de cette réalité, comme d’une sorte de mort: «La mort est a oeuvre en nous... Mais nous ne perdons pas courage, car, méme si, en nous, homme extérieur va vers sa ruine, homme intérieur se renouvelle de jour en jour... Car nos détresses d’un moment sont légéres par rapport au poids extraordinaire de gloire éternelle qu’elles nous préparent» (2 Corinthiens 4/12.16.17).", "page": 129, "kind": "p"}, {"id": "r23p12", "text": "Jésus vint, et il était la au milieu d’eux.", "page": 129, "kind": "h"}, {"id": "r23p13", "text": "Ce nest pas par hasard que Jean fait un lien entre la résurrection de Jésus et le don de Esprit. Nous affirmons, dans notre Credo, que lEsprit est «Seigneur, et qu’il donne la vie». Ce don de la vie, c’est d’abord Jésus qui le recoit : en arrachant Jésus au pouvoir de la mort, |Esprit de Dieu vient de réussir son coup de maitre!", "page": 129, "kind": "p"}, {"id": "r23p14", "text": "Dans notre étre créé, et donc non-dieu, marqué de finitude, notre «esprit» et notre «corps» sont liés, pour le meilleur et pour le pire. Mais, si puissant qu'il soit, esprit en nous connait une défaillance derniére, qui ne lui permet pas de retenir son corps: « humain»’ signifie aussi « mortel » ! Mais devant cet univers créé, et donc mortel, le Christ, Lui, dispose non seulement des ressources finies du seul esprit humain, mais des ressources sans limites qui sont propres a Dieu. Le Christ a en lui un Esprit tout autre que esprit de [homme qui s’en laisse imposer par la mort: il dispose souverainement de l’Esprit Saint qui est Seigneur t qui donne la vie!", "page": 129, "kind": "p"}, {"id": "r23p15", "text": "‘Jésus brise toutes les barriéres. Son irruption soudaine parmi ses disciples enfermés signifie quil ne peut étre retenu par aucun obstacle pour « se tenir parmi les siens». Il a recu, ce matin, un «souffle» singuliérement nouveau, qui fait de Lui un «corps spirituel», un corps animé de la Vie de lEsprit Saint (I Corinthiens 15/44). Avant de le donner, immédiatement, 4 ses amis, Jésus, «ressuscité et exalté par la puissance de Dieu son Pére, a recu de lui Esprit Saint» (Actes 2/33). C’est saint Pierre qui prononce cette révélation étonnante, le jour de la Pentecdte.", "page": 129, "kind": "p"}, {"id": "r23p16", "text": "Oui, la résurrection est une ceuvre de Esprit.", "page": 130, "kind": "p"}, {"id": "r23p17", "text": "Il leur montra ses mains et son cété.", "page": 130, "kind": "h"}, {"id": "r23p18", "text": "Tu cherches le lieu du surgissement pascal? Tu trouves difficile de déceler la présence de lEsprit? |", "page": 130, "kind": "p"}, {"id": "r23p19", "text": "Alors essaie de découvrir aujourd’hui ot sont les stigmates, les blessures... dans ton coeur, ta vie, comme dans le monde ou dans lEglise.", "page": 130, "kind": "p"}, {"id": "r23p20", "text": "«La paix soit avec vous!»)... Ils furent remplis de joie en voyant le Seigneur... :", "page": 130, "kind": "h"}, {"id": "r23p21", "text": "De la peur a la joie, en passant par la paix...", "page": 130, "kind": "p"}, {"id": "r23p22", "text": "« De méme que le Pére m’a envoyé, moi aussi je vous envoie.", "page": 130, "kind": "h"}, {"id": "r23p23", "text": "Ils étaient « enfermés», les voici « envoyés»...", "page": 130, "kind": "p"}, {"id": "r23p24", "text": "L’envoi en mission n’est absolument pas considéré sous langle d’une organisation quelconque: ce n’est pas une « entreprise» publicitaire bien montée... et Jésus n’envisage absolument pas les moyens pratiques que l’Eglise devra trouver pour étre «missionnaire»... Une seule chose compte, pour Lui: lorigine de cette mission... et c’est «le lien intime qui unit Jésus au Pére». Au fond, il n’y a qu’une mission: celle du Pére, qui est celle de Jésus, qui devient celle de l’Ealise.", "page": 130, "kind": "p"}, {"id": "r23p25", "text": "Ayant ainsi parlé, il répandit sur eux son souffle...", "page": 130, "kind": "h"}, {"id": "r23p26", "text": "Jean utilise, ici, un langage biblique, faisant allusion, en particulier 4 deux textes célébres:", "page": 130, "kind": "p"}, {"id": "r23p27", "text": "— la premiére création: « Dieu souffla dans ses narines un souffle de vie» (Genése 2/7) ;", "page": 130, "kind": "p"}, {"id": "r23p28", "text": "— la derniére création: « Souffle sur ces ossements desséchés, et ils revivront» (Ezékiel 37/9).", "page": 130, "kind": "p"}, {"id": "r23p29", "text": "Il y avait eu la création du passé, la premiére naissance de la vie au début des temps... Il y aura la création de l'avenir, la résurrection finale, au dernier jour... Mais il y a la création toujours actuelle: le «Souffle» de Dieu est actuellement a Poeuvre. Je crois en lEsprit Saint qui est Seigneur et qui donne la vie!", "page": 130, "kind": "p"}, {"id": "r23p30", "text": "Le souffle vital! Ne trouvez-vous pas tout simplement génial de décrire la Présence de Dieu et son Action dans le monde par ce qui est le plus commun et le plus fondamental: respirer! Tous les vivants, du microbe jusqu’aux grands fauves, respirent le méme oxygéne, offert a tous autour de notre planéte... et je respire moi-méme Ihaleine de tous les vivants. Image saisissante du Dieu unique qui nous fait tous vivre! Jésus déja, a Nicodéme, avait pris cette méme image simple du «vent» qui «souffle ot il veut», et qui fait vivre! (Jean 3/6.8).", "page": 131, "kind": "p"}, {"id": "r23p31", "text": "« Recevez...»»", "page": 131, "kind": "h"}, {"id": "r23p32", "text": "Je prie sur ce seul mot. La mentalité moderne n’aime pas « recevoir»: on refuse aujourd’hui de dépendre d’un autre. Cest le péché par excellence: la prétention d’étre « comme des dieux». Mais cela n’est pas au pouvoir de l'homme»! Quill le veuille ou ne le veuille pas, il est un étre dépendant, totalement dépendant: pour vivre, il doit recevoir la vie... Je recois la vie de mes parents. Je recois la vie de lair que je respire. Je recois la vie du soleil qui me donne ma nourriture. Je dépends de mille choses, de mille personnes, de multiples conditions...", "page": 131, "kind": "p"}, {"id": "r23p33", "text": "« Prenez, mangez, ceci est mon corps...» Il faut le « recevoir» ce Corps!", "page": 131, "kind": "p"}, {"id": "r23p34", "text": "« Recevez lEsprit...» Il faut le « recevoir» cet Esprit!", "page": 131, "kind": "p"}, {"id": "r23p35", "text": "Donne-nous, Seigneur, d’accueillir, d’accepter de recevoir le don que tu offres.", "page": 131, "kind": "p"}, {"id": "r23p36", "text": "L Esprit Saint...", "page": 131, "kind": "h"}, {"id": "r23p37", "text": "L’humanité doit recevoir la communauté d’Esprit qui existe entre le Pére et le Fils. A plusieurs ne faire qu'un! Nous découvrons ainsi que, dans la mission de l’Eglise, il n’y a pas seulement le Pére et le Fils qu’il a envoyé, mais le mystére des Trois personnes divines.", "page": 131, "kind": "p"}, {"id": "r23p38", "text": "L’Eglise, dit le Concile Vatican II, est extension aux personnes humaines de la communauté d’amour qui unit les Trois personnes divines.", "page": 131, "kind": "p"}, {"id": "r23p39", "text": "Tout homme 4a qui vous remettrez les péchés, ils lui seront remis...", "page": 132, "kind": "h"}, {"id": "r23p40", "text": "Tout homme 4 qui vous maintiendrez les péchés, ils lui seront maintenus...", "page": 132, "kind": "h"}, {"id": "r23p41", "text": "Le réle de l’Eglise, sa mission, est d’annoncer le pardon, le salut! La progression de cette page de saint Jean est saisissante :", "page": 132, "kind": "p"}, {"id": "r23p42", "text": "— une communauté d’hommes fait lexpérience du ressuscité... ;", "page": 132, "kind": "p"}, {"id": "r23p43", "text": "— envoi en mission de cette communauté découle de cette expérience...;", "page": 132, "kind": "p"}, {"id": "r23p44", "text": "— le don de lEsprit vient rendre possible cette mission... ; — cette «mission», c’est de transmettre le Salut, le Pardon, la Sainteté...", "page": 132, "kind": "p"}, {"id": "r23p45", "text": "Ainsi, le rdle de lEglise est la libération! Cest doffrir Pamour infini de Dieu. La formule paralléle, en négatif, ne signifie évidemment pas que lEglise pourrait exercer une sorte de droit arbitraire. La question n’est jamais: « Est-ce que Dieu va me pardonner ?» La croix de Jésus a répondu a cette question. Mais il reste, hélas, la question: « Est-ce que je vais “recevoir” ce pardon?»", "page": 132, "kind": "p"}]}, {"id": 24, "title": "La Sainte Trinité", "group": "Fiestas", "page": 133, "ref": "Matthieu 28/16.20", "paragraphs": [{"id": "r24p1", "text": "Pour célébrer la Sainte Trinité, ’Eglise nous propose les cing derniers versets de l’évangile selon saint Matthieu... parce qu’ils contiennent ces mots: « Baptisez-les au nom du Pére, et du Fils, et du Saint-Esprit». Nous allons voir que, dans la conclusion de son évangile, Matthieu a concentré comme un résumé de tout son livre. Ce sont des phrases d’une grande densité théologique, une sorte de «profession de foi».", "page": 133, "kind": "p"}, {"id": "r24p2", "text": "Les onze disciples s’en allérent «en Galilée»...", "page": 133, "kind": "h"}, {"id": "r24p3", "text": "Cette simple phrase, déja, nous dit «qui est l’Eglise»... C’est lEglise des nations paiennes. Les disciples ont été invités par Jésus ressuscité en personne a quitter Jérusalem (Matthieu 28/7), jusqu’alors centre géographique de la foi, lieu de la présence de Dieu. Selon saint Matthieu, il n’y a pas d’apparition « officielle» aux Apétres a Jérusalem: aux femmes, comme en privé, il a confié une commission... il a convoqué les Apétres dans la « Galilée des Nations», cette province de passage aux populations cosmopolites (Matthieu 4/15). L’Eglise commence «en Galilée»: cette région, théologiquement, supplante Jérusalem et devient le centre d’expansion de la communauté nouvelle. Déja, dans ses premiers chapitres, Matthieu avait montré de mystérieux «mages d’Orient», venant des terres paiennes, qui s étaient « prosternés» devant Jésus enfant, alors que Jérusalem ne l’accueillait pas.", "page": 133, "kind": "p"}, {"id": "r24p4", "text": "Est-ce que c’est cette conception-ld que j'ai de lEglise? Une Eglise ouverte sur le monde a évangéliser, et non pas frileusement enfermée dans ses murs?", "page": 133, "kind": "p"}, {"id": "r24p5", "text": "A la montagne ow Jésus leur avait ordonné de se rendre...", "page": 134, "kind": "h"}, {"id": "r24p6", "text": "Le mot « ékklésia» (« église») en grec, signifie « ’assemblée des convoqués». Les chrétiens sont ceux qui ont été convoqués par le Seigneur ressuscité. Chaque dimanche, quand je viens a l’eucharistie, ai-je conscience que ce nest pas moi qui prends Initiative, mais que c’est Jésus qui m’y a «convoqué» ? Je réponds a une invitation. Ma Foi n’est pas d’abord une construction intellectuelle, c’est la reponse a quelqu’un qui m/’appelle.", "page": 134, "kind": "p"}, {"id": "r24p7", "text": "Sur la «montagne»!", "page": 134, "kind": "p"}, {"id": "r24p8", "text": "Chez Matthieu, on ne dit jamais quelle est cette montagne. Mais, par contre, est-ce par hasard, la montagne est le lieu par excellence de la «révélation» de Dieu. C’est en ce méme «haut-lieu» que Jésus avait prononcé son discours inaugural, le « sermon sur la montagne» (Matthieu 5/1-8/1). Cest la aussi qu'il avait prié (Matthieu 14/23), qu’il avait multiplié les pains (15/29), qu'il avait été transfiguré devant ses apdtres (17/1.9).", "page": 134, "kind": "p"}, {"id": "r24p9", "text": "Je me laisse prendre par ce symbolisme... Je me laisse «convoquer) par Jésus sur une «montagne»... J’accepte de laisser agrandir mes horizons... Le site ot Jésus m/invite est grandiose... on y respire largement lair des cimes.", "page": 134, "kind": "p"}, {"id": "r24p10", "text": "Quand ils le virent, ils se « prosternérent»...", "page": 134, "kind": "h"}, {"id": "r24p11", "text": "C’est le geste liturgique que des jeunes retrouvent, et que les foules orientales font spontanément: allongé de tout son étre sur le sol... ou, du moins, profondément prosterné, le front touchant la terre... Geste solennel d’adoration! Le plus grand geste qu’un homme puisse faire.", "page": 134, "kind": "p"}, {"id": "r24p12", "text": "Dans l’évangile de Matthieu, cette grande prostration a été déja celle des douze dans la barque sauvée de la tempéte (14/33), mais aussi ¢’avait été le geste des mages paiens (2/11), du lépreux (8/2), de la cananéenne, une autre paienne (15/25).", "page": 134, "kind": "p"}, {"id": "r24p13", "text": "Mrarrive-t-il d’adorer, parfois? C’est-a-dire de faire silence en songeant a la majesté de Celui devant qui je me tiens.", "page": 134, "kind": "p"}, {"id": "r24p14", "text": "Mais certains eurent des doutes... Jésus s’approcha deux...", "page": 134, "kind": "h"}, {"id": "r24p15", "text": "Cette Eglise, qui adore son Seigneur dans le culte, reste une Eglise de pécheurs. La foi des premiers Apétres (comme la nétre!) reste une foi mélée de doutes et d’ambiguités, c’est une foi itinérante, en cheminement. L’Eglise qui accueille Jésus c’est toujours une Eglise d’« hommes de peu de foi» (Matthieu 14/31), amputée par la défection de l'un des siens: ils ne restent que «onze» sur les «douze» appelés.", "page": 135, "kind": "p"}, {"id": "r24p16", "text": "Jésus ne sétonne pas! Il «s'approche» d’eux, comme aprés la Transfiguration (Matthieu 17/7). Seigneur, viens! approche-toi encore! Marana tha! Prends pitié, Seigneur, de tous ceux qui n’arrivent pas a faire une profession de foi totale et claire, prends.pitié de tant de jeunes, de tant dhommes modernes qui «n/arrivent pas 4a croire»... Prends pitié de moi, dont la foi aussi, parfois, se méle de doutes.", "page": 135, "kind": "p"}, {"id": "r24p17", "text": "Il leur adressa ces paroles: « Tout pouvoir m’a été donné... De toutes les nations faites des disciples... Apprenez-leur 4 garder tous les commandements... Je suis avec vous tous les jours...", "page": 135, "kind": "h"}, {"id": "r24p18", "text": "Quelle majesté souveraine dans ces paroles de Jésus ressuscité !", "page": 135, "kind": "p"}, {"id": "r24p19", "text": "Aprés la vie obscure du pauvre petit charpentier de Nazareth, voici qu’éclate ’heure de vérité. C’est, apparemment, la derniére page d’un récit, le dernier épisode d’une vie dhomme, mais c’est le début de la plus grande aventure de tous les temps, inexplicable selon les normes habituelles de Phistoire.", "page": 135, "kind": "p"}, {"id": "r24p20", "text": "Nous remarquons la solennelle répétition, quatre fois, de Padjectif «tout». Une quadruple totalité, une quadruple plénitude universelle, définissent laction de Jésus. Il s’agit de la totalité de action divine, qui prend corps dans la totalité de l’espace terrestre, pour transformer la totalité de lagir humain, et dans la totalité du déroulement du temps! Il faudrait relire le P. Teilhard de Chardin. Voici un extrait : «Physiquement, le Christ est celui qui remplit: aucun élément du monde, a aucun instant du monde, qui ne soit md, qui ne se meuve, qui ne doive jamais se mouvoir en dehors de son influx dirigeant. L’Espace et la Durée sont pleins de Lui... Physiquement, aussi, le Christ est celui qui «consomme»: la plénitude du monde ne s’achevant que dans la synthése finale ol une conscience supréme apparaitra sur la complexité totale suprémement organisée... En Lui, toutes les lignes du monde convergent et se nouent ensemble. C’est Lui qui, a lédifice entier de la Matiére et de lEsprit, donne sa consistance. »", "page": 135, "kind": "p"}, {"id": "r24p21", "text": "De toutes les nations faites des disciples. Baptisez-les au nom du Pére, et du Fils, et du Saint-Esprit.", "page": 136, "kind": "h"}, {"id": "r24p22", "text": "Le Pére n’est « pére» que parce que, se renoncant totalement, il passe tout entier en son Fils. Le Fils nest « fils» que parce que, se renoncant, il est tout entier « don de soi» a son Pére. L’Esprit n’est rien, s'il n’est Amour mutuel du Pére et du Fils. Dieu est Amour.", "page": 136, "kind": "p"}, {"id": "r24p23", "text": "Le grand projet de Dieu, que Jésus confie a ses apdtres, a son Eglise, vise a «plonger» (c’est le sens du mot grec « baptiz6 ») ’Phumanité dans les relations d’amour qui unissent parfaitement le Pére, le Fils, et ’Esprit. Le « signe» du baptéme, qui est, identiquement, le signe de la croix, c’est «la-vie pour les autres». Nous sommes baptisés «au nom de ’Amour». Nous sommes plongés dans ce courant-la! Voild le « programme» de lEglise!", "page": 136, "kind": "p"}, {"id": "r24p24", "text": "On se demande parfois quelle Eglise Jésus a eu ’intention de fonder. Pour sir, le Christ n’a pas pensé a la Cité du Vatican, aux évéques mitrés, au découpage territorial en diocéses et en paroisses, ni aux bureaux administratifs, ni aux édifices religieux, ni aux grandes cérémonies ecclésiastiques qui ressemblent a des cours royales du temps passé. Ceci dit pour que nous n’enfermions pas lEglise vivante dans les visages temporels qu’elle a pu prendre a certaines époques. Ce que le Christ a voulu, c’est le « rassemblement de tous les hommes dans amour». Dieu est Amour. Dieu est communauté de personnes s’aimant dans lunité du Saint-Esprit. L’essentiel de l’Eglise, il faut le chercher dans la nature méme du Dieu Trinité.", "page": 136, "kind": "p"}, {"id": "r24p25", "text": "Ceux qui me voient vivre, moi qui ai été « plongé», « baptisé», dans la Trinité d’amour, ceux qui observent les groupes ot je vis, ma famille, mon équipe de travail, peuvent-ils pressentir «au nom de Qui jai été baptisé? ».", "page": 136, "kind": "p"}, {"id": "r24p26", "text": "Apprenez-leur a observer tous les commandements que je vous ai donnés.", "page": 137, "kind": "h"}, {"id": "r24p27", "text": "Quel est donc ce commandement que Jésus donnait? Le commandement de l'amour. «A ceci tous vous reconnaitront pour mes disciples, si vous aimez...» Il ne suffit pas détre baptisé! Il faut encore se montrer «disciple» de Jésus par tous les actes de la vie. L’enseignement, la catéchése, pour Jésus, n’est pas surtout une lecon a apprendre, mais lapprentissage d’une maniére de vivre «selon lamour».", "page": 137, "kind": "p"}, {"id": "r24p28", "text": "Et moi, je-suis-avec-vous, tous les jours, jusqu’a la fin du monde.", "page": 137, "kind": "h"}, {"id": "r24p29", "text": "Ce « Je-suis » est trés fort. On y-devine, comme chez saint Jean, le « Yahvé» de |’Ancien Testament. De plus, sous forme d’inclusion sémitique, nous retrouvons, ici, en terminant, le début de lévangile selon saint Matthieu... «Emmanuel = Dieu-avec-nous». Lors de lAnnonciation a Joseph (Matthieu 1/23), il avait été dit que Penfant serait Emmanuel, et Joseph lui avait donné le nom de... Jésus! Mais, a la derniére ligne de son évangile, Matthieu donne la solution de son énigme: ce Jésus, ressuscité, c’est bien « Dieu-avec-vous». Merci, Jésus.", "page": 137, "kind": "p"}]}, {"id": 25, "title": "Corps et Sang du Christ", "group": "Fiestas", "page": 138, "ref": "Marc 14/12.26", "paragraphs": [{"id": "r25p1", "text": "Le premier jour de la féte des pains sans levain, ou lon immolait Pagneau pascal, les disciples de Jésus lui disent: «Ou veux-tu que nous allions faire les préparatifs pour ton repas pascal ?»»", "page": 138, "kind": "h"}, {"id": "r25p2", "text": "Jésus a été « exécuté» un vendredi, trés probablement en Pan 30 ou 33, a ’heure ott les agneaux de la Paque étaient immolés dans l’enceinte du Temple (Jean 19/14).", "page": 138, "kind": "p"}, {"id": "r25p3", "text": "Mais on ne sait pas de facon certaine quel calendrier Jésus a suivi pour son dernier repas. Ce qui est certain, c’est que Jésus a donné un caractére « pascal» a ce repas.", "page": 138, "kind": "p"}, {"id": "r25p4", "text": "La Paque, c’était la grande célébration des juifs: on y fétait la «libération»! Dans un repas rituel, fait 4 la maison, en famille, le pére devait donner une instruction a ses enfants, en rappelant comment les ancétres avaient été délivrés de Pesclavage. Oui, le peuple juif avait conscience d’étre un peuple «d’anciens esclaves»! Mais maintenant «libres»! Dieu était intervenu, soutenant leur révolte contre ’oppresseur, les aidant a sortir de la terre d’Eqypte, pour entrer en Terre Promise.", "page": 138, "kind": "p"}, {"id": "r25p5", "text": "Jésus, chaque année, a Nazareth, avec Joseph et Marie, avait célébré ce repas de féte. Il en savait par coeur tout le déroulement rituel: le pain, le vin, ’agneau, les herbes ameres, les priéres, les psaumes... Mais ce soir-la, Jésus va donner un contenu nouveau a ce repas traditionnel... C’est Lui, aujourd’hui, le libérateur!", "page": 138, "kind": "p"}, {"id": "r25p6", "text": "La Paque. La Libération! Un repas de féte, un repas qui libére de lesclavage.", "page": 138, "kind": "p"}, {"id": "r25p7", "text": "Comme nous avons banalisé cela! Comme nos messes sont guettées par l’affadissement et l’ennui! Comme la routine de tant de nos messes est tragique! Comme il est grave que nous ayons d’abord le souci de « faire des cérémonies», de «respecter des rites». Aurions-nous oublié que nous avons toujours besoin d’étre « libérés», « sauvés» ? Mais oui, Monsieur... Mais oui, Madame... Vous étes encore des «esclaves»! Regardez bien votre vie, soyez lucide. Prenez conscience de tout ce qui vous enchaine. Alors, vous aussi, vous demanderez a Jésus: « OU veux-tu que nous allions préparer ton repas pascal, ton repas de libération?» Oui, délivre-nous du péché et de la mort.", "page": 138, "kind": "p"}, {"id": "r25p8", "text": "Il envoie deux disciples: « Allez a la ville: vous y rencontrerez un homme portant une cruche deau. Suivez-le...»", "page": 139, "kind": "h"}, {"id": "r25p9", "text": "Le climat est lourd. Jésus est un homme traqué. Les chefs ont décidé sa mort. Alors, Jésus donne une sorte de code secret. Il a des amis, mais en cachette. Il a tout préparé. Jimagine les deux disciples suivant homme a la cruche. La mort de Jésus... son départ de ce monde... serait-ce, pour «lui», dabord, une paque, une libération ? C’est «Sa» paque: il va étre délivré...", "page": 139, "kind": "p"}, {"id": "r25p10", "text": "La ou il entrera, dites au propriétaire: « Le maitre te fait dire: ot est la salle ou je pourrai manger la Paque avec mes disciples ? » Il vous montrera, a l’étage, une grande piéce toute préte pour un repas. Faites-y pour nous les préparatifs. »", "page": 139, "kind": "h"}, {"id": "r25p11", "text": "Jésus a tout prévu. Il a vu grand. C’est lui qui invite. C’est «son repas». C’est lui, tout a lheure, qui présidera. Les disciples sont ses « invités». Il régle avec autorité les préparatifs. On est saisi par limportance que prennent ces détails. C’est vrai, toute féte, aujourd’hui encore, se « prépare». Pensons a ces fétes de village ou de quartier, a ces repas de communions ou de fiancailles, ou de mariages. On tient a ce que la féte soit réussie, alors on se donne beaucoup de mal.", "page": 139, "kind": "p"}, {"id": "r25p12", "text": "Et nos messes? Est-ce que nous les préparons?", "page": 139, "kind": "p"}, {"id": "r25p13", "text": "Que de messes baclées, improvisées, expédiées le plus vite possible! Si nous décidions, comme Jésus, de faire une vraie féte de nos messes, de prendre du temps pour « préparer »... et d’abord, d’étre la a ’heure! Et si la répétition de chants qui précéde l’eucharistie faisait partie essentielle et intégrante de la féte? Jésus, ce soir-la, avait tout préparé, pour que ce soit beau, bon, grand!", "page": 139, "kind": "p"}, {"id": "r25p14", "text": "Les disciples partirent, allérent en ville: tout se passa comme Jésus le leur avait dit; et ils préparérent la Paque.", "page": 140, "kind": "h"}, {"id": "r25p15", "text": "Marc insiste sur ce point. I] veut souligner l’autorité, la gravité de Jésus. Il a tout prévu. Il a tout décidé. Il est le « maitre» indiscuté. Jésus savait que c’était sa derniére réunion avec ses amis: |’«heure» est solennelle... c'est «son heure», dira Jean. Que va-t-il se passer? Nous sommes introduits a un acte important : ’@événement qui va arriver... va changer histoire de la planéte, et de toute lhumanité. La mort et la résurrection de Jésus, libération du monde pécheur.", "page": 140, "kind": "p"}, {"id": "r25p16", "text": "Quand je me dirige vers ma messe du dimanche, quelle est ma pensée ? Comment est-ce que je me prépare le coeur? Est-ce, aussi, un «événement» dans ma semaine? Vers lequel tout converge et monte? Ou bien est-ce une petite heure dérobée, a la sauvette, parmi des occupations autrement importantes pour moi? Une parenthése?", "page": 140, "kind": "p"}, {"id": "r25p17", "text": "Pendant le repas, Jésus prit du pain, pronong¢a la bénédiction, le partagea et le leur donna...", "page": 140, "kind": "h"}, {"id": "r25p18", "text": "Nous avons quatre récits de cette scéne: Marc, Luc, Matthieu et Paul (I Corinthiens 11/23.25). Ces quatre récits sont d’accord sur lessentiel, mais nous présentent des formules différentes pour les « paroles» prononcées. Jésus n’a pas eu de souci ritualiste... ni lEglise primitive... Il est important de souligner ce fait évident, pour nous délivrer d’une conception « matérialiste » des sacrements, comme si Dieu était lié aux mots, a la maniére de la magie. En fait, on ne sait pas exactement quel «mot a mot» Jésus a prononcé ce soir-la. Les quatre récits ne sont pas des reportages, mais des textes liturgiques (différents!) utilisés dans les premiéres communautés chrétiennes. On peut étre assuré que ces communautés, proches des événements, ont respecté lintention, sinon les formules mémes, de Jésus.", "page": 140, "kind": "p"}, {"id": "r25p19", "text": "Il faut d’abord se représenter les « gestes» de Jésus.", "page": 141, "kind": "p"}, {"id": "r25p20", "text": "Il «prend» le pain! Je vois sa main qui se tend vers la galette qui est sur la table. Je regarde les mains de Jésus, pleines de ce morceau de pain lourd, non-levé, « un pain de misére», car nos ancétres en Egypte n’avaient pas eu le temps de faire lever la pate.", "page": 141, "kind": "p"}, {"id": "r25p21", "text": "Il « prononce la priére de bénédiction» ! C’est une action de graces. A propos de la coupe, Marc utilise le mot « eucharistésas», «ayant rendu graces», d’ot est venu le mot eucharistie. J’écoute Jésus prier, dire «merci» au Pére, dans la joie. Je contemple son visage pendant qu'il parle a son Pére. Aurions-nous oublié que la messe est une action de graces ?", "page": 141, "kind": "p"}, {"id": "r25p22", "text": "Il «rompt le pain»! Le geste n’est pas original. Le pére de famille devait faire ce geste pour distribuer A chacun sa part. Mais le symbole est beau: tous mangent du méme pain. Cela souligne la « communauté de table», qui deviendra une idée-force des premiéres communautés chrétiennes. La messe est un défi qui veut atteindre toutes les racines de nos tendances 4 l’égoisme: c’est se moquer de l'eucharistie que de laisser des « murs de séparations» que le Christ a détruits (Ephésiens 2/14). Je regarde Jésus rompre le pain. «Ils le reconnurent 4 la fraction du pain.» Il le «donne»! Quand je communie, ai-je conscience que cest Jésus qui me tend la bouchée? Geste sacré, chargé de sens mystique. Voici nos mains tendues, pour t’accueillir, Seigneur!", "page": 141, "kind": "p"}, {"id": "r25p23", "text": "En disant: « Prenez, ceci est mon corps. »", "page": 141, "kind": "h"}, {"id": "r25p24", "text": "Aprés des siécles de discussions, ott ces mots ont été interprétés différemment, les diverses confessions chrétiennes, réunies en Conseil cecuménique des Eglises en 1974, se sont mis d’accord sur ce texte commun: «Ce repas de pain et de vin est le sacrement, le signe efficace et assurance de la présence du Christ lui-méme, qui a sacrifié sa vie pour tous les hommes et s’est donné a eux comme pain de vie ; pour cette raison, le repas eucharistique est le sacrement du corps et du sang du Christ, le sacrement de sa présence réelle... C’est ’Esprit qui, dans Peucharistie, fait que le Christ soit réellement présent et donné dans le pain et le vin, en accomplissant les paroles de Iinstitution. »", "page": 141, "kind": "p"}, {"id": "r25p25", "text": "Nous sommes, évidemment, devant un mystére. Déja saint Thomas d’Aquin, le grand théologien de leucharistie du moyen age, écrivait que cette « présence réelle» ne signifiait pas une localisation qui limiterait le Christ au pain et au vin, OU qui provoquerait un changement physico-chimique de ces choses: toutes les «apparences» restent (Somme Théologique III, 76/3 a 5 et 77/5 a 8). L homme moderne a besoin que ces vérités traditionnelles lui soient redites. La messe de la Féte-Dieu a été composée par saint Thomas d’Aquin, a Orvieto, en l’'an 1264. Avec toute lEglise primitive, Thomas d’Aquin «croyait»... mais sans aucun simplisme. Saint Paul n’avait-il pas dit le premier qu’il faut la « foi», pour « discerner le corps et le sang du Seigneur ?» (I Corinthiens 11/23.29). Oui, Seigneur, nous aussi, nous croyons ! ;", "page": 142, "kind": "p"}, {"id": "r25p26", "text": "Puis, prenant la coupe et rendant graces, il la leur donna, et ils en burent tous. Et il leur dit: « Ceci est mon sang de I’Alliance, répandu pour la multitude. »", "page": 142, "kind": "h"}, {"id": "r25p27", "text": "Telle est la traduction exacte du texte grec de saint Marc. Jésus sait qu’il va mourir, et de quelle maniére il va mourir. Il prend la place de lagneau pascal (dont on ne parle plus du tout dans ce repas pascal, alors qu’il était la piéce maitresse du rite d’Israél). Jésus, ici, évoque ce Serviteur de Yahveh qui «sacrifiait sa vie pour la multitude» (Isaie 53/11). Une «alliance»: Dieu devient une seule et unique réalité avec lhumanité, quelqu’un de notre «clan», un membre de notre famille, un «allié». Et cela est signifié par ce qui est le plus intime et le plus vital en nous: le sang!", "page": 142, "kind": "p"}, {"id": "r25p28", "text": "Amen, je vous le dis: je ne boirai plus du fruit de la vigne jusqu’a ce jour ou je boirai un vin nouveau dans le Royaume de Dieu. Aprés le chant d'action de graces, ils partirent pour le Mont des Oliviers...", "page": 142, "kind": "h"}]}, {"id": 26, "title": "2e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 143, "ref": "Jean 1/35.42", "paragraphs": [{"id": "r26p1", "text": "Le temps liturgique est structuré autour de deux grandes fétes, Noél et Paques. Chacun de ces « temps privilégiés » est précédé d’une préparation (l’Avent... le Caréme) et suivi d’une sorte de prolongation (l’Epiphanie... le temps pascal).", "page": 143, "kind": "p"}, {"id": "r26p2", "text": "En dehors de ces deux grandes phases de temps plus festif, le «temps» redevient plus « ordinaire», les dimanches sont moins colorés. Cela ne veut pas dire qu’ils sont vides. Notre vie n’est pas faite que de temps forts. Il faut assumer le quotidien.", "page": 143, "kind": "p"}, {"id": "r26p3", "text": "Aprés les « fétes» de Noél et du «nouvel an», nous rentrons aujourd’hui dans une série de dimanches ou I’Eglise nous propose la «vie d’adulte de Jésus».", "page": 143, "kind": "p"}, {"id": "r26p4", "text": "Le lendemain, Jean Baptiste se trouvait de nouveau au méme endroit... .", "page": 143, "kind": "h"}, {"id": "r26p5", "text": "Voila tout un symbole de cette «vie quotidienne» qui recommence chaque matin, apparemment banale, terne, grise... éternel recommencement... invitation a ’ennui ?", "page": 143, "kind": "p"}, {"id": "r26p6", "text": "Cest dans ce contexte plat, ot il «ne se passe rien», que va surgir la nouveauté, Dieu! Aucun matin nest banal. Dieu y est présent. AUJOURD’HUI, il va se passer quelque chose!", "page": 143, "kind": "p"}, {"id": "r26p7", "text": "Saint Jean a méme, intentionnellement, «composé» ce premier chapitre de son évangile comme une « premiére Semaine » : il est capital de remarquer ce « début de Jésus». Jean 1/19: 1 jour. Une délégation juive vient interroger Jean Baptiste au Jourdain.", "page": 143, "kind": "p"}, {"id": "r26p8", "text": "Jean 1/29: 2° jour. « Le lendemain», Jean Baptiste désigne Jésus comme l’Agneau de Dieu.", "page": 143, "kind": "p"}, {"id": "r26p9", "text": "Jean 1/35: 32 jour. «Le lendemain», Jean Baptiste donne ses propres disciples a Jésus.", "page": 144, "kind": "p"}, {"id": "r26p10", "text": "Jean 1/43: 4° jour. «Le lendemain», Jésus appelle encore deux autres disciples.", "page": 144, "kind": "p"}, {"id": "r26p11", "text": "Jean 2/1: 7 jour. «Trois jours aprés» a lieu le premier miracle, les noces de Cana, oti Jésus « manifesta sa Gloire, et ses disciples crurent en Lui!»", "page": 144, "kind": "p"}, {"id": "r26p12", "text": "A travers ce procédé de composition, Jean lévangéliste nous dit une « bonne nouvelle»: c’est une nouvelle genése, c’est une nouvelle création qui commence, c’est la reprise de la premiére page de la Bible. Non, nous crie toute la «révélation», le temps n’est pas banal, terne, ennuyeux. C’est le lieu du surgissement de la nouveauté radicale, c’est le lieu de la «créativité», c’est le lieu de la « Création».", "page": 144, "kind": "p"}, {"id": "r26p13", "text": "Est-ce que, chaque matin, pour moi, est neuf?", "page": 144, "kind": "p"}, {"id": "r26p14", "text": "Seigneur, rends-moi attentif A ce qui va surgir, 4 cet « évéenement» qui va se passer, et qui risque de me surprendre. Chaque jour, Seigneur, Tu m/attends.", "page": 144, "kind": "p"}, {"id": "r26p15", "text": "Posant son regard sur Jésus qui allait et venait, Jean Baptiste dit: « Voici PAgneau de Dieu.»", "page": 144, "kind": "h"}, {"id": "r26p16", "text": "Oui, Jean Baptiste désigne Jésus, et s’efface humblement devant celui qu’il annonce: il va donner ses disciples, qui abandonneront le Baptiste pour suivre un autre maitre. Que signifie ce premier « titre» donné a celui qui, jusquiici, nétait encore que le charpentier de Nazareth? Il est ?« Agneau de Dieu»!", "page": 144, "kind": "p"}, {"id": "r26p17", "text": "C’est un mot que nous re-chantons 4 chaque messe. Que mettons-nous sous ce mot? Que mettait Jean Baptiste ? Il suffit d’évoquer tout le contexte juif. Ce titre est vraiment le « passage» de l’Ancien au Nouveau testament: le dernier des prophétes est le premier temoin de Jésus-Christ. Chaque famille juive, au jour de Paques, immolait un agneau et marquait de son sang les portes de sa maison, au cours d'un repas du soir (qu’on appelle Céne en latin!) : c’était le symbole de la «libération» d’Israél. Le mot «agneau», en araméen, langue de Jésus, est d’ailleurs le méme que celui de «serviteur»: tout juif fervent avait dans lesprit cette fameuse prophétie d’Isaie (53/7), qui présentait le parfait «Serviteur de Dieu» comme «un Agneau conduit a la boucherie et qui n’ouvre pas la bouche». Jésus est donc désigné comme celui qui va se laisser immoler en silence, celui qui va sacrifier sa vie par amour pour enlever les péchés du monde. Dans les traditions juives du temps de Jésus, on parlait d’un «agneau royal» a qui il pousserait des cornes de bélier et qui se mettrait 4 « défendre le reste du troupeau»: c’est dailleurs la méme image que reprend Jean dans son Apocalypse, quand il montre l'agneau, pris du troupeau, qui assume la défense de ses fréres et attaque et disperse les ennemis (Apoc. 6/16-7/17-17/14). Que nous sommes loin du cantique doucereux «Le voici Pagneau si doux!» L’agneau de Dieu que nous chantons avant de communier n’est pas l’image du doux et gentil animal caressant, et inoffensif... c’est plutét limage du combattant victorieux, mais couvert du sang qu'il a versé pour nous sauver du malheur!", "page": 144, "kind": "p"}, {"id": "r26p18", "text": "Voila comment Jésus est désigné, dés le troisiéme jour de sa vie publique.", "page": 145, "kind": "p"}, {"id": "r26p19", "text": "Les deux disciples entendirent cette « Parole», et ils suivirent Jésus.", "page": 145, "kind": "h"}, {"id": "r26p20", "text": "Je peux reconstituer cette scéne par imagination. Jésus marche sur un sentier au bord du fleuve. Deux hommes se mettent a le suivre, timidement, le coeur battant... Ils ne Pont encore jamais vu. C’est un inconnu. Que va-t-il se passer ?", "page": 145, "kind": "p"}, {"id": "r26p21", "text": "Cest bien « risqué » de suivre ainsi un inconnu. C’est, peutétre, une aventure. C’est ainsi que commencent tous les grands itinéraires, tout ce qui ouvre un chemin neuf.", "page": 145, "kind": "p"}, {"id": "r26p22", "text": "Celui-ci se retourna, vit qu’ils le suivaient, et leur dit...", "page": 145, "kind": "h"}, {"id": "r26p23", "text": "Jésus a entendu les graviers sous leurs pas, derriére lui. Il se retourne. Je vois la scéne. Voici le « premier regard» de Jésus posé sur des inconnus... aussi.", "page": 145, "kind": "p"}, {"id": "r26p24", "text": "« Que cherchez-vous ?»", "page": 145, "kind": "h"}, {"id": "r26p25", "text": "Et voici le « premier mot» de Jésus dans l’évangile de saint Jean. Cette question de Jésus s’adresse 4 tout homme. Jésus me l’'adresse a moi, AUJOURD’HUI. « Que cherches-tu ? Quel est le sens que tu donnes 4a ta vie? Quel est ton désir ? »", "page": 145, "kind": "p"}, {"id": "r26p26", "text": "Nous remarquons que la premiére intervention de Jésus nest pas une «affirmation», mais une «interrogation» : pour aborder Jésus, il faut étre « ouvert», il ne faut pas étre «enfermé» dans un systéme clos, comme ces « prétres et lévites» qui sont venus trouver Jean Baptiste (Jean 1/19) et pour qui le dialogue a tourné court, parce quiils ne « cherchaient rien» au fond. Ce premier mot de Jésus nous dit que la premiére condition pour la genése ou l’approfondissement de la foi, c’est de « chercher ». La foi est d’abord catéchuménale: c’est une recherche, une question. « Qui es-tu, Seigneur?» Celui qui sait tout, celui qui est bloqué dans ses certitudes, n’avancera jamais. « Dieu n’existe pas! — En étes-vous bien sir? — Dieu existe, et il est Tel... et Tel... — En étes-vous bien sar?» Il y a un certain « doute» qui est la condition méme de l’avancée de la science, disait le grand philosophe Descartes. Il y a une certaine « interrogation» qui est la condition méme de lavancée de la foi. Et Péguy traduisait: «Il y a des Ames qui sont fermées, parfaites. Il n’y a, en elles, aucun passage possible pour la grace. Il ny a pas de «mouillature» possible, elles sont imperméables... »", "page": 146, "kind": "p"}, {"id": "r26p27", "text": "Seigneur, fais de nous des ames ouvertes, des ames qui cherchent.", "page": 146, "kind": "p"}, {"id": "r26p28", "text": "Ils lui répondirent: « Rabbi, c’est-a-dire, Maitre, ou demeures-tu ? — Venez, et vous verrez.»>", "page": 146, "kind": "h"}, {"id": "r26p29", "text": "Chercher... Suivre... Demeurer... Trois attitudes essentielles de ’amour. Est-ce que je cherche Dieu? Est-ce que je suis la trace de Dieu? Est-ce que je demeure avec Dieu? Jésus répond a leur désir... A leur recherche. Mais comme sa réponse est respectueuse de leur liberté! « Venez, et vous verrez!» Jésus n’embarque pas de force. Jésus n’est pas un propagandiste, un publiciste qui veut convertir a tout prix et de force, si c’est nécessaire. Et moi, quel est ma maniére de proposer la foi?", "page": 146, "kind": "p"}, {"id": "r26p30", "text": "Ils faccompagnérent et ils virent ot il demeurait, et ils demeurérent auprés de lui ce jour-la. C’était environ la « dixiéme» heure.", "page": 146, "kind": "h"}, {"id": "r26p31", "text": "Il ya des mots que Jean ne cesse de répéter. Ce n’est pas par pauvreté de vocabulaire. C’est intentionnel. C’est un langage théologique et spirituel. Il décrit ainsi, par ces répétitions mémes, la démarche du «disciple»: «chercher» (1/38)... «venir voir» (1/39 et 46)... «voir» (1/39 et 41)... « trouver » (1/41 et 45)... « suivre » (1/37.38.40.43)... «demeurer» (1/38.39).", "page": 147, "kind": "p"}, {"id": "r26p32", "text": "Jean l’évangéliste était Pun de ces «deux» hommes qui avaient suivi Jésus. Son souvenir est précis, comme celui du premier rendez-vous de deux amoureux. II note ’heure. Cela se passait 4 «quatre heures» de laprés-midi (la « dixiéme» heure, a l’époque). Que se sont-ils dit, ce jourla? Eux deux ont da raconter leur vie, leurs aspirations, leurs désirs, leurs «recherches». Lui, a dd leur dire ses projets, ses propres désirs.", "page": 147, "kind": "p"}, {"id": "r26p33", "text": "André, le frére de Simon Pierre, était Pun des deux disciples qui avaient entendu Jean Baptiste et qui avaient suivi Jésus. Il trouve d’abord son frére Simon et lui dit: « Nous avons trouvé le « Messie», autrement dit le « Christ».", "page": 147, "kind": "h"}, {"id": "r26p34", "text": "Il est trés caractéristique que lappel de Dieu, la « vocation», se fait entendre, en fait, par des relations humaines. Pour entendre lappel de Dieu, il faut aussi étre attentifs aux appels des hommes. C’est Jean Baptiste qui a d’abord appelé André et Jean. Ce sont André et Jean qui appellent Simon. Ce sera Philippe qui invitera Nathanaél.", "page": 147, "kind": "p"}, {"id": "r26p35", "text": "La pensée me vient-elle que je pourrais, éventuellement, conduire quelqu’un a une rencontre de Jésus? Suis-je préoccupé de ne pas garder pour moi ma découverte de Jésus?", "page": 147, "kind": "p"}, {"id": "r26p36", "text": "Il famena a Jésus... Jésus posa son regard sur lui et dit: « Tu es Simon, tu t’appelleras Kepha, ce qui veut dire « Pierre»).", "page": 147, "kind": "h"}, {"id": "r26p37", "text": "Etre disciple, c’est «changer» de vie... c’est entrer dans une aventure nouvelle, c’est devenir un « étre neuf». Telle est la signification du changement de nom de Simon. Pour les premiers disciples, ils se souvenaient, le changement de leur vie avait été fantastique! C’avait été le début d’une orientation radicalement différente de toute leur vie: une vraie « aventure ». Ce changement du nom, dans la mentalité sémitique, signifiait aussi l’emprise de Dieu sur SimonPierre. Ces hommes avaient « cherché» Jésus... oui! Mais c’était Jésus qui les cherchait... C’est Lui qui avait linitiative, par sa mystérieuse « grace». Vocation: appel humain... appel divin.", "page": 147, "kind": "p"}]}, {"id": 27, "title": "3e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 149, "ref": "Marc 1/14.20", "paragraphs": [{"id": "r27p1", "text": "Aprés larrestation de Jean Baptiste...", "page": 149, "kind": "h"}, {"id": "r27p2", "text": "Rien de tel que ces mots, qui ont lair d’aller de soi, et sur lesquels nous risquons de glisser sans en voir importance, pour nous faire saisir dans quel «contexte» dramatique sest déroulée la vie de Jésus. Marc ne nous dit pas pour quelle raison Jean Baptiste est arrété par la police et jeté en prison. Il le dira plus tard (Marc 6/17.18). En fait, ceux qui prennent la parole au nom de Dieu sont souvent des géneurs, des contestataires. Jésus prend la suite de « celui qui vient d’étre arrété». Il peut déja prévoir ce qui l'attend, dans quelques mois: la défiance et la persécution... puis la mort. Le méme sort que celui de son cousin, Jean Baptiste.", "page": 149, "kind": "p"}, {"id": "r27p3", "text": "Et nous, avons-nous le courage de prendre position parfois a contre-courant, en risquant quelque chose? Suivre intégralement sa conscience. Etre chrétien jusqu’a en payer le prix. Jésus n’a pas vécu dans la facilité-Et nous ?. qui prétendons le suivre?", "page": 149, "kind": "p"}, {"id": "r27p4", "text": "Jésus partit pour la Galilée...", "page": 149, "kind": "h"}, {"id": "r27p5", "text": "Deux fois en quelques lignes Marc insiste sur ce «territoire» oti Jésus travaille : la « Galilée ». Ce mot n’a pas seulement un sens géographique. Pour Marc, cette province a une signification théologique. La Bible appelait cette contrée « Galilée des paiens» (Isaie 8/23 - I Macchab 5/15 -Matthieu 4/15). En effet, les invasions assyriennes et chaldéennes avaient entrainé un mélange de populations, et de nombreux paiens y vivaient. Dés lors, les Galiléens, reconnaissables a leur mauvais accent étranger (Matthieu 26/73), étaient déconsidérés par les autres juifs. En ce sens, la venue de Jésus en Galilée est un symbole. La Galilée s’oppose a Jérusalem, ot: les autorités juives orthodoxes tueront un jour Jésus. Chaque fois que Jérusalem sera mentionnée par Marc, ce sera en un sens c’hostilité 4 Jésus. En choisissant de précher « en Galilée des paiens», Jésus fait un acte missionnaire: il cherche le contact... Et Marc souligne cette option, lui qui écrivait son évangile 4 Rome, dans la mouvance de Pierre, et pour des convertis venus du paganisme.", "page": 149, "kind": "p"}, {"id": "r27p6", "text": "Ne nous arrive-t-il pas, au contraire, de nous enfermer dans nos milieux chrétiens, de redouter le contact du «monde», de vivre en ghetto? Jésus, lui, allait au devant du monde a évangéliser... cherchait les lieux ot il pourrait rencontrer l’étranger, celui qui ne pense pas comme nous, le «paien». Il y a eu, jadis, des époques de «civilisation chrétienne», ot! ’ensemble des structures: de la société étaient sous I’influence de lEglise (politique, éducation, ceuvres de charité, vie publique). Aujourd’hui, dans presque tous les pays du monde, les chrétiens sont une « minorité», et PEglise n’a plus le « leadership» (la direction) qui lui permettait d’imprimer sur la vie profane lempreinte de lidéal et des lois de Pévangile. Qu’arrive-t-il quand un chrétien doit vivre son christianisme au milieu d’une majorité de non-chrétiens ? Sa foi est sans cesse menacée, c’est vrai! Mais elle est aussi constamment provoquée a devenir plus solide. On pouvait peut-étre, jadis, étre chrétieén « comme ¢a», sans trop le vouloir, et sans trop le savoir, en se laissant porter par le milieu... aujourd’hui, sachant ce que c’est que de vivre «en paien», il faut « choisir» de « suivre JésusChrist». Au lieu de gémir sur cette situation, nous devrions y voir une invitation. C’est une situation de contact, ot nous pouvons voir le « plan de Dieu qui veut que la Bonne Nouvelle soit dite 4 tous les hommes. »", "page": 150, "kind": "p"}, {"id": "r27p7", "text": "Le chrétien ne peut plus, si jamais cela a été possible, étre chrétien « pour lui»: il Pest « pour les autres». La fonction de lEglise n’est pas d’étre tournée vers elle-méme, elle est «envoyée en mission vers le monde»: elle est, par Jésus, «en Galilée des paiens». Seigneur, entraine-nous a ta suite. Galilée, pays de mission. France, pays de mission. Terre entiére, pays de mission. Tel est le «choix» de Jésus.", "page": 150, "kind": "p"}, {"id": "r27p8", "text": "Proclamer la Bonne Nouvelle de Dieu...", "page": 151, "kind": "h"}, {"id": "r27p9", "text": "Voila encore un mot qui risque de glisser sur nous. Chaque dimanche nous entendons proclamer l’évangile, la bonne nouvelle. Pour en redécouvrir tout le sens, pour éprouver le choc psychologique de cette « prédication» de Jésus qui va remuer les foules de la Galilée des paiens, nous devrions sans doute traduire plut6t par « Joyeuse nouvelle». Jésus proclamait la joyeuse nouvelle! Ce mot, lui aussi, avait des racines bibliques. Il avait pris une signification religieuse et humaine au cours de l’exil A Babylone, au VIe siécle: pour les exilés qui avaient connu tant de souffrances et qui avaient tout perdu, un. prophéte (Isaie 40/9 - 52/7; Psaume 96/2) annongait la «joyeuse nouvelle» de la délivrance, de la fin de la captivité. Pour Marc, le mot « évangile de Dieu» désigne le « message pascal». Et c’est la Galilée qui est le lieu de cette annonce pascale. «Une fois ressuscité, je vous précéderai en Galilée» (Marc 14/28) (Marc 16/7). Est-ce que ma religion est «bonne» pour moi? Est-ce que, devant des incroyants d’aujourd’hui, jéprouve ma foi comme une «bonne nouvelle» a leur dire. La joyeuse nouvelle de la libération, du salut, de la paque! L’humanité captive sera délivrée du péché et de la mort.", "page": 151, "kind": "p"}, {"id": "r27p10", "text": "Les temps sont accomplis... Le Régne de Dieu est la...", "page": 151, "kind": "h"}, {"id": "r27p11", "text": "Dieu régne! ¢a y est! il passe a l’action.", "page": 151, "kind": "p"}, {"id": "r27p12", "text": "Voila encore un terme aux infinies résonances bibliques. Les prophétes avaient annoncé la «royauté effective de Dieu sur son peuple» (Michée 2/13 - Isaie 6/1.3, 43/15, Jérémie 3/17, 8/19 - Ezékiel 20/33, etc.) Et les psaumes du «régne de Dieu» (Psaumes 47, 93, 96, 99) chantaient a lavance cette intervention décisive et libératrice.", "page": 151, "kind": "p"}, {"id": "r27p13", "text": "Jésus annonce ici qu'il vient accomplir cela. La « cause de Dieu» va triompher. Les pauvres, les affamés, ceux qui pleurent ou sont écrasés, les pécheurs et les malades, vont étre délivrés (Luc 4/16. 30). Avec Jésus, Dieu est la, a oeuvre.", "page": 151, "kind": "p"}, {"id": "r27p14", "text": "«Les temps sont accomplis!» Le projet définitif de Dieu commence. Dieu vient combler ’humanité de sa Présence. Cette « proximité» de Dieu, ce « régne de Dieu» est encore caché, bien sir, mais il est «la».", "page": 151, "kind": "p"}, {"id": "r27p15", "text": "Convertissez-vous... et croyez a la Bonne Nouvelle...", "page": 152, "kind": "h"}, {"id": "r27p16", "text": "Cette proximité de Dieu, chacun de nous peut Paccueillir, a chaque instant. Comment? En faisant une sorte de volteface, en nous retournant de fond en comble, en nous « convertissant». Convertissez-vous! Changez de vie!", "page": 152, "kind": "p"}, {"id": "r27p17", "text": "Voila un sermon d’une extréme briéveté: deux verbes actifs... se convertir et croire! C’est tout. Et encore, ce ne sont pas deux actions différentes. La conversion consiste a «croire a la bonne nouvelle», a «croire en Jésus.»", "page": 152, "kind": "p"}, {"id": "r27p18", "text": "Les deux courts récits de vocations qui vont suivre en sont lillustration concréte.", "page": 152, "kind": "p"}, {"id": "r27p19", "text": "Passant au bord du lac de Galilée, Jésus vit Simon et son frére André en train de jeter leurs filets: c’étaient des pécheurs. Jésus leur dit: « Venez derriére moi. Je ferai de vous des pécheurs d’hommes.» Aussit6t, laissant 1a leurs filets, ils le suivirent.", "page": 152, "kind": "h"}, {"id": "r27p20", "text": "Marc ne cherche pas a nous donner une biographie réelle. Nous savons par lévangile de saint Jean que Jésus avait déja rencontré ces hommes au bord du Jourdain.", "page": 152, "kind": "p"}, {"id": "r27p21", "text": "Mais Marc veut montrer combien l’appel a la « conversion » est impératif et urgent. Il faut se mettre a «suivre». Jésus nest pas un jeune Rabbi (maitre) comme ces scribes qui réunissaient des disciples pour discuter, pour réfléchir, pour brasser des idées, pour enseigner la bonne doctrine. Jésus nest pas d’abord un maitre-a-penser, c’est un maitrea-agir : il exige de ses disciples non pas de bonnes oreilles et une bonne intelligence, mais du souffle pour le suivre et marcher avec lui! L’évangélisation ne va pas étre de tout repos. Le récit de saint Marc va étre tout rempli de « voyages»: Jésus est un maitre itinérant.", "page": 152, "kind": "p"}, {"id": "r27p22", "text": "Et le signe de cet « engagement» 4a la suite de Jésus, c’est* qu’il faut quitter quelque chose! Au filet de la Bonne Nouvelle, voila donc les pécheurs eux-mémes «captivés»! Ils sont pris. Ils ne le quitteront plus. C’est déja PEglise qui se prépare.", "page": 152, "kind": "p"}, {"id": "r27p23", "text": "Un peu plus loin, Jésus vit Jacques et son frére Jean... qui étaient aussi dans leur barque et préparaient leurs filets. Jésus les appela aussitét. Alors, laissant dans la barque leur pére avec ses ouvriers, ils partirent derriére Lui.", "page": 153, "kind": "h"}, {"id": "r27p24", "text": "Voici encore une merveilleuse «image» concréte, une «icOne» toute remplie de symboles parlants. La foi ne porte pas, avant tout, sur une doctrine, sur des idées, mais sur une personne! Lorsque Jésus demande de « croire a la Bonne Nouvelle», cela veut dire qu'il faut « adhérer a Lui, le suivre»: il s’agit de s’attacher a Sa personne.", "page": 153, "kind": "p"}, {"id": "r27p25", "text": "Comme il est bouleversant de penser que « Dieu a besoin des hommes»! Voici donc les quatre premiers hommes qui vont étre associés a la grande entrep..se de sauvetage divin que Jésus commence: pour le « régne de Dieu», il faut des hommes. Chaque chrétien devrait reconnaitre, ici, son propre «appel», sa propre vocation.", "page": 153, "kind": "p"}, {"id": "r27p26", "text": "Le métier de pécheur est un rude travail. Evangéliser, proclamer la bonne nouvelle est un rude travail. Etre « pécheur d’hommes», cela ne va pas de soi! Ne nous faisons pas dillusion. Les hommes ne sont pas des poissons! Ils ont une liberté. Que de patience il faudra pour la mission! « Maitre, nous avons peiné toute la nuit sans rien prendre» (Luc 5/5). — «Malgré tout, sur ta parole, je relancerai le filet.»", "page": 153, "kind": "p"}, {"id": "r27p27", "text": "Mais qui est donc Jésus? pour nous lancer dans une telle aventure.", "page": 153, "kind": "p"}, {"id": "r27p28", "text": "Jésus, notre sauveur, notre vie éternelle!", "page": 153, "kind": "p"}]}, {"id": 28, "title": "4e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 154, "ref": "Marc 1/21.28", "paragraphs": [{"id": "r28p1", "text": "Ils pénétrent dans Capharnaiim...", "page": 154, "kind": "h"}, {"id": "r28p2", "text": "Tel est le texte exact de saint Marc. Ce «ils», qui semble indéfini, ce pronom au pluriel, est trés significatif. Jésus vient a peine d’appeler quatre disciples. C’était la page méditée dimanche dernier. Alors, Jésus n’est plus seul. Cest un groupe de cing hommes qui « pénétre» dans une ville du bord du lac de Galilée. Désormais, Marc nous les montrera toujours ensemble: ils forment un groupe, « Jésus et ses disciples.» Saint Paul parlera, en langage plus théologique, du « Corps du Christ» dont nous sommes les «membres». Marc suggére la méme réalité, avec un autre procédé de langage, plus concrétement. Ce que Jésus va faire, dans un instant, c’est_« Lui-et-ses-disciples » qui vont le faire! C’est Poeuvre de lEglise.", "page": 154, "kind": "p"}, {"id": "r28p3", "text": "Capharnaiim...", "page": 154, "kind": "h"}, {"id": "r28p4", "text": "Le symbole méme de cette « Galilée des paiens», ce terrain qui sera le lieu privilégié de l’évangélisation, parce qu'il ena spécialement besoin. Capharnatim! Comme si nous disions, aujourd’hui, Marseille, ou Amsterdam, ou HongKong! Un port. Un de ces lieux de passage, de mélange de races. En y pénétrant, «ils» reconnaissent les marins, les commercants, les paysans... les visages basanés des nomades du désert proche... les haillons des miséreux et les riches vétements des bourgeois romains... les soldats qui font la police pour le compte de l’étranger... et ce Matthieu, le publicain honni, qui récolte limpét de occupant. Voila le monde bigarré que Jésus a connu, et qu'il a choisi. Un vrai «capharnatim», dit-on encore aujourd’hui, pour parler d’un entassement d’objets hétéroclites.", "page": 154, "kind": "p"}, {"id": "r28p5", "text": "Aussit6t, le jour du Sabbat, il se rendit a la synagogue...", "page": 155, "kind": "h"}, {"id": "r28p6", "text": "La caméra de Marc, ayant filmé le «groupe», fait maintenant un «gros plan», centré sur celui qui donne l’impression de conduire le groupe, un certain «nazaréen», jusquici charpentier d’un bourg de Iintérieur, du nom de Jésus.", "page": 155, "kind": "p"}, {"id": "r28p7", "text": "Marc va, maintenant, nous dépeindre « une journée type.» de ce Jésus et de son groupe, la fameuse journée de Capharnaiim, en y décrivant quatre «actions» caractéristiques de tout le ministére de Jésus (et de |’Eglise.) : 1° Jésus enseigne ; 2° Jésus libére-des_démons ; 3° Jésus guérit les malades ; 4° Jésus prie. Et tout cela va se dérouler en une journée: d’un lever de soleil 4 l'autre, d’un matin a l'autre matin (Marc 1/21. 35). Est-ce que je me reconnais dans cette journée de Jésus? dans cette journée type du chrétien? Est-ce que je fais cela chaque jour, avec Jésus?", "page": 155, "kind": "p"}, {"id": "r28p8", "text": "Ce condensé significatif commence, et ce nest pas par hasard, « dans la Synagogue, un jour de Sabbat». C’est le lieu officiel du judaisme, la Maison pour tous, la Maison de la Loi. Jésus va, d’emblée, a l’endroit ot se rassemblent le plus de gens. Il cherche le contact.", "page": 155, "kind": "p"}, {"id": "r28p9", "text": "Et la, il enseignait. On était frappé de son enseignement, car il enseignait en homme qui a autorité, et non pas comme les scribes... ’", "page": 155, "kind": "h"}, {"id": "r28p10", "text": "Il y a trois fois dans la méme ligne, le mot «didaké» «enseignement». Pour Jésus, c’est lenseignement, la « parole», qui est premiére! L’exorcisme proprement dit va étre inclus entre deux affirmations de l'enseignement de Jésus. Voild donc le premier réle de Jésus (et de ’Eglise). J’essaie d’imaginer. Je me mets, par la pensée, dans cette assistance qui écoute: cest Jésus qui fait le sermon aujourd’hui. Marc ne dit pas le contenu de l’homeélie. Il l’a déja dit en quatre phrases, dans la page qui précéde: «les temps sont accomplis... le Régne de Dieu est tout proche... convertissez-vous... croyez a la Bonne Nouvelle...» Ce qui intéresse Marc, c’est la réaction des auditeurs: ils sont littéralement séduits... Jésus est un orateur au grand sens du terme... on est «frappé» par sa parole. Et ce nest pas d’abord un effet artificiel, le ton, qui compte. Mais, comment résister a cette parole qui atteint le coeur, qui pose les vraies questions que chacun se pose et qui apporte une réponse qu’on attendait parce qu'elle est « vraie» jusqu’au fond de ’étre!", "page": 155, "kind": "p"}, {"id": "r28p11", "text": "Saint Jean, solennellement, a commencé sa « Bonne Nouvelle», en disant de Jésus: «Au commencement était le Verbe, et le Verbe était Dieu, et le Verbe s’est fait chair. » Marc, en un tout autre langage, nous dit exactement la méme réalité. Jésus, Parole d’un Dieu qui se révéle, Parole surprenante, Parole décisive... Quel est mon amour de la parole de Jésus, qui est révélation de Dieu? Quel temps est-ce que je passe a méditer la parole, l’enseignement de Jésus ?", "page": 156, "kind": "p"}, {"id": "r28p12", "text": "Les «scribes» traditionnels ne faisaient que répéter une lecon apprise. Jésus, lui, se fait remarquer d’emblée par «Pautorité» de sa parole, qui vient de lintérieur de luiméme. Jésus parle «de» Dieu, oui, mais Dieu, c’est «Sa» vie! Et ca se sent, quand quelqu’un parle avec une certaine conviction: «il y croit!» Il s’engage dans sa parole. Ce n’est pas du «baratin», ou du «bla-bla-bla», comme disent les jeunes... c’est du vrai. Oui, Jésus s’engageait personnellement dans ce qu'il disait. A la différence des scribes... Et moi, quand je parle de Dieu, de lEglise, est-que ¢a se sent que jy crois ? Suis-je un « scribe», ou un « teémoin» ? Est-ce que je me contente de répéter des lecons apprises, comme de l’extérieur? Ou bien est-ce que la Parole de Dieu est devenue « mienne», intériorisée, la « chair de ma chair» ?", "page": 156, "kind": "p"}, {"id": "r28p13", "text": "Or, il y avait dans leur synagogue un homme tourmenté par un esprit mauvais, qui se mit a crier...", "page": 156, "kind": "h"}, {"id": "r28p14", "text": "Nous voila bien dans le contexte de POrient! Le film de Zéffirelli a parfaitement traduit cette scéne, ol ca remue, ou ¢a crie, oti la violence se déchaine. Marc n’hésite pas a donner de la couleur a cette scéne qui explose: c’est d’abord le «cri» qui éclate en plein sermon de Jésus! Et puis « Jésus le menaca vivement»: ¢a chauffe! Et c’est en le «secouant avec violence et en poussant un grand cri» que le démon sort!", "page": 156, "kind": "p"}, {"id": "r28p15", "text": "Vingt-trois fois, dans le Nouveau Testament, il est question de l’« esprit impur», que le lectionnaire traduit par « esprit mauvais), car, en fait, le mot «impur», ici, n’a pas le sens moderne de «sexuel»: il s'agit seulement de limpureté comme lopposé de la « sainteté». Marc utilisera, a lui seul, onze fois ce terme d’ «esprit impur». L’ «esprit mauvais», cest «celui qui soppose a la sainteté de Dieu»: nous le voyons parfaitement décrit ici. Il «tourmente» ’homme! II lempéche d’étre vraiment homme. Cet homme «tourmenté», c’est le symbole méme de homme <aliéné», « possédé», sur qui une sorte de force inhumaine a mis la main, en l’enchainant, littéralement.", "page": 157, "kind": "p"}, {"id": "r28p16", "text": "Devant cet « exorcisme » de Jésus, nous pouvons étre tentés de deux attitudes, au fond assez semblables, et qui nous empécheraient de «comprendre en profondeur» cette scéne: la premiére attitude consisterait a se rebuter et a rejeter ce texte étrange comme désuet et anachronique... la deuxiéme attitude, au contraire, consisterait a se délecter dans le merveilleux superficiel du texte (a la maniére du cinéaste du film «!Exorciste», qui met en jeu toute Phorreur théatrale cinématographique). En fait, Marc commence I’activité de Jésus par un exorcisme, parce quill y voit le «condensé» parfait de toute son ceuvre: Jésus vient libérer homme esclave des puissances qui laliénent... le monde change de maitre... c’est le Régne de Dieu qui commence!", "page": 157, "kind": "p"}, {"id": "r28p17", "text": "« Que nous veux-tu, Jésus de Nazareth? Je sais fort bien qui tu es: le Saint de Dieu.", "page": 157, "kind": "h"}, {"id": "r28p18", "text": "Il s'agit bien, effectivement, de découvrir la véritable identité de Jésus. Il s’agit de passer de ce titre anodin: «Jésus le nazarénien», a ce titre prestigieux: «le Saint de Dieu». Jésus nest pas un petit exorciste de village comme il y en avait un peu partout alors, dans le monde juif comme dans le monde paien..., une sorte de magicien ou de sorcier. Entre le « Mauvais» et « Dieu», il y a incompatibilité totale : le Satan fait une vraie déclaration de guerre. De quoi te méles-tu ? Qu’est-ce qu'il y a de commun entre toi et moi? Que me veux-tu?» Tel est le «cri» du démon. Et nous? Concevons-nous aussi notre vie chrétienne, avec Jésus, comme un grand combat libérateur ? Ceux qui font partie du «groupe de Jésus» doivent s’y attendre. Les forces adverses se déchainent contre Lui. Suis-je combattant avec Jésus? De quelle aliénation, de quel mal ai-je a libérer mes fréres, et moi-méme ?", "page": 157, "kind": "p"}, {"id": "r28p19", "text": "Jésus linterpella vivement: «Silence! Sors de cet homme!»", "page": 158, "kind": "h"}, {"id": "r28p20", "text": "Le mot grec ici utilisé signifie «museler», «menacer», « rabrouer»... Il ya le méme mot, face a la tempéte déchainée sur le lac (Marc 4/39). Toute la puissance du ressuscité qui triomphe des puissances infernales s’exprime dans ce mot: le mal est vaincu quand Dieu parait.", "page": 158, "kind": "p"}, {"id": "r28p21", "text": "Nous remarquons un détail significatif. Alors que les hommes s‘interrogent et s’étonnent de la « personnalité » de Jésus... ce sont les démons qui savent. Seraient-ils plus subtils que les hommes, par leur nature spirituelle? Mais Jésus les fait taire: « Tais-toi! Silence!» La vraie identité de Jésus ne peut se révéler que progressivement: dire trop vite que Jésus est «le Saint de Dieu», le «Fils de Dieu», peut n’étre qu'une opération diabolique. Ce n’est que devant la croix qu’un « homme», un paien, le centurion de service, prononcera valablement ces mots (Marc 15/39).", "page": 158, "kind": "p"}, {"id": "r28p22", "text": "Saisis de frayeur, tous s’interrogeaient: « Qu’est-ce que cela veut dire? Voila un enseignement «nouveau», proclamé avec «autorité»! Il commande méme aux esprits mauvais. Et ils lui obéissent...»", "page": 158, "kind": "h"}, {"id": "r28p23", "text": "AUJOURD’HUI encore, Jésus, c’est deux choses, véritablement divines:", "page": 158, "kind": "p"}, {"id": "r28p24", "text": "— ce sont des « Paroles», un enseignement, un message... cest du «neuf» pour l’humanité ;", "page": 158, "kind": "p"}, {"id": "r28p25", "text": "— ce sont des «Signes», des «actes de Jésus, des sacrements... la puissance de Dieu».", "page": 158, "kind": "p"}, {"id": "r28p26", "text": "N’oublions pas que dans le sacrement de notre baptéme, nous avons, nous-mémes, été « exorcisés» par Jésus: et ce «signe sacramentel» est permanent: il est actualisé dans chaque eucharistie... ot Jésus nous «parle», et nous «sauve» du mal.", "page": 158, "kind": "p"}]}, {"id": 29, "title": "5e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 159, "ref": "Marc 1/29.39", "paragraphs": [{"id": "r29p1", "text": "Nous continuons, aujourd’hui, la méditation de la « Journée de Capharnatim», cette premiére journée de ministére public de Jésus, ot! nous voyons qu'il enseigne, qu’il libére homme de ses démons,..qu’il guérit' les malades, et qu'il prie... un résumé de toute l’activité chrétienne.", "page": 159, "kind": "p"}, {"id": "r29p2", "text": "En quittant la Synagogue de Capharnaiim, Jésus, accompagné de Jacques et de Jean, se rendit chez Simon et André.", "page": 159, "kind": "h"}, {"id": "r29p3", "text": "Aprés avoir enseigné en étonnant tout le monde... aprés avoir libéré un pauvre homme possédeé... Jésus quitte donc la Synagogue, lieu public, et s’en va vers une maison privée, celle des deux fréres Simon et André. J’imagine Jésus marchant dans la rue, entouré de ses quatre disciples, car Jacques et Jean sont la aussi. Aujourd’hui encore, l’action de Dieu s’exerce partout, dans tous les secteurs de la vie: religieuse et profane, publique et privée. Seigneur, tu es avec nous dans nos églises, tu es avec nous dans nos rues, sur nos places publiques, dans nos maisons.", "page": 159, "kind": "p"}, {"id": "r29p4", "text": "Or, la belle-mére de Simon était au lit avec de la fiévre.", "page": 159, "kind": "h"}, {"id": "r29p5", "text": "On est frappé, dans l’évangile, du grand nombre de guérisons de malades que Jésus opére. Jadis, la maladie avait une signification religieuse, et les quérisseurs étaient les prétres. De nos jours, la maladie et la quérison relévent de la science médicale. Pourtant, malgré toutes les améliorations de la médecine, la maladie et les souffrances qui Paccompagnent continuent a placer ’homme dans une insécurité redoutable. Au sein de notre civilisation technicienne, un «signe» subsiste de la faiblesse de la condition humaine, soumise aux aléas de l’inattendu et de limprévisible. Qui ne redoute, au fond de soi, certaines maladies dont on n’ose pas prononcer le nom? La maladie contredit le désir de la stabilité et de la solidité qui habite tout homme. II suffit d’une bonne fiévre pour terrasser homme le plus fort et ’obliger a cesser son travail. Mais il y a plus grave : nous savons tous, au fond de nous-mémes, quill y aura un jour une maladie dont les médecins ne nous guériront pas. Et toute maladie porte en elle ce «signe» de la mort, symbole inéluctable de la fragilité de
