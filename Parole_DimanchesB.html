<script id="bookData" type="application/json">{"title": "Parole de Dieu pour chaque dimanche", "author": "Noël Quesson", "year": "Année B", "sections": [{"id": 0, "title": "Préface", "group": "Introducción", "page": 9, "ref": "", "paragraphs": [{"id": "r0p1", "text": "UN RENOUVEAU DE L’EGLISE.", "page": 9, "kind": "h"}, {"id": "r0p2", "text": "L’une des réformes les plus bénéfiques du Concile Vatican II a été de restituer aux chrétiens l’évangile. Bien sir, les fidéles n’en ont jamais été totalement privés. Mais la liturgie du dimanche, seule source d’écoute de la Parole de Dieu pour la plupart, était organisée de telle maniére que lon entendait seulement une soixantaine de courtes pages d’évangile, toujours les mémes, tous les ans. Maintenant, avec la répartition liturgique sur « trois ans», c’est l’ensemble de l’évangile qui est proposé. La Premiére année (A) nous écoutons Matthieu. La Seconde année (B) nous écoutons Marc. Et la Troisiéme année (C) nous écoutons Luc. Quant a l’évangile de Jean, il structure le temps pascal chaque année.", "page": 9, "kind": "p"}, {"id": "r0p3", "text": "EQUIPES LITURGIQUES, GROUPES DE PRIERE, ORAISON.", "page": 9, "kind": "h"}, {"id": "r0p4", "text": "Nous n’avons pas encore récolté tous les fruits de cette «semence» jetée en terre. Mais déja les « moissons blanchissent», comme disait Jésus. Pour tous ceux qui croient a la puissance de germination de I’évangile, des temps nouveaux sont en train de venir, qui vont renouveler la face de l’Eglise : la faim et la soif de la Parole ont toujours été, dans l/histoire, le prélude des grands renouveaux spirituels. AUJOURD'HUI, ils sont nombreux les chrétiens avides de lire la Bible, et de méditer. Dans la plupart des paroisses, des « équipes liturgiques» se réunissent réguliérement pour préparer les célébrations dominicales, et la Vill Préface", "page": 9, "kind": "p"}, {"id": "r0p5", "text": "base essentielle de ces préparations est la lecture «en commun», et le «partage» des textes de l’évangile. De nombreux «groupes de priére» sont nés, surtout composés de jeunes, et la base principale de ces priéres est «l’expression a haute voix», devant tous, d’une «méditation» sur un texte d’Ecriture. Et puis, de plus en plus nombreux sont les chrétiens qui se lancent dans I|’Oraison, c’est-d-dire la «priére dans l’Esprit», réguliére, tendant a devenir quotidienne.", "page": 10, "kind": "p"}, {"id": "r0p6", "text": "LA MESSE, CCEUR DE LA VIE.", "page": 10, "kind": "h"}, {"id": "r0p7", "text": "C’est en pensant a tous ces chrétiens de nos paroisses que ce livre a été écrit, semaine aprés semaine. Curé de la cathédrale d’Angers, je sentais le besoin spirituel de tous ceux qui, chaque dimanche, quittent leurs. maisons, leurs professions, pour venir a la messe. Le monde dans lequel ils vivent est un monde profondément marqué par le matérialisme, lathéisme, lindifférence. Pour eux, sans rien oublier de leurs soucis et de leurs joies, qui sont ceux de tout le monde, ils viennent a leucharistie comme on marche vers une source dans le désert, selon l'image du Petit Prince de Saint Exupéry. Ils disent souvent que la messe est le «coeur» de leur semaine... le centre animateur qui répand le sang dans tout le reste de leurs occupations humaines. Souvent, ils utilisent image de la « respiration» : la, au moins, on respire... comme si, dans le monde ou ils vivent, lair, effectivement, se raréfiait. Quant a ceux qui ont de lourdes responsabilités, familiales, professionnelles, politiques, apostoliques, ils parlent parfois en termes de «nourriture»: il faut alimenter notre action... nous avons besoin de nourrir notre vie pour étre plus forts dans nos engagements, dans le témoignage pour le Christ.", "page": 10, "kind": "p"}, {"id": "r0p8", "text": "COMMENT EST NE CE LIVRE.", "page": 10, "kind": "h"}, {"id": "r0p9", "text": "Pour répondre a ces attentes, chaque dimanche, a la cathédrale d’Angers, une feuille polycopiée était a la disposition des fidéles : pendant trois années consécutives, sans qu’a aucun moment l’appétit ne baisse, ce sont mille Préface IX", "page": 10, "kind": "p"}, {"id": "r0p10", "text": "feuilles de méditation d’évangile qui ont été prises et se sont donc répandues dans toute la ville. Beaucoup d’hommes et de femmes, beaucoup de jeunes, m’ont dit quils relisaient, dans la semaine, ces commentaires pour sen imprégner jour aprés jour. C’est ainsi que l’évangile entendu le dimanche précédent leur devenait familier. La pensée de Jésus devenait la leur. La Galilée, cétait leur province a eux. Capharnatim, c’était leur ville. Le Golgotha, cela devenait peu a peu une «petite colline» dans un coin de leurs vies marquées d’épreuves. Et le Tombeau vide de la Paque, c’était une expérience de surgissement continuel : ils sentaient bien que la vie jaillit de toutes les morts assumées. Cette expérience vécue, prometteuse de tant de joies, devient maintenant ce livre.", "page": 11, "kind": "p"}, {"id": "r0p11", "text": "Bien d’autres livres semblables existent déja. Pourquoi en écrire un de plus? Je voudrais, ici, rapidement, expliciter quelques options qui caractérisent « Parole de Dieu pour chaque dimanche».", "page": 11, "kind": "p"}, {"id": "r0p12", "text": "Le texte intégral de l’évangile.", "page": 11, "kind": "p"}, {"id": "r0p13", "text": "Sauf exception, le texte évangélique est cité en son entier, sans avoir.besoin de se reporter 4 un autre livre. Une typographie spéciale met en relief ces mots évangéliques pour les faire ressortir. On peut ainsi se reporter sans cesse a la Parole de Dieu, qui est prioritaire. Les commentaires, a la limite, ne sont qu’accessoires, pour aider a une meilleure compréhension, et pour suggérer parfois des pistes d’actualisation ou de priére.", "page": 11, "kind": "p"}, {"id": "r0p14", "text": "Un commentaire bref.", "page": 11, "kind": "p"}, {"id": "r0p15", "text": "Chaque dimanche recouvre exactement la méme surface de commentaire. C’est, évidemment, un procédé qui peut apparaitre factice, et qui contient des contraintes évidentes: certaines pages d’évangile, plus denses, ou plus longues, mériteraient des commentaires plus développés. Mais les livres d’Exégése savante sont ld pour ceux qui veulent approfondir. Ce livre, sous faible volume, veut permettre aux chrétiens «pressés» que nous sommes Xx Préface", "page": 11, "kind": "p"}, {"id": "r0p16", "text": "souvent, de découvrir un essentiel. Il ne faut pas plus de dix minutes pour lire chaque dimanche. Il peut, cependant, étre souhaitable d’y passer un peu plus de temps...", "page": 12, "kind": "p"}, {"id": "r0p17", "text": "A mi-chemin entre l’étude savante et la priére spontanée.", "page": 12, "kind": "p"}, {"id": "r0p18", "text": "La science exégétique a fait d’énormes progrés depuis quelques décennies. Et certains « consensus» se font jour sur le sens authentique a donner a tel ou tel texte. Mais ces études savantes sont, la plupart du temps, publiées dans des collections difficiles et peu répandues dans le grand public. De plus, elles traitent parfois de questions importantes, scientifiquement parlant, mais qui n’ont pas toujours un intérét spirituel immédiat. J’ai choisi, personnellement, l’option pastorale suivante : aprés avoir étudié l’ensemble de cette production exégétique, en extraire ce qui me semble nourrissant pour la priére, et pour la vie du chrétien d’aujourd’hui. C’est donc, délibérément, un effort de vulgarisation, ou, plus exactement, dinitiation. C’est pour cela que jai renoncé a toute référence autre que la Bible, et a toute note en bas de page, pour alléger la lecture.", "page": 12, "kind": "p"}, {"id": "r0p19", "text": "Des paragraphes courts, prenant lévangile «phrase par phrase ».", "page": 12, "kind": "p"}, {"id": "r0p20", "text": "Ce procédé pédagogique permet, a ceux qui le désirent, de s’y prendre a plusieurs fois pour méditer un évangile. On peut, par exemple, prendre seulement un ou deux paragraphes, le premier jour. Et ne lire la suite que les jours suivants. Certains répartissent ainsi l'ensemble de I’évangile du dimanche précédent sur toute la semaine. Faisant, il y a quelques années, une Session Biblique a Jérusalem, jai découvert que ce type de commentaire phrase a phrase était celui qu’utilise traditionnellement le Talmud juif. Le plus célébre de ces commentaires de la Bible est celui de Rabbi Chelomo ben Itzhak, en abréviation Rachi, un juif francais qui a vécu en France da Troyes en Champagne, de 1040 a 1105. Depuis neuf siécles, l’enseignement de Rachi est étudié passionnément chaque Préface Xl", "page": 12, "kind": "p"}, {"id": "r0p21", "text": "Sabbat par tous les juifs pieux. Or les livres de ce grand commentateur sont, tout simplement, une explication mot par mot, phrase par phrase, de chaque détail des Livres Saints. Israél est convaincu que pas un détail n’est inutile ou par hasard. Et cela donne un commentaire d’une saveur exceptionnelle, comme un amoureux qui caresse chaque Parole de Dieu, comme un chercheur qui veut extraire d'une expérience tout ce qu'il peut en sortir, comme un savant qui voudrait tout découvrir des secrets cachés dans un «corps».", "page": 13, "kind": "p"}, {"id": "r0p22", "text": "Les Péres de l’Eglise, comme les Talmudistes d’Israél, ont passionnément exploré chaque ligne de la Parole de Dieu, en y cherchant avant tout une nourriture spirituelle. Sans prétendre étre a la hauteur de ces grands ancétres, il nous est bon, sans doute, dvutiliser humblement leur méthode des «petits pas».", "page": 13, "kind": "p"}, {"id": "r0p23", "text": "Finalement, la grande expérience a faire, c’est de découurir un jour que Dieu est vivant AUJOURD’HUI, que Jésus est vivant et notre contemporain par son Esprit et par son Corps ressuscité. Ainsi, quand je lis ’'Ecriture, je ne fais pas de l'archéologie, je ne me reporte pas deux mille ans en arriére, jentends «quelqu’un» qui a toutes sortes de bonnes nouvelles a me dire pour ma VIE D’AUJOURD'HUI, la mienne et celle de ce monde ou je suis. Ca peut changer ma vie de me mettre a L’écouter, et de Lui répondre.", "page": 13, "kind": "p"}, {"id": "r0p24", "text": "Noél QUESSON.", "page": 13, "kind": "p"}]}, {"id": 1, "title": "1er Dimanche de l’Avent", "group": "Adviento", "page": 15, "ref": "Marc 13/33.37", "paragraphs": [{"id": "r1p1", "text": "Prenez garde, veillez...", "page": 15, "kind": "h"}, {"id": "r1p2", "text": "Ce mot « veillez » est répété quatre fois par Jésus, au cours de cet évangile.", "page": 15, "kind": "p"}, {"id": "r1p3", "text": "C’est le mot d’ordre de Jésus, juste avant son départ, car la Passion commence, en saint Marc, immédiatement aprés cette page. Seigneur, tu insistes, tu nous demandes de rester «vigilants». A la veille de Gethsémani, tu savais qu’aucun de tes disciples ne tiendrait le coup. Et pourtant, tu essaies de les prémunir contre l'abandon: veillez, veillez, veillez, veillez !.", "page": 15, "kind": "p"}, {"id": "r1p4", "text": "Tu nous redis, Seigneur, la méme recommandation insistante.", "page": 15, "kind": "p"}, {"id": "r1p5", "text": "Prenez garde...", "page": 15, "kind": "h"}, {"id": "r1p6", "text": "Jésus avait souvent utilisé ce mot, dans un contexte de «combat». La vigilance ne peut pas se faire sans lutte. C’est une sorte d’attention extréme, dans un cas de danger. Il faut «prendre garde» pour entendre la Parole de Dieu (Marc 4/12), sinon on passe a cété. Il faut « prendre garde» pour se défendre du « levain des pharisiens », sinon il s'infiltre en nous sans que nous nous en rendions compte (Marc 8/15, 12/38). Il faut «prendre garde» de ne pas croire ceux qui prédisent l'avenir comme sills le connaissaient (Marc 13/5, 13/23).", "page": 15, "kind": "p"}, {"id": "r1p7", "text": "Saint Paul, lui aussi, utilisera tout un langage dramatique pour parler de la vigilance. Il parlera de «s’arracher au sommeil» (Romains 13/11). C’est comme si nous étions tous tentés d’engourdissement : nous songeons a l’abrutissement qui nous vient quand nous abusons des somniferes. Oui, nous sommes guettés par assoupissement de notre conscience: le réflexe de défense qui ne fonctionne plus... comme le conducteur qui a trop bu d’alcool, et qui se jette dans l’obstacle. Alors, il faut «s’arracher » au sommeil! Et, pour parler de la « vigilance», Paul n’hésite pas a employer tout un vocabulaire guerrier: les «armes» de la vigilance (Romains 13/12, Ephésiens 6/10, I Thessaloniciens 5/6.8).", "page": 15, "kind": "p"}, {"id": "r1p8", "text": "Seigneur Jésus, tu me répétes, AUJOURD'HUI, « prends garde». La vie chrétienne implique une lutte contre des puissances, qui risquent d’étre plus fortes que nous. Garde-nous vigilants, Seigneur, jusqu’a ’heure ot tu paraitras.", "page": 16, "kind": "p"}, {"id": "r1p9", "text": "Car vous ne savez pas quand viendra le moment...", "page": 16, "kind": "h"}, {"id": "r1p10", "text": "Les disciples de Jésus lui avaient posé la question: « Quand est-ce que tout cela arrivera, quel sera le signe que tout cela va finir» (Marc 13/4). Jésus n’a pas répondu a cette question. Des prophéties de toutes sortes, a toutes les époques, essaient de prédir la fin du monde. Jésus a répondu, une fois pour toutes: «Vous ne savez pas le moment.» Jésus ne veut pas que nous révions, ni du passé, ni de l’avenir: il nous demande de nous concentrer sur le « temps présent », sur !AUJOURD’HUI: veillez donc, car vous ne savez pas... soyez toujours préts.", "page": 16, "kind": "p"}, {"id": "r1p11", "text": "Le Pére Charles de Foucault avait pris comme devise: « Essaie de vivre chaque jour comme si tu allais mourir ce soir. »", "page": 16, "kind": "p"}, {"id": "r1p12", "text": "Il en est comme d’un homme parti en voyage: en quittant sa maison, il a donné tout pouvoir a ses serviteurs, fixé a chacun son travail...", "page": 16, "kind": "h"}, {"id": "r1p13", "text": "Dieu apparemment « absent», comme un homme parti en voyage! Image saisissante, qui exprime a la perfection le sentiment que nous éprouvons: que tu es loin, Seigneur! Tu es le tout-autre! Mais, nous notons que, pour Jésus, ce temps de l’absence n’est pas d’abord un temps de malheur ou d’angoisse, mais un temps de responsabilité : chacun a recu une charge, chacun a recu un travail. On aurait presque limpression que ce «Maitre» est parti exprés, pour donner de limportance a ses serviteurs, pour qu’ils ne laient pas toujours sur le dos: allez, prenez vos responsabilités, vous n’étes plus des enfants, décidez, réfléchissez, je vous fais confiance... je vous donne «tout pouvoir»! Seigneur, rends-nous dignes de cette responsabilité qui est la ndtre, que tu nous as confiée: dans notre famille, dans notre métier, dans la cité, dans telle ou telle association, dans lEglise.", "page": 16, "kind": "p"}, {"id": "r1p14", "text": "En partant, il a recommandé au « portier » de veiller...", "page": 17, "kind": "h"}, {"id": "r1p15", "text": "La nuit, le « portier » a une importance particuliére, puisque cest a lui quill appartient de «veiller» tout spécialement, pour défendre la maison des attaquants éventuels, ne pas ouvrir a n'importe qui, et étre le premier a ouvrir au maitre quand il reviendra. Saint Marc a lhabitude de distinguer le réle de Pierre dans le groupe des Douze. En distinguant le « portier» des autres «serviteurs», Jésus suggére que les Pasteurs de l’Eglise sont trés spécialement invités a la « vigilance»: Pierre, le pape, les évéques, sont les premiers responsables de la vigilance de tout le «peuple de Dieu», comme le portier qui veille sur toute la maison. Seigneur, je te prie pour ceux qui ont ce réle dans l’Eglise d’AUJOURD'HUI.", "page": 17, "kind": "p"}, {"id": "r1p16", "text": "Veillez donc, car vous ne savez pas quand le maitre reviendra...", "page": 17, "kind": "h"}, {"id": "r1p17", "text": "Jésus a parlé du temps de l’absence... Il annonce aussi le temps du retour... Nous allons vers cette rencontre. Un jour je te verrai, face a face, et je te connaitrai vraiment, comme je suis connu (I Corinthiens 13/12). La vie chrétienne est une marche vers le moment de la rencontre.", "page": 17, "kind": "p"}, {"id": "r1p18", "text": "Le maitre reviendra... le soir, ou 4 minuit, au chant du coq, ou le matin...", "page": 17, "kind": "h"}, {"id": "r1p19", "text": "Il est curieux de remarquer que Jésus ne suggére un retour que de nuit! Pourtant, en Orient jadis, A cause du danger des routes, on ne voyageait pratiquement jamais la nuit. Ce détail, un peu invraisemblable, a une signification symbolique profonde, qui remplit toute la Bible: la « nuit», c’est le temps des ténébres, le temps de la « puissance des ténébres» (Luc 22/53, Marc 14/49, Ephésiens 6/12). La nuit, cest donc bien le temps de la tentation, le temps de Pépreuve... C’est la nuit surtout qu’il faut étre « vigilant »! L’Ancien Testament attendait le temps du Messie comme une époque oti les ténébres prendraient fin, pour laisser place a la lumiére. « Veilleur, ot en est la nuit», interrogeait le prophéte, pour exprimer son désir (Isaie 21/11). Et saint Paul, pour redonner l’espérance, disait: «La nuit est avancée, le jour est tout proche» (Romains 13/12). Pour annoncer Noél, a la messe de nuit, ’Eglise nous chante le merveilleux poéme d'saie (9/1): «Le peuple qui marchait dans les ténébres a vu se lever une grande lumiére.» Et nous chantons, pendant le temps de Avent: Peuples qui marchez dans la longue nuit, le jour va bientdét se lever... Il est temps de relever la téte!", "page": 17, "kind": "p"}, {"id": "r1p20", "text": "Veiller dans la nuit. Veiller dans les difficultés... Garder lespérance méme quand on est dans le noir... Tenir bon quand tout semble s’écrouler. Aube nouvelle dans notre nuit, pour sauver son peuple, Dieu va venir. C’est la nuit qu’il est beau de croire a la lumiére. On sait tout le parti que saint Jean de la Croix a tiré de ce théme: Dieu est a, source cachée, présente éternellement, mais c’est de nuit.", "page": 18, "kind": "p"}, {"id": "r1p21", "text": "Au chant du coq...", "page": 18, "kind": "h"}, {"id": "r1p22", "text": "Lallusion de Marc, secrétaire particulier de Pierre, est directe. A la veille méme de sa Passion, a la veille de Gethsémani, ot Pierre s’endormira au lieu de veiller, a la veille de cette nuit tragique ot! le chant du coq rappellera a Pierre qu’il a manqué de vigilance (Marc 14/72), Jésus dit au «portier» de lEglise de veiller. Mais nous savons qu'il y manquera. Oh! le péché de Pierre, le reniement de Pierre, au chant du coq! Comme cela nous souligne que l’Eglise est humaine. Et comme cela nous invite 4 ne pas nous enorgueillir devant les faiblesses de l’Eglise.", "page": 18, "kind": "p"}, {"id": "r1p23", "text": "Il peut arriver a limproviste", "page": 18, "kind": "h"}, {"id": "r1p24", "text": "Dieu arrive toujours a l’improviste! Inattendu! Surprenant! On pourrait presque dire que c’est la marque du vrai Dieu: le Tout-Autre! Chaque fois qu’on croit avoir bien circonscrit Dieu, bien compris,| bien étiqueté Dieu, c’est sans doute qu’on s’est trompé de Dieu, qu’on a pris nos désirs pour la réalité. Seigneur, ouvre-nous a la nouveauté de ta Présence, garde-nous préts pour l’imprévu de ta visite.", "page": 18, "kind": "p"}, {"id": "r1p25", "text": "Et vous trouver « endormis»...", "page": 19, "kind": "h"}, {"id": "r1p26", "text": "Devant Dieu, on est toujours un peu endormis... surpris... I! faut sortir de ce sommeil spirituel, de cette léthargie. II faut essayer d’adopter un style actif, énergique, au lieu de nous laisser aller 4 l'assoupissement. Seigneur, maintiens-nous éveillés, attentifs.", "page": 19, "kind": "p"}, {"id": "r1p27", "text": "Ce que je vous dis [a, je le dis 4 tous: « Veillez».", "page": 19, "kind": "h"}, {"id": "r1p28", "text": "Pour Jésus, la «présence» du Seigneur est déja la, au coeur des événements que nous vivons: rends-nous vigilants, attentifs, Seigneur, a Ta Présence. Délivre-nous de cet engourdissement, de-cet attiédissement, qui nous ferait passer a cété de ta constante « venue». C’est le temps de PAvent qui commence, le temps de « veiller»...", "page": 19, "kind": "p"}]}, {"id": 2, "title": "2e Dimanche de l’Avent", "group": "Adviento", "page": 20, "ref": "Marc 1/1.8.", "paragraphs": [{"id": "r2p1", "text": "Aujourd’hui, nous allons lire le début de l’évangile selon saint Marc. Toute cette année, appelée « année By», c’est Marc que nous lirons en priorité.", "page": 20, "kind": "p"}, {"id": "r2p2", "text": "La tradition a toujours présenté Marc comme le disciple de Pierre. Ce sont donc les souvenirs et la catéchése de cet apdtre, témoin oculaire de Jésus, que nous entendons en ce récit. On pense que cet évangile fut rédigé a Rome, vers lan 70, et qu’il s’adressait Gd une communauté chrétienne composée d’anciens paiens, n’ayant jamais vécu en Palestine.", "page": 20, "kind": "p"}, {"id": "r2p3", "text": "Comparé aux trois autres évangiles, celui de Marc est trés concret: c’est le récit d’un homme du peuple, plein de détails savoureux. Mais, ne nous y trompons pas, Marc est aussi un théologien, qui nous livre la progressive découverte de Pierre. Dans toute la premiére partie, tout le monde se demande: « Qui est Jésus ?». Jésus fait des actes et dit des paroles qui posent question. Mais, curieusement, Jésus impose le « secret» sur sa personne. Puis, dans la seconde partie de sa vie publique, il révéle peu a peu le mystére de sa personne.", "page": 20, "kind": "p"}, {"id": "r2p4", "text": "La «géographie» de Marc, elle aussi, est « théologique», en ce sens qu’il met en valeur la Galilée, terre ouverte et accueillante au message de Jésus, par opposition a Jérusalem, ville qui refuse Jésus. De plus, la Mer de Galilée prend une signification symbolique, pour Marc (Pierre, pécheur, connaissait les moindres criques de son lac!). La rive «ouest» est juive. La rive «est» est paienne. Marc, avec insistance, nous montre Jésus allant « chez les paiens»... inaugurant ainsi la « mission» de lEglise a qui s’adressait cet évangile.", "page": 20, "kind": "p"}, {"id": "r2p5", "text": "Enfin, ’évangile de Marc est « dramatique». Trois groupes humains y sont dépeints. D’abord, Jésus et ses disciples, toujours ensemble. Puis, les foules, qui suivent Jésus, mais ne le comprennent guére. Enfin, les adversaires, qui, dés le point de départ, épient Jésus et le condamnent.", "page": 21, "kind": "p"}, {"id": "r2p6", "text": "Commencement de la Bonne Nouvelle...", "page": 21, "kind": "h"}, {"id": "r2p7", "text": "Le premier mot de l’évangile selon saint Marc est le méme (ce nest pas par hasard) que le premier mot de la Bible: «commencement du ciel et de la terre» (Genése 1/1). Saint Jean a aussi utilisé le méme mot, au début de son prologue: « Au commencement était le Verbe» (Jean 1/1). Matthieu et Luc, aussi, évoquent cette réalité d’un début: « Voici quelle fut lorigine de Jésus» (Matthieu 1/18, Luc 1/3). Ainsi, les quatre évangélistes nous suggérent que, par Jésus, le dessein de Dieu prend un nouveau départ: une nouvelle création, pour ainsi dire, commence. Et ce «temps de lAvent», qui commence, est aussi, chaque année, une occasion de repartir. Seigneur, nous sommes pourtant toujours tentés de nous arréter, de dire: assez! Redonne-nous sans cesse l’esprit des « commencements», ravive en nous l’espérance.", "page": 21, "kind": "p"}, {"id": "r2p8", "text": "«Bonne Nouvelle!» Nous sommes trop habitués a ce mot. Il traduit le mot grec « évangélion», d’ot est venu le mot « évangile». Mais ce mot ne signifie pas «un livre», une chose. C’est «la bonne nouvelle du Royaume de Dieu commencé en la personne de Jésus». La «bonne nouvelle», c’est la résurrection, c’est Paques, c’est la victoire décisive de la vie! Le mot venait du prophéte Isaie annoncant aux déportés malheureux la fin de leur exil: « Consolez, consolez mon peuple... sa corvée est finie... Parlez au coeur de Jérusalem, proclamez que son péché est pardonné... Monte sur une haute montagne, Sion, joyeuse messagére, toi qui porte la « bonne nouvelle», éléve la voix et proclame: « Voici votre Dieu, il vient...» (Isaie 40/1.11). Ma foi est-elle cela? Est-ce une sorte de boulet que je traine péniblement, ou bien une «joyeuse», une «bonne», une « merveilleuse» nouvelle?", "page": 21, "kind": "p"}, {"id": "r2p9", "text": "Bonne Nouvelle de Jésus Christ Fils de Dieu.", "page": 22, "kind": "h"}, {"id": "r2p10", "text": "Dés la premiére ligne de son évangile, Marc annonce la couleur. Ces «titres» de Jésus sont la clef de tout le récit. Ils reviendront, tout a la fin, quand un « paien» reconnaitra Jésus mourant sur la croix: « Vraiment, cet homme était le Fils de Dieu» (Marc 15/39). C’est ce qu’on appelle une «inclusion» sémitique. Procédé littéraire pour indiquer le sens profond d’un récit, tout entier «inclus» entre deux mots répétés au début et a la fin.", "page": 22, "kind": "p"}, {"id": "r2p11", "text": "Jésus... veut dire en hébreu « Dieu sauve», « Yéshouah». C’est le nom familier, qui désigne le caractére humain, historique, terrestre, de ’homme de Nazareth.", "page": 22, "kind": "p"}, {"id": "r2p12", "text": "Christ... veut dire en hébreu «lOint du Seigneur» « Meshiah», d’oti est venu le mot « messie». Ce titre indique que Jésus est bien celui que tout Israél attendait, le « descendant de David», le «roi du Royaume de Dieu».", "page": 22, "kind": "p"}, {"id": "r2p13", "text": "Fils de Dieu... enfin, est un titre qui ne prendra tout son sens qu’au moment de la résurrection: au temps ot. Mare écrivait, les chrétiens, par ce terme fort, exprimaient leur profession de foi en la divinité de Jésus.", "page": 22, "kind": "p"}, {"id": "r2p14", "text": "Il était écrit dans le Livre du prophéte Isaie: « Voici que j envoie mon messager devant toi, pour préparer ta route. A travers le désert, une voix crie: Préparez le chemin du Seigneur, aplanissez sa route.", "page": 22, "kind": "h"}, {"id": "r2p15", "text": "Ce n’est pas par hasard, non plus, que l’évangile de Marc commence par une citation de l’Ancien Testament. Jésus nest pas un «météore» arrivant d’une autre planéte. Il sinscrit dans histoire d’un peuple. Il était «attendu», «annoncé», « préparé»... La lecture de Ancien Testament que nous lisons désormais chaque dimanche, depuis le Concile Vatican II, n’est pas une nouveauté de IEglise moderne. Les premiers chrétiens, ceux de Marc, comme ceux de Matthieu, de Luc et de Jean, lisaient l’Ecriture... en lappliquant a Jésus.", "page": 22, "kind": "p"}, {"id": "r2p16", "text": "Et nous? Il arrive que nous nous plaignons de ne pas rencontrer Dieu. Mais en prenons-nous les moyens? Que faisons-nous pour Le chercher? Préparons-nous le «chemin du Seigneur»? Ce temps de l’Avent pourrait étre un temps de reprise de la méditation de la Bible.", "page": 22, "kind": "p"}, {"id": "r2p17", "text": "Et Jean le Baptiste parut dans le désert. Il proclamait un baptéme de conversion pour le pardon des péchés. Toute la Judée, tout Jérusalem, venait a lui. Tous se faisaient baptiser par lui dans les eaux du Jourdain, en reconnaissant leurs péchés.", "page": 23, "kind": "h"}, {"id": "r2p18", "text": "Ne nous imaginons pas que nous allons «rencontrer» Dieu, 4 Noél par exemple, sans « préparer » sa venue, sans nous purifier, sans travailler A nous convertir, A changer de vie.", "page": 23, "kind": "p"}, {"id": "r2p19", "text": "Jean Baptiste, lui, ne ménageait pas son auditoire. II leur disait: «Changez totalement de conduite... retournezvous!» C’est le sens du mot « metanoia», qu’on a traduit par «conversion». Vous faisiez ceci? Faites maintenant le contraire. Ce mal que vous faisiez, cessez de le faire. Ce bien que vous ne faisiez pas, mettez-vous 4 le faire. Changez! Changez!", "page": 23, "kind": "p"}, {"id": "r2p20", "text": "A Papproche de Noél, les chrétiens sont invités a recevoir le «sacrement de la réconciliation » pour le pardon de leurs péchés. Dés maintenant, je veux m’y préparer, pour en faire une démarche sérieuse, adulte, responsable. Et comme les foules qui venaient au Jourdain, je commence a «reconnaitre» mes péchés, lucidement. Seigneur, ouvre mes yeux!", "page": 23, "kind": "p"}, {"id": "r2p21", "text": "Jean était vétu de poil de chameau avec une ceinture de cuir autour des reins, et il se nourrissait de sauterelles et de miel sauvage.", "page": 23, "kind": "h"}, {"id": "r2p22", "text": "C’est le vétement typique des «hommes du désert», les bédouins.", "page": 23, "kind": "p"}, {"id": "r2p23", "text": "Le «désert»! Les foules qui y venaient, attirées par Jean Baptiste, devaient quitter un certain monde ot elles vivaient, pour aller dans un autre monde. Se retirer «au désert», c’est refuser la facilité, le confort. Le «désert», cest un lieu ouvert a perte de vue, ot les routes ne sont pas tracées clairement: une invitation a l’aventure! Le « désert», c’est aussi le lieu de la solitude et du silence: une invitation a la rencontre intérieure! Impossible, ici, de se distraire, de se réfugier vers les choses superficielles et les faux-semblants: homme s’y trouve face a lui-méme, dépouillé et nu. Dans ce dépouillement et ce silence, Dieu va peut-étre pouvoir se faire entendre: appel a la vérité de notre étre, quand les masques tombent. En russe, le mot « désert» se traduit par « poustinia». Et, de tout temps, des hommes et des femmes se sont retirés dans leur « poustinia»: une certaine qualité de la rencontre de Dieu est a ce prix. Profiterai-je de ce temps de l’'Avent pour prendre un temps régulier de solitude?", "page": 23, "kind": "p"}, {"id": "r2p24", "text": "Il proclamait: « Voici venir derriére moi celui qui est plus puissant que moi. Je ne suis pas digne de me courber a ses pieds pour défaire la courroie de ses sandales. Moi, je vous ai baptisés dans leau; lui vous baptisera dans lEsprit Saint.", "page": 24, "kind": "h"}, {"id": "r2p25", "text": "Jean Baptiste n’était la que pour introduire un autre, quelqu’un qui n’est pas encore nommé: «celui qui vient! »... «le plus puissant»... «le plus digne»... «celui qui plonge dans lEsprit Saint»... Si nous décidons de nous convertir, Dieu ne sera pas spectateur: il va nous plonger dans son propre Esprit !", "page": 24, "kind": "p"}]}, {"id": 3, "title": "3e Dimanche de l’Avent", "group": "Adviento", "page": 25, "ref": "Jean 1/6.8, 19.28", "paragraphs": [{"id": "r3p1", "text": "Il y eut un homme envoyé par Dieu, son nom était Jean. Il était venu comme-«témoin».", "page": 25, "kind": "h"}, {"id": "r3p2", "text": "Jean Baptiste est, avec Marie, la grande figure de |’Avent. Chaque année, les deuxiéme et troisiéme dimanches de lAvent lui sont totalement consacrés.", "page": 25, "kind": "p"}, {"id": "r3p3", "text": "Un Tropaire (chant composé a partir de |’évangile) chante avec perfection ce réle unique de Jean: « Dernier des prophétes, premier témoin de Jésus-Christ, voix qui clame au désert, puis s’efface humblement devant Celui quelle annongait : voila ta grandeur et ta joie, maintenant parfaite. Témoin de la lumiére, dis-nous par quel chemin nous vient le Messie! » Et les couplets reprennent quelques paroles de Jean.", "page": 25, "kind": "p"}, {"id": "r3p4", "text": "Aucun homme, effectivement, n’a mieux symbolisé le temps de l’Avent. Il est le dernier des grands prophétes de PAncien Testament (Luc 1/76, Matthieu 11/9): c'est donc homme trait-d’union entre le passé et l'avenir, entre avant et Paprés. Seigneur, aide-nous a étre fidéles a nos racines du passé, et ouverts sur toutes les nouveautés que Tu veux créer AUJOURD’HUI.", "page": 25, "kind": "p"}, {"id": "r3p5", "text": "Il était venu comme «témoin», pour rendre témoignage a la Lumiére.", "page": 25, "kind": "h"}, {"id": "r3p6", "text": "Témoin de la lumiére! Quel plus beau titre! Jean est homme du témoignage. Les trois autres évangiles nous présentent Jean Baptiste comme le «prédicateur de la pénitence». Le quatriéme évangile nous Je montre comme le «témoin de la lumiére»... le premier « temoin de Jésus- Christ». N’oublions pas que le mot «témoin» se dit, en grec, au génitif, «martyros», et que, de fait, Jean a été le « premier martyr» de Jésus (Marc 6/27). L’évangile de saint Jean est tout entier rempli de cette idée : le monde « fait un procés» a Jésus. On le refuse, on l’accuse. Et ce procés se résume dans cette question: « Mais qui est-il?» Alors, des témoins se présentent et temoignent pour l’accusé. Le mot «témoignage» est employé quatorze fois, et le verbe «témoigner» trente-trois fois. Le premier temoin qui s’est présenté, c’est Jean Baptiste: «il vient pour rendre témoignage a la lumiére. »", "page": 25, "kind": "p"}, {"id": "r3p7", "text": "Est-ce que je suis capable de prendre parti pour Jésus quand on l’accuse ?", "page": 26, "kind": "p"}, {"id": "r3p8", "text": "Et voici quel fut le temoignage de Jean quand les juifs lui demandérent : « Qui es-tu ? Pourquoi baptises-tu ?... »", "page": 26, "kind": "h"}, {"id": "r3p9", "text": "Cette phrase nous invite a nous interroger sur notre propre réle de témoins. Tout chrétien devrait étre un temoin du Christ. Or, nous voyons que c’est la maniére méme de vivre de Jean qui posait question 4 ses contemporains. On lui demande son identité. Sommes-nous une question pour ceux qui nous voient vivre ? Est-ce qu'il y a, dans nos comportements, quelque chose qui intrigue? Seigneur, aide-nous a vivre de telle maniére que notre entourage, nos collégues, nos relations, s’interrogent sur le « secret » qui nous fait vivre. Qui donc es-tu?", "page": 26, "kind": "p"}, {"id": "r3p10", "text": "Je ne suis pas le Messie... ni le Prophéte... je suis une « Voix»...", "page": 26, "kind": "h"}, {"id": "r3p11", "text": "Ainsi, derriére la question de lidentité de Jean, le témoin... c était identité de Jésus qu’on cherchait. La vraie question qui brdlait les lévres des enquéteurs était: «Te prends-tu pour le Messie?», et cette autre question est suggérée: «Mais alors qui donc est-il? le connais-tu? »", "page": 26, "kind": "p"}, {"id": "r3p12", "text": "La réponse de Jean est double: il commence par dire, humblement, qu’il n’est pas le Messie... et puis, il ajoute quil ne veut étre quune «voix», la voix d’un autre! AUJOURD'HUI, l'Eglise, et chaque chrétien, doit reprendre le courageux témoignage de Jean. « Eglise, que dis-tu de toiméme ? Pour qui te prends-tu? Chrétien, que dis-tu de toiméme? Pour qui te prends-tu?» Non! Je ne suis pas le Christ. Je ne suis qu’un écho du Christ. Seigneur, délivre-nous de nos prétentions a posséder la vérité, a étre les « concessionnaires exclusifs » de Jésus-Christ.", "page": 26, "kind": "p"}, {"id": "r3p13", "text": "Au milieu de vous se tient Celui que vous ne connaissez pas.", "page": 27, "kind": "h"}, {"id": "r3p14", "text": "Loin d’étre le seul lieu de présence du Christ, je suis convaincu que ce Christ que vous cherchez, il est déja au milieu de vous, au sein de vos espérances, de vos luttes, de vos amours d’hommes! La seule supériorité de l’Eglise, et du chrétien, est de «reconnaitre», et de «nommer », Celui que les hommes attendent et cherchent a tatons, et qui est déja présent a leur vie. Quand, par exemple, le 10 décembre 1948 l’O.N.U. proclama la « Déclaration universelle des Droits de ’Homme», nous rendons-nous compte que cétait une « présence» de Celui qui se tient «au milieu», méme sil n’est pas «connu». «J’ai eu faim, et vous avez reconnu mon droit de vivre... J’étais en prison, persécuté, torturé, et vous avez reconnu mon droit a la dignité...» La grande aspiration de ’humanité a plus de justice, c’est la présence de Celui qui est «toute justice». Que des hommes de toutes religions, des Chefs d’Etat de toutes idéologies, aient pu proclamer un tel texte, n’est-ce pas un «signe des temps»? «Au milieu de vous se tient Quelqu’un... méme si vous ne le nommez pas.» Nous aurions mauvaise grace, nous chrétiens, 4 « récupérer », a « accaparer» ce mouvement pour les Droits de PHomme..., car nous sommes, aussi, de ceux qui les bafouent souvent, chaque fois que nous méprisons un frére. Mais comment ne pas nous réjouir que grandisse, dans l’humanité d’AUJOURD'HUI, cette exigence du respect de tout homme, nous qui savons que Dieu s'est fait «homme», et que, dans le Christ, «la nature humaine a été élevée a une dignité sans égale...» et que cela vaut non seulement pour ceux qui croient au Christ, mais bien pour tous les hommes de bonne volonté, dans le coeur desquels, invisiblement, agit la grace... » comme laffirme explicitement le Concile Vatican II (Gaudium et Spes 22/2.4).", "page": 27, "kind": "p"}, {"id": "r3p15", "text": "Celui que vous ne connaissez pas... c’est lui qui vient...", "page": 28, "kind": "h"}, {"id": "r3p16", "text": "Toute la vie de Jésus a été marquée par cet «incognito». Dieu ne vient pas comme un coup de trompette, ou comme le fracas d’un orage. Dieu nest pas «celui qui écrase» ou «domine». Il est comme le murmure du « vent dont on ne sait ni d’ot il vient, ni ot il va.» (Jean 3/8). Dieu est «celui qui se laisse écraser, crucifier, accuser». Paradoxe? Non pas! Vérité du Dieu qui ne peut étre que le «Dieu caché», parce que son «Etre» échappe a nos prises. Et lidentité de Jésus (« Qui donc es-tu?») échappe a toute investigation rationnelle, il est vraiment le « Dieuincognito», le « Dieu caché»!", "page": 28, "kind": "p"}, {"id": "r3p17", "text": "Seigneur, aide-nous a Te reconnaitre, la ot Tu te caches. Je Te cherchais dans la santé, dans la réussite, dans l'amitié, dans le bonheur de vivre (et Tu es 1a; aussi!). Mais, ce qui mest arrivé, c’est la maladie, l’échec conjugal ou parental ou professionnel, la pauvreté. Aide-moi, Seigneur, 4 ne pas passer a cété de Ta présence cachée.", "page": 28, "kind": "p"}, {"id": "r3p18", "text": "— Ami, si tu Me découvres caché, toujours présent, tu auras découvert une source de joie que personne, ni rien, ne pourra jamais te ravir... la joie du Magnificat des pauvres, la joie de Jean Baptiste qui, se voyant diminuer, trouvait lA sa joie « maintenant parfaite» (Jean 3/29.30).", "page": 28, "kind": "p"}, {"id": "r3p19", "text": "Je ne suis méme pas digne de défaire la courroie de sa sandale.", "page": 28, "kind": "h"}, {"id": "r3p20", "text": "Jean Baptiste, c’est celui qui «s’efface humblement devant Celui qu’il annoncait ». Jean Baptiste, c’est le «témoin» a état pur: celui qui n’existe que par référence a un autre! Il refuse le titre de Messie (Jean 1/20). Il souhaite « disparaitre» pour que Lui « grandisse » (Jean 3/30). Il n’est pas la Lumiére, mais la petite lampe qui brile dans la nuit (Jean 5/35). Il est le «serviteur» indigne de dénouer la courroie du maitre (Jean 1/27). Il nest que «ami de ’Epoux», qui se tient a distance, effacé (Jean 3/29). Il a mis le comble a son « ministére », en se sabordant au profit de Jésus, en se privant de tous ses propres disciples pour les envoyer suivre «un Autre» (Jean 1/35.39). Enfin, il est mort avant d’avoir vu le triomphe du ressuscité, dans lobscurité totale du doute: «Es-tu celui qui doit venir, ou devons-nous en attendre un autre ? » (Matthieu 11/2.19). Ainsi, Jean Baptiste est non seulement le «témoin» par excellence, mais il est aussi le « type méme du croyant» : «celui qui ne voit pas, mais qui croit» (Jean 20/29).", "page": 28, "kind": "p"}, {"id": "r3p21", "text": "Saint Jean Baptiste, priez pour nous!", "page": 29, "kind": "p"}, {"id": "r3p22", "text": "Saint Jean Baptiste, donnez-nous votre puissance d’effacement et d’humilité!", "page": 29, "kind": "p"}, {"id": "r3p23", "text": "Saint Jean Baptiste, donnez-nous cet «amour fou» qui se sacrifie pour l’autre! Pour que notre joie soit parfaite...", "page": 29, "kind": "p"}, {"id": "r3p24", "text": "Moi, je ne baptise que dans leau...", "page": 29, "kind": "h"}, {"id": "r3p25", "text": "Cétaient des experts en « purification», des prétres et des lévites officiels, patentés (Jean 1/19) qui venaient vérifier Yauthenticité de ce marginal dont l’activité de « pardon des péchés» (Marc 1/4) ne pouvait étre que suspecte, interdite par la bonne religion, celle de Jérusalem (Jean 1/19). Car ceux qui interrogeaient Jean, c’étaient « des pharisiens», les « purs», les « peroushim», qui savaient parfaitement la Loi, les régles, ce qui est permis et défendu... (Jean 1/24). Mais ces braves pharisiens soucieux de rites authentiques, hélas, vont passer a cété du seul qui remet les péchés, ils le refuseront dans leur grande majorité. Car Jean Baptiste, lui, le savait bien: ce n’était pas lui, le pauvre ministre, le pauvre « serviteur » (c’est le sens du mot latin « minister») qui donnait le pardon des péchés..., car il ne « baptisait que dans l'eau»... mais, derriére lui, derriére son geste rituel de baptiseur, venait «l/Agneau qui enléve le péché du monde» (Jean 1/29).", "page": 29, "kind": "p"}, {"id": "r3p26", "text": "A lapproche de Noél, Seigneur, donne-nous de nous approcher de Toi, le seul qui enléve les péchés.", "page": 29, "kind": "p"}, {"id": "r3p27", "text": "Tout cela s’est passé 4 Béthanie de Transjordanie...", "page": 29, "kind": "h"}, {"id": "r3p28", "text": "Ils étaient venus de Jérusalem... la ville Sainte, centre mondial de diffusion et de contrdle de la Parole de Dieu. Or, cétait sur une terre étrangére, au-dela du Jourdain, que Dieu se révélait. L’évangéliste est si convaincu de l’importance de cette géographie, qu'il y insiste par deux fois (Jean 1/28 et 10/40). Seigneur, aide-nous a étre « missionnaires», a€ ne pas nous enfermer dans nos frontiéres. Ouvre nos ccoeurs a ta mystérieuse présence... sur la rive opposée.", "page": 29, "kind": "p"}]}, {"id": 4, "title": "4e Dimanche de l’Avent", "group": "Adviento", "page": 30, "ref": "Luc 1/26.38", "paragraphs": [{"id": "r4p1", "text": "L’une des meilleures préparations a la féte de Noél, c’est la méditation du récit de l’Annonciation. Saint Luc a manifestement rencontré les milieux «judéo-palestiniens» ou se conservaient les traditions de la famille de Jésus. Il est aussi probable qu’il a rencontré Marie en personne, elle « qui gardait toutes ces choses dans son coeur» (Luc 2/19). Luc se voulait historien, et il a eu le souci de « rencontrer ceux qui, dés le début, furent les témoins oculaires, afin de s informer de tout avant d’écrire» (Luc 1/2.3). Par ‘ailleurs, Luc est un artiste délicat, le plus fin de tous les narrateurs parmi les quatre évangélistes. Plus que nous aujourd’hui, proche des événements mystérieux qui s’étaient passés, il a di ressentir le probleme du langage: comment, par quels mots, exprimer cette expérience mystique vécue par une jeune fille et qui n’est rien de moins que la conception «selon la chair» du Verbe de Dieu «congu du Pére» de toute éternité! Heureusement, Luc disposait de la longue tradition littéraire et théologique de la Bible. Il a donc coulé son «information» dans les moules de langage si finement préparés par Esprit Saint au coeur dsraél. La « toile» de r’Annonciation est tissée de «fils» bibliques. En les repérant, nous prendrons mieux conscience que la Révélation est une merveilleuse mine d’expressions, d'images, de symboles, pour tenter de rendre en langage humain le mystére inaccessible de Dieu.", "page": 30, "kind": "p"}, {"id": "r4p2", "text": "L’ange Gabriel fut envoyé par Dieu dans une ville de Galilée appelée Nazareth, a une jeune fille.", "page": 30, "kind": "h"}, {"id": "r4p3", "text": "Trés volontairement, Luc fait une opposition entre l’annonce de la naissance de Jean Baptiste, et celle de Jésus. Dans un cas,", "page": 30, "kind": "p"}, {"id": "r4p4", "text": "Jérusalem...", "page": 31, "kind": "p"}, {"id": "r4p5", "text": "dans le temple...", "page": 31, "kind": "p"}, {"id": "r4p6", "text": "a un prétre...", "page": 31, "kind": "p"}, {"id": "r4p7", "text": "qui n’y croit pas...", "page": 31, "kind": "p"}, {"id": "r4p8", "text": "Dans Iautre,", "page": 31, "kind": "p"}, {"id": "r4p9", "text": "Nazareth...", "page": 31, "kind": "p"}, {"id": "r4p10", "text": "dans une maison particuliére...", "page": 31, "kind": "p"}, {"id": "r4p11", "text": "a une jeune fille...", "page": 31, "kind": "p"}, {"id": "r4p12", "text": "qui donne son consentement...", "page": 31, "kind": "p"}, {"id": "r4p13", "text": "Oui, Nazareth est une bourgade insignifiante, composée dune vingtaine de maisons, avec 150 habitants, disent les archéologues. La Galilée était une province méprisée : « de Nazareth, peut-il venir quelque chose de bon? » (Jean 1/46). La simplicité de la maison de Marie contraste avec la solennité de lannonciation a Zacharie, dans le cadre grandiose et sacré du Temple, a Jérusalem, la capitale (Luc 1/5.25).", "page": 31, "kind": "p"}, {"id": "r4p14", "text": "En contemplant, par mon imagination, Marie dans sa pauvre petite maison inconnue, je contemple la modestie de Incarnation de Dieu: «Il s’est anéanti, dira un jour saint Paul, prenant la condition d’esclave» (Philippiens 2/7).", "page": 31, "kind": "p"}, {"id": "r4p15", "text": "Une vierge, accordée en mariage 4 un homme de la maison de David, appelé Joseph; et le nom de la jeune fille était Marie.", "page": 31, "kind": "h"}, {"id": "r4p16", "text": "Matthieu, dans un texte qui n’a rien de paralléle a celui-ci, affirme les deux mémes vérités historiques: la filiation davidique de lenfant, et la virginité de sa mére (Matthieu 1/18.25). Le nom de Yoséph’el signifie: «Que Dieu ajoute!». Et celui de Miryam, signifie: «Noble dame! ». J’imagine ce nom «Miryam» prononcé par les amies, les voisines, a la fontaine du village ov elles allaient puiser l’eau. Cest une toute simple fille, que rien ne distingue de ses compagnes. J’imagine aussi ces deux noms amoureusement prononcés par les deux fiancés: «Miryam»... « Yoséph’el» !", "page": 31, "kind": "p"}, {"id": "r4p17", "text": "L’ange entra chez elle et dit: «Je te salue, comblée de grace!»", "page": 31, "kind": "h"}, {"id": "r4p18", "text": "Nous nous serions attendu a ce que la phrase soit: «Je te salue, Marie!» Or, a la place de Marie, il y a « Comblée de grace», qui prend la place du nom. Comme dans beaucoup de récits de vocations, Dieu change le nom de quelqu’un. Marie devient la «comblée de grace», qu’on peut encore traduire par «favorisée de Dieu». Ce terme, en hébreux, renvoie a la «Bien-aimée», la «Favorisée», du Cantique des cantiques.", "page": 32, "kind": "p"}, {"id": "r4p19", "text": "Le terme grec utilisé pour dire «je te salue», c’est « kairé », qui veut dire en réalité « Réjouis-toi». C’est une réminiscence biblique (Sophonie 3/14, Zacharie 2/14-9/9, Isaie 54/1). Les prophétes demandaient 4 la «fille de Sion» de crier de joie en voyant venir vers elle son sauveur: « Crie de Joie, réjouis-toi, fille de Sion.» Et nous savons combien le théme de la joie est constant en saint Luc. Voila donc le premier mot de Dieu au monde: « Réjouis-toi! »", "page": 32, "kind": "p"}, {"id": "r4p20", "text": "Le Seigneur est avec toi. i", "page": 32, "kind": "h"}, {"id": "r4p21", "text": "C’est la formule habituelle de Dieu quand II veut rassurer ceux quil appelle a de lourdes responsabilités (Genése 15/1, Exode 4/12, Juges 6/12.17) «Ne crains pas, je suis avec toi!» Le célébrant nous redit souvent ce souhait dans la liturgie : « Le Seigneur soit avec vous!» Y croyons-nous ? Emmanuel = Dieu avec nous.", "page": 32, "kind": "p"}, {"id": "r4p22", "text": "A cette parole, elle fut toute bouleversée et se demandait ce que signifiait cette salutation.", "page": 32, "kind": "h"}, {"id": "r4p23", "text": "On reste au plan superficiel quand on voit ici seulement une réaction psychologique. La «crainte» fait partie de toutes les «annonciations» de Ancien Testament. C’est un langage biblique, une fois de plus, qui signifie : attention! il y a ici du mystére! ces paroles ont un sens caché qu'il faut découvrir! Dieu est la, c’est sérieux! Oui, Dieu est toujours «le déconcertant», I’ «inattendu», le «caché»... Toute approche de Dieu produit, chez ’homme, ce sentiment de recul, d’effroi sacré...", "page": 32, "kind": "p"}, {"id": "r4p24", "text": "«Sois sans crainte, Marie, car tu as trouvé grace auprés de Dieu. Voici que tu vas concevoir et enfanter un fils... et tu lui donneras le nom de Jésus»).", "page": 32, "kind": "h"}, {"id": "r4p25", "text": "Luc utilise une formule stéréotypée, maintes fois utilisée dans la Bible (Genése 16/11-17/19, Juges 13/5.7, Isaie 7/14). «Voici que la vierge concoit et enfante un fils auquel elle donne le nom dEmmanuel.» L’oracle dlsaie était, depuis longtemps, compris dans le sens de la naissance virginale du Messie, comme [atteste la traduction grecque des Septante, ot le mot grec «parthénos» (vierge) est beaucoup plus précis que le mot hébreux « almah » (femme non mariée).", "page": 33, "kind": "p"}, {"id": "r4p26", "text": "Il sera grand, il sera appelé Fils du Trés Haut; le Seigneur Dieu lui donnera le tréne de David son pére: Il régnera pour toujours sur la maison de Jacob, et sa royauté n’aura pas de fin.", "page": 33, "kind": "h"}, {"id": "r4p27", "text": "Marie savait par coeur la « prophétie de Nathan» (2 Samuel 7/12.17) que lange lui rappelle. Pour nous, c’est un langage un peu ésotérique. Pour tout juif, cela signifiait: cet enfant sera le Messie annoncé et attendu.", "page": 33, "kind": "p"}, {"id": "r4p28", "text": "Comment cela va-t-il se faire, puisque je suis vierge ?", "page": 33, "kind": "h"}, {"id": "r4p29", "text": "Lintention de Luc est claire: il ne veut laisser aucun doute sur la virginité de Marie. A l’époque, la coutume juive était que les fiangailles donnaient aux fiancés tous les droits des conjoints, sans exclure les relations conjugales... Luc élimine cette hypothése. Marie a choisi, délibérément, de rester vierge. Cette question nous fait pénétrer dans la pensée et le coeur de Marie. Elle s’était donnée 4 Dieu dans une sorte d’amour mystique, absolu, exclusif... comme tant d autres l’ont fait depuis! Cela ne déprécie en rien l'état du mariage. Mais cela met en évidence un autre idéal que peuvent valablement choisir certains, comme le dira Jésus (Matthieu 19/12). D’ailleurs, a travers la découverte des Esséniens de Qumran, nous savons maintenant que ce nétait pas un idéal étranger a Israél: au moment de ces événements, lidéal du célibat volontaire consacré commengait a se répandre.", "page": 33, "kind": "p"}, {"id": "r4p30", "text": "L'Esprit Saint viendra sur toi, et la puissance du Trés-Haut te prendra sous son ombre.", "page": 33, "kind": "h"}, {"id": "r4p31", "text": "Ne nous imaginons pas que Marie a percu le mystére de la Personne de son Fils a travers les définitions dogmatiques abstraites. Non! C’est par le jeu des images et symboles bibliques qu’elle a compris ce quelle devait comprendre. Marie s’est trouvée, ici, devant le merveilleux théme de la «shekinah», ou «nuée», «ombre», signe de la présence de Dieu. L'Esprit plane sur les eaux au début, pour donner la vie (Génése 1/2). Et voici une nouvelle création en Marie. La «nuée» recouvrait le sanctuaire de son «ombre» (Exode 40/35). Et voici que Marie devient la demeure de la Présence sacrée. C’est dans «lombre de la nuée», que Dieu parlait 4 Moise (Exode 16/10). Quand Salomon inaugura le Temple, en 968, «la nuée emplit la Maison du Seigneur» (I Rois 8/10). Pour une fille juive, les paroles de lange évoquaient tout cela.", "page": 33, "kind": "p"}, {"id": "r4p32", "text": "C’est pourquoi celui qui va naitre sera saint, et il sera appelé oo de Dieu.", "page": 34, "kind": "h"}, {"id": "r4p33", "text": "«L'Esprit...» - «La Puissance...» - «le Saint...» - «Le Trés Haut...» - « Fils de Dieu.» Luc veut nous dire que ’humanité de Jésus, dés son premier instant, est pénétrée de lEsprit de Dieu. Le langage est biblique. Celui qui naccepte pas de se mettre a ce niveau-la, qui est un niveau de Foi, en reste a la superficie du récit.", "page": 34, "kind": "p"}, {"id": "r4p34", "text": "Aide-moi, Seigneur, a m/arréter, confondu dadoration, devant le mystére qui s’exprime en ce langage évocateur. Cet ovule fécondé dans le sein d’une femme, c’est un fantastique mystére qui dépasse toutes les lois de la nature. Saint Jean dira: «le Verbe s’est fait chair» (Jean 1/14). Ce jour-la, pourquoi Marie, a travers ce quelle savait de sa Bible, n’aurait-elle pas compris ce qui arrivait? Méme si, évidemment, cela n’avait pas encore la précision des définitions dogmatiques.", "page": 34, "kind": "p"}, {"id": "r4p35", "text": "Voici la servante du Seigneur.", "page": 34, "kind": "h"}, {"id": "r4p36", "text": "Dieu n’a pas introduit Marie dans sa fonction maternelle sans l’avoir, au préalable, informée, consultée. Dieu ne nous met pas devant le fait accompli, il respecte les niveaux de liberté, et de responsabilité. Marie, a travers ce langage biblique, a percu l’essentiel, pour s’engager en toute connaissance de cause. Mais, nous le devinons, c était « dans la foi.» Seigneur, donne-nous, aussi, de croire.", "page": 34, "kind": "p"}]}, {"id": 5, "title": "Noël · Messe de la nuit", "group": "Navidad", "page": 35, "ref": "Luc 2/1.14", "paragraphs": [{"id": "r5p1", "text": "Noél est un beau livre d'images populaires. Gardons-les toutes fraiches en nos yeux. Mais il est clair que Luc nous invite a une « contemplation» trés intériorisée : son récit est une « Préfacé» théologique a son évangile, accessible pleinement par la Foi.", "page": 35, "kind": "p"}, {"id": "r5p2", "text": "En ces jours-la parut un édit de fempereur « Auguste » ordonnant de recenser toute la terre.", "page": 35, "kind": "h"}, {"id": "r5p3", "text": "César Auguste, le plus célébre empereur de Rome (de 30 avant J.-C. 4 14 aprés J.-C.). En Pan 27, il s’était fait donner par le Sénat le titre divin d’« Auguste», ce qui signifie en grec (« Sebastos») « digne d’adoration». Luc, en utilisant ce titre prétentieux d’un «roi de la terre», veut montrer par contraste combien Dieu est différent: il-va naitre comme un enfant fragile; de pauvres émigrés.", "page": 35, "kind": "p"}, {"id": "r5p4", "text": "Ce premier recensement eut lieu lorsque Quirinius était gouverneur de Syrie.", "page": 35, "kind": "h"}, {"id": "r5p5", "text": "Le fond de tableau de ce premier Noél est plutét sombre. Le pays est «occupé». Ses habitants sont soumis a la domination d’un pouvoir étranger. On sait, par lhistoire profane, que ce recensement de Quirinius provoqua une insurrection populaire, en l’an 6, au moment de la seconde phase administrative, qui consistait a recenser les propriétés fonciéres et baties des gens... pour évaluer les taxes imposables! Dans quelques années, Jésus se trouvera confronté 4 un autre «Gouverneur», Ponce Pilate.", "page": 35, "kind": "p"}, {"id": "r5p6", "text": "Et chacun allait se faire inscrire dans sa ville d’origine. Joseph, lui aussi, quitta la ville de Nazareth en Galilée, pour monter en Judée.", "page": 36, "kind": "h"}, {"id": "r5p7", "text": "Joseph se laisse conduire par les événements. Le monde ou rentre Jésus est un monde dur, plein de contraintes (Noél n’est pas joli du tout). Mais « Dieu écrit droit sur nos lignes courbes.» Et les événements « sont des maitres que Dieu nous donne de sa main» (Pascal). Ai-je la conviction de foi que Dieu est la, et m’interroge, dans tout ce qui arrive, dans tout ce qui m/arrive? Il part avec une femme enceinte!", "page": 36, "kind": "p"}, {"id": "r5p8", "text": "Dans la «ville de David» appelée Bethléem, car il était de la maison et de la descendance de David.", "page": 36, "kind": "h"}, {"id": "r5p9", "text": "Luc «interpréte» ’événement a la lumiére de la prophétie de Michée (5/1.4). Celui qui va naitre est le « messie» que devait mettre au monde « une fille de Sion», « dans le plus petit des bourgs de Juda», au milieu des pauvres, du « petit reste»... dans la «ville de David». Mais en fait, ce Messie est tout autre que ce qu’on attendait. On l’attendait Puissant, Riche, Fort! Et il vient Impuissant, Pauvre, Faible... Dieu a constaté que les hommes religieux se trompaient tellement sur Lui qu’ll-a dG entrer dans le monde «incognito», illégalement. Il a franchi nos frontiéres en contrebande. Jamais il n’aurait été admis par les «officiels» s'il avait déclaré son identité! On n’a pas idée, pour un Dieu, de se présenter en si modeste apparence, en ignorant tellement ses priviléges, en manquant totalement aux convenances divines, en semblant faire fi des cérémonies grandioses que la religion avait édifiées en son honneur!", "page": 36, "kind": "p"}, {"id": "r5p10", "text": "Si tout cela ne compte pas, pour Dieu, qu’est-ce donc qui compte, pour Lui?", "page": 36, "kind": "p"}, {"id": "r5p11", "text": "Il venait se faire inscrire avec Marie, son épouse, qui était enceinte.", "page": 36, "kind": "h"}, {"id": "r5p12", "text": "Le texte grec dit, ici: «avec Marie, sa fiancée, qui était enceinte». Luc a, volontairement, utilisé ici le méme mot qu’a l’annonciation (Luc 1/27). Quoique légalement promis Pun a l'autre, Joseph et Marie n’ont pas mené la vie commune. Elle est « vierge»! Et pourtant, elle est « enceinte » ! Pourquoi vouloir toujours ramener Dieu a notre niveau? Nous nous trompons sur Dieu, ne le croyant capable que de ce dont nous sommes capables. Seigneur, dans ma foi, je veux adorer Ta puissance Créatrice, dans cette maternité étonnante, virginale. Dieu seul est «Pére» de cet enfant que Marie, fiancée, porte.", "page": 36, "kind": "p"}, {"id": "r5p13", "text": "Or, pendant quiils étaient la, arrivérent les jours ot elle devait enfanter, et elle mit au monde son fils « premier-né»).", "page": 37, "kind": "h"}, {"id": "r5p14", "text": "Quelle sobriété dans ce récit! Tout le contraire des mythes et des légendes. C’est un bébé comme un autre, sans auréole autour de la téte, tout simple et nu!", "page": 37, "kind": "p"}, {"id": "r5p15", "text": "Je vous ai faits 4 « mon image» dit Dieu. Vous les papas et les mamans, vous savez merveilleusement aimer vos enfants, prendre des précautions pour eux, soutenir leur petite téte fragile, surveiller soigneusement la température du biberon, guetter le moindre sourire... Découvrirez-vous donc enfin que je vous ressemble? A travers Marie et Jésus, les hommes qui se font des idées fausses sur Moi, Dieu, et qui Me rejettent ou m’ignorent, découvriront peutétre que je suis plein de tendresse! A travers leurs propres gestes maternels, les mamans verront un peu qui Je suis...", "page": 37, "kind": "p"}, {"id": "r5p16", "text": "Elle ’emmaillotta et le coucha dans une mangeoire..., car il n’y avait pas de place pour eux dans la salle commune.", "page": 37, "kind": "h"}, {"id": "r5p17", "text": "Submergés par les informations spectaculaires et sensationnelles que déversent sur nous les mass-médias... sommes-nous encore capables de «regarder» le « banal» ot! Dieu a choisi d’exister? Le plus grand événement de Histoire humaine vient de se produire: Dieu est, désormais, aussi, un homme, Jésus! Depuis cette minute-la, Dieu a lié son sort au ndétre. Notre cause est devenue la sienne. Dieu est, «avec nous». Tous les espoirs nous sont, permis. Mais cet événement n’est pas sensationnel. Dieu est dans une «mangeoire», dans une «créche», cet instrument pour donner a manger aux bétes.", "page": 37, "kind": "p"}, {"id": "r5p18", "text": "tonnant, ce Dieu! Provoquant, ce Dieu! Face a la prétention de ’Auguste! Et ajoutons que Dieu ne fait pas semblant d’étre faible. Sur la paille de la créche, comme sur le bois de la Croix, il nous révéle ce qui est le plus profond, le plus vrai, en Lui, en Dieu. «Qui me voit, voit le Pére» (Jean 14/9). Dieu est amour. Et ’amour se fait faible devant celui ou celle qu'il aime. Qui domine, n’aime pas!", "page": 37, "kind": "p"}, {"id": "r5p19", "text": "Dans les environs se trouvaient des «bergers» qui passaient la nuit dans les champs pour garder leurs troupeaux.", "page": 38, "kind": "h"}, {"id": "r5p20", "text": "Loin d’étre le symbole de linnocence idyllique et écologique, comme nos jolis santons voudraient nous le faire croire, les « bergers», dans la mentalité du temps, étaient le symbole des gens méprisés. Leur profession les faisait mal voir; ils étaient des «hors la loi». On les considérait comme des voleurs, vivant de rapines. Ils n’avaient pas le droit civil d’étre temoins en justice. Des ignorants qui ne prenaient pas le temps d’assister a la catéchése donnée par les intellectuels dans les synagogues. Des impurs, que leur métier empéchait de respecter le repos rituel du saint sabbat! Et puis, des gens pas propres, qui sentent mauvais, des « bouseux»!", "page": 38, "kind": "p"}, {"id": "r5p21", "text": "Voila ceux que Dieu choisit en premier! Dieu aime les « petits», les « pauvres», ceux que les autres méprisent. Ce sera Pun des thémes de l’évangile de Luc. Merci!", "page": 38, "kind": "p"}, {"id": "r5p22", "text": "L’ange du Seigneur s’approcha et la gloire du Seigneur les enveloppa de sa lumiére.", "page": 38, "kind": "h"}, {"id": "r5p23", "text": "Le «merveilleux» commence seulement ici, dans ce récit. Le théologien dira: attention! attention! ce langage est une maniére de parler, car les Conciles ont bien précisé que les anges n’ont pas de corps! Le poéte et les simples diront: ces anges nous permettent de nous émerveiller devant le divin, ce qui dépasse ’homme.", "page": 38, "kind": "p"}, {"id": "r5p24", "text": "Ce que ¢a signifie, c’est clair: jusqu’ici, dans toute la Bible, la « Gloire» est le signe de la présence de Dieu, réservée au Temple de Jérusalem. Désormais, cette Gloire «enveloppe» les pauvres. « Ce que vous faites au plus petit, c’est a Moi que vous le faites» (Matthieu 25). Etonnant, ce Dieu! Provoquant, ce Dieu! Merci!", "page": 38, "kind": "p"}, {"id": "r5p25", "text": "Ils furent saisis d’une grande crainte, mais lange leur dit: « Ne craignez pas, car je viens vous annoncer une «bonne nouvelle», une grande joie pour tout le peuple.", "page": 39, "kind": "h"}, {"id": "r5p26", "text": "Nous disons, nous, que nous n’entendons jamais les anges. Ils ne font pas de bruit. Leur « parole» est silence. Ecoute, écoute, surtout ne fais pas de bruit. Toute « communication» de Dieu est «bonne nouvelle de joie». Un théme de Luc, encore. Et cette bonne nouvelle a une portée « universelle», pour tous. Un autre théme de Luc.", "page": 39, "kind": "p"}, {"id": "r5p27", "text": "Aujourd’hui vous est né un « Sauveur» dans la ville de David: Il est « Christ-Seigneur »...", "page": 39, "kind": "h"}, {"id": "r5p28", "text": "Les anges sont peu loquaces. Leur « communication» est courte. Elle va a Pessentiel. Ils donnent la « carte d’identité » véritable de ce bébé inconnu: trois titres divins... 1/Sauveur = sétér - 2/Messie=christos - 3/Seigneur = Kurios.", "page": 39, "kind": "p"}, {"id": "r5p29", "text": "Luc rutilisera plus jamais ces titres dans son évangile, avant la fin de son livre. Attention, dit Dieu, ce petit Jésus sans importance aujourd’hui, c’est bien le méme que le Seigneur de Gloire de Paques. Les évangiles de l’enfance sont concus par Luc comme une Préface a ce Livre qu’on ne comprendra vraiment qu’a la fin. Ce bébé naissant a une nature divine (il est Seigneur) et une mission divine (il est Sauveur). Cette «seigneurie» ne parait pas encore. Attendez!", "page": 39, "kind": "p"}, {"id": "r5p30", "text": "Et voila le « signe» qui vous est donné: vous verrez un nouveau-né emmaillotté et couché dans une mangeoire >».", "page": 39, "kind": "h"}, {"id": "r5p31", "text": "Ce qui est donné comme «signe», c’est la « pauvreté», la « faiblesse » !", "page": 39, "kind": "p"}, {"id": "r5p32", "text": "Arréte de courir. Va devant la mangeoire. Qui sait si tu n’y découvriras pas un symbole caché? Aprés tout, si ce Dieu la se donnait, vraiment, A « manger»! «Je te bénis, Pére, davoir caché ces choses aux sages et aux savants, pour les révéler aux tout-petits.» (Luc 10/21). Le Pain de Dieu rassasie les coeurs pauvres.", "page": 39, "kind": "p"}, {"id": "r5p33", "text": "Et soudain, il y eut avec Pange une troupe céleste innombrable qui louait Dieu en disant: «Gloire a Dieu au plus haut des cieux et paix sur la terre aux hommes qu'il aime. »", "page": 40, "kind": "p"}, {"id": "r5p34", "text": "C’est déja acclamation anticipée, du jour des rameaux (Luc 19/18).", "page": 40, "kind": "p"}]}, {"id": 6, "title": "Sainte Famille", "group": "Navidad", "page": 41, "ref": "Luc 2/22.40", "paragraphs": [{"id": "r6p1", "text": "Quand arriva le jour fixé par la Loi de Moise...", "page": 41, "kind": "h"}, {"id": "r6p2", "text": "..Sacrifice prescrit par la Loi du Seigneur.", "page": 41, "kind": "h"}, {"id": "r6p3", "text": "...pour accomplir les rites de la Loi qui le concernaient. ..selon ce qui a été écrit dans la Loi.", "page": 41, "kind": "h"}, {"id": "r6p4", "text": "Lorsqu’ils eurent accompli tout ce que prescrivait la Loi du Seigneur...", "page": 41, "kind": "h"}, {"id": "r6p5", "text": "Ce nest certainement pas par hasard que Luc insiste par cing fois (versets 22, 23, 24, 27, 39) sur «laccomplissement» de la Loi. Bien qu’il soit « Fils de Dieu», Jésus suit les lois humaines. Telle est la profondeur et la vérité de incarnation. Il ne se considére pas comme « privilégié », il fait « commetout le monde». Rien ne le distingue du commun des hommes. Je prends le temps de contempler longuement cette humilité incroyable dont saint Paul dira quelle est un «anéantissement», une «kénose» (Philippiens 2/7). Ne pas me mettre dans l’exception. Ne pas revendiquer de privileges. Accepter réellement les contraintes banales de |’existence, les servitudes sans gloire de notre condition.", "page": 41, "kind": "p"}, {"id": "r6p6", "text": "Les parents de Jésus le portérent a Jérusalem... au Temple.", "page": 41, "kind": "h"}, {"id": "r6p7", "text": "Ce voyage est plein de signification. C’est le sommet des «deux chapitres» que Luc consacre a l’enfance... de Jean Baptiste, et de Jésus. Mais, intentionnellement, Luc fait parcourir a Jésus le parcours inverse de celui de Jean. L’annonciation a Zacharie avait eu lieu dans le cadre officiel et prestigieux du culte sacerdotal au Temple (Luc 1/5), mais son fils Jean disparait « dans les déserts» (Luc 1/80). L’annonciation a Marie avait eu lieu dans la bourgade méprisée (Jean 1/46) de Nazareth, mais son fils Jésus est reconnu comme «Messie» dans la ville sainte de Jérusalem, et au coeur central de cette ville, le Temple, lieu de lindicible Présence divine (Luc 2/27, 2/37). Nous voici donc devant la « derniére page»... la fin de PAncien Testament! Des juifs, un jeune couple, «accomplissent» la Loi de Moise. Elle se termine, symboliquement, a ce geste. Il n’y aura plus besoin du Temple: on pourra méme le détruire (Luc 19/44). Dieu en personne est venu en prendre la place, c’est le « retour de la Gloire du Seigneur au milieu de son peuple», annoncé par le prophéte (Malachie 3/1.4). Mais que la venue de Dieu est surprenante, inattendue! Il ne vient jamais comme on lattendait.", "page": 41, "kind": "p"}, {"id": "r6p8", "text": "Un homme appelé «Syméon»)... juste et religieux...", "page": 42, "kind": "h"}, {"id": "r6p9", "text": "Une femme appelée « Anne»... veuve, de 84 ans, servant Dieu jour et nuit dans le Temple...", "page": 42, "kind": "h"}, {"id": "r6p10", "text": "Il est curieux, et pas par hasard, de constater que, selon Luc, ce ne sont pas les autorités officielles, prétres et scribes, qui reconnaissent Jésus... mais des gens obscurs, des pauvres! Par ces deux représentants des «petites gens», c’est tout le peuple des « pauvres que Dieu aime» qui vient déja a la rencontre de son Sauveur. L’évangile est déja tout entier dans cette page! Cela était dvailleurs annoncé: «Je ne laisserai subsister en ton sein qu’un peuple humble et modeste...» un petit « reste » (Sophonie 3/12, Isaie 16/14 - 30/17 - 37/4, Jérémie 6/9, Joél 3/5). Syméon et Anne représentent les pauvres. Ils sont « vieux » l'un et P'autre, de cette catégorie sociale que toute société a tendance a oublier et 4 ne pas respecter (Sirac le Sage 3/13). De plus Anne, elle, est « veuve», cest-a-dire, selon le langage biblique, la pauvreté personnifiée, puisqu’elle a perdu tout ce qui garantissait sa place dans une société ot le mari a, seul, des droits juridiques. Seigneur, fais de nos coeurs des coeurs de pauvres, pour que nous sachions Te reconnaitre, dans la pauvreté des apparences ot Tu Te caches...", "page": 42, "kind": "p"}, {"id": "r6p11", "text": "Syméon prit enfant dans ses bras... le Messie du Seigneur... le Salut préparé a la face de tous les peuples... la lumiére pour éclairer les nations... la gloire dsraél...", "page": 43, "kind": "h"}, {"id": "r6p12", "text": "Dieu inattendu, surprenant! On attendait la «gloire», la « puissance»! Et c’est un «enfant», un vrai bébé vagissant, qui ne sait méme pas se tenir debout, et qu’il faut porter dans les bras! Celui-la seul qui se laisse ouvrir les yeux, par la foi, par ’Esprit Saint (trois fois nommé dans ce texte) (Luc 2/25.26.27) peut discerner la «Présence», que les autres ne voient pas... Il faut étre pauvre, pour cela. La foi est une sorte de pauvreté: on voit sans voir! (Jean 20/29). Et pourtant, sous les apparences paradoxales de la petitesse de l’enfant (et nous pensons aux «apparences» du Pain que nous recevons...), il s'agit bien de l’investiture officielle de Jésus « dans son Temple»: les titres, qui lui sont donnés par ces deux pauvres, sont éblouissants! Jésus, ce pauvre paquet de «chair» (et le Verbe s’est fait chair), est bien le «Messie de Dieu»... le «Salut de tous les hommes»... la « Lumiére»... la « Gloire»... la « Délivrance » de Jérusalem... Donne-nous, Seigneur, la foi.", "page": 43, "kind": "p"}, {"id": "r6p13", "text": "Le pére et la mére de lenfant s’étonnaient de ce qu’on disait de lui.", "page": 43, "kind": "h"}, {"id": "r6p14", "text": "Voila donc laveu que la « foi des parents» progresse! Malgré la qualité de leur foi, Marie et Joseph sont pleins «détonnement» sur ces «titres» qu’on donne a leur fils. Cet événement interpelle leur foi. Au Temple, non plus, dans douze ans, ils «ne comprendront pas» (Luc 2/48.50), et sétonneront encore. Etonne-nous, Seigneur, nous T’en prions!", "page": 43, "kind": "p"}, {"id": "r6p15", "text": "Ils venaient pour «le présenter au Seigneur », « offrir le sacrifice prescrit».", "page": 43, "kind": "h"}, {"id": "r6p16", "text": "Telles sont les deux formules par lesquelles Luc montre le «rite» que fait ce jeune couple. Le verbe grec ici utilisé (« parasténai» = « offrir») est le méme que celui que Paul utilise pour dire l’attitude fondamentale du chrétien. N’oublions pas que Luc fut le secrétaire de Paul, et que les épitres ont été écrites avant les évangiles. Luc emploie donc, intentionnellement, un mot chargé de sens. « N’offrez plus vos corps au service du péché, mais offrez-les au service de Dieu» (Romains 6/13). « Offrez vos corps au service de la justice qui conduit a la sanctification» (Romains 6/19). «Je vous exhorte, fréres, a vous offrir vous-mémes en sacrifice vivant, saint et agréable 4 Dieu: ce sera la votre culte spirituel» (Romains 12/1).", "page": 43, "kind": "p"}, {"id": "r6p17", "text": "Ainsi Marie et Joseph viennent faire, a l’avance, ce que Jésus lui-méme fera a la Céne et sur la Croix... et ce que tous les chrétiens sont invités a faire A chaque messe: offrir leur vie! « Voici mon corps livré pour vous...» Seigneur, en communion avec Toi, que je donne ma vie par amour.", "page": 44, "kind": "p"}, {"id": "r6p18", "text": "Pour illustrer ces deux démarches qui n’en font qu’une (« présenter», et «offrir»), Luc cite deux passages bibliques, qui renforcent encore, s'il en était besoin, la dimension «pascale» de ce récit: «Tout premier-né de sexe masculin sera consacré au Seigneur» (Exode 13/2.12.15). Souvenons-nous de lorigine de ce rite. Le peuple disraél était esclave en Egypte. Pour accepter la Libération pascale, le Pharaon vit mourir tous les premiers-nés de son pays. Un sacrifice d’agneau pascal marqua de sang les portes des hébreux. Et «en souvenir» de ce jour de Rédemption-Libération, tout « premier-né» d'lsraél appartenait a Dieu! Il fallait le «racheter» pour pouvoir le remporter en famille! Symbole extraordinaire. Un objet qui appartient a4 Dieu: un étre consacré!", "page": 44, "kind": "p"}, {"id": "r6p19", "text": "Jésus, Lui, est, en plénitude « consacré»!", "page": 44, "kind": "p"}, {"id": "r6p20", "text": "Et cela se passe au « quarantiéme jour», le temps de la plénitude... Et ce sera encore un « quarantiéme jour» que s’achévera le temps de Paques, a l’'ascension qui fera disparaitre la présence sensible du ressuscité. Oui, tout l’évangile est dans cette page. Et cette autre scéne pascale se passera aussi «a Jérusalem» (Luc 24/47.52).", "page": 44, "kind": "p"}, {"id": "r6p21", "text": "Mon baptéme m’a consacré au Seigneur. Qu’est-ce que ¢a signifie pour moi?", "page": 44, "kind": "p"}, {"id": "r6p22", "text": "L’offrande d’un couple de tourterelles ou de deux petites colombes...", "page": 44, "kind": "h"}, {"id": "r6p23", "text": "Comme c’est touchant, n’est-ce pas ? Et comme on risque, dans tout ce récit de Luc, d’en rester a anecdote. Remarquons, une fois encore, que Luc niinvente rien, ni ne déforme. Il est bien clair quil s’appuie sur des pratiques culturelles juives indiscutables. Et on ne voit pas pourquoi Jésus en aurait été dispensé. Mais, ce qui compte, pour Luc, manifestement, c’est la «densité» théologique, la «signification» profonde des faits historiques. Acceptons donc le point de vue du narrateur. Et allons lire le texte complet dont Luc cite un passage, au livre du Lévitique (12/8): «Si la mére est incapable de trouver la somme nécessaire pour une téte de petit bétail, elle prendra deux tourterelles ou deux pigeons.» Voila! C’était donc loffrande des pauvres. Marie n’a pas pu faire mieux. Elle était «incapable» de payer plus cher! Voila ce que Luc nous suggére, si l’on sait lire entre les lignes. Et l’on sait que tout son évangile sera la «bonne nouvelle aux pauvres» (Luc 4/18). Oui, tout Pévangile est dans cette page apparemment folklorique. Heureux les pauvres, le Royaume est a eux.", "page": 44, "kind": "p"}, {"id": "r6p24", "text": "Etre « consacré » a Dieu... cela ne demande point de signes éclatants. Tous les pauvres du monde, en leurs haillons, sont «dignes» de Dieu, et consacrés... les pauvres sont «sacrés»! Est-ce que je les respecte?", "page": 45, "kind": "p"}, {"id": "r6p25", "text": "« Vois, ton fils qui est la, provoquera la chute et le relévement de beaucoup en Israél. II sera un signe de division».", "page": 45, "kind": "h"}, {"id": "r6p26", "text": "Jésus sera un «signe», un «signe contesté», un «signe qu’on peut refuser»... Dieu ne veut pas contraindre. Il a donné la liberté. Il accepte que son'« signe d’amour» puisse étre rejeté: «les prosternements d’esclaves ne lui disent rien», dira Péguy. Ainsi, chacun doit se décider devant le cas «Jésus»: on peut le refuser, et c’est la perte, la chute... on peut laccueillir, et c’est le salut, le relévement... Nous avons déja, dans cette page, le « Juge universel», celui qui sépare les hommes en deux a la Fin des temps (Matthieu 25/32). Seigneur, reléve-moi. Fais que je Te choisisse.", "page": 45, "kind": "p"}, {"id": "r6p27", "text": "Lorsqu’ils eurent «accompli» tout cela, ils retournérent en Galilée, dans leur ville de Nazareth... L’enfant grandissait... se fortifiait... progressait...", "page": 45, "kind": "h"}, {"id": "r6p28", "text": "Le voyage a la capitale s’achéve. On retourne a lobscurité de la province. Mais c’est toujours Dieu qui va maintenant vivre a atelier, et a la maison. Jésus va, progressivement, faire l’apprentissage de la vie dhomme: il va apprendre a sourire, a marcher (d’abord en titubant et en tombant), il va apprendre a lire a lécole, il va apprendre le métier de charpentier... Oh, le coup de scie de travers de «lapprenti» qui n’a pas encore le « coup de main»! Mais... il Papprendra. Il progressera.", "page": 46, "kind": "p"}]}, {"id": 7, "title": "Épiphanie", "group": "Navidad", "page": 47, "ref": "Matthieu 2/1.12", "paragraphs": [{"id": "r7p1", "text": "Jésus était né 4 Béthléem au temps du roi Hérode...", "page": 47, "kind": "h"}, {"id": "r7p2", "text": "Tels sont les seuls mots, bien courts, par lesquels Matthieu parle de Noél. C’est peu! En fait; Matthieu semble donc sintéresser trés peu a lévénement en tant que tel, a la difference de Luc. Par contre, Matthieu tient, manifestement, a donner a ses lecteurs la «signification» de cette naissance. Et il nous livre cette signification dans le récit des mages... qui, lui, est extrémement développé, et qui se présente, si on y préte attention, comme une sorte d’introduction a tout lévangile selon saint Matthieu.", "page": 47, "kind": "p"}, {"id": "r7p3", "text": "Au temps du roi Hérode, voici que des mages venus d’Orient arrivérent 4 Jérusalem et demandérent: «Ou est le Roi des Juifs, qui vient de naitre? »", "page": 47, "kind": "h"}, {"id": "r7p4", "text": "Matthieu rapproche, comme deux éléments explosifs, les deux titres: le roi Hérode... le roi des juifs... Cette question, que des étrangers allaient répétant dans les rues étroites de Jérusalem, devait sonner aux oreilles des juifs comme un cruel sarcasme. On comprend qu’elle troubla le soupconneux Hérode. On sait, par histoire, qu’il passa toute sa vie dans la hantise de perdre son pouvoir, et qu’il voyait des complots partout, ne passant sa vie que dans des « forteresses», et faisant tuer ses trois fils, sa belle-mére, et jusqu’a sa propre femme. Voila pour «histoire».", "page": 47, "kind": "p"}, {"id": "r7p5", "text": "Mais la signification que Matthieu donne a ce titre de « Roi des Juifs» est beaucoup plus profonde; le « Royaume des cieux» sera l'un de ses thémes favoris. Matthieu, dés le départ, annonce le Roi de ce Royaume. Dés cette premiére page de son évangile, il y a une couronne royale en litige: qui est réellement «roi» des juifs? Hérode, le potentat puissant, meurtrier et violent? Ou bien Jésus, ce petit, faible, désarmé, qui mourra victime innocente? C’est a la derniére page de son évangile, selon un procédé d’inclusion littéraire trés habituel en littérature sémitique, que Matthieu redonnera a Jésus ce titre de «roi des juifs». «Salut, roi des juifs!» diront les soldats (Matthieu 27/29). « Celui-ci est le roi des juifs» fera inscrire Pilate au-dessus de la téte de Jésus crucifié, pour indiquer le «motif de sa condamnation» (Matthieu 27/37). «Sil est roi dIsraél, qu’il descende de la croix » s’esclafferont tous les scribes et grands prétres (Matthieu 27/37).", "page": 47, "kind": "p"}, {"id": "r7p6", "text": "Dés sa naissance, nous suggére Matthieu, Jésus rest qu’un roi humble, image du « Serviteur souffrant» d’saie, ce «roi qui ne montera que sur un ane» (Matthieu 21/5) pour son triomphe passager des rameaux, ce roi qui nest pas venu «pour étre servi, mais pour servir» (Matthieu 20/28), et qui demandera a ses amis de «ne pas dominer, mais de se faire serviteurs» (Matthieu 20/25.26). La royauté de ce roi-la n’est pas de ce monde, elle ne ressemble en rien a celle d’Hérode: elle ne se dévoile paradoxalement que dans sa Passion. Que mettons-nous sous ces mots répétés dans notre priére: «Que Ton Régne vienne! »... « Lui qui Régne avec Toi et le Saint Esprit pour les siécles des siécles. »", "page": 48, "kind": "p"}, {"id": "r7p7", "text": "Nous avons vu se lever son étoile.", "page": 48, "kind": "h"}, {"id": "r7p8", "text": "Lglise rapproche, aujourd’hui, de ce récit de lEpiphanie, un texte dsaie, choisi parmi les innombrables textes bibliques qui annoncaient la venue du Messie comme une «lumiére». « Debout Jérusalem: elle est venue ta lumiére, et la gloire du Seigneur s’est levée sur toi. Regarde: lobscurité recouvre la terre, mais sur toi se léve le Seigneur, et sa gloire brille sur toi. Les nations (paiennes) marcheront vers ta lumiére, et les rois, vers la clarté de ton aurore...» (Isaie 60/1.6). On se souvient de cette lumiére messianique chantée au temps de |’Avent et dans la messe de la « nuit » de Noél : « Le peuple qui marchait dans les ténébres a vu se lever une grande lumiére, car un enfant nous est né» (Isaie 9/1.5).", "page": 48, "kind": "p"}, {"id": "r7p9", "text": "Il y a dans le theme de l’étoile, toute une signification, que saint Pierre explicitera quand il parlera de la Foi comme de «létoile du matin qui se léve dans nos coeurs» (2 Pierre 1/19). Cette étoile représente la lumiére de Dieu, la grace de
