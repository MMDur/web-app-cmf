 notre condition d’hommes.", "page": 159, "kind": "p"}, {"id": "r29p6", "text": "Sans plus attendre, on parle a Jésus de la malade. Jésus s’approcha delle, la prit par la main et il la fit «se lever».", "page": 160, "kind": "h"}, {"id": "r29p7", "text": "La premiére priére a faire sur cette simple scéne, c’est d’abord de la contempler, comme si nous y étions. Je vois Jésus franchir la porte de la maison. J’écoute ce qu’on lui dit. Je Pimagine s’approchant de la malade, lui prenant la main. Gestes familiers, amicaux, humains. La théologie nous affirme que chaque sacrement est un «geste du Christ». Un cantique chante la main de Jésus qui « faisait des merveilles.» Oui, le réalisme de lincarnation a été jusque-la. AUJOURD’HUI, j'aime contempler la main de Jésus prenant la main toute chaude de fiévre de la malade. Ainsi, symboliquement, Seigneur, tu prends ma main, pour me guérir de mes «fiévres». A la communion, je Te prends dans ma main. Mais c’est Toi qui prends la mienne.", "page": 160, "kind": "p"}, {"id": "r29p8", "text": "Il la fit «se lever». La fiévre la quitta, et elle les servait.", "page": 160, "kind": "h"}, {"id": "r29p9", "text": "Quand on lit cette phrase dans le texte grec, écrit par Marc, on ne peut pas ne pas remarquer quill utilise, ici, le mot «égeire», qui signifie « ressusciter». C’est le méme mot qui sert pour la résurrection de la fille de Jaire: « Léve-toi!» (Marc 5/41), et pour la résurrection de Jésus (Marc 12/26; 16/6). Ainsi, pour Marc, cette guérison concréte est un «signe» au sens fort, une sorte de parabole prophétique qui annonce le Régne définitif de Dieu... quand il n’y aura plus «ni deuil, ni cri, ni souffrance, quand Dieu essuiera toute larme et vaincra la mort» (Apocalypse 21/1.4). Méme de son temps, en Galilée, il est certain que Jésus n’a pas guéri tous les malades. II en a guéri quelquesuns, comme une sorte d’anticipation de la «Fin des Temps»: le seul vrai « Salut» de ’homme, ce n’est pas la guérison transitoire d’une fiévre passagére, c’est la résurrection. La vraie guérison que Jésus offre c’est de passer de la «non-foi», a la « foi» : celui qui accueille la foi en Jésus sait déja qu’il est sauvé de la mort. Alors, il «se léve» pour «servir» !", "page": 160, "kind": "p"}, {"id": "r29p10", "text": "Le mal que Jésus poursuit est beaucoup plus profond que celui qui atteint les corps. C’est le coeur, c’est le «centre» de ’homme qui est malade... quand il ne «sert» pas ses fréres. En disant que la malade se léve et se met a «servir», Marc nous dit beaucoup plus qu’ n’en a lair. Il se souvient de ce mot «servir» auquel Jésus donna un jour le sens de «donner sa vie»: «Le Fils de homme n’est pas venu pour étre servi, mais pour servir et donner sa vie en rancon pour la multitude» (Marc 10/45). Seigneur, par Ton Corps, guéris le coeur de ’homme, aujourd’hui! Guéris-moi de moi-méme, guéris-moi de mon égoisme subtil, guérismoi de ne pas mettre Dieu a la premiére place, guéris-moi de ne pas mettre «les autres» a la premiére place, guérismoi de ne pas «servir», de ne pas « donner ma vie».. de ne pas aimer!", "page": 161, "kind": "p"}, {"id": "r29p11", "text": "Le soir venu, aprés le coucher du soleil, on lui amenait tous les malades, et ceux qui étaient possédés par des esprits mauvais. La ville entiére se pressait a la porte. Il guérit toutes sortes de malades, il chassa beaucoup d’esprits mauvais...", "page": 161, "kind": "h"}, {"id": "r29p12", "text": "C’est du méme mouvement, pour ainsi dire, que Jésus guérit la maladie et manifeste sa puissance sur Satan, le Mal en personne. Oui, pour Jésus, le mal essentiel, c’est détre séparé de Dieu: c’est le péché qui est notre vraie maladie. L’hépital le mieux équipé, le personnel médical le plus compétent, ne remplaceront jamais... cet amour dont le malade a encore plus besoin que de remédes. AUJOUR. D’'HUI, comme au temps de Jésus, il y a quelque chose a guérir au coeur de homme: il y a une véritable rectification de l’entreprise civilisatrice 4 opérer. Pas de maladie plus grave pour le développement de la «cité terrestre» (de Phdpital, comme de toute entreprise) que ce «poison» introduit dans le monde par le péché. Cela ne veut pas dire quil faut renoncer au progrés, ni aux techniques de guérison! Cela veut dire qu’il faut leur donner une ame: et c’est lamour. Et Jésus, la, a quelque chose a faire! Seigneur, par ton Corps, par ton Sang, guéris le coeur de ’homme, aujourd hui.", "page": 161, "kind": "p"}, {"id": "r29p13", "text": "Il chassa beaucoup d’esprits mauvais et il les empéchait de parler, parce quils savaient « Qui» il était.", "page": 162, "kind": "h"}, {"id": "r29p14", "text": "Ce théme du «secret messianique» reparait ici, pour la deuxiéme fois dans la méme journée (Marc 1/25 et 1/33). Jésus ne veut pas qu’on fausse le sens de sa mission. Jésus impose le silence a tous ceux qui disent trop vite qu'il est « Fils de Dieu». Il y avait trop d’idées fausses qui couraient sur le Messie, et sur Dieu. On cherchait trop le merveilleux superficiel. On accourait trop a lui, seulement comme vers un simple « quérisseur». Proclamer trop vite que Jésus est le Messie, le Fils du Tout-Puissant, sans savoir qu'il allait luirméme souffrir et mourir, c’était parler sans savoir ce qu’on disait, et risquer de renier Jésus en découvrant cette réalité de la croix. Dieu n’est pas « tout-puissant» au sens ou nous lentendons... il se fera pour nous le « tout-faible », par amour... parce qu'il est «l'amour tout-puissant». Si tu es le Fils de Dieu, descends de la croix. Nous gardons toujours cette idée que Dieu aurait di montrer « Qui» il était! Eh bien, il ’a montré: il est ’amour infini, qui va jusqu’au bout du «service»... Je suis venu pour servir et donner ma vie! En attendant ce moment de la croix ot: Dieu se révéle, il faut «se taire», faire «silence».", "page": 162, "kind": "p"}, {"id": "r29p15", "text": "Seigneur, aide-moi 4 T’accepter tel que tu es.", "page": 162, "kind": "p"}, {"id": "r29p16", "text": "Seigneur, aide-moi 4 comprendre que Tu ne veux pas étre « puissant» au sens du monde... «car ce qui est faiblesse de Dieu est plus fort que les hommes,", "page": 162, "kind": "p"}, {"id": "r29p17", "text": "et ce qui est folie de Dieu est plus sage que les hommes » (I Corinthiens 1/25).", "page": 162, "kind": "p"}, {"id": "r29p18", "text": "Le lendemain, bien avant l’aube, Jésus se leva. Il sortit et alla dans un endroit désert, et la il priait.", "page": 163, "kind": "h"}, {"id": "r29p19", "text": "Dés la premiére nuit que Simon Pierre passa prés de Jésus, il découvre cet « essentiel» : pour Jésus, voila ce qui compte... la «rencontre du Pére».", "page": 163, "kind": "p"}, {"id": "r29p20", "text": "Simon et ses compagnons se mirent a sa recherche...", "page": 163, "kind": "h"}, {"id": "r29p21", "text": "Au matin, dans la nuit encore noire, «bien avant Paube», Jésus est sorti de la maison ow il avait couché. Il quitte la ville de Capharnatim. Regardez-le marcher dans la campagne, dans la nuit. Il cherche la solitude, le silence. Il sécarte «dans un endroit désert». Il s’arréte. Il se prosterne. Il prie. Jésus, c’est ’humanité «auprés du Pére»... cest humanité qui «rencontre Dieu»... C’est lA que ses amis doivent venir le chercher.", "page": 163, "kind": "p"}, {"id": "r29p22", "text": "Cette phrase de l’évangile n’est pas un détail. C’est le secret, la conclusion, le point d’intensité de cette « premiére journée» de la vie publique. Jésus, par la, nous «crie», mais c’est «en silence»: le sens de votre vie est en Dieu... votre maladie la plus grave, c’est celle qui vous éloigne de Dieu... celui qui sait se « cacher en Dieu» dans le désert est un homme sauvé... alors toutes les fiévres, et la mort elleméme, ne peuvent plus Iatteindre!", "page": 163, "kind": "p"}, {"id": "r29p23", "text": "Toi, mon frére malade... toi, mon frére dans l’épreuve du coeur... sauras-tu entendre la « bonne nouvelle» de ta quérison? au sein méme de ton épreuve...", "page": 163, "kind": "p"}, {"id": "r29p24", "text": "Quand ils font trouvé, ils lui disent : « Tout le monde te cherche.» Mais Jésus leur répond: «Partons ailleurs, dans les villages voisins, afin que la aussi, je proclame la Bonne Nouvelle, car c’est pour cela que je suis sorti...", "page": 163, "kind": "h"}, {"id": "r29p25", "text": "Oui. Jésus, redis-nous, redis 4 tous, ta Bonne Nouvelle. Sauve-nous. Guéris-nous. Et fais de nous, avec Toi, des messagers, des serviteurs de la Paque.", "page": 163, "kind": "p"}]}, {"id": 30, "title": "6e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 164, "ref": "Marc 1/40.45", "paragraphs": [{"id": "r30p1", "text": "Un lépreux vient «auprés de Jésus»...", "page": 164, "kind": "h"}, {"id": "r30p2", "text": "de partout on venait « auprés de Jésus»...", "page": 164, "kind": "h"}, {"id": "r30p3", "text": "Selon un procédé classique de la littérature sémitique, qu’on appelle « inclusion», cette page de Marc est encadrée par ces deux formules semblables. Au début du récit, il sagit d'une démarche personnelle. A la fin du récit, on viendra de toutes parts.", "page": 164, "kind": "p"}, {"id": "r30p4", "text": "Jésus, c’est Dieu-venu-a-la-rencontre-de-’homme.", "page": 164, "kind": "p"}, {"id": "r30p5", "text": "Mais faut-il encore que homme vienne 4a la rencontre de Celui qui est «sorti pour cela», pour cette rencontre. Seigneur, conduis-moi jusqu’a cette rencontre auprés de Toi.", "page": 164, "kind": "p"}, {"id": "r30p6", "text": "Il tombe a ses genoux et le supplie: «Si tu veux, tu peux me purifier! »", "page": 164, "kind": "h"}, {"id": "r30p7", "text": "N’oublions pas que nous sommes au tout début de l’évangile (chapitre premier, quarantiéme ligne!) : cet homme est bien audacieux... ou bien il posséde une foi extraordinaire. Il fait un geste, et il dit des mots... qu’on ne peut faire et dire qu’a Dieu.", "page": 164, "kind": "p"}, {"id": "r30p8", "text": "La lépre, surtout en ce temps-la, était pratiquement une maladie incurable. La guérison des lépreux était une sorte d’exploit comparable a la résurrection d'un mort. Cétait Pun des « signes» de ’avénement messianique du Régne de Dieu (Matthieu 11/2.5, Luc 7/18.22). L;humble supplication du lépreux manifeste la confiance qu’il porte en Jésus. Oui, il est des situations ot le seul recours soit ce «cri» vers Dieu, maitre de limpossible: « Seigneur, si tu le veux, tu peux me sauver!» Une priére a redire.", "page": 164, "kind": "p"}, {"id": "r30p9", "text": "Sixiéme dimanche ordinaire Lol", "page": 165, "kind": "p"}, {"id": "r30p10", "text": "Pris de pitié devant cet homme...", "page": 165, "kind": "h"}, {"id": "r30p11", "text": "Les manuscrits grecs portent, ici, deux mots: « splagknisteis», pris de pitié, pris aux entrailles, ému jusqu’au tréfonds de létre, et «orgisteis», pris de colére. Il y a de grandes chances pour que le mot authentique, utilisé par Marc, soit « pris de colére», parce quill est plus difficile a interpréter: un scribe, choqué par cette expression, l’aura édulcorée. Comme les deux «versions» existent dans les manuscrits, il n’est pas inutile de méditer les deux sens. Pourquoi le Saint-Esprit, inspirateur de la Bible, n’irait-il pas jusque-la? jusqu’a utiliser des erreurs de copistes pour nous parler ?", "page": 165, "kind": "p"}, {"id": "r30p12", "text": "De toute fagon, nous avons, dans ces deux mots, une «réaction trés humaine»! L'Incarnation de Dieu est « réelle », et va jusqu’a ces humbles sentiments humains: la pitié, la colére. Merci, Seigneur, d’avoir voulu éprouver nos émotions, d’avoir montré méme en public tes mouvements de sensibilité.", "page": 165, "kind": "p"}, {"id": "r30p13", "text": "«Pris de colére...» Qu’est-ce que cela peut bien signifier ? J’y vois, personnellement, la réaction spontanée de Dieu devant «le mal de ’homme». Jésus voit, devant lui, un pauvre visage ravagé de plaies purulentes, et c’est « intolérable» pour lui. Ca le met en colére. N’oublions pas que Jésus, cest «Dieu rendu visible». Par ce mouvement dhumeur, Jésus nous dit que Dieu condamne cette affreuse condition de homme atteint dans sa chair par la maladie. Cette révolte rejoint celle de tant d’hommes, qui trouvent, dans le «probléme du mal»,-lobjection la plus forte contre existence de Dieu.", "page": 165, "kind": "p"}, {"id": "r30p14", "text": "«Pris de pitié...» Cette expression est plus immédiatement compréhensible. Non, nous n’avons pas un Dieu insensible, impassible... mais un Dieu vulnérable, un Dieu qui souffre avec les souffrants, un Dieu qui prendra sur Lui nos blessures. (Isaie 53/5). Celui qui «rend visible Dieu» nous dit toute la tendresse de Dieu pour les malades. Quand admettrons-nous enfin que ce monde, tel qu’il est « actuellement», n’est pas «fini» ? Seul Dieu est Dieu. Seul Dieu est parfait. Le monde n’est pas « dieu». Le monde n’est pas parfait. Dieu n’a pas pu faire autre chose qu’un monde «non-dieu», sinon il n’aurait rien fait, et il serait resté l’éternel solitaire. Il a donc décidé de créer un vrai partenaire, homme, forcément marqué de «finitude», forcément «non-dieu» et donc soumis aux aléas de la santé déficiente, avec laffreuse possibilité d’étre lépreux, ou mongolien, quand les chromosomes fonctionnent mal: il faut oser regarder «ce monde» en face. Mais, si Dieu a fait une créature marquée de finitude et d’imperfection... il ne la faite que dans le projet de lui donner, un Jour, sa propre Vie divine. Pour Dieu, homme est inachevé, tant qu’il n’est pas ressuscité, tant qu'il n’est pas divinisé! Et le mal qui atteint Phomme «le met en colére» et «suscite sa pitié»: alors, Jésus guérit quelques malades, comme un « signe» du Jour final, quand tout «sera achevé» (Romains 8/18).", "page": 165, "kind": "p"}, {"id": "r30p15", "text": "Jésus étendit la main, le toucha...", "page": 166, "kind": "h"}, {"id": "r30p16", "text": "Nous méditons encore sur «la main»... Ce geste prend une signification particuliére, ici, pour un lépreux, qui était un «intouchable». Personne, jamais, ne lavait touché, embrassé, caressé. C’était interdit par la Loi. Quand quelqu’un, méme, approchait trop prés de lui, il devait crier, pour l’éloigner: «Impur! Impur!» Et voici que Jésus ose briser le terrible tabou: il touche le lépreux.", "page": 166, "kind": "p"}, {"id": "r30p17", "text": "Nl dit: « Je veux! Sois purifié!»", "page": 166, "kind": "h"}, {"id": "r30p18", "text": "Jésus sauve par un «geste», et par une «parole»: c’est le principe méme de chaque sacrement. Nous sommes des étres corporels, et nous avons besoin de gestes corporels. Alors, il y a Peau qui coule sur nos fronts au baptéme, pendant qu’une parole explicite le sens de ce contact. Et il y a le pain de vie qui touche notre main et notre corps dans l’eucharistie, pendant qu’une parole explicite le sens: « Voici le Corps du Christ. »", "page": 166, "kind": "p"}, {"id": "r30p19", "text": "Je pourrais prendre un peu de temps pour méditer aussi sur l’expression: «Je veux!» La encore le traducteur a édulcoré le texte authentique de Marc en grec (quel dommage!) Le lépreux n’avait pas dit: « Si tu le veux», mais « si tu veux». Et Jésus répond non pas «Je le veux», mais «je veux». L’accent n’est pas mis sur le « pronom», mais sur la puissance du simple vouloir de Jésus... plus que sur la chose voulue.", "page": 166, "kind": "p"}, {"id": "r30p20", "text": "A linstant méme, sa lépre le quitta et il fut purifié.", "page": 167, "kind": "h"}, {"id": "r30p21", "text": "L’expression trahit le contexte culturel de l’époque ot écrit saint Marc. Pour un juif, la lépre était un «chatiment de Dieu» qui avait puni Myriam, la soeur de Moise (Nombres 12/9), Géhazi, le serviteur d’Elisée (2 Rois 5/27), Ozias, le roi ambitieux (2 Chroniques 26/16). La lépre était la maladie qui faisait peur, et qu’on redoutait méme quand on voyait une simple moisissure sur les murs. Aussi le livre du Lévitique lui avait consacré deux chapitres. La putréfaction du visage et des mains révélait toute ’horreur de ce mal, qu’on considérait comme démoniaque: le lépreux était, a strictement parler, excommunié, exclu de la communauté (Lévitique 13/1. 46). Dans ce mal qui pourrit ’homme, on voyait le «symbole» du péché. Mais alors, qui n’est pas lépreux? Et d’une telle lépre, qui nous guérira? C'est le «contact», et la « parole» de ’humanité de Jésus! Par ton Corps, Jésus-Christ, guéris le coeur de homme, aujourd’hui. La lépre n’existe plus dans nos régions occidentales. Mais il reste des millions de lépreux dans les pays du Tiers Monde. Et parmi nous, dans nos sociétés avancées, subsistent des pauvres pour lesquels l’action « guérisseuse» de Jésus doit trouver des mains et des coeurs: tous ceux qui nont ni beauté ni apparence pour attirer le regard, ceux qui sont exclus de nos sociétés, les enfants handicapés, les malades incurables.", "page": 167, "kind": "p"}, {"id": "r30p22", "text": "Aussit6t Jésus le chassa en le rudoyant.", "page": 167, "kind": "h"}, {"id": "r30p23", "text": "Cest la traduction exacte du texte de Marc (qu’on a encore trouvé le moyen d’atténuer en «il le renvoya avec cet avertissement sévere»). Le Jésus qui nous est montré la, A condition de respecter le texte, n’est pas le «mou» que nous représentent les images du siécle dernier. C’est un homme plein de force et de tempérament.", "page": 167, "kind": "p"}, {"id": "r30p24", "text": "« Attention, ne dis rien a personne...»", "page": 167, "kind": "h"}, {"id": "r30p25", "text": "Comme Jésus impose silence aux démons, il impose rudement silence au miraculé. L’expression est véhémente: «rien»..., «a personne».", "page": 167, "kind": "p"}, {"id": "r30p26", "text": "Cst le fameux + «secret messianique », dix fois répété dans évangile de Marc. C’est comme si Jésus évitait de faire des miracles, si souvent mal compris! Les juifs (et nous!) attendaient un messie temporel. Les foules se précipitaient dans lespoir que Jésus leur apporterait le bonheur ici-bas, qu’il résoudrait leurs problémes de santé, qu'il restaurerait Pindépendance politique. Oui, les miracles, c’est dangereux, pour Jésus, cela pourrait faire échouer sa mission, ou la faire totalement dévier: ils pourraient faire penser que le Régne de Dieu va consister en un bonheur terre a terre. Le vrai «salut», le sauvetage radical, que Jésus propose, ne pourra bien se comprendre qu’a la lumiére de sa mort et de sa résurrection: il faut attendre ce moment-la pour ne plus se tromper sur la nature de la «libération» de homme, dont Jésus est l’artisan! Les guérisons sont des annonces de la Résurrection.", "page": 167, "kind": "p"}, {"id": "r30p27", "text": "Mais va te montrer au prétre, et donne pour ta purification ce que Moise prescrit dans la Loi: ta guérison sera pour eux un témoignage.", "page": 168, "kind": "h"}, {"id": "r30p28", "text": "De méme que Jésus impose silence du miraculé par rapport aux foules, il le charge de mission auprés des prétres. Cétait d’ailleurs indispensable, pour qu'il puisse étre réintégré dans la société. Mais, de plus, Jésus tente d’ouvrir les yeux de ces prétres de Jérusalem qui seront si opposés a lui, en leur donnant le signe messianique de la guérison des lépreux: ils seront sans excuse quand ils le condamneront (Jean 15/22).", "page": 168, "kind": "p"}, {"id": "r30p29", "text": "Une fois parti, cet homme se mit a proclamer et répandre «la Parole», de sorte quil n’était plus possible a Jésus d’entrer ouvertement dans une ville. Il se tenait dehors dans des endroits déserts. Et on venait auprés de lui de partout.", "page": 168, "kind": "h"}, {"id": "r30p30", "text": "Pour Marc, ce mot «la parole» proclamée est un terme technique utilisé dix autres fois dans son évangile: c’est lévangile, la «Bonne Nouvelle». Malgré interdiction de Jésus, nous voyons donc le «sauvé» devenir « sauveur» a son tour. Et nous? Proclamons-nous la Parole? Une fois de plus, nous contemplons l'amour que Jésus a de la solitude, des «lieux déserts» : il est vraiment l'image de Dieu, le Dieu discret, le Dieu qui ne fait pas de fracas, le « Dieu caché »...", "page": 168, "kind": "p"}]}, {"id": 31, "title": "7e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 169, "ref": "Marc 2/1.12", "paragraphs": [{"id": "r31p1", "text": "Jésus était de retour a Capharnaiim, et la nouvelle se répandit qu'il était « a la maison». Tant de monde s’y rassembla qu'il n’y avait plus de place, méme devant la porte.", "page": 169, "kind": "h"}, {"id": "r31p2", "text": "Jésus, on s’en souvient, avait vécu sa « premiére journée» de ministére a4 Capharnaiim. Aprés quelques jours de tournées en Galilée, Jésus revient. Le bruit court: «il est a la maison!» Marc n’éprouve pas le besoin de préciser. Mais tout porte a croire qu'il s’agit toujours de la maison de Simon-Pierre et d’André.", "page": 169, "kind": "p"}, {"id": "r31p3", "text": "Jésus a beau chercher le calme, «dans les endroits déserts » (Marc 1/13 - 1/35 - 1/45)... ila beau recommander la discrétion (Marc 1/25 - 1/34 - 1/44)... la foule le harcéle. Rien a faire. Cela souligne toute l’ambiguité de lattente messianique, et osons le dire, toute l'ambiguité de la recherche de Dieu: Quel Dieu cherchons-nous? Que le Christ ait été attirant, séduisant, cela ne prouve pas grandchose. Dire qu’on est « pour Jésus» ne signifie pas forcément grand-chose. Jésus se défiait de ce mouvement. Quand les «foules» se rassemblaient, Jésus n’était pas dupe: cela n’engageait 4 pas grand-chose... on n’attendait de lui que des bienfaits temporels. N’oublions pas que, de temps en temps, se levaient des illuminés qui se disaient le messie attendu, et qui, aussi, soulevaient les foules. Cela nous fait mieux comprendre pourquoi Jésus semblait redouter les grands rassemblements de foules. Et moi? Quelle est ’idée que je me fais de Dieu? Est-ce que cette image d’un Jésus fuyant les foules me parle? Que m’engage-t-elle 4 vivre?", "page": 169, "kind": "p"}, {"id": "r31p4", "text": "Jésus leur « annoncait la parole»).", "page": 170, "kind": "h"}, {"id": "r31p5", "text": "Voila Pessentiel, pour lui. Méme si les foules sont venues pour «voir du miracle», pour éprouver le frisson de ce faux-divin qu’est le « sensationnel», l’exceptionnel... Jésus, lui, reste imperturbablement dans son réle: former, éduquer un homme nouveau. Et pour cela, son instrument de choix n’est pas le « merveilleux», mais, tout simplement, la «parole», humble parole humaine, ce « moyen de communication et de dialogue» par lequel quelqu’un parle a quelqu’un, ce modeste « bruit de vent», cette onde délicate qui part d’un cerveau et d’un coeur pour aller vers un autre cerveau et un autre coeur, afin de créer entre eux une «communion» spirituelle.", "page": 170, "kind": "p"}, {"id": "r31p6", "text": "Je prends le temps de contempler longuement Jésus en train de parler...", "page": 170, "kind": "p"}, {"id": "r31p7", "text": "Le texte grec de Marc dit, littéralement: «Il leur parlait la parole»...", "page": 170, "kind": "p"}, {"id": "r31p8", "text": "En écrivant cela, Marc ne pouvait pas ne pas songer a ces catéchéses approfondies qui constituaient l’essentiel des premiéres assemblées chrétiennes au cours de leurs assemblées liturgiques. Oui, le « premier acte» de Jésus, quand il nous rassemble le dimanche, «son jour», c’est de nous «parler la parole». Les chrétiens qui arrivent en retard a la messe se rendent-ils compte qu’ils manquent quelque chose de trés important. Ils manquent ce qui tenait le plus a coeur a Jésus, ce qui faisait toujours en premier. Ils manquent la liturgie de la Parole! Dieu parle, et ils ne sont pas la! Mais quont-ils donc de si important a faire, pour ne pas é@tre a lheure de ce rendez-vous? Seigneur Jésus, rends-nous présents et attentifs quand Tu prends la parole.", "page": 170, "kind": "p"}, {"id": "r31p9", "text": "Arrivent des gens qui lui aménent un « paralysé», porté par quatre hommes. Comme ils ne peuvent Papprocher a cause de la foule, ils découvrent le toit au-dessus de Jésus, font une ouverture, et descendent le brancard sur lequel était couché le paralysé... voyant leur foi...", "page": 170, "kind": "h"}, {"id": "r31p10", "text": "Les trois évangélistes, Marc, Matthieu et Luc, rapportent cette scéne. Mais seul Marc donne tous ces détails. Les Septiéme dimanche ordinaire 157,", "page": 170, "kind": "p"}, {"id": "r31p11", "text": "maisons d’Orient sont des maisons a terrasse. On peut monter sur le «toit» par un escalier extérieur. Le plafond était formé de tiges de roseaux posées sur des poutres et recouvertes de boue séchée. Les «quatre» porteurs du brancard ont donc décidé de faire un trou dans la terrasse, et au bout de quatre cordages ils descendent le malade. Il faut le faire! Et toute cette acrobatie semble intéresser Marc au plus haut point. Pour nous, c’est bien filmé, c’est du bon cinéma, du «sensationnel» quoi! On imagine les journalistes avec leurs appareils de photo. Mais Marc, lui, na pas d’abord ce souci historique de homme moderne qui recherche un document. Pour Marc, ces détails concrets sont une «ic6ne», une image porteuse de signification doctrinale : « voyant leur foi, Jésus dit...» Oui, cette scéne d’acrobatie témoigne de la foi des porteurs. La foi conditionne les miracles: idée chére a Marc. Au point que Jésus, dit-il, ne «peut pas faire de miracle» quand la foi manque (Marc 6/5 - Marc 9/21.24). Et moi? Quelle est ma foi? Que me fait-elle faire ?", "page": 171, "kind": "p"}, {"id": "r31p12", "text": "Voyant leur foi, Jésus dit au paralysé: « Mon fils, tes péchés sont pardonnés...", "page": 171, "kind": "h"}, {"id": "r31p13", "text": "Surprise! On s’attendait 4 un miracle. Et Jésus ne fait pas de miracle. Tiens! Celui-la, ne va-t-il point le guérir? Alors que leur foi a surmonté tant d’obstacies ?", "page": 171, "kind": "p"}, {"id": "r31p14", "text": "Voila bien encore lessentiel, pour Jésus. Au lieu de se laisser entrainer au rédle de thaumaturge, de «messie-amiracles», de « faiseur-de-sensationnel», Jésus souligne la foi des personnages et se contente d’accomplir une ceuvre messianique toute intérieure: il pardonne! Il n’y a pas eu d’aveu, pas de confession, pas méme de demande globale de pardon. Ils ne venaient pas pour ca! Mais, c’est lhabitude; Dieu donne plus que ’homme n’attend. Dieu n’est pas lié aux attentes et aux demandes de homme. II donne plus! Il donne a sa mesure a Lui, gratuitement, sans mérite de notre part.", "page": 171, "kind": "p"}, {"id": "r31p15", "text": "Nous rendons-nous compte, en cet instant du scénario, de ce qui vient de se passer: le paralysé, qui suppliait pour sa guérison, est toujours la, toujours paralysé!", "page": 171, "kind": "p"}, {"id": "r31p16", "text": "Ainsi nous arrive-t-il souvent, 4 nous aussi. Nous sommes dans une situation qui nous fait souffrir. Nous supplions Dieu qu'il nous en délivre. Et tout reste comme avant, au niveau du visible. Nous serions tentés de penser que Dieu ne nous a pas exaucés. Et pourtant... si nous regardons au niveau de la foi [qui fait voir linvisible... (Hébreux 11/1)] tout est déja changé! Mais, c’est de lintérieur.", "page": 171, "kind": "p"}, {"id": "r31p17", "text": "Alors, cette scéne de 'lévangile nous interroge: que demandons-nous a Jésus ?", "page": 172, "kind": "p"}, {"id": "r31p18", "text": "Or, il y avait dans l’assistance quelques scribes qui étaient assis et raisonnaient en eux-mémes: « Pourquoi cet homme parle-t-il ainsi? Il blasphéme. Qui donc peut pardonner les péchés, sinon Dieu seul? »", "page": 172, "kind": "h"}, {"id": "r31p19", "text": "Il n’y a que quelques jours que Jésus prend la parole. Et, déja, il n’a pas que des admirateurs, mais des opposants, des «incroyants». Marc a construit toute la suite de son récit pour mettre en évidence cette- opposition. Cinq « controverses» violentes vont affronter Jésus aux scribes et aux pharisiens:", "page": 172, "kind": "p"}, {"id": "r31p20", "text": "— a propos du pardon des péchés (Marc 2/1.12);", "page": 172, "kind": "p"}, {"id": "r31p21", "text": "— a propos d’un repas pris avec les pécheurs (Marc Z2TS a):", "page": 172, "kind": "p"}, {"id": "r31p22", "text": "— a propos du refus de jetiner (Marc 2/18.22);", "page": 172, "kind": "p"}, {"id": "r31p23", "text": "— a propos du sabbat violé (Marc 2/22.28) ;", "page": 172, "kind": "p"}, {"id": "r31p24", "text": "— a propos, a nouveau, d’une infraction a la Loi (Marc 3/1.6).", "page": 172, "kind": "p"}, {"id": "r31p25", "text": "Ainsi, Jésus, la bonté de Dieu en Personne, est entouré d’adversaires. C’est la Passion qui se profile, dés le départ de Pévangile. Jésus sera condamné par ces mémes scribes, spécialistes de la bonne religion, et pour la méme raison de «blasphéme» (Marc 14/64). Je contemple Jésus entouré d’ennemis qui le surveillent. Sa vie quotidienne sera véritablement dramatique, chaque jour. On épie ses paroles. Jésus est en procés... jusqu’a la fin du monde.", "page": 172, "kind": "p"}, {"id": "r31p26", "text": "Eh bien! Pour que vous sachiez que le Fils de ’homme a le « pouvoir» de pardonner les péchés sur la terre...", "page": 172, "kind": "h"}, {"id": "r31p27", "text": "Pour la premiére fois, Jésus se désigne luiiméme comme le «fils de Thomme», adoptant ainsi une prophétie messianique qui était dans tous les esprits. Daniel avait décrit un Fils d’ Homme venant sur les nuées du ciel: « Voici, venant sur les nuées du ciel, comme un fils dhomme. A lui fut conféré pouvoir (exousia en grec), honneur et royauté sur tous les peuples. Son pouvoir est un pouvoir a jamais, qui ne passera jamais, et son royaume ne sera pas détruit» (Daniel 7/13.14). Nous notons la répétition du mot « pouvoir», c'est un mot-clef. Marc met dans la bouche de Jésus exactement le méme mot, et dans le méme contexte. «Le fils de Phomme a le pouvoir (exousia en grec) de remettre les péchés!» Ce pouvoir, c’est celui du Juge eschatologique, le Juge de la fin des temps. Jésus re-citera deux autres fois cette méme prophétie de Daniel: pour annoncer la destruction du Temple (Marc 13/26) et au cours de son procés devant le Sanhédrin (Marc 14/62).", "page": 172, "kind": "p"}, {"id": "r31p28", "text": "Oui, nous croyons que Jésus a ce « pouvoir» du Juge de la Fin des Temps. Mais, remarquons-le, ce pouvoir ne semble pas fait « pour punir»... mais « pour pardonner». Et notre «credo» de chrétiens ne nous demande pas de croire du péché, mais a «la rémission des péchés»! Dés le début de lévangile, il nous est demandé de changer d’idée sur Dieu : il nous faut découvrir que le péché n’est pas d’abord ce qui nous fait honte, ce qu'il faut avouer péniblement, ce dont il faut se corriger peineusement... mais ce qui donne a Dieu loccasion de nous manifester son amour. Méme quand il n’y a pas une once de repentir dans un coeur humain, déja le Seigneur nous pardonne, et y met tout le prix, a Pavance. Il «devance» méme la demande de pardon: «Oui, c'est alors que nous n’étions encore capables de rien, que le Christ, au temps fixé, est mort pour des pécheurs» (Romains 5/6).", "page": 173, "kind": "p"}, {"id": "r31p29", "text": "Je te Pordonne, léve-toi! Prends ton brancard et rentre chez toi.", "page": 173, "kind": "h"}, {"id": "r31p30", "text": "Nous retrouvons, sous la plume de Marc, ce mot « égeird » qui signifie a la fois «se lever», «se réveiller», et « ressusciter»! Et c’est le soir méme de Paque, le soir de la résurrection, que Jésus donnera a des hommes le pouvoir de remettre les péchés (Jean 20/23). Tel est le pouvoir réel de Jésus!", "page": 173, "kind": "p"}, {"id": "r31p31", "text": "Tous étaient stupéfaits et rendaient gloire 4 Dieu en disant: « Nous n’avons jamais rien vu de pareil.", "page": 174, "kind": "p"}, {"id": "r31p32", "text": "Toute liturgie pénitentielle se termine par une liturgie d’action de graces.", "page": 174, "kind": "p"}]}, {"id": 32, "title": "8e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 175, "ref": "Marc 2/18.22", "paragraphs": [{"id": "r32p1", "text": "En cette année liturgique B, nous lisons, en continu, l'’évangile selon saint Marc. Nous pourrions en faire une lecture «naive», c’est-d-dire nous laisser porter tout simplement et spontanément par nos découvertes personnelles. Cette maniére de lire l’évangile est bonne, et peut convenir parfaitement a la priére individuelle: il n’est pas besoin d’étre « savant», bien au contraire, pour comprendre et prier l’évangile. Pourtant, il n’est pas inutile, non plus, de découurir que les évangiles ne sont pas un texte «naif», mais un document théologique et historique profondément élaboré.", "page": 175, "kind": "p"}, {"id": "r32p2", "text": "Une lecture « scientifique» est possible et nécessaire, si l'on ne veut pas que les jeunes, en particulier, et tous les esprits marqués par la science moderne, n’abandonnent un jour cet évangile, en le reléguant au musée des antiquités et des contes de fées. C’est cette lecture éxégétique que nous essayons de monnayer, dimanche aprés dimanche, en soulignant les structures, les mots techniques, les références a l’Ancien Testament, le contexte historique, les enjeux des manuscrits, les comparaisons avec d'autres documents. Loin de détruire la «foi», la science ne peut que la renforcer. Nous pensons que l’évangile n’a rien a craindre: c’est, indéniablement, le texte littéraire le plus éprouvé scientifiquement, de toute histoire de la littérature... le texte le plus étudié... le texte le plus critiqué... le texte le plus scientifiquement certain.", "page": 175, "kind": "p"}, {"id": "r32p3", "text": "Nous allons voir, dans le passage d’aujourd’hui, par exemple, que cette page apparemment naive, comporte, en fait, des allusions d’une extréme importance, qu’on ne peut découvrir que si on accepte d’approfondir, de chercher, de se poser des questions. La priére la plus personnelle peut jaillir, alors, appuyée sur du solide.", "page": 175, "kind": "p"}, {"id": "r32p4", "text": "Comme les disciples de Jean Baptiste et les pharisiens jeiinaient, on vient demander a Jésus: « Pourquoi tes disciples ne jefinent-ils pas ? »", "page": 176, "kind": "h"}, {"id": "r32p5", "text": "Nous pourrions en rester 4 un premier niveau psychologique élémentaire, en retrouvant, une fois de plus, les pharisiens toujours a la recherche de ce qui est mal «chez les autres». En fait, Marc a rapporté ce récit en le groupant, intentionnellement, dans une série de cinq controverses, qui sont toutes, est-ce par hasard, des questions d’évolutions dans des pratiques religieuses, qui se posaient dans les premiéres communautés chrétiennes, opposées aux communautés qui restaient juives: pourquoi changer la religion ?", "page": 176, "kind": "p"}, {"id": "r32p6", "text": "— 1 controverse: Le pardon des péchés, qui en a le droit? comment? (Marc 2/1.12).", "page": 176, "kind": "p"}, {"id": "r32p7", "text": "— 2° controverse: Les repas et la fréquentation des publicains et pécheurs (2/13.17).", "page": 176, "kind": "p"}, {"id": "r32p8", "text": "— 3° controverse: La pratique du jefine, non observée, pourquoi? (2/18.22).", "page": 176, "kind": "p"}, {"id": "r32p9", "text": "— 4 controverse: Le sabbat non respecté, violé par les disciples de Jésus (2/23.28).", "page": 176, "kind": "p"}, {"id": "r32p10", "text": "— 5° controverse: Encore un geste de Jésus interdit le jour du sabbat (3/1.6).", "page": 176, "kind": "p"}, {"id": "r32p11", "text": "Ce que Jésus va dire, tout a ’heure, en conclusion, sur le «neuf» et le «vieux», s’inscrit parfaitement dans ce contexte brillant: oui. Jésus est venu faire craquer tout ce que l’ancienne Loi de Moise contenait de caduc, de vieux! Jésus, c’est du neuf!", "page": 176, "kind": "p"}, {"id": "r32p12", "text": "Voici donc des gens, les «disciples» de Jésus, qui posent question !", "page": 176, "kind": "p"}, {"id": "r32p13", "text": "Ce petit groupe d’hommes que Jésus vient d’«appeler» et qui le « suivent », provoque un choc sur ceux qui les voient vivre: c’est une sorte de joie inhabituelle. Des gens qui «mangent et boivent» normalement, au lieu de prendre des allures de pénitence. Des gens qui ont lair d’étre a la « féte». Des gens «heureux», des gens qui rayonnent de joie! de joie de vivre! Voyons, disent les pharisiens, normalement, jusqu’ici, les gens pieux, les gens spirituels, se dis-tinguaient toujours par leur austérité, leurs sacrifices. Eux, les pharisiens, ils « jeGinaient deux jours par semaine» (Luc 18/12), et ils sen vantaient comme d’une performance supérieure «au reste des hommes». Et nous, disciples de Jésus d’AUJOURD'HUI? Posons-nous question a ceux qui nous voient vivre? Qu’est-ce qui pose question en nous ? Notre mine triste ? Ou bien notre mine joyeuse ? Sommesnous heureux d’étre chrétiens? Est-il agréable de vivre avec nous? Nos «rassemblements» chrétiens, qu’est-ce qui mane d’eux? La joie? L’ennui?", "page": 176, "kind": "p"}, {"id": "r32p14", "text": "Jésus répond: «Les invités de la noce pourraient-ils donc jedainer, pendant que l’'Epoux est avec eux. Tant quils ont PE poux avec eux, ils ne peuvent pas jeainer. »>", "page": 177, "kind": "h"}, {"id": "r32p15", "text": "Eh oui! répond Jésus, c’est bien la « féte». Mes disciples sont des «invités a la noce». Le mot grec que nous traduisons ainsi signifie exactement «les fils de la chambre nuptiale». Il s’agit donc bien de ces «garcons d’honneur » qu’on choisissait dans les noces de jadis et qui étaient chargés de créer l’ambiance de féte au milieu de l'assemblée joyeuse. Jésus trouve tout a fait normal que ses disciples soient trés joyeux et «ne jedinent pas». Seigneur, donne-nous Ta joie.", "page": 177, "kind": "p"}, {"id": "r32p16", "text": "Avouons tout de méme que cette justification est bien énigmatique. Pourquoi parler de «noce» alors que, manifestement, extérieurement, il n'y en a pas? Pourquoi ce titre d’«époux», trois fois repété en deux lignes dans le texte de saint Marc ? Qui est cet époux ? Quel est cet «amoureux», dont Jésus parle?", "page": 177, "kind": "p"}, {"id": "r32p17", "text": "Marc, a partir de ce moment de son récit, ne s'intéresse plus guére a la question premiére: faut-il jeGner ou ne pas jediner? Il revient, manifestement, a unique question que pose son évangile, d’un bout a l'autre: Qui est donc Jésus ? En se présentant comme l’Epoux, Jésus dit quelque chose dessentiel, qu’une lecture naive risque de laisser passer sans le remarquer. Tout Ancien Testament est rempli de ce théme des épousailles. Une des premiéres émergences de ce théme est dans le prophéte Osée que nous lisons aujourd’hui: « Mon épouse infidéle, je vais la séduire, je lui parlerai coeur a coeur... Tu seras ma fiancée, je t’apporterai lamour et la tendresse, et tu connaitras le Seigneur...». C’est Dieu qui est amoureux de son peuple. C’est le grand théme de l’Alliance (Osée 2/18.22). «Ton époux, c’est ton créateur », disait Isaie (54/5) (Jérémie 2/2 - 3/1 ; Ezékiel 16 - 23; Isaie 62/4.5; Cantique des cantiques entier). Pour toute oreille juive du temps de Jésus, habituée a la Bible, Pallusion était évidente : une fois de plus, Jésus se mettait a la place de « Dieu», exactement comme lorsqu’il remettait les péchés a un paralysé.", "page": 177, "kind": "p"}, {"id": "r32p18", "text": "Ce théme de Dieu-époux de lhumanité devrait susciter notre réflexion et notre priére. Souvent les hommes, et nous les chrétiens avec eux, nous opposons Dieu et homme. L’image que Dieu lui-méme donne, quand il se présente a nous, ce n’est pas celle du Tout-Puissant qui enléve toute responsabilité 4 homme... c’est plutdt celle du « partenaire» qui est engagé dans une aventure «a deux», une aventure d’amour... Dieu est «avec nous», dit Jésus. « Comment mes disciples seraient-ils tristes puisque lEpouxDieu est avec-eux?» Est-ce que je réponds a cet amour ? Et tous mes amours humains, est-ce que les vis dans cette lumiére, y compris mon amour de couple, si je suis marié ? comme le dit trés explicitement saint Paul (Ephésiens 5/25.33).", "page": 178, "kind": "p"}, {"id": "r32p19", "text": "Mais un temps viendra ou l'Epoux leur sera enlevé: ce jour-la, ils jeineront.", "page": 178, "kind": "h"}, {"id": "r32p20", "text": "Un nuage de tristesse passe dans les yeux de Jésus. Ce mot « enlevé» est inattendu. Le texte grec est méme beaucoup plus fort: «un temps viendra ot lépoux leur sera “arraché”!» Jésus annonce, de maniére discréte, sa Passion et sa mort, en utilisant un mot de violence que la Bible avait déja utilisé 4 propos du « Serviteur de Dieu»: « Sa vie sera enlevée (arrachée) de la terre... Par contrainte, il a été enlevé. Oui, il a été retranché de la terre des vivants » (Isaie 53/8). Il est tres €émouvant de penser que Jésus, parmi les innombrables « textes» qui annongaient le Messie, en a choisi certains plutét que d’autres... ceux ot il se reconnaissait davantage: les textes annoncant un messie humble, et souffrant, en particulier.", "page": 178, "kind": "p"}, {"id": "r32p21", "text": "Cest, ici, le théme de «absence»... Dieu absent... L’Epoux absent... Le monde éprouve cette absence comme une douloureuse épreuve. «Alors, ils jefineront! » En contrepartie de la Joie, qui reste essentielle aux « disciples de Jésus», voici donc le « sérieux» de existence chrétienne qui est souligné. Jésus, finalement, n’est pas contre le jeGne, comme le lui reprochaient les pharisiens. Mais il lui donne un nouveau sens: pour ses disciples, la seule référence de toute «pratique religieuse» c’est Jésus en personne: un rapport mystérieux s’établit, qui lie le destin des disciples 4 «sa» présence... 4 «son» absence... Le Caréme ne peut plus étre seulement une performance ascétique volontariste : c’est aussi « par amour » qualors, ils jedneront!", "page": 179, "kind": "p"}, {"id": "r32p22", "text": "Personne ne raccommode un vieux vétement avec une piéce d’étoffe neuve... Personne ne met du vin nouveau dans de vieilles outres... A vin nouveau, Outres neuves...", "page": 179, "kind": "h"}, {"id": "r32p23", "text": "Toute la finale de cette page d’évangile tourne autour de Popposition entre le «vieux», et le «neuf». Dieu, selon Jésus, niaime pas les raccommodages, les rapiécages. Jésus avait conscience d’apporter vraiment du «neuf» a ’humanité : finies les routines, les vieilles habitudes qui ser.tent le moisi. Est-il bien vrai que nous sommes les disciples de ce Jésus-la? Ne retombons-nous pas-souvent dans le vieil esprit? Caréme proche: temps du renouveau!", "page": 179, "kind": "p"}]}, {"id": 33, "title": "9e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 180, "ref": "Marc 2/23 - 3/6", "paragraphs": [{"id": "r33p1", "text": "Un jour de Sabbat, Jésus marchait a travers les champs de blé; et ses disciples, chemin faisant, se mirent a arracher des épis.", "page": 180, "kind": "h"}, {"id": "r33p2", "text": "Avant l’envahissement des autos et des motos, jadis, dans les villages, on passait le dimanche aprés-midi 4 se promener tranquillement, a pied, en famille ou entre amis, dans les campagnes avoisinantes. Les juifs fidéles, aujourd’hui encore, passent ainsi leur sabbat: c’est le jour de la priére, de étude, de la vie de famille...", "page": 180, "kind": "p"}, {"id": "r33p3", "text": "Le groupe des amis de Jésus nous apparait comme un groupe spontané, insouciant, qui ne passe pas son temps a calculer ce qui est « permis» ou «défendu» le jour du sabbat. En passant a travers champs, ils se mettent a grignoter des grains de blé.", "page": 180, "kind": "p"}, {"id": "r33p4", "text": "Seigneur, donne-nous de conserver le goiit des choses simples, de la vie ordinaire.", "page": 180, "kind": "p"}, {"id": "r33p5", "text": "Les pharisiens lui disaient : « Regarde ce quiils font le jour du Sabbat! Cela n’est pas permis. »»", "page": 180, "kind": "h"}, {"id": "r33p6", "text": "Les pharisiens sont des justes. Aucune raison de les suspecter a priori. Ils sont sincéres, intégres, généreux, soucieux d’appliquer la Loi jusque dans ses moindres détails. «Il n’y a pas de petit commandement», disent leurs sages. Ils avaient fouillé la Bible, et trouvé trente-neuf actions interdites pendant toute la durée du «Sabbat», mot qui veut dire « Repos» en hébreu. Ainsi, on n’avait pas le droit de faire plus de 1.392 métres. Il était défendu, évidemment, de faire la moisson (Exode 34/21). C’est cette interdiction de faire tout travail manuel que les pharisiens reprochent directement a Jésus... au lieu d’attaquer ses disciples. L’amour de la Loi, chez les « hassidim», « fidéles», va jusqu’a les pousser 4a la faire respecter par tous leurs fréres juifs. Dans le quartier de Mea Shéarim, par exemple, on édifie le vendredi soir des barrages de feuillage pour empécher les voitures de circuler le jour du Sabbat... encore aujourd’hui, en plein Jérusalem. Dévotion a la « volonté du Trés-Haut»! Toute infraction est scandaleuse.", "page": 180, "kind": "p"}, {"id": "r33p7", "text": "Jésus leur répond: « N’avez-vous pas lu ce que fit David, lorsqu’il fut dans le besoin et qu’il eut faim, lui et ses compagnons ? Au temps du grand-prétre Abiathar, il entra dans la “ Maison de Dieu” et mangea les “Pains de ’Offrande” que seuls les prétres peuvent manger, et il en donna aussi a ses compagnons. »»", "page": 181, "kind": "h"}, {"id": "r33p8", "text": "On aurait pu s’attendre 4 ce que Jésus, si attentif a la volonté de Dieu, soit d’accord avec ces fidéles, soucieux d’appliquer la Loi dans toute sa précision. Mais, précisément, Jésus se fait de Dieu une tout autre idée que celle de ce Dieu tatillon. Sa réponse est d’une audace inouie: il ose justifier ceux qui transgressent la Loi, en se servant méme d'un passage dcriture (I Samuel 21/1.7). Le geste de David avait toute ’apparence d’une transgression sacrilége. David, chef de bande, entre avec ses soudards dans le sanctuaire de Nob. Sur la table sainte sont disposés rituellement, en deux piles de six, les douze Pains de l’Offrande, qui représentent symboliquement la présence permanente des douze tribus d’Israél devant Yahveh. Aucun laic ne pouvait toucher a ces pains sacrés. Chaque Sabbat, ils étaient renouveleés ; et les pains anciens étaient mangés sur place par les prétres! Or, voila que les hors-la-loi de David se jettent dessus... et les mangent... Mais le pire c’est que Jésus est d’accord. Et il justifie leur geste simplement par le fait «quills avaient faim!». Au nom d’un simple «besoin humain», un homme a le droit de transgresser une loi cultuelle. La nécessité ’'emporte sur une loi positive, si nette soit-elle.", "page": 181, "kind": "p"}, {"id": "r33p9", "text": "Jésus leur disait encore: « Le Sabbat a été fait pour rhomme, et non pas Phomme pour le Sabbat.»", "page": 181, "kind": "h"}, {"id": "r33p10", "text": "Formule révolutionnaire, scandaleuse pour son temps. Jésus renverse la morale traditionnelle de son temps: toute «loi», quelle vienne des hommes ou de Dieu, est au service de homme! et non Ilinverse. La simple vie de homme qui a faim a plus de prix aux yeux de Dieu que toutes les observances légales. Merci, Jésus, de nous révéler ce Dieu-la... ce Dieu qui prend la défense de l’homme. Libére-nous, Jésus, de toute nos étroitesses, de tous nos formalismes. Rends-nous plus attentifs aux besoins de nos fréres.", "page": 182, "kind": "p"}, {"id": "r33p11", "text": "« Voila pourquoi le Fils de homme est maitre, méme du Sabbat. »»", "page": 182, "kind": "h"}, {"id": "r33p12", "text": "Oui, cette page d’évangile, comme tant d’autres, nous révele lidentité de cet homme étonnant: il ose prétendre qu'il a les pleins pouvoirs... il s’identifie au Fils de /homme, ce personnage céleste chargé de réaliser le vrai Régne de Dieu (Daniel 7).", "page": 182, "kind": "p"}, {"id": "r33p13", "text": "Une autre fois, Jésus entra dans une Synagogue.", "page": 182, "kind": "h"}, {"id": "r33p14", "text": "Les pharisiens sont ici chez eux, dans cette maison de la loi qu’est une Synagogue. Chaque Sabbat, les fidéles s’y réunissent trois fois: un premier office le vendredi soir, un autre le samedi matin, et un troisiéme dans l’aprés-midi. La priére communautaire, a laquelle seuls les hommes sont invités, comporte essentiellement la lecture de la Torah (la Loi), le chant des psaumes, et des louanges ou supplications.", "page": 182, "kind": "p"}, {"id": "r33p15", "text": "Il y avait la un homme dont la main était paralysée. On observait Jésus pour voir s'il guérirait le jour du Sabbat ; on pourrait ainsi accuser.", "page": 182, "kind": "h"}, {"id": "r33p16", "text": "Dans cette assemblée, qui devrait étre une réunion de fréres en communion les uns avec les autres, sous la crotte superficielle de ces gens assis les uns a cété des autres, se découvrent en réalité de farouches oppositions. On siignore, par habitude, et sans probleme: cet homme handicapé, on y est habitué, on ne le voit plus. Mais aussi, on se hait: les pharisiens ne sont attentifs a la liturgie que pour surveiller si Jésus ne va pas faire ce qui est interdit. Ce jeune Rabbi commence déja a avoir la réputation de ne pas appliquer toute la Loi: on Pépie pour le prendre en flagrant délit.", "page": 182, "kind": "p"}, {"id": "r33p17", "text": "Délivre-nous, Seigneur, de nos critiques, de nos manques d'amour.", "page": 183, "kind": "p"}, {"id": "r33p18", "text": "Jésus dit a Phomme qui avait la main paralysée: « Viens te mettre la devant tout le monde.»", "page": 183, "kind": "h"}, {"id": "r33p19", "text": "Ce Jésus est un provocateur. Ce quill va faire et dire doit avoir beaucoup d’importance. Jésus est un homme libre, que rien ne fera dévier de sa route.", "page": 183, "kind": "p"}, {"id": "r33p20", "text": "Et s’adressant aux autres: «Est-il permis, le jour du Sabbat, de faire le bien ou de faire le mal? de sauver une vie ou de tuer?»)", "page": 183, "kind": "h"}, {"id": "r33p21", "text": "La question de Jésus, sous forme interrogative comme souvent, contient en fait cing « révélations» : Jésus y révéle «Sa mission», qui est de sauver... il révéle «le sens quil a de homme», qui est le primat de la conscience sur toute régle... il révéle le « vrai Dieu», qui est pour la santé, pour la vie, pour le bonheur de ses créatures... il révéle aussi, paradoxalement, le vrai sens de la « Loi», en lui restituant son but (le Sabbat est un signe de amour de Dieu pour homme: loin de détruire le Sabbat, il intériorise)... enfin, Jésus révéle le «vrai culte» qui plait a Dieu.", "page": 183, "kind": "p"}, {"id": "r33p22", "text": "Ainsi, pour nous AUJOURD’HUI, le dimanche devrait étre le jour de la joie, le jour de la vie, le jour de l'amour, le jour de la féte, le jour de Dieu, le jour ot lon « fait du bien», le jour ot Pon «sauve»!", "page": 183, "kind": "p"}, {"id": "r33p23", "text": "Quelle est ma conception du dimanche? Qu’est-ce qui est sacré pour moi, ce jour-la? Sanctifier le «jour du Seigneur», est-ce une réalité chaque semaine? II serait tragiquement contraire a l’évangile que, le jour ow je vais a la messe, je ne rende pas a Dieu le culte véritable de l'amour fraternel, ce culte qui est valable pour tout homme et dont personne, jamais, ne peut étre dispensé. Les « pratiquants » de la messe sont-ils aussi des « pratiquants » du service des autres? La messe, dans son essentiel, n’est rien d’autre que le grand «service», le grand «don de soi» jusqu’au bout, de Jésus. « Voici mon corps livré, voici mon sang versé... Faites cela en mémoire de moi!»", "page": 183, "kind": "p"}, {"id": "r33p24", "text": "Mais ils se taisaient. Alors, promenant sur eux un regard de colére, navré de I’«endurcissement de leurs cceurs», il dit A Phomme: « Etends la main». Il Pétendit, et sa main redevint normale.", "page": 184, "kind": "h"}, {"id": "r33p25", "text": "Ils ne veulent pas répondre a la question de Jésus. Ils sont trop sars de posséder la vérité. Ils n’entament méme pas le dialogue. Ils refusent méme de discuter.", "page": 184, "kind": "p"}, {"id": "r33p26", "text": "Je contemple le visage de Jésus «en colére», «navré»... passionné pour la vie, révolté contre le mal qui atteint homme. Tristesse profonde de Jésus devant nos refus.", "page": 184, "kind": "p"}, {"id": "r33p27", "text": "«L’endurcissement du coeur» est un terme biblique extrémement fort, qui signifie le refus obstiné de la foi, et qui aboutit en fait a l'incapacité radicale de percevoir quoi que ce soit de la réalité de Dieu (Exode 8/11.15.25 ; Deutéronome 15/7; Psaume 4/3 - 94/8).", "page": 184, "kind": "p"}, {"id": "r33p28", "text": "Une fois sortis, les pharisiens se réunirent avec les partisans d’Hérode contre Jésus, pour voir comment le faire périr.", "page": 184, "kind": "h"}, {"id": "r33p29", "text": "Pour lévangile de Marc, nous ne sommes encore qu’au tout début de la vie publique de Jésus: la croix déja se profile. Pendant trois ans, ce sera un combat sans merci. Mystére du «jugement»: laction «salvatrice» de Jésus déclenche la haine. Lui, au nom de Dieu, ne veut que «sSauver», eux pensent a «tuer». Le message libérateur provoque exactement leffet opposé: ils s’enferment dans leur dureté de coeur. Ils sont déja jugés : ce sont eux qui se sont jugés, a l’avance. Sauve-nous, Seigneur, de nos refus.", "page": 184, "kind": "p"}]}, {"id": 34, "title": "10e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 185, "ref": "Marc 3/20.35", "paragraphs": [{"id": "r34p1", "text": "Jésus entre dans une maison, ot de nouveau la foule se rassemble, si bien qu'il n’était méme pas possible de manger.", "page": 185, "kind": "h"}, {"id": "r34p2", "text": "Au début de sa prédication, Jésus a eu du succés. La «foule», c’est-a-dire les gens du petit peuple, se pressaient autour de lui pour l’écouter. Marc, qui met par écrit la prédication de Pierre, note qu’un jour il y avait tant de monde qu’on n’avait méme plus la place pour manger. Cette maison, c’est sans doute justement celle de Simon-Pierre, a Capharnatim, que Jésus avait adoptée comme la sienne (Marc 1/29 - 2/1 - 3/20 - 9/28 - 9/33 - 10/10). Dans les ruines actuelles de la ville de Capharnaiim, les archéologues ont retrouvé la base d’une modeste maison de pécheurs datant du I* siécle avant J.-C. sur laquelle avait été édifié un trés ancien sanctuaire chrétien. Les grafitti de dévotion marqués dans les platres suggérent qu’on aurait retrouveé, la, cette «maison» oti Jésus résida souvent.", "page": 185, "kind": "p"}, {"id": "r34p3", "text": "Depuis Incarnation, nos maisons ont pris une dignité nouvelle. Nous imaginons Jésus, dans l'une d’elles... la maison pauvre d’un marin prés du port... au milieu des autres maisons du village, dans le dédale des ruelles.", "page": 185, "kind": "p"}, {"id": "r34p4", "text": "Sa famille, Papprenant, vint pour se saisir de lui, car ils affirmaient: «Il a perdu la téte.»", "page": 185, "kind": "h"}, {"id": "r34p5", "text": "Voila ce qu’on disait de lui, dans sa famille: «C’est un exalté... il est devenu fou... il a perdu la téte...» Evidemment, depuis quelque temps, quelle différence avec sa vie tranquille de trente ans a Nazareth! La famille de Jésus ne pouvait pas ignorer qu'il était «mal vu» des autorités religieuses... «il va nous faire attraper des histoires»... Ils viennent donc pour le récupérer et le faire rentrer dans l’ordre. Sommes-nous préts a4 accepter les vocations un peu «folles», risquées, déraisonnables selon les bonnes petites prudences humaines ? Nous arrive-t-il parfois, a la suite de Jésus, d’apparaitre comme quelqu’un d’un peu «fou»? parce que nous ne suivons pas toutes les normes habituelles du monde, dans les: affaires, dans les problémes de conscience, de conduite personnelle ou collective?", "page": 185, "kind": "p"}, {"id": "r34p6", "text": "Les scribes, qui étaient descendus de Jérusalem, disaient: «Il est possédé par Béelzéboul; c’est par le chef des démons qu'il expulse les démons. »", "page": 186, "kind": "h"}, {"id": "r34p7", "text": "Une deuxiéme opinion, beaucoup plus grave, se colportait autour de Jésus. Non seulement «il est fou», mais «il est possédé»! Insinuation perfide. Personne ne nie l’authenticité de ses miracles. Mais il tient son « pouvoir» de Satan, que les juifs de ’@époque appelaient du nom méprisant de « Baal du fumier » (c’est le sens du mot Béel-zéboul). Et ce sont les «scribes», les «lettrés», qui lancent ce soupcon.", "page": 186, "kind": "p"}, {"id": "r34p8", "text": "Les appelant prés de lui, Jésus disait en parabole: «Comment Satan peut-il expulser Satan? Si un royaume se divise, ce royaume ne peut pas tenir. Si une famille se divise, cette famille ne pourra pas tenir. Si Satan s’est dressé contre lui-méme, s'il est divisé, il ne peut pas tenir; c’en est fini de lui. Mais personne ne peut entrer dans la maison d’un homme fort et piller ses biens, s'il ne l’'a d’abord ligoté. Alors seulement il pillera sa maison.)", "page": 186, "kind": "h"}, {"id": "r34p9", "text": "C’est la premiére et courte parabole rapportée par Marc: limage d’un combat au corps a corps, rapide et décisif. Jésus y montre qu'il a conscience d’étre « plus fort» que Satan! Aujourd’hui, c’est toujours vrai. La lutte continue. Et Jésus est avec nous dans nos combats contre le mal. Sommes-nous pessimistes ou optimistes, face aux déferlements des forces mauvaises dans notre monde?", "page": 186, "kind": "p"}, {"id": "r34p10", "text": "Amen, je vous le dis: Dieu pardonnera tout aux enfants des hommes, tous les péchés, et tous les blasphémes qu’ils auront faits. Mais si quelqu’un blasphéme contre le Saint-Esprit, il n’obtiendra jamais le pardon. Il est coupable d’un péché pour toujours. Jésus parla ainsi parce quis avaient dit: «Il est possédé par un esprit impur.»", "page": 186, "kind": "h"}, {"id": "r34p11", "text": "Ce rvest pas la nature du péché en question, ni la limitation de la miséricorde divine, qui rend ce péché impardonnable, mais uniquement l’obstination volontaire dans le mal. II faut le répéter avec Jésus: Dieu ne condamne personne... Dieu pardonne tous les péchés... a tout le monde. Mais il peut exister des hommes qui se ferment résolument a ce pardon: c'est le «blasphéme contre lEsprit». Dieu a beau pardonner, certains refusent ce pardon: ce doit étre cela lenfer. Aucun de ceux qui-s’y-condamnent ne veut en sortir... sinon il serait immédiatement sauvé par ce Dieu qui « pardonne tous les péchés et tous les blasphémes».", "page": 187, "kind": "p"}, {"id": "r34p12", "text": "Ce refus obstiné jusqu’au bout est-il frequent?", "page": 187, "kind": "p"}, {"id": "r34p13", "text": "Nul ne peut juger son frére de l’extérieur. Mais que chacun examine son propre cas : en ce moment, au jour ou je suis aujourd’hui, la question 4 me poser n’est pas: «Est-ce que je suis pécheur?» Car tous sont pécheurs (Romains 3/23). Mais la seule question est celle-ci: « Est-ce que j’accueille le pardon de Dieu?.... est-ce que je blasphéme IlEsprit Saint ?... est-ce que je me moque de cet amour qui justifie gratuitement tous les pécheurs?» (Romains 3/24).", "page": 187, "kind": "p"}, {"id": "r34p14", "text": "Jésus, prends pitié de moi qui suis pécheur. Christe, eleison. Telle est la fameuse «priére a Jésus» que répetent inlassablement les fidéles de Orient. —", "page": 187, "kind": "p"}, {"id": "r34p15", "text": "Alors arrivent sa mére et ses fréres.", "page": 187, "kind": "h"}, {"id": "r34p16", "text": "Marc a emboité l'un dans autre Pépisode du « refus des scribes», et celui de la démarche de sa famille. Ce procédé littéraire lui est familier, pour nous inviter a chercher les liens entre deux situations. Jésus est rejeté, méconnu... dans sa propre famille. Le mot « frére», en hébreu, désigne indifferemment les fréres et les cousins. Ceux-ci ont entrainé leur tante, la « mére» de Jésus, dans leur tentative de récupération. Notons laudace de Marc. C’est la premiére fois qu’il nous parle de Marie! Et c’est pour dire cela. Vraiment lévangile ne cherche pas a enjoliver. Ce sont des choses qui ne sinventent pas.", "page": 187, "kind": "p"}, {"id": "r34p17", "text": "Restant « au dehors», ils le font demander. Beaucoup de gens étaient assis autour de lui. Et on lui dit: «Ta meére et tes fréres sont la dehors, qui te cherchent. »", "page": 188, "kind": "h"}, {"id": "r34p18", "text": "Une scéne a imaginer: des gens assis par terre en cercle autour de quelqu’un qui parle. Dans le Nouveau Testament, c’est la posture habituelle des « disciples» qui écoutent le « maitre» (Luc 10/39 ; Actes 22/3). Par opposition 4 ceux qui sont «dans la maison», Marc, par deux fois, note que la famille de Jésus «est dehors». Cette expression «ceux du dehors» est habituelle, dans l'Eglise des premiers siécles, pour désigner les «non-chrétiens» (I Thessaloniciens 4/12; I Corinthiens 5/12.13 ; Colossiens 4/5 ; I Timothée 3/7). Marc réutilisera ce langage qui sépare les hommes en deux catégories, selon qu’ils écoutent Jésus avec foi, ou quils restent « dehors»: « A vous, les mystéres sont ouverts... mais A ceux qui sont dehors, tout devient énigme incompréhensible» (Marc 4/11). - Cette scéne, ot! Marie et les cousins de Jésus viennent pour essayer d’arréter la mission de Jésus, doit nous faire longuement méditer sur ce qu’est la foi. La foi de Marie, pas plus que la nétre, n’est «toute-faite», une fois pour toutes. La foi ne peut se définir que comme une réalité qui évolue. Ce n’est pas dés le premier instant de l’Annonciation que Marie a compris qui était son fils, méme si elle a eu des lumiéres toutes spéciales. Luc, lui aussi, a noté que Marie, 4 certaines occasions, n’a «pas compris» Jésus (Luc 2/50).", "page": 188, "kind": "p"}, {"id": "r34p19", "text": "Mais Jésus leur répond: «Qui est ma mére? Qui sont mes fréres ?»» Et parcourant du regard ceux qui étaient assis en cercle autour de lui, il dit: « Voici ma mére et mes fréres. Celui qui fait la volonté de Dieu, celui-la est mon frére, ma sceur, ma mére.»", "page": 188, "kind": "h"}, {"id": "r34p20", "text": "Marc a souvent noté ces « regards» de Jésus (Marc 3/5 - 5/32 - 10/21 - 11/11 - 12/41). Une des plus simples priéres que nous puissions faire, c'est ceci: penser qu’en ce moment Jésus me regarde.", "page": 188, "kind": "p"}, {"id": "r34p21", "text": "«Celui qui fait la volonté de Dieu est mon frére... ma mére.» La volonté du Pére, c’est la hantise de Jésus. Jésus est amoureux... amoureux de Dieu! Ceux qui aiment Dieu, dit-il, sont de sa famille, sa seule vraie famille. A ce titre, Marie est doublement sa mére. Sa vraie grandeur est de «faire la volonté de Dieu».", "page": 188, "kind": "p"}, {"id": "r34p22", "text": "«Assis en cercle autour de Lui...» «sous le regard de Jésus»... telle est, pourrait-on dire, la premiére communauté chrétienne. Chaque messe nous permet de revivre cela. La catéchése essentielle, pour tous, a tout age, c’est la «liturgie de la Parole». Donne-nous, Seigneur, d’écouter ta parole, et de la «faire», pour entrer dans ta famille...", "page": 189, "kind": "p"}]}, {"id": 35, "title": "11e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 190, "ref": "Marc 4/26.34", "paragraphs": [{"id": "r35p1", "text": "Il en est du Régne de Dieu comme d’un homme qui jette le grain dans son champ.", "page": 190, "kind": "h"}, {"id": "r35p2", "text": "Jésus utilise une comparaison trés naturelle, connue de tous ses auditeurs. «Semer!» Geste si habituel que nous risquons de ne plus en voir le mystére. Geste risqué. Que va devenir cette semence ?", "page": 190, "kind": "p"}, {"id": "r35p3", "text": "Nuit et jour, qu’il dorme ou quill se léve, la semence germe et grandit, il ne sait comment. D’elle-méme, la terre produit d’abord lherbe, puis lépi, enfin du blé plein lépi.", "page": 190, "kind": "h"}, {"id": "r35p4", "text": "On a appelé cette parabole «le grain qui pousse tout seul». Effectivement, tout se passe comme si «personne» ne s’occupait de ce grain jeté en terre... comme si le paysan se désintéressait de ce blé qu'il a semé. C’est l'une des paraboles les plus optimistes que nous ayons. Marc est le seul des quatre évangélistes a nous lavoir rapportée. II faut faire jouer notre imagination, et recomposer le film de cette croissance, imperceptible, et toujours aussi « incompréhensible» aujourd’hui qu’au temps de Jésus. Nos savants ont beaucoup progressé dans la description et analyse des phénoménes extérieurs... mais aucun d’eux ne sait encore ce quest la vie. Dés qu'une graine a été jetée en terre, commence, dans le secret, une fantastique alchimie de la matiére, une série de merveilles invisibles. Peu importe que homme s’en tracasse ou non; la «vie» ne dépend pas de lui, dans son essentiel. La culture aide la nature. Elle ne la remplace jamais. Le grain... la petite tige verte... la fleur minuscule... Pépi... et; a la fin, d’autres grains plus nombreux que celui dont tout esi parti!", "page": 190, "kind": "p"}, {"id": "r35p5", "text": "Que veux-tu nous dire, Seigneur, par cette parabole d’espérance ? Quelle invitation nous adresses-tu par ces mots ? Personne ne peut se mettre a notre place pour répondre a ces interrogations. Quelle est «ma» situation a laquelle sadresse Jésus en ce moment, aujourd’hui? Quelle est la situation de l’Eglise actuelle, du monde actuel, a laquelle nous pouvons appliquer cette lecon d’espérance ?", "page": 191, "kind": "p"}, {"id": "r35p6", "text": "Mais aussit6t que le grain le permet, on y met la faucille, car c’est le temps de la moisson.", "page": 191, "kind": "h"}, {"id": "r35p7", "text": "La situation change tout d’un coup. Le texte grec de Marc contient deux particules qui soulignent ce contraste: « Mais»... et «aussit6t». Aprés la longue période d’inaction du paysan, voici lheure fébrile de la moisson. N’oublions pas le début de cette parabole. Il s’agit bien du « Régne de Dieu». Le comportement de cet agriculteur doit nous aider a comprendre le comportement de Dieu. Une fois de plus, lévangile n’est pas d’abord une « lecon de morale» et nous navons pas a nous précipiter trop vite sur les « applications pratiques a notre vie». L’évangile est d’abord « révélation» sur Dieu, et ce n’est que par rapport a cette vérité de foi mieux découverte que nous pouvons, comme indirectement, adopter une attitude concréte.", "page": 191, "kind": "p"}, {"id": "r35p8", "text": "Quelle est donc la révélation sur Dieu de cette parabole? Jésus éclaire la situation de son temps, manifestée clairement dans la déception de Jean Baptiste: « Es-tu celui qui doit venir, ou devons-nous en attendre-un autre? (Matthieu 11/3). Mais c’est la question aussi d’aujourd’hui, comme de tous les temps: comment se fait-il qu’on ne voie pas davantage le Régne de Dieu ? Pourquoi Dieu donne-t-il limpression de se désintéresser de ce qui se passe dans le champ du monde? Jésus répond: Dieu ne s’y prend pas autrement que le paysan... attendez le « temps de la moisson»... en attendant, c’est une illusion d’optique de penser quil ne se passe rien... vous ne voyez pas... mais vous ne voyez pas tout! Nous le savons, ce qui ne se voit pas n’est pas forcément inexistant, bien au contraire. « L’essentiel est invisible», disait le renard au «Petit Prince», dans Saint Exupéry. Un grain de blé contient des milliards de milliards d’atomes, formés d’un noyau autour duquel gravitent des particules de l’ordre du milliardiéme de milliardiéme de millimétre, et qui tournent a une vitesse de 297.000 kilométres a la seconde! Tu ne vois pas tout cela. C’est pourtant cela la vérité du grain de blé. Tout ce qui est «divin» dans le monde est de cet ordre-la: force cachée, imperceptible, active... que ne détectent que les coeurs simples, ceux qui acceptent de «croire» en la révélation que Jésus nous fait de Dieu.", "page": 191, "kind": "p"}, {"id": "r35p9", "text": "Pour ceux qui croient, quelle est donc la «conséquence pratique » ?", "page": 192, "kind": "p"}, {"id": "r35p10", "text": "Tire-la toi-méme, ami! Dieu agit dans le secret. C’est un Dieu Caché. Laisse mirir sa semence. Ne désespére jamais. Entreprends. Séme. L’univers ne va pas vers la mort, mais vers la «joie de la moisson». Paysan, prends ta faucille !", "page": 192, "kind": "p"}, {"id": "r35p11", "text": "Jésus disait encore: « A quoi pouvons-nous comparer le Régne de Dieu? Par quelle parabole allonsnous le représenter ?", "page": 192, "kind": "h"}, {"id": "r35p12", "text": "Double interrogation. Simple formule de style pour rappeler le théme ? Ou bien questions venant de Jésus... comme pour souligner la difficulté de parler du Régne de Dieu? En tout cas, souvent, nous aussi nous cherchons. Que peut bien étre ce Régne? Ow va-t-il? Quelle forme prend-il? A quoi ressemble-t-il?", "page": 192, "kind": "p"}, {"id": "r35p13", "text": "Il est « comme» une graine de moutarde: quand on la séme en terre, elle est la plus petite de toutes les semences du monde. Mais quand on Ia semée, elle grandit et devient la plus grande de toutes les plantes potagéres.", "page": 192, "kind": "h"}, {"id": "r35p14", "text": "Encore une image. Jésus est un «maitre de sagesse», un bon pédagogue, un conteur qui sait trouver des maximes piquant la curiosité.", "page": 192, "kind": "p"}, {"id": "r35p15", "text": "La graine de « sénevé», ou « moutarde», était réputée proverbialement pour sa petitesse. Jésus y a fait une autre allusion quand il a dit : « Si vous aviez de la foi gros comme une graine de moutarde...» (Luc 17/6). Cette parabole met donc laccent sur la disproportion entre les débuts, « tout petits»... et ’achévement, « trés grand»... Dans cette comparaison, comme dans la précédente, Jésus répondait au scandale de ses contemporains, qui a di lui étre objecté mainte fois au cours de son ministére: lintervention du Messie de Dieu était attendue comme triomphale et rapide... et le « grand soir» de Dieu ne venait pas. Face aux bouleversements spectaculaires des espérances juives, le ministére de Jésus paraissait si insignifiant! Mais Marc répondait aussi au scandale de son temps: a lépoque ou il rédigeait son évangile, un fait indiscutable troublait les esprits... comment se faisait-il que le peuple Elu, Israél, dans son ensemble n’avait pas accueilli ’évangile de Jésus ?... n’était-ce point la faillite du dessein de Dieu? Cette page est enfin merveilleusement accordée a la plus redoutable question de notre temps: si Dieu existait, ce serait plus clair... pourquoi y a-t-il tant de gens droits et honnétes qui sont incroyants ou agnostiques?... Dieu existe-t-il vraiment ?... ne serait-ce point un phantasme subjectif? lillusion de quelques illuminés ?", "page": 192, "kind": "p"}, {"id": "r35p16", "text": "Jésus lui-méme, si génial prédicateur qu’il fat, si saint, si parfait... n’a pas réussi a convertir ses contemporains, ni sa propre famille (comme nous le révélait lévangile de dimanche dernier). Pourtant, avec une audace folle, il croyait ne pas avoir perdu son temps a semer sa «petite graine». Et histoire lui a donné raison. Désormais quiconque a «semé» un germe dans une ame, quiconque s'est engagé au service d’une oeuvre pour aider ses fréres, quiconque essaie de semer la bonne nouvelle... peut s’appuyer sur cette parole de Jésus pour surmonter ses découragements, ses échecs momentanés. Parents et grands-parents, qui avez limpression d’avoir raté une éducation, prenez une petite graine de moutarde dans votre main: vous étes, par la petitesse méme des résultats apparents, des « invités a lespérance». La petite aventure de Jésus a été vérifiée, elle est « grande» déja maintenant. Et a la fin, vous verrez!", "page": 193, "kind": "p"}, {"id": "r35p17", "text": "Et elle étend de lonques branches, si bien que les oiseaux du ciel peuvent faire leur nid 4 son ombre.", "page": 193, "kind": "h"}, {"id": "r35p18", "text": "La plus petite de toutes les graines est devenue cela... un bel arbuste. L’arbre qui donne abri aux « oiseaux du ciel» était une image classique dans la Bible (Daniel 4/9 ; Ezékie 31/6 - 17/22.23; Juges 9/15). Jésus est parfaitement situ dans son milieu culturel. Et dire qu’alors, celui qui osai prédire cette réussite finale n’était que l’obscur galiléen di Nazareth, entouré de douze pauvres sans culture et san: influence. Je relis ta promesse, Seigneur Jésus, et je l’appli que a tous mes découragements. Donne-nous l’espéranc et la foi.", "page": 193, "kind": "p"}, {"id": "r35p19", "text": "Par de nombreuses paraboles semblables, Jésus leu annongait la Parole, dans la mesure ou ils étaien capables de la comprendre. Il ne leur disait rien san: employer de paraboles, mais, en particulier, il expli quait tout a ses disciples.", "page": 194, "kind": "h"}, {"id": "r35p20", "text": "Oui, Jésus tenait compte de la capacité de foi de ses audi teurs. Mystére de la liberté. A ceux qui étaient mieux dis posés envers lui, A ses amis, Jésus donnait en privé de: explications supplémentaires. La foi est une «vie», uné «relation vivante». Chaque priére prépare la suivante Chaque méditation prépare la suivante. Chaque pas vers Dieu prépare le pas suivant. Ce qui reste obscur pou! beaucoup, c’est un fait, devient de plus en plus éviden pour d’autres. Si tu veux connaitre davantage Dieu, com meénce par faire un premier pas vers lui... un seul pas, pou! le moment. Quel pas devrais-tu faire? pour qu'une crois sance de vie se poursuive.", "page": 194, "kind": "p"}]}, {"id": 36, "title": "12e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 195, "ref": "Marc 4/35.41", "paragraphs": [{"id": "r36p1", "text": "L’enseignement en paraboles a établi une nette distinction entre «ceux du dehors», pour qui tout demeure énigme... et les «disciples», pour qui tout s’éclaire, dans les révélations du mystére que leur fait le « Maitre» en particulier. A la série des paraboles, dans le récit de Marc, succéde une série de quatre miracles, dont la caractéristique significative est quills sont faits non pas en présence des foules, mais seulement «en présence des disciples» : ces miracles ne seraient-ils point des « paraboles en actes» ? destinées a étre interprétées autant au niveau du symbolisme qu’a celui du réalisme ? En tout cas, n’est-il pas révélateur que les apdtres, en plein coeur de la tempéte racontée aujourhui, appellent Jésus « Maitre !» « didaskalos» en grec, qui signifie plus précisément « maitre qui enseigne». Ecoutons donc l’enseignement contenu dans le fait. La lecture théologique d’un événement ne lui enléve pas son historicité, elle lui donne toute sa profondeur.", "page": 195, "kind": "p"}, {"id": "r36p2", "text": "Toute la journée, Jésus avait parlé a la foule en paraboles. En ce jour-la, le soir venu, il dit a ses disciples: «Passons sur lautre rive.» Quittant les foules, ils emmeénent Jésus dans la barque, comme il était; et d’autres barques le suivaient.", "page": 195, "kind": "h"}, {"id": "r36p3", "text": "Au niveau du réalisme historique, jimagine un beau soir dété ot Jésus emprunte la barque de Simon Pierre et séloigne lentement de la plage de Capharnatim. Aprés la chaleur torride du jour, c’est la fraicheur du soir. Aprés la cohue harassante des foules, c’est le moment de Iintimité seul avec son petit groupe d’amis, en mer. C’est Jésus qui a pris l’initiative de ces instants de calme: « Passons de lautre cdté.» Le vent est bon. La voile tendue vibre doucement. On n’entend que le faible gargouillis de ’eau qui fend la proue, et quelques cris de mouettes. Jésus, trés fatigué par sa journée de paraboles, s’endort « comme ¢a», la téte sur le coussin de poupe. Prés de lui, Pierre tient la barre du gouvernail.", "page": 195, "kind": "p"}, {"id": "r36p4", "text": "Mais il serait dommage d’en rester a cette premiére lecture. Quand on sait que ces récits évangéliques, et chaque mot de la moindre phrase, ont été commentés dans la catéchése primitive, il nous faut, nous aussi, essayer une lecture symbolique, dont les interprétations des premiers Péres de l’Eglise sont les témoins.", "page": 196, "kind": "p"}, {"id": "r36p5", "text": "«En ce jour-la.» Pas seulement formule anodine pour dire que la journée des paraboles s’achéve. Dvailleurs, pour Marc, la succession des « faits» est une construction théologique plus qu’un reportage. « Ce jour-ld» ne va pas étre un jour ordinaire. Pierre s’en souviendra toute sa vie. Car il avait dans ses souvenirs bibliques l’évocation du fameux «Jour de Yahveh», le «jour» de la grande intervention de la puissance de Dieu, ce jour précédé des grandes catastrophes eschatologiques (Joél 2 et 3).", "page": 196, "kind": "p"}, {"id": "r36p6", "text": "«Le soir venu.» Pas seulement la douceur du soir qui descend, mais aussi «lheure des ténébres», lheure des épreuves (Marc 14/17; Jean 9/4 - 13/30).", "page": 196, "kind": "p"}, {"id": "r36p7", "text": "«Lautre rive.» Pas seulement la rive opposée du lac, mais aussi ce grand passage de l’autre cété, qui est le sort de tout homme, au soir de sa vie, et qui est son grand jour, le «jour de Dieu»... auquel tous les autres jours le préparent.", "page": 196, "kind": "p"}, {"id": "r36p8", "text": "Survient une violente tempéte. Les vagues se jetaient sur la barque, si bien que déja elle se remplissait deau.", "page": 196, "kind": "h"}, {"id": "r36p9", "text": "Tempéte bien réelle. Encore aujourd’hui, le lac de Tibériade est réputé pour ses coups de vent inattendus et violents, qui descendent en rafales des collines du Golan. Pierre, plus que tout autre, A cause de son métier, les connaissait bien, ces sautes de vent qui font claquer la voile et couchent le bateau dangereusement.", "page": 196, "kind": "p"}, {"id": "r36p10", "text": "Mais il n’y a pas besoin d’étre en mer, pour subir des «tempétes». Toutes les langues du monde utilisent ce mot pour dire «!’@preuve soudaine qui s’'abat sur un homme». Et dans la Bible le theme des tempétes est fréquemment le symbole des forces maléfiques. La création est congue comme le triomphe de Dieu sur le « tohu-bohu» de la mer déchainée (Genése 1/2). La mer est, dans le vieux fond mythique sémite, le lieu du «grand abime» ot régnent les dragons, les grands monstres marins, Léviathan, symbole de Satan (Isaie 27/1; Psaume 74/13; Job 9/13; Daniel 7 ; Apocalypse 12 et 13).", "page": 196, "kind": "p"}, {"id": "r36p11", "text": "Jésus, lui, dormait sur le coussin a larriére.", "page": 197, "kind": "h"}, {"id": "r36p12", "text": "Je contemple Jésus qui dort, les yeux fermés, respiration réguliére, calmement, a la poupe du bateau dans la tempéte. Quelle priére m’inspire, déja, ce détail? Jusqu’ot, Seigneur, nous conduiras-tu? Que tu es déconcertant.", "page": 197, "kind": "p"}, {"id": "r36p13", "text": "Au cours d'une autre tempéte, dans la Bible, un autre homme «dormait», Jonas, qu’on vient aussi réveiller (Jonas 1/3.16). Et, est-ce par hasard, Jésus parle du « signe de Jonas» pour exprimer le seul signe qu’il veuille donner : celui de sa mort et de sa résurrection (Matthieu 12/39.40 ; Luc 11/29.30; Marc 8/12.13). Par ailleurs, les auteurs bibliques parlent souvent de la «mort» en termes de «sommeil» (Psaume 13/4; Daniel 12/2; Ephésiens 5/14; Jean 11/11; Marc 5/39.41). Et cette méme image sert a exprimer le théme de «l indifference de Dieu», de son «absence» : Léve-toi, Seigneur, pourquoi dors-tu? Réveilletoi» (Psaume 44/24 - 35/23 - 59/6 - 78/65; Isaie 51/9.10). Oui, pendant nos tempétes humaines, que c’est vrai, Tu sembles dormir, Seigneur. Ce n’est pas seulement homme moderne qui a inventé ce théme de la «mort de Dieu». C’est le sentiment de la condition humaine, qui se sent impuissante, menacée, devant un Dieu qui n’intervient pas au niveau des «causes naturelles» et qui laisse agir les forces de mort... qui semble endormi.", "page": 197, "kind": "p"}, {"id": "r36p14", "text": "Ses compagnons le réveillent et lui crient: « Maitre, nous sommes perdus; cele ne te fait rien?»", "page": 197, "kind": "h"}, {"id": "r36p15", "text": "Admirable priére, a faire ndtre, dans nos propres tempétes.", "page": 197, "kind": "p"}, {"id": "r36p16", "text": "Réveillé, il interpelle le vent avec vivacité et dit a la mer: « Silence, tais-toi.» Le vent tomba, et il se fit un grand calme.", "page": 198, "kind": "h"}, {"id": "r36p17", "text": "Le mot traduit, ici, par «réveillé», «diégertheis», est le méme que celui qui est souvent utilisé pour dire « ressuscité» (Marc 5/41 - 16/6.14).", "page": 198, "kind": "p"}, {"id": "r36p18", "text": "A travers cet épisode réel raconté par Marc (c’est la prédication de Pierre) nous pouvons donc trés légitimement voir la grande tempéte de la Passion, qui a secoué la petite barque
