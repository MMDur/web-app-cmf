 Dieu, laction de Dieu dans le coeur et Pesprit de tout homme, et qui guide tout homme vers le Christ. Oui, Dieu regardait avec amour les mages paiens qui marchaient vers Jésus. Dans ma vie, il y aussi une grace qui me guide vers la découverte de Jésus. Est-ce que j’ai le courage de la suivre jusqu’ot. elle me conduit? Guide-moi, douce lumiére... un pas, rien qu’un pas... vers Toi!", "page": 49, "kind": "p"}, {"id": "r7p10", "text": "Et nous sommes venus nous prosterner devant lui...", "page": 49, "kind": "h"}, {"id": "r7p11", "text": "«Se prosterner!» Ce verbe, utilisé trois fois dans cette page par Matthieu, indique [attitude profonde de ces mages paiens. Ils viennent pour « adorer».", "page": 49, "kind": "p"}, {"id": "r7p12", "text": "Et moi? Est-ce que je me prosterne parfois ? Devant quoi? Devant qui? Quelle signification est-ce que je donne a mon prosternement au moment de Ilélévation pendant la messe ? Des jeunes, AUJOURD’HUI, retrouvent ce grand geste de la prostration, ot ’homme, reconnaissant sa petitesse, sétale complétement sur le sol dans une adoration de tout létre.", "page": 49, "kind": "p"}, {"id": "r7p13", "text": "En apprenant cela... le roi Hérode fut pris d’inquiétude et tout Jérusalem avec lui.", "page": 49, "kind": "h"}, {"id": "r7p14", "text": "Il réunit tous les chefs des prétres et tous les scribes dsraél.", "page": 49, "kind": "h"}, {"id": "r7p15", "text": "Au cceur du récit de ’Epiphanie; Matthieu propose deux «attitudes», que nous retrouverons constamment au cours de son évangile:", "page": 49, "kind": "p"}, {"id": "r7p16", "text": "— Dune part, le «refus» des chefs politiques et religieux juifs. Ils auraient di étre les premiers a reconnaitre le Messie. Or, que font-ils? Ils «ont peur», ils «s’inquiétent». Ils ne bougent pas! Ils vont chercher, dés le départ, a tuer Jésus. On croit déja entendre le grand cri de tristesse que Jésus poussera sur Jérusalem: «Malheureux! scribes et pharisiens... Jérusalem, Jérusalem! toi qui tues ceux qui te sont envoyés, combien de fois jai voulu rassembler tes enfants! et vous n’avez pas voulu» (Matthieu 23/27.37).", "page": 49, "kind": "p"}, {"id": "r7p17", "text": "— D/autre part, en contraste, «laccueil» fait par ces mages paiens. Moins préparés pourtant a reconnaitre le Messie, ce sont eux qui le cherchent, qui bougent, et qui, loin de «s’inquiéter», éprouvent «une grande joie». On croit déjA entendre la conclusion méme de lévangile de Matthieu: « Allez donc, et.de toutes les nations faites des disciples » (Matthieu 28/19).", "page": 50, "kind": "p"}, {"id": "r7p18", "text": "De fait, cette page d’évangile était destinée, dans les premiers siécles, 4 tenter d’expliquer aux chrétiens d’origine juive (c’est a eux que s’adressait Matthieu) pourquoi lEglise se trouvait composée en majorité par des chrétiens d’origine paienne, alors que Dieu sétait si fortement engagé avec Israél. Matthieu montre, en Jésus, le Sauveur attendu, qui vient pour tout homme: et le « nouvel Israél» est composé de tous ceux qui, juifs ou paiens, «se prosternent» devant Jésus. Cela était déja annoncé par toutes les prophéties « universalistes »: Jérusalem devait devenir la capitale de tous les peuples. « Des foules de chameaux t’envahiront, des dromadaires de Madiane et d’Epha. Tous les gens de Saba viendront, apportant l’or et l’encens, proclamant les louanges du Seigneur » (Isaie 60/1.6). On se souvenait, en Israél, de cette reine de Saba, venue de loin, qui était montée 4 Jérusalem pour rencontrer Salomon. Le Psaume 71, chanté a PEpiphanie, reprend ce méme theme de Pouverture: «Les rois de Tarsis et des fles apporteront des présents. » Et le méme Matthieu redira dans son évangile que les peuples «viendront, de lOrient et de ?Occident, prendre place au festin avec Abraham» (Matthieu 8/11). On voit, une fois de plus, comment cet évangile est composé.", "page": 50, "kind": "p"}, {"id": "r7p19", "text": "Oui, les « mages» représentent tous les paiens (et tous les incroyants) de tous les temps. Et dans ces mots, nous ne mettons aucun sens péjoratif, au contraire! Ils sont nombreux tous ceux, parmi nos amis, qui sont parfaitement sincéres dans leurs convictions, qui ont une vie droite, qui ont le sens de la justice et du service des autres, qui ont une vie de famille exemplaire, et s’acquittent parfaitement de leurs taches professionnelles. Pourtant, ils ne connaissent pas Jésus Christ au sens fort. L’Epiphanie est la féte de tous ceux qui ne connaissent pas Jésus, de tous ceux dont la foi est différente de la nétre, et que Dieu aime, et que Dieu éclaire, et que Dieu attire a lui par sa grace invisible. Mais nous, comment les jugeons-nous ?", "page": 50, "kind": "p"}, {"id": "r7p20", "text": "Voici ce qui est écrit par le prophéte: « Et toi, Bethléem en Judée... de toi sortira un chef qui sera le berger d'Israél mon peuple. »»", "page": 51, "kind": "h"}, {"id": "r7p21", "text": "Pourquoi, dites-moi, l’étoile n’a-t-elle pas conduit les mages, tant qu’a faire, directement 4 Bethléem, prés de Jésus? Pourquoi ce détour par Jérusalem, par les «scribes et les prétres»? Parce que Dieu est fidéle 4 ses promesses, et que, si le salut est offert a-tous,-il vient par lintermédiaire des juifs (Romains 9.10.11).", "page": 51, "kind": "p"}, {"id": "r7p22", "text": "Ce détour par Jérusalem a une signification, lui aussi. C’est qu’on ne peut pas faire l'économie de la « Parole de Dieu», de I’« Ecriture», pour une rencontre explicite du Christ. Et nous ? Méditons-nous inlassablement la Parole ? les « écrits » ?", "page": 51, "kind": "p"}, {"id": "r7p23", "text": "Ils ouvrirent leurs coffrets et lui offrirent leurs présents... Ils repartirent vers leur pays par un autre chemin.", "page": 51, "kind": "h"}, {"id": "r7p24", "text": "Le «culte» est une des fonctions essentielles de lEglise : le vrai culte, c’est de «consacrer a Dieu le fruit du travail de homme et de la terre, et donc, finalement, toutes les valeurs dont vivent les civilisations. La rencontre du Christ transforme une vie: une autre route souvre... Quelle bonne nouvelle, Seigneur!", "page": 51, "kind": "p"}]}, {"id": 8, "title": "Baptême du Seigneur", "group": "Navidad", "page": 52, "ref": "Marc 1/6.11", "paragraphs": [{"id": "r8p1", "text": "Aprés une incursion dans les évangiles de Luc et de Matthieu, les seuls qui nous parlent de l’enfance de Jésus... afin d’évoquer les mystéres de Noél et de lEpiphanie... nous retrouvons l’évangile de Marc. Lui, commence son récit au début de la vie publique de Jésus. Et nous voici donc, d’emblée, introduits dans la phase adulte de Jésus. Il a déja trente ans, environ. ‘", "page": 52, "kind": "p"}, {"id": "r8p2", "text": "Jean Baptiste proclamait dans le désert: « Voici venir derriére moi Celui qui est plus puissant que moi...»", "page": 52, "kind": "h"}, {"id": "r8p3", "text": "Dans les évangiles de Matthieu et de Luc, la prédication de Jean Baptiste a un contenu violent qui proclame la venue imminente du Jugement eschatologique: «Engeance de vipeéres... reprenez-vous... déja la cognée est a la racine de arbre...» (Matthieu 3/7.10, Luc 3/7.9). Marc a totalement omis ce type de prédication, pour ne retenir que l’annonce de «Celui qui vient»... et ’annonce de son Baptéme.... C’est Jésus seul que Jean Baptiste annonce. « Voici venir derriére moi Celui que vous attendez.» Sa venue est imminente. Tenez-vous préts!", "page": 52, "kind": "p"}, {"id": "r8p4", "text": "Je ne suis pas digne de me courber a ses pieds pour défaire la courroie de ses sandales.", "page": 52, "kind": "h"}, {"id": "r8p5", "text": "Ainsi, dés le début de son récit, Marc nous avertit: ce Jésus dont il va parler porte un mystére. Cet «inconnu» encore, avant méme de paraitre sur la scéne, est attendu dans un suspense qui met en valeur sa personnalité exceptionnelle: Qui est-il donc? Jean Baptiste n’oserait méme pas se «courber devant lui»!", "page": 52, "kind": "p"}, {"id": "r8p6", "text": "Moi, je vous ai baptisés dans l'eau, Lui vous baptisera dans I Esprit Saint.", "page": 53, "kind": "h"}, {"id": "r8p7", "text": "Dans ce premier chapitre de Marc, par trois fois, il est question de lEsprit Saint (Marc 1/8 - 1/10 - 1/12). Cette insistance ne doit pas nous laisser inattentifs. Les auditeurs de Jean Baptiste, eux, ne pouvaient pas sy tromper. Ils niignoraient pas, comme nous, les prophéties concernant le Messie porteur de lEsprit (Isaie 11/1.3 - 42/1 - 61/1), et diffuseur dune effusion de lEsprit sur lhumanité aux temps messianiques (Isaie 32/15 - 44/3 - 59/21; Ezékiel 11/19 - 36/25.29 - 37 - 39/29; Joél 3/1...). La prédication de Jean Baptiste annonce donc bien le Messie tout proche, celui qui va répandre |’Esprit, pour faire naitre une humanité nouvelle.", "page": 53, "kind": "p"}, {"id": "r8p8", "text": "«ll vous baptisera, plongera, dans Esprit!» Avons-nous conscience que notre baptéme chrétien est cela! Nous sommes, en moyenne, trés loin de vivre vraiment la profondeur de notre baptéme. Nous sommes tous tentés, a cause du milieu moderne athée dans lequel nous sommes immergés, de mettre le « salut» de ’humanité dans le prolongement de nos efforts, de nos attitudes humaines les plus chargées de valeurs. La mentalité scientifique et technique nous habitue a penser que le salut de ’homme est dans l'homme : devenons plus solidaires, maitrisons davantage la nature, partageons davantage. Ceci n’est pas faux. Mais toute la « révélation biblique » (et ’expérience humaine la plus authentique) nous dit que le sens dernier de homme n’est pas dans ’homme: lunivers, si grand soit-il, n’a pas sa « fin» en luirméme. L’>homme ne s’accomplit totalement qu’en s’ouvrant a une réalité supérieure : Esprit de Dieu! Ainsi, la reponse derniére a toutes les grandes questions n’est pas dans ’homme. A quoi sert a homme de maitriser Punivers, et d’aller sur la lune, si c'est pour s’y suicider ? La dimension de « transcendance» est de plus en plus nécessaire. « Le XXIF° siécle sera chrétien, ou il ne sera pas!» écrivait André Malraux.", "page": 53, "kind": "p"}, {"id": "r8p9", "text": "Or, a cette époque, Jésus vint de Nazareth, ville de Galilée, et se fit baptiser par Jean dans le Jourdain.", "page": 53, "kind": "h"}, {"id": "r8p10", "text": "Premiére apparition de Jésus dans le récit de Marc.", "page": 53, "kind": "p"}, {"id": "r8p11", "text": "Cet «inconnu» a vécu depuis trente ans dans lobscurité d'un petit village que ne cite jamais ni la Bible, ni le Talmud, ni histoire, ni la géographie... avant que ce Jésus ne le rende mondialement célébre. Nazareth comptait, a lépoque, selon les fouilles archéologiques, une vingtaine seulement de maisons, et donc une centaine d’habitants 4 peu prés. C’est de cette étonnante obscurité que va sortir l'un des plus grands mouvements historiques qui a modifié la face de la planéte. Qui est-il donc, ce Jésus? Pour le moment, il donne l'apparence d’étre un homme ordinaire: il vient méme recevoir le baptéme de pénitence.", "page": 54, "kind": "p"}, {"id": "r8p12", "text": "Au moment ot il sortait de Peau, Jésus vit le ciel se déchirer...", "page": 54, "kind": "h"}, {"id": "r8p13", "text": "Luc et Matthieu utilisent, ici, un mot plus doux: «le ciel souvrit». Pour Marc, le ciel «se déchire»!", "page": 54, "kind": "p"}, {"id": "r8p14", "text": "Tout a ’heure, 4 propos de notre baptéme, nous évoquions ce monde ot! [homme a tendance:a s’enfermer. Eh bien, Jésus est celui qui vient faire une « déchirure» dans cet univers clos. Désormais, en sa Personne, |humanité aura-une «bréche» pour communiquer avec le monde divin.", "page": 54, "kind": "p"}, {"id": "r8p15", "text": "Dans ce mot imagé nous reconnaissons le style concret de Marc: Mais nous pouvons aussi voir une allusion a Isaie: au temps de la grande douleur de l’exil, dans le marasme et langoisse du silence de Dieu, un prophéte avait supplié Dieu de rompre son silence comme au temps de la libération de lesclavage d’Egypte, et sa priére était devenue ce cri: «Ah! si tu déchirais les cieux...» (Isaie 63/19).", "page": 54, "kind": "p"}, {"id": "r8p16", "text": "Jésus vit le ciel se déchirer et ’Esprit descendre sur lui comme une colombe.", "page": 54, "kind": "h"}, {"id": "r8p17", "text": "Cette scéne est la premiére de la vie du Christ, selon Marc. Le premier acte de Jésus, selon cet évangéliste, c’est « une vision». Selon Marc, seul Jésus est temoin de cette « déchirure» par laquelle passe l’Esprit. Nous sommes donc devant un événement surnaturel, que les autres temoins ne voient pas. Vision intérieure, qui exprime sans doute une sorte d’approfondissement de la conscience que Jésus posséde de sa filiation divine, et de sa mission. Nous avons beaucoup de peine a imaginer la psychologie de Jésus: il nest pas « devenu» Fils de Dieu par une sorte d’évolution car il faut bien quil le soit depuis toujours... mais, vrai homme aussi, il a bien fallu que quelque chose progresse dans sa conscience, en proportion de son age et de ses expériences. Nous parlerions aujourd’hui d’une « intuition», plut6t que d’une vision. Mais nos mots restent infirmes pour dire les réalités divines.", "page": 54, "kind": "p"}, {"id": "r8p18", "text": "L’Ancien Testament nous montre souvent l’Esprit de Dieu qui sempare d’un homme pour une mission précise (Isaie 11/2; Juges 6/34 - 14/19 - 15/14). Et nous pouvons essayer d’imaginer, effectivement, Jésus saisi soudain, dans son étre humain lui-méme, de la certitude de son «réle» grandiose. ‘ie. i", "page": 55, "kind": "p"}, {"id": "r8p19", "text": "Sous quel aspect s’est «manifesté » Esprit? Nous notons que le texte dit «comme»... comme une colombe. Dans le langage apocalyptique, cette particule est utilisée pour suggérer précisément ce qui n’est pas «visible»: «Il avait des vétements blancs comme neige, et des cheveux purs comme laine» (Daniel 7/9).", "page": 55, "kind": "p"}, {"id": "r8p20", "text": "tant donné que nous sommes dans une «théophanie», c’est-a-dire une « manifestation de Dieu», nous restons bien sr dans le mystére impossible a cerner rationnellement : Dieu ne peut jamais apparaitre que comme une sorte de « défi» pour ’homme... dépassant de partout nos possibilités de conceptualisation, ou d’imagination. Il faut accepter la « déchirure», et se laisser perdre en elle comme en un abime.", "page": 55, "kind": "p"}, {"id": "r8p21", "text": "Du ciel, une voix se fit entendre: « C’est Toi mon Fils Bien-Aimé; en toi jai mis tout mon amour.»", "page": 55, "kind": "h"}, {"id": "r8p22", "text": "Voici donc une expérience unique de tendresse. Jésus se sait aimé. Il est évident que les quelques hommes qui ont pu approcher Jésus ont découvert en lui un type de relation absolument unique avec Dieu. Dans sa priére, il parlait a linvisible avec une familiarité que personne, avant lui, rvavait osé vivre. Il disait: « Abba! », ce qui signifie « Papa! » (Marc 14/36).", "page": 55, "kind": "p"}, {"id": "r8p23", "text": "Depuis des années, dans son obscur et petit village de Nazareth, il avait donc vécu une aventure merveilleuse de filiale affection. Et cela éclatait maintenant comme un carillon dans son coeur: «Tu es mon amour. Tu es mon fils unique. Je me complais en toi.» Ces mots eux-mémes sont tirés de la Bible, bien sfr. Et il nous est bon de retrouver ces phrases que Jésus avait di méditer, qu’il savourait depuis des années dans sa priére, a la Synagogue, ou dans sa vie de chaque jour, dans sa petite maison, avec Marie, au cours de son travail. Avez-vous, parfois, fait cette expérience? De vous sentir aimé ? Et de répondre 4 cet amour ? Quelque chose de fort et de doux qui remplit de paix et de bonheur toutes vos minutes...", "page": 55, "kind": "p"}, {"id": "r8p24", "text": "«Je serai pour lui un pére, et il sera pour moi un fils» (2 Samuel 7/14).", "page": 56, "kind": "p"}, {"id": "r8p25", "text": "«Le Seigneur m’a dit: “Tu es mon fils, aujourd’hui je tai engendré”» (Psaume 2).", "page": 56, "kind": "p"}, {"id": "r8p26", "text": "Voici mon serviteur, mon élu en ae je me complais » (Isaie 42/1).", "page": 56, "kind": "p"}, {"id": "r8p27", "text": "«Jérusalem, on tappellera d'un nom nouveau : on ne dira plus “ L’abandonnée” , on dira “Celle-en-qui-je me complais”» (Isaie 62/4).", "page": 56, "kind": "p"}, {"id": "r8p28", "text": "Les dimanches ordinaires se trouvent p. 129.", "page": 56, "kind": "p"}]}, {"id": 9, "title": "1er Dimanche de Carême", "group": "Cuaresma", "page": 57, "ref": "Marc 1/12.15", "paragraphs": [{"id": "r9p1", "text": "Jésus venait d’étre baptisé...", "page": 57, "kind": "h"}, {"id": "r9p2", "text": "Il faut, en effet, remarquer ce lien entre la scéne de la tentation, et la scéne du baptéme. Les trois évangiles synoptiques ont fait ce rapprochement.", "page": 57, "kind": "p"}, {"id": "r9p3", "text": "« Au moment ot il remontait de ’eau du Jourdain, Jésus vit les cieux se déchirer, et Esprit descendre sur lui. Et des cieux vint une voix: “Tu es mon Fils bien-aimé, en qui jai mis tout mon amour”» (Marc 1/10).", "page": 57, "kind": "p"}, {"id": "r9p4", "text": "Dans le langage courant, le mot «tentation» est souvent dévalué, infantilisé. Etre «tenté», cest, pour un enfant, « avoir envie de faire ce que les parents ont interdit » : manger de la confiture, des bonbons... voler de l'argent... Pour les adultes, formés par une éducation de tabous, étre «tenté», cest, habituellement, «avoir envie de faire des choses sexuelles défendues»... Dans lévangile, la tentation, cest autrement sérieux que cela! La tentation fondamentale porte sur la «foi», ou la «non-foi» en Dieu. La vraie tentation est liée au « baptéme», c’est une tentation propre au «croyant», propre a l’Eglise, c’est la tentation des « fils de Dieu». Celle dont Jésus nous demandera de triompher, en priant chaque jour: «Ne nous soumets pas a la tentation... ne nous laisse pas succomber 4 la tentation...»", "page": 57, "kind": "p"}, {"id": "r9p5", "text": "Les juifs, premiers auditeurs de Jésus... et les premiers chrétiens, au. moment ot: Marc écrivait ce récit de tentation... et nous, AUJOURD’HUI... avouons que nous sommes décus par Dieu! Enfin, Il devrait se montrer un peu plus! Montrer qui il est, tout de méme! Cette «tentation» est fondamentale, constante : nous sommes tentés de mépriser ce Jésus, ce Fils de Dieu, dont la qualité de Messie est si peu évidente, en particulier au moment ot il meurt sur la croix. Au fond, c’est nous, le peuple des «croyants», qui tentons Dieu, en lui demandant d’étre autre que ce quill a choisi d’étre: un Dieu caché... «La» tentation biblique par excellence, c’est de « demander a Dieu des miracles» : qu'll sorte de sa cachette! « Au désert, vos péres m’ont tenté et provoqué... Quarante ans, cette génération m’a décu» (Psaume 94/9). « Que de fois, ils m’ont bravé au désert... de nouveau ils tentaient Dieu» (Psaume 77/40.41). Ce fut la tentation constante des contemporains de Jésus: «Les pharisiens vinrent trouver Jésus pour le tenter, le mettre a lépreuve, en lui demandant un « signe» qui vienne du ciel» (Marc 8/11).", "page": 57, "kind": "p"}, {"id": "r9p6", "text": "Montre donc que Tu es Fils de Dieu! Toi qui viens d’étre proclamé ce Fils par les cieux ouverts et par Esprit Saint! «Si tu es le Fils de Dieu, descends donc de la croix!» (Matthieu 27/40). La tentation des croyants, la tentation de lEglise, c’est de faire descendre Jésus de la croix : montrer un Dieu plus puissant, un Dieu évident, un Dieu dominateur, un Dieu qui ne soit plus « caché», un Dieu qui ne soit plus «incarné», et donc «faible» (I Corinthiens 1/25), un Dieu un peu plus raisonnable, un peu plus rationnel, le Dieu habituel de toutes les religions... mais pas ce Dieu crucifié! «Les juifs demandent des miracles, et les Grecs recherchent la sagesse, mais nous, nous préchons un messie crucifié, scandale pour les juifs, folie pour les paiens» (I Corinthiens 1/22.23).", "page": 58, "kind": "p"}, {"id": "r9p7", "text": "Aussit6t aprés avoir été proclamé «Fils de Dieu» a son baptéme, Jésus fut poussé au désert par lEsprit Saint...", "page": 58, "kind": "h"}, {"id": "r9p8", "text": "Le verbe qui a été traduit ici par « poussé» est, dans le texte grec, beaucoup plus fort. Marc a écrit: «Jésus fut chassé au désert par lEsprit Saint.» C’est le méme mot qu'il emploie quand Jésus « chasse» les démons.", "page": 58, "kind": "p"}, {"id": "r9p9", "text": "Dans la Bible, effectivement, l’Esprit de Dieu apparait souvent comme une sorte de «force», le «souffle de la tempéte», la «véhémence irrésistible de la foudre et du feu». La tentation de Jésus doit étre bien importante, nécessaire, dans la vie de Jésus, pour que ce soit Esprit méme de Dieu qui l’y entraine!", "page": 58, "kind": "p"}, {"id": "r9p10", "text": "Seigneur, aide-nous a ne pas avoir peur de la tentation: pour tout homme, elle est inévitable, nécessaire, bonne. Le combat spirituel est une composante nécessaire de la vie du croyant. La parole de Satan est une composante de notre monde. Satan ne cesse pas de nous suggérer de faire de Dieu autre chose que ce qui est... de faire de Dieu autre chose que ce quil a «révélé» de Lui, en JésusChrist... de faire de Dieu quelqu’un qui résoudrait tous nos problémes avec sa « puissance»...", "page": 59, "kind": "p"}, {"id": "r9p11", "text": "x", "page": 59, "kind": "p"}, {"id": "r9p12", "text": "Si Jésus avait cédé a cette tentation! S’il nous avait écouté!", "page": 59, "kind": "p"}, {"id": "r9p13", "text": "S'il avait écouté Satan! C’est un faux-dieu qu’il nous aurait montré. : ‘", "page": 59, "kind": "p"}, {"id": "r9p14", "text": "Mais Esprit du Dieu vrai, du seul vrai Dieu, « pousse» Jésus, Fils de Dieu, loin des publicités, loin des foules, loin des succés bruyants... au « désert » ! Le seul vrai Dieu, c’est le «Dieu caché». «Jusques a quand resteras-tu caché?» disait le psaume (Psaume 88/47). Je contemple Dieu «au désert»... Jésus, seul...", "page": 59, "kind": "p"}, {"id": "r9p15", "text": "Et dans le désert il resta quarante jours.", "page": 59, "kind": "h"}, {"id": "r9p16", "text": "Cest long!", "page": 59, "kind": "p"}, {"id": "r9p17", "text": "Nous savons tous, si nous sommes un peu habitués a la Bible, que lOrient ancien aimait les chiffres... mais qu’ils navaient pas, alors, le sens mathématique que nous leur donnons: souvent; ils ont une valeur «symbolique». Le chiffre «40», par exemple, désigne, conventionnellement, le «temps d’une génération humaine » : ce chiffre, alors, signifie «une période assez longue dont on ne connait pas la durée exacte». Le mot « caréme» est une évolution du mot « quadragésime», qui signifie « quarantaine». Chaque fois qu’un juif, formé par la Bible, entendait ce mot « quarante », il pensait 4 cet Exode, a cette Libération, A ce séjour au désert qui avait duré «quarante ans». Moise était resté « quarante jours» sur la montagne (Exode 34/28). Elie avait marché « quarante jours» dans le désert (I Rois 19/8).", "page": 59, "kind": "p"}, {"id": "r9p18", "text": "Et nous, en ce caréme, sommes-nous capables de « marcher» quarante jours?", "page": 59, "kind": "p"}, {"id": "r9p19", "text": "Quarante jours tenté par Satan.", "page": 60, "kind": "h"}, {"id": "r9p20", "text": "Marc ne parle plus de « jeine», comme Matthieu et Luc. Et il ne dit pas que la tentation eut lieu «a la fin» des quarante jours... mais pendant toute la durée du séjour de Jésus. «Tenté pendant quarante jours». Tenté pendant toute la durée de sa vie humaine... en particulier au moment ow il commence sa mission de «Fils de Dieu».", "page": 60, "kind": "p"}, {"id": "r9p21", "text": "N’oublions pas que Jésus était «seul» au désert. Nulle autre personne n’a été témoin de «ses» tentations, de «sa» tentation de «faire le Fils» selon la conception du monde, selon la conception de Satan. C’est donc que Jésus, un jour, en a fait la confidence a ses amis. Beaucoup de Péres de l’Eglise pensent que ce fut a occasion de la «profession de Pierre 4 Césarée», précisément quand Pierre reconnut que Jésus est le Fils de Dieu, et que Jésus annonc¢a alors la croix, le Fils crucifié, et que la méme « tentation » lui vint de la part méme.de Pierre, et que Jésus fut obligé de lui redire: « Arriére Satan!» (Marc 8/27.33). Nous pouvons trés bien imaginer qu’alors Jésus leur «avoua) quiil avait été tenté, et souvent, de «faire des signes messianiques éclatants», de sortir de son réle de Fils «incarné dans la faiblesse de la chair»... de se laisser prendre au piége de Satan qui le poussait sans cesse (et ses disciples aussi... et cela reste la tentation de l’Eglise!) a « prendre le pouvoir», a manifester sa divinité, A repondre a lattente politique du peuple.", "page": 60, "kind": "p"}, {"id": "r9p22", "text": "Il vivait parmi les bétes sauvages, et les anges le servaient.", "page": 60, "kind": "h"}, {"id": "r9p23", "text": "Cette expression est, encore, une expression biblique, codée, dont il faut découvrir la signification. Marc, a la différence de Matthieu et de Luc, ne dit pas explicitement que Jésus resta vainqueur de «sa» tentation. Mais il le dit par ces deux expressions: «Les bétes sauvages»... «les anges»... C’est un langage symbolique traditionnel : comme Adam au paradis terrestre, qui se trouvait en compagnie des bétes sauvages (Genése 2/19), ’espérance messianique attendait un retour de cette « paix paradisiaque » : « Le loup habitera avec l'agneau, la panthére se couchera avec le chevreau, le petit enfant jouera sur le repaire de l'aspic, et le jeune enfant mettra la main sur le trou de la vipére» (Isaie 11/1.9). Oui, alors que le premier homme, Adam, avait succombé a «la» tentation de « faire le dieu», « d’étre comme Dieu»... Jésus, lui, a été vainqueur de cette tentation: alors, la grande réconciliation s’opére, la coexistence pacifique de homme avec la nature!", "page": 60, "kind": "p"}, {"id": "r9p24", "text": "Quand homme refuse de: «dominer», quand homme refuse image d’un «certain Dieu», quand il accepte son «impuissance», quand il vit de la « foi»... c’est alors seulement quil retrouve le paradis, qu’il est homme selon Dieu»! C’est alors qu'il se retrouve en communion paisible avec ses fréres, avec le cosmos, avec les «bétes sauvages», et «avec les anges»... avec la «terre», et avec le «ciel»... C’est alors qu’il est vraiment «fils» de Dieu, selon le coeur de Dieu, qui, lui, ne domine pas, ne s’impose pas, qui est «amour», jusqu’a se renoncer lui-méme, jusqu’a mourir sur la croix pour nous!", "page": 61, "kind": "p"}, {"id": "r9p25", "text": "Apres larrestation de Jean Baptiste, Jésus partit pour la Galilée proclamer la Bonne Nouvelle de Dieu. Il disait: «Les temps sont accomplis. Le régne de Dieu est tout proche. »", "page": 61, "kind": "h"}, {"id": "r9p26", "text": "Une nouvelle création commence! Une nouvelle histoire humaine! Satan est vaincu. Jésus a triomphé de lui. Ce nest pas «lui» qui est Dieu. Ce nest pas le « dominateur » qui est Dieu, ce n’est pas l’Adversaire» qui est Dieu... C’est Dieu! C’est PAmour... Voila le seul vrai « regne» de Dieu. Voila la bonne nouvelle. ;", "page": 61, "kind": "p"}, {"id": "r9p27", "text": "Convertissez-vous et croyez a la Bonne Nouvelle.", "page": 61, "kind": "h"}, {"id": "r9p28", "text": "Le combat de la «foi» n’est pas fini. Satan continue toujours a nous proposer son idée de Dieu. Jésus nous invite a ne pas y consentir: il faut constamment refuser une certaine image (fausse!) de Dieu, pour nous ouvrir, par la foi, au Dieu véritable. « Ne nous soumets pas, Seigneur, a la tentation. »", "page": 61, "kind": "p"}]}, {"id": 10, "title": "2e Dimanche de Carême", "group": "Cuaresma", "page": 62, "ref": "Marc 9/2.10", "paragraphs": [{"id": "r10p1", "text": "Aprés « six jours », Jésus prend avec lui Pierre, Jacques, et Jean, et les emméne, eux seuls...", "page": 62, "kind": "h"}, {"id": "r10p2", "text": "Marc ne dit pas a partir de quoi il faut compter ces «six jours». Cette imprécision apparente montre, une fois de plus, qu’il ne faut pas se contenter de lire l’évangile de maniére banale. Ces «six jours» sont, pour les juifs, pour tous les habitués de la Bible, un langage théologique. C’est le temps requis pour se purifier avant d’approcher de Dieu: «aprés six jours, Dieu appela Moise du milieu de la nuée, sur la montagne du Sinai...» (Exode 24/16). Remarquons quatre expressions: «six jours»... «Moise»... «la nuée»... «la montagne»... Le récit de Marc est tissé de fils bibliques. Mais il y a plus encore: est-ce par hasard que la « Féte des Tentes» (Yom Sukkét) avait lieu, en Israél, six jours aprés la «Féte des Expiations» (Yom Kippour). Or la féte des Tentes était aussi celle ot l’on construisait des cabanes de branchages, abri fragile du temps de lerrance au désert, symbole de la fragilité humaine en marche vers la Terre promise. Pierre, tout a lheure, voudra construire une cabane, une tente.", "page": 62, "kind": "p"}, {"id": "r10p3", "text": "Pierre, Jacques et Jean...", "page": 62, "kind": "h"}, {"id": "r10p4", "text": "Pas tous les disciples, seulement trois! Cela aussi n’est pas un hasard, qu’une lecture naive pourrait laisser de cété. Il sagit des «trois» qui ont été témoins de la résurrectionréanimation de la petite fille de 12 ans (Marc 5/37). Et ce sont les mémes qui seront aussi temoins de l’agonie de Jésus a Gethsémani (Marc 14/33).", "page": 62, "kind": "p"}, {"id": "r10p5", "text": "Seraient-ils des privilégiés ? Non. Ils vivent trois expériences humaines exceptionnelles pour étre capables de devenir des soutiens de la foi des autres. Pourquoi vouloir toujours se comparer, jalouser ? Chacun de nous, aussi, a regu une grace propre, unique... qui n'est pas seulement pour lui, mais pour étre communiquée.", "page": 62, "kind": "p"}, {"id": "r10p6", "text": "Eux seuls, a l’écart, sur une haute montagne...", "page": 63, "kind": "h"}, {"id": "r10p7", "text": "Ce sont les conditions traditionnelles dans la Bible, pour «rencontrer Dieu». Un esprit moderne répliquera: Dieu est partout! Pourquoi cette « imagerie» ? Et c’est vrai. Mais nous sommes des étres corporels, et nous ne pouvons pas éviter certains symboles. Je trouve belle, personnellement, cette image si parlante: on «monte» vers Dieu (Exode 24/1 - 34/2; I Rois 18/20 - 19/8.11).. Tiens-toi sur la montagne! Fabrique-toi une montagne intérieure, un sommet de solitude et de face a face! Sache profiter des grands horizons! Tu ne les verras jamais si tu ne consens a quitter les vallées, 4 prendre les sentiers de haute randonnée, a peiner longuement, a t’essouffler sur les cimes ow lair est vif et rare... et les foules grégaires absentes.", "page": 63, "kind": "p"}, {"id": "r10p8", "text": "Et il fut transfiguré devant eux.", "page": 63, "kind": "h"}, {"id": "r10p9", "text": "Les mots contenant le préfixe «trans» sont de ceux qui font penser a deux choses 4 la fois, deux réalités Pune dans Pautre: trans-figuré... trans-formé... trans-parent... transmutation... trans-cendant... trans-substantation... transhumance... traverser...", "page": 63, "kind": "p"}, {"id": "r10p10", "text": "Quand r’homme cherche 4a traduire les rapports de Dieu et du monde, il oscille sans cesse entre deux hésitations, entre deux conceptions:", "page": 63, "kind": "p"}, {"id": "r10p11", "text": "— une conception «pessimiste»: il faut que le monde meure pour voir Dieu. On pourrait lappeler la conception de Saint-Augustin, reprise avec force par Luther et les protestants ;", "page": 63, "kind": "p"}, {"id": "r10p12", "text": "— une conception « optimiste»: c’est ce «monde-ci» qui est le Royaume de Dieu. On valorise homme et le monde au détriment de Dieu. Cela pourrait étre la tentation du catholique, qui ferait de l’Eglise un absolu, le Royaume déja arrive.", "page": 63, "kind": "p"}, {"id": "r10p13", "text": "— Mais il y a une « troisiéme conception, transfigurative » : oui, la chair est bonne, oui; le corps est voulu par Dieu, oui, le monde est divin... mais il nest qu’ «image et ressemblance» de Dieu. Pour étre vraiment bon, il doit étre non pas «détruit», mais « transfiguré». Jésus, sur la montagne, n’était pas éclairé de l’extérieur par une lumiére, c’était Lui, dans son Corps, qui était Lumiére. Et tout ce qui est chair, en nous, doit devenir lumiére, transparence, esprit. En Orient orthodoxe, la Transfiguration est la grande «féte», la grande Icéne vénérable... homme traversé par Dieu. Au terme de son initiation, qui ne consiste pas seulement a apprendre une «technique», le peintre dicéne doit peindre d’abord une icéne de Jésus transfiguré... pour montrer s'il est capable de dessiner un visage d’homme — image — de Dieu. C’est toute une conception de l’existence et de la société humaine, et de lEglise, et de la liturgie, dont le but est de nous «conformer» a Jésus. Si ces perspectives nous semblent vertigineuses, c’est peutétre que nous avons a découvrir lé sens véritable de notre baptéme, qui nous a «plongés» en Christ, et qui nous «rend participants de sa nature divine» (II Pierre 1/4). Toute notre vie chrétienne n’est, au fond, qu'une participation, une transfiguration, dans le Christ. « Nous tous, visage dévoilé, nous reflétons la gloire du Seigneur, nous sommes transfigurés en cette Image, avec une gloire toujours plus grande, par le Seigneur qui est Esprit» (2 Corinthiens 3/18). Bien sir, ici-bas, ce fantastique mystére, cette véritable transmutation de homme en Dieu, reste invisible. Pourtant notre transfiguration est déja acquise, seulement elle est cachée, avant d’éclater un jour: «Votre vie est cachée en Dieu, et quand le Christ-votre-vie paraitra, alors, vous aussi vous paraitrez avec Lui en pleine gloire!» (Colossiens 3/3.4).", "page": 63, "kind": "p"}, {"id": "r10p14", "text": "Ses vétements devinrent resplendissants, d’une blancheur telle que personne sur terre ne peut obtenir une blancheur pareille.", "page": 64, "kind": "h"}, {"id": "r10p15", "text": "Ne prenons pas saint Pierre, ni saint Marc son secrétaire, pour plus naifs que nous. C’étaient des hommes trés terre a terre, des hommes du peuple, et pas des intellectuels. Ils ont conscience de balbutier... Ils ne savent pas comment parler de lexpérience extraordinaire qui leur «arrive». Alors, n’en restons pas, nous non plus, au niveau élémentaire de la « meilleure lessive», du « blanc le plus parfait». Il ne sagit pas de cela. Nous sommes, une fois de plus, au niveau du langage biblique symbolique: la blancheur est la couleur du monde céleste... et «rien» sur terre n’en approche. C’est la couleur de l’'ange de la résurrection (Matthieu 28/3), de Pascension (Actes 1/10), c’est la couleur des vainqueurs (Apocalypse 3/4. 20/11 - 2/17 - 6/11 -7/13.15). La robe blanche du baptéme, de la profession de foi, de la mariée... Paube du prétre... sont la reprise de ce symbolisme. « Vous avez revétu le Christ!» (Galates 3/27). «ll faut que létre mortel revéte Pimmortalité» (I Corinthiens 15/53). «Dépouillez le vieil homme pour revétir homme nouveau» (Colossiens 3/10).", "page": 64, "kind": "p"}, {"id": "r10p16", "text": "Elie leur apparut avec Moise, et ils s’entretenaient avec Jésus.", "page": 65, "kind": "h"}, {"id": "r10p17", "text": "Ils symbolisent lattente d'sraél inscrite dans la «loi» et les « prophétes». Nous notons qu’ils ne sont pas seulement des « figurants». Ces deux personnages, morts des siécles plus t6t, sont contemporains de Jésus, et lui parlent. Ils sont en relation vivante avec lui. Lumiére sur lau-dela! Lumiére sur nos défunts. La mort, au lieu d’étre le terme, serait-elle un « seuil» ? qui nous introduit dans le monde de Dieu.", "page": 65, "kind": "p"}, {"id": "r10p18", "text": "Moise et Elie, dans PAncien Testament, sont les deux grands personnages aqui Dieu s’est révélé «sur la montagne». Et la tradition juive attendait leur retour a la Fin des Temps pour la venue du Messie (Malachie 3/22.24). Cest dailleurs la question que les disciples posent a Jésus, immédiatement aprés cette scéne, selon saint Marc (9/11.13).", "page": 65, "kind": "p"}, {"id": "r10p19", "text": "Avec Jésus, la Fin des Temps est commencée.", "page": 65, "kind": "p"}, {"id": "r10p20", "text": "Pierre alors prend la parole et dit a Jésus: « Rabbi, il est heureux que nous soyons ici. Dressons donc trois tentes... De fait, il ne savait que dire, tant était grande leur frayeur. »", "page": 65, "kind": "h"}, {"id": "r10p21", "text": "Pierre, une fois de plus, est le porte-parole. C’est lui qui avait fait, il y a quelques jours, la « profession de foi» a Césarée, au nom du groupe (Marc 8/27.33). C’est lui, Pierre, qui avait joué le tentateur Satan prés de Jésus, en refusant la perspective de la croix (Marc 8/33). Aujourd’hui encore il ne comprend pas grand-chose. C’est un «témoin» qui n’invente rien. Des événements lui «arrivent» malaré lui... contraignants. Il écrira plus tard: «Ce ne sont pas des fables inventées... nous avons vu dans tout son éclat, quand nous étions avec lui sur la sainte montagne » (II Pierre 1/16.18). Redisons-le: Pierre n’était pas un mystique... c’était un marin! Nous pouvons faire confiance a son sens de observation. Il reconnait que c’est incompréhensible, d’ailleurs. Mais «ca» s’est imposé a lui. Il ne «sait que dire»...", "page": 65, "kind": "p"}, {"id": "r10p22", "text": "Survint une nuée qui les couvrit de son ombre, et de la nuée une voix se fit entendre: « Celui-ci est mon Fils Bien-aimé... Ecoutez-Le! »y ‘", "page": 66, "kind": "h"}, {"id": "r10p23", "text": "La «nuée», en langage symbolique, c’est la « présence de Dieu (Exode 16/10 - 19/9 - 24/15 - Nombres 14/10). La Voix est la méme qu’au jour du baptéme de Jésus (Marc 1/11). Mais alors, elle ne s’adressait qu’a Jésus. Aujourhui, elle s’adresse aux disciples.", "page": 66, "kind": "p"}, {"id": "r10p24", "text": "Qui donc est Jésus? La réponse a cette question capitale ne nous viendra ni de nos «raisonnements», ni méme de nos «recherches bibliques», mais d’une priére «seuls a Pécart sur la montagne», si nous savons «écouter»! Lidentité véritable de Jésus ne nous est « donnée» que par « révélation» du Pére... C’est hors des prises de /homme.", "page": 66, "kind": "p"}, {"id": "r10p25", "text": "En descendant de la montagne, Jésus leur défendit de raconter a personne ce quills avaient vu, avant que le Fils de ’homme soit ressuscité d’entre les morts... Ils se demandaient entre eux ce que voulait dire «se lever» d’entre les morts.", "page": 66, "kind": "h"}, {"id": "r10p26", "text": "Il faudra la Croix et la Paque pour qu’ils découvrent la vraie identité de Jésus.", "page": 66, "kind": "p"}]}, {"id": 11, "title": "3e Dimanche de Carême", "group": "Cuaresma", "page": 67, "ref": "Jean 2/13.25", "paragraphs": [{"id": "r11p1", "text": "Comme la Paque des juifs était proche, Jésus monta a Jérusalem.", "page": 67, "kind": "h"}, {"id": "r11p2", "text": "Jésus était un juif pratiquant. Sept fois, dans son évangile, saint Jean note que Jésus participait aux grandes fétes de pélerinage (Jean 5/1 - 6/4 - 7/2 - 10/22 - 11/55 - 12/1 - 13/1), spécialement la Féte de Paque au printemps, et la Féte des Tentes a l’automne. Je contemple d’abord Jésus, en position de laic, mélé a la foule qui prie et qui chante, au cours du voyage de pélerinage sur la route, puis sur le parvis du Temple. Méme si Jésus, de fait, a profondément modifié les liturgies juives, aucun antisémitisme ne peut se justifier doctrinalement. Le film «Holocauste» nous rappelle la souffrance de ce peuple dont Jésus fait partie... et qui, mystérieusement, ne cesse pas d’avoir un destin exceptionnel. Cette page de saint Jean commence sur «la Paque des juifs » (au verset 13), et se termine sur la « Paque de Jésus» (au verset 22), en évoquant ces premiers disciples de Jésus qui furent tous des juifs « qui crurent en lui durant la féte de Paque » (verset 23). De la « Paque juive» a la « Paque chrétienne », un méme mystére insondable se joue : un mystére de mort, dont surgit la vie... un mystére de destruction dun Temple, dont un autre Temple surait...", "page": 67, "kind": "p"}, {"id": "r11p3", "text": "Il trouva installés dans le Temple les marchands de beeufs, de brebis et de colombes, et les changeurs. Il fit un fouet avec des cordes, et les chassa tous du Temple, ainsi que leurs brebis, et leurs boeufs, il jeta par terre la monnaie des changeurs, renversa leurs comptoirs, et dit aux marchands de colombes: «Enlevez cela d'ici.)", "page": 67, "kind": "h"}, {"id": "r11p4", "text": "Liimagerie chrétienne ne s’est pas privée de représenter cette scéne haute en couleurs et en mouvements. Jésus, en colére, fouet en main, chassant les «marchands du Temple». Il va nous falloir dépasser les limites de «Tincident» pour aller jusqu’a la profondeur théologique de la scéne. Remarquons déja, dans cette phrase, que Jésus fait un sort différent aux « vendeurs de colombes » qu’il semble traiter avec beaucoup plus de gentillesse que les autres: les colombes étaient le « sacrifice des pauvres», le sacrifice de ceux qui, comme Marie jadis, ne pouvaient pas se payer de gros bétail. Jésus manifeste, ici, cette préférence pour les pauvres qu’ll montrera sans cesse.", "page": 68, "kind": "p"}, {"id": "r11p5", "text": "Ne faites pas de la « maison de mon Pére» une maison de trafic.", "page": 68, "kind": "h"}, {"id": "r11p6", "text": "Les vendeurs et les changeurs n’étaient pas nécessairement de mauvaises personnes. Ils rendaient en réalité un service considérable aux fidéles qui venaient de loin, et qui avaient besoin de trouver sur place tout ce qui était indispensable pour «offrir un sacrifice»: Marie et Joseph, venant au Temple au jour de la Présentation de leur enfant, avaient di étre bien contents de trouver des marchands pour acheter leurs deux petites colombes (Luc 2/24). Nous aurions donc bien tort d’en rester a une lecture superficielle de cette page, surtout si, évidemment, nous l’appliquons aux... autres. Il est trop facile de s’indigner... verbalement, sans se compromettre soi-méme... contre l’argent, le trafic, les «bruits d’argent» autour de lautel, la société de consommation, importance du profit dans nos économies occidentales. Que Jésus ait été un pauvre, un vrai... Qu’ se soit indigné de la trop grande place de l’argent dans le Temple... C’est certain! Convertissons-nous donc, nousmémes, sur ce sujet. Seigneur, guéris-nous de notre attachement a argent.", "page": 68, "kind": "p"}, {"id": "r11p7", "text": "Mais l’essentiel de la page d’évangile d’aujourd’hui n’est pas la.", "page": 68, "kind": "p"}, {"id": "r11p8", "text": "Ecoutons, longuement, cette étrange expression que Jésus utilise pour parler du Temple: «la maison»... «de mon Pére». Nous sommes trop habitués a ces formules. Quelle plongée, pourtant, elles nous font faire dans lidentité profonde de cet «homme», Jésus de Nazareth! Quel secret se cache en sa personne! Entre lui et Dieu, quelle intimité d’amour! Il est chez lui dans le Temple sacré de Yahveh. Ce Saint des Saints, ce sanctuaire tabou, ot personne rventre, sauf le grand Prétre, une fois par an (Hébreux 9/7), ce lieu «saint», ce lieu «séparé» de tout, ce lieu «intouchable», «impénétrable» sans mourir... Jésus dit, tout simplement, que c’est la « maison de son Pére», et sa propre maison de fils. Déja, a ’age de 12 ans, il avait dit la méme chose, et personne n/avait compris, méme pas sa mére Marie: «Ne savez-vous pas qu’ll me faut étre «chez mon pere»? (Luc 2/49).", "page": 68, "kind": "p"}, {"id": "r11p9", "text": "Oui! Ce qui est premier dans le culte que nous rendons a Dieu, ce ne sont pas les gestes que nous faisons (boeufs, brebis, colombes), mais le coeur filial que nous y mettons. Seigneur, délivre-nous de nos soucis ritualistes, formalistes.", "page": 69, "kind": "p"}, {"id": "r11p10", "text": "Ses disciples se rappelérent cette parole du psaume: «Lamour de ta maison fera mon _ tourment...»", "page": 69, "kind": "h"}, {"id": "r11p11", "text": "(Psaume 69/10).", "page": 69, "kind": "p"}, {"id": "r11p12", "text": "Pour Jésus, «amour du Pére» le dévore, littéralement, comme un feu dévore les brindilles. Son sacrifice 4 Lui ne sera pas «rituel», extérieur a lui. Ce sera Luiméme quill offrira en sacrifice, et il y passera tout entier. Et mon culte a moi? Quest-ce que c’est? Est-ce que j’«assiste» (!) ala messe... ou bien est-ce que je « participe » & la messe ? Suisje, avec Jésus, briilé de zéle, dévoré d'amour, fasciné, par Dieu? O Pére, je voudrais aussi, désormais, que Ta maison fasse mon tourment d’amowur. Si la réaction de Jésus a été si vive, c’est que l’honneur et la gloire de son Pére étaient en jeu dans ce «trafic». Jésus, c’était homme fasciné par Dieu! la cause de Dieu!", "page": 69, "kind": "p"}, {"id": "r11p13", "text": "« Détruisez ce Temple, et en trois jours je le reléverai.» Les juifs lui répliquérent: «Il a fallu quarante-six ans pour batir ce Temple, et toi, en trois jours tu le reléverais! »", "page": 69, "kind": "h"}, {"id": "r11p14", "text": "Ici, dans le texte grec, il n’y a pas le mot « temple » (iéron), mais le mot sanctuaire (naos). Et ce n’est pas par hasard, car, plus haut, dans le méme texte, Jean avait utilisé précisément le mot « temple». «II trouva installés dans le temple (iéron), les marchands... et il les chassa du temple » (iéron). Le temple, en ce sens, c’était ensemble des édifices y compris les cours, places, parvis divers. Mais maintenant, Jésus va beaucoup plus loin, quand il dit: « Détruisez ce sanctuaire (naos)». Quel dommage que les traducteurs naient pas respecté le texte! Le sanctuaire, c’était ce tout petit édifice, le plus précieux de l'ensemble du Temple, au coeur: le lieu de la Présence (« shékinah»). N’oublions pas que Jésus sera condamné a mort sous la fausse accusation davoir dit: «Je détruirai ce sanctuaire et je le reléverai» (Matthieu 26/61). C’était, effectivement, un blasphéme. Ce sanctuaire était tout neuf, il avait été commencé par Hérode cinquante ans plus tét. C’était ’orgueil de la nation, un lieu vénéré de priére et de pélerinage, ot des millions de pélerins venaient chaque année, le « seul » lieu de culte dIsraél. Vraiment, cet homme était d’une audace! Comme si quelqu’un proclamait: « Détruisez la basilique de SaintPierre de Rome... Ou, détruisez Lourdes, ou Notre-Dame de Paris, ou la cathédrale d’Angers...». Or Jésus n/a rien, pourtant, d’un provocateur.", "page": 69, "kind": "p"}, {"id": "r11p15", "text": "«Le sanctuaire (naos) dont il parlait, c’était son", "page": 70, "kind": "h"}, {"id": "r11p16", "text": "corps. »", "page": 70, "kind": "p"}, {"id": "r11p17", "text": "Il y a ici le méme mot grec. Nous voici, bien évidemment, au centre essentiel de cette page d’évangile. Essayons, un instant, de pénétrer dans la conscience que Jésus avait de lui-méme. Il sait qui il est! Il dit qu’il est un sanctuaire. Jésus se constitue en «lieu de la Présence divine». C’est son corps qui est le «nouveau Temple»... le lieu du « nouveau culte»... Jean Baptiste Pavait désigné comme lAgneau de Dieu qui enléve le péché du monde (Jean 1/29). Oui, Jésus fut immolé sur la colline aux portes de la ville, sacrifié, A Theure méme ott, dans ce méme Temple, on immolait dinnombrables agneaux pascals, la veille du « Grand Sabbat de Paque» (Jean 19/31). Par son corps sacrifié, il venait remplacer tous les sacrifices et rendre inutile le Temple de Jérusalem, dont le rideau pouvait alors se déchirer (Matthieu 27/51). Et de ce corps sortit alors le «fleuve d’eau vive» (Jean 19/33), Peau et le sang, annoncé par le prophéte Ezékiel comme sortant du sanctuaire (Ezékiel 41/1.12).", "page": 70, "kind": "p"}, {"id": "r11p18", "text": "Aussi, quand il ressuscita (se releva) d’entre les morts, ses disciples se rappelérent qu'il avait dit cela...", "page": 71, "kind": "h"}, {"id": "r11p19", "text": "Voici donc la Paque de Jésus et des chrétiens qui achéve la « Paque des juifs», dont il était question au début de cette page. Voici la Libération inouie et radicale, dont la libération de l'esclavage d’Egypte n’était qu’une annonce et une figure. Voici le Temple nouveau, qui rend caduc tout autre lieu de culte.", "page": 71, "kind": "p"}, {"id": "r11p20", "text": "Ainsi, le lieu de la Présence de Dieu rest plus un édifice, cest Quelqu’un! C’est le Corps du Christ. Toute la liturgie chrétienne n’existe qu’autour de ce Corps. Mais comprenons jusqu’ow va ce mystére! Saint Paul dira aux chrétiens, aux débardeurs du port de Corinthe: « Vous étes le Corps du Christ!» (I Corinthiens 12/27). Voila ot se fonde l’éminente dignité de ’homme. «Ne savez-vous pas que vous étes le Temple de Dieu et que lEsprit de Dieu habite en vous ?»» (I Corinthiens 3/16.17).", "page": 71, "kind": "p"}, {"id": "r11p21", "text": "Ainsi, ce n’est pas seulement le «Corps ressuscité» de Jésus qui est le nouveau Temple, mais le «corps de chaque baptisé »: « Ne savez-vous pas que votre corps est le Temple du Saint-Esprit qui est en vous? Glorifiez donc Dieu par votre corps» (I Corinthiens 6/19.20). Saint Augustin disait 4 ses fidéles : « Quand le prétre vous dit Le Corps du Christ, vous repondez Amen a ce que vous étes dans le Christ.» Un cantique chante ce mystére : que nous soyons le Corps heureux de rendre grace... que nous soyons le Corps chargé de tes louanges... que nous soyons le Corps gardien de ton Alliance... Nous avons toujours tendance a «assigner Dieu a résidence», a lui faire des «prisons dorées», des « sanctuaires» ot Il est mis a part, rejeté hors du monde, hors de nos vies. Mais aucune église, aucune cathédrale, aucun Temple ne peut enfermer le Corps du Christ! Vous étes le Corps du Christ! Je suis le Corps du Christ! Recevant le Corps de Jésus, je «deviens» son Corps qui est un sanctuaire.", "page": 71, "kind": "p"}, {"id": "r11p22", "text": "Pendant qu'il était 4 Jérusalem pour la «Féte de Paque», beaucoup crurent en lui...", "page": 71, "kind": "h"}]}, {"id": 12, "title": "4e Dimanche de Carême", "group": "Cuaresma", "page": 72, "ref": "Jean 3/14.21", "paragraphs": [{"id": "r12p1", "text": "De méme que le serpent de bronze fut « élevé» par Moise dans le désert...", "page": 72, "kind": "h"}, {"id": "r12p2", "text": "L’évangile d’aujourd’hui commence par une invitation a « regarder », a «lever les yeux» vers une image. Saint Jean utilise un souvenir biblique. Au cours des. « quarante» ans de marche au désert, les hébreux furent attaqués par un ennemi redoutable, des serpents a la morsure «brilante» (Nombres 21/6.9). Moise fit un « caducée», un serpent de bronze guérisseur, élevé sur un baton. Image mythologique que les médecins d’aujourd’hui continuent a prendre pour embléme. « Celui qui-tournait les yeux vers le Signe élevé était sauvé, non pas par lobjet regardé, mais par Toi, Seigneur» (Sagesse 16/7).", "page": 72, "kind": "p"}, {"id": "r12p3", "text": "Notons déja, a travers cette interprétation du livre de la Sagesse, qu'il ne s’agit pas d’un geste magique, automati- — que. Le «regard» ne sauve pas par lui-méme, comme si c’était un talisman, un «porte-bonheur», un geste de superstition: c’est un signe de la «foi» qui met en évidence, par un geste concret, que homme se «tourne vers» Dieu.", "page": 72, "kind": "p"}, {"id": "r12p4", "text": "Ainsi faut-il que le Fils de Phomme soit élevé... afin que tout homme qui croit obtienne par lui la « vie» éternelle.", "page": 72, "kind": "h"}, {"id": "r12p5", "text": "Oui, saint Jean nous invite 4 regarder la «croix». Il faut oser regarder ce «crucifié», celui qui est «élevé» devant nos yeux. Jean a choisi ce mot «élevé» (« upsothénai» en grec) pour dire, a la fois que Jésus est « élevé» sur la croix, et «élevé» a la droite du Pére par la résurrection et l’ascension (Jean 3/14 - 8/28 - 12/32.34).", "page": 72, "kind": "p"}, {"id": "r12p6", "text": "Oui, Jean n’a jamais pu oublier ce jour, ni ce spectacle, auquel nous sommes trop habitués. Jean, des douze apétres, était d’ailleurs le seul a étre la, ce vendredi aprés-midi, au pied de la croix. Depuis lors, pendant plus de soixantedix ans, il avait médité cette «image», et c’est le fruit de sa longue et pénétrante méditation qu’il nous livre.", "page": 73, "kind": "p"}, {"id": "r12p7", "text": "Pour Jean, la «croix» et la « paque» sont le méme mystére, quil exprime par ce mot a double sens: «Jésus a été élevé de terre. » - Crucifié = exalté. Pour Jean, PAscension commence le vendredi-saint. Nous, nous continuons toujours a attendre que Dieu nous montre sa « Gloire» dans je ne sais quel geste de triomphalisme éclatant! Mais, pour Jean, qui a vu la scéne, c’est la Croix qui est la Gloire de Dieu! Dés que Judas fut sorti du cénacle, Jésus a dit: « Maintenant, le Fils de ’homme est glorifié » (Jean 13/31). Quatre jours plus t6t, au soir de apparent triomphe des Rameaux, Jésus avait déja dit: «Elle est venue l’heure oti le Fils de Phomme doit étre glorifié... si le grain de blé tombe en terre et meurt, il porte beaucoup de fruit... pour moi, quand j’aurai été élevé de terre, j’attirerai a moi tous les hommes» (Jean 12/23.32).", "page": 73, "kind": "p"}, {"id": "r12p8", "text": "Il nous faut donc, a notre tour, lever les yeux vers celui qui est «élevé» entre ciel et terre, et prier. Cette libre mort sera a tout jamais le «sommet de amour»: le sommet de Pamour du Fils pour son Pére, et le sommet de l'amour du Frére universel pour ses fréres pécheurs. Cette grande croix de bois sur laquelle saigne un corps d’homme torturé, c’est un «sommet de douleur et de mort», mais c’est aussi un sommet de révélation divine. Il faut, physiquement, regarder cette image de tous nos yeux ouverts. Mais il faut aussi fermer les yeux pour « voir» ce qui n’est pas visible, et dont ce spectacle est le «signe»: amour extréme qui briile au coeur de cet homme, Jésus. «Il n’y a pas de plus grand amour que de donner sa vie pour ceux qu’on aime» (Jean 15/13). Mais cet amour extréme qui dévore Phomme Jésus est, luirméme, le «signe» d’un autre amour extréme, celui du Pére: « Dieu a tant aimé le monde, qu’il a donné son Fils unique» (Jean 3/16).", "page": 73, "kind": "p"}, {"id": "r12p9", "text": "C’est pourquoi les artistes ont voulu souvent représenter Jésus en croix dans une sorte de « gloire ». Ses bras et son corps, loin d’étre crispés dans la douleur du supplice, sont alors représentés tout en souplesse, en formes détendues. Les bras prennent alors la position de l’orante, la position de la priére et de l’offrande du prétre a lautel, la position des mains levées pour chanter le « Notre Pére».", "page": 73, "kind": "p"}, {"id": "r12p10", "text": "Dieu a tant aimé le monde qu'il a donné son Fils unique.", "page": 74, "kind": "h"}, {"id": "r12p11", "text": "De nos jours, beaucoup sont tentés par une sorte de pessimisme: «le monde est pourri... il ny a rien a y faire...» Morosité; malaise, dont les justifications ne manquent pas, hélas, pour tout homme lucide: violences, prises d’otage, égoismes collectifs et individuels, bassesses de toutes sortes, dépravation morale, perte de la conscience professionnelle, exploitation de [homme par ’homme, abus des mensonges idéologiques ou publicitaires, matraquages de Popinion publique, désenchantement, etc. Dieu, lui aussi, voit tout cela! Et pourtant, Il aime ce monde, il ne se résigne pas a son mal, il veut le sauver. Dieu nous prend a contre-pied. Ce monde qui nous parait parfois si moche, si mal fait, Dieu aime. Dieu est passionné par sa Création inachevée, qu'il est en train de conduire jusqu’a la perfection... Le monde n’est pas absurde. Si nous adoptons le regard de Dieu, un «regard d’amour», alors, au lieu de continuer 4 gémir, nous allons donner notre vie, a notre tour, pour nos fréres.", "page": 74, "kind": "p"}, {"id": "r12p12", "text": "Il a «donné» son Fils unique...", "page": 74, "kind": "h"}, {"id": "r12p13", "text": "Deux verbes expriment lattitude de Dieu: «aimer», et «donner»! Je prie a partir de ces deux mots.", "page": 74, "kind": "p"}, {"id": "r12p14", "text": "Je remarque aussi cet adjectif, appliqué 4 Jésus: « unique » («monogénés» en grec). Ce terme rest utilisé que par saint Jean. Il a été repris dans notre Credo: «Je crois en Jésus-Christ, Son Fils unique». Ce mot nous fait plonger au-dela des apparences terrestres: Jésus est lobjet d’une filiation absolument unique, divine. Par ailleurs, ce mot renvoie aussi a un souvenir biblique. Dans la mémoire d'lsraél, il y avait le souvenir d’un autre «fils unique», tendrement chéri par son pére, et que ce pére plein d’amour avait mystérieusement accepté de «sacrifier», de «donner»: lhistoire d’Abraham et de son fils Isaac est présente a la pensée de saint Jean (Genése 22/2.16).", "page": 74, "kind": "p"}, {"id": "r12p15", "text": "Cet amour de Dieu pour le monde, qui Lui a fait donner son «fils unique», Jean va lexprimer par cinq expressions... pour que personne ne puisse penser le contraire. — Dieu ne veut pas que ’homme périsse... Il a tout créé pour que tout subsiste (Sag. 1/13).", "page": 75, "kind": "p"}, {"id": "r12p16", "text": "— Dieu veut que ’homme vive éternellement... c’est une « vie-d’en-haut», donnée (Jean 3/3).", "page": 75, "kind": "p"}, {"id": "r12p17", "text": "— Dieu ne veut pas condamner le monde... il s’agit de l'ensemble de ’humanité.", "page": 75, "kind": "p"}, {"id": "r12p18", "text": "— Dieu veut sauver le monde... la volonté de Dieu c’est que tout homme soit sauvé.", "page": 75, "kind": "p"}, {"id": "r12p19", "text": "— Les ceuvres de homme sont «ceuvres de Dieu»...", "page": 75, "kind": "p"}, {"id": "r12p20", "text": "(I Timothée 2/4)", "page": 75, "kind": "p"}, {"id": "r12p21", "text": "Ainsi tout homme qui croit en Lui ne périra pas, mais il obtiendra la vie éternelle.", "page": 75, "kind": "h"}, {"id": "r12p22", "text": "Dieu est le «vivant» par excellence. La «vie» est le plus grand bien que homme puisse avoir. Dieu a décidé de communiquer Sa vie, a Lui, sa vie divine, éternelle. La «volonté de salut universel» de Dieu est claire: encore faut-il, pour que ce salut devienne effectif, que ’homme accepte ce «don». Il est évidemment impensable qu’un homme soit contraint et forcé a vivre malgré lui « prés dun Dieu» qu'il refuse obstinément. Ce serait un vrai « enfer ». Et Dieu respecte la liberté de Phomme: qui ne veut pas de la «vie» que Dieu offre a tous, reste dans la mort. Y a-t-il un homme capable de ce refus obstiné? Cest le redoutable secret de la mort, de l’instant ot homme, dégagé des obscurités d’ici-bas, se trouve, de fait, «face 4 Dieu».", "page": 75, "kind": "p"}, {"id": "r12p23", "text": "Car Dieu a envoyé son Fils dans le monde, non pas pour juger le monde, mais pour que, par lui, le monde soit sauvé. Celui qui « croit » en lui échappe au jugement. Celui qui ne veut pas croire est déja jugé, parce qu'il n’a pas cru au nom du Fils unique de Dieu. Et le jugement, le voici: quand la lumiére est venue dans le monde, les hommes ont préféré les ténébres a la lumiére, parce que leurs oeuvres étaient mauvaises.", "page": 75, "kind": "h"}, {"id": "r12p24", "text": "Ce texte est assez vertigineux. Il affirme deux choses : 1° Dieu ne condamne personne, Dieu veut sauver tous les hommes, car il les aime tous; 2° C’est \"homme qui, hélas, se juge et se condamne lui-méme quand il refuse obstinément Dieu.", "page": 76, "kind": "p"}, {"id": "r12p25", "text": "Ainsi, la «condamnation» n’est pas un acte extérieur a homme, c’est, hélas, la chose propre de cet homme qui prend une attitude de refus de l'amour de Dieu manifesté dans le «don du Fils unique» jusqu’a la croix. Dieu, Lui, a tout fait. Il a été jusqu’au bout, pour sauver. Tout se passe comme si la «condamnation» ne faisait pas partie du monde de Dieu, c’est une réalité extérieure au Royaume: ceux qui refusent la lumiére du «face a face» se condamnent eux-mémes a étre un monde «en dehors » de Dieu..., un monde mort, un monde sans vie éternelle.", "page": 76, "kind": "p"}, {"id": "r12p26", "text": "Nous ne pouvons pas ne pas remarquer que le « drame de lincroyance» n’est pas seulement un probléme moderne. Il est au coeur de l’évangile. Si nous voulons prolonger la mission de Jésus, nous avons, nous aussi, 4 ne condamner personne, a vouloir sauver tous nos fréres, a faire tout pour cela. Qui juge son frére, fait le contraire de Dieu... Il se met en dehors du monde de Dieu « qui n’est pas venu pour juger».", "page": 76, "kind": "p"}, {"id": "r12p27", "text": "Mais celui qui agit selon la vérité vient a la lumiére, afin que « ses oeuvres) soient reconnues comme des «oeuvres de Dieu»...", "page": 76, "kind": "h"}, {"id": "r12p28", "text": "La joie du «croyant», c’est, finalement, d’anticiper ce qui sera la joie éternelle du «face a face avec Dieu». Pour lui, la vie éternelle est déjé commencée; il sait déja ’amour de Dieu pour tout homme, il en vit chaque jour; il ne cesse pas d’en rendre grace... Et cette «vie éternelle», déja commencée, c’est une vie pleine de dynamisme. Trop souvent, et trop longtemps, les chrétiens ont parlé de la vie éternelle au moyen d’un langage et d’images plus proches du nirvana bouddhique que de la conception de saint Jean: le «repos éternel»! Pour le quatriéme évangile, c’est une «vie» éternelle, débordante d’activité et de joie. Et non un plat repos. Jean, ici, dans le texte grec, a dit: « celui qui fait la vérité vient a la lumiére.» La vie, c’est « faire»! Ce sont des «actes», des «ouvrages», des «oeuvres». Et, chose stupéfiante, les «actes de ’homme» sont, alors, reconnus comme des «actes de Dieu!» Vie éternelle.", "page": 76, "kind": "p"}]}, {"id": 13, "title": "5e Dimanche de Carême", "group": "Cuaresma", "page": 78, "ref": "Jean 12/20.33", "paragraphs": [{"id": "r13p1", "text": "Comme dimanche dernier, saint Jean nous propose une méditation sur la croix.", "page": 78, "kind": "p"}, {"id": "r13p2", "text": "Parmi les «Grecs» qui étaient montés a Jérusalem pour adorer Dieu durant la Paque, quelques-uns abordérent Philippe, qui était de Bethsaide en Galilée. Ils lui firent cette demande: «Nous voudrions voir Jésus. »", "page": 78, "kind": "h"}, {"id": "r13p3", "text": "Il s’agit bien de la derniére Paque. La page d’évangile que nous lisons aujourd’hui, dans le texte de saint Jean, suit immédiatement le récit de « entrée triomphale» de Jésus a Jérusalem, le jour des Rameaux. A la suite de ce succés populaire, les pharisiens se dirent les uns aux autres: «Vous le voyez, vous marriverez a rien: voila que le monde se met a sa suite!» La constatation des pharisiens trouve une illustration immédiate dans cette démarche de « grecs», étrangers a la race juive, mais sympathisants, qui demandent a «voir» Jésus. Ainsi, alors que létau se resserre de la part de ceux qui ont décidé sa mort, et que le climat @’opposition des pharisiens s’alourdit, voici que tout a coup, au début de sa derniére « semaine» de vie terrestre, Jésus peut entrevoir l’extension universelle de son réle sauveur. Ces «grecs» annoncent l’entrée des paiens dans PEglise, et l’extension de la rédemption bien au-delA des limites d’Israé] proprement dit: Jésus va dire comment il entrevoit la « fécondité» extraordinaire de sa mort... « qui portera beaucoup de fruit»... «qui attirera tous les hommes»...", "page": 78, "kind": "p"}, {"id": "r13p4", "text": "Nous notons que ces étrangers s’adressent a Philippe (qui porte un nom grec!) et qui vient de Bethsaide (région de passage ow vivaient beaucoup d’étrangers!). Ce Philippe devait savoir quelques mots de grec, ce qui lui permettait de prendre des contacts. Sommes-nous, aussi, attentifs aux étrangers? Pour les conduire a Jésus.", "page": 78, "kind": "p"}, {"id": "r13p5", "text": "Alors Jésus leur déclare: « L’heure est venue, pour le Fils de homme, d’étre glorifié. »", "page": 79, "kind": "h"}, {"id": "r13p6", "text": "Sommes-nous capables d’accepter cette révélation ? L’«heure de Jésus», c’est celle de sa croix: c’est sa gloire! Nous continuons toujours, hélas, a attendre une autre heure, une autre manifestation de Dieu. Avouons que nous révons, pour Dieu, comme pour nous, d’une autre gloire. Or, Jésus nous le répéte: «maintenant, l’heure est venue» (Jean 12/23.27.31). Jusquiici elle n’était pas encore venue, mais Jésus en avait souvent parlé (Jean 2/4 - 4/21.23 - 5/25 - 7/30 - 8/20). Cette «heure» privilégiée, c’est celle de la croix: celle de la «glorification» du Pére et du Fils (Jean 12/23.28)... celle du «jugement et du salut» du monde (Jean 12/31.32).", "page": 79, "kind": "p"}, {"id": "r13p7", "text": "Dans quelques jours, Jésus va entrer en sa Passion.", "page": 79, "kind": "p"}, {"id": "r13p8", "text": "Jésus semble, apparemment, ne pas répondre a la démarche des «grecs» qui ont demandé 4a le «voir». En réalité, il va au fond de leur désir: «’heure est venue ot le Fils de homme va étre glorifié»... « \"heure qui me fait voir » approche... Pheure qui fait voir Dieu. On ne saurait voir Dieu, ni Jésus, a une autre lumiére que celle de la croix.. cest Pheure de amour absolu.", "page": 79, "kind": "p"}, {"id": "r13p9", "text": "Seigneur, aide-moi a regarder la croix, A contempler la croix: c’est ’heure de la plus grande révélation de Dieu... Tout ce qu’avaient dit les philosophes, tout ce qu’avaient cherché les religions tatonnantes, était dérisoirement insuffisant : voici la «croix»... Au-dela des mots et des raisonnements, je regarde cette image, cette «icdne» de Dieu.", "page": 79, "kind": "p"}, {"id": "r13p10", "text": "« Amen, amen, je vous le dis: si le grain de blé tombé en terre ne meurt pas, il reste seul; mais s'il meurt, il porte beaucoup de fruit.»", "page": 79, "kind": "h"}, {"id": "r13p11", "text": "Oui, l'heure de Jésus, c’est bien celle de sa «mort», mais, c’est en méme temps celle de sa « vie multipliée ». Jésus va étre trés «seul» sur la croix. Mais il y sera aussi entouré, invisiblement, de milliards @hommes et de femmes sauvés par son sacrifice. Les hommes de tous les temps et de toutes les civilisations ont disserté sur la mort, et cherché a percer son mystére. Jésus, dans cette toute simple phrase, nous a dit sa propre conviction. Il ne fait pas de raisonnement, il dit, existentiellement, comment il envisage «sa» propre mort; ce sont des semailles! Pendant le long hiver, le grain de blé enfoui dans la terre semble mort, il surgit au printemps et devient un épi gonflé en quelques semaines, promis a la moisson. Jésus voit déja la moisson!", "page": 79, "kind": "p"}, {"id": "r13p12", "text": "Celui qui aime sa vie, la perd; celui qui s’en détache, la garde pour la vie éternelle...", "page": 80, "kind": "h"}, {"id": "r13p13", "text": "Ainsi, pour Jésus, la vraie « vie», c’est de mourir! Et Jésus ne dit pas cela par amour du paradoxe. Mais, dans une formule énigmatique, il essaie de nous suggérer une vérité qui ne va pas de soi, mais qui est évidente pour tout coeur qui aime: la vraie mort n’est pas la mort physique, mais le refus de se donner, la fermeture stérile sur soi:méme! Pour entrer dans la vraie vie, il faut mourir. Et c’est cela que fait Dieu pour nous... parce qu’il est «amour absolu», il perd sa vie pour nous! La loi de la vie, c’est ’amour: le moindre grain de blé nous le répéte.", "page": 80, "kind": "p"}, {"id": "r13p14", "text": "Seigneur, délivre-nous de cet égoisme stérile que nous appelons parfois « vivre» sa vie. Apprends-nous a donner notre vie comme toi.", "page": 80, "kind": "p"}, {"id": "r13p15", "text": "Si quelqu’un veut me servir, qu'il me suive; et, la ou je suis, la aussi sera mon serviteur. Si quelqu’un me sert, mon Pére le glorifiera...", "page": 80, "kind": "h"}, {"id": "r13p16", "text": "L’aventure du grain de blé, dérisoire en ses débuts, mais capable d’exubérante fécondité au jour de la moisson, c’est Paventure du Royaume de Dieu (Marc 4/1.20).", "page": 80, "kind": "p"}, {"id": "r13p17", "text": "Mais, pour saint Jean, tout le mystére de ce Royaume de Dieu est comme concentré dans la personne de Jésus: Paventure du grain de blé caché en terre pour ressurgir, cest laventure de Jésus, dont la mort produira des fruits surabondants.", "page": 80, "kind": "p"}, {"id": "r13p18", "text": "Mais cette aventure n’est pas seulement celle de Jésus: elle nous est offerte. La ott Jésus a conquis sa gloire, la gloire de l'amour « serviteur» jusqu’au bout, nous pouvons nous aussi vivre cette aventure. Le destin du «grain de blé» est pour nous aussi: mourir pour porter du fruit. « Si quelqu’un me sert, mon Pére lui donnera la gloire. »", "page": 80, "kind": "p"}, {"id": "r13p19", "text": "Maintenant, je suis bouleversé... Que puis-je dire? Pére, délivre-moi de cette heure ?", "page": 81, "kind": "h"}, {"id": "r13p20", "text": "La certitude de la fécondité de son sacrifice n’empéche pas Jésus de ressentir ’angoisse de la mort. La pensée de subir le destin du grain de blé, mourant, pour revivre, trouble profondément Jésus. Les autres évangélistes nous ont dit, a dautres moments, que Jésus a été «tenté» d’utiliser sa divinité pour s’épargner la condition humaine: c’était la tentation du début, au désert (Matthieu 4/11)... ce sera la tentation de Pagonie au jardin des oliviers (Marc 14/32). Chaque fois, Jésus en est ressorti obstinément fidéle au Pére, filialement attaché a la volonté du Pére. Nous aussi, comme Jésus, nous pouvons vaciller sous la douleur.", "page": 81, "kind": "p"}, {"id": "r13p21", "text": "Mais non! C’est pour cela que je suis parvenu a cette heure-ci! Pére, glorifie ton nom...", "page": 81, "kind": "h"}, {"id": "r13p22", "text": "Pour nous aussi, l’obéissance de la foi consiste 4 accepter notre condition mortelle, et a lui donner un «sens» a la lumiére de la Passion et de la Gloire de Jésus : mourir pour donner du fruit. L’épitre aux Hébreux, que nous lisons ce méme dimanche, attribue elle aussi a lobéissance de Jésus la signification profonde de sa mort: « Ayant présenté avec un grand cri et des larmes sa priére et-sa supplication a Dieu qui pouvait le sauver de la mort... et parce qu'il s’est soumis en tout... il a été exaucé! Bien qui soit fils, il a pourtant appris ce que c’est qu’obéir par les souffrances de sa passion; et, ainsi conduit a sa perfection, il est devenu, pour tous ceux qui lui obéissent, la cause du salut éternel » (Hébreux 5/7.9).", "page": 81, "kind": "p"}, {"id": "r13p23", "text": "La mort reste un mal... La souffrance reste un mal...", "page": 81, "kind": "p"}, {"id": "r13p24", "text": "Et Jésus ne prend pas la peine de répondre aux questions dordre philosophique que pose le «probléme du mal». Simplement, il vit sa mort comme une obéissance a sa condition d’homme, par amour. Et, ainsi, il en change le sens.", "page": 81, "kind": "p"}, {"id": "r13p25", "text": "Alors, du ciel, vint une voix qui disait : « Je lai glorifié, et je le glorifierai encore. »»", "page": 82, "kind": "h"}, {"id": "r13p26", "text": "Saint Jean ne rapporte pas la Transfiguration, ni aucune théophanie de gloire. Pour lui, nous lavons déja vu dimanche dernier, c’est ’heure de la croix qui est ’heure de la gloire. Jésus y est « élevé», c’est-a-dire a la fois « crucifié » et «exalté»: les hommes font la premiére action... et Dieu la seconde...", "page": 82, "kind": "p"}, {"id": "r13p27", "text": "Maintenant ce monde est jugé... Maintenant le prince de ce monde va étre jeté dehors.", "page": 82, "kind": "h"}, {"id": "r13p28", "text": "Ce sont les deux faces d’une méme réalité : le « jugement», et le «salut»!", "page": 82, "kind": "p"}, {"id": "r13p29", "text": "Et moi, quand jaurai été élevé de terre, jattirerai a moi tous les hommes. II signifiait ainsi de quel genre de mort il allait mourir.", "page": 82, "kind": "h"}, {"id": "r13p30", "text": "Le mal vaincu, le « prince de ce monde» jeté dehors... Les hommes sauvés! Oui, c’est bien la croix qui crée une nouvelle attraction universelle... « Tous» les hommes! Mysterieuse parole, qu’il faut recevoir dans la foi, et pour laquelle nous devons rendre grace. Telle est, finalement, la vraie réponse a ces «grecs» qui demandaient a «voir» Jésus. Cette parole est une des derniéres que Jésus ait dite au cours de son ministére public. Et personne ne l’a comprise (Jean 12/34). Alors, nous dit saint Jean, «Jésus se cacha deux» (Jean 12/36). Il n’a plus rien a dire.", "page": 82, "kind": "p"}]}, {"id": 14, "title": "Dimanche des Rameaux", "group": "Cuaresma", "page": 83, "ref": "Marc 14/1 - 15/47", "paragraphs": [{"id": "r14p1", "text": "Cette page voudrait aider chaque chrétien qui le désire a passer une semaine «sainte»... Les offices de cette semaine sont les plus beaux, les plus significatifs de l'année. Mais on ne les vit vraiment de l’intérieur, que si on a médité personnellement les « événements » qui ont donné naissance a cette «semaine». Ce sont, sans conteste, les événements les plus importants de toute l’histoire humaine : ils ont fait basculer le cours de histoire, et changé le visage de la planéte terre.", "page": 83, "kind": "p"}, {"id": "r14p2", "text": "Il ne suffit pas de lire une fois, rapidement, la Passion. Il faut s’en imprégner. Il faut la relire. Nous n’avons encore pas assez remarqué la «place» qu’elle prend dans l’ensemble de la « Bonne Nouvelle de Jésus-Christ» ! La Passion, dans le récit de saint Marc, tient la cinquiéme partie de son évangile. Que dirions-nous, aujourd’hui, d’une biographie dans laquelle la part la plus importante serait consacrée a raconter la mort de celui dont on veut parler ? Cela est d’autant plus surprenant que ces récits ont été écrits aprés la résurrection, par des gens vivant dans la lumiére de l’événement triomphal de Pdque. Or, ils n’ont pas insisté sur cela. Dans le texte grec de Marc, la Passion tient la place de 160 lignes d’écriture... et la résurrection 46 lignes! ou méme 19 lignes, si on ne tient pas compte des versets 16/9 a 20, qui ont été ajoutés au texte d’une autre main que Marc. Oui, cette mort de Jésus doit étre capitale: il y a un «secret» a y découurtr...", "page": 83, "kind": "p"}, {"id": "r14p3", "text": "Moi, vous ne m/aurez pas toujours... D’avance, cette femme a parfumé mon corps pour mon ensevelissement... (Marc 14/8).", "page": 83, "kind": "h"}, {"id": "r14p4", "text": "Tout le début de la Passion (14/1 a 42), qui rapporte le «complot contre Jésus», «l’onction a Béthanie», «la trahison de Judas», «les préparatifs de la Paque», «l’annonce de la trahison de Judas», «institution de leucharistie», et «lagonie 4 Gethsémani»..., tous ces détails sont la pour nous dire que Jésus a commencé par vivre intérieurement sa Passion, avant qu’elle ne se déroule physiquement. Relisez ces quarante-deux premiéres lignes du chapitre quatorziéme de Marc. Essayez de pénétrer dans la pensée et le coeur de Jésus en les lisant. Oui, avant que n’intervienne son «arrestation», début du processus extérieur, Jésus a, « déja», tout vécu au fond de sa conscience, de sa prévision, de son offrande volontaire: il s'est vu, a lavance, «enseveli» (14/8), «trahi» (14/10 - 14/17), « ensanglanté» (14/24), « abandonné de tous et renié par Pierre » (14/27.30), «mourant» (14/34.36). Mais cette prise de conscience de Jésus avait commencé beaucoup plus tét. A partir de quel moment Jésus parla-t-il de sa mort prochaine? De facon évidente, a partir de la «confession de Foi de Pierre a Césarée» (Marc 8/31): depuis ce jour-la, par trois fois, Jésus parla a ses amis de sa mort violente et torturée (Marc 8/31 - 9/30 - 10/33). Mais il faut encore remonter plus loin! Allez lire le 14° verset du premier chapitre de saint Marc: Jésus prend la reléve de Jean Baptiste, sachant qu'il lui arrivera, a lui aussi, ce qui arriva a tous les prophétes. Jésus a donc vécu une grande partie de sa vie dans le pressentiment de sa mort. Et nous? Evitons-nous d’y penser ? Pour nous aussi, notre mort ne serait-elle point «Pacte» le plus important de notre vie? orientant tout le reste ?", "page": 84, "kind": "p"}, {"id": "r14p5", "text": "Le repas de la Paque... (Marc 14/12.13.14.16).", "page": 84, "kind": "p"}, {"id": "r14p6", "text": "Quatre fois le mot « paque » dans ce paragraphe. La paque juive commémorait la «libération»! Un peuple opprimé s était libéré avec l’aide de Dieu. Dans nos souffrances diicibas, ce qui nous oppresse, ce qui pourrait nous détruire... y compris dans notre mort humaine... nous pouvons, par la foi, rejoindre la présence secréte, mais décisive de Dieu, qui nous y fait « passer » (c’est le sens du mot « paque») au bonheur indéfectible. Jésus a vécu sa mort comme une « paque» : loin de fuir la réalité douloureuse et humiliée de sa condition dhomme, il sy est livré par une adhésion d’amour a Dieu! Faisant ainsi ’expérience de la mort, il en a «changé le sens»: «il s’est fait obéissant, jusqua la mort, et la mort sur la croix» (Philippiens 2/8). Donne-mai, Seigneur, d’accepter toutes les contraintes de ma vie humaine: souffrances, épreuves, maladies, vieillissement, échecs, solitude, péchés... comme une paque, comme un passage vers Toi.", "page": 84, "kind": "p"}, {"id": "r14p7", "text": "Ceci est mon corps... ceci est mon sang..., dit-il aprés", "page": 85, "kind": "h"}, {"id": "r14p8", "text": "avoir « béni Dieu» (Marc 14/22.24)", "page": 85, "kind": "p"}, {"id": "r14p9", "text": "Notons le détail curieux: dans saint Marc, Jésus fait la « consécration du vin», aprés que les disciples Pont bu (« ils en burent», au verset 23... il leur dit « Ceci est mon sang», au verset 24...). Un détail capable de réduire nos controverses liturgiques et étroitement ritualistes... comme si c’était un absolu de dire ces mots en latin ou en frangais, de toucher avec la main ou avec la langue... Seigneur, délivre-nous de nos bagatelles, pour nous faire entrer dans le mystére de ton amour qui se livre a l’avance, et joyeusement, dans une «action de grace» (verset 22): «ma vie, nul ne la prend, mais c’est moi qui la donne» (Marc 10/45, Jean 10/18). Et nous? Pourquoi ne profiterions-nous pas de cette méditation de la Passion pour « offrir dés maintenant et librement» notre propre mort, avec celle de Jésus. Fantastique moyen de ne plus la redouter, mais de la voir venir calmement, dans la paix, comme Jésus, avec Lui.", "page": 85, "kind": "p"}, {"id": "r14p10", "text": "Je ne boirai plus du fruit de la vigne, jusqu’a ce jour ou je boirai un vin nouveau dans le royaume de Dieu... (Marc 14/25).", "page": 85, "kind": "h"}, {"id": "r14p11", "text": "Joie! Calme! Paix! Attente paisible « de ce jour-la» ! le jour de Dieu, le jour ot Dieu régnera enfin, le jour ot tout sera vie, amour, bonheur, festin nouveau, vin nouveau... ot «il n’y aura plus ni mort, ni deuil, ni cri, ni souffrance, mais les noces de Il’Agneau» (Apocalypse 21/4)... le «dernier jour», l'achévement du temps, l’achévement de l’ceuvre de Dieu, le jour eschatologique... vers lequel nous allons tous. Merci, Seigneur! Que chaque eucharistie soit un jalon sur cette route qui nous conduit a ce «festin du vin nouveau au Royaume de ton Pére», dans l'amour.", "page": 85, "kind": "p"}, {"id": "r14p12", "text": "VERS LA SOLITUDE TOTALE.", "page": 86, "kind": "p"}, {"id": "r14p13", "text": "Suivons Jésus. Il annonce que «tous» vont labandonner (Marc 14/27), que Pierre le responsable, va le renier (Marc 14/30). Il en prend «trois» pour étre avec lui en son agonie, et revient trois fois vers eux pour les supplier, mais ils « dorment» (Marc 14/33.37. 40.41)... puis, tous, «labandonnant, ils s’enfuirent» (Marc 14/50)..., et sur la croix, méme, il éprouvera d’étre abandonné de Dieu (Marc 15/34). Solitude totale. Tout homme meurt seul. Jésus n’a pas triché. Il a obéi a la «condition humaine».", "page": 86, "kind": "p"}, {"id": "r14p14", "text": "Asseyez-vous ici, tandis que je vais prier... (Marc 14/32).", "page": 86, "kind": "p"}, {"id": "r14p15", "text": "« Abba, Pére, tout est possible pour toi. Eloigne de moi cette coupe... cependant, non pas ce que je veux,", "page": 86, "kind": "h"}, {"id": "r14p16", "text": "mais ce que tu veux... (Marc 14/36). -", "page": 86, "kind": "p"}, {"id": "r14p17", "text": "«Vers la 9° heure, Jésus cria d’une voix forte: Eloi, Eloi, Lama Sabactani, ce qui veut dire: Mon Dieu, mon Dieu, pourquoi m/’as-tu abandonné?» (Marc", "page": 86, "kind": "h"}, {"id": "r14p18", "text": "15/34).", "page": 86, "kind": "p"}, {"id": "r14p19", "text": "En sa passion, Jésus, ainsi, ne cesse pas de prier. Ces deux priéres, celle de Gethsémani, et celle de Golgotha, Marc nous dit que Jésus les fit dans sa langue maternelle, en araméen, sa langue de petit enfant
