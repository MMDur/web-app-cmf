er : « fais ce que tu veux, fais ce qui te plait.»", "page": 270, "kind": "p"}, {"id": "r51p6", "text": "Qu’en pense Jésus ?", "page": 270, "kind": "p"}, {"id": "r51p7", "text": "Un jour, des pharisiens abordérent Jésus, et, pour le mettre a l’épreuve, ils lui demandérent: « Est-il permis a un mari de renvoyer sa femme ? »", "page": 270, "kind": "h"}, {"id": "r51p8", "text": "Question insidieuse, posée pour mettre Jésus dans l’embarras, question piégée. Quelle que soit la réponse de Jésus, il se mettra A dos une partie de l’opinion publique, car le sujet est brialant... et touche jusqu’aux fibres les plus secrétes. Personne n’est « neutre» devant une telle question, car il est dans «telle» ou «telle» situation concréte. Les blessures du coeur sont les plus difficiles a cicatriser. Question d’autant plus étonnante, de la part des pharisiens, que la solution était déjA donnée par la loi: « Lorsqu’un homme aura pris une femme et l’aura épousée, s'il advient quelle ne trouve plus grace a ses yeux parce qu'il a trouvé en elle quelque chose de choquant, il écrira pour elle une lettre de répudiation, la lui remettra en main, et la renverra de sa maison» (Deutéronome 24/1). La réponse de la loi est donc claire: le divorce est tout a fait légal... au temps de Jésus, comme de notre temps. On est frappé de la ressemblance entre les situations qu’ont eu a vivre les premiers chrétiens, et celle que nous connaissons aujourd’hui: dans presque tous les pays du monde, il existe une législation du divorce suivi du remariage.", "page": 270, "kind": "p"}, {"id": "r51p9", "text": "Jésus dit: «Que vous a prescrit Moise?» Ils lui répondirent : « Moise a permis de renvoyer sa femme a condition d’établir un acte de répudiation. »", "page": 271, "kind": "h"}, {"id": "r51p10", "text": "Rien de tel qu’une réponse de ce genre pour nous mettre dans l’humilité face 4 ces questions difficiles. Les interprétations « fondamentalistes » de la Bible (c’est-a-dire celles qui prétendent qu’il faut la prendre a la lettre, matériellement) aboutissent, en fait, A des simplismes et a de vrais enfantillages. Il est évident que la « révélation » a été progressive, et que la morale et le dogme ont évolué au cours des ages: Moise, pour une grande part, n’a fait que reprendre le «droit coutumier» de son temps, ot: la polygamie et le divorce étaient des traditions solidement établies. Faute de mieux, il essaya de remédier aux caprices de l’arbitraire en «légalisant», en «réglementant», en établissant une « procédure»: il cherchait ainsi a limiter le mal en obligeant a des formalités précises. Mais, comme pour toute loi, celle-ci pouvait recevoir des applications plus ou moins larges. Deux interprétations s’opposaient, du temps de Jésus. Il Sagissait, en effet, d’expliquer le terme «chose choquante», dans la loi. Selon Rabbi Shammai, il fallait interpréter ce terme seulement en pensant a une «immoralité grave», comme ladultére... alors que l’école moins rigoureuse de Rabbi Hillel y incluait de trés nombreuses possibilités, comme... d’avoir laissé briler un repas ! (Mischna Gittin IX, 10).", "page": 271, "kind": "p"}, {"id": "r51p11", "text": "A travers cet exemple, nous sommes amenés a conclure que «tout ce qui est légal n’est pas forcément moral». Le chrétien vit dans une société pluraliste. Il doit avoir assez de «colonne vertébrale» pour étre capable de vivre selon sa conscience, méme si cela le conduit a un certain héroisme évangélique, a contre-courant de la grande masse. Mais, aprés tout, n’en va-t-il pas de méme pour bien des exigences évangéliques ? La non-violence rvest-elle pas une folie? Le pardon sans condition n’est-il pas une aberration? La pauvreté volontaire n’est-elle pas une utopie?", "page": 272, "kind": "p"}, {"id": "r51p12", "text": "C’est donc dans ce contexte de son temps, ot le divorce était légal, que Jésus va prendre position.", "page": 272, "kind": "p"}, {"id": "r51p13", "text": "Jésus répliqua: « C’est en raison de votre « dureté de coeur» que Moise a formulé cette loi.", "page": 272, "kind": "h"}, {"id": "r51p14", "text": "Pour une fois, on aurait di ne pas traduire le mot grec « sclérocardia» mais le transcrire en francais, que tout le monde aurait compris: « C’est en raison de votre “ sclérocardie” que Moise a ouvert cette permission du divorce». Voila une maladie du coeur trop répandue: la sclérose du coeur, la dureté du coeur. Seigneur apprends-nous a aimer vraiment... Pautre!", "page": 272, "kind": "p"}, {"id": "r51p15", "text": "Une forte pression sociale («faire comme tout le monde») pousse aujourd’hui comme en ce temps-la, a en rester aux «rapports de force». Les statistiques, par exemple, prouvent que les trois quarts des divorces intervenant dans les cinq premiéres années de mariage ont lieu pour des couples ot il y avait eu «cohabitation prénuptiale », comme on dit! Refuser le « mariage», refuser les «normes sociales», nest pas forcément preuve de maturité: vivre ensemble, coucher ensemble sans étre marié... quest-ce que ¢a « signifie», au fond? N’est-ce point maintenir l’affectivité a un niveau adolescent, bloquée a un premier niveau élémentaire? N’est-ce point se garder une porte de sortie, refuser de s’engager vraiment, ne « point se donner», au fond? risquer den rester a des rapports de domination entre conjoints. Je reste le maitre! Je reste libre!", "page": 272, "kind": "p"}, {"id": "r51p16", "text": "Attention a votre «sclérocardie», dit Jésus!", "page": 273, "kind": "p"}, {"id": "r51p17", "text": "Sous-couvert d’intimité, d’autonomie, de liberté, qu’est-ce qui se cache? L’amour d’un «autre»... ou bien Pamour de «toi» ?", "page": 273, "kind": "p"}, {"id": "r51p18", "text": "«Mais, au commencement du monde, quand Dieu créa Phumanité, il les fit homme et femme.»", "page": 273, "kind": "h"}, {"id": "r51p19", "text": "La loi fondamentale du couple est a chercher a ce niveaula: la complémentarité des sexes est une «création», une «volonté» de Dieu, inscrite dans la nature profonde de homme et de la femme.", "page": 273, "kind": "p"}, {"id": "r51p20", "text": "Une fois de plus, Jésus ne s’exprime pas en termes de morale, de permis et défendu, méme si cela aboutit, de fait, a des comportements précis. Il montre un «idéal». On ne peut s’en tenir a application d’une loi! Pour Jésus, il faut essayer de contempler le « projet de Dieu sur Phomme et la femme».", "page": 273, "kind": "p"}, {"id": "r51p21", "text": "Comme nous sommes loin des petites perspectives sociologiques, des courants variables d’opinion, du «faire comme tout le monde». Quelle conception avons-nous de lamour conjugal? Celle de telle vedette de cinéma, celle véhiculée par les chansonnettes d’une radio pour sousdéveloppés mentaux? Attention! dit Jésus, avant tout cela, Dieu a une opinion sur l'amour, et l'a exprimée dans sa création.", "page": 273, "kind": "p"}, {"id": "r51p22", "text": "«A cause de cela, Phomme quittera son pére et sa mere, s’attachera a sa femme, et tous deux ne feront qu'un. Ainsi, ils ne sont plus deux, mais ils ne font qu’un. »", "page": 273, "kind": "h"}, {"id": "r51p23", "text": "C’est donc au texte de la Genése que Jésus se référe, ce texte que nous lisons aujourd’hui en premiére lecture. On naura jamais fini d’explorer cette fantastique affirmation du Livre Saint: « Faisons homme a notre image, selon notre ressemblance... Et Dieu créa homme a son image, a image de Dieu il le créa: male et femme il les créa» (Genése 1/26.27). Ce n’est pas par hasard que le texte biblique passe du singulier au pluriel. Le Dieu «un» en « trois» personnes a créé ’humanité a son image: «a pluSieurs, ne faire qu’un.» A plusieurs... entre personnes profondément différentes entre elles, faire une unité.", "page": 273, "kind": "p"}, {"id": "r51p24", "text": "Source d’unité dans le monde, a l’aube de la création, Tu nous donnes, Seigneur, ta gloire, Tu fais ’homme et la femme a ton image: 6 mystére dvalliance!", "page": 274, "kind": "p"}, {"id": "r51p25", "text": "Amour partagé, 6 Dieu, donne a ton peuple la force d’aimer.", "page": 274, "kind": "p"}, {"id": "r51p26", "text": "« Donc, ce que Dieu a uni, que homme ne le sépare pas!»", "page": 274, "kind": "h"}, {"id": "r51p27", "text": "Seul Dieu vivant en nous peut rendre possible ce qui nous semble impossible. Le sacrement de Mariage n’est rien dautre que la «grace», le don gratuit, qui guérit limpuissance de homme a aimer comme aime le Dieu de lAlliance. L’indissolubilité du mariage, proclamée par Jésus, a contre-courant des normes habituelles, ne peut devenir, pour nous. un moyen de juger ou de condamner les foyers en difficulté. Ce n’est pas a cela que nous appelle le Christ ! Liindissolubilité est le voeu le plus profond de lamour. Merci, Jésus, de nous le redire, méme si c’est difficile a vivre. Mais, par ta Passion et par ta Croix, sauve nos amours: fais-nous aimer comme Toi:", "page": 274, "kind": "p"}, {"id": "r51p28", "text": "«L’homme qui renvoie sa femme pour en épouser une autre, est coupable d’adultére... La femme qui renvoie son mari pour en €pouser un autre, est coupable d’adultére...»", "page": 274, "kind": "h"}, {"id": "r51p29", "text": "La parfaite symétrie de ces deux formules paralléles est trés significative. Pour Jésus, la réciprocité est totale: les hommes et les femmes ont les mémes droits et les mémes devoirs. Dans notre monde ot triomphent les rapports de domination, Jésus nous demande d’aimer... l'autre. Et il nous en donne la « force»... difficile. L'unité du couple, voulue par Dieu, n’est pas «au départ», ce n’est pas un « paradis perdu» dans le passé.:. c’est une route quotidienne ot se construit «le paradis retrouvé»... quand nous serons, enfin, a image de Dieu: a Trois, faire Un...", "page": 274, "kind": "p"}]}, {"id": 52, "title": "28e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 275, "ref": "Marc 10/17.30", "paragraphs": [{"id": "r52p1", "text": "Jésus se mettait en route quand un homme accourut vers lui, se mit 4 genoux et lui demanda: « Bon Maitre, que dois-je faire pour avoir en héritage la vie éternelle ? »", "page": 275, "kind": "h"}, {"id": "r52p2", "text": "Scéne vivante. Un homme de désir: il court... il se jette a genoux aux pieds de Jésus... et, tout essouflé, il pose une question.", "page": 275, "kind": "p"}, {"id": "r52p3", "text": "Quand on sait (par la suite du récit) qui est cet homme, on ne peut quétre étonné. Voila quelqu’un qui a tout ce qu'il faut pour étre heureux, selon les normes habituelles: il est riche, il posséde de « grands biens»... de plus, il méne une vie droite, «il observe les commandements depuis sa jeunesse»... Dans ses relations, il doit étre trés bien considéré. Que peut-il bien lui manquer ? Que peut-il vouloir de plus ? Pourquoi « désire»-t-i] autre chose ?", "page": 275, "kind": "p"}, {"id": "r52p4", "text": "Jésus lui dit: « Pourquoi m’appelles-tu ”bon”? Personne nest bon, sinon Dieu seul.»", "page": 275, "kind": "h"}, {"id": "r52p5", "text": "Réponse tranchante comme un couperet. Cet homme riche avait le sens des « titres». D’une maniére un peu exaltée, il en rajoute: habituellement, on disait seulement a Jésus « maitre»... Lui, habitué aux grandes relations, ajoute «bon»! Jésus, lui, n’aime pas ces exagérations, il préfére la sobriété. Il repousse les titres emphatiques.", "page": 275, "kind": "p"}, {"id": "r52p6", "text": "De plus, Jésus est l'homme qui a toujours Dieu a la bouche. C’est sa référence constante. Nous avons, ici, une parole étonnante de Jésus. Il a lair d’ignorer quill est « Dieu»... Il refuse le titre de «bon»! Ce n’est pas le seul cas ot, humblement, Jésus se dit «inférieur» au Pére, a « Dieu»: un autre jour, il osera affirmer qu'il «ignore le jour du Jugement, que seul le Pére connait» (Marc 13/32).", "page": 275, "kind": "p"}, {"id": "r52p7", "text": "Dieu seul! dit Jésus. Je prie a partir de cette expression radicale.", "page": 276, "kind": "p"}, {"id": "r52p8", "text": "«Tu connais les commandements: ne commets pas de meurtre, ne commets pas d’adultére, ne commets pas de vol, ne porte pas de faux témoignage, ne fais de tort a personne, honore ton pére et ta mére.»", "page": 276, "kind": "h"}, {"id": "r52p9", "text": "La liste, et Pordre des «commandements» sont assez surprenants.", "page": 276, "kind": "p"}, {"id": "r52p10", "text": "Tout d’abord, Jésus ne cite pas les « premiers», les commandements « envers Dieu», comme si c’était par ’amour du prochain qu’on prouve notre amour de Dieu. Avouons que, spontanément, nous aurions plut6t pensé aux «devoirs religieux», pour mériter la vie éternelle. Une fois de plus, Jésus nous renvoie a nos freres, a nos relations humaines.", "page": 276, "kind": "p"}, {"id": "r52p11", "text": "De plus, aux commandements savinBerene du décalogue, Jésus en rajoute un, trés significatif : «ne fais de tort a personne»! comme si cette formulation résumait les autres. Nous remarquons aussi que les «devoirs envers nos parents» sont cités a la fin: le «4* commandement» de la Loi est déplacé et mis en derniére position, comme si Jésus voulait d’abord mettre en premier les tentations particuliéres d’un homme fortuné: voler, faire du tort... avoir acquis sa richesse de manieére injuste...", "page": 276, "kind": "p"}, {"id": "r52p12", "text": "Lhhomme répondit: « Maitre, j'ai observé tous ces commandements depuis ma jeunesse.", "page": 276, "kind": "h"}, {"id": "r52p13", "text": "Voila donc un homme droit, consciencieux, Il observe la loi. Il est en régle! Jésus ne conteste pas la sincérité de ces paroles: on pourrait s’attendre a ce que histoire s’achéve ici. Voilaé quelqu’un qui a droit a la «vie éternelle »!", "page": 276, "kind": "p"}, {"id": "r52p14", "text": "Ecoutons la suite.", "page": 276, "kind": "p"}, {"id": "r52p15", "text": "Posant alors son regard sur lui, Jésus se mit 4 l'aimer.", "page": 276, "kind": "h"}, {"id": "r52p16", "text": "Le regard de Jésus. J’essaie de limaginer. Un regard damour! Jésus affectueux. Jésus aimant. Jésus ému.", "page": 276, "kind": "p"}, {"id": "r52p17", "text": "Il lui dit: «Une seule chose te manque: va, vends tout ce que tu as, donne-le aux pauvres, et tu auras un trésor dans le ciel; puis viens, et suis-moi! »", "page": 277, "kind": "h"}, {"id": "r52p18", "text": "Ainsi donc, il ne suffirait donc pas d’étre honnéte, d’observer tous les commandements? On pouvait croire cet homme fidéle, irréprochable, et voici une nouvelle exigence, qui va « révéler» le fond de son étre: es-tu libre, ou esclave? Quelle est ton attitude face a l’'argent, aux biens de la terre?", "page": 277, "kind": "p"}, {"id": "r52p19", "text": "Il est curieux que nous continuions a trouver cette exigence de Jésus surprenante! Jésus ne cesse de répéter cela. Ce fut son premier appel: « venez a ma suite... laissant aussit6t leurs filets et leur pére dans la barque...» (Marc 1/18.19). Ce fut sa premiére instruction aux disciples en les envoyant en mission: «Il leur ordonna de ne rien prendre pour la route, pas de pain, pas de sac, pas de monnaie dans la ceinture» (Marc 6/8). C’était la premiere conséquence a tirer de l’annonce de sa Passion: «si quelqu’un veut me suivre, qu'il se renonce a lui-méme» (Marc 8/34). Jésus n’a jamais parlé autrement! Il a de la suite dans les idées. Il demande un choix radical. I] demande «tout»! Pour Le suivre, il faut abandonner tout le reste. Exigence infinie. L’évangile n’est pas une bonne petite recette tranquillisante, c’est la plus formidable aventure, le risque, le «va-tout». Prétention exorbitante!", "page": 277, "kind": "p"}, {"id": "r52p20", "text": "Mais lui, 4 ces mots, devint sombre et s’en alla tout triste, car il avait de grands biens.", "page": 277, "kind": "h"}, {"id": "r52p21", "text": "Voici donc quelqu’un qui nous ressemble. Ne Taccusons pas. Ne sommes-nous pas, nous aussi, désireux de la perfection, désireux de la vie éternelle... mais peu décidés a y mettre le prix? Ce récit d’une vocation manquée nous rappelle que, nous aussi, nous refusons des appels de Dieu... des appels qui seraient source de joie! malgré lapparence de renoncement qu’ils présentent dans l’immédiat. La «tristesse» de cet homme est significative: il a beaucoup d’argent, il est riche de « grands biens», et, avec toute cette abondance, il n’est pas heureux. N’est-ce pas l’image de notre occident gavé? Mais allons plus loin, et osons regarder ce malaise qui assombrit son visage: n’est-ce point le premier signe que la grace l’a quand méme touché ? Il était jusque-la « inconscient » de son manque essentiel. Il croyait que ses richesses le comblaient. II sait maintenant qu’ est fait pour un tout autre destin. Seigneur, que nos tristesses elles-mémes deviennent positives, nous réveillant de nos illusions ou de nos torpeurs. Nous sommes faits pour Toi! Notre coeur, notre désir, est trop grand pour se satisfaire des biens limités de la terre: « Toi seul, peux combler nos désirs, viens, Seigneur! »", "page": 277, "kind": "p"}, {"id": "r52p22", "text": "Alors Jésus regarde tout autour de lui et dit a ses disciples.", "page": 278, "kind": "h"}, {"id": "r52p23", "text": "Encore le regard de Jésus, noté une deuxiéme fois par Marc.", "page": 278, "kind": "p"}, {"id": "r52p24", "text": "Jésus regarde. Jésus me regarde. Jésus regarde ceux que jaime. Jésus regarde notre monde. Jésus regarde les foules des supermarchés. Jésus regarde les foules des pays du Tiers-Monde. Et ce regard n’est pas indifférent. Il prend la parole, et il dit:", "page": 278, "kind": "p"}, {"id": "r52p25", "text": "«Comme il sera difficile 4 ceux qui possédent des richesses d’entrer dans le Royaume de Dieu! »", "page": 278, "kind": "h"}, {"id": "r52p26", "text": "Le terrible « pouvoir» de Pargent est dénoncé une fois de plus par Jésus. C’est un avertissement qui court dans toute la prédication de Jésus: « Vous ne pouvez pas servir Dieu et Mammon» (Luc 16/13). Le riche devient insensé et il simagine qu'il peut se passer de Dieu (Luc 12/16.20). Le riche se ferme peu a peu le coeur et ne voit plus ses fréres qui souffrent prés de lui (Luc 16/19.31). La richesse étouffe la parole de Dieu (Matthieu 13/22).", "page": 278, "kind": "p"}, {"id": "r52p27", "text": "Une fois de plus, ne nous contentons pas de condamner les autres. Reconnaissons que nous sommes des riches: le S.M.I.C. d’un francais est une vraie fortune pour un africain ou un asiatique.", "page": 278, "kind": "p"}, {"id": "r52p28", "text": "Les disciples étaient stupéfaits de ces paroles.", "page": 278, "kind": "h"}, {"id": "r52p29", "text": "Cet effroi des disciples n’est pas sans signification. La mentalité juive était convaincue que la richesse était un signe de la faveur de Dieu: le dessein créateur n’est-il pas de remettre a \"homme la « possession et la domination» de ce monde pour le construire et le faire valoir? (Genése 1/27.31).", "page": 278, "kind": "p"}, {"id": "r52p30", "text": "Mais avouons que nous-mémes, nous n’acceptons pas ces paroles du Christ. Le XX® siécle, moins que tout autre, est prét a accepter cette éthique révolutionnaire :", "page": 279, "kind": "p"}, {"id": "r52p31", "text": "— Ne travaillons-nous pas pour «gagner de largent», pour gagner le plus possible?", "page": 279, "kind": "p"}, {"id": "r52p32", "text": "— Ne souhaitons-nous pas pour nos enfants un « métier qui rapporte » ?", "page": 279, "kind": "p"}, {"id": "r52p33", "text": "— Ne sommes-nous pas, chaque jour, agressés par une publicité envahissante qui nous pousse a consommer davantage, nous suggérant que « plus on posséde, plus on est heureux» ?", "page": 279, "kind": "p"}, {"id": "r52p34", "text": "Mais Jésus reprend: « Mes enfants, comme il est difficile d’entrer dans le Royaume de Dieu. Il est plus facile 4 un chameau de passer par le trou d’une aiguille qu’a un riche d’entrer dans le Royaume de Dieu.»", "page": 279, "kind": "h"}, {"id": "r52p35", "text": "Loin de retirer la dureté de ses paroles, Jésus les renforce par une image inoubliable. Jésus, prédicateur populaire, avait l'art des formules frappantes et faciles a retenir. Ne les édulcorons pas, sous prétexte qu’elles sont paradoxales. Elles disent avec force qu’entre la « richesse» et le « salut», il y a incompatibilité : il faut choisir entre les deux trésors, celui de la terre et celui du ciel. Que l’argent soit nécessaire, Jésus n’en disconvient pas. Que largent nous «serve», Jésus est d’accord! Mais que l’argent nous «domine», que nous en devenions «esclaves», Jésus ne peut pas le supporter.", "page": 279, "kind": "p"}, {"id": "r52p36", "text": "De plus en plus déconcertés, les disciples se demandaient entre eux: « Mais alors, qui peut étre sauvé ? » Jésus les regarde et répond: « Pour les hommes, cela est impossible, mais pas pour Dieu; car tout est possible 4 Dieu.»", "page": 279, "kind": "h"}, {"id": "r52p37", "text": "Encore le regard de Jésus! noté pour la troisiéme fois en cette seule page.", "page": 279, "kind": "p"}, {"id": "r52p38", "text": "Jésus cite, ici, une parole de la Bible 4 Abraham (Genése 18/14): malgré son, impossibilité physique, malgré son grand age, Sara mettra au monde un fils: car tout est possible 4 Dieu. L’ange Gabriel avait déja dit cela 4 Marie (Luc 1/37). Ainsi Jésus, aprés les dures condamnations de nos attitudes possessives, nous ouvre une espérance.", "page": 279, "kind": "p"}, {"id": "r52p39", "text": "«Tu demandes limpossible, maitre de tout: viens nous libérer! Et nos mains s’ouvriront devant toi pour accueillir ce qui manque a notre amour...»", "page": 280, "kind": "p"}]}, {"id": 53, "title": "29e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 281, "ref": "Marc 10/35.45", "paragraphs": [{"id": "r53p1", "text": "Jacques et Jean, les fils de Zébédée, s’approchent de Jésus et lui disent: « Maitre, nous voudrions que tu exauces notre demande.»", "page": 281, "kind": "h"}, {"id": "r53p2", "text": "Voici deux jeunes... fils du marin pécheur Zébédée... de Bethsaide, petit port des bords du lac de Tibériade. Leur mére est sans doute Salomé, la propre soeur de Marie meére de Jésus (Marc 15/40- 16/1). Obéissant a une coutume toute naturelle dans beaucoup de civilisations orientales, ils trouvent normal d’utiliser les priviléges de la parenté: cousins de Jésus, ils vont solliciter leur parent pour que le «clan familial» participe a la réussite de l'un de ses membres.", "page": 281, "kind": "p"}, {"id": "r53p3", "text": "Dvailleurs, Jésus n’a-t-il pas dit: « Demandez, et vous recevrez.» Alors? Ils font une priére: « Nous voudrions que tu exauces notre demande.»", "page": 281, "kind": "p"}, {"id": "r53p4", "text": "Une occasion a bien saisir, pour nous qui nous étonnons parfois que certaines de nos priéres ne sont pas exaucées «comme,» nous l’aurions souhaité.", "page": 281, "kind": "p"}, {"id": "r53p5", "text": "Il leur dit: «Que voudriez-vous que je fasse pour vous ?)>", "page": 281, "kind": "h"}, {"id": "r53p6", "text": "Leur demande était trop vague. Jésus leur dit de la préciser.", "page": 281, "kind": "p"}, {"id": "r53p7", "text": "Ils lui repondent: « Accorde-nous de siéger, l'un a ta droite et Pautre 4 ta gauche, dans ta gloire.»", "page": 281, "kind": "h"}, {"id": "r53p8", "text": "Jésus vient de leur annoncer pour la troisiéme fois sa Passion (Marc 10/32.34). « Nous montons a Jérusalem... le Fils de homme sera livré aux grands prétres, ils le condamne- »", "page": 281, "kind": "p"}, {"id": "r53p9", "text": "ront a mort... ils se moqueront de lui, cracheront sur lui, le flagelleront, le tueront...» Au moment méme owt Jésus « prend la derniére place», eux, ils essaient de «se pousser» aux bonnes places: ils en sont encore aux réves messianiques glorieux de leur peuple. Le Messie, pour eux (et pour nous... ?) c’est ce triomphateur victorieux qui va tout régler par sa Puissance. Alors, pourquoi ne pas profiter du cousin pour une promotion, un passe-droit, une recommandation ? Ne les jugeons pas trop durement. Ne faisonsnous pas la méme chose chaque fois que c’est possible ? C’est humain. Quand on a des relations, n’est-il pas naturel d’en profiter pour en tirer quelques avantages ? Allons plus loin: notre vie chrétienne est-elle pour nous une vie ov nous servons Dieu? ou bien une vie ot nous essayons de mettre Dieu a notre service? Notre pratique religieuse estelle une adoration, une louange et une obéissance tournée « vers Dieu»? ou bien ne serait-elle point surtout une sorte «d assurance sur l’au-dela»... Maitre, assure-moi un bon strapontin au ciel.", "page": 282, "kind": "p"}, {"id": "r53p10", "text": "Jésus leur dit: «Vous ne savez pas ce que vous demandez...»", "page": 282, "kind": "h"}, {"id": "r53p11", "text": "Effectivement, s’ils savaient «qui» sera «a droite et a gauche» de Jésus, quand il sera dans «sa gloire», sur la croix! Ils sont en train de demander, sans le savoir, la place des deux brigands crucifiés avec Jésus sur la colline.", "page": 282, "kind": "p"}, {"id": "r53p12", "text": "Ils n’ont encore rien compris au destin véritable de Jésus. Par ses questions, Jésus essaie de les faire passer de la pensée de la «gloire du Messie», a celle du «chemin qui y méne». Nous aussi, souvent, nous ne savons pas ce que nous demandons: mystére de nos priéres apparemment inexaucées... Acceptons que Dieu nous désinstalle, et quill modifie nos demandes : vous ne savez pas ce que vous me demandez, faites-moi un peu plus confiance, dit Dieu. La « gloire» que vous demandez, vous Jacques et Jean, vous laurez un jour! Le réve de votre jeunesse, oui, sera réalisé dans votre 4ge mir: Jacques sera le premier Martyr a Jérusalem (Actes 12/2) et Jean subira lunivers concentrationnaire de Néron, aux travaux forcés dans I’'lle de Patmos (Apocalypse 1/9).", "page": 282, "kind": "p"}, {"id": "r53p13", "text": "Pouvez-vous boire la coupe que je vais boire, et recevoir le baptéme dans lequel je vais étre plongé ?", "page": 283, "kind": "h"}, {"id": "r53p14", "text": "Jésus utilise deux images traditionnelles de la Bible pour les aider 4 modifier leur demande, leur désir: la coupe... le baptéme...", "page": 283, "kind": "p"}, {"id": "r53p15", "text": "— La «coupe», dans lEcriture, est habituellement la «coupe d’amertume», ce breuvage répugnant, dur a avaler : «Le Seigneur tient en main une coupe, il verse un vin acre et fermenté: ils le boiront, ils en laperont méme la lie...» (Psaume 75/9).", "page": 283, "kind": "p"}, {"id": "r53p16", "text": "— Le «baptéme» a une signification analogue: cest l'image du plongeon, de |’engloutissement: «Toutes tes vagues et tous tes flots ont passé sur moi» (Psaume 42/9). Jésus est trés conscient de ce qui va lui arriver. Et il demande a ses deux disciples: «Pouvez-vous boire le calice de ma Passion, et étre plongés dans mon baptéme de sang... Acceptez-vous d’étre, comme moi et avec moi, enfouis sous les eaux de cette tragique noyade, c’est-a-dire de partager ma mort?»", "page": 283, "kind": "p"}, {"id": "r53p17", "text": "Ils répondirent: « Nous le pouvons! »", "page": 283, "kind": "h"}, {"id": "r53p18", "text": "Ils sont généreux de tout ’enthousiasme de leur jeunesse. Ils sont préts 4 payer de leur personne, a « boire» la coupe, a «étre plongés» dans le baptéme.", "page": 283, "kind": "p"}, {"id": "r53p19", "text": "N’oublions pas que, lorsque Marc écrit son évangile, deux sacrements sont vécus par les chrétiens... comme par nous aujourd’hui. Quelle signification donnons-nous a notre baptéme et a notre eucharistie? La coupe a laquelle nous communions est-elle communion au «sacrifice de celui qui a donné sa vie»? Notre foi de baptisés nous fait-elle « suivre» Jésus? Jusqu’ot ?", "page": 283, "kind": "p"}, {"id": "r53p20", "text": "Il répond: «La coupe que je vais boire, vous y boirez; et le baptéme dans lequel je vais étre plongé, vous le recevrez.»", "page": 283, "kind": "h"}, {"id": "r53p21", "text": "Quand Marc rédige cette prophétie de Jésus, elle est déja en partie réalisée. En l’'an 44, Jacques a été martyrisé. «A cette époque-la, Hérode mit a mal certains membres de lEglise. Il supprima par le glaive Jacques, le «frére» de Jean. Et quand il eut constaté la satisfaction des juifs, il fit procéder a une nouvelle arrestation, celle de Pierre» (Actes 12/2.3). Etre chrétien, c’est suivre Jésus!", "page": 283, "kind": "p"}, {"id": "r53p22", "text": "« Quant a siéger a ma droite ou a ma gauche, il ne m/’appartient pas de l’accorder, il y en a pour qui ces places sont préparées. »", "page": 284, "kind": "h"}, {"id": "r53p23", "text": "Jésus prononce, une fois de plus, une parole étonnante d’humilité, devant son Pére: il dit qu’il n’a pas «le pou: voir»! Il se soumet. Par ces mots, il nous invite, a notre tour, a laisser Dieu disposer de nous. La « gloire», Jacques et Jean l’auront. Mais ce ne sera pas celle quills ambitionnaient: ce sera celle de Jésus. Ainsi a-t-il exaucé leur priére! Et nous? Quand nos priéres semblent non exaucées, faisons-nous finalement confiance 4 Dieu pour quill ' les exauce, a sa maniére a lui? Jésus luicméme renvoyait ses amis au mystére insondable des desseins de Dieu.", "page": 284, "kind": "p"}, {"id": "r53p24", "text": "Les dix autres s’indignaient contre Jean et Jacques. car ils avaient entendu.", "page": 284, "kind": "h"}, {"id": "r53p25", "text": "Ils s’indignent parce qu’ils partagent la méme ambition.", "page": 284, "kind": "p"}, {"id": "r53p26", "text": "Jésus les appelle et leur dit: « Vous le savez: ceux que l’on regarde comme chefs des nations paiennes commandent en maitres; les grands font sentir leur pouvoir. »>", "page": 284, "kind": "h"}, {"id": "r53p27", "text": "Pour une fois ot! Jésus parle de «politique», c’est pour faire un portrait rapide, et assez sombre. On ne peut pas dire que Jésus souhaite instaurer un monde sans hiérarchie, un monde nivelé. Mais une fois de plus (comme pour Pusage de Pargent ou de la sexualité), il rejette les abus: le « pouvoir» ne peut pas étre exercé seulement comme un lieu de domination et d’oppression, comme un « rapport de forces»... le plus fort ’emporte. Non! dit Jésus.", "page": 284, "kind": "p"}, {"id": "r53p28", "text": "Parmi vous, il ne doit pas en étre ainsi.", "page": 284, "kind": "h"}, {"id": "r53p29", "text": "Jésus exclut catégoriquement, dans l’Eglise, dans la communauté chrétienne, le modéle de pouvoir exercé dans le monde.", "page": 284, "kind": "p"}, {"id": "r53p30", "text": "Celui qui veut devenir grand sera votre serviteut (« diakonos» en grec). Celui qui veut étre le premier sera l’esclave (« doulos» en grec) de tous...", "page": 284, "kind": "h"}, {"id": "r53p31", "text": "Ce n'est pas seulement une loi parmi d’autres, c’est la «Constitution» de lEglise, de la communauté des disciples: chacun doit y étre le serviteur de tous! L’image donnée par Jésus est, ici, étonnamment accentuée. Ce que ne dit pas le mot « serviteur», le terme d’« esclave» le dit avec force, en ajoutant la « dépendance» a l’égard de celui qu’on sert! Dans ’Eglise, il faut renoncer totalement au principe de ’avancement, des galons, de la carriére, des titres, des décorations, des places honorifiques! Un seul principe: le service humble. Pour parler de ceux qui ont un rdéle particulier, on parlera de « ministéres»: ce mot signifie « serviteur» en latin! Il n’y a pas*de-«chefs» au sens du monde, dans l’Eglise. Il n’y a que des « ministres », des « serviteurs ».", "page": 285, "kind": "p"}, {"id": "r53p32", "text": "Car le Fils de Phomme r’est pas venu pour étre servi, mais pour servir et donner sa vie en rancon pour la multitude.", "page": 285, "kind": "h"}, {"id": "r53p33", "text": "La raison fondamentale de cette « Constitution» originale de lEglise, c’est qu’elle doit, tout simplement, imiter Jésus. Remarquons le sens éminemment positif que Jésus donne a sa mort. Dans sa conscience, il ne lenvisage pas de maniére doloriste : le chemin de la croix, pour Lui, ce n’est pas d’abord «souffrir», c’est «servir»! Malgré les pleins pouvoirs dont il disposait comme Fils de Dieu, Jésus ne sest pas comporté en « dominateur», mais en « serviteur ». Il n’a pas joué au « seigneur», mais au « domestique» (Jean 13/13), en faisant humblement le « service de table » le jeudi saint au soir. C’est ainsi que les parents chrétiens devront étre vis-a-vis de leurs enfants, c’est ainsi que les responsables devront étre vis-a-vis de leurs subordonnés. Prendronsnous au sérieux invitation de Jésus? Ne pas faire l'examen de conscience des autres! Qui ai-je tendance a «dominer» ? Qui dois-je «aimer», qui dois-je « servir» ?", "page": 285, "kind": "p"}]}, {"id": 54, "title": "30e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 286, "ref": "Marc 10/46.52", "paragraphs": [{"id": "r54p1", "text": "Jéricho...", "page": 286, "kind": "h"}, {"id": "r54p2", "text": "Au point de vue historique, une des villes les plus célébres du monde. La plus « basse » du monde: dans une dépression, le Ghor, a 250 métres au-dessous du niveau de la mer! Proche de la mer Morte, au paysage désolé oti régne la mort, c’est une belle tache verte de palmiers, une oasis. C’est aussi la ville la plus «vieille» du monde, selon les archéologues: déja habitée en 7800 avant Jésus-Christ, avec des restes de fortifications de 7000 avant JésusChrist! Abraham est plus proche de nous qu'il ne l’était de cette premiére ville déja tres ancienne en son temps.", "page": 286, "kind": "p"}, {"id": "r54p3", "text": "Au point de vue biblique, Jéricho est le symbole de «l’entrée en Terre Promise», juste aprés avoir franchi le Jourdain. C’était, pour les pélerins montant 4 Jérusalem pour la Paque, la derniére étape, a 35 km de la capitale, pour les caravanes de Galilée empruntant la route du Jourdain. N’oublions pas que, pour Jésus aussi, c’est «le chemin» qui méne a Jérusalem. Demain (Marc 11/1), il entrera dans la ville pour le fragile triomphe des rameaux, pour le dernier repas de la Céne, pour la Passion, et pour la Résurrection.", "page": 286, "kind": "p"}, {"id": "r54p4", "text": "« Jéricho», en hébreu, signifie « ville de la lune», en souvenir sans doute d’un trés vieux culte du dieu de la nuit! C’est la que Jésus va faire son dernier « signe»: il va vaincre la nuit oti était enfermé un pauvre aveugle. Jésus, notre lumiére! Jésus, lumiére en notre nuit!", "page": 286, "kind": "p"}, {"id": "r54p5", "text": "Tandis que Jésus sortait de Jéricho, avec ses disciples et une foule nombreuse...", "page": 286, "kind": "h"}, {"id": "r54p6", "text": "Dans les jours qui ont précédé, selon le récit de Marc (chapitres 8 a 10), ces mémes disciples ont montré quills étaient totalement «aveugles» sur le véritable destin de Jésus: ils en sont encore a réver d’honneurs et de réussite humaine (Marc 10/37), alors que, Lui, leur a annoncé par trois fois sa croix (Marc 8/31 - 9/31 - 10/34). Les lectures de ces six derniers dimanches nous ont manifesté lincompréhension des disciples, et le caractére totalement « impossible» humainement de « marcher 4 la suite» de Jésus: il faut «perdre sa vie» (8/35)... il faut se faire «le dernier» (9/35)... il faut « s'arracher les yeux, les mains et les pieds » pour ne pas pécher (9/47)... il faut tenir une « fidélité conjugale» méme héroique (10/9)... il faut « vendre ses biens et les donner aux pauvres» (10/21)..-il faut « boire la coupe et recevoir le baptéme» ot est plongé Jésus, et se faire «le serviteur de tous» (10/38.44). Non! Seigneur, ce n’est pas possible! Il est radicalement impossible a P-homme, fat-il ton disciple, de « Te suivre» par ses seules forces humaines.", "page": 287, "kind": "p"}, {"id": "r54p7", "text": "Un mendiant aveugle, Bartimée, le fils de Timée, était assis au bord de la route.", "page": 287, "kind": "h"}, {"id": "r54p8", "text": "Dans les pays pauvres d’Orient, les aveugles sont nombreux. Avant l’invention de la méthode de lecture Braille, ou laveugle apprend 4 lire avec ses doigts, les aveugles étaient réduits 4 la mendicité, a l’immobilité. Dans la symbolique biblique, l’aveugle est «l’ic6ne» méme de la « pauvreté », de ’homme laissé a ses seules forces: regarde cette image! C’est le portrait de homme, de toi! Les yeux dans la nuit, la main tendue, assis... Aveugle, incapable de marcher, tragiquement «dépendant» des autres... Mais c’est, paradoxalement, ce « mendiant-aveugle-assis » qui va devenir notre modéle a tous, le modéle pour les disciples qui «croient voir» (Jean 10/39.40).", "page": 287, "kind": "p"}, {"id": "r54p9", "text": "Il s'appelait Bartimée. Seul Marc a noté son nom. II est vraisemblable que ce Bartimée faisait partie de la communauté des premiers chrétiens au moment ot Marc écrivait son récit. C’était un homme qu’on connaissait : le miraculé de Jésus. Sais-tu, toi, que Dieu connait ton nom, et quill t'aime d’un amour personnel, non anonyme ?", "page": 287, "kind": "p"}, {"id": "r54p10", "text": "Apprenant que c’était Jésus de Nazareth, il se mit a Crier.", "page": 288, "kind": "h"}, {"id": "r54p11", "text": "Marc, selon son habitude, est concret. Nous allons assister a un «court-métrage» d’une extréme vivacité, ot tous les détails sont a la fois trés finement observés, et hautement symboliques. L’aveugle, nous le savons, a un sens de louie trés développé. Il a appris, par ses oreilles, existence de Jésus «le nazarénien». Assis sur son talus, a la porte de Jéricho, il entend la rumeur d’un groupe qui passe devant lui, sur le chemin. On lui dit que c’est Jésus.", "page": 288, "kind": "p"}, {"id": "r54p12", "text": "«Je n’ai jamais vu Son visage,", "page": 288, "kind": "p"}, {"id": "r54p13", "text": "mais ceux qui Le connaissent", "page": 288, "kind": "p"}, {"id": "r54p14", "text": "mont parlé de Lui.", "page": 288, "kind": "p"}, {"id": "r54p15", "text": "Depuis ce jour, fespére Son passage.", "page": 288, "kind": "p"}, {"id": "r54p16", "text": "et jentends qu’ll vient, AUJOURD’HUI. »", "page": 288, "kind": "p"}, {"id": "r54p17", "text": "Nous aussi, nous sommes exactement dans la situation de cet aveugle : nous n’avons jamais vu le visage de Jésus. Par la Foi, nous avons cru au témoignage de ceux qui lont connu, et nous attendons ce «passage» de Jésus « qui vient»: nous le verrons un jour!", "page": 288, "kind": "p"}, {"id": "r54p18", "text": "Il se mit a crier: « Jésus, fils de David, aie pitié de moi!»", "page": 288, "kind": "h"}, {"id": "r54p19", "text": "Du fond de sa nuit, un espoir fou s’est levé. Alors il hurle, il crie sa priére. « Aie pitié». Tel est son cri. « Kyrie eleison» en grec. Une longue tradition de l'Eglise d’Orient a appris aux moines de Gréce, de Russie, du Liban, de Syrie, d’Egypte, de Cappadoce, du Désert... a se sanctifier tout simplement par ce quiils appellent «la priére a Jésus», et qui consiste en une inlassable répétition des deux mots: «Jésus, prends-pitié... Jésus, prends-pitié... Jésus, prendspitié... Jésus, prends-pitié...» Dans le texte de Marc, en grec: «Jésou, éléison... Jésou éléison... Jésou, éléison... Jésou, éléison...»", "page": 288, "kind": "p"}, {"id": "r54p20", "text": "Le premier mot se prononce sur I’inspiration, et le second sur Pexpiration, de fagon a rythmer corporellement une priére qui veut pénétrer toute la vie. Pendant des heures daffilée, on peut ainsi « respirer» avec Jésus dans la poitrine: grande priére de simplicité que nous transmet Orient. Il n’est pas nécessaire d’aller 4 Katmandou pour vivre de l’Esprit, qui souffle ot il veut. Les techniques admirables du Yoga sont, équivalemment, a la disposition des plus simples gens: apprenons a prier avec notre souffle.", "page": 288, "kind": "p"}, {"id": "r54p21", "text": "«Fils de David!» Ce sera, demain, a Jérusalem, l’acclamation des foules portant leurs rameaux de triomphe (Marc 11/10). Le «secret messianique» nest plus nécessaire. Maintenant que la mort du «roi» descendant de David est proche, toute ambiguité politique est écartée. Le Messie était attendu comme «celui qui devait rétablir la royauté en Israél». Comme Jésus «monte a Jérusalem», ‘tout le monde pense qu'il y va pour «prendre le pouvoir». Il est «roi», mais pas a la maniére des nations (Marc 10/42; Matthieu 27/11; Jean 18/33:36).Sa couronne est d’épines. Le Fils de David, né a Bethléem comme son ancétre, va régner a Jérusalem comme son ancétre! Mais pas comme les foules lattendent. Il sera le premier en étant le dernier, lesclave !", "page": 289, "kind": "p"}, {"id": "r54p22", "text": "Beaucoup de gens Ilinterpellaient vivement pour le faire taire, mais il criait de plus belle: « Fils de David, aie pitié de moi!»", "page": 289, "kind": "h"}, {"id": "r54p23", "text": "Il se trouve toujours des gens pour essayer de faire taire le pauvre...", "page": 289, "kind": "p"}, {"id": "r54p24", "text": "Il y a toujours des catégories qui ont de la peine a se faire entendre: immigrés, marginaux, handicapés, victimes de toutes sortes. Le «cri» de Bartimée résonne encore.", "page": 289, "kind": "p"}, {"id": "r54p25", "text": "Jésus sarréte et dit: « Appelez-le. »", "page": 289, "kind": "h"}, {"id": "r54p26", "text": "Un détail apparemment. Ne passons pas 4 cété sans comprendre sa signification. Jésus met ses «disciples» au service des petits. Jésus « fait transmettre» son appel par ses disciples. Dieu a besoin des hommes. Oui, Dieu s’adresse a Phumanité par le moyen de son Eglise... et Elise, c’est nous. Sommes-nous attentifs aux cris qui montent autour de nous ? Répercutons-nous a nos fréres lappel de Jésus? pour les conduire au seul sauveur? On discute, et on rediscute sur le « rdle de l'Eglise»: le voila! Ecoute les cris du monde. Appelle-le au nom de Jésus.", "page": 289, "kind": "p"}, {"id": "r54p27", "text": "On appelle donc l’aveugle, et on lui dit: « Confiance, léve-toi, Il t’appelle. »", "page": 290, "kind": "h"}, {"id": "r54p28", "text": "Il y a, ici, en grec le fameux mot «technique»: « léve-toi», « égeiré », qu’on devrait plutét traduire par « éveille-toi», ou «ressuscite!» (Marc 2/9.11 - 3/3 - 5/41 - 9/27 - 10/49). Tel est le message de lEglise, au nom de Jésus.", "page": 290, "kind": "p"}, {"id": "r54p29", "text": "L’aveugle jeta son manteau, bondit, et courut vers Jésus.", "page": 290, "kind": "h"}, {"id": "r54p30", "text": "Dans le langage biblique, le « manteau» est le symbole de la puissance de homme (I Samuel 18/4 -24/6 ; 2 Rois 2/14; Ruth 3/9). Le contact du manteau de Jésus assurait la guérison (Marc 5/27 - 6/56). L’abandon de son manteau par cet aveugle symbolise une sorte de « coupure avec son passé». Au temps de Marc, le nouveau baptisé quittait son manteau pour revétir le nouveau vétement du baptéme.", "page": 290, "kind": "p"}, {"id": "r54p31", "text": "Jésus lui dit: « Que veux-tu que je fasse pour toi?»", "page": 290, "kind": "h"}, {"id": "r54p32", "text": "Question étrange, si l'on reste a la superficie du récit. Jésus sait trés bien ce qu’attend de lui cet aveugle. Mais la scéne est baptismale de bout en bout: il faut que le candidat a P «illumination» fasse sa « profession de foi» personnelle.", "page": 290, "kind": "p"}, {"id": "r54p33", "text": "« Rabbouni, que je voie.»", "page": 290, "kind": "h"}, {"id": "r54p34", "text": "Le baptéme, au temps de Marc, était appelé «|Tllumination». C’était le sacrement de l’ouverture des yeux. Seigneur, fais que je voie! Ouvre mes yeux, Seigneur! .", "page": 290, "kind": "p"}, {"id": "r54p35", "text": "Et Jésus lui dit: «Va, ta Foi t’a sauvé.» Aussit6t rhomme se mit a voir, et il suivait Jésus sur la route.", "page": 290, "kind": "h"}, {"id": "r54p36", "text": "Le baptéme, c’est le passage des ténébres a la lumiére... Cest le salut: ce qui était «impossible » 4 ’homme laissé & ses seules forces, devient possible... Et c’est «se mettre a suivre Jésus»... « Alors leurs yeux s’ouvrirent», dira Luc a propos des pélerins d’Emmaiis. Et oui, ils étaient aveugles, méme avec les yeux ouverts.", "page": 290, "kind": "p"}, {"id": "r54p37", "text": "Bartimée, lui, se souviendra toujours de ce «premier visage» qu’il vit quand ses yeux s’ouvrirent. Quand nos yeux s’ouvriront-ils, Seigneur? Viens, Seigneur Jésus.", "page": 290, "kind": "p"}]}, {"id": 55, "title": "31e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 291, "ref": "Marc 12/28.34", "paragraphs": [{"id": "r55p1", "text": "Un scribe s’avancga vers Jésus et lui demanda...", "page": 291, "kind": "h"}, {"id": "r55p2", "text": "Jésus questionné. Jésus abordé dans la rue. Est-ce que je sais assez questionner Jésus, lui demander son avis sur des choses importantes de ma vie?", "page": 291, "kind": "p"}, {"id": "r55p3", "text": "Nous avions laissé, dans l’évangile de dimanche dernier, Jésus a Jéricho avec le sympathique aveugle mendiant Bartimée. Depuis, Jésus est entré triomphalement a Jérusalem (Marc 11/1.11). Le lendemain méme, nous dit saint Marc, Jésus est entré dans le Temple pour chasser ceux qui le détournaient de son réle de priére « pour toutes les nations» (Marc 11/12.19). Le surlendemain, Jésus revient 4 Jérusalem, et dans la « parabole en acte» du figuier desséché, il dit que le « Fils» est venu chercher des fruits et quill ne les a pas trouvés: le Temple, comme ce figuier, va étre détruit (Marc 11/20.25). Nous sommes donc bien dans les derniéres semaines de Jésus. L’affrontement avec les autorités est A son comble. Selon Marc, c’est donc dans le Temple de Jérusalem, en plein public, sur cette vaste esplanade sacrée qui forme une sorte de place publique entourée de colonnades oti se réunissent les foules, que Jésus «discute», «est attaqué», «attaque»... Des controverses violentes s’élévent. Le ton monte entre Jésus et les chefs officiels, qu’il provoque. Les sujets les plus brdlants sont abordés: « Par quelle autorité fais-tu ce que tu fais?» (Marc 11/27.33). — «Que va faire le maitre d’une vigne dont les vignerons sont indignes de leur réle?» (Marc 12/1.12). — «Faut-il payer imp6t aux armées d’occupation?» (Marc 12/13.17). — « Quel est le sort des morts dans l’au-delA?» (Mare 12/18.27).", "page": 291, "kind": "p"}, {"id": "r55p4", "text": "C’est dans ce contexte, qu’un scribe pharisien, ayant apprécié la réponse de Jésus sur la résurrection des morts (les Sadducéens, ses adversaires, venaient de recevoir une bonne lecon!) s’approche de Jésus et le questionne a son tour.", "page": 292, "kind": "p"}, {"id": "r55p5", "text": "Avons-nous tendance a «enfermer» notre vie religieuse dans le «privé», dans le «cultuel»? Ou bien, comme Jésus, acceptons-nous qu’elle éclaire tous les problémes de la vie, de la rue, de la profession, de la politique ?", "page": 292, "kind": "p"}, {"id": "r55p6", "text": "« Quel est le premier de tous les ”commandements” ? »", "page": 292, "kind": "h"}, {"id": "r55p7", "text": "La passion d'Israél, c’est la Loi, la Thorah. Dans les Yéshivot, « écoles de la foi», on voit des enfants, des jeunes, des adultes, des vieillards, qui passent des heures a « étudier» la Bible et ses Commentaires dans le Talmud. Les scribes du temps de Jésus, les rabbins d’aujourd’hui, sont ces spécialistes 4 qui l'on vient demander une interprétation, un conseil spirituel, une régle de vie tirée de la Parole de Dieu, la Thorah. Et puis, dans les Yéshivot, on discute, on « partage», comme on dit aujourd’hui. Chaque Sabbat est un long jour de priére et de cercles d’étude, ot l'on cherche ensemble, passionnément, une compréhension plus profonde des «commandements» de Dieu, pour essayer d’y étre plus méticuleusement fidéle. Jésus a vécu, dans le contexte culturel de son peuple, cette passion pour la Loi. Il la savait par coeur. Il avait lue et relue, avec d'autres, depuis son adolescence. Il en avait discuté, et rediscuté. Avons-nous, nous les chrétiens, cette méme passion du . Livre ? Sommes-nous avides de lire l’Ecriture ? Quel temps passons-nous, dans une semaine, a «étudier» sérieusement, et a prier, sur la Parole de Dieu? En discutons-nous avec d’autres, pour nous éclairer les uns les autres?", "page": 292, "kind": "p"}, {"id": "r55p8", "text": "La question posée par le scribe, a Jésus, était une question classique dans les Yéshivot. On avait relevé, dans la Bible, 613 commandements de Dieu: 365 défenses... et 248 commandements positifs... Ne rions pas! La fidélité jusque dans les plus petits détails est une preuve d’amour. Qui aime comprend. Mais les juifs avaient parfaitement le sens, intelligent, de limportance relative de ces divers commandements. Et ils avaient méme trouvé, dans leur Bible, des éléments de réponse. Pour David, la Thorah se résumait en onze prescriptions majeures (Psaume 15). Pour Isaie, six (Isaie 33/15). Pour Michée, trois (Michée 6/8). Pour Amos, deux (Amos 5/4). Et pour Habacuq, un seul commandement (Habacuq 2/4). Rabbi Hillel, lui, résumait toute la Loi dans cet unique aphorisme : « Ce que tu n’aimes pas, ne le fais pas 4 ton prochain.» Rabbi Akiba, presque a l’époque de Jésus, concentrait lui aussi l’essentiel de la Loi dans amour du prochain.", "page": 292, "kind": "p"}, {"id": "r55p9", "text": "Et toi, Rabbi Jésus, qu’en penses-tu? Quel est le premier commandement ?", "page": 293, "kind": "p"}, {"id": "r55p10", "text": "Jésus fit cette réponse: « Voici le premier: Ecoute... Israél : le Seigneur notre Dieu est unique Seigneur... »", "page": 293, "kind": "h"}, {"id": "r55p11", "text": "« Dieu premier servi!» La priorité, pour Jésus, c’est Dieu! Et moi? Quelles sont mes priorités. Est-ce que je mets Dieu en premier dans ma vie?", "page": 293, "kind": "p"}, {"id": "r55p12", "text": "Heureux ceux qui écoutent la Parole éternelle!", "page": 293, "kind": "p"}, {"id": "r55p13", "text": "«Ecoute, Israél!» Voici une source de la spiritualité de Jésus. Il est bien de son peuple, de ce peuple avide de la Parole, de ce peuple qui d’abord « écoute»! de ce peuple qui se laisse instruire par Dieu.", "page": 293, "kind": "p"}, {"id": "r55p14", "text": "Ce que cite Jésus, c’est le « Shema» Israé] (Deutéronome 6/4.5), la priére quotidienne de tout juif fidéle. C’est laffirmation principale de la foi juive: le monothéisme, qui est devenu depuis l’héritage commun d'sraél, des chrétiens, et des musulmans. II est d’ailleurs dommage, une fois de plus, que les traducteurs francais aient été infidéles et au texte grec de saint Marc, et au texte hébreu. Marc ne dit pas: « Dieu est unique Seigneur»... il dit, tout simplement, et avec une force inouie: « Dieu est un!». Les Bibles juives traduisent, quant 4 elles: « L’Eternel est un!». Il y a plus qu’une nuance. Le mot «un» posséde une plénitude de sens que n’a pas le mot « unique». Sentez-vous cette différence? Dieu est «un»! Il n’y a rien d’autre que Lui! Le reste n’existe que par Lui! Et Il est parfaitement « unifié », il posséde son Etre... alors que, pour nous, notre étre «s’écoule», nous fond dans les mains. L’Eternel... est... un! Telle est, dabord, la réponse de Jésus, quand on lui demande ce qui est important pour lui. Dans sa bouche, lancienne Loi prend une vie nouvelle!", "page": 293, "kind": "p"}, {"id": "r55p15", "text": "Tu aimeras le Seigneur ton Dieu de tout ton coeur, de toute ton ame, de tout ton esprit, et de toute ta force...", "page": 294, "kind": "h"}, {"id": "r55p16", "text": "Ce grand Dieu! Ce n’est pas si spontanément que cela qu’on penserait a l’'aimer. Le Dieu de la philosophie et des autres religions appelle plut6t ladoration, leffroi sacré, Pobéissance. Pour Israél, comme pour Jésus, ce que Dieu attend c’est «amour»! L’originalité de la Bible, c’est de faire de homme le « partenaire amoureux d’une alliance d’amour » : c’est Dieu qui lui en a donné la capacité, en «le faisant semblable a Lui», qui est Amour! (I Jean 4/8).", "page": 294, "kind": "p"}, {"id": "r55p17", "text": "Est-ce que jaime Dieu? Nvallons pas trop vite répondre oui. Soyons modestes quand nous jugeons parfois les autres. Que fais-tu pour «celui que tu aimes» ? si c’est vrai que tu l’aimes. Est-ce bien vrai que tu aimes Dieu « de tout ton coeur, de toute ton ame, de tout ton esprit, de toute ta force.» Cette accumulation de répétitions veut évidemment exprimer l’intensité et la totalité de cet amour qui doit mobiliser et investir toutes nos facultés, et toutes nos énergies vitales.", "page": 294, "kind": "p"}, {"id": "r55p18", "text": "Seigneur, fais que ton amour me brie de la téte aux pieds, de lesprit jusqu’au corps, du matin au soir, de ’enfance a la vieillesse, de ma vie la plus intime jusqu’a mes responsabilités les plus collectives.", "page": 294, "kind": "p"}, {"id": "r55p19", "text": "Voici le second...", "page": 294, "kind": "h"}, {"id": "r55p20", "text": "On reconnait bien Jésus, la!", "page": 294, "kind": "p"}, {"id": "r55p21", "text": "Le scribe ne demandait qu’un commandement. Sans que son interlocuteur le lui ait demandé, Jésus, selon son habitude..., va plus loin. 4,", "page": 294, "kind": "p"}, {"id": "r55p22", "text": "N’oublions pas ce que nous venons d’entendre de Jésus. Ce qu'il va dire maintenant est important... mais vient «en seconde position»: Dieu devant!", "page": 294, "kind": "p"}, {"id": "r55p23", "text": "Tu aimeras ton prochain comme toi-méme...", "page": 294, "kind": "h"}, {"id": "r55p24", "text": "Il faut tenir € ces «deux» commandements distincts. On a eu trop tendance a les fusionner, comme si «aimer Dieu» pouvait suffire... comme si «aimer le prochain» pouvait suffire... Le «second» commandement ne remplace pas le « premier». C’est se moquer de Jésus que de le séculariser, den faire un prédicateur social, un moralisateur de la fraternité: bien d’autres grands hommes ont dit cela.", "page": 294, "kind": "p"}, {"id": "r55p25", "text": "Il n’y a pas de commandement plus grand que ceux-la!", "page": 295, "kind": "h"}, {"id": "r55p26", "text": "Voici une pensée d’une extréme finesse. Remarquez le singulier : «commandement» au singulier, comme s'il n’y en avait qu’un! Mais « ceux-la» au pluriel, car ils sont deux de méme importance!", "page": 295, "kind": "p"}, {"id": "r55p27", "text": "Le scribe reprit: « Fort bien, Maitre, tu as raison... Aimer Unique... aimer son prochain vaut mieux que toutes les offrandes et tous les sacrifices.", "page": 295, "kind": "h"}, {"id": "r55p28", "text": "Jésus, voyant qu'il avait fait une remarque judicieuse, lui dit: « Tu n’es pas loin du Royaume de Dieu.»", "page": 295, "kind": "h"}, {"id": "r55p29", "text": "Le «Royaume de Dieu», longuement préparé par les siécles de histoire, de la culture et de la piété d'sraél... est maintenant arrivé : c’est Jésus en personne. Le scribe dsraél va-t-il faire ce dernier pas ? Dans quelques jours, il suffira que Jésus rajoute deux mots («comme moi») pour donner aux commandements de l'amour toute leur dimension du Royaume ancien et nouveau: «aimez comme jai aimé!» (Jean 15/12). Dans le coeur de Jésus, il y a deux amours: le second découle du premier.", "page": 295, "kind": "p"}]}, {"id": 56, "title": "32e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 296, "ref": "Marc 12/38.44", "paragraphs": [{"id": "r56p1", "text": "Jésus disait: « Méfiez-vous des scribes...»", "page": 296, "kind": "h"}, {"id": "r56p2", "text": "Les «scribes» étaient les spécialistes et les interprétes officiels des saintes Ecritures. Au terme de longues études, vers l’ge de 40 ans, ils étaient consacrés dans leur rdle et devenaient des conseillers officiels dans les décisions juridiques. Ni Jésus, ni les apétres n’avaient recu cette savante formation.", "page": 296, "kind": "p"}, {"id": "r56p3", "text": "Les «scribes», depuis le début, n’ont jamais cessé de s’opposer a Jésus. Rien que dans l’évangile dé Marc, les conflits ont été nombreux (Marc 2/6 -3/22-7/1-11/18). Ici, Jésus fait une sévére mise en garde. C’est sa derniére prise de parole publique avant la Passion, 4 quelques semaines de sa condamnation par ce Sanhédrin ow ils siégent en maitres. Matthieu, lui, a groupé tout un discours de Jésus sur ce méme theme: « Malheur a vous, scribes!» (Matthieu 23). La science ne donne pas forcément la vertu... y compris la science religieuse, hélas!", "page": 296, "kind": "p"}, {"id": "r56p4", "text": "Ils tiennent a4 sortir en robes solennelles... ils aiment les salutations sur les places publiques, les premiers rangs dans les synagogues et les places d’honneur dans les diners...", "page": 296, "kind": "h"}, {"id": "r56p5", "text": "Il y a des chrétiens qui se scandalisent encore des efforts de l'Eglise contemporaine pour se dépouiller de tout apparat. Il faut pourtant reconnaitre que cet effort, encore inachevé, correspond parfaitement 4 une exigence de Jésus. L’Eglise de tous les temps risque de tomber dans la tentation terrible du prestige, des privileges, des «robes solennelles», des titres et des places d’honneur.", "page": 296, "kind": "p"}, {"id": "r56p6", "text": "Habitue-nous, Seigneur, de plus en plus, a une Eglise dépouillée d’honneurs et pauvre, a des prétres-commetout-le-monde... sans droits particuliers.", "page": 297, "kind": "p"}, {"id": "r56p7", "text": "Le pharisaisme que Jésus condamne, c’est l'utilisation de «signes extérieurs» pour s/attirer estime des autres, et avoir des passe-droits. Il existe aujourd’hui un néopharisaisme aussi mensonger, qui consiste a se faire valoir en affectant de se montrer «a la page», «dans le vent», en adoptant les « positions les plus avancées», méme si elles sont creuses!", "page": 297, "kind": "p"}, {"id": "r56p8", "text": "Ils dévorent les biens des veuves, et affectent de prier longuement...", "page": 297, "kind": "h"}, {"id": "r56p9", "text": "Ce que Jésus reproche aux scribes de son temps, c’est donc leur « vanité», leur «cupidité», et leur « hypocrisie». Ils devaient demander des « honoraires» exorbitant 4 ceux qui venaient les consulter... attitude d’autant plus grave pour des gens considérés comme pieux, qui priaient longuement. Celui qui prétend proclamer les exigences de la Parole de Dieu doit aussi étre trés exigeant pour lui-méme. Quand les chrétiens, ou lEglise hiérarchique, font des injustices d’ordre social, c’est spécialement grave. Dieu entend le cri des pauvres et des malheureux, il «fait justice aux opprimés, il soutient la veuve et l’orphelin» (Psaume 145). Celui qui prétend étre du cété de Dieu, par la priére, doit étre spécialement intégre et juste.", "page": 297, "kind": "p"}, {"id": "r56p10", "text": "Ils seront d’autant plus sévérement condamnés.", "page": 297, "kind": "h"}, {"id": "r56p11", "text": "La communauté du Christ, ’Eglise, doit entendre cet avertissement: on sera d’autant plus exigeant envers nous que nous aurons plus recu. On ne peut pas tromper Dieu! Dieu voit le fond des étres... et nos hypocrisies sont 4 nu devant Lui.", "page": 297, "kind": "p"}, {"id": "r56p12", "text": "Jésus s’était assis dans le Temple, en face de la salle du Trésor et regardait la foule déposer de l’argent dans le tronc.", "page": 297, "kind": "h"}, {"id": "r56p13", "text": "Marc est un excellent cinéaste. Godtons la précision du reportage. Jésus a choisi un bon poste d’observation: il est assis sur les marches, face aux troncs... il regarde. La foule des pélerins défile devant lui. Nous notons ’humanité de Jésus. Remarquons son attention aux foules, son intérét a ce qui se passe autour de lui.", "page": 297, "kind": "p"}, {"id": "r56p14", "text": "Savons-nous faire attention? Savons-nous regarder ?", "page": 298, "kind": "p"}, {"id": "r56p15", "text": "Beaucoup de gens riches y mettaient de grosses sommes.", "page": 298, "kind": "h"}, {"id": "r56p16", "text": "Au temps de Jésus, comme aujourd’hui, il y avait des classes sociales avec des revenus fort inégaux. Les propriétaires, les commercants, les hommes de loi, le haut-clergé, étaient riches, et possédaient 4 Jérusalem de véritables Palais, avec tout le confort et le luxe: nombreux appartements, piscines, jardins, colonnades de marbre... dans le quartier des notables, le beau quartier! Les pauvres, eux, vivaient au jour le jour, et habitaient le «bas quartier» de Jérusalem.", "page": 298, "kind": "p"}, {"id": "r56p17", "text": "Si nous sommes attentifs au texte de Marc, nous remarquons que «certains» riches... «beaucoup», dit-il, donnaient de « grosses sommes»! Ils sacquittent donc de leurs devoirs envers le Temple. Marc, ici, ne -critique pas. Il ne peut pas cependant s’empécher de faire une comparaison.", "page": 298, "kind": "p"}, {"id": "r56p18", "text": "Une pauvre veuve s’avanca...", "page": 298, "kind": "h"}, {"id": "r56p19", "text": "Voici que la caméra du cinéaste nous offre un gros plan: «La femme pauvre s’avancait,", "page": 298, "kind": "p"}, {"id": "r56p20", "text": "humble visage parmi d’autres,", "page": 298, "kind": "p"}, {"id": "r56p21", "text": "sans place d’honneur, sans renom,", "page": 298, "kind": "p"}, {"id": "r56p22", "text": "une inconnue...)", "page": 298, "kind": "p"}, {"id": "r56p23", "text": "Une femme, dans ce monde ot ’homme domine. Une veuve, dans ce monde ow seul homme a des droits reconnus. ee pauvresse, sans revenus. Le regard de Jésus est sur elle.", "page": 298, "kind": "p"}, {"id": "r56p24", "text": "Et elle déposa deux piécettes...", "page": 298, "kind": "h"}, {"id": "r56p25", "text": "Quel contraste avec les « grosses sommes» des autres!", "page": 298, "kind": "p"}, {"id": "r56p26", "text": "Je veux contempler ces deux petites piéces de monnaies, ces « piécettes», cachées dans le creux de sa main.", "page": 298, "kind": "p"}, {"id": "r56p27", "text": "Jésus s’adressa a ses disciples: « Amen, je vous le dis: cette pauvre veuve a mis dans le tronc plus que tout le monde.»", "page": 298, "kind": "h"}, {"id": "r56p28", "text": "Curieuse fagon de compter! Elle a donné « plus» que tout le monde, dit Jésus. Jésus bouscule la hiérarchie de notre société. Il se moque de nos classifications, de nos «classes» sociales, avec leurs marches soigneusement étagées, et qu’on gravit en faisant une « promotion». Etre «en haut» de l’échelle sociale, étre riche, étre considéré, « porter des robes solennelles », « étre salué sur les places publiques», « avoir les places d’honneurs dans les diners»... tout cela nintéresse pas Jésus!", "page": 299, "kind": "p"}, {"id": "r56p29", "text": "Et nous ?", "page": 299, "kind": "p"}, {"id": "r56p30", "text": "Quelle est notre réaction devant cet évangile? Il nous dérange, il nous agace? Il nous laisse bien tranquille, avec un petit haussement d’épaule ?", "page": 299, "kind": "p"}, {"id": "r56p31", "text": "Dans notre société d’abondance, quelle est notre attitude envers certains métiers « réservés» aux pauvres? N’y a-t-il pas des gens que je méprise a cause de leur race, de leur milieu social, de leur profession, de leur pauvreté ?", "page": 299, "kind": "p"}, {"id": "r56p32", "text": "Car tous, ils ont pris sur leur « superflu», mais, elle, elle a pris sur son « indigence».", "page": 299, "kind": "h"}, {"id": "r56p33", "text": "On ne jette pas de la poudre aux yeux de Dieu! Il voit le fond des cceurs. Elle a mis plus, parce qu’elle a tout mis. Pour savoir la valeur d’un don, il ne faut pas regarder ce qui est donné, mais ce qui reste a celui qui donne! Ainsi regarde Dieu: il voit, lui, ce qui reste dans le coffre-fort ou le Compte en banque.", "page": 299, "kind": "p"}, {"id": "r56p34", "text": "Il me faut méditer sur ces deux mots employés par Jésus. Notions simples. L’ « indigence» : c’est Pétat de celui qui n’a pas ce quill faut pour vivre...", "page": 299, "kind": "p"}, {"id": "r56p35", "text": "Le « nécessaire » : avoir le nécessaire, c’est avoir ce qui correspond a une vie normale... le « superflu»: c’est tout ce qu’on a en plus de ce «nécessaire»...", "page": 299, "kind": "p"}, {"id": "r56p36", "text": "Bien sir, ce ne sont pas des valeurs arithmétiques fixes. Ot sarréte le «nécessaire»? Ot. commence le «superflu» ? Mais, avec toutes les nuances utiles, nous sommes bien obligés de reconnaitre qu’ll y a trop de différences entre les conditions des hommes dans un méme pays, et surtout, d’un pays a l'autre. Avec le contenu de ce qui est jeté dans les poubelles de New York, on ferait vivre une ville équivalente dans le Tiers Monde! Nos gaspillages crient vers Dieu, a la face des pauvres. Jésus osait dire que certains, de son temps, avaient du « superflu»... et aujourhui, que dirait-il ?", "page": 299, "kind": "p"}, {"id": "r56p37", "text": "Elle a tout donné, tout ce quelle avait pour vivre.", "page": 300, "kind": "h"}, {"id": "r56p38", "text": "Jésus ne voit pas les mémes choses que nous. Il était, luiméme, un pauvre.", "page": 300, "kind": "p"}, {"id": "r56p39", "text": "«Le Fils de ’homme regardait,", "page": 300, "kind": "p"}, {"id": "r56p40", "text": "et vit le coeur qui donnait tout.", "page": 300, "kind": "p"}, {"id": "r56p41", "text": "Sur les pauvres, les yeux du Seigneur,", "page": 300, "kind": "p"}, {"id": "r56p42", "text": "Ils font la joie de leur Dieu! »", "page": 300, "kind": "p"}, {"id": "r56p43", "text": "Jésus a fait ’éloge de cette pauvre veuve aux deux piécettes. Au fait, Seigneur, que penses-tu de ma générosité a moi? Est-ce que je « donne» ? Combien? Comment ? Nous dirions facilement, aujourd’hui, que cette femme avait de bonnes raisons valables de garder son argent, et de laisser les autres «donner». «Heureusement pour les pauvres qu’ y a les pauvres», disait Monsieur Vincent, « eux savent donner».", "page": 300, "kind": "p"}, {"id": "r56p44", "text": "Juste avant que ne commence la Passion de Jésus, il nous donne comme un secret de cette mort qui approche: cette femme est I’«ic6ne» de Dieu... qui donne « tout», tout ce qu’l a pour vivre! « Dieu, de riche qu'il était, s'est fait pauvre pour nous enrichir» ose dire saint Paul (IJ Corinthiens 8/9). L'amour ne calcule pas! Dieu est amour: il n’a pas calculé... il a tout donné. Si lEglise primitive a retenu cet épisode apparemment sans importance, juste avant la Passion, c’est qu’elle s’est dit : oui, en cette femme qui « donne tout», Jésus s’est reconnu...", "page": 300, "kind": "p"}]}, {"id": 57, "title": "33e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 301, "ref": "Marc 13/24.32", "paragraphs": [{"id": "r57p1", "text": "Nous arrivons a la fin de l’année liturgique. Dimanche aprés dimanche, nous-avons suivi Jésus, selon saint Marc. Il a parlé en paraboles, guéri des malades, délivré des possédés, répondu aux scribes, formé ses disciples. Nous pourrions avoir limpression de bien Le connaitre, ce Jésus! Or, ce n’est qu’aujourd’hui qu’ll va nous révéler toute la stature de sa « personne». Il est a quelques jours de sa mort. Il sort du Temple de Jérusalem pour n’y plus jamais revenir. Un de ses disciples lui fait remarquer la beauté de I’édifice: «Maitre, regarde! Quelles belles pierres, quelles belles constructions!» (Marc 13/1). Pour toute réponse, Jésus dit : « Tout sera détruit, il n’en restera pas pierre sur pierre». Alors, Pierre, Jacques, Jean et André lui demandent: «Quand cela arrivera-t-il?». La réponse a cette question, c’est le dernier grand discours de Jésus, appelé souvent « discours eschatologique », ou « dis-cours sur les derniers temps».", "page": 301, "kind": "p"}, {"id": "r57p2", "text": "Le texte lu aujourd’hui est le milieu de ce discours.", "page": 301, "kind": "p"}, {"id": "r57p3", "text": "En ces jours-la, aprés une terrible détresse...", "page": 301, "kind": "h"}, {"id": "r57p4", "text": "Il faut relire le contexte précédent pour comprendre ce mot de «détresse». Comme signes avant-coureurs, avant la ruine du Temple, Jésus a annoncé trois malheurs:", "page": 301, "kind": "p"}, {"id": "r57p5", "text": "1° Des faux-prophétes et des faux-messies qui égareront bien des gens (Marc 13/5.6);", "page": 301, "kind": "p"}, {"id": "r57p6", "text": "2° Des calamités, guerres, tremblements de terre, famines (Marc 13/7.8) ;", "page": 301, "kind": "p"}, {"id": "r57p7", "text": "3° Des persécutions contre les disciples de Jésus (Marc 13/9.13).", "page": 301, "kind": "p"}, {"id": "r57p8", "text": "Alors arrivera la terrible détresse de la destruction du Temple, l’abomination de la désolation (Marc 13/14), prédite par le prophéte (Daniel 9/27). Nous savons, historiquement, que le Temple a été profané et détruit par les armées paiennes de Titus, en l’an 70. N’oublions pas que Marc écrit son récit a peu prés a cette époque, au moment ou tout semble s’écrouler. La persécution de Néron a failli faire disparaitre lEglise naissante : le premier pape, Pierre, a été crucifié la téte en bas... Paul a eu la téte coupée... les chrétiens de Rome ont été briilés vifs dans les jardins du Vatican. Et voila que ce méme Empire Romain détruit le lieu sacré de la Présence divine, le Temple de Jérusalem. L’angoisse des croyants est 4 son comble: notre foi n’estelle pas vaine? Les promesses de Dieu ne seraient-elles qu’un beau réve irréel? Est-ce cela le Régne de Dieu? Dérision... Questions graves, permanentes, actuelles.", "page": 302, "kind": "p"}, {"id": "r57p9", "text": "Le soleil s’obscurcira et la lune perdra son éclat. Les étoiles tomberont du ciel, et les puissances célestes seront ébranlées.", "page": 302, "kind": "h"}, {"id": "r57p10", "text": "Jésus utilise le langage traditionnel des «apocalypses», grandes images stéréotypées, langage symbolique, absolument courant dans la Bible (Isaie 13/10-34/4; Joél 2/10- 4/15 ; Ezékiel 32/7, etc.) Dans les apocalypses de la méme époque, les images étaient encore plus violentes: « Le soleil brillera la nuit, la lune pendant le jour, le sang coulera des arbres, et les pierres pousseront des cris» (4° livre d’Esdras 5/4). Il ne faut pas prendre ces descriptions au sens « matériel» : elles veulent suggérer une réalité indescriptible. C’est le retour au «chaos» primitif: une création nouvelle va en sortir, une genése nouvelle, un monde nouveau. «Le monde ancien s’en est allé, un nouveau monde est déja né», dit saint Paul (2 Corinthiens 5/17).", "page": 302, "kind": "p"}, {"id": "r57p11", "text": "Effectivement, ces images sont trés évocatrices. Jésus nous met devant notre fragilité. Llhomme est toujours tenté de «se faire dieu», et il se gargarise de grands mots: construction du monde... domination de lunivers... conquéte du cosmos... Or, il arrive un jour ou lautre (et les grandes crises mondiales en sont le signe) que tout ce que nous croyions solide, devient soudain ridiculement insignifiant : devant les bouleversements du cosmos ou des civilisations, nous découvrons que nous ne sommes que de minuscules individus. Si nous levons le nez un peu plus haut que le bout de notre horizon terrestre, alors, nous sommes ramenés a notre vraie dimension. Face au soleil, face aux étoiles, que sommes-nous? En quelques phrases, Jésus élargit notre horizon: tant de choses ne dépendent pas de nous, sont hors de notre portée... tant de milliards de soleils, la-haut, sur lesquels nous n’avons aucun pouvoir, nous disent notre petitesse. Dieu seul est capable d’ébranler le monde des étoiles! Essayez, vous!", "page": 302, "kind": "p"}, {"id": "r57p12", "text": "Alors, on verra le Fils de 'homme venir sur les nuées avec grande puissance et grande gloire...", "page": 303, "kind": "h"}, {"id": "r57p13", "text": "Jamais, depuis sa naissance de pauvre dans létable de Bethléem, jusqu’a ce jour, Jésus n’avait parlé ainsi de lui. Tout 4 coup, comme il devient grand, immense, glorieux, sur fond de ciel! Il se dit le Juge de la fin des temps, réle réservé a Dieu. Rien moins que cela. Il le repétera devant ses juges du Sanhédrin, dans quelques jours (Marc 14/62). Jusquici, il nous avait peu a peu habitué a ce titre de Fils de homme, mais toujours dans le contexte de l’annonce de sa « mort» (Marc 8/31 - 9/31 - 10/33 - 10/45). Par ce titre, Jésus reprend 4 son compte la fameuse prophétie de Daniel (7/13.14). CEuvre d’un « résistant» sous la persécution d’Antiochus IV Epiphane, ce livre affirmait la victoire de Dieu, par un «Fils d’homme venant sur les nuées du ciel». Oui, les forces du mal, les persécuteurs des pauvres, les méchants, ne peuvent pas avoir le dernier mot de ‘Thistoire.", "page": 303, "kind": "p"}, {"id": "r57p14", "text": "Tout le langage apocalyptique que nous venons d’entendre nétait donc utilisé que pour faire ressortir ce cri d’espérance: Jésus vient... victorieux! Les sectes de toutes sortes, et les illuminés des temps de grandes crises, ne cessent de nous rebattre les oreilles avec leurs « menaces», leurs « prophéties de malheur» et de «condamnations ». Pour Jésus, la destruction du Temple, symbole de la destruction du monde, est une paradoxale « bonne nouvelle», comme le chante le Tropaire de ce jour:", "page": 303, "kind": "p"}, {"id": "r57p15", "text": "«Le ciel pour nous s’est assombri, plus une étoile dans la nuit.", "page": 303, "kind": "p"}, {"id": "r57p16", "text": "Mais nous savons que vient le jour, il est tout proche son retour.", "page": 304, "kind": "p"}, {"id": "r57p17", "text": "Viens, Seigneur Jésus, oh! Viens, Marana tha! » Les premiers chrétiens ont vécu intensément ce désir du «retour du Seigneur», de sa «Parousie», en grec. On trouve plusieurs fois dans le Nouveau Testament ces mots mystérieux: « Marana tha!» (I Corinthiens 16/22 ; Apocalypse 22/20). C’est une expression araméenne, langue maternelle de Jésus, passée dans la liturgie primitive, et qui signifie justement: « Viens, Seigneur!» Chacune de nos messes, depuis le Concile, nous a restitué cette priére de désir, dans l'acclamation qui suit immédiatement la Consécration: « Nous attendons ta venue dans la Gloire! Nous attendons que tu viennes! Viens, Seigneur Jésus!» Pourquoi, avec les premiers chrétiens, ne le chanterions-nous pas dans la langue méme de Jésus, « Marana tha!»", "page": 304, "kind": "p"}, {"id": "r57p18", "text": "Il enverra ses anges rassembler les élus des quatre coins du monde, de l’extrémité de la terre, jusqu’a Yextrémité du ciel... ;", "page": 304, "kind": "h"}, {"id": "r57p19", "text": "Et dire que certains auteurs contemporains voudraient réduire Jésus de Nazareth a sa seule dimension d’-homme de Nazareth! Il a des « anges», les siens, a sa disposition. Il prétend rassembler «tous» les hommes de la terre entiére... ce petit personnage qui n’aurait jamais sorti de sa petite Palestine!", "page": 304, "kind": "p"}, {"id": "r57p20", "text": "Dans les apocalypses traditionnelles dont Jésus a repris les images, les bouleversements cosmiques servaient a introduire le grand chatiment de Dieu contre les irpies. Il nya rien de tel, ici, dans la bouche de Jésus: il s’agit uniquement du « rassemblement» des élus! La Parousie, la Venue de Jésus en Gloire, la Fin du monde, c’est pour réunir les siens des quatre coins de l’horizon: une immense féte mondiale, universelle. Jésus voit grand, divinement grand... lui qui va mourir dans quelques jours!", "page": 304, "kind": "p"}, {"id": "r57p21", "text": "Etre « avec» Jésus: telle est la fin du monde. Les guerres, les calamités, les persécutions, les génocides, l’abomination de la désolation, la destruction du Temple, la profanation des lieux saints par les impies... c’était donc « cela» que ¢a préparait! Voici bien le plus prodigieux cri d’espérance qu’un homme puisse entendre, méme quand tout s’écroule autour de lui, méme quand la mort approche et semble triompher.", "page": 304, "kind": "p"}, {"id": "r57p22", "text": "Que la comparaison du figuier vous instruise: dés que ses branches deviennent tendres, et que sortent les feuilles, vous savez que lété est proche. De méme, vous aussi, lorsque vous verrez tout « cela» arriver, sachez que le Fils de homme est proche, a votre porte.", "page": 305, "kind": "h"}, {"id": "r57p23", "text": "On n/a vraiment rien compris a la pensée de Jésus quand on se fait « prophéte de malheurs». Manifestement, Jésus veut ouvrir ’humanité a l’espérance d’un monde nouveau. Cest lété qui vient. C’est la-« belle saison» qui approche quand les arbres reverdissent. Oh! la belle petite parabole, la derniére avant de mourir.", "page": 305, "kind": "p"}, {"id": "r57p24", "text": "«Dans la détresse et dans la peur, oui, toute chose passe et meurt.", "page": 305, "kind": "p"}, {"id": "r57p25", "text": "Mais nous savons que vient été, aux branches vertes du figuier.", "page": 305, "kind": "p"}, {"id": "r57p26", "text": "Viens, Seigneur Jésus, oh! Viens, Marana tha! »", "page": 305, "kind": "p"}, {"id": "r57p27", "text": "Amen, je vous le dis, cette génération ne passera pas avant que tout « cela» n’arrive. Le ciel et la terre passeront, mes paroles ne passeront pas.", "page": 305, "kind": "h"}, {"id": "r57p28", "text": "Immensité du profil de Jésus! Prétention exorbitante pour quelqu’un qui ne serait qu’un mortel comme nous. N’oublions pas qu’il va mourir dans quelques jours. Tout « passe», dit-il... moi, je demeure, Je Suis! Et vous demeurerez avec moi. Au-dela de sa mort, la résurrection de Paques pointe, comme I’aurore aprés la nuit.", "page": 305, "kind": "p"}, {"id": "r57p29", "text": "Quant au jour et a lheure, nul ne les connait, pas méme les anges dans le ciel, pas méme le Fils, mais seulement le Pére.", "page": 305, "kind": "h"}, {"id": "r57p30", "text": "Il reste bien un «homme»: il ignore le secret du Pére, Lui Au-dela de tout. Inoui! Et pourtant, c’est cet homme-la qui affirme venir sur les nuées du ciel pour « rassembler tous les élus». Personnalité hors du commun, hors de nos prises conceptuelles. Quand cela arrivera-t-il? Dieu doit avoir ses raisons de ne pas nous répondre.", "page": 305, "kind": "p"}]}, {"id": 58, "title": "34e Dimanche ordinaire · Christ-Roi", "group": "Tiempo ordinario", "page": 306, "ref": "Jean 18/33.37", "paragraphs": [{"id": "r58p1", "text": "Voici le dernier dimanche de l'année liturgique. Aprés son dernier grand discours public, ou Jésus a annoncé qu’au milieu des « temps de détresse» il « vient» rassembler tous les hommes pour une «belle saison d’étéy... Jésus luiméme aborde sa propre «fin», et entre en sa Passion, conclusion et sommet de la «bonne nouvelle selon saint Marc», lue tout au long de cette année.", "page": 306, "kind": "p"}, {"id": "r58p2", "text": "Pour ce dernier dimanche, nous changeons d’évangéliste. Voici une page de saint Jean. Mais nous restons bien dans le méme contexte, et la méme conclusion. Jean ne donne le titre de « Roi» que dans la méme Passion, douloureuse et triomphale a la fois : soudain, coup sur coup, Jean parle de «roi», de « royauté » (Jean 18/33.36.37.39 - 19/3.12.14.15. 19.21)... mais c’est un roi crucifié, dont la couronne est d’épines, et le « titre» dérisoire. Il est donc clair, d’entrée de jeu, que la «royauté» de Jésus se situe a un tout autre plan que la politique.", "page": 306, "kind": "p"}, {"id": "r58p3", "text": "« Es-tu le Roi des Juifs?» interrogea Pilate.", "page": 306, "kind": "h"}, {"id": "r58p4", "text": "Jésus inculpé! Jésus a la barre du tribunal! Le plus célébre procés de tous les temps!", "page": 306, "kind": "p"}, {"id": "r58p5", "text": "Le juge, c’est Pilate, chef de l’armée d’occupation romaine, Préfet d’un des plus grands empires qui aient dominé et marqué le monde: Rome domine alors sur Iitalie, la France, l'Espagne, l’Angleterre, une partie de l’Allemagne, lAutriche, la Yougoslavie, la Roumanie, la Gréce, la Turquie, la Syrie, le Liban, la Palestine, Egypte, la Lybie, la Tunisie, PAlgérie, le Maroc. Le Prince régnant s’appelle alors Tibére, successeur immédiat d’Auguste. Pilate est le magistrat tout-puissant chargé d’arréter les insurrections qui éclosent assez réguliérement dans le milieu juif. Les Zélotes, on les crucifie aux portes des villes: des milliers d’hommes ont ainsi été crucifiés, pour imposer le pouvoir «royal» de Rome.", "page": 306, "kind": "p"}, {"id": "r58p6", "text": "inculpé, ce jour-la, pour Pilate, est « un certain Jésus» qui était, il_n’y a que trois ans encore, un simple et obscur charpentier de Nazareth, bourgade totalement inconnue du «pouvoir»... A peine si les patrouilles des soldats y passaient !", "page": 307, "kind": "p"}, {"id": "r58p7", "text": "Je contemple les deux hommes face 4 face: Pilate... Jésus... Le juge et l’accusé.", "page": 307, "kind": "p"}, {"id": "r58p8", "text": "Jésus lui demanda...", "page": 307, "kind": "h"}, {"id": "r58p9", "text": "Cest un comble. Voici maintenant l’inculpé qui « interroge » son juge! Les réles seraient-ils renversés? Audacieux, ce pauvre! Qui est-il donc ?", "page": 307, "kind": "p"}, {"id": "r58p10", "text": "« Dis-tu cela de toi-méme, ou bien parce que d’autres te ont dit?»", "page": 307, "kind": "
