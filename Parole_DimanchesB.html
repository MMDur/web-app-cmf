de la communauté apostolique au moment ow le Christ s’est endormi dans la mort. Mais, face aux puissances de mort, symbolisées par la «mer», le Christ est ressuscité. Nous retrouvons le théme sémitique de la «mer», image des forces hostiles 4 /homme, car Marc utilise, ici, les mé@mes vocabulaires que lorsque Jésus «menace» les démons pour les « faire taire» (Marc 1/25 -9/25).", "page": 198, "kind": "p"}, {"id": "r36p19", "text": "Jésus leur dit: « Pourquoi avoir peur? Comment se fait-il que vous n’ayez pas la foi?»", "page": 198, "kind": "p"}, {"id": "r36p20", "text": "Ce mot si dur: « vous n’avez pas la foi... vous avez perdu la foi...» s'applique en toute vérité 4 ce moment de la Passion, ot ils vont tous fuir, renier, douter.. Par trois fois, il sera répété que les ap6tres «ne crurent pas»: «il leur reprocha leur incrédulité et la dureté de leur coeur, parce quis navaient pas cru ceux qui lavaient vu _ ressuscité » (Marc 16/11.13.14).", "page": 198, "kind": "p"}, {"id": "r36p21", "text": "Quelles sont mes tempétes 4 moi?", "page": 198, "kind": "p"}, {"id": "r36p22", "text": "Dieu va-t-il les apaiser ?", "page": 198, "kind": "p"}, {"id": "r36p23", "text": "Une lecture naive des évangiles pourrait nous le faire croire. Le grand calme du Lac de Tibériade nous fait réver dune vie tranquille, o4 Dieu interviendrait constamment au niveau des causes naturelles pour nous éviter les épreuves, la mort.", "page": 198, "kind": "p"}, {"id": "r36p24", "text": "Mais la vraie lecture des évangiles nous conduit a cette invitation de Jésus a « purifier notre foi». C’est en passant par le «sommeil de la mort» que le Christ nous a deélivré des puissances infernales et mortelles. Ce n’est pas n’importe quelle foi qui apaise nos tempétes, c’est la foi en «Jésus Christ mort et ressuscité». Le salut auquel nous croyons ne nous fait pas échapper, par miracle, de facon nN", "page": 198, "kind": "p"}, {"id": "r36p25", "text": "privilégiée, aux souffrances inhérentes a notre nature humaine. La certitude de sa puissance n’a pas empéché le Christ de passer par le «sommeil du tombeau». C’est en passant nous-mémes par l’épreuve que nous passerons «sur lautre rive». Mais Jésus est la, avec nous, dans nos épreuves. Quelle page symbolique admirable!", "page": 199, "kind": "p"}, {"id": "r36p26", "text": "Saisis d’une grande crainte, ils se disaient entre eux: « Qui est-il donc, pour que méme le vent et la mer lui obéissent ? »", "page": 199, "kind": "h"}, {"id": "r36p27", "text": "Cest la premiére fois que Marc note cette interrogation dans le groupe des disciples. Question essentielle, sur la personnalité profonde de ce jeune « maitre», avec lequel ils se sont «embarqués». N’est-il qu’un «Rabbi» comme tant d autres? Qui est-il? Pour quelle aventure sont-ils partis avec lui? Jusqu’ow les ménera-t-il? Un jour proche, Jésus luirméme posera la question a Pierre: «Pour vous, Qui suis-je ?» (Marc 8/29). Aucun homme ne peut se dispenser de se poser cette question. Et, ne pas répondre, c’est hélas, une réponse: c’est accepter que nos tempétes humaines se terminent dans le naufrage du néant. « Mais si quelqu’un est en Jésus Christ, il est une créature nouvelle » (II Corinthiens 5/17). La foi, purifiée, nous introduit déja a cette vie nouvelle. «Passons sur l'autre rive»; disais-tu...", "page": 199, "kind": "p"}]}, {"id": 37, "title": "13e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 200, "ref": "Marc 5/21.43", "paragraphs": [{"id": "r37p1", "text": "Une grande foule s’assembla autour de lui. Il était au bord du lac. Arrive un chef de synagogue, nommé Jaire. Voyant Jésus, il tombe a ses pieds et le supplie instamment: «Ma petite fille est a toute extrémité. Viens lui imposer les mains pour quelle soit sauvée et quelle vive.» Jésus partit avec lui, et la foule qui le suivait était si nombreuse quelle lécrasait...", "page": 200, "kind": "p"}, {"id": "r37p2", "text": "Je commence par relire cette scéne pleine de vie. Marc rapporte lévangile de Pierre, homme concret, observateur précis. J’imagine le décor, je vois les gens, je remarque les mouvements... comme un film de cinéma. Ou encore je me considére comme lun des participants, je me mets au milieu de cette foule.", "page": 200, "kind": "p"}, {"id": "r37p3", "text": "Deux détails remarquables. Jaire «supplie instamment», longuement... beaucoup! Jésus, lui, sans dire un mot apparemment, « partit avec lui». Et nous les voyons marcher céte a céte, dans la foule.", "page": 200, "kind": "p"}, {"id": "r37p4", "text": "En hébreu, Yair signifie «celui qui illumine», ou encore «celui qui réveille».", "page": 200, "kind": "p"}, {"id": "r37p5", "text": "Or, une femme, qui avait des pertes de sang depuis douze ans... elle avait beaucoup souffert du traitement de nombreux médecins, et elle avait dépensé tous ses biens sans aucune amélioration ; au contraire, son état avait plut6t empiré... cette femme donc ayant appris ce qu’on disait de Jésus, vint par derriére dans la foule et toucha son vétement.", "page": 200, "kind": "p"}, {"id": "r37p6", "text": "Marc insiste sur état désespéré de cette femme: « beaucoup» souffert... «nombreux» traitements... dépensé « tous» ses biens... sans «aucune» amélioration... son état avait plutét «empiré»... Cette insistance veut nous dire que Jésus posséde encore une puissance la ot aucun moyen humain ne peut plus rien. Seigneur, donne-nous cette Foi profonde qui nous permettrait de ne jamais désespérer.", "page": 200, "kind": "p"}, {"id": "r37p7", "text": "Elle vint par derriére... car elle se disait: «Si je parviens a toucher seulement son manteau, je serai sauvée. >", "page": 201, "kind": "h"}, {"id": "r37p8", "text": "Dans la mentalité juive du temps, cette femme était considérée comme «impure» selon la Loi de Moise (Lévitique 15/25) et méme elle rendait les autres impurs par simple contact. J’essaie d’imaginer la honte de cette pauvre femme et son appréhension: en touchant le manteau de Jésus, elle fait une chose interdite, tabou... s'il allait refuser son attouchement impur! Et puis, si la foule savait, tout le monde sécarterait d’elle avec horreur! Et je contemple surtout Jésus «venu chercher et sauver ce qui était perdu», celui qui accueille les plus pauvres. Aucune misére, méme la plus cachée, méme la plus honteuse, nest repoussée par Jésus. Aucune Loi ne tient, devant Jésus, quand il s’agit de «sauver» quelqu’un. Délivre-nous, Seigneur de nos légalismes, de nos peurs, de nos hontes.", "page": 201, "kind": "p"}, {"id": "r37p9", "text": "A linstant, ’hémorragie s’arréta et elle ressentit dans son corps quelle était guérie de son mal. Aussitét Jésus se rendit compte qu’une force était sortie de lui. Il se retourna dans la foule, et il demandait : « Qui a touché mes vétements?» Ses disciples lui répondaient: «Tu vois bien la foule qui t’écrase, et tu demandes: “Qui m’a touché ?”.» Mais lui, regardait tout autour, pour voir celle qui avait fait ce geste.", "page": 201, "kind": "h"}, {"id": "r37p10", "text": "Jésus ne veut pas en rester a l’anonymat de la foule. Il cherche un contact personnel. Il veut aussi que la femme dépasse. sa croyance teintée de magie superstitieuse (« si je touche, je suis sauvée...»), pour entrer dans une foi plus vraie qui soit une reconnaissance de la personne de Jésus. Nous remarquons combien Jésus est éducateur: il tient compte de la croyance imparfaite et naive, mais il cherche a faire accéder a une foi plus adulte et plus motivée. Merci, Seigneur, de m/aimer aussi tel que je suis. Aide-moi a devenir tel que tu veux.", "page": 201, "kind": "p"}, {"id": "r37p11", "text": "Alors la femme, craintive et tremblante, vint se jeter aux pieds de Jésus et lui dit toute la vérité... Mais Jésus reprit: « Ma fille, ta foi ta sauvée. Va en paix et sois guérie de ton mal.»", "page": 202, "kind": "h"}, {"id": "r37p12", "text": "Deux mots: « guérie»... « sauvée»... Les miracles de Jésus, dans la perspective des chrétiens «d’aprés Paques», sont Pannonce de ce « salut par la foi» dont nous sommes bénéficiaires si nous reconnaissons Jésus. Oui, pour Jésus, |’essentiel n’est pas le « merveilleux», le miraculeux, mais le salut. Qu’est-ce que je demande a Dieu?", "page": 202, "kind": "p"}, {"id": "r37p13", "text": "Comme il parlait encore, des gens arrivent de la maison de Jaire pour annoncer 4a celui-ci: « Ta fille vient de mourir. A quoi bon déranger encore le maitre ? » Jésus, surprenant ces mots, dit au chef de la synagogue: «Ne crains pas, Crois seulement.»", "page": 202, "kind": "h"}, {"id": "r37p14", "text": "Cest bien la «Foi» qui compte, pour Jésus. Jaire a été témoin de l’événement précédent. Marc nous rapporte ces deux miracles imbriqués l'un dans l'autre pour nous donner impression d’une sorte de crescendo dans la foi: croire que Jésus peut guérir une maladie, croire que Jésus peut ressusciter un mort.", "page": 202, "kind": "p"}, {"id": "r37p15", "text": "« A quoi bor déranger le maitre ?» Pour les contemporains de Jésueril était impensable de demander une résurrection a Jésus. Guérir un malade: oui. Ressusciter un mort: inutile de déranger le maitre, car c’est impossible. Cela souligne le paradoxe de la Foi.", "page": 202, "kind": "p"}, {"id": "r37p16", "text": "Il ne laissa personne laccompagner, sinon Pierre, Jacques et Jean son frére. Ils arrivérent a la maison du chef de Synagogue.", "page": 202, "kind": "h"}, {"id": "r37p17", "text": "Jésus, une fois de plus, ne veut pas faire de sensationnel. I] préfére, chaque fois que c’est possible, faire ses miracles dans la discrétion. Aujourd’hui, il emméne seulement trois témoins qualifiés, les trois qui seront aussi teémoins de sa transfiguration (Marc 9/2) et de son agonie (Marc 14/33). La puissance de Jésus ne veut pas étre une puissance magique: il fera luiiméme l’expérience tragique de l’agonie et de la mort... qui ont atteint cette petite fille! Le seul salut définitif, c’est la Paque derniére, l’entrée dans la Vie éternelle.", "page": 202, "kind": "p"}, {"id": "r37p18", "text": "Il entre et voit lagitation de gens qui pleurent et poussent de grands cris. Il leur dit : « Pourquoi cette agitation et ces pleurs ? L’enfant n’est pas morte, elle dort.» Mais on se moquait de lui. Alors, il met tout le monde dehors...", "page": 203, "kind": "h"}, {"id": "r37p19", "text": "La foi de Jaire et des trois apétres est mise a rude épreuve par l’incrédulité massive de tous ceux qui entourent, et qui se «moquent» de Jésus!", "page": 203, "kind": "p"}, {"id": "r37p20", "text": "Il prend avec lui le pére et la mére de l’enfant, et ceux qui ’'accompagnaient. Puis il pénétre la ot reposait la jeune fille. Il saisit la main de lenfant...", "page": 203, "kind": "h"}, {"id": "r37p21", "text": "Ta main faisait des merveilles!", "page": 203, "kind": "p"}, {"id": "r37p22", "text": "Ta main qui prend une main morte. Le contact du Corps de Jésus. Dans nos communions se revit quelque chose de ce mystére vivifiant.", "page": 203, "kind": "p"}, {"id": "r37p23", "text": "Et il lui dit: « Talitha Koum! »", "page": 203, "kind": "h"}, {"id": "r37p24", "text": "Marc seul cite ces mots en araméen, langue maternelle de Jésus. Il tenait ce récit de Pierre, qui y était. Ce sont ces petits détails qui trahissent le temoin oculaire. Ces souvenirs ont été cueillis sur les lévres de-quelqu’un qui a entendu, et qui en fut bouleversé. Toute sa vie, Pierre a retenu ces deux mots: « Talitha koum! »", "page": 203, "kind": "p"}, {"id": "r37p25", "text": "Ce qui signifie: « Jeune fille, je te le dis, léve-toi! »", "page": 203, "kind": "h"}, {"id": "r37p26", "text": "En fait, les deux mots araméens se traduisent de maniére beaucoup plus courte: «Fillette, debout!» Mais Pévangéliste a éprouvé le besoin de paraphraser, et il a utilisé un mot-clef chez les premiers chrétiens «d’aprés Paques»: « Léve-toi», en grec «égeiré», Cest-a-dire «réveille-toi». Cest le mot utilisé pour dire la résurrection de Jésus. Ce mot a une saveur pascale. C’est lopposé du mot « dormir » que Jésus avait utilisé plus haut pour parler de la mort. Oui, pour Jésus, la mort n’est plus tout a fait la mort, c’est un sommeil avant un réveil. Un trés ancien cantique des premiers chrétiens, chanté aux baptémes, dit ceci: «O toi qui dors, éveille-toi, le jour a brillé, d’entre les morts relévetoi, sois illuminé » (Jaire, avons-nous dit, signifie « celui qui... illumine», « celui qui réveille»... symbole baptismal!) (Ephésiens 5/14).", "page": 203, "kind": "p"}, {"id": "r37p27", "text": "Mon baptéme. Ma vie de baptisé.", "page": 204, "kind": "p"}, {"id": "r37p28", "text": "Est-ce que je crois vraiment que j’ai regu le méme bienfait que cette petite fille? Par mon baptéme, je suis passé de la mort a la vie. Ma vie éternelle est déja commencée. Est-ce que je suis quelqu’un qui ne cesse de se «lever», de «s éveiller » 2? Est-ce que jentends Jésus me redire, 4 moi aussi: « Debout!»... «Léve-toi!»... « Réveille-toi...» «Ressuscite...» Quelles sont mes situations mortelles ? dont la Foi me sauve.", "page": 204, "kind": "p"}, {"id": "r37p29", "text": "Aussitét la jeune fille se leva et se mit a marcher. Elle avait douze ans. Ils en furent complétement bouleversés. Mais Jésus leur recommanda avec insistance que personne ne le sache;; puis il leur dit de la faire manger.", "page": 204, "kind": "h"}, {"id": "r37p30", "text": "La vie qui triomphe de la mort met les assistants au coeur du mystére, « hors d’eux-mémes», bouleversés. La consigne de silence accentue l'impression que nous avons déja eue: les vrais mystéres de Jésus sont inaccessibles 4 ceux qui r’ont pas la foi. Inutile de montrer du « miracle» sensationnel: on le prendrait pour du « magique», et Jésus ne veut pas étre pris pour un magicien.", "page": 204, "kind": "p"}, {"id": "r37p31", "text": "«Il leur dit de la faire manger.» Pas seulement une attention délicate et touchante. Dans la symbolique baptismale, celui qui est « passé de la mort a la vie» par le baptéme, est introduit, par la, a la table de l’eucharistie: un vivant se nourrit... un baptisé mange le Pain de vie... Eucharistie et baptéme sont liés. Mystére de Foi.", "page": 204, "kind": "p"}]}, {"id": 38, "title": "14e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 205, "ref": "Marc 6/1.6", "paragraphs": [{"id": "r38p1", "text": "Jésus est parti pour son pays, et ses disciples le suivent.", "page": 205, "kind": "h"}, {"id": "r38p2", "text": "Voila donc Jésus qui revient a Nazareth, son village, son pays.", "page": 205, "kind": "p"}, {"id": "r38p3", "text": "Né, exceptionnellement a Bethléem, a cause d’un recensement, Jésus a passé son enfance et sa jeunesse a Nazareth, a ’écart des grands mouvements de circulation. Il y avait peut-étre cent cinquante familles. On y vivait trés simplement, de la culture des oliviers et de la vigne, avec un peu d’orge et de blé. Chaque famille avait quelques chévres. Chacun faisait son pain, chaque jour, a la maison. Le samedi, tous se rendaient dans le local de priére, une petite synagogue. Tout trahit, en Jésus, un homme du terroir, un paysan, un homme «du pays»: l’évangile est tout entier une description de la vie rurale, un récit écrit par des «paysans», au sujet d’un « paysan», qui a vécu parmi les «paysans», et sest exprimé en comparaisons «paysannes». Quelle était donc la spécialité d’un charpentier dans ce type de vie? Fabriquer des meubles, des lits, des portes? Pourquoi donc? Chacun se fabriquait lui-méme tout cela. On mangeait assis par terre, on couchait sur des nattes 4 méme le sol. Le «charpentier» Jésus, paysan parmi les autres, pouvait avoir quelques habiletés particuliéres, apprises de Joseph... un modeste dépanneur de village, capable de faire ou de réparer les jougs et les charrues en bois. Jésus, un homme que rien ne distingue de tout le monde. Je médite sur cela.", "page": 205, "kind": "p"}, {"id": "r38p4", "text": "Le jour du Sabbat, il se mit 4 enseigner dans la synagogue.", "page": 206, "kind": "h"}, {"id": "r38p5", "text": "En cela encore, il est «comme tout le monde». Ne nous y trompons pas. Jésus n’est pas lofficiant, il ne joue pas le rdle du prétre. II est l'un des laics de lassistance. Tout male adulte, en Israél, depuis l’Age de sa maturité, douze ans, était « prétre», faisait partie de la «race sacerdotale», et avait le droit de lire ’Ecriture et de la commenter. C’est ce qu'il fait, ce jour-la, quittant sa place pour aller «lire» et «faire ’homélie». Marc ne nous dit pas quel fut le sujet du sermon, ce jour-la.", "page": 206, "kind": "p"}, {"id": "r38p6", "text": "Les nombreux auditeurs, frappés d’étonnement, disaient: «D’ou cela lui vient-il? Quelle est cette sagesse qui lui a été donnée, et ces grands miracles qui se réalisent par ses mains?»", "page": 206, "kind": "h"}, {"id": "r38p7", "text": "La réputation de Jésus est arrivée dans son village. Or, au lieu d’en étre fiers, ses compatriotes s’en offusquent. Tout cela ne correspond pas a ce quiils « savent» de lui. Ils le connaissent mieux que quiconque. Ils ’ont vu grandir. Ils sont allés a Pécole avec lui. Il n’a pas le droit d’étre « autre» que ce quills connaissent de lui.", "page": 206, "kind": "p"}, {"id": "r38p8", "text": "Ainsi nous arrive-t-il, 4 nous aussi, de nous bloquer sur une certaine connaissance que nous avons... en refusant d’avancer plus loin, de découvrir du nouveau. Seigneur, délivre-nous de nos conservatismes, de nos routines de pensées, de nos bloquages intellectuels ou spirituels. Bouscule-nous, Seigneur, de nos habitudes confortables, de nos petits mondes bien tranquilles.", "page": 206, "kind": "p"}, {"id": "r38p9", "text": "« N’est-il pas le charpentier, le fils de Marie, et le frére de Jacques, de José, de Jude et de Simon? Ses soeurs ne sont-elles pas ici, chez nous?»", "page": 206, "kind": "h"}, {"id": "r38p10", "text": "Avec cet évangile de Marc, si concret, nous sommes tout prés du «Jésus de tous les jours». Nous comprenons trés bien les réflexions terre a terre de ces paysans d’un petit hameau perdu dans la campagne. C’est la vie de clan: l’horizon s’arréte aux collines qui entourent le village. Et l’on cite des noms... toute la liste des cousins. A la mode orientale, on les appelle des « fréres»... sans parler de sa parenté féminine, qu’on ne cite pas, parce que ce nest pas la tradition de donner de la place aux femmes! Quel est ce novateur qui bouscule tous nos usages, qui désorganise notre petit monde, ot l’on situe les gens d’aprés un état civil bien figé, oti les relations sociales sont fixées une fois pour toutes. Enfin, chacun doit rester a sa place, et jouer son role... sans changer tout d’un coup!", "page": 206, "kind": "p"}, {"id": "r38p11", "text": "Et ils étaient profondément choqués 4 cause de lui.", "page": 207, "kind": "h"}, {"id": "r38p12", "text": "Les trois évangiles synoptiques: Matthieu, Luc et Marc, nous rapportent cet «échec» de Jésus. Jésus a vraiment vécu des événements pénibles. Jésus a été « refusé».", "page": 207, "kind": "p"}, {"id": "r38p13", "text": "Il y a, aujourd’hui, des gens qui prennent la méme attitude que celle des habitants de Nazareth alors. Certains disent : -«Croire a Jésus, oui! Croire a lEglise, non!» Oui, lEglise, comme Jésus, a un c6té humain, trés humain: les évéques, les prétres, les chrétiens... des hommes que |’on connait bien, que l'on connait trop! Beaucoup de gens AUJOURD’HUI, comme alors, se «scandalisent» de ’Eglise, comme on se scandalisait de Jésus. (C’est le mot exact qui est utilisé en Grec «éscandali zonto»). L’Eglise est choquante! Jésus était choquant! profondément, dit l’évangile.", "page": 207, "kind": "p"}, {"id": "r38p14", "text": "Cette page d’évangile est une sérieuse mise en cause de nos idéalismes: il faut accepter les imperfections de lEglise. Cest le réalisme de l’incarnation... Dieu au village, Dieu au coin de la rue, Dieu apprenant a lire a l’école, Dieu le frére d'un Tel! ; j", "page": 207, "kind": "p"}, {"id": "r38p15", "text": "Jésus leur disait: «Un prophéte n’est méprisé que dans son pays, sa famille et sa propre maison. »", "page": 207, "kind": "h"}, {"id": "r38p16", "text": "Cest dans sa famille que Jésus a été le plus « méprisé » : on s’est mépris sur lui. Une certaine familiarité peut faire écran a la profondeur des relations. Réduire Jésus a des dimensions humaines, c’est le mépriser. La vraie proximité avec Jésus n’est pas d’abord une proximité physique, matérielle : et nous pourrions bien, nous aussi, avoir une fausse conception du « sacrement», comme s'il suffisait de faire les gestes matériellement pour étre assuré détre de la «famille» de Jésus... comme automatiquement!", "page": 207, "kind": "p"}, {"id": "r38p17", "text": "Nous le savons pourtant, ce qui fait la « famille» vraie de Jésus, ce ne sont pas les liens du sang, c’est la foi: « Quiconque fait la volonté de Dieu, voila mon frére, ma sceur, ma mére» (Marc 3/35). Jésus s'est fait une nouvelle famille : ceux qui écoutent la Parole de Dieu et la mettent en pratique.", "page": 207, "kind": "p"}, {"id": "r38p18", "text": "Et la, il ne pouvait accomplir aucun miracle; il guérit seulement quelques malades en leur imposant les mains.", "page": 208, "kind": "h"}, {"id": "r38p19", "text": "Voila une révélation bien curieuse, et bouleversante pour nos schémas tout faits. Une guérison, méme faite par l’imposition des mains de Jésus, n’est pas forcément un miracle ? Jésus aurait fait des « quérisons» qui n’étaient pas des miracles? Qu’est-ce que cela veut dire? Il faut la foi pour quil y ait miracle véritable. Une guérison qui n’aboutit pas a «reconnaitre» Jésus dans la foi, n’est pas un vrai miracle... car il est privé de sa «signification». essentielle.", "page": 208, "kind": "p"}, {"id": "r38p20", "text": "Cela nous prouve aussi, s'il en était besoin, que le miracle rest pas suffisant pour donner la foi. Les gens de Nazareth disaient : « Quels sont ces grands miracles qui se réalisent par ses mains... dans les villages voisins». L’activité de Jésus n'est pas évidente : méme les plus grands miracles ne sont pas suffisants pour faire découvrir le mystére de sa personne. Et il nous arrive de continuer 4 demander a Dieu dintervenir pour « prouver qui Il est». Nous sommes pourtant bien avertis «qu’on peut voir sans voir, et entendre sans comprendre» (Marc 4/12)... et que « Bien que Jésus ait accompli des signes trés grands devant eux, ils ne crurent pas en lui» (Jean 12/37). Cela nous permet de comprendre pourquoi certains chrétiens aussi se défient des miracles, et combien l’Eglise est prudente... a la difference de tous les marchands de merveilleux.", "page": 208, "kind": "p"}, {"id": "r38p21", "text": "Il s’étonna de leur manque de foi.", "page": 208, "kind": "h"}, {"id": "r38p22", "text": "Ce refus de la foi semble bien une des caractéristiques de toute la seconde phase du ministére de Jésus.", "page": 208, "kind": "p"}, {"id": "r38p23", "text": "Voila donc Jésus face au phénoméne de lincroyance.", "page": 208, "kind": "p"}, {"id": "r38p24", "text": "Il nous arrive parfois d’avoir impression que c’est un phénoméne typique du monde actuel, comme si les ages précédents avaient été, globalement, des ages de foi. Il arrive, de plus en plus souvent, qu’on accuse I’Fglise: «on n’enseigne plus la religion... on ne fait plus de catéchése...» Or, quand Jésus en personne faisait l’enseignement, et dans son propre village, milieu sain et préservé s'il en est, il n’arrivait pas a faire émerger la Foi! Combien de parents, AUJOURD’HUI, se trouvent devant le méme phénoméne, de la part de leurs propres enfants. Eh bien, Jésus luitméme, tout saint qu'il était, a eu des incroyants dans sa propre famille.", "page": 208, "kind": "p"}, {"id": "r38p25", "text": "Liimpuissance de Jésus, devant la non-foi de ses compatriotes, manifeste son infini respect de la liberté humaine: image du respect de Dieu pour la liberté qu'il a créée. Cette mystérieuse impuissance «divine» devrait nous faire profondément réfléchir : notre propre foi n’est peut-étre pas aussi solide que nous le croyons... la foi est une réalité fragile, menacée.", "page": 209, "kind": "p"}, {"id": "r38p26", "text": "Alors il parcourait les villages d’alentour en enseignant.", "page": 209, "kind": "h"}, {"id": "r38p27", "text": "Je recois, ici, une belle legcon pour mes propres échecs. Devant l’échec cuisant que Jésus vient de subir a Nazareth, loin d’étre abattu, il repart! «Il s’étonnait de leur manque de foi», note laconiquement Marc! Il est difficile daccepter ses échecs, et d’en tirer les conséquences positives, loyalement, sans se laisser abattre.", "page": 209, "kind": "p"}, {"id": "r38p28", "text": "Les trois lectures de ce dimanche nous parlent de la « spiritualité de ’échec»: le prophéte Ezéchiel (2/2.5) recoit de Dieu Pordre de rester debout face a un peuple qui refuse son message... quant a Paul (2 Corinthiens 12/7.10) il avoue avoir une «écharde dans la chair», un échec quill rvarrive pas a vaincre.", "page": 209, "kind": "p"}, {"id": "r38p29", "text": "Et nous, allons-nous nous laisser aller au découragement devant tel effort de conversion qui n’avance pas... devant telle situation douloureuse ?", "page": 209, "kind": "p"}]}, {"id": 39, "title": "15e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 210, "ref": "Marc 6/7.13", "paragraphs": [{"id": "r39p1", "text": "Jésus appelle les « douze», et, pour la premiére fois, il les envoie deux par deux.", "page": 210, "kind": "h"}, {"id": "r39p2", "text": "Lun des premiers actes de Jésus, dés le début de sa vie publique, avait été de choisir des collaborateurs (Marc 1/16). Ayant complété son groupe peu a peu (Marc 2/14), Jésus en avait finalement pris « douze», chiffre symbolique indiquant qu'il avait intention de fonder comme un nouveau peuple d'lsraél, a partir des « douze» patriarches, ou des douze tribus. Pendant tout le début de l’évangile, nous voyons les apétres accompagner Jésus, étre «avec lui» (Marc 3/14).", "page": 210, "kind": "p"}, {"id": "r39p3", "text": "Aujourd’hui, Jésus va s’effacer pour ainsi dire et remettre sa propre mission entre leurs mains. Pour la premiére fois, ils vont se trouver seuls, sans Jésus, chargés de précher. C’est déja le temps de lEglise qui commence.", "page": 210, "kind": "p"}, {"id": "r39p4", "text": "Nous pouvons d’abord prier sur cette attitude divine: nous avons un Dieu qui ne veut pas tout faire, pour ainsi dire... il nous attend, il nous confie des responsabilités importantes, il ne nous manipule pas comme on tire des marionnettes. Quelles sont mes responsabilités? Qu’est-ce que Tu attends de moi, Seigneur?", "page": 210, "kind": "p"}, {"id": "r39p5", "text": "Il les envoie...", "page": 210, "kind": "h"}, {"id": "r39p6", "text": "Pendant les cinq premiers chapitres de son récit, Marc nous a montré avec insistance « Jésus-avec-ses-disciples », formant un groupe unique et soudeé, face a la foule... et face aux adversaires... Au moment de leur « appel» (Marc 3/13. 14), Marc avait noté que Jésus en avait «établi douze: 1) pour étre avec lui; 2) et pour les envoyer». C’est le mouvement méme du cceur: diastole... systole... le sang vient au coeur, puis est renvoyé dans lorganisme. C’est le mouvement normal de l’apostolat: vivre dans lintimité du Christ... aller dans le monde y porter le Christ... C’est le mouvement méme de toute vie chrétienne: on se rassemble prés de Jésus le dimanche... on se disperse dans la vie quotidienne pour y étre vivants de Jésus.", "page": 210, "kind": "p"}, {"id": "r39p7", "text": "« Allez! Vous étes envoyés». «Ite, missa est». La messe signifie « envoi».", "page": 211, "kind": "p"}, {"id": "r39p8", "text": "Cest Jésus qui a institué ce rythme. Est-ce que je vis ainsi? Est-ce que je passe des moments «avec Jésus», dans la priére et la méditation... puis est-ce que jai conscience détre « envoyé» par Lui-vers ma vie ordinaire pour y faire quelque chose qui a rapport avec Lui?", "page": 211, "kind": "p"}, {"id": "r39p9", "text": "Il les envoie deux par deux...", "page": 211, "kind": "h"}, {"id": "r39p10", "text": "Il faut étre deux pour que le témoignage soit valable (Deutéronome 17/6 - 19/15). La sagesse des peuples a fait toutes sortes de dictons populaires en ce sens. « Deux hommes valent mieux qu’un seul, en effet, s’ils tombent, Pun reléve lautre. Mais malheur a celui qui est seul» (Qohélet 4/9).", "page": 211, "kind": "p"}, {"id": "r39p11", "text": "La premiére régle de l'apostolat, c’est de « faire équipe»: la vie fraternelle est déja une prédication de l'amour, avant méme d’en parler. « Voyez comme ils s'aiment ». Le témoignage chrétien doit viser a prendre une forme communautaire, en Eglise. C’est une volonté explicite de Jésus. Je dois donc m’interroger sur mes attitudes. L’individualisme a des formes subtiles et redoutables: nous n’aimons pas beaucoup le contrdéle des fréres sur nos propres comportements... et pourtant ?", "page": 211, "kind": "p"}, {"id": "r39p12", "text": "Il leur prescrivit de ne rien emporter pour la route, si ce nest un baton; de n’avoir ni pain, ni sac, ni piéces de monnaie dans leur ceinture. «Mettez des sandales, ne prenez pas de tunique de rechange. »", "page": 211, "kind": "h"}, {"id": "r39p13", "text": "Il est remarquable que nous ne voyons pas Jésus faire des recommandations sur le contenu doctrinal de leur « mission». Il ne leur dit pas «ce quils devront précher». Mais il entre dans les détails pour leur dire «ce quils devront étre». Le témoignage de la vie est plus important, pour Jésus, que celui de la parole.", "page": 211, "kind": "p"}, {"id": "r39p14", "text": "Le seul conseil du maitre concerne, pratiquement, une exigence de pauvreté. Ses représentants doivent se présenter démunis de toute aide et de tout prestige humain, n’ayant pour tout appui que leur foi en « celui qui les envoie». Saint Paul développera cette exigence quand il affirmera: «Le trésor de la connaissance de la gloire qui rayonne sur le visage du Christ, nous le portons dans des vases fragiles, pour que cette incomparable puissance soit de Dieu et non pas de nous » (II Corinthiens 4/6.7). Saint Paul allait jusqu’a se vanter de sa pauvreté : « Quand je suis venu chez vous, ce rest pas avec le prestige de la parole ou de la sagesse... mais faible, craintif, et tout tremblant... afin que votre foi ne soit pas fondée sur la sagesse des hommes, mais sur la puissance de Dieu» (I Corinthiens 2/1.5).", "page": 212, "kind": "p"}, {"id": "r39p15", "text": "Oui, ce que Jésus veut, ce sont des troupes légéres, sans bagages embarrassants, toujours prétes’ a partir ailleurs... des routiers, des gens disponibles. L’Eglise devrait sans cesse «s/alléger» pour étre disponible aux impulsions de Esprit.", "page": 212, "kind": "p"}, {"id": "r39p16", "text": "Et moi? face a cette exigence de pauvreté ? Jésus dit nettement a ses amis de ne s’encombrer que du strict nécessaire. Vaincre la tentation de l'argent: premiére victoire de lévangile, premiére prédication si indispensable au monde avide, premiére bataille (en soitméme d’abord) contre un ennemi majeur de ’humanité. La possession de la richesse! Source de divisions, de conflits et d’orgueil!", "page": 212, "kind": "p"}, {"id": "r39p17", "text": "Seigneur, aide-nous a nous rapprocher de l’idéal de dépouillement que tu souhaites.", "page": 212, "kind": "p"}, {"id": "r39p18", "text": "« Si, dans une localité, on refuse de vous accueillir et de vous écouter, partez en secouant la poussiére de vos pieds: ce sera pour eux un témoignage. »»", "page": 212, "kind": "h"}, {"id": "r39p19", "text": "On est frappé par Pimportance du « refus de l’accueil» dans ce discours de Jésus. Les disciples ont-ils eu beaucoup de succés ? Il semble que ¢a n’a pas dé étre trés brillant. On devine trés bien les réflexions: « Vous nous demandez de nous convertir? Mais nous, nous sommes trés bien! Nous sommes de bons juifs traditionnels! Pourquoi changer quoi que ce soit dans nos habitudes? Allez précher ailleurs. » Les difficultés des chrétiens pour présenter leur foi ne datent pas d’aujourd’hui. Jésus nous dit, aujourd’hui: « Ne vous inquiétez pas! C’était prévu. Je vous lavais bien dit.» Ne nous faisons pas d’illusion, le message vrai de la Foi est refusé du grand nombre AUJOURD’HUI comme au temps de Jésus. Alors, ce que Jésus nous demande, c’est de rester des hommes debout, des hommes non-découragés: «si on refuse de vous accueillir, partez ailleurs.» Se trouver devant l’incroyance, l’indifférence, le rejet, cela semble tout a fait normal pour Jésus... La «mission», c’est difficile. Jésus en a averti a l’avance ceux qu'il a envoyés précher Pévangile. ;", "page": 212, "kind": "p"}, {"id": "r39p20", "text": "Ils partirent et proclamérent qu’il fallait se « convertir »»...", "page": 213, "kind": "h"}, {"id": "r39p21", "text": "Ils chassaient beaucoup de démons...", "page": 213, "kind": "h"}, {"id": "r39p22", "text": "Ils faisaient des onctions d’huile 4 de nombreux malades et les guérissaient...", "page": 213, "kind": "h"}, {"id": "r39p23", "text": "Ils font exactement ce quills ont vu faire a Jésus depuis quils sont «avec lui.» Voici donc, en trois phases, le contenu de effort « missionnaire » :", "page": 213, "kind": "p"}, {"id": "r39p24", "text": "1° La proclamation de la Parole, qui demande un changement de vie, une conversion... ;", "page": 213, "kind": "p"}, {"id": "r39p25", "text": "2° Le combat contre le mal, qui chasse les démons de homme pour le libérer...;", "page": 213, "kind": "p"}, {"id": "r39p26", "text": "3° L’action en faveur des pauures, qui améliore la vie et apporte la quérison...", "page": 213, "kind": "p"}, {"id": "r39p27", "text": "Se convertir...", "page": 213, "kind": "h"}, {"id": "r39p28", "text": "Tel est le premier contenu de la prédication: changez de vie... convertissez-vous! On comprend quills aient été peu écoutés, et qu’on ait refusé de les accueillir. Les hommes, en moyenne, n’aiment pas «changer» de vie. Qu’on nous laisse tranquilles! Dieu est un géneur, Lui qui nous demande de nous engager dans une vie toute nouvelle. Le mot grec traduit par «conversion», c’est «métanoia», qui signifie littéralement «se retourner lesprit». Il s’agit de changer de cap: nous marchions dans une direction, et il nous faudrait décider de partir en sens inverse. Ce n'est pas rien. L’évangile est virulent! Qu’en avons-nous fait? Une doctrine bien tranquille? Un narcotique? Une douce somnolence ? La justification de nos ambiguités ? Une assurance tous risques? Le soutien de l’ordre établi? La molle routine de nos habitudes ?", "page": 213, "kind": "p"}, {"id": "r39p29", "text": "«Ils criaient «ékéruxan»... qu’l fallait changer de vie « métanoésin » ! »", "page": 214, "kind": "p"}, {"id": "r39p30", "text": "Chasser les démons...", "page": 214, "kind": "h"}, {"id": "r39p31", "text": "Marc utilise bien sir les schémas mentaux de ses contemporains... mais il reste évident que la mission a un caractére dramatique. C’est un combat! Une lutte contre le régne du mal dans le monde! Les « missionnaires», les « envoyés de Jésus» ne font pas de publicité pour un produit qui se vend bien (!)... ils partent pour affronter un terrible adversaire. L’opposition qu’ils rencontrent ne vient pas seulement des personnes qui refusent parce qu’elles n’ont pas compris. Il y a une force d’opposition, une résistance a l’évangile qui vient de plus loin: ce que nous appellerions le « péché du monde.» Comment pouvons-nous traduire, AUJOURD’HUI, ces forces mauvaises contre lesquelles nous avons a nous battre pour les chasser ?", "page": 214, "kind": "p"}, {"id": "r39p32", "text": "Guérir...", "page": 214, "kind": "h"}, {"id": "r39p33", "text": "Arracher les hommes aux forces mauvaises qui les perdent, c’est aussi travailler A leur promotion positive, les guérir. Cela fait partie des exigences explicites de Jésus. Cette consigne garde toute sa valeur, méme si elle prend, dans notre contexte de civilisation, une forme concréte différente.", "page": 214, "kind": "p"}, {"id": "r39p34", "text": "Evangéliser, ce n’est pas seulement, ni surtout, «enseigner», c’est «libérer». Quelles formes modernes et adaptées a notre temps devrait prendre, AUJOURD’HUI, l’annonce de lévangile ? Contre quel maux devrions-nous lutter ? De quelle guérison notre société a-t-elle besoin ?", "page": 214, "kind": "p"}, {"id": "r39p35", "text": "L’évangile est toujours aussi actuel, mais c’est nous qui nentendons pas son appel a la conversion.", "page": 214, "kind": "p"}]}, {"id": 40, "title": "16e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 215, "ref": "Marc 6/30.34", "paragraphs": [{"id": "r40p1", "text": "Aprés leur premiére « mission», les Ap6tres se réunissent auprés de Jésus... :", "page": 215, "kind": "h"}, {"id": "r40p2", "text": "Cst ici la premiére, et la seule fois, ot Marc appelle les disciples des «apétres» («apostoloi»= «les envoyés»). Dimanche dernier, nous avons entendu les consignes que Jésus leur avait données en les «envoyant». Ils ont vécu quelques jours — combien? — deux par deux, mais sans Jésus. Ils reviennent de leur tournée apostolique. Ils ont fait lexpérience de la force de l’évangile... mais surtout sans doute, ils ont expérimenté les résistances, les refus, l’indifférence... Et le texte va nous dire plus loin quills sont harassés, fatigués, ayant besoin de se reposer. A l’@poque on marchait a pied... des kilométres et des kilométres... Pendant ce temps-la, qu’a fait Jésus, seul?", "page": 215, "kind": "p"}, {"id": "r40p3", "text": "Et ils lui rapportent... tout ce quiils ont «fait», et « enseigné >»...", "page": 215, "kind": "h"}, {"id": "r40p4", "text": "Cest ’heure du «compte rendu». On agit, et puis on «revoit» laction pour mieux la comprendre dans la foi et laméliorer dans les prochaines interventions.", "page": 215, "kind": "p"}, {"id": "r40p5", "text": "Aujourd’hui, on se réunit beaucoup. On travaille beaucoup en groupe, dans la vie scolaire, professionnelle, dans la recherche: Associations, Syndicats, Comités de toutes sortes, convoquent leurs membres pour mettre en commun idées, projets... Aujourd’hui, on parle beaucoup de «concertation», de « dialogue». Cela fait partie de la nature humaine. Nous constatons une fois de plus combien Jésus est parfaitement inséré dans la nature profonde de homme, étre de relation, de participation.", "page": 215, "kind": "p"}, {"id": "r40p6", "text": "Beaucoup de chrétiens, aujourd’hui, ont compris combien leur foi serait plus forte s’ils arrivaient 4 se réunir avec d’autres fréres pour en discuter, partager l’évangile. C’est déja le but de PAssemblée eucharistique du dimanche: aprés leur mission dans la semaine, les chrétiens reviennent «avec Jésus» : est-ce que j'ai quelque chose a lui dire ? Estce que japporte ma vie de la semaine dans ma priére ?", "page": 216, "kind": "p"}, {"id": "r40p7", "text": "Tout ce quills ont « fait» et « enseigné»...", "page": 216, "kind": "h"}, {"id": "r40p8", "text": "Marc résume toute la mission des apdtres en deux aspects: «faire», «parler». C’est aussi ce qui caractérise activité de Jésus: des actes de miséricorde, et de lenseignement. Jésus et les apétres sont les ouvriers d’une méme tache.", "page": 216, "kind": "p"}, {"id": "r40p9", "text": "Il leur dit : « Venez a l’écart dans un endroit désert, et reposez-vous un peu.»", "page": 216, "kind": "h"}, {"id": "r40p10", "text": "De fait, les arrivants et les partants étaient si nombreux qu’on n’avait méme pas le temps de manger. Ils partirent donc dans la barque pour un endroit désert, a Pécart.", "page": 216, "kind": "h"}, {"id": "r40p11", "text": "Voila Jésus «en vacances»! Jésus propose a ses amis harassés par le travail un temps de détente et de repos. Il y a un degré de surcharge, de tension nerveuse, de « stress» comme on dit aujourd’hui, qui devient néfaste a l’'apostolat, comme 4 toute activité humaine. Jésus veut des hommes et des femmes équilibrés, sereins, paisibles. Besoin de silence, de solitude, a ’écart des foules. Essentiel 4 ’homme de tous les temps... mais spécialement indispensable a homme moderne, guetté par linfarctus, dans la trépidation de nos villes d’aujourd’hui. Quelle est la part de « désert» que je mets, volontairement, dans mes journées, dans mes semaines? Comment est-ce que je passe mes vacances ?", "page": 216, "kind": "p"}, {"id": "r40p12", "text": "Et ce n’est pas le seul cas ot Marc nous montre Jésus aimant la solitude et s’écartant des foules. Jésus sait choisir ses endroits, d’ailleurs. «Une haute montagne a l’écart» (Marc 9/2). Les falaises qui surplombent le lac, du cété du Golan (Marc 5/1). Les plages de la céte syro-phénicienne ou libanaise (Marc 7/24.31). Les rives d’un torrent de montagne, prés des sources du Jourdain, au pied de Hermon (Marc 8/27).", "page": 216, "kind": "p"}, {"id": "r40p13", "text": "A Yécart... dans la solitude... reposez-vous...", "page": 217, "kind": "h"}, {"id": "r40p14", "text": "Lexhortation de Jésus d’aller dans un lieu de calme dépasse certainement la situation concréte a laquelle elle sest d’abord appliquée ce jour-la. La vie profonde exige le recueillement. L’agitation extérieure n’engendre que la superficialité : aucune grande ceuvre humaine ne s’est réalisée sans une forte dose de concentration, d’effort de calme, de maitrise de soi. Toute vie humaine sérieuse, déja, oscille entre des temps dvactivité «au dehors», et des temps de réflexion «a lintérieur». Voir. Juger. Agir. Revoir. Re-juger. Re-agir. A plus forte raison, il n’y a pas de vie chrétienne solide et profonde sans ce double rythme: la « vie intérieure», l'activité « extérieure ». M’arrive-t-il de perdre du temps pour méditer? Quel est le temps que je consacre a la priére dans une journée de 24 heures ? Est-ce que jai peur du silence? de la solitude? Est-ce que je me précipite sur le bouton de ma radio, de ma télé... pour remplir tout vide qui se présente ?", "page": 217, "kind": "p"}, {"id": "r40p15", "text": "Et mes dimanches ? Sont-ils un jour de « shabbat», un jour de «repos»?", "page": 217, "kind": "p"}, {"id": "r40p16", "text": "Les gens les virent s’éloigner, et beaucoup les reconnurent. Alors, a pied, de toutes les villes, ils coururent la-bas et arrivérent avant eux. En débarquant, Jésus vit une grande foule.", "page": 217, "kind": "h"}, {"id": "r40p17", "text": "Jésus et ses disciples jouent ici A une sorte de jeu de cachecache avec la foule. Mais il n’y a pas moyen de se cacher. On veut fuir la foule, mais on est bien obligé de s’en occuper. On veut fuir, se reposer pour éviter cette surcharge qui ne vous laisse méme plus le temps de manger. On s/arrange pour filer en douce, mais la foule est la, avant vous! Quelle va étre la réaction de Jésus devant ce contretemps qui dérange ses plans?", "page": 217, "kind": "p"}, {"id": "r40p18", "text": "Jésus vit la foule. Il fut saisi de pitié envers eux...", "page": 217, "kind": "h"}, {"id": "r40p19", "text": "Comme on Te reconnait la, Seigneur!", "page": 217, "kind": "p"}, {"id": "r40p20", "text": "Je veux d’abord prendre le temps d’imaginer ta réaction. Vous débarquez. La foule est sur la plage... elle se précipite vers vous. Au lieu de T’énerver, Seigneur, tu accueilles. La solitude, le repos, ce sera pour une autre fois!", "page": 217, "kind": "p"}, {"id": "r40p21", "text": "Jésus aussi s’est trouvé devant des urgences. Il a da se laisser déranger de ses projets. Il a cédé a lappel des autres. Combien de mamans qui voudraient se reposer et qui ne le peuvent pas. Jésus, Tu as connu cette expérience. C’est aussi cela, ’amour! Faire «ce qu’on ne voudrait pas», «ce qui simpose», «ce qui est la». « Qui veut étre mon disciple, qu’il se renonce a lui-méme... et qu’il me suive» (Marc 8/34). «Qui perd sa vie, la gagne» (Marc 8/35). Perdre! Jésus a perdu! Et il nous demande de faire comme lui, de perdre! par amour.", "page": 218, "kind": "p"}, {"id": "r40p22", "text": "Saisi de pitié...", "page": 218, "kind": "h"}, {"id": "r40p23", "text": "Comment cela se manifestait-il sur ton visage, dans les gestes de tes mains, a la commissure des lévres, et... dans tes yeux... et dans le ton de ta voix...", "page": 218, "kind": "p"}, {"id": "r40p24", "text": "Cette foule que Jésus regarde avec amour, c’est l'image du monde, du monde de tous les temps. En ce moment, Seigneur, je crois que tu continues a regarder notre monde d’AUJOURD'HUI, de ce méme regard « saisi»! Et moi? Comment est mon regard sur les foules?", "page": 218, "kind": "p"}, {"id": "r40p25", "text": "Parce quils étaient comme des « brebis-sans-berger »»...", "page": 218, "kind": "h"}, {"id": "r40p26", "text": "L’image est belle. Des brebis sans berger! Le désarroi. Que faire? Les relations de Dieu avec son peuple n/avaient cessé d’étre décrites sous ce symbole. La sortie d’Egypte, cavait été Yahveh qui conduisait son peuple comme un berger dans le désert (Exode 15/13). Moise, au moment de mourir, s‘était inquiété de laisser ce peuple dlsraél «comme des brebis qui n’ont pas de pasteur» (Nombres 27/17). Jérémie, dans la premiére lecture de ce dimanche, nous montre le peuple livré aux « mauvais bergers, qui laissent périr et se disperser les brebis du paturage de Dieu» (Jérémie 23/1.6). Et nous chantons, ce dimanche, le psaume 22: «Le Seigneur est mon berger, je ne manque de rien: sur de frais paturages, il me laisse reposer. » Jésus luirméme a souvent repris cette image: «Je frapperai le berger, et les brebis seront dispersées» (Marc 14/27). Il se dit « envoyé aux brebis perdues » (Luc 19/10 ; 15/4.7). Il est le «bon pasteur» (Jean 10).", "page": 218, "kind": "p"}, {"id": "r40p27", "text": "Jésus se comporte donc, ici, comme le Messie promis. Et méme, peut-on dire, il prend la place de Dieu: c’était Dieu le Berger d’lsraél!", "page": 219, "kind": "p"}, {"id": "r40p28", "text": "Des «brebis-sans-berger»: une image du monde de tous les temps, une image de notre temps. Est-ce a dire que le monde est livré a l’anarchie? Nous savons pourtant que des chefs, des conducteurs de peuples se présentent, et prétendent «guider» les masses. On cherche homme providentiel! Mais souvent, aprés un temps d’espoir, c’est Poppression, la corruption, qui recommencent. Combien d@ Etats, aujourd’hui, sur notre planéte, ont un régime de liberté démocratique... combien sont livrés sans merci, a des régimes totalitaires qui n’assurent une discipline rigoureuse quen asservissant les consciences et en réduisant au silence les esprits libres ?", "page": 219, "kind": "p"}, {"id": "r40p29", "text": "Cest dans un tel monde que Jésus est venu! L’Etat, alors, sappelait Rome! Et les armées d’occupation imposaient une lourde chape de plomb.", "page": 219, "kind": "p"}, {"id": "r40p30", "text": "«Brebis sans berger»! Humanité désorientée, qui ne sait pas ow trouver un «sens» a son existence. Qui nous redonnera le goiit des verts paturages ?", "page": 219, "kind": "p"}, {"id": "r40p31", "text": "Alors, il se mit a les instruire longuement.", "page": 219, "kind": "h"}, {"id": "r40p32", "text": "Le premier service que Jésus rend aux foules désorientées, cest le «service de la Parole». Une fois de plus, Marc ne nous dit pas le contenu de cet enseignement... comme s'il voulait nous suggérer que ce contenu, c’est la personne méme de Jésus.", "page": 219, "kind": "p"}, {"id": "r40p33", "text": "Jécoute... Parle, Seigneur... Longuement...", "page": 219, "kind": "p"}]}, {"id": 41, "title": "17e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 220, "ref": "Jean 6/1.15", "paragraphs": [{"id": "r41p1", "text": "Pendant cing dimanches d’été, nous allons interrompre la lecture continue de l’évangile selon saint Marc, pour lire le fameux chapitre sixiéme de saint Jean. Il s’agit du long récit sur le Pain de Vie... qui commence par la « multiplication des pains», et qui se poursuit par le «discours sur le Pain de Vie». Saint Jean nous y livre une méditation, mise oe la bouche méme de Jésus, sur l’Eucharistie et sur la Oi.", "page": 220, "kind": "p"}, {"id": "r41p2", "text": "De lautre cété du lac... une grande foule le suivait, parce qu'elle avait vu les signes qu'il accomplissait en guérissant les malades.", "page": 220, "kind": "h"}, {"id": "r41p3", "text": "La fin de cette histoire (Jean 6/66) va mettre en évidence que cette foule, avide de miracles, est une foule « incroyante», qui va refuser de suivre Jésus dans la foi.", "page": 220, "kind": "p"}, {"id": "r41p4", "text": "AUJOURD’HUI encore, nous sommes friands de «merveilleux», comme ces foules de Galilée: les miracles, méme ceux de Jésus, peuvent devenir un piége, une fausse piste pour la foi authentique. Aide-nous, Seigneur, a Te suivre jusqu’au bout, y compris et surtout dans le « quotidien», dans la banalité sans prodiges de chaque jour. Et fais-nous comprendre, Seigneur, la « signification» que Tu donnais a tes miracles, bien au-dela du sensationnel.", "page": 220, "kind": "p"}, {"id": "r41p5", "text": "C’était un peu avant la Paque, qui est la grande féte des juifs.", "page": 220, "kind": "h"}, {"id": "r41p6", "text": "Lallusion a la proximité de la Paque... ainsi que la formule de bénédiction des pains que Jésus utilisera tout a ’heure (« eucharistésas », en grec)... montre déja la « signification » que Jean désire donner a la multiplication des pains: il pense évidemment a l’Eucharistie. Quand il écrit ce récit, Jean célébre l’eucharistie, paque des chrétiens, depuis quarante ou cinquante ans... depuis que Jésus a vécu la derniére Céne comme un repas pascal.", "page": 220, "kind": "p"}, {"id": "r41p7", "text": "Jésus leva les yeux et vit qu'une foule nombreuse venait a lui. Il dit a Philippe: «Oud pourrions-nous acheter du pain pour quiils aient 4 manger ? » Il disait cela pour le mettre a l’épreuve, car lui-méme savait bien ce quill allait faire.", "page": 221, "kind": "h"}, {"id": "r41p8", "text": "Dieu est amour: Jésus nous montre Dieu. Jésus voit les besoins des hommes... Le miracle qu'il va faire est un geste d'amour. Le don de l’eucharistie est un geste d’amour. Prenons d’abord le temps d’écouter la question de Jésus. Elle est toujours d’actualité. Oui, Tu nous demandes, Seigneur, de regarder la faim des hommes, leurs besoins les plus naturels... « qu’ils aient A manger», dis-Tu... 4 manger, tout simplement! Et nous qui révons si souvent d’un Dieu lointain, dans les nuages. C’est Toi, Seigneur, qui nous raménes a notre vie «quotidienne», a notre «pain quotidien». Aimer... C’est la, dans \"humble service, qu’il nous faut aimer.", "page": 221, "kind": "p"}, {"id": "r41p9", "text": "Philippe lui répondit : « Le salaire de 200 journées ne suffirait pas pour que chacun ait un petit morceau de pain.» Un de ses disciples, André, le frére de SimonPierre , lui dit: «Il y a la un jeune garcon qui a 5 pains d’orge et 2 poissons, mais qu’est-ce que cela pour tant de monde? »", "page": 221, "kind": "h"}, {"id": "r41p10", "text": "Devant les grands problémes humains, la «faim», la « paix», la «justice», nous refaisons toujours cette méme réponse: « Qu’y pouvons-nous ? Cela nous dépasse».", "page": 221, "kind": "p"}, {"id": "r41p11", "text": "Effectivement, je ne peux pas, seul, résoudre l’ensemble du probleme. Mais suis-je dispensé, pour cela, de faire au moins un geste en direction de ce qui est nécessaire ? Suisje dispensé de rejoindre les groupes ou associations qui travaillent déja A résoudre ces problémes?", "page": 221, "kind": "p"}, {"id": "r41p12", "text": "Il est remarquable, en tout cas, que Jésus, ce jour-la, n’a pas voulu faire une sorte d’acte créateur «a partir de rien» (et il en était capable aprés tout!). Il a pris des aliments préparés et fabriqués par des hommes. Et cela nous rappelle que Dieu, habituellement, ne nous remplace pas. Par ailleurs, une autre condition indispensable a la multiplication des pains, c’est que ce jeune garcon accepte de donner ce quill avait pour lui tout seul au départ.", "page": 221, "kind": "p"}, {"id": "r41p13", "text": "Par ces détails, le Dieu de Jésus-Christ nous interpelle AUJOURD’HUI. I] arrive que les hommes accusent Dieu de la « faim» qui tenaille les deux tiers de ’humanité. Jésus nous renvoie a notre responsabilité. Dieu ne se substitue pas normalement a sa créature. Nous appartenons au monde occidental, dont les supermarchés regorgent de nourritures. Et nous continuons a stocker, 4 amasser, a nous plaindre. Et nous continuons a réclamer la spirale sans fin du confort, l’'accroissement des revenus et des profits. Et nous refusons que léventail des salaires se resserre pour diminuer la fortune des privilégiés. et augmenter celle des défavorisés. On pourrait paraphraser ce récit évangélique en disant: «Il était une fois un jeune garcon qui avait cing pains et deux poissons, alors que cinq mille personnes n/avaient rien a manger. II garda pour lui tout seul ses cinq misérables petits pains, et alla les manger a lécart de la foule, en cachette. »", "page": 222, "kind": "p"}, {"id": "r41p14", "text": "Le pire, c'est que nous, nous ne mangeons pas en cachette. Les affamés du monde savent, aujourd’hui, que nous n’/avons jamais faim.", "page": 222, "kind": "p"}, {"id": "r41p15", "text": "Jésus dit: « Faites-les asseoir.» Il y avait beaucoup @herbe a cet endroit. Ils s’assirent donc, au nombre d’environ 5.000 hommes. Alors Jésus prit les pains, et aprés avoir « rendu grace»), les leur distribua; il leur donna aussi du poisson, autant qu’ils en voulaient.", "page": 222, "kind": "h"}, {"id": "r41p16", "text": "C’était bien le bon sens qui faisait dire A André : « Qu’est-ce que cela pour tant de monde?» Mais, précisément, sans rien négliger de la « raison» humaine, Jésus demande toujours... le dépassement de la « foi» : ce beau risque, ce saut dans la confiance envers un autre. Le «croyant» devient ainsi associé de Dieu, pour des actions qui dépassent infiniment les moyens humains.", "page": 222, "kind": "p"}, {"id": "r41p17", "text": "Jésus a « rendu grace» (« eucharistésas»). Jésus est dans le registre de la foi, de la relation au Pére. Tel est son sentiment, a cet instant. Le discours sur le « pain de vie», qui va suivre, va nous montrer que Jésus pensait a linoui mystére du repas pascal qu’ allait un jour offrir aux hommes de tous les temps. Jésus ne néglige pas la « faim corporelle », mais il songe surtout a la « faim de Dieu», qui est tellement plus grave encore, A ses yeux.", "page": 222, "kind": "p"}, {"id": "r41p18", "text": "Quand ils eurent mangé a leur faim, il dit de ramasser les morceaux qui restaient, aprés le repas...", "page": 223, "kind": "h"}, {"id": "r41p19", "text": "Ceci nest pas un détail accessoire. Cette surabondance marquait déja autre repas de noce, a Cana, oti Jésus avait multiplié le vin!", "page": 223, "kind": "p"}, {"id": "r41p20", "text": "Multiplier le « pain» et le «vin»! Décidément, Jésus voyait plus loin que ces foules galiléennes, ou que ces convives de Cana en Galilée. Le pain et le vin de Dieu sont destinés a tous les hommes. Mais qui en a vraiment faim et soif? On ramasse les restes... J’imagine ces corbeilles pleines (douze!)... Qui donc aurait pu étre la pour les manger, et qui n’était pas la?", "page": 223, "kind": "p"}, {"id": "r41p21", "text": "A la vue du «signe» que Jésus avait accompli, les gens disaient: « C’est vraiment lui le grand Prophéte, celui qui vient dans le monde.»", "page": 223, "kind": "h"}, {"id": "r41p22", "text": "Les hommes de tous les temps attendent toujours «lhomme providentiel», la «solution miracle», qui les dis-penserait de prendre leurs responsabilités. Nous restons toujours, au fond, avec des mentalités d’hommes primitifs qui espérent que des « formules magiques» vont résoudre leurs difficultés. On ne se livre plus aux rites, mais on se laisse prendre aux slogans, aux promesses folles, aux idéologies qui entretiennent la magie du « progrés», des «lendemains qui chantent»: changeons les structures, et tout sera résolu... disent les magiciens. Changez vos cceurs, dit Jésus. Alors les changements de structures seront autre chose qu’un changement d’esclavage.", "page": 223, "kind": "p"}, {"id": "r41p23", "text": "Mais Jésus savait qu’ils étaient sur le point de venir le prendre de force et faire de lui leur roi; alors, de nouveau, il se retira, tout seul, dans la montagne.", "page": 223, "kind": "h"}, {"id": "r41p24", "text": "La tentation «politique» des contemporains de Jésus n’a rien d’anachronique, elle nest pas un phénoméne du passé. Quand serons-nous guéris de nos fiévres pseudomessianiques? Quand comprendrons-nous, décidément, que Jésus a toujours refusé de se laisser « enfermer» dans les perspectives « temporelles»... non pas que le « temporel» soit sans valeur, mais parce qu’on ne peut réduire homme a cette dimension. Dieu nous crie sans cesse, comme le vieux philosophe Diogéne: «Vous ne serez jamais heureux d’étre seulement des cochons gavés». La faim essentielle de homme rest pas la faim de pain. Ne vous dispensez pas de vos taches humaines, ni des décisions politiques, sociales, économiques, que vous avez a prendre. Mais, de grace, n’oubliez pas que la plus grande dignité de homme est sa merveilleuse capacité de s’ouvrir sur la transcendance, sur Dieu. De grace, dit Dieu, faitesmoi jouer mon réle, celui que je suis seul ¢ apouvoir jouer «pour vous», pour votre faim.", "page": 224, "kind": "p"}, {"id": "r41p25", "text": "Jésus refuse le projet de «libération» politique, ot ses contemporains voudraient lentrainer. Au bord du triomphe et du succés, «il se retire seul». Il songe a cet autre réle qu'il veut jouer... demain matin, 4 ces mémes foules, il essaiera de faire comprendre « Qui» il est: le « vrai Pain de la vraie Vie».", "page": 224, "kind": "p"}, {"id": "r41p26", "text": "Mais qui a faim de Dieu? Le chapitre six de saint Jean se terminera par la dramatique solitude de Jésus avec les Douze (Jean 6/66.71).", "page": 224, "kind": "p"}]}, {"id": 42, "title": "18e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 225, "ref": "Jean 6/24.35", "paragraphs": [{"id": "r42p1", "text": "Pain de Vie (1)", "page": 225, "kind": "p"}, {"id": "r42p2", "text": "Jésus n’a pas accepté le triomphe politique qu’on lui proposait, aprés la « multiplication des pains».", "page": 225, "kind": "p"}, {"id": "r42p3", "text": "La foule s’apercut que Jésus n’était pas au bord du lac, ni ses disciples non plus. Les gens prirent des barques et se dirigérent vers Capharnaiim a la recherche de Jésus. L’ayant trouvé «sur lautre rive))...", "page": 225, "kind": "h"}, {"id": "r42p4", "text": "Triomphe politique, nourritures terrestres: sur une rive, la rive humaine... Mais pour trouver vraiment Jésus, il faut le «chercher» sur une autre rive... Alors va commencer le long discours sur le « Pain de Vie» qui remplit le chapitre sixiéme de saint Jean, et que nous lirons pendant les quatre dimanches 4 venir.", "page": 225, "kind": "p"}, {"id": "r42p5", "text": "Ce long discours, si différent de ce que nous avons lhabitude d’entendre des lévres de Jésus dans les trois évangiles synoptiques, est-il vraiment de Jésus, ou de saint Jean ? La question se pose depuis les premiers Péres de l’Eglise. Les éxégeétes les plus sérieux d’aujourd’hui, respectant la tradition, résument ainsi la « réponse» :", "page": 225, "kind": "p"}, {"id": "r42p6", "text": "« Nous inclinons a penser que la substance du discours sur le pain de vie remonte certes a Jésus, mais que la pensée du Maitre nous est livrée a travers les explications que l'évangéliste luirméme a cru devoir ajouter en partant de la pratique de l’Eglise» (A. Feuillet).", "page": 225, "kind": "p"}, {"id": "r42p7", "text": "« Ce que Jésus a réellement dit nous est rapporté avec des mots, des formules, des agencements, qui ont été refondus par l’évangéliste. Ecrivant sous l’inspiration du Saint-Esprit, saint Jean transmet fidélement l’enseignement de Jésus, mais non pas a la maniére d’une bande magnétique. Dans sa longue méditation de disciple fidéle, il a assimilé \" »nseignement du Maitre, et il le livre a travers ses mots a ui. Il est a la fois témoin, et inspiré» (A. Dégeest).", "page": 225, "kind": "p"}, {"id": "r42p8", "text": "« Amen, amen, je vous le dis, vous me cherchez, non pas parce que vous avez vu des signes, mais parce que vous avez mangé du pain et que vous avez été rassasiés. »)", "page": 226, "kind": "h"}, {"id": "r42p9", "text": "Jésus s’adresse a des paysans galiléens qui peinent pour gagner leur vie. Ils savent ce que c’est que la faim, et le rassasiement quand on a bien travaillé, et que la récolte a été bonne. Comme avec la Samaritaine prés du puits, Jésus prend pour point de départ, un besoin matériel de ses auditeurs: symboles trés simples... la faim, la soif, le pain, eau... °", "page": 226, "kind": "p"}, {"id": "r42p10", "text": "Le diagnostic de Jésus sur ces paysans est a la fois cruel et juste: ce quills attendent, ce ne sont pas les «signes du Royaume», mais les «avantages matériels» quiils pourraient en retirer. Ce diagnostic est toujours d’une brilante actualité. Ces pauvres paysans étaient sans doute moins « matérialistes» que nous AUJOURD’HUI: si nous acceptons de nous laisser remettre en cause par le «diagnostic» de Jésus, ne découvrons-nous pas que, nous aussi, nous avons faim d’argent, de pouvoir, de considération, de sécurité, de confort, d’évasion. Quand Jésus « arrange nos problémes», nous sommes préts a continuer a le suivre... mais sil nous propose des «signes déconcertants» de son Royaume, qui ne nous conviennent pas, ne sommes-nous point préts a Le lacher?", "page": 226, "kind": "p"}, {"id": "r42p11", "text": "Ne travaillez pas pour la nourriture qui se perd, mais pour la nourriture qui se garde jusque dans la vie éternelle, celle que vous donnera le Fils de 'homme, lui que le Pére a marqué de son empreinte. »", "page": 226, "kind": "h"}, {"id": "r42p12", "text": "Jésus se sert de la comparaison de la nourriture pour faire comprendre ce qu'il apporte a lhumanité. Il y a deux espéces de vie, et deux espéces de nourriture: la nourriture corporelle, qui donne une «vie périssable»... et la nourriture venue du ciel, qui donne la « vie éternelle». Créé par Dieu, et fait pour Dieu, ’homme a faim et soif de Dieu. Rien, en dehors de Dieu, ne peut le satisfaire entiérement. Toutes les nourritures terrestres laissent létre humain inassouvi. Jésus ne nous invite pas a mépriser le «pain quotidien», mais a désirer aussi le «pain de la vie éternelle». Jésus ne nous demande pas de devenir paresseux dans le «travail» nécessaire a la vie de la cité humaine, mais il voudrait que nous «travaillions» avec la méme ardeur a rechercher une vie qui ne sera pas périssable! A la différence du Bouddha, Jésus n’invite pas a supprimer nos désirs, mais au contraire, a les amplifier: ne vous contentez pas de désirer le petit bout de vie éphémére qui est le vétre naturellement... allez jusqu’a désirer une vie éternelle, et faites ce qu’il faut pour cela, pour en vivre dés maintenant !", "page": 226, "kind": "p"}, {"id": "r42p13", "text": "« Que faut-il faire pour travailler aux ceuvres de Dieu ? » Jésus répondit: « L’ceuvre de Dieu, c’est que vous croyiez en Celui qu'il a envoyé.»", "page": 227, "kind": "h"}, {"id": "r42p14", "text": "Ici commence une révélation fantastique.", "page": 227, "kind": "p"}, {"id": "r42p15", "text": "Cette nourriture essentielle dont ’homme a faim, c’est Luiméme, Jésus! Audace méme, prétention folle, mais vérifiée des milliards de fois depuis deux mille ans. «Que vous croyiez!» Voila ’oeuvre de Dieu en nous. Croire, avoir la foi, c’est travailler avec Dieu, c’est coopérer avec Dieu qui veut nous donner Sa vie éternelle!", "page": 227, "kind": "p"}, {"id": "r42p16", "text": "« Quel signe vas-tu accomplir pour que nous puissions le voir, et te croire? Au désert, nos péres ont mangé la manne... le pain venu du ciel.» Jésus leur répondit: « Ce n’est pas Moise qui vous a donné le pain venu du ciel; c’est mon Pére qui vous donne le vrai pain venu du ciel.»", "page": 227, "kind": "h"}, {"id": "r42p17", "text": "Ils restent & leurs horizons habituels, ils sont toujours sur la méme rive... Jésus, lui, cherche a éveiller en eux, a partir de leurs besoins matériels, des aspirations plus hautes. Mais nous, AUJOURD’HUI, de quoi avons-nous faim ? Tous les jours, ne nous dit-on pas que nous aurons le bonheur, quand nous aurons acheté telle marque d’appareil ménager, quand nous sucerons tel « chewing-gum», que... nous utiliserons tel déodorant ou tel shampooing!", "page": 227, "kind": "p"}, {"id": "r42p18", "text": "Et Jésus réplique que toutes ces « mannes» ne sont qu’une nourriture matérielle et bien grossiére, animale pourrait-on dire, A cété du bonheur que Dieu veut donner. Avez-vous remarqué combien, dans nos sociétés occidentales, s’amplifie le phénoméne que nous pourrions appeler de «succion»: on voit toute la journée, dans nos rues de ville, les gens sucer, manger, macher, saliver... en particulier sur les patisseries et sucreries de toutes sortes. Les psychanalystes y voient une régression vers le stade enfantin du bébé qui se console de ses peines en sucant son pouce. Mais ne serait-ce pas, plus simplement, le signe qu’on se contente de plaisirs superficiels, épidermiques ?", "page": 228, "kind": "p"}, {"id": "r42p19", "text": "Jésus, évidemment, se place a un tout autre niveau.", "page": 228, "kind": "p"}, {"id": "r42p20", "text": "Seigneur, creuse en nous la faim de |’essentiel.", "page": 228, "kind": "p"}, {"id": "r42p21", "text": "Le Pain de Dieu, c’est celui qui descend du ciel et qui donne la vie au monde.", "page": 228, "kind": "h"}, {"id": "r42p22", "text": "Nous laisserons-nous prendre a la contemplation mystique de ce que ces mots suggérent? Nous sommes faits pour Dieu. Que nous le voulions ou pas, notre faim, c’est une faim de Dieu. « Pourquoi dépensez-vous de largent pour ce qui ne rassasie pas?» disait déja le prophéte Isaie (53/1.3). Et saint Augustin avouait, aprés avoir recherché tous les plaisirs de la terre: « Mon cceur est sans repos, tant qu’il ne repose pas en Toi, Seigneur. »", "page": 228, "kind": "p"}, {"id": "r42p23", "text": "Oui, notre coeur est si grand que rien ne pourra jamais le combler, sinon Dieu lui-méme... pour lequel il a été fait. Le désir, qui renait toujours, aprés chaque rassasiement partiel, est le signe de cette quéte infinie.", "page": 228, "kind": "p"}, {"id": "r42p24", "text": "«Le pain qui descend du ciel», c’était la manne, une nourriture mystérieuse, comme nous le rappelle la premiére lecture de ce dimanche: « Qu’est-ce que c’est? Mann hou?» On attendait pour les temps messianiques le retour du prodige rassasiant. Mais Jésus, reprenant une ancienne et traditionnelle interprétation, considére la manne. du temps de Moise comme le symbole d’un «don supérieur», d’un «aliment céleste»: la Parole de Dieu. D’aprés le Deutéronome, en effet, le but profond du miracle de lExode ne fut pas de nourrir matériellement les Hébreux au désert, mais de les habituer 4 «croire» en Dieu: «homme ne vit pas seulement de pain, mais de tout ce qui sort de la bouche de Dieu» (Deutéronome 8/2.3). Jésus a repris cette formule du Deutéronome pour dire a Satan que le «pain matériel» ne suffit pas. Ce rapprochement nous montre que le Christ du Quatriéme Evangile selon saint Jean n’est pas fondamentalement différent du Jésus historique dépeint par les autres évangiles (Matthieu 4/4; Luc 4/4). Jésus y proclame de la méme maniére que sa doctrine, ou mieux encore, sa personne est une nourriture: \"homme ne vit pas seulement de pain, mais de la Parole de Dieu.", "page": 228, "kind": "p"}, {"id": "r42p25", "text": "Ils lui dirent alors: « Donne-nous de ce pain-la, toujours.» Jésus leur répondit: « Moi, je suis le Pain de Vie. »»", "page": 229, "kind": "h"}, {"id": "r42p26", "text": "Lidée que la Parole de Dieu, que les Commandements de Dieu, sont pour ’homme qui les fait siens, une nourriture Spirituelle rassasiante, bien supérieure a l’alimentation courante, se retrouve dans tout Ancien Testament.", "page": 229, "kind": "p"}, {"id": "r42p27", "text": "— Amos 8/11: « Voici venir des jours ot jenverrai la faim dans le pays, non pas une faim de pain, ni une soif d’eau, mais la faim et la soif d’entendre la Parole de Dieu. »", "page": 229, "kind": "p"}, {"id": "r42p28", "text": "— Jérémie 15/16: « Quand Tes Paroles se présentaient, je les dévorais. Elles étaient mon ravissement et l’allégresse de mon coeur.)", "page": 229, "kind": "p"}, {"id": "r42p29", "text": "— Jésus, selon saint Jean (4/32.34). «Jai A manger une nourriture que vous ne connaissez pas: c’est de faire la volonté de Celui qui m’a envoyé.»", "page": 229, "kind": "p"}, {"id": "r42p30", "text": "Celui qui vient 4 moi n’aura plus jamais faim; celui qui croit en moi n/aura plus jamais soif.", "page": 229, "kind": "h"}, {"id": "r42p31", "text": "Saint Paul, dans l’épitre de ce dimanche, nous parle de ces paiens qui «se laissent guider par le néant» (Ephésiens 4/17.24). Quel dommage si nos « patisseries» arrivaient a nous suffire! Donne-nous, Seigneur, ton pain. Voici nos mains tendues...", "page": 229, "kind": "p"}]}, {"id": 43, "title": "19e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 230, "ref": "Jean 6/41.51", "paragraphs": [{"id": "r43p1", "text": "Pain de Vie (2)", "page": 230, "kind": "h"}, {"id": "r43p2", "text": "Jésus avait dit : « Moi, je suis le pain qui est descendu du ciel». Les Juifs récriminaient contre lui: « Cet homme-la r’est-il pas Jésus, fils de Joseph? Nous connaissons bien son pére et sa mére. Alors, comment peut-il dire « Je suis descendu du ciel? »", "page": 230, "kind": "h"}, {"id": "r43p3", "text": "Avec la grande tradition spirituelle de tous les temps, nous pouvons penser qu’aucun détail de YEcriture n’est inutile ou anodin. Que les « premiers auditeurs» de Jésus aient «récriminé», quand ils ’ont entendu parler de la « messe», cela doit avoir une signification. Ce nest pas seulement d’aujourd’hui que des hommes refusent le mystére central de la foi. L’abandon, actuel, de tant de jeunes et de tant d’adultes, n’est pas une nouveauté: c’est commencé du temps méme de Jésus, quand c’était Jésus en personne qui pronongait le sermon et faisait la catéchése!", "page": 230, "kind": "p"}, {"id": "r43p4", "text": "Humblement, sachons d’abord reconnaitre l’énormité de laffirmation de Jésus. Nous devrions reconnaitre que /’incroyant n’est pas un anormal... Il suit tout simplement la «raison» humaine. Cela souligne d’autant plus la « spécificité» de la foi, qui ne peut se réduire a des points de vue rationnels.", "page": 230, "kind": "p"}, {"id": "r43p5", "text": "«Je suis le Pain... le pain descendu du ciel!» Prétention inouie de cet homme, de ce petit charpentier du village d’a cété, dont on connait les parents!", "page": 230, "kind": "p"}, {"id": "r43p6", "text": "Comment Jésus a-t-il réagi, ce jour-la (et AUJOURD’HUI!), devant le refus du «pain du ciel»?", "page": 230, "kind": "p"}, {"id": "r43p7", "text": "«Ne récriminez pas entre vous. Personne ne peut venir a moi, si le Pére qui m’a envové ne [attire vers moi... Il est écrit dans les prophétes: ils seront tous instruits par Dieu.", "page": 231, "kind": "h"}, {"id": "r43p8", "text": "D’emblée, Jésus se place a un autre niveau que la « raison» humaine. C’est ce qu’on a appelé, depuis, le rdle de la « grace», c’est-a-dire l’initiative divine. Il faut, dit-il, une illumination interne de Dieu, la foi, pour comprendre les choses de Dieu, pour «venir vers Jésus». Seul Dieu luiméme peut dire quelque chose sur Dieu. La Transcendance nest pas une petite réalité 4 portée de notre cerveau humain ou de nos appareils scientifiques: Dieu, c’est vraiment le Tout-Autre, l’au-dela de tout. II faut se laisser « instruire» par Dieu lui-méme. Il faut «accueillir le Verbe de Dieu», la Parole qui vient dvailleurs.", "page": 231, "kind": "p"}, {"id": "r43p9", "text": "Nous n’avons sans doute pas encore assez écouté Jésus. Toi, jeune ou moins jeune, qui trouve la messe « inintéressante», laisse-toi débouter de tes petits horizons, entre dans l’aventure. La messe ne sera jamais d’abord un phénoméne culturel, sociologique, esthétique. Si tu n’y vas que parce que «cest intéressant», tu ’abandonneras vite. La messe, c'est le mystére de la « Présence» de la « Shekinnah» en hébreu: c’est-a-dire de «habitation réelle» du Dieu transcendant sur notre terre.", "page": 231, "kind": "p"}, {"id": "r43p10", "text": "Que cherches-tu, quand tu viens a la messe ? De la musique grégorienne ou de la musique moderne? Le refuge de tes positions sécurisantes conservatrices, ou l’exaltation de tes engagements révolutionnaires ? Ces ambiances ne sont pas inutiles. Mais Jésus, lui, nous dit que c’est Dieu que nous devons chercher. Venir vers Jésus est un «don de Dieu», une grace: «tends la main, frére, et garde-la ouverte, recois la manne, accueille le Verbe de Dieu...»", "page": 231, "kind": "p"}, {"id": "r43p11", "text": "Tout homme qui «écoute» les enseignements du Pére vient 4 moi.", "page": 231, "kind": "h"}, {"id": "r43p12", "text": "Jésus a une pensée d’une extréme finesse. Sans entrer dans aucune controverse théologique, sans polémique, il affirme :", "page": 231, "kind": "p"}, {"id": "r43p13", "text": "— le réle eta de la «grace», initiative divine, qu'il faut recevoir..", "page": 231, "kind": "p"}, {"id": "r43p14", "text": "—e rdle essentiel de la «liberté», correspondance humaine, qui demande un effort...", "page": 232, "kind": "p"}, {"id": "r43p15", "text": "Cest le Pére qui «attire», qui « enseigne», qui « propose»... mais homme peut « écouter», et répondre... ou bien fermer loreille et refuser. Ceux-la seuls qui consentent a «écouter l’enseignement du Pére» peuvent entrer dans le mystére du «Pain de Vie».", "page": 232, "kind": "p"}, {"id": "r43p16", "text": "Mais il serait faux de prendre cette formule de Jésus dans un sens restrictif, comme si Jésus disait : «Il y en a peu qui sont attirés par le Pére, et qui recoivent la grace.» Jésus vient de dire avec force: «Ils sont tous instruits par Dieu». Ainsi la différence d’attitude est une différence d’écoute : du cété de Dieu, la grace est donnée a tous... mais du cété des hommes, la liberté peut refuser Dieu. «Il est venu chez les siens, et les siens ne I’« ont pas regu» (Jean 1/11).", "page": 232, "kind": "p"}, {"id": "r43p17", "text": "Nous t’accueillons, Seigneur, voici nos mains tendues...", "page": 232, "kind": "p"}, {"id": "r43p18", "text": "Certes, personne n’a jamais vu le Pére, sinon celui qui vient de Dieu: celui-la seul a vu le Pére.", "page": 232, "kind": "h"}, {"id": "r43p19", "text": "Jésus prétend bien, et de facon absolument claire, nous apporter autre chose qu’une idéologie, ou une morale, ou une esthétique, ou une politique. Il est Pirruption dans lhistoire humaine d’une «Personne Divine»: il affirme « venir de Dieu», et étre «le Seul» a connaitre vraiment Dieu! Il est, en conséquence, la Présence Réelle de Dieu a notre monde. Ne nous étonnons pas, dés lors, que la messe soit vertigineuse. C’est le lieu de la rencontre de I'Invisible, de ?Absolu, de Dieu. C’est donc laventure par excellence, qui demande un prodigieux dépassement de nos points de vue habituels. La messe est une «bréche»... une ouverture mystérieuse dans le mur de notre raison raisonnante, qui peut nous introduire dans le domaine (oh! combien caché!) de Dieu.", "page": 232, "kind": "p"}, {"id": "r43p20", "text": "«Personne n’a jamais vu Dieu!»", "page": 232, "kind": "p"}, {"id": "r43p21", "text": "Jésus ne ménage pas ses mots. Il met la barre trés haut... L’exploit de la rencontre, si l’on surmonte la difficulté, sera ardu. L’eucharistie, le Pain de Vie, ce n’est pas des fariboles, disait Péguy, ni une de ces banalités 4 portée de nos mains. Il faut chercher au-dela du «visible»: personne n’a jamais vu! Alors, peut-étre, verrons-nous un peu mieux en fermant carrément les yeux... pour éviter toute distraction dans le «visible», et nous concentrer sur «Tinvisible»...", "page": 232, "kind": "p"}, {"id": "r43p22", "text": "Celui qui croit en moi a la vie éternelle... je le ressusciterai au dernier jour...", "page": 233, "kind": "h"}, {"id": "r43p23", "text": "Mots étonnants, presque insoutenables, quand on sait quils ont été ditss un jour, sur les bords d’un petit lac de notre terre, A Capharnaiim, par un homme qui avait toutes les apparences d’étre «comme tout le monde».", "page": 233, "kind": "p"}, {"id": "r43p24", "text": "Lirruption de Dieu dans homme, comment ne provoquerait-elle pas des choses étonnantes... aussi étonnantes, aprés tout, que la « premiére création» a partir de « rien». Notons le « présent» : il.a_la vie éternelle. Et le «futur»: je le ressusciterai.", "page": 233, "kind": "p"}, {"id": "r43p25", "text": "Moi, je suis le pain de la vie.", "page": 233, "kind": "h"}, {"id": "r43p26", "text": "Nous retrouvons ici cette énorme affirmation biblique, qui définit Dieu comme « Celui qui est= YaHVeH». C’est le fameux tétragramme ineffable, les quatre lettres (car on nécrit que les consonnes, en hébreu) qu’aucun juif ne prononce jamais, mais qu’il remplace par Adonai, le Seigneur. Or Jésus, lui, ose dire «Je suis»!", "page": 233, "kind": "p"}, {"id": "r43p27", "text": "Je suis le Pain de Vie!", "page": 233, "kind": "p"}, {"id": "r43p28", "text": "Au désert, vos péres ont mangé la manne, et ils sont morts; mais ce pain-la, qui descend du ciel, celui qui en mange ne mourra pas. Je suis le « Pain vivant», qui est descendu du ciel: si quelqu’un mange de ce pain, il vivra éternellement.", "page": 233, "kind": "h"}, {"id": "r43p29", "text": "Il n’est ici question que de « vie»! Jésus, aprés avoir parlé du «pain de vie» (0 artos tés zdés), parle maintenant du «pain vivant» (o artos o z6n).", "page": 233, "kind": "p"}, {"id": "r43p30", "text": "Le premier livre de la Bible (Genése 3/22) affirme que homme (« adam» en hébreu) était fait pour l’immortalité, par un «arbre de vie» dont il pouvait manger les fruits divins. Et le dernier livre de la Révélation (Apocalypse 2/7) affirme qu’a l’achévement de la création, il n’y aura plus de mort: «au vainqueur, je ferai manger de l’arbre de vie dans le jardin de Dieu.» C’est la reprise et la réussite du plan primitif de Dieu.", "page": 233, "kind": "p"}, {"id": "r43p31", "text": "Or Jésus, aux paysans de Galilée, et 4 nous aujourd’hui, affirme que cette immortalité, cette «vie sans mort», est déja donnée par la foi, A ceux qui mangent, non plus « Iarbre de Vie», mais le « pain de Vie» qu'il est luiiméme! On pourrait objecter que ceux qui communient a Jésus meurent comme tout le monde. Mais, précisément, nous ne sommes plus dans le domaine humain, dans le niveau des choses « visibles »: personne n’a jamais vu invisible... personne ne peut prouver qu'il n’y a pas une «vie» invisible. Ce rest pas de l’ordre du «rationnel». Mais pourquoi ne nous laisserions-nous pas «enseigner par le Pére»? Et pourquoi ne lui ferions-nous pas confiance ?", "page": 234, "kind": "p"}, {"id": "r43p32", "text": "Refuser cette «offre» surhumaine, c’est se priver, dés maintenant, de cette Vie, c’est se croire voué au néant, a cette finitude qui est évidemment le propre de homme (« tout ce qui est né de la chair n’est que chair», Jean 3/6). Pourquoi Dieu n’interviendrait-il pas pour nous « donner» sa propre Vie, absolue, éternelle?", "page": 234, "kind": "p"}, {"id": "r43p33", "text": "Voici nos mains tendues, pour accueillir ce don.", "page": 234, "kind": "p"}, {"id": "r43p34", "text": "Le pain que je donnerai, c’est ma chair, donnée pour que le monde ait la vie.", "page": 234, "kind": "h"}, {"id": "r43p35", "text": "Le don de, Dieu, invisible en soi, est devenu visible en Jésus-Christ. L’amour de Dieu, fantastique, mais caché, sest montré, est devenu «sensible»: c’est Jésus crucifié, c’est sa chair et son sang sacrifiés. Le Verbe de Dieu ne nous a pas parlé seulement par des « mots», mais’ par un: «acte»: le don de sa chair, de son corps livré... signe d'amour total!", "page": 234, "kind": "p"}, {"id": "r43p36", "text": "Accueillons le Verbe de Dieu qui nous donne sa chair et devient notre vie.", "page": 234, "kind": "p"}]}, {"id": 44, "title": "20e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 235, "ref": "Jean 6
