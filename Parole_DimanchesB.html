/51.58", "paragraphs": [{"id": "r44p1", "text": "Pain de Vie (3)", "page": 235, "kind": "p"}, {"id": "r44p2", "text": "Dieu est «un», et sa Parole est « une», c’est-d-dire comme ramassée en une seule émission de voix: Dieu pense toutes les choses en un seul «mot», son Verbe, parfaitement « un». Mais cette Parole Unique et Une, et simple, se diffuse en une multitude de vérités diverses, en paroles humaines variées. Un peu comme la lumiére blanche, en son unité, contient toutes les couleurs de l’arc-en-ciel, si différentes, quand elles s’étalent en passant par nos prismes. Ne nous étonnons donc pas qu’on puisse donner « plusieurs» interprétations du mystére du Pain de Vie. Chacune d’elles est une approche, une facette de l’unique vérité. Le chapitre sixiéme de saint Jean peut se comprendre de quatre maniéres:", "page": 235, "kind": "p"}, {"id": "r44p3", "text": "1° Quelques auteurs anciens ont songé a un sens purement spirituel: le «Pain de Vie», c’est la personne et le message de Jésus qu’on «assimile» par la Foi.", "page": 235, "kind": "p"}, {"id": "r44p4", "text": "2° Un grand nombre d’éxégétes -modernes tiennent au contraire ce discours proprement eucharistique d’un bout a lautre: le «Pain de Vie», c’est lEucharistie qu’on «mange» vraiment dans une sorte de repas réel, oui notre corps entre en Jeu.", "page": 235, "kind": "p"}, {"id": "r44p5", "text": "3° Plusieurs commentateurs professent une opinion moyenne: la premiére partie du discours jusqu’au verset 50, vise la Foi... qui fait qu’on se nourrit de Jésus par la communion a sa pensée et a sa Parole. La deuxiéme partie du discours, qui commence 4 ce verset 51 ou débute la lecture de ce dimanche, vise IEucharistie... qui fait qu’on communie a «sa chair et a son sang» de maniére sacramentelle, dans un « Signe efficace».", "page": 235, "kind": "p"}, {"id": "r44p6", "text": "4° Enfin, pour certains auteurs contemporains, le discours de Jésus vise tout entier également la Foi et l’'Eucharistie. Il y a, en effet, une union trés forte entre ces deux thémes: la Foi totale-au Christ implique la foi en sa « présence» eucharistique, car l’eucharistie est le « mystére de la foi» par excellence... méditer la Parole de Jésus et sa Personne (premiére partie de la messe: liturgie de la Parole), et puis communier a son Corps et a son Sang (deuxiéme partie de la messe: liturgie du Sacrifice) sont dans le prolongement l’un de l'autre. Pourrait-on dire qu’on croit vraiment a Jésus, Fils de Dieu incarné dans la chair, si l'on n’est pas disposé a faire ce qu'il a dit, et a aller jusqu’a « prendre et manger son Corps» ? Il était bien normal que Jésus parle de la Foi, avant de parler plus explicitement de 'Eucharistie, car le mystére de sa Présence ne nourrit vraiment que celui qui croit. On voit importance d’arriver a l’heure 4 la messe. Il faut s’étre nourri, par la foi, de la Parole qu’est Jésus, pour pouvoir se nourrir de Lui dans son corps livré pour nous. Il n’y a pas deux parties dans la messe, dont la premiére serait facultative: dés le début nous «communions» a Jésus, le Verbe de Dieu!", "page": 236, "kind": "p"}, {"id": "r44p7", "text": "Jésus disait: « Moi, je suis le Pain vivant, descendu du ciel: si quelqu’un mange de ce pain, il vivra éternellement. Le pain que je donnerai, c’est ma chair, pour la vie du monde.»", "page": 236, "kind": "h"}, {"id": "r44p8", "text": "Voici donc le verset 51, ot apparait pour la premiére fois un mot nouveau qui va revenir désormais onze fois dans la fin du discours de Jésus: «chair et sang»... «manger et boire»... Ces mots sont d’un grand réalisme. On ne voit pas comment on pourrait en rester A une compréhension seulement symbolique.", "page": 236, "kind": "p"}, {"id": "r44p9", "text": "Les Juifs discutaient entre eux: «Comment cet homme-la peut-il nous donner sa chair 4 manger? »", "page": 236, "kind": "h"}, {"id": "r44p10", "text": "Ils ont compris de la maniére la plus réaliste, et ils sont choqués. S’ils avaient pensé 4 une manducation seulement spirituelle, ils n’auraient pas été choqués.", "page": 236, "kind": "p"}, {"id": "r44p11", "text": "Jésus leur dit alors: « Amen, Amen, je vous le dis: si vous ne mangez pas la chair du Fils de fhomme, et si vous ne buvez pas son sang, vous n’aurez pas la vie en vous. )>", "page": 237, "kind": "h"}, {"id": "r44p12", "text": "Loin d’atténuer le choc, Jésus accentue encore le réalisme de ses paroles... en ajoutant désormais au mot «chair», le mot «sang»... Et il n’est plus question seulement de « manger», mais aussi de «boire»... La communion sous les «deux espéces» fait partie de la grande Tradition qui remonte a Jésus luiiméme, au point qu’on se demande comment on a pu labandonner, et combien de temps il faudra pour que Ilopinion des chrétiens la désire a nouveau. :", "page": 237, "kind": "p"}, {"id": "r44p13", "text": "Cette association des deux mots «chair» et «sang» peut aussi se comprendre de plusieurs maniéres:", "page": 237, "kind": "p"}, {"id": "r44p14", "text": "— dans la mentalité sémitique, cette expression désigne l'homme tout entier, tout ce qui fait la réalité concréte de homme avec ses possibilités et ses faiblesses ;", "page": 237, "kind": "p"}, {"id": "r44p15", "text": "— dans cette méme mentalité de lOrient, le «sang» est sacré, car c’est lui qui est le symbole fantastique de la «vie», si bien qu’on pourrait presque remplacer un mot Pun pour l'autre (« si vous ne buvez pas sa vie, vous n’aurez pas sa vie en vous»).", "page": 237, "kind": "p"}, {"id": "r44p16", "text": "Mais enfin, et surtout, cette séparation des deux éléments, ma chair et mon sang, évoque la maniére dont Jésus, précisément, va mourir: par «séparation de son sang d’avec son corps». Jésus vient de dire: «le pain que je donnerai, c'est ma chair ” livrée” pour la vie du monde»: Pallusion au sacrifice de la croix est claire... Nous plongeons, la, dans la conscience que Jésus avait de la nécessité de son sacrifice pour sauver le monde: il sait qu’il devra « donner » sa vie... - pour que le monde ait la vie...", "page": 237, "kind": "p"}, {"id": "r44p17", "text": "Celui qui mange ma chair et boit mon sang a la vie éternelle, et moi je le ressusciterai au dernier jour.", "page": 237, "kind": "h"}, {"id": "r44p18", "text": "N’oublions pas que Jean a écrit ces mots de son évangile vers l'an 90 ou 100. C’est-a-dire que, depuis soixante ans environ, il célébre leucharistie avec ses assemblées de chrétiens. Comment ses lecteurs d’alors n’auraient-ils pas immédiatement appliqué ces mots a leucharistie qui’ils « mangeaient et buvaient», effectivement, au cours d’un repas d’agape fraternelle. Par ailleurs, si Jésus n/avait jamais parlé ainsi, comment les apdtres, au soir de la Céne, auraient-ils pu comprendre quoi que ce soit 4 ce que Jésus faisait? L’institution de Peucharistie, le soir du Jeudi saint, efit été inintelligible aux Douze, si Jésus ne les y avait jamais préparés, d’une maniére ou d’une autre, préalablement... et méme si, ici, la part rédactionnelle de Jean est importante. Il est bien certain qu’il a mieux compris, aprés coup, ce que Jésus a pu dire ce jour-la, un an environ avant sa Passion... et qu’l a infusé dans son récit toute la compréhension pascale qu'il avait recue des événements ultérieurs.", "page": 237, "kind": "p"}, {"id": "r44p19", "text": "En effet, ma chair est la « vraie» nourriture, et mon sang est la « vraie» boisson.", "page": 238, "kind": "h"}, {"id": "r44p20", "text": "Saint Jean ne racontera pas l’institution de leucharistie, au dernier repas de Jésus, le jeudi soir. Mais nous constatons que le paralléle est trés fidéle avec les synoptiques, Matthieu, Marc et Luc: c’est vraiment le méme évangile, sous des mots différents. N’oublions pas de remarquer un adjectif que Jean aime et utilise souvent, le mot «vrai». Ce mot doit faire tilt en nous. Il signifie: «attention»! c’est la vraie nourriture... une nourriture pas comme les autres! Merci, Seigneur! de nous donner toutes ces précisions, si importantes, pour nous aider a dépasser nos points de vue trop humains, nos points de vue trop étroitement rationnels.", "page": 238, "kind": "p"}, {"id": "r44p21", "text": "Puis, Jésus nous indique trois effets de l'eucharistie :", "page": 238, "kind": "p"}, {"id": "r44p22", "text": "1° LA VIE ETERNELLE ET LA RESURRECTION", "page": 238, "kind": "p"}, {"id": "r44p23", "text": "Qui mange ma chair et boit mon sang a la vie éternelle, et moi je le ressusciterai.", "page": 238, "kind": "h"}, {"id": "r44p24", "text": "L’eucharistie nous fait communier au Christ « ressuscité », vivant dans la gloire du Pére. Et ce Corps vivant (vivant autrement... vivant de la vraie vie...) devient en nous «semence» de cette vie divine. Au soir de la Céne, selon les trois synoptiques, Jésus parlera du « banquet céleste » ou il réunira, A nouveau, ses amis: «je ne boirai plus du fruit de la vigne jusqu’au jour ot je boirai avec vous le Vin Nouveau dans le Royaume de mon Pére...» Le banquet eucharistique est une anticipation du ciel, o4 nous mangerons a la table du Pére, de Jésus, et de Esprit, selon la belle icéne de la Trinité. Oui, nous allons vers cette rencontre bienheureuse. Merci!", "page": 238, "kind": "p"}, {"id": "r44p25", "text": "2° LIMMANENCE RECIPROQUE DU CHRIST", "page": 239, "kind": "p"}, {"id": "r44p26", "text": "ET DU CHRETIEN", "page": 239, "kind": "p"}, {"id": "r44p27", "text": "Qui mange ma chair et boit mon sang demeure en Moi et moi en Lui.", "page": 239, "kind": "h"}, {"id": "r44p28", "text": "Voici encore un mot cher a saint Jean: «demeurer »...", "page": 239, "kind": "p"}, {"id": "r44p29", "text": "Savez-vous ce que c’est que d’étre avec quelqu’un que l’on aime et qui vous aime? D’étre heureux avec lui, avec elle? La vocation de tout homme est de « demeurer avec Dieu, en Dieu». C’est le Théme fondamental de |’Alliance, qui s’est exprimé, au cours de Ihistoire, dans l’Ecriture inspirée, par des formules de plus en plus précises et de plus en plus personnelles et intimes:", "page": 239, "kind": "p"}, {"id": "r44p30", "text": "— «Vous serez mon peuple, et je serai votre Dieu» (Exode 6/7).", "page": 239, "kind": "p"}, {"id": "r44p31", "text": "— «Mon bien-aimé est 4 moi, et je suis a lui» (Cantique des cantiques 6/3).", "page": 239, "kind": "p"}, {"id": "r44p32", "text": "— «Demeurez en moi, comme je demeure en vous» (Jean 6/56 - 15/4).", "page": 239, "kind": "p"}, {"id": "r44p33", "text": "3° LA CONSECRATION AU PERE", "page": 239, "kind": "p"}, {"id": "r44p34", "text": "De méme que le Pére, qui est vivant, m’a envoyé, et que moi je vis par le Pére, de méme aussi, celui qui me mangera vivra par Moi.", "page": 239, "kind": "h"}, {"id": "r44p35", "text": "La préposition traduite ici « par le Pére» posséde en grec des connotations beaucoup plus riches, et que toute traduction ne peut que trahir. II s’agit de la préposition « dia», qui signifie «a travers, a cause de, grace 4». Nous voyons affleurer un de ces mouvements profonds qui anime la personne de Jésus, et que Jean a si bien su deviner : Jésus vit a travers le Pére, grace 4 lui, pour lui... et il nous y invite!", "page": 239, "kind": "p"}]}, {"id": 45, "title": "21e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 240, "ref": "Jean 6/60.69", "paragraphs": [{"id": "r45p1", "text": "Pain de vie (4)", "page": 240, "kind": "h"}, {"id": "r45p2", "text": "Jésus avait dit, dans la synagogue de Capharnaiim: « Celui qui mange ma chair et boit mon sang a la vie éternelle...»", "page": 240, "kind": "h"}, {"id": "r45p3", "text": "Beaucoup de ses disciples, qui avaient entendu, s’écriérent : « Ce qu'il dit la est intolérable, on ne peut pas continuer a lécouter! »", "page": 240, "kind": "h"}, {"id": "r45p4", "text": "Nous arrivons 4 la fin de ce « discours sur le Pain de Vie». Nous allons apprendre, de la plume méme d’un témoin qui y assistait en personne, l’effet du sermon de Jésus sur l’auditoire. Il est double:", "page": 240, "kind": "p"}, {"id": "r45p5", "text": "— cest le scandale et le refus de la grande majorité des gens... ;", "page": 240, "kind": "p"}, {"id": "r45p6", "text": "— mais aussi la fidélité, modeste mais confiante, du petit noyau des « douze»...", "page": 240, "kind": "p"}, {"id": "r45p7", "text": "Nous avons, ici, un témoignage historique de premier ordre sur la vie de Jésus. Les trois autres évangélistes ont noté aussi, de facon trés claire, ce grand tournant dans le ministére du prophéte de Nazareth: c’est la crise! Jusquiici les foules lont suivi et recherché: Jean, ici méme, va jusqu’a les appeler déja des «disciples». Or ces «disciples», qui avaient commencé un bout de chemin avec Jésus, l'abandonnent. La révélation du mystére eucharistique rebute la plupart de ses auditeurs. A la fin de ce chapitre, nous pourrons compter le « petit reste» des disciples.", "page": 240, "kind": "p"}, {"id": "r45p8", "text": "Et lévangile, sans aucune hésitation, ne nous cache pas que Jésus a échoué dans sa tentative de faire comprendre son «Pain», le « vrai» pain. Car enfin, qui mieux que Jésus luiiméme pouvait essayer de nous « expliquer» de quoi il saait ?", "page": 240, "kind": "p"}, {"id": "r45p9", "text": "Et nous continuons, nous, vingt siécles aprés, 4 nous étonner des hommes et des femmes, des jeunes et des adultes, qui renoncent a suivre Jésus jusqu’a « prendre et manger son Pain, a prendre et a boire son Vin, qui sont, dit-il, sa chair et son sang». Et il arrive que nous accusions l’Eglise de cela: Ah! si PEglise n’avait pas chan¢gé si vite... ah! si PEglise changeait plus vite... ah! si ’Eglise prenait telle position, la mienne... En réalité, c’est la « foi» qui est cause de cela, et non pas tel ou tel usage liturgique, culturel, sociologique. Et Jésus va nous le redire avec une clarté sans aucune concession.", "page": 241, "kind": "p"}, {"id": "r45p10", "text": "Jésus connaissait par lui-méme ces récriminations des disciples.", "page": 241, "kind": "h"}, {"id": "r45p11", "text": "Voyez. Il n’a pas besoin d’entendre les récriminations. I] les sait d’avance. Elles ne ’étonnent pas, lui. Il s’y attendait. La «foi» est difficile! Car, la foi, c’est « renoncer au mode de connaissance habituel par les sens et par intelligence rationnelle», pour «faire confiance a un autre»: c’est «croire sans voir», dira Jean de multiples fois.", "page": 241, "kind": "p"}, {"id": "r45p12", "text": "Il leur dit: « Cela vous heurte ? »", "page": 241, "kind": "h"}, {"id": "r45p13", "text": "Eh oui, maitre, cela nous heurte. Et tu le sais bien.", "page": 241, "kind": "p"}, {"id": "r45p14", "text": "Le mot grec, ici traduit par « heurte», est le verbe « scandaliz6»: «cela vous scandalise»... vous «butez sur moi comme sur une pierre d’achoppement».", "page": 241, "kind": "p"}, {"id": "r45p15", "text": "Nous avons toujours tendance a vouloir faire de la « foi», une sorte d’enseignement. Si on leur expliquait bien, ces jeunes viendraient 4 la messe! Ils comprendraient. Ils ne «savent» plus rien! Or, pour Jésus, nous le voyons, la foi heurte! La foi ne va pas de soi! Elle choque. Plus qu’une legon apprise et fidélement répétée, la «foi» est « engagement de vie», la foi est «pratique effective»... la foi est «mise en demeure»: il faut choisir de renoncer a ses propres lumiéres soi-disant scientifiques pour accueillir la révélation d’un autre, qui reste invérifiable par nos propres moyens humains. La vraie « profession de foi», a la limite, ce nest pas de réciter le Credo, ou quelque autre «formule» méme la mieux formulée pour notre esprit moderne, c’est de « faire » ce que Jésus a dit de faire. Et le mystére central de la foi, c’est, sans conteste, l’eucharistie. Quand on dit parfois: «un chrétien c’est celui qui va a la messe», on ne dit pas tout. Mais on dit un certain essentiel, sion comprend la messe comme nous essayons de le faire avec Jésus luisméme. La foi, c’est une «décision». Cette décision comporte bien sir deux aspects : 1° « manger le Pain de Vie »... 2° « vivre de sa vie, qui est amour effectif»...", "page": 241, "kind": "p"}, {"id": "r45p16", "text": "« Cela vous heurte? Et quand vous verrez le Fils de Phomme monter la ow il était auparavant ?»", "page": 242, "kind": "h"}, {"id": "r45p17", "text": "Comment cet homme peut-il nous donner sa Chair a manger ?", "page": 242, "kind": "p"}, {"id": "r45p18", "text": "Cest précisément qu’il n’est pas qu’un homme.", "page": 242, "kind": "p"}, {"id": "r45p19", "text": "Jésus, loin de retirer ses affirmations ou de les expliquer, ou de les atténuer, va les souligner en essayant de nous suggérer encore un autre «mystére» dont le mystére eucharistique n’est que la traduction. Nous sommes, bel et bien, dans le registre de l’incarnation de Dieu, de la « prise de chair» de Esprit.", "page": 242, "kind": "p"}, {"id": "r45p20", "text": "Il s’agit bien d’un mystére « divin» (Dieu que personne n’a jamais vu), et donc incompréhensible par les seules forces humaines. Jésus fait clairement allusion a son « étre» divin: Il va «remonter 1a ot il était auparavant», dit-il.", "page": 242, "kind": "p"}, {"id": "r45p21", "text": "Nous notons le ton interrogatif de Jésus. Sa phrase reste comme inachevée. «Et quand vous verrez le Fils de homme remonter la ow il était auparavant ?...»", "page": 242, "kind": "p"}, {"id": "r45p22", "text": "Oui, il faut, a travers lobscurité, la banalité, la familiarité, de la condition humaine présente de Jésus, parvenir a la découverte de sa Gloire Trinitaire: il est 4 la droite du Pére, dans le mouvement de Vie de lEsprit qu’il recoit du Pére... «De méme que le Pére qui est vivant m’a envoyé et que je vis par le Pére, de méme, celui qui me mangera vivra par moi.»", "page": 242, "kind": "p"}, {"id": "r45p23", "text": "Nous ne savons déja pas ce qu’«est» en réalité la vie! la vie ordinaire des végétaux, ou des animaux. Personne, aucun savant, n’a jamais pu dire ce quest la «vie».", "page": 242, "kind": "p"}, {"id": "r45p24", "text": "Alors, la «vie» de Dieu?", "page": 242, "kind": "p"}, {"id": "r45p25", "text": "Les moyens de connaissance dont homme dispose par luiméme sont impuissants a lui faire percevoir ce mystére. Non! On n’expliquera pas l’eucharistie seulement par la raison humaine: il est grand, il est insondable, le mystére de la Foi!", "page": 243, "kind": "p"}, {"id": "r45p26", "text": "C’est Esprit qui fait vivre, la chair n’est capable de rien.", "page": 243, "kind": "h"}, {"id": "r45p27", "text": "Seigneur Jésus, redis-moi ces mots. Quiils balaient mes scandales et mes doutes.", "page": 243, "kind": "p"}, {"id": "r45p28", "text": "Les paroles que je vous ai dites sont Esprit et elles sont Vie. Mais il y en a parmi vous qui ne « croient pas»). Jésus savait en effet, depuis le commencement, qui étaient ceux qui ne croyaient pas, et celui qui le livrerait.", "page": 243, "kind": "h"}, {"id": "r45p29", "text": "Les paroles de Jésus sur l’eucharistie, plus que toutes les autres, présupposent laction de lEsprit Saint. Nous. sommes vraiment au coeur de l’évangile. Comment, aprés cela, peut-on encore « réduire» Pévangile 4 une prédication morale, méme généreuse: Jésus le plus grand homme, Jésus le sage, Jésus le prophéte, Jésus le révolutionnaire, Jésus le mouvement social, Jésus-libération... Tout cela est vrai. Mais tout cela n’est pas propre a Jésus. Il y a un aspect abrupt de Jésus, irréductible... que nous appelons «divin»! Et donc invisible, au-dela de tout. Visible seulement dans une certaine transparence de son étre humain, qu’ faut un peu deviner «a travers la chair», mais qui est de ordre de Esprit avec une majuscule! et de l’ordre de la Vie avec une majuscule.", "page": 243, "kind": "p"}, {"id": "r45p30", "text": "Et il ajouta: « Voila pourquoi je vous ai dit que personne ne peut venir a moi si cela ne lui est pas donné par le Pére.»", "page": 243, "kind": "h"}, {"id": "r45p31", "text": "Nous sommes bien dans le mystére de la vie de Dieu, vie de trois personnes. L'Icéne de la Trinité de Rublev a merveilleusement traduit ce mystére.", "page": 243, "kind": "p"}, {"id": "r45p32", "text": "Trois personnages sont autour d’une «table», ou est servi une «coupe». L’unité de ces Trois est symbolisée par ce cercle parfait que dessine le contour extérieur de leurs personnes. Ils sont trois pour faire un seul cercle. C’est un cercle vivant, en mouvement. Le Pére, celui qui préside de Pautre cdté de la table, regarde d’un pénétrant regard d’amour vers le coeur, vers la poitrine, de son Fils... qui luicrméme regarde vers lEsprit... Mais regardez bien le visage de ce « troisiéme» personnage, et le mouvement de sa main droite: ils sont tournés vers le sol! Le cercle est «ouvert» vers nous qui sommes la, devant, a regarder cette «image». Oui, la vie Trinitaire nous est offerte, a cette Table: Esprit qui est Vie nous est donné... ou plutét, nous est offert. Dieu, qui est amour, sait bien qu’ill ne peut s imposer.", "page": 243, "kind": "p"}, {"id": "r45p33", "text": "A partir de ce moment, beaucoup de ses disciples s’en allérent et cessérent de marcher avec lui. Alors, Jésus dit aux Douze: « Voulez-vous partir, vous aussi ? » i", "page": 244, "kind": "h"}, {"id": "r45p34", "text": "Je ne vous retiens pas... semble-t-il dire. Vous étes libres! Dans les conflits actuels entre « beaucoup» de disciples qui «sen vont», et ceux qui restent avec Jésus... dans le conflit entre parents et enfants, par exemple... souvenonsnous de cette parole de Jésus: « Voulez-vous partir, vous aussi ?»»", "page": 244, "kind": "p"}, {"id": "r45p35", "text": "Simon Pierre lui répondit: «Seigneur, vers qui pourrions-nous aller? Tu as les paroles de la vie éternelle. Quand a nous, nous croyons, et nous savons que Tu es le Saint, le Saint de Dieu...»", "page": 244, "kind": "h"}, {"id": "r45p36", "text": "Parole pleine d’humilité et de modestie. « A qui irions-nous dautre?» Parole d’amour qui fait confiance: Jésus est «irremplagable» pour eux. Il faut noter cependant que les «douze» avaient fait, la nuit d’avant, une expérience qui pouvait un peu les éclairer : entre la multiplication des pains et ce discours sur le Pain de vie qui est sa Chair, ils avaient vu ce corps «marcher sur les eaux du lac déchainé par la tempéte» (Jean 6/16.21). Ce «Corps»-la, cette Chair-la, n’a pas nos pesanteurs... C’est le Corps sacré du Saint de Dieu. Pourquoi limiterions-nous Dieu 4a ce que nous sommes capables de comprendre ? Il nous dépasse de partout. C’est tellement évident.", "page": 244, "kind": "p"}]}, {"id": 46, "title": "22e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 245, "ref": "Marc 7/1.9 - 13.15 - 21.23", "paragraphs": [{"id": "r46p1", "text": "Les pharisiens et quelques scribes venus de Jérusalem...", "page": 245, "kind": "h"}, {"id": "r46p2", "text": "Pour Marc, les lieux ont une valeur symbolique... Jérusalem, c’est le lieu de lopposition a Jésus. Dans les onze premiers chapitres de l’évangile, pendant toute la premiére partie du ministére de Jésus, chaque fois que Jérusalem est citée, c’est dans un sens hostile: c’est de Jérusalem, capitale politique et religieuse, que viennent toutes les attaques malveillantes... c’est l que, plus tard, les responsables de la nation le condamneront a mort et le livreront aux paiens. Mystére de ton rejet par les hommes, 6 Jésus.", "page": 245, "kind": "p"}, {"id": "r46p3", "text": "En ce sens, mystére de Jérusalem, qui représente le monde entier.", "page": 245, "kind": "p"}, {"id": "r46p4", "text": "Ils se réunissent autour de Jésus et voient quelques-", "page": 245, "kind": "h"}, {"id": "r46p5", "text": "uns de ses disciples prendre leur_repas avec des", "page": 245, "kind": "p"}, {"id": "r46p6", "text": "mains «impures», c’est-a-dire «non lavées». Les pharisiens, en effet, comme tous les juifs, se lavent toujours soigneusement les mains avant de manger, fidéles a la tradition des anciens; et, au retour du marché, ils ne mangent pas avant de s’étre aspergés deau, et ils sont attachés encore par tradition a beaucoup d’autres pratiques: lavage de coupes, de cruches, et de plats.", "page": 245, "kind": "h"}, {"id": "r46p7", "text": "Voila la question. II ne s’agit pas seulement d’hygiéne, mais de pratiques religieuses rituelles sur le «pur et limpur», codifiées par la loi de Moise au livre du Lévitique (11), et considérablement amplifiées et précisées par la tradition.", "page": 245, "kind": "p"}, {"id": "r46p8", "text": "Les pharisiens constituaient une sorte de parti religieux, qu’on aurait tort de considérer comme automatiquement hypocrite. Au contraire, pour demeurer fidéles a la Loi de leurs ancétres, ils tiennent 4 observer scrupuleusement jusqu’au moindre détail de la Tradition: ils avaient dénombré plus de six cents commandements a observer! Dans une recherche de la sainteté, et par un amour délicat de Dieu, ils ne cessaient pas de penser a Dieu, a tout instant du jour, en faisant toutes sortes de choses.", "page": 245, "kind": "p"}, {"id": "r46p9", "text": "« Pourquoi tes disciples ne suivent-ils pas la tradition des anciens? »", "page": 246, "kind": "h"}, {"id": "r46p10", "text": "Il y a plusieurs explications possibles 4 cette attitude:", "page": 246, "kind": "p"}, {"id": "r46p11", "text": "1° Les disciples de Jésus, et Jésus lui-méme, sont des galiléens, des provinciaux, qui, tout en étant eux-mémes des fidéles fervents, avaient di glisser dans leurs coutumes quelques traditions originales, considérées par les « purs» de Jérusalem comme des relachements. On sait que Jésus a souvent défendu les « marginaux», ceux qui étaient mal vus: les pécheurs, les publicains, les prostituées. Jésus avait un sens aigii de la miséricorde et de l’indulgence envers les petits, les pauvres... face aux jugements rigoureux des intransigeants de Jérusalem. Et nous?", "page": 246, "kind": "p"}, {"id": "r46p12", "text": "2° Mais une autre raison semble plus déterminante: Jésus a un sens trés vif de «'universalisme». Il forme peu a peu ses disciples a faire oeuvre missionnaire dans des pays aux cultures différentes du milieu juif traditionnel: les cadres étroits, et trés particuliers, de la religion juive doivent éclater, pour ne garder que lessentiel, afin que les paiens de bonne foi, n’ayant pas toutes ces coutumes alimentaires, puissent adhérer a la Foi. Seigneur, apprends-nous luniversel! Seigneur, aide-nous a distinguer l’essentiel de ton message, de toutes les coutumes traditionnelles des siécles précédents qui rebuteraient les hommes de notre temps sans raison. A une époque de grande mutation culturelle, fais-nous voir, Seigneur, ce qui est immuable et ce qui doit changer... pour que les générations de demain ne soient pas bloquées contre la Foi seulement parce que nous l’aurions trop liée a des «traditions des anciens».", "page": 246, "kind": "p"}, {"id": "r46p13", "text": "3° Mais Jésus va donner, tout a l’heure, une troisiéme raison a ce comportement nouveau qu'il préne: c’est que ces «traditions» ne viennent pas de Dieu, mais simplement «des hommes», des ages précédents. Elles sont donc soumises a évolution.", "page": 246, "kind": "p"}, {"id": "r46p14", "text": "Jésus leur répond: «Isaie a fait une bonne prophétie de vous, hypocrites, dans ce passage de l’Ecriture: Ce peuple m’honore des lévres, mais son coeur est loin de moi. Il est inutile, le culte qu’ils me rendent; les doctrines qu’ils enseignent ne sont que des préceptes humains. Vous laissez de cété le commandement de Dieu pour vous attacher 4a la tradition des hommes.", "page": 247, "kind": "h"}, {"id": "r46p15", "text": "La réplique de Jésus est violente. I! passe a lattaque. Il s’appuie sur lEcriture pour répondre a ceux qui attaquent ses disciples (Isaie 29/13). Les prophétes avaient souvent condamné le formalisme religieux: pour Dieu, ce ne sont pas les gestes extérieurs qui comptent, mais le « coeur». Le culte pour le culte n’a pas de valeur. Le culte doit exprimer les convictions profondes.", "page": 247, "kind": "p"}, {"id": "r46p16", "text": "Jésus appela de nouveau la foule: «Ecoutez-moi tous, et comprenez bien.»", "page": 247, "kind": "h"}, {"id": "r46p17", "text": "Appel de Jésus a Intelligence et a la réflexion. Il ne faut pas reproduire des comportements ou des habitudes seulement parce que ¢a se fait depuis longtemps!", "page": 247, "kind": "p"}, {"id": "r46p18", "text": "Rien de ce qui est extérieur a 'homme et qui pénétre en lui ne peut le rendre impur. Mais ce qui sort de Phomme, voila ce qui rend homme impur.", "page": 247, "kind": "h"}, {"id": "r46p19", "text": "Dans le judaisme, les lois sur la pureté rituelle (les lois du casher) ont de nombreuses incidences sur le régime alimentaire: interdiction de manger la viande de certains animaux (toute charcuterie est impure, par exemple, Lévitique 11)... ou de bétes non saignées (Lévitique 17/10.14). Ces prescriptions rendent impossible toute commensalité entre juifs et non juifs, A moins d’adopter leur maniére de se nourrir. C’était une sorte de barriére qui protégeait de tout contact avec le monde paien.", "page": 247, "kind": "p"}, {"id": "r46p20", "text": "oe lui, déclare que « tous les aliments sont purs» (Marc 19).", "page": 247, "kind": "p"}, {"id": "r46p21", "text": "Ce point de vue devait paraitre, alors, extrémement surprenant, audacieux, et « libre», libertin dirait-on aujourd’hui. Nous savons que, dans lEglise primitive, ce probléme nétait pas encore résolu (Actes 10 - 15).", "page": 248, "kind": "p"}, {"id": "r46p22", "text": "C’est du dedans, du coeur, que sortent les pensées perverses.", "page": 248, "kind": "h"}, {"id": "r46p23", "text": "Ce qui souille vraiment ’homme, ce nest pas ce quill mange, mais ce qu’il pense. L’impureté n’est pas dans la matérialité extérieure de tel ou tel acte, mais dans le coeur! Jésus introduit, ici, dans la morale, un principe absolument essentiel, et qui est loin d’étre réellement appliqué par nos mentalités actuelles: des tabous subsistent, profondément contraires a l’évangile. Des relents d’esprit « cathare» subsistent, qui condamnent le corps et la matiére. Les premiers chrétiens ont da combattre contre le gnosticisme et le manichéisme, qui méprisaient la sexualité : « Tout ce que Dieu a créé est bon et rien n’est pernicieux si on le recoit dans l’action de grace», disait saint Paul (I Timothée 4/4). Notons bien que Jésus ne justifie pas le « subjectivisme», pour autant. Ce serait dénaturer la pensée de Jésus que de voir dans ces paroles je ne sais quelle justification de la «liberté des moeurs»: chacun fait ce que son coeur lui dicte!!! Jésus n’élimine pas la notion de «mal»... il la situe clairement la oti elle est, a lintérieur de ’homme, dans le manque d’amour. C’est le principe fondamental de toute éthique, de toute morale non primaire: il ne suffit pas de faire « tel» geste pour faire automatiquement un péché... le mal n’est pas dans les choses... il est en nous.", "page": 248, "kind": "p"}, {"id": "r46p24", "text": "Oui, notre coeur est une source, d’ou s’écoule l’eau polluée de notre égoisme et l'eau pure de notre amour. D’ot l’impossibilité de juger de lextérieur notre frére, car nous ne voyons pas son coeur, sa conscience intérieure.", "page": 248, "kind": "p"}, {"id": "r46p25", "text": "C’est du coeur que sortent les pensées perverses:", "page": 248, "kind": "h"}, {"id": "r46p26", "text": "— inconduites, vols, meurtres...;", "page": 248, "kind": "h"}, {"id": "r46p27", "text": "— adultéres, cupidités, méchancetés...;", "page": 248, "kind": "h"}, {"id": "r46p28", "text": "— fraude, débauche, envie...;", "page": 248, "kind": "h"}, {"id": "r46p29", "text": "— diffamation, orgueil et démesure...", "page": 248, "kind": "h"}, {"id": "r46p30", "text": "Tel est le seul «catalogue» de péchés qui nous vienne du Christ, a travers la communauté chrétienne primitive. Tous ces péchés se rapportent a l'amour, au prochain. Jésus cite quatre groupes de trois vices. En grec, les six premiers sont au pluriel, et les six autres au singulier, ce qui permet un rythme verbal facile 4 retenir par coeur. Il y a donc douze péchés: le chiffre de la plénitude, hélas! Parce que tout est la: il faudrait aimer! Nous serons jugés sur Pamour, sur le coeur (Matthieu 25).", "page": 248, "kind": "p"}, {"id": "r46p31", "text": "Il est probable que homme d’aujourd’hui n’aime pas beaucoup cette énumération des vices. Notre temps a perdu dans une trés large mesure la conscience de quelque chose qui était fondamental dans toutes les civilisations de l’antiquité: la beauté de la vertu et la laideur du vice.", "page": 249, "kind": "p"}, {"id": "r46p32", "text": "Remarquons combien la morale de Jésus est une morale «universelle». Jésus connait parfaitement le coeur de homme. C’est la morale de base la plus naturelle que Jésus remet en valeur, au-dela des «traditions particuliéres» dune civilisation. Aucune coutume nationale, aucune tradition des ancétres, ne peut aller contre ces lois essentielles que tout homme droit reconnait au fond de son coeur.", "page": 249, "kind": "p"}, {"id": "r46p33", "text": "Frére, ne passe pas trop vite sur cette liste, comme si, d’emblée, elle ne te concernait pas. Demande-toi quelle forme précise prend, pour toi, la cupidité, la méchanceté, la fraude, lenvie, lorgueil, la démesure, etc...", "page": 249, "kind": "p"}, {"id": "r46p34", "text": "Purifie-nous, Seigneur, rends-nous proches de Toi!", "page": 249, "kind": "p"}]}, {"id": 47, "title": "23e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 250, "ref": "Marc 7/31.37", "paragraphs": [{"id": "r47p1", "text": "Jésus quitta la région de Tyr... passant par Sidon, il prit la direction du lac de Galilée... et alla en plein territoire de la Décapole.", "page": 250, "kind": "h"}, {"id": "r47p2", "text": "La description de ces voyages (plus de 100 kilométres !) nest pas aussi naive qu'elle pourrait en avoir lair. Essayons de nous mettre un peu 4 la place de Jésus. Aprés la multiplication des pains (Marc 6/31.44), et ’échec de sa prédication sur le «pain de vie» (Jean 6/66), Jésus, abandonné une fois pour toutes par les grandes foules, s’éloigne de la Galilée et se rend «a létranger», chez les paiens, en Phénicie (Marc 7/24.26), au-dela des frontiéres nord de la Palestine. Tyr et Sidon sont, toujours aujourd’hui, deux grandes villes du Liban. Quittant ce pays, Jésus ne rentre pas en Galilée, il bifurque vers Pest du lac, par les hauteurs du Golan en Syrie, et s’en va vers les « Dix Villes» (Décapole) de Transjordanie, dans ce début du désert qui conduit a 'Irak et a I’'lran, et que traversent aujourd’hui les oléoducs du pétrole du Golfe persique.", "page": 250, "kind": "p"}, {"id": "r47p3", "text": "Jésus, en homme intelligent, s’adapte donc 4 la situation. Il sait qu'il perdrait son temps avec les grandes foules... il va se consacrer désormais a la formation d’un petit groupe de disciples. Et pour cela, il est plus a l’aise a l’étranger.", "page": 250, "kind": "p"}, {"id": "r47p4", "text": "Nous essayons d’imaginer Jésus, campant d’étape en étape, a la belle étoile, entouré d’une vingtaine de personnes peut-étre: douze hommes, et quelques femmes! (Luc 8/1.3). Sur la route, en marchant, ils discutent. Le soir, a l’étape, en faisant la cuisine autour du feu, ils reparlent des événements de la journée.", "page": 250, "kind": "p"}, {"id": "r47p5", "text": "AUJOURD’HUI, ot: les masses humaines, et désormais a l’intérieur de presque toutes les frontiéres, sont redevenues paiennes, l’attitude de Jésus est extrémement significative. Que fait-il, quand il vit en plein milieu paien?", "page": 250, "kind": "p"}, {"id": "r47p6", "text": "On lui améne un sourd-muet (béque), et on prie Jésus de poser la main sur lui.", "page": 251, "kind": "h"}, {"id": "r47p7", "text": "La réputation de Jésus faiseur de miracles sétait déja répandue hors des frontiéres de Palestine. Une SyroPhénicienne était déja venue, ces jours derniers, pour implorer la guérison de sa petite fille. C’est maintenant un sourd-muet qu’on lui améne. On dirait que les paiens sont plus ouverts que les juifs a la personne de Jésus! Auraientils donc, eux, des oreilles pour entendre... alors que les foules galiléennes ont été «sourdes» a ses paroles? Les paiens vont-ils donc étre admis a la Table de Dieu ot est servi le Pain de Vie qulsraél a globalement refusé ?", "page": 251, "kind": "p"}, {"id": "r47p8", "text": "N’oublions pas que Marc écrit son évangile pour des communautés chrétiennes venues du paganisme grécoromain. Il était le secrétaire de Pierre. On comprend quill ait voulu mettre en valeur le fait que Jésus a ouvert, en personne, la « mission aux paiens». Comme dans l’évangile de dimanche dernier sur le « pur et impur», nous retrouvons donc la visée universaliste de Jésus: il ne s’enferme pas dans la culture particuliére d’Israél, il ouvre les portes: son Eglise devra étre «catholique», c’est-A-dire « diverse », «ouverte», « universelle ». Le sommes-nous vraiment? Ne gardons-nous point des particularismes, des racismes? Ne jugeons-nous point durement ceux qui ont d’autres goiits culturels, d'autres maniéres de~prier, que nous? Laisserons-nous, a notre table, un peu de place a l’étranger ?", "page": 251, "kind": "p"}, {"id": "r47p9", "text": "Jésus ’emmena a l’écart, loin de la foule, lui mit les doigts dans les oreilles, et, prenant de la salive, lui toucha la langue..", "page": 251, "kind": "h"}, {"id": "r47p10", "text": "Tous ces gestes sont «significatifs ». Ils ne sont pas la par hasard: Dieu nous parle a travers eux... serions-nous sourds, nous aussi? Que disent ces détails?", "page": 251, "kind": "p"}, {"id": "r47p11", "text": "— Jésus prit le handicapé a l’écart, loin de la foule. En faisant cela, Jésus se différencie profondément de tous les faiseurs de prodiges, de tous les magiciens du monde hellénistique qui cherchaient le sensationnel. Jésus, « Dieu caché», fuit les regards indiscrets, redoute désormais les foules avides de prodigieux, et il se cache, comme pour nous dire qu’il va accomplir un événement transcendant : activité divine est « mystére»! A la fin, il essaiera, vainement, de demander le «secret».", "page": 251, "kind": "p"}, {"id": "r47p12", "text": "— Jésus fait des gestes corporels, presque choquants pour nos mentalités soi-disant spiritualistes. On a tendance, aujourd’hui, 4 gommer cette image de Jésus. Que dirions-nous si un film pris sur le vif nous présentait cette scéne de facon réaliste? Le traducteur, une fois de plus, a cru bon d’édulcorer le texte grec de saint Marc, qui, traduit trés littéralement, donnerait ceci: «Jésus jeta ses doigts dans ses oreilles, et, ayant craché, il toucha sa langue, et ayant levé le regard vers le ciel, il soupira...» Et oui! les sacrements, les signes, de Jésus sont tous des gestes «corporels»! Dieu aurait pu nous transmettre sa grace «de loin», spirituellement, il a, en fait, décidé d’entrer «en contact» avec nous par lhumanité de son Fils « incarné». Si cela nous humilie de tendre la main, de « toucher» le Corps de Jésus, c’est que nous avons perdu le sens de la dignité du «corps», instrument merveilleux de communication et d’amour. Dans Economie de I’Incarnation, la grace la plus divine, la plus spirituelle, la plus invisible, passe par ces humbles gestes «sensibles» que sont tous les sacrements de Jésus: le sourd-muet, lui, n’a pas dai s’embarrasser de nos théories désincarnées... et ressentir comme extrémement révélateurs de la tendresse de Jésus ces gestes si simples et si naturels de contact: le doigt de Jésus dans ses oreilles bouchées, la salive de Jésus sur sa langue «liée»... Par Ton Corps, Jésus, guéris le coeur de homme aujourd’hui! Les premiers Péres de lEglise, pour des fidéles plus proches que nous de la nature, conseillaient aux chrétiens, qui communiaient évidemment sous les deux espéces, de prendre du « vin consacré » sur leurs lévres qui venaient de communier au calice, pour en mettre sur leurs yeux et leurs oreilles, afin de les sanctifier! Il n’est pas nécessaire d’en revenir a ces coutumes traditionnelles des premiers siécles. Mais, au moins, n’édulcorons pas le geste de la communion au Corps du Seigneur. Acceptons de le « prendre» et de le «manger», selon quill I’a dit. Cela correspond parfaitement a notre nature humaine, a la fois corps et ame.", "page": 252, "kind": "p"}, {"id": "r47p13", "text": "Puis, les yeux levés au ciel, il soupira...", "page": 253, "kind": "h"}, {"id": "r47p14", "text": "Ce geste indique que c’est la puissance divine qui va opérer: ce nest pas une intervention de santé de type médical ordinaire. Quant 4 ce «gémissement» de Jésus, il semble bien quill ne faille pas l’interpréter seulement comme une expression de compassion pour le malade, mais comme le mouvement profond de tout létre de Jésus qui respire a fond pour faire appel 4 Dieu, avec la conscience d’un «effort», d’une « tache difficile», d’une opposition trés rude a vaincre. Jésus entreprend de «refaire» la création de Dieu! rien moins que cela! L’>homme abimé va retrouver sa splendeur originelle.", "page": 253, "kind": "p"}, {"id": "r47p15", "text": "Et il lui dit: Effata» , c’est-a-dire « Ouvre-toi».", "page": 253, "kind": "h"}, {"id": "r47p16", "text": "La parole de Jésus est citée par Marc, qui écrit en grec, dans la langue araméenne, qui était celle de Jésus. Notons que, pour ses lecteurs, qui ne comprennent plus la langue maternelle de Jésus, Marc traduit le sens de ce mot « Effata».", "page": 253, "kind": "p"}, {"id": "r47p17", "text": "Remarquons que Jésus ne s’adresse pas aux organes malades, mais au patient luitméme: «Sois ouvert!», ou, plus exactement, « Rouvre-toi! ».", "page": 253, "kind": "p"}, {"id": "r47p18", "text": "Ce rite de l'Effata était pratiqué jadis dans les baptémes: le prétre touchait les oreilles et mettait de la salive sur les lévres de Penfant ou de ladulte.", "page": 253, "kind": "p"}, {"id": "r47p19", "text": "Ses oreilles s’ouvrirent: aussit6t sa langue se délia, et il parlait correctement.", "page": 253, "kind": "h"}, {"id": "r47p20", "text": "Ltilisation de ce rite pour le baptéme montre que, trés tot, ’Eglise a compris ce miracle au niveau symbolique: «les hommes ont des yeux, et ne voient point... ils ont des oreilles et n’entendent point...». Aveuglement, surdité, mutisme: condition de ’homme devant Dieu! Saint Marc va répéter a plusieurs reprises, dans le méme contexte, que ce sont les disciples de Jésus qui sont sourds et muets, qui ne comprennent rien (Marc 8/18 - 6/52 - 7/18).", "page": 253, "kind": "p"}, {"id": "r47p21", "text": "Par le baptéme, c’est Jésus qui agit en personne, qui rencontre un «homme» enfermé en lui-méme, incapable de « communiquer» vraiment, et qui le quérit de fond en comble: il le rend capable d’entendre la Parole de Dieu en la comprenant, et aussi, il lui donne le pouvoir de la redire aux autres. C’est tout le probléme de la Foi. Notre situation naturelle, native, c’est un enfermement en nousmémes, un isolement: homme est « bouché» aux choses de Dieu. Il doit étre « ouvert» par Jésus pour accueillir le mystére du Royaume.", "page": 254, "kind": "p"}, {"id": "r47p22", "text": "Combien de chrétiens, AUJOURD’HUI encore, restent « fermés», bloqués, dans le petit univers de leurs habitudes, dans la petite compréhension de leurs mesquines traditions. Sommes-nous de ceux qui, méme 4a [église, n’ouvrent jamais la bouche, ni pour répondre au célébrant, ni pour chanter, par exemple? Sommes-nous de ceux qui, dans la vie courante, n’osent jamais parler de Dieu, de Jésus, de l’évangile ? :", "page": 254, "kind": "p"}, {"id": "r47p23", "text": "Alors, Jésus leur recommande de nen rien dire a personne; mais plus il le leur défendait, plus ils le proclamaient. Trés vivement frappés, ils disaient: « Tout ce qu'il fait est admirable: il fait entendre les sourds et parler les muets.»", "page": 254, "kind": "h"}, {"id": "r47p24", "text": "Ces mots d’admiration rejoignent le premier récit de la Création: «Dieu vit tout ce qu’ avait fait: c’était trés bon!» (Genése 1/31). Par Jésus, une création nouvelle est en train de paraitre: un homme nouveau est recréé... un homme de « communication», un homme qui sait écouter et parler! Ecouter Dieu. Parler A Dieu. Ecouter ses fréres. Parler a ses fréres. Admirables sont tes ceuvres, Seigneur, maitre de la vie!", "page": 254, "kind": "p"}]}, {"id": 48, "title": "24e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 255, "ref": "Marc 8/27.35", "paragraphs": [{"id": "r48p1", "text": "Les commentateurs de l’évangile selon saint Marc sont unanimes a constater que la page que nous allons méditer est le «sommet» de l’évangile. Jusqu’ici Marc a mené son récit en montrant que tout le monde hésite sur la vraie personnalité de Jésus, le prophéte de Nazareth:", "page": 255, "kind": "p"}, {"id": "r48p2", "text": "— «Qurest-ce que ceci?» (Marc 1/27).", "page": 255, "kind": "p"}, {"id": "r48p3", "text": "— «Jamais nous n’avons rien vu de pareil» (Marc 2/12). — «ll est hors de lui» (Marc 3/21).", "page": 255, "kind": "p"}, {"id": "r48p4", "text": "— «Qui est celui-ci, de fait?» (Marc 4/41).", "page": 255, "kind": "p"}, {"id": "r48p5", "text": "— «Tous stonnaient» (Marc 5/20).", "page": 255, "kind": "p"}, {"id": "r48p6", "text": "— «D’ow vient cela a celui-ci?» (Marc 6/2).", "page": 255, "kind": "p"}, {"id": "r48p7", "text": "— «Cvest un fantéme» (6/49).", "page": 255, "kind": "p"}, {"id": "r48p8", "text": "— <«ll a fort bien fait toutes choses» (Marc 7/37).", "page": 255, "kind": "p"}, {"id": "r48p9", "text": "Oui, la reconnaissance de Dieu en Jésus, comme celle de toute «personne humaine», chemine lentement et progressivement au coeur des libertés, au coeur de ceux qui vivent avec lui et l’observent. Le chemin de la foi est progressif. Est-ce que j'avance ?", "page": 255, "kind": "p"}, {"id": "r48p10", "text": "Jésus s’en alla avec ses disciples vers les villages situés dans la région de Césarée de Philippe. Chemin faisant, il les interrogeait.", "page": 255, "kind": "h"}, {"id": "r48p11", "text": "Césarée de Philippe. C’est précis, localisé. L’évangile n’est pas en lair. Cette contrée, au pied des montagnes de Hermon, est un lieu verdoyant ot les eaux ruissellent des pentes enneigées : les sources du Jourdain sont la. C’est la que Jésus a entrainé ses amis, dans la nature, loin des foules. Il sait ce qu’il veut faire: il va tester la Foi de ses disciples.", "page": 255, "kind": "p"}, {"id": "r48p12", "text": "C’est Lui qui interroge!", "page": 256, "kind": "p"}, {"id": "r48p13", "text": "Et il pose sa question sans raison extérieure, comme cela, en marchant... au bord d’un sentier qui court prés d’un ruisseau, au pied de la montagne.", "page": 256, "kind": "p"}, {"id": "r48p14", "text": "«Pour les gens, qui suis-je ?»", "page": 256, "kind": "h"}, {"id": "r48p15", "text": "Un sondage d’opinion. La Sofrés et I'Ifop passent leur temps a faire des sondages sur ce que pensent les gens des hommes politiques, de l’école, de tel produit.", "page": 256, "kind": "p"}, {"id": "r48p16", "text": "Acceptons-nous, aujourd’hui, la question de Jésus-Christ.", "page": 256, "kind": "p"}, {"id": "r48p17", "text": "Ils répondirent: «Jean Baptiste; pour d’autres Flie; pour d’autres, un des prophétes. »", "page": 256, "kind": "h"}, {"id": "r48p18", "text": "L’opinion publique est donc assez unanime: on prend Jésus pour un trés grand homme! Jean Baptiste ressuscité... ce n’est pas rien. Elie, celui qui devait précéder la venue immédiate du Messie... Jésus est donc pris pour un « porte-parole de Dieu». AUJOURD’HU! encore, la plupart des hommes considérent effectivement Jésus pour un étre exceptionnel. Il faudrait 6tre un ignorant pour affirmer le contraire, ou affecter le dédain. Aucun homme intelligent qui a étudié histoire ne peut nier que Jésus de Nazareth a marqué lhistoire de notre planéte.", "page": 256, "kind": "p"}, {"id": "r48p19", "text": "Il les interrogeait de nouveau: «Et vous, que ditesvous ? Pour vous, qui suis-je ?»»", "page": 256, "kind": "h"}, {"id": "r48p20", "text": "A nous aussi, aujourd’hui, cette question double est posée : Que dit-on de Jésus Christ autour de nous? Pas de réponses toutes faites. Regardez ce que vous avez vécu cette semaine, dans le quartier, le travail, pendant ces derniéres vacances. «Jésus? Je n’en entends jamais parler.».... «Jésus, on s’en moque. Dans un stage sportif ou régnait une absence totale de moralité élémentaire, je me demandais si ce n’était pas moi qui étais anormal de ne pas faire comme eux.»...", "page": 256, "kind": "p"}, {"id": "r48p21", "text": "Mais toi, Jean-Pierre, Monique... x..., que dis-tu de Moi? Vous arrive-t-il d’étre questionné, dans un groupe d'affaires, de loisirs, de travail, sur le contenu de votre foi. Il arrive que nous n’y tenions pas de trop: c’est exigeant. Il arrive que nous vivons souvent de telle maniére qu’il ne viendrait a personne lidée de nous poser cette question... N’est-ce pas inquiétant ? Notre foi en Jésus ne changerait-elle rien a notre vie? comme nous le rappelle assez vertement saint Jacques ( 2/14.18).", "page": 256, "kind": "p"}, {"id": "r48p22", "text": "Pierre prend la parole et répond: « Tu es le Messie. »", "page": 257, "kind": "h"}, {"id": "r48p23", "text": "Il ne suffit pas de rapporter l’opinion des autres.", "page": 257, "kind": "p"}, {"id": "r48p24", "text": "Chacun de nous doit répondre. Quelle « profession de Foi» faisons-nous ? Ainsi, le groupe des Douze, avec Pierre en téte, va bien au-dela des réponses courantes de la grande masse. Ils sont trés « minoritaires »... Personne ne pense a une chose pareille, sauf cette poignée d’hommes.", "page": 257, "kind": "p"}, {"id": "r48p25", "text": "Le titre de « Christos», « Mashiah» en hébreux, « Messie» en francais, est chargé d’un sens quasi explosif en Israél: Point de Dieu, c’est celui qui était attendu pour « achever Phistoire », celui que tous les prophétes annoncaient, celui qui devait donner «le sens de toute vie humaine»...", "page": 257, "kind": "p"}, {"id": "r48p26", "text": "Il leur défendit alors vivement de parler de lui a personne.", "page": 257, "kind": "h"}, {"id": "r48p27", "text": "La traduction a atténué le texte grec. Il faudrait traduire, littéralement: «Il les rabroua afin qu’ils ne disent cela a personne. ». |", "page": 257, "kind": "p"}, {"id": "r48p28", "text": "Le «secret messianique» est un des thémes de Marc. Constamment, Jésus demande qu’on ne publie pas ses «titres» (Marc 1/34 - 1/44.45 - 3/11 - 5/43 - 7/33.36 - 8/26 -8/30). Ce n’est pas une désapprobation de ce titre de «Messie» que Pierre lui confére, mais une mise en garde contre sa divulgation prématurée. L’attente messianique était trop ambigué dans les milieux juifs... nous le verrons dans un instant en écoutant Pierre luirméme. Dieu n’est pas comme nous avons tendance a l’attendre! Dieu ne cherche pas l’éclat, la puissance, la réussite au sens humain du terme. Dieu est caché! Dieu est silence! Dieu s’efface derriére sa création! Saint Paul dira qu'il est « Mystéreenveloppé de silence» (Romains 16/25).", "page": 257, "kind": "p"}, {"id": "r48p29", "text": "Et pour la premiére fois, il leur enseigna qu’il fallait que le Fils de lhomme souffre beaucoup, qu’il soit rejeté par les anciens, les chefs des prétres, et les scribes, qu'il soit tué, et que, trois jours apres, i", "page": 257, "kind": "h"}, {"id": "r48p30", "text": "ressuscite.", "page": 258, "kind": "p"}, {"id": "r48p31", "text": "Voici le grand tournant de lévangile. Jésus, quittant le Galilée va désormais «monter vers Jérusalem», trés consciemment, pour y étre tué! La croix se profile devant le Messie de Dieu. Marc va nous rapporter, par trois fois des annonces de plus en plus précises de la Passion (Marc 8/31 - 9/31 - 10/33). Scandale pour les hommes!", "page": 258, "kind": "p"}, {"id": "r48p32", "text": "Il est historiquement certain que Jésus a trés bien analysé les réactions défavorables a sa prédication, qu'il a préve lissue fatale de sa vie, et quill s'est dirigé consciemment vers une confrontation avec les dirigeants juifs: il cite, ici les trois groupes qui constituaient le Sanhédrin, la plus haute instance religieuse de son temps.", "page": 258, "kind": "p"}, {"id": "r48p33", "text": "«ll commenga a leur dire qu'il faut que...»", "page": 258, "kind": "p"}, {"id": "r48p34", "text": "Il commence 4 leur parler de souffrance, de rejet, d’exclu sion du peuple, de mort violente... et de résurrection! A chaque fois que Jésus leur parlera de cette éventualité, 1 annoncera aussi, par trois fois, sa résurrection... mais. curieusement, les apdtres ne semblent jamais entendre ce dernier mot. Nous non plus, nous n’écoutons jamais Die jusqu’au bout. Et nous continuons a nous bloquer sur le mal du monde, sur nos propres épreuves: comme si ce monde, comme si ces épreuves étaient définitives, comme si la résurrection, la «vie éternelle» n’existait pas... avouons-le!", "page": 258, "kind": "p"}, {"id": "r48p35", "text": "Jésus disait cela ouvertement.", "page": 258, "kind": "h"}, {"id": "r48p36", "text": "Quel dommage, une fois de plus, que la traduction aii édulcoré le texte grec! Il faudrait traduire ainsi: « Avec assurance, Jésus parlait la Parole!» J’ai besoin, Seigneur. de savoir, comme nous le dit Marc, que Tu dis tout cele « avec assurance», sans peur, avec courage. J’ai besoin de savoir que Tu es la Parole de Dieu. A travers cette formule puissante («il parlait la Parole»), je devine que Ta person. nalité n’est pas seulement celle d’un sage, d’un maitre, d’ur grand homme, mais la « Présence» du Verbe de Dieu. « Au commencement était le Verbe, la Parole...» (Jean 1/1).", "page": 258, "kind": "p"}, {"id": "r48p37", "text": "«Il parlait la Parole avec assurance: il faut que le Fils de homme soit tué et qu’il ressuscite...» Ce « il faut» nous fait plonger dans le «dessein éternel et insondable» de Dieu. Jésus, Tu vois ta mort et ta résurrection tout autrement que comme un événement accidentel, c’est le mystérieux plan du Pére. Remarquons, aussi, que nous avons ici, le premier «credo», et de la bouche méme de Jésus.", "page": 258, "kind": "p"}, {"id": "r48p38", "text": "Pierre, le prenant a part, se mit a lui faire de vifs reproches. Mais Jésus se retourna et, voyant ses dis-ciples, il interpella vivement Pierre: « Passe derriére moi, Satan!»", "page": 259, "kind": "h"}, {"id": "r48p39", "text": "La consigne du secret n’était donc pas inutile. Malgré le beau titre que Pierre vient de donner 4 son maitre, il n’a encore rien compris: il attend lui aussi un Messie glorieux, triomphateur selon les normes humaines, un messie politique, un libérateur d’ici-bas... Et nous? Il ne suffit pas de réeciter des «credo» formellement exacts, en francais, ou en latin. Les mots les plus justes peuvent étre chargés d’erreurs, de méme que des mots moins justes formellement peuvent signifier la vérité. A quel Messie croyez-vous ? Estce le « messie» de Pierre, ce jour-la? cet homme providentiel qui rétablirait miraculeusement lordre ici-bas, celui entre les mains duquel nous pourrions démissionner de nos responsabilités humaines ?", "page": 259, "kind": "p"}, {"id": "r48p40", "text": "« Tes pensées ne sont pas celles de Dieu, mais celles des hommes. »", "page": 259, "kind": "h"}, {"id": "r48p41", "text": "Appelant la foule avec ses disciples, il leur dit: «Si quelqu’un veut marcher a ma suite, qu’il renonce a lui-méme, qu’il prenne sa croix, et qu’il me suive. Car celui qui veut sauver sa vie, la perdra; mais celui qui perdra sa vie pour moi et pour l’évangile, la sauvera. »»", "page": 259, "kind": "h"}, {"id": "r48p42", "text": "Jésus vient d’annoncer avec assurance la croix «pour Ul»...", "page": 259, "kind": "p"}, {"id": "r48p43", "text": "immédiatement, il l’annonce aussi « pour nous»... pour ses jisciples. Aprés avoir demandé: « Qui dites-vous que je suis ?», il demande: « Qui dites-vous que vous étes?» Quel sens donnez-vous a votre vie? Pour quoi est faite votre jie? Pour la garder? Ou pour la donner? Pour aimer? Ou... pour quoi?", "page": 259, "kind": "p"}]}, {"id": 49, "title": "25e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 260, "ref": "Marc 9/30.3;", "paragraphs": [{"id": "r49p1", "text": "Jésus traversait la Galilée avec ses disciples, et il n¢ voulait pas qu’on le sache.", "page": 260, "kind": "h"}, {"id": "r49p2", "text": "Nous retrouvons une fois de plus le théme de l’incognito Jésus, incompris et abandonné par les foules, se consacri tout entier, «en privé», a la formation de ses quelque disciples.", "page": 260, "kind": "p"}, {"id": "r49p3", "text": "Parti des régions du Nord, vers Césarée de Philippe, au: sources du Jourdain, Jésus se rapproche donc de Jérusa lem; il traverse la Galilée, ou, il y a quelques mois encore, avait tant de succés, mais un succés ambigu. Cette fois, ne cherche plus a parler en public: il ne s’adresse qu’a se apdétres, embryon de la future communauté chrétienne. Et ce quil va leur dire, c’est, précisément, les «lois» de leu vie en communauté ecclésiale.", "page": 260, "kind": "p"}, {"id": "r49p4", "text": "Car il les instruisait en disant: « Le Fils de Phomm est livré aux mains des hommes...", "page": 260, "kind": "h"}, {"id": "r49p5", "text": "Alors que Jésus ne veut pas qu’on utilise le titre de « Fils d Dieu», il utilise constamment, surtout dans la seconde par tie de son ministére, le titre de « Fils de !homme». Contra rement a ce qu’on pourrait penser a premiére vue, il n s’agit pas d’une insistance sur «lhumanité» de Jésus, Ei fait, les premiers chrétiens, issus du Judaisme, donnaient ; ce titre une signification trés dense: c’était pour eux un désignation du Messie annoncé par Daniel (7/13.14). C Fils d’homme a une origine céleste, il vient sur les nuées di ciel... Il vient au nom de Dieu pour accomplir Poeuvr divine.", "page": 260, "kind": "p"}, {"id": "r49p6", "text": "On voit combien la formule de Jésus veut rectifier Pidé que se faisaient les apdtres, du Messie! Cet «étre divin», venant triomphalement sur les nuées, dont vous révez;; il va étre livré sans défense «aux mains des hommes». Ne vous trompez pas de Messie, ni de Dieu! Jésus vient bien de Dieu... mais pas du Dieu auquel les hommes pensent habituellement.", "page": 260, "kind": "p"}, {"id": "r49p7", "text": "Livré...", "page": 261, "kind": "h"}, {"id": "r49p8", "text": "Un Dieu «livré», un Dieu «donné», un Dieu «amour’... Et non pas un Dieu-tout-puissant potentat... Nous croyons non pas au Dieu-tout-puissant, mais au Pére-tout-puissant, a Celui qui se donne tout entier, A Celui qui se livre pour nous... et dont la croix de Jésus est la «révélation» définitive.", "page": 261, "kind": "p"}, {"id": "r49p9", "text": "Ce mot, «livré pour nous», est un des maitres mots de la théologie primitive. « Livré pour nos fautes, ressuscité pour notre justification» (Romains 4/25).", "page": 261, "kind": "p"}, {"id": "r49p10", "text": "«ll n’a pas épargné son propre fils, mais il l'a livré pour nous tous» (Romains 8/32).", "page": 261, "kind": "p"}, {"id": "r49p11", "text": "«ll m’a aimé et sst livré pour moi!» (Galates 2/20).", "page": 261, "kind": "p"}, {"id": "r49p12", "text": "« Vivez dans amour comme le Christ nous a aimés et s’est livré luirméme» (Ephésiens 5/2).", "page": 261, "kind": "p"}, {"id": "r49p13", "text": "«Le Seigneur Ia livré pour nos péchés» (Isaie 53/2).", "page": 261, "kind": "p"}, {"id": "r49p14", "text": "Ce mot nous est rappelé en chaque eucharistie : « Ceci est mon corps, livré... pour vous!»", "page": 261, "kind": "p"}, {"id": "r49p15", "text": "Ils le tueront, et, trois jours aprés sa mort, il ressuscitera.", "page": 261, "kind": "h"}, {"id": "r49p16", "text": "Cest la seconde annonce de la Passion, depuis que Pierre a fait sa profession de Foi 4 Césarée de Philippe.", "page": 261, "kind": "p"}, {"id": "r49p17", "text": "Tout l’évangile de saint Marc nous achemine vers ce sommet: mort et résurrection. C’est le coeur de notre «credo»: deux faits historiques. Curieuse biographie d’un homme. Ce rn’est pas sa « vie» qui semble importante, mais sa «mort», et sa «survie»! Nous ne pouvons pas ne pas remarquer que cet homme annonce toujours, en méme temps, et impertubablement, qu’ll «re-vivra» aprés sa mort! C’est comme si sa « premiére » vie, celle de Palestine en ce temps-la, n’était pas la plus importante.", "page": 261, "kind": "p"}, {"id": "r49p18", "text": "Sommes-nous vraiment convaincus que Jésus est vivant AUJOURD’HUI ?", "page": 261, "kind": "p"}, {"id": "r49p19", "text": "Le mystére pascal est lessentiel de notre foi.", "page": 262, "kind": "p"}, {"id": "r49p20", "text": "Et c’est le privilege unique et radical de Jésus. Aucun autre grand homme n’a eu la prétention de libérer ’homme de cette ultime fatalité qu’est la mort. Ni Bouddha, ni Mahomet, ni aucune idéologie humaniste, n’ont proposé de solution a cette grande angoisse de lhomme qui sait qu'il va mourir. Seul Jésus, sereinement, simplement, dit: «Ils me tueront, mais je ressusciterai...»", "page": 262, "kind": "p"}, {"id": "r49p21", "text": "C’est la lumiére essentielle sur la mort: Jésus sait que ce nest pas la fin de tout... il sait ce qui attend. En passant linstant tragique du «dernier souffle», Jésus sait qu'il ne tombe pas dans le trou noir du néant, mais dans les bras du Pére. Et c’est devenu le chant d’espérance des chrétiens dans le dernier adieu a nos défunts: «Sur le seuil de sa maison, notre Pére t’attend, et les bras de Dieu s’ouvriront pour toi.»", "page": 262, "kind": "p"}, {"id": "r49p22", "text": "Sommes-nous vraiment convaincus que cest cela, la mort? Tel est le message de tous les martyrs. Telle est assurance des vrais croyants.", "page": 262, "kind": "p"}, {"id": "r49p23", "text": "Mais les disciples ne comprenaient pas ces paroles et ils avaient peur de linterroger.", "page": 262, "kind": "h"}, {"id": "r49p24", "text": "L’évangile n’embellit point les apétres. Ce sont de pauvres hommes comme nous. Marc insiste plut6t sans arrét sur leur esprit obtus, borné, étroit. Ils ne « comprennent pas» (Marc 6/52 - 8/17 - 8/21 - 9/32). Les Douze sont donc un bon échantillon d’humanité courante, plut6t moyenne. On se demande comment ’Eglise, et tout son immense mouvement historique, aurait pu naitre simplement de leurs imaginations et de leurs projets, comme on le dit parfois. Vraiment, ils ont été transformés par un Evénement, ils ont été soulevés au-dessus d’eux-mémes, investis d’une force nouvelle. Il en est toujours ainsi pour l’Eglise: si elle n’était qu’humaine, il y a longtemps qu’elle aurait été détruite par les gaffes et les péchés de ses chefs et de ses membres. Mais peut-on juger lEglise simplement d’un point de vue humain ?", "page": 262, "kind": "p"}, {"id": "r49p25", "text": "Pour lheure, les apétres ont « peur» de Jésus, et ils s’établissent dans une sorte de silence géné: «ils avaient peur de linterroger... »", "page": 262, "kind": "p"}, {"id": "r49p26", "text": "Ils arrivérent a Capharnaiim, et, une fois a la maison, Jésus leur demandait: «De quoi discutiez-vous en chemin ?»)... Ils se taisaient...", "page": 263, "kind": "h"}, {"id": "r49p27", "text": "Ils n’ont pas retrouvé la parole. Ils se taisent 4 sa question. La «géne» entre eux est grave... comme dans un groupe qui ne s’entend plus!", "page": 263, "kind": "p"}, {"id": "r49p28", "text": "Ils se taisaient, car, sur la route, ils avaient discuté entre eux pour savoir qui était le plus grand.", "page": 263, "kind": "h"}, {"id": "r49p29", "text": "Cest vraiment le complet désaccord avec leur maitre. Lui pense a sa mort, ow il va «livrer» sa vie. Et eux songent aux «bonnes places». Il sont tellement ancrés dans leur fausse conception du Messie, et de Dieu... ils continuent tellement a attendre un coup d’éclat de la Puissance du Messie, un Régne temporel, qu’ils discutent déja « qui sera Premier ministre» quand ils auront gagné! Mais, de grace, ne jugeons pas trop sévérement cette incompréhension du role de Jésus. Méme éclairés par la Résurrection de Paque, nous, aujourd’hui, pouvons-nous dire que nous admettons lapparente absence de Dieu, son silence, l’échec de la croix ? Ne continuons-nous pas a demander a Dieu d’intervenir... pour triompher ?", "page": 263, "kind": "p"}, {"id": "r49p30", "text": "S’étant assis, Jésus appela les Douze et leur dit: « Si quelqu’un veut étre le premier, qu’il soit le dernier de tous et le serviteur de tous.»", "page": 263, "kind": "h"}, {"id": "r49p31", "text": "En sa Passion qu'il vient d’annoncer, Jésus s’est fait le «dernier», le « serviteur» de tous. C’est ainsi qu’est Dieu, en vérité. Pourquoi cette affirmation apparait-elle 4 certains comme un blasphéme? Il est bien vrai que Dieu est le Premier, le plus Grand... mais c’est le « premier dans le service», «le premier dans l'amour serviteur». «Vous m/appelez Maitre et Seigneur, et vous dites bien, car je le suis... Pourtant, je vous ai lavé les pieds, comme le « serviteur» (Jean 13/13). Dieu est vraiment le Tout-Puissant, mais c’est la toute puissance du «service jusqu’au bout». «Je suis au milieu de vous comme celui qui sert» (Luc 22/27). «Le fils de Thomme est venu non pour étre servi, mais pour servir et donner sa vie en rancon pour la multitude...» (Marc 10/42.45).", "page": 263, "kind": "p"}, {"id": "r49p32", "text": "Dans les sociétés et les groupes humains, ce qui est naturel (et c’est la méme loi dans le monde animal!), c'est de rechercher la force, la considération, le prestige, les honneurs, les avantages. Jésus bouscule en profondeur cet ordre établi: que le « premier » se fasse le « dernier», que le « maitre» se fasse le « serviteur »! Il est certain que Jésus a réellement parlé de cette maniére provocante, révolutionnaire. Mais ce n’est pas pour faire une «révolution», une de plus, oti l'on se contente de « changer de maitre»! C’est pour donner la véritable solution, de l’intérieur de /homme, qui permettrait de surmonter l’incessante lutte des hommes entre eux pour «dominer», s’assurer la richesse, le pouvoir... contre les autres, en écrasant les autres.", "page": 264, "kind": "p"}, {"id": "r49p33", "text": "Prenant alors un enfant, il le placa au milieu d’eux, Pembrassa et leur dit: « Celui qui accueille en mon nom un enfant comme celui-ci, c’est Moi quill accueille. Et celui qui m’accueille ne m/accueille pas moi, mais Celui qui m’a envoye.", "page": 264, "kind": "h"}, {"id": "r49p34", "text": "Dans nos groupes, dans nos cceurs, dans le monde, la violence ne cesse de grandir. Dans cette marée noire qui monte, Jésus propose, symboliquement, la fragilité de l’enfant, comme idéal. L’enfant est cet étre «petit», socialement peu considéré, dont on peut se débarrasser facilement, y compris de maniére légalement criminelle. L’enfant est le « pauvre» par excellence... sans défense, « livré » aux forts, aux plus puissants que lui. Or Dieu renverse les normes sociales de préséances: il venait de dire que le dernier est en fait le premier... il dit maintenant que le petit est en fait le plus grand, aux yeux de Dieu. Jésus met |’enfant «au milieu» de la communauté chrétienne. Je prends le temps de contempler, en imagination, Jésus caressant et embrassant ce petit enfant. La grandeur du chrétien se mesure a la qualité du service qu'il rend aux plus petits, aux plus défavorisés: nous serons jugés selon ce critére (Matthieu 25/31). Ce n’est dailleurs plus une «servitude», puisque c’est « Jésus» qu’on sert en les servant... et, a travers gen «Celui» qui a fait les mondes et qui a donné son Fils.", "page": 264, "kind": "p"}]}, {"id": 50, "title": "26e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 265, "ref": "Marc 9/38.43 - 45 - 47.48", "paragraphs": [{"id": "r50p1", "text": "Sur le «chemin» qui le conduit de Césarée de Philippe ou eut lieu la profession de foi de Pierre, a travers la Galilée ou il précha la bonne nouvelle, jusqu’a Jérusalem ow il mourra et ressuscitera... Jésus n’est pas seul. Le « chemin du Fils de homme» est aussi celui des disciples! Nousmémes, nous sommes sur ce méme chemin a la suite du Christ: — de notre profession de foi baptismale, — en vivant de la bonne nouvelle de l’évangile, — jusqu’a notre propre « pdque»... notre mort et résurrection.", "page": 265, "kind": "p"}, {"id": "r50p2", "text": "Dans cette partie de son récit, Marc a groupé des enseignements prononcés sans doute par Jésus dans diverses occasions, et qui traitent de questions apparemment trés diverses. La plupart de ces enseignements de Jésus traitent pourtant d’une question unique: il s’agit des exigences existentielles que comporte la «foi» en Lui. Croire en Jésus, c’est Le suivre Ia oui Il a passé. La conduite pratique des disciples, la morale chrétienne, n’est pas d’abord une «loi» de permis et défendu, c’est une «participation a la maniére d’étre de Jésus».", "page": 265, "kind": "p"}, {"id": "r50p3", "text": "Jean, Pun des Douze, disait 4 Jésus: « Maitre, nous avons vu quelqu’un chasser des esprits mauvais en ton nom...", "page": 265, "kind": "h"}, {"id": "r50p4", "text": "Jean, «le disciple que Jésus aimait», comme il se définira luiméme (Jean 21/20). Parmi les Douze disciples, c’est, effectivement, l'un de ceux qui a l’air de mieux comprendre Jésus, d’étre le plus proche.", "page": 265, "kind": "p"}, {"id": "r50p5", "text": "Sur la route, voila donc un « fait de vie», un petit « événement», qui provoque une réaction. C’est dans la vie de tous les jours, a travers les circonstances fortuites que se vit la foi véritable. Que s’est-il passé ce jour-la, sur leur chemin ?", "page": 265, "kind": "p"}, {"id": "r50p6", "text": "Jean a vu un «exorciste» étranger a leur groupe. L’évangile nous a transmis le souvenir que les disciples ont essayé de chasser les démons en l’absence de Jésus quelques jours auparavant (Marc 9/18). Mais ils avaient échoué, eux! Comme la réputation de Jésus s’était répandue, on concoit trés bien qu’un exorciste étranger ait pu essayer a son tour. Nous savons, par la littérature ancienne, que juifs, et paiens, chassaient les démons, comme les sorciers d’aujourd’hui, par des pratiques magiques trés répandues a lépoque de Jésus (Actes 8/18).", "page": 266, "kind": "p"}, {"id": "r50p7", "text": "Il est bien évident qu’aujourd’hui la question de Jean sur les exorcismes miraculeux se poserait autrement. Mais elle reste d’une extréme actualité, malgré les apparences contraires. Aujourd’hui encore, comme au temps de Jean et de Jésus, il existe des « exorcistes», des gens qui chassent les démons: les « démons de notre époque», nous les connaissons bien, ils sont légion. Par exemple le manque de sens moral, le mépris de la vie, l’exploitation éhontée des faibles et des petits sans défense, les comportements racistes, la mauvaise répartition de la richesse face aux salaires de misére, absence du sens authentique de Dieu, le culte de toutes les idoles de notre temps. Face a ces « démons», nous connaissons, nous aussi, comme Jean en ce temps-la, tel jeune, tel adulte, tel vieillard, qui « exorcise» ce mal et essaie de le détruire, par son travail professionnel, par son engagement bénévole dans un Mouvement.", "page": 266, "kind": "p"}, {"id": "r50p8", "text": "Nous avons vu quelqu’un chasser des esprits mauvais en ton nom; nous avons voulu len empécher, car il n’est pas de ceux qui «nous suivent».", "page": 266, "kind": "h"}, {"id": "r50p9", "text": "Ces gens ne sont pas chrétiens! Ils ne sont pas de notre groupe, de notre parti. Montrez vos papiers! Vous n’étes pas francais, pas catholique, pas pratiquant... Ou bien, vous n’appartenez pas a mon syndicat, 4 mon école, vous étes de gauche, de droite, vous étes intégriste, progressiste... alors, je ne vous écoute pas! Si je le peux, je vous ferai taire, je vous empécherai d’agir.", "page": 266, "kind": "p"}, {"id": "r50p10", "text": "Décidément le sectarisme n’est pas mort.", "page": 267, "kind": "p"}, {"id": "r50p11", "text": "Il existe dans lEglise... aussi! Comme il existait dans les Apétres, en ce temps-la. Les Douze sont empétrés dans leurs petites querelles de préséances, de jalousies, de mesquineries. Jésus vient d’annoncer sa Passion ot il se fera «le dernier et le serviteur de tous»... Il vient de conseiller a ses disciples de se mettre en état de service et de ne pas chercher les premiéres places. Et voila que la réaction de Jean, Pun des meilleurs, est une réaction de domination, une volonté de puissance, un souci de garder un monopole: il voudrait garder pour lui seul la «puissance du Christ»! Ne jugeons pas les apétres, ne jugeons quiconque. Regardons-nous nous-mémes.", "page": 267, "kind": "p"}, {"id": "r50p12", "text": "Sans en avoir lair, ce-court passage de lévangile traite lune des questions les plus brilantes de notre actualité: la grace salvatrice du Christ n/’agit-elle qu’a lintérieur des frontiéres « visibles» de lEglise?", "page": 267, "kind": "p"}, {"id": "r50p13", "text": "Quelle est la réponse de Jésus a cette question toujours: actuelle ?", "page": 267, "kind": "p"}, {"id": "r50p14", "text": "Jésus répondit: « Ne ’empéchez pas, car celui qui fait un miracle en mon nom ne peut pas, aussitét aprés, mal parler de moi; celui qui n’est pas contre nous est pour nous»).", "page": 267, "kind": "h"}, {"id": "r50p15", "text": "Non! Le groupe des Douze rest pas le seul dépositaire de Esprit de Dieu.", "page": 267, "kind": "p"}, {"id": "r50p16", "text": "Hors de vos cénacles,", "page": 267, "kind": "p"}, {"id": "r50p17", "text": "Esprit souffle, imprévisible,", "page": 267, "kind": "p"}, {"id": "r50p18", "text": "libre comme le vent (Jean 3/8).", "page": 267, "kind": "p"}, {"id": "r50p19", "text": "Déja, au temps de Moise, lesprit de prophétie était répandu a profusion, et on ne pouvait l’empécher de se manifester, méme en dehors du «groupe» (Nombres 11/25.29), méme en dehors de ceux qui étaient «dans la Tente». Et Moise avait souhaité que ce don de Esprit soit répandu sur tous: « Ah! Si le Seigneur pouvait mettre son Esprit sur eux, pour faire de tout son peuple un peuple de prophéetes! »", "page": 267, "kind": "p"}, {"id": "r50p20", "text": "Fais lever sur notre terre", "page": 267, "kind": "p"}, {"id": "r50p21", "text": "des «hommes de | Esprit»!", "page": 267, "kind": "p"}, {"id": "r50p22", "text": "Non! On r’enchaine pas lEsprit. Il est libre. Il n’est lié par aucun rite. Il agit en dehors de nos structures. Il suscite des prophétes méme «en dehors» du groupe, méme en dehors de lEglise. Ce mot de Jésus («ne Pempéchez pas ») dit expressément que la Hiérarchie de lEglise, dont la mission est bien de garantir la foi authentique, doit veiller 4 respecter la spontanéité de Esprit Saint en chaque baptisé... et méme en chaque homme. qui n’est pas dans les structures visibles de l’Eglise.", "page": 268, "kind": "p"}, {"id": "r50p23", "text": "Nous contemplons l’admirable largeur de vue de Jésus face a tous les sectarismes, face a toutes les intolérances. Quel Esprit nous habite ? Est-ce Esprit de Jésus ? Donne-nous, Seigneur, un Esprit grand, large, intelligent, aussi vaste que Celui de Dieu, aussi ouvert que le Tien... cet Esprit qui souffle d'un bout du monde a l’autre, et qui fait craquer notre esprit de chapelle et de clan. Rends-nous, Seigneur, authentiquement «catholiques», c’est-a-dire « universels», c’est-a-dire « compréhensifs des diversités», comme nous le rappelle le Concile Vatican II: «Qu’au sein méme de PEglise, nous fassions progresser lestime, le respect et la concorde mutuels, dans la reconnaissance de toutes les diversités légitimes... ouverts a nos fréres qui ne vivent pas en totale communion avec nous... ouverts a tous ceux dont les traditions recélent de précieux éléments religieux et humains...» (G.S. 92).", "page": 268, "kind": "p"}, {"id": "r50p24", "text": "Vous souvenez-vous? Ce fut le premier message de Jean Paul II au jour de sa consécration comme Pape: « N’ayez pas peur! Ouvrez vos frontiéres! »", "page": 268, "kind": "p"}, {"id": "r50p25", "text": "Ne sommes-nous pas encore trop portés naturellement a condamner ceux qui ne sont pas de notre bord, ceux qui ne pensent pas comme nous ? Sommes-nous capables de nous réjouir de la part de vérité que détiennent nos adversaires, du bien qu’ils peuvent faire, des réussites humanitaires et sociales quiils réalisent ?", "page": 268, "kind": "p"}, {"id": "r50p26", "text": "N‘éteignez pas le feu qui prend,", "page": 268, "kind": "p"}, {"id": "r50p27", "text": "il doit embraser le monde (Luc 12/49).", "page": 268, "kind": "p"}, {"id": "r50p28", "text": "Et celui qui vous donnera un verre d’eau au nom de votre appartenance au Christ, amen, je vous le dis, il ® ne restera pas sans récompense.", "page": 268, "kind": "h"}, {"id": "r50p29", "text": "Un «verre d’eau», presque rien.", "page": 269, "kind": "p"}, {"id": "r50p30", "text": "Cest le symbole du plus petit service qu’on puisse rendre a quelqu’un: seulement un verre d’eau!", "page": 269, "kind": "p"}, {"id": "r50p31", "text": "Extraordinaire «dignité» du disciple: «il appartient au Christ». Le plus petit des croyants représente JésusChrist. Jésus s’identifie au moindre des chrétiens.", "page": 269, "kind": "p"}, {"id": "r50p32", "text": "Matthieu reprendra cela dans le grand discours sur le Jugement (Matthieu 25/31.45). «Ce que vous avez fait au plus petit des miens, c’est 4 moi que vous lavez fait.» Importance de nos moindres gestes. Rien n’est petit. Combien je manque d’occasions!", "page": 269, "kind": "p"}, {"id": "r50p33", "text": "Celui qui entrainera la chute d’un seul de ces petits qui croient en moi, mieux vaudrait pour lui qu’on lui attache au cou une de ces meules que tournent les anes et qu’on le jette a la mer.", "page": 269, "kind": "h"}, {"id": "r50p34", "text": "Aprés les conseils de morale positive («donner un verre d'eau») voici la mise en garde négative («ne pas scandaliser, ne pas faire chuter les autres»). Mais c’est en fait le méme comportement essentiel: attention aux autres.", "page": 269, "kind": "p"}, {"id": "r50p35", "text": "Nous découvrons, ici, un autre aspect de Jésus: aprés sa grande ouverture d’esprit, nous rencontrons sa violence intérieure, sa capacité de véhémence. La tolérance de Jésus rest pas lindifférence au « mal». S’il demande qu’on tolére le bien qui se fait en dehors de nous, il s’indigne qu’on puisse entrainer un autre au mal.", "page": 269, "kind": "p"}, {"id": "r50p36", "text": "Si ta main t’entraine au péché, coupe-la. Si ton pied tentraine au péché, coupe-le. Si ton ceil t’entraine au péché, arrache-le... Il vaut mieux entrer manchot, estropié, borgne, dans la vie éternelle, que d’étre jeté dans la géhenne...", "page": 269, "kind": "h"}, {"id": "r50p37", "text": "Seul Jésus a le droit de dire ces mots incroyables. Lui seul sait véritablement ce qu’est le «péché»! Cvest sérieux, pour lui, c’est méme dramatique. La vie éternelle mérite tous les sacrifices. Sommes-nous capables de ce choix radical, absolu? Tout en faisant la part des expressions sémitiques excessives, n’édulcorons pas...", "page": 269, "kind": "p"}]}, {"id": 51, "title": "27e Dimanche ordinaire", "group": "Tiempo ordinario", "page": 270, "ref": "Marc 10/2.16", "paragraphs": [{"id": "r51p1", "text": "Homme et femme! Pourquoi? Garcons et filles ! Pourquoi ? La sexualité! Pourquoi! L’amour, l’érotisme, la tendresse, le mariage! Pourquoi ?", "page": 270, "kind": "p"}, {"id": "r51p2", "text": "Pourquoi le monde des vivants, tout entier, végétal ou animal ou homme, est-il construit sur ce « modéle » ? Pourquoi faut-il que tous les vivants soient composés d%«espéces»... coupées en deux parties différentes, «mdle et femelle»... différentes, et pourtant «faites l'une pour l'autre»?", "page": 270, "kind": "p"}, {"id": "r51p3", "text": "La pensée humaine ne cesse d’osciller sur ce sujet, entre les pessimismes jansénistes, cathares ou manichéens... et les soit-disant optimismes libertins, qui réclament la liberté sexuelle et prénent le plaisir en soi comme but de homme.", "page": 270, "kind": "p"}, {"id": "r51p4", "text": "La morale chrétienne, dans les derniers siécles, a démesurément grossi les culpabilités autour de la « pureté», et de l’« impureteé »...", "page": 270, "kind": "p"}, {"id": "r51p5", "text": "La mentalité moderne, actuellement, a tendance a renoncer a toute norme, et exalte le laisser-all
