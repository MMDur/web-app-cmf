quand Marie lui apprenait a prier : « Abba» signifie « papa»... « Eloi» signifie «mon» Dieu... Aide-moi, Seigneur, a oser prier quand je souffre, pour dire, comme toi: 1° «Eloigne de moi... cette souffrance ! 2° « Pas ce que je veux... mais ce que Tu veux! Si jai une Bible (mais est-il encore possible qu’une famille chrétienne n’ait pas de Bible?) je relirai le Psaume 21 en entier, ce psaume que Jésus a prié en croix, qui commence dans la déréliction la plus totale, et qui se termine dans lexultation de joie la plus paradoxale... Une des clefs secrétes, de ce secret que nous cherchons en cette Passion.", "page": 86, "kind": "p"}, {"id": "r14p20", "text": "DEUX PROCES, POUR DIRE A LA FACE DU MONDE... QUE JESUS EST «FILS DE DIEU»... ET «ROl!»...", "page": 86, "kind": "p"}, {"id": "r14p21", "text": "En saint Marc, il y a deux procés faits a Jésus: un proces «religieux» (Marc 14/53.65), devant le grand Sanhédrin, devant « tous les grands prétres» ... et un proces «politique» (Marc 15/1.20), devant Pilate, représentant de Rome... afin que soit proclamé a la face du monde le « secret» de l’identité véritable de ce condamné, Jésus de Nazareth.", "page": 87, "kind": "p"}, {"id": "r14p22", "text": "« Es-tu le Messie, le Fils du Dieu béni? — Je le suis! Et, vous verrez le Fils de Phomme siéger a la droite du Tout-Puissant et venir parmi les nuées du ciel...) «Es-tu le roi des Juifs? — Tu las dit!»", "page": 87, "kind": "h"}, {"id": "r14p23", "text": "Voici que le «secret» est levé: Jésus dit, enfin, qui il est. Pendant toute sa vie publique, il_demandait de taire ce secret a tous ceux qui le devinaient, car on ne peut «comprendre» Dieu qu’en regardant la croix: il est «fils», mais pas comme les hommes se ’imaginent... il est « roi», mais pas comme les hommes s’y attendent... Ce fils est tout amour, sans aucun retour sur «soi»: amour absolu, qui meurt pour «l'autre»... Ce roi est tout amour, sans aucune domination: il est le «serviteur» qui donne sa vie pour «Pautre»...", "page": 87, "kind": "p"}, {"id": "r14p24", "text": "Et ceci est tellement nouveau, tellement déroutant, que « personne» n’y comprend rien: — les passants « hochent la téte» devant ce roi des juifs (Marc 15/29.30) — les accusateurs continuent a l’accuser de détruire le temple (14/58) — les grands-prétres continuent 4 penser que Dieu devrait descendre de la croix (15/31.32). — les deux brigands, a gauche et a droite, I’ «injurient » (15/32). Quand aux apétres, ils sont absents.", "page": 87, "kind": "p"}, {"id": "r14p25", "text": "Le centurion qui était en face de Jésus, voyant comment il avait expiré, s’écria: « Vraiment, cet homme était Fils de Dieu! »", "page": 87, "kind": "h"}, {"id": "r14p26", "text": "Notons que c’est «la maniére dont il meurt» qui fait surgir cet acte de foi... et non pas la «résurrection» qui n’interviendra que plus tard. Oui, avant de méditer sur la résurrection bienheureuse, il faut méditer sur la «mort» de Jésus: cette mort parle. Que me dis-tu, Seigneur, par elle? Je relirai ce récit...'j'écouterai... le secret.", "page": 87, "kind": "p"}]}, {"id": 15, "title": "Pâques", "group": "Pascua", "page": 88, "ref": "Marc 16/1.8", "paragraphs": [{"id": "r15p1", "text": "Essayons, chaque année, de vivre Paques en écoutant le message de chaque évangéliste. Cette année, aprés la «Passion selon saint Marc», nous lisons donc la « Résurrection selon saint Marc», au cours de la Vigile pascale. Le récit de Marc est extrémement dépouillé. Il comporte seulement 8 versets.", "page": 88, "kind": "p"}, {"id": "r15p2", "text": "Le sabbat terminé, Marie Madeleine, Marie mére de Jacques, et Salomé achetérent des parfums pour aller embaumer le corps de Jésus.", "page": 88, "kind": "h"}, {"id": "r15p3", "text": "Nous notons déja importance des « femmes»: elles étaient seules, selon Marc, a avoir osé accompagner Jésus jusqu’a sa mort sur le Golgotha... tous les disciples hommes s’étant enfuis (Marc 14/50 - 15/40). Donne-nous, Seigneur, des amours plus fidéles. Ne permets pas que nous abandonnions ceux que nous aimons.", "page": 88, "kind": "p"}, {"id": "r15p4", "text": "Je contemple ces « parfumeuses», les mains pleines de flacons d’aloés et de myrrhe, qui se dirigent, au petit matin, vers un cimetiére: ces femmes sont uniquement préoccupées d’une chose... embaumer un «cadavre»... mettre un point final 4 Paventure «Jésus de Nazareth»... rendre les derniers devoirs de l'amour a un étre cher, défunt... assurer une sépulture un peu plus digne a un condamné a mort qu’on n’a méme pas eu le temps d’ensevelir le soir de son éxécution.", "page": 88, "kind": "p"}, {"id": "r15p5", "text": "De grand matin, le premier jour de la semaine, elles se rendent au sépulcre au lever du soleil.", "page": 88, "kind": "h"}, {"id": "r15p6", "text": "C’est un matin!", "page": 88, "kind": "p"}, {"id": "r15p7", "text": "Un matin de printemps méditerranéen. II fait frais. L’air est vif et doux sur le sentier ot elles marchent, douloureuses, dans leurs souvenirs. Autour d’elles, les oiseaux chantent déja. Entre les branches d’arbres aux verts bourgeons qui éclatent, le soleil se léve a lhorizon.", "page": 89, "kind": "p"}, {"id": "r15p8", "text": "«Un nouveau matin se léve, alléluia, alléluia,", "page": 89, "kind": "p"}, {"id": "r15p9", "text": "Premier jour de la semaine, alléluia, alléluia,... » Oui, une nouvelle semaine commence, un monde nouveau, une nouvelle création, une ére nouvelle.", "page": 89, "kind": "p"}, {"id": "r15p10", "text": "Elles se disaient entre elles: «Qui nous roulera la pierre pour dégager l’entrée du tombeau?» — Au premier regard, elles s’apercoivent qu’on a roulé la pierre, qui était trés grande, pourtant.", "page": 89, "kind": "h"}, {"id": "r15p11", "text": "Ce détail concret est capital. Les quatre évangélistes le notent. La «pierre est roulée». Marc, seul, ajoute qu'elle était trés grande! Détail historique vraisemblable, correspondant parfaitement a la maniére des tombeaux de ce temps-la. Mais, pour Marc et pour nous AUJOURD’HUI, détail symbolique significatif: une vraie muraille sépare homme de la résurrection... une sorte d’impossibilité... « qui pourrait enlever cet obstacle»? Seul Dieu peut supprimer le poids terrible de la mort qui pése sur l’humanité.", "page": 89, "kind": "p"}, {"id": "r15p12", "text": "En entrant dans le tombeau, elles virent, assis a droite, un «jeune homme» vétu de blanc.", "page": 89, "kind": "h"}, {"id": "r15p13", "text": "Le récit de Marc, plus dépouillé que celui de Matthieu (28/2.3), ne parle ni «d’ange», ni de-«tremblement de terre», ni «d’éclair»... mais seulement d’un «jeune homme». Cette sobriété est voulue par Marc: il n’emprunte au langage apocalyptique courant que le minimum d'images, afin déviter toute «description» de la résurrection. Seul le «fait» est affirmé. Mais nous savons que la couleur «blanche» est toujours un signe: c’est la couleur de la lumiére, opposée aux ténébres, c’est la couleur de la gloire, des étres célestes. Déja, au jour de la Transfiguration, le méme Marc nous avait parlé d’« une blancheur telle que personne sur terre ne peut obtenir une blancheur pareille » (Marc 9/3). Dans PApocalypse de Jean, le « blanc» est toujours symbolique du monde céleste (Apoc 2/17 - 14/14 - 19/11 - 20/11; Ezékiel 9/2; Daniel 7/9; Isaie 1/18; Apocalypse 7/14 - 19/1.14).", "page": 89, "kind": "p"}, {"id": "r15p14", "text": "Elles furent saisies de peur. Mais il leur dit: « N’ayez pas peur...)", "page": 90, "kind": "h"}, {"id": "r15p15", "text": "Tous les récits d’annonciations, (annonce d’un message divin) dans la Bible comportent ce détail. Le «divin» est déroutant pour la raison humaine, et provoque une sorte de stupéfaction, d’effroi sacré. Marc utilise ici un mot dont il est familier (exéthambéthésan = elles furent bouleversées, dépassées, hors d’elles-mémes). Ainsi les gens de Capharnatim avaient été «saisis de stupeur» a la premiére intervention de Jésus (Marc 1/27. Voir aussi Marc 10/24.32 et 14/33).", "page": 90, "kind": "p"}, {"id": "r15p16", "text": "Mais, si Papparition du Tout-Autre bouleverse, sa présence aussit6t rassure et apaise. Le vrai Dieu n’est absolument pas celui qui joue sur la peur: N’ayez pas peur de moi, dit Dieu. :", "page": 90, "kind": "p"}, {"id": "r15p17", "text": "Nous remarquons donc que Marc ne rapporte pas d’apparition proprement dite de Jésus... mais seulement une «Parole» de révélation, venue d’un messager céleste, et qui dit la «foi», un des points de notre «credo»:", "page": 90, "kind": "p"}, {"id": "r15p18", "text": "« Vous cherchez Jésus de Nazareth, le Crucifié, il est ressuscité: il n’est plus ici.»", "page": 90, "kind": "h"}, {"id": "r15p19", "text": "« Crucifié pour nous sous Ponce Pilate... Il ressuscita le troisiéme jour...»", "page": 90, "kind": "p"}, {"id": "r15p20", "text": "Telle était la profession de foi des premiers chrétiens (Actes 2/23 - 3/15 - 4/10 - 10/39 - 13/28.30). Telle est toujours notre foi.", "page": 90, "kind": "p"}, {"id": "r15p21", "text": "Le récit de Marc insiste sur les aspects concrets, comme pour nous dire que c’est bien le « méme» Jésus: le « nazarénien», le «crucifié»... le Jésus de histoire.", "page": 90, "kind": "p"}, {"id": "r15p22", "text": "Le crucifié s’est éveillé.", "page": 90, "kind": "p"}, {"id": "r15p23", "text": "Le crucifié est ressuscité.", "page": 90, "kind": "p"}, {"id": "r15p24", "text": "Il nest plus ici! - Il est ot?", "page": 90, "kind": "p"}, {"id": "r15p25", "text": "Voici ’endroit ot on lavait déposé. Et maintenant, allez dire a ses disciples et a Pierre: «Il vous précéde en Galilée... »", "page": 90, "kind": "h"}, {"id": "r15p26", "text": "Manifestement, Marc veut détourner l'attention du « tombeau». Dieu veut détourner l’attention de ce « tombeau». Jésus veut détourner l'attention de ce « tombeau»: il avait déja, avant sa mort, dit exactement la méme parole. « Une fois ressuscité, je vous précéderai en Galilée» (Marc 14/28). Ce mystérieux «jeune homme vétu de blanc et assis a droite...» ne serait-ce point Jésus, Jésus-nouveau, Jésus-assis-a-la-droite-du-Pére? Ce Jésus qu’on ne reconnait plus, au premier contact, avec les yeux de la terre: souvenons-nous de Madeleine, au jardin, qui « croit voir le jardinier», et les disciples d’Emmaiis dont les « yeux sont fermés »...", "page": 91, "kind": "p"}, {"id": "r15p27", "text": "Allez! Allez! Ne restez pas a ce tombeau, ne restez pas a Jérusalem.", "page": 91, "kind": "p"}, {"id": "r15p28", "text": "Allez de lavant, lA ot Jésus est vivant, la ot il vous précéde: la of il vous a fixé un « rendez-vous»... en Galilée! Sur cette terre qui est la vétre, hommes de Galilée, dans votre vie humaine réelle. Le nom de cette terre de Galilée a, pour Marc, une signification symbolique considérable. II la nomme 12 fois dans son évangile. C’est la que la « vie» de Jésus a atteint son sommet, c’est la qu’a retenti pour la premiére fois la Bonne Nouvelle de Dieu, c’est la que les premiers «signes» de la puissance de Jésus ont éclaté, cest la que les foules se sont « rassemblées».", "page": 91, "kind": "p"}, {"id": "r15p29", "text": "Maintenant... c’est le temps de la Galilée qui recommence, le temps du rassemblement d’un nouveau peuple, autour de Pierre, le temps de nouveaux «signes», le temps de la Bonne Nouvelle: l’Eglise commence... C’est la qu’est présent celui qui n’est plus «ici, au tombeau, ot on avait mis.» C’est un ordre de marche!", "page": 91, "kind": "p"}, {"id": "r15p30", "text": "Allons, partez, ne restez pas ici. Allez dire Aa Pierre... Retournez en Galilée.", "page": 91, "kind": "p"}, {"id": "r15p31", "text": "La, vous le verrez, comme il vous Ia dit.", "page": 91, "kind": "h"}, {"id": "r15p32", "text": "Aucune explication d’ordre philosophique ou rationnel. Les disciples sont, comme nous, invités a croire, sur une parole, et a s’engager dans une action existentielle : contribuer au rassemblement des hommes qui croient en Jésus autour de Pierre... faire ce que Jésus avait annoncé de son vivant.", "page": 91, "kind": "p"}, {"id": "r15p33", "text": "Croire en la résurrection, pour Marc, n’est pas d’abord un casse-téte intellectuel, c’est l’engagement dans une vie nouvelle, avec des fréres, sur une Parole!", "page": 92, "kind": "p"}, {"id": "r15p34", "text": "Elles partirent, et s’enfuirent du tombeau...", "page": 92, "kind": "h"}, {"id": "r15p35", "text": "Elles étaient venues pour faire quelque chose, et elles repartent sans avoir pu le faire. Elles remportent leurs parfums. Elles s’enfuient de ce lieu.", "page": 92, "kind": "p"}, {"id": "r15p36", "text": "Car elles étaient toutes tremblantes et hors d’ellesmémes. Elles ne dirent rien a personne, car elles avaient peur.", "page": 92, "kind": "h"}, {"id": "r15p37", "text": "Ce sont les derniers mots de lévangile de Paques.", "page": 92, "kind": "p"}, {"id": "r15p38", "text": "«Tremblement» («tromos»)... Et «ravissement hors de soi» (« extasis »)... Comment dire mieux lirruption subite et bouleversante du Régne de Dieu dans [histoire des hommes? Tout au long de son évangile, Marc avait insisté sur le «secret» qui cache lidentité véritable de Jésus de Nazareth: chaque fois que quelqu’un disait trop vite qu'il était «Fils de Dieu», Jésus imposait le «silence». Cette finale de Marc prend tout son sens. Respectons-la! Les femmes «se taisent» et «ne disent rien a personne»: comment dire... que la personne de Jésus échappe a toute emprise, qu’elle est un mystére qui dépasse lhumain, déconcertant.", "page": 92, "kind": "p"}, {"id": "r15p39", "text": "Tous ceux qui voudraient chercher dans ces récits une «évidence absolue», une «sécurité toute faite», seront frustrés. C’est dans le silence de la Foi et de PAdoration que nous plonge Marc. Jésus, Tu es plus grand que toutes nos imaginations!", "page": 92, "kind": "p"}]}, {"id": 16, "title": "2e Dimanche de Pâques", "group": "Pascua", "page": 93, "ref": "Jean 20/19.31", "paragraphs": [{"id": "r16p1", "text": "Le soir du premier jour de la semaine... les disciples étaient réunis... Huit jours plus tard, les disciples se trouvaient de nouveau dans la maison...", "page": 93, "kind": "h"}, {"id": "r16p2", "text": "La page dévangile d’aujourd’hui nous rapporte deux « manifestations » de Jésus ressuscité, 4 huit jours d’intervalle. Spontanément, nous avons tendance a concentrer notre attention sur la seconde apparition, celle faite «a Thomas»... parce que nous nous identifions souvent a lui, trouvant bien pratique d’avoir sous la main « quelqu’un qui doute », « quelqu’un qui a du mal a croire»... trouvant peutétre en lui une sorte de justification de nos propres manques de foi.", "page": 93, "kind": "p"}, {"id": "r16p3", "text": "Mais nos connivences avec Thomas ne doivent pas nous empécher de lire le texte dans son entier.", "page": 93, "kind": "p"}, {"id": "r16p4", "text": "Nous remarquons d’abord que Jésus-vivant se manifeste, est-ce par hasard? «le dimanche», le premier jour de la semaine. Nous savons trés bien que les premiers chrétiens ne se réunissaient pas tous les jours. Ils avaient, eux aussi, leur vie quotidienne. Ils ne pouvaient pas toujours étre ensemble. Or, c’est dans le cadre de leur «rencontre» hebdomadaire que Jésus-ressuscité « vient». Nous aurions tort d’envisager la foi comme une affaire strictement « personnelle», ou « individuelle» : nous constatons que la présence du Christ-ressuscité est surtout éprouvée, ressentie, expérimentée, dans le cadre d’une rencontre communautaire. Ils sont «ensemble»... «réunis»... «en Eglise»...", "page": 93, "kind": "p"}, {"id": "r16p5", "text": "Les disciples avaient verrouillé les portes du lieu ou ils étaient, car ils avaient peur. Jésus vint, et il était «au milieu d’eux».", "page": 93, "kind": "h"}, {"id": "r16p6", "text": "Au moment ow saint Jean écrit cela; c’est toujours un temps de peur et de persécution. Les disciples de Jésus ont pris l’habitude de se réunir tant6ét chez l'un, tant6t chez l'autre. Ils s’accueillent... Ils se comptent: il y a des défections, des gens qui abandonnent la foi et le groupe... Ils ont peur aussi... Ils verrouillent leurs portes. Mais voici que, chaque dimanche, se renouvelle le « signe» du Cénacle, ce « premier dimanche» : mystérieusement, le Christ se glissait pami les siens, dans «le lieu ot ils étaient», a Ephése, Corinthe, Jérusalem, Rome. Oui, chaque dimanche, c’est Paques! Tu es la, au coeur de nos vies, et c’est Toi qui nous fais vivre. Sans Te voir, nous croyons.", "page": 94, "kind": "p"}, {"id": "r16p7", "text": "Nous aussi, Seigneur, AUJOURD’HUI, nous sommes tentés de «verrouiller » peureusement nos portes. Quand souffle PEsprit, que sécroulent les murs de nos prisons, que revienne le temps de nos chansons: Ouvrons nos portes au Christ ressuscité!", "page": 94, "kind": "p"}, {"id": "r16p8", "text": "Avant daller plus loin dans la méditation de cet évangile, demandons-nous de quelle situation sans issue, de quelle situation de peur, de quelle situation verrouillée, de quelle situation « mortelle», le Christ veut nous libérer, nous ressusciter. Tel péché, telle épreuve de santé, telle contrainte douloureuse et désespérante, telle difficulté familiale, professionnelle... Le «lieu ot ils étaient: verrouillé! »", "page": 94, "kind": "p"}, {"id": "r16p9", "text": "Il leur dit: «La paix soit avec vous!». Aprés cette parole, il leur montra ses mains et son cété. Les dis-ciples furent remplis de « joie »» en voyant le Seigneur. Jésus leur dit de nouveau: « La paix soit avec vous.»", "page": 94, "kind": "h"}, {"id": "r16p10", "text": "La joie pascale, la joie chrétienne, n’est pas d’abord la joie facile, la joie spontanée... celle qui nous souléve naturellement quand tout va bien, quand la santé est bonne, que la «jeunesse» est la, pleine de vitalité, quand nos entreprises réussissent, quand nos relations amicales et familiales sont agréables... La joie de la résurrection, c’est celle qui vient «apres»... aprés la peur! C’est la joie et la paix qui remontent dune situation si radicalement désespérée (la mort dun crucifié!) que rien désormais ne pourra la leur ravir: c’est la joie et la paix qui viennent de la «foi» en Jésus.", "page": 94, "kind": "p"}, {"id": "r16p11", "text": "A chaque assemblée dominicale, comme ce jour-la, Jésus nous souhaite la paix par la voix du prétre: «La paix soit avec vous». Et le Concile Vatican Il a rétabli antique tradition du «baiser de paix»: les chrétiens sont invités a se donner la paix les uns aux autres, au nom du Christ. Se donner une poignée de main, s’embrasser, se sourire, en se disant les uns aux autres: «la paix du Christ!». Ce n’est pas un geste banal... c’est «étre le Christ» pour son voisin... « quand plusieurs sont réunis en mon nom, je suis la au milieu d’eux. »", "page": 95, "kind": "p"}, {"id": "r16p12", "text": "De méme que le Pére m’a envoyé, moi aussi, je vous envoie...", "page": 95, "kind": "h"}, {"id": "r16p13", "text": "Voila! Nous ne croyions pas si bien-dire! C’est Jésus qui nous le redit. Moi, pauvre homme, pauvre femme, «je» suis Jésus envoyé a mes fréres... exactement comme « il» avait été envoyé par le Pére. Ne passons pas trop vite sur ces mots. N’allons pas trop vite rejoindre Thomas I incrédule. Restons sur ces mots de Jésus. Entendons cette fantastique responsabilité qu’il nous confie: la «mission» du Christ est confiée a lEglise, A moi, pour une part. Je suis « envoyé» par Jésus... comme Jésus a été « envoyé» par le Pére! J’ai Aa découvrir le sens de ces deux mots, qui, une fois de plus, sont des mots latins et grecs «non-traduits » hélas: «mission», qui signifie «envoi» (de «missus» en latin)... et «apdtre», qui signifie « envoyé» (de « apostolos » en grec)... Quand je rencontre quelqu’un, dans mon travail, dans mon milieu de vie, je n’y suis pas seulement en mon propre nom, pour mon propre compte: j’y suis «envoyé par » Jésus, en son nom, pour son compte! comme Jésus était envoyé du Pére! J’ai a te dire un message de Jésus: cest Lui qui te dit ce que je vais te dire... il est « vivant» en moi... je suis ses «lévres» et son «corps», prés de toi, pour te révéler ’amour du Pére.", "page": 95, "kind": "p"}, {"id": "r16p14", "text": "Ayant ainsi parlé, il répandit sur eux son souffle et il leur dit: « Recevez Esprit Saint.»", "page": 95, "kind": "h"}, {"id": "r16p15", "text": "Le don de IEsprit, la «création nouvelle»... ’Esprit de Jésus transmis a ses disciples. Jésus est mort, « remonté vers le Pére». Les chrétiens prennent le relais! Ils sont porteurs de «son» souffle vital, de son Esprit... ils vont poursuivre son oeuvre: «vous étes le Corps du Christ... vous étes le Temple de lEsprit...» dira saint Paul. Saint Jean, lui, nous montre Jésus reprenant a son compte le geste du Dieu Créateur dans la Genése (Genése 2/7): « Veni Creator Spiritus... Viens, Esprit Créateur! »", "page": 95, "kind": "p"}, {"id": "r16p16", "text": "Pour Jean, la pentecdte, c’est le soir de Paques: l’essentiel de Pactivité de Jésus aprés sa victoire sur la mort, c’est le don de «Esprit qui a ressuscité Jésus d’entre les morts» (Romains 8/11). Dans notre Credo, c’est ce que nous affirmons essentiellement de Esprit : «Il est Seigneur, et Il donne la vie». L’Esprit qui est donné aux hommes le soir méme de Paques, et qui éclatera sur la place publique dans cinquante jours a la Pentecdte, c’est cet Esprit de Dieu, qui vient de réussir son coup de maitre, si l'on ose parler ainsi, en arrachant Jésus au pouvoir de la mort, en le révélant comme Fils de Dieu par la résurrection. « Par sa résurrection, il a été établi Fils de Dieu selon Esprit Saint» (Romains 1/4).", "page": 96, "kind": "p"}, {"id": "r16p17", "text": "Tout homme 4 qui vous remettrez les péchés, ils lui seront remis.", "page": 96, "kind": "h"}, {"id": "r16p18", "text": "«Lier» et «délier»... «remettre» et «maintenir»... les péchés. Ce langage est une formule de grammaire araméenne: on emploie deux mots contraires pour affirmer plus fortement une réalité, et mettre Paccent sur le mot « positif». Ainsi, en leur donnant son Esprit, Jésus donne aussi a ses disciples le pouvoir de «délier [homme de son mal»: ils sont, désormais, ici-bas, les porteurs de la « miséricorde divine»... comme Jésus létait! «Comme le Pére m’a envoyé, moi aussi, je vous envoie!» Les chrétiens sont investis de la mission méme que Jésus avait dit étre la sienne, dans la Synagogue de Nazareth, au début de son ministére: «L'Esprit de Dieu repose sur moi, Esprit de Dieu m’a consacré, il m’a envoyé porter la bonne nouvelle aux pauvres, annoncer une année de bienfaits de la part de Dieu, libérer les captifs...» (Luc 4/18.19). Suis-je porteur de cet esprit-la, de lEsprit libérateur, de ’Esprit qui donne la vie, de Esprit qui aime et pardonne au nom de Jésus? Le pardon est une grace pascale.", "page": 96, "kind": "p"}, {"id": "r16p19", "text": "Or, Pun des douze, Thomas, n’était pas avec eux, quand Jésus était venu... Il leur déclara: «Si je ne vois pas... je ne Croirai pas...»", "page": 97, "kind": "h"}, {"id": "r16p20", "text": "Voila le « retardataire», qui arrive aprés la féte de la Rencontre. Thomas, c’est toujours, dans l’évangile, celui qui ne se fie qu’a son bon sens, homme positif qui se défie des audaces de Jésus. «Seigneur, nous ne savons pas ow tu vas» (Jean 14/15). Quand Jésus parlait de la résurrection de Lazare, Thomas, lui, ne voyait que la mort (Jean 11/15.16).", "page": 97, "kind": "p"}, {"id": "r16p21", "text": "Huit jours plus tard... Jésus vient de nouveau: « Avance ton doigt ici, vois mes mains, cesse d’étre incrédule...»", "page": 97, "kind": "h"}, {"id": "r16p22", "text": "Jésus, méme ressuscité, a 1sigause ae Phumour! Il a laissé Thomas avoir apparemment raison pendant une semaine. C’est avec une sorte de sourire, que je vois Jésus s’adresser a Thomas. Jésus a lair de lui dire: Mon pauvre ami, tu me croyais mort, et absent, quand tu parlais a tes camarades en leur disant ton incroyance... mais jétais déja la, invisible, assistant 4 votre conversation. Pourtant, je ne me suis pas « montré» a toi, A ce moment-la. Oh! La patience de Dieu. Il a tout son Temps.", "page": 97, "kind": "p"}, {"id": "r16p23", "text": "Thomas dit: « Mon Seigneur et mon Dieu. »", "page": 97, "kind": "h"}, {"id": "r16p24", "text": "Cst le cri de foi d'un homme pour qui le « toucher» est devenu inutile. Il a compris que Jésus, méme invisible, est la! Il était present méme a Pheure de ses doutes.", "page": 97, "kind": "p"}, {"id": "r16p25", "text": "Parce que tu m/’as vu, tu crois. Heureux ceux qui croient sans avoir vu.", "page": 97, "kind": "h"}, {"id": "r16p26", "text": "Une béatitude, la derniére. Les réalités les plus sublimes de Dieu ne peuvent se «voir». La «foi», seule, nous y introduit. C’est la le vrai bonheur.", "page": 97, "kind": "p"}]}, {"id": 17, "title": "3e Dimanche de Pâques", "group": "Pascua", "page": 98, "ref": "Luc 24/35.48", "paragraphs": [{"id": "r17p1", "text": "Nous lisons, aujourd’hui, une partie de la version de Luc du «récit de Padques».", "page": 98, "kind": "p"}, {"id": "r17p2", "text": "Selon son évangile, cing événements se passent dans la méme journée de Pdques:", "page": 98, "kind": "p"}, {"id": "r17p3", "text": "— lavisite des femmes au tombeau, le matin, et l'annonce Ae la résurrection... (24/1. 10);", "page": 98, "kind": "p"}, {"id": "r17p4", "text": "— la visite de Pierre au méme ae et sa perplexité... (24/11.12).", "page": 98, "kind": "p"}, {"id": "r17p5", "text": "— lapparition aux deux disciples d’Emmatis... (24/13.35) ; — lapparition aux onze apdotres, le méme soir... (24/36.49) ; — lascension de Jésus et son exaltation au ciel... (24/50.53).", "page": 98, "kind": "p"}, {"id": "r17p6", "text": "Eux (les disciples d’Emmaiis) racontaient a leurs compagnons ce qui sétait passé sur la route et comment ils ’avaient reconnu quand il avait rompu le pain. Comme ils parlaient encore, lui-méme était la, au milieu d’eux.", "page": 98, "kind": "h"}, {"id": "r17p7", "text": "Que d’événements dramatiques se sont passés, pour ces pauvres hommes, depuis trois jours! Le dernier repas de Jésus, jeudi dernier... larrestation au Jardin de Gethsémani... leur fuite 4 tous... le reniement de Pierre... le jugement infamant comme hérétique et blasphémateur... la mort sur la croix aux portes de la ville... la pendaison suicidaire de l’un de leurs amis, Judas. Le groupe de douze est devenu onze, par labandon et la mort de l'un d’eux!", "page": 98, "kind": "p"}, {"id": "r17p8", "text": "C’est dans ce contexte qu’arrive, déconcertante, inattendue, la « résurrection. »", "page": 98, "kind": "p"}, {"id": "r17p9", "text": "Il leur dit: «La paix soit avec vous.»", "page": 99, "kind": "h"}, {"id": "r17p10", "text": "Crest le «bonjour» habituel des juifs: «Shalom!»... «La paix! »...", "page": 99, "kind": "p"}, {"id": "r17p11", "text": "Mais on ne peut pas s’empécher de penser que, ce soir-la, le souhait traditionnel a di prendre une signification toute particuliére : c’est au creux de leur désespoir que Tu viens leur dire: «ne craignez pas»... «soyez en paix»...", "page": 99, "kind": "p"}, {"id": "r17p12", "text": "Avant sa mort, jeudi dernier, selon saint Jean, Jésus avait promis quills retrouveraient leur paix aprés un temps de douloureuse perturbation: «Je vous laisse la paix, je vous donne ma paix...» (Jean 14/27). « Vous allez étre dispersés, chacun allant de son cété, et vous me laisserez seul... Je vous ai dit cela pour qu’en moi vous ayez la paix... Soyez pleins d’assurance, j'ai vaincu le monde...» (Jean 16/32.33). Aujourd’hui, au soir de Paques, la promesse s’accomplit.", "page": 99, "kind": "p"}, {"id": "r17p13", "text": "Frappés de stupeur et de crainte, ils croyaient voir un esprit.", "page": 99, "kind": "h"}, {"id": "r17p14", "text": "Manifestement, les «onze», comme tous les autres récits nous l’ont dit, commencent par avoir peur, par « douter» méme. Tout a ’heure, Luc va beaucoup insister pour nous dire qu’ila fallu que Jésus leur « ouvre intelligence » : ils ne comprennent encore rien. II ne suffit pas de « voir»... il faut «souvrir» au mystére...", "page": 99, "kind": "p"}, {"id": "r17p15", "text": "Jésus leur dit: « Pourquoi étes-vous bouleversés? Et pourquoi ces pensées qui surgissent en vous? Voyez mes mains et mes pieds: c’est bien moi! Touchezmoi, regardez, un esprit n’a pas de chair ni d’os, et vous constatez que jen ai...»", "page": 99, "kind": "h"}, {"id": "r17p16", "text": "Dans le récit paralléle de Jean, Jésus leur avait montré «ses mains et son cété» (Jean 20/20). Ici, pour Luc, ce sont les mains et les pieds! Nous savons limportance du «cété» ouvert, pour saint Jean, symbole de la source qui jaillit du Temple nouveau, selon la prophétie d’Ezékiel.", "page": 99, "kind": "p"}, {"id": "r17p17", "text": "Lessentiel du récit est commun: il s’agit de bien montrer que c’est le « méme» Jésus, le crucifié, qui ressuscite. Pour ces sémites, qui n'ont pas lidée platonicienne et cartésienne d’une séparation de lame et du corps, si Jésus est vivant, ce ne peut étre qu’avec toute sa personne: Jésus tient a les assurer qu’il n’est pas un fant6me... et, pour cela, il faut qul ait un «corps». La résurrection ne peut pas étre réduite 4 une simple «immortalité de ’ame». D’ot, tous ces détails concrets: « touchez-moi... regardez mes mains et mes pieds... donnez-moi a manger...»", "page": 99, "kind": "p"}, {"id": "r17p18", "text": "Ne nous faisons cependant pas diillusion. II faut aller audela de la matérialité des mots pour comprendre le sens profond de la résurrection. Et saint Paul, avec autant de vérité, dira, lui, que le « Seigneur est Esprit» (II Corinthiens 3/17.18) et parlera du corps ressuscité comme un «corps spirituel» (I Corinthiens 15/44).", "page": 100, "kind": "p"}, {"id": "r17p19", "text": "Dans leur joie, ils n’osaient pas encore y croire, et restaient saisis d’étonnement. Jésus leur dit: « Avezvous ici quelque chose a manger ? » Ils lui offrirent un morceau de poisson arillé. Il le prit et le mangea devant eux...", "page": 100, "kind": "h"}, {"id": "r17p20", "text": "Cette allusion a un «repas» rejoint le geste d’Emmaiis. Pierre déclarera lui aussi: « Nous avons mangé et bu avec lui, aprés sa résurrection d’entre les morts» (Actes 10/41). Il n’y a, dans ce récit de Luc, aucune allusion explicite a Peucharistie, mais l’'ambiance est bien celle de ces «repas sacrés» ow les disciples vont découvrir une nouvelle présence du Ressuscité.", "page": 100, "kind": "p"}, {"id": "r17p21", "text": "Puis il leur déclara: « Rappelez-vous les paroles que je vous ai dites, quand jétais encore avec vous...)", "page": 100, "kind": "h"}, {"id": "r17p22", "text": "La résurrection ne peut pas étre comprise comme une sorte de phénoméne isolé, comme une sorte d’acte magique. Jésus insiste pour qu’on «comprenne», pour qu’on applique son « intelligence» a ce fait. Et la premiére voie de compréhension qu’ leur suggére, c’est le «souvenir». Jésus avait annoncé sa mort et sa résurrection. II] souhaite que nous fassions une continuité entre «Jésus avant Paques», et «Jésus aprés Paques»... Jésus historique, et Jésus trans-historique... Jésus concret, et le Christ de la foi...", "page": 100, "kind": "p"}, {"id": "r17p23", "text": "Nous notons, a ce propos, l’expression curieuse de Jésus: « quand j’étais avec vous» au passé! — Mais, Jésus, tu es en ce moment avec nous... auraient pu rétorquer les disciples. Eh oui! Il n’y est plus de la méme maniére: c’est le méme, et pas le méme. Toujours le mystére de foi.", "page": 100, "kind": "p"}, {"id": "r17p24", "text": "Il fallait que s’accomplisse tout ce qui a été écrit de moi dans la Loi de Moise, les Prophétes, et les Psaumes. Alors, il leur ouvrit [intelligence des Ecritures.", "page": 101, "kind": "h"}, {"id": "r17p25", "text": "Quelles Ecritures? L’ensemble de l’Ancien Testament : Loi, Prophétes, Psaumes. Il nous est bon de penser que Jésus était un familier de la Bible, qu’il avait lu et relu, pour son compte personnel, certains passages, et quills les avaient appliqués a son propre destin. «Les Ecritures parlent de moi!» Relisez-les, vous verrez. Et nous imaginons Jésus faisant un petit cours d’éxégése, d’interprétation biblique. La réforme liturgique voulue par le Concile a redonné une lecture plus abondante des passages de la Bible: trois lectures chaque dimanche au lieu de deux... et réparties sur trois ans pour fournir un ensemble de textes plus complets... Nous pouvons remarquer combien cela va dans le sens voulu par Jésus. Seigneur, donne-nous, donne a tous les chrétiens d’étre des affamés de lEcriture. Donne-nous de ne pas étre des « retardataires », qui manquent la Parole de Dieu, en étant absents dans ce début de la messe ot «tu nous ouvres intelligence des Ecritures».", "page": 101, "kind": "p"}, {"id": "r17p26", "text": "Il conclut: « C’est bien ce qui était annoncé par lEcriture: les souffrances du Messie, sa résurrection d’entre les morts le troisiéme jour...", "page": 101, "kind": "h"}, {"id": "r17p27", "text": "Oh, que nous aurions aimé étre la, quand Jésus en personne commentait Isaie, Sirac le sage, les Psaumes! Nous savons, par les Actes des Apétres, quels étaient ces textes privilégiés ot Jésus «se retrouvait», et disait qu’on « parlait de lui». (Ces textes souvent cités sont: Deutéronome 18/16.19 - 21/23; Osée 6/1; Isaie 52/13; Psaumes 2-22.) L’Ancien Testament était orienté vers Jésus. Tout le dessein de Dieu, tout ce qui se préparait... montait vers cet «accomplissement»: le sacrifice glorieux de Jésus par amour sauveur. Les Poémes du Serviteur, et beaucoup de Psaumes, en particulier, montraient que «la souffrance du juste, loin détre inutile, posséde une extraordinaire fécondité » : on y passe de la souffrance a l’action de grace et a la proclamation des merveilles de Dieu a tous les peuples. La «mission», le retentissement universel, étaient déja présents dans ces textes (Isaie 49-50).", "page": 101, "kind": "p"}, {"id": "r17p28", "text": "Les souffrances... du Messie... sa résurrection... et la conversion proclamée en son nom pour le pardon des péchés, a toutes les nations...", "page": 102, "kind": "h"}, {"id": "r17p29", "text": "Oui, le souci missionnaire remplissait le coeur de Jésus. Il voyait a l’avance les milliards d’hommes et de femmes qui le suivraient et laimeraient. Il voyait les milliards de pécheurs qui seraient baignés dans le « bain du pardon des péchés», plongés dans la miséricorde de amour de Dieu, baptisés dans Esprit Saint qui pardonne et « donne la vie». Dieu est amour! Nous retrouvons ici ce que saint Jean nous avait dit, dimanche dernier : le « souffle de Jésus pour la rémission des péchés».", "page": 102, "kind": "p"}, {"id": "r17p30", "text": "Et nous accueillons ce message de «résurrection». A quoi sert la résurrection, pourrions-nous dire? A « proclamer le changement», la conversion, la « métanoia»: changez de vie, ressuscitez, vivez... mais vivez donc! La résurrection est un dynamisme de vie! Elle met en mouvement.", "page": 102, "kind": "p"}, {"id": "r17p31", "text": "La conversion proclamée a toutes les nations, en commencant par Jérusalem. C’est vous qui en étes les témoins.", "page": 102, "kind": "h"}, {"id": "r17p32", "text": "La « mission de lEglise» commence 4 la résurrection, dans le dynamisme de Paques, avec Jésus « vivant» parmi ses témoins... a partir de ce point désormais central sur notre planéte : Jérusalem! Ce lieu unique ot I’on fit un trou dans la terre pour planter la croix, et qui devient dés lors l'axe du monde. Cette ville unique ot notre pauvre planéte, au lieu d’étre Pimmense nécropole ot l’on enterre les morts, devient le lieu du « tombeau vide», de la vie qui triomphe. Seigneur, donne-moi cette «force» venue d’en haut (Luc 24/49) pour étre ton temoin: Veni Creator Spiritus... Viens Esprit Créateur...", "page": 102, "kind": "p"}]}, {"id": 18, "title": "4e Dimanche de Pâques", "group": "Pascua", "page": 103, "ref": "Jean 10/11.18", "paragraphs": [{"id": "r18p1", "text": "Je suis...", "page": 103, "kind": "h"}, {"id": "r18p2", "text": "Relisez lentement ces deux mots: «Je suis!» Mettez-les dans la bouche de Jésus. Devant Jésus, la grande question qui se pose, c’est celle de son identité: qui est-il? Tous ceux qui l’ont approché de son vivant ont été frappés par rénigme de sa personne. II posait des actes étonnants. II parlait «comme jamais personne n’avait parlé.» Il avait méme parfois lair de prendre la place de Dieu!", "page": 103, "kind": "p"}, {"id": "r18p3", "text": "Ainsi, a de multiples reprises, il a utilisé des formules sur lesquelles nous pouvons glisser, hélas, sans.en comprendre toute la densité :", "page": 103, "kind": "p"}, {"id": "r18p4", "text": "— Je suis le pain de vie... — Je suis la lumiére du monde... — de suis la porte...", "page": 103, "kind": "p"}, {"id": "r18p5", "text": "— Je suis le bon pasteur... — Je suis la vigne... — Je suis la résurrection et la vie... Toutes ces formules qui commencent par « égo eimi» en grec, «je suis», n’oublions pas que Jésus les prononcait en araméen, langue proche de Phébreux, et que le Nom propre de Dieu, c’est le tétragramme ineffable, « YHWH», ce mot de quatre lettres que nul n’osait prononcer, et qui signifie «Je suis» (Exode 3/14). Au buisson ardent du désert, Moise avait posé a Dieu la question: « Quel est ton nom?» Et la réponse énigmatique était venue du sein du feu: «Je suis celui qui suis»... en hébreu, quatre consonnes qu’un juif ne prononce jamais, et que, dans nos bibles actuelles, par respect pour leur foi (Dieu est indicible), on a parfois conservées sous leur forme originelle: on lit, des yeux, « YaH WeH», mais on prononce, a la place, «Seigneur»!", "page": 103, "kind": "p"}, {"id": "r18p6", "text": "Par ces mots, sans se nommer explicitement, Jésus osait déclarer qui il était : ’unique sauveur de Phomme, a l’exclusion de tous les faux dieux, de tous les faux sauveurs, de tous les prétendus leaders de lhumanité... lunique « berger»!", "page": 103, "kind": "p"}, {"id": "r18p7", "text": "Je suis le bon Pasteur, le vrai Berger...", "page": 104, "kind": "h"}, {"id": "r18p8", "text": "Le symbole du «berger qui conduit son troupeau» est classique, dans tout lancien orient, pour désigner les « dieux», et les «rois». Dans la Bible aussi, il s’applique a Dieu: « Le Seigneur est mon berger, je ne manque de rien» (Psaume 22/1). «Voici que jaurai soin moi-méme de mes brebis», dit Dieu (Ezékiel 34). « Voici votre Dieu qui vient: comme un berger, il fait paitre son troupeau; de son bras puissant il rassemble, il porte sur son sein les agnelets, il procure de la fraicheur aux brebis qui allaitent» (Isaie 40/10.11).", "page": 104, "kind": "p"}, {"id": "r18p9", "text": "N’oublions jamais ces références bibliques que tout juif de ce temps-la, et Jésus le premier, avait dans lesprit. Pour les auditeurs de Jésus, cette déclaration avait un sens « théologique » précis: il disait qu’il était le « messie», I’ «envoyé de Dieu», pour conduire les hommes 4 la vraie vie. La phrase qui précéde immédiatement celle-ci (quel dommage que le lectionnaire n’ait pas commencé un verset plus tdt!), est, de la bouche méme de Jésus, l'un des plus parfaits résumés de tout lévangile, et de toute la mission que Jésus revendiquait : «Je suis venu pour que les hommes aient la vie, et quils laient en abondance» (Jean 10/10).", "page": 104, "kind": "p"}, {"id": "r18p10", "text": "Nous savons combien les hommes recherchent des guides, des hommes providentiels, qui seraient capables d’analyser les situations, de diagnostiquer l'avenir, d’exorciser les dangers qui menacent, d’apporter la sécurité. J’ai personnellement le dégofit de ce flot de bétises que déversent sur nous les radios et la télé, quand certains personnages, qui ne sont que des «hommes» aprés tout, comme nous, semblent détenir la vérité, et savoir ce qui va se passer, ce qu'il faut faire: il n’y a qu’a supprimer ceci ou cela, et tout ira bien... «n’y a qu’a»... «c’est la faute a ceci ou a cela...» Elle sonne comme un coup de trompette, dans ce contexte de galvaudage et de dévaluation, cette affirmation de Pierre dans la premiére lecture de ce jour: «Ce Jésus, il est la pierre que vous aviez méprisée, vous les soi-disant batisseurs du monde, et il est devenu la pierre d’angle. En dehors de Lui, il n’y a pas de salut!» (Actes 4/12).", "page": 104, "kind": "p"}, {"id": "r18p11", "text": "Le mercenaire, lui, n’est pas le pasteur, car les brebis ne lui appartiennent pas: s'il voit venir le loup, il abandonne les brebis et s’enfuit...", "page": 105, "kind": "h"}, {"id": "r18p12", "text": "Le «bon» berger est maintenant présenté par Jésus en opposition a tous ces «sauveurs» de pacotille qui nous promettent «monts et merveilles». L’heure du danger est Pheure de la vérité: le faux berger, celui qui n’est que «mercenaire», celui qui ne fait ce boulot que pour [largent... ne cherche, au fond, que son intérét. Il se moque bien du troupeau. I] est prét, parfois, a hurler avec les loups. En tout cas, il ne risquera pas sa vie: avant tout «se» Sauver soi-méme.", "page": 105, "kind": "p"}, {"id": "r18p13", "text": "Ce berger n’est qu’un mercenaire, et les brebis ne comptent pas vraiment pour lui.", "page": 105, "kind": "h"}, {"id": "r18p14", "text": "Le vrai berger donne sa vie pour ses brebis.", "page": 105, "kind": "h"}, {"id": "r18p15", "text": "Quatre fois, dans cette seule page, Jésus dit qu'il « donne sa vie».", "page": 105, "kind": "p"}, {"id": "r18p16", "text": "N’en restons donc point aux images bucoliques, pastorales,... aux «bergeries» romantiques. L’atmosphére est dramatique: Jésus pense a un berger qui meurt pour sauver son troupeau! Image étonnante, insolite. Quand un berger meurt, il ne peut plus défendre ses brebis. Langage énigmatique, disions-nous. Jésus dit que, par sa mort, il va nous sauver. Le contexte de cette révélation de Jésus, cest lhostilité croissante des chefs religieux, aprés la guérison de laveugle-né (Jean 9).", "page": 105, "kind": "p"}, {"id": "r18p17", "text": "Ma vie, personne ne peut me lenlever, je la donne de moi-méme.", "page": 105, "kind": "h"}, {"id": "r18p18", "text": "La mort, pour Jésus, n’a pas été une surprise, ni méme une violence subie, ou seulement acceptée: il a fait de sa mort une offrande pleinement consciente et souverainement libre. Sa mort est un acte d’amour... un amour qui va jusqu’au bout! «Il n’y a pas de plus grand amour que de donner sa vie pour ceux qu’on aime» (Jean 13/1 - 15/13). Le texte grec de saint Jean est, ici, beaucoup plus fort que ce que les traductions peuvent faire transparaitre. Littéralement, il y a le mot suivant: «je dépose mon ame... je me dessaisis de ma vie...» Cette formule insolite, elle aussi, est une allusion directe au quatriéme poéme du Serviteur (Isaie 53/10), qui «dépose sa vie en sacrifice pour la multitude. »", "page": 105, "kind": "p"}, {"id": "r18p19", "text": "Et nous? Allons-nous garder notre vie et notre mort « pour nous»? Pour qui allons-nous offrir notre mort? Qui aimons-nous assez pour que cela nous rende capable de ce don supréme ?", "page": 106, "kind": "p"}, {"id": "r18p20", "text": "Moi, je suis le bon Pasteur: je connais mes brebis et mes brebis me connaissent...", "page": 106, "kind": "h"}, {"id": "r18p21", "text": "A la différence du mercenaire, pour qui les «brebis ne comptent pas»... les hommes, tous les hommes, ont du prix aux yeux de Jésus, au point quil a été capable de risquer sa vie pour chacun d’entre eux!", "page": 106, "kind": "p"}, {"id": "r18p22", "text": "— Tu as, Seigneur, risqué ta vie pour moi?", "page": 106, "kind": "p"}, {"id": "r18p23", "text": "— Oui, ce nest pas pour rire que je t’ai aimé.", "page": 106, "kind": "p"}, {"id": "r18p24", "text": "Cela va trés loin, ces mots brdlants: «je connais mes brebis». Il s’agit du verbe biblique « connaitre», qui ne signifie pas d’abord la connaissance intellectuelle, mais la «connaissance» de celui qui aime tellement un autre qu'il « naitavec» lui en s’engageant totalement pour lui... Comme un époux qui peut dire de son épouse: « Maintenant que je te connais, je suis un étre neuf... cest une nouvelle naissance!» Cette connaissance-la est une sorte de présence intime de l'un a l'autre, une compréhension réciproque, une communion de pensée et de coeur: c’est vivre-avec... cest s’engager activement pour...", "page": 106, "kind": "p"}, {"id": "r18p25", "text": "Comme le Pére me connait et que je connais le Pére.", "page": 106, "kind": "h"}, {"id": "r18p26", "text": "Voila le modéle! L’intimité amoureuse et vitale du Pére et du Fils dans le mystére de la Trinité. Rien de moins.", "page": 106, "kind": "p"}, {"id": "r18p27", "text": "Lintimité entre Jésus et ceux qu'il sauve par sa mort, ceux qu'il « fait naitre» par sa mort... cest cette méme intimité qui existe entre les personnes divines. Oui, redisons-le, cela va trés, trés loin: c’est a ’appel de son nom « Marie», que Madeleine a reconnu la voix de Jésus ressuscité (Jean 20/16). C’est ainsi que je suis connu, aussi, par mon propre nom. Merci, Seigneur, pour cet amour.", "page": 106, "kind": "p"}, {"id": "r18p28", "text": "J’ai encore d’autres brebis qui ne sont pas de cette bergerie: celles-la aussi, il faut que je les conduise.", "page": 107, "kind": "h"}, {"id": "r18p29", "text": "Elles écouteront ma voix, et il y aura un seul trou", "page": 107, "kind": "p"}, {"id": "r18p30", "text": "peau et un seul Pasteur.", "page": 107, "kind": "h"}, {"id": "r18p31", "text": "Voici le coeur universel de Jésus.", "page": 107, "kind": "p"}, {"id": "r18p32", "text": "La relation existentielle, la communauté de vie entre le Pasteur et ses brebis, la «connaissance personnelle» de chacune... Jésus affirme qu’elle est destinée a s’étendre a tous les hommes sans exception. C’est ’ampleur « cecuménique» de sa mission salvatrice. « Oicouméné» en grec, signifie « toute la terre habitée». Voila, une fois de plus, ce langage de Jésus plein d’énigmes, qui nous fait nous demander: mais qui est-il donc? pour avoir de telles prétentions ? Ne serait-il point « plus» que le petit charpentier de Nazareth, ce Jésus qui va, apparemment, mourir dans le fiasco le plus complet, d’une mort dérisoire et ignominieuse, une mort « pour rien» ?", "page": 107, "kind": "p"}, {"id": "r18p33", "text": "Une inscription funéraire du II° siécle, signée d’un certain Abercius, dit : «Je suis le disciple dun saint Pasteur... quia de grands yeux, dont le regard atteint partout.» Oui, Jésus a de grands yeux! Tout homme, un jour ou lautre, si perdu soit-il, entend «sa voix» et se sent «aimé et regardé » par lui. De son troupeau, nous ne voyons qu’une faible partie: petit troupeau... foule immense... dit le Concile.", "page": 107, "kind": "p"}, {"id": "r18p34", "text": "Le Pére m’aime parce que je donne ma vie... J’ai le pouvoir de la donner et de la reprendre: voila le commandement que jai recu de mon Pére.", "page": 107, "kind": "h"}, {"id": "r18p35", "text": "Aussi facilement qu’il «dépose et reprend» ses vétements (ce sont les mémes mots utilisés le soir du jeudi-saint en saint Jean 13/4.12), il dépose et reprend sa vie!", "page": 107, "kind": "p"}]}, {"id": 19, "title": "5e Dimanche de Pâques", "group": "Pascua", "page": 108, "ref": "Jean 15/1.8", "paragraphs": [{"id": "r19p1", "text": "Moi, je suis...", "page": 108, "kind": "h"}, {"id": "r19p2", "text": "Comme dimanche dernier, nous allons entendre Jésus dire « qui» il est. Quand une révélation de Jésus commence par ces mots solennels, nous écoutons de toute notre attention: cet homme, Jésus de Nazareth, fils de Marie... ose utiliser le nom divin, « Je-Suis-Celui-Qui-Suis» pour nous dire ce quill a conscience d’étre, lui-méme.", "page": 108, "kind": "p"}, {"id": "r19p3", "text": "La vraie vigne...", "page": 108, "kind": "h"}, {"id": "r19p4", "text": "Voila déjé une formule d’une extréme audace, pour les premiers auditeurs de Jésus. Dans toute la Bible, l'image de la «vigne» représentait «le peuple d’Israél». Voici que Jésus, comme si cela était tout naturel et allait de soi, prétend prendre la place de ce « peuple tout entier»: il applique a Sa propre personne ce qui était dit d’Israél. Et il ose méme dire que c’est lui, la « vraie» vigne, comme si l'autre nétait qu’une sorte d’ébauche, de préparation, de « figure» : Israél ancien n’était qu’une préparation du «nouvel Israél», ce peuple nouveau qu’est lEglise, qu’est Jésus en personne.", "page": 108, "kind": "p"}, {"id": "r19p5", "text": "Et ce nest pas la seule fois, ol Jésus émet cette prétention exorbitante: il s’était déja dit le « vrai» pain de vie (Jean 6) par opposition a la manne... il sétait déja dit le « vrai» pasteur (Jean 10) par opposition aux faux pasteurs, mercenaires...", "page": 108, "kind": "p"}, {"id": "r19p6", "text": "Ainsi, une fois de plus, cet homme simple, sorti d’un petit village de campagne perdu au fond d’une province de lEmpire romain, cet homme sans importance qui va mourir dans quelques semaines, rejeté par la société, trahi et renié par ses adeptes, méprisé et raillé par ses adversaires, abandonné de tous... cet homme ose se prendre pour le centre du monde et de lhistoire! Mais, justement, n’est-il quun «homme » ?", "page": 108, "kind": "p"}, {"id": "r19p7", "text": "Et mon Pére est le vigneron.", "page": 109, "kind": "h"}, {"id": "r19p8", "text": "Qui est «son» pére? De qui parle-t-il ainsi?", "page": 109, "kind": "p"}, {"id": "r19p9", "text": "Nous sommes trop habitués a ces formules. En vérité, elles expriment quelque chose qui ne va pas de soi, une vraie révolution dans histoire des relations de homme a Dieu! Il semble certain que Jésus ait constamment appelé Dieu «Abba», forme araméenne du mot «Papa», expression fort peu virile, langage enfantin, expression de tendresse, que sainte Thérése de Lisieux traduisait par « papa le bon Dieu». Dans lantiquité, dans toute labondante littérature juive aussi bien liturgique que privée, on ne trouve aucune formule de priére qui applique ce mot « Abba» a Dieu. Or, ce mot insolite, ce mot familier, qui a di apparaitre impertinent et scandaleux aux contemporains de Jésus, était couramment utilisé, en araméen, méme par les communautés primitives de langue grecque (Marc 14/36, Matthieu 26/39, Luc 22/42, Jean 14/31, Romains 8/15, Galates 4/6). Oui, dans toute la Bible, le « vigneron» d’lsraél, c’était Dieu. Limage était traditionnelle, pour traduire l'amour de Dieu pour son peuple (Isaie 5/1, Jérémie 2/21, Ezékiel 15/2, Osée 10/1, Psaume 80/9).", "page": 109, "kind": "p"}, {"id": "r19p10", "text": "Tout sarment qui ne porte pas de fruit, mon Pére Penléve ; tout sarment qui donne du fruit, Il le nettoie, pour qu'il en donne davantage.", "page": 109, "kind": "h"}, {"id": "r19p11", "text": "La comparaison du vigneron est trés réaliste: en hiver, il taille tout le bois mort et le met au feu... et il émonde une partie du bon bois pour concentrer la séve et faire produire des grappes plus nombreuses. Une vigne qui n’est plus taillée finit par ne plus donner que des feuilles. Quand on taille la vigne, elle «pleure», disent les vignerons... une séve abondante s’écoule avant que la cicatrice du bois ne se referme. Ainsi nos coeurs sous lépreuve, quand nous sommes provoqués par la souffrance.", "page": 109, "kind": "p"}, {"id": "r19p12", "text": "Tout homme, qui a visité une vigne qu’on taille, est étonné des fagots de sarments qu’on «sacrifie», pour que le cep donne «davantage»! Quand on ne sy connait pas a ce travail, on serait tenté de critiquer le vigneron. « Pourquoi y a-t-il tant de souffrance dans le monde? Pourquoi, vigneron, enléves-tu tant de sarments ? Pourquoi, vigneron, faistu saigner ta vigne ? » — « Attends jusqu’a la récolte. Alors, tu comprendras! »", "page": 109, "kind": "p"}, {"id": "r19p13", "text": "Et Jésus, le premier, lui la vraie vigne aimée du Pére, a été «émondé»: oh, le tragique émondage de cette vigne! oh, Parbre de la croix, apparemment saccagé, mais qui porte du fruit « davantage »y!", "page": 110, "kind": "p"}, {"id": "r19p14", "text": "Image du travail de Dieu dans son Eglise, et en nous: il émonde, il purifie, il nettoie. Cela fait souffrir. Mais c’est une loi de la vie, pour que la récolte finale soit plus belle.", "page": 110, "kind": "p"}, {"id": "r19p15", "text": "Mais vous, déja, vous voici nets et purifiés grace a la parole que je vous ai dite.", "page": 110, "kind": "h"}, {"id": "r19p16", "text": "Au lieu de subir la « taille», le croyant, celui qui écoute la Parole de Jésus, découvre la fécondité de cette purification: celui qui comprend qu'il est émondé 4 la suite de Jésus et «en union avec» lui peut trouver un sens dans son épreuve.", "page": 110, "kind": "p"}, {"id": "r19p17", "text": "Demeurez en moi, comme moi en vous.", "page": 110, "kind": "h"}, {"id": "r19p18", "text": "Telle est la «Parole» qui rend «net et pur» le croyant, donnant du sens a ses épreuves: il découvre que sa souffrance Punit a Jésus, le fait demeurer «en lui».", "page": 110, "kind": "p"}, {"id": "r19p19", "text": "Ce verbe « demeurer » va étre prononcé huit fois dans les quatre versets qui vont suivre! L’image est saisissante: nous pouvons demeurer en Jésus, et Jésus demeure en nous! Nous sommes unis 4 Jésus comme des sarments «dans» une vigne, nous sommes vitalement greffés sur lui. Du Christ jusqu’a nous, une seule séve circule, une seule et méme vie s’écoule...", "page": 110, "kind": "p"}, {"id": "r19p20", "text": "Ce mot «demeurer» ne signifie donc pas seulement « rester, séjourner, résider, habiter», mais «vivre avec». Voila encore un théme qui circulait dans toute la Bible: le grand réve des hommes, c’est de voir Dieu demeurer chez son peuple: «il a planté sa tente dans notre camp, au milieu de nos tentes de nomades»... «il s’est construit une Maison dans notre ville, au milieu de nos maisons»... Mais ici, notons-le une fois de plus, Jésus va plus loin: il ne s’agit plus seulement d’un vis-a-vis, mais d’une «habitation Pun chez l'autre»; un rapport nouveau unit ’homme a Dieu; une réciprocité d’intimité. Jésus reprend a son compte I’antique formule de l’Alliance: « vous serez mon peuple et je serai votre Dieu»... mais il Papprofondit en osant parler d'une immanence réciproque: «demeurez en moi comme je demeure en vous». En écoutant ces mots, nous ne pouvons pas ne pas penser a l’eucharistie, sacrement par excellence de l’Alliance, qui, sous le symbolisme du Pain que nous mangeons, fait « demeurer Jésus» au tréfonds de notre étre. D’ailleurs Jésus a utilisé les mémes formules dans le fameux discours sur le Pain de vie (Jean 6/56). « Qui mange ma chair et boit mon sang demeure en moi et moi en lui.» Prier longuement a partir de cette révélation.", "page": 110, "kind": "p"}, {"id": "r19p21", "text": "De méme que le sarment ne peut pas porter du fruit par lui-méme s'il ne demeure pas sur la vigne, de méme vous non plus, si vous ne demeurez pas en moi.", "page": 111, "kind": "h"}, {"id": "r19p22", "text": "Il exagére! Quelle prétention! Il dit que le rattachement a Lui est une nécessité vitale. Il dit que tout homme, toute femme, qui n’est pas rattaché a Lui est « mort», comme un sarment sec, bon seulement a étre jeté au feu.", "page": 111, "kind": "p"}, {"id": "r19p23", "text": "L’homme sans Dieu, 4 quoi ¢a aboutit? Si vous leur demandez, la plupart vous répondront, de fait, que leur vie se terminera par le néant de la mort. Mais nous remarquons que Jésus a une pensée encore plus radicale: il ne parle pas du futur, mais du présent!", "page": 111, "kind": "p"}, {"id": "r19p24", "text": "En dehors de moi, vous ne pouvez rien faire. Si quelqu'un ne demeure pas en moi, il est comme un sarment sec qu’on a jeté dehors, et qui se desséche. Les sarments secs, on les ramasse, on les jette au feu, et ils brdlent.", "page": 111, "kind": "h"}, {"id": "r19p25", "text": "L’homme qui entend cela peut refuser ce message: il est libre. Mais quel risque! Il ne faut pas édulcorer l’évangile : Jésus nous invite a nous mettre sous la dépendance totale de Dieu, et cette dépendance, pour Jésus, c’est la libération de tout ce qui nous empéche vraiment de « vivre». Qui refuse de se rattacher a Jésus aura «une vie», une toute petite vie, c’est certain, une toute petite vie humaine mortelle... une vie dont nous aurions tort de faire reproche a Dieu (regardez toute la souffrance de cette condition humaine absurde!), car Dieu ne nous a jamais faits pour cette «toute petite vie» ot c’est la mort qui triomphe. Il nous a faits pour «Sa» vie divine.", "page": 111, "kind": "p"}, {"id": "r19p26", "text": "Moi, je suis la vigne, et vous, les sarments. Celui qui demeure en moi et en qui je demeure, celui-la donne beaucoup de fruit.", "page": 112, "kind": "h"}, {"id": "r19p27", "text": "Porter du fruit. Cette expression est répétée six fois en quelques lignes. Voila ce que Jésus propose a l/humanité. Dieu ne s’est pas moqué de ’homme. Dieu n’a pas fait un piége mortel en créant ’homme.", "page": 112, "kind": "p"}, {"id": "r19p28", "text": "Si nous prenons ces mots au sérieux, cela va plus loin que ce quune lecture superficielle nous ferait dabord découvrir: Jésus ne se voit pas comme le «cep» (le tronc seulement, comme traduisent faussement certaines éditions de Pévangile)... sur lequel pousseraient des « rameaux», c’esta-dir2 «nous». Il se voit comme la « vigne» tout entiére... dont nous faisons partie. Saint Paul, réfléchissant sur cette image de la vigne, et songeant a l’eucharistie, dira que nous sommes les «membres du Corps du Christ».", "page": 112, "kind": "p"}, {"id": "r19p29", "text": "Nous sommes un morceau de Dieu, une parcelle de Jésus, nous sommes «fils dans le Fils», nous sommes « vivants dans le seul Vivant».", "page": 112, "kind": "p"}, {"id": "r19p30", "text": "On dit qu’a Nazareth, il y a un cep de vigne qui donne entre 350 et 370 grappes de raisins chaque année.", "page": 112, "kind": "p"}, {"id": "r19p31", "text": "Ce qui fait la gloire de mon Pére, c’est que vous donniez beaucoup de fruit. Ainsi vous serez pour moi des disciples.", "page": 112, "kind": "h"}, {"id": "r19p32", "text": "Le Pére est a lorigine et au terme de la vie de la Vigne! C’est Lui le vigneron qui coupe le sarment stérile, et émonde le sarment vigoureux, c’est Lui qui sera rempli de joie a la récolte réussie qui se prépare. Merveille d’amour, pour qui croit.", "page": 112, "kind": "p"}]}, {"id": 20, "title": "6e Dimanche de Pâques", "group": "Pascua", "page": 113, "ref": "Jean 15/9.17", "paragraphs": [{"id": "r20p1", "text": "Quelques heures avant de mournir, selon saint Jean, Jésus confia a ses amis la vision qu'il se faisait du « plan de Dieu sur le monde», le sens qu’il donnait a sa vie et a sa mort...", "page": 113, "kind": "p"}, {"id": "r20p2", "text": "Le Pére aime le Fils Comme Jésus aime le Pére", "page": 113, "kind": "p"}, {"id": "r20p3", "text": "«Comme le Pére «...comme moi, j'ai gardé", "page": 113, "kind": "p"}, {"id": "r20p4", "text": "m’a aimé...» fidélement les commandements", "page": 113, "kind": "p"}, {"id": "r20p5", "text": "de mon Pére, et je demeure ¥ en son amour.»", "page": 113, "kind": "p"}, {"id": "r20p6", "text": "Pour", "page": 113, "kind": "p"}, {"id": "r20p7", "text": "que ma joie", "page": 113, "kind": "p"}, {"id": "r20p8", "text": "soit en vous", "page": 113, "kind": "p"}, {"id": "r20p9", "text": "let que vous soyez", "page": 113, "kind": "p"}, {"id": "r20p10", "text": "comblés de", "page": 113, "kind": "p"}, {"id": "r20p11", "text": "joie!", "page": 113, "kind": "p"}, {"id": "r20p12", "text": "Jésus aime les hommes", "page": 113, "kind": "p"}, {"id": "r20p13", "text": "« ...MOi aussi, je vous", "page": 113, "kind": "p"}, {"id": "r20p14", "text": "ai aimés. Je vous appelle", "page": 113, "kind": "p"}, {"id": "r20p15", "text": "mes amis. Il n’y a pas", "page": 113, "kind": "p"}, {"id": "r20p16", "text": "de plus grand amour", "page": 113, "kind": "p"}, {"id": "r20p17", "text": "que de donner sa vie", "page": 113, "kind": "p"}, {"id": "r20p18", "text": "pour ceux qu’on aime.»", "page": 113, "kind": "p"}, {"id": "r20p19", "text": "+", "page": 113, "kind": "h"}, {"id": "r20p20", "text": "Et aimer aussi Jésus «Si vous étes mes disciples, vous étes fidéles 4 mes commandements, vous demeurez u dans mon amour...»", "page": 113, "kind": "p"}, {"id": "r20p21", "text": "a", "page": 113, "kind": "h"}, {"id": "r20p22", "text": "Les hommes doivent s’aimer les uns les autres", "page": 113, "kind": "p"}, {"id": "r20p23", "text": "«Mon commandement, le voici: aimez-vous", "page": 113, "kind": "p"}, {"id": "r20p24", "text": "les uns les autres, comme je vous", "page": 113, "kind": "p"}, {"id": "r20p25", "text": "ai aimés. Portez du fruit qui", "page": 113, "kind": "p"}, {"id": "r20p26", "text": "demeure...»", "page": 113, "kind": "p"}, {"id": "r20p27", "text": "Cette admirable page de saint Jean est un hymne a l'amour. Ce mot «aimer», «amour», «ami», y est répété 11 fois... conjugué avec le mot «commandement» : pour Jésus, la joie de l’Aimé c’est de faire la volonté de celui qui l'aime.", "page": 114, "kind": "p"}, {"id": "r20p28", "text": "On ne peut pas ne pas étre frappé par le « mouvement» qui circule dans cette page: une sorte de danse intérieure, des refrains concentriques qui apparaissent, disparaissent, et reviennent... des vagues déferlantes... une cascade qui descend de ld-haut, de Dieu, et qui remonte vers sa source.", "page": 114, "kind": "p"}, {"id": "r20p29", "text": "Au coeur de cette révélation: la joie! «Je vous ai dit tout cela pour vous partager “ma joie”, et pour que vous soyez comblés de joie!»", "page": 114, "kind": "p"}, {"id": "r20p30", "text": "A Pheure ot Jésus passait de ce monde a son Pere, il disait a ses disciples: « Comme le Pére m’a aimé, moi aussi je vous ai aimés...))", "page": 114, "kind": "h"}, {"id": "r20p31", "text": "Ce sont donc les derniéres confidences de Jésus, la veille de son «départ». Tout commence, pour Jésus, dans le secret de Dieu, dans l’abime invisible qui est la « source» de tout. En Dieu, il n’y a pas de solitude, ni de tristesse, mais la joie d’un amour vécu entre trois personnes qui ne cessent de s’aimer: Dieu est amour! Le Pére aime le Fils, et ils donnent la joie de leur amour a leur Esprit commun. Cet amour invisible s’est mis un jour a s’iincarner, dans une nature humaine, Jésus de Nazareth. Le mystére d’amour divin est devenu repérable, visible, sensible: il a fait battre un coeur d’homme: «le Pére m’a aimé...»", "page": 114, "kind": "p"}, {"id": "r20p32", "text": "« Moi aussi, je vous ai aimés...»", "page": 114, "kind": "h"}, {"id": "r20p33", "text": "Mais voici que, dans cet homme, Jésus, le mouvement d’amour commence a se répandre sur lhumanité. Dieu partage son amour, en Jésus-Christ.", "page": 114, "kind": "p"}, {"id": "r20p34", "text": "Noublions jamais par quel geste Jésus nous a aimés.", "page": 114, "kind": "p"}, {"id": "r20p35", "text": "Il n’'y a pas de plus grand amour que de donner sa vie pour ses amis.", "page": 114, "kind": "h"}, {"id": "r20p36", "text": "Le «je vous aime» de Jésus a pris la forme d’une Passion, une grande passion d’amour fou et infini: «ayant aimé les siens qui étaient dans le monde, il les aima jusqu’a l’extréme, jusqu’au bout...» (Jean 13/1). L’extréme de amour, cest la croix glorieuse. C’est la Gloire de Jésus et sa Joie d’aimer sans réserve.", "page": 114, "kind": "p"}, {"id": "r20p37", "text": "Je ne vous appelle plus serviteurs, car le serviteur ignore ce que veut faire son maitre; maintenant, je vous appelle « mes amis», car tout ce que j'ai appris de mon Pére, je vous Iai fait connaitre.", "page": 115, "kind": "h"}, {"id": "r20p38", "text": "Jésus ose dire qu'il abolit la distinction entre « maitre» et «serviteur», entre «Dieu» et «homme»: il nest plus question, désormais, que d’« amis», qui n’ont plus rien de caché l'un pour autre; la tendance de l'amour, c’est de tout partager, de tout mettre en-commun: tout ce que je sais du Pére, tout ce que je recois du Pére, je vous Iai fait connaitre. Oui, l'amour refuse de « dominer » l'autre, il tend a respecter l'autre, a en faire «légal» de soi. Et nous savons, aussi, par nos expériences d’amours humaines, que deux personnes qui saiment tendent a la transparence: l'amour est communication, communion. On se dit a autre, on se révéle a lui. Jésus est celui qui a été «envoyé dans le monde» pour manifester Amour qui est en Dieu. «Tout ce que j’ai appris du Pére, je vous [ai révelé.» En Jésus, Dieu a dit son dernier mot! Il n’y a rien dautre a savoir, sur Dieu! Jésus nous a tout dit ce qu’on peut dire sur Dieu.", "page": 115, "kind": "p"}, {"id": "r20p39", "text": "Mon commandement le voici: Aimez-vous les uns les autres comme je vous ai aimés.", "page": 115, "kind": "h"}, {"id": "r20p40", "text": "Le grand fleuve divin de amour ne s/arréte pas.", "page": 115, "kind": "p"}, {"id": "r20p41", "text": "L’eau vive de la grande cascade, en arrivant au sol, s’étale, sétend, rejaillit. Il faut que les hommes, en étant « aimés» de Dieu, deviennent eux-mémes «amour», a limage de «son» amour.", "page": 115, "kind": "p"}, {"id": "r20p42", "text": "«Comme le Pére m’a aimé, je vous ai aimés...»", "page": 115, "kind": "p"}, {"id": "r20p43", "text": "« Comme je vous ai aimés, aimez-vous les uns les autres...» Ne passons pas trop vite sur ce «comme» mystérieux.", "page": 115, "kind": "p"}, {"id": "r20p44", "text": "Jusqu’ot, Seigneur, nous entraines-tu? Jusqu’ot. nous demandes-tu d’aimer? Jusque-ld ot ton amour t’as conduit: «Il n’y a pas de plus grand amour que de donner Sa vie...»", "page": 115, "kind": "p"}, {"id": "r20p45", "text": "Aimer jusqu’a donner notre vie. « Voici mon corps livré, mon sang versé: faites cela en mémoire de moi, faites cela comme moi!» La mesure de l’amour, c’est de donner sans mesure. La mesure de l'amour, cest la croix.", "page": 116, "kind": "p"}, {"id": "r20p46", "text": "Aimer! Aimer! Aimer!", "page": 116, "kind": "p"}, {"id": "r20p47", "text": "Tu dis, Jésus, que c’est ton commandement, comme s'il ny en avait qu’un. C’est le commandement qui te tient a coeur. Quand j’aime les autres, je fais ce que tu ne cesses de faire. Quand nous nous aimons, «il fait Dieu», il fait «beau temps», parmi les hommes. Sous cet éclairage, je regarde ma vie concréte.", "page": 116, "kind": "p"}, {"id": "r20p48", "text": "Les uns... les autres... Qui est-ce, pour moi? Qui aije a aimer? De qui suis-je responsable? Qui attend de moi quelque chose? Quelle est mon attitude envers mon entourage, ma famille, mes collégues de travail ?", "page": 116, "kind": "p"}, {"id": "r20p49", "text": "Demeurez dans mon amour. Si vous étes fidéles a mes commandements, vous demeurerez dans mon amour. Vous étes mes amis si vous faites ce que je vous Commande...", "page": 116, "kind": "h"}, {"id": "r20p50", "text": "Pour beaucoup de nos contemporains, le mouvement de Pamour s’arréte a la solidarité entre fréres. Il faut que les couples, les familles, les races s’aiment. On parle alors d’ « horizontalité » de ’amour. L’univers humain est réduit a Phorizon terrestre.", "page": 116, "kind": "p"}, {"id": "r20p51", "text": "Pour Jésus, manifestement, il y a une double « verticalité » qui traverse homme: l'amour nous vient d’en haut, de Dieu... Pamour est fait pour retourner en haut, vers Dieu... Il faut quil y ait le plus grand nombre d’hommes qui deviennent «ses disciples». C’est-a-dire qui deviennent des hommes conscients de ce qui se joue dans les amours de la terre: il faut reconnaitre Amour, il faut reconnaitre Dieu, et lPaimer. Et nous voyons Jésus réclamer cet amour: soyez fidéles, demeurez dans mon amour, soyez mes amis. Les disciples de Jésus, les chrétiens, sont cette portion d’humanité qui «aime Jésus» consciemment: immense responsabilité !", "page": 116, "kind": "p"}, {"id": "r20p52", "text": "Les animaux aussi s’aiment, aprés tout. Mais ’homme, dans lunivers, est capable, lui, non seulement de vivre de cette grande énergie d’amour, mais de savoir d’ot elle vient, et ot elle va, pour en rendre grace a la source.", "page": 116, "kind": "p"}, {"id": "r20p53", "text": "Comme moi, jai gardé fidélement les commandements de mon Pére, et je demeure en son amour.", "page": 117, "kind": "h"}, {"id": "r20p54", "text": "Alors la boucle s’achéve. Le grand mouvement, parti du Pére, est remonté a sa source, et nous contemplons, en un saisissant raccourci, la vision que Jésus se faisait de homme:", "page": 117, "kind": "p"}, {"id": "r20p55", "text": "— une humanité aimée de Dieu, d’un Dieu Pére...;", "page": 117, "kind": "p"}, {"id": "r20p56", "text": "— une humanité de fréres, qui s’aiment entre eux... ;", "page": 117, "kind": "p"}, {"id": "r20p57", "text": "— un groupe de disciples, une Eglise, qui reconnait lamour du Pére...", "page": 117, "kind": "p"}, {"id": "r20p58", "text": "Je vous ai dit tout cela pour que ma joie soit en vous, et que vous soyez comblés de joie.", "page": 117, "kind": "h"}, {"id": "r20p59", "text": "La joie de Jésus, c'est d’étre aimé, d’étre aimé du Pére, et cest aussi d’aimer, d’aimer ses fréres... et c’est de reconnaitre le Pére et de L’aimer! La joie devrait étre la caractéristique du chrétien, comme c’est la caractéristique de Jésus.", "page": 117, "kind": "p"}, {"id": "r20p60", "text": "Quest-ce que ¢a change d’étre chrétien? disent parfois certains.", "page": 117, "kind": "p"}]}, {"id": 21, "title": "7e Dimanche de Pâques", "group": "Pascua", "page": 118, "ref": "Marc 16/15.20", "paragraphs": [{"id": "r21p1", "text": "Les versets 9 dG 20 de ce dernier chapitre de saint Marc ne se trouvent pas dans les manuscrits les plus anciens, et sont inconnus de plusieurs Péres de l’Eglise. L’opinion la plus courante est que ces versets ont été rajoutés, par un autre auteur que Marc (le style aussi en est différent). Cette finale est pourtant « canonique», et elle fait partie du répertoire officiel des Ecritures inspirées. C’est donc une «parole de Dieu», comme le reste de l’évangile. Nous remarquons, d’ailleurs, que ces versets ne contiennent rien d’« original» : 'auteur anonyme a simplement fait une sorte de résumé de la finale des autres évangiles. L’intérét en est donc, d’abord, théologique. Nous aurons a étre attentifs aux points d’insistance que l’auteur met dans son texte.", "page": 118, "kind": "p"}, {"id": "r21p2", "text": "Jésus ressuscité dit aux onze apétres: « Allez dans le monde entier. Proclamez la Bonne Nouvelle a toute la création.»", "page": 118, "kind": "h"}, {"id": "r21p3", "text": "Si nous avons la curiosité d’aller lire le verset qui précéde immédiatement celui-ci, nous lisons: « Jésus se manifesta aux Onze, et il leur reprocha leur incrédulité, et la dureté de leur coeur, parce quills n’avaient pas cru ceux qui Pavaient vu ressuscité (Marc 16/14). Ainsi, on passe brusquement du cinglant reproche d’incrédulité a Penvoi en mission universelle. L’auteur, évidemment, schématise un peu! Nous savons, par les autres récits, qu’effectivement ils ont tous commencé par «ne pas croire». Mais ce raccourci nous parle au coeur: Dieu nous dit a travers lui que nous n’avons pas a nous attarder sur nos doutes et nos tergiversations. Jésus ressuscité bouscule ses apétres : sans tenir compte de leur incrédulité, il prend linitiative de leur faire confiance, si imparfaits qu’ils soient encore. Quel élan dans ces deux verbes actifs a limpératif: « Allez! Proclamez ! »", "page": 118, "kind": "p"}, {"id": "r21p4", "text": "Ainsi, Seigneur Jésus, tu n’attends pas que nous soyons parfaits pour nous donner des missions: ton Eglise n’est pas parfaite, tes Apdtres ne sont pas parfaits, je ne suis pas parfait. Mais ce n’est pas une bonne excuse pour ne rien faire.", "page": 119, "kind": "p"}, {"id": "r21p5", "text": "..le monde entier... toute la création...", "page": 119, "kind": "h"}, {"id": "r21p6", "text": "Que nos projets 4 nous sont petits et mesquins!", "page": 119, "kind": "p"}, {"id": "r21p7", "text": "Jésus, lui, invite ses amis a partir, A quitter leurs petites habitudes, pour aller a la rencontre des hommes. La « mission» suppose un départ, une sortie hors de chez soi, hors de son petit univers mental. Pour les Apétres, il fallait sortir du milieu juif pour aller vers les paiens. Pour nous, il s’agit de regarder les cultures nouvelles, d’accueillir les courants de pensée contemporains, d’écouter les aspirations actuelles, de « quitter nos conforts intellectuels des pensées toutes-faites», pour nous faire comprendre de tous ceux qui ne pensent pas spontanément comme nous.", "page": 119, "kind": "p"}, {"id": "r21p8", "text": "Si nous sommes fidéles 4 cet élan universel, nous nous réjouirons que des milieux nouvellement évangélisés trouvent des langages nouveaux pour dire l’évangile... et nous prierons pour que de nouveaux «continents humains», de nouvelles mentalités, accédent a lEglise, quitte A bousculer un peu nos trop petites tranquillités. L’évangile est destiné au «monde entier», a « toute la création»!", "page": 119, "kind": "p"}, {"id": "r21p9", "text": "Proclamez la Bonne Nouvelle...", "page": 119, "kind": "h"}, {"id": "r21p10", "text": "Le mot grec qui est ici, c’est « kérussein», qui signifie littéralement «crier». L’évangile, c'est d’abord un «cri», un « kérigme»! Nous avons a retrouver cet élan de nos premiers fréres dans la foi. Nous avons, nous, beaucoup intellectualisé, beaucoup programmé, beaucoup organisé... lévangélisation. « Criez la joyeuse nouvelle a toute la création», disait Jésus. A la limite, Jésus ne nous demande pas de «convaincre», de «prouver»... mais simplement de témoigner avec joie et force de notre foi.", "page": 119, "kind": "p"}, {"id": "r21p11", "text": "Il y a, hélas, des chrétiens qui ne donnent pas envie de le devenir! Ils passent leur temps a gémir, A condamner, a critiquer, a juger. Donne-nous, Seigneur, cette joie entrainante que Tu nous demandes. Que nos visages révélent a nos fréres la joie qui vient de Toi.", "page": 120, "kind": "p"}, {"id": "r21p12", "text": "Si, pour nous, la foi, la religion, est une chose morose et triste... mieux vaut nous taire sur elle. Si c’est une « bonne» nouvelle, si c’est «bon», alors, cela nous sortira par tous les pores de la peau, cela nous sortira des lévres en cri joyeux.", "page": 120, "kind": "p"}, {"id": "r21p13", "text": "Celui qui croira et sera baptisé, sera sauvé. Celui qui refusera de croire, sera condamné.", "page": 120, "kind": "h"}, {"id": "r21p14", "text": "Si Pévangile doit étre proclamé, crié, A tous les hommes, cest pour leur permettre, librement, d’acquiescer ou de refuser. La proclamation de l’évangile opére un «jugement», un peu comme le «procés de Jésus»: certains répondent par la foi, d’autres répondent par la « non-foi». Il nest pas question, évidemment, de vouer a lenfer les hommes innombrables, qui, de bonne foi, n’arrivent pas a croire. Il nest pas question non plus de se représenter une démarche de Dieu intervenant pour punir... Tout l’évangile nous prouve que Dieu ne condamne personne, mais veut sauver tous les hommes. La question n’est jamais « est-ce que Dieu va pardonner», mais « est-ce que je vais accueillir le pardon qu’il me donne d’avance». Autrement dit, celui qui refuse obstinément, pertinemment, la «bonne nouvelle», ce n’est pas Dieu qui le condamne, c’est lui qui « se condamne ».", "page": 120, "kind": "p"}, {"id": "r21p15", "text": "Comment comprendre cela?", "page": 120, "kind": "p"}, {"id": "r21p16", "text": "Tout simplement de la facon suivante: hors de lévangile, hors de Jésus vivant ressuscité, il n’y a pas de salut, il n’ya pas de réponse 4a la destinée mortelle de !homme. Hors de Jésus, ’homme est, véritablement, perdu... sa destinée est terriblement éphémére. Seul Dieu «sauve» ’homme de sa condition humaine. Seul Dieu sauve \"homme de n’«étre qu'un homme».", "page": 120, "kind": "p"}, {"id": "r21p17", "text": "« Celui qui croira... Celui qui ne croira pas...» Enjeu fantastique de nos libertés. Nul ne sait le secret de l’éternité. Mais une chose est sire: nul ne sera forcé de vivre éternellement avec Dieu. Dieu nous respecte trop pour nous violer.", "page": 120, "kind": "p"}, {"id": "r21p18", "text": "Voici les signes qui accompagneront ceux qui deviendront croyants: en mon nom, ils chasseront les esprits mauvais; ils parleront un langage nouveau:; ils prendront des serpents dans leurs mains, et, sils boivent un poison mortel, il ne leur fera pas de mal; ils imposeront les mains aux malades, et les malades s’en trouveront bien.", "page": 121, "kind": "h"}, {"id": "r21p19", "text": "L’homme moderne ne peut pas ne pas se poser quelques «questions» sur ces démons, serpents, maladies... et autres poisons dont seraient préservés les croyants. Ces « signes» promis n’ont qu’une valeur d’exemple, adaptés a une époque ot le christianisme naissait au sein d’un paganisme superstitieux ot les « magiciens» étaient rois. Le lecteur moderne doit, bien sir, prendre la signification symbolique de ces «signes». Il reste vrai, et totalement actuel, que le «croyant», avec Jésus ressuscité, entre en lutte avec «toutes les forces adverses qui asservissent et aliénent les hommes»... tout ce qui « empoisonne » l’'humanité. Il y a, aujourd’hui, des «signes» correspondant a ceux qui sont énumérés par l’auteur de cet évangile pour son temps: demandons-nous ce qui, AUJOURD’HUI, peut «faire signe» aux hommes de notre temps... Ne négligeons pas le «don des langues» : le langage, moyen de communication par excellence, est un «don de l’Esprit». Donne-nous, Seigneur, donne a tous les chrétiens, ce don de « parler un langage nouveau», ce don de faire passer ton évangile dans des coeurs nouveaux. Quant au don de « soigner et guérir les malades», nous savons combien il est attendu par nos fréres. L’évangile est une force de salut, une source de bonheur, que les chrétiens ont dans les mains: alors, ne croisons pas les mains, sachons nous en servir...", "page": 121, "kind": "p"}, {"id": "r21p20", "text": "Le Seigneur Jésus, aprés leur avoir parlé, fut enlevé au ciel et sassit a la droite de Dieu.", "page": 121, "kind": "h"}, {"id": "r21p21", "text": "L’auteur anonyme ne fait que rappeler, sans aucune mise en scéne concréte, ce que saint Luc avait raconté (Actes 1/9). Remarquons que, de ces deux expressions, Pune peut, humainement, avoir une consistance historique (la disparition visible de Jésus), tandis que lautre reléve, strictement, du domaine de la foi (l’exaltation céleste a la droite de Dieu). Prenons garde de ne pas matérialiser ces expressions: Dieu n’a ni «droite», ni «gauche», et n’est pas plus « en-haut» dans le ciel, qu’« en-bas» sous la terre! Dans la mentalité de ’époque, image du firmament, du ciel bleu, servait A évoquer le monde divin, et lon parlait de certains empereurs romains « montés au ciel». Pour Jésus, son Ascension est toute autre chose: il accéde a la Seigneurie universelle, et, pour le dire, on utilise le langage biblique du Psaume 110/1: «Oracle du Seigneur 4 mon Seigneur: Siége 4 ma droite!» Ces mots imagés veulent nous dire une réflexion théologique sur la réalité actuelle du Christ ressuscité, le Seigneur de Gloire... une réalité insaisissable aux sens ou a la raison humaine, une réalité a laquelle on n’accéde que par la foi.", "page": 121, "kind": "p"}, {"id": "r21p22", "text": "Quant a eux, ils s’en allérent proclamer partout la Bonne nouvelle.", "page": 122, "kind": "h"}, {"id": "r21p23", "text": "Ils ne semblent pas attendre une seconde. Ils partent, tout de suite. Il y a, la, un signe. Cette tombe était vide... «Ils sen allérent... Ils partent...»", "page": 122, "kind": "p"}, {"id": "r21p24", "text": "Le Seigneur travaillait avec eux et confirmait la Parole par les signes qui l’accompagnaient.", "page": 122, "kind": "h"}, {"id": "r21p25", "text": "Jésus rest plus «au tombeau»... Il est, en méme temps, «assis a la droite de Dieu, et il « travaille avec eux»! Cest bien le signe que les mots manquent pour dire la richesse du mystére de «ascension». Les mots les plus justes, semble-t-il, sont ceux de « présence cachée», une présence dynamique, qui « travaille» sous couvert d’une parole.", "page": 122, "kind": "p"}]}, {"id": 22, "title": "Ascension", "group": "Pascua", "page": 123, "ref": "Jean 17/11.19", "paragraphs": [{"id": "r22p
