h"}, {"id": "r58p11", "text": "Merveilleux Jésus! Jésus sait que le Magistrat est toutpuissant. Il lui offre pourtant une relation personnelle, essayant de le sortir de son débat juridique, pour ’amener a une prise de position ot il s’engage personnellement. «Toi, Pilate, dis-tu que je suis roi de toi-méme?» Une grande partie des problémes de notre monde technocratisé, institutionnalisé, administratifié, fonctionnarisé... est sans doute dans cette attitude ‘de Jésus qui tente de sortir de la relation « juge-inculpé», pour entrer dans la relation «d’homme-a-homme». Nous ne cessons pas de jouer des «rOles », de prendre des masques : patron-ouvrier... médecinmalade... commercant-client... assistante sociale-assisté... curé-fidéle..._ parents-enfants... professeur-éléve... Eqglise enseignante-Fglise enseignée... Quitte ton masque, Pilate! Regarde-moi dans les yeux! Toi, dis-moi ce que tu penses de moi. Ne récite plus les lecons que tu as apprises des autres. C’est «toi» qui dois prendre parti, qui dois faire « profession de foi».", "page": 307, "kind": "p"}, {"id": "r58p12", "text": "Pilate répondit: «Est-ce que je suis juif, moi? Ta nation et les chefs des prétres t’ont livré 4 moi: qu’astu donc fait? »", "page": 308, "kind": "h"}, {"id": "r58p13", "text": "On sent l’'agacement percer chez le juge. II devient agressif. Il refuse de se laisser interpeller dans sa conscience personnelle d’homme, et il revient délibérément a son «réle», a son «masque»: je ne suis pas la pour dire ce que je pense, mais pour faire l’instruction d’un procés! « Qu’as-tu fait?» Jésus a essayé de rencontrer « quelqu’un»... Pilate joue son «personnage». C’est tout de méme lui qui «domine», c’est tout de méme lui qui a l’autorité, enfin!", "page": 308, "kind": "p"}, {"id": "r58p14", "text": "L’artisan de Nazareth n’aura pas raison devant César! Qui eut pu dire, ce jour-la, que ce n’est pas César, avec le lourd piétinement de ses Légions invincibles, qui va modeler le monde de demain... mais le petit charpentier méprisé. De lui va sortir, pour des millénaires, une humanité neuve.", "page": 308, "kind": "p"}, {"id": "r58p15", "text": "Jésus déclara: «Ma royauté ne vient pas de ce monde; si ma royauté venait de ce monde, j‘aurais des gardes qui se seraient battus pour que je ne sois pas livré aux Juifs...", "page": 308, "kind": "h"}, {"id": "r58p16", "text": "Jésus ne répond pas a la question de son juge (« qu’as-tu fait 2»). C’est lui qui, sans dominer son interlocuteur, méne pourtant le débat sur les sujets qu'll veut aborder. Jésus léve Pambiguité du titre de roi, sur lequel Pilate méne l’enquéte. Il y a, au moins, trois maniéres détre «roi»: 1° Royauté politique, a la maniére de Rome: on domine les autres en les asservissant...; 2° Royauté messianique, a la maniére de lattente juive: un descendant de David remonte sur le tréne de sa légitimité royale et triomphe des ennemis d'Israél et de Dieu (!) en les écrasant... ; 3° Enfin, la Royauté a la maniére de Jésus: une royauté mystique qui ne contraint et n’écrase personne (« veux-tu me suivre?»... « voulez-vous partir vous aussi ?»...), une royauté qui laisse le «roi» se faire «livrer» sans défense a ses ennemis, un Président sans «gardes pour le défendre», sans «gorilles pour le préserver de la foule... un royaume sans armées, sans tanks et sans fusées... (Un dirigeant soviétique demandait, naivement, combien le Pape pouvait lever de « divisions blindées » !)", "page": 308, "kind": "p"}, {"id": "r58p17", "text": "Jésus a constamment agi en « souverain» : il a expulsé les démons de homme, il a terrassé le mal, il a dominé la mer en furie, il a renouvelé l’enseignement de la Loi juive avec une autorité sans égale. Mais, en cela, il n’a jamais « soumis» personne de force. Il est ce « maitre» qui nous laisse totalement « libres», et se laisse méme « livrer » A nos coups (je médite sur ce mot «livrer» que Jésus reprend, ici). Jésus est le portrait méme de Dieu, l’image du Dieu invisible (2 Corinthiens 4/4): « qui me voit, voit le Pere!» (Jean 14/8.11 ; Colossiens 1/15). « Personne n’a jamais vu Dieu, le Fils nous I’a révélé» (Jean 1/18). Dans sa prédication rapportée par les trois évangiles synoptiques, Jésus n’a pas cessé de parler du «Royaume de Dieu»: mais c’est un «royaume» pas comme ceux de la terre! Un royaume caché, comme une toute petite graine de moutarde devenant un grand arbre... comme une poignée de levain qu’une femme méle a la pate... comme le grain de blé qui meurt en terre pour porter du fruit. Jésus est «roi», oui, mais a la maniére de Dieu. Et Dieu n’est, décidément, pas comme on l’imagine. Dieu « régne», chantaient les psaumes (Psaumes 46/9, 54/20, 58/14, 92/1, 96/1, 98/1.4, 145/10). Et Jésus nous fait dire au Pére: «Que ton Régne vienne!» Dieu n’écrase pas ses ennemis. Dieu ne contraint pas les hommes 4 croire en lui. «Il fait lever son soleil sur les justes et sur les injustes, sur les méchants et sur les bons, sur les athées et sur les croyants...» (Matthieu 5/43.48). Dieu aime ceux qui ne l’aiment pas. Il nous demande d’en faire autant. Il n'est pas «roi»! Non! Il n’est absolument pas roi. II ne ressemble a aucun des rois de la terre.", "page": 309, "kind": "p"}, {"id": "r58p18", "text": "Non, ma royauté ne vient pas d'ici.", "page": 309, "kind": "h"}, {"id": "r58p19", "text": "Aprés avoir nettement distingué sa royauté de toutes les autres, Jésus peut, maintenant, proclamer qu'il est roi... car, désormais, nul ne peut plus se méprendre sur le sens de cette royauté, qui n’a rien a voir avec les pouvoirs d’icibas: elle vient «d’ailleurs» dit-il. Il n’éprouve méme pas le besoin de préciser cet «ailleurs» d’ou il vient! On peut le tuer. On va le tuer. Il régne. Il triomphe. Paradoxe de cet «ailleurs» divin: sa gloire est hors des atteintes de lépreuve et de l’échec terrestre. Sa royauté («divine »!) ne le préserve pas de mourir corporellement. Sa gloire est celle d’«étre élevé de terre» sur la croix et a droite du Pére.", "page": 309, "kind": "p"}, {"id": "r58p20", "text": "Pilate lui dit: « Alors, tu es roi, toi?»", "page": 310, "kind": "h"}, {"id": "r58p21", "text": "Comme il est significatif, dans la bouche de Pilate, ce pronom («toi») renvoyé aprés le verbe dans le texte grec: Roi? Toi? Alors? Toi, ’'imposteur. Toi, celui qu’on va rayer de histoire d’un trait de plume. Toi, celui que je vais faire disparaitre. Toi, pauvre prisonnier sans défense.", "page": 310, "kind": "p"}, {"id": "r58p22", "text": "Jésus répondit: « C’est toi qui dis que je suis roi. Je suis né, je suis venu dans le monde pour ceci: rendre témoignage a la vérité.»", "page": 310, "kind": "h"}, {"id": "r58p23", "text": "«Venu»... Il dit quil est «venu»... venu d’ailleurs, venu dans le monde.", "page": 310, "kind": "p"}, {"id": "r58p24", "text": "Dans le second texte lu ce dimanche, nous avons entendu Jean définir Jésus comme le «témoin fidéle». Ce mot «témoin», traduit le mot grec «martus» d’ot est venu le mot francais « martyr». Il a mis le prix a sa royauté, a son témoignage!", "page": 310, "kind": "p"}, {"id": "r58p25", "text": "Tout homme qui appartient a la vérité, écoute ma voix.", "page": 310, "kind": "h"}, {"id": "r58p26", "text": "En quoi consiste donc cette royauté du Christ-Roi? Rassembler dans une méme «écoute» de la méme «voix» tous ceux qui « appartiennent a la vérité». Il « régne» par la Foi que nous lui donnons, par la Confiance que nous faisons a sa Parole, par la correspondance de notre vie quotidienne 4 «sa voix». A cette royauté, nul ne peut échapper: étre homme, c’est opter pour ou contre la « vérité»... Honorer le Christ-Roi, ce n’est pas d’abord lui mettre de lencens, ce n’est pas lui faire des cérémonies triomphales, ressemblant aux vanités des rois de la terre... c’est « écouter sa voix», et conformer notre vie personnelle, familiale, professionnelle, sociale, 4 cette « voix».", "page": 310, "kind": "p"}]}, {"id": 59, "title": "Naissance de saint Jean Baptiste · 24 juin", "group": "Fiestas", "page": 311, "ref": "Luc 1/57.80", "paragraphs": [{"id": "r59p1", "text": "24 juin", "page": 311, "kind": "h"}, {"id": "r59p2", "text": "Il arrive que la Saint Jean _tombe-un jour de dimanche. Alors on la célébre. C’est la seule féte de «saint», avec celle de Jésus, qu’on célébre le jour de sa naissance humaine. Pour les autres, on choisit le jour de leur « mort», qui est le jour de leur « naissance au ciel». Depuis ses origines, au IV¥ siécle, la nativité de Jean Baptiste est trés populaire, c’est la « Saint Jean d’été» avec ses «feux de Saint Jean»... Comme la féte de Noél, placée au solstice dhiver, la Saint Jean est placée au solstice d’été, six mois plus tét. A partir du 24 juin, jour le plus long de l'année, les jours diminuent progressivement jusqu’au 25 décembre, jour le plus court. Ainsi se vérifie, dans les grands mythes inconscients de I’Occident, la parole de Jean Baptiste: «Il faut qu’ grandisse, et que moi, je diminue». La vraie lumiére, c’est l’enfant-Dieu, seul soleil du monde. -", "page": 311, "kind": "p"}, {"id": "r59p3", "text": "Quand arriva le moment ow Elisabeth devait enfanter, elle mit au monde un fils.", "page": 311, "kind": "h"}, {"id": "r59p4", "text": "Luc a construit les récits de l’enfance pour mettre en paralléle les deux enfants:", "page": 311, "kind": "p"}, {"id": "r59p5", "text": "— annonciation au prétre Zacharie dans le Temple a Jérusalem... ;", "page": 311, "kind": "p"}, {"id": "r59p6", "text": "annonciation a la jeune fille Marie dans sa maison privée a Nazareth... ;", "page": 311, "kind": "p"}, {"id": "r59p7", "text": "— naissance de Jean Baptiste 4 Ain Karim... d’une mére stérile... ; \"", "page": 311, "kind": "p"}, {"id": "r59p8", "text": "naissance de Jésus a Bethléem... d’une vierge... ;", "page": 311, "kind": "p"}, {"id": "r59p9", "text": "— Jean Baptiste se retire au désert...;", "page": 312, "kind": "p"}, {"id": "r59p10", "text": "Jésus est présenté au Temple...", "page": 312, "kind": "p"}, {"id": "r59p11", "text": "«Fils de prétre», Jean Baptiste sera prétre automatiquement, car le sacerdoce était alors héréditaire ; on était prétre de pére en fils, consacré au service de Dieu. Zacharie et Elizabeth, les parents, étaient «des justes devant Dieu» (Luc 1/6). C’étaient aussi des « pauvres» : ils navaient pas denfant... dure épreuve dans ces peuples pauvres ot! une nombreuse descendance est une bénédiction de Dieu, et la seule vraie richesse!", "page": 312, "kind": "p"}, {"id": "r59p12", "text": "Ses voisins et sa famille apprirent que le Seigneur lui avait prodigué sa miséricorde, et ils se réjouissaient avec elle.", "page": 312, "kind": "h"}, {"id": "r59p13", "text": "La joie, lallégresse, est une des caractéristiques de laveénement des temps messianiques (Luc 1/14 - 1/28 - 1/44 - 1/47 - 2/10). Quand on me voit vivre, est-ce bien évident que la joie est caractéristique de ceux qui croient en Dieu? Une joie d’autant plus vive qu’elle finissait par étre réputée impossible, et qu’elle avait été différée longtemps. La joie chrétienne n’est pas forcément la joie facile! C’est aussi une joie conquise sur tout ce qui agresse notre équilibre. Une joie partagée par les proches et les amis. Savons-nous «nous réjouir» avec les autres? Savons-nous partager nos joies ?", "page": 312, "kind": "p"}, {"id": "r59p14", "text": "Une joie qui vient «de Dieu», parce que «le Seigneur a prodigué sa miséricorde» a légard de cette mére. C’est une marque d’amour, une grace, une bienveillance de Dieu, quand un homme vient au monde. Est-ce bien si évident? Notre Occident gavé n’a-t-il point perdu quelques valeurs vitales essentielles? Avons-nous le sentiment, réellement, que «vivre» est une chance? Sommes-nous, au fond, heureux d’avoir été appelés a l’existence ? a une existence éternelle ? Miséricorde de Dieu: est-ce que ces mots eux-mémes ont du sens pour nous? Nous pourrions ne pas étre: préférerions-nous ce vide, ce néant? Seule la vie éternelle est vraie, et c’est un « don» de Dieu, une « miséricorde» de Dieu qui nous aime. Tout ce qui met notre existence en question, toute épreuve, n’est que du provisoire, du transitoire: ce qui nous est donné quand un homme vient au monde, c’est l'amour de Dieu, un amour éternel. A Ain Karim, dans les montagnes de Judée, en ce tempsla, chez ces pauvres-la, on se réjouissait de la vie toute neuve de ce bébé attendu, désiré, inespéré...", "page": 312, "kind": "p"}, {"id": "r59p15", "text": "Ils voulaient le nommer Zacharie comme son pére. Mais sa mére déclara: « Non, il s’appellera Jean.»", "page": 313, "kind": "h"}, {"id": "r59p16", "text": "Dans la pensée de beaucoup de peuples, le «nom» est beaucoup plus qu’une désignation de [état civil, ou une soumission superficielle 4 des noms 4 la mode. Les parents, en donnant un nom a I’enfant, dans la Bible, indiquent une vocation, un «sens». Tous les noms de cette page d’évangile sont une «bonne nouvelle». « Zacharie» signifie « Dieu se souvient»..., «Elisabeth» signifie «Dieu a promis»... «Jean» signifie « Dieu fait grace»... Chacun de ces personnages porte un nom de verbe d’action, dont Dieu est le sujet, l’acteur! Ai-je la conviction de ne pas @tre le fruit du hasard, mais d’un amour? Ai-je la conviction que j'ai de limportance, parce que j’ai été voulu par Dieu et aimé d’un amour éternel? Le monde est absurde, disent les athées. Le monde va vers le bonheur méme de Dieu, disent les «hommes de foi».", "page": 313, "kind": "p"}, {"id": "r59p17", "text": "On lui répondit: « Personne dans ta famille ne porte ce nom-la.»", "page": 313, "kind": "h"}, {"id": "r59p18", "text": "Eh oui! C’est la nouveauté. On sort des sentiers battus et des traditions, si vénérables qu’elles soient. Un temps nouveau commence. Et cela parait étrange 4 ceux qui sont figés dans les temps anciens. Dans la jeunesse de lEglise, -PEsprit en a bouleversé des « usages»! L’Esprit déjoue les plans trop sages des hommes. Oui, il s’appellera Jean-Dieu fait-grace! « Alors, les fidéles venus du judaisme s’étonnerent que la grace de l’Esprit Saint ait été répandue aussi sur les paiens» (Actes 10/45).", "page": 313, "kind": "p"}, {"id": "r59p19", "text": "On demandait par signes au pére comment il voulait Pappeler... Il écrivit sur une tablette: «Son nom est Jean». Et tout le monde en fut étonné... A instant méme sa bouche s’ouvrit, sa langue se délia: il parlait, et il bénissait Dieu.", "page": 313, "kind": "h"}, {"id": "r59p20", "text": "Les premiers mots que la bouche muette prononce sont des paroles de louange. C’est le temps nouveau, le temps du salut. Cette naissance commence une libération qui permet d’annoncer les merveilles de Dieu. Il faudrait lire ici le « Benedictus», ce cantique d’action de grace mis dans la bouche de Zacharie : « Béni soit le Seigneur... Il fait surgir la force qui nous sauve... salut qui nous arrache a l’ennemi, a la main de tous nos oppresseurs, amour quil montre envers nos péres... afin que, délivrés de la main des ennemis, nous le servions dans la justice et la sainteté, en sa présence, tout au long de nos jours... Et toi, petit enfant, tu marcheras devant, a la face du Seigneur, pour donner a son peuple de connaitre le salut par la rémission de ses péchés, grace a la tendresse, a l’amour de notre Dieu...» Dieu commence 4 « faire grace»: le pauvre pére agé qui nvavait pas voulu croire a limpossible («car rien n’est impossible 4 Dieu!») se voit pardonné, et guéri.", "page": 314, "kind": "p"}, {"id": "r59p21", "text": "La crainte saisit alors les gens du voisinage, et dans toute la montagne de Judée on racontait tous ces événements.", "page": 314, "kind": "h"}, {"id": "r59p22", "text": "Cette crainte n’est pas une phobie, une: angoisse panique et servile, celle dont le croyant doit étre délivré (I Jean 4/18)... il sagit de la « crainte» au sens biblique, c’est-a-dire de lattitude de homme qui approche le divin. Un mystére plane sur tous ces événements. Les secrets desseins de Dieu sont insondables. Nous, nous préférons souvent la banalité vide et monotone du contrdlable, du rationnel. Nous trouvons plus commode et plus tranquille de ne pas étre saisis par cette crainte révérentielle que provoque for- cément le mystére infini de Dieu.", "page": 314, "kind": "p"}, {"id": "r59p23", "text": "Tous ceux qui apprenaient ces événements les gravaient dans leur coeur, et disaient: « Que sera donc cet enfant ?»", "page": 314, "kind": "h"}, {"id": "r59p24", "text": "Alors, personne ne le savait! Il fallait faire confiance, accepter de prendre «le beau risque de la foi», se laisser guider dans laventure.", "page": 314, "kind": "p"}, {"id": "r59p25", "text": "Mais quand Luc transcrit cette question des gens du village d’Ain Karim, il sait, lui, ce qu’est devenu cet enfant! L’homme qui se retire au désert, loin des hommes, prés de Dieu. La voix qui crie dans le désert que le Messie est proche. Lvaffrontement avec le tout-puissant Hérode (Luc 3/19). L’arrestation et la mise en prison dans la forteresse de Machéronte, d’ot Jean Baptiste ne sortira que pour avoir la téte tranchée et apportée sur un plat au cours dune orgie... Il naura, alors, qu’un peu plus de 30 ans! Voila «ce que sera cet enfant».", "page": 314, "kind": "p"}, {"id": "r59p26", "text": "Une vie ratée?", "page": 315, "kind": "p"}, {"id": "r59p27", "text": "La main du Seigneur était avec lui, L’enfant grandit, et son esprit se fortifiait.", "page": 315, "kind": "h"}, {"id": "r59p28", "text": "Oui, Luc, sachant tout ce qu'il sait, ose écrire cela.", "page": 315, "kind": "p"}, {"id": "r59p29", "text": "La vraie réussite d’une vie n’est pas forcément ot nous sommes tentés de la placer. Rater sa vie, c’est ne pas faire la volonté de Dieu. Jean Baptiste, lui, courageux et fort, a parfaitement réussi sa vie: il a réalisé ce que Dieu attendait de lui.", "page": 315, "kind": "p"}, {"id": "r59p30", "text": "« Voici la Saint Jean, la belle journée, oti les amoureux vont a lasssemblée.» Ainsi chantaient nos ancétres, aux époques ou la foi et la vie étaient li¢es ensemble. Vive la Saint Jean d’été! Allumons les feux de joie. Saint Jean Baptiste, priez pour nous! Petit enfant qui nait aujourd’hui, tu seras appelé prophéte du Trés-Haut, tu prépareras ses chemins, grace a la tendresse, a |’amour de notre Dieu, pour illuminer ceux qui habitent les ténébres et l’ombre de la mort, quand nous visite lastre d’en-haut. « Allons, joli coeur, la lune est levée!» é", "page": 315, "kind": "p"}, {"id": "r59p31", "text": "Savez-vous que les notes de la gamme (ut, ré, mi, fa, sol, la, si) sont les premiéres syllabes de chaque vers de Phymne latine en ’honneur de saint Jean Baptiste? Une fete de joie et de musique, voyez!", "page": 315, "kind": "p"}]}, {"id": 60, "title": "Assomption · 15 août", "group": "Fiestas", "page": 316, "ref": "Luc 1/39.56", "paragraphs": [{"id": "r60p1", "text": "15 aoit", "page": 316, "kind": "h"}, {"id": "r60p2", "text": "L’Assomption de Marie est fétée dans les Eglises d’Orient et d’Occident depuis le V¢ siécle. Le pape Pie XII l’'a défini comme dogme de foi le 1°\" novembre 1950: « L’Assomption est le privilege en vertu duquel I’Immaculée Mére de Dieu a été glorifiée, a la fin de sa vie terrestre, dans son dme et dans son corps, sans attendre la résurrection finale.» C’était déja la foi de l’Eglise depuis longtemps, comme en témoigne, entre autres, ce vitrail de la Dormition de Marie, du XII° siécle, a la cathédrale d’Angers.", "page": 316, "kind": "p"}, {"id": "r60p3", "text": "Mon 4me exalte le Seigneur, mon esprit exulte en Dieu mon « Sauveur»... Il s’est penché sur son humble servante: désormais les 4ges me diront bienheureuse. Le Puissant fit pour moi des merveilles, Saint est son nom...", "page": 316, "kind": "h"}, {"id": "r60p4", "text": "Marie est la premiére des « sauvées». Son chant d'action de graces, le magnificat, fait remonter toute la gloire vers le «Sauveur», le « Puissant». La singularité de Marie, assumée corps et ame dans la gloire de Dieu, ne tient pas a ses propres mérites, mais a la grace méme de son Fils Jésus. Marie n’est pas une déesse. Elle se dit «humble servante » du Seigneur. Son magnificat n’a rien d’un chant d’orgueil. Crest un aveu d’humilité: tout ce qu’elle est vient de Dieu, par grace, et remonte vers Dieu en louange. C’est pourquoi la vraie dévotion a Marie nous renvoie constamment au mystére du Christ. Pour comprendre l Assomption de la Sainte Vierge, c’est la gloire de Jésus ressuscité qu'il faut d’abord contempler.", "page": 316, "kind": "p"}, {"id": "r60p5", "text": "Le Christ est ressuscité d’entre les morts pour étre, parmi les morts, le premier ressuscité... Dans le Christ, tous revivront, mais chacun a son rang: en premier le Christ; ensuite, ceux qui seront au Christ", "page": 317, "kind": "h"}, {"id": "r60p6", "text": "quand il reviendra... (Corinthiens 15/20.26).", "page": 317, "kind": "p"}, {"id": "r60p7", "text": "En Jésus-Christ, les « derniers temps» sont déja commencés: c'est ce que les théologiens appellent l’eschatologie, de «eschaton» = dernier. Quand nous parlons de la « fin» des temps, nous sommes toujours tentés de penser au terme ultime, a la derniére minute du temps, que nous n’avons aucun moyen d’imaginer, et que nous renvoyons dans je ne sais quel futur lointain. C’est, hélas, un bon moyen pour nous de nous désintéresser de cette «fin du monde», dont nous pensons qu'elle n’est pas faite pour nous. Mais le mot «fin du monde», au sens eschatologique vrai, désigne une réalité actuelle « déja commencée», bien que «non achevée». La «fin», en ce sens, c’est le « but» qui oriente une action dés son départ.", "page": 317, "kind": "p"}, {"id": "r60p8", "text": "« Le Christ est ressuscité... premier des vivants... tous revivront... chacun a son rang...» Ce qui a paru en JésusChrist, c’est la réalité ultime de Dieu et la réalité ultime de homme. La résurrection est non seulement «la fin des choses», mais «le fond des choses»: en Lui, Dieu nous a révelé le secret profond de sa création. C’est pour nous conduire a cette réalité merveilleuse de la vie qu’ill nous a programmés dés le départ. En Jésus ressuscité, la « fin des temps, le but de histoire, nous a touchés » (I Corinthiens 10/11).", "page": 317, "kind": "p"}, {"id": "r60p9", "text": "Par privilége, Marie a déj& abouti a cette gloire et a cet épanouissement total, qui est le but du projet de Dieu. Marie est, pour ainsi dire, le « prototype» de ce que Dieu est en train de faire avec sa création tout entiére. Ce qui est arrivé 4 Marie, dans le Christ Jésus, c’est ce qui doit arriver a l’Eglise tout entiére, A chacun de nous. La métamorphose du passage de Pétre mortel a Pétre vivant, parfaitement achevé en Jésus ressuscité, a été anticipée pour Marie sa mére. Pour le reste de l’humanité, elle est en cours de réalisation. Tant que dure lHistoire, le visage définitif, « fini», achevé, de homme n’apparait pas encore: chacun de nous est provisoirement marqué d’une ombre de mort, et nous «achevons en notre chair souffrante ce qui manque a la Passion du Christ pour son Corps qui est YEglise » (Colossiens 1/24).", "page": 317, "kind": "p"}, {"id": "r60p10", "text": "Un signe grandiose apparut dans le ciel: une Femme, ayant le soleil pour manteau, la lune sous les pieds, et sur la téte une couronne de douze étoiles. Elle était enceinte, et elle criait, torturée par les douleurs de", "page": 318, "kind": "h"}, {"id": "r60p11", "text": "Penfantement... (Apocalypse 12/1.2).", "page": 318, "kind": "p"}, {"id": "r60p12", "text": "Torturée... criant... de douleur. Telle nous apparait l’humanité, tant que dure Histoire. Les nouvelles du monde par les journaux et la télévision nous apportent chaque jour ce spectacle tragique. Au jour ot nous célébrons la gloire et le bonheur de Marie, ’Eglise nous fait évoquer combien la maternité de Marie fut douloureuse, quand elle nous enfanta, au pied de la croix.", "page": 318, "kind": "p"}, {"id": "r60p13", "text": "Ainsi, chacune de nos épreuves est une parturition. Nos souffrances actuelles sont l’enfantement du monde nouveau, avec le Christ en croix.", "page": 318, "kind": "p"}, {"id": "r60p14", "text": "C’est en Adam que meurent tous les hommes; c’est dans le Christ que tous revivront. Alors tout sera «achevé», quand le Christ remettra son pouvoir royal a Dieu le Pére, aprés avoir détruit toutes les puissances du mal. C’est lui qui doit régner en effet jusqu’au jour ou il aura mis sous ses pieds tous ses ennemis. Et le dernier ennemi qu'il détruira, c’est la", "page": 318, "kind": "h"}, {"id": "r60p15", "text": "mort (I Corinthiens 15/20.26).", "page": 318, "kind": "p"}, {"id": "r60p16", "text": "Certains esprits se contenteraient de «limmortalité de lame». Pourquoi, disent-ils, parler de «résurrection des corps» ?", "page": 318, "kind": "p"}, {"id": "r60p17", "text": "Or, nous croyons que le Verbe s'est fait chair... A chaque eucharistie, Jésus fait de nous son Corps... et Marie a été assumée en Dieu corps et ame... Ce n’est pas par hasard, ni accessoire. « Qui mange ma chair et boit mon sang a la vie éternelle, et moi je le ressusciterai au dernier jour» (Jean 6/39.51.54). Il nous faut, en ce jour de ’Assomption corporelle de Marie, retrouver le sens du «corps».", "page": 318, "kind": "p"}, {"id": "r60p18", "text": "Notre corps n’est pas un élément extérieur, mais un élément constitutif de nous-méme, par la volonté du créateur. La philosophie moderne, sur ce point-la, rejoint intuition biblique qui refuse le dualisme de Descartes. Au lieu de dire que nous sommes «composés d’une ame et d’un corps», il vaudrait mieux dire que « nous sommes un corps spirituel», ou «un esprit incarné». Saint Thomas d’Aquin disait : « Dieu a donné a ’homme esprit et la main.» Oui, ma main n’est pas seulement une chose matérielle, elle est tout entiére pénétrée d’intelligence, et ne fait que ce que mon esprit lui dicte. Inversement, mon esprit ne peut rien faire sans ma main. Il n’y a aucune séparation entre ces deux aspects de mon humanité: rien qui ne soit tout entier corporel, et rien qui ne soit tout entier spirituel.", "page": 319, "kind": "p"}, {"id": "r60p19", "text": "Quand nous parlons de «lame», nous ne parlons pas dune sorte de «chose» séparée et opposée au corps. Nous utilisons ce langage pour dire que la «personne humaine» demeure 4a travers toutes les transformations physiques qu’elle subit au cours de son histoire : ce vieillard de 80 ans au corps usé et souffrant est le méme que cet adulte de 40 ans qui travaillait jadis, et que ce bébé de 10 jours qui vagissait doucement dans son berceau. Ce corps a bien changé. Et pourtant, c’est bien la méme personne. Cet élément permanent, on I’'a appelé «ame». Il nest donc pas faux de parler ainsi. Mais il reste que la vérité de ’homme et de la femme, selon le Créateur qui nous a faits ainsi, c’est que notre corps fait partie intégrante de notre identité. Jésus a eu un corps. Jésus a un corps. Et la résurrection de la chair n’est pas un accessoire, mais la piéce maitresse du plan de Dieu. :", "page": 319, "kind": "p"}, {"id": "r60p20", "text": "On comprend que l’Assomption de Marie soit dans le droit fil de ce que Dieu veut pour tous. Dieu veut « détruire toutes les puissances du mal», jusqu’a «son dernier ennemi, qui est la mort».", "page": 319, "kind": "p"}, {"id": "r60p21", "text": "En ces jours-la, Marie se mit en route rapidement vers une ville de la montagne de Judée. Elle entra dans la maison de Zacharie et salua Elisabeth. Or, quand Elisabeth entendit la salutation de Marie, l’enfant tressaillit en elle. Alors, Elisabeth fut remplie de PEsprit Saint...", "page": 319, "kind": "h"}, {"id": "r60p22", "text": "L’évangile de lIncarnation nous raméne sans cesse aux réalités corporelles. Ici, !Esprit Saint se sert du ventre de deux femmes, pour se répandre davantage dans l’humanité. Le corps n’est pas une chose vile, lourde, méprisable. Qui méprise le corps, méprise Dieu. Qui abime les corps, abime une «image de Dieu». L’Assomption de Marie est déja contenue en germe dans cette admirable scéne.", "page": 320, "kind": "p"}, {"id": "r60p23", "text": "« Jésus, le fruit de vos entrailles, est béni... et vous, vous étes bénie entre toutes les femmes...»", "page": 320, "kind": "p"}, {"id": "r60p24", "text": "Il nous est bon que l’évangile de la « féte » de la Glorification de Marie soit cette humble scéne, si humaine! |", "page": 320, "kind": "p"}, {"id": "r60p25", "text": "Nous avons, en effet, a respecter le silence de lEcriture et sa discrétion, sur la fin terrestre de Marie. Nous n’avons aucun détail sur la mort de la Sainte Vierge. Marie a terminé ses jours dans l’anonymat et le silence. Comment? Personne ne le sait. Personne n’a jugé bon de le raconter. On sait seulement que Marie est morte «aprés son fils», puisqu’elle était au pied de la croix, le regardant mourir.", "page": 320, "kind": "p"}, {"id": "r60p26", "text": "Comme l’évangile, terminons donc notre méditation de ce jour, en contemplant Marie, autour de ses vingt ans, se mettant en route rapidement... marchant sur les routes de la montagne de Judée, avec l'enfant qu'elle’ porte en elle... Elle va chez sa cousine, pour laider: elle y restera trois mois! Comme il devait faire bon vivre avec Marie! La mére de Dieu a passé toute sa vie dans l'amour absolu du Seigneur et des autres : feu discret, mais dévorant, qui n’a pas fait de «cendres». L’heure de sa mort corporelle, ce fut celle de sa derniére offrande d’amour, sans résidu. Dans ce corps tout entier animé par cette ame, il n’y avait rien a corrompre: tout était déja consumé.", "page": 320, "kind": "p"}]}, {"id": 61, "title": "La Croix Glorieuse · 14 septembre", "group": "Fiestas", "page": 321, "ref": "Jean 3/13.17", "paragraphs": [{"id": "r61p1", "text": "14 septembre", "page": 321, "kind": "h"}, {"id": "r61p2", "text": "Dans nos esprits, la Croix est liée au Vendredi Saint. Et le Vendredi Saint reste une méditation sur la « souffrance» de la Passion, méme si l’évangile de saint Jean ow l’on en lit le récit ce jour-Ia souligne en fait la « royauté» de Jésus. Une longue tradition liturgique a voulu célébrer |’Exaltation de la Sainte Croix, la Croix Glorieuse... depuis ce 14 septembre 335 ow l’empereur Constantin, récemment converti, et sa femme sainte Héléne, firent édifier la Basilique de l'Anastasis (résurrection en grec), a Jérusalem, sur l’emplacement méme du Golgotha et du saint Sépulcre. La féte de l’Exaltation de la Sainte Croix devint trés vite extrémement populaire en Orient, et passa a l’Occident dés le V° siécle.", "page": 321, "kind": "p"}, {"id": "r61p3", "text": "Le Tropaire de ce jour, sans oublier la douleur de la croix, met en valeur la gloire de la croix, «l’arbre le plus noble de tous, celui qui eut l’insigne honneur d’étre choisi pour porter le sauveur».", "page": 321, "kind": "p"}, {"id": "r61p4", "text": "«O Croix plus noble que les cédres, sur toi la vie du monde est clouée.", "page": 321, "kind": "p"}, {"id": "r61p5", "text": "Sur toi, le Christ a triomphé, la mort a détruit la mort.", "page": 321, "kind": "p"}, {"id": "r61p6", "text": "Gloire a toi, Jésus Sauveur, ta croix nous donne la vie. »", "page": 321, "kind": "p"}, {"id": "r61p7", "text": "L’hymne de ce jour, composé par Venance Fortunat, futur évéque de Tours, en l’an 568, chanté pour la premiére fois le 19 novembre de cette méme année lors d’une procession conduite par saint Grégoire de Tours, exalte aussi l’'aspect glorieux de la croix. « Vexilla regis prodeunt, fulget crucis mysterium... Les étendards du roi s’avancent, le mystére de la croix resplendit... Arbor decora et fulgida, ornata regis purpura, electa dignus stipite tam sancta membra tangere... O bel arbre resplendissant, paré de la pourpre royale, seul arbre jugé digne de porter des membres si saints...»", "page": 321, "kind": "p"}, {"id": "r61p8", "text": "Nul n’est monté au ciel, sinon celui qui est descendu du ciel, le Fils de Phomme.", "page": 322, "kind": "h"}, {"id": "r61p9", "text": "Ce passage est tiré du long discours 4 Nicodéme. On se souvient que Nicodéme, pharisien notable, docteur de la Loi, est venu voir Jésus «de nuit». Cette scene nocturne baigne dans une atmosphére mystérieuse. Nous sommes tous dans la nuit, en fait, devant Dieu. Nous sommes, comme Nicodéme, des gens qui « cherchent dans la nuit. » Jésus, ici, révéle que les choses célestes ne peuvent étre connues que par quelqu’un qui en vient. La croix fait partie de ces réalités divines, qui ne peuvent étre comprises pleinement que par «celui qui est descendu du ciel».", "page": 322, "kind": "p"}, {"id": "r61p10", "text": "Mettons-nous en état de disponibilité, pour écouter la révélation qui va nous étre faite dans la nuit.", "page": 322, "kind": "p"}, {"id": "r61p11", "text": "De méme que le «serpent de bronze» fut élevé par Moise dans le désert.", "page": 322, "kind": "h"}, {"id": "r61p12", "text": "L’évangile utilise souvent des souvenirs bibliques. L’épisode du «serpent d’airain» était célébre. Au cours de lExode, dans le Sinai, les hébreux furent attaqués par des serpents a la morsure « brdlante » (Nombres 21/6.9). Leur venin était mortel. Moise fit monter sur un baton un serpent de bronze au milieu du camp. Ce «caducée» est l'image mythologique que les médecins continuent a prendre pour embléme, et qu’ils mettent sur leur voiture. Ce serpent de bronze était « guérisseur»: « Celui qui tournait les yeux vers le signe élevé était sauvé, non pas par l’objet regardé, mais par Toi, Seigneur» (Sagesse 16/7). Nous voyons que, selon cette interprétation du livre de la Sagesse, il ne s’agissait pas d’un geste magique, et comme automatique, malgré les apparences. Le « regard» levé vers le serpent d’airain ne sauvait pas par lui-méme, comme si c’était un geste de sorcellerie, tendu vers une «amulette» ou un <«talisman». En fait Pinterprétation rabbinique faisait déja de ce geste concret le « signe» de la foi: c’est le fait de se tourner vers Dieu, qui sauve!", "page": 322, "kind": "p"}, {"id": "r61p13", "text": "Ainsi faut-il que le Fils de Phomme soit élevé...", "page": 323, "kind": "h"}, {"id": "r61p14", "text": "Nous voici donc invités, a notre tour, a lever nos yeux vers la croix, pour étre guéris. Il nous faut oser regarder le crucifié, celui qui est «élevé» sur la colline et sur la potence. Est-ce qu'il mvarrive de prier en regardant un crucifix?", "page": 323, "kind": "p"}, {"id": "r61p15", "text": "Et nous sommes ainsi introduits au mystére propre de ce jour de la croix glorieuse. Jean a choisi ce mot «élevé» (uspothénai en grec) trés volontairement, pour dire a la fois que Jésus est physiquement élevé de terre par son gibet, mais aussi mystiquement élevé dans la gloire de la croix. L’évangile de Jean utilisera exactement le méme mot pour nous dire que Jésus est «élevé» a la droite du Pére, par la résurrection et ascension (Jean 3/14 - 8/28 - 12/32.34).", "page": 323, "kind": "p"}, {"id": "r61p16", "text": "Saint Jean était au pied de la croix, ce vendredi aprés-midi, le seul de tous les apétres a avoir osé. Il n’avait jamais oublié cette image, éclairée depuis par la lumiére de Paques. Depuis lors, pendant 70 ans, il avait médité sur la croix, et c’est le fruit de sa longue et pénétrante méditation qu'il nous livre, en la mettant sur les lévres mémes de Jésus, par un procédé classique dans |’antiquité.", "page": 323, "kind": "p"}, {"id": "r61p17", "text": "Pour Jean, la Croix et la Paque sont le méme mystere, exprimé par ce mot unique: Jésus a été élevé de terre! Pour lui, «crucifié» équivaut a «exalté». Pour Jean, lascension, l’élévation, commence des le vendredi saint. Effectivement, si la résurrection de Jésus est comme la signature de Dieu sur toute l’ceuvre de Jésus, ce n’est pas une justification «aprés-coup». Paque ne vient pas effacer la croix, comme si celle-ci était mauvaise. Paque vient dire que la Croix était la Gloire de Dieu. « Maintenant le Fils de l'homme est glorifié» (Jean 13/31), dit Jésus dés que le processus de la passion est entamé par la trahison de Judas. « Quand j’aurai été élevé de terre, j’attirerai tous les hommes a moi» (Jean 12/23.32).", "page": 323, "kind": "p"}, {"id": "r61p18", "text": "Il nous est donc proposé, 4 nous AUJOURD’HUI, de lever les yeux vers celui qui est « élevé». Un Grec cultivé ne pouvait voir dans la croix de Jésus qu’une folie barbare, un citoyen romain n’y voyait que le supplice des esclaves, un juif croyant n’y voyait qu’une malédiction divine. Mais, pour Paul, c’est la « sagesse de Dieu» (I Corinthiens 1/23). Cette libre mort de Jésus a été bien plus une « mort d’amour» qu’un crime perpétré par des tueurs. La croix de Jésus est le sommet de sa vie d’amour: amour du Fils pour son Pére... amour du frére universel pour ses fréres pécheurs... Sommet de la douleur humaine, la croix est aussi le sommet de la révélation de Dieu: la croix est lépiphanie de la Trinité! Le sens le plus profond de la croix est 4 chercher dans «l’étre méme de Dieu»: « qui m’a vu, a vu le Pére!». La croix nous révéle qui est Dieu: acte pur d’amour, pur don de soi. Cet acte supréme d’amour, que nous appelons, nous, un amour fou, est absolument et éternellement «naturel» pour le Fils du Pére: au sein de la Trinité, le Fils n’est que «don total» au Pére. La croix n’est, au fond, que la traduction concréte de ce que le Verbe ne cesse de faire de toute éternité : se donner a Autre, sans aucune réserve de soi-méme. -", "page": 323, "kind": "p"}, {"id": "r61p19", "text": "Dieu a tant aimé le monde quill a donné son Fils unique.", "page": 324, "kind": "h"}, {"id": "r61p20", "text": "Oui, cet amour extréme qui braille au coeur de cet homme, Jésus, et qui le fait mourir d’amour, est, lui-méme, le signe dun autre amour extréme, celui du Pére, qui aime lui aussi d'amour fou, jusqu’éa «donner son fils unique».", "page": 324, "kind": "p"}, {"id": "r61p21", "text": "Ainsi est dévoilé le paradoxe de la croix : signe d’ignominie, elle devient signe de victoire. Ce monde ot régne le mal, la mort, ’absurde, devient, dans la foi, un monde « aimé par Dieu». La croix dressée a Jérusalem et au centre de toute vie chrétienne, ne cesse pas de nous clamer que méme Pabsurde peut ne pas étre absurde... dans la lumiére obscure de Dieu. Si nous adoptons la facon de voir de Dieu, nos souffrances peuvent «changer de signe» : de négatives, elles peuvent devenir positives, en Jésus.", "page": 324, "kind": "p"}, {"id": "r61p22", "text": "Ainsi, tout homme qui croit en lui ne périra pas, mais", "page": 324, "kind": "h"}, {"id": "r61p23", "text": "il obtiendra la vie éternelle.", "page": 324, "kind": "p"}, {"id": "r61p24", "text": "Adopter le regard de Dieu, c’est «croire».", "page": 324, "kind": "p"}, {"id": "r61p25", "text": "La foi nous donne un regard nouveau sur tout, en particulier sur le péché, la mort, le mal. Ce monde qui nous parait parfois si mal fait, avec ses haines, ses oppressions, ses égoismes, Dieu l’aime! Non pas qu'il aime ce mal, mais parce qu'll le sait inachevé, ce monde qu'il a créé « pour le conduire a sa perfection». Un jour, il n’y aura plus ni «larme, ni cri, ni deuil» (Apocalypse 21/4). Mais aucun raisonnement rationnel ne nous conduit a cette conclusion: seule, la foi nous fait devancer le temps, et voir ce qui est invisible (Hébreux 11/1) en «possédant déjaé ce qu’on espére».", "page": 325, "kind": "p"}, {"id": "r61p26", "text": "Oui, la « vie éternelle est déjé commencée» pour ceux qui croient.", "page": 325, "kind": "p"}, {"id": "r61p27", "text": "Nest-il pas important de se souvenir de cela, quand on est devant certaines souffrances chroniques et inguérissables ?", "page": 325, "kind": "p"}, {"id": "r61p28", "text": "Car Dieu a envoyé son Fils dans le monde non pas pour juger le monde, mais pour que, par lui, le monde soit sauvé!", "page": 325, "kind": "h"}, {"id": "r61p29", "text": "Dieu est le « vivant» par excellence. Par-dela labsurdité de la mort, Il nous offre sa propre vie. Tel est le message central de tout l’évangile. Dieu veut sauver tous les hommes. Dieu veut sauver le monde entier. Il a tout fait pour cela. La mission de Jésus est de sauver. La croix en est le signe victorieux, glorieux.", "page": 325, "kind": "p"}, {"id": "r61p30", "text": "Gloire a toi, Jésus Sauveur, ta Croix nous donne la vie. Voici Parbre de vie, ot le nouvel Adam offre son sang pour rassembler les hommes en un seul Corps. Voici arbre de vie oti le Bien-Aimé du Pére ouvre a l’humanité les portes du Royaume. Voici larbre de vie ot linnocent maudit porte nos péchés, pour réconcilier la terre et le ciel.", "page": 325, "kind": "p"}]}, {"id": 62, "title": "Toussaint · 1er novembre", "group": "Fiestas", "page": 326, "ref": "Matthieu 5/1.12", "paragraphs": [{"id": "r62p1", "text": "1*° novembre", "page": 326, "kind": "h"}, {"id": "r62p2", "text": "Quand Jésus vit toute la foule qui le suivait...", "page": 326, "kind": "h"}, {"id": "r62p3", "text": "Il faut méditer ces premiers mots d’introduction du « sermon sur la montagne». Matthieu nous présente Jésus entouré, au début de son ministére, par la foule du petit peuple. Et les phrases précédentes viennent de décrire cette foule: des « malades, des infirmes, des gens qui souffrent de toutes sortes de tourments...» (Matthieu 4/23). Jésus est celui qui « regarde » avec amour les « prostrés, les écrasés, les découragés, tous ceux qui n’en peuvent plus... (Matthieu 9/36). Les « yeux» de Jésus... aujourd’hui... je les vois tout remplis de larmes de compassion pour tous ceux qui sont écrasés: malades, infirmes, gens sans travail, femmes bafouées, pauvres de toute sorte, « publicains et pécheurs», toute cette humanité au bord du désespoir.", "page": 326, "kind": "p"}, {"id": "r62p4", "text": "Quand Jésus voit tout cela... que fait-il, que dit-il?", "page": 326, "kind": "p"}, {"id": "r62p5", "text": "Il gravit la «montagne», il s’assit, et ses disciples s’approchérent. Alors, ouvrant la bouche, il se mit a les instruire.", "page": 326, "kind": "h"}, {"id": "r62p6", "text": "Cette mise en scéne est volontairement grandiose et solennelle. Jésus, si humain, est aussi, selon ’évangile de Matthieu, le « Seigneur de Gloire», hiératique comme une ic6ne d’Orient. Le décor montagneux de ce «sermon» nest pas une touche de pittoresque, c’est le cadre grandiose de la promulgation de la Loi nouvelle, c’est le nouveau Sinai, ce sommet fulgurant d’ot Dieu parle. Et Jésus est le nouveau Moise, le législateur et le libérateur véritable de tous ceux qui sont en esclavage.", "page": 326, "kind": "p"}, {"id": "r62p7", "text": "Oui, toi qui es écrasé par une situation insoutenable humainement, écoute! Dieu a quelque chose a te dire. Toi qui es malheureux, parce que tu te sens atteint dans tes aspirations les plus profondes, écoute! Si tu as la chance de «comprendre» ce qui va t’étre dit, ta vie va étre chanZ", "page": 327, "kind": "p"}, {"id": "r62p8", "text": "gée. Ecoute... Ecoute le maitre. Ecoute Jésus.", "page": 327, "kind": "p"}, {"id": "r62p9", "text": "Heureux... Heureux... Heureux... Heureux... Heureux... Heureux... Heureux... Heureux... Heureux...", "page": 327, "kind": "h"}, {"id": "r62p10", "text": "Cst le premier mot de toutes les phrases du « sermon sur la montagne».", "page": 327, "kind": "p"}, {"id": "r62p11", "text": "« Heureux!», « makarioi», en grec...", "page": 327, "kind": "p"}, {"id": "r62p12", "text": "« Heureux!», «asherei», en hébreu...", "page": 327, "kind": "p"}, {"id": "r62p13", "text": "Oui, le sujet de la premiére homélie de Jésus, c’est le bonheur. Les béatitudes sont une annonce de bonheur, une «bonne nouvelle», le resumé de tout l’évangile. Vous les pauvres, les méprisés, les découragés, vous pouvez étre heureux. Soyez heureux. Car le vrai bonheur n’est pas dabord affaire de richesse, de succés, de plaisir. Toi qui croyais que le bonheur n’était pas fait pour toi... Jésus te dit que tu peux étre heureux. Jésus veut faire de ses disciples des gens heureux. Chrétien! sais-tu que tu es heureux? Et si tu ne l’es pas, ne devrais-tu pas te demander pourquoi ?", "page": 327, "kind": "p"}, {"id": "r62p14", "text": "Mais de quel bonheur s’agit-il? Il y a bien des espéces de bonheurs.", "page": 327, "kind": "p"}, {"id": "r62p15", "text": "Et pour quand? Pour cette vie présente ot pour I’au-dela ?", "page": 327, "kind": "p"}, {"id": "r62p16", "text": "Heureux les pauvres de cceur...", "page": 327, "kind": "h"}, {"id": "r62p17", "text": "Heureux les doux...", "page": 327, "kind": "h"}, {"id": "r62p18", "text": "Heureux ceux qui pleurent...", "page": 327, "kind": "h"}, {"id": "r62p19", "text": "Heureux ceux qui ont faim et soif de la justice...", "page": 327, "kind": "h"}, {"id": "r62p20", "text": "Heureux les miséricordieux...", "page": 327, "kind": "h"}, {"id": "r62p21", "text": "Heureux les cceurs purs...", "page": 327, "kind": "h"}, {"id": "r62p22", "text": "Heureux les artisans de paix...", "page": 327, "kind": "h"}, {"id": "r62p23", "text": "Heureux ceux qui sont persécutés pour la justice...", "page": 327, "kind": "h"}, {"id": "r62p24", "text": "Le bonheur dont parle Jésus n’exclut pas les contrariétés et la souffrance. Nous l’avons déja vu par tout le contexte, Jésus vise, précisément, des gens que l’on considére comme malheureux. Les béatitudes ne visent pas «des» catégories différentes. Les mots variés ne sont la que pour répercuter une seule et méme pensée: « Venez a moi, vous tous qui peinez et étes accablés, et moi je vous donnerai le repos. Prenez sur vous mon joug et mettez-vous 4 mon école, parce que je suis doux et humble de coeur, et vous trouverez le repos pour vous-mémes, car mon joug est agréable et mon fardeau léger» (Matthieu 11/28.30). Oui, Jésus est bien «celui qu’on attendait», «celui qui avait été annoncé», « celui qui devait apporter la Bonne Nouvelle du salut». On oublie trop que le mot «évangile» a été repris, par Jésus lui-méme, de la seconde partie du livre d'lsaie: «L'Esprit du Seigneur est sur moi, parce qu’il m’a consacré (oint=christos) par lonction: il m’a envoyé porter la Bonne Nouvelle aux pauvres, panser ceux qui ont le coeur brisé, proclamer aux prisonniers la libération, consoler les affligés...» (Isaie 61/1.6 - Luc 4/18).", "page": 327, "kind": "p"}, {"id": "r62p25", "text": "Heureux... car le Royaume des cieux est a eux...", "page": 328, "kind": "h"}, {"id": "r62p26", "text": "Les huit premiéres béatitudes sont éncadrées par cette «inclusion», répétée deux fois, au début et a la fin (Matthieu 4/3 et 4/10).", "page": 328, "kind": "p"}, {"id": "r62p27", "text": "Par cette formule, Jésus répond a nos deux questions: quel bonheur? pour quand? Il s’agit bien d’un bonheur pour « dés maintenant». Le Royaume des cieux est a vous. Ce n’est pas seulement un bonheur promis pour plus tard, pour l’au-dela. Il faut bien comprendre la finesse de la pensée de Jésus. C’est un contresens d’en faire une sorte | «d’opium du peuple» qu’on drogue, qu’on endort avec la promesse d’étre heureux plus tard, de l'autre cété, aprés la mort! Jésus dit que les écrasés de ce monde «sont» effec- tivement, «peuvent étre» effectivement heureux, au moment méme owt Jésus le leur dit. Mais ce n’est pas évident. Il faut en prendre conscience. Et cela n’exclut pas, bien sir, la perspective du « monde a venir» : les béatitudes promettent bien un bonheur qui ne se réalisera pleinement que dans le «monde 4a venir», le «Royaume de Dieu», mais cette espérance transfigure déja le présent. L’avenir heureux que promet Jésus a tous ceux qui sont écrasés par des situations actuellement pénibles... cet avenir est devenu une réalité présente dans la personne et l’amitié de Jésus.", "page": 328, "kind": "p"}, {"id": "r62p28", "text": "Car ce bonheur, finalement, c’est le «Régne de Dieu», cest «L’Amour de Dieu», qui illumine véritablement et dés AUJOURD’HUI si tu le veux, ta situation de souffrance. Jésus ne définit jamais le « Royaume de Dieu» (les mots Régne, Royaume, et Royauté, sont les mémes en hébreu), mais il évoque lidée qu’on se faisait du Roi, de ’Oint idéal, dans tout Ancien Orient: la premiére fonction du roi est d’assurer la libération de son peuple de toutes les forces étrangéres qui le menacent... et d’assurer la justice et la protection des petits et des pauvres contre tous les riches et les puissants qui ont toujours tendance a exploiter les faibles... Quand Jésus affirme que les pauvres sont les privilégiés de Dieu, que le Régne de Dieu est pour eux, que la «justice royale» prend le parti des petits... Jésus ne veut pas dire que les pauvres sont meilleurs, plus vertueux, que les autres. Il ne s’agit pas ici de la psychologie des pauvres ou de la morale des pauvres. Il y a, dans ces proclamations de béatitudes, une révélation d’une certaine idée de Dieu: Dieu se doit a lui-méme d’étre un bon roi. Dieu met son point dhonneur a rendre «heureux», mystérieusement, ceux qui sont privés de tout bonheur humain. Toi, si tu le veux !", "page": 329, "kind": "p"}, {"id": "r62p29", "text": "Bonheur paradoxal. Incompréhensible 4 qui n’en a pas fait lexpérience.", "page": 329, "kind": "p"}, {"id": "r62p30", "text": "Mais essaie donc. Entre dans ce bonheur de Dieu. Dés AUJOURD’HUI.", "page": 329, "kind": "p"}, {"id": "r62p31", "text": "Si tu as commencé a4 comprendre le «sens global» des béatitudes, alors, écoute la traduction que Matthieu en a donnée. La proclamation de la- «Bonne Nouvelle» du Royaume s’étale en un programme de vie chrétienne: si tu veux tre heureux, voila comment il faut faire.", "page": 329, "kind": "p"}, {"id": "r62p32", "text": "Heureux les pauvres de cceur, le Royaume des cieux est a eux.", "page": 329, "kind": "h"}, {"id": "r62p33", "text": "Heureux les doux, ils obtiendront la terre promise.", "page": 329, "kind": "h"}, {"id": "r62p34", "text": "Cest le méme mot hébreu «anawim», qui peut se traduire par «pauvre», ou par «doux». Ce sont deux nuances dune méme réalité. Le mot «anawim» évoque limage de celui qui est «courbé», lattitude du faible qui nest plus capable de se défendre, qui est obligé de céder devant les plus forts, l’étre humilié, abaissé, ’homme ou la femme qui ne parvient pas a faire respecter ses droits... Le «doux», c’est celui qui ne séchauffe pas devant la prospérité des impies, qui ne perd pas patience. Jésus s’est dit « doux et humble de coeur» (Matthieu 11/29 - 12/18.21). Harcelé par ses ennemis, il leur pardonnait. Jésus a vécu le premier les béatitudes.", "page": 329, "kind": "p"}, {"id": "r62p35", "text": "Heureux ceux qui pleurent, ils seront consolés.", "page": 330, "kind": "h"}, {"id": "r62p36", "text": "Heureux ceux qui ont faim et soif de la «justice», ils seront rassasiés.", "page": 330, "kind": "h"}, {"id": "r62p37", "text": "Heureux les miséricordieux, ils obtiendront miséricorde.", "page": 330, "kind": "h"}, {"id": "r62p38", "text": "Heureux les coeurs purs, ils verront Dieu.", "page": 330, "kind": "h"}, {"id": "r62p39", "text": "Jésus a pleuré avec Marthe et Marie. Jésus a parfaitement «correspondu» a la volonté du Pére: il a été «juste». Ila été la miséricorde de Dieu pour les pécheurs. Il a pardonné, pardonné, pardonné... C’était le «coeur pur» par excellence, sans aucune fausseté, sans aucun détour: ses actes et ses intentions étaient en parfaite unité.", "page": 330, "kind": "p"}, {"id": "r62p40", "text": "Heureux les artisans de paix, ils seront appelés « fils de Dieu».", "page": 330, "kind": "h"}, {"id": "r62p41", "text": "Heureux ceux qui sont persécutés pour la « justice», le Royaume des cieux est a eux.", "page": 330, "kind": "h"}, {"id": "r62p42", "text": "Jésus venait pour apporter la paix. Oh, qu’l est heureux celui qui est «artisan de paix», celui qui raccorde des — époux qui se disputent, qui rapproche des amis brouillés, qui atténue des conflits dans des familles entre parents et enfants, qui oeuvre pour l’écoute et la compréhension. Il n’y a pas de plus grand service a rendre a nos fréres. « Je vous donne ma paix, pas comme le monde la donne » (Jean 14/27).", "page": 330, "kind": "p"}, {"id": "r62p43", "text": "Heureux serez-vous si l’on vous insulte, si l'on vous persécute, et si l’on dit faussement toute sorte de mal contre vous a cause de moi. Réjouissez-vous, soyez dans lallégresse, car votre récompense sera grande dans les cieux.", "page": 330, "kind": "h"}]}, {"id": 63, "title": "La Dédicace · 9 novembre", "group": "Fiestas", "page": 331, "ref": "Jean 2/13.22", "paragraphs": [{"id": "r63p1", "text": "9 novembre", "page": 331, "kind": "h"}, {"id": "r63p2", "text": "La cathédrale de Rome n’est pas Saint-Pierre du Vatican, comme on le pense parfois, mais la basilique Saint-Jean du-Latran. Bdtie par ’Empereur Constantin, a la fin des persécutions, en 320, on en commémore la Dédicace, cest-d-dire la «consécration» comme lieu pnivilégié du culte, le 9 novembre, dans toute l’Eglise universelle.", "page": 331, "kind": "p"}, {"id": "r63p3", "text": "Paradoxalement, l’évangile de ce jour nous raconte comment Jésus a annoncé la destruction du « temple»... et son remplacement par son «corps ressuscité», nouveau lieu de la présence divine. Occasion de réfléchir sur le vrai sens de nos édifices sacrés.", "page": 331, "kind": "p"}, {"id": "r63p4", "text": "Ils n’ont de valeur que comme écrins contenant le Corps du Christ.", "page": 331, "kind": "p"}, {"id": "r63p5", "text": "Comme la Paque des Juifs était proche, Jésus monta a Jérusalem.", "page": 331, "kind": "h"}, {"id": "r63p6", "text": "Tout juif pratiquant devait monter au Temple de Jérusalem pour les grandes fétes. Jésus était un pratiquant fidéle. Saint Jean note a sept reprises ces pélerinages que Jésus fit, soit pour la féte de Paque, au printemps, soit pour la fete des Tentes, a l’automne (Jean 5/1 - 6/4 - 7/2 - 10/22 - 11/55 - 12/1 - 13/1).", "page": 331, "kind": "p"}, {"id": "r63p7", "text": "Au temps de Jésus, le Temple de Jérusalem, lieu de culte unique, était un édifice tout neuf, rutilant de ses pierres taillées, de ses marbres, de ses décorations, auxquelles avaient participé les meilleurs artistes. Les liturgies y devaient étre grandioses: 600 prétres y assuraient les cérémonies, entourés de 300 lévites pour la musique et les choeurs, au son des harpes, cithares et trompettes. Des colonnades solennelles encadraient d’immenses parvis successifs pour les cérémonies de plein air. Au centre s’élevait le «sanctuaire», au toit couvert en or fin.", "page": 331, "kind": "p"}, {"id": "r63p8", "text": "Il faut savoir tout cela pour comprendre ce que Jésus va dire.", "page": 332, "kind": "p"}, {"id": "r63p9", "text": "Jésus, habitant de la province nord, la Galilée, ne pouvait que partager l’admiration de ses compatriotes pour cet édifice admirable. «Oh! Ma joie, quand on m’a dit: allons a la maison du Seigneur.» C’était un peu plus de 100 kilometres que Jésus parcourait, a pied évidemment, pour « monter A Jérusalem» chaque année, depuis sa « barmitzvah» (profession de foi), a l’&ge de douze ans.", "page": 332, "kind": "p"}, {"id": "r63p10", "text": "Je contemple d’abord Jésus, laic ordinaire, mélé a la foule qui prie et chante, au cours de la longue marche, puis sur le parvis du Temple.", "page": 332, "kind": "p"}, {"id": "r63p11", "text": "Il trouva, installés dans le Temple, les marchands de boeufs, de brebis, et de colombes, et les changeurs.", "page": 332, "kind": "h"}, {"id": "r63p12", "text": "Ces marchands n’étaient pas du tout de méchantes personnes. Ils étaient nécessaires a la vie méme du Temple et a son culte. Ils rendaient en réalité un service considérable aux fidéles qui venaient de loin, et qui avaient besoin de trouver sur place tout ce qui était indispensable aux « sacrifices » : boeufs, brebis, colombes. Marie et Joseph y avaient acheté leurs deux colombes, quand ils étaient venus ici « présenter» leur enfant nouveau-né (Luc 2/24).", "page": 332, "kind": "p"}, {"id": "r63p13", "text": "Il fit un fouet avec des cordes, et les chassa du Temple, tous, ainsi que leurs brebis, et leurs boeufs. Il jeta par terre la monnaie des changeurs, renversa leurs comptoirs, et dit aux marchands de colombes: « Enlevez cela d'ici!»", "page": 332, "kind": "h"}, {"id": "r63p14", "text": "Cet épidose est certainement historique. II est relaté par les quatre évangiles. Les trois évangiles synoptiques s’accordent a situer l’€vénement a la fin de la vie de Jésus, juste aprés lentrée triomphale des rameaux. Jean, lui, place cet épisode dés le début de la vie publique de Jésus... donnant a cette « purification du Temple» une signification théologique. C’est, effectivement, a ce niveau-la qu'il faut interpréter la scéne, sans rester a l’imagerie superficielle.", "page": 332, "kind": "p"}, {"id": "r63p15", "text": "Ne faites pas de la maison de mon Pére une maison de trafic!", "page": 333, "kind": "h"}, {"id": "r63p16", "text": "Les trois synoptiques avaient cité une parole d’lsaie (56/7) : «Ma maison sera appelée maison de priére.»", "page": 333, "kind": "p"}, {"id": "r63p17", "text": "Ecoutons longuement cette expression que Jésus utilise, selon saint Jean. Nous sommes trop habitués aux paroles de Jésus, comme si elles allaient de soi. Jésus parle donc du Temple comme de la « maison» de «son Pére». Ainsi, ce sanctuaire redoutable, ce lieu tabou ot personne ne rentre jamais, sauf le Grand Prétre une fois par an, ce lieu sacré... Jésus dit, tout simplement, que c’est sa propre maison. Déja, a lage de douze ans, il avait dit équivalemment la méme chose &-sa-mére Marie, qui n’y avait rien compris: « Ne savez-vous pas qu'il me faut étre chez mon Pére» (Luc 2/49).", "page": 333, "kind": "p"}, {"id": "r63p18", "text": "Quel secret cache donc ce Jésus? Quelle est donc l’identite de cet homme pour qu'il parle des choses de Dieu avec une telle familiarité. Entre lui, et Dieu, quelle intimité damour! Il est chez lui dans le Temple de Yahveh.", "page": 333, "kind": "p"}, {"id": "r63p19", "text": "Ses disciples se rappelérent cette parole du Psaume: «L’amour de ta maison fera mon_ tourment...»", "page": 333, "kind": "h"}, {"id": "r63p20", "text": "(Psaume 69/10).", "page": 333, "kind": "p"}, {"id": "r63p21", "text": "Ce qui est premier, pour Jésus, c’est amour du Pére. C’est comme un feu qui le dévore. Le culte que Jésus rendra a Dieu ne sera pas un culte «rituel», ce ne seront pas des « cérémonies»:.. ce sera sa vie offerte, son coeur filial. Et pour nous, quest-ce que le «culte»?", "page": 333, "kind": "p"}, {"id": "r63p22", "text": "Des émotions esthétiques dans un bel édifice architectural classé ? Un beau concert musical? Un spectacle théatral ? Est-ce que «jassiste» a la messe, ou bien est-ce que je « participe » a la messe? Suis-je, avec Jésus, brilé de zéle, dévoré d’amour, fasciné par Dieu?", "page": 333, "kind": "p"}, {"id": "r63p23", "text": "Les Juifs linterpellérent: « Quel signe peux-tu nous donner pour justifier ce que tu fais la?»", "page": 333, "kind": "h"}, {"id": "r63p24", "text": "Ils sont choqués par la maniére dont Jésus, lui qui n’est pas membre du clergé, vient d’intervenir dans les affaires du culte.", "page": 333, "kind": "p"}, {"id": "r63p25", "text": "Jésus leur répondit : « Détruisez ce Sanctuaire, et en trois jours je le reléverai! »", "page": 334, "kind": "h"}, {"id": "r63p26", "text": "Dans les phrases précédentes, Jean avait parlé du Temple («iéron» en grec). Ici, et ce n’est pas par hasard, il change de mot et parle du Sanctuaire (« naos» en grec). Le Temple, c’était l'ensemble des édifices et des parvis. Le Sanctuaire, C’était ce tout petit édifice, le «saint des saints», considéré comme le lieu de la Présence réelle de Dieu, la «shékinah» en hébreu.", "page": 334, "kind": "p"}, {"id": "r63p27", "text": "Lenjeu de cette parole doit étre bien important pour que Jésus ose, par elle, se mettre a dos toute Popinion populaire de son temps, qui vénérait ce sanctuaire... et toute la hiérarchie religieuse de son peuple, instituée par Dieu luiméme! « Détruisez ce sanctuaire!» C’est une profanation. Cétait l’orgueil de la nation juive, un lieu vénéré de priére et de pélerinage, ot des millions de pélerins venaient chaque année, le seul et unique «lieu de culte» de toute la terre d'Israél.", "page": 334, "kind": "p"}, {"id": "r63p28", "text": "Les Juifs répliquérent: «Il a fallu quarante-six ans pour batir ce Sanctuaire, et toi, en trois jours tu le reléverais!", "page": 334, "kind": "h"}, {"id": "r63p29", "text": "Mais le Sanctuaire dont il parlait, c’était son Corps!", "page": 334, "kind": "h"}, {"id": "r63p30", "text": "Nous sommes au coeur de cette page d’évangile.", "page": 334, "kind": "p"}, {"id": "r63p31", "text": "Essayons, une fois encore, de pénétrer dans la conscience que Jésus avait de lui-méme. Il sait qui il est. Il dit qu’ll est un « sanctuaire ». Jésus se sait le lieu de la Présence ineffable. C’est son corps qui est le nouveau Temple... le lieu du nouveau culte.", "page": 334, "kind": "p"}, {"id": "r63p32", "text": "Jean Baptiste lavait désigné comme lAgneau pascal, qui «enléve le péché du monde» (Jean 1/29). Effectivement, Jésus fut immolé comme un «agneau» de sacrifice, sur la colline aux portes de la ville, A !heure méme ou, dans le Temple, on immolait rituellement d’innombrables agneaux et brebis, la veille du grand Sabbat de Paque (Jean 19/31). Par son corps livré et son sang versé, il venait remplacer tous les cultes rituels. Et de ce corps ouvert sur le cété par la lance, sortit le fleuve d’eau vive annoncé par le prophéte Ezékiel comme sortant du sanctuaire (Ezékiel 47/1.12).", "page": 334, "kind": "p"}, {"id": "r63p33", "text": "Aussi, quand il se releva d’entre les morts, ses disciples se rappelérent qu’ avait dit cela: ils crurent aux prophéties de lEcriture, et a la Parole que Jésus avait dite.", "page": 335, "kind": "h"}, {"id": "r63p34", "text": "Les chrétiens des premiers siécles, au temps de saint Jean et de saint Paul, n’ont pas eu l'idée de reconstruire des Temples, ni aucun édifice religieux. Ils avaient conscience que leur « communauté» était ce Corps du Christ ressuscité, véritable lieu de la présence de Dieu. Saint Paul dit aux chrétiens de Corinthe: «Vous étes le Corps du Christ» (I Corinthiens 12/27). Ainsi, ce n’est pas seulement le corps de Jésus ressuscité qui est le «Sanctuaire» de Dieu, mais le corps de chacun des baptisés. « Ne savezvous pas que votre corps est le Temple du Saint-Esprit qui habite en vous ? Glorifiez donc Dieu dans votre corps » (I Corinthiens 6/19.20).", "page": 335, "kind": "p"}, {"id": "r63p35", "text": "Dieu habite en moi! Cela ne va pas de soi. C’est méme le contraire qui semble vrai. Si Dieu était la, est-ce que ca ne devrait pas se voir davantage ?", "page": 335, "kind": "p"}, {"id": "r63p36", "text": "Et si je me mettais a «croire» a cela? a cette parole de Jésus.", "page": 335, "kind": "p"}, {"id": "r63p37", "text": "Qu’est-ce que ca changerait dans une vie d’homme ou de femme, si on se mettait a vivre «avec» Dieu toujours |a, partout la. Est-ce qu’on Le laisserait comme ¢a?", "page": 335, "kind": "p"}, {"id": "r63p38", "text": "On comprend maintenant pourquoi Jésus annoncait la destruction du Temple fait de pierres! C’était une maniére de révéler que tout homme est sacré, tout homme est porteur de Dieu en un certain sens. « Ne faites pas de la maison de mon Pére une maison de trafic... ne faites pas de votre vie une banalité...»", "page": 335, "kind": "p"}, {"id": "r63p39", "text": "«La vie d’un apprenti vaut plus que tout lor du monde» clamait labbé Cardjin aux premiers jocistes. Chaque homme, chaque femme, est infiniment respectable. C’est un Sanctuaire ot Dieu demeure. Et nos églises, basiliques ou cathédrales n’en sont que de pales images matérielles. iva", "page": 335, "kind": "p"}, {"id": "r63p40", "text": "aM wer tebe Sesinche", "page": 336, "kind": "p"}, {"id": "r63p41", "text": "OT eal a > OAR MON, poe ot a f Raeeck ' Highs. i Us ei aye inehior |", "page": 336, "kind": "p"}, {"id": "r63p42", "text": "WaT) igs, opal eeeaes ‘hee", "page": 336, "kind": "p"}, {"id": "r63p43", "text": "lee ayer rig a thy tial ae Pie 9", "page": 336, "kind": "p"}, {"id": "r63p44", "text": "sary oh i): shee iC + ie wat ists /", "page": 336, "kind": "p"}, {"id": "r63p45", "text": "‘ i : a rT g function editNote(id){const p=byId.get(id);modal(`<h2>Mi nota · párrafo ${p.num}</h2><p class="small">${esc(S[p.section].title)}</p><label for="noteText" class="small">Escribe tu reflexión o idea para la celebración</label><textarea id="noteText">${esc(state.notes[id]||'')}</textarea><div class="actions"><button id="cancelNote">Cancelar</button><button class="primary" id="saveNote">Guardar nota</button></div>`);$('#cancelNote').onclick=()=>$('#dialog').close();$('#saveNote').onclick=()=>{const val=$('#noteText').value.trim();if(val)state.notes[id]=val;else delete state.notes[id];persist();$('#dialog').close();if(view==='reading'){const el=document.getElementById(id);if(el)el.outerHTML=para(p,p.num-1);observePosition()}nav();toast(val?'Nota guardada':'Nota eliminada')}}
function speak(texts){if(!('speechSynthesis'in window)){toast('La lectura en voz alta no está disponible en este navegador.');return}stopSpeech();const token=speechToken;const chunks=texts.flatMap(t=>t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[t]);let i=0;$('#readAloud').textContent='Detener audio';function next(){if(token!==speechToken)return;if(i>=chunks.length){$('#readAloud').textContent='Escuchar';return}const u=new SpeechSynthesisUtterance(chunks[i++]);u.lang='fr-FR';const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('fr'));if(v)u.voice=v;u.rate=.9;u.onend=next;u.onerror=()=>{if(token===speechToken){stopSpeech();toast('No se ha podido reproducir la voz. Comprueba las voces de tu navegador.')}};speechSynthesis.speak(u)}next()}
document.addEventListener('click',async e=>{const target=e.target.closest('button,[data-chapter]');if(!target)return;if(target.dataset.chapter){e.preventDefault();openChapter(target.dataset.chapter,target.dataset.paragraph);return}const id=target.dataset.id,action=target.dataset.action;if(!action)return;const p=byId.get(id);if(!p)return;if(action==='save'){if(state.saved[id])delete state.saved[id];else state.saved[id]=true;persist();nav();if(view==='reading'){const el=document.getElementById(id);el.outerHTML=para(p,p.num-1);observePosition()}else target.textContent=state.saved[id]?'★ Guardado':'☆ Guardar';toast(state.saved[id]?'Párrafo guardado':'Favorito eliminado')}if(action==='note')editNote(id);if(action==='listen')speak([p.text]);if(action==='copy'){const text=p.text+'\n— Noël Quesson, '+S[p.section].title;try{await navigator.clipboard.writeText(text);toast('Párrafo copiado')}catch{modal('<h2>Copiar párrafo</h2><textarea readonly id="copyText">'+esc(text)+'</textarea><div class="actions"><button onclick="document.querySelector(\'#dialog\').close()">Cerrar</button></div>');$('#copyText').select()}}});
$('#searchForm').onsubmit=e=>{e.preventDefault();search()};$('#scope').onchange=()=>{if(view==='search')search()};$('#navFilter').oninput=nav;for(const [id,name] of [['tabIndex','index'],['tabGospel','gospel'],['tabSaved','saved']])$('#'+id).onclick=()=>{tab=name;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===id));nav()};$('#theme').onclick=()=>{state.dark=!state.dark;applySettings();persist()};$('#smaller').onclick=()=>{state.size=Math.max(16,state.size-1);applySettings();persist()};$('#larger').onclick=()=>{state.size=Math.min(34,state.size+1);applySettings();persist()};$('#focus').onclick=()=>{document.body.classList.toggle('focus');$('#focus').textContent=document.body.classList.contains('focus')?'Salir de concentración':'Concentración'};$('#menu').onclick=()=>document.body.classList.toggle('menu-open');$('#prev').onclick=()=>openChapter(current-1);$('#next').onclick=()=>openChapter(current+1);$('#resume').onclick=()=>{const last=state.last;openChapter(last?.chapter??state.chapter,last?.paragraph,false)};$('#print').onclick=()=>window.print();$('#readAloud').onclick=()=>{if($('#readAloud').textContent==='Detener audio')stopSpeech();else speak((view==='search'?found:S[current].paragraphs).map(p=>p.text))};
$('#content').addEventListener('click',e=>{if(e.target.id==='backReading')openChapter(current);if(e.target.id==='moreResults')moreResults();if(e.target.id==='jumpGo'){const n=Number($('#jump').value);if(Number.isInteger(n)&&n>=1&&n<=S[current].paragraphs.length)jumpTo(S[current].paragraphs[n-1].id);else toast('Indica un número de párrafo válido.')}if(e.target.id==='readDone'){if(state.read.includes(current))state.read=state.read.filter(x=>x!==current);else state.read.push(current);persist();e.target.textContent=state.read.includes(current)?'✓ Leída':'Marcar como leída';nav()}});
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#export').onclick=()=>download('parole-mis-notas.json',JSON.stringify({book:'quesson-b',version:1,date:new Date().toISOString(),state},null,2),'application/json');$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.book!=='quesson-b'||data.version!==1||!data.state)throw Error();const v=data.state;for(const [id,val] of Object.entries(v.saved||{}))if(byId.has(id)&&val===true)state.saved[id]=true;for(const [id,val] of Object.entries(v.notes||{}))if(byId.has(id)&&typeof val==='string')state.notes[id]=val;state.read=[...new Set([...state.read,...(Array.isArray(v.read)?v.read.filter(i=>Number.isInteger(i)&&S[i]):[])])];persist();openChapter(current);toast('Copia importada. Se han combinado notas y favoritos.')}catch{toast('El archivo no es una copia válida de esta app.')}e.target.value=''};
$('#help').onclick=()=>modal(`<h2>Cómo usar la app</h2><p><b>Elegir una lectura:</b> abre el índice y selecciona un domingo o una fiesta. También puedes buscar por evangelio.</p><p><b>Buscar:</b> escribe una palabra en francés y pulsa «Buscar». Pulsa un resultado para abrirlo dentro de la lectura.</p><p><b>Ajustar la lectura:</b> usa A− y A+ para cambiar la letra. «Concentración» deja el texto en primer plano.</p><p><b>Continuar:</b> «Continuar mi lectura» te lleva al punto donde te quedaste.</p><div class="actions"><button onclick="document.querySelector('#dialog').close()">Cerrar</button></div>`);
$('#about').onclick=()=>modal(`<h2>Sobre el libro</h2><p lang="fr"><b>Parole de Dieu pour chaque dimanche · Année B</b><br>Noël Quesson<br>Droguet & Ardant · 1981</p><div class="actions"><button onclick="document.querySelector('#dialog').close()">Cerrar</button></div>`);

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){stopSpeech();document.body.classList.remove('focus','menu-open');$('#focus').textContent='Concentración'}});window.addEventListener('pagehide',stopSpeech);
applySettings();const initial=state.last;openChapter(initial?.chapter??current,initial?.paragraph,false);
</script></body></html>
