<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitxer · TreePad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#1B1712;
    --wood-hi:#26201A;
    --wood-line:#3a3226;
    --paper:#F2ECDD;
    --paper-dim:#e9e1cc;
    --ink:#2E4034;
    --ink-soft:#4a5f52;
    --tan:#8B7355;
    --brass:#C9A227;
    --text-dark:#241f18;
    --text-mute:#6b6252;
    --danger:#8a3324;
  }
  [data-theme="dark"]{
    --paper:#181510;
    --paper-dim:#141210;
    --text-dark:#e9e1cc;
    --text-mute:#a89a7d;
    --tan:#6b5a42;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Lora',serif;
    display:flex;
    background:var(--wood);
    color:var(--text-dark);
    overflow:hidden;
  }

  /* ===== SIDEBAR (the card catalog) ===== */
  #sidebar{
    width:320px;
    min-width:220px;
    max-width:60vw;
    background:var(--wood);
    display:flex;
    flex-direction:column;
    border-right:2px solid var(--wood-line);
    position:relative;
  }
  #sidebar-head{
    padding:18px 16px 10px;
    border-bottom:1px solid var(--wood-line);
  }
  #sidebar-head h1{
    font-family:'Fraunces',serif;
    font-size:1.35rem;
    font-weight:600;
    color:var(--brass);
    margin:0 0 2px;
    letter-spacing:.02em;
  }
  #sidebar-head .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem;
    color:#8d8168;
    text-transform:uppercase;
    letter-spacing:.12em;
  }
  #search-wrap{padding:10px 14px;border-bottom:1px solid var(--wood-line);}
  #search{
    width:100%;
    background:var(--wood-hi);
    border:1px solid var(--wood-line);
    color:#e9e1cc;
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;
    padding:7px 9px;
    border-radius:2px;
  }
  #search::placeholder{color:#6f6552;}
  #search:focus{outline:1px solid var(--brass);}

  #tree-scroll{
    flex:1;
    overflow-y:auto;
    padding:10px 8px 90px;
  }
  #tree-scroll::-webkit-scrollbar{width:8px;}
  #tree-scroll::-webkit-scrollbar-thumb{background:var(--wood-line);border-radius:4px;}

  ul.tree{list-style:none;margin:0;padding:0;}
  ul.tree ul.tree{margin-left:16px;border-left:1px dashed #4a4130;padding-left:8px;}

  li.node{margin:1px 0;}

  .node-row{
    display:flex;
    align-items:center;
    gap:4px;
    position:relative;
    border-radius:3px;
    cursor:pointer;
    padding:5px 8px 5px 4px;
    /* the "file tab" look */
    background:linear-gradient(90deg, transparent 0%, transparent 100%);
  }
  .node-row:hover{background:#241e17;}
  .node-row.active{
    background:var(--tan);
    box-shadow:inset 3px 0 0 var(--brass);
  }
  .node-row.active .node-title{color:#181510;font-weight:600;}
  .node-row.match{box-shadow:inset 0 0 0 1px var(--brass);}

  .twisty{
    width:14px;height:14px;flex:0 0 14px;
    display:flex;align-items:center;justify-content:center;
    color:#8d8168;font-family:'IBM Plex Mono',monospace;font-size:.7rem;
    user-select:none;
  }
  .node-row.active .twisty{color:#181510;}
  .twisty.leaf{visibility:hidden;}

  .node-title{
    font-family:'Fraunces',serif;
    font-size:.92rem;
    color:#d8cfb8;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    padding:1px 2px;
  }
  .node-title[contenteditable="true"]{
    white-space:normal;
    outline:1px solid var(--brass);
    background:var(--wood-hi);
    color:#fff;
  }

  .row-actions{
    display:none;
    gap:2px;
    flex:0 0 auto;
  }
  .node-row:hover .row-actions, .node-row.active .row-actions{display:flex;}
  .row-actions button{
    background:none;border:none;cursor:pointer;
    color:#8d8168;font-size:.75rem;
    width:18px;height:18px;line-height:18px;text-align:center;
    border-radius:2px;
  }
  .node-row.active .row-actions button{color:#3a3226;}
  .row-actions button:hover{background:#00000030;color:var(--brass)!important;}

  #sidebar-foot{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--wood);
    border-top:1px solid var(--wood-line);
    padding:10px 12px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .foot-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:.68rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:var(--wood-hi);
    color:#c9bd9e;
    border:1px solid var(--wood-line);
    padding:6px 9px;
    border-radius:2px;
    cursor:pointer;
    flex:1;
    min-width:70px;
  }
  .foot-btn:hover{border-color:var(--brass);color:var(--brass);}

  /* ===== MAIN CONTENT (the sheet) ===== */
  #main{
    flex:1;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  #main-head{
    padding:22px 40px 14px;
    border-bottom:1px solid #cfc4a4;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
  }
  #doc-title{
    font-family:'Fraunces',serif;
    font-size:2rem;
    font-weight:600;
    color:var(--text-dark);
    border:none;
    background:none;
    width:100%;
    outline:none;
  }
  #doc-title:focus{border-bottom:1px solid var(--ink);}
  #crumbs{
    font-family:'IBM Plex Mono',monospace;
    font-size:.7rem;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-top:4px;
  }
  #meta-controls{
    display:flex;gap:8px;flex:0 0 auto;
  }
  .icon-btn{
    background:none;border:1px solid #cfc4a4;color:var(--text-mute);
    border-radius:2px;padding:6px 10px;cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:.68rem;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .icon-btn:hover{border-color:var(--ink);color:var(--ink);}

  #toolbar{
    display:none;
    gap:2px;
    padding:8px 40px 0;
    background:var(--paper);
  }
  #toolbar.show{display:flex;}
  #toolbar button{
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;
    background:none;
    border:1px solid transparent;
    color:var(--text-mute);
    width:30px;height:28px;
    border-radius:2px;
    cursor:pointer;
  }
  #toolbar button:hover{border-color:#cfc4a4;color:var(--text-dark);}
  #toolbar button.on{background:var(--ink);color:#F2ECDD;}
  #toolbar button[data-cmd="bold"]{font-weight:700;}
  #toolbar button[data-cmd="italic"]{font-style:italic;}
  #toolbar button[data-cmd="underline"]{text-decoration:underline;}
  #toolbar .sep{width:1px;background:#cfc4a4;margin:4px 6px;}

  #editor-wrap{flex:1;overflow-y:auto;padding:14px 40px 60px;}
  #doc-body{
    font-family:'Lora',serif;
    font-size:1.05rem;
    line-height:1.75;
    color:var(--text-dark);
    width:100%;
    min-height:60vh;
    border:none;
    background:none;
    outline:none;
  }
  #doc-body:empty:before{
    content:attr(data-placeholder);
    color:var(--text-mute);
    opacity:.6;
  }
  #doc-body b, #doc-body strong{font-weight:700;}
  #doc-body i, #doc-body em{font-style:italic;}
  #doc-body ul, #doc-body ol{padding-left:1.4em;}
  #empty-state{
    max-width:420px;
    margin:60px auto;
    text-align:center;
    color:var(--text-mute);
  }
  #empty-state h2{font-family:'Fraunces',serif;color:var(--text-dark);font-weight:500;}
  #empty-state button{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    background:var(--ink);color:#F2ECDD;border:none;
    padding:10px 18px;border-radius:2px;cursor:pointer;font-size:.78rem;
    text-transform:uppercase;letter-spacing:.06em;
  }
  #empty-state button:hover{background:var(--ink-soft);}

  mark{background:var(--brass);color:#1B1712;padding:0 1px;border-radius:1px;}

  #save-flag{
    font-family:'IBM Plex Mono',monospace;
    font-size:.65rem;
    color:var(--text-mute);
    opacity:0;
    transition:opacity .4s;
  }
  #save-flag.show{opacity:1;}

  input[type=file]{display:none;}

  @media (max-width:720px){
    #sidebar{position:fixed;z-index:20;height:100%;transform:translateX(-100%);transition:transform .25s;}
    #sidebar.open{transform:translateX(0);}
    #main-head, #editor-wrap{padding-left:20px;padding-right:20px;}
    #mobile-toggle{display:block!important;}
  }
  #mobile-toggle{
    display:none;
    position:fixed;top:14px;left:14px;z-index:30;
    background:var(--wood);color:var(--brass);border:1px solid var(--wood-line);
    border-radius:3px;padding:6px 10px;font-family:'IBM Plex Mono',monospace;cursor:pointer;
  }
</style>
</head>
<body data-theme="light">

<button id="mobile-toggle">☰</button>

<div id="sidebar">
  <div id="sidebar-head">
    <h1>Fitxer</h1>
    <div class="sub">catàleg de notes</div>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="cerca...">
  </div>
  <div id="tree-scroll">
    <ul class="tree" id="tree-root"></ul>
  </div>
  <div id="sidebar-foot">
    <button class="foot-btn" id="btn-new-root">+ arrel</button>
    <button class="foot-btn" id="btn-export">exportar</button>
    <button class="foot-btn" id="btn-import">importar</button>
    <button class="foot-btn" id="btn-theme">fosc/clar</button>
  </div>
  <input type="file" id="file-input" accept="application/json">
</div>

<div id="main">
  <div id="main-head">
    <div style="flex:1;min-width:0;">
      <div id="crumbs">&nbsp;</div>
      <input id="doc-title" placeholder="Sense títol" disabled>
    </div>
    <div id="meta-controls">
      <span id="save-flag">desat</span>
      <button class="icon-btn" id="btn-add-child">+ fill</button>
      <button class="icon-btn" id="btn-add-sibling">+ germà</button>
      <button class="icon-btn" id="btn-delete">esborrar</button>
    </div>
  </div>
  <div id="toolbar">
    <button data-cmd="bold" title="Negreta (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" title="Cursiva (Ctrl+I)"><i>I</i></button>
    <button data-cmd="underline" title="Subratllat (Ctrl+U)"><u>U</u></button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList" title="Llista">•≡</button>
    <button data-cmd="removeFormat" title="Netejar format">✕</button>
  </div>
  <div id="editor-wrap">
    <div id="empty-state">
      <h2>Cap fitxa seleccionada</h2>
      <p>Comença una nova branca del catàleg.</p>
      <button id="btn-empty-new">Crear la primera fitxa</button>
    </div>
    <div id="doc-body" contenteditable="true" style="display:none" data-placeholder="Escriu aquí..."></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "treepad_data_v1";
  const THEME_KEY = "treepad_theme_v1";
  let data = load() || seed();
  let activeId = null;
  let expanded = new Set(Object.keys(indexAll(data)));
  let searchTerm = "";

  function seed(){
    const rootId = uid();
    return {
      nodes: {
        [rootId]: {id:rootId, title:"Benvingut", body:"Aquesta és la teva primera fitxa.\n\nUsa \"+ fill\" per crear una subcategoria, o \"+ arrel\" per una branca nova al mateix nivell superior.", children:[], parent:null}
      },
      rootOrder:[rootId]
    };
  }

  function uid(){ return 'n'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

  // Safe storage: falls back to an in-memory object if localStorage is
  // blocked (file:// restrictions, private browsing, embedded contexts, etc.)
  // so the app keeps working within the session instead of crashing.
  let storageIsPersistent = true;
  const memoryFallback = {};
  const safeStorage = {
    get(key){
      try{ return localStorage.getItem(key); }
      catch(e){ storageIsPersistent = false; return (key in memoryFallback) ? memoryFallback[key] : null; }
    },
    set(key, val){
      try{ localStorage.setItem(key, val); storageIsPersistent = true; }
      catch(e){ storageIsPersistent = false; memoryFallback[key] = val; }
    }
  };

  function load(){
    try{
      const raw = safeStorage.get(STORAGE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed.nodes || !parsed.rootOrder) return null;
      return parsed;
    }catch(e){ return null; }
  }

  function save(){
    safeStorage.set(STORAGE_KEY, JSON.stringify(data));
    flagSaved();
    if(!storageIsPersistent) flagNoPersist();
  }

  let saveFlagTimer;
  function flagSaved(){
    const el = document.getElementById('save-flag');
    el.textContent = 'desat';
    el.classList.add('show');
    clearTimeout(saveFlagTimer);
    saveFlagTimer = setTimeout(()=>el.classList.remove('show'), 900);
  }

  let warnedNoPersist = false;
  function flagNoPersist(){
    if(warnedNoPersist) return;
    warnedNoPersist = true;
    const el = document.getElementById('save-flag');
    el.textContent = '⚠ sense desat permanent';
    el.title = 'El navegador bloqueja localStorage en aquest context (per exemple, si obres el fitxer directament amb doble clic). Els canvis es mantenen mentre la pestanya està oberta, però es perdran en tancar-la. Exporta a JSON per no perdre res, o serveix el fitxer des d\'un servidor / GitHub Pages.';
    el.classList.add('show');
  }

  function indexAll(d){
    return d.nodes;
  }

  function getNode(id){ return data.nodes[id]; }

  function createNode(title, parentId){
    const id = uid();
    data.nodes[id] = {id, title: title || "Nova fitxa", body:"", children:[], parent: parentId || null};
    if(parentId){
      data.nodes[parentId].children.push(id);
      expanded.add(parentId);
    } else {
      data.rootOrder.push(id);
    }
    save();
    return id;
  }

  function deleteSubtree(id){
    const node = getNode(id);
    if(!node) return;
    (node.children || []).slice().forEach(deleteSubtree);
    if(node.parent){
      const parent = getNode(node.parent);
      parent.children = parent.children.filter(c=>c!==id);
    } else {
      data.rootOrder = data.rootOrder.filter(c=>c!==id);
    }
    delete data.nodes[id];
  }

  function siblingsArrayOf(id){
    const node = getNode(id);
    return node.parent ? getNode(node.parent).children : data.rootOrder;
  }

  // ===== Rendering =====
  function stripHtml(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html || "";
    return tmp.textContent || "";
  }

  function matchesSearch(node){
    if(!searchTerm) return false;
    const t = searchTerm.toLowerCase();
    return (node.title||"").toLowerCase().includes(t) || stripHtml(node.body).toLowerCase().includes(t);
  }

  function subtreeHasMatch(id){
    const node = getNode(id);
    if(!node) return false;
    if(matchesSearch(node)) return true;
    return (node.children||[]).some(subtreeHasMatch);
  }

  function highlight(text){
    if(!searchTerm) return escapeHtml(text);
    const esc = escapeHtml(text);
    const re = new RegExp('('+escapeRegex(searchTerm)+')','ig');
    return esc.replace(re,'<mark>$1</mark>');
  }
  function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

  function renderTree(){
    const root = document.getElementById('tree-root');
    root.innerHTML = "";
    const order = searchTerm ? data.rootOrder.filter(subtreeHasMatch) : data.rootOrder;
    order.forEach(id => root.appendChild(renderNode(id)));
  }

  function renderNode(id){
    const node = getNode(id);
    const li = document.createElement('li');
    li.className = 'node';

    const row = document.createElement('div');
    row.className = 'node-row' + (id===activeId ? ' active':'') + (matchesSearch(node) ? ' match':'');
    row.dataset.id = id;

    const hasChildren = node.children && node.children.length>0;
    const isOpen = expanded.has(id) || (searchTerm && hasChildren);
    const twisty = document.createElement('span');
    twisty.className = 'twisty' + (hasChildren ? '' : ' leaf');
    twisty.textContent = hasChildren ? (isOpen ? '▾' : '▸') : '·';
    twisty.onclick = (e)=>{ e.stopPropagation(); toggleExpand(id); };
    row.appendChild(twisty);

    const title = document.createElement('span');
    title.className = 'node-title';
    title.innerHTML = highlight(node.title || "Sense títol");
    row.appendChild(title);

    const actions = document.createElement('span');
    actions.className = 'row-actions';
    actions.innerHTML = `
      <button title="puja" data-act="up">↑</button>
      <button title="baixa" data-act="down">↓</button>
      <button title="renombra" data-act="rename">✎</button>
    `;
    actions.querySelectorAll('button').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const act = btn.dataset.act;
        if(act==='up') moveSibling(id,-1);
        if(act==='down') moveSibling(id,1);
        if(act==='rename') startRename(id, title);
      };
    });
    row.appendChild(actions);

    row.onclick = ()=> selectNode(id);
    row.ondblclick = ()=> startRename(id, title);

    li.appendChild(row);

    if(hasChildren && isOpen){
      const ul = document.createElement('ul');
      ul.className = 'tree';
      const childOrder = searchTerm ? node.children.filter(subtreeHasMatch) : node.children;
      childOrder.forEach(cid => ul.appendChild(renderNode(cid)));
      li.appendChild(ul);
    }
    return li;
  }

  function startRename(id, titleEl){
    titleEl.contentEditable = "true";
    titleEl.focus();
    document.execCommand('selectAll', false, null);
    function finish(){
      titleEl.contentEditable = "false";
      const node = getNode(id);
      node.title = titleEl.textContent.trim() || "Sense títol";
      save();
      renderAll();
    }
    titleEl.onblur = finish;
    titleEl.onkeydown = (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); titleEl.blur(); }
      if(e.key === 'Escape'){ titleEl.textContent = getNode(id).title; titleEl.blur(); }
    };
  }

  function toggleExpand(id){
    if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderTree();
  }

  function moveSibling(id, dir){
    const arr = siblingsArrayOf(id);
    const idx = arr.indexOf(id);
    const newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= arr.length) return;
    [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
    save();
    renderTree();
  }

  function selectNode(id){
    activeId = id;
    renderTree();
    renderEditor();
  }

  function renderEditor(){
    const empty = document.getElementById('empty-state');
    const body = document.getElementById('doc-body');
    const toolbar = document.getElementById('toolbar');
    const titleInput = document.getElementById('doc-title');
    const crumbs = document.getElementById('crumbs');
    const addChild = document.getElementById('btn-add-child');
    const addSibling = document.getElementById('btn-add-sibling');
    const del = document.getElementById('btn-delete');

    if(!activeId || !getNode(activeId)){
      empty.style.display = 'block';
      body.style.display = 'none';
      toolbar.classList.remove('show');
      titleInput.value = '';
      titleInput.disabled = true;
      crumbs.innerHTML = '&nbsp;';
      addChild.disabled = true; addSibling.disabled = true; del.disabled = true;
      return;
    }
    addChild.disabled = false; addSibling.disabled = false; del.disabled = false;
    empty.style.display = 'none';
    body.style.display = 'block';
    toolbar.classList.add('show');
    const node = getNode(activeId);
    titleInput.disabled = false;
    titleInput.value = node.title;
    if(body.innerHTML !== (node.body || "")) body.innerHTML = node.body || "";
    crumbs.textContent = breadcrumb(activeId);
  }

  function breadcrumb(id){
    const parts = [];
    let cur = getNode(id);
    while(cur){
      parts.unshift(cur.title || "Sense títol");
      cur = cur.parent ? getNode(cur.parent) : null;
    }
    return parts.join(' / ');
  }

  function renderAll(){ renderTree(); renderEditor(); }

  // ===== Event wiring =====
  document.getElementById('doc-title').addEventListener('input', (e)=>{
    if(!activeId) return;
    getNode(activeId).title = e.target.value;
    save();
    renderTree();
    document.getElementById('crumbs').textContent = breadcrumb(activeId);
  });

  let bodyDebounce;
  const docBodyEl = document.getElementById('doc-body');
  docBodyEl.addEventListener('input', (e)=>{
    if(!activeId) return;
    getNode(activeId).body = e.target.innerHTML;
    clearTimeout(bodyDebounce);
    bodyDebounce = setTimeout(save, 250);
  });

  // Rich text toolbar: uses the browser's built-in editing commands.
  document.querySelectorAll('#toolbar button').forEach(btn=>{
    btn.addEventListener('mousedown', (e)=> e.preventDefault()); // keep selection focused
    btn.addEventListener('click', ()=>{
      const cmd = btn.dataset.cmd;
      document.execCommand(cmd, false, null);
      docBodyEl.focus();
      updateToolbarState();
      if(activeId){
        getNode(activeId).body = docBodyEl.innerHTML;
        save();
      }
    });
  });
  function updateToolbarState(){
    document.querySelectorAll('#toolbar button[data-cmd="bold"], #toolbar button[data-cmd="italic"], #toolbar button[data-cmd="underline"]').forEach(btn=>{
      try{
        btn.classList.toggle('on', document.queryCommandState(btn.dataset.cmd));
      }catch(e){ /* ignore in unsupported contexts */ }
    });
  }
  docBodyEl.addEventListener('keyup', updateToolbarState);
  docBodyEl.addEventListener('mouseup', updateToolbarState);
  docBodyEl.addEventListener('focus', updateToolbarState);

  document.getElementById('btn-new-root').onclick = ()=>{
    const id = createNode("Nova branca", null);
    selectNode(id);
  };
  document.getElementById('btn-empty-new').onclick = ()=>{
    const id = createNode("Nova fitxa", null);
    selectNode(id);
  };
  document.getElementById('btn-add-child').onclick = ()=>{
    if(!activeId) return;
    const id = createNode("Nova fitxa", activeId);
    selectNode(id);
  };
  document.getElementById('btn-add-sibling').onclick = ()=>{
    if(!activeId) return;
    const parent = getNode(activeId).parent;
    const id = createNode("Nova fitxa", parent);
    selectNode(id);
  };
  document.getElementById('btn-delete').onclick = ()=>{
    if(!activeId) return;
    const node = getNode(activeId);
    const label = node.title || "aquesta fitxa";
    if(!confirm(`Esborrar "${label}" i tot el que conté? Aquesta acció no es pot desfer.`)) return;
    const parent = node.parent;
    deleteSubtree(activeId);
    activeId = parent || null;
    save();
    renderAll();
  };

  document.getElementById('search').addEventListener('input', (e)=>{
    searchTerm = e.target.value.trim();
    renderTree();
  });

  document.getElementById('btn-theme').onclick = ()=>{
    const cur = document.body.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    safeStorage.set(THEME_KEY, next);
  };
  (function initTheme(){
    const saved = safeStorage.get(THEME_KEY);
    if(saved) document.body.setAttribute('data-theme', saved);
  })();

  document.getElementById('btn-export').onclick = ()=>{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fitxer-treepad.json';
    a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById('btn-import').onclick = ()=> document.getElementById('file-input').click();
  document.getElementById('file-input').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed.nodes || !parsed.rootOrder) throw new Error('format invàlid');
        if(!confirm('Importar substituirà el contingut actual. Continuar?')) return;
        data = parsed;
        expanded = new Set(Object.keys(data.nodes));
        activeId = data.rootOrder[0] || null;
        save();
        renderAll();
      }catch(err){
        alert('No s\'ha pogut llegir el fitxer: format JSON no vàlid.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('mobile-toggle').onclick = ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  };

  // init
  if(!activeId && data.rootOrder.length){
    activeId = data.rootOrder[0];
  }
  renderAll();
})();
</script>
</body>
</html>
