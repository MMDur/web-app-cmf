{"t":"p","x":"Nous te le demandons par  le Christ, notre Seigneur. Amen."}
]},
{id:"84",num:84,title:"Pour les vocations",theme:"vocations",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur Jésus, qui as dit: «Priez le Maître de la moisson"},
{"t":"p","x":"d'envoyer des ouvriers à sa moisson»:"},
{"t":"p","x":"Nous te demandons humblement de daigner en envoyer"},
{"t":"p","x":"à notre Congrégation. Répands ton Esprit sur ceux"},
{"t":"p","x":"que tu as déjà choisis et confirmeles dans la vocation,"},
{"t":"p","x":"afin que, en  annonçant avec dignité et fruit ton  Évangile,"},
{"t":"p","x":"nous nous appelions et soyons vraiment"},
{"t":"p","x":"des Fils du Cœur Immaculé de Marie,"},
{"t":"p","x":"que nous t'aimions de tout notre cœur,"},
{"t":"p","x":"et que nous ne cessions jamais de te louer. Amen."}
]},
{id:"85",num:85,title:"La Vocation",theme:"vocations",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, toi qui as appelé les Apôtres"},
{"t":"p","x":"à devenir des pêcheurs d'hommes,"},
{"t":"p","x":"appelle de nouveaux membres à la Famille Clarétaine,"},
{"t":"p","x":"qui soient le sel de la terre et la lumière du monde"},
{"t":"p","x":"et qui répandent partout la charité qui animait"},
{"t":"p","x":"ton serviteur Antoine-Marie Claret."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"86",num:86,title:"Par l'intercession du Cœur Immaculé de Marie",theme:"vocations",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, qui par l'intercession du Cœur de Marie"},
{"t":"p","x":"as daigné donner à saint Antoine-Marie Claret"},
{"t":"p","x":"un grand amour à ton Fils et lui as  inspiré la fondation"},
{"t":"p","x":"de notre  Congrégation des Missionnaires"},
{"t":"p","x":"pour le salut des hommes du monde entier."},
{"t":"p","x":"Bénis notre Congrégation avec de nouvelles vocations,"},
{"t":"p","x":"et accordenous de persévérer jusqu'à la fin"},
{"t":"p","x":"dans l'annonce de l'Évangile. Amen."}
]},
{id:"87",num:87,title:"Prière pour demander au Seigneur des vocations",theme:"vocations",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, pour continuer dans tout le monde"},
{"t":"p","x":"la grande œuvre de saint Antoine-Marie Claret,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Seigneur, pour sanctifier les peuples"},
{"t":"p","x":"par la prédication et autres travaux apostoliques,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Seigneur, pour porter la lumière de l'Évangile"},
{"t":"p","x":"à tous ceux qui ne te connaissent pas,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Seigneur, pour répandre le Règne du Cœur de Marie,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Seigneur, afin que, par l'intercession du Cœur de Marie,"},
{"t":"p","x":"s'accomplisse toujours ta volonté,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Seigneur, afin que tous les croyants reçoivent"},
{"t":"p","x":"une formation profondement chrétienne"},
{"t":"p","x":"et que notre société soit plus juste et plus humaine,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Jésus, le premier Fils du Cœur Immaculé de Marie,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Cœur Immaculé de Marie, Mère de tous les hommes,"},
{"t":"p","x":"Envoie-nous de nombreux et saints Missionnaires."},
{"t":"p","x":"Prions. Notre Père, toi qui veux que tous les hommes"},
{"t":"p","x":"soient sauvés et parviennent à la connaissance de la vérité,"},
{"t":"p","x":"nous te prions d'envoyer des ouvriers à ta moisson"},
{"t":"p","x":"et de leur accorder de prêcher avec confiance ta Parole,"},
{"t":"p","x":"afin que la vérité resplendisse et se propage"},
{"t":"p","x":"et que tous te connaissent, toi, le Dieu unique et vrai."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"88",num:88,title:"Pour les vocations missionnaires",theme:"vocations",sub:null,tags:[],lines:[
{"t":"p","x":"O Dieu, toi qui veux que tous les hommes soient sauvés,"},
{"t":"p","x":"et parviennent à la connaissance de la vérité,"},
{"t":"p","x":"attire à toi encore des hommes qui suivent ton Fils"},
{"t":"p","x":"à la manière de saint Antoine-Marie Claret,"},
{"t":"p","x":"et envoie-les sur le champ du monde,"},
{"t":"p","x":"afin qu'ils prêchent l'Évangile à toute créature,"},
{"t":"p","x":"et que ton peuple, réuni par la Parole de vie"},
{"t":"p","x":"et soutenu par la force des sacrements,"},
{"t":"p","x":"chemine par les sentiers du salut et de l'amour."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur, Amen."}
]},
{id:"89",num:89,title:"Prière pour les vocations et la persévérance",theme:"vocations",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, tu as dit que la moisson est abondante"},
{"t":"p","x":"et les ouvriers, peu nombreux, et qui veux que se multiplie"},
{"t":"p","x":"le nombre d’apôtres et d’évangélisateurs,"},
{"t":"p","x":"afin qu'ils étendent ton Règne et transforment  la terre."},
{"t":"p","x":"Nous te prions d'augmenter le nombre"},
{"t":"p","x":"et la qualité évangélique"},
{"t":"p","x":"de ceux qui travaillent pour le bien des hommes."},
{"t":"p","x":"Nous te rendons grâce pour les vocations"},
{"t":"p","x":"que tu nous as envoyées par le Cœur de Marie, notre Mère."},
{"t":"p","x":"Accordenous ta présence et ton secours,"},
{"t":"p","x":"afin que de nombreuses vocations viennent à notre Institut;"},
{"t":"p","x":"et aidenous tous à persévérer dans notre vocation."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"90",num:90,title:"Pour les vocations à tous les états de vie chrétienne",theme:"vocations",sub:null,tags:[],lines:[
{"t":"p","x":"Éclairés et animés par ta Parole, nous te prions, Seigneur,"},
{"t":"p","x":"pour tous ceux qui ont déjà entendu ton appel et l'ont suivi."},
{"t":"p","x":"Nous te prions, écoutenous."},
{"t":"p","x":"Pour le Pape, les évêques, les prêtres, les diacres,"},
{"t":"p","x":"les missionnaires et pour tous les consacrés,"},
{"t":"p","x":"afin que nous vivions tous notre vocation avec joie"},
{"t":"p","x":"et que, avec notre vie et notre parole,"},
{"t":"p","x":"nous te rendions présent au milieu des hommes."},
{"t":"p","x":"Nous te prions, écoutenous."},
{"t":"p","x":"Pour les laïcs qui travaillent généreusement"},
{"t":"p","x":"dans les ministères institués par l'Église"},
{"t":"p","x":"et dans les services nécessaires à la communauté."},
{"t":"p","x":"Nous te prions, écoutenous."},
{"t":"p","x":"Soutiensles dans les difficultés,"},
{"t":"p","x":"réconforteles dans leurs souffrances,"},
{"t":"p","x":"soutiensles dans la solitude,"},
{"t":"p","x":"protégeles dans la persécution et augmente leur fidélité."},
{"t":"p","x":"Nous te prions, écoutenous."},
{"t":"p","x":"Nous te prions, Seigneur, pour tous ceux"},
{"t":"p","x":"qui ouvrent leur cœur à ton appel et se préparent à le suivre."},
{"t":"p","x":"Nous te prions, écoutenous."},
{"t":"p","x":"Que ta Parole les éclaire, ta présence les captive"},
{"t":"p","x":"et ton Esprit les guide jusqu'au bout"},
{"t":"p","x":"de la profession religieuse ou des ordres sacrés."},
{"t":"p","x":"Nous te prions, écoutenous."},
{"t":"p","x":"Sois pour eux, Seigneur, un appui solide,"},
{"t":"p","x":"fais qu'ils rencontrent quelqu’un pour les conseiller,"},
{"t":"p","x":"les accompagner et les soutenir avec la force de conviction"},
{"t":"p","x":"et avec l'amour que Toi seul peux communiquer."},
{"t":"p","x":"Nous te prions, écoutenous."}
]},
{id:"92",num:92,title:"Pour nos frères malades",theme:"malades",sub:null,tags:[],lines:[
{"t":"v","x":": Sauve, Seigneur, tes serviteurs,"},
{"t":"r","x":": car ils espèrent en toi."},
{"t":"v","x":": De ton Sanctuaire, envoie sur eux ton secours;"},
{"t":"r","x":": et de Sion, protègeles."},
{"t":"v","x":": Sois leur rempart, Seigneur,"},
{"t":"r","x":": face à l'ennemi."},
{"t":"v","x":": Accordeleur ta force"},
{"t":"r","x":": au lit de la douleur."},
{"t":"v","x":": Seigneur, entends notre prière,"},
{"t":"r","x":": et que notre clameur parvienne jusqu'à Toi."},
{"t":"v","x":": Le Seigneur soit avec vous."},
{"t":"r","x":": Et avec votre esprit."},
{"t":"p","x":"Prions. O Dieu, toi qui compatis toujours et qui pardonnes,"},
{"t":"p","x":"accueille notre prière. Dans ton infinie bonté,"},
{"t":"p","x":"prends pitié de nous et de tes serviteurs malades."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."},
{"t":"rub","x":"Ou bien:"},
{"t":"p","x":"O Dieu, seul  rempart pour la faiblesse humaine,"},
{"t":"p","x":"montre la force de ton secours sur tes serviteurs malades,"},
{"t":"p","x":"afin que, aidés par ta miséricorde, ils méritent à nouveau"},
{"t":"p","x":"de se présenter sains devant ton Église."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."},
{"t":"rub","x":"Ou bien:"},
{"t":"p","x":"Nous te demandons, Seigneur, que tes serviteurs"},
{"t":"p","x":"jouissent toujours de la santé de l'âme et du corps."},
{"t":"p","x":"Par l'intercession de sainte Marie, Vierge, délivrenous"},
{"t":"p","x":"des tristesses de ce monde et accordenous les joies du ciel."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"95",num:95,title:"Prière pour les parents  défunts",theme:"defunts",sub:null,tags:[],lines:[
{"t":"p","x":"O Dieu, qui nous as commandé d'honorer nos parents,"},
{"t":"p","x":"sois miséricordieux envers eux: pardonne leurs péchés"},
{"t":"p","x":"et fais que nous soyons réunis un jour avec eux"},
{"t":"p","x":"dans la clarté de ta gloire."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"96",num:96,title:"Pour les familiers et bienfaiteurs",theme:"defunts",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur notre Dieu, par le mystère pascal de ton Fils,"},
{"t":"p","x":"maintiens en nous l'espérance de notre résurrection."},
{"t":"p","x":"Nous te demandons humblement que tous ceux"},
{"t":"p","x":"qui ont partagé sur cette terre notre fraternité clarétaine"},
{"t":"p","x":"et collaboré à notre mission d'annoncer l'Évangile"},
{"t":"p","x":"parviennent à la joie du bonheur éternel."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"97",num:97,title:"Prière pour les frères, parents et bienfaiteurs",theme:"defunts",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, notre Dieu, qui accordes le pardon des péchés"},
{"t":"p","x":"et le salut à tous les hommes:"},
{"t":"p","x":"accorde à nos frères, parents et bienfaiteurs,"},
{"t":"p","x":"qui ont quitté ce monde, d’obtenir, par l'intercession"},
{"t":"p","x":"de la Vierge  et de tous les saints, le bonnheur du ciel."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."},
{"t":"p","x":"III. LA PRIÈRE JOURNALIÈRE"}
]},
{id:"101",num:101,title:"L'angélus",theme:"angelus",sub:null,tags:[],lines:[
{"t":"p","x":"On récite l’angélus après la prière des laudes, hors du temps pascal."},
{"t":"v","x":": L'ange du Seigneur apporta l'annonce à Marie."},
{"t":"r","x":": Et elle conçut du Saint Esprit. Je vous salue, Marie."},
{"t":"v","x":": Voici la servante du Seigneur."},
{"t":"r","x":": Qu'il me soit fait selon ta parole."},
{"t":"v","x":": Et le Verbe de Dieu s'est fait chair."},
{"t":"r","x":": Et il a habité parmi nous."},
{"t":"v","x":": Prie pour nous, sainte Mère de Dieu."},
{"t":"r","x":": Afin que nous soyons rendus dignes"},
{"t":"p","x":"des promesses du Christ."},
{"t":"p","x":"Daigne, Seigneur, répandre ta grâce en nos âmes, afin qu’ayant connu,  par le message de l'Ange, l'incarnation du Christ, ton Fils, nous arrivions, par sa passion et par sa croix,"},
{"t":"p","x":"à la gloire de la résurrection."},
{"t":"p","x":"Par le même Jésus, le Christ, notre Seigneur. Amen."},
{"t":"p","x":"Au temps pascal:"},
{"t":"p","x":"Reine du ciel, réjouistoi, alléluia!,"},
{"t":"p","x":"car le Seigneur que tu as mérité de porter, alléluia!,"},
{"t":"p","x":"est ressuscité comme il l'a dit. Alléluia!"},
{"t":"p","x":"Prie Dieu pour nous, alléluia !"},
{"t":"v","x":": Réjouis-toi, Vierge Marie, alléluia !"},
{"t":"r","x":": Car le Seigneur est vraiment ressuscité, alléluia !"},
{"t":"p","x":"Dieu, qui par la résurrection de ton Fils,"},
{"t":"p","x":"notre Seigneur Jésus Christ,"},
{"t":"p","x":"as fait briller la joie dans le monde,"},
{"t":"p","x":"daigne, par l'intercession de  la Vierge Marie, sa Mère,"},
{"t":"p","x":"nous conduire aux joies de la vie éternelle."},
{"t":"p","x":"Par le Christ, notre Seigneur. Amen."},
{"t":"p","x":"Après les Vêpres, on récite l’angélus ou une autre prière à la Vierge."}
]},
{id:"102",num:102,title:"Les Antiennes mariales",theme:"angelus",sub:null,tags:[],lines:[
{"t":"p","x":"Elles se trouvent toutes dans le Livre des Heures ou La Prière du Temps présent, après les complies."}
]},
{id:"113",num:113,title:"Illumine, Seigneur, avec la lumière de la foi,",theme:"eucharistie",sub:null,tags:[],lines:[
{"t":"p","x":"nos cœurs et embraseles du feu de la charité"},
{"t":"p","x":"afin que nous adorions, en esprit et en vérité,"},
{"t":"p","x":"celui que nous reconnaissons en ce Sacrement"},
{"t":"p","x":"comme notre Seigneur et notre Dieu."},
{"t":"p","x":"Lui qui vit et règne pour les siècles. Amen."}
]},
{id:"114",num:114,title:"Dieu, qui as racheté tous les hommes",theme:"eucharistie",sub:null,tags:[],lines:[
{"t":"p","x":"par le mystère pascal du Christ, qui s'offre luimême"},
{"t":"p","x":"en ce Sacrement pour ses frères;"},
{"t":"p","x":"accordenous que, vénérant constamment"},
{"t":"p","x":"le mystère de notre rédemption, nous méritions"},
{"t":"p","x":"recueillir ses fruits et susciter en tous les hommes"},
{"t":"p","x":"le souvenir de la présence du Seigneur."},
{"t":"p","x":"Par le même Jésus Christ, notre Seigneur. Amen."}
]},
{id:"115",num:115,title:"Que le sacrement de l'Eucharistie, Seigneur,",theme:"eucharistie",sub:null,tags:[],lines:[
{"t":"p","x":"remplisse nos cœurs de ton amour et du zèle apostolique,"},
{"t":"p","x":"afin que nous y trouvions la force qui nous pousse"},
{"t":"p","x":"à désirer que tous les hommes te connaissent,"},
{"t":"p","x":"t'aiment et te servent, et à leur procurer ainsi"},
{"t":"p","x":"la béatitude de ce Royaume initié déjà sur la terre."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"116",num:116,title:"Seigneur, toi qui nous fais participants",theme:"eucharistie",sub:null,tags:[],lines:[
{"t":"p","x":"d'un même pain et d'un même Esprit, accordenous"},
{"t":"p","x":"que, comme les sarments sont unis à la vigne,"},
{"t":"p","x":"nous  soyons unis avec toi,"},
{"t":"p","x":"pour édifier notre communion"},
{"t":"p","x":"et  que le monde croie."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"117",num:117,title:"Seigneur Jésus, toi qui t'identifies pleinement",theme:"eucharistie",sub:null,tags:[],lines:[
{"t":"p","x":"avec ceux qui souffrent et qui nous as dit :"},
{"t":"p","x":"«Venez à moi, vous tous qui peinez"},
{"t":"p","x":"sous le poids du fardeau,"},
{"t":"p","x":"et moi, je vous donnerai le repos»."},
{"t":"p","x":"Solidaires des hommes qui souffrent la maladie,"},
{"t":"p","x":"l'injustice et l'oppression, nous venons en ta présence,"},
{"t":"p","x":"afin que tu nous embrases dans ta charité,"},
{"t":"p","x":"jusqu'à ce que nous nous réjouissions dans les tourments"},
{"t":"p","x":"et que nous nous glorifions dans ta croix."},
{"t":"p","x":"Toi qui vis et règnes pour les siècles des siècles. Amen."}
]},
{id:"118",num:118,title:"Seigneur, qui, par le mystère pascal,",theme:"eucharistie",sub:null,tags:[],lines:[
{"t":"p","x":"as réalisé le salut des hommes, accordenous la grâce"},
{"t":"p","x":"de savoir t'adorer présent en ce Sacrement"},
{"t":"p","x":"et de proclamer avec foi"},
{"t":"p","x":"ce que nous vénérons maintenant."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"119",num:119,title:"Seigneur Jésus, daigne nous enflammer dans la foi",theme:"eucharistie",sub:null,tags:[],lines:[
{"t":"p","x":"qui poussa tant de prédicateurs de la Parole divine"},
{"t":"p","x":"à embrasser la pauvreté, l'abnégation et le sacrifice,"},
{"t":"p","x":"pour étendre le Règne du Christ."},
{"t":"p","x":"Nous te le demandons, unis à toi de tout notre cœur,"},
{"t":"p","x":"toi qui es présent dans le mystère eucharistique,"},
{"t":"p","x":"que nous vénérons maintenant,"},
{"t":"p","x":"et dont nous partageons la vie et le ministère."},
{"t":"p","x":"Toi qui vis et règnes dans l'unité"},
{"t":"p","x":"du Père et de l'Esprit Saint,"},
{"t":"p","x":"pour les siècles des siècles. Amen."}
]},
{id:"131",num:131,title:"Viens, Esprit Saint",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Viens, Esprit Saint, remplis le cœur de tes fidèles et allume en eux le feu de ton amour."},
{"t":"v","x":"/ Envoie ton Esprit et tout sera créé"},
{"t":"r","x":"/ Et tu renouvelleras la face de la terre."},
{"t":"p","x":"Prions. O Dieu qui as illuminé le cœur de tes fidèles de la lumière de l'Esprit Saint, rend-nous dociles à ce même Esprit pour que nous puissions  faire toujours  le bien, et jouir de la lumière de sa vérité et de la joie de sa présence. Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"132",num:132,title:"Réunis en ton nom",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, réunis en ton nom, nous voulons vivre en ta présence. Accordenous un esprit de dialogue, illumine nos esprits par la lumière de ta vérité et renforce notre esprit fraternel, afin que nous cherchions toujours ensemble à connaître et à faire ta volonté. Par Jésus le Christ, notre Seigneur. Amen."}
]},
{id:"133",num:133,title:"Dans la sagesse (Sg 9, 16. 911)",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Dieu de nos pères et Seigneur de miséricorde,"},
{"t":"p","x":"qui, par ta parole, as fait toutes les choses."},
{"t":"p","x":"Tu as formé l'homme dans ta sagesse,"},
{"t":"p","x":"pour qu'il devienne le maître de toutes les créatures,"},
{"t":"p","x":"en régissant le monde avec sainteté et justice"},
{"t":"p","x":"et en pratiquant la justice avec un cœur droit."},
{"t":"p","x":"Donnemoi la sagesse assise près de toi"},
{"t":"p","x":"et ne m'exclue pas du nombre de tes serviteurs,"},
{"t":"p","x":"parce que je suis ton serviteur, le fils de ta servante,"},
{"t":"p","x":"un homme faible, qui ne compte pas beaucoup d'années,"},
{"t":"p","x":"trop petit pour connaître le jugement et les lois."},
{"t":"p","x":"Car, même si quelqu’un est parfait"},
{"t":"p","x":"parmi les enfants des hommes,"},
{"t":"p","x":"sans la sagesse qui vient de toi,"},
{"t":"p","x":"il sera compté pour rien ."},
{"t":"p","x":"La sagesse est avec toi, qui connaît tes oeuvres,"},
{"t":"p","x":"qui était avec toi quand tu créas le monde,"},
{"t":"p","x":"et qui connaît tout ce qui plaît à tes yeux"},
{"t":"p","x":"et tout ce qui est droit selon tes préceptes."},
{"t":"p","x":"Envoiela de tes cieux saints,"},
{"t":"p","x":"et, de ton trône de gloire, daigne l'envoyer"},
{"t":"p","x":"afin qu'elle soit avec moi dans mon travail"},
{"t":"p","x":"et que je sache ce qui est agréable à tes yeux."},
{"t":"p","x":"Parce qu’elle connaît et comprend toutes les choses,"},
{"t":"p","x":"me guidera prudemment dans toutes mes œuvres"},
{"t":"p","x":"et me gardera dans sa splendeur."},
{"t":"p","x":"Amen;"}
]},
{id:"134",num:134,title:"Chercher et accomplir ensemble la volonté de Dieu",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Antienne : Le Seigneur a dit: « là ou deux ou trois"},
{"t":"p","x":"sont réunis en mon nom, j'y suis au milieu d'eux »."},
{"t":"p","x":"Prions. Dieu, notre Père, ton Fils a promis"},
{"t":"p","x":"d'être présent au milieu de tous ceux"},
{"t":"p","x":"qui se rassemblent en son nom."},
{"t":"p","x":"Faisnous sentir maintenant sa présence parmi nous,"},
{"t":"p","x":"afin que nous manifestions au monde"},
{"t":"p","x":"la communion de vie et de mission de tout l'Institut."},
{"t":"p","x":"Accorde-nous de cheminer dans une vie nouvelle"},
{"t":"p","x":"en obéissant à l'Esprit  et en exerçant fidèlement"},
{"t":"p","x":"notre charisme missionnaire."},
{"t":"p","x":"Accorde-nous la grâce de connaître ta volonté"},
{"t":"p","x":"et de l'accomplir fidèlement."},
{"t":"p","x":"Fais que, animés d’un même idéal et  d’un amour fraternel,"},
{"t":"p","x":"nous accomplissions notre commune mission dans l'Église."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"135",num:135,title:"La grâce et les dispositions au dialogue",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Nous voici, Seigneur, réunis en ton nom"},
{"t":"p","x":"avec le désir d’étendre ton Royaume."},
{"t":"p","x":"Que le Saint-Esprit, que tu as envoyé dans nos cœurs"},
{"t":"p","x":"et qui maintient vivante ta présence en nous,"},
{"t":"p","x":"nous enseigne ce que nous avons à traiter"},
{"t":"p","x":"et le but vers lequel nous devons cheminer, afin que,"},
{"t":"p","x":"fortifiés par ta grâce, nous puissions réaliser tes  desseins."},
{"t":"p","x":"Esprit Saint, inspire et guide notre discernement."},
{"t":"p","x":"Enseignenous à écouter les autres"},
{"t":"p","x":"et à nous laisser éclairer par leurs lumières."},
{"t":"p","x":"Apprendsnous à proposer sans imposer."},
{"t":"p","x":"Délivrenous de l'aveuglement"},
{"t":"p","x":"du désir de vouloir toujours avoir raison,"},
{"t":"p","x":"de tout favoritisme et de l'acception des personnes."},
{"t":"p","x":"Fais que nous restions fermement unis à toi,"},
{"t":"p","x":"afin que nous nous laisions toujours guider par la vérité. Amen."}
]},
{id:"136",num:136,title:"Lumière pour découvrir les exigences de l'Évangile",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Regarde, Père de bonté, cette communauté"},
{"t":"p","x":"réunie en ton nom pour partager la fraternité"},
{"t":"p","x":"et pour dialoguer dans la vérité;"},
{"t":"p","x":"accordelui de découvrir avec grande clarté"},
{"t":"p","x":"les exigences de l'Évangile pour devenir"},
{"t":"p","x":"lumière du monde et sel de la terre."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"137",num:137,title:"Prière pour commencer une réunion",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, que ta grâce nous inspire toujours,"},
{"t":"p","x":"qu'elle soutienne et accompagne nos œuvres,"},
{"t":"p","x":"pour qu’elles commencent en toi, comme en leur source,"},
{"t":"p","x":"et tendent toujours vers toi, comme à leur  fin."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"138",num:138,title:"Action de grâce pour cette rencontre",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Père de bonté, nous te rendons grâce pour cette rencontre"},
{"t":"p","x":"où nous avons partagé nos rêves et nos déceptions,"},
{"t":"p","x":"nos projets et nos difficultés."},
{"t":"p","x":"Aidenous à répondre toujours efficacement"},
{"t":"p","x":"à notre vocation et à notre mission dans l'Église,"},
{"t":"p","x":"suivant les traces de Claret, notre Père."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"139",num:139,title:"Un seul cœur et une seule âme",theme:"reunions",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, nous te rendons grâce pour cette rencontre,"},
{"t":"p","x":"pour ta bonté et ta présence parmi nous ;"},
{"t":"p","x":"fais que, unis par l’esprit communautaire,"},
{"t":"p","x":"nous n'ayons qu'un seul cœur et une seule âme,"},
{"t":"p","x":"pour former une communauté évangélisée et évangélisatrice."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."},
{"t":"p","x":"VII. RÉCOLLECTIONS  ET  RETRAITES"},
{"t":"p","x":"SPIRITUELLES"}
]},
{id:"144",num:144,title:"Prière du P. Fondateur au commencement des exercices",theme:"exercices",sub:null,tags:[],lines:[
{"t":"p","x":"Vierge Marie, ma Mère, toi qui as eu le bonheur"},
{"t":"p","x":"de voir réunis les Apôtres et les disciples au Cénacle"},
{"t":"p","x":"et de les voir tous remplis de l'Esprit Saint,"},
{"t":"p","x":"je te demande, plein de confiance, de me donner"},
{"t":"p","x":"toutes les grâces dont j’ai besoin"},
{"t":"p","x":"pour bien  faire ces exercices sous ta direction."},
{"t":"p","x":"Affermismoi dans ma résolution de faire"},
{"t":"p","x":"ce qui est le plus conforme à la volonté de Dieu"},
{"t":"p","x":"et ce qui contribue le plus  à sa plus grande gloire"},
{"t":"p","x":"et au bien de mon âme."},
{"t":"p","x":"O ma Mère, viens à mon secours"},
{"t":"p","x":"et gardemoi maintenant et à jamais. Amen."},
{"t":"p","x":"VIII.  LES FÊTES DE LA CONGRÉGATION,"},
{"t":"p","x":"LES BÉATIFICATIONS ET CANONISATIONS"},
{"t":"p","x":"4) Prières à Saint Joseph"}
]},
{id:"157",num:157,title:"Litanies de Saint Joseph",theme:"saint-joseph",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, prends pitié,Seigneur, prends pitié."},
{"t":"p","x":"O Christ, prends pitié,Ô Christ, prends pitié."},
{"t":"p","x":"Seigneur, Prends pitié,Seigneur, prends pitié."},
{"t":"p","x":"Christ, écoutenous,Christ, écoute-nous."},
{"t":"p","x":"Christ exaucenous,Christ, exauce-nous."},
{"t":"p","x":"Père du Ciel, Seigneur Dieu, prends pitié de nous."},
{"t":"p","x":"Fils, Rédempteur du monde, prends pitié de nous."},
{"t":"p","x":"SaintEsprit, Seigneur Dieu, prends pitié de nous."},
{"t":"p","x":"Sainte Trinité, un seul Dieu, prends pitié de nous."},
{"t":"p","x":"Sainte Marie, prie pour nous."},
{"t":"p","x":"Saint Joseph, prie pour nous."},
{"t":"p","x":"Illustre fils de David,prie pour nous."},
{"t":"p","x":"Lumière de Patriarches,prie pour nous."},
{"t":"p","x":"Époux de la Mère de Dieu,prie pour nous."},
{"t":"p","x":"Chaste gardien de la Vierge,prie pour nous."},
{"t":"p","x":"Père nourricier du Fils de Dieu,prie pour nous."},
{"t":"p","x":"Protecteur dévoué du Christ,prie pour nous."},
{"t":"p","x":"Chef de la sainte Famille,prie pour nous."},
{"t":"p","x":"Joseph parfaitement juste,prie pour nous."},
{"t":"p","x":"Joseph plein de prudence,prie pour nous."},
{"t":"p","x":"Joseph plein de force,prie pour nous."},
{"t":"p","x":"Joseph parfaitement obéissant,prie pour nous."},
{"t":"p","x":"Joseph parfaitement fidèle,prie pour nous."},
{"t":"p","x":"Miroir de patience,prie pour nous."},
{"t":"p","x":"Ami de la pauvreté,prie pour nous"},
{"t":"p","x":"Modèle des ouvriers,prie pour nous"},
{"t":"p","x":"Gloire de la vie de famille,prie pour nous"},
{"t":"p","x":"Gardien des vierges,prie pour nous."},
{"t":"p","x":"Soutien des familles, prie pour nous."},
{"t":"p","x":"Réconfort des malheureux,prie pour nous."},
{"t":"p","x":"Espoir des malades, prie pour nous."},
{"t":"p","x":"Patron des mourants,prie pour nous."},
{"t":"p","x":"Terreur des démons,prie pour nous."},
{"t":"p","x":"Protecteur de la sainte Église,prie pour nous."},
{"t":"p","x":"Agneau de Dieu,"},
{"t":"p","x":"qui enlèves le péché du monde,pardonne-nous, Seigneur."},
{"t":"p","x":"Agneau de Dieu,"},
{"t":"p","x":"qui enlèves le péché du monde,        exauce-nous, Seigneur."},
{"t":"p","x":"Agneau de Dieu,"},
{"t":"p","x":"qui enlèves le péché du monde,         prends pitié de nous."},
{"t":"p","x":"Prions le Seigneur."},
{"t":"p","x":"Seigneur Dieu, ton ineffable providence a daigné choisir saint Joseph pour époux de la Mère de ton Fils. Fais qu’ intercède pour nous dans le ciel celui que nous honorons comme protecteur sur la terre. Toi qui vis et règnes dans les siècles des siècles. Amen."},
{"t":"p","x":"Prières à saint Joseph"}
]},
{id:"159",num:159,title:"Prière de Léon XIII à saint Joseph",theme:"saint-joseph",sub:null,tags:[],lines:[
{"t":"p","x":"C'est vers toi, bienheureux Joseph,"},
{"t":"p","x":"que nous recourons dans nos besoins"},
{"t":"p","x":"et  invoquons ta protection"},
{"t":"p","x":"avec celle de la Vierge Marie, ton épouse."},
{"t":"p","x":"Par le saint amour qui t'a uni à Marie, la Mère de Dieu,"},
{"t":"p","x":"et ta garde paternelle de l'Enfant Jésus,"},
{"t":"p","x":"regarde avec bonté le peuple"},
{"t":"p","x":"que le Christ s'est acquis par son sang."},
{"t":"p","x":"Viens nous aider avec ton secours dans nos nécessités."},
{"t":"p","x":"Gardien de la Sainte Famille, protège l'Église"},
{"t":"p","x":"de tous les fléaux qui frappent le monde,"},
{"t":"p","x":"et soutiens-nous dans la lutte contre le pouvoir du mal. Aide-nous à vivre saintement, à mourir dans la paix de Dieu"},
{"t":"p","x":"et à obtenir la béatitude éternelle du Ciel. Amen."}
]},
{id:"160",num:160,title:"Prière à Saint Joseph de Jean XXIII",theme:"saint-joseph",sub:null,tags:[],lines:[
{"t":"p","x":"Ô Saint Joseph, gardien de Jésus,"},
{"t":"p","x":"époux très chaste de Marie,"},
{"t":"p","x":"qui as vécu en accomplissant parfaitement ton devoir,"},
{"t":"p","x":"nourrissant avec le travail de tes mains"},
{"t":"p","x":"la sainte Famille de Nazareth,"},
{"t":"p","x":"protège-nous favorablement, nous qui nous adressons à toi."},
{"t":"p","x":"Tu connais nos aspirations,"},
{"t":"p","x":"nos angoisses et nos espérances."},
{"t":"p","x":"Nous venons vers toi, parce que nous connaissons"},
{"t":"p","x":"que nous trouverons en toi un protecteur."},
{"t":"p","x":"Tu as aussi expérimenté l'épreuve et la fatigue,"},
{"t":"p","x":"mais ton esprit, rempli de la paix la plus profonde,"},
{"t":"p","x":"exulta de joie, parce que Dieu t’accorda la grâce"},
{"t":"p","x":"de vivre intimement uni à son Fils et à Marie ton épouse."},
{"t":"p","x":"Aide-nous à bien comprendre"},
{"t":"p","x":"que nous ne sommes pas seuls en notre travail,"},
{"t":"p","x":"à découvrir Jésus près de nous, à l'accueillir avec la grâce"},
{"t":"p","x":"et  à le garder fidèlement comme tu l'as fait."},
{"t":"p","x":"Obtiens-nous que, dans notre Congrégation,"},
{"t":"p","x":"tout soit sanctifié dans la charité, la patience, la justice et la recherche du bien. Amen."}
]},
{id:"161",num:161,title:"Prière à saint Joseph",theme:"saint-joseph",sub:null,tags:[],lines:[
{"t":"p","x":"Nous te saluons, Joseph,"},
{"t":"p","x":"époux virginal de Marie et père davidique du Messie."},
{"t":"p","x":"Tu es béni entre tous les hommes"},
{"t":"p","x":"et béni est Jésus, le Fils de Dieu qui te fut confié."},
{"t":"p","x":"Saint Joseph, patron de l'Église et de notre Congrégation,"},
{"t":"p","x":"garde nos communautés et nos familles"},
{"t":"p","x":"dans la paix et la grâce divine ;"},
{"t":"p","x":"et viens à notre secours à l'heure de notre mort. Amen."}
]},
{id:"162",num:162,title:"Prière à saint Joseph",theme:"saint-joseph",sub:null,tags:[],lines:[
{"t":"p","x":"Père Saint, qui as choisi saint Joseph"},
{"t":"p","x":"pour une mission singulière"},
{"t":"p","x":"et qui lui as accordé les grâces nécessaires"},
{"t":"p","x":"pour la réaliser dans la maison de Nazareth;"},
{"t":"p","x":"accorde, à nous aussi, les grâces dont nous avons besoin"},
{"t":"p","x":"pour accomplir fidèlement notre travail missionnaire"},
{"t":"p","x":"selon le charisme et l'esprit de la Congrégation."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"166",num:166,title:"Au Martyrs de Barbastro",theme:"martyrs",sub:null,tags:[],lines:[
{"t":"p","x":"Dieu, notre Père, qui nous as donné"},
{"t":"p","x":"dans les Martyrs Clarétains de Barbastro"},
{"t":"p","x":"un modèle de fidélité à la cause de Jésus,"},
{"t":"p","x":"d'amour au Cœur de Marie et à l'Église,"},
{"t":"p","x":"de fidélité aux frères et de pardon aux ennemis,"},
{"t":"p","x":"accorde-nous la grâce d'imiter leur exemple,"},
{"t":"p","x":"dans le partage fidèle et joyeux de notre consécration"},
{"t":"p","x":"et de l'annonce de l'Évangile"},
{"t":"p","x":"pour la gloire de Dieu et le salut de tous les hommes."},
{"t":"p","x":"Par Jésus le Christ, notre Seigneur. Amen."}
]},
{id:"168",num:168,title:"Prière à la bienheureuse martyre",theme:"martyrs",sub:null,tags:[],lines:[
{"t":"p","x":"María Patrocinio Giner, RMI"},
{"t":"p","x":"Dieu grand et miséricordieux,"},
{"t":"p","x":"qui as accordé à la bienheureuse María Patrocinio, vierge,"},
{"t":"p","x":"la grâce de se montrer généreuse au service de ses frères"},
{"t":"p","x":"et forte dans le martyre et le pardon ;"},
{"t":"p","x":"accorde-nous, par son intercession, de suivre fermement"},
{"t":"p","x":"les traces du Christ  sur le chemin de la croix,"},
{"t":"p","x":"afin de pouvoir ainsi prendre part un jour"},
{"t":"p","x":"à la gloire de la résurrection."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen"}
]},
{id:"168",num:168,title:"bis. Prière aux Bienheureux André Solà",theme:"martyrs",sub:null,tags:[],lines:[
{"t":"p","x":"et compagnons martyrs."},
{"t":"p","x":"Dieu tout-puissant et misércordieux,"},
{"t":"p","x":"qui as accordé la grâce de mouir pour le Christ"},
{"t":"p","x":"aux bienheureux Joseph Rangel, André Solá et Léonard López,"},
{"t":"p","x":"viens en aide à notre faiblesse,"},
{"t":"p","x":"afin que la célébration de leur martyre nous donne"},
{"t":"p","x":"la joie et la force de témoigner de notre foi."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"169",num:169,title:"Prière",theme:"beatification",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, notre Père, toi qui as choisi avec prédilection"},
{"t":"p","x":"tous les Fils du Cœur de la Vierge Marie"},
{"t":"p","x":"et fait que quelques-uns deviennent"},
{"t":"p","x":"des exemples insignes de vertu,"},
{"t":"p","x":"féconde ton Église par leur glorification et"},
{"t":"p","x":"fais qu'ils soient pour nous des modèles à imiter."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"170",num:170,title:"Prière",theme:"beatification",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, qui veux qu'ils soient saints"},
{"t":"p","x":"tous ceux que tu as appelés à notre Congrégation,"},
{"t":"p","x":"accorde à nos frères missionnaires,"},
{"t":"p","x":"qui ont suivi de plus près les traces de notre saint Fondateur"},
{"t":"p","x":"et qui ont donné leur vie au service de l'Évangile,"},
{"t":"p","x":"d'être glorifiés sur la terre et comptés parmi les saints du Ciel."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"171",num:171,title:"Prière",theme:"beatification",sub:null,tags:[],lines:[
{"t":"p","x":"Ô Dieu, qui élèves les humbles et rejettes les superbes,"},
{"t":"p","x":"daigne glorifier ton serviteur N. et fais resplendir son nom"},
{"t":"p","x":"dans la liste de ceux dont la sainteté a été reconnue par ton Église. Multiple tes grâces en faveur de ceux qui t'adressent"},
{"t":"p","x":"des supplications par son intercession."},
{"t":"p","x":"Et accorde-nous de voir l'Église honorer un jour sa mémoire en le proposant comme un modèle à imiter et un protecteur à invoquer dans les difficultés de notre vie missionnaire. Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"172",num:172,title:"Prière pour demander une béatification",theme:"beatification",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, notre Dieu, qui as élu quelques-uns de nos frères,"},
{"t":"p","x":"Fils du Cœur Immaculé de Marie, et les as fait resplendir"},
{"t":"p","x":"par l'exemple d'une particulière sainteté dans la vie missionnaire ;"},
{"t":"p","x":"daigne enrichir et féconder la sainte Église avec leur glorification"},
{"t":"p","x":"et accorde-nous la grâce de suivre leur témoignage évangélique, en travaillant avec ardeur à chercher en toutes choses"},
{"t":"p","x":"ta gloire et le salut de nos frères."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."},
{"t":"p","x":"IX. PROFESSIONS"},
{"t":"p","x":"ET RÉNOVATION DES VŒUX"},
{"t":"p","x":"XI. PRIÈRES POUR LE CHAPITRE"}
]},
{id:"183",num:183,title:"Prière pour le Chapitre (ou pendant sa célébration)",theme:"chapitre",sub:null,tags:[],lines:[
{"t":"p","x":"Viens, Esprit Saint, remplis le cœur de tes fidèles et allume en eux le feu de ton amour."},
{"t":"v","x":". : Envoie ton Esprit et tout sera créé"},
{"t":"r","x":". : Et tu renouvelleras la face de la terre."},
{"t":"rub","x":"Prions"},
{"t":"p","x":"O Dieu, qui as illuminé le cœur de tes fidèles"},
{"t":"p","x":"de la lumière de l'Esprit Saint,"},
{"t":"p","x":"accorde-nous de jouir toujours de la lumière de sa vérité"},
{"t":"p","x":"et d'être consolés avec les fruits de sa présence."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen"}
]},
{id:"186",num:186,title:"Prière pour le Chapitre",theme:"chapitre",sub:null,tags:[],lines:[
{"t":"p","x":"Esprit Divin,"},
{"t":"p","x":"qui, envoyé par le Père au nom de Jésus,"},
{"t":"p","x":"assistes et guides infailliblement l'Église,"},
{"t":"p","x":"repands sur le Chapitre la plénitude de tes dons."},
{"t":"p","x":"Doux Maître et Consolateur,"},
{"t":"p","x":"illumine les intelligences des membres du Chapitre."},
{"t":"p","x":"Fais que le Chapitre produise des fruits abondants"},
{"t":"p","x":"et une nouvelle vigueur"},
{"t":"p","x":"pour notre vie spirituelle et  apostolique,"},
{"t":"p","x":"afin de mieux diffuser parmi les hommes"},
{"t":"p","x":"la lumière et la force de l’Évangile."},
{"t":"p","x":"Hôte très doux de nos âmes,"},
{"t":"p","x":"confirme nos intelligences dans la vérité,"},
{"t":"p","x":"incline nos coeurs à l'obéissance,"},
{"t":"p","x":"afin que les conclusions du Chapitre trouvent"},
{"t":"p","x":"un accueil généreux"},
{"t":"p","x":"et un plein accomplissement."},
{"t":"p","x":"Renouvelle, dans notre Congrégation"},
{"t":"p","x":"et en chacun de nous, l'esprit qui anima"},
{"t":"p","x":"saint Antoine-Marie Claret, notre Père."},
{"t":"p","x":"Esprit Saint, transforme nos cœurs,"},
{"t":"p","x":"afin que, rassemblés dans une prière unanime,"},
{"t":"p","x":"autour du Cœur de Marie, notre Mère,"},
{"t":"p","x":"nous cherchions toujours et uniquement"},
{"t":"p","x":"la plus grande gloire de Dieu et le salut des âmes."},
{"t":"p","x":"Amen."}
]},
{id:"187",num:187,title:"Prières pour le Chapitre",theme:"chapitre",sub:null,tags:[],lines:[
{"t":"p","x":"Glorifions le Père qui nous a appelés en son Fils Jésus"},
{"t":"p","x":"à partager la vie missionnaire et disons-lui:"},
{"t":"r","x":". Accorde-nous l'onction de ton Esprit."},
{"t":"p","x":"Nous te remercions, Seigneur, de nous avoir appelés"},
{"t":"p","x":"à une Congrégation missionnaire, et nous te demandons :"},
{"t":"v","x":"que les membres du Chapitre, guidés par lEsprit,"},
{"t":"p","x":"cherchent à promouvoir la fidélité de la Congrégation"},
{"t":"p","x":"à sa mission d’annoncer le Règne de Dieu."},
{"t":"r","x":". Accorde-nous l’onctionde ton Esprit."},
{"t":"p","x":"Appelés à suivre Jésus, l'envoyé du Père,"},
{"t":"v","x":"nous te demandons de nous consacrer par ton Esprit,"},
{"t":"p","x":"afin que nous soyons des témoins courageux"},
{"t":"p","x":"de la Résurrection."},
{"t":"r","x":". Acorde-nous l’onction de ton Esprit."},

/* ---------- utilidades ---------- */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const perTema = id => DADES.filter(p=>p.theme===id);
const idxDe = p => DADES.indexOf(p);
const troba = id => DADES.find(p=>String(p.id)===String(id));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const incipit = p => { const l=p.lines.find(l=>l.t==='p'||l.t==='v'); return l?l.x:''; };

/* ---------- favoritos ---------- */
let favs = new Set(); let favsMem = true;
async function carregaFavs(){
  try{ const r = await window.storage.get('cmf-favoris'); if(r&&r.value){favs=new Set(JSON.parse(r.value)); favsMem=false;} else {favsMem=false;} }
  catch(e){ favsMem=false; /* clave inexistente: ok */ }
}
async function desaFavs(){
  try{ await window.storage.set('cmf-favoris', JSON.stringify([...favs])); }catch(e){}
}
function toggleFav(id){ if(favs.has(id)) favs.delete(id); else favs.add(id); desaFavs(); render(); }

/* ---------- tamaño del texto ---------- */
let mida = 1.28;
function canviaMida(d){ mida = Math.min(2.4, Math.max(.95, mida + d)); document.documentElement.style.setProperty('--fs-preg', mida+'rem'); }

/* ---------- índice lateral ---------- */
function pintaIdx(temaActiu){
  const nav = document.getElementById('idxNav');
  let h = '<div class="idx-titol">Thèmes</div>';
  for(const t of TEMES){
    const n = perTema(t.id).length;
    h += `<a href="#/tema/${t.id}" class="${temaActiu===t.id?'actiu':''}">${esc(t.nom)}<span class="n">${n}</span></a>`;
  }
  if(favs.size) h += `<div class="idx-titol">Préparation</div><a href="#/favorits" class="${temaActiu==='__fav'?'actiu':''}">Mes prières<span class="n">${favs.size}</span></a>`;
  nav.innerHTML = h;
}

/* ---------- búsqueda ---------- */
function cercaHTML(valor){
  return `<div class="cerca-wrap"><span class="cerca-ico">⌕</span>
  <input id="cerca" class="cerca" type="search" value="${esc(valor||'')}" placeholder="Rechercher par numéro, titre ou mots… (ex. «33», «malades», «Cœur de Marie»)" aria-label="Búsqueda de prières" autocomplete="off"></div>`;
}
function lligaCerca(){
  const el = document.getElementById('cerca'); if(!el) return;
  el.addEventListener('input', ()=>{ const q=el.value.trim();
    history.replaceState(null,'', q? '#/cerca/'+encodeURIComponent(q) : '#/');
    pintaResultats(q);
  });
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const q=el.value.trim(); const ex=DADES.find(p=>String(p.num)===q); if(ex) location.hash='#/p/'+ex.id; } });
}
function cercaPreg(q){
  const nq = norm(q); if(!nq) return [];
  const res = DADES.map(p=>{
    let s=0;
    if(String(p.num||'')===q.trim()) s+=100;
    else if(String(p.num||'').startsWith(q.trim()) && /^\d/.test(q)) s+=40;
    if(norm(p.title).includes(nq)) s+=30;
    if(norm(p.sub||'').includes(nq)) s+=14;
    if((p.tags||[]).some(t=>norm(t).includes(nq))) s+=14;
    const cos = norm(p.lines.map(l=>l.x).join(' '));
    if(cos.includes(nq)) s+=8;
    return {p,s};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s).map(r=>r.p);
  return res;
}
function itemHTML(p, mostraTema){
  const t = TEMES.find(t=>t.id===p.theme);
  return `<li class="preg-item"><a href="#/p/${p.id}">
    <span class="foli">${p.num?esc(String(p.num)):'·'}</span>
    <span><span class="tt">${esc(p.title)}${favs.has(String(p.id))?' <span class="fav-cinta">❧</span>':''}</span>
    <span class="inc">${esc(incipit(p))}</span></span>
    ${mostraTema&&t?`<span class="res-tema">${esc(t.nom)}</span>`:(p.sub?`<span class="etq">${esc(p.sub)}</span>`:'')}
  </a></li>`;
}
function pintaResultats(q){
  const cont = document.getElementById('resultats'); if(!cont) return;
  if(!q){ cont.innerHTML = portadaCos(); return; }
  const res = cercaPreg(q);
  cont.innerHTML = res.length
    ? `<div class="res-cap">${res.length} prière${res.length===1?'s trouvée':' trouvées'}</div><ul class="llista">${res.map(p=>itemHTML(p,true)).join('')}</ul>`
    : `<div class="buit">Aucune prière trouvée pour «${esc(q)}».<br>Essayez un numéro, un mot du titre ou du texte.</div>`;
}

/* ---------- vistas ---------- */
function portadaCos(){
  let h = `<div class="portada">
    <div class="eyebrow">Recueil pour la prière communautaire</div>
    <h2>Trouvez la prière pour chaque moment</h2>
    <p class="intro">Chaque prière conserve le numéro et le titre du recueil : celui qui guide la prière peut inviter en disant, par exemple, «prions avec la prière 33, La prière du clarétain».</p>
    <div class="chips">${CIRCUMS.map(c=>`<a class="chip" href="${c.h}">${esc(c.t)}</a>`).join('')}</div>
    <div class="temes-grid">${TEMES.map(t=>`<a class="tema-card" href="#/tema/${t.id}">
      <h3>${esc(t.nom)}</h3><div class="desc">${esc(t.desc)}</div>
      <div class="compta">${perTema(t.id).length} prières</div></a>`).join('')}
    </div></div>`;
  return h;
}
function vistaPortada(q){
  pintaIdx(null);
  document.getElementById('pagina').innerHTML = cercaHTML(q) + `<div id="resultats"></div>`;
  lligaCerca();
  pintaResultats(q||'');
  if(q){ const el=document.getElementById('cerca'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
}
function vistaTema(id){
  const t = TEMES.find(t=>t.id===id); if(!t){ location.hash='#/'; return; }
  pintaIdx(id);
  const pl = perTema(id);
  const subs = [...new Set(pl.map(p=>p.sub).filter(Boolean))];
  let llista='';
  if(subs.length>1){
    for(const s of subs){ llista += `<div class="sub-grup">${esc(s)}</div><ul class="llista">${pl.filter(p=>p.sub===s).map(p=>itemHTML(p)).join('')}</ul>`; }
    const sense = pl.filter(p=>!p.sub);
    if(sense.length) llista = `<ul class="llista">${sense.map(p=>itemHTML(p)).join('')}</ul>` + llista;
  } else {
    llista = `<ul class="llista">${pl.map(p=>itemHTML(p)).join('')}</ul>`;
  }
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/">← Tous les thèmes</a>
    <div class="tema-cap"><h2>${esc(t.nom)}</h2><div class="desc">${esc(t.desc)}</div></div>${llista}`;
  lligaCerca();
  window.scrollTo(0,0);
}
function vistaFavorits(){
  pintaIdx('__fav');
  const pl = DADES.filter(p=>favs.has(String(p.id)));
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/">← Tous les thèmes</a>
    <div class="tema-cap"><h2>Mes prières</h2><div class="desc">Prières marquées pour préparer la prière communautaire.</div></div>` +
   (pl.length?`<ul class="llista">${pl.map(p=>itemHTML(p,true)).join('')}</ul>`
    :`<div class="buit">Vous n\'avez encore marqué aucune prière.<br>Ouvrez-en une et touchez «Marquer» pour la sauvegarder ici.</div>`);
  lligaCerca(); window.scrollTo(0,0);
}
function liniaHTML(l, prev){
  if(l.t==='rub') return `<p class="rub">${esc(l.x)}</p>`;
  if(l.t==='v') return `<p class="vers${prev&&prev.t==='r'?' espai':''}">${esc(l.x)}</p>`;
  if(l.t==='r') return `<p class="resp">${esc(l.x)}</p>`;
  const espai = prev && (prev.t==='r') ? ' espai':'';
  return `<p class="${espai.trim()}">${esc(l.x)}</p>`;
}
function vistaPreg(id){
  const p = troba(id); if(!p){ location.hash='#/'; return; }
  pintaIdx(p.theme);
  const t = TEMES.find(t=>t.id===p.theme);
  const i = idxDe(p), ant = DADES[i-1], seg = DADES[i+1];
  let cos=''; let prev=null;
  for(const l of p.lines){ cos += liniaHTML(l, prev); prev=l; }
  const fav = favs.has(String(p.id));
  document.getElementById('pagina').innerHTML = cercaHTML('') +
   `<a class="torna" href="#/tema/${p.theme}">← ${esc(t?t.nom:'Thèmes')}</a>
    <article class="preg-full">
      <div class="preg-meta">${esc(t?t.nom:'')}${p.sub?' · '+esc(p.sub):''}</div>
      ${p.num?`<div class="preg-num">${esc(String(p.num))}</div>`:''}
      <h2 class="preg-titol">${esc(p.title)}</h2>
      <div class="preg-eines">
        <button class="eina surt-lectura" id="btnLectura">📖 Modo prière</button>
        <button class="eina ${fav?'fav-actiu':''}" id="btnFav">${fav?'❧ Marquée':'❧ Marquer'}</button>
        <button class="eina" id="btnCopia">Copier le texte</button>
        <button class="eina" onclick="window.print()">Imprimer</button>
        <span class="mida-grup"><button class="eina mida" id="btnMenys" aria-label="Texte plus petit">A−</button><button class="eina mida" id="btnMes" aria-label="Texte plus grand">A+</button></span>
      </div>
      <div class="preg-cos" id="cosPreg">${cos}</div>
    </article>
    <nav class="nav-pn">
      ${ant?`<a href="#/p/${ant.id}"><span class="pn-l">← Précédente</span><span class="pn-t">${ant.num?ant.num+'. ':''}${esc(ant.title)}</span></a>`:'<span></span>'}
      ${seg?`<a class="seg" href="#/p/${seg.id}"><span class="pn-l">Suivante →</span><span class="pn-t">${seg.num?seg.num+'. ':''}${esc(seg.title)}</span></a>`:''}
    </nav>`;
  lligaCerca();
  document.getElementById('btnFav').onclick = ()=>toggleFav(String(p.id));
  document.getElementById('btnMes').onclick = ()=>canviaMida(.12);
  document.getElementById('btnMenys').onclick = ()=>canviaMida(-.12);
  document.getElementById('btnCopia').onclick = e=>{
    const txt = (p.num?p.num+'. ':'')+p.title+'\n\n'+p.lines.map(l=>{
      if(l.t==='v')return 'V/. '+l.x; if(l.t==='r')return 'R/. '+l.x; return l.x;}).join('\n');
    navigator.clipboard.writeText(txt).then(()=>{e.target.textContent='Copié ✓'; setTimeout(()=>e.target.textContent='Copier le texte',1600);}).catch(()=>{});
  };
  const bl = document.getElementById('btnLectura');
  bl.onclick = ()=>{
    document.body.classList.toggle('lectura');
    const on = document.body.classList.contains('lectura');
    bl.textContent = on ? '✕ Salir del modo prière' : '📖 Modo prière';
    if(on && mida<1.6){ mida=1.6; document.documentElement.style.setProperty('--fs-preg',mida+'rem'); }
    window.scrollTo(0,0);
  };
  window.scrollTo(0,0);
}

/* ---------- router ---------- */
function render(){
  document.body.classList.remove('lectura');
  const h = location.hash || '#/';
  const m1 = h.match(/^#\/tema\/(.+)$/);
  const m2 = h.match(/^#\/p\/(.+)$/);
  const m3 = h.match(/^#\/cerca\/(.+)$/);
  if(m1) vistaTema(decodeURIComponent(m1[1]));
  else if(m2) vistaPreg(decodeURIComponent(m2[1]));
  else if(m3) vistaPortada(decodeURIComponent(m3[1]));
  else if(h==='#/favorits') vistaFavorits();
  else vistaPortada('');
}
window.addEventListener('hashchange', render);
document.getElementById('toggleIdx').addEventListener('click', function(){
  const sp = document.querySelector('.spine'); sp.classList.toggle('open');
  this.setAttribute('aria-expanded', sp.classList.contains('open'));
  this.textContent = sp.classList.contains('open') ? 'Masquer l\'index' : 'Index des thèmes';
});
document.querySelector('.idx').addEventListener('click', ()=>{ if(innerWidth<=900){ document.querySelector('.spine').classList.remove('open'); }});

carregaFavs().then(render);
render();

</script>
</body>
</html>
