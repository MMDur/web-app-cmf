<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prières Clarétiennes · CMF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --granat:#6E1423; --granat-fosc:#520E1A; --granat-clar:#8C2333;
  --or:#A87B2D; --or-clar:#C9A45C;
  --paper:#FAF6ED; --paper-2:#F3EDDF; --paper-3:#ECE4D2;
  --tinta:#26211A; --tinta-2:#5A5246; --tinta-3:#8A8070;
  --linia:#DDD3BE;
  --fs-preg:1.28rem;
  --serif:'EB Garamond',Georgia,serif;
  --display:'Cormorant Garamond',Georgia,serif;
  --ui:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--tinta);font-family:var(--serif);min-height:100vh}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
a{color:inherit}

/* ============ LAYOUT ============ */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}

/* ============ SIDEBAR (llom del llibre) ============ */
.spine{background:linear-gradient(175deg,var(--granat) 0%,var(--granat-fosc) 100%);color:#F5E9D7;padding:2rem 1.5rem 2.5rem;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--granat-clar) transparent}
.spine::after{content:'';position:fixed;left:296px;top:0;bottom:0;width:4px;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent);pointer-events:none}
@media(max-width:900px){
  .spine{position:relative;height:auto;padding:1.4rem 1.2rem 1.2rem}
  .spine::after{display:none}
  .spine .idx{display:none}
  .spine.open .idx{display:block}
}
.marca{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.35rem}
.marca .creu{font-family:var(--display);font-size:1.5rem;color:var(--or-clar)}
.marca h1{font-family:var(--display);font-weight:600;font-size:1.62rem;line-height:1.1;letter-spacing:.01em}
.marca h1 a{text-decoration:none}
.sub-marca{font-family:var(--ui);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--or-clar);margin-bottom:1.6rem}
.idx-titol{font-family:var(--ui);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,233,215,.55);margin:1.5rem 0 .55rem;padding-bottom:.4rem;border-bottom:1px solid rgba(245,233,215,.18)}
.idx a{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;text-decoration:none;padding:.34rem .5rem;margin:0 -.5rem;border-radius:4px;font-size:1.02rem;line-height:1.25;transition:background .15s}
.idx a:hover,.idx a:focus-visible{background:rgba(255,255,255,.09);outline:none}
.idx a.actiu{background:rgba(255,255,255,.13)}
.idx a .n{font-family:var(--ui);font-size:.66rem;color:var(--or-clar);letter-spacing:.05em;flex-shrink:0}
.toggle-idx{display:none;font-family:var(--ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--or-clar);border:1px solid rgba(201,164,92,.5);border-radius:20px;padding:.42rem 1rem;margin-top:.8rem}
@media(max-width:900px){.toggle-idx{display:inline-block}}

/* ============ PÀGINA ============ */
.pagina{padding:2.6rem clamp(1.2rem,5vw,4.5rem) 5rem;max-width:880px;width:100%;margin:0 auto}
@media(max-width:900px){.pagina{padding-top:1.6rem}}

/* cerca */
.cerca-wrap{position:relative;margin-bottom:1.8rem}
.cerca{width:100%;font-family:var(--serif);font-size:1.12rem;padding:.85rem 1.1rem .85rem 2.9rem;border:1px solid var(--linia);border-radius:8px;background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(60,45,20,.06)}
.cerca:focus{outline:2px solid var(--granat);outline-offset:-1px}
.cerca::placeholder{color:var(--tinta-3);font-style:italic}
.cerca-ico{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--tinta-3);pointer-events:none}

/* portada */
.eyebrow{font-family:var(--ui);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--granat);margin-bottom:.5rem}
.portada h2{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,3.4vw,2.3rem);line-height:1.12;margin-bottom:.7rem}
.portada p.intro{font-size:1.12rem;color:var(--tinta-2);max-width:56ch;line-height:1.55;margin-bottom:2rem}

.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.4rem}
.chip{font-family:var(--ui);font-size:.78rem;font-weight:500;padding:.42rem .95rem;border:1px solid var(--linia);border-radius:100px;background:#fff;color:var(--tinta-2);transition:all .15s;text-decoration:none;display:inline-block}
.chip:hover,.chip:focus-visible{border-color:var(--granat);color:var(--granat);outline:none}

.temes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:.9rem}
.tema-card{position:relative;background:#fff;border:1px solid var(--linia);border-radius:8px;padding:1.2rem 1.15rem 1.05rem;text-align:left;text-decoration:none;transition:border-color .15s, box-shadow .15s;overflow:hidden;display:block}
.tema-card:hover,.tema-card:focus-visible{border-color:var(--granat);box-shadow:0 3px 12px rgba(110,20,35,.09);outline:none}
.tema-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--granat)}
.tema-card h3{font-family:var(--display);font-weight:600;font-size:1.28rem;line-height:1.15;margin-bottom:.3rem}
.tema-card .desc{font-size:.95rem;font-style:italic;color:var(--tinta-2);line-height:1.35;margin-bottom:.55rem}
.tema-card .compta{font-family:var(--ui);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--or)}

/* llista de pregàries */
.torna{font-family:var(--ui);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--granat);text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;margin-bottom:1.4rem}
.torna:hover{text-decoration:underline}
.tema-cap h2{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:.35rem}
.tema-cap .desc{font-size:1.08rem;font-style:italic;color:var(--tinta-2);margin-bottom:1.7rem;max-width:60ch;line-height:1.5}
.sub-grup{font-family:var(--ui);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--granat);margin:1.8rem 0 .6rem;display:flex;align-items:center;gap:.8rem}
.sub-grup::after{content:'';flex:1;height:1px;background:var(--linia)}
.llista{list-style:none}
.preg-item{border-bottom:1px solid var(--linia)}
.preg-item a{display:flex;gap:1rem;align-items:baseline;padding:.85rem .4rem;text-decoration:none;transition:background .12s}
.preg-item a:hover,.preg-item a:focus-visible{background:rgba(110,20,35,.045);outline:none}
.foli{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--granat);min-width:2.6rem;text-align:right;flex-shrink:0;font-variant-numeric:oldstyle-nums}
.preg-item .tt{font-size:1.16rem;line-height:1.3}
.preg-item .inc{display:block;font-size:.92rem;font-style:italic;color:var(--tinta-3);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58ch}
.preg-item .etq{font-family:var(--ui);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin-left:auto;flex-shrink:0}
.buit{padding:2.5rem 0;text-align:center;color:var(--tinta-3);font-style:italic;font-size:1.08rem}

/* resultat de cerca */
.res-cap{font-family:var(--ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3);margin-bottom:.8rem}
.res-tema{font-family:var(--ui);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin-left:auto;flex-shrink:0}

/* ============ PREGÀRIA ============ */
.preg-full{background:#fff;border:1px solid var(--linia);border-radius:10px;padding:clamp(1.6rem,4vw,3.2rem) clamp(1.3rem,4.5vw,3.6rem) clamp(2rem,4vw,3rem);box-shadow:0 2px 14px rgba(60,45,20,.07);position:relative}
.preg-full::before{content:'';position:absolute;top:-1px;left:clamp(1.3rem,4.5vw,3.6rem);width:26px;height:44px;background:var(--granat);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.preg-meta{font-family:var(--ui);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--or);margin-bottom:.9rem;padding-left:3.2rem}
.preg-num{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--granat);float:left;margin:-.3rem 1rem .2rem 0;font-variant-numeric:oldstyle-nums}
.preg-titol{font-family:var(--display);font-weight:600;font-size:clamp(1.55rem,3vw,2.05rem);line-height:1.15;margin-bottom:1.4rem}
.preg-cos{clear:both;font-size:var(--fs-preg);line-height:1.62;border-top:1px solid var(--linia);padding-top:1.5rem}
.preg-cos p{margin-bottom:.16em}
.preg-cos p.espai{margin-top:.9em}
.preg-cos .rub{font-family:var(--ui);font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--or);margin:1.1em 0 .5em;font-style:normal}
.preg-cos .vers{position:relative;padding-left:1.9em}
.preg-cos .vers::before{content:'V/.';position:absolute;left:0;font-style:italic;color:var(--tinta-3);font-size:.85em;top:.15em}
.preg-cos .resp{position:relative;padding-left:1.9em;color:var(--granat);font-style:italic;font-weight:500;margin-bottom:.45em}
.preg-cos .resp::before{content:'R/.';position:absolute;left:0;color:var(--granat);font-size:.85em;font-style:italic;top:.15em}
.preg-eines{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.3rem 0 1.6rem;align-items:center}
.eina{font-family:var(--ui);font-size:.76rem;font-weight:500;padding:.48rem .95rem;border:1px solid var(--linia);border-radius:6px;background:#fff;color:var(--tinta-2);display:inline-flex;align-items:center;gap:.45rem;transition:all .15s}
.eina:hover,.eina:focus-visible{border-color:var(--granat);color:var(--granat);outline:none}
.eina.fav-actiu{background:var(--granat);border-color:var(--granat);color:#F5E9D7}
.mida-grup{display:inline-flex;border:1px solid var(--linia);border-radius:6px;overflow:hidden;margin-left:auto}
.mida-grup .eina{border:none;border-radius:0;padding:.48rem .8rem}
.mida-grup .eina+.eina{border-left:1px solid var(--linia)}
.nav-pn{display:flex;justify-content:space-between;gap:1rem;margin-top:1.6rem}
.nav-pn a{font-family:var(--ui);font-size:.78rem;color:var(--tinta-2);text-decoration:none;display:flex;flex-direction:column;gap:.15rem;max-width:46%}
.nav-pn a:hover .pn-t{color:var(--granat)}
.nav-pn .pn-l{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-3)}
.nav-pn .pn-t{font-family:var(--serif);font-size:1.02rem;line-height:1.25;transition:color .15s}
.nav-pn a.seg{text-align:right;margin-left:auto}

/* mode lectura */
body.lectura .spine,body.lectura .cerca-wrap,body.lectura .torna,body.lectura .preg-eines .eina:not(.surt-lectura):not(.mida),body.lectura .nav-pn,body.lectura .preg-meta{display:none}
body.lectura .shell{grid-template-columns:1fr}
body.lectura .pagina{max-width:820px;padding-top:2.2rem}
body.lectura .preg-full{border:none;box-shadow:none;background:var(--paper)}
body.lectura .preg-full::before{display:none}
body.lectura{--fs-preg:1.6rem}
body.lectura .preg-eines{position:sticky;top:0;background:var(--paper);padding:.6rem 0;z-index:5;margin-top:0}

/* favorits ribbon on list */
.fav-cinta{color:var(--granat);flex-shrink:0;font-size:.85rem}

@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{
  .spine,.cerca-wrap,.torna,.preg-eines,.nav-pn,.toggle-idx{display:none!important}
  .shell{display:block}
  body{background:#fff}
  .preg-full{border:none;box-shadow:none;padding:0}
  .preg-full::before{display:none}
  .pagina{padding:0;max-width:none}
}

</style>
</head>
<body>
<div class="shell">
  <aside class="spine">
    <div class="marca"><span class="creu">✠</span><h1><a href="#/">Prières Clarétiennes</a></h1></div>
    <div class="sub-marca">Missionnaires Fils du Cœur Immaculé de Marie</div>
    <button class="toggle-idx" id="toggleIdx" aria-expanded="false">Index des thèmes</button>
    <nav class="idx" id="idxNav" aria-label="Index des thèmes"></nav>
  </aside>
  <main class="pagina" id="pagina"></main>
</div>
<script>
const DADES = [
{id:"1",num:1,title:"Prière apostolique",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Mon Seigneur et mon Père,"},
{"t":"p","x":"fais que je te connaisse et te fasse connaître,"},
{"t":"p","x":"que je t'aime et te fasse aimer,"},
{"t":"p","x":"que je te serve et te fasse servir,"},
{"t":"p","x":"que je te loue et que je fasse"},
{"t":"p","x":"que toutes les créatures te louent."},
{"t":"p","x":"*(Saint Antoine-Marie Claret)*"}
]},
{id:"2",num:2,title:"La Providence de Dieu",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Béni soistu, Seigneur, pour ta providence  et pour le soin"},
{"t":"p","x":"que tu as pris  de moi toujours et partout. Amen."}
]},
{id:"3",num:3,title:"Aimer et servir Dieu",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Béni soistu, Seigneur, pour ton amour et ta miséricorde."},
{"t":"p","x":"Fais que je t'aime et te serve, et que je te fasse"},
{"t":"p","x":"aimer et servir de toutes les créatures. Amen."}
]},
{id:"4",num:4,title:"Demande du don de l'amour",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Feu toujours brûlant sans jamais s’éteindre,"},
{"t":"p","x":"amour toujours ardent sans jamais s'attiédir,"},
{"t":"p","x":"embrasemoi afin que je t'aime."},
{"t":"p","x":"Je t'aime, Jésus, de tout mon cœur,"},
{"t":"p","x":"de toute mon âme, de toutes mes forces."},
{"t":"p","x":"Je voudrais t'aimer davantage et que tous t'aiment."},
{"t":"p","x":"Je voudrais t'aimer pour moimême et pour toutes les créatures."},
{"t":"p","x":"Très Sainte Vierge, accorde-moi la grâce que tous soient sauvés"},
{"t":"p","x":"et que  personne soit  damné. Amen."}
]},
{id:"5",num:5,title:"Union à Dieu",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, comme l'eau s'unit au vin dans l'eucharistie,"},
{"t":"p","x":"c'est ainsi que je désire m'unir à toi"},
{"t":"p","x":"et m'offrir avec toi à la très sainte Trinité. Amen"}
]},
{id:"6",num:6,title:"Dieu le Père, vie, amour et espérance",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, tu es mon amour, mon honneur,"},
{"t":"p","x":"mon espérance, mon refuge."},
{"t":"p","x":"Tu es ma vie, ma gloire, ma fin,"},
{"t":"p","x":"mon maître, mon père, mon amour. Amen."}
]},
{id:"7",num:7,title:"Dieu Providence et sauveur",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Merci, Seigneur, pour ta bonté,"},
{"t":"p","x":"car tu te sers de tous les moyens pour convertir les pécheurs."},
{"t":"p","x":"Bénie soit ta providence, qui veille toujours sur moi."},
{"t":"p","x":"Je chanterai ta miséricorde  maintenant et toujours. Amen"}
]},
{id:"8",num:8,title:"Dieu seul",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, tu es mon amour, mon honneur,"},
{"t":"p","x":"mon espérance et mon refuge."},
{"t":"p","x":"Tu es ma gloire et ma fin. Mon Maître, mon Père."},
{"t":"p","x":"Aidemoi à ne chercher rien d’autre que toi,"},
{"t":"p","x":"à rien connaître si ce n'est ta volonté pour l'accomplir."},
{"t":"p","x":"Je ne désire que toi et, en toi  et pour toi, je désire tout le reste."},
{"t":"p","x":"Tu es pour moi largement suffisant. Fais que je t'aime"},
{"t":"p","x":"comme tu m'aimes et comme tu veux que je t'aime. Amen."}
]},
{id:"9",num:9,title:"Tout pour la gloire de Dieu",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Je veux t'aimer, mon Dieu, de tout mon cœur,"},
{"t":"p","x":"de tout mon être, de toutes mes forces :"},
{"t":"p","x":"je te consacre toutes mes pensées, tous mes désirs,"},
{"t":"p","x":"toutes mes paroles et mes actions,"},
{"t":"p","x":"tout ce que j’ai et tout ce que je pourrais avoir."},
{"t":"p","x":"Fais que j'emploie tout ce que je possède à ton  honneur"},
{"t":"p","x":"et ta plus grande gloire selon ta volonté. Amen."}
]},
{id:"10",num:10,title:"Pour demander l'Esprit",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Je te supplie, Seigneur, de m'envoyer ton Esprit,"},
{"t":"p","x":"pour qu’il soit ma force et  ma lumière"},
{"t":"p","x":"et qu’il m'embrase en ton amour,"},
{"t":"p","x":"qu’il me dirige par le chemin de Jésus Christ"},
{"t":"p","x":"et de la Vierge Marie, la Mère de Dieu et ma mère. Amen."}
]},
{id:"11",num:11,title:"Pour demander les vertus",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Je crois, Seigneur, fais que je croie plus fermement."},
{"t":"p","x":"J'espère, Seigneur, que mon espérance soit plus sûre."},
{"t":"p","x":"J'aime, Seigneur, que mon amour soit plus ardent."},
{"t":"p","x":"Je regrette de t’avoir offensé; augmente mon regret."},
{"t":"p","x":"Seigneur, que veuxtu que je fasse?"},
{"t":"p","x":"Enseignemoi à accomplir ta volonté, car tu es mon Dieu."},
{"t":"p","x":"Accordemoi un cœur sage pour juger ton peuple,"},
{"t":"p","x":"pour discerner entre le bien et le mal."},
{"t":"p","x":"Père, accorde-moi l'humilité, la douceur,"},
{"t":"p","x":"la chasteté, la patience et la charité."},
{"t":"p","x":"Père, enseignemoi la bonté, la science et la discipline."},
{"t":"p","x":"Père, donnemoi ton amour avec ta grâce."},
{"t":"p","x":"Ce sera mon plus grand trésor."},
{"t":"p","x":"Mon Dieu, mon Jésus et mon tout."},
{"t":"p","x":"Je vis sur la croix et sur la croix je veux mourir,"},
{"t":"p","x":"et j'espère descendre de   la croix,"},
{"t":"p","x":"après avoir consommé mon sacrifice,"},
{"t":"p","x":"non pas par mes mains, mais par celles des autres."},
{"t":"p","x":"Fais que je ne me glorifie que dans la croix de Jésus Christ,"},
{"t":"p","x":"par qui le monde est crucifié pour moi et moi, pour le monde."},
{"t":"p","x":"Amen."}
]},
{id:"12",num:12,title:"Exercice de l'amour de Dieu",theme:"dieu-pere",sub:null,tags:[],lines:[
{"t":"p","x":"Mon Dieu, tu es l’Éternel. Loué sois-tu!"},
{"t":"p","x":"Mon Dieu, tu es infiniment puissant. Loué sois-tu!"},
{"t":"p","x":"Ta sagesse et ta bonté sont infinies. Loué sois-tu!"},
{"t":"p","x":"Ta miséricorde est inépuisable. Loué sois-tu!"},
{"t":"p","x":"Ton amour est un feu inextinguible. Loué sois-tu|"},
{"t":"p","x":"Tu es créateur du monde. Loué sois-tu!"},
{"t":"p","x":"Tu es le père de tous les hommes. Loué sois-tu!"},
{"t":"p","x":"Pour nous sauver, tu nous as envoyé ton Fils. Loué sois-tu!"},
{"t":"p","x":"Dieu-Trinité : Père, Fils et Saint-Esprit :"},
{"t":"p","x":"trois Personnes et un seul Dieu. Loué sois-tu!"},
{"t":"p","x":"Avec le Cœur Immaculé de Marie,  nous t’aimons, Seigneur!"},
{"t":"p","x":"Avec tous les Anges et les Saints, nous t’adorons, Seigneur!."},
{"t":"p","x":"Avec tout le ciel et toute la terre, nous t’acclamons, Seigneur!"},
{"t":"p","x":"Jésus-sauveur, chemin, vérité et vie,"},
{"t":"p","x":"enseigne-nous à aimer ton Père et notre Père,"},
{"t":"p","x":"et à être, comme  tes Apôtres, des messagers de ton amour,"},
{"t":"p","x":"afin que tous les hommes  connaissent  ton Père,"},
{"t":"p","x":"l’aiment et le glorifient pour les siècle des siècles. Amen"},
{"t":"p","x":"Prières au Cœur de Marie"},
{"t":"p","x":"Du Père Fondateur"}
]},
{id:"13",num:13,title:"Litanie clarétaine d'invocations à Marie",theme:"coeur-marie",sub:"du Père Fondateur",tags:[],lines:[

{id:"14",num:14,title:"Supplication à Marie",theme:"coeur-marie",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Vierge et Mère de Dieu, tourne tes yeux miséricordieux"},
{"t":"p","x":"vers nous qui restons en cette vallée de larmes"},
{"t":"p","x":"et mettons notre confiance en toi, car nous sommes tes enfnts."},
{"t":"p","x":"Aidenous à annoncer la Bonne Nouvelle du Royaume"},
{"t":"p","x":"avec fidélité et assurance, car ils sont nombreux ceux"},
{"t":"p","x":"qui s'y opposent, à cause de l'ambition du pouvoir"},
{"t":"p","x":"et de la recherche effrénée des richesses ou des plaisirs."},
{"t":"p","x":"Aide-nous à coopérer à ton rôle maternel"},
{"t":"p","x":"par notre  mission apostolique. Amen."}
]},
{id:"15",num:15,title:"Invocations à Marie",theme:"coeur-marie",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Je te salue, Marie Immaculée, Fille de Dieu, le Père."},
{"t":"p","x":"Je te salue, Marie Immaculée, Mère du Fils de Dieu."},
{"t":"p","x":"Je te salue, Marie Immaculée, Temple de l’Esprit Saint."},
{"t":"p","x":"Je te salue Marie, mère et avocate des pécheurs."},
{"t":"p","x":"Tu es bénie entre toutes les femmes."},
{"t":"p","x":"Tu es la gloire de Jérusalem,"},
{"t":"p","x":"la joie d'Israël et l'honneur de notre peuple."},
{"t":"p","x":"Tu es le refuge des abandonnés, le nord des matelots."},
{"t":"p","x":"Tu es la santé des malades."},
{"t":"p","x":"Tu es le souffle des mourants et la porte du ciel."},
{"t":"p","x":"Tu es, après Jésus Christ, le fruit béni de tes entrailles,"},
{"t":"p","x":"toute notre espérance."},
{"t":"p","x":"O Clémente, ô pieuse, ô douce Vierge Marie."}
]},
{id:"16",num:16,title:"Mère du Divin amour",theme:"coeur-marie",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"O Marie, ma Mère, Mère du Divin amour!"},
{"t":"p","x":"Je ne peux rien demander qui te soit plus agréable"},
{"t":"p","x":"et plus facile d'accorder que l'amour divin."},
{"t":"p","x":"Accordele-moi, ma Mère ! Ma Mère, amour!"},
{"t":"p","x":"Ma Mère, j'ai faim et soif d'amour."},
{"t":"p","x":"Viens à mon secours, rassasiemoi."},
{"t":"p","x":"O Cœur de Marie, forge et instrument de l'amour,"},
{"t":"p","x":"embrasemoi d'amour pour Dieu et pour mon prochain!"},
{"t":"p","x":"Amen."}
]},
{id:"17",num:17,title:"Fils et serviteur de Marie",theme:"coeur-marie",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"O Vierge et Mère de Dieu!"},
{"t":"p","x":"tu sais bien que nous sommes tes fils et tes serviteurs,"},
{"t":"p","x":"ceux que tu as formés"},
{"t":"p","x":"dans la forge de ta miséricorde et de ton amour."},
{"t":"p","x":"Nous sommes comme un javelot dans ta main puissante ;"},
{"t":"p","x":"lancenous, ô notre Mère,"},
{"t":"p","x":"contre tous  ceux qui s'opposent au Royaume de Dieu."},
{"t":"p","x":"Forts de ta protection,"},
{"t":"p","x":"nous annoncerons l'Évangile"},
{"t":"p","x":"sans autres armes que la Parole divine,"},
{"t":"p","x":"sans autres titres que ceux d'être fils de ton Cœur."},
{"t":"p","x":"A toi, ô notre Mère, la victoire. Amen."},
{"t":"p","x":"b) De la Congrégation"},
{"t":"p","x":"b) De la Congrégation"}
]},
{id:"18",num:18,title:"Configuration au Christ",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Notre Seigneur et notre Dieu,"},
{"t":"p","x":"toi qui as choisi Marie toujours Vierge"},
{"t":"p","x":"comme Mère de ton Fils et notre Mère,"},
{"t":"p","x":"fais que, par notre donation fidèle à son Cœur maternel,"},
{"t":"p","x":"nous nous configurions pleinement au Christ"},
{"t":"p","x":"et que nous coopérions à son rôle maternel"},
{"t":"p","x":"par la mission apostolique."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"19",num:19,title:"Litanies de la Vierge Marie,",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"inspirées des les Constitutions."},
{"t":"p","x":"O Marie, les Fils de ton Cœur Immaculé,"},
{"t":"p","x":"nous te proclamons «bienheureuse»"},
{"t":"p","x":"pour ta foi obéissante et ton ardente charité,"},
{"t":"p","x":"et nous t'invoquons:"},
{"t":"p","x":"Mère de Dieu et notre mère."},
{"t":"r","x":": Bénie soistu entre toutes les femmes."},
{"t":"p","x":"Mère de Jésus Christ, l’envoyé du Père."},
{"t":"p","x":"Mère du Verbe, fait homme par l’oeuvre de l'Esprit."},
{"t":"p","x":"Mère du Fils, oint pour évangéliser les pauvres."},
{"t":"p","x":"Fondatrice, patronne et titulaire de notre Congrégation."},
{"t":"p","x":"Première disciple du Christ."},
{"t":"p","x":"Notre modèle dans la suite de Jésus."},
{"t":"p","x":"Servante totalement consacrée à la personne"},
{"t":"p","x":"et à l’œuvre de ton Fils."},
{"t":"p","x":"Mère et Maîtresse de Missionnaires."},
{"t":"p","x":"Formatrice d'Apôtres."},
{"t":"p","x":"Prions : Dieu notre Père, nous te rendons grâce"},
{"t":"p","x":"parce que nous nous appelons et que nous sommes"},
{"t":"p","x":"Fils du Cœur Immaculé de Marie ;"},
{"t":"p","x":"fais que nous vénérions avec amour  notre Mère"},
{"t":"p","x":"et que nous nous donnions à elle,"},
{"t":"p","x":"afin qu'elle nous configure au Christ"},
{"t":"p","x":"et que nous coopérions à son rôle maternel"},
{"t":"p","x":"dans la mission apostolique qu'Il nous a confiée."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"20",num:20,title:"Prière filiale et apostolique au Cœur de Marie",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"O Vierge et Mère de Dieu !"},
{"t":"p","x":"Je m’offre à toi comme ton fils."},
{"t":"p","x":"Je me consacre à ton amour maternel,"},
{"t":"p","x":"afin que tu formes en moi Jésus,"},
{"t":"p","x":"le Fils et l'envoyé du Père,"},
{"t":"p","x":"l'Oint par l'Esprit Saint pour annoncer"},
{"t":"p","x":"la Bonne Nouvelle aux pauvres."},
{"t":"p","x":"Enseignemoi à garder, comme toi,"},
{"t":"p","x":"la Parole dans mon cœur, jusqu'à me transformer"},
{"t":"p","x":"en Évangile de Dieu. Convertis-moi"},
{"t":"p","x":"en instrument docile de ton amour maternel"},
{"t":"p","x":"Obtiens-moi la force de l'Esprit,"},
{"t":"p","x":"afin que je devienne un courageux témoin du Christ."},
{"t":"p","x":"Remplismoi de ton amour maternel,"},
{"t":"p","x":"afin que je  révèle le Père aux hommes,"},
{"t":"p","x":"de sorte qu’ils sentent la joie d'être les fils de Dieu"},
{"t":"p","x":"en communion fraternelle dans l'Église."},
{"t":"p","x":"Mère, voici ton fils. Formemoi."},
{"t":"p","x":"Mère voici ton fils. Envoiemoi."},
{"t":"p","x":"Mère, voici ton fils. Parle par moi. Aime par moi."},
{"t":"p","x":"Veille sur moi, afin qu'ayant annoncé à d'autres l'Évangile,"},
{"t":"p","x":"je ne sois pas  exclu du Royaume."},
{"t":"p","x":"J'ai mis en toi, ô ma Mère, toute ma confiance."},
{"t":"p","x":"Je ne serai jamais confondu. Amen."}
]},
{id:"21",num:21,title:"Litanies au Cœur de Marie",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Seigneur, prends pitié,Seigneur, prends pitié."},
{"t":"p","x":"O Christ, prends pitié,ô Christ, prends pitié."},
{"t":"p","x":"Seigneur, prends pitié,Seigneur, prends pitié."},
{"t":"p","x":"O Christ, écoutenous,ô Christ, écoutenous."},
{"t":"p","x":"O Christ, exaucenous,ô Christ, exaucenous."},
{"t":"p","x":"Dieu, le Père des cieux,    aie pitié de nous."},
{"t":"p","x":"Dieu, le Fils, rédempteur du monde,"},
{"t":"p","x":"Dieu, Esprit Saint, sanctificateur,"},
{"t":"p","x":"Trinité Sainte, un seul Dieu,"},
{"t":"p","x":"Cœur de Marie, formé par le Père,      prie pour nous."},
{"t":"p","x":"Cœur de Marie, le plus semblable au Cœur de Jésus,"},
{"t":"p","x":"Cœur de Marie, orné de tous les dons de l'Esprit Saint,"},
{"t":"p","x":"Cœur de Marie, qui aimes le Père d'un amour filial,"},
{"t":"p","x":"Cœur de Marie, qui aimes le Fils d'un amour maternel,"},
{"t":"p","x":"Cœur de Marie, qui aimes l'Esprit-Saint"},
{"t":"p","x":"d'un amour d'épouse,"},
{"t":"p","x":"Cœur de Marie, qui conserves fidèlement"},
{"t":"p","x":"les paroles et les actions de Jésus,"},
{"t":"p","x":"Cœur de Marie, transpercé par le glaive de la douleur,"},
{"t":"p","x":"Cœur de Marie, cloué à la croix avec le Christ crucifié,"},
{"t":"p","x":"Cœur de Marie, vivifié par la joie"},
{"t":"p","x":"de la résurrection de Jésus,"},
{"t":"p","x":"Cœur  de Marie, comblé d'une nouvelle plénitude de grâce"},
{"t":"p","x":"à la venue du Saint Esprit,"},
{"t":"p","x":"Cœur de Marie, demeure de Dieu, pleine de sa gloire,"},
{"t":"p","x":"Cœur de Marie, arche de l'alliance"},
{"t":"p","x":"de Dieu avec les hommes,"},
{"t":"p","x":"Cœur de Marie, giron de Dieu et des hommes,"},
{"t":"p","x":"Cœur de Marie, qui as apporté le salut au monde,"},
{"t":"p","x":"Cœur de Marie, toujours immaculé,"},
{"t":"p","x":"Cœur de Marie, plein de grâce,"},
{"t":"p","x":"Cœur de Marie, béni parmi tous les cœurs,"},
{"t":"p","x":"Cœur de Marie, abîme d'humilité,"},
{"t":"p","x":"Cœur de Marie, trône de la miséricorde,"},
{"t":"p","x":"Cœur de Marie, forge de l'amour divin,"},
{"t":"p","x":"Cœur de Marie, qui obtient la grâce à tous les pécheurs,"},
{"t":"p","x":"Cœur de Marie, rocher invincible de foi,"},
{"t":"p","x":"Cœur de Marie, source de l'amitié parfaite,"},
{"t":"p","x":"Cœur de Marie, appui de l'Église"},
{"t":"p","x":"en sa marche vers le Père,"},
{"t":"p","x":"Cœur de Marie, forge d'amour qui nous configure à Jésus,"},
{"t":"p","x":"Cœur de Marie, notre Mère et notre formatrice,"},
{"t":"p","x":"Cœur de Marie, consolation des affligés,"},
{"t":"p","x":"Cœur de Marie, refuge des pécheurs,"},
{"t":"p","x":"Cœur de Marie, secours des agonisants,"},
{"t":"p","x":"Cœur de Marie, espérance du monde,"},
{"t":"p","x":"Cœur de Marie, dame de nos cœurs,"},
{"t":"p","x":"Cœur de Marie, reine de la paix,"},
{"t":"p","x":"Agneau de Dieu qui enlèves le péché du monde,"},
{"t":"p","x":"pardonnenous, Seigneur"},
{"t":"p","x":"Agneau de Dieu qui enlèves le péché du monde ,"},
{"t":"p","x":"écoutenous, Seigneur"},
{"t":"p","x":"Agneau de Dieu qui enlèves le péché du monde,"},
{"t":"p","x":"prends pitié de nous"},
{"t":"v","x":": Prie pour nous, Sainte Mère de Dieu,"},
{"t":"r","x":": Afin que nous soyons dignes d'obtenir"},
{"t":"p","x":"les promesses de Jésus Christ."},
{"t":"p","x":"Prions :"},
{"t":"p","x":"Seigneur, toi qui as fait du Cœur Immaculé de Marie"},
{"t":"p","x":"une demeure pour ton Fils et un sanctuaire de l'Esprit-Saint,"},
{"t":"p","x":"donnenous un cœur pur et docile, afin que,"},
{"t":"p","x":"toujours soumis à ta volonté, nous t'aimions par dessus tout"},
{"t":"p","x":"et que nous aidions nos frères dans leurs besoins."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"22",num:22,title:"Action de grâce pour le Cœur de Marie",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Nous te rendons grâce, Père saint,"},
{"t":"p","x":"parce que tu as donné à la Vierge un cœur sage et docile,"},
{"t":"p","x":"toujours prêt à te rendre grâce,"},
{"t":"p","x":"un cœur humble et neuf,"},
{"t":"p","x":"pour y graver la loi de la Nouvelle Alliance,"},
{"t":"p","x":"un cœur simple et pur, qui l'a rendue digne"},
{"t":"p","x":"de concevoir virginalement ton Fils"},
{"t":"p","x":"et  de le contempler éternellement;"},
{"t":"p","x":"un cœur ferme et disposé à supporter avec courage"},
{"t":"p","x":"le glaive de la douleur tout en  attendant, dans la foi,"},
{"t":"p","x":"la résurrection de ton Fils."},
{"t":"p","x":"Donnenous un cœur sage, neuf et humble, simple et pur,"},
{"t":"p","x":"ferme et toujours docile, afin que nous l’imitions"},
{"t":"p","x":"et que nous coopérions fidèlement à ton oeuvre de salut."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"23",num:23,title:"Offrande au Cœur de Marie",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Mère du Seigneur, Cœur de Marie !"},
{"t":"p","x":"Toi qui as présidé à la fondation de notre Congrégation,"},
{"t":"p","x":"sois toujours  le cœur de notre Congrégation."},
{"t":"p","x":"Elle a besoin de  grands rêves missionnaires"},
{"t":"p","x":"en ce monde, si aimé du Père"},
{"t":"p","x":"et si affligé par l'incroyance et l'injustice."},
{"t":"p","x":"Parle à travers nous et rends témoignage, par notre vie,"},
{"t":"p","x":"du message du Royaume."},
{"t":"p","x":"O Mère du Seigneur,"},
{"t":"p","x":"prie pour nous, afin que descende sur nous l'Esprit"},
{"t":"p","x":"et qu’il nous impulse vers le monde nouveau."},
{"t":"p","x":"Mère du Seigneur, Cœur de Marie,"},
{"t":"p","x":"prie pour nous, intercède en notre faveur!"},
{"t":"p","x":"Amen."}
]},
{id:"24",num:24,title:"Offrande au Cœur de Marie",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Vierge Marie, Mère de Dieu et notre Mère,"},
{"t":"p","x":"je me confie à ton amour maternel,"},
{"t":"p","x":"afin que tu fasses de moi un missionnaire"},
{"t":"p","x":"à l'image de ton Fils, l'envoyé du Père,"},
{"t":"p","x":"pour annoncer la Bonne nouvelle aux pauvres."},
{"t":"p","x":"Apprendsmoi à croire, à aimer et à servir comme toi."},
{"t":"p","x":"Rendsmoi généreux et reconnaissant, afin que je vive avec joie"},
{"t":"p","x":"le don de ma vocation missionnaire. Amen."}
]},
{id:"25",num:25,title:"Le Cœur de Marie",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Seigneur, notre Dieu, toi qui as choisi la Vierge Marie"},
{"t":"p","x":"pour Mère de ton Fils et Notre Mère,"},
{"t":"p","x":"fais que, par le don fidèle à son Cœur maternel,"},
{"t":"p","x":"nous soyons davantage configurés au Christ"},
{"t":"p","x":"et que, pressés par sa charité, nous travaillons"},
{"t":"p","x":"à proclamer l'Évangile à tous les hommes."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"26",num:26,title:"Mère et Maîtresse de Missionnaires",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Marie, mère et maîtresse de missionnaires,"},
{"t":"p","x":"intercède auprès du Père,"},
{"t":"p","x":"afin que nous, les Fils de ton Cœur Immaculé,"},
{"t":"p","x":"nous reproduisions les traits de Jésus"},
{"t":"p","x":"au cœur grand comme celui de Claret,"},
{"t":"p","x":"au  regard pénétrant et aux oreilles attentives"},
{"t":"p","x":"à toutes les urgences du monde."},
{"t":"p","x":"Que nous soyons, comme toimême,"},
{"t":"p","x":"guidés et poussés par la miséricorde,"},
{"t":"p","x":"la tendresse et la compassion."},
{"t":"p","x":"Que nous restions toujours en marche"},
{"t":"p","x":"vers de nouveaux horizons missionnaires,"},
{"t":"p","x":"prêts à accepter la nouveauté d’autres cultures."},
{"t":"p","x":"Que le feu apostolique qui jaillit de la forge de ton Cœur"},
{"t":"p","x":"nous anime partout où nous placera l'Esprit. Amen"}
]},
{id:"27",num:27,title:"Invocation à Marie, Mère de l'Église",theme:"coeur-marie",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Vierge Marie,  nous te  confions toute l'Église."},
{"t":"p","x":"Souvienstoi de tous tes enfants; intercède pour eux ;"},
{"t":"p","x":"augmente  leur foi et leur espérance et ranime leur charité."},
{"t":"p","x":"Nous confions à ton Cœur Immaculé tout le genre humain:"},
{"t":"p","x":"mènele à la connaissance du seul  sauveur, Jésus Christ;"},
{"t":"p","x":"éloigne de lui le châtiment du péché; et accorde-lui"},
{"t":"p","x":"la paix dans la vérité, la justice, la liberté et l'amour."},
{"t":"p","x":"fais que l'Église puisse faire monter jusqu’à Dieu"},
{"t":"p","x":"un hymne de louange, de reconnaissance et de joie,"},
{"t":"p","x":"car le Seigneur a fait de grandes choses en toi,"},
{"t":"p","x":"ô clémente, ô pieuse, ô douce Vierge Marie. Amen."}
]},
{id:"29",num:29,title:"Fondateur et modèle",theme:"claret",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur, notre Dieu,"},
{"t":"p","x":"toi qui as choisi Saint Antoine-Marie Claret"},
{"t":"p","x":"comme fondateur de notre Famille,"},
{"t":"p","x":"et qui as fait de lui un homme qui brûlait de charité"},
{"t":"p","x":"et se réjouissait dans les calomnies et les tourments:"},
{"t":"p","x":"accordenous, dans ta bienveillance, que,"},
{"t":"p","x":"adhérant fidèlement à ses enseignements,"},
{"t":"p","x":"nous proclamions ta gloire dans tout l'univers"},
{"t":"p","x":"et cherchions avec ardeur le salut de tous les hommes."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"30",num:30,title:"Fidèles à son esprit",theme:"claret",sub:null,tags:[],lines:[
{"t":"p","x":"Ô Dieu, qui as accordé à saint Antoine-Marie Claret"},
{"t":"p","x":"un ardent et filial amour au très saint Sacrement"},
{"t":"p","x":"et au Cœur Immaculé de Marie,"},
{"t":"p","x":"pour qu'il puisse réaliser dans l'Église de Dieu"},
{"t":"p","x":"des merveilles pour ta gloire et le salut des âmes:"},
{"t":"p","x":"accordenous que, brûlant du même amour"},
{"t":"p","x":"et continuant fidèlement son oeuvre évangélisatrice,"},
{"t":"p","x":"nous méritions de vivre et de mourir dans la Congrégation"},
{"t":"p","x":"comme  dignes Fils du Cœur Immaculé de Marie."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur."},
{"t":"p","x":"Amen."}
]},
{id:"31",num:31,title:"Pour continuer l’œuvre de notre Fondateur",theme:"claret",sub:null,tags:[],lines:[
{"t":"p","x":"Seigneur,"},
{"t":"p","x":"Toi qui as fait de saint-Antoine Marie Claret, notre Père,"},
{"t":"p","x":"un apôtre plein de zèle pour la gloire de Dieu"},
{"t":"p","x":"et le salut des hommes,"},
{"t":"p","x":"accordenous la charité ardente qui embrasait son cœur,"},
{"t":"p","x":"afin que nous continuions fermement son oeuvre ."},
{"t":"p","x":"Multiplie ses fils pour élargir le Règne du Christ,"},
{"t":"p","x":"et que, au moment de notre mort, nous méritions"},
{"t":"p","x":"d’être reconnus comme des «serviteurs fidèles»"},
{"t":"p","x":"du Christ et de l'Évangile."},
{"t":"p","x":"Par le même Jésus Christ, notre Seigneur. Amen."}
]},
{id:"32",num:32,title:"Magnificat de la vocation",theme:"congregation",sub:"du Père Fondateur",tags:[],lines:[
{"t":"r","x":"Magnificat, magnificat anima mea Dominum!"},
{"t":"p","x":"Merci, Seigneur, d’avoir daigné choisir tes humbles serviteurs"},
{"t":"p","x":"pour devenir les Fils du Cœur Immaculé de ta Mère!"},
{"t":"p","x":"Ô Mère mille fois bénie, reçois toutes nos louanges"},
{"t":"p","x":"pour la délicatesse"},
{"t":"p","x":"que ton Cœur Immaculé nous a montrée"},
{"t":"p","x":"en nous adoptant pour tes enfants."},
{"t":"p","x":"Fais que nous répondions à ta grande bonté"},
{"t":"p","x":"et que nous soyons toujours humbles, fervents et zélés"},
{"t":"p","x":"pour le salut du monde."},
{"t":"r","x":"Magnificat, magnificat anima mea Dominum!"}
]},
{id:"33",num:33,title:"Prière du clarétain",theme:"congregation",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Fais, Seigneur, que les Missionnaires"},
{"t":"p","x":"Fils du Cœur Immaculé de Marie,"},
{"t":"p","x":"nous soyons des hommes qui brûlent de charité"},
{"t":"p","x":"et qui embrasent partout où ils passent."},
{"t":"p","x":"Que nous souhaitions ardemment"},
{"t":"p","x":"et essayons par tous les moyens d’embraser le monde"},
{"t":"p","x":"du  feu de l'amour divin."},
{"t":"p","x":"Que rien ne nous arrête."},
{"t":"p","x":"Que nous sachions nous réjouir dans les privations,"},
{"t":"p","x":"aborder les travaux, embrasser les sacrifices,"},
{"t":"p","x":"nous complaire dans les calomnies,"},
{"t":"p","x":"nous réjouir dans nos souffrances"},
{"t":"p","x":"et nous glorifier dans la croix de Jésus Christ."},
{"t":"p","x":"Que nous ne pensions à rien d'autre qu'à suivre"},
{"t":"p","x":"et  imiter  le Christ dans la prière, le travail et la souffrance"},
{"t":"p","x":"en cherchant toujours et uniquement"},
{"t":"p","x":"la plus grande gloire de Dieu et le salut des âmes."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur."},
{"t":"p","x":"Amen."},
{"t":"p","x":"b) De la Congrégation"}
]},
{id:"34",num:34,title:"Prière pour l'anniversaire de la Fondation",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Seigneur, tu as accordé à Saint Antoine-Marie Claret"},
{"t":"p","x":"de brûler de charité apostolique"},
{"t":"p","x":"pour le salut des hommes du monde entier."},
{"t":"p","x":"Dès son enfance, tu l'as conduit"},
{"t":"p","x":"à la pleine connaissance du mystère du Christ."},
{"t":"p","x":"Poussé par la charité, il s'est livré à l'annonce de l'Évangile."},
{"t":"p","x":"Il fut patient dans les travaux et les calomnies"},
{"t":"p","x":"et ratifia sa mission par son sang et par l'exil."},
{"t":"p","x":"Pour continuer son œuvre,"},
{"t":"p","x":"et par l'intervention de la Vierge Marie,"},
{"t":"p","x":"il fonda notre Congrégation"},
{"t":"p","x":"et nous transmit son esprit en héritage."},
{"t":"p","x":"Aujourd'hui, nous souvenant de notre origine dans l'Église,"},
{"t":"p","x":"nous te demandons, par l'intercession de notre Mère,"},
{"t":"p","x":"de nous rendre fidèles à l’esprit du Fondateur"},
{"t":"p","x":"dans le ministère de la Parole."},
{"t":"p","x":"Que  son esprit missionnaire"},
{"t":"p","x":"nous inspire et nous soutienne dans notre apostolat."},
{"t":"p","x":"Seigneur, bénis de nouvelles vocations la famille clarétaine."},
{"t":"p","x":"Accorde-nous un grand amour  envers Jésus et son Église."},
{"t":"p","x":"Fais que, pressés par cet amour,"},
{"t":"p","x":"nous, les fils du Cœur Immaculé de Marie,"},
{"t":"p","x":"travaillions infatigablement pour la gloire de Dieu"},
{"t":"p","x":"et le salut du monde."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."},
{"t":"p","x":"Amen."},
{"t":"p","x":"35.Pour notre Congrégation"},
{"t":"v","x":": Regarde du haut du ciel notre Congrégation"},
{"t":"p","x":"et vient la visiter."},
{"t":"r","x":": Prends soin d'elle, arrosela, enrichisla sans mesure."},
{"t":"v","x":": Souvienstoi, Seigneur, de chacun de nous."},
{"t":"r","x":": Envoienous ta lumière et ta vérité."},
{"t":"v","x":": Donnenous vie, afin que nous invoquions ton nom."},
{"t":"r","x":":  Et que nous accomplissions la mission"},
{"t":"p","x":"d'annoncer l'Évangile à tous les  peuples."},
{"t":"p","x":"Nous te prions, Seigneur,"},
{"t":"p","x":"par l'intercession du Cœur Immaculé de Marie,"},
{"t":"p","x":"de libérer de tout mal notre Congrégation,"},
{"t":"p","x":"afin que, avec un esprit humble et généreux,"},
{"t":"p","x":"comme celui de saint Antoine-Marie Claret,"},
{"t":"p","x":"elle se voue à ton projet de salut pour tous les hommes."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"36",num:36,title:"Pour la Congrégation",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"v","x":": Sainte Marie,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Saint Michel et tous les saints Anges,"},
{"t":"r","x":": priez pour nous."},
{"t":"v","x":": Saint Joseph,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Tous les Saints Apôtres,"},
{"t":"r","x":": priez pour nous."},
{"t":"v","x":": Saint Alphonse de Liguori,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Saint Ignace de Loyola,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Saint François Xavier,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Saint Vincent de Paul,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Saint Antoine-Marie Claret,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Sainte Thérèse de Jésus,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Sainte Catherine de Sienne,"},
{"t":"r","x":": prie pour nous."},
{"t":"v","x":": Les Bienheureux Martyrs de la famille Clarétaine,"},
{"t":"r","x":": priez pour nous."},
{"t":"v","x":": Tous les Saints et toutes les Saintes de Dieu,"},
{"t":"r","x":": priez pour nous."},
{"t":"v","x":": Souvienstoi, Seigneur, de ta Congrégation,"},
{"t":"r","x":": vigne plantée par ta main."},
{"t":"v","x":": Qu'elle remplisse  sa mission d'annoncer l'Évangile,"},
{"t":"r","x":": afin que tous les hommes soient sauvés."},
{"t":"v","x":": Nous te prions de venir au secours de tes serviteurs,"},
{"t":"r","x":": que tu as rachetés par ton précieux sang."},
{"t":"v","x":": Sauve, Seigneur, ta Congrégation,"},
{"t":"r","x":": Sois son berger et guidela toujours."},
{"t":"v","x":": Prends pitié de nous, Seigneur,"},
{"t":"r","x":": prends pitié de nous."},
{"t":"v","x":": Que ta miséricorde, Seigneur, soit sur nous,"},
{"t":"r","x":": comme notre espoir est en toi."},
{"t":"v","x":": Seigneur, écoute notre prière,"},
{"t":"r","x":": que notre cri parvienne jusqu'à toi."},
{"t":"v","x":": Le Seigneur soit avec vous."},
{"t":"r","x":": et avec ton esprit."},
{"t":"rub","x":"Prions."},
{"t":"p","x":"Par l'intercession de la Vierge Marie,"},
{"t":"p","x":"nous te prions, Seigneur, de bénir cette Congrégation;"},
{"t":"p","x":"répands abondamment ta grâce sur ses fils"},
{"t":"p","x":"et remplisles de ton esprit, afin qu'ils puissent"},
{"t":"p","x":"se complaire toujours dans la vérité."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen"}
]},
{id:"37",num:37,title:"Prière pour la Congrégation",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Père de bonté et de miséricorde,"},
{"t":"p","x":"nous te louons et nous te bénissons,"},
{"t":"p","x":"parce que tu as enrichi ton Église"},
{"t":"p","x":"avec le charisme apostolique d’Antoine-Marie Claret,"},
{"t":"p","x":"notre Fondateur et Père."},
{"t":"p","x":"Nous te supplions humblement d'envoyer"},
{"t":"p","x":"de nouveaux ouvriers à notre Congrégation"},
{"t":"p","x":"et d’envoyer ton Esprit sur ceux que tu as choisis."},
{"t":"p","x":"Confirme-nous tous dans la vocation missionnaire"},
{"t":"p","x":"et fais que, pressés par la charité du Christ,"},
{"t":"p","x":"comme de vrais Fils du Cœur Immaculé de Marie,"},
{"t":"p","x":"nous annoncions à tous les peuples"},
{"t":"p","x":"la Bonne Nouvelle du Royaume."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"38",num:38,title:"Pour rénover l'esprit clarétain",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Renouvelle, Seigneur, en notre Congrégation"},
{"t":"p","x":"l'esprit qui anima saint Antoine-Marie Claret, notre Père,"},
{"t":"p","x":"afin qu’enflammé par lui, nous nous efforcions"},
{"t":"p","x":"d’aimer ce qu'il a aimé et de pratiquer"},
{"t":"p","x":"ce qu'il nous a enseigné."},
{"t":"p","x":"Par Jésus, le Christ, Notre Seigneur. Amen."}
]},
{id:"39",num:39,title:"Évangélisateurs fidèles",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Toi, Seigneur, tu as décidé miséricordieusement"},
{"t":"p","x":"que ta Parole prenne chair dans le sein de  Marie;"},
{"t":"p","x":"accordenous de garder cette Parole en nos cœurs,"},
{"t":"p","x":"de sorte que nous soyons toujours de fidèles serviteurs"},
{"t":"p","x":"de l'annonce de sa Bonne Nouvelle du salut."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"40",num:40,title:"Les Constitutions",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Notre Père, qui nous as accordé le don de suivre Jésus"},
{"t":"p","x":"et d'annoncer ton Royaume parmi les hommes"},
{"t":"p","x":"à la manière de Claret et de ses premiers disciples,"},
{"t":"p","x":"aidenous à observer avec tout le soin possible"},
{"t":"p","x":"nos Constitutions, chemin de l'Évangile pour nous."},
{"t":"p","x":"Fais que nous écoutions ta Parole  comme ta Mère,"},
{"t":"p","x":"afin que nous soyons de fidèles Fils de son Cœur"},
{"t":"p","x":"et coopérions à son rôle maternel"},
{"t":"p","x":"dans la mission apostolique."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"41",num:41,title:"Action de grâces pour la vocation",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Je te rends grâce, ô ma Mère, pour la vocation reçue ;"},
{"t":"p","x":"faismoi la grâce d'y rester fidèle toute ma vie. Amen."}
]},
{id:"42",num:42,title:"Définition du Missionnaire Clarétain",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"v","x":": Seigneur, par l'intercession du Cœur  de Marie,"},
{"t":"p","x":"mets en nous l'esprit d'amour, afin que nous soyons"},
{"t":"p","x":"des hommes brûlant de charité"},
{"t":"p","x":"qui embrasent partout où ils passent."},
{"t":"r","x":": Amen"},
{"t":"v","x":": Fais que nous essayions  par tous les moyens"},
{"t":"p","x":"d’embraser  le monde entier du feu de l'amour divin."},
{"t":"r","x":": Amen."},
{"t":"v","x":": Seigneur, par l'intercession du Cœur de Marie,"},
{"t":"p","x":"mets en nous l'esprit de force,"},
{"t":"p","x":"afin que rien ne nous épouvante,"},
{"t":"p","x":"et que nous nous réjouissions dans les privations"},
{"t":"p","x":"et abordions vaillamment les travaux."},
{"t":"r","x":": Amen."},
{"t":"v","x":": Seigneur, fais que nous acceptions  les sacrifices,"},
{"t":"p","x":"les calomnies et toute sorte de souffrance."},
{"t":"r","x":": Amen."},
{"t":"v","x":": Seigneur, par l'intercession du Cœur  de Marie,"},
{"t":"p","x":"mets en nous l'esprit missionnaire qui anima Jésus,"},
{"t":"p","x":"afin que nous ne pensions qu’à le suivre"},
{"t":"p","x":"et l'imiter dans la prière, le travail et la souffrance."},
{"t":"r","x":": Amen"},
{"t":"v","x":": Et pour que, comme Jésus, nous cherchions"},
{"t":"p","x":"toujours et uniquement  ta plus grande gloire"},
{"t":"p","x":"et le salut des hommes."},
{"t":"r","x":": Amen."}
]},
{id:"43",num:43,title:"Profession d'identité clarétaine",theme:"congregation",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Nous croyons que le Saint-Esprit nous a convoqués"},
{"t":"p","x":"dans l'Église par Saint Antoine-Marie Claret,"},
{"t":"p","x":"afin que, comme Congrégation, nous nous appelions"},
{"t":"p","x":"et soyons Missionnaires Fils du Cœur de Marie."},
{"t":"p","x":"Nous croyons que le Père nous appelle ensemble à vivre,"},
{"t":"p","x":"de manière authentique et significative,"},
{"t":"p","x":"le mystère et la mission apostolique de son Fils"},
{"t":"p","x":"en fraternité évangélisée et évangélisatrice."},
{"t":"p","x":"C'est Lui qui fait de nous de vrais disciples du Christ."},
{"t":"p","x":"L’amour qui configure notre vie fraternelle,"},
{"t":"p","x":"nous voulons le signifier, de plus en plus, dans l'eucharistie."},
{"t":"p","x":"Nous croyons que Marie est à l'origine de notre vocation"},
{"t":"p","x":"et qu'elle exerce sa maternité en configurant notre vie"},
{"t":"p","x":"avec celle du Christ, son Fils."},
{"t":"p","x":"En son Cœur se forment les apôtres de la Congrégation."},
{"t":"p","x":"Sa présence nous invite à évangéliser, et son amour"},
{"t":"p","x":"transforme et accompagne les croyants."},
{"t":"p","x":"Nous croyons que le Père Claret fut choisi  par Dieu"},
{"t":"p","x":"pour qu’il soit notre prototype et modèle"},
{"t":"p","x":"comme missionnaires au service de l'Évangile"},
{"t":"p","x":"dans l'Église universelle."},
{"t":"p","x":"Nous croyons que notre vocation  comporte"},
{"t":"p","x":"la suite fidèle du Christ, messager du Père,"},
{"t":"p","x":"selon les exigences évangéliques vécues par Claret"},
{"t":"p","x":"et transmises par lui à la Congrégation."},
{"t":"p","x":"Nous croyons que l'Esprit de Jésus ressuscité"},
{"t":"p","x":"nous rend prophètes pour annoncer aux pauvres"},
{"t":"p","x":"l’amour infini que le Christ nous manifesta sur la croix."},
{"t":"p","x":"Nous croyons que nous sommes appelés,"},
{"t":"p","x":"comme de vaillants collaborateurs du Pape et des Évêques"},
{"t":"p","x":"dans le ministère de la Parole, pour l’expansion"},
{"t":"p","x":"du règne de Dieu dans le monde."},
{"t":"p","x":"C'est pourquoi, en employant tous les moyens possibles,"},
{"t":"p","x":"nous ferons ce qui est le plus urgent, opportun et efficace."},
{"t":"p","x":"Nous croyons que la Congrégation est l’œuvre de Dieu"},
{"t":"p","x":"et que Jésus et Marie ne l'abandonneront jamais."},
{"t":"p","x":"Ils accorderont l’Esprit  à ceux qui seront appelés,"},
{"t":"p","x":"afin que, vivant tous en fraternité la même consécration,"},
{"t":"p","x":"nous glorifions le Père, en travaillant tous ensemble"},
{"t":"p","x":"pour que la lumière de l’Évangile de Jésus arrive"},
{"t":"p","x":"aux quatre coins du monde."},
{"t":"p","x":"Nous croyons, Seigneur. Augmente en nous la foi."}
]},
{id:"46",num:46,title:"La pratique des vertus",theme:"conseils",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Jésus, donnemoi la grâce  de t'imiter fidèlement"},
{"t":"p","x":"en la pratique de toutes les vertus."},
{"t":"p","x":"Avec toi, je peux tout ; sans toi, je ne peux absolument rien."},
{"t":"p","x":"Amen."}
]},
{id:"47",num:47,title:"La Pauvreté",theme:"conseils",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Jésus, notre Sauveur, tu t'es fait pauvre,"},
{"t":"p","x":"tu as voulu naître pauvre, vivre pauvrement"},
{"t":"p","x":"et mourir dans la plus grande pauvreté."},
{"t":"p","x":"Fais que nous, tes missionnaires, nous aimions la pauvreté,"},
{"t":"p","x":"et que nous l'aimions et la pratiquions"},
{"t":"p","x":"comme tu nous enseignes, en paroles et en actes;"},
{"t":"p","x":"que, à l'exemple des Apôtres, nous abandonnions tout"},
{"t":"p","x":"pour te suivre en annonçant l'Évangile. Amen."}
]},
{id:"48",num:48,title:"La mansuétude",theme:"conseils",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Mon Dieu, accordemoi un zèle discret et prudent,"},
{"t":"p","x":"afin que j'agisse en toutes choses avec force et douceur."},
{"t":"p","x":"Aidemoi à me comporter en tout avec une sainte prudence,"},
{"t":"p","x":"cultivée par l'étude, fortifiée par la vie,"},
{"t":"p","x":"éclairée par le dialogue et consommée par l'expérience."},
{"t":"p","x":"Amen."}
]},
{id:"49",num:49,title:"La mortification",theme:"conseils",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Seigneur, les peines, les souffrances et les travaux"},
{"t":"p","x":"sont la devise de l'apôtre. Avec ta grâce, je les embrasse."},
{"t":"p","x":"Aidemoi, Seigneur, à boire la coupe des peines intérieures"},
{"t":"p","x":"et à recevoir le baptême des peines extérieures."},
{"t":"p","x":"Fais que je me glorifie  dans la Croix"},
{"t":"p","x":"où tu a été cloué pour moi. Amen."},
{"t":"p","x":"b) De la Congrégation"}
]},
{id:"50",num:50,title:"Notre consécration",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Mon Dieu et mon Père, répondant à ton appel,"},
{"t":"p","x":"je veux travailler avec toutes mes forces,"},
{"t":"p","x":"afin que ta volonté soit faite."},
{"t":"p","x":"Je désire me consacrer à toi de tout mon coeur"},
{"t":"p","x":"en suivant Jésus, comme les Apôtres,"},
{"t":"p","x":"pour que tous les hommes aient la vie en abondance."},
{"t":"p","x":"Poussé par l'Esprit Saint, je renouvelle ma consécration"},
{"t":"p","x":"et me donne à toi, Père, pour que tu me formes"},
{"t":"p","x":"selon l'image et la ressemblance de ton Fils, Jésus."},
{"t":"p","x":"Confiant en l'assistance maternelle du Cœur de Marie,"},
{"t":"p","x":"je promets de vivre chaste, pauvre et obéissant,"},
{"t":"p","x":"en cette communauté de vie apostolique, en y observant"},
{"t":"p","x":"les Constitutions de l’Intitut avec tout le soin possible."},
{"t":"p","x":"Consacre-moi, Père,  par  ton Esprit de sainteté,"},
{"t":"p","x":"afin que, dans le service de la Parole,"},
{"t":"p","x":"je sois fidèle au charisme de saint Antoine-Marie Claret"},
{"t":"p","x":"et que je parvienne à la perfection de la charité."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"51",num:51,title:"Configuration au Christ",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Merci, Père, parce que tu nous as consacrés par ton Esprit"},
{"t":"p","x":"et nous as fait participants de la plénitude du Christ, ton Fils."},
{"t":"p","x":"Béni soistu, parce que tu nous as appelés à le suivre"},
{"t":"p","x":"et à collaborer avec lui dans l’œuvre que tu lui as confiée."},
{"t":"p","x":"Nous te demandons que, pénétrés de son Esprit,"},
{"t":"p","x":"ce ne soit pas nous qui vivions mais que ce soit le Christ"},
{"t":"p","x":"qui vive réellement en nous, pour que nous devenions"},
{"t":"p","x":"des instruments idoines pour annoncer le Royaume des cieux."},
{"t":"p","x":"Que nous cherchions à atteindre notre configuration avec lui"},
{"t":"p","x":"en notre communauté missionnaire"},
{"t":"p","x":"selon notre charisme propre dans l'Église."},
{"t":"p","x":"Lui qui vit et règne pour les siècles des siècles. Amen."}
]},
{id:"53",num:53,title:"Le don de la chasteté",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Nous te bénissons, Seigneur, pour nous avoir accordé"},
{"t":"p","x":"le don de la chasteté pour le Royaume des cieux."},
{"t":"p","x":"Par ce don, nous pouvons  nous consacrer de tout cœur"},
{"t":"p","x":"aux choses du Père à imitation de ton Fils Jésus Christ"},
{"t":"p","x":"et suivant l'exemple de la Vierge Marie."},
{"t":"p","x":"Nous te demandons, Seigneur,  de nous accorder"},
{"t":"p","x":"ton secours pour maîtriser les penchants de notre nature,"},
{"t":"p","x":"pour vivre avec joie la chasteté et la cultiver avec soin."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"54",num:54,title:"La Chasteté",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Béni sois-tu, Seigneur, parce que le don de la chasteté"},
{"t":"p","x":"manifeste la puissance de ta gloire dans notre fragilité"},
{"t":"p","x":"et suscite chez les hommes  l'espérance de la vie future."},
{"t":"p","x":"Fais que notre vœu de chasteté  favorise en nous"},
{"t":"p","x":"une nouvelle communion fraternelle en JésusChrist"},
{"t":"p","x":"et construise une communauté qui n'a pas son fondement"},
{"t":"p","x":"dans la chair ni dans le sang, mais dans ta volonté."},
{"t":"p","x":"Qu’elle devienne, comme signe d'un amour parfait,"},
{"t":"p","x":"une source spéciale de fécondité spirituelle pour le monde"},
{"t":"p","x":"et nous embrase en ton amour et en celui des hommes."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"55",num:55,title:"Toi, qui étant riche",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Toi, qui étant riche,"},
{"t":"p","x":"t'es fait pauvre pour nous pour que nous devenions riches."},
{"t":"p","x":"Consacré à annoncer la Bonne Nouvelle"},
{"t":"p","x":"du royaume des cieux, tu n'avais pas où reposer la tête."},
{"t":"p","x":"Donnenous de partager ta pauvreté,"},
{"t":"p","x":"pour rappeler aux hommes les biens du monde à venir,"},
{"t":"p","x":"comme Marie, la première parmi les pauvres du Seigneur,"},
{"t":"p","x":"et les Apôtres qui, laissant tout, t'ont suivi,"},
{"t":"p","x":"toi qui vis et règnes pour les siècles des siècles. Amen."}
]},
{id:"56",num:56,title:"Chercher d'abord le Règne de Dieu",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Nous te demandons, Seigneur,"},
{"t":"p","x":"que, mettant toute notre confiance en toi"},
{"t":"p","x":"et ne cherchant jamais ni le pouvoir ni les richesses,"},
{"t":"p","x":"nous cherchions toujours et avant tout"},
{"t":"p","x":"le Règne qui appartient aux pauvres. Amen."}
]},
{id:"57",num:57,title:"Communauté des biens",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Accordenous, Seigneur, de bâtir,"},
{"t":"p","x":"avec notre pauvreté volontaire,"},
{"t":"p","x":"la communauté fraternelle dans l'unité de cœur et d'esprit"},
{"t":"p","x":"et de l'exprimer par la communication des biens,"},
{"t":"p","x":"en nous mettant au service des pauvres. Amen."}
]},
{id:"58",num:58,title:"Pauvreté",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Nous te rendons grâce, Père saint, parce que tu as voulu"},
{"t":"p","x":"nous montrer la valeur de la pauvreté et le bonheur de ceux"},
{"t":"p","x":"qui ne mettent pas leur coeur dans les richesses."},
{"t":"p","x":"Accordenous de laisser toute notre vie et notre activité"},
{"t":"p","x":"s’empreigner de l'esprit de pauvreté."},
{"t":"p","x":"Que nous soyons pauvres en esprit et en actes"},
{"t":"p","x":"et que nous nous acceptions la loi commune du travail,"},
{"t":"p","x":"partageant ainsi la condition des pauvres."},
{"t":"p","x":"Que nous mettions nos biens à disposition des autres"},
{"t":"p","x":"et que nous nous réjouissions quand nous épprouverons"},
{"t":"p","x":"les effets de la pauvreté, ne doutant jamais de ta providence."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"59",num:59,title:"Pour faire ta volonté",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Pour faire ta volonté, Père, tu nous as envoyé ton Fils, Jésus."},
{"t":"p","x":"À l'exemple de la très sainte Vierge Marie,"},
{"t":"p","x":"qui s'est donnée tout entière, comme servante du Seigneur,"},
{"t":"p","x":"à l’œuvre du Fils, nous t'offrons la faculté de régler notre vie"},
{"t":"p","x":"de sorte que nous nous configurions au Christ,"},
{"t":"p","x":"qui s'est fait obéissant jusqu'à la mort sur la croix,"},
{"t":"p","x":"et de nous unir en tout à ta sainte volonté."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"60",num:60,title:"Obéissants dans la mission",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Partageant la même vocation, nous voulons, Seigneur,"},
{"t":"p","x":"chercher ensemble ta volonté"},
{"t":"p","x":"pour mener à bien notre mission."},
{"t":"p","x":"Nous voulons que notre vie  manifeste aux hommes"},
{"t":"p","x":"l'unité dans l'amour et la mission."},
{"t":"p","x":"Aide-nous à promouvoir la coopération de tous"},
{"t":"p","x":"pour le bien de l'Église et de la Congrégation."},
{"t":"p","x":"Fais que nous tous, poussés par l'amour fraternel,"},
{"t":"p","x":"sachions obéir avec promptitude et perfection."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"61",num:61,title:"Obéissance",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Nous te rendons grâce, Père, parce que tu nous a donné"},
{"t":"p","x":"la faculté de disposer librement de notre vie."},
{"t":"p","x":"et nous invites, par l’action de ton Esprit,  à te l'offrir."},
{"t":"p","x":"Merci de nous avoir appelés"},
{"t":"p","x":"à nous configurer à ton Fils Jésus Christ,"},
{"t":"p","x":"qui a été obéissant jusqu'à la mort sur la croix."},
{"t":"p","x":"Béni soistu parce que tu as voulu qu'en lui"},
{"t":"p","x":"nous participions à ta volonté rédemptrice."},
{"t":"p","x":"Par Jésus le Christ, notre Seigneur. Amen."}
]},
{id:"62",num:62,title:"Obéissance en communion",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Accordenous, Seigneur, de chercher, de connaître"},
{"t":"p","x":"et d'accomplir ta volonté, afin de pouvoir réaliser"},
{"t":"p","x":"la mission commune qui nous a été confiée dans l'Église."},
{"t":"p","x":"Accordenous qu’en cherchant et accomplissant ta volonté,"},
{"t":"p","x":"nous nous obligions à offrir notre aide à nos frères"},
{"t":"p","x":"par la prière, le conseil et le dialogue fraternel."},
{"t":"p","x":"Par Jésus le Christ, notre Seigneur. Amen."}
]},
{id:"63",num:63,title:"Pour les supérieurs",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Rends forts, Seigneur, nos supérieurs,"},
{"t":"p","x":"afin qu'ils cherchent avant tout ta volonté,"},
{"t":"p","x":"en exerçant l'autorité avec un esprit de service"},
{"t":"p","x":"et en donnant leur vie pour leurs frères."},
{"t":"p","x":"Et accorde à nous tous de t'obéir par l'amour,"},
{"t":"p","x":"avec promptitude et perfection,"},
{"t":"p","x":"en nous soumettant aux hommes à cause de toi."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"64",num:64,title:"Disponibilité",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Accordenous, Seigneur, l’esprit de disponibilité"},
{"t":"p","x":"pour être envoyés n'importe où dans le monde"},
{"t":"p","x":"et pour mettre toutes nos forces au service du ministère"},
{"t":"p","x":"qui nous est confié par la Congrégation."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"65",num:65,title:"Imitons la prière de Jésus",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Dieu toutpuissant et éternel, qui as  voulu nous associer"},
{"t":"p","x":"à l’œuvre missionnaire du Christ : ouvre notre cœur"},
{"t":"p","x":"pour nous convertir à l'Évangile, et donnenous la grâce"},
{"t":"p","x":"de l'imiter dans sa prière assidue."},
{"t":"p","x":"Par le même Jésus Christ, notre Seigneur. Amen."}
]},
{id:"66",num:66,title:"Progrès dans la charité",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Père miséricordieux, fais que  la charité du Christ"},
{"t":"p","x":"nous presse à aimer notre prochain comme tu nous aimes"},
{"t":"p","x":"et que, soutenus par ta force divine, nous soyons prêts"},
{"t":"p","x":"à mourir chaque jour pour nos frères."},
{"t":"p","x":"Fais que, comme des étrangers et des pèlerins,"},
{"t":"p","x":"nous nous abstenions des désirs de la chair,"},
{"t":"p","x":"que nous gardions avec un soin diligent nos sens"},
{"t":"p","x":"et  nous réjouissions dans l'adversité."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"67",num:67,title:"La charité du Christ nous presse",theme:"conseils",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Père saint, Jésus Christ, pressé par un amour ardent"},
{"t":"p","x":"envers toi et envers les hommes, s'est livré aux travaux,"},
{"t":"p","x":"à la passion et même à la mort. Accordenous la charité,"},
{"t":"p","x":"pour travailler à ce que tous les hommes te connaissent,"},
{"t":"p","x":"t'aiment et te servent, et qu'ils obtiennent"},
{"t":"p","x":"la béatitude de ton Royaume."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"68",num:68,title:"Supplication au Père",theme:"communaute",sub:null,tags:[],lines:[
{"t":"p","x":"Père, tu nous as envoyé l’Esprit Saint pour allumer"},
{"t":"p","x":"dans nos cœurs le feu de l’amour envers toi"},
{"t":"p","x":"et envers nos frères. Il nous configure au Christ"},
{"t":"p","x":"et édifie notre communion."},
{"t":"p","x":"Fais que nous sachions l’accueillir  et lui être fidèles,"},
{"t":"p","x":"afin que toute notre vie missionnaire"},
{"t":"p","x":"soit animée par la charité et que nous obtenions ainsi,"},
{"t":"p","x":"dans la communauté missionnaire,"},
{"t":"p","x":"la plénitude personnelle à laquelle tu nous appelles."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"69",num:69,title:"Prière de la communauté",theme:"communaute",sub:null,tags:[],lines:[
{"t":"p","x":"Nous te rendons grâce, Père Saint,"},
{"t":"p","x":"pour nous avoir rassemblés en cette communauté,"},
{"t":"p","x":"dans laquelle tu veux que nous annoncions ton Royaume"},
{"t":"p","x":"par une vie fraternelle  au service de  l'Évangile."},
{"t":"p","x":"Nous voulons proclamer, avec la  Marie et les Apôtres,"},
{"t":"p","x":"les merveilles de ton amour parmi les hommes."},
{"t":"p","x":"Nous renouvelons notre résolution de devenir meilleurs,"},
{"t":"p","x":"de nous aider mutuellement à suivre ton Fils,"},
{"t":"p","x":"de seconder les inspirations du Saint-Esprit et de collaborer"},
{"t":"p","x":"à l’acomplissement de la mission"},
{"t":"p","x":"que tu nous as confiée dans l'Église."},
{"t":"p","x":"Ne permets pas, Seigneur, que cette bonne volonté"},
{"t":"p","x":"commence à s'étioler par manque d'attention,"},
{"t":"p","x":"par égoïsme, routine ou inconstance."},
{"t":"p","x":"Ravive la foi et l'espérance de cette communauté"},
{"t":"p","x":"à l'heure de discerner les inévitables différences,"},
{"t":"p","x":"et dispose nos cœurs pour le nécessaire pardon."},
{"t":"p","x":"Conscients de notre fragilité, nous te demandons"},
{"t":"p","x":"de nous garder attentifs à ta grâce."},
{"t":"p","x":"Que la méditation assidue de ta Parole nous recrée,"},
{"t":"p","x":"et que la convivialité fraternelle nous stimule"},
{"t":"p","x":"à porter le témoignage d'amour"},
{"t":"p","x":"dont le monde a besoin pour croire."},
{"t":"p","x":"Que les besoins et les urgences des plus pauvres"},
{"t":"p","x":"nous pressent à sortir de nousmêmes"},
{"t":"p","x":"et nous obligent à travailler sans répit en leur faveur."},
{"t":"p","x":"Nous nous confions à Marie, modèle de vie consacrée,"},
{"t":"p","x":"pour qu'elle nous forme en son Cœur et nous aide à marcher"},
{"t":"p","x":"sur le chemin de la perfection et du service apostolique,"},
{"t":"p","x":"que le Père Claret nous a tracé dans l'Église et dans le monde."},
{"t":"p","x":"Père, daigne bénir ce qui est maintenant"},
{"t":"p","x":"notre aspiration la plus sincère."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."},
{"t":"p","x":"70.La charité fraternelle"},
{"t":"p","x":"Nous te supplions humblement, Seigneur notre Dieu,"},
{"t":"p","x":"d'unir dans un même cœur tous ceux qui partageons"},
{"t":"p","x":"l'esprit de ton serviteur Antoine-Marie,"},
{"t":"p","x":"afin que, accordés dans un même amour mutuel,"},
{"t":"p","x":"nous soyons les témoins de ta charité parmi les hommes."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"71",num:71,title:"Prière pour ma communauté",theme:"communaute",sub:null,tags:[],lines:[
{"t":"p","x":"Mon Père, je veux te prier aujourd'hui"},
{"t":"p","x":"pour mes frères de communauté. Tu connais"},
{"t":"p","x":"leurs noms et leurs prénoms, leurs vertus et leurs défauts,"},
{"t":"p","x":"leurs joies et leurs peines, leur force et leur faiblesse."},
{"t":"p","x":"Tu les aimes  comme ils sont et tu les vivifies par ton Esprit."},
{"t":"p","x":"Seigneur, tu les aimes  parce qu'ils sont tes enfants."},
{"t":"p","x":"Enseignemoi à les aimer vraiment, comme Jésus les aime :"},
{"t":"p","x":"non pas à cause de leurs paroles ou de leurs oeuvres,"},
{"t":"p","x":"mais pour eux-mêmes, en découvrant, en chacun d'eux,"},
{"t":"p","x":"le mystère de ton amour infini."},
{"t":"p","x":"Père, je te rends grâce, parce que tu m'as donné des frères."},
{"t":"p","x":"Ils sont tous pour moi un cadeau, un vrai sacrement,"},
{"t":"p","x":"un signe sensible et efficace de la présence de ton Fils."},
{"t":"p","x":"Donnemoi le regard de Jésus pour les contempler."},
{"t":"p","x":"Donne-moi son cœur pour les aimer toujours."},
{"t":"p","x":"Je veux aussi devenir, pour chacun d'eux,"},
{"t":"p","x":"un sacrament vivant, un signe  de la présence de Jésus."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen."}
]},
{id:"73",num:73,title:"Connaître Dieu pour le servir",theme:"mission",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Accordemoi, Seigneur,"},
{"t":"p","x":"que tous connaissent ta bonté et ta présence,"},
{"t":"p","x":"afin qu'ils t'aiment et te servent fidèlement,"},
{"t":"p","x":"parce que tu es bon et ta miséricorde est infinie. Amen."}
]},
{id:"74",num:74,title:"Instrument du Royaume",theme:"mission",sub:"du Père Fondateur",tags:[],lines:[
{"t":"p","x":"Seigneur, si tu veux faire de moi un instrument"},
{"t":"p","x":"pour annoncer ton royaume, me voici."},
{"t":"p","x":"Que la nourriture me donne des forces pour mieux te servir."},
{"t":"p","x":"Que je me serve des choses de ce monde"},
{"t":"p","x":"dans la mesure où elles me sont nécessaires."},
{"t":"p","x":"Que j'étudie pour mieux te connaître, pour mieux t'aimer"},
{"t":"p","x":"et pour mieux aider mes frères."},
{"t":"p","x":"Que le repos serve à refaire les forces,"},
{"t":"p","x":"afin de mieux te servir. Amen."},
{"t":"p","x":"b)   De la Congrégation"}
]},
{id:"75",num:75,title:"Pour le fruit apostolique des missionnaires",theme:"mission",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Père bon, tu nous as choisis sans aucun mérite de notre part"},
{"t":"p","x":"et tu nous  envoies comme tu as envoyé ton Fils Jésus."},
{"t":"p","x":"Donne-nous ton Esprit, pour que nou soyons"},
{"t":"p","x":"des ministres idoines de l'Évangile,"},
{"t":"p","x":"et accordenous la force nécessaire pour exercer avec brio"},
{"t":"p","x":"le ministère du salut pour tous les hommes."},
{"t":"p","x":"Fais fructifier, Seigneur, nos labeurs."},
{"t":"p","x":"Fais que ta Parole parle en nous et par nous."},
{"t":"p","x":"Aidenous à faire que  tout le monde accueille l'Évangile"},
{"t":"p","x":"et t'aime chaque jour davantage."},
{"t":"p","x":"Ne permets pas, Seigneur, que nous t'offensions;"},
{"t":"p","x":"préservenous de tous les dangers,  rends-nous forts."},
{"t":"p","x":"Par Jésus, le Christ, notre Seigneur. Amen"}
]},
{id:"76",num:76,title:"Missionnaires",theme:"mission",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Seigneur, tu nous appelles comme tu as appelé les Apôtres;"},
{"t":"p","x":"aidenous à travailler de toutes nos forces"},
{"t":"p","x":"pour  que tu sois aimé, connu et servi par tous."},
{"t":"p","x":"Donnenous un cœur généreux"},
{"t":"p","x":"pour aimer tous les hommes sans exception,"},
{"t":"p","x":"leur procurant la béatitude de ton Règne,"},
{"t":"p","x":"qui est déjà initié sur terre."},
{"t":"p","x":"Que tous les dons que tu nous as faits, nous les employions"},
{"t":"p","x":"à te rendre gloire en les faisant fructifier,"},
{"t":"p","x":"tout en étant conscients de nos propres limites et défauts,"},
{"t":"p","x":"et en reconnaissant que nous dépendons totalement de toi."},
{"t":"p","x":"Fais que, dans toutes nos actions et nos relations,"},
{"t":"p","x":"nous soyons toujours prêts à demander pardon."},
{"t":"p","x":"Que nous cherchions à rendre à nos frères"},
{"t":"p","x":"les services de notre charité, de sorte que chacun de nous"},
{"t":"p","x":"soit au milieu des autres comme celui qui sert."},
{"t":"p","x":"Par Jésus le Christ, notre Seigneur. Amen."}
]},
{id:"77",num:77,title:"Mission Clarétaine",theme:"mission",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Père saint, tu as appelé notre Fondateur à suivre ton Fils."},
{"t":"p","x":"Pressé par la charité, il  consacra toute sa vie"},
{"t":"p","x":"à l’annonce de ton Royaume."},
{"t":"p","x":"Éveille en nous son esprit évangélisateur pour saisir"},
{"t":"p","x":"ce qui est le plus urgent, opportun et efficace  pour réaliser"},
{"t":"p","x":"-dociles à l'Esprit- la mission de propager la foi."},
{"t":"p","x":"Animés, comme Claret, par la force de ton Esprit,"},
{"t":"p","x":"nous voulons aussi  opter pour la cause du Royaume"},
{"t":"p","x":"en acceptant les risques"},
{"t":"p","x":"que comporte notre mission évangélisatrice."},
{"t":"p","x":"Nous voulons être solidaires des hommes en partageant"},
{"t":"p","x":"les angoisses, les privations et les espérances"},
{"t":"p","x":"des hommes auxquels nous sommes envoyés."},
{"t":"p","x":"En même temps que nous confessons que ton Fils"},
{"t":"p","x":"est vivant parmi les hommes, nous voulons travailler"},
{"t":"p","x":"pour en finir avec l'incrédulité, la haine, l'injustice,"},
{"t":"p","x":"le mensonge, l'oppression, la souffrance, la solitude,"},
{"t":"p","x":"la faim, l'ignorance et tant d'autres absences  d’amour"},
{"t":"p","x":"qui sont des urgences du Royaume."},
{"t":"p","x":"Nous te le demandons par le Christ, notre Seigneur. Amen."}
]},
{id:"78",num:78,title:"Prière missionnaire",theme:"mission",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Père, Toi qui as répandu les dons de ton Esprit"},
{"t":"p","x":"sur la bienheureuse Vierge Marie,"},
{"t":"p","x":"qui priait avec les Apôtres au Cénacle,"},
{"t":"p","x":"aide nous à prier unanimement avec Marie, notre Mère,"},
{"t":"p","x":"pour porter au monde, par la force de l'Esprit,"},
{"t":"p","x":"la Bonne Nouvelle du salut."},
{"t":"p","x":"Par Jésus Christ, notre Seigneur. Amen."}
]},
{id:"79",num:79,title:"Pour l'Église",theme:"mission",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Seigneur,  qui, par l’amour envers les hommes, as prié"},
{"t":"p","x":"pour la foi de tes disciples, intercéde pour les pécheurs"},
{"t":"p","x":"et compatis à toutes les souffrances humaines."},
{"t":"p","x":"Accueille les supplications que nous élevons"},
{"t":"p","x":"en faveur de toute l'Église, écoute nos prières"},
{"t":"p","x":"pour la vie du monde et accueillenous tous"},
{"t":"p","x":"dans le bonheur du Royaume éternel,"},
{"t":"p","x":"où Tu vis et règnes pour les siècles des siècles. Amen."}
]},
{id:"80",num:80,title:"Pour une rencontre de misionnaires",theme:"mission",sub:"de la Congrégation",tags:[],lines:[
{"t":"p","x":"Seigneur Jésus, ton envoi en mission"},
{"t":"p","x":"nous a dispersés un jour par le monde entier."},
{"t":"p","x":"Ta Parole de communion nous rassemble aujourd'hui"},
{"t":"p","x":"en ce grand carrefour de chemins,"},
{"t":"p","x":"où nous trouver, c'est te retrouver,"},
{"t":"p","x":"où nous aimer, c'est te rendre témoignage,"},
{"t":"p","x":"où allumer l'espérance, c'est annoncer ta venue."},
{"t":"p","x":"Comme les douze, nous revenons vers toi"},
{"t":"p","x":"des sentiers de notre mission, et nous apportons devant toi"},
{"t":"p","x":"la souffrance et les humiliations de nos peuples,"},
{"t":"p","x":"la clameur des pauvres vers lesquels tu nous as envoyés,"},
{"t":"p","x":"1'espérance des humbles qui ont ouvert leur cœur"},
{"t":"p","x":"à ton message et l’ont fait fleurir en fraternité"},
{"t":"p","x":"un peu partout dans l'Église."},
{"t":"p","x":"Accordenous que, dans cette célébration de ta Parole,"},
{"t":"p","x":"nous apprenions à discerner dans la foi"},
{"t":"p","x":"les signes de ce temps, et à te proclamer,"},
{"t":"p","x":"au milieu des contradictions de ce monde,"},
{"t":"p","x":"que tu es la vérité totale, toujours nouvelle."},
{"t":"p","x":"Que ta présence parmi nous dissipe  le découragement"},
{"t":"p","x":"et nous pousse à opter, avec liberté et force,"},
{"t":"p","x":"pour ton plan de vie, de justice et de fraternité,"},
{"t":"p","x":"là où l'on poursuit des projets de destruction,"},
{"t":"p","x":"d'oppression et de violence."},
{"t":"p","x":"Envoie sur nous ton Esprit, pour qu’il fasse en nous,"},
{"t":"p","x":"comme il a fait en Marie, ta mère et notre mère :"},
{"t":"p","x":"qu’il crée en nous un cœur nouveau en allumant en nous"},
{"t":"p","x":"la charité apostolique. Qu’il nous aide à relever les défis"},
{"t":"p","x":"d’une nouvelle évangélisation,"},
{"t":"p","x":"féconde en oeuvres d'amour et de service"},
{"t":"p","x":"en faveur des plus nécessiteux."},
{"t":"p","x":"Que l’Esprit fasse de nous des instruments de communion,"},
{"t":"p","x":"afin que, partout où tu nous envoies,"},
{"t":"p","x":"la communauté de ceux qui croient en toi"},
{"t":"p","x":"soit transparence de ton dessein de salut"},
{"t":"p","x":"et glorifie ton nom. Amen."},
{"t":"p","x":"83.Nous voulons faire ta volonté"},
{"t":"p","x":"Père de bonté et de miséricorde: nous sommes ici réunis"},
{"t":"p","x":"au nom de l'amour dont tu nous aimes."},
{"t":"p","x":"Nous te louons, nous te bénissons et nous te rendons grâce."},
{"t":"p","x":"Nous répondons, avec joie,"},
{"t":"p","x":"à l'appel que tu nous adresses en ton Fils."},
{"t":"p","x":"Animés par la force de l'Esprit, nous te disons :"},
{"t":"p","x":"«Nous voulons faire ta volonté». Accordenous"},
{"t":"p","x":"un regard limpide, un esprit ouvert et un cœur  ardent"},
{"t":"p","x":"pour comprendre et embrasser"},
{"t":"p","x":"le dessein que tu as formé sur nous."},
{"t":"p","x":"Lorsque nous pensons à la mission que tu nous confies,"},
{"t":"p","x":"nous prenons conscience des exigences profondes"},
{"t":"p","x":"qu'il nous faut embrasser."},
{"t":"p","x":"Augmente en nous la générosité et l'espérance"},
{"t":"p","x":"et ouvrenous aux besoins les plus urgents des hommes."},
{"t":"p","x":"Que nous parvenions à exprimer par notre vie"},
{"t":"p","x":"l'amour universel de Jésus Christ,"},
{"t":"p","x":"le don inconditionnel et le total oubli de luimême,"},
{"t":"p","x":"qu'il a manifesté dans la réalisation de sa mission sur terre."},
{"t":"p","x":"Confirmenous dans la vérité,  donne-nous soif de ta justice"},
{"t":"p","x":"et fais de nous des instruments utiles de la paix."},
{"t":"p","x":"Fais de nous des forces vives de communion"},
{"t":"p","x":"en cette Église pèlerine, et que nous parvenions à être"},
{"t":"p","x":"témoins de la puissance souveraine du Christ ressuscité"},
{"t":"p","x":"au milieu de ce peuple qui souffre sa passion de liberté."},
{"t":"p","x":"Rends-nous responsables en toute action et engagement,"},
{"t":"p","x":"et ne permets pas que, en proclamant l'Évangile,"},
{"t":"p","x":"nous cherchions nos propres intérêts."},
{"t":"p","x":"Accordenous, Seigneur, la charité apostolique"},
{"t":"p","x":"de saint Antoine-Marie Claret, notre Père et fondateur."},
{"t":"p","x":"Enseignenous à discerner en tout temps, comme lui,"},
{"t":"p","x":"ce qui est pour toi le plus agréable, ce qui est juste"},
{"t":"p","x":"et tout ce qui construit ton Royaume parmi les hommes."},
