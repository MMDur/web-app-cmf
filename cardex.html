> "El criterio del estatuto científico de una teoría es su **falsabilidad, refutabilidad o contrastabilidad**. Toda contrastación genuina de una teoría es un intento de desmentirla o refutarla."

### Implicaciones para el marco teórico:
- Una teoría que lo explica absolutamente todo (como el psicoanálisis dogmático o el marxismo determinista según Popper) carece de poder predictivo real.
- Las proposiciones deben admitir *enunciados observacionales contradictorios*.
- **Fecha de revisión bibliográfica:** [12/10/2026]

### Tareas de verificación para el artículo:
- [x] Cotejar traducción con la versión inglesa de Routledge (1963).
- [x] Relacionar con el concepto de paradigma de Thomas Kuhn (1962).
- [ ] Redactar el subapartado 2.1 del ensayo introductorio.`},{id:`note-2`,createdAt:`2026-10-11T14:20:00.000Z`,updatedAt:`2026-10-14T09:45:00.000Z`,type:`concepto`,isFavorite:!0,isPinned:!1,attributes:{titulo:`El principio del Zettelkasten y la red de enlaces densos`,fecha:`2026-10-13`,fuente:`Luhmann, Niklas (1981). Kommunikation mit Zettelkästen. Universität Bielefeld`,ambito:`Metodología Científica`,tema:`Gestión del Conocimiento`},content:`# La nota atómica y el diálogo con el fichero

Niklas Luhmann estructuró más de 90.000 fichas interconectadas mediante identificadores alfanuméricos. El valor de cada ficha no radica en su aislamiento, sino en su **capacidad de conectar pensamientos no adyacentes**.

### Reglas esenciales de la ficha:
1. **Atomicidad:** Cada ficha debe contener una sola idea comprensible por sí misma.
2. **Autonomía:** Debe poder leerse sin consultar el libro original cinco años después.
3. **Atributos cruzados:** Registrar siempre *ámbito*, *fuente* y *tema* para permitir recuperaciones multivariables.

==Idea central: Escribir no es el resultado final del pensamiento; escribir es el medio a través del cual pensamos.==

| Dimensión | Enfoque lineal tradicional | Enfoque reticular (Fichero) |
| :--- | :--- | :--- |
| **Estructura** | Jerárquica y rígida | Hipertextual y emergente |
| **Crecimiento** | Límite por carpetas | Escalabilidad infinita |
| **Asociación** | Predefinida | Sorpresiva y creativa |`},{id:`note-3`,createdAt:`2026-10-13T08:00:00.000Z`,updatedAt:`2026-10-15T18:10:00.000Z`,type:`resumen`,isFavorite:!1,isPinned:!1,attributes:{titulo:`Sistemas de inferencia y sesgos cognitivos en juicio bajo incertidumbre`,fecha:`2026-10-14`,fuente:`Kahneman, Daniel & Tversky, Amos (1974). Judgment under Uncertainty: Heuristics and Biases. Science, 185(4157), 1124-1131`,ambito:`Neurociencia`,tema:`Heurísticas y Sesgos`},content:`# Tres heurísticas fundamentales en el razonamiento humano

El artículo seminal demuestra que las personas nos basamos en un número limitado de principios heurísticos que reducen las complejas tareas de evaluar probabilidades:

### 1. Representatividad
- Evaluación de probabilidad basada en la similitud con un estereotipo.
- Ignora la probabilidad previa (tasa base bayesiana) y la sensibilidad al tamaño muestral.

### 2. Disponibilidad
- La frecuencia de un evento se juzga por la facilidad con que surgen ejemplos en la memoria.
- Afectado por la notoriedad mediática y la vivacidad emocional.

### 3. Anclaje y ajuste
- Las estimaciones parten de un valor inicial arbitrario y se ajustan de manera insuficiente.

Para evitar sesgos interpretativos monometodológicos, adoptar cuatro tipos de triangulación:

- **Triangulación de datos:** Recoger testimonios en diferentes momentos temporales y contextos espaciales.
- **Triangulación de investigadores:** Dos analistas codifican de forma ciega el corpus textual.
- **Triangulación teórica:** Interpretar los hallazgos desde al menos dos marcos teóricos alternativos.
- **Triangulación metodológica:** Combinar diario de campo etnográfico con análisis de contenido asistido por computadora.

1. *Credibilidad* (validez interna)
