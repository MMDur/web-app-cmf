uestro camino formativo, el mismo Señor, que nos ha llamado, nos irá acompañando hasta el final: <i>Fiel es el que os llama y es Él quien lo hará<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"1\">1<\/sup>. Él es el único Maestro y nosotros somos sus discípulos. Los agentes a los que nos referimos a continuación adquieren su sentido referidos a Él. Los contemplamos siempre desde la experiencia carismática de nuestro Fundador.","n":"106","s":1},{"t":"h","l":3,"h":"1.1. El Espíritu que nos unge para la misión"},{"t":"p","h":"El primero y principal agente, sin el cual no hay posibilidad auténtica de seguimiento, es el Espíritu. Él nos impulsa a reconocer en Jesús al Señor<sup class=\"fn\" data-u=\"c3\" data-n=\"2\">2<\/sup> y hace que podamos llegar a configurarnos con Él. Para nosotros, <i>el Espíritu del Padre y del Hijo -Espíritu también de nuestra Madre- es el centro integrador de todas las dimensiones de nuestra vida y misión<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"3\">3<\/sup>. Es el mismo Espíritu que llamó y consagró a los profetas hasta hacer de ellos <i>boca de Di<\/i>os<sup class=\"fn\" data-u=\"c3\" data-n=\"4\">4<\/sup>, el que ungió y envió a Jesús para evangelizar a los pobres<sup class=\"fn\" data-u=\"c3\" data-n=\"5\">5<\/sup>. Él es el Paráclito que Jesús dona a su comunidad para que la acompañe siempre<sup class=\"fn\" data-u=\"c3\" data-n=\"6\">6<\/sup>. Los apóstoles, reunidos con la Madre de Jesús, fueron los primeros destinatarios de este don.","n":"107","s":1},{"t":"p","h":"El Espíritu es también el protagonista de la misión<sup class=\"fn\" data-u=\"c3\" data-n=\"7\">7<\/sup> y, por ello, el principal agente de la formación de los misioneros. Sólo en él adquirimos nuestra identidad como servidores de la Palabra<sup class=\"fn\" data-u=\"c3\" data-n=\"8\">8<\/sup>. Así lo experimentó Claret. Como Jesús, los profetas y los apóstoles, nuestro Fundador se sintió ungido por el Espíritu<sup class=\"fn\" data-u=\"c3\" data-n=\"9\">9<\/sup> para anunciar la Buena Nueva a todos los hombres.","n":"108","s":1},{"t":"p","h":"La acción del Espíritu en nuestro itinerario formativo es de un orden diferente a los datos de la psicología o de la historia visible, aunque se manifiesta también a través de ellos<sup class=\"fn\" data-u=\"c3\" data-n=\"10\">10<\/sup>. Es principio de vida interior, de creatividad y de comunión. Unifica la vida del formando y recrea la comunidad formativa como comunidad de profetas y apóstoles. Su acción creadora y renovadora afecta a nuestro centro personal, cambia nuestra visión de la realidad y nos ofrece la clave y la fuerza imprescindibles para vivirla desde Dios en referencia permanente a Jesucristo y al mundo. Aunque no podemos conocerla con precisión, percibimos sus frutos.","n":"109","s":1},{"t":"p","h":"El Espíritu que nos configura con Cristo es el que nos llama a seguirlo y nos unge para la misión que el Padre nos encomienda, nos hace gustar, apreciar, juzgar y elegir todo lo que guarda relación con Jesús y su Reino. Es el que viene en ayuda de nuestra debilidad cuando experimentamos las dificultades del camino<sup class=\"fn\" data-u=\"c3\" data-n=\"11\">11<\/sup>. Es, en definitiva, el «maestro interior» que, en nuestro seguimiento de Cristo, nos va guiando hasta la verdad completa<sup class=\"fn\" data-u=\"c3\" data-n=\"12\">12<\/sup>, nos otorga la fuerza que nos permite entregar la vida para que sea anunciada la Buena Nueva del Reino a los pobres y afrontar las dificultades de la evangelización.","n":"110","s":1},{"t":"p","h":"Para acoger y secundar la actuación del Espíritu en nosotros necesitamos desarrollar algunas actitudes fundamentales. Por una parte, la apertura, la humildad, la docilidad y el talante de discípulos que se dejan enseñar. Y, por otra, la práctica del discernimiento para poder clarificar la vocación, ajustar el propio camino formativo, y reconocer su presencia en todos los aspectos de la vida y de la historia y a través de las mediaciones humanas<sup class=\"fn\" data-u=\"c3\" data-n=\"13\">13<\/sup>. La unción del Espíritu, que habita en nosotros, nos capacita y nos hace ministros idóneos para anunciar la Palabra, <i>exige de nosotros un compromiso constante que se realiza cuando la experiencia del Señor y el encuentro con los otros, sobre todo con los más pobres y sufridos, van transformando nuestra vida<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"14\">14<\/sup>.","n":"111","s":1},{"t":"h","l":3,"h":"1.2. María, formadora de los misioneros en la fragua de su Corazón"},{"t":"p","h":"A la obra del Espíritu está asociada la Virgen María, la primera consagrada a la causa de su Hijo<sup class=\"fn\" data-u=\"c3\" data-n=\"15\">15<\/sup>. Por eso, su presencia en la formación de los llamados al seguimiento de Cristo es determinante. Para nosotros, que nos llamamos y somos Hijos de su Corazón Inmaculado, la acción de María cobra un relieve particular. Esta filiación no es solamente un título<sup class=\"fn\" data-u=\"c3\" data-n=\"16\">16<\/sup>, sino una dimensión existencial de nuestra vida misionera<sup class=\"fn\" data-u=\"c3\" data-n=\"17\">17<\/sup>. Es un don del Espíritu Santo para ser vivido y experimentado, que configura nuestro ser interior y lo dinamiza en orden a la misión apostólica<sup class=\"fn\" data-u=\"c3\" data-n=\"18\">18<\/sup>.","n":"112","s":1},{"t":"p","h":"La presencia de María en el Fundador y en la Congregación es una experiencia carismática peculiar. Dentro del misterio de la Iglesia, de la que Ella es Madre, María es para los claretianos:","n":"113","s":1},{"t":"p","h":"a. La Fundadora de la Congregación<sup class=\"fn\" data-u=\"c3\" data-n=\"19\">19<\/sup>. María funda una Congregación misionera y apostólica al servicio de la Iglesia.","n":"113"},{"t":"p","h":"b. Nuestra Madre. Nos llamamos y somos hijos de su Corazón Inmaculado. En nuestra espiritualidad, María actúa como madre y nosotros nos relacionamos con ella como hijos<sup class=\"fn\" data-u=\"c3\" data-n=\"20\">20<\/sup>. <i>Como el discípulo amado, acogemos como Madre a María en nuestra casa<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"21\">21<\/sup><i>.<\/i>","n":"113"},{"t":"p","h":"c. Nuestra formadora. Con su acción maternal forma en nosotros verdaderos y auténticos misioneros y apóstoles, tal como Ella engendró a Jesús y lo formó como misionero del Padre y tal como formó a Claret, misionero apostólico. Más en concreto, María con su acción maternal nos forma, a través de un proceso interior, como ministros de la Palabra, como evangelizadores para extender el Reino de Jesús por todo el mundo. Es también la madrina que nos acompaña en el crecimiento de la fe<sup class=\"fn\" data-u=\"c3\" data-n=\"22\">22<\/sup>.","n":"113"},{"t":"p","h":"d. Nuestro modelo: Nuestra herencia carismática nos define como oyentes y servidores de la Palabra<sup class=\"fn\" data-u=\"c3\" data-n=\"23\">23<\/sup>. María es en esto nuestro modelo. Nosotros, como María, como hijos de su Corazón, queremos acoger y meditar la Palabra en nuestros corazones y proclamarla con pasión<sup class=\"fn\" data-u=\"c3\" data-n=\"24\">24<\/sup>.","n":"113"},{"t":"p","h":"María nos forma en la fragua de su corazón, en la fragua de su amor y misericordia<sup class=\"fn\" data-u=\"c3\" data-n=\"25\">25<\/sup>. Con su presencia y su acción formadora:","n":"114","s":1},{"t":"p","h":"a. Nos configura en su corazón haciendo crecer en nosotros los rasgos del perfecto discípulo de Jesús, a quien concibió antes en su corazón que en su seno.","n":"114"},{"t":"p","h":"b. Nos forma para acoger en nuestros corazones, como Ella lo hizo, la Palabra de Dios, de la cual somos ministros. Nos enseña a escucharla, a meditarla, a hacerla vida y a anunciarla por todo el mundo.","n":"114"},{"t":"p","h":"c. Nos forma aquella caridad apostólica que nos impulsa a trabajar sin descanso hasta desgastarnos por el Reino; que anuncia a un Dios que es amor y misericordia y que ha dado su vida por nosotros; que nos hace anunciar el Evangelio con un sello de humildad, mansedumbre y cordialidad o amor materno<sup class=\"fn\" data-u=\"c3\" data-n=\"26\">26<\/sup> y que nos mueve a amar a los predilectos del Señor, a los más pobres y necesitados, a los que más necesitan de salvación y liberación.","n":"114"},{"t":"p","h":"d. Nos asocia en la misión apostólica a su oficio maternal en la Iglesia<sup class=\"fn\" data-u=\"c3\" data-n=\"27\">27<\/sup>. El Fundador se sintió colaborador de María, la madre victoriosa, en la lucha contra el maligno y su descendencia. Se sintió instrumento de María, como una saeta en sus manos para ser arrojada contra Satanás y sus secuaces<sup class=\"fn\" data-u=\"c3\" data-n=\"28\">28<\/sup>. Desde esta vivencia, transmitida a sus misioneros, a quienes veía como los <i>brazos de María<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"29\">29<\/sup>, pudo decirnos, glosando el Evangelio según San Mateo: <i>No sois vosotros quienes habláis entonces sino el Espíritu de vuestro Padre y de vuestra Madre, el cual habla por vosotros<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"30\">30<\/sup>.","n":"114"},{"t":"p","h":"La entrega filial y apostólica al Inmaculado Corazón de María, que realizamos en nuestra profesión, se plasma y se desarrolla mediante algunas actitudes que van configurando nuestra vida:","n":"115","s":1},{"t":"p","h":"a. Encontrar en Ella a la persona que inspira la síntesis vital que ha de elaborar cada formando a lo largo del proceso formativo hasta llegar a la plena unidad interior<sup class=\"fn\" data-u=\"c3\" data-n=\"31\">31<\/sup>.","n":"115"},{"t":"p","h":"b. Acogerla como madre, maestra y formadora<sup class=\"fn\" data-u=\"c3\" data-n=\"32\">32<\/sup> y amarla como hijos, discípulos y apóstoles.","n":"115"},{"t":"p","h":"c. Imitarla en aquellas actitudes evangélicas en las que se muestra como la primera evangelizada y evangelizadora: su fe, su sentido de alabanza y de acción de gracias, su actitud de escucha y de disponibilidad, su interioridad, su sensibilidad ante las necesidades del pueblo, especialmente de los más pobres, su solidaridad en el dolor y la esperanza.","n":"115"},{"t":"p","h":"d. Imitarla en los comportamientos más típicamente misioneros: el modo de vivir como Jesús<sup class=\"fn\" data-u=\"c3\" data-n=\"33\">33<\/sup>, abrazando en fe los consejos evangélicos<sup class=\"fn\" data-u=\"c3\" data-n=\"34\">34<\/sup>, la acogida, la meditación, el anuncio de la Palabra de Dios, el sentido de la cruz y la formación de la comunidad cristiana como familia del Reino.","n":"115"},{"t":"p","h":"e. Descubrirla como mujer consagrada que se transparenta en las mujeres comprometidas de nuestro pueblo y en la vida y fe de la gente.","n":"115"},{"t":"p","h":"f. Venerarla a través del culto litúrgico, de las devociones marianas, especialmente las de tradición congregacional<sup class=\"fn\" data-u=\"c3\" data-n=\"35\">35<\/sup> y de las manifestaciones de la religiosidad popular.","n":"115"},{"t":"p","h":"g. Proclamarla bienaventurada, anunciando en nuestro apostolado la misión de María dentro del misterio de Cristo<sup class=\"fn\" data-u=\"c3\" data-n=\"36\">36<\/sup> y de la Iglesia.","n":"115"},{"t":"h","l":3,"h":"1.3. La Iglesia"},{"t":"p","h":"El seguimiento de Cristo misionero se realiza de manera plena y auténtica en la Iglesia, Sacramento de salvación para nuestro mundo<sup class=\"fn\" data-u=\"c3\" data-n=\"37\">37<\/sup>. El claretiano cultiva su fe en Dios dentro de la Iglesia y vive en comunión con el pueblo de Dios preparándose para ser eficaz auxiliar de sus pastores<sup class=\"fn\" data-u=\"c3\" data-n=\"38\">38<\/sup>. El claretiano profesa públicamente los consejos evangélicos como expresión de la vida y la santidad de la Iglesia<sup class=\"fn\" data-u=\"c3\" data-n=\"39\">39<\/sup> y, en fidelidad a ella, participa en su misión a través del testimonio de vida y del trabajo apostólico, desde el propio carisma.","n":"116","s":1},{"t":"p","h":"En cuanto agente formativo, la Iglesia, “madre y maestra”, acoge el don de la vocación claretiana y provee los medios adecuados para que el formando se prepare a asumir la misión que se le ha encomendado. En la formación para la misión, desempeñan un rol importantísimo tanto los fieles laicos, como otros religiosos y religiosas, junto con los pastores del Pueblo de Dios. Su magisterio nos alienta y su mandato legitima nuestro envío misionero<sup class=\"fn\" data-u=\"c3\" data-n=\"40\">40<\/sup>.","n":"117","s":1},{"t":"p","h":"En su proceso de crecimiento como discípulo misionero<sup class=\"fn\" data-u=\"c3\" data-n=\"41\">41<\/sup>, el claretiano es ayudado por la Iglesia para:","n":"118","s":1},{"t":"p","h":"a. Ser testigo del sentido de la presencia de Dios en el mundo.","n":"118"},{"t":"p","h":"b. Progresar en el conocimiento de la fe católica.","n":"118"},{"t":"p","h":"<i>c. Sentir con la Iglesia<\/i> en su amor por la verdad y la salvación de la humanidad.","n":"118"},{"t":"p","h":"d. Fomentar el espíritu misionero y ecuménico;","n":"118"},{"t":"p","h":"e. Propiciar la búsqueda de la justicia y la paz.","n":"118"},{"t":"p","h":"f. Comprender el sentido misionero de la obediencia y colaboración con los pastores.","n":"118"},{"t":"p","h":"g. Acrecentar el espíritu profético de su vida y misión.","n":"118"},{"t":"p","h":"h. Asumir convencidamente la opción por los pobres.","n":"118"},{"t":"p","h":"i. Transparentar el compromiso con la reconciliación y el perdón.","n":"118"},{"t":"p","h":"j. Ser protectores de la <i>casa común<\/i> en actitud de <i>conversión ecológica<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"42\">42<\/sup>.","n":"118"},{"t":"h","l":3,"h":"1.4. La persona en formación, protagonista de su proceso"},{"t":"p","h":"La formación concierne, directamente y, en primer término, a la persona. Sólo ella puede llevar a cabo el proceso de crecimiento interiorizando los valores que sustentan su vida, personalizando las relaciones y asumiendo positivamente los acontecimientos. Por eso, el primer responsable de su formación es la propia persona<sup class=\"fn\" data-u=\"c3\" data-n=\"43\">43<\/sup>.","n":"119","s":1},{"t":"p","h":"Ser una persona en formación es ser discípulo en la escuela del seguimiento, aprendiz en el taller en el que se forja el misionero. Es propio del aprendiz <i>hacer lo mismo<\/i>, es decir, imitar. Es la vía maestra de la formación, del crecimiento<sup class=\"fn\" data-u=\"c3\" data-n=\"44\">44<\/sup>. Ser aprendiz implica seguir activa y personalmente los pasos del Maestro.","n":"120","s":1},{"t":"p","h":"Esto supone en la persona en formación, no sólo la observancia exterior de las normas y la adaptación a las situaciones, sino, sobre todo, la capacidad de discernimiento y de asunción consciente de los valores y la motivación interior que enriquece las actitudes y comportamientos. La aceptación de la comunidad verifica y expresa la verdad del crecimiento personal<sup class=\"fn\" data-u=\"c3\" data-n=\"45\">45<\/sup>.","n":"121","s":1},{"t":"p","h":"La responsabilidad de la persona en formación abarca todo lo que, directa o indirectamente, puede afectar a su propia formación. Debe, con todo, prestar una atención especial a:","n":"122","s":1},{"t":"p","h":"a. Cultivar la docilidad al Espíritu, abriéndole la mente y el corazón.","n":"122"},{"t":"p","h":"b. Discernir si ha recibido el mismo don carismático de Claret<sup class=\"fn\" data-u=\"c3\" data-n=\"46\">46<\/sup> y con el cual sus misioneros se sienten identificados.","n":"122"},{"t":"p","h":"c. Dejarse forjar en la fragua del Corazón de María.","n":"122"},{"t":"p","h":"d. Examinar la sinceridad de su intención<sup class=\"fn\" data-u=\"c3\" data-n=\"47\">47<\/sup> y la autenticidad de sus motivaciones, purificando éstas, si hubiera lugar.","n":"122"},{"t":"p","h":"e. Conocer y desarrollar sus aptitudes en la línea de nuestra misión.","n":"122"},{"t":"p","h":"f. Promover la armonía de su ser recurriendo a su conciencia, allí donde se encuentra solo con Dios, cuya voz resuena en su propia intimidad<sup class=\"fn\" data-u=\"c3\" data-n=\"48\">48<\/sup>. Ha de apelar a ella y a su responsabilidad, sobre todo para interiorizar y personalizar los valores de nuestra vida misionera tal como se proponen en nuestras Constituciones y en los planes de formación.","n":"122"},{"t":"p","h":"g. Tener espíritu de iniciado para aceptar las mediaciones que el Señor pone al servicio de su desarrollo; también para aprender de ellas, de la tradición de la Iglesia y de la Congregación.","n":"122"},{"t":"p","h":"h. Vivir su formación como un proceso que dura toda la vida y que exige una respuesta al Señor <i>siempre atenta, nueva y responsable<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"49\">49<\/sup>.","n":"122"},{"t":"p","h":"i. Respetar los ritmos de su propia maduración y resolver adecuadamente, conforme van apareciendo, las posibles crisis, los conflictos conscientes e inconscientes y las tensiones.","n":"122"},{"t":"p","h":"j. Superar los obstáculos en el desarrollo responsable de su persona, a fin de <i>formar un corazón libre para aprender de la historia de cada día durante toda la vida<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"50\">50<\/sup>.","n":"122"},{"t":"p","h":"k. Usar los medios adecuados para salvaguardar la salud física, mental y espiritual.","n":"122"},{"t":"p","h":"l. Sentirse corresponsable en la formación de sus hermanos.","n":"122"},{"t":"p","h":"El reconocimiento del misionero como protagonista de su formación:","n":"123","s":1},{"t":"p","h":"a. Reclama una pedagogía de la confianza en la que él tenga garantizado un amplio y adecuado margen de libertad responsable.","n":"123"},{"t":"p","h":"b. Requiere, en la práctica, <i>un justo equilibrio entre la formación del grupo y la de cada persona, entre el respeto a los tiempos previstos para cada fase de la formación y su adaptación al ritmo formativo de cada uno<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"51\">51<\/sup>, entre la personalidad de cada uno, la solidaridad comunitaria y el cumplimiento de la misión recibida con y en la comunidad.","n":"123"},{"t":"h","l":3,"h":"1.5. Los formadores, los equipos formativos y los mentores"},{"t":"p","h":"Entendemos por formadores aquellos sobre quienes recae una responsabilidad inmediata sobre la formación integral de los misioneros en formación inicial. Los mentores son aquellos que acompañan a los misioneros en formación permanente (como directores, acompañantes espirituales, etc.) para que progresen en el proceso de configuración con Cristo al estilo de Claret<sup class=\"fn\" data-u=\"c3\" data-n=\"52\">52<\/sup>. Su tarea específica se articula con las de los demás misioneros dentro de la única y común misión claretiana. A través de los formadores y los mentores actúa el Espíritu de Jesús. Por eso, vivir a la escucha del Espíritu y estar atentos a sus mociones e inspiraciones ha de ser una actitud permanente tanto por su parte como por parte de la persona en formación.","n":"124","s":1},{"t":"p","h":"Para ejercer eficazmente su ministerio, los formadores han de poseer algunas cualidades específicas:","n":"125","s":1},{"t":"p","h":"a. Capacidad humana de intuición y de acogida<sup class=\"fn\" data-u=\"c3\" data-n=\"53\">53<\/sup>.","n":"125"},{"t":"p","h":"b. Experiencia madura de Dios y de la oración<sup class=\"fn\" data-u=\"c3\" data-n=\"54\">54<\/sup>.","n":"125"},{"t":"p","h":"c. Apertura para formar equipo con otros formadores<sup class=\"fn\" data-u=\"c3\" data-n=\"55\">55<\/sup> y disponibilidad para participar en las iniciativas congregacionales en el campo formativo.","n":"125"},{"t":"p","h":"d. Amor a la Iglesia, a su tradición apostólica y a su liturgia.","n":"125"},{"t":"p","h":"e. Amor a la Congregación y conocimiento suficiente de su historia.","n":"125"},{"t":"p","h":"f. Sensibilidad y experiencia pastoral<sup class=\"fn\" data-u=\"c3\" data-n=\"56\">56<\/sup>, identificándose con las opciones y sujetos preferenciales de nuestra misión<sup class=\"fn\" data-u=\"c3\" data-n=\"57\">57<\/sup>.","n":"125"},{"t":"p","h":"g. Adecuada competencia cultural y psico-pedagógica<sup class=\"fn\" data-u=\"c3\" data-n=\"58\">58<\/sup>.","n":"125"},{"t":"p","h":"h. Disponibilidad de tiempo y buena voluntad para acompañar a cada formando y no sólo al grupo<sup class=\"fn\" data-u=\"c3\" data-n=\"59\">59<\/sup> y recta comprensión de su responsabilidad en el acompañamiento espiritual<sup class=\"fn\" data-u=\"c3\" data-n=\"60\">60<\/sup>.","n":"125"},{"t":"p","h":"Las funciones del formador y del equipo de formadores, con respecto a cada formando en particular y al grupo en su conjunto, son:","n":"126","s":1},{"t":"p","h":"a. Discernir con los formandos la obra que Dios va realizando en ellos y los caminos por los cuales los quiere hacer avanzar.","n":"126"},{"t":"p","h":"b. Acompañarlos en sus distintas etapas de crecimiento, conociendo y respetando su ritmo y potencialidades, y ofreciéndoles en cada momento la ayuda necesaria para su desarrollo.","n":"126"},{"t":"p","h":"c. Proporcionarles en cada fase sólidos elementos doctrinales y prácticos, que respondan a sus necesidades personales, a las exigencias del momento presente, y a sus responsabilidades futuras.","n":"126"},{"t":"p","h":"d. Evaluar los resultados obtenidos y juzgar si poseen las capacidades exigidas por la Iglesia y la Congregación<sup class=\"fn\" data-u=\"c3\" data-n=\"61\">61<\/sup>.","n":"126"},{"t":"p","h":"Claret fue formador de misioneros por su testimonio, por la presencia y la convivencia con los misioneros cuando le fue posible, y a través de su palabra en los ejercicios espirituales, en las conferencias, en las conversaciones y en los escritos. Del mismo modo, el formador ha de educar no sólo con la palabra, sino, sobre todo, con su propia vida, pudiendo decir como San Pablo: <i>Seguid mi ejemplo como yo sigo el de Cristo<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"62\">62<\/sup>.","n":"127","s":1},{"t":"p","h":"Para que la tarea formativa sea más completa, es conveniente que exista en nuestros centros, un equipo de formadores con capacidades complementarias, cuyos miembros, conscientes de su responsabilidad común, obren concordemente. Bajo la dirección del superior deben vivir en estrecha comunión de espíritu, formando entre sí y con aquellos que han de educar, una familia unida. Este equipo de formadores, que podrían proceder de distintas culturas y mentalidades, ha de actuar siempre bajo la responsabilidad principal de uno de ellos<sup class=\"fn\" data-u=\"c3\" data-n=\"63\">63<\/sup>.","n":"128","s":1},{"t":"p","h":"Los formadores necesitan una preparación específica, que sea verdaderamente técnica, pedagógica, espiritual, humana, teológica y pastoral, para realizar eficazmente sus tareas<sup class=\"fn\" data-u=\"c3\" data-n=\"64\">64<\/sup>. Además de la preparación previa al comienzo de su cargo<sup class=\"fn\" data-u=\"c3\" data-n=\"65\">65<\/sup>, precisan una formación permanente que les ayude a superar la rutina y, sobre todo, que les permita una renovación continúa teniendo en cuenta la experiencia vivida<sup class=\"fn\" data-u=\"c3\" data-n=\"66\">66<\/sup>. Esta experiencia se convierte en fuente formativa, con tal de que sea sometida a constante y fraterna evaluación. El intercambio con otros formadores, el análisis de situaciones y problemas formativos concretos, la consulta a expertos, el conocimiento actualizado del mundo juvenil, los encuentros breves o los programas sistemáticos dedicados a la actualización teológica y pedagógica, las experiencias apostólicas y a la renovación espiritual permitirán a los formadores evaluar su tarea y disponerse para seguir realizándola más fructuosamente<sup class=\"fn\" data-u=\"c3\" data-n=\"67\">67<\/sup>.","n":"129","s":1},{"t":"p","h":"Para que los formadores puedan desempeñar con dedicación y fruto sus funciones deben estar libres de las obligaciones y cargos que se lo impidan<sup class=\"fn\" data-u=\"c3\" data-n=\"68\">68<\/sup>.","n":"130","s":1},{"t":"h","l":3,"h":"1.6. La comunidad formativa"},{"t":"p","h":"La formación es también obra de la comunidad. En ella está implicada toda la Congregación<sup class=\"fn\" data-u=\"c3\" data-n=\"69\">69<\/sup>. Pero es la comunidad formativa la que tiene como finalidad directa la formación inicial. Debe, pues, esforzarse por alcanzar los objetivos del plan de formación, preocupándose particularmente de:","n":"131","s":1},{"t":"p","h":"a. Ser, ante todo, comunidad de vida<sup class=\"fn\" data-u=\"c3\" data-n=\"70\">70<\/sup>, ámbito de fraternidad, de oración<sup class=\"fn\" data-u=\"c3\" data-n=\"71\">71<\/sup>, de trabajo apostólico<sup class=\"fn\" data-u=\"c3\" data-n=\"72\">72<\/sup> y, por lo mismo, de pertenencia congregacional.","n":"131"},{"t":"p","h":"b. Facilitar, ya desde su conformación, el carácter intercultural que la dispone para la misión universal.","n":"131"},{"t":"p","h":"c. Crear vínculos que faciliten la maduración afectiva, fomentando relaciones interpersonales basadas en la fe y en la caridad, que preparen también para el trabajo en equipo y para la colaboración misionera que el Fundador buscaba<sup class=\"fn\" data-u=\"c3\" data-n=\"73\">73<\/sup>.","n":"131"},{"t":"p","h":"d. Ayudar a cada uno a cumplir fielmente la propia responsabilidad mediante el servicio personal<sup class=\"fn\" data-u=\"c3\" data-n=\"74\">74<\/sup>.","n":"131"},{"t":"p","h":"e. Contribuir al proceso gradual de integración entre la formación inicial y la permanente.","n":"131"},{"t":"p","h":"f. Emplear el diálogo como instancia de discernimiento y corresponsabilidad, y estimular el crecimiento de las personas y del grupo.","n":"131"},{"t":"p","h":"g. Aceptar la cruz de una fraternidad que se construye también en la prueba y la tribulación, llevando los unos las cargas de los otros<sup class=\"fn\" data-u=\"c3\" data-n=\"75\">75<\/sup>.","n":"131"},{"t":"h","l":3,"h":"1.7. Otros agentes"},{"t":"p","h":"Además de los que forman parte de las comunidades formativas, existen también diversos agentes que, <i>en misión compartida<\/i>, intervienen en la formación inicial con tareas complementarias: profesores, directores espirituales, confesores, asesores pastorales, familias y otros. La participación de algunos seglares, hombres y mujeres, que ofrezcan aportaciones específicas, desde la experiencia, la psicología u otras ciencias, es necesaria para la formación integral de los formandos. Durante todos los procesos formativos el <i>hacer con otros<\/i> expresa nuestro <i>estilo de vida<\/i> misionera<sup class=\"fn\" data-u=\"c3\" data-n=\"76\">76<\/sup>.","n":"132","s":1},{"t":"p","h":"Los profesores, incluso los que ejercen su tarea en centros académicos no pertenecientes a la Congregación, deben ser considerados verdaderamente formadores<sup class=\"fn\" data-u=\"c3\" data-n=\"77\">77<\/sup>, ya que la formación doctrinal que imparten no debe tender a la mera transmisión de conocimientos sino a una educación integral de los alumnos<sup class=\"fn\" data-u=\"c3\" data-n=\"78\">78<\/sup>, que cree en ellos una sólida mentalidad de fe para anunciar el Evangelio y servir al Pueblo de Dios<sup class=\"fn\" data-u=\"c3\" data-n=\"79\">79<\/sup>. Esto significa que, para realizar adecuadamente su tarea, los profesores deben:","n":"133","s":1},{"t":"p","h":"a. Poseer la idoneidad suficiente para vivir de manera integrada su condición de testigos de la fe, su celo apostólico y su competencia científica y didáctica.","n":"133"},{"t":"p","h":"b. Tomar conciencia de su responsabilidad formativa, que, a veces, puede ser más decisiva que la de los otros formadores<sup class=\"fn\" data-u=\"c3\" data-n=\"80\">80<\/sup>.","n":"133"},{"t":"p","h":"c. Transmitir íntegra la doctrina, con profundidad y sentido crítico.","n":"133"},{"t":"p","h":"d. Ayudar a los alumnos, dentro de un clima de mutua colaboración, a fundamentar, a través del estudio, su vocación misionera.","n":"133"},{"t":"h","l":2,"h":"2. LOS MODELOS INSPIRADORES"},{"t":"p","h":"Siguiendo el ejemplo de Claret<sup class=\"fn\" data-u=\"c3\" data-n=\"81\">81<\/sup>, el primer modelo inspirador de nuestra vida es Jesucristo. La unión y configuración con Cristo, el evangelizador, ungido y enviado a anunciar la Buena Nueva a los pobres, es un proceso y una tarea que dura toda la vida. Otros modelos inspiradores en esta aventura del seguimiento de Cristo son para nosotros María, nuestro Fundador, los profetas, los apóstoles, muchos santos y santas con carisma apostólico, misioneros de ayer y de hoy, mártires claretianos y otros mártires.","n":"134","s":1},{"t":"h","l":3,"h":"2.1. El Fundador"},{"t":"h","l":4,"h":"<i>2.1.1. Claret como modelo carismático<\/i>"},{"t":"p","h":"Al reconocer a Claret como fundador y al aprobar la Congregación por él fundada como una prolongación de su espíritu y misión, la Iglesia ha reconocido su carisma apostólico como una forma de vida cristiana que puede ser compartida por muchos y ser provechosa para el Pueblo de Dios hasta el fin de los tiempos. Una responsabilidad de la Congregación, dentro de la Iglesia, consiste en conservar en ella, de manera viva y eficaz, el carisma de San Antonio María Claret<sup class=\"fn\" data-u=\"c3\" data-n=\"82\">82<\/sup>.","n":"135","s":1},{"t":"p","h":"Los claretianos de hoy, como los de ayer, que vivimos en un contexto cultural diferente y en una situación muy diversa a la de nuestro Fundador, nos sentimos agraciados con su carisma y espíritu, con el ejemplo de su vida y con sus escritos. No podemos copiar de forma literal sus métodos y medios misioneros ni sus actitudes y modelos de conducta. Se requiere creatividad, originalidad y espontaneidad en nuestra formación misionera para actualizar este espíritu.","n":"136","s":1},{"t":"h","l":4,"h":"<i>2.1.2. La Autobiografía como itinerario claretiano<\/i>"},{"t":"p","h":"Claret escribió la Autobiografía por mandato expreso del P. Xifré, su director espiritual y entonces Superior General de la Congregación<sup class=\"fn\" data-u=\"c3\" data-n=\"83\">83<\/sup>. Sin tal mandato no se le hubiera ocurrido un intento semejante, puesto que una obra de este género resultaba extraña a su carácter y temperamento. Una vez comenzada la obra, se dio cuenta de que podía resultar provechosa para sus hijos misioneros. La escribió, pues, con un deliberado propósito formativo. La escribió como Fundador para los misioneros de su Congregación<sup class=\"fn\" data-u=\"c3\" data-n=\"84\">84<\/sup>. Se trata de un documento testimonial y pedagógico<sup class=\"fn\" data-u=\"c3\" data-n=\"85\">85<\/sup>.","n":"137","s":1},{"t":"p","h":"El testimonio de la vida de Claret es útil para iniciarnos en una panorámica sobre el modo como el Espíritu va formando al misionero desde el principio de la llamada hasta su plenitud. En este sentido, <i>se trata de un verdadero manual de espiritualidad misionera que introduce en la experiencia de una vida dedicada al Evangelio<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"86\">86<\/sup>.","n":"138","s":1},{"t":"p","h":"La relectura carismática de la Autobiografía de Claret nos obliga discernir entre lo que pertenece al carisma y espíritu que transmitió a la Congregación - y, por lo tanto, es válido siempre para nosotros - y lo que pueden ser dones sólo personales o producto de su cultura y de su tiempo. Hay rasgos que pertenecen a su psicología personal o a su ambiente y que no se pueden transmitir a toda la Congregación; pero esto no impide usar la Autobiografía como medio pedagógico en la formación de las diversas generaciones claretianas.","n":"139","s":1},{"t":"h","l":4,"h":"<i>2.1.3. La Fragua como propuesta pedagógica<\/i>"},{"t":"p","h":"Nuestro Fundador vivió a lo largo de su vida misionera una singular experiencia de Dios que lo capacitó para dedicarse plenamente al anuncio del Evangelio. Ese don del Espíritu se nos concede también a nosotros para llegar a ser ministros idóneos de la Palabra.","n":"140","s":1},{"t":"p","h":"La descripción alegórica del proceso formativo que Claret mismo vivió se encuentra en su Autobiografía: <i>En un principio que estaba en Vich pasaba en mí lo que en un taller de cerrajero, que el Director mete la barra de hierro en la fragua y cuando está bien caldeado lo saca y lo pone sobre el yunque y empieza a descargar golpes con el martillo; el ayudante hace lo mismo, y los dos van alternando y como a compás van descargando martillazos y van machacando hasta que toma la forma que se ha propuesto el Director<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"87\">87<\/sup>. Esta alegoría no es una más entre las muchas usadas por Claret. De hecho, en la oración que solía rezar al comienzo de las misiones, le recordaba a María: <i>Bien sabéis que soy hijo y ministro vuestro, formado por Vos misma en la fragua de vuestra misericordia y amor<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"88\">88<\/sup>.","n":"141","s":1},{"t":"p","h":"Como en toda alegoría, también en el caso de la fragua cada uno de los elementos simbólicos se corresponde con uno o varios de la realidad. Así, el <i>taller del cerrajero<\/i> es el ambiente formativo de Vic; el <i>director<\/i> es el Padre, Cristo, María y los diversos responsables formativos; la <i>barra de hierro<\/i> es Claret mismo en cuanto sujeto pasivo, en cuanto discípulo que se deja moldear; la <i>fragua<\/i> es, sobre todo, el Espíritu Santo, pero también el Corazón de María y diversos medios ascéticos como la oración y los ejercicios espirituales; el <i>yunque<\/i> representa las situaciones y pruebas de la vida; el <i>ayudante<\/i> es, de nuevo, Claret en cuanto sujeto activo; los <i>martillazos<\/i> equivalen a las diversas acciones formativas; la <i>forma<\/i> que se ha propuesto el director no es otra que Cristo mismo. Se tiene, así, preparada la <i>saeta<\/i> que debe ser lanzada contra los enemigos del Evangelio.","n":"142","s":1},{"t":"p","h":"En el proceso descrito por la alegoría se simbolizan también los núcleos básicos que Claret vivió, con acentos diferentes, a lo largo de su vida.","n":"143","s":1},{"t":"p","h":"a. El primero (<i>Quid Prodest<\/i>) se refiere a la relativización del mundo y al descubrimiento de Dios como el único absoluto, tal como aparece en Mt 16,26: <i>¿De qué le sirve al hombre ganar el mundo entero si arruina su vida?<\/i>","n":"143"},{"t":"p","h":"b. El segundo (<i>Patris Mei<\/i>) es la experiencia del amor de Dios, comunicado por su Espíritu, cuya expresión sintética la encuentra Claret en Lc 2,49: <i>Debo ocuparme en las cosas que miran al servicio de mi Padre<\/i>.","n":"143"},{"t":"p","h":"c. El tercero (<i>Caritas Christi<\/i>) es la experiencia de la imitación, seguimiento y configuración con el Cristo enviado por el Padre, nacido de María y ungido por el Espíritu, sintetizada en 2 Cor 5,14: <i>La caridad de Cristo me urge<\/i>.","n":"143"},{"t":"p","h":"d. El cuarto (<i>Spiritus Domini<\/i>) es la experiencia de sentirse ungido y enviado por el Espíritu para anunciar, como Jesús, el Evangelio a los pobres, resaltada en Lc 4,18: <i>El Espíritu del Señor está sobre mí ... Me ha enviado a anunciar la Buena Nueva a los pobres.<\/i>","n":"143"},{"t":"p","h":"Para nosotros esta alegoría cobra un especial relieve formativo cuando la interpretamos no aisladamente sino en el conjunto de la vida de nuestro Fundador. Sólo así podemos encontrar sintetizados en ella los núcleos fundamentales del carisma e incluso el proceso pedagógico para vivirlo. No se trata de reproducir sin más una experiencia que es, de suyo, intransferible sino de servirnos de una expresión breve y simbólica que puede favorecer la transmisión y profundización del carisma en nuestra formación actual. Así entendida, se convierte para nosotros en símbolo del taller en el que nos forjamos como misioneros a lo largo de nuestra vida.","n":"144","s":1},{"t":"h","l":4,"h":"<i>2.1.4. Los santos <\/i>"},{"t":"p","h":"<i>Los santos que ya han llegado a la presencia de Dios mantienen con nosotros lazos de amor y comunión… estamos rodeados, guiados y conducidos por los amigos de Dios<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"89\">89<\/sup>. Como nuestro Fundador, también nosotros encontramos en ellos modelos vivientes del seguimiento de Cristo evangelizador. Un hecho que movió a Claret al apostolado fue la lectura de las vidas de santos, y, dentro de estas, las de los que vivieron con mayor intensidad el celo por la salvación de las almas<sup class=\"fn\" data-u=\"c3\" data-n=\"90\">90<\/sup>. En la Autobiografía se mencionan, en primer lugar, los ejemplos de los profetas: Isaías, Jeremías, Ezequiel, Daniel, Elías y los profetas menores<sup class=\"fn\" data-u=\"c3\" data-n=\"91\">91<\/sup>. Las vidas de los apóstoles Pedro y Pablo, Santiago y Juan provocaron su admiración. Le impresionó y entusiasmó de manera especial el ardor de San Pablo. También se sintió movido por otros santos y santas que se distinguieron por su afán apostólico como San Francisco Javier, San Vicente de Paúl, San Ignacio de Loyola, San Alfonso María de Ligorio, San Francisco de Sales, San Juan de Ávila y el Beato Diego de Cádiz, Santa Catalina de Siena, Santa Teresa de Jesús, Santa María Magdalena de Pazzis y Santa Rosa de Lima<sup class=\"fn\" data-u=\"c3\" data-n=\"92\">92<\/sup>.","n":"145","s":1},{"t":"p","h":"Junto a ellos, hallamos inspiración en numerosos misioneros y mártires de nuestro tiempo que, en culturas y países diversos, se han distinguido por su celo apostólico y han dado testimonio del nombre de Cristo. Los mártires del Reino que siguen entregando su vida en la actualidad son un claro signo de la vitalidad del Pueblo de Dios<sup class=\"fn\" data-u=\"c3\" data-n=\"93\">93<\/sup>. Ellos, unidos a los múltiples santos<i> de la puerta de al lado<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"94\">94<\/sup>, forman <i>el rostro más bello de la Iglesia<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"95\">95<\/sup>.","n":"146","s":1},{"t":"h","l":3,"h":"2.2. La Congregación"},{"t":"h","l":4,"h":"<i>2.2.1. El sentido ejemplar de su historia<\/i>"},{"t":"p","h":"Nacida en la Iglesia por inspiración de la Santísima Virgen, convocada y consagrada bajo la acción del Espíritu Santo y heredera del espíritu misionero de San Antonio María Claret, la Congregación surgió como un intento de reproducir el estilo de vida de Jesús y sus apóstoles en orden a la evangelización. Ahora, se siente responsable de actualizar y promover cuantas iniciativas apostólicas sintonicen con el servicio misionero de la Palabra.","n":"147","s":1},{"t":"p","h":"Su carisma, como experiencia del Espíritu, ha sido acogido, profundizado, desarrollado y enriquecido<sup class=\"fn\" data-u=\"c3\" data-n=\"96\">96<\/sup> por las distintas generaciones de misioneros, dando sentido y vida a nuestro proyecto claretiano.","n":"148","s":1},{"t":"p","h":"La historia de la Congregación es la encarnación y la realización existencial del carisma fundacional de Claret. Las tareas de la primitiva comunidad fueron las misiones populares, el catecismo a los niños, los ejercicios al clero, a seminaristas y a religiosos. Con el crecimiento numérico, la Congregación experimenta una expansión misionera en Europa y América abriéndose así a nuevas áreas geográficas y culturales.","n":"149","s":1},{"t":"p","h":"Al final de su vida, el P. Fundador aconsejó que algunos misioneros se dedicaran a la educación cristiana. Con el andar de los años, este servicio adquirió cierta relevancia en la Congregación, pues muchos de sus miembros se comprometieron en instituciones educativas. A principios del siglo XX, fueron asumidas las primeras parroquias con finalidad misionera.","n":"150","s":1},{"t":"p","h":"Siguiendo el espíritu y actividad misionera de Claret, la Congregación prestó especial atención a la formación del clero y de los religiosos. Igualmente cabe destacar la dedicación al apostolado de la prensa, que ha sido sin duda un gran servicio a la Iglesia. La Congregación potenció después la formación de evangelizadores, la dirección o docencia en seminarios y universidades y las publicaciones especializadas y de divulgación. Desde los primeros tiempos, al asumir las primeras misiones de Argel y Santiago de Chile, la Congregación ha mantenido muy vivo su espíritu universal y no ha cesado de expandirse por todo el mundo. Resalta, además, la atención particular a las clases populares, consecuencia decidida de su <i>opción por los pobres y desplazados<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"97\">97<\/sup>. Estos hechos más característicos manifiestan que la historia misionera de la Congregación es una página de servicio a los necesitados, a las clases populares y a la promoción y formación de agentes de evangelización.","n":"151","s":1},{"t":"p","h":"A lo largo de su historia, muchos estudiantes, hermanos, y presbíteros, inspirados por el ejemplo de su Fundador, no han dudado en sufrir la persecución, el destierro y la muerte<sup class=\"fn\" data-u=\"c3\" data-n=\"98\">98<\/sup>. La historia de nuestra Congregación es martirial<sup class=\"fn\" data-u=\"c3\" data-n=\"99\">99<\/sup> pues, comenzando por el mismo P. Claret que derramó su sangre en Holguín, y siguiendo por el P. Francisco Crusats, protomártir de la Congregación, la lista de mártires no ha cesado. Resaltan de manera especial los reconocidos oficialmente por la Iglesia: los 51 mártires de Barbastro; el P. Andrés Solá, martirizado en México; los 23 de Sigüenza, Fernán Caballero y Tarragona; y los 109 de Barcelona, Castro Urdiales, Cervera, Lérida, Sabadell, Vic, Sallent y Valencia. Todos estos hermanos nuestros se mantuvieron fieles al Señor y a su vocación en medio de grandes pruebas y dificultades. Esta fidelidad llega a nosotros como un testimonio que nos interpela y alienta. Su fidelidad hasta la muerte fue una gracia de Dios y, al mismo tiempo, fruto de la sólida formación recibida.","n":"152","s":1},{"t":"p","h":"En nuestros 51 hermanos beatos mártires de Barbastro contemplamos, de manera particular, el paradigma de lo que estamos llamados a ser: hijos del Corazón de María, desde el Magníficat hasta el Calvario. Este seminario mártir se convierte también para nosotros en modelo de comunidad formativa por su fe inquebrantable y alegre, por su disponibilidad plena a la voluntad de Dios, por su oración constante y confiada, por su vivencia de la filiación cordimariana y de la eucaristía, por su ayuda fraterna, por su amor a la Congregación y por su celo apostólico<sup class=\"fn\" data-u=\"c3\" data-n=\"100\">100<\/sup>. Por otra parte, el ofrecimiento de la propia vida a cambio de la de los postulantes, convierte al P. José María Ruíz Cano en modelo de amor fiel y entrega generosa para los formadores claretianos.","n":"153","s":1},{"t":"p","h":"Mirando nuestra tradición sentimos agradecimiento por los que nos precedieron y, al mismo tiempo, una invitación a aprender de su historia y a continuar su fidelidad, buscando realizar en la Iglesia el legado de Claret como buena nueva en la frontera de la evangelización.","n":"154","s":1},{"t":"h","l":4,"h":"<i>2.2.2. Las Constituciones: proyecto de vida misionera de la <\/i> <i>Congregación<\/i>"},{"t":"p","h":"El mismo año de la fundación de nuestra Congregación, el Fundador escribió el texto de las Constituciones y lo entregó a sus misioneros antes de marcharse a Cuba a finales de 1850. El primer texto que se conserva data de 1857. La aprobación oficial definitiva por parte de la Sede Apostólica llegó en 1870, un poco antes de la muerte del Fundador.","n":"155","s":1},{"t":"p","h":"Nuestro Fundador describió en las primitivas Constituciones su experiencia personal del don recibido del Espíritu para la edificación de la Iglesia y su programa de imitación de Cristo, guía y modelo de misioneros, de forma que pudieran servir de modelo de identificación a los claretianos de todos los tiempos. Los primeros claretianos encontraron en ellas la expresión de las aspiraciones sembradas por el Espíritu Santo en sus corazones. Esto mismo sucede con los claretianos de hoy y de todos los tiempos.","n":"156","s":1},{"t":"p","h":"Las Constituciones renovadas según las orientaciones del Concilio Vaticano II y con las acomodaciones exigidas por el Código de Derecho Canónico obtuvieron la aprobación definitiva el 15 de mayo de 1986. <i>Las Constituciones<\/i><b> <\/b><i>son una expresión de la acción del Espíritu que en la Iglesia llama a algunos a seguir e imitar perfectamente la vida evangélica de Cristo en la forma como la vivió y propuso nuestro Padre Fundador. Su aprobación por parte de la Iglesia certifica la eclesialidad de nuestra Congregación<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"101\">101<\/sup><i>.<\/i>","n":"157","s":1},{"t":"p","h":"Nuestras Constituciones brotan de una experiencia vital. Nos motivan para revivir la experiencia de la llamada de Dios y el carisma congregacional. Son, <i>palabra del Evangelio referida a nuestra comunidad y puesta como eje de nuestro modelo de seguir a Cristo: punto de referencia necesario, por tanto, para que nuestro vivir en común siga teniendo un sentido cristiano y eclesial y para que el don carismático de Claret conserve su fuerza de convocación y movilización<\/i><sup class=\"fn\" data-u=\"c3\" data-n=\"102\">102<\/sup>.","n":"158","s":1},{"t":"p","h":"Teniendo en cuenta las diferentes culturas y contextos en los que la Congregación ha ido echando raíces, se hace necesaria una lectura inculturada de las Constituciones. Esta consiste en integrar las riquezas espirituales y los valores culturales de los pueblos en los que estamos<sup class=\"fn\" data-u=\"c3\" data-n=\"103\">103<\/sup>, de manera que el carisma claretiano pueda ser vivido como algo propio y contribuya también a iluminar, desde el Evangelio, esas mismas culturas.","n":"159","s":1},{"t":"p","h":"La asimilación de las Constituciones debe ser gradual, teniendo en cuenta las diferentes etapas formativas. Por otra parte, las Constituciones deben ser leídas e interpretadas a la luz de la espiritualidad de nuestro Fundador, de la historia de la Congregación y de la evolución de la vida religiosa en general. Sus contenidos se deben profundizar teniendo en cuenta todos los aspectos, tanto teológicos como carismáticos y pedagógicos.","n":"160","s":1}],"notes":{"1":"1 Tes 5,24.","2":"Cf. 1 Cor 12,3.","3":"SP 13; cf. Aut 687.","4":"Cf. Is 30, 2.","5":"Cf. Lc 4,18 ss; Mt 3,1 ss.","6":"Cf. Jn 14,16.","7":"Cf. RMi 30.","8":"Cf. SP 3.","9":"Cf. Aut 687.","10":"Cf. PI 19.","11":"Cf. Rm 8, 26.","12":"Cf. Jn 16, 13.","13":"Cf. PI 19.","14":"SP 16.","15":"Cf. PI 20.","16":"Cf. CC 1.","17":"Cf. Aut 488; CC 8.","18":"Cf. Dir 34; 35.","19":"Cf. J. CLOTET, <i>Annales<\/i> 1885, 179; CC 8.","20":"Cf. Aut 1, 5, 154-164; EsC, int. III; CC 8, 36, 61.","21":"MS 46.","22":"Cf. Aut 5.","23":"Cf. SP 14.","24":"Cf. CC 6; SP 7.","25":"Cf. Aut 270.","26":"Cf. Dir 34; Aut 447.","27":"Cf. CC 8.","28":"Cf. Aut 270.","29":"EA, p. 665.","30":"Aut 687; cf. Mt 10,20.","31":"Cf. CC 68; MCH 150.","32":"Cf. CC 8, 36, 61, 73.","33":"Cf. CC 5.","34":"Cf. CC 20, 23, 28.","35":"Cf. CC 35, 36; Dir 35b.","36":"Cf. Dir 35c.","37":"Cf. LG 1; CC 3.","38":"Cf. CC 6.","39":"Cf. LG 44; VC 29.","40":"Cf. Aut 454, 456.","41":"Cf. CELAM, <i>Documento de Aparecida<\/i>, 20.","42":"LS 217.","43":"Cf. PI 29.","44":"Cf. CF, p. 18-19.","45":"Cf. PI 29.","46":"Cf. Aut 489.","47":"Cf. CIC 597, § 1.","48":"Cf. GS 16.","49":"PI 29.","50":"VNON 35d; CF, p. 21.","51":"PI 29.","52":"Cf. CC 39, 41, 54-55.","53":"Cf. PFS 33-36; PI 31.","54":"Cf. PFS 26-27; PI 31.","55":"Cf. PFS 29-32.","56":"Cf. PFS 28.","57":"Cf. MCH 228.","58":"Cf. PFS 41-42; VC 68.","59":"Cf. PI 31; CC 68, 77.","60":"Cf. PFS 37-40.","61":"Cf. Dir 163.","62":"1Cor 11,1; Cf. Aut 340, 388; CC 77.","63":"Cf. Dir 162; MS 75.3.","64":"Cf. PDV 66; OT 5.","65":"Cf. PFS 49-64.","66":"Cf. PFS 65.","67":"Cf. PFS 66-71.","68":"Cf. CIC 651 §3; MS 75.5.","69":"Cf. CC 76.","70":"Cf. VFC 21-28.","71":"Cf. VFC 12-20.","72":"Cf. VFC 58-59.","73":"Cf. CF, p. 26; VNON 16.","74":"Cf. Dir 164.","75":"Cf. 1 Cor 12, 25; CC 15.","76":"Cf. MS 57.","77":"Cf. 1F 166.","78":"Cf. OT 17.","79":"Cf. PFS 46.","80":"Cf. PDV 67.","81":"Cf. Aut 221.","82":"Cf. DC 14-15.","83":"Cf. Aut 1; EA, p 102.","84":"Cf. EA, pp. 77-99.","85":"Cf. EA, p. XVII.","86":"EA, p. XVIII.","87":"Aut 342.","88":"Aut 270.","89":"GE 4.","90":"Cf. CC 35.","91":"Cf. Aut 215-220.","92":"Cf. Aut 214-263. La mayoría son copatronos de la Congregación (Cf. CC 35).","93":"Cf. SP 2.","94":"GE 7.","95":"GE 9.","96":"Cf. MR 11; MCH 71.","97":"Cf. MS 49.","98":"Cf. MCH 77.","99":"Cf. SP 17.","100":"Cf. TM 1-13, 18-26.","101":"Dir 4.","102":"CCR: <i>Annales<\/i>, vol. 55, 320.","103":"Cf. SP 13.2; PTV 68.4."}},{"id":"c4","title":"Los factores formativos: personales y ambientales","short":"Capítulo 4","kind":"main","pages":[121,136],"blocks":[{"t":"h","l":2,"h":"INTRODUCCIÓN<sup class=\"fn\" data-u=\"c4\" data-n=\"1\">1<\/sup>"},{"t":"p","h":"Por factores formativos entendemos aquellas realidades (personas y ambientes) que inciden en la estructuración y maduración personal y en el proceso formativo. Pueden ser internos o externos a la persona, y están relacionados entre sí. En principio, no son pedagógicamente intencionales, ni por parte del formador ni del formando. Algunos son heredados y otros son espacios naturales o sociales recibidos sin ningún proyecto o propuesta pedagógica especial.","n":"161","s":1},{"t":"p","h":"La falta de intencionalidad pedagógica no significa que los factores no tengan incidencia en el proceso de formación; al contrario, suelen tener una amplia e intensa influencia, tanto positiva como negativa. Más aún, cuando es posible, se les puede dar la intencionalidad formativa de un modo explícito; de esta manera, los factores se convierten en dinamismos y medios formativos. Por eso, los factores formativos se han tenido en cuenta en el PGF y deben considerarse en la elaboración de los proyectos formativos, sea como marco de referencia, sea como dinamismos y medios de formación.","n":"162","s":1},{"t":"h","l":2,"h":"1. FACTORES PERSONALES"},{"t":"h","l":3,"h":"1.1. Factores físicos"},{"t":"p","h":"Los factores físicos son, en su mayoría, hereditarios. Algunos, sin embargo, pueden ser adquiridos, como ciertas enfermedades o limitaciones. Factores físicos son la salud, la edad, el sexo, las condiciones somáticas. Influyen en el desarrollo de la persona y en la dotación de cualidades, aptitudes y posibilidades futuras. Por eso, tanto la Iglesia<sup class=\"fn\" data-u=\"c4\" data-n=\"2\">2<\/sup> como la Congregación<sup class=\"fn\" data-u=\"c4\" data-n=\"3\">3<\/sup> se refieren a ellos en el proceso de discernimiento vocacional. Se señala, por ejemplo, una edad mínima para el comienzo del Noviciado, para la profesión primera y perpetua y para la ordenación. Entre los diversos requisitos de ingreso, se habla también de salud adecuada. Aunque no se describe en qué consiste, esta indicación genérica se refiere, al menos, a aquella salud que puede permitir al candidato vivir y realizar las exigencias de la vida misionera<sup class=\"fn\" data-u=\"c4\" data-n=\"4\">4<\/sup>.","n":"163","s":1},{"t":"p","h":"Dada la importancia que la salud tiene para el equilibrio personal y para el desarrollo de la vida misionera, su cuidado es importante mediante el ejercicio físico regular, la práctica del deporte, una dieta equilibrada y la adquisición de hábitos de higiene, limpieza, esparcimiento y descanso<sup class=\"fn\" data-u=\"c4\" data-n=\"5\">5<\/sup>.","n":"164","s":1},{"t":"h","l":3,"h":"1.2. Factores psicológicos"},{"t":"p","h":"Los factores psicológicos son los que describen la personalidad del sujeto y las dimensiones de la misma (sensación, emociones, percepción, inteligencia, intereses, actitudes, aptitudes, necesidades y motivaciones). La influencia de los rasgos psicológicos de la personalidad es decisiva en el comportamiento de la persona. Por otro lado, la personalidad se va realizando evolutivamente; aun siendo siempre la misma, cambia en la medida en que se madura. De ahí la importancia pedagógica que tiene el desarrollo de una personalidad consistente.","n":"165","s":1},{"t":"p","h":"Un criterio de discernimiento vocacional es el referido a la índole del sujeto. En este concepto se incluye el temperamento, el carácter y la personalidad. Especial atención merece en el proceso de discernimiento el estudio de las motivaciones vocacionales, la capacidad para vivir en comunidad, los factores psicológicos que afectan a la internalización de los valores del Reino, la llamada adolescencia prolongada o el retraso en la maduración de los jóvenes, la madurez emocional y psico-sexual. Se debe prestar atención especial a la madurez humana que es la base de todo desarrollo, ya que tiene un fuerte impacto en la estabilidad de la opción de cada uno, en la vida comunitaria y en la vivencia integral de los consejos evangélicos. Siempre es necesario estar seguro de la ausencia de contraindicaciones en esta área (enfermedades psicológicas como tales y defectos que son incompatibles con la vida claretiana), con la ayuda de especialistas<sup class=\"fn\" data-u=\"c4\" data-n=\"6\">6<\/sup>.","n":"166","s":1},{"t":"h","l":3,"h":"1.3. Factores de la condición juvenil"},{"t":"p","h":"Los candidatos a nuestra vida misionera son, por lo general, jóvenes que comparten las virtudes y defectos de las nuevas generaciones. Hoy los jóvenes viven en una gran diversidad de contextos y culturas, incluso dentro de un mismo país<sup class=\"fn\" data-u=\"c4\" data-n=\"7\">7<\/sup>. Pero, al mismo tiempo, la globalización creciente nos permite señalar algunos rasgos comunes.","n":"167","s":1},{"t":"p","h":"Hay factores del mundo actual que están siendo determinantes para la configuración de la condición juvenil. Los jóvenes están creciendo en un mundo en crisis<sup class=\"fn\" data-u=\"c4\" data-n=\"8\">8<\/sup> que encuentra en ellos algunas de las víctimas más débiles: hay contextos de violencia, de exclusión, de falta de alternativas<sup class=\"fn\" data-u=\"c4\" data-n=\"9\">9<\/sup>, de ideologización y utilización de los jóvenes por parte de poderes políticos o económicos<sup class=\"fn\" data-u=\"c4\" data-n=\"10\">10<\/sup>.","n":"168","s":1},{"t":"p","h":"Existen también factores internos a las personas. Hay heridas profundas fruto de la historia personal, de deseos frustrados, de discriminaciones e injusticias sufridas, de no haberse sentido amados o reconocidos, de los errores cometidos<sup class=\"fn\" data-u=\"c4\" data-n=\"11\">11<\/sup>. Los jóvenes son conscientes de la importancia que tienen el cuerpo y la sexualidad en la formación de su identidad personal, pero les resulta hoy muy difícil mantener una buena relación con el propio cuerpo y vivir serenamente las relaciones afectivas<sup class=\"fn\" data-u=\"c4\" data-n=\"12\">12<\/sup>. Y hay deseos también profundos<sup class=\"fn\" data-u=\"c4\" data-n=\"13\">13<\/sup>: deseos de Dios, de fraternidad, de desarrollar las propias capacidades, de armonía con la naturaleza, de comunicación, de vivir una vida diferente…","n":"169","s":1},{"t":"p","h":"En toda esta realidad emergen algunos rasgos que influyen significativamente en el proceso de discernimiento y de desarrollo vocacional<sup class=\"fn\" data-u=\"c4\" data-n=\"14\">14<\/sup>. Entre los valores más extendidos destacan la sensibilidad por la justicia, la no violencia y la paz; la apertura a la amistad, a la fraternidad y a la solidaridad; un nuevo concepto y estilo en las relaciones entre hombre y mujer; la actitud de apertura y de diálogo<sup class=\"fn\" data-u=\"c4\" data-n=\"15\">15<\/sup>; la movilización por causas como los derechos humanos, la conservación de la naturaleza y la calidad de vida<sup class=\"fn\" data-u=\"c4\" data-n=\"16\">16<\/sup>; la sed de libertad y de autenticidad y la aspiración a un mundo mejor<sup class=\"fn\" data-u=\"c4\" data-n=\"17\">17<\/sup>.","n":"170","s":1},{"t":"p","h":"Se dan también rasgos negativos como, por ejemplo, la atracción y dependencia de la sociedad de consumo, la actitud individualista, narcisista y hedonista en la vida y el rechazo de todo lo que suponga sacrificio y renuncia en la vivencia de los valores espirituales y religiosos<sup class=\"fn\" data-u=\"c4\" data-n=\"18\">18<\/sup>. Los desafíos de una gratificación instantánea, la dificultad con la tolerancia a la frustración y los problemas de control de impulsos; los jóvenes necesitan también acompañamiento para lidiar con su fuerte sentido de autonomía y la defensa de la libertad personal.","n":"171","s":1},{"t":"p","h":"En conjunto, hay en las nuevas generaciones muchos valores emergentes que debemos tener en cuenta en los procesos de pastoral vocacional y en la formación. Estos valores, discernidos y potenciados a la luz del Evangelio, señalan los perfiles que la vida religiosa y el ministerio irán adquiriendo en los próximos años. Dada la diversidad derivada de nuestra presencia en áreas geográficas y culturales distintas, el PGF no puede descender a un análisis pormenorizado, pero recomienda que se haga en los planes provinciales y locales.","n":"172","s":1},{"t":"h","l":3,"h":"1.4. Factores Espirituales"},{"t":"p","h":"La formación espiritual está dirigida a alimentar y sostener la comunión con Dios y con nuestros hermanos y hermanas, en una amistad con Jesús y en una actitud de docilidad con el Espíritu Santo<sup class=\"fn\" data-u=\"c4\" data-n=\"19\">19<\/sup>. Los candidatos que tienen en gran valor spiritual la búsqueda de Jesús y que viven íntimamente con Él<sup class=\"fn\" data-u=\"c4\" data-n=\"20\">20<\/sup> deben acompañarse en esta dimensión espiritual de la formación a través de la oración, la escucha de la Palabra, la devota participación en los sacramentos y en la Liturgia, entre otras cosas.","n":"173","s":1},{"t":"p","h":"Hay candidatos provenientes de nuevos movimientos en la Iglesia y de otras comunidades religiosas o diocesanas. Esta tendencia plantea un desafío cuando se trata de introducirlos en la vida misionera religiosa claretiana. Nuestra formación debe poner énfasis en el carisma y la espiritualidad claretiana, a partir de la Pastoral de las vocaciones y profundizarlo a lo largo de todo el proceso<sup class=\"fn\" data-u=\"c4\" data-n=\"21\">21<\/sup>.","n":"174","s":1},{"t":"h","l":2,"h":"2. FACTORES AMBIENTALES"},{"t":"h","l":3,"h":"2.1. La familia"},{"t":"p","h":"La familia puede ser el lugar del crecimiento de los hijos y el primer agente de socialización de la persona. Esta socialización se realiza a través de un proceso de interiorización de los valores culturales que se viven en ella. La familia, como <i>escuela del más rico humanismo<\/i><sup class=\"fn\" data-u=\"c4\" data-n=\"22\">22<\/sup>, no es sólo transmisora directa de valores a través de la educación de los hijos; también su situación social, el nivel económico que posee, el tipo de relaciones intrafamiliares y el ambiente religioso que vive, ejercen una influencia especial en la persona.","n":"175","s":1},{"t":"p","h":"La misión educativa de la familia, comunidad de fe, de vida y de amor, abarca todas las dimensiones de la persona; por lo mismo, los padres, mediante la educación cristiana de sus hijos, deben cultivar y proteger en ellos lo que favorece el descubrimiento y la respuesta a la vocación religiosa<sup class=\"fn\" data-u=\"c4\" data-n=\"23\">23<\/sup>. De esta manera, cuando la familia vive su misión de iglesia doméstica, se convierte en el primer seminario<sup class=\"fn\" data-u=\"c4\" data-n=\"24\">24<\/sup>.","n":"176","s":1},{"t":"p","h":"Por eso, la familia y el entorno familiar que ha vivido el candidato constituyen un factor decisivo y condicionante del futuro vocacional y formativo de la persona que ingresa en la Congregación. Una sana educación familiar, humana y cristiana, es siempre una base sólida y una garantía para la futura formación claretiana del candidato. Por el contrario, las situaciones familiares anómalas, los problemas y conflictos intrafamiliares y los valores que se viven en el seno de la familia, sobre todo cuando son poco cristianos y evangélicos, pueden ser dificultades, más o menos consistentes, para el desarrollo normal de su formación.","n":"177","s":1},{"t":"p","h":"Hay que reconocer que en las familias se están produciendo <i>cambios realmente notables. El divorcio, las familias monoparentales, la disminución de los compromisos de por vida, la extensión de las uniones de personas del mismo sexo, son fenómenos que suponen un desafío a esta estructura básica de la sociedad<\/i><sup class=\"fn\" data-u=\"c4\" data-n=\"25\">25<\/sup><i>. <\/i>Los candidatos que provienen de estructuras familiares no tradicionales representan un gran desafío para nuestras casas de formación sobre cómo responder a esta realidad de los jóvenes y asegurar una formación más exhaustiva e integral.","n":"178","s":1},{"t":"p","h":"Todo ello hace que la familia sea un elemento clave de discernimiento vocacional que hay que tener muy en cuenta durante todo el proceso formativo, pero de una manera particular en su comienzo. A lo largo de él habrá que prestar atención al influjo familiar en las motivaciones y comportamientos del candidato para ayudarle a integrarse en la nueva familia a la que ha sido llamado. Cuando el candidato provenga de una familia perteneciente a otras tradiciones religiosas, habrá que conocer el ambiente religioso familiar y ayudar al mismo a asumir toda su experiencia religiosa en el seguimiento de Jesús dentro de la comunidad claretiana. Al mismo tiempo, tenemos que ser conscientes de algunos problemas relacionados con dinámicas familiares específicas, como el tipo de límites establecidos en las familias y su influencia, las relaciones entre hermanos, el alcoholismo y la historia de abusos.","n":"179","s":1},{"t":"p","h":"Una adecuada y equilibrada formación deberá ser, por una parte, sensible al influjo positivo que puede ejercer la familia en la vida de los formandos<sup class=\"fn\" data-u=\"c4\" data-n=\"26\">26<\/sup> y, por otra, consecuente con la exigencia evangélica de la renuncia a la familia,<sup class=\"fn\" data-u=\"c4\" data-n=\"27\">27<\/sup> que pide tanto el proceso de madurez personal como nuestro peculiar estilo de vida y misión.","n":"180","s":1},{"t":"p","h":"Para un mejor acompañamiento, los formadores deben conocer los antecedentes de los candidatos y sus familias, su situación social, su situación económica y el tipo de relaciones interpersonales. El conocimiento de la familia y la cultura de uno ayudará a distinguir entre lo que es cultural y lo que es propio de su personalidad. Por lo tanto, se anima a los formadores a reunirse y dialogar con las familias de nuestros candidatos.","n":"181","s":1},{"t":"h","l":3,"h":"2.2. El espacio físico"},{"t":"p","h":"El espacio físico natural está constituido por las condiciones físicas del entorno: el paisaje, el clima, la orografía, la situación física en el territorio. El espacio creado es lo que el hombre ha construido para dominar la naturaleza. Supone un conjunto ambivalente de fenómenos: la ciudad, los ruidos, las condiciones higiénicas.","n":"182","s":1},{"t":"p","h":"La relación con ambos puede ser de armonía o de desequilibrio. Existe una relación ecológica y una relación explotadora. Por eso, teniendo en cuenta el influjo que los ámbitos ejercen y la sensibilidad actual por el respeto a la creación, es preciso cuidar las actitudes que más favorecen una formación armónica y respetuosa de la naturaleza.","n":"183","s":1},{"t":"p","h":"Todo ello influye en el tipo de personas y de culturas. La historia humana registra también modalidades diversas de culturas, muy ligadas, con frecuencia, al entorno natural en el que han surgido. Todas ellas han de ser respetadas y valoradas en la formación. Cuando se ponen al servicio de un proyecto común, lo enriquecen y lo hacen más universal.","n":"184","s":1},{"t":"h","l":3,"h":"2.3. La sociedad y la cultura"},{"t":"p","h":"La compleja realidad social circundante, descrita ya en el marco de referencia<sup class=\"fn\" data-u=\"c4\" data-n=\"28\">28<\/sup>, y el ambiente educativo, ejercen, con sus rasgos positivos y negativos, una influencia cada vez más considerable en el proceso de maduración de la persona. Hay valores, como la conciencia de la dignidad e inviolabilidad de la persona, la afirmación del sentido inalienable de la vida, el hambre de justicia y de verdad, el respeto del pluralismo, el interés y la preocupación por la defensa de la creación y el acercamiento entre los pueblos, que abren nuevos horizontes de esperanza y ofrecen un marco positivo para el crecimiento personal y comunitario y para suscitar la sensibilidad misionera; facilitan la personalización que nosotros buscamos y favorecen la adquisición de valores y de hábitos que están muy en línea con una misión profética y liberadora<sup class=\"fn\" data-u=\"c4\" data-n=\"29\">29<\/sup>.","n":"185","s":1},{"t":"p","h":"Otros, en cambio, como la cultura de la destrucción y de la muerte (violencia, guerra, marginación, explotación)<sup class=\"fn\" data-u=\"c4\" data-n=\"30\">30<\/sup>, el individualismo, el consumismo y el secularismo, reflejan la insolidaridad, el ansia desenfrenada de poder y de bienestar y la indiferencia religiosa. Estos elementos conforman el horizonte existencial en el que nos situamos, marcan a las personas y dificultan la disponibilidad, la itinerancia misionera y la asimilación de aspectos del Evangelio imprescindibles para el misionero: aceptación de mediaciones objetivas, entrega desinteresada, predilección por los más pobres<sup class=\"fn\" data-u=\"c4\" data-n=\"31\">31<\/sup>.","n":"186","s":1},{"t":"p","h":"En este contexto sociocultural estamos llamados a lograr una sensibilidad por la cultura de la vida, la justicia, la paz y la integridad de la creación. Nuestra formación debe dar oportunidades para estar en contacto con los más frágiles<sup class=\"fn\" data-u=\"c4\" data-n=\"32\">32<\/sup>, tiene que ser inculturada y garantizar una preparación adecuada que nos permita dar con responsabilidad, como Claret, respuestas misioneras y proféticas a los múltiples desafíos que se nos presentan. Debemos prestar especial atención al análisis crítico de la realidad y a la práctica del discernimiento, de modo que todos aprendamos a interpretar la realidad desde la fe.","n":"187","s":1},{"t":"p","h":"La sociedad asume rostros concretos en los diversos pueblos en los que vivimos. De ellos recibimos una forma particular de entender la vida y la historia. El conocimiento y aprecio de los símbolos y valores de la cultura del pueblo nos irá formando como personas y nos dará la sintonía necesaria para entender mejor las esperanzas y problemas de los hombres con los que compartimos la existencia. Jesucristo, ungido por el Espíritu, acogía la voluntad del Padre y compartía el dolor del pueblo. Nosotros contemplamos al Maestro y acogemos su palabra abriéndole nuestro corazón y compartiendo las angustias y esperanzas de nuestros hermanos y hermanas. El pueblo nos interpela constantemente con su testimonio de vida, su capacidad de lucha y transformación y su esperanza en el advenimiento de una nueva sociedad. Percibimos todos estos valores cuando nos mantenemos en relación constante con él. Por eso, debemos esforzarnos por escuchar la Palabra de Dios en la oración personal, en los acontecimientos de la historia y también en las culturas y vida de los pueblos, en sus silencios y clamores. Sólo podemos evangelizar cuando nos abrimos a los demás ofreciéndoles lo mejor de nosotros mismos y compartiendo con ellos nuestra esperanza.","n":"188","s":1},{"t":"h","l":3,"h":"2.4. Tecnología y medios de comunicación"},{"t":"p","h":"<i>La tecnología ha revolucionado el mundo de las comunicaciones, hasta el punto de que cabe hablar de un “nuevo continente” digital poblado por millones de internautas... El mundo se convierte cada vez más en una “aldea global”, aunque sigue habiendo muchos pueblos y personas injustamente desconectados. Se multiplican también las formas de manipulación y control. La Iglesia nos invita a hacernos presentes en este “nuevo continente” a la vez que nos advierte de sus ilusiones y trampas<\/i><sup class=\"fn\" data-u=\"c4\" data-n=\"33\">33<\/sup><i>. <\/i>De este nuevo mundo provienen muchos de nuestros candidatos.","n":"189","s":1},{"t":"p","h":"Reconocemos la urgencia, la oportunidad y la eficacia apostólica de los medios de comunicación, lo cual nos obliga a emplearlos con creatividad<sup class=\"fn\" data-u=\"c4\" data-n=\"34\">34<\/sup>. Su uso se ha convertido en algo más que un instrumento de comunicación: son una forma de ser y de expresarse. Por lo tanto, los formandos necesitan normas y reglas de conducta adecuada mientras exploran los contenidos en la red de información. Para prevenir usos impropios y posibles adicciones que pueden causar aislamientos de la comunidad y obstáculos para la inculturación en la misión, han de ejercitarse en su uso con prudencia, actitud crítica y responsabilidad. Los talleres y seminarios sobre cultura digital, redes y especializaciones en medios de comunicación, deben ser una parte integral de la formación.","n":"190","s":1},{"t":"h","l":3,"h":"2.5. La comunidad eclesial"},{"t":"p","h":"Nuestra vocación claretiana hay que situarla dentro del contexto del Pueblo de Dios. La Iglesia, en cuanto madre y educadora de las vocaciones, las acompaña desde su nacimiento hasta su plena madurez a lo largo del proceso formativo<sup class=\"fn\" data-u=\"c4\" data-n=\"35\">35<\/sup>. La Iglesia es el ámbito en el que la comunidad vive su carisma y realiza su misión formativa<sup class=\"fn\" data-u=\"c4\" data-n=\"36\">36<\/sup>.","n":"191","s":1},{"t":"p","h":"El período especial de gracia y renovación abierto en la Iglesia con el Concilio Vaticano II, con la proliferación de frutos de vida evangélica, constituye el contexto al que la formación debe hacer siempre referencia. La llamada a una nueva evangelización se convierte en un contexto actualizado que imprime al proceso formativo una especial novedad en su ardor, en sus métodos y en sus expresiones<sup class=\"fn\" data-u=\"c4\" data-n=\"37\">37<\/sup>. El magisterio pontificio, que ha iluminado la nueva situación de la Iglesia y del mundo con importantes documentos sobre Jesucristo<sup class=\"fn\" data-u=\"c4\" data-n=\"38\">38<\/sup>, el Padre<sup class=\"fn\" data-u=\"c4\" data-n=\"39\">39<\/sup>, el Espíritu<sup class=\"fn\" data-u=\"c4\" data-n=\"40\">40<\/sup>, María<sup class=\"fn\" data-u=\"c4\" data-n=\"41\">41<\/sup>, la mujer<sup class=\"fn\" data-u=\"c4\" data-n=\"42\">42<\/sup>, la vocación y misión de los laicos<sup class=\"fn\" data-u=\"c4\" data-n=\"43\">43<\/sup>, la situación social<sup class=\"fn\" data-u=\"c4\" data-n=\"44\">44<\/sup>, la misión de la Iglesia<sup class=\"fn\" data-u=\"c4\" data-n=\"45\">45<\/sup>, el problema de la verdad<sup class=\"fn\" data-u=\"c4\" data-n=\"46\">46<\/sup>, las virtudes teologales<sup class=\"fn\" data-u=\"c4\" data-n=\"47\">47<\/sup>, la santidad<sup class=\"fn\" data-u=\"c4\" data-n=\"48\">48<\/sup>, el gozo de la evangelización<sup class=\"fn\" data-u=\"c4\" data-n=\"49\">49<\/sup>, el cuidado de la creación<sup class=\"fn\" data-u=\"c4\" data-n=\"50\">50<\/sup> y la familia<sup class=\"fn\" data-u=\"c4\" data-n=\"51\">51<\/sup>, ha de reflejarse en la formación de los misioneros claretianos. También es preciso tener en cuenta las orientaciones de los obispos y de las conferencias episcopales de cada región. El Nuevo Catecismo de la Iglesia debe constituir igualmente un punto de referencia para crecer en el sentido de comunión eclesial.","n":"192","s":1},{"t":"p","h":"La adecuada mediación de la Iglesia en la formación implica un esfuerzo por vivir en sintonía y comunión con la misma, dejándose interpelar y educar por el Pueblo de Dios, intercambiando experiencias de evangelización y de fe, fomentando concordemente todas las vocaciones y ofreciendo, para su provecho y para la edificación del Cuerpo de Cristo, la propia peculiaridad carismática. En este sentido, un conocimiento y participación adecuados en diversas experiencias carismáticas eclesiales puede enriquecernos.","n":"193","s":1},{"t":"p","h":"El sentir con la Iglesia y el amor a la misma serán también un estímulo formativo para trabajar por superar las sombras que la afectan y promover la comunión orgánica entre las diversas vocaciones y entre carismas y ministerios; la unidad en el pluralismo; la misión evangelizadora entre los que no han oído la Buena Nueva del Reino; la inculturación y la apertura al mundo. El aprecio de su universalidad, manifestado en actitudes ecuménicas de interés por todas las iglesias, el diálogo con otras culturas y religiones, y en apertura a sus peculiaridades y necesidades, está muy en sintonía con nuestra vocación misionera. La colaboración con otros institutos de vida consagrada favorece la tarea común de construir el Reino entre todos.","n":"194","s":1},{"t":"h","l":3,"h":"2.6. La comunidad congregacional"},{"t":"p","h":"La responsabilidad de la pastoral vocacional y de la formación misionera corresponde a toda la Congregación<sup class=\"fn\" data-u=\"c4\" data-n=\"52\">52<\/sup>. Es ella la que acoge al llamado y lo acompaña en su proceso formativo, ofreciéndole un proyecto de vida y de misión y asegurándole los medios para llevarlo a cabo.","n":"195","s":1},{"t":"p","h":"El testimonio de fidelidad vocacional y de coherencia carismática será un estímulo de atracción vocacional y una invitación al crecimiento y a la maduración. La renovación constante de las comunidades, la experiencia de Dios, la fraternidad alegre y sencilla, se convierten en un medio óptimo para que la formación se desarrolle de manera armoniosa. La dimensión universal de la Congregación, especialmente en aquellas áreas donde el pluralismo cultural y la interacción entre las diversas etnias se hace más palpable, es una constante llamada a formar en la apertura y respeto hacia todos los pueblos y culturas, así como en la itinerancia y la disponibilidad misionera.","n":"196","s":1},{"t":"p","h":"Las sombras de la Congregación, analizadas en los últimos Capítulos Generales<sup class=\"fn\" data-u=\"c4\" data-n=\"53\">53<\/sup>, influyen también en el proceso formativo. Nuestros límites y carencias constituyen una llamada a fin de promover una auténtica formación que garantice la calidad humana y cristiana, que sea profundamente claretiana y que se renueve constantemente.","n":"197","s":1},{"t":"h","l":3,"h":"2.7. La comunidad provincial o de la Delegación"},{"t":"p","h":"Aunque nuestra pertenencia primera y más radical es a la Congregación, realizamos nuestra vida misionera y nuestros procesos formativos en el ámbito de los Organismos Mayores. Cada una de ellas posee su historia, está ubicada en un país o en una región determinada, se compone de personas con rostro conocido, realiza obras en las que colaboran quienes se van incorporando a ella. A través de sus miembros se responsabiliza de la formación mediante el testimonio, la oración, la vida fraterna, los compromisos apostólicos y la solicitud por los formandos. Por eso, los Organismos Mayores son el ámbito particular que influye muy de cerca en la formación. El conocimiento cercano de las personas y obras, la participación en acontecimientos señalados y la colaboración en tareas misioneras son expresiones que pueden favorecer el sentido de pertenencia en los formandos, imprescindible para crecer simultáneamente en apertura universal.","n":"198","s":1},{"t":"p","h":"Los miembros de la Congregación <i>cuiden, asimismo, que un amor desordenado a la patria o a la propia cultura no impida la adaptación a las gentes que van a evangelizar<\/i><sup class=\"fn\" data-u=\"c4\" data-n=\"54\">54<\/sup>. Por eso, necesitamos estar atentos a que ninguna cultura nacional o regional se sobreponga a la cultura de los pueblos a los que somos enviados a evangelizar.","n":"199","s":1},{"t":"h","l":2,"h":"3. LOS LUGARES"},{"t":"h","l":3,"h":"3.1. La ubicación social y cultural de la comunidad formativa"},{"t":"p","h":"El lugar social, en cuanto ámbito vital, es un factor de considerable importancia en el proceso formativo. Aun cuando dicho lugar pueda variar según las diversas etapas, los criterios que deben regir su elección han de combinar las exigencias de una formación en el contexto y la praxis de la misión con la adecuada preparación académica.","n":"200","s":1},{"t":"p","h":"La formación ha de ser siempre contextuada, pero abierta a la vez al horizonte de universalidad propio de nuestro carisma. A la hora de elegir el lugar social más apropiado, han de ser tenidos en cuenta todos los elementos que garantizan la formación integral de la persona recogidos en este Plan.","n":"201","s":1},{"t":"p","h":"Entre los diversos modos de realización se encuentran las comunidades insertas en medios populares, cuya finalidad es formar misioneros identificados con los pobres y su causa, para anunciar a todos, en las diversas situaciones de la vida, la Buena Nueva del Reino, desde la opción por los pobres, como hizo Jesús<sup class=\"fn\" data-u=\"c4\" data-n=\"55\">55<\/sup>.","n":"202","s":1},{"t":"p","h":"En las comunidades de inserción, la cercanía a las personas tiene un impacto especial en el proceso de formación. Sus valores y experiencias de vida son desafiantes, tanto para los formadores como para los formandos. Su relación con las personas puede:","n":"203","s":1},{"t":"p","h":"a. Estimular la confrontación con uno mismo, favorecer la clarificación dinámica de las motivaciones y de las actitudes vocacionales y ayudar a asumir el proyecto de vida misionera.","n":"203"},{"t":"p","h":"b. Hacer crecer la experiencia de Dios y cualificar la oración.","n":"203"},{"t":"p","h":"c. Iluminar el estudio desde la perspectiva de los desfavorecidos y excluidos y orientarlo al servicio del pueblo<sup class=\"fn\" data-u=\"c4\" data-n=\"56\">56<\/sup>.","n":"203"},{"t":"p","h":"d. Ayudar a leer y a anunciar la Palabra de Dios en sus claves más interpelantes cuando se la escucha con actitud evangélica<sup class=\"fn\" data-u=\"c4\" data-n=\"57\">57<\/sup>.","n":"203"},{"t":"p","h":"e. Enriquecer y estimular la radicalidad de nuestra vida misionera cuando acogemos sus valores de solidaridad y de servicialidad, su estilo de vida, su capacidad de lucha y de superación ante las injusticias y desigualdades y, sobre todo, su paciencia y su esperanza.","n":"203"},{"t":"p","h":"Es recomendable que la formación inicial, sobre todo en las primeras etapas, se realice en el área geográfica y cultural del formando para que asuma con criterios evangélicos los valores de la propia cultura. Por otra parte, el pluralismo cultural de la Iglesia y de la Congregación y el carácter universal de nuestro carisma pueden aconsejar, en algún período, completar la formación en otros lugares distintos al de origen.","n":"204","s":1},{"t":"h","l":3,"h":"3.2. La casa de formación"},{"t":"p","h":"La casa que acoge a una comunidad formativa es el espacio físico y simbólico en el que se realiza una buena parte de la tarea formativa. Por lo mismo, es imprescindible concederle la debida importancia. Para que pueda servir a los objetivos de la formación ha de cumplir algunos requisitos básicos:","n":"205","s":1},{"t":"p","h":"a. Debe favorecer, ante todo, la vida de comunidad y el ambiente de familia, evitando la masificación, la dispersión y el individualismo.","n":"205"},{"t":"p","h":"b. Ha de tener un carácter testimoniante y ha de reflejar austeridad, sencillez y decoro, siendo testigos de nuestro voto de pobreza y de la ley común de trabajo.","n":"205"},{"t":"p","h":"c. Junto a los espacios destinados a los servicios comunes, que pueden ser compartidos con otras personas externas, debe haber también zonas y tiempos reservados para la vida comunitaria, el estudio, la oración y el descanso.","n":"205"},{"t":"p","h":"d. La casa formativa, situada en culturas y ambientes diferenciados, reflejará siempre la predilección por los pobres, será
