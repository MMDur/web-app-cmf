 así llamada cultura gay…. Si son personas con tendencias homosexuales que sólo son la expresión de un problema transitorio, como, por ejemplo, el de una adolescencia todavía no terminada, ésas deberán ser claramente superadas al menos tres años antes de la profesión perpetua<sup class=\"fn\" data-u=\"c7\" data-n=\"4\">4<\/sup>.","n":"309"},{"t":"p","h":"g. El postulante, novicio o estudiante debe manifestar a los formadores sus eventuales dudas o dificultades en esta materia. Y estos, incluido el confesor, <i>tienen el deber de disuadirlo, en conciencia de seguir adelante hacia la profesión y la Ordenación<\/i><sup class=\"fn\" data-u=\"c7\" data-n=\"5\">5<\/sup>.","n":"309"},{"t":"p","h":"La exigencia en la selección y en la formación de los candidatos no debe reducirse a excluir a las personas problemáticas, sino a garantizar un camino de formación equilibrado a los que son idóneos, orientado a la santidad y en el que se contemple la virtud de la castidad<sup class=\"fn\" data-u=\"c7\" data-n=\"6\">6<\/sup>. Cuando se encuentra un candidato de insuficiente equilibrio psicofísico y moral no debemos pretender que la gracia supla en esto a la naturaleza<sup class=\"fn\" data-u=\"c7\" data-n=\"7\">7<\/sup>.","n":"310","s":1},{"t":"p","h":"Es importante tener muy en cuenta el conocimiento de la familia del candidato, el estado de salud física y psíquica de la misma, su situación social y económica, las relaciones entre sus componentes, la vivencia religiosa y el tipo de valores que transmite, para orientar y acompañar más eficazmente su proceso vocacional.","n":"311","s":1},{"t":"h","l":2,"h":"2. LAS ETAPAS DE PRENOVICIADO"},{"t":"h","l":3,"h":"2.1. Aspirantado"},{"t":"h","l":4,"h":"<i>2.1.1. Principios generales<\/i>"},{"t":"p","h":"El Aspirantado es<b> <\/b>el modo como la Congregación acepta a un candidato que, de acuerdo con los criterios previamente señalados, presenta indicios vocacionales para acompañarlo personalmente y continuar el proceso de discernimiento. Estos indicios deben ser discernibles a través de sus aptitudes básicas de vida de fe y sensibilidad religiosa y, al mismo tiempo, una incipiente voluntad de seguimiento de Cristo en la Congregación<sup class=\"fn\" data-u=\"c7\" data-n=\"8\">8<\/sup>.","n":"312","s":1},{"t":"p","h":"La comunidad claretiana acoge las vocaciones a través de una gran variedad de formas y modalidades, proporcionadas en cada Organismo Mayor y ya suficientemente descritas en el capítulo 7 del Directorio Vocacional Claretiano.","n":"313","s":1},{"t":"p","h":"Aunque esta etapa de Aspirantado puede tener configuraciones (en ambiente propio, en grupo formativo o en una comunidad claretiana) y duración muy flexibles y diversas en cada lugar y para cada candidato, para que el <i>aspirante<\/i> acceda al Postulantado hace falta haber alcanzado los objetivos que a continuación se señalan. Hay que asegurar que el aspirante tenga su propio ritmo formativo según su madurez personal y su camino vocacional sin confundirlo con otras etapas.","n":"314","s":1},{"t":"h","l":4,"h":"<i>2.1.2. Objetivos generales<\/i>"},{"t":"p","h":"<i>Dimensión humana. <\/i>Procurar la formación humana integral del <i>aspirante<\/i> ofreciéndole herramientas para el desarrollo armónico de sus condiciones físicas, psico-emocionales, intelectuales y morales correspondientes a su edad.","n":"315","s":1},{"t":"p","h":"<i>Dimensión cristiana. <\/i>Fortalecer la fe recibida en el bautismo consolidando su formación cristiana teórica y experiencial de tal forma que el <i>aspirante<\/i> se disponga a comprender y responder a la vocación divina.","n":"316","s":1},{"t":"p","h":"<i>Dimensión claretiana.<\/i><b> <\/b>Proseguir el discernimiento y cultivo vocacional, presentando de forma clara y adecuada las características de nuestro servicio en la Iglesia, como hijos del Inmaculado Corazón de María, en sus diversos modos de vivirlo, ya sea laical, diaconal o presbiteral.","n":"317","s":1},{"t":"h","l":4,"h":"<i>2.1.3. Objetivos específicos<\/i>"},{"t":"p","h":"<i>Dimensión humana<\/i>","n":"318","s":1},{"t":"p","h":"a. Capacitar al <i>aspirante<\/i> para que, conociéndose bien a sí mismo y su propia historia familiar, adquiera las actitudes sociales que favorecen la vida en comunidad y garantizan la perseverancia vocacional: sentido del orden, disciplina, urbanidad, apertura al diálogo, solidaridad, corresponsabilidad, espíritu de servicio.","n":"318"},{"t":"p","h":"b. Crear un clima de fraternidad, apertura y responsabilidad en el que el <i>aspirante<\/i> pueda orientar maduramente su afectividad y sexualidad. Cuando sea necesario, nos serviremos de profesionales cualificados.","n":"318"},{"t":"p","h":"c. Procurar una buena formación intelectual, teniendo en cuenta la situación personal del <i>aspirante<\/i> y el ambiente del que procede y facilitando, si fuera el caso, las necesarias habilidades para aprender a estudiar y el tiempo necesario para adquirir la competencia lingüística en la que se desarrollará la etapa siguiente (Postulantado).","n":"318"},{"t":"p","h":"d. Facilitar al <i>aspirante<\/i> los contactos con grupos juveniles apostólicos que le mantengan abierto a la realidad circundante y que supongan para él mismo un adecuado medio de crecimiento.","n":"318"},{"t":"p","h":"e. Cultivar el sentido ético y estético y desarrollar la capacidad de juicio, procurando el contacto del <i>aspirante<\/i> con diversas realidades (pobreza, enfermedad, dolor) y realizando variadas actividades culturales, manuales y artísticas que le permitan desarrollar su creatividad.","n":"318"},{"t":"p","h":"f. Educar en la formación de la conciencia crítica frente a la realidad.","n":"318"},{"t":"p","h":"g. Ayudar a que el <i>aspirante<\/i> crezca física y psíquicamente, adquiriendo hábitos de autocontrol, austeridad y oblatividad.","n":"318"},{"t":"p","h":"<i>Dimensión cristiana. <\/i>Desarrollar una formación sólida que ayude al <i>aspirante<\/i> a vivir profunda y personalmente la fe cristiana y le conduzca a una experiencia de encuentro con Dios y, si fuera el caso, proporcionarle una eventual formación catecumenal.","n":"319","s":1},{"t":"p","h":"a. Estimular al <i>aspirante<\/i> para que valore la experiencia de fe que le ha permitido plantearse la opción vocacional misionera, respetando las otras confesiones cristianas y religiones<sup class=\"fn\" data-u=\"c7\" data-n=\"9\">9<\/sup>.","n":"319"},{"t":"p","h":"b. Fomentar la experiencia de oración y la piedad, a través del contacto asiduo con la Palabra de Dios, la iniciación litúrgica y otras prácticas de piedad.","n":"319"},{"t":"p","h":"c. Estimular al <i>aspirante<\/i> a la práctica y vivencia progresiva de los sacramentos de la eucaristía y de la reconciliación.","n":"319"},{"t":"p","h":"d. Iniciar al <i>aspirante<\/i> en la práctica de la dirección espiritual como herramienta indispensable para el discernimiento.","n":"319"},{"t":"p","h":"e. Proporcionarle una formación apostólica inicial acorde a su proceso de maduración, de modo que aprenda a vivir su condición cristiana como donación a los demás, sin buscar protagonismos. Preparar, acompañar y evaluar las experiencias en esta línea.","n":"319"},{"t":"p","h":"<i>Dimensión claretiana. <\/i>Continuar y profundizar el acompañamiento personal iniciado en la etapa anterior.","n":"320","s":1},{"t":"p","h":"a. Presentar la figura de Cristo misionero y de María como madre y modelo de respuesta fiel a la llamada gratuita de Dios.","n":"320"},{"t":"p","h":"b. Dar a conocer y contagiar entusiasmo por la figura de nuestro Fundador como modelo de imitación de Cristo y de respuesta vocacional y del Corazón de María, en cuya fragua se forman los misioneros.","n":"320"},{"t":"p","h":"c. Exponer la misión claretiana, la situación actual de la Congregación y algunos hechos sobresalientes de su historia.","n":"320"},{"t":"h","l":4,"h":"<i>2.1.4. Responsables<\/i>"},{"t":"p","h":"El formador de esta etapa cumple una función muy importante y delicada. Por eso, debe poseer, además de una suficiente preparación pedagógica, apostólica y religiosa, un carisma educativo que le permita llevar a cabo su tarea. Ha de ser entusiasta de la propia vocación y coherente en el testimonio de vida<sup class=\"fn\" data-u=\"c7\" data-n=\"10\">10<\/sup>. <i>El equipo de formadores debe ser un verdadero modelo de identificación para los prenovicios por la autenticidad, la alegría, la fraternidad y entrega con que cumple su misión formadora<\/i><sup class=\"fn\" data-u=\"c7\" data-n=\"11\">11<\/sup>. Es aconsejable implicar en la labor formativa a laicos de ambos sexos que, mediante sus conocimientos profesionales y experiencia, puedan contribuir a la formación integral de los prenovicios.","n":"321","s":1},{"t":"p","h":"La admisión al Aspirantado y la dimisión del mismo<b> <\/b>corresponde al respectivo equipo formativo, oído quien ha acompañado vocacionalmente al candidato o<b> <\/b>quien conste en el Plan formativo del lugar<i>.<\/i>","n":"322","s":1},{"t":"p","h":"Corresponde al Superior Mayor, debidamente asesorado por el equipo de formadores, y teniendo presente la finalidad y los objetivos del Prenoviciado, determinar la<b> <\/b>modalidad y duración del Aspirantado.","n":"323","s":1},{"t":"h","l":3,"h":"2.2. Postulantado"},{"t":"h","l":4,"h":"<i>2.2.1. Naturaleza y finalidad<\/i>"},{"t":"p","h":"El Postulantado <i>es la etapa de formación inmediatamente preparatoria para el Noviciado<\/i><sup class=\"fn\" data-u=\"c7\" data-n=\"12\">12<\/sup>. Se ordena a que los candidatos se preparen adecuadamente para comenzar su iniciación en la vida misionera<sup class=\"fn\" data-u=\"c7\" data-n=\"13\">13<\/sup> y la Congregación alcance un juicio ponderado sobre las garantías ofrecidas por ellos.","n":"324","s":1},{"t":"h","l":4,"h":"<i>2.2.2. Requisitos<\/i>"},{"t":"p","h":"Los requisitos por parte del candidato al Postulantado son:","n":"325","s":1},{"t":"p","h":"a. Mostrar signos de vocación claretiana, discernibles a través de sus aptitudes personales básicas, de su recta intención, de una conducta humana y cristiana coherente y de su voluntad positiva de seguir a Cristo en la Congregación<sup class=\"fn\" data-u=\"c7\" data-n=\"14\">14<\/sup>.","n":"325"},{"t":"p","h":"b. Solicitar por escrito su ingreso al Superior Mayor antes de comenzar el postulantado<sup class=\"fn\" data-u=\"c7\" data-n=\"15\">15<\/sup>.","n":"325"},{"t":"p","h":"c. Presentar los certificados de bautismo, de confirmación (si la hubiere recibido, caso contrario tendrá que recibir este sacramento durante esta etapa) y de estado libre, así como un certificado médico en el que conste que goza de buena salud física y psíquica para la vida misionera. Si se viere necesario, puede procederse a una adecuada verificación de sus actitudes psíquicas con ayuda de algún especialista, salvando siempre los derechos de la persona a la intimidad y a la buena fama<sup class=\"fn\" data-u=\"c7\" data-n=\"16\">16<\/sup>. Igualmente debe presentar un certificado extendido por la policía en el que se garantice que no tiene antecedentes penales ni acusaciones o denuncias por comportamientos sexuales inadecuados.","n":"325"},{"t":"p","h":"d. Informar que no ha estado previamente en otro seminario o casa de formación religiosa para, en caso contrario, posibilitar que se pueda recabar de sus responsables los informes necesarios.","n":"325"},{"t":"p","h":"e. Realizar por escrito, en el acto de admisión, una declaración, firmada por él mismo y dos testigos y conformada en lo posible a las leyes del país, en la que haga constar el carácter no laboral de sus vínculos con la Congregación, que conoce y acepta las normas en vigor sobre prevención y abusos sexuales y económicos, y la ausencia de impedimentos para su ingreso en ella, a tenor de nuestro derecho<sup class=\"fn\" data-u=\"c7\" data-n=\"17\">17<\/sup>. Al término del Postulantado hará su solicitud de ingreso en el noviciado al Superior Mayor<sup class=\"fn\" data-u=\"c7\" data-n=\"18\">18<\/sup>.","n":"325"},{"t":"h","l":4,"h":"<i>2.2.3. Objetivos generales<\/i>"},{"t":"p","h":"<i>Dimensión humana. <\/i>Adquirir el grado de madurez humana que se requiere para vivir con aprovechamiento la experiencia del noviciado<sup class=\"fn\" data-u=\"c7\" data-n=\"19\">19<\/sup>.","n":"326","s":1},{"t":"p","h":"<i>Dimensión cristiana. <\/i>Profundizar, doctrinal y vivencialmente, la iniciación cristiana<sup class=\"fn\" data-u=\"c7\" data-n=\"20\">20<\/sup> y el conocimiento de la propia vocación en la Iglesia.","n":"327","s":1},{"t":"p","h":"<i>Dimensión claretiana. <\/i>Tener un conocimiento suficiente de la vida y misión claretiana para hacer una primera opción por ella<sup class=\"fn\" data-u=\"c7\" data-n=\"21\">21<\/sup> con las progresivas rupturas y adhesiones que implica.","n":"328","s":1},{"t":"h","l":4,"h":"<i>2.2.4. Objetivos específicos y medios<\/i>"},{"t":"h","l":5,"h":"<i>a. Dimensión humana<\/i>"},{"t":"p","h":"<i>Los objetivos específicos<\/i> son los siguientes:","n":"329","s":1},{"t":"p","h":"a. Descubrir y potenciar los rasgos constitutivos de la madurez de la persona, especialmente los que constituyen la base humana para la experiencia del noviciado.","n":"329"},{"t":"p","h":"b. Vivir y desarrollar las facultades que implica: corporalidad, inteligencia, voluntad, sensibilidad.","n":"329"},{"t":"p","h":"c. Prestar una atención especial y cultivar la madurez afectiva y sexual. Potenciar y cultivar la capacidad para las relaciones interpersonales y la vida comunitaria<sup class=\"fn\" data-u=\"c7\" data-n=\"22\">22<\/sup>.","n":"329"},{"t":"p","h":"d. Crecer en la capacidad de reflexión y de sentido crítico, tanto respecto de sí mismo como de los demás y de la realidad en general.","n":"329"},{"t":"p","h":"e. Tomar conciencia y asumir la propia historia personal, familiar y social.","n":"329"},{"t":"p","h":"f. Asumir actitudes maduras y responsables en el uso de los medios de información y comunicación.","n":"329"},{"t":"p","h":"<i>Los medios <\/i>","n":"330","s":1},{"t":"p","h":"Con relación al desarrollo personal:","n":"330"},{"t":"p","h":"a. Valoración psicológica amplia del candidato y ayuda profesional cuando fuera necesaria.","n":"330"},{"t":"p","h":"b. Ofrecimiento de herramientas psicológicas que ayuden a conocer mejor la propia personalidad<sup class=\"fn\" data-u=\"c7\" data-n=\"23\">23<\/sup>.","n":"330"},{"t":"p","h":"c. Práctica de los medios naturales útiles para la salud corporal y psíquica, como el deporte, la higiene, las actividades artísticas, manualidades, tareas domésticas y las aficiones y el aprecio de la naturaleza.","n":"330"},{"t":"p","h":"d. Ofrecimiento de ocasiones para asumir responsabilidades, tomar decisiones, fomentar el espíritu de iniciativa, creatividad, espíritu de servicio y solidaridad.","n":"330"},{"t":"p","h":"e. Creación de hábitos de laboriosidad, autodisciplina, discernimiento, constancia de juicio y capacidad de elección conforme a unos valores superiores.","n":"330"},{"t":"p","h":"f. Iniciación en la práctica y valoración del silencio.","n":"330"},{"t":"p","h":"g. Dominio de los impulsos y coherencia entre acciones, palabras y actitudes.","n":"330"},{"t":"p","h":"h. Examen de los propios sentimientos, emociones y deseos para contrastarlos con los valores por los que se quiere optar.","n":"330"},{"t":"p","h":"i. Serena aceptación de las dificultades, de las frustraciones y de los elementos conflictivos de la propia historia, desdramatizando y desbloqueando las situaciones y tomando conciencia de la propia debilidad presente en la personalidad<sup class=\"fn\" data-u=\"c7\" data-n=\"24\">24<\/sup>.","n":"330"},{"t":"p","h":"j. Revisión de las relaciones familiares y de amistad, de modo que se adopte ante ellas una actitud realista y constructiva.","n":"330"},{"t":"p","h":"k. Uso responsable de los medios de comunicación e información siendo conscientes de las posibilidades que brindan a la formación, evangelización y de los peligros que pueden comportar.","n":"330"},{"t":"p","h":"l. Cultivo de la responsabilidad y la prudencia en las relaciones que se puedan crear y cultivar con otras personas a través de los medios de comunicación<sup class=\"fn\" data-u=\"c7\" data-n=\"25\">25<\/sup>.","n":"330"},{"t":"p","h":"Con relación a la sensibilización a los valores:","n":"331","s":1},{"t":"p","h":"a. Aceptación y respeto ante la creación, obra de Dios, el ser humano y toda forma de vida; educación, afecto y amistad hacia las personas (especialmente con los compañeros de comunidad); autoaceptación (sexual, caracterológica) y relaciones interpersonales constructivas; valoración del matrimonio y del voto de castidad.","n":"331"},{"t":"p","h":"b. Aprecio de los elementos valiosos de la propia cultura, apertura intercultural y a diversas formas de pensamiento, y sensibilidad artística.","n":"331"},{"t":"p","h":"c. Sensibilidad ante la realidad y conciencia frente al valor de la justicia, de las situaciones de pobreza y violencia y aprecio y respeto a la dignidad e igualdad de la mujer.","n":"331"},{"t":"p","h":"d. Cultivar la apertura e interés por la historia de vida de los demás.","n":"331"},{"t":"p","h":"Con relación al estudio:","n":"332","s":1},{"t":"p","h":"a. Instrucción sobre los componentes más esenciales de la madurez humana, acompañada de una reflexión personal y del contraste con el formador y compañeros.","n":"332"},{"t":"p","h":"b. Adquisición de una formación académica adecuada y de un método personal de estudio, de lectura y de investigación.","n":"332"},{"t":"p","h":"c. Introducción progresiva en el análisis de la propia realidad sociopolítica y cultural.","n":"332"},{"t":"p","h":"d. Iniciación en el estudio de las lenguas especialmente las de uso oficial (español e inglés) en la Congregación y las lenguas propias de los lugares de misión.","n":"332"},{"t":"h","l":5,"h":"<i>b. Dimensión cristiana<\/i>"},{"t":"p","h":"<i>Los objetivos específicos<\/i> son los siguientes:","n":"333","s":1},{"t":"p","h":"a. Lograr una formación cristiana (teórica y práctica) adecuada.","n":"333"},{"t":"p","h":"b. Descubrir progresivamente a Jesucristo, hijo de María, como amigo, y crear las condiciones que preparan para un encuentro personal con él (ruptura con el pecado, valoración y relativización del mundo).","n":"333"},{"t":"p","h":"c. Cultivar la vida de oración, los sacramentos, los valores evangélicos, y las diversas presencias y llamadas del Espíritu desde la realidad personal, familiar, social y eclesial.","n":"333"},{"t":"p","h":"d. Vivir las virtudes cristianas, en especial las que tienen una mayor proyección vocacional: la disponibilidad para el servicio fraterno, la castidad, la capacidad de entrega y sacrificio.","n":"333"},{"t":"p","h":"e. Encarnar la espiritualidad en la solidaridad eficaz con los más pobres y marginados.","n":"333"},{"t":"p","h":"f. Valorar la comunidad como espacio para vivir la fe de forma concreta.","n":"333"},{"t":"p","h":"g. Sintonizar con la realidad eclesial del lugar.","n":"333"},{"t":"p","h":"<i>Medios<\/i>","n":"334","s":1},{"t":"p","h":"Con relación a las experiencias:","n":"334"},{"t":"p","h":"a. Participación diaria en el sacramento de la eucaristía y frecuente en el de la reconciliación y, si fuera el caso, preparación y celebración del sacramento de la confirmación.","n":"334"},{"t":"p","h":"b. Contemplación de Dios en la naturaleza, en los acontecimientos, en la propia vida.","n":"334"},{"t":"p","h":"c. Momentos de oración personal basada en la Palabra de Dios, principalmente en el Evangelio.","n":"334"},{"t":"p","h":"d. Introducción en la práctica de la oración compartida comunitariamente.","n":"334"},{"t":"p","h":"e. Iniciación en la práctica del discernimiento cristiano.","n":"334"},{"t":"p","h":"f. Participación en celebraciones de la religiosidad popular, talleres de oración o de Biblia.","n":"334"},{"t":"p","h":"g. Gestos de desprendimiento y comunicación de bienes.","n":"334"},{"t":"p","h":"h. Testimonio de la alegría vocacional como invitación a otros jóvenes para abrazar la vocación misionera.","n":"334"},{"t":"p","h":"Con relación al estudio:","n":"335","s":1},{"t":"p","h":"a. Catequesis básica progresiva, que complemente y oriente la experiencia que tiene el postulante como fundamento de su fe cristiana.","n":"335"},{"t":"p","h":"b. Presentación sintética de la espiritualidad cristiana, particularmente de lo que significa la vida de gracia, y de la vocación, a partir de la llamada universal a la santidad.","n":"335"},{"t":"p","h":"c. Nociones básicas sobre la oración (métodos, fórmulas litúrgicas o bíblicas, rosario y otras devociones).","n":"335"},{"t":"h","l":5,"h":"<i>c. Dimensión claretiana<\/i>"},{"t":"p","h":"<i>Los objetivos específicos<\/i> son los siguientes:","n":"336","s":1},{"t":"p","h":"a. Tomar conciencia de la llamada de Dios en las experiencias vocacionales previas e integrarlas en esta etapa.","n":"336"},{"t":"p","h":"b. Crecer en la docilidad al Dios que se nos revela e interpela en la Palabra y en los acontecimientos de la vida del pueblo.","n":"336"},{"t":"p","h":"c. Descubrir y aceptar a María como madre que acompaña en el camino vocacional y protege en las dificultades, y también como modelo de fidelidad a Dios.","n":"336"},{"t":"p","h":"d. Fomentar la sensibilidad misionera y las actitudes de apertura a la universalidad.","n":"336"},{"t":"p","h":"e. Entrar en contacto con la figura del Fundador y ampliar el conocimiento de la historia de la Congregación y de la realidad de los Organismos Mayores.","n":"336"},{"t":"p","h":"f. Prepararse progresivamente con el estilo de vida propio del noviciado y entrenarse en las necesarias rupturas que comporta<sup class=\"fn\" data-u=\"c7\" data-n=\"26\">26<\/sup>.","n":"336"},{"t":"p","h":"<i>Medios<\/i>","n":"337","s":1},{"t":"p","h":"Con relación a las experiencias:","n":"337"},{"t":"p","h":"a. Contacto con el ambiente de procedencia (familia, amigos, grupos), compaginándolo con una ruptura progresiva exigida por el proyecto de vida claretiana.","n":"337"},{"t":"p","h":"b. Frecuentes entrevistas de acompañamiento formativo y espiritual, e iniciación en un plan de vida personal.","n":"337"},{"t":"p","h":"c. Celebración cuidada de las fiestas marianas resaltadas en la liturgia y en la vida de la Congregación; rezo de las oraciones marianas tradicionales en la Congregación. Creación de un ambiente que facilite la vivencia y la expresión de la filiación cordimariana<sup class=\"fn\" data-u=\"c7\" data-n=\"27\">27<\/sup>.","n":"337"},{"t":"p","h":"d. Adquisición de hábitos comunitarios (respeto, aceptación mutua, generosa colaboración) y de estudio.","n":"337"},{"t":"p","h":"e. Realización de algunas actividades apostólicas: catequesis, animación litúrgica y acción social.","n":"337"},{"t":"p","h":"f. Visitas a comunidades y posiciones apostólicas claretianas; especialmente, si se puede, a la comunidad del noviciado y a otras que tengan experiencias pastorales significativas por su importancia en la vida de los Organismos Mayores.","n":"337"},{"t":"p","h":"g. Información, por parte de algunos claretianos, de las actividades apostólicas que tienen encomendadas.","n":"337"},{"t":"p","h":"h. Relaciones intercongregacionales que permitan valorar otros carismas y conocer mejor el propio.","n":"337"},{"t":"p","h":"i. Aprovechar los medios digitales para familiarizarse con la vida de la Congregación.","n":"337"},{"t":"p","h":"Con relación al estudio:","n":"338","s":1},{"t":"p","h":"a. Lectura de la <i>Autobiografía<\/i> del Fundador; información sobre ciertos episodios fundamentales de la historia de la Congregación y de la Provincia; acercamiento a las personas que más han destacado como misioneros (lectura de los opúsculos de la colección <i>Claretianos de ayer y hoy<\/i>).","n":"338"},{"t":"p","h":"b. Lectura personal diaria de la Palabra de Dios e iniciación en aquellos dinamismos y prácticas de piedad más enraizados en la historia de la Congregación (retiro espiritual, examen de conciencia, rosario, visita al Santísimo Sacramento).","n":"338"},{"t":"p","h":"c. Ofrecimiento de cursos e instancias con contenido claretiano que se ajuste a la etapa que se vive (por ejemplo, la Semana Claretiana).","n":"338"},{"t":"h","l":4,"h":"<i>2.2.3. Características<\/i>"},{"t":"p","h":"La organización de esta etapa corresponde al Superior Mayor<sup class=\"fn\" data-u=\"c7\" data-n=\"28\">28<\/sup>. Entre los diversos lugares y modos, los más frecuentes entre nosotros son:","n":"339","s":1},{"t":"p","h":"a. En una casa señalada expresamente para este fin.","n":"339"},{"t":"p","h":"b. En una comunidad de la Congregación, aunque sin compartir toda la vida<sup class=\"fn\" data-u=\"c7\" data-n=\"29\">29<\/sup>. Como principio, se desaconseja que sea la comunidad del noviciado<sup class=\"fn\" data-u=\"c7\" data-n=\"30\">30<\/sup>. Es conveniente incluso que sea fuera de esa casa. No obstante, si el postulantado se establece en la casa noviciado, debe formar una sección aparte<sup class=\"fn\" data-u=\"c7\" data-n=\"31\">31<\/sup>.","n":"339"},{"t":"p","h":"c. En casos excepcionales, fuera de nuestras comunidades, con tal de que se garanticen un plan específico, algunos períodos de contacto con la Congregación o algunos de sus representantes y, sobre todo, la guía de un claretiano experto<sup class=\"fn\" data-u=\"c7\" data-n=\"32\">32<\/sup>.","n":"339"},{"t":"p","h":"Tanto la admisión del candidato al postulantado como su eventual dimisión son competencia del Superior Mayor, debidamente asesorado por quienes han acompañado al candidato<sup class=\"fn\" data-u=\"c7\" data-n=\"33\">33<\/sup>. Si éste proviniera de otro instituto o de un seminario diocesano, es necesario que el Superior Mayor cuente con un informe emitido por el superior respectivo<sup class=\"fn\" data-u=\"c7\" data-n=\"34\">34<\/sup>.","n":"340","s":1},{"t":"p","h":"En principio, el postulantado debe hacerse en el país de origen, y, a ser posible, dentro del propio Organismo Mayor. Con todo, cuando los postulantes sean pocos o exista alguna razón que lo aconseje, los Organismos Mayores interesados pueden establecer un centro común.","n":"341","s":1},{"t":"p","h":"Los Organismos Mayores que comparten noviciado tienen que tener criterios generales comunes y procurar una preparación similar de los postulantes que vayan a hacer el noviciado, así como el conocimiento adecuado de la lengua que se usa en el noviciado.","n":"342","s":1},{"t":"p","h":"La duración del postulantado, que nunca será menor de seis meses ni sobrepasar generalmente los dos años, corresponde determinarla al Superior Mayor. Será lo suficientemente amplia como para permitir la consecución de la finalidad y objetivos de este período formativo<sup class=\"fn\" data-u=\"c7\" data-n=\"35\">35<\/sup>.","n":"343","s":1},{"t":"p","h":"El postulantado tendrá un proyecto formativo aprobado por el Gobierno del Organismo Mayor. Contendrá los objetivos y medios propios del postulantado claretiano, según las circunstancias locales y las modalidades determinadas por el Superior Mayor. Deberá ser evaluado periódicamente para verificar el progreso y preparación de los candidatos al noviciado.","n":"344","s":1},{"t":"h","l":4,"h":"<i>2.2.4. Responsables<\/i>"},{"t":"p","h":"Entre los miembros del Equipo formativo, hay un responsable de esta etapa (Postulantado) que debe ser un misionero experimentado, con una preparación psicopedagógica y espiritual adecuada, con aptitudes para entrar en sintonía con los jóvenes y con suficiente experiencia pastoral<sup class=\"fn\" data-u=\"c7\" data-n=\"36\">36<\/sup>. Su nombramiento corresponde al Superior Mayor.","n":"345","s":1},{"t":"p","h":"La tarea formativa en esta etapa implica:","n":"346","s":1},{"t":"p","h":"a) Recoger, en colaboración con el candidato, cuantos datos e informaciones sean útiles para discernir los signos de vocación claretiana y sus eventuales contraindicaciones.","n":"346"},{"t":"p","h":"b) Ayudar al postulante a conseguir los objetivos propios de la etapa y a lograr la madurez necesaria para tomar sus decisiones con las debidas garantías de libertad y responsabilidad.","n":"346"},{"t":"p","h":"c) Ofrecerle, independientemente de la forma de realizar el postulantado, una experiencia de vida comunitaria claretiana en un ambiente favorable para el discernimiento<sup class=\"fn\" data-u=\"c7\" data-n=\"37\">37<\/sup>.","n":"346"},{"t":"p","h":"d) Asegurar la preparación suficiente (especialmente lingüística y cultural) si el postulante tuviese que realizar el noviciado en un país de lengua y cultura diferentes a las suyas.","n":"346"},{"t":"p","h":"Para asegurar el acompañamiento y la continuidad en la formación, el responsable de esta etapa deberá estar en asiduo contacto con el maestro de novicios, y con los demás formadores del Prenoviciado.","n":"347","s":1}],"notes":{"1":"Cf. 1F 104.","2":"Cf. CIC 642; Dir 175; 1F 105; DVC 240-268.","3":"RFIS 19.","4":"Cf. RFIS 199; Instruction sobre los criterios de discernimiento vocacional, n°2 (4 de noviembre de 2005).","5":"RFIS 200.","6":"Cf. FRANCISCO, <i>Discurso de clausura del Congreso de la lucha contra la pederastia, <\/i>no. 4<i> <\/i> (25 de febrero de 2019).","7":"Cf. SCa<i> <\/i>64.","8":"Cf. Dir 183.","9":"Cf. MS 60, 62.","10":"Cf. 2F 14b.","11":"Dir 185.","12":"Dir 186.","13":"Cf. PI 42; CIC 597 §2.","14":"Cf. Dir 188.","15":"Cf. Dir 190.","16":"Cf. CIC 642, 220.","17":"Cf. Dir 190.","18":"Cf. Dir 201.","19":"Cf. PI 43.","20":"Cf. PI 43; Dir 186-187.","21":"Cf. Dir 188.","22":"Cf. RFIS 63, 95.","23":"Cf. OUCP 5-10.","24":"Cf. RFIS 96.","25":"Cf. HAC 2J; MS 18.","26":"Cf. Dir 186.","27":"Cf. NEM, pp. 51-52; HAC 34–36.","28":"Cf. Dir 189.","29":"Cf. Dir 192.","30":"Cf. PI 44.","31":"Cf. PI 44; Dir 192.","32":"Cf. Dir 192.","33":"Cf. Dir 189, 271.","34":"Cf. CIC 241 §3.","35":"Cf. Dir 193.","36":"Cf. Dir 194.","37":"Cf. Dir 191-192."}},{"id":"c8","title":"Etapa de iniciación: noviciado","short":"Capítulo 8","kind":"main","pages":[201,214],"blocks":[{"t":"h","l":2,"h":"1. NATURALEZA Y FINALIDAD"},{"t":"p","h":"El noviciado es un tiempo de iniciación integral en el seguimiento de Cristo evangelizador<sup class=\"fn\" data-u=\"c8\" data-n=\"1\">1<\/sup>, según el carisma claretiano, en orden a la incorporación a la Congregación, mediante la profesión religiosa. Se ordena a que los novicios puedan tener un mejor conocimiento de la vocación divina tal como se propone en la Congregación, experimenten su modo de vida, conformen la mente y el corazón con su espíritu evangelizador para que puedan madurar su opción fundamental por Cristo en la Congregación; y, al mismo tiempo, puedan ser comprobadas su intención e idoneidad<sup class=\"fn\" data-u=\"c8\" data-n=\"2\">2<\/sup>.","n":"348","s":1},{"t":"h","l":2,"h":"2. REQUISITOS"},{"t":"p","h":"Serán considerados idóneos los postulantes que vayan progresando adecuadamente en aquellas actitudes que orientan hacia las exigencias de la vida religiosa y de las actividades del Instituto<sup class=\"fn\" data-u=\"c8\" data-n=\"3\">3<\/sup>. La necesaria coordinación entre los responsables de la pastoral juvenil vocacional, del Prenoviciado y del Noviciado contribuirá a obtener un juicio acertado sobre la idoneidad del candidato para ingresar en el noviciado.","n":"349","s":1},{"t":"p","h":"Pueden ser admitidos al noviciado los postulantes que, habiendo cumplido 17 años, deseen ser misioneros claretianos, posean las necesarias dotes de salud física y psíquica, aptitud y madurez humana, espiritual y vocacional y carezcan de impedimento canónico<sup class=\"fn\" data-u=\"c8\" data-n=\"4\">4<\/sup>. La admisión corresponde al Superior Mayor con el voto consultivo de su Consejo; pero tratándose de un clérigo, seminarista o exreligioso, el Superior Mayor debe contar con el voto deliberativo de su Consejo<sup class=\"fn\" data-u=\"c8\" data-n=\"5\">5<\/sup>; la dimisión, en el caso de que fuera necesario, corresponde al Superior Mayor<sup class=\"fn\" data-u=\"c8\" data-n=\"6\">6<\/sup>.","n":"350","s":1},{"t":"p","h":"Además de la solicitud escrita de admisión al noviciado<sup class=\"fn\" data-u=\"c8\" data-n=\"7\">7<\/sup>, los candidatos que no lo hayan hecho al ingresar en el postulantado han de presentar el certificado de bautismo, de confirmación y de estado libre<sup class=\"fn\" data-u=\"c8\" data-n=\"8\">8<\/sup>, así como un certificado médico y un certificado penal; y, en el caso de que provenga de un seminario o de un Instituto religioso, el informe del respectivo superior<sup class=\"fn\" data-u=\"c8\" data-n=\"9\">9<\/sup>.","n":"351","s":1},{"t":"h","l":2,"h":"3. OBJETIVOS GENERALES"},{"t":"p","h":"<i>Dimensión humana. <\/i>Avanzar en un proceso de maduración que permita al candidato optar consciente y libremente por la vida claretiana y asumir desde el principio las exigencias que se derivan de ella.","n":"352","s":1},{"t":"p","h":"<i>Dimensión cristiana. <\/i>Fundamentar la vida de unión con Cristo, el Hijo y Enviado del Padre, hecho hombre de la Virgen María por obra del Espíritu Santo<sup class=\"fn\" data-u=\"c8\" data-n=\"10\">10<\/sup>.","n":"353","s":1},{"t":"p","h":"<i>Dimensión claretiana. <\/i>Iniciarse en la vida religiosa, según el carisma, espíritu y misión de San Antonio María Claret y de la Congregación.","n":"354","s":1},{"t":"h","l":2,"h":"4. OBJETIVOS ESPECÍFICOS Y MEDIOS"},{"t":"p","h":"Los objetivos y medios que se sugieren deben ser puestos en práctica a través de una metodología que combine armónicamente las exposiciones teóricas, las lecturas personales, el trabajo individual y en grupo, la ejercitación práctica, la oración personal y las celebraciones comunitarias.","n":"355","s":1},{"t":"h","l":3,"h":"4.1. Dimensión humana"},{"t":"h","l":4,"h":"<i>4.1.1. Objetivos específicos<\/i>"},{"t":"p","h":"Son los siguientes:","n":"356","s":1},{"t":"p","h":"a. Lograr un clima de “ruptura” con el estilo de vida anterior, de desierto, de silencio y de “nueva apertura” a los valores de la vida misionera.","n":"356"},{"t":"p","h":"b. Conocer, aceptar e integrar armónicamente los diferentes aspectos que conforman a la persona, teniendo especialmente en cuenta el desarrollo de la capacidad de juicio sobre sí y sobre la realidad.","n":"356"},{"t":"p","h":"c. Integrarse afectiva y efectivamente en el noviciado en un ambiente familiar sencillo y austero.","n":"356"},{"t":"p","h":"d. Cultivar las virtudes humanas que dan más credibilidad a los discípulos de Cristo<sup class=\"fn\" data-u=\"c8\" data-n=\"11\">11<\/sup>: laboriosidad, respeto a uno mismo y a los demás, alegría, oblatividad, disponibilidad, cordialidad, sencillez, constancia y firmeza de voluntad, fidelidad a la palabra dada, dignidad personal en el porte y lenguaje.","n":"356"},{"t":"p","h":"e. Asumir, integrar y desarrollar la afectividad y la sexualidad, dando debida atención a las heridas y rupturas del pasado que no están integradas<sup class=\"fn\" data-u=\"c8\" data-n=\"12\">12<\/sup>.","n":"356"},{"t":"p","h":"f. Fomentar el sentido de responsabilidad y libertad en la toma de decisiones personales.","n":"356"},{"t":"p","h":"g. Cuidar la sensibilidad y la expresión artísticas (música, literatura, artes plásticas).","n":"356"},{"t":"h","l":4,"h":"<i>4.1.2. Medios<\/i>"},{"t":"p","h":"Son los siguientes:","n":"357","s":1},{"t":"p","h":"<i>a. Para facilitar el clima de desierto y de ruptura:<\/i> aprovechamiento de las condiciones que se derivan de la ubicación del noviciado; uso crítico y responsable de los medios de comunicación social (radio, TV, prensa, TICs); moderación en la relación externa con familiares y amigos; acciones que favorezcan el desprendimiento y la disponibilidad.","n":"357"},{"t":"p","h":"<i>b. Para crear un ambiente adecuado:<\/i> organización del ritmo de vida de modo que favorezca la amistad, la convivencia, y el compartir la fe, las cualidades y dones; participación en la elaboración del proyecto comunitario y en sus sucesivas evaluaciones; distribución de tareas y responsabilidades.","n":"357"},{"t":"p","h":"<i>c. Para ir creciendo en madurez:<\/i> presentación de los criterios de madurez humana, de alguna caracterología sobre tipos de personalidad y del desarrollo psico-sexual<sup class=\"fn\" data-u=\"c8\" data-n=\"13\">13<\/sup>; nociones pedagógicas del acompañamiento, con especial atención a la integración de problemas no resueltos; autoexamen de los propios sentimientos y emociones; espacios prolongados de silencio, así como ocasiones para cultivar relaciones humanas armoniosas, practicar la corrección fraterna y animar a los otros; prácticas de expresión oral y de redacción escrita; espacios abiertos para la creatividad y el desarrollo de las propias aptitudes humanas; ejercicios de trabajo físico y manual y actividades deportivas frecuentes; cultivo de actividades artísticas; revisiones de vida; experiencias de encuentro con realidades de pobreza y marginación.","n":"357"},{"t":"h","l":3,"h":"4.2. Dimensión cristiana"},{"t":"h","l":4,"h":"<i>4.2.1. Objetivos específicos<\/i>"},{"t":"p","h":"Son los siguientes:","n":"358","s":1},{"t":"p","h":"a. Profundizar en el seguimiento de Cristo y en una íntima relación con Él, como centro unificador de toda experiencia espiritual, como aquel que nos dispone a cumplir siempre la voluntad del Padre y a hacernos dóciles al Espíritu<sup class=\"fn\" data-u=\"c8\" data-n=\"14\">14<\/sup>.","n":"358"},{"t":"p","h":".","n":"358"},{"t":"p","h":"b. Plantear la propia vida desde la elección gratuita del Padre, el discernimiento espiritual, la aceptación del Evangelio como norma de vida y el sentido de Iglesia.","n":"358"},{"t":"p","h":"c. Personalizar e interiorizar el espíritu de las bienaventuranzas, a ejemplo de María, modelo de escucha y de respuesta a la Palabra de Dios.","n":"358"},{"t":"p","h":"d. Asimilar, teórica y experiencialmente, los fundamentos bíblicos, teológicos y espirituales de la vida cristiana, que permitan alcanzar los fines propios del noviciado y responder así a la vocación recibida.","n":"358"},{"t":"h","l":4,"h":"<i>4.2.2. Medios<\/i>"},{"t":"p","h":"Con relación a las experiencias:","n":"359","s":1},{"t":"p","h":"a. Profundización en la oración personal con tiempos largos dedicados a ella y una adecuada pedagogía de la misma (fundamentación bíblica y teológica, métodos, dificultades, diversidad de expresiones). Acentuación de la oración apostólica.","n":"359"},{"t":"p","h":"b. Fomento de una espiritualidad comprometida y compartida con el pueblo de Dios (grupos apostólicos, agentes de evangelización, comunidades populares).","n":"359"},{"t":"p","h":"c. Incorporación de los valores religiosos de la gente del entorno a nuestras expresiones de fe.","n":"359"},{"t":"p","h":"d. Celebración diaria de la eucaristía y de la liturgia de las horas, y celebraciones frecuentes (personales y comunitarias) de la reconciliación<sup class=\"fn\" data-u=\"c8\" data-n=\"15\">15<\/sup>.","n":"359"},{"t":"p","h":"Con relación al estudio:","n":"360","s":1},{"t":"p","h":"a. Introducción a la Escritura en general y a una lectura vocacional de la misma en particular.","n":"360"},{"t":"p","h":"b. Presentación de la figura de Dios Padre en el AT y NT acentuando especialmente su providencia, misericordia y la confianza en Él<sup class=\"fn\" data-u=\"c8\" data-n=\"16\">16<\/sup>.","n":"360"},{"t":"p","h":"c. Introducción al misterio de Cristo, muerto y resucitado; atención especial a los relatos vocacionales, en los que aparece como Maestro y Señor que llama a su seguimiento<sup class=\"fn\" data-u=\"c8\" data-n=\"17\">17<\/sup>.","n":"360"},{"t":"p","h":"d. Meditación de los textos joánicos y paulinos que tratan sobre la acción del Espíritu en el creyente para suscitar la docilidad a sus inspiraciones<sup class=\"fn\" data-u=\"c8\" data-n=\"18\">18<\/sup>.","n":"360"},{"t":"p","h":"e. Presentación de la figura de María tal como aparece dentro de la historia de salvación, acentuando la elección libre y gratuita Dios hace de Ella, y la respuesta de fe obediente que Ella da, como sierva y discípula de su Hijo.","n":"360"},{"t":"p","h":"f. Iniciación en el misterio de la Iglesia.","n":"360"},{"t":"p","h":"g. Reflexión sobre la vocación religiosa: discernimiento vocacional (signos, aptitudes, motivaciones, dificultades), teología y aspectos psicopedagógicos.","n":"360"},{"t":"p","h":"h. Introducción a la espiritualidad cristiana y acercamiento a los grandes autores de la tradición espiritual de la Iglesia<sup class=\"fn\" data-u=\"c8\" data-n=\"19\">19<\/sup>.","n":"360"},{"t":"p","h":"i. Profundización en el sentido y en la práctica de la oración litúrgica y pedagogía de la misma (su sentido de oración eclesial con Jesús; sus diversas manifestaciones de alabanza, acción de gracias, intercesión; el significado teológico espiritual de la liturgia de las horas y de los sacramentos de iniciación y reconciliación).","n":"360"},{"t":"p","h":"j. Comprensión y práctica del acompañamiento espiritual, el discernimiento y el examen particular.","n":"360"},{"t":"h","l":3,"h":"4.3. Dimensión claretiana"},{"t":"h","l":4,"h":"<i>4.3.1. Objetivos específicos<\/i>"},{"t":"p","h":"Son los siguientes:","n":"361","s":1},{"t":"p","h":"a. Aprender “a llevar una vida consagrada a Dios y a los hombres”, por medio de los consejos evangélicos en orden al seguimiento de Jesús y al anuncio del Evangelio<sup class=\"fn\" data-u=\"c8\" data-n=\"20\">20<\/sup>.","n":"361"},{"t":"p","h":"b. Descubrir el sentido de la filiación cordimariana y fomentar su vivencia.","n":"361"},{"t":"p","h":"c. Conocer y amar a nuestro Fundador, crecer en el sentido de identidad claretiana y pertenencia a la Congregación y profundizar en su patrimonio espiritual.","n":"361"},{"t":"p","h":"d. Experimentar de una forma estable la vida comunitaria misionera de acuerdo con las Constituciones.","n":"361"},{"t":"p","h":"e. Dedicarse al estudio de las materias relacionadas con la finalidad del noviciado.","n":"361"},{"t":"p","h":"f. Asimilar el espíritu misionero y prepararse para el apostolado según las orientaciones de los últimos Capítulos Generales<sup class=\"fn\" data-u=\"c8\" data-n=\"21\">21<\/sup>.","n":"361"},{"t":"p","h":"g. Aceptar el discernimiento y la mediación del Maestro, superiores y hermanos de comunidad<sup class=\"fn\" data-u=\"c8\" data-n=\"22\">22<\/sup>.","n":"361"},{"t":"h","l":4,"h":"<i>4.3.2. Medios<\/i>"},{"t":"p","h":"Con relación a las experiencias:","n":"362","s":1},{"t":"p","h":"a. Celebración de las fiestas de la Congregación: El Corazón de María, el Fundador, los Beatos Mártires Claretianos y la Fundación de la Congregación.","n":"362"},{"t":"p","h":"b. Recuerdo de las efemérides claretianas: Los compatronos, la aprobación de las Constituciones, la canonización del P. Claret, la gracia de la conservación de las especies sacramentales. También, incentivar el buen uso de nuestro Directorio Espiritual y el Calendario Claretiano en las celebraciones comunitarias y acontecimientos claretianos. Algunas de estas celebraciones se pueden compartir con miembros de otras comunidades y de la Familia Claretiana.","n":"362"},{"t":"p","h":"c. Reuniones y contactos periódicos con claretianos de otras comunidades para compartir sus trabajos misioneros, recibir información de los proyectos provinciales, de asuntos de gobierno y otros.","n":"362"},{"t":"p","h":"d. Visitas a algunas de nuestras comunidades, sobre todo cuando se celebren profesiones, ordenaciones, envíos misioneros, o acontecimientos significativos.","n":"362"},{"t":"p","h":"e. Utilización de símbolos de nuestra tradición espiritual: iconografía del Corazón de María, del P. Fundador, del hecho de la fundación, de los mártires claretianos, y otros.","n":"362"},{"t":"p","h":"f. Puesta en práctica de algunas dinámicas orientadas a fomentar unas buenas relaciones interpersonales para trabajar en equipo, y cultivar competencias para vivir en contextos interculturales.","n":"362"},{"t":"p","h":"g. Celebración de las fiestas de más relieve para la comunidad y sus miembros; relaciones de amabilidad, hospitalidad y servicialidad con quienes la visitan.","n":"362"},{"t":"p","h":"h. Experiencias apostólicas concretas, en equipo, en el campo de la catequesis y de la animación litúrgica, y de la marginación y la pobreza.","n":"362"},{"t":"p","h":"i. Contactos con claretianos que trabajan en nuestras misiones.","n":"362"},{"t":"p","h":"Con relación al estudio:","n":"363","s":1},{"t":"p","h":"a. Presentación de los fundamentos bíblicos, históricos y teológicos de la vida religiosa.","n":"363"},{"t":"p","h":"b. Estudio de sus contenidos básicos: la consagración y los votos (sus fundamentos bíblicos, teológicos y carismáticos; sus aspectos psicopedagógicos; su dimensión teologal, fraterna y apostólica; sus consecuencias prácticas); la comunidad claretiana como comunidad misionera; la misión del claretiano en el contexto de la misión de la Iglesia.","n":"363"},{"t":"p","h":"c. Estudio de la experiencia de Claret, a través de la <i>Autobiografía<\/i> y de otros escritos suyos (autobiográficos y espirituales, principalmente), con especial atención a su itinerario vocacional y a su expresión simbólica en la alegoría de la fragua.","n":"363"},{"t":"p","h":"d. Presentación del carisma y espíritu claretianos, y estudio de las Constituciones, del Directorio, de los documentos de los últimos Capítulos Generales.","n":"363"},{"t":"p","h":"e. Presentación de una síntesis de la historia de la Congregación, tanto de los acontecimientos más relevantes como de las biografías de aquellos misioneros que han vivido de una manera ejemplar<sup class=\"fn\" data-u=\"c8\" data-n=\"23\">23<\/sup>; sin dejar de presentar la actual situación de la Congregación en el mundo.","n":"363"},{"t":"p","h":"f. Presentación sistemática, seguimiento y evaluación de las virtudes recomendadas a los novicios en las Constituciones: fe viva<sup class=\"fn\" data-u=\"c8\" data-n=\"24\">24<\/sup>, confianza<sup class=\"fn\" data-u=\"c8\" data-n=\"25\">25<\/sup>, humildad evangélica<sup class=\"fn\" data-u=\"c8\" data-n=\"26\">26<\/sup>, docilidad al Espíritu<sup class=\"fn\" data-u=\"c8\" data-n=\"27\">27<\/sup>, rectitud de intención<sup class=\"fn\" data-u=\"c8\" data-n=\"28\">28<\/sup>, fidelidad<sup class=\"fn\" data-u=\"c8\" data-n=\"29\">29<\/sup>.","n":"363"},{"t":"p","h":"g. Fundamentación de la espiritualidad cordimariana, de las virtudes claretianas misioneras, de los tres modos posibles de vivir la única vocación claretiana (presbíteros, diáconos, hermanos), y presentación de las diversas instituciones que integran la Familia Claretiana.","n":"363"},{"t":"p","h":"h. Conocimiento de la sociedad actual y de aquellas necesidades que más reclaman nuestra atención.","n":"363"},{"t":"p","h":"i. Orientaciones para la práctica del apostolado y técnicas del mismo (nociones de pastoral general y catequética; dinámicas diversas).","n":"363"},{"t":"h","l":2,"h":"5. CARACTERÍSTICAS"},{"t":"p","h":"Teniendo en cuenta lo señalado por el derecho<sup class=\"fn\" data-u=\"c8\" data-n=\"30\">30<\/sup>, el Gobierno Provincial puede organizar el noviciado de modos diversos, según las necesidades y circunstancias de cada zona<sup class=\"fn\" data-u=\"c8\" data-n=\"31\">31<\/sup>.","n":"364","s":1},{"t":"p","h":"A modo de excepción, en casos particulares, por concesión del Superior General con el consentimiento de su Consejo, un candidato puede hacer el noviciado en una casa del Instituto distinta de la del noviciado, siempre bajo la dirección de un religioso que haga las veces de maestro<sup class=\"fn\" data-u=\"c8\" data-n=\"32\">32<\/sup>.","n":"365","s":1},{"t":"p","h":"La duración mínima del noviciado ha de ser de doce meses; en casos particulares, el Superior Mayor puede prolongar el tiempo de prueba hasta un máximo de seis meses<sup class=\"fn\" data-u=\"c8\" data-n=\"33\">33<\/sup> sobre la duración ordinaria. No debe durar nunca más de dos años<sup class=\"fn\" data-u=\"c8\" data-n=\"34\">34<\/sup>.","n":"366","s":1},{"t":"p","h":"Es aconsejable que el candidato realice el noviciado en su propio ambiente cultural<sup class=\"fn\" data-u=\"c8\" data-n=\"35\">35<\/sup>, pero por razones prácticas o de calidad formativas y dada la universalidad de nuestra vocación claretiana, cuando sea conveniente, el candidato podría ser enviado a algún noviciado internacional o interprovincial establecido por la Congregación<sup class=\"fn\" data-u=\"c8\" data-n=\"36\">36<\/sup>.","n":"367","s":1},{"t":"p","h":"En la programación formativa se han de recoger los diversos elementos indicados en el derecho universal, en las Constituciones y en el Directorio<sup class=\"fn\" data-u=\"c8\" data-n=\"37\">37<\/sup>, y los presentados en este Plan de Formación.","n":"368","s":1},{"t":"h","l":2,"h":"6. EL MAESTRO DE NOVICIOS Y SUS COLABORADORES"},{"t":"p","h":"El Maestro de novicios es designado por el Superior Mayor con el consentimiento de su Consejo. Ha de ser profeso perpetuo y estar dotado de las cualidades humanas, religiosas y apostólicas que le permitan cumplir plenamente su misión<sup class=\"fn\" data-u=\"c8\" data-n=\"38\">38<\/sup>. Además de una conveniente experiencia apostólica, debe poseer un gran amor a la Congregación, aptitudes pedagógicas, y las dotes necesarias de madurez, amabilidad, prudencia y sólida doctrina respecto a la naturaleza y misión de la Congregación en la Iglesia<sup class=\"fn\" data-u=\"c8\" data-n=\"39\">39<\/sup>.","n":"369","s":1},{"t":"p","h":"El Maestro desempeña la función de ayudar a los novicios, con su palabra y ejemplo, a formarse en la vida misionera de la Congregación<sup class=\"fn\" data-u=\"c8\" data-n=\"40\">40<\/sup>. A tal fin, ha de:","n":"370","s":1},{"t":"p","h":"a. Acompañar personalmente a cada novicio, orientándolo de manera personalizada e inculcándole las virtudes humanas y cristianas<sup class=\"fn\" data-u=\"c8\" data-n=\"41\">41<\/sup>.","n":"370"},{"t":"p","h":"b. Poner empeño en crear y animar una verdadera comunidad de fe y amor entre los novicios.","n":"370"},{"t":"p","h":"c. Procurar que estos consigan la unidad de vida misionera que les permita integrar de manera armoniosa el espíritu de unión con Dios y la acción apostólica.","n":"370"},{"t":"p","h":"<i>d. Discernir y comprobar la vocación de los novicios<\/i><sup class=\"fn\" data-u=\"c8\" data-n=\"42\">42<\/sup>.","n":"370"},{"t":"p","h":"Para que pueda dedicarse por entero a una tarea de tanta importancia ha de estar libre de todas las obligaciones y cargos que se lo impidan.","n":"371","s":1},{"t":"p","h":"El Maestro debe informar periódicamente al Superior Mayor sobre la marcha del noviciado y de cada novicio<sup class=\"fn\" data-u=\"c8\" data-n=\"43\">43<\/sup>.","n":"372","s":1},{"t":"p","h":"La dirección de los novicios queda reservado <i>sólo al maestro, bajo la autoridad de los Superiores Mayores<\/i><sup class=\"fn\" data-u=\"c8\" data-n=\"44\">44<\/sup>. El Maestro puede contar con colaboradores, que trabajen en equipo y compartan responsabilidades y funciones. Estos dependen de él en lo que se refiere a la dirección del noviciado y a la aplicación del plan de formación<sup class=\"fn\" data-u=\"c8\" data-n=\"45\">45<\/sup>.","n":"373","s":1},{"t":"h","l":2,"h":"7. MOMENTOS ESPECIALES"},{"t":"p","h":"El inicio del noviciado debe ir <i>precedido de no menos de cinco días íntegros de ejercicios espirituales<\/i><sup class=\"fn\" data-u=\"c8\" data-n=\"46\">46<\/sup>. Conviene celebrar el rito de iniciación según el ritual propio de la Congregación<sup class=\"fn\" data-u=\"c8\" data-n=\"47\">47<\/sup>.","n":"374","s":1},{"t":"p","h":"Para completar la formación de los novicios pueden programarse uno o más períodos de ejercicio del apostolado fuera de la comunidad del noviciado, teniendo siempre en cuenta las prescripciones del derecho al respecto<sup class=\"fn\" data-u=\"c8\" data-n=\"48\">48<\/sup>.","n":"375","s":1},{"t":"p","h":"Tres meses antes de la fecha prevista para terminar el noviciado, el novicio ha de solicitar por escrito al Superior Mayor la admisión a la profesión religiosa, expresando su voluntad de perseverar en la Congregación, su disponibilidad para el cumplimiento de las Constituciones y demás normas de nuestra Congregación<sup class=\"fn\" data-u=\"c8\" data-n=\"49\">49<\/sup> y su deseo actual de ser misionero claretiano según la vocación laical, diaconal o presbiteral <sup class=\"fn\" data-u=\"c8\" data-n=\"50\">50<\/sup>.","n":"376","s":1},{"t":"p","h":"Es necesario cuidar la preparación inmediata antes de la profesión, proporcionando al candidato el tiempo suficiente de oración y silencio para disponerse adecuadamente a emitir los votos. Todos los miembros de la comunidad, especialmente el superior, los formadores y los compañeros, están obligados a dar sus informes para un recto discernimiento<sup class=\"fn\" data-u=\"c8\" data-n=\"51\">51<\/sup>.","n":"377","s":1},{"t":"p","h":"Por la primera profesión, que se ha de celebrar según el rito propio de la Congregación<sup class=\"fn\" data-u=\"c8\" data-n=\"52\">52<\/sup>, el novicio queda incorporado al Instituto<sup class=\"fn\" data-u=\"c8\" data-n=\"53\">53<\/sup>. Para que sea válida han de cumplirse las prescripciones del derecho universal y congregacional<sup class=\"fn\" data-u=\"c8\" data-n=\"54\">54<\/sup>. La profesión se realiza <i>por la consagración a Dios, mediante la emisión de los votos de pobreza, castidad y obediencia y por un acto público de entrega al Corazón de María en orden a realizar el fin de la Congregación según las Constituciones<\/i><sup class=\"fn\" data-u=\"c8\" data-n=\"55\">55<\/sup>. La celebración litúrgica de la profesión no deberá revestir una particular solemnidad<sup class=\"fn\" data-u=\"c8\" data-n=\"56\">56<\/sup>. Respecto del acta, registro y comunicación de la profesión, se deben seguir las normas de nuestro derecho<sup class=\"fn\" data-u=\"c8\" data-n=\"57\">57<\/sup>.","n":"378","s":1}],"notes":{"1":"Cf. PI 45.","2":"Cf. CIC 646; CC 61; Dir 195.","3":"Cf. Dir 199.","4":"Cf. CIC 642-643; Dir 199.","5":"Cf. CIC 641; CC 69; Dir 202.","6":"Cf. CIC 641, 653 §1; CC 69; Dir 202, 271.","7":"Cf. Dir 201.","8":"Cf. CIC 645; Dir 200.","9":"Cf. Dir 200.","10":"Cf. Dir 196.","11":"Cf. CC 68.","12":"Cf. RFIS 202-204.","13":"Cf. RFIS 202","14":"Cf. Dir 196-197.","15":"Cf. CC 61.","16":"Cf. CC 63-64.","17":"Cf. CC 61.","18":"Cf. CC 65.","19":"Cf. PI 46 - 47.","20":"Cf. CC 4-5.","21":"Cf. Dir 196.","22":"Cf. Dir 197.","23":"Cf. HAC 54.2; Colección <i>Claretianos de Ayer y de Hoy<\/i>.","24":"Cf. CC 62.","25":"Cf. CC 63.","26":"Cf. CC 64.","27":"Cf. CC 65.","28":"Cf. CC 66.","29":"Cf. CC 67.","30":"Cf. CIC 647.","31":"Cf. Dir 205, 207.","32":"Cf. CIC 647; Dir 205.","33":"Cf. CIC 653 §2; Dir 208.","34":"Cf. CIC 648; CC 69.","35":"Cf. PI 47.","36":"Cf. MS 75.3.","37":"Cf. CIC 646-653.","38":"Cf. CIC 651; Dir 210.","39":"Cf. CC 68.","40":"Cf. CC 68.","41":"Cf. Dir 211.","42":"CIC 652 §1.","43":"Cf. Dir 213.","44":"CIC 650.2.","45":"Cf. CIC 651.2.","46":"Dir 203.","47":"Cf. Dir 204.","48":"Cf. CIC 648 §2; CC 69.","49":"Cf. Dir 217.","50":"Cf. Dir 206.","51":"Cf. Dir 227.","52":"Cf. Dir 231.","53":"Cf. CIC 654; CC 70; Dir 214.","54":"Cf. CIC 656; Dir 218.","55":"Dir 215.","56":"Cf. OPR 5; PI 56.","57":"Cf. Dir 232-233."}},{"id":"c9","title":"Etapa de desarrollo y consolidación: posnoviciado (estudiantes)","short":"Capítulo 9","kind":"main","pages":[217,234],"blocks":[{"t":"h","l":2,"h":"1. NATURALEZA Y FINALIDAD"},{"t":"p","h":"La etapa de misioneros estudiantes abarca desde la primera profesión hasta la profesión perpetua (en el caso de los hermanos), o hasta la ordenación (en el caso de los presbíteros). Para los formandos supone una experiencia de contraste y de realismo, no exenta normalmente de crisis y dificultades<sup class=\"fn\" data-u=\"c9\" data-n=\"1\">1<\/sup>. Por eso es preciso que las propuestas formativas se conecten lo más posible con el proceso real que van viviendo, de manera que todo el período de los votos temporales se realice como un verdadero itinerario de desarrollo gradual y de consolidación en la vida claretiana.","n":"379","s":1},{"t":"p","h":"En esta etapa los misioneros deben proseguir la tarea iniciada en el noviciado<sup class=\"fn\" data-u=\"c9\" data-n=\"2\">2<\/sup> y <i>profundizar de manera integral en todos los aspectos de la vida misionera claretiana en orden a la incorporación definitiva a la Congregación y al servicio misionero de la Iglesia<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"3\">3<\/sup>.","n":"380","s":1},{"t":"h","l":2,"h":"2. ASPECTOS JURÍDICOS"},{"t":"p","h":"La primera profesión, así como las sucesivas renovaciones temporales, <i>incluyen la voluntad de emitir la profesión perpetua y preparan a la misma<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"4\">4<\/sup>. Durante el primer trienio, la profesión temporal se hará por períodos anuales. Posteriormente, puede hacerse por un tiempo más largo, según las indicaciones de nuestro derecho<sup class=\"fn\" data-u=\"c9\" data-n=\"5\">5<\/sup>.","n":"381","s":1},{"t":"p","h":"Si durante el tiempo de votos temporales algún formando, tras el debido discernimiento, creyese que no ha sido llamado a la vida misionera, puede abandonar libremente la Congregación, una vez cumplido el tiempo de profesión<sup class=\"fn\" data-u=\"c9\" data-n=\"6\">6<\/sup>. Para hacerlo antes de concluido el plazo, es preciso obtener el indulto del Superior General con el consentimiento de su Consejo<sup class=\"fn\" data-u=\"c9\" data-n=\"7\">7<\/sup>. Por causa justa, el Superior Mayor, con el consentimiento de su Consejo, puede excluir de la renovación de los votos o de la emisión de la profesión perpetua a un formando de votos temporales<sup class=\"fn\" data-u=\"c9\" data-n=\"8\">8<\/sup>.","n":"382","s":1},{"t":"h","l":2,"h":"3. OBJETIVOS GENERALES"},{"t":"p","h":"<i>Dimensión humana: <\/i>Lograr una madurez integral<sup class=\"fn\" data-u=\"c9\" data-n=\"9\">9<\/sup>, fundamentada en valores humanos y trascendentes y adecuada al proceso formativo de cada uno<sup class=\"fn\" data-u=\"c9\" data-n=\"10\">10<\/sup>, en orden a una opción definitiva.","n":"383","s":1},{"t":"p","h":"<i>Dimensión cristiana: <\/i>Crecer en una intensa vida espiritual que lleve a una progresiva identificación y comunión con Cristo, ungido por el Espíritu y enviado por el Padre para la salvación integral de los hombres<sup class=\"fn\" data-u=\"c9\" data-n=\"11\">11<\/sup>.","n":"384","s":1},{"t":"p","h":"<i>Dimensión claretiana: <\/i>Identificarse con la propia vocación claretiana, con la Congregación y sus opciones, capacitarse para la misión, y ejercitar la actividad apostólica con responsabilidad, creatividad y sentido de equipo<sup class=\"fn\" data-u=\"c9\" data-n=\"12\">12<\/sup>.","n":"385","s":1},{"t":"h","l":2,"h":"4. OBJETIVOS ESPECÍFICOS Y MEDIOS"},{"t":"h","l":3,"h":"4.1. Dimensión humana"},{"t":"p","h":"Son los siguientes:","n":"386","s":1},{"t":"p","h":"a. Lograr un adecuado equilibrio personal, a través del cuidado de la salud física y psíquica y del desarrollo de las cualidades que contribuyen a crear una personalidad libre y recia para la misión: sentido de la responsabilidad y de la fidelidad a la palabra dada, capacidad de soledad y de silencio, autodisciplina, austeridad y laboriosidad, espíritu de sacrificio, rectitud moral, capacidad de integrar las frustraciones y conflictos, así como una visión esperanzada de la realidad.","n":"386"},{"t":"p","h":"b. Proseguir la maduración afectiva y sexual aprendiendo a vivir las consecuencias de la castidad consagrada en la nueva situación, cuidando especialmente la sinceridad y el discernimiento.","n":"386"},{"t":"p","h":"c. Capacitarse, mediante una sólida preparación intelectual, para cumplir la misión evangelizadora en el mundo.","n":"386"},{"t":"p","h":"d. Consolidar el hábito personal de estudio, con las técnicas necesarias, y la sensibilidad por la cultura como una habilitación para la tarea misionera.","n":"386"},{"t":"p","h":"e. Desarrollar la capacidad de relación con los demás mediante el cultivo de actitudes como la escucha, la generosidad, la acogida, la valoración y el respeto, la comprensión, la capacidad de perdón y de consuelo<sup class=\"fn\" data-u=\"c9\" data-n=\"13\">13<\/sup>.","n":"386"},{"t":"p","h":"f. Valorar el trabajo como instancia formativa<sup class=\"fn\" data-u=\"c9\" data-n=\"14\">14<\/sup>.","n":"386"},{"t":"p","h":"g. Cultivar el espíritu de apertura y de solidaridad, exigido por la dimensión universal de nuestro carisma<sup class=\"fn\" data-u=\"c9\" data-n=\"15\">15<\/sup> y los rasgos que son más necesarios para vivir la tarea misionera: la capacidad de juicio crítico de la realidad, la actitud compasiva ante los que sufren, la disponibilidad para adaptarse a nuevas situaciones e inculturarse, el espíritu de iniciativa, el aprecio de los valores de los pueblos y la estima por su gente.","n":"386"},{"t":"p","h":"h. Crecer en una consciencia ecológica integral que se concrete en la búsqueda de la verdad, la justicia, la paz y el desarrollo sostenible de la Casa común.","n":"386"},{"t":"p","h":"i. Ejercitarse en la expresión oral y escrita.","n":"386"},{"t":"p","h":"j. Valorar críticamente y utilizar de modo responsable las Nuevas Tecnologías para la Información y Comunicación (TIC’s).","n":"386"},{"t":"p","h":"k. Cultivar tanto la actividad física (deporte, ejercicio, trabajo manual) como la sensibilidad y la expresión artística (música, literatura, artes).","n":"386"},{"t":"p","h":"l. Adquirir las destrezas básicas para la gestión económica y el manejo adecuado de los bienes.","n":"386"},{"t":"h","l":3,"h":"4.2. Dimensión cristiana"},{"t":"p","h":"Son los siguientes:","n":"387","s":1},{"t":"p","h":"a. Crecer en la relación filial con el Padre Misericordioso<sup class=\"fn\" data-u=\"c9\" data-n=\"16\">16<\/sup>, que da profundidad y sentido a la vida y permite interpretar toda la realidad<sup class=\"fn\" data-u=\"c9\" data-n=\"17\">17<\/sup>. Esta relación se cultiva, sobre todo, en una oración asidua, aún en los momentos de aridez y dificultad.","n":"387"},{"t":"p","h":"b. Procurar la unión firme y constante con Cristo en medio de los cambios del mundo<sup class=\"fn\" data-u=\"c9\" data-n=\"18\">18<\/sup>. Sólo desde ella el formando podrá ir integrando los diversos aspectos de la formación y logrará unificar su vida.","n":"387"},{"t":"p","h":"c. Abrir el corazón y la inteligencia a la acción del Espíritu<sup class=\"fn\" data-u=\"c9\" data-n=\"19\">19<\/sup> para discernir los acontecimientos y secundar sus inspiraciones.","n":"387"},{"t":"p","h":"d. Familiarizarse con la Palabra de Dios, convertirla en alimento espiritual diario y dejarse cuestionar por ella<sup class=\"fn\" data-u=\"c9\" data-n=\"20\">20<\/sup> hasta convertirla en uno de los ejes de todo el proceso formativo<sup class=\"fn\" data-u=\"c9\" data-n=\"21\">21<\/sup>.","n":"387"},{"t":"p","h":"e. Consolidar la experiencia eucarística mediante la celebración diaria del Sacramento y la visita al Santísimo como clave de encuentro con Jesús que nos enraíza en la misión.","n":"387"},{"t":"p","h":"f. Amar filialmente a María, Madre de la Iglesia, modelo de discipulado y formadora de apóstoles<sup class=\"fn\" data-u=\"c9\" data-n=\"22\">22<\/sup>, haciendo con Ella y como Ella el camino de peregrinación en la fe.","n":"387"},{"t":"p","h":"g. Aprender a sentir con la Iglesia, entendida como Pueblo de Dios en marcha y como misterio de comunión<sup class=\"fn\" data-u=\"c9\" data-n=\"23\">23<\/sup>.","n":"387"},{"t":"h","l":3,"h":"4.3. Dimensión claretiana"},{"t":"p","h":"Son los siguientes:","n":"388","s":1},{"t":"p","h":"a. Crecer en el seguimiento de Cristo, Misionero del Padre y Palabra de vida, en comunidad de discípulos, a través de la vivencia de los votos y de las virtudes apostólicas.","n":"388"},{"t":"p","h":"b. Asumir con realismo y alegría las consecuencias del peculiar estilo de vida que nace de la profesión religiosa.","n":"388"},{"t":"p","h":"c. Profundizar en el conocimiento y amor del Fundador; contemplando de modo particular el celo apostólico que lo movía, a fin de encender la pasión por la misión.","n":"388"},{"t":"p","h":"d. Favorecer el ministerio de la Palabra, según las exigencias y opciones de nuestra misión, y ejercitar acciones evangelizadoras en sintonía con ella<sup class=\"fn\" data-u=\"c9\" data-n=\"24\">24<\/sup>.","n":"388"},{"t":"p","h":"e. Crecer en el sentido de pertenencia y cariño por la Congregación a través del estudio de su historia, las Constituciones y otros documentos, el interés por conocer su situación actual en las diversas partes del mundo y sus proyectos misioneros.","n":"388"},{"t":"p","h":"f. Intensificar la relación con las personas de la propia comunidad y Provincia y, en ellas, con toda la Congregación.","n":"388"},{"t":"p","h":"g. Adquirir un conocimiento fundamentado de las otras ramas de la Familia Claretiana.","n":"388"},{"t":"h","l":2,"h":"5. CARACTERÍSTICAS"},{"t":"p","h":"Corresponde a cada Organismo organizar esta etapa del modo más conveniente, teniendo en cuenta su duración y las circunstancias de lugares y personas. Es preciso buscar las fórmulas que aseguren mejor los valores formativos claretianos, teniendo en cuenta los siguientes: el número de formandos y formadores, la cualificación de los formadores, la calidad académica de los centros de estudios, la distribución de los planes académicos, el necesario contacto con la realidad sociocultural y las posibilidades apostólicas.","n":"389","s":1},{"t":"p","h":"Durante esta etapa, la comunidad formativa es el ámbito normal de la formación. En el caso de que la etapa se prolongue, se ha de procurar que los formandos no permanezcan siempre en el mismo lugar o con el mismo tipo de estructura formativa, de modo que se asegure la necesaria gradualidad del proceso.","n":"390","s":1},{"t":"p","h":"A lo largo de esta etapa se pueden producir interrupciones en el ritmo normal de los estudios<sup class=\"fn\" data-u=\"c9\" data-n=\"25\">25<\/sup> con objeto de favorecer la madurez del formando y su proceso de discernimiento, de desarrollar su capacidad de integración en una comunidad no formativa, de intensificar el contacto con una realidad determinada, de experimentar algún tipo de trabajo o de realizar estudios civiles. En todos estos casos, y otros posibles, es necesario elaborar un plan específico y seguir las orientaciones eclesiales y congregacionales al respecto<sup class=\"fn\" data-u=\"c9\" data-n=\"26\">26<\/sup>.","n":"391","s":1},{"t":"p","h":"Los Organismos que lo consideren oportuno pueden también enviar algunos formandos a otros países durante un tiempo determinado. Estos destinos pueden revestir diversas modalidades, entre otras: aprendizaje de la lengua, continuación de los estudios y especializaciones, e interrupción de la carrera para tener una experiencia de apertura congregacional y de contraste.","n":"392","s":1},{"t":"p","h":"Por razón de la misión universal de la Congregación y de colaboración de los Organismos de una misma Conferencia, se aconsejan los centros de formación internacionales e interculturales con equipos de formadores procedentes de distintos Organismos. En estos casos conviene asegurar una suficiente comunicación del Gobierno Provincial con ellos y garantizar la relación entre los formandos y su Provincia de origen<sup class=\"fn\" data-u=\"c9\" data-n=\"27\">27<\/sup>.","n":"393","s":1},{"t":"p","h":"Cuando, por las mismas razones enunciadas en el punto anterior, el P. General envía personal a otros Organismos en vistas a su incardinación, se ha de procurar a los misioneros un programa de preparación para la interculturalidad y la misión en el lugar de destino. Dicho programa ha de contemplar el envío, la recepción e integración del misionero en el nuevo contexto, facilitado por un diálogo fluido entre los Organismos implicados.","n":"394","s":1},{"t":"h","l":2,"h":"6. DINAMISMOS PRINCIPALES"},{"t":"p","h":"La pedagogía de esta etapa pretende ayudar al formando a prepararse adecuadamente para la profesión perpetua y, en el caso de los presbíteros, también a la ordenación<sup class=\"fn\" data-u=\"c9\" data-n=\"28\">28<\/sup>. El formando la comienza con una experiencia que señala una diferencia sustancial con respecto a las etapas anteriores: <i>la primera profesión inaugura una nueva fase de la formación que se beneficia del dinamismo y de la estabilidad que nacen de la profesión<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"29\">29<\/sup>. La Congregación, por su parte, debe ofrecer al formando una propuesta sistemática, personalizada, espiritual y apostólica, doctrinal y práctica<sup class=\"fn\" data-u=\"c9\" data-n=\"30\">30<\/sup> para que pueda cumplir sus objetivos.","n":"395","s":1},{"t":"p","h":"Además de las exigencias que dimanan de los votos, los dinamismos particularmente acentuados en esta etapa son: la oración, el estudio, la vida comunitaria, las experiencias apostólicas y el acompañamiento personal<sup class=\"fn\" data-u=\"c9\" data-n=\"31\">31<\/sup>. De su interrelación y armonía dependerá la eficacia de la formación. Con el fin de concretar e integrar estas dimensiones, cada comunidad formativa elaborará, con la periodicidad que se juzgue conveniente, su proyecto comunitario.","n":"396","s":1},{"t":"h","l":3,"h":"6.1. La oración"},{"t":"p","h":"En esta etapa, la integración personal se hace más necesaria porque <i>el paso a un estilo de vida más abierto y a actividades muy absorbentes comporta a menudo riesgos de desorientación y de aridez<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"32\">32<\/sup>. Es preciso, por eso, que los formandos <i>aprendan por experiencia, en medio de los cambios del mundo, a vivir firme y constantemente unidos a Cristo, según nuestro carisma<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"33\">33<\/sup>. A ejemplo de María, a cuyo Corazón se han entregado especialmente en la profesión, <i>deben aprender el modo de integrar la escucha y contemplación de la Palabra de Dios con la atención a la realidad histórica y con la sensibilidad a los problemas del ser humano de hoy<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"34\">34<\/sup>, especialmente de los más pobres y necesitados.","n":"397","s":1},{"t":"p","h":"Esta integración se logrará refiriéndolo todo a Jesucristo como centro de la propia vida y teniendo a María como inspiradora<sup class=\"fn\" data-u=\"c9\" data-n=\"35\">35<\/sup>. Exigirá mantener con fidelidad el hábito cotidiano de oración personal y de lectura de la Palabra<sup class=\"fn\" data-u=\"c9\" data-n=\"36\">36<\/sup>, así como la participación diaria en la eucaristía<sup class=\"fn\" data-u=\"c9\" data-n=\"37\">37<\/sup> y en la oración comunitaria<sup class=\"fn\" data-u=\"c9\" data-n=\"38\">38<\/sup>, y la celebración frecuente del sacramento de la reconciliación<sup class=\"fn\" data-u=\"c9\" data-n=\"39\">39<\/sup>. Fortalecidos con estos medios, los formandos podrán ir iluminando las diversas situaciones y responder a las llamadas de Dios en la realidad cotidiana. Cabe resaltar como un medio enriquecedor, la importancia del contacto con experiencias vinculadas a la piedad popular aprendiendo a valorarla<sup class=\"fn\" data-u=\"c9\" data-n=\"40\">40<\/sup>.","n":"398","s":1},{"t":"h","l":3,"h":"6.2. El estudio"},{"t":"p","h":"El estudio constituye junto a la oración uno de los dos pies del misionero y es de los dinamismos característicos de esta etapa<sup class=\"fn\" data-u=\"c9\" data-n=\"41\">41<\/sup>. El estudio de las ciencias humanas, teológicas y pastorales, así como el justo conocimiento de las condiciones sociales y políticas de los hombres y de los tiempos, tiene como objetivos:","n":"399","s":1},{"t":"p","h":"a. Proporcionar una comprensión viva del mundo, del ser humano, de la creación, del misterio de Cristo y de la Iglesia.","n":"399"},{"t":"p","h":"b. Formar y fundamentar una fe capaz de dar razón de sí misma y de dialogar con otras creencias y convicciones.","n":"399"},{"t":"p","h":"c. Discernir las distintas realidades a la luz de la fe y en vistas a la misión.","n":"399"},{"t":"p","h":"d. Suscitar la disponibilidad personal para desempeñar la misión evangelizadora y capacitar para llevarla a cabo<sup class=\"fn\" data-u=\"c9\" data-n=\"42\">42<\/sup>.","n":"399"},{"t":"p","h":"Dada la dedicación y seriedad que requiere, <i>este estudio de las ciencias eclesiásticas no puede simultanearse con otras carreras<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"43\">43<\/sup>. Esto no impide el cultivo de las aptitudes personales que se podrán desarrollar con estudios complementarios.","n":"400","s":1},{"t":"p","h":"En el caso de los candidatos al presbiterado, el plan de estudios debe seguir las normas y orientaciones de la Iglesia universal y de las diversas conferencias episcopales. Como plan de estudios propio<sup class=\"fn\" data-u=\"c9\" data-n=\"44\">44<\/sup>, además de las materias ordinarias, es necesario prestar especial atención a aquellas que guardan un vínculo más estrecho con nuestro carisma misionero, entre otras: mariología, misionología, vida consagrada, ciencias de la comunicación, idiomas, pastoral especializada, espiritualidad claretiana, etc. Se potenciará también una formación sociopolítica que permita un conocimiento amplio y crítico de la realidad local, nacional e internacional. En el caso de los hermanos deben seguirse las orientaciones presentadas en el Capítulo 10 de este mismo Plan<sup class=\"fn\" data-u=\"c9\" data-n=\"45\">45<\/sup>.","n":"401","s":1},{"t":"p","h":"La formación académica de los misioneros en formación <i>puede hacerse en centros propios de la Congregación o en seminarios o universidades<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"46\">46<\/sup>. <i>En todo caso, debe cuidarse la formación claretiana y, además, para los aspirantes a las órdenes, la adecuada preparación a los sagrados ministerios<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"47\">47<\/sup>.","n":"402","s":1},{"t":"p","h":"Se considera criterio ordinario que, al término de los estudios, los candidatos al presbiterado obtengan el título de bachillerato en teología (o sus equivalentes) y, siempre que sea posible, el de licenciatura. Los hermanos, por su parte, deben obtener también los títulos correspondientes a los estudios que realicen. Además, es necesario que los Organismos Mayores procuren la formación de especialistas en ciencias eclesiásticas, pastorales, antropológicas y otras, para una acción misionera más profunda y para contribuir también a la formación inicial y permanente de los miembros de la Congregación<sup class=\"fn\" data-u=\"c9\" data-n=\"48\">48<\/sup>.","n":"403","s":1},{"t":"p","h":"Para un adecuado crecimiento en este dinamismo se requiere cuidar especialmente el hábito de estudio personal, el trabajo en grupo, las técnicas necesarias para el trabajo intelectual y la sensibilidad por la cultura como una habilitación para la tarea misionera. La biblioteca debe ser actualizada con libros relevantes y otros recursos como conexiones digitales, según los requerimientos de las materias que estudian. Es conveniente servirse críticamente de los medios de comunicación social y de las TIC’s y participar en diversas manifestaciones culturales, además de promover aquellas actividades (publicaciones, actividades artísticas, literarias y musicales) que ayuden a formar el ministro idóneo de la divina Palabra<sup class=\"fn\" data-u=\"c9\" data-n=\"49\">49<\/sup>.","n":"404","s":1},{"t":"p","h":"Para verificar la marcha del estudio hay que tener en cuenta, además de las calificaciones obtenidas, la capacidad real de afrontar con solidez y equilibrio las cuestiones filosóficas y teológicas y de integrar los estudios en la vida espiritual y apostólica. Se tratará de favorecer siempre la unidad personal y la capacidad de reflexionar y trabajar dentro de las coordenadas de la interdisciplinariedad.","n":"405","s":1},{"t":"p","h":"El proceso formativo ha de incluir una preparación a la gestión de los bienes de la comunidad que incluya al menos un curso específico de cualificación para la gestión económica y contable. Los formandos deben crecer en su pertenencia a la Congregación en la medida que no sólo se identifican con la espiritualidad y lo carismático sino también en el cuidado y la gestión de los recursos y bienes de la Congregación<sup class=\"fn\" data-u=\"c9\" data-n=\"50\">50<\/sup>.","n":"406","s":1},{"t":"h","l":3,"h":"6.3. La vida comunitaria"},{"t":"p","h":"Dado el carácter de nuestra vocación, <i>los jóvenes claretianos han de prepararse para la evangelización en comunidad misionera, asumiendo desde el principio un estilo de vida comunitario, pobre, inculturado e intercultural<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"51\">51<\/sup>, donde se fomente y se aprenda a trabajar en equipo, abierto a la vida de la Iglesia y del pueblo. La comunidad mártir de Barbastro nos ofrece un admirable testimonio de madurez en la vivencia de la fraternidad<sup class=\"fn\" data-u=\"c9\" data-n=\"52\">52<\/sup>.","n":"407","s":1},{"t":"p","h":"La vida comunitaria debe organizarse de tal manera que se asegure el clima más favorable para la propia realización, las relaciones interpersonales, así como los medios suficientes para su desarrollo. Según el número y otras circunstancias, se pueden crear diversos grupos o secciones, manteniendo siempre la unidad de criterios que requiere el proceso formativo.","n":"408","s":1},{"t":"p","h":"El ritmo comunitario ha de integrar armónicamente la oración (tanto personal como comunitaria), el estudio, el trabajo manual, las actividades apostólicas y el conveniente descanso. Los formandos deben ser corresponsables los unos de los otros y verdaderos protagonistas de la vida comunitaria, tanto en la elaboración del proyecto comunitario como en la realización de los servicios y tareas necesarios para la vida en común, y en la evaluación periódica de lo realizado.","n":"409","s":1},{"t":"h","l":3,"h":"6.4. Las experiencias apostólicas"},{"t":"p","h":"El objetivo de las experiencias apostólicas es iniciar al formando en la tarea misionera de la Congregación y capacitarse como servidores de la Palabra<sup class=\"fn\" data-u=\"c9\" data-n=\"53\">53<\/sup>. Para lograrlo, las actividades deben ser verdaderamente apostólicas, en línea con la misión y opciones de la Congregación, planeadas desde la realidad social en que se vive, realizadas en equipo, evaluadas en comunidad y acompañadas por un asesor<sup class=\"fn\" data-u=\"c9\" data-n=\"54\">54<\/sup>. Las formas de realización, a lo largo de todo el ciclo y no sólo al terminarlo, pueden ser muy variadas según las circunstancias.","n":"410","s":1},{"t":"p","h":"Para determinar el ministerio al que cada uno se va a dedicar en el futuro, hay que tener en cuenta su inclinación y talento, pero, por encima de todo, las necesidades de la Congregación y de la Iglesia<sup class=\"fn\" data-u=\"c9\" data-n=\"55\">55<\/sup>. <i>En los últimos años de los estudios es necesario orientar a cada formando hacia un área determinada de la pastoral y decidir la especialización más conveniente, en diálogo del Superior Mayor y del formador con el interesado<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"56\">56<\/sup>.","n":"411","s":1},{"t":"p","h":"Se ha de capacitar y cualificar en la planificación pastoral, el trabajo en equipo y la misión compartida. También en la apertura a nuevos ámbitos y perspectivas pastorales, realizando experiencias en lugares desafiantes de misión que abran a las nuevas periferias geográficas y existenciales.","n":"412","s":1},{"t":"h","l":3,"h":"6.5. El acompañamiento personal"},{"t":"p","h":"Para promover la integración de todos los aspectos en una etapa caracterizada por la multiplicidad y diversidad de elementos, <i>además de la dirección o acompañamiento espiritual, se hace imprescindible un diálogo personal y frecuente con el formador<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"57\">57<\/sup><i> al menos una vez al mes<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"58\">58<\/sup>, la elaboración del proyecto personal de vida y el ac
