a primera profesión c.649"},{"t":"p","h":"(iii) Formación de los Novicios."},{"t":"p","h":"- Plan formativo y régimen de los novicios c.650"},{"t":"p","h":"- El maestro de novicios y el coadjutor c.651"},{"t":"p","h":"- Protagonistas, objetivos y líneas del estatuto formativo de los novicios c.652"},{"t":"p","h":"- Salida del noviciado c.653 §1"},{"t":"p","h":"- Terminación del noviciado. Prórroga c.653 §2"},{"t":"p","h":"1.3. Profesión Religiosa"},{"t":"p","h":"- Componentes de la profesión religiosa c.654"},{"t":"p","h":"- Límites de la profesión temporal c.655"},{"t":"p","h":"- Requisitos de validez de la profesión temporal c.656"},{"t":"p","h":"- Renovación prórroga de la profesión temporal y anticipo de la perpetua c.657"},{"t":"p","h":"- Requisitos de validez de la profesión perpetua c.658"},{"t":"p","h":"- Disposiciones sobre los bienes temporales c.668"},{"t":"p","h":"- Anotación de la profesión perpetua c.535 §2"},{"t":"p","h":"1.4. Formación de los Religiosos"},{"t":"p","h":"- Formación después de la primera profesión:"},{"t":"p","h":"Estatuto formativo c.659"},{"t":"p","h":"- Líneas de fuerza del estatuto formativo c.660"},{"t":"p","h":"- Penitencia y dirección espiritual cc.664;630"},{"t":"p","h":"- a formación permanente o continua c.661"},{"t":"p","h":"1.5. Ausencia comunitaria y separación del Instituto"},{"t":"p","h":"(i) Ausencia de la vida de comunidad."},{"t":"p","h":"- Características y tipos de ausencia c.665"},{"t":"p","h":"(ii) Salida del Instituto."},{"t":"p","h":"- Criterio general c.657 §1"},{"t":"p","h":"- Salida definitiva libre, al expirar los votos temporales c.688 §1"},{"t":"p","h":"- Salida definitiva, solicitada durante los votos temporales c.688 §2"},{"t":"p","h":"- Salida definitiva, impuesta al expirar los votos temporales c.689"},{"t":"p","h":"- Salida definitiva, solicitada durante los votos perpetuos c.691"},{"t":"p","h":"- El indulto y sus efectos canónicos cc.692-693"},{"t":"p","h":"- Readmisión libre de los exnovicios y exprofesos temporales c.690"},{"t":"p","h":"(iii) Dimisión de los miembros."},{"t":"p","h":"- Dimisión por el mero hecho o “ipso facto” c.694"},{"t":"p","h":"- Dimisión “ab homine”, obligatoria por derecho c.695"},{"t":"p","h":"- Dimisión “ab homine”, no obligatoria por derecho c.696"},{"t":"p","h":"- Expulsión inmediata de la casa religiosa c.703"},{"t":"p","h":"- El decreto de dimisión cc.699; 700"},{"t":"p","h":"- Efectos canónicos de la dimisión cc.701-702"},{"t":"h","l":2,"h":"2. Formación para los Ministerios Ordenados"},{"t":"p","h":"2.1. Admisión de los candidatos"},{"t":"p","h":"- Condiciones de admisión c.241"},{"t":"p","h":"- Preparación humanista y científica previa c.234 §2"},{"t":"p","h":"2.2. Formación para las órdenes"},{"t":"p","h":"(i) Candidatos al diaconado permanente c.236 §2 (ii) Estudios sacerdotales cc.248-252;254 (iii) Preparación pastoral cc.255-258"},{"t":"p","h":"2.3. Condiciones en los ordenandos"},{"t":"p","h":"(i) Condiciones de validez c.1024 (ii) Condiciones de licitud c.1025"},{"t":"p","h":"2.4. Requisitos por parte de los ordenandos"},{"t":"p","h":"(i) Libertad del candidato c.1026 (ii) Cuidadosa preparación cc.1027-1028;1032 (iii) Cualidades humanas y religiosas c.1029 (iv) Edad e intersticio c.1031 (v) Práctica pastoral c.1032 §2 (vi) Suspensión de la ordenación c.1030"},{"t":"p","h":"2.5. Requisitos previos a la ordenación"},{"t":"p","h":"(i) Recepción de la confirmación c.1033 (ii) Recepción y ejercicio del lectorado y acolitado c.1035 §1 (iii) Intersticio antes del diaconado c.1035 §2 (iv) Declaración personal escrita c.1036 (v) Profesión de fe c.833 §6 (vi) Ejercicios espirituales c.1039 (vii) Situación especial del diácono c.1038"},{"t":"p","h":"2.6. Irregularidades e impedimentos"},{"t":"p","h":"(i) Criterios generales:"},{"t":"p","h":"- Principio de interpretación c.1040"},{"t":"p","h":"- La ignorancia c.1045"},{"t":"p","h":"- Diversas causas c.1046"},{"t":"p","h":"- Responsabilidad de los fieles c.1043 (ii) Irregularidades para recibir las órdenes c.1041 (iii) Impedimentos para recibir las órdenes c.1042 (iv) Irregularidades para ejercer las órdenes c.1044 §1 (v) Impedimentos para ejercer las órdenes c.1044 §2 (vi) Dispensas:"},{"t":"p","h":"- En situaciones normales c.1047"},{"t":"p","h":"- Casos especiales c.1048"},{"t":"p","h":"- Modo de solicitarlas c.1049"},{"t":"p","h":"2.7. Documentos, escrutinio y dimisorias"},{"t":"p","h":"(i) Documentos exigidos antes de la ordenación c.1050 (ii) Escrutinio sobre las cualidades del ordenando c.1051 (iii) Dimisorias:"},{"t":"p","h":"- Quién las concede c.1019"},{"t":"p","h":"- Cuándo se han de conceder c.1020"},{"t":"p","h":"- Responsabilidad del Obispo ordenante cc.1052;1022"},{"t":"p","h":"- Validez de las dimisorias c.1023"},{"t":"p","h":"2.8. Inscripción y certificado de la ordenación"},{"t":"p","h":"(i) Certificado auténtico personal de la ordenación c.1053 §2 (ii) Notificación al párroco c.1054"},{"t":"p","h":"2.9. Incardinación y excardinación de los ordenados"},{"t":"p","h":"- Todo clérigo ha de estar incardinado c.265"},{"t":"p","h":"- Incardinación del religioso clérigo c.266 §2"},{"t":"p","h":"- Incardinación de un religioso clérigo en una diócesis c.693"},{"t":"p","h":"<i>En este apartado se han seleccionado aquellos cánones que tienen una relación directa con los ordenandos religiosos. Otros cánones, que afectan primordialmente a los ordenandos diocesanos, no se han sistematizado en este Apéndice. Algunos, sin embargo, son citados a lo largo del PGF para iluminar las orientaciones formativas de los llamados a los diversos ministerios. Son los siguientes: 232-234 <\/i>§<i>1; 236 <\/i>§<i>1; 237-247; 253; 259-264; 266-272; 1008; 1021; 1037.<\/i>"}],"notes":{}},{"id":"ap3","title":"Planes de estudio","short":"Apéndice 3","kind":"app","pages":[322,333],"blocks":[{"t":"p","h":"Introducción"},{"t":"p","h":"1. Presentación"},{"t":"p","h":"Los formandos realizan sus estudios en centros académicos, claretianos y no claretianos, de diversa índole: Seminarios, Estudios Teológicos, Institutos, Facultades y Universidades. Todos ellos tienen planes de estudios que se rigen por las normas de derecho universal de la Iglesia, como son: el Código de Derecho Canónico, la Ratio Fundamentalis Institutionis Sacerdotalis y otros documentos eclesiásticos<sup class=\"fn\" data-u=\"ap3\" data-n=\"1\">1<\/sup>, o por las normas civiles propias, según los casos."},{"t":"p","h":"Aquí presentamos algunos contenidos para las diversas etapas y momentos de la formación claretiana. Excepto para el noviciado, que se ofrece un plan de estudios completo, para las demás etapas los contenidos son de formación académica y pastoral complementaria, sea porque se refieren al propio carisma congregacional, sea porque acentúan elementos que enriquecen nuestra formación misionera<sup class=\"fn\" data-u=\"ap3\" data-n=\"2\">2<\/sup>."},{"t":"p","h":"Cada Organismo Mayor y zona congregacional deberá añadir, en sus propios planes de formación, los temas y contenidos que les son propios<sup class=\"fn\" data-u=\"ap3\" data-n=\"3\">3<\/sup>."},{"t":"p","h":"2. Metodología"},{"t":"p","h":"- Método activo y participativo."},{"t":"p","h":"- Programación anual."},{"t":"p","h":"- La formación complementaria podrá tener su cauce adecuado a través de comisiones y departamentos: de liturgia, TIC´s, música, cultura, deporte, biblioteca y otros."},{"t":"p","h":"3. Momentos"},{"t":"p","h":"- Conferencias sistemáticas del formador o del equipo de formadores<sup class=\"fn\" data-u=\"ap3\" data-n=\"4\">4<\/sup>."},{"t":"p","h":"- Cursos organizados por la comunidad formativa: durante el año escolar o en tiempos fuertes de vacaciones."},{"t":"p","h":"- Cursos organizados por otras instituciones: normalmente durante los períodos amplios de vacaciones."},{"t":"h","l":2,"h":"I. PRENOVICIADO"},{"t":"p","h":"Como criterio general, para quienes aspiran a la vida misionera, se ha seguir el criterio que exige a los candidatos, al ser admitidos, la misma formación humanista y científica que necesitan los jóvenes del propio país para acceder a los estudios superiores<sup class=\"fn\" data-u=\"ap3\" data-n=\"5\">5<\/sup>."},{"t":"p","h":"1. Formación humana"},{"t":"p","h":"- El sentido y desarrollo de la vida humana."},{"t":"p","h":"- Nociones básicas sobre la madurez y el ajuste personal."},{"t":"p","h":"- Valores y contravalores. El sentido crítico."},{"t":"p","h":"- La afectividad y la sexualidad."},{"t":"p","h":"- Análisis de la cultura contemporánea."},{"t":"p","h":"- Acercamiento a la contemplación de la realidad."},{"t":"p","h":"- Medios y tecnologías de información y comunicación social."},{"t":"p","h":"- Metodología del estudio y del trabajo intelectual."},{"t":"p","h":"- Prevención de las adicciones contemporáneas."},{"t":"p","h":"- Estudio de los protocolos eclesiales y contemporáneos sobre protección de menores."},{"t":"p","h":"- Experiencias oportunas de acompañamiento psicoterapéutico."},{"t":"p","h":"2. Formación cristiana"},{"t":"p","h":"- La persona de Jesús y su mensaje."},{"t":"p","h":"- Catecumenado sistemático sobre el símbolo de la fe y los sacramentos."},{"t":"p","h":"- Presentación sintética de la espiritualidad cristiana."},{"t":"p","h":"- Iniciación teórico-práctica en el discernimiento cristiano de espíritus."},{"t":"p","h":"- Fundamentos de moral cristiana."},{"t":"p","h":"- Nociones de liturgia."},{"t":"p","h":"- Introducción a la lectura orante de la Escritura (sentido, métodos…)."},{"t":"p","h":"- María, madre y modelo."},{"t":"p","h":"3. Formación claretiana"},{"t":"p","h":"- La vocación religiosa en la Iglesia."},{"t":"p","h":"- Introducción al conocimiento de la vida del Fundador y de la Congregación."},{"t":"p","h":"- Síntesis del carisma claretiano."},{"t":"p","h":"- Iniciación teórica-experiencial a la vida en comunidad."},{"t":"p","h":"- Experiencias significativas de sensibilización apostólica"},{"t":"p","h":"4. Conceptos específicos de derecho"},{"t":"p","h":"- Requisitos de admisión. Preparación."},{"t":"p","h":"- La admisión al noviciado."},{"t":"p","h":"- El derecho de admisión al noviciado."},{"t":"p","h":"- Cualidades personales básicas de admisión."},{"t":"p","h":"- Impedimentos de validez en la admisión."},{"t":"p","h":"- Prohibiciones de admisión dirigidas al superior."},{"t":"p","h":"- Testimonios e informes."},{"t":"p","h":"5. Otros elementos"},{"t":"p","h":"- Preparación musical (canto e instrumentos) y artes plásticas."},{"t":"p","h":"- Preparación lingüística."},{"t":"p","h":"- Preparación técnica."},{"t":"p","h":"- Formación en el uso responsable de los medios digitales."},{"t":"h","l":2,"h":"II. NOVICIADO"},{"t":"p","h":"El plan de estudios para el noviciado tiene presente lo que se pide a los novicios en el Derecho universal<sup class=\"fn\" data-u=\"ap3\" data-n=\"6\">6<\/sup> y propio<sup class=\"fn\" data-u=\"ap3\" data-n=\"7\">7<\/sup> y las orientaciones del Magisterio congregacional<sup class=\"fn\" data-u=\"ap3\" data-n=\"8\">8<\/sup>."},{"t":"p","h":"1. Introducción al noviciado"},{"t":"p","h":"- El noviciado. Naturaleza, objetivos y presupuestos."},{"t":"p","h":"- Exposición del plan de formación (contenidos y experiencias)."},{"t":"p","h":"- Relación novicio-maestro."},{"t":"p","h":"2. La vocación en la Iglesia 2.1. Introducción: llamados al seguimiento"},{"t":"p","h":"- La figura de Jesús en los Evangelios."},{"t":"p","h":"- Las “Imágenes de Jesús”."},{"t":"p","h":"- El misterio de Cristo y de la Iglesia."},{"t":"p","h":"- Llamadas y respuestas múltiples en el misterio de salvación."},{"t":"p","h":"- Las formas de vida en la Iglesia. Articulación de carismas y ministerios."},{"t":"p","h":"2.2. La vocación religiosa"},{"t":"p","h":"- Aspectos bíblico teológicos de la vocación."},{"t":"p","h":"- Antropología de la vocación."},{"t":"p","h":"- Psicopedagogía de la vocación: motivaciones y actitudes."},{"t":"p","h":"3. La vida religiosa claretiana"},{"t":"p","h":"3.1. La vida religiosa como vida consagrada"},{"t":"p","h":"- Fundamentos bíblicos de la vida religiosa."},{"t":"p","h":"- Breve historia de las formas de vida religiosa."},{"t":"p","h":"- Elementos esenciales de la vida religiosa en perspectiva bíblica, teológica, claretiana y psicopedagógica:"},{"t":"p","h":"- Vocación."},{"t":"p","h":"- Consagración."},{"t":"p","h":"- Consejos o “carismas” evangélicos (pobreza, castidad, obediencia)."},{"t":"p","h":"- Seguimiento de Cristo."},{"t":"p","h":"- Carisma."},{"t":"p","h":"- Comunidad."},{"t":"p","h":"- Misión."},{"t":"p","h":"3.2. La vida misionera claretiana"},{"t":"p","h":"- La figura del Padre Fundador, especialmente a través de la Autobiografía."},{"t":"p","h":"- Historia de la Congregación: fundación, cofundadores, primeros pasos, su desarrollo hasta la muerte del Fundador."},{"t":"p","h":"- Historia general sucinta de la misma, de sus personas y obras más características."},{"t":"p","h":"- Historia y testimonio de los beatos mártires de la Congregación."},{"t":"p","h":"- Documentos congregacionales más importantes."},{"t":"p","h":"- El carisma y el espíritu claretianos: en el Padre Fundador y en la Congregación."},{"t":"p","h":"- Las Constituciones y el Directorio: las Constituciones como proyecto claretiano de seguimiento de Cristo; génesis y contenido."},{"t":"p","h":"- Las virtudes claretianas misioneras."},{"t":"p","h":"- Los tres modos de vivir la única vocación claretiana (presbíteros, diáconos, hermanos) y de las diversas instituciones que conforman la Familia Claretiana."},{"t":"p","h":"4. Introducción a la vida espiritual"},{"t":"p","h":"4.1. Fundamentos antropológicos de la vida espiritual"},{"t":"p","h":"- La persona humana abierta a Dios."},{"t":"p","h":"- Proceso humano y realización cristiana."},{"t":"p","h":"- La experiencia espiritual y las disposiciones personales."},{"t":"p","h":"4.2. La novedad de la existencia cristiana"},{"t":"p","h":"- Jesucristo, Hombre Nuevo, revela el misterio de Dios y del hombre."},{"t":"p","h":"- La gracia como “amor incondicional” del Padre manifestado en Jesucristo."},{"t":"p","h":"- El hombre como criatura e imagen de Dios. Dignidad de la persona."},{"t":"p","h":"- La condición pecadora. Significado y consecuencias."},{"t":"p","h":"- La acción renovadora del Espíritu en el creyente, en la Iglesia y en el mundo."},{"t":"p","h":"- Los dinamismos de la vida de la gracia: virtudes teologales."},{"t":"p","h":"- El crecimiento en la vida espiritual: libertad, responsabilidad, discernimiento."},{"t":"p","h":"5. Introducción a la liturgia"},{"t":"p","h":"- Naturaleza de la Liturgia y del culto de la Iglesia."},{"t":"p","h":"- El año litúrgico, la liturgia eucarística y la liturgia de las horas. Su lugar en las Constituciones."},{"t":"p","h":"- Cuestiones prácticas de participación en la liturgia eucarística y en la liturgia de las horas."},{"t":"p","h":"6. Introducción a la oración"},{"t":"p","h":"- Fundamentos bíblicos y teológicos."},{"t":"p","h":"- La oración en el conjunto de la vida espiritual."},{"t":"p","h":"- La oración en el carisma claretiano."},{"t":"p","h":"- La oración personal y la oración comunitaria."},{"t":"p","h":"- Métodos y técnicas de oración y de meditación (oración con la Palabra, meditación)."},{"t":"p","h":"7. Introducción a la espiritualidad cordimariana"},{"t":"p","h":"- María en el misterio de Cristo y de la Iglesia."},{"t":"p","h":"- Elementos marianos en la espiritualidad cristiana."},{"t":"p","h":"- María, modelo de mujer consagrada."},{"t":"p","h":"- La espiritualidad cordimariana: el Corazón de María en la vida misionera del claretiano, cordialidad, escucha, meditación y anuncio de la Palabra."},{"t":"p","h":"- Actualización de las expresiones de la espiritualidad cordimariana y medios de intensificarla."},{"t":"p","h":"8. Introducción a la misión claretiana"},{"t":"p","h":"- La Iglesia evangelizadora."},{"t":"p","h":"- La misión de los religiosos en la Iglesia."},{"t":"p","h":"- La misión apostólica del claretiano (MCH, CPR, SP, EMP, PQTV, HAC, MS)."},{"t":"p","h":"- Justicia, Paz e Integridad de la Creación (JPIC): dimensión prioritaria de la misión claretiana."},{"t":"p","h":"- Orientaciones prácticas y técnicas para el apostolado."},{"t":"p","h":"- Experiencias acompañadas de apostolado ordinario y extraordinario."},{"t":"p","h":"9. Temas especiales de derecho"},{"t":"p","h":"- Como programa básico puede servir el esquema del Apéndice 2."},{"t":"p","h":"- Se ha de completar con otros elementos, como son: CIC 662-672, 673-683 y 684-685, 686-687."},{"t":"p","h":"10. Otros elementos"},{"t":"p","h":"- Formación musical."},{"t":"p","h":"- Manualidades, oficios prácticos y servicios domésticos."},{"t":"p","h":"- Información del estado actual de la Congregación, el Gobierno General y de los Organismos, formación, apostolado, economía."},{"t":"p","h":"- Otros temas circunstanciales que convenga determinar."},{"t":"h","l":2,"h":"III. POSTNOVICIADO"},{"t":"p","h":"Los planes para esta etapa formativa tienen en cuenta las indicaciones del derecho universal<sup class=\"fn\" data-u=\"ap3\" data-n=\"9\">9<\/sup>; del Concilio Vaticano II<sup class=\"fn\" data-u=\"ap3\" data-n=\"10\">10<\/sup>; del <i>Motu proprio Ecclesiae Sanctae<\/i><sup class=\"fn\" data-u=\"ap3\" data-n=\"11\">11<\/sup>, y de nuestro derecho propio<sup class=\"fn\" data-u=\"ap3\" data-n=\"12\">12<\/sup>."},{"t":"p","h":"1. Formación filosófica y teológico-pastoral"},{"t":"p","h":"La formación filosófica y teológico-pastoral se considera recogida en los planes de estudios que se siguen en los diferentes centros académicos donde estudian los nuestros. En el caso de que no figuren en esos planes de estudios las materias que a continuación se señalan, deben ser impartidas en nuestros propios centros formativos."},{"t":"p","h":"- Mariología."},{"t":"p","h":"- Misionología."},{"t":"p","h":"- Ecumenismo y Diálogo Interreligioso."},{"t":"p","h":"- Ciencias de la comunicación."},{"t":"p","h":"- Pastoral especializada."},{"t":"p","h":"- Técnicas de análisis de la realidad."},{"t":"p","h":"2. Formación específica claretiana"},{"t":"p","h":"2.1. Profundización en la figura del Fundador"},{"t":"p","h":"- Estudio crítico de su vida y obras."},{"t":"p","h":"- Diversos temas monográficos, como pueden ser: su testimonio martirial, la presencia de María en su vida y acción misionera, su estilo misionero, la creatividad apostólica de Claret, la promoción del apostolado seglar, su papel en la Iglesia de Cuba y de España, su figura de Fundador."},{"t":"p","h":"2.2. Ampliación del conocimiento de la historia de la Congregación"},{"t":"p","h":"- Período de consolidación."},{"t":"p","h":"- Período de expansión."},{"t":"p","h":"- Situación actual."},{"t":"p","h":"2.3. Profundización en el estudio de las Constituciones"},{"t":"p","h":"- Evolución histórica de nuestras Constituciones."},{"t":"p","h":"- La renovación de las Constituciones después del Concilio Vaticano II."},{"t":"p","h":"- Análisis interdisciplinar de nuestras Constituciones."},{"t":"p","h":"- Estudio y confrontación con la experiencia de los grandes temas de la vida claretiana: votos religiosos, vida de comunidad, la misión y el apostolado, etc."},{"t":"p","h":"- Inculturación de las Constituciones."},{"t":"p","h":"- Lectura de las Constituciones en clave laical, diaconal o presbiteral."},{"t":"p","h":"2.4. Estudio de los documentos congregacionales de renovación"},{"t":"p","h":"- Capítulos Generales de 1967 y 1973."},{"t":"p","h":"- La MCH: los grandes temas de la misión del claretiano hoy."},{"t":"p","h":"- El CPR: la persona del claretiano."},{"t":"p","h":"- El SP: Servidores de la Palabra."},{"t":"p","h":"- EMP: En Misión Profética"},{"t":"p","h":"- PTV: Para que tengan Vida."},{"t":"p","h":"- HAC: Hombres que arden en caridad."},{"t":"p","h":"- MS: Missionarii Sumus"},{"t":"p","h":"3. Otros elementos"},{"t":"p","h":"- Estudios de economía y administración<sup class=\"fn\" data-u=\"ap3\" data-n=\"13\">13<\/sup>."},{"t":"p","h":"- Formación artística (musical, literaria, plástica)."},{"t":"p","h":"- Estudio de lenguas."},{"t":"p","h":"- Manejos de las Tecnologías para la Información y Comunicación (TICs)."},{"t":"p","h":"- Manualidades y oficios prácticos."},{"t":"p","h":"- Otros temas circunstanciales que convenga determinar."},{"t":"h","l":2,"h":"IV. PROGRAMA PARA LOS MISIONEROS HERMANOS"},{"t":"p","h":"1. Como punto de partida, el misionero hermano deberá completar, siempre que sea posible, los estudios civiles primarios y secundarios propios de cada país."},{"t":"p","h":"2. La capacitación pastoral, profesional y técnica deberá orientarse a conseguir, en instituciones y centros apropiados, la preparación y la titulación necesarias en la línea de nuestra misión, según las cualidades del formando y las necesidades del Organismo Mayor y de la Congregación<sup class=\"fn\" data-u=\"ap3\" data-n=\"14\">14<\/sup>."},{"t":"p","h":"- Entre las especialidades de pastoral se pueden enumerar: pastoral bíblica, catequesis, liturgia, pastoral juvenil, profesorado de religión, misionología, y otras."},{"t":"p","h":"- Entre las especialidades de profesionalización se resaltan: psicología, pedagogía, ciencias humanísticas, ciencias sociales y otras"},{"t":"p","h":"- Entre las especialidades técnicas se incluyen: estudios y prácticas de secretaría, administración, hostelería, asistencia social, mecánica, enfermería, y aprendizaje de otros oficios manuales útiles para la misión."},{"t":"p","h":"3. La formación teológica del hermano misionero se ha de ordenar procurando realizar, según las capacidades del formando, una de las siguientes posibilidades:"},{"t":"p","h":"-"},{"t":"p","h":"- Estudio de la carrera teológica completa con la adquisición de los correspondientes títulos."},{"t":"p","h":"- Estudio de un programa general de teología de tres años con la adquisición del diploma específico."},{"t":"p","h":"- Estudio de temas especiales conforme a lo indicado más arriba<sup class=\"fn\" data-u=\"ap3\" data-n=\"15\">15<\/sup>."},{"t":"p","h":"4. La formación específica claretiana tendrá el mismo programa indicado más arriba<sup class=\"fn\" data-u=\"ap3\" data-n=\"16\">16<\/sup>."},{"t":"p","h":"5. Otros elementos"},{"t":"p","h":"- Formación musical y artística."},{"t":"p","h":"- Estudio de lenguas."},{"t":"p","h":"- Técnicas audiovisuales."},{"t":"p","h":"- Manejo de las TICs."},{"t":"p","h":"- Conceptos de economía: presupuestos, balances."},{"t":"p","h":"- Otros temas circunstanciales que convenga determinar."},{"t":"h","l":2,"h":"V. MOMENTOS ESPECIALES"},{"t":"p","h":"Desde el punto de vista normativo, además de las normas del derecho universal contenidas en el CIC, en la RFIS y en otros documentos eclesiales que siempre hay que tener en cuenta, los puntos de referencia de nuestro derecho propio son los siguientes:"},{"t":"p","h":"- Para la profesión perpetua: Dir 241."},{"t":"p","h":"- Para la formación de los diáconos y presbíteros:"},{"t":"p","h":"Dir 242-243."},{"t":"p","h":"- Para la especialización: Dir 245-247."},{"t":"p","h":"1. Programa de preparación para la profesión perpetua"},{"t":"p","h":"1.1. El programa de revisión-preparación para la profesión perpetua, que abarca los aspectos principales de la vida religiosa y claretiana, ha de tener una marcada referencia experiencial según lo vivido en la etapa de votos temporales."},{"t":"p","h":"1.2. Programa de revisión-preparación para la profesión perpetua:"},{"t":"p","h":"- La vocación claretiana personal del formando. Origen. Signos vocacionales. Itinerario vocacional personal."},{"t":"p","h":"- Balance del período formativo. Experiencias positivas y negativas."},{"t":"p","h":"- La opción fundamental perpetua. Características."},{"t":"p","h":"Situación personal de cara a la opción perpetua."},{"t":"p","h":"Previsiones."},{"t":"p","h":"- Vivencia personal del proyecto claretiano."},{"t":"p","h":"- Las Constituciones y su asimilación personal."},{"t":"p","h":"- Balance particular de los siguientes aspectos:"},{"t":"p","h":"- Bases bíblicas fundantes."},{"t":"p","h":"- El seguimiento radical y la configuración con Cristo."},{"t":"p","h":"- La pobreza según el estilo de vida claretiano."},{"t":"p","h":"- La virginidad claretiana. Conciencia de los criterios y protocolos eclesiales (RFIS 202) y congregacionales en torno a la protección de menores y personas vulnerables, así como de los delitos contrarios al voto de castidad."},{"t":"p","h":"- La obediencia claretiana."},{"t":"p","h":"- La comunidad claretiana."},{"t":"p","h":"- Rasgos fundamentales de nuestra identidad carismática: HAC y MS."},{"t":"p","h":"- La Congregación en la actualidad: personas y obras. Conocimiento y frecuentación de las fuentes del devenir congregacional: Annales, NUNC, Redes digitales de la Congregación."},{"t":"p","h":"- Proyecto personal de cara al futuro. Elaboración y hábito de evaluación."},{"t":"p","h":"2. Programas para los ministerios y las órdenes sagradas"},{"t":"p","h":"2.1. Programa para los ministerios"},{"t":"p","h":"- Conocimiento de las exigencias y funciones de los ministerios del lectorado y del acolitado."},{"t":"p","h":"- Estudio de las normas litúrgicas propias del lector y del acólito: proclamar la Palabra, servir al altar, distribuir la eucaristía; así como el ejercicio en la catequesis, la evangelización y el servicio al prójimo<sup class=\"fn\" data-u=\"ap3\" data-n=\"17\">17<\/sup>."},{"t":"p","h":"- Estudio del Motu proprio de Pablo VI Ministeria Quaedam y del ritual de la colación de los ministerios, siguiendo las indicaciones de la RFIS<sup class=\"fn\" data-u=\"ap3\" data-n=\"18\">18<\/sup>."},{"t":"p","h":"2.2. Programa de preparación inmediata para el diaconado"},{"t":"p","h":"- Historia del diaconado. Datos del Nuevo Testamento. El diaconado en la Iglesia primitiva. El diácono en los primeros escritores eclesiásticos."},{"t":"p","h":"- Teología y sacramentalidad del diaconado. Oficios diaconales."},{"t":"p","h":"- Situación actual del diaconado. Restauración del diaconado permanente. La discusión teológico-pastoral en torno al Diaconado a partir de los Sínodos recientes de la Iglesia."},{"t":"p","h":"- El diácono en la renovación posconciliar de las Constituciones CMF. Dimensión claretiana de las funciones diaconales."},{"t":"p","h":"- Estudio del ritual litúrgico: rito de la ordenación de diácono, de la celebración del sacramento del matrimonio, de la celebración del sacramento del bautismo y del culto a la eucaristía fuera de la misa."},{"t":"p","h":"- Liturgia de las horas, espiritualidad y normas litúrgicas referidas al diaconado."},{"t":"p","h":"2.3. Programa de preparación inmediata para el presbiterado"},{"t":"p","h":"(i) Sección teológica:"},{"t":"p","h":"- El ministerio ordenado en las fuentes bíblicas del Antiguo y Nuevo Testamento."},{"t":"p","h":"- El ministerio ordenado en el proceso evolutivo de la fe de la Iglesia."},{"t":"p","h":"- El ministerio ordenado a partir del Concilio Vaticano II. Funciones y exigencias."},{"t":"p","h":"- El ministerio presbiteral en una Iglesia como “casa y escuela de comunión”<sup class=\"fn\" data-u=\"ap3\" data-n=\"19\">19<\/sup>."},{"t":"p","h":"- Vida religiosa y ministerio ordenado."},{"t":"p","h":"- Características carismáticas del presbítero claretiano."},{"t":"p","h":"(ii) Sección espiritual:"},{"t":"p","h":"- Vocación de los presbíteros a la santidad configurados con Cristo Cabeza, Pastor, Siervo y Esposo<sup class=\"fn\" data-u=\"ap3\" data-n=\"20\">20<\/sup>"},{"t":"p","h":"- Exigencias espirituales del presbítero."},{"t":"p","h":"- Medios y dinamismos para la santidad sacerdotal."},{"t":"p","h":"- Tentaciones de los ministros ordenados: clericalismo, abusos de poder, descuido de la formación continua, etc. (iii) Sección litúrgica:"},{"t":"p","h":"- Celebración del sacramento del orden."},{"t":"p","h":"- Celebración del sacramento de la penitencia."},{"t":"p","h":"- Celebración de la unción de los enfermos."},{"t":"p","h":"- Celebración de la confirmación. Condiciones para que la pueda administrar un presbítero."},{"t":"p","h":"- Celebración de la eucaristía. Estudio del ritual y de las normas litúrgicas."},{"t":"p","h":"(iv) Sección pastoral:"},{"t":"p","h":"- La familia, la parroquia, el acompañamiento de las personas y otros ámbitos del ejercicio del ministerio presbiteral<sup class=\"fn\" data-u=\"ap3\" data-n=\"21\">21<\/sup>."},{"t":"p","h":"- Revisión sintética y práctica de los criterios morales y pastorales en orden al sacramento de la reconciliación."},{"t":"p","h":"- Orientaciones pastorales y pedagógicas para la confesión."},{"t":"p","h":"- Orientaciones para la dirección espiritual."}],"notes":{"1":"Cf. Apéndice primero.","2":"Cf. Dir 235.","3":"Cf. CIC 255-258; Dir 240.","4":"Cf. CC 68, 77.","5":"Cf. CIC 234 §2.","6":"Cf. CIC 650 §1; 652 §2.","7":"Cf. CC 61; Dir 196-197.","8":"Cf. <i>Annales<\/i> 56 (1976) 466-467.","9":"Cf. CIC 255-258, 659-660.","10":"Cf. PC 18.","11":"Cf. ES II, 33-38.","12":"Cf. CC 72, 74, 75, 77; Dir 235, 237.","13":"Cf. Dir 550 a.","14":"Cf. Dir 238.","15":"Cf. Apéndice 3, III, 1.","16":"Cf. Apéndice 3, III, 2.","17":"Cf. RFIS 72.","18":"Cf. Ibid.","19":"RFIS 52.","20":"Cf. Ibid. 55.","21":"Cf. RFIS 148."}},{"id":"ap4","title":"Documentos, informes y formularios","short":"Apéndice 4","kind":"app","pages":[334,359],"blocks":[{"t":"p","h":"En este apéndice se presentan ordenadamente todos los documentos e informes que son necesarios a lo largo de las etapas formativas. De algunos de ellos se ofrecen modelos de formularios, los cuales pueden servir también de inspiración para los casos en los que no se presente un formulario específico."},{"t":"h","l":2,"h":"1. Prenoviciado: Aspirantado y Postulantado<sup class=\"fn\" data-u=\"ap4\" data-n=\"22\">22<\/sup>"},{"t":"p","h":"- Petición escrita de ingreso por parte del candidato al Superior Mayor<sup class=\"fn\" data-u=\"ap4\" data-n=\"23\">23<\/sup>."},{"t":"p","h":"- Informe del responsable que lo ha acompañado. Contenido del informe<sup class=\"fn\" data-u=\"ap4\" data-n=\"24\">24<\/sup> <b>(Formulario 1)<\/b>."},{"t":"p","h":"- Admisión por parte del Superior Mayor<sup class=\"fn\" data-u=\"ap4\" data-n=\"25\">25<\/sup>."},{"t":"p","h":"- Declaración personal escrita del candidato, una vez admitido, sobre contratos laborales e impedimentos. Contenido de la declaración<sup class=\"fn\" data-u=\"ap4\" data-n=\"26\">26<\/sup> <b>(Formulario 2)<\/b>."},{"t":"h","l":2,"h":"2. Noviciado"},{"t":"p","h":"- Petición escrita de admisión por parte del candidato al Superior Mayor al menos con un mes de antelación<sup class=\"fn\" data-u=\"ap4\" data-n=\"27\">27<\/sup>."},{"t":"p","h":"- Debe expresar que no tiene ningún impedimento<sup class=\"fn\" data-u=\"ap4\" data-n=\"28\">28<\/sup> y su voluntad de ser claretiano<sup class=\"fn\" data-u=\"ap4\" data-n=\"29\">29<\/sup> <b>(Formulario 3)<\/b>."},{"t":"p","h":"- Informe del responsable del postulante. Contenido: adecuada preparación<sup class=\"fn\" data-u=\"ap4\" data-n=\"30\">30<\/sup>, cualidades y ausencia de impedimentos<sup class=\"fn\" data-u=\"ap4\" data-n=\"31\">31<\/sup>."},{"t":"p","h":"- Certificado de nacimiento<sup class=\"fn\" data-u=\"ap4\" data-n=\"32\">32<\/sup>, bautismo, confirmación, estado libre y, si fuera necesario, el informe de su superior anterior<sup class=\"fn\" data-u=\"ap4\" data-n=\"33\">33<\/sup>."},{"t":"p","h":"- Informes periódicos del Maestro de Novicios al Superior Mayor<sup class=\"fn\" data-u=\"ap4\" data-n=\"34\">34<\/sup>. Pueden ser orales o escritos."},{"t":"h","l":2,"h":"3. Profesiones"},{"t":"h","l":3,"h":"3.1. Antes de la primera profesión"},{"t":"p","h":"- Petición por escrito del novicio al Superior Mayor tres meses antes de terminar el noviciado. Contenido<sup class=\"fn\" data-u=\"ap4\" data-n=\"35\">35<\/sup> <b>(Formulario 4)<\/b>."},{"t":"p","h":"- Informe del Maestro de Novicios sobre la idoneidad del novicio para ser misionero claretiano<sup class=\"fn\" data-u=\"ap4\" data-n=\"36\">36<\/sup> <b>(Formulario 5)<\/b>."},{"t":"p","h":"- Informes de la comunidad formativa<sup class=\"fn\" data-u=\"ap4\" data-n=\"37\">37<\/sup> <b>(Formulario 6)<\/b>."},{"t":"p","h":"- Cesión de la administración del patrimonio<sup class=\"fn\" data-u=\"ap4\" data-n=\"38\">38<\/sup> <b>(Formulario 7)<\/b>."},{"t":"p","h":"- Admisión por parte del Superior Mayor con su Consejo<sup class=\"fn\" data-u=\"ap4\" data-n=\"39\">39<\/sup>."},{"t":"p","h":"- Renuncia a los bienes y testamento<sup class=\"fn\" data-u=\"ap4\" data-n=\"40\">40<\/sup>."},{"t":"h","l":3,"h":"3.2. Renovaciones temporales"},{"t":"p","h":"- Petición por escrito al Superior Mayor tres meses antes de expirar el plazo<sup class=\"fn\" data-u=\"ap4\" data-n=\"41\">41<\/sup> <b>(Formulario 8)<\/b>."},{"t":"p","h":"- Informes del Prefecto y equipo de formadores sobre la idoneidad del profeso<sup class=\"fn\" data-u=\"ap4\" data-n=\"42\">42<\/sup> <b>(Formulario 6)<\/b>."},{"t":"p","h":"- Informes de la comunidad formativa<sup class=\"fn\" data-u=\"ap4\" data-n=\"43\">43<\/sup> <b>(Formulario 6)<\/b>."},{"t":"p","h":"- Admisión por parte del Superior Mayor oído el Consejo<sup class=\"fn\" data-u=\"ap4\" data-n=\"44\">44<\/sup>."},{"t":"h","l":3,"h":"3.3. Antes de la profesión perpetua"},{"t":"p","h":"- Petición por escrito al Superior Mayor, seis meses antes del tiempo señalado para la profesión perpetua<sup class=\"fn\" data-u=\"ap4\" data-n=\"45\">45<\/sup> <b>(Formulario 8).<\/b>"},{"t":"p","h":"- Tiempo de especial preparación, según el modo y lugar señalados por el Superior Mayor<sup class=\"fn\" data-u=\"ap4\" data-n=\"46\">46<\/sup>."},{"t":"p","h":"- Un mes antes de la profesión perpetua, el profeso escribirá al P. General sobre sus disposiciones misioneras y el Superior Mayor le enviará una ficha completa del mismo<sup class=\"fn\" data-u=\"ap4\" data-n=\"47\">47<\/sup>."},{"t":"p","h":"- Informes del Prefecto y del equipo formativo<sup class=\"fn\" data-u=\"ap4\" data-n=\"48\">48<\/sup> <b>(Formulario 9)<\/b>."},{"t":"p","h":"- Informes de la comunidad formativa<sup class=\"fn\" data-u=\"ap4\" data-n=\"49\">49<\/sup> <b>(Formulario 6)<\/b>."},{"t":"p","h":"- Admisión por parte del Superior Mayor con su Consejo<sup class=\"fn\" data-u=\"ap4\" data-n=\"50\">50<\/sup>."},{"t":"h","l":3,"h":"3.4. Actas y registro"},{"t":"p","h":"- Se ha de levantar acta de cada profesión<sup class=\"fn\" data-u=\"ap4\" data-n=\"51\">51<\/sup>."},{"t":"p","h":"- Comunicación de las profesiones a las instancias superiores de gobierno<sup class=\"fn\" data-u=\"ap4\" data-n=\"52\">52<\/sup> y al párroco del lugar donde fue bautizado el profeso perpetuo<sup class=\"fn\" data-u=\"ap4\" data-n=\"53\">53<\/sup>."},{"t":"h","l":2,"h":"4. Ministerios y Órdenes sagradas"},{"t":"h","l":3,"h":"4.1. Ministerios"},{"t":"p","h":"- Petición por escrito del candidato al Superior Mayor, a partir del comienzo de los estudios teológicos y después de un tiempo prudencial de profesión religiosa. Contenido: que los pide libre y espontáneamente y que tiene la firme voluntad de servir fielmente a Dios y al pueblo cristiano<sup class=\"fn\" data-u=\"ap4\" data-n=\"54\">54<\/sup> <b>(Formulario10)<\/b>."},{"t":"p","h":"- Informe del responsable, Superior o Prefecto, sobre la idoneidad del candidato. Contenido: que el candidato tiene la edad y las cualidades especiales señaladas por las Conferencias Episcopales."},{"t":"p","h":"- Admisión por parte del Superior Mayor y posible colación de los ministerios por parte del mismo Superior Mayor<sup class=\"fn\" data-u=\"ap4\" data-n=\"55\">55<\/sup>."},{"t":"h","l":3,"h":"4.2. Ordenes Sagradas"},{"t":"p","h":"- Petición del candidato al Superior Mayor con una declaración especial para cada Orden, escrita de puño y letra, a tenor del canon 1036 <b>(Formularios 11 y 13)<\/b>."},{"t":"p","h":"- Los certificados señalados en el canon 1050: de estudios; de recepción de los ministerios de Lector y de Acólito, y del correspondiente intersticio antes del Diaconado; del Diaconado, antes del Presbiterado; y de la declaración especial antes indicada<sup class=\"fn\" data-u=\"ap4\" data-n=\"56\">56<\/sup>."},{"t":"p","h":"- Certificado de haber emitido la profesión perpetua antes del diaconado<sup class=\"fn\" data-u=\"ap4\" data-n=\"57\">57<\/sup>."},{"t":"p","h":"- Emisión personal de la profesión de fe, antes de recibir el diaconado<sup class=\"fn\" data-u=\"ap4\" data-n=\"58\">58<\/sup> <b>(Formulario 12)<\/b>."},{"t":"p","h":"- Informe (escrutinio) de los Superiores y Prefectos antes de cada Orden sobre la idoneidad de los ordenandos<sup class=\"fn\" data-u=\"ap4\" data-n=\"59\">59<\/sup>. Contenido<sup class=\"fn\" data-u=\"ap4\" data-n=\"60\">60<\/sup>. <b>(Formulario 14)<\/b>."},{"t":"p","h":"- Informes antes de cada Orden de los miembros de la comunidad<sup class=\"fn\" data-u=\"ap4\" data-n=\"61\">61<\/sup> <b>(Formulario 14)<\/b>."},{"t":"p","h":"- Constancia de haber realizado los ejercicios espirituales<sup class=\"fn\" data-u=\"ap4\" data-n=\"62\">62<\/sup> <b>(Formulario 15)<\/b>."},{"t":"p","h":"- Dimisorias para cada Orden<sup class=\"fn\" data-u=\"ap4\" data-n=\"63\">63<\/sup>, dadas por el Superior Mayor<sup class=\"fn\" data-u=\"ap4\" data-n=\"64\">64<\/sup> (Formulario 15)."},{"t":"h","l":3,"h":"4.3. Notificación de las Órdenes"},{"t":"p","h":"- Certificado auténtico de la ordenación dado por el Obispo al ordenado<sup class=\"fn\" data-u=\"ap4\" data-n=\"65\">65<\/sup>."},{"t":"p","h":"- Comunicación de la ordenación por parte del Superior Mayor al párroco del lugar donde se bautizó el ordenado<sup class=\"fn\" data-u=\"ap4\" data-n=\"66\">66<\/sup>."},{"t":"p","h":"Formulario 1"},{"t":"h","l":2,"h":"PRESENTACIÓN DEL CANDIDATO ANTES DE SU INGRESO AL PRENOVICIADO (Cf Dir 184;188;189)"},{"t":"p","h":"1. Datos personales generales"},{"t":"p","h":"1. Nombre:"},{"t":"p","h":"2. Domicilio completo:"},{"t":"p","h":"3. Teléfono, e-mail y/o contactos digitales:"},{"t":"p","h":"4. Fecha de nacimiento (día, mes, año):"},{"t":"p","h":"Lugar de nacimiento:"},{"t":"p","h":"5. Nacionalidad actual:"},{"t":"p  Congregación Claretiana."},{"t":"p","h":"Razones:"},{"t":"p","h":"3.6.5. ¿Ha tenido algún tipo de acompañamiento vocacional?"},{"t":"p","h":"Dónde y con quién:"},{"t":"p","h":"3.6.6. ¿Cree que tiene algún impedimento para ser misionero claretiano?. En caso afirmativo:"},{"t":"p","h":"¿Cuáles?:"},{"t":"p","h":"3.6.7. ¿Tiene algunas obligaciones que le pueden obstaculizar ser misionero claretiano?"},{"t":"p","h":"En caso afirmativo:"},{"t":"p","h":"¿Cuáles?:"},{"t":"p","h":"¿Se pueden superar?:"},{"t":"p","h":"3.6.8. Observaciones:"},{"t":"p","h":"3.7. Personas de referencia"},{"t":"p","h":"3.7.1. Señalar tres personas, además de los familiares, que lo conozcan bien. Si es posible, incluye algún sacerdote, religioso/a."},{"t":"p","h":"3.7.2. Datos de las personas: Nombre y apellidos, dirección, teléfono, ocupación y razones del conocimiento mutuo."},{"t":"p","h":"Primera:"},{"t":"p","h":"Segunda:"},{"t":"p","h":"Tercera:"},{"t":"p","h":"Fecha y firma del responsable Formulario 2"},{"t":"h","l":2,"h":"DECLARACIÓN PERSONAL DEL POSTULANTE (cf CIC 597; CC 59; Dir 190)"},{"t":"p","h":"Al M. R. Padre ..............................."},{"t":"p","h":"Superior Mayor de .........................."},{"t":"p","h":"Yo,.................................................., admitido como Postulante en la Congregación de Misioneros Hijos del Inmaculado Corazón de María (Misioneros Claretianos), el día ..... de ............ de ......................."},{"t":"p","h":"DECLARO:"},{"t":"p","h":"1. Que mi ingreso en la Congregación y las tareas que en ella realizaré no tienen carácter de contrato laboral."},{"t":"p","h":"2. Que, si más tarde saliera de la Congregación, no podré exigir ninguna compensación por los trabajos que hubiera realizado ni por los daños que hubiera sufrido durante mi permanencia en ella."},{"t":"p","h":"3. Que no me consta tener impedimento alguno para entrar en la Congregación (cf CIC 597)."},{"t":"p","h":"4. Que asumo, desde ya, las conductas inherentes a este estilo de vida y por tanto soy consciente de no realizar ninguna acción que implique un comportamiento sexual inadecuado en el ámbito de lo civil y lo canónico. Que no tengo contraídas responsabilidades por comportamientos indebidos en materia sexual y que conozco y acepto las normas en vigor para la protección de menores y adultos vulnerables y el protocolo congregacional para la prevención e intervención ante un delito de abuso sexual. (Cf. Dir 190; Protocolo 7, 21-22)."},{"t":"p","h":"5. Que no tengo contraídas responsabilidades por delitos económicos (Cf. Dir 190)."},{"t":"p","h":"Y para que conste, lo firmo en ................., el día.... de ...... de....."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 3"},{"t":"h","l":2,"h":"PETICIÓN PERSONAL DE INGRESO EN EL NOVICIADO (cf CIC 643; Dir 199; 200; 201)"},{"t":"p","h":"Al M.R. Padre ........................."},{"t":"p","h":"Superior Mayor de ..................."},{"t":"p","h":"Yo, , postulante en esta Congregación y Provincia, a Vd., con el debido respeto,"},{"t":"p","h":"EXPONGO que el día . . . del próximo mes de deseo empezar la experiencia de noviciado en"},{"t":"p","h":"En conformidad con el derecho universal (Cf CIC 643), declaro no creer tener impedimento de ninguna índole ."},{"t":"p","h":"Declaro asimismo querer ser misionero claretiano (Cf Dir 199)."},{"t":"p","h":"SUPLICO, libre y espontáneamente, a Vd. y a su Consejo ser admitido para comenzar el noviciado."},{"t":"p","h":"Gracia que confiadamente espero conseguir."},{"t":"p","h":"En . . . . . . . . . . . . a . . . de . . . . . . . . . . . . de"},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 4"},{"t":"h","l":2,"h":"PETICIÓN PERSONAL DE LA PRIMERA PROFESIÓN (cf Dir 201; 217)"},{"t":"p","h":"Al M.R. Padre ........................."},{"t":"p","h":"Superior Mayor de ..................."},{"t":"p","h":"Estimado P. Provincial:"},{"t":"p","h":"Próximo a terminar el tiempo de probación, en cumplimiento de las normas establecidas en el Código de Derecho Canónico y en el Directorio de nuestra Congregación, a Vd. con toda sinceridad y respeto"},{"t":"p","h":"DECLARO:"},{"t":"p","h":"1. Que pido la admisión a la profesión sabiendo lo que hago, de buena fe y libremente, o sea, sin dolo ni fraude, ni obligado por miedo o por violencia que se me haga."},{"t":"p","h":"2. Que tengo sincera voluntad de profesar y permanecer en la Congregación hasta la muerte, a no ser que antes de la profesión perpetua me sobreviniere algún obstáculo que en la actualidad me es del todo imprevisto."},{"t":"p","h":"3. Que no me consta tener o haber callado impedimento excluyente alguno ni defecto notable que pudieran obstar a mi admisión a la pro¬fesión."},{"t":"p","h":"4. Que no tengo contraídas responsabilidades por comportamientos indebidos en materia sexual y que conozco y acepto las normas en vigor para la protección de menores y adultos vulnerables y el protocolo congregacional para la prevención e intervención ante un delito de abuso sexual. (Cf. Dir 190; Protocolo 7, 21-22)."},{"t":"p","h":"5. Que no tengo contraídas responsabilidades por delitos económicos (Cf. Dir 190)."},{"t":"p","h":"6. Que acepto de buen grado todas las obligaciones que lleva consigo la vida religiosa, tal como se practica o profesa en esta Congregación; deslindando a ella de cualquier posible delito o comportamiento ilícito que contraviniera sus normas religiosas o civiles."},{"t":"p","h":"7. Que no revistiendo la profesión religiosa carácter de contrato laboral, entre el religioso y el Instituto, mis prestaciones y servicios a favor de la Congregación serán gratuitos; y que nada reclamaré en concepto de indemnización, daños o perjuicios, tanto mientras permanezca en la Congregación como en el caso de que la abandonara. Por el contrario, que todo lo que perciba por un trabajo o en consideración a mi persona (fuera del patrimonio familiar), para la Con¬gregación lo recibo."},{"t":"p","h":"8. Que actualmente tengo conciencia de misionero claretiano según la vocación (póngase sacerdotal / diaconal / laical según los casos)."},{"t":"p","h":"Previa esta declaración,"},{"t":"p","h":"SUPLICO a Vd. y a su Consejo la gracia de ser admitido a emi¬tir la profesión religiosa primera en la Congregación."},{"t":"p","h":"En ..................., a ...... de ....................... de ......"},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 5"},{"t":"h","l":2,"h":"MODELO DE INFORME DEL MAESTRO DE NOVICIOS PARA LA PRIMERA PROFESIÓN (cf CIC 652; 653 §2)"},{"t":"p","h":"INFORME sobre la idoneidad del novicio para su primera profesión, dado por el Maestro de Novicios, P. en el día . . . de . . . . . . . . . . . . . . . . . de"},{"t":"p","h":"1. Salud física y psíquica. Posibles impedimentos."},{"t":"p","h":"2. Grado de madurez alcanzada para vivir los compromisos de la vida religiosa."},{"t":"p","h":"3. Carácter para la vida religiosa, especialmente para la vida de comunidad."},{"t":"p","h":"4. Cualidades más sobresalientes."},{"t":"p","h":"5. Asimilación de la experiencia de vida claretiana."},{"t":"p","h":"• Participación y colaboración activa."},{"t":"p","h":"• Capacidad de renuncia y desapego de otros valores no conformes con el proyecto claretiano."},{"t":"p","h":"6. Espiritualidad apostólica claretiana:"},{"t":"p","h":"• Vida de oración personal y comunitaria. Vida sacramental."},{"t":"p","h":"• Servicio de la Palabra."},{"t":"p","h":"• Vivencia cordimariana."},{"t":"p","h":"• Amor y fidelidad a la Iglesia."},{"t":"p","h":"• Sentido apostólico. Disponibilidad."},{"t":"p","h":"• Capacidad de trabajo."},{"t":"p","h":"• Virtudes apostólicas."},{"t":"p","h":"7. Vivencia de los Votos Religiosos: pobreza, castidad y obediencia."},{"t":"p","h":"8. Estudios. Capacidad y aprovechamiento. Conocimiento de la realidad congregacional."},{"t":"p","h":"9. Posible futuro en la Congregación y en la Iglesia."},{"t":"p","h":"10. Otras indicaciones y sugerencias."},{"t":"p","h":"11. Juicio valorativo final."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 6"},{"t":"h","l":2,"h":"MODELO DE INFORME PARA LA PROFESIÓN (o su RENOVACIÓN) (cf Dir 227, CIC 657 §1)"},{"t":"p","h":"INFORME sobre para su profesión o renovación). dado por en . . . . . el día . . . de . . . . . . . . de"},{"t":"p","h":"DECLARACIÓN: Para ayudar a los Superiores a un discernimiento vocacional más adecuado, informo, según conciencia, sobre los siguientes aspectos:"},{"t":"p","h":"1. Salud física y psíquica."},{"t":"p","h":"2. Madurez humana en orden a vivir los compromisos de la vida religiosa."},{"t":"p","h":"3. Estudios. Capacidad y aprovechamiento."},{"t":"p","h":"4. Expresiones de su Fe y sentido de comunión eclesial."},{"t":"p","h":"5. Carácter para la vida religiosa, especialmente para la vida de comunidad."},{"t":"p","h":"6. Cualidades más sobresalientes para la vida religiosa y misionera."},{"t":"p","h":"7. Espiritualidad apostólica claretiana:"},{"t":"p","h":"• Vida de oración personal y comunitaria. Vida sacramental."},{"t":"p","h":"• Servicio de la Palabra."},{"t":"p","h":"• Vivencia cordimariana."},{"t":"p","h":"• Amor y fidelidad a la Iglesia."},{"t":"p","h":"• Sentido apostólico. Disponibilidad. Trabajo en equipo."},{"t":"p","h":"• Capacidad de trabajo."},{"t":"p","h":"• Virtudes apostólicas."},{"t":"p","h":"8. Vivencia de los Votos Religiosos: pobreza, castidad y obediencia."},{"t":"p","h":"9. Posible futuro en la Congregación y en la Iglesia."},{"t":"p","h":"10. Otras indicaciones."},{"t":"p","h":"11. Juicio valorativo final. Sugerencias."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 7"},{"t":"h","l":2,"h":"CESIÓN DE LA ADMINISTRACIÓN DEL PATRIMONIO ANTES LA PRIMERA PROFESIÓN (CF. CC 27 ; DIR 220)"},{"t":"p","h":"NN……………, en conformidad con las normas (el derecho proprio) de la Congregación de los Misioneros Hijos del Inmaculado de la Bienaventurada Virgen María, en la que quiero profesar por la emisión de los votos de pobreza, castidad y obediencia, cedo libremente la administración de todos los bienes de los que soy propietario (se pueden enumerar) y disponer, también libremente, del uso y usufructo de los mismos a ……………….."},{"t":"p","h":"Fecha y firma del Novicio Formulario 8"},{"t":"h","l":2,"h":"PETICIÓN DE LA RENOVACIÓN DE LA PROFESIÓN O DE LA PERPETUA (cf Dir 223; 224)"},{"t":"p","h":"Al M. R. Padre ........................."},{"t":"p","h":"Superior Mayor de ...................."},{"t":"p","h":"Yo (sacerdote, estudiante o hermano) profeso de votos temporales en esta Congregación y Provincia, a Vd., con el debido respeto,"},{"t":"p","h":"EXPONGO, que el día . . . . del próximo mes de me corresponde (renovar por un año o hacer perpetuamente) la profesión religiosa, que por primera vez hice en el día . . . de . . . . . . . . . . . . . . . . . . . de"},{"t":"p","h":"En cumplimiento de nuestro Derecho, y firmemente decidido a vivir en la Congregación hasta la muerte y a observar fielmente las Constituciones y disposiciones de la misma,"},{"t":"p","h":"SUPLICO, libre y espontáneamente, a Vd. y a su Consejo, ser admitido a la renovación o a la profesión perpetua."},{"t":"p","h":"Gracia que confiadamente espero conseguir."},{"t":"p","h":"En . . . . . . . . . . a . . . de . . . . . . . . . . . . de"},{"t":"p","h":"(Firma)"},{"t":"p","h":"<b>NOTA:<\/b> <i>El formulario de solicitud de la profesión perpetua puede ser acompañado por una carta al Superior Mayor en la que, de una manera espontánea, el profesando exprese su situación personal (balance del proceso formativo, motivaciones para la profesión, expectativas de futuro).<\/i>"},{"t":"p","h":"Formulario 9"},{"t":"h","l":2,"h":"MODELO DE INFORME PARA LA PROFESIÓN PERPETUA (cf CIC 657 §1)"},{"t":"p","h":"INFORME sobre para su profesión perpetua, dados por en el día . . . de . . . . . . . . . . . . . . . . de"},{"t":"p","h":"DECLARACIÓN: Para ayudar a los superiores a un discernimiento vocacional más adecuado, informo, según conciencia, sobre los siguientes aspectos:"},{"t":"p","h":"1. Ficha personal:"},{"t":"p","h":"- Años, lugar de nacimiento, etc. (todo lo que pueda interesar)."},{"t":"p","h":"- Años que lleva de religioso, número de profesiones, fecha de la primera profesión."},{"t":"p","h":"- Estudios realizados."},{"t":"p","h":"- Salud física y psíquica. Posibles somatizaciones."},{"t":"p","h":"- Rasgos globales del carácter."},{"t":"p","h":"2. Madurez humana"},{"t":"p","h":"- Valoración global de su madurez humana."},{"t":"p","h":"- Progresos más notorios, si se saben, desde el noviciado. Retrasos más significativos."},{"t":"p","h":"- Cualidades humanas (sinceridad, fidelidad, bondad del corazón, solidaridad, moderación, dominio de sí, amor al trabajo, flexibilidad de espíritu, fortaleza de carácter, preocupación por la justicia ...)"},{"t":"p","h":"- Equilibrio psicológico (aceptación de sí y de los demás, disciplina de espíritu, tolerancia a las frustraciones, firmeza de ánimo y constancia, sentimiento de culpabilidad, capacidad para afrontar la soledad y los fracasos de manera constructiva, manejo de posibles adicciones ...)"},{"t":"p","h":"- Madurez sexual y afectiva (vivencia actual de respeto y de vínculos afectivos equilibrados con personas de todo género, edad y condición social; armonización de la necesidad de amar con la de ser amado; capacidad de sublimación, etc)."},{"t":"p","h":"- Madurez de juicio."},{"t":"p","h":"- Capacidad intelectual."},{"t":"p","h":"- Capacidad comunicativa: verbal, corporal, de ideas y sentimientos."},{"t":"p","h":"- Otras cualidades: capacidad de diálogo, apertura a los formadores, servicialidad, delicadeza, capacidad creativa y de iniciativa."},{"t":"p","h":"- Previsión de futuro."},{"t":"p","h":"3. Madurez espiritual"},{"t":"p","h":"- Valoración global de su vida espiritual y de fe. Orientación glo¬bal de su espiritualidad."},{"t":"p","h":"- Progresos más notorios, si se saben, desde el noviciado. Retrasos más significativos."},{"t":"p","h":"- Sentido de Dios y del prójimo (especialmente del pobre)."},{"t":"p","h":"- Búsqueda responsable de la propia santidad."},{"t":"p","h":"- Vivencia de los sacramentos (eucaristía y penitencia); vivencia de las virtudes misioneras; participación activa en la oración comunitaria; consecución del hábito de oración personal y de la escucha y acogida de la Palabra."},{"t":"p","h":"- Vivencia cordimariana."},{"t":"p","h":"- Amor y fidelidad a la Iglesia y a la Congregación."},{"t":"p","h":"- Estilo de vida que testimonia."},{"t":"p","h":"- Aceptación práctica de las Constituciones."},{"t":"p","h":"- Previsión de futuro."},{"t":"p","h":"4. Vida comunitaria"},{"t":"p","h":"- Valoración global de su capacidad para la vida comunitaria."},{"t":"p","h":"- Comportamientos comunitarios más notables. Rol más específico que desempeña en la comunidad."},{"t":"p","h":"- Cualidades más destacables."},{"t":"p","h":"- Aceptación de las mediaciones."},{"t":"p","h":"- Capacidad para vivir conforme a un proyecto comunitario."},{"t":"p","h":"- Previsión de futuro."},{"t":"p","h":"5. Compromisos evangélicos (pobreza, castidad, obediencia)"},{"t":"p","h":"- Valoración global."},{"t":"p","h":"- Criterios más destacables sobre cada uno de ellos."},{"t":"p","h":"- Comportamientos más destacables sobre cada uno de ellos. Sus motivaciones de fondo la renuncia evangélica, la frustración ..."},{"t":"p","h":"- Previsión de futuro."},{"t":"p","h":"6. Vida apostólica"},{"t":"p","h":"- Valoración global de la misma: criterios, praxis, motivaciones, disponibilidad."},{"t":"p","h":"- Servicio de la Palabra. Experiencias apostólicas realizadas más significativas (si se conocen). Juicio general."},{"t":"p","h":"- Especialización o previsión de futuro apostólico en la Congregación."},{"t":"p","h":"7. Integración vocacional"},{"t":"p","h":"- Valoración global del desarrollo vocacional y de su maduración actual."},{"t":"p","h":"- Grado de resolución de posibles traumas o crisis que haya padecido."},{"t":"p","h":"- Personalización de los valores vocacionales claretianos."},{"t":"p","h":"- Previsión de futuro."},{"t":"p","h":"8. Otros aspectos"},{"t":"p","h":"- Criterios orientativos para el futuro a tener en cuenta por el Superior Mayor."},{"t":"p","h":"- Juicio valorativo final."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario10"},{"t":"h","l":2,"h":"PETICIÓN DE LOS MINISTERIOS INSTITUIDOS (cf Motu proprio “Ministeria Quaedam”, VIII)"},{"t":"p","h":"Al M. R. Padre ..................................."},{"t":"p","h":"Superior Mayor de .............................."},{"t":"p","h":"Yo (Estudiante/hermano) profeso de votos (temporales/perpetuos) de ...... años de edad, que está cursando (o ha cursado)"},{"t":"p","h":"[instituido en el Ministerio de Lector, el día ..... del mes de de ............], con el debido respeto"},{"t":"p","h":"EXPONGO que, libre y espontáneamente, pido ser instituido en el Ministerio de .................. y que tengo firme voluntad de servir fielmente a Dios y al pueblo cristiano."},{"t":"p","h":"Y en consecuencia, SUPLICO a Vd. y a su Consejo que se me conceda la gracia de recibirlo en la próxima fecha de en la ciudad de"},{"t":"p","h":"Deseándole las bendiciones del Señor y del Corazón de María."},{"t":"p","h":"En ..............., a ........ de ..................., de .............."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 11"},{"t":"h","l":2,"h":"DECLARACIÓN PERSONAL ESCRITA A MANO ANTES DEL DIACONADO (cf CIC 1028; 1036)"},{"t":"p","h":"Al M. R. Padre..........................."},{"t":"p","h":"Superior Mayor de......................"},{"t":"p","h":"Yo, estudiante de votos perpetuos, de ...... años de edad, que en la actualidad curso .............................., instituido en los ministerios de Lectorado y Acolitado el día ........ de ............ de"},{"t":"p","h":"DECLARO:"},{"t":"p","h":"1. Que solicito y deseo ser admitido al Orden del Diaconado (cf CIC 1036)."},{"t":"p","h":"2. Que conozco debidamente lo que se refiere a dicho Orden y las obligaciones que el mismo lleva consigo (cf CIC 1O28)."},{"t":"p","h":"3. Que lo voy a recibir libre y espontáneamente (cf CIC 1036)."},{"t":"p","h":"4. Y que me dedicaré de modo perpetuo al ministerio eclesiástico (cf CIC 1036), según el estilo de la Congregación (CC 81-85)."},{"t":"p","h":"Y, en consecuencia, SUPLICO a Vd. y a su Consejo la gracia de ser ordenado Diácono en la próxima fecha de"},{"t":"p","h":"Gracia que confiadamente espero conseguir."},{"t":"p","h":"En ............, a ...... de .................... de ................."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 12"},{"t":"h","l":2,"h":"PROFESIÓN DE FE Y JURAMENTO DE FIDELIDAD (cf CIC 833 §6)"},{"t":"p","h":"Yo, N.N., firmemente creo y profeso todas y cada una de las cosas que están contenidas en el Símbolo de la fe, a saber:"},{"t":"p","h":"Creo en un solo Dios, Padre Todopoderoso, Creador del Cielo y Tierra, de todo lo visible e invisible, y en un solo Señor, Jesucristo, Hijo unigénito de Dios, nacido del Padre antes de todos los siglos, Dios de Dios, Luz de Luz, Dios verdadero de Dios verdadero, engendrado, no creado, consustancial con el Padre, por quien todo fue hecho; el cual descendió del Cielo por nosotros los hombres y por nuestra salvación; y se encarnó de María Virgen por virtud del Espíritu Santo y se hizo hombre; fue también crucificado por nosotros bajo el mandato de Poncio Pilato, padeció y fue sepultado; y resucitó al tercer día según las Escrituras, y subió al cielo, y está sentado a la diestra del Padre, y de nuevo vendrá con gloria a juzgar a vivos y muertos y su reino no tendrá fin; y en el Espíritu Santo, Señor y vivificador, que procede del Padre y del Hijo; que con el Padre y el Hijo recibe una misma adoración y gloria, y que habló por los Profetas; y en la Iglesia que es Una, Santa, Católica y Apostólica. Confieso un solo Bautismo para el perdón de los pecados y espero la resurrección de los muertos y la vida perdurable."},{"t":"p","h":"Amén."},{"t":"p","h":"Admito también todas y cada una de las cosas que acerca de la doctrina de la Fe y las costumbres, o bien fueron definidas por el juicio solemne de la Iglesia, o bien afirmadas y declaradas por su Magisterio ordinario, y en el sentido en que por ella son propuestas, principalmente aquellas que se refieren al misterio de la Santa Iglesia de Cristo, de sus Sacramentos, al Sacrificio de la Misa, y al Primado del Romano Pontífice."},{"t":"p","h":"Formulario 13"},{"t":"h","l":2,"h":"DECLARACIÓN PERSONAL ESCRITA A MANO ANTES DEL PRESBITERADO (cf CIC 1028; 1036)"},{"t":"p","h":"Al M. R. Padre..........................."},{"t":"p","h":"Superior Mayor de......................"},{"t":"p","h":"Yo, Estudiante de votos perpetuos, de ....... años de edad, que en la actualidad curso ordenado de Diácono el día ....... de .............. de"},{"t":"p","h":"DECLARO:"},{"t":"p","h":"1. Que solicito y deseo ser admitido al Orden del Presbiterado (cf CIC 1036)."},{"t":"p","h":"2. Que, habiendo recibido la adecuada formación, conozco debidamente lo que se refiere a dicho Orden y las obligaciones que el mismo lleva consigo (cf CIC 1O28)."},{"t":"p","h":"3. Que lo voy a recibir libre y espontáneamente (cf CIC 1036)."},{"t":"p","h":"4. Y que me dedicaré de modo perpetuo al ministerio eclesiástico (Cf CIC 1036), según el estilo de vida y misión de la Congregación (CC 82-85; Dir 261-268)."},{"t":"p","h":"Y, en consecuencia, SUPLICO a Vd. y a su Consejo la gracia de ser ordenado Presbítero la próxima fecha de"},{"t":"p","h":"Gracia que confiadamente espero conseguir."},{"t":"p","h":"En ................., a ........ de .................. de ..............."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 14"},{"t":"h","l":2,"h":"MODELOS DE INFORMES PARA EL SACRAMENTO DEL ORDEN (cf CIC 1025;1029;1031;1051; Dir 242; 243)"},{"t":"p","h":"INFORME sobre el (estudiante de votos perpetuos o diácono) para la ordenación de (diácono o presbítero) dados por en ..........., el día .... de ................ de"},{"t":"p","h":"DECLARACIÓN: Para ayudar a los Superiores a un discernimiento vocacional más adecuado, informo, según conciencia, que el candidato no tiene ninguna irregularidad ni impedimento, de los señalados en el derecho universal (cf CIC 1040-1049), y que reúne las condiciones que indico a continuación:"},{"t":"p","h":"1. Salud física y psíquica. Posibles impedimentos."},{"t":"p","h":"2. Madurez para desempeñar los compromisos derivados del diaconado o del presbiterado."},{"t":"p","h":"3. Carácter y aptitud para el ejercicio pastoral del diaconado o del presbiterado."},{"t":"p","h":"4. Juicio sobre la fe, recta intención, fama, costumbres y cualidades más sobresalientes."},{"t":"p","h":"5. Criterios doctrinales, en especial sobre el diaconado o el presbiterado."},{"t":"p","h":"6. Espiritualidad apostólica claretiana:"},{"t":"p","h":"- Vida de oración personal y comunitaria. Vida sacramental."},{"t":"p","h":"- Servicio de la Palabra."},{"t":"p","h":"- Vivencia cordimariana."},{"t":"p","h":"- Amor y fidelidad a la Iglesia."},{"t":"p","h":"- Sentido apostólico. Disponibilidad."},{"t":"p","h":"- Capacidad de trabajo."},{"t":"p","h":"7. Vivencia de las exigencias de la vida religiosa, en especial la vida de comunidad y los votos religiosos: pobreza, castidad y obediencia."},{"t":"p","h":"8. Capacidad para vivir ordenadamente su sexualidad según las prescripciones propias del celibato de los ministros ordenados."},{"t":"p","h":"9. Formación teológica y pastoral para las órdenes. Preparación específica para el diaconado o el presbiterado."},{"t":"p","h":"10. Posible futuro ministerial en la Congregación y en la Iglesia."},{"t":"p","h":"11. Otras indicaciones."},{"t":"p","h":"12. Juicio valorativo final."},{"t":"p","h":"(Firma)"},{"t":"p","h":"Formulario 15"},{"t":"h","l":2,"h":"MODELO DE LETRAS DIMISORIAS (cf CIC 1052; 1019.1; Dir 243,d)"},{"t":"p","h":"El P. .................................................., Superior Provincial de la Provincia de ....................... (o Superior Mayor de la Delegación de ………), de la Congregación de Misioneros Hijos del Inmaculado Corazón de María, Misioneros Claretianos, a nuestro amado en Cristo , profeso perpetuo de nuestra Congregación y miembro de la Comunidad de , en la diócesis de ................................., salud en el Señor."},{"t":"p","h":"Constándonos que, además de estar libre de irregularidad o impedimento canónico, posees la idoneidad de costumbres y la edad requerida, y sabiendo que has cumplido los estudios teológicos prescritos, realizado el examen mandado para los ordenandos y practicados los ejercicios espirituales establecidos para el caso, en virtud de las facultades que nos concede el CIC (c. 1091,1), te enviamos al Excmo. y Rvdmo. Sr. D. para que, cumplidos los intersticios y con el título de mesa común, puedas ser legítimamente promovido al (diaconado o presbiterado)"},{"t":"p","h":"En fe de lo cual, ordenamos expedir las presentes Letras dimisorias, con nuestra firma y sello y suscritas por nuestro Secretario."},{"t":"p","h":"En (lugar) ………............., a ....de.............de 20...."},{"t":"p","h":"(Firma y sello del Superior Provincial)"},{"t":"p","h":"(Firma del Secretario)"}],"notes":{"22":"En vistas a una adecuada previsión y preparación, los datos y certificados exigidos para el Noviciado se pueden pedir ya al principio o durante del Postulantado.","23":"Cf. Dir 190.","24":"Cf. Dir 188.","25":"Cf. Dir 189.","26":"Cf. CIC 597; CC 59; Dir 190.","27":"Cf. Dir 201.","28":"Cf. CIC 643 §2.","29":"Cf. Dir 199.","30":"Cf. CIC 597 §2.","31":"Cf. CIC 597 §1, 642, 643; Dir 199.","32":"Cf. CIC 643 §1.","33":"Cf. CIC 645; Dir 200.","34":"Cf. Dir 213.","35":"Cf. Dir 206, 217.","36":"Cf. CIC 652, 653 §2.","37":"Cf. Dir 227.","38":"Cf. CC 27; Dir 220.","39":"Cf. CC 70-71; Dir 228.","40":"Cf. CIC 668; Dir 220.","41":"Cf. Dir 223.","42":"Cf. CIC 657 §1.","43":"Cf. Dir 227.","44":"Cf. Dir 228.","45":"Cf. Dir 224.","46":"Cf. Dir 224; 241.","47":"Cf. Dir 225.","48":"Cf. CIC 657 §1.","49":"Cf. Dir 227.","50":"Cf. CC 70-71; Dir 228.","51":"Cf. Dir 232.","52":"Cf. Dir 233.","53":"Cf. C
