de la Iglesia [194]; en relación a la ubicación de la comunidad formativa [202]; la Eucaristía y el Reino [231]; como orientación de la formación académica [254]; en la vida comunitaria [260]; en las experiencias apostólicas [266]; entre las funciones del ministerio del presbítero [455]; en la formación continua [469, 471]; en la prevención de abusos en misión compartida [550]."},{"k":"RESPONSABILIDAD[ES]","v":"del formando [122]; de los formadores [124]; de la comunidad formativa [131, 205]; de los profesores [133]; de la Congregación [131, 135, 195, 271]; de los Organismos Mayores [198, 403, 408, 496, 509]."},{"k":"RESPONSABLES","v":"del proceso vocacional [307]; el formador y su equipo [321-324]; del postulantado [345-347]; del noviciado [369-373]; del posnoviciado [413-421]; de la formación continua [482-484]."},{"k":"RESPONSABLES DE LA FORMACIÓN","v":"en general [271]; Superiores: diversos niveles [272-274]; sus funciones [275]; las prefecturas [276-280]; prefectura General [281-286]; prefectura de los organismos mayores [287-291]."},{"k":"SABÁTICOS (períodos)","v":"naturaleza [506]; plan personal [506]; ofrecidos a todo claretiano [498, 507]."},{"k":"SACRAMENTOS","v":"bautismo: cuidar la fe recibida en él [316]; eucaristía: dinamismo formativo [230-233]; dimensiones [231]; pedagogía [233, 450, 456]; reconciliación: rasgos [234, 319, 360]; celebración personal y comunitaria [235]; certificados bautismo y confirmación [325, 351]; en las crisis [539] (cf misionero diácono y presbítero)."},{"k":"SEGLARES","v":"agentes de formación [132]."},{"k":"SEGUIMIENTO DE CRISTO","v":"gradual, progresivo y articulado [43]; fruto del Espíritu Santo [107, 110]; objetivo de la formación, según el carisma claretiano [11-12, 17-33, 61]; abarca toda la persona [66]; presencia de María [112]; el formando es discípulo en esta escuela [120]; en el noviciado [348, 358, 361]; posnoviciado [388, 419]; media edad [518] (cf configuración con Cristo)."},{"k":"SITUACIÓN","v":"marco de referencia de la formación [53-54]; sociocultural, eclesial, congregacional [55-60] (cf ámbitos)."},{"k":"SUPERIOR[ES]","v":"responsables de la formación en general [271]; diversos niveles [272]; funciones [275]; agente y responsable de la formación continua [484]; proporciona los medios para la formación continua [497]; deben preocuparse de la formación integral de los misioneros hermanos [443]."},{"k":"TECNOLOGÍAS DE LA INFORMACIÓN Y LA COMUNICACIÓN","v":"llamadas de Dios en el mundo digital [32]; manipulación en los medios de comunicación y en las redes sociales [55]; nuevas posibilidades de comunicación [57, 386]; prudencia y madurez en su uso [77-79, 102, 329]; tecnologías y medios de comunicación social [189-190]; su eficacia apostólica [190]; su realidad como medio nuevo de comunicación [190]; aprendizaje [251]; su relación con el estudio [254, 404]; formación apostólica [270]; para familiarizarse con la vida congregacional [337]; uso en el Noviciado [357]."},{"k":"TERCERA EDAD","v":"etapa [522-531]; objetivo [523]; actitudes [527-528]; medios [529]; ambientes [530-531]."},{"k":"TRANSFORMACIÓN","v":"(procesos de): [10]; se requieren procesos de transformación [14]; según el Corazón de María [24]; movida por el Espíritu [31]; en toda la formación [35]; gradual y progresivo [43]; que sea consciente [50]; la formación como proceso transformador [61]; para configurarse con cristo misionero [90]; Eucaristía transformadora [233]; transformación espiritual [521]."},{"k":"UNIVERSALIDAD","v":"formación universal [15, 31, 108, 367]; proceso formativo inculturado e intercultural [50-52, 194, 201]; disponibilidad [423]."},{"k":"VIRTUDES","v":"apostólicas y configuración con Cristo [90, 388]; caridad apostólica [91-93]; humildad [94-96, 559]; mansedumbre [97-99, 559]; mortificación [100-102, 559]."},{"k":"VOCACIÓN","v":"punto de partida del itinerario formativo [62-66]; alianza con Dios que exige una respuesta en fe y amor [62-63]; consiste en el don del amor [64]; abarca toda la persona [66]; signos [211]; criterios generales de discernimiento [308-309]; al servicio de la misión hasta el final [563]; crisis, debilitamiento e incompatibilidades [538-539, 541, 551] (cf llamada)."},{"k":"VOTOS","v":"expresión de entrega total y de configuración con Cristo [61]; naturaleza y finalidad [72-73]; dimensiones [73]; castidad [74-78]; pobreza [79-84]; obediencia [85-89]; conductas inapropiadas [543, 553, 558]."}]}</script>
<script>
(function(){
'use strict';
const D=JSON.parse(document.getElementById('pgfdata').textContent);
const U=D.units, UM={}; U.forEach((u,i)=>{u.ix=i;UM[u.id]=u});
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('pgf20.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('pgf20.'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>{const d=document.createElement('div');d.innerHTML=h.replace(/<sup[^>]*>.*?<\/sup>/g,'');return d.textContent};
const nrm=s=>{let o='';for(const ch of s){o+=ch.normalize('NFD')[0].toLowerCase()}return o};

/* ---- groups & paragraph map ---- */
const PAR={}; // n -> uid
U.forEach(u=>{
  const nums=[];
  u.blocks.forEach((b,i)=>{b.ix=i;b.plain=strip(b.h);b.np=nrm(b.plain);if(b.s&&b.n){PAR[b.n]=u.id;nums.push(b.n)}});
  u.range=nums.length?[nums[0],nums[nums.length-1]]:null;
  u.heads=u.blocks.filter(b=>b.t==='h');
  u.notesN={};for(const k in u.notes){u.notesN[k]=nrm(strip(u.notes[k]))}
});
const SIG=D.siglas.filter(x=>x.s);
const sigRe=new RegExp('(^|[\\s(;,])('+SIG.map(x=>x.s).sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?=\\s+\\d)','g');
const SIGM={};SIG.forEach(x=>SIGM[x.s]=x.d);
function noteHTML(h){
  return h.replace(/(^|>)([^<]+)/g,(m,a,t)=>a+t.replace(sigRe,(mm,p,s)=>p+'<abbr title="'+esc(SIGM[s])+'">'+s+'</abbr>'))
          .replace(/Apéndice\s+(\d)/g,(m,n)=>'<a href="#u=ap'+n+'">'+m+'</a>');
}

/* ---- settings ---- */
let fs=LS.get('fs',18);
function applyFs(){document.documentElement.style.setProperty('--fs',fs+'px');LS.set('fs',fs)}
applyFs();
let theme=LS.get('theme',null); if(theme)document.documentElement.dataset.theme=theme;
function toggleTheme(){
  const dark=theme? theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';document.documentElement.dataset.theme=theme;LS.set('theme',theme);
}
let BM=LS.get('bm',{}); // key -> {u,n,ix,t}
let AN=LS.get('an',{}); // key -> text
const keyOf=(uid,b)=>b.n?('n:'+b.n):('b:'+uid+':'+b.ix);

/* ---- toast & sheet ---- */
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1800)}
function sheet(title,html){$('#shT').textContent=title;$('#shB').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
$('#shX').onclick=closeSheet;

/* ---- TOC ---- */
const GROUPS=[
  ['Preliminares',['pres','prol']],
  ['',['intro']],
  ['Primera parte · Aspectos generales',['c1','c2','c3','c4','c5','c6']],
  ['Segunda parte · Etapas',['c7','c8','c9','c10','c11']],
  ['',['concl']],
  ['Apéndices',['ap1','ap2','ap3','ap4','ap5']]
];
const rangeTxt=u=>u.range?(u.range[0]===u.range[1]?'n. '+u.range[0]:'nn. '+u.range[0]+'–'+u.range[1]):'';
const KEEP=new Set(['PGF','CMF','II','CIC','I','III','IV','V']);
function sc(t){if(t!==t.toUpperCase()||!/[A-ZÁÉÍÓÚ]{3}/.test(t))return t;let first=true;
  return t.split(/(\s+)/).map(w=>{if(/^\s+$/.test(w)||/^[\d.]+$/.test(w))return w;if(KEEP.has(w.replace(/[^A-Z]/g,''))&&w.replace(/[^A-Z]/g,'').length===w.replace(/[^A-ZÁÉÍÓÚÑ]/gi,'').length)return w;
  const l=w.toLowerCase();if(first){first=false;return l.charAt(0).toUpperCase()+l.slice(1)}return l}).join('')}
function buildToc(){
  let h='<div class="tools"><button data-go="#buscar">Buscar</button><button data-go="#materias">Índice de materias</button><button data-go="#siglas">Siglas</button><button data-go="#marcadores">Marcadores</button></div>';
  GROUPS.forEach(([g,ids])=>{
    if(g)h+='<h3>'+g+'</h3>';else h+='<div style="height:.6rem"></div>';
    ids.forEach(id=>{const u=UM[id];
      const subs=u.heads.filter(b=>b.l<=4);
      h+='<div class="u" data-u="'+id+'">'+(subs.length?'<button class="tw" data-tw="'+id+'" aria-label="Desplegar">▸</button>':'<span style="width:22px;flex:none"></span>')+
        '<span class="t">'+(u.kind==='main'&&id.startsWith('c')?'<b style="color:var(--gold);font-weight:600">'+id.slice(1)+'.</b> ':'')+esc(id.startsWith('c')?u.title:(u.kind==='app'?u.short+' · '+u.title:u.short))+'</span><span class="r">'+rangeTxt(u)+'</span></div>';
      if(subs.length){h+='<div class="sub" id="sub-'+id+'">'+subs.map(b=>'<a class="l'+b.l+'" href="#u='+id+'&h='+b.ix+'">'+esc(sc(strip(b.h)))+'</a>').join('')+'</div>'}
    });
  });
  $('#toc').innerHTML=h;
  $('#toc').addEventListener('click',e=>{
    const tw=e.target.closest('[data-tw]');
    if(tw){e.stopPropagation();tw.classList.toggle('open');$('#sub-'+tw.dataset.tw).classList.toggle('open');return}
    const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;closeToc();return}
    const u=e.target.closest('.u');if(u){location.hash='#u='+u.dataset.u;closeToc();return}
    if(e.target.closest('.sub a'))closeToc();
  });
}
function markToc(uid){
  document.querySelectorAll('.toc .u').forEach(x=>x.classList.toggle('on',x.dataset.u===uid));
  if(uid){const tw=document.querySelector('[data-tw="'+uid+'"]');const s=$('#sub-'+uid);
    if(tw&&s&&!s.classList.contains('open')){tw.classList.add('open');s.classList.add('open')}}
}
const isMobile=()=>matchMedia('(max-width:980px)').matches;
function closeToc(){document.body.classList.remove('toc-open')}
$('#bToc').onclick=()=>{if(isMobile())document.body.classList.toggle('toc-open');else{document.body.classList.toggle('toc-closed');LS.set('tocClosed',document.body.classList.contains('toc-closed'))}};
if(LS.get('tocClosed',false))document.body.classList.add('toc-closed');
$('#scrim').onclick=closeToc;

/* ---- render unit ---- */
let cur=null, hlTerms=null;
const ORN='<svg class="orn" viewBox="0 0 120 12" aria-hidden="true"><path d="M0 6h48M72 6h48" stroke="currentColor" stroke-width="1"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>';
function liClass(p){return /^([a-zñ]|[ivx]+|\d{1,2})[\.\)]\s|^[-–•·]\s/.test(p)?' class="li"':''}
function renderUnit(u){
  let h='<div class="uhead"><div class="k">'+esc(u.kind==='app'?'Apéndices':(u.id.startsWith('c')?(parseInt(u.id.slice(1))<=6?'Primera parte · Aspectos generales':'Segunda parte · Etapas'):'Plan General de Formación'))+'</div>'+
    '<h1>'+(u.id.startsWith('c')||u.kind==='app'?'<span style="display:block;font-size:.5em;color:var(--gold);font-weight:600">'+esc(u.short)+'</span>':'')+esc(u.id.startsWith('c')||u.kind==='app'?u.title:u.title)+'</h1>'+
    '<div class="meta">'+[rangeTxt(u),'pp. '+u.pages[0]+'–'+u.pages[1]].filter(Boolean).join(' · ')+'</div>'+ORN+'</div><div class="txt">';
  let open=false;
  u.blocks.forEach(b=>{
    if(b.t==='h'){if(open){h+='</section>';open=false}h+='<h'+b.l+' id="h'+b.ix+'">'+b.h+'</h'+b.l+'>';return}
    if(b.s&&b.n){if(open)h+='</section>';const k='n:'+b.n;
      h+='<section class="par'+(BM[k]?' bm':'')+'" id="n'+b.n+'" data-k="'+k+'" data-ix="'+b.ix+'"><button class="pn" data-pn="'+b.n+'" title="Opciones del nº '+b.n+'">'+b.n+'</button>';open=true}
    else if(!b.n&&open){h+='</section>';open=false}
    if(!open){const k=keyOf(u.id,b);h+='<section class="par np'+(BM[k]?' bm':'')+'" id="b'+b.ix+'" data-k="'+k+'" data-ix="'+b.ix+'">'}
    h+='<p'+liClass(b.plain)+'>'+b.h+'</p>';
    const ak=open?('n:'+b.n):keyOf(u.id,b);
    if(!open){if(AN[ak])h+='<div class="anno" data-ak="'+ak+'">✎ '+esc(AN[ak])+'</div>';h+='</section>'}
    else{const nx=u.blocks[b.ix+1];if((!nx||nx.t==='h'||nx.s||!nx.n)&&AN[ak])h+='<div class="anno" data-ak="'+ak+'">✎ '+esc(AN[ak])+'</div>'}
  });
  if(open)h+='</section>';
  h+='</div>';
  const nk=Object.keys(u.notes);
  if(nk.length){h+='<details class="notes"><summary>Notas ('+nk.length+')</summary><ol>'+nk.map(k=>'<li value="'+(parseInt(k)||'')+'" id="fn'+k+'">'+noteHTML(u.notes[k])+'</li>').join('')+'</ol></details>'}
  const pv=U[u.ix-1],nx=U[u.ix+1];
  h+='<div class="pager">'+(pv?'<button data-go="#u='+pv.id+'"><small>← Anterior</small>'+esc(pv.short)+'</button>':'<span></span>')+(nx?'<button class="nx" data-go="#u='+nx.id+'"><small>Siguiente →</small>'+esc(nx.short)+'</button>':'<span></span>')+'</div>';
  return h;
}
/* paragraph tap on mobile: allow tapping number only; on unnumbered blocks, long-press via double click */
function highlight(root,terms){
  if(!terms||!terms.length)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest('sup,button,mark,.pn')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const t=n.nodeValue,nt=nrm(t);let ranges=[];
    terms.forEach(term=>{let i=0;while((i=nt.indexOf(term,i))>-1){if(i===0||!/[a-z0-9]/.test(nt[i-1]))ranges.push([i,i+term.length]);i+=term.length}});
    if(!ranges.length)return;
    ranges.sort((a,b)=>a[0]-b[0]);const m=[];ranges.forEach(r=>{if(m.length&&r[0]<=m[m.length-1][1])m[m.length-1][1]=Math.max(m[m.length-1][1],r[1]);else m.push(r)});
    const f=document.createDocumentFragment();let p=0;
    m.forEach(([a,b])=>{f.appendChild(document.createTextNode(t.slice(p,a)));const mk=document.createElement('mark');mk.textContent=t.slice(a,b);f.appendChild(mk);p=b});
    f.appendChild(document.createTextNode(t.slice(p)));n.parentNode.replaceChild(f,n);
  });
}
function showUnit(uid,opt){
  const u=UM[uid];if(!u){showHome();return}
  const page=$('#page');
  if(cur!==uid||opt.rerender||hlTerms!==opt.hl){page.innerHTML=renderUnit(u);cur=uid;}
  hlTerms=opt.hl||null;
  if(hlTerms)highlight(page.querySelector('.txt'),hlTerms);
  markToc(uid);
  let target=null;
  if(opt.n)target=document.getElementById('n'+opt.n);
  else if(opt.h!=null)target=document.getElementById('h'+opt.h);
  else if(opt.b!=null)target=document.getElementById('b'+opt.b)||page.querySelector('[data-ix="'+opt.b+'"]');
  if(opt.note){const s=page.querySelector('sup.fn[data-n="'+opt.note+'"]');if(s)target=s.closest('section')||s;setTimeout(()=>openNote(uid,opt.note),250)}
  requestAnimationFrame(()=>{
    if(target){target.scrollIntoView({block:'start'});if(target.classList.contains('par')){target.classList.remove('flash');void target.offsetWidth;target.classList.add('flash')}}
    else if(opt.y!=null)window.scrollTo(0,opt.y);
    else window.scrollTo(0,0);
  });
  LS.set('last',{u:uid});
}

/* ---- notes popup ---- */
function openNote(uid,n){const u=UM[uid];if(!u||!u.notes[n])return;
  sheet('Nota '+n+' · '+u.short,'<div>'+noteHTML(u.notes[n])+'</div>')}

/* ---- paragraph actions ---- */
function blockText(uid,k){
  const u=UM[uid];let bs;
  if(k.startsWith('n:')){const n=k.slice(2);bs=u.blocks.filter(b=>b.n===n&&b.t==='p')}
  else{const ix=+k.split(':')[2];bs=[u.blocks[ix]]}
  return bs.map(b=>b.plain).join('\n');
}
const citeOf=(uid,k)=>{const u=UM[uid];return k.startsWith('n:')?'PGF 2020, n. '+k.slice(2):'PGF 2020, '+u.short+(u.kind!=='app'?'':' ('+u.title+')')};
function paraMenu(uid,k){
  const isB=!!BM[k];
  const lab=k.startsWith('n:')?'Número '+k.slice(2):UM[uid].short;
  sheet(lab+' · '+UM[uid].short,
   '<div class="acts"><button data-a="copy">Copiar texto</button><button data-a="cite">Copiar con cita</button>'+
   '<button data-a="bm">'+(isB?'Quitar marcador':'Añadir marcador')+'</button><button data-a="an">'+(AN[k]?'Editar nota personal':'Añadir nota personal')+'</button>'+
   (k.startsWith('n:')?'<button data-a="link" style="grid-column:1/-1">Copiar enlace a este número</button>':'')+'</div>');
  $('#shB').onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;const t=blockText(uid,k);
    if(a.dataset.a==='copy')copy(t,'Texto copiado');
    if(a.dataset.a==='cite')copy('«'+t+'» ('+citeOf(uid,k)+').','Texto copiado con cita');
    if(a.dataset.a==='link')copy(location.href.split('#')[0]+'#n='+k.slice(2),'Enlace copiado');
    if(a.dataset.a==='bm'){if(BM[k]){delete BM[k];toast('Marcador quitado')}else{BM[k]={u:uid,t:t.slice(0,220),d:Date.now()};toast('Marcador añadido')}LS.set('bm',BM);
      const el=document.querySelector('[data-k="'+k+'"]');if(el)el.classList.toggle('bm',!!BM[k]);closeSheet()}
    if(a.dataset.a==='an')annoEdit(uid,k);
  };
}
function annoEdit(uid,k){
  sheet('Nota personal · '+citeOf(uid,k),'<textarea id="anT" placeholder="Escribe aquí tu comentario o apunte…">'+esc(AN[k]||'')+'</textarea><div class="acts"><button data-a="save">Guardar</button><button data-a="del">Borrar nota</button></div>');
  setTimeout(()=>$('#anT').focus(),50);
  $('#shB').onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;
    const v=$('#anT').value.trim();
    if(a.dataset.a==='save'&&v){AN[k]=v;if(!BM[k])BM[k]={u:uid,t:blockText(uid,k).slice(0,220),d:Date.now()};LS.set('bm',BM)}else delete AN[k];
    LS.set('an',AN);closeSheet();const y=scrollY;showUnit(uid,{rerender:true,y});toast(a.dataset.a==='save'&&v?'Nota guardada':'Nota borrada')};
}
function copy(t,msg){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg)).catch(()=>{
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('No se pudo copiar')}ta.remove()});
  closeSheet();
}
$('#page').addEventListener('click',e=>{
  const f=e.target.closest('sup.fn');if(f){openNote(f.dataset.u,f.dataset.n);return}
  const pn=e.target.closest('.pn');if(pn){paraMenu(cur,'n:'+pn.dataset.pn);return}
  const an=e.target.closest('.anno');if(an){annoEdit(cur,an.dataset.ak);return}
  const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const r=e.target.closest('[data-ref]');if(r){fromView=location.hash;location.hash='#n='+r.dataset.ref;return}
  const rs=e.target.closest('[data-res]');if(rs){fromView=location.hash;location.hash=rs.dataset.res;return}
});
$('#page').addEventListener('dblclick',e=>{const s=e.target.closest('section.par.np');if(s&&cur){paraMenu(cur,s.dataset.k)}});

/* ---- home ---- */
const DEF='Un Hijo del Inmaculado Corazón de María es un hombre que arde en caridad y que abrasa por donde pasa. Que desea eficazmente y procura por todos los medios encender a todos los hombres en el fuego del divino amor. Nada le arredra; se goza en las privaciones; aborda los trabajos; abraza los sacrificios; se complace en las calumnias; se alegra en los tormentos y dolores que sufre y se gloría en la cruz de Jesucristo. No piensa sino cómo seguirá e imitará a Cristo en orar, en trabajar, en sufrir, en procurar siempre y únicamente la mayor gloria de Dios y la salvación de los hombres.';
function showHome(){
  cur=null;markToc(null);
  const last=LS.get('last',null);
  let h='<div class="hero"><div class="ord">Misioneros Hijos del Inmaculado Corazón de María</div><h1>Plan General de Formación</h1><div class="sub">Formación de misioneros: estar con Él y ser enviados a su misión</div></div>'+
  '<div class="quote">“Enamórense ustedes de Jesucristo y de las almas, y lo comprenderán todo y harán más que yo”<cite>San Antonio María Claret</cite></div>'+
  '<div class="qa">'+(last&&UM[last.u]?'<button class="cont" data-go="'+(last.n?'#n='+last.n:'#u='+last.u)+'"><b>Continuar la lectura</b>'+esc(UM[last.u].short+(last.n?', n. '+last.n:'')+' · '+UM[last.u].title)+'</button>':'')+
  '<button data-go="#buscar"><b>Buscar</b>En todo el texto y las notas</button><button data-go="#materias"><b>Índice de materias</b>'+D.indice.length+' voces con referencias</button>'+
  '<button data-go="#siglas"><b>Siglas</b>'+SIG.length+' abreviaturas</button><button data-go="#marcadores"><b>Marcadores</b>'+Object.keys(BM).length+' guardados</button></div>'+
  '<div class="struct">';
  GROUPS.forEach(([g,ids])=>{h+='<h2>'+(g||(ids[0]==='intro'?'Introducción':'Conclusión'))+'</h2>';
    ids.forEach(id=>{const u=UM[id];h+='<a href="#u='+id+'"><span class="s">'+esc(u.short)+'</span><span>'+esc(u.id==='pres'?'Presentación del PGF 2020':u.title)+'</span><span class="r">'+rangeTxt(u)+'</span></a>'})});
  h+='</div><details class="def"><summary>Definición del misionero claretiano</summary><div>'+DEF+'<br><br><span style="font-family:var(--sans);font-style:normal;font-size:.78rem;color:var(--gold)">San Antonio María Claret</span></div></details>';
  $('#page').innerHTML=h;window.scrollTo(0,0);
}

/* ---- search ---- */
let lastQ=LS.get('sq',{q:'',notes:true,app:true,exact:false,scope:'all'});
function showSearch(q){
  if(q!=null)lastQ.q=q;
  const o=lastQ;
  let h='<div class="vh">Buscar</div><div class="field"><input id="sIn" type="search" placeholder="Palabras o frase…" value="'+esc(o.q)+'" autocomplete="off"><button id="sGo">Buscar</button></div>'+
  '<div class="opts"><label><input type="checkbox" id="oEx"'+(o.exact?' checked':'')+'> Frase exacta</label><label><input type="checkbox" id="oNo"'+(o.notes?' checked':'')+'> Incluir notas</label><label><input type="checkbox" id="oAp"'+(o.app?' checked':'')+'> Incluir apéndices</label>'+
  '<label>Ámbito <select id="oSc"><option value="all">Todo el documento</option>'+U.map(u=>'<option value="'+u.id+'"'+(o.scope===u.id?' selected':'')+'>'+esc(u.short)+'</option>').join('')+'</select></label></div><div id="sRes"></div>';
  $('#page').innerHTML=h;cur=null;markToc(null);
  const run=()=>{o.q=$('#sIn').value;o.exact=$('#oEx').checked;o.notes=$('#oNo').checked;o.app=$('#oAp').checked;o.scope=$('#oSc').value;LS.set('sq',o);doSearch()};
  $('#sGo').onclick=run;$('#sIn').onkeydown=e=>{if(e.key==='Enter')run()};
  ['#oEx','#oNo','#oAp','#oSc'].forEach(s=>$(s).onchange=run);
  let tm;$('#sIn').oninput=()=>{clearTimeout(tm);tm=setTimeout(run,350)};
  setTimeout(()=>{const i=$('#sIn');i.focus();i.setSelectionRange(i.value.length,i.value.length)},30);
  if(o.q)doSearch();else $('#sRes').innerHTML='<div class="empty">Escribe una o varias palabras. Se ignoran tildes y mayúsculas. Para ir directamente a un número, usa el campo «nº» de la barra superior.</div>';
}
function termsOf(q,exact){q=nrm(q.trim().replace(/^["«“]|["»”]$/g,''));if(!q)return[];if(exact)return[q];const all=q.split(/\s+/).filter(Boolean);const st=all.filter(w=>!STOP.has(w));return st.length?st:all}
const STOP=new Set('a al ante con de del el en la las lo los o para por que se su sus un una y e u ni le les nos'.split(' '));
function snippet(plain,np,terms){
  let i=np.indexOf(terms[0]);if(i<0)i=0;let a=Math.max(0,i-90);if(a>0){const sp=plain.indexOf(' ',a);if(sp>-1&&sp<i)a=sp+1}const b=Math.min(plain.length,i+190);
  let s=(a>0?'…':'')+plain.slice(a,b)+(b<plain.length?'…':'');
  const d=document.createElement('span');d.textContent=s;highlight(d,terms);return d.innerHTML;
}
function doSearch(){
  const o=lastQ,terms=termsOf(o.q,o.exact),box=$('#sRes');
  if(!terms.length){box.innerHTML='';return}
  const hit=np=>terms.every(t=>np.includes(t));
  let out='',total=0,shown=0;const enc=encodeURIComponent(terms.join('|'));
  U.forEach(u=>{
    if(o.scope!=='all'&&o.scope!==u.id)return;
    if(!o.app&&u.kind==='app'&&o.scope==='all')return;
    let items=[];const seen=new Set();
    u.blocks.forEach(b=>{if(b.t!=='p'||!hit(b.np))return;
      const key=b.n?('n'+b.n):('b'+b.ix);if(seen.has(key))return;seen.add(key);
      items.push('<a class="res" data-res="'+(b.n?'#n='+b.n:'#u='+u.id+'&b='+b.ix)+'&hl='+enc+'"><span class="w">'+(b.n?'n. '+b.n:esc(u.short))+'</span>'+snippet(b.plain,b.np,terms)+'</a>')});
    if(o.notes)for(const k in u.notes){if(hit(u.notesN[k])){const pl=strip(u.notes[k]);items.push('<a class="res" data-res="#u='+u.id+'&note='+k+'&hl='+enc+'"><span class="w">nota '+k+'</span>'+snippet(pl,nrm(pl),terms)+'</a>')}}
    if(items.length){total+=items.length;const show=items.slice(0,Math.max(0,300-shown));shown+=show.length;
      if(show.length)out+='<div class="rgroup"><h3>'+esc(u.short)+(u.id.startsWith('c')||u.kind==='app'?' · '+esc(u.title):'')+' <span style="font-family:var(--sans);font-size:.75rem;color:var(--ink-2)">('+items.length+')</span></h3>'+show.join('')+'</div>'}
  });
  box.innerHTML=total?'<div class="rcount">'+total+' resultado'+(total>1?'s':'')+(shown<total?' · se muestran los primeros '+shown:'')+'</div>'+out:'<div class="empty">No hay resultados para «'+esc(o.q)+'». Prueba con menos palabras, desmarca «Frase exacta» o amplía el ámbito.</div>';
}

/* ---- índice de materias ---- */
function refsHTML(v){
  const chip=inner=>inner.replace(/(\d{1,3})(\s*-\s*(\d{1,3}))?/g,(mm,a,_r,b)=>PAR[a]?'<span class="ref" data-ref="'+a+'" title="Ir al n. '+a+'">'+a+(b?'–'+b:'')+'</span>':mm).replace(/,\s*/g,' ');
  return esc(v).replace(/\s*\[([^\]]+)\]/g,(m,inner)=>' '+chip(inner))
   .replace(/\(cf\.? ([^)]+)\)/gi,(m,t)=>'(cf. <a href="#materias&q='+encodeURIComponent(t.trim())+'">'+t+'</a>)');
}
function showMaterias(q){
  q=q||'';
  const letters=[...new Set(D.indice.map(e=>nrm(e.k)[0].toUpperCase()))];
  let h='<div class="vh">Índice de materias</div><div class="field"><input id="mIn" type="search" placeholder="Filtrar voces (p. ej. acompañamiento)" value="'+esc(q)+'"></div>'+
   '<p class="rcount">Los números remiten a los números marginales del PGF. Toca uno para ir al texto.</p><div class="letters">'+letters.map(l=>'<button data-l="'+l+'">'+l+'</button>').join('')+'</div><div id="mList"></div>';
  $('#page').innerHTML=h;cur=null;markToc(null);
  const draw=()=>{const f=nrm($('#mIn').value.trim());let L='',out='';
    D.indice.forEach((e,i)=>{if(f&&!nrm(e.k+' '+e.v).includes(f))return;const l=nrm(e.k)[0].toUpperCase();
      if(l!==L&&!f){out+='<div class="lh" id="L'+l+'">'+l+'</div>';L=l}
      out+='<div class="ent"><b>'+esc(e.k)+'</b>: '+refsHTML(e.v)+'</div>'});
    $('#mList').innerHTML=out||'<div class="empty">Ninguna voz contiene «'+esc($('#mIn').value)+'».</div>';
    if(f)highlight($('#mList'),[f]);
  };
  $('#mIn').oninput=draw;draw();
  $('.letters').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;if($('#mIn').value){$('#mIn').value='';draw()}const t=$('#L'+b.dataset.l);if(t)t.scrollIntoView({block:'start'})};
  window.scrollTo(0,0);
}
function showSiglas(){
  let h='<div class="vh">Siglas utilizadas</div><div class="field"><input id="gIn" type="search" placeholder="Filtrar siglas o títulos"></div><div class="sg" id="gList"></div>';
  $('#page').innerHTML=h;cur=null;markToc(null);
  const draw=()=>{const f=nrm($('#gIn').value.trim());let out='',pend='',pend2='';
    D.siglas.forEach(x=>{if(x.g){pend='<h3>'+esc(x.g)+'</h3>';pend2='';return}if(x.g2){pend2='<h4>'+esc(x.g2)+'</h4>';return}
      if(f&&!nrm(x.s+' '+x.d).includes(f))return;out+=pend+pend2+'<div class="row"><b>'+esc(x.s)+'</b><span>'+esc(x.d)+'</span></div>';pend='';pend2=''});
    $('#gList').innerHTML=out||'<div class="empty">Sin coincidencias.</div>'};
  $('#gIn').oninput=draw;draw();window.scrollTo(0,0);
}
function showBookmarks(){
  const ks=Object.keys(BM).sort((a,b)=>BM[b].d-BM[a].d);
  let h='<div class="vh">Marcadores y notas personales</div>';
  if(!ks.length)h+='<div class="empty">Aún no tienes marcadores. Toca el número dorado al margen de cualquier párrafo para marcarlo o añadirle una nota personal (en párrafos sin número, haz doble clic).</div>';
  else{h+='<div class="row-btns"><button id="bmExp">Exportar a texto</button><button id="bmClr">Borrar todo</button></div>';
    ks.forEach(k=>{const b=BM[k];const u=UM[b.u];if(!u)return;
      const go=k.startsWith('n:')?'#n='+k.slice(2):'#u='+b.u+'&b='+k.split(':')[2];
      h+='<div class="bmk" data-res="'+go+'"><div class="w">'+esc(citeOf(b.u,k))+' · '+esc(u.short)+'</div><div class="s">'+esc(b.t)+(b.t.length>=220?'…':'')+'</div>'+(AN[k]?'<div class="a">✎ '+esc(AN[k])+'</div>':'')+'</div>'})}
  $('#page').innerHTML=h;cur=null;markToc(null);window.scrollTo(0,0);
  if(ks.length){
    $('#bmExp').onclick=()=>copy(ks.map(k=>citeOf(BM[k].u,k)+'\n'+blockText(BM[k].u,k)+(AN[k]?'\nNota: '+AN[k]:'')).join('\n\n'),'Marcadores copiados al portapapeles');
    $('#bmClr').onclick=()=>{if(confirm('¿Borrar todos los marcadores y notas personales? No se puede deshacer.')){BM={};AN={};LS.set('bm',BM);LS.set('an',AN);showBookmarks()}};
  }
}

/* ---- routing ---- */
let fromView=null;
function route(){
  const h=decodeURIComponent(location.hash.slice(1));const p={};
  h.split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)p[kv.slice(0,i)]=kv.slice(i+1);else if(kv)p[kv]=true});
  closeSheet();
  const back=$('#backBtn');
  if(p.n){const uid=PAR[p.n];if(uid){showUnit(uid,{n:p.n,hl:p.hl?p.hl.split('|'):null})}else{toast('El número '+p.n+' no existe');showHome()}}
  else if(p.u){showUnit(p.u,{h:p.h!=null?+p.h:null,b:p.b!=null?+p.b:null,note:p.note||null,hl:p.hl?p.hl.split('|'):null})}
  else if(p.buscar){showSearch(p.q)}
  else if(p.materias){showMaterias(p.q)}
  else if(p.siglas){showSiglas()}
  else if(p.marcadores){showBookmarks()}
  else showHome();
  const inRead=!!(p.n||p.u);
  if(inRead&&fromView){back.classList.add('on');back.dataset.to=fromView;back.textContent=fromView.startsWith('#buscar')?'← Volver a los resultados':fromView.startsWith('#materias')?'← Volver al índice de materias':'← Volver'}
  else if(!inRead){back.classList.remove('on');fromView=null}
  updProg();
}
$('#backBtn').onclick=()=>{const to=$('#backBtn').dataset.to;fromView=null;$('#backBtn').classList.remove('on');
  if(to.startsWith('#buscar')){location.hash='#buscar'}else location.hash=to};
window.addEventListener('hashchange',route);

/* ---- top controls ---- */
$('#bHome').onclick=$('#bLogo').onclick=()=>{location.hash=''};
$('#bSearch').onclick=()=>{location.hash='#buscar'};
$('#bMinus').onclick=()=>{fs=Math.max(13,fs-1);applyFs()};
$('#bPlus').onclick=()=>{fs=Math.min(30,fs+1);applyFs()};
$('#bMore').onclick=()=>{
  sheet('Opciones','<div class="acts"><button data-a="m">A−  Texto más pequeño</button><button data-a="p">A+  Texto más grande</button><button data-a="t">Modo claro / oscuro</button><button data-a="r">Tamaño de texto normal</button>'+
   '<button data-a="pr">Imprimir esta sección</button><button data-a="bm">Marcadores</button><button data-a="mt">Índice de materias</button><button data-a="sg">Siglas</button></div>'+
   '<p style="font-family:var(--sans);font-size:.8rem;color:var(--ink-2);margin:.9rem 0 0">Tamaño actual: '+fs+' px · Atajos: <b>/</b> buscar, <b>←</b> <b>→</b> sección anterior/siguiente, <b>Esc</b> cerrar.</p>');
  $('#shB').onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.a;
    if(v==='m'){fs=Math.max(13,fs-1);applyFs();toast(fs+' px');return}
    if(v==='p'){fs=Math.min(30,fs+1);applyFs();toast(fs+' px');return}
    if(v==='r'){fs=18;applyFs();toast('18 px');return}
    if(v==='t'){toggleTheme();return}
    closeSheet();
    if(v==='pr'){const d=document.querySelector('details.notes');if(d)d.open=true;setTimeout(()=>print(),100)}
    if(v==='bm')location.hash='#marcadores';if(v==='mt')location.hash='#materias';if(v==='sg')location.hash='#siglas';
  };
};
$('#gotoIn').addEventListener('keydown',e=>{if(e.key!=='Enter')return;let v=e.target.value.trim().toUpperCase().replace(/^N[º°O]?\.?\s*/,'');
  if(/^P\s*\d+$/.test(v))v='P'+v.replace(/\D/g,'');
  if(PAR[v]){location.hash='#n='+v;e.target.value='';e.target.blur()}else toast('Número no válido: usa 1–565 o P1–P24')});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='/'){e.preventDefault();location.hash='#buscar'}
  if(e.key==='Escape'){closeSheet();closeToc()}
  if(cur&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.altKey&&!e.metaKey&&!e.ctrlKey){const u=UM[cur];const t=U[u.ix+(e.key==='ArrowRight'?1:-1)];if(t)location.hash='#u='+t.id}
});
/* ---- progress & position ---- */
let sT;
function updProg(){const el=document.documentElement;const max=el.scrollHeight-innerHeight;$('#prog').style.width=(cur&&max>0?Math.min(100,scrollY/max*100):0)+'%'}
addEventListener('scroll',()=>{updProg();if(!cur)return;clearTimeout(sT);sT=setTimeout(()=>{
  const ps=document.querySelectorAll('#page section.par[id^="n"]');let n=null;for(const s of ps){if(s.getBoundingClientRect().top>90)break;n=s.id.slice(1)}
  LS.set('last',{u:cur,n})},400)},{passive:true});

buildToc();
const last=LS.get('last',null);
route();
})();
</script>
