<meta name="application-name" content="PGF 2020">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --garnet:#7a1f2b; --garnet-2:#9b2f3d; --gold:#b08a3e; --gold-soft:#e9dcc0;
  --bg:#fbf9f6; --panel:#ffffff; --ink:#2a2224; --ink-2:#6b5e60; --line:#e6ddd3;
  --mark:#f3e2a6; --chip:#f4ede4; --shadow:0 6px 24px rgba(60,20,25,.12);
  --fs:18px; --lh:1.68;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --display:'Cormorant Garamond','Cormorant',Garamond,Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --garnet:#e08a95; --garnet-2:#c96b77; --gold:#d6b46a; --gold-soft:#4a3d26;
    --bg:#1b1517; --panel:#241c1f; --ink:#ece4dc; --ink-2:#ab9d9a; --line:#3a2f32;
    --mark:#6b5520; --chip:#2e2427; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --garnet:#e08a95; --garnet-2:#c96b77; --gold:#d6b46a; --gold-soft:#4a3d26;
  --bg:#1b1517; --panel:#241c1f; --ink:#ece4dc; --ink-2:#ab9d9a; --line:#3a2f32;
  --mark:#6b5520; --chip:#2e2427; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}body{min-height:100vh}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:var(--lh);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--garnet)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- top bar ---------- */
header.top{position:sticky;top:0;z-index:30;background:var(--garnet);color:#fff;
  padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="dark"] header.top{background:#3b1a20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#3b1a20}}
.bar{display:flex;align-items:center;gap:.25rem;padding:.35rem .5rem;max-width:1400px;margin:0 auto;font-family:var(--sans);font-size:15px}
.ib{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:rgba(255,255,255,.12)}
.ib svg{width:22px;height:22px}
.brand{font-family:var(--display);font-size:1.35rem;font-weight:600;letter-spacing:.01em;cursor:pointer;white-space:nowrap;margin:0 .35rem;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:.62rem;opacity:.8;letter-spacing:.04em;margin-top:2px}
.spacer{flex:1}
.goto{display:flex;align-items:center;background:rgba(255,255,255,.14);border-radius:10px;padding:0 .25rem 0 .6rem;height:36px}
.goto span{font-family:var(--display);font-size:1.15rem;opacity:.9}
.goto input{width:3.6rem;background:none;border:0;color:#fff;padding:.2rem .3rem;outline:none}
.goto input::placeholder{color:rgba(255,255,255,.65)}
.progress{height:3px;background:var(--gold);width:0;transition:width .15s}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}.brand small{display:none}.brand{font-size:1.2rem}}

/* ---------- layout ---------- */
.wrap{display:flex;max-width:1400px;margin:0 auto}
nav.toc{position:sticky;top:57px;height:calc(100vh - 57px);width:330px;flex:none;overflow:auto;border-right:1px solid var(--line);
  padding:1rem .5rem 3rem 1rem;font-family:var(--sans);font-size:14.5px;line-height:1.35;background:var(--bg)}
main{flex:1;min-width:0;padding:1.5rem 1.25rem 6rem}
.page{max-width:44rem;margin:0 auto}
@media (max-width:980px){
  nav.toc{position:fixed;left:0;top:0;height:100%;z-index:50;transform:translateX(-102%);transition:transform .22s;box-shadow:var(--shadow);
    width:min(340px,88vw);padding-top:calc(1rem + env(safe-area-inset-top,0px))}
  body.toc-open nav.toc{transform:none}
  body.toc-open .scrim{display:block}
}
@media (min-width:981px){ body.toc-closed nav.toc{display:none} }
.scrim{display:none;position:fixed;inset:0;background:rgba(20,10,12,.4);z-index:45}

/* ---------- TOC ---------- */
.toc h3{font-family:var(--display);font-size:1.05rem;color:var(--gold);margin:1.1rem 0 .35rem .25rem;font-weight:600}
.toc .u{display:flex;align-items:baseline;gap:.4rem;padding:.4rem .5rem;border-radius:8px;cursor:pointer;color:var(--ink);text-decoration:none}
.toc .u:hover{background:var(--chip)}
.toc .u.on{background:var(--chip);color:var(--garnet);font-weight:600}
.toc .u .t{flex:1}
.toc .u .r{font-size:12px;color:var(--ink-2);white-space:nowrap}
.toc .tw{background:none;border:0;width:22px;height:22px;flex:none;cursor:pointer;color:var(--ink-2);padding:0;transform:rotate(0);transition:transform .15s}
.toc .tw.open{transform:rotate(90deg)}
.toc .sub{margin:0 0 .4rem 1.6rem;border-left:1px solid var(--line);display:none}
.toc .sub.open{display:block}
.toc .sub a{display:block;padding:.22rem .5rem;color:var(--ink-2);text-decoration:none;border-radius:6px;font-size:13.5px}
.toc .sub a:hover{background:var(--chip);color:var(--ink)}
.toc .sub a.l3{padding-left:1.1rem;font-size:13px}
.toc .sub a.l4{padding-left:1.8rem;font-size:12.5px}
.toc .tools{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin:.25rem .25rem 1rem}
.toc .tools button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:.55rem .5rem;cursor:pointer;font-size:13.5px;text-align:left}
.toc .tools button:hover{border-color:var(--gold)}

/* ---------- reading ---------- */
.uhead{text-align:center;margin:1rem 0 2.2rem}
.uhead .k{font-family:var(--sans);font-size:.78rem;color:var(--gold);letter-spacing:.08em}
.uhead h1{font-family:var(--display);font-weight:600;color:var(--garnet);font-size:clamp(1.75rem,6.5vw,2.2em);line-height:1.1;margin:.3rem 0 .4rem}
.uhead .meta{font-family:var(--sans);font-size:.78rem;color:var(--ink-2)}
.orn{display:block;margin:1rem auto 0;width:120px;height:12px;color:var(--gold)}
.txt h2,.txt h3,.txt h4,.txt h5{font-family:var(--display);color:var(--garnet);line-height:1.2;scroll-margin-top:80px}
.txt h2{font-size:1.45em;font-weight:700;margin:2.2em 0 .7em;letter-spacing:.01em}
.txt h3{font-size:1.28em;font-weight:600;margin:1.8em 0 .6em}
.txt h4{font-size:1.16em;font-weight:600;font-style:italic;margin:1.6em 0 .5em}
.txt h5{font-size:1.08em;font-weight:600;font-style:italic;margin:1.3em 0 .4em;color:var(--ink)}
.txt p{margin:0 0 .75em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.txt p.li{padding-left:1.6em;text-indent:-1.1em}
.par{position:relative;padding-left:3rem;margin-left:-3rem;scroll-margin-top:80px;border-radius:6px}
.pn{position:absolute;left:0;top:.05em;width:2.6rem;text-align:right;font-family:var(--display);font-weight:700;font-size:1.05em;color:var(--gold);
  background:none;border:0;cursor:pointer;padding:0 .4rem 0 0;line-height:inherit}
.pn:hover{color:var(--garnet)}
.par.bm .pn::after{content:"";position:absolute;right:-.15rem;top:.35em;width:4px;height:1.1em;background:var(--garnet);border-radius:2px}
.par.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%{background:var(--gold-soft)}100%{background:transparent}}
@media (prefers-reduced-motion: reduce){.par.flash{animation:none;background:var(--gold-soft)}}
.anno{font-family:var(--sans);font-size:.8em;background:var(--chip);border-left:3px solid var(--gold);padding:.45rem .7rem;margin:-.2rem 0 1rem;border-radius:0 8px 8px 0;white-space:pre-wrap;cursor:pointer}
@media (max-width:640px){.par{padding-left:2.2rem;margin-left:-.4rem}.pn{width:2rem;font-size:.95em;padding-right:.3rem}main{padding-left:.9rem;padding-right:.9rem}.txt p{text-align:left}}
sup{line-height:0;font-size:.65em}
sup.fn{color:var(--garnet);cursor:pointer;font-family:var(--sans);font-weight:600;padding:0 .1em}
sup.fn:hover{text-decoration:underline}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.notes{margin-top:3rem;border-top:1px solid var(--line);padding-top:1rem;font-size:.82em;line-height:1.5}
.notes summary{font-family:var(--display);font-size:1.25em;color:var(--garnet);cursor:pointer;font-weight:600}
.notes ol{padding-left:2.4em}
.notes li{margin:.25em 0}
.notes li::marker{color:var(--gold);font-family:var(--sans);font-size:.85em}
abbr{text-decoration:underline dotted var(--gold);cursor:help}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;font-family:var(--sans);font-size:.9rem}
.pager button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:.7rem 1rem;cursor:pointer;text-align:left;color:var(--ink)}
.pager button.nx{text-align:right}
.pager button small{display:block;color:var(--ink-2);font-size:.75rem}
.pager button:hover{border-color:var(--gold)}

/* ---------- home ---------- */
.hero{text-align:center;padding:2.5rem 0 1.5rem}
.hero .ord{font-family:var(--sans);font-size:.8rem;color:var(--ink-2);letter-spacing:.05em}
.hero h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;color:var(--garnet);margin:.6rem 0 .5rem;font-weight:600}
.hero .sub{font-family:var(--display);font-style:italic;font-size:1.35rem;color:var(--ink-2)}
.quote{margin:2rem auto;max-width:34rem;text-align:center;font-family:var(--display);font-size:1.35rem;font-style:italic;line-height:1.4;color:var(--ink)}
.quote cite{display:block;font-style:normal;font-family:var(--sans);font-size:.78rem;color:var(--gold);margin-top:.5rem;letter-spacing:.04em}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin:2rem 0;font-family:var(--sans);font-size:.92rem}
.qa button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:.9rem .9rem;text-align:left;cursor:pointer;color:var(--ink);line-height:1.3}
.qa button b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--garnet);margin-bottom:.15rem}
.qa button:hover{border-color:var(--gold)}
.qa button.cont{grid-column:1/-1;background:var(--garnet);color:#fff;border-color:var(--garnet)}
.qa button.cont b{color:#fff}
.struct h2{font-family:var(--display);color:var(--gold);font-weight:600;font-size:1.2rem;margin:1.6rem 0 .4rem;border-bottom:1px solid var(--line);padding-bottom:.25rem}
.struct a{display:flex;gap:.75rem;padding:.45rem .25rem;text-decoration:none;color:var(--ink);border-radius:8px;align-items:baseline}
.struct a:hover{background:var(--chip)}
.struct a .s{font-family:var(--sans);font-size:.75rem;color:var(--ink-2);width:6.5rem;flex:none}
.struct a .r{margin-left:auto;font-family:var(--sans);font-size:.75rem;color:var(--ink-2);white-space:nowrap}
details.def{margin:1rem auto;max-width:34rem;font-family:var(--sans);font-size:.85rem;color:var(--ink-2);text-align:center}
details.def summary{cursor:pointer}
details.def div{font-family:var(--display);font-style:italic;font-size:1.2rem;line-height:1.45;color:var(--ink);margin-top:.8rem;white-space:pre-line}

/* ---------- tools views ---------- */
.vh{font-family:var(--display);color:var(--garnet);font-size:2rem;font-weight:600;margin:.5rem 0 1rem}
.field{display:flex;gap:.5rem;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:.2rem .3rem .2rem .8rem}
.field input{flex:1;border:0;background:none;padding:.55rem 0;outline:none;font-family:var(--sans);font-size:1rem;min-width:0}
.field button{border:0;background:var(--garnet);color:#fff;border-radius:9px;padding:.5rem .9rem;cursor:pointer;font-family:var(--sans);font-size:.9rem}
:root[data-theme="dark"] .field button{color:#1b1517}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .field button{color:#1b1517}}
.opts{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin:.7rem 0 1rem;font-family:var(--sans);font-size:.85rem;color:var(--ink-2)}
.opts label{display:flex;align-items:center;gap:.35rem;cursor:pointer}
.opts select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.2rem .4rem}
.rcount{font-family:var(--sans);font-size:.85rem;color:var(--ink-2);margin:.5rem 0}
.rgroup h3{font-family:var(--display);color:var(--gold);font-size:1.15rem;margin:1.4rem 0 .3rem;font-weight:600}
.res{display:block;padding:.6rem .7rem;border-radius:10px;cursor:pointer;color:var(--ink);text-decoration:none;font-size:.9em;line-height:1.5;border:1px solid transparent}
.res:hover{background:var(--chip);border-color:var(--line)}
.res .w{font-family:var(--sans);font-size:.75rem;color:var(--garnet);font-weight:600;margin-right:.4rem}
.empty{font-family:var(--sans);color:var(--ink-2);font-size:.95rem;padding:1rem 0}
.letters{display:flex;flex-wrap:wrap;gap:.25rem;margin:0 0 1rem;font-family:var(--sans)}
.letters button{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:2rem;height:2rem;cursor:pointer;font-size:.85rem}
.letters button:hover{border-color:var(--gold);color:var(--garnet)}
.ent{padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.92em;line-height:1.55;scroll-margin-top:80px}
.ent b{font-family:var(--display);font-size:1.12em;color:var(--garnet);letter-spacing:.02em}
.ent .ref{font-family:var(--sans);font-size:.8em;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 .35em;margin:0 .08em;cursor:pointer;color:var(--garnet);white-space:nowrap}
.ent .ref:hover{border-color:var(--gold)}
.lh{font-family:var(--display);font-size:1.6rem;color:var(--gold);margin:1.2rem 0 .2rem;font-weight:600}
.sg h3{font-family:var(--display);color:var(--gold);font-size:1.2rem;margin:1.4rem 0 .3rem;font-weight:600}
.sg h4{font-family:var(--sans);font-size:.85rem;color:var(--ink-2);margin:.8rem 0 .2rem}
.sg .row{display:flex;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.92em;line-height:1.45}
.sg .row b{font-family:var(--sans);font-size:.85em;color:var(--garnet);width:5.2rem;flex:none;padding-top:.15em}
.bmk{border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:.6rem 0;background:var(--panel);cursor:pointer}
.bmk .w{font-family:var(--sans);font-size:.78rem;color:var(--garnet);font-weight:600}
.bmk .s{font-size:.88em;line-height:1.5;margin-top:.2rem}
.bmk .a{font-family:var(--sans);font-size:.82rem;margin-top:.4rem;padding:.4rem .6rem;background:var(--chip);border-radius:8px;white-space:pre-wrap}
.row-btns{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0 1rem;font-family:var(--sans);font-size:.85rem}
.row-btns button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:.4rem .7rem;cursor:pointer}

/* ---------- sheet & toast ---------- */
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(40rem,100%);background:var(--panel);z-index:60;
  border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:1rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom,0px));transition:transform .2s;max-height:70vh;overflow:auto;border:1px solid var(--line)}
.sheet.open{transform:translate(-50%,0)}
.sheet .sh{display:flex;align-items:center;gap:.5rem;font-family:var(--sans);font-size:.8rem;color:var(--gold);margin-bottom:.4rem}
.sheet .sh .x{margin-left:auto;background:none;border:0;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--ink-2);width:34px;height:34px}
.sheet .sb{font-size:.95em;line-height:1.55}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-family:var(--sans);font-size:.92rem;margin-top:.5rem}
.sheet .acts button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:.75rem;cursor:pointer;text-align:left}
.sheet .acts button:hover{border-color:var(--gold)}
.sheet textarea{width:100%;min-height:7rem;border:1px solid var(--line);border-radius:10px;padding:.6rem;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:.95rem;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:.9rem;
  padding:.55rem 1rem;border-radius:10px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.back{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;display:none;background:var(--garnet);color:#fff;border:0;border-radius:999px;
  padding:.6rem 1rem;font-family:var(--sans);font-size:.88rem;box-shadow:var(--shadow);cursor:pointer}
:root[data-theme="dark"] .back{color:#1b1517}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .back{color:#1b1517}}
.back.on{display:block}
.fsz{font-family:var(--sans);font-weight:600;font-size:15px}
@media print{
  header.top,nav.toc,.pager,.back,.sheet,.toast,.scrim{display:none!important}
  body{background:#fff;color:#000;font-size:11.5pt}
  main{padding:0}
  .notes[open] , .notes{display:block}
}

<script id="pgfdata" type="application/json">{"units":[{"id":"pres","title":"Presentación del PGF 2020","short":"Presentación","kind":"front","pages":[7,20],"blocks":[{"t":"p","h":"Jesús formó a sus discípulos llamándolos <i>para estar con Él y para ser enviados a predicar el Evangelio con la autoridad de expulsar demonios<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"1\">1<\/sup>. Jesús compartió su vida y misión con ellos viviendo juntos como un grupo itinerante <i>y envió a sus discípulos en parejas a predicar la Buena Noticia en los lugares a los que Él mismo iba a ir<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"2\">2<\/sup>. Los discípulos descubrieron el amor de Dios por ellos y por toda la humanidad al estar con Jesús en su vida pública, siendo testigos de su pasión y muerte en la cruz y, a partir de entonces, sintiendo su presencia invisible como el Señor Resucitado mientras eran enviados en misión por todo el mundo<sup class=\"fn\" data-u=\"pres\" data-n=\"3\">3<\/sup>. La Iglesia primitiva superó los tiempos difíciles de las persecuciones caminando en el Espíritu que el Señor le había enviado como protagonista de cada carisma y creatividad de la Iglesia.","n":"P1","s":1},{"t":"h","l":2,"h":"EL ITINERARIO FORMATIVO DE CLARET"},{"t":"p","h":"Estar con Jesús y ser enviado en misión son los dos puntas del compás de la vida misionera claretiana. El Espíritu de Cristo que habita en nosotros y en medio de nosotros obra la maravilla de transformar a un aspirante claretiano en <i>un hombre que arde con el amor de Dios, que propaga ese fuego por dondequiera que vaya<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"4\">4<\/sup>. Para nuestro Fundador este proceso tiene lugar en la fragua del Corazón de María donde el misionero se forma en el fuego del amor de Dios para conformarse a Cristo. Como una flecha en las manos de María, está listo para ser liberado para combatir los males del mundo<sup class=\"fn\" data-u=\"pres\" data-n=\"5\">5<\/sup>.","n":"P2","s":1},{"t":"p","h":"Claret tuvo la perspicacia espiritual de mirar a Cristo en la oración y de aprender de aquellos que el Señor le dio como sus mentores. Aprendió el arte de cuidar su vocación misionera estando atento a su salud espiritual, intelectual y apostólica. Como joven sacerdote, Claret se esforzó por alimentar su vida y su misión con medios adecuados como podemos observar en sus resoluciones de retiro anual<sup class=\"fn\" data-u=\"pres\" data-n=\"6\">6<\/sup>. Claret nunca abandonó su camino formativo.","n":"P3","s":1},{"t":"h","l":2,"h":"LA FORMACIÓN DE LOS MISIONEROS CLARETIANOS"},{"t":"p","h":"Desde el principio de nuestra Congregación, los tres pilares de la vida misionera - oración, estudio y trabajo apostólico - fueron cuidadosamente cultivados en nuestros procesos de formación como fuentes mutuamente enriquecedoras de nuestra vitalidad misionera. Fuimos bendecidos con planes y directrices bien definidos para la formación de nuestros misioneros. También tenemos ejemplos brillantes de la cultura de formación de la Congregación en nuestros mártires que eligieron morir por Cristo y la Iglesia proclamando su amor por Cristo Rey, el Corazón de María, la Santa Madre Iglesia y su amada Congregación<sup class=\"fn\" data-u=\"pres\" data-n=\"7\">7<\/sup>. Auténticos procesos de formación preparan a los misioneros para ser fieles a su vocación hasta el final.","n":"P4","s":1},{"t":"p","h":"El impulso renovador del Concilio Vaticano II inspiró la preparación de un amplio Plan General de Formación que el Rev. P. Aquilino Bocos, Superior General, promulgó en 1994. Lo llamaremos “PGF 94”. El mismo ha mejorado mucho la formación de nuestros misioneros durante más de dos décadas. El nuevo PGF (PGF 2020) ha conservado la riqueza del PGF 94 y ha incorporado nuevas ideas de acuerdo a los signos de nuestros tiempos. Me gustaría compartir algunas reflexiones para establecer el contexto del PGF 2020 y señalar algunas ideas clave que guiaron su preparación.","n":"P5","s":1},{"t":"h","l":2,"h":"HACIA UNA FORMACIÓN INTEGRAL Y TRANSFORMADORA PARA NUESTROS TIEMPOS"},{"t":"p","h":"El actual escenario social y eclesial es bastante diferente al de los años 90. El PGF 94 nació en una época en la que los teléfonos móviles, el correo electrónico y la web todavía no eran realidades. Nuestra Congregación tiene más miembros ahora que hace dos décadas<sup class=\"fn\" data-u=\"pres\" data-n=\"8\">8<\/sup>. También encontramos un cambio significativo en los orígenes geográficos de nuestros misioneros y su distribución a través de los continentes<sup class=\"fn\" data-u=\"pres\" data-n=\"9\">9<\/sup>. La interculturalidad se ha convertido en parte de nuestra vida cotidiana. Vivimos en una era de cambios rápidos y revolucionarios en casi todos los aspectos de la vida humana, que son posibles gracias al auge de las tecnologías de la comunicación y la información. Los males que persiguen a la persona humana también han repercutido igualmente en los asuntos humanos y en nuestro hogar común, el planeta Tierra. Como una madre que lleva la peor parte de la crisis de transición de sus hijos, la Iglesia ha sido herida y humillada por las desventuras de sus hijos; sin embargo, al mismo tiempo, el Espíritu le da poder para ser la voz de los que no tienen voz.","n":"P6","s":1},{"t":"p","h":"En esta época de cambios, nos preguntamos: ¿Cuál es el perfil del misionero que el mundo necesita hoy en día? Cómo deberíamos formar a nuestros misioneros para hablar al corazón de la gente sobre la palabra viva que sana, el amor incondicional que llena los corazones humanos, el agua que regenera en una nueva vida, el pan del cielo que acaba con el hambre humana de Dios, el tesoro escondido en el campo que transitamos cada día, la alegría permanente que el mundo no puede dar.","n":"P7","s":1},{"t":"p","h":"Los meros conceptos no comunican mucho a la gente de hoy en día. Las tácticas mundanas no pueden capturar el rastro del Espíritu en el corazón humano. Sin embargo, las convicciones de las verdades del Evangelio respaldadas por vidas creíbles siempre han disparado el deseo latente del corazón humano por Dios que es Amor. La formación misionera no es una cuestión de técnicas, herramientas y métodos. Es más bien una cuestión de aprendizaje bajo el Espíritu Santo y de aprender el arte del discipulado que nuestro Fundador dominó bien en su día.","n":"P8","s":1},{"t":"p","h":"En nuestro cambiante contexto, la formación debe formar a los misioneros para que cuiden el don de su propia vocación, se apoyen mutuamente para perseverar en la fidelidad y sean audaces para proclamar la alegría del Evangelio a nuestros semejantes de manera creíble. Por nuestra parte, la apertura del corazón, de la cabeza y de las manos para la obra del Espíritu, es la clave para desbloquear los tesoros que hay dentro de cada uno de nosotros y compartirlos con los demás en la comunidad y en el ministerio. En la formación claretiana, cada aspecto de la persona cuenta porque <i>lo que no se lleva a Dios no se cura<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"10\">10<\/sup> y lo que no se cura sigue hiriendo a la misma persona y a los demás.","n":"P9","s":1},{"t":"h","l":2,"h":"LA FORMACIÓN CLARETIANA, UN PROCESO ÚNICO HASTA EL FINAL"},{"t":"p","h":"Concebimos la formación claretiana como un proceso indivisible de progresiva configuración con Cristo y de alegre participación en su misión, un itinerario de vida que dura hasta el último aliento de un claretiano. Para mayor claridad, podemos dividir todo el período de formación en dos partes principales y cada parte se divide a su vez en etapas progresivas. Así, la primera parte - formación inicial - consiste en las etapas de prenoviciado, noviciado y postnoviciado; mientras que la segunda parte - formación permanente - incluye el quinquenio, la edad media, la tercera edad e incluso una cuarta edad para aquellos de entre nosotros con el don de la longevidad. De hecho, la formación inicial tiene por objeto sentar unas bases sólidas para el continuo camino hacia una mayor integridad de la vida misionera caracterizada por la responsabilidad, la rendición de cuentas y la transparencia. Mientras que un buen proceso de formación inicial prepara a los jóvenes claretianos para comprometerse en diferentes vías pastorales y posiciones de servicio en el futuro, una cultura de integridad y excelencia en la fase de formación permanente, a su vez, actúa como catalizador del dinamismo transformador de la formación inicial.","n":"P10","s":1},{"t":"h","l":2,"h":"LA FORMACIÓN CLARETIANA, UN ITINERARIO TRANSFORMADOR"},{"t":"p","h":"Se espera que un auténtico proceso de formación sea transformador. La cantidad de conocimientos adquiridos y las muchas habilidades incorporadas en la vida de un misionero no sirven para nada si su vida no es un testimonio creíble de la alegría del Evangelio. La formación transformadora se centra en lo que está ocurriendo en la vida de un claretiano a través de los programas ofrecidos en cada fase y cómo el misionero los integra en su proyecto de vida. La formación claretiana debe tener en cuenta tanto el contenido (lo que se aprende) como el proceso (cómo se integra el aprendizaje en la vida), así como la acción de la gracia en la persona. A la larga, lo que importa es la santidad de la persona porque <i>Dios llama a cada uno a la santidad<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"11\">11<\/sup>. La santidad de la vida no es nada más que la caridad vivida en plenitud<sup class=\"fn\" data-u=\"pres\" data-n=\"12\">12<\/sup>. El factor transformador de la vida cristiana no son las elecciones éticas o las ideas elevadas, sino <i>el encuentro con un acontecimiento, con una persona, que da a la vida un nuevo horizonte y una dirección decisiva<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"13\">13<\/sup>. El Papa Francisco afirma con razón que <i>es imposible perseverar en una ferviente evangelización si no estamos convencidos, por experiencia personal, de que no es lo mismo haber conocido a Jesús que no haberlo conocido<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"14\">14<\/sup>, y que <i>no bastan las palabras de aliento si no arde en nuestros corazones el fuego del Espíritu Santo<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"15\">15<\/sup>. No puede haber formación claretiana si Cristo no está en el centro de todos los programas de formación y si no sentimos el dolor de Cristo en la difícil situación de los pobres y de la humanidad que sufre. La transformación ocurre cuando un misionero pasa progresivamente de la conciencia centrada en el ego a la conciencia centrada en Cristo por un proceso de inclusión y trascendencia<sup class=\"fn\" data-u=\"pres\" data-n=\"16\">16<\/sup>, y se hace más completo y santo. Esto tiene lugar a través de la acción del Espíritu en una persona que colabora.","n":"P11","s":1},{"t":"h","l":2,"h":"UNA FORMACIÓN DE LA PERSONA POR COMPLETO (FORMACIÓN INTEGRAL)"},{"t":"p","h":"La formación claretiana debe involucrar a toda la persona del formando y comprometerse con todas las dimensiones de su vida. Cualquier enfoque reductivo en la formación centrado principalmente en la liturgia, la psicología, la tecnología de la información, los estudios o los apostolados, tiende a dejar al misionero discapacitado tanto en la vida como en la misión. La integridad de la vida misionera exige una integración y un crecimiento armoniosos de los diversos componentes de la vida de una persona, como sus aspectos intelectuales, emocionales, somáticos, sexuales, morales, espirituales, sociales/pastorales y carismáticos/claretianos. También debemos prestar una atención adecuada al desarrollo de talentos y habilidades como la música, los medios de comunicación, la elocución, los deportes, los idiomas, la pintura, la danza, etc., que son canales eficaces para llegar a los demás. Aunque nadie tiene todos los dones y talentos, deberíamos comprometernos a desarrollar y hacer el mejor uso de los dones y talentos dados por Dios para su gloria y el bien de los demás. Sin embargo, en la formación claretiana, las capacidades propias (de madurez espiritual, moral, emocional y sexual) y las capacidades cognitivas (que tienen perspectivas más amplias de la realidad) deben tener prioridad sobre los dones y talentos naturales (como las habilidades en música, arte, deportes, etc.). La integridad de nuestra vida es lo que hace que la palabra proclamada sea más creíble y que nuestra vida prometida sea más alegre. El PGF 2020 ha mantenido la misma triple dimensión formativa del PGF 94, es decir, humana, cristiana y claretiana, integrando los diversos aspectos mencionados anteriormente.","n":"P12","s":1},{"t":"h","l":2,"h":"DOS MOVIMIENTOS EN EL ITINERARIO FORMATIVO: CRECER Y DESPERTAR"},{"t":"p","h":"El enfoque formativo clásico atiende al crecimiento de una persona y a su mejora en la adquisición de más conocimientos y capacidades. El despertar es un proceso de evolución espiritual. El crecimiento espiritual tiene lugar a través del descubrimiento de nuestro “yo más profundo” o el reconocimiento de nuestra “gran identidad”<sup class=\"fn\" data-u=\"pres\" data-n=\"17\">17<\/sup>. El término bíblico para ello es la conversión a Dios, el cual lleva a uno a través de varias capas de desarrollo espiritual. Como es un don de Dios, y no un fruto de los esfuerzos humanos, la formación en este ámbito consiste en preparar los corazones para <i>ofrecer a Dios la libre capacidad de organizar el curso de nuestras vidas<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"18\">18<\/sup>. Las prácticas espirituales y las virtudes claretianas que nuestro Fundador narra en su Autobiografía<sup class=\"fn\" data-u=\"pres\" data-n=\"19\">19<\/sup> son medios necesarios para entregarse libremente a la acción de Dios. Santa Teresa de Ávila presenta este itinerario espiritual como un viaje a través del castillo interior para llegar a la séptima morada donde tiene lugar el matrimonio místico del alma. San Juan de la Cruz habla de las noches de los sentidos y del alma que encontramos en el camino hacia la unión mística con Cristo. La formación claretiana no debe ignorar el elemento de la conversión continua, el descubrimiento de la identidad más profunda de uno mismo y la llamada a la unión con Dios y los seres humanos.","n":"P13","s":1},{"t":"h","l":2,"h":"ACOMPAÑAMIENTO Y DISCERNIMIENTO EN LA FORMACIÓN CLARETIANA"},{"t":"p","h":"La antigua tradición espiritual de la Iglesia, practicada por sus santos y místicos, subraya la importancia del acompañamiento espiritual y del discernimiento en el ministerio de la formación. El Papa Francisco afirma repetidamente estas dos prácticas como medios necesarios para navegar el curso de la Iglesia hoy en día<sup class=\"fn\" data-u=\"pres\" data-n=\"20\">20<\/sup>. La Congregación debe ofrecer acompañamiento a los misioneros a través de diversos mediadores (formadores, superiores, cohermanos, etc.) para ayudarles a mantener la mirada fija en el objetivo de su vida y misión y apoyar su desarrollo vocacional. En nuestra formación, debemos buscar el acompañamiento del Corazón de María y la intercesión de los santos, especialmente de nuestro Fundador y de los mártires claretianos, para progresar en nuestra vida y misión.","n":"P14","s":1},{"t":"p","h":"En un contexto formativo, el discernimiento es una gracia que <i>busca un vislumbre de ese plan único y misterioso que Dios tiene para cada uno de nosotros... Tiene que ver con el sentido de mi vida ante el Padre que me conoce y me ama, y con el verdadero propósito de mi vida, que nadie conoce mejor que Él<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"21\">21<\/sup>. El discernimiento es la manera a través de la cual <i>saber si algo viene del Espíritu Santo o si proviene del espíritu del mundo o del espíritu del diablo<\/i><sup class=\"fn\" data-u=\"pres\" data-n=\"22\">22<\/sup>.","n":"P15","s":1},{"t":"p","h":"Un aspecto importante de la madurez cristiana está relacionado con la forma en que un misionero vive la dialéctica básica de la existencia humana que se desarrolla en el teatro de la vida. Las tres polaridades presentes en la lucha por la vida, y que constituyen la dialéctica básica, crean el terreno de discernimiento en la vida de todos. En primer lugar, la polaridad de la vida pecaminosa o virtuosa es superada por el ejercicio de la verdadera libertad descubierta en Cristo para elegir a Dios por encima de todo. También incluye la aceptación del propio pecado y su perdón como el don de Dios. En segundo lugar, la realidad de las inclinaciones inconscientes que influyen en las elecciones de la vida crea la polaridad entre lo que es realmente bueno y lo que es sólo aparentemente bueno. El discernimiento es el proceso para descubrir las falsas motivaciones y los espíritus mundanos detrás del impulso de buscar ganancias transitorias, y escuchar la voz de Dios en cada situación. Tanto el acompañamiento como el discernimiento son prácticas clave en nuestro proceso de formación. En tercer lugar, la polaridad de la normalidad y la patología presente en diferentes grados en cada persona requieren una atención refinada para distinguir un comportamiento astuto de un trastorno mental, o una mentira de la demencia. Necesitamos la ayuda de varias ciencias para comprender y tratar la fascinante pero compleja naturaleza humana que atesora el don de cada persona llamada y consagrada a ser misionera.","n":"P16","s":1},{"t":"h","l":2,"h":"APLICACIÓN PRUDENTE DE LOS RECURSOS CIENTÍFICOS EN LA FORMACIÓN"},{"t":"p","h":"Somos bendecidos con abundantes recursos para la educación y la formación de las generaciones futuras, puestos a disposición por las diversas disciplinas científicas y tradiciones culturales. Son muy valiosos para la formación integral de nuestros miembros. Los escándalos y abusos de sacerdotes y religiosos, que desacreditaron a la Iglesia en el pasado reciente, nos recuerdan la necesidad de disponer de herramientas científicas adecuadas en la formación, y de buscar la ayuda de expertos como colaboradores en el ministerio de la formación.","n":"P17","s":1},{"t":"p","h":"Es posible que algunos formadores y formandos se pierdan en el vasto laberinto de métodos y enfoques que tienen a su disposición, mientras que otros se fascinan con algunos métodos y pierden de vista el panorama general de la persona humana en un itinerario vocacional. Necesitamos saber cómo tamizar el grano de la paja cuando usamos métodos que evolucionaron de sistemas de creencias particulares o se desarrollaron para un propósito particular. Por ejemplo, la práctica de la atención y las meditaciones orientales son útiles si están bien integradas en una visión cristiana de la persona humana. Una herramienta psicológica diseñada para probar un rasgo de la personalidad no puede ser utilizada como una herramienta exclusiva para el discernimiento vocacional. Por lo tanto, el conocimiento adecuado de la antropología cristiana, la teología católica, la vida consagrada y el amor a la Iglesia y al carisma claretiano son requisitos previos necesarios para seleccionar entre los abundantes enfoques, técnicas, herramientas y métodos que las diversas disciplinas presentan ante nosotros.","n":"P18","s":1},{"t":"h","l":2,"h":"PGF 2020: UNA HOJA DE RUTA PARA ORIENTAR NUESTRO ITINERARIO FORMATIVO"},{"t":"p","h":"En 2017, la comisión constituida para revisar el PGF 94 estudió los resultados de la encuesta realizada en todos nuestros centros de formación para evaluar su impacto en la formación y encontraron un consenso en dos puntos importantes:","n":"P19","s":1},{"t":"p","h":"a. La continua relevancia del contenido del PGF para nosotros hoy en día.","n":"P19"},{"t":"p","h":"b. La falta de instrumentos que ayuden a la interiorización de los fundamentos de la formación y de la identidad claretiana en la vida del misionero.","n":"P19"},{"t":"p","h":"La encuesta reveló que carecemos de mecanismos eficaces para facilitar una formación transformadora a pesar de contar con un excelente documento sobre la formación. La comisión aconsejó la revisión y actualización del PGF existente pero recomendó la preparación de un manual o una guía práctica que contenga procesos, estrategias y enfoques que ayuden a concretar las pautas formativas del PGF en nuestra vida cotidiana. Éste será el próximo esfuerzo de la Prefectura General de Formación. Sin embargo, tener el PGF o su manual en la mano no mejorará automáticamente nuestra formación.","n":"P20","s":1},{"t":"p","h":"Me gusta comparar el PGF 2020 con una hoja de ruta que puede orientar nuestro itinerario formativo. Un mapa es sólo un mapa, no es el territorio. Necesitamos caminar por el territorio disfrutando y soportando el trabajo, la agonía y el éxtasis de crecer en el discipulado del Señor al estilo de Claret. Cada uno de nosotros necesita hacerlo a su manera. Invito a todos los claretianos a asumir responsablemente su propio despliegue vocacional, y a apoyarse mutuamente para crecer juntos como comunidad misionera en la Iglesia para dar frutos apostólicos en la Iglesia y el mundo.","n":"P21","s":1},{"t":"p","h":"Es importante que todos los Organismos Mayores preparen su propio plan de formación para implementar las orientaciones del PGF 2020 en su respectiva región y se beneficien de la sabiduría consagrada en él. No debemos dejarlo como una pieza decorativa en los estantes de nuestras bibliotecas, sino más bien tomarlo como un rico recurso para estimular el camino vocacional de cada claretiano. Usemos efectivamente el PGF 2020 como nuestro mapa de ruta para hacer de itinerario viaje vocacional claretiano una experiencia apasionante de crecimiento en el Espíritu.","n":"P22","s":1},{"t":"p","h":"Mi gratitud se dirige a los dos Prefectos Generales de Formación, el P. Leo Dalmao y el P. Joseph Mbungu, a la comisión internacional y otros colaboradores por su generoso compromiso en la preparación del PGF 2020. La mejor manera de agradecerles a todos ellos es haciendo un uso efectivo de este documento y cumpliendo con el propósito para el que se ofrece.","n":"P23","s":1},{"t":"p","h":"Encomiendo el proceso de crecimiento vocacional de todos los misioneros claretianos al amor acompañante del Corazón de María y a la custodia de San José, cuya fiesta celebramos en este día.","n":"P24","s":1},{"t":"p","h":"<i>Dado en Roma el 19 de marzo de 2020<\/i>","n":"P24"},{"t":"p","h":"<b>P. Mathew Vattamattam, CMF <\/b><i>Superior General<\/i>","n":"P24"}],"notes":{"1":"Mc 3,14-15.","2":"Lc 10,1; Mc 6,7.","3":"Cf. Mc 16,20.","4":"CC 9.","5":"Cf. Aut 270.","6":"Propósitos de los Ejercicios Espirituales, 1843, 11: <i>Estoy efectivamente resuelto a no  perder ni un instante de tiempo, sino a usarlo en la oración, el estudio y las obras de  caridad para mis vecinos, tanto vivos como muertos<\/i>; cf. Aut, p. 757.","7":"La carta de despedida de Faustino Pérez es un testimonio de la mentalidad de los jóvenes mártires antes de la muerte. Cf. Ernesto Barea, <i>A Hero Among Heroes<\/i>, Claretian Publications, Philippines (1997), p. 174-175.","8":"En 1997 el total de claretianos era de 2844 y en 2020 somos 3040.","9":"Cambio estadístico de personal desde 1997 y 2020 en los cuatro continentes: África de 234 a 579; América de 868 a 763; Asia de 484 a 951; Europa desde 1255 a 747.","10":"Gregorio de Nacianzo, Carta 101.","11":"GE 10.","12":"Benedicto XVI, <i>Catequesis<\/i>, Audiencia General del 13 de abril de 2011; cf. GE 21.","13":"DCE 1.","14":"EG 266.","15":"EG 261.","16":"Una persona pasa a un nivel de madurez más alto al incluir y trascender las características y competencias propias de un nivel inferior, adquiriendo características y competencias más refinadas propias de la siguiente etapa. Por ejemplo, un adulto maduro ha trascendido la dependencia de un niño, pero es capaz de depender de otra persona cuando sea apropiado.","17":"Cf. GE 32.","18":"CC 28.","19":"Son la humildad, la pobreza, la mansedumbre, la mortificación, la obediencia y el amor a Dios y al prójimo; cf. Aut 340-453.","20":"El término \"discernir\" y sus derivados son abundantes en los documentos del Papa Francisco. Por ejemplo, 20 veces en <i>Evangelii Gaudium<\/i>; 45 veces en <i>Amoris Laetitia<\/i>; 35 veces en <i>Christus Vivit<\/i>. “Acompañar” es utilizado 25 veces en <i>Evangelii Gaudium<\/i>; 20 veces en <i>Amoris Laetitia<\/i>; 29 veces en <i>Christus Vivit<\/i>.","21":"GE 170; CV 280.","22":"GE 166."}},{"id":"prol","title":"Prólogo","short":"Prólogo","kind":"front","pages":[21,26],"blocks":[{"t":"p","h":"Nuestra Congregación tiene la fortuna de contar con formadores comprometidos y con directrices relevantes sobre la formación de los misioneros en el curso de nuestra historia, lo cual ha dejado un hermoso legado de formación para que lo sigamos. El PGF 2020 es un hito en este mismo camino."},{"t":"h","l":2,"h":"DESARROLLO DE LAS DIRECTRICES DE FORMACIÓN EN LA TRADICIÓN CLARETIANA"},{"t":"p","h":"La formación de los misioneros siempre ha sido una prioridad en el proyecto evangelizador de San Antonio María Claret y sus sucesores. El Padre Claret recuerda en su autobiografía un sermón de su obispo Pablo de Jesús Corcuera durante sus días de seminario que había dejado un profundo impacto en su actitud hacia la formación: <i>Si yo puedo conseguir que los estudiantes sean buenos, después serán buenos sacerdotes, buenos curas… Mucho conviene que los estudiantes se vayan nutriendo con la piedad mientras van estudiando; o, si no, se crían soberbios, que es lo peor en que pueden incurrir, porque la soberbia es el origen de todo pecado. Es de preferir que sepan un poco menos y que sean piadosos, que no el que sepan mucho, pero sin piedad o con poca, que entonces se hinchan del viento de la vanidad<\/i><sup class=\"fn\" data-u=\"prol\" data-n=\"1\">1<\/sup>."},{"t":"p","h":"Nuestro Fundador era profundamente consciente de las consecuencias negativas de la presencia de obreros apostólicos mal formados en la Iglesia. Desde su vasta experiencia pastoral de acompañamiento de laicos, religiosos y sacerdotes, el Padre Claret señala el peligro de que los sacerdotes no integrados alejen a los fieles por su comportamiento grosero y sus pasiones no mortificadas en lugar de atraerlos por sus buenos modales e irradiar el buen olor de Cristo en todas partes<sup class=\"fn\" data-u=\"prol\" data-n=\"2\">2<\/sup>. Él exclama: <i>se ve la obligación que tenemos de ser instruidos, bien educados y de santas costumbres<\/i><sup class=\"fn\" data-u=\"prol\" data-n=\"3\">3<\/sup> y <i>¡Oh cuánto conviene que los Misioneros sean mortificados, muy virtuosos y ejemplares<\/i><sup class=\"fn\" data-u=\"prol\" data-n=\"4\">4<\/sup><i>!<\/i>"},{"t":"p","h":"Convencido de la necesidad de contar con pastores bien formados en la Iglesia, el Padre Claret se dedicó a dar una formación de calidad a los seminaristas de varias diócesis de España en El Escorial y escribió los dos volúmenes de “El colegial o seminarista teórica y prácticamente instruido” para la formación inicial y permanente. Su libro “Llave de Oro” es un buen manual de consejos para los sacerdotes, especialmente para los confesores. El mejor regalo del Padre Claret para la formación de los misioneros es la Autobiografía escrita por mandato del Superior General, P. Josep Xifré, en la que presenta su propia experiencia transformadora de ser un misionero formado en la Fragua del Corazón de María y enviado en misión. En efecto, la Autobiografía es una propuesta del proyecto de vida claretiano en formato narrativo."},{"t":"p","h":"Cuando la Congregación comenzó a aceptar estudiantes en 1858<sup class=\"fn\" data-u=\"prol\" data-n=\"5\">5<\/sup>, nuestro Fundador mismo escribió la primera guía de formación para los estudios, <i>El Plan de Estudios de la Congregación de los Hijos del Inmaculado Corazón de María<\/i>, en 1859. Después del Capítulo de 1862, nuestro Fundador redactó el primer documento general sobre la formación, <i>El Reglamento Particular para los Estudiantes y el Reglamento Particular para el Pedagogo de los Estudiantes de la Congregación<\/i>."},{"t":"p","h":"Los Superiores Generales de la Congregación han mantenido viva esta visión holística del Fundador sobre la preparación de hombres idóneos para ser misioneros comprometidos, y han dado oportunas directrices sobre el particular<sup class=\"fn\" data-u=\"prol\" data-n=\"6\">6<\/sup>. Tras la decisión del VIII Capítulo General<sup class=\"fn\" data-u=\"prol\" data-n=\"7\">7<\/sup>, se preparó el primer plan sistemático de formación, después de una amplia consulta con los profesores claretianos, bajo el título, “<i>Statua pro Studiis Congregationis Filiorum Immaculati Cordis Beatae Mariae Virginis<\/i>” en 1900. Después de un período de tres años <i>ad experimentum<\/i>, fue revisado y publicado en 1903. Siguiendo la directiva del XII Capítulo General<sup class=\"fn\" data-u=\"prol\" data-n=\"8\">8<\/sup> de preparar un nuevo <i>Ordo Studiorum<\/i>, se creó una comisión para prepararlo y el <i>Ordo Studiorum Generalis pro Missionariis Congregationis Filiorum Immaculati Cordis Mariae Virginis<\/i> (OSG) fue promulgado en 1929. Este documento fue renovado en 1959 adaptándose a la Constitución Apostólica <i>Sedes Sapientiae<\/i> del Papa Pío XII (1956)."},{"t":"p","h":"Después del Concilio Vaticano II, la Congregación acogió la llamada del Concilio al <i>aggiornamento<\/i> (renovación) del carisma y la misión de la vida religiosa en la Iglesia, y emprendió esa tarea a través de sus Capítulos de renovación<sup class=\"fn\" data-u=\"prol\" data-n=\"9\">9<\/sup>. Uno de los últimos frutos del proceso de renovación fue el Plan General de Formación preparado por una comisión internacional dirigida por el Prefecto General de Formación, P. Jesús María Palacios en respuesta al mandato del Capítulo General de 1991<sup class=\"fn\" data-u=\"prol\" data-n=\"10\">10<\/sup>. El Plan General de Formación promulgado por el Superior General, P. Aquilino Bocos, el 16 de julio de 1994 ha mejorado mucho la formación de nuestros misioneros durante más de dos décadas."},{"t":"h","l":2,"h":"UN NUEVO PLAN GENERAL DE FORMACIÓN"},{"t":"p","h":"Veintiuno años después de la publicación y aplicación del mencionado Plan General de Formación, el XXV Capítulo General de 2015 resolvió al respecto: “<i>Revisaremos el Plan General de Formación según nuestros rasgos carismáticos y las interpelaciones de nuestro tiempo, y articularemos la formación (inicial y continua) como proceso realmente transformador<\/i>”<sup class=\"fn\" data-u=\"prol\" data-n=\"11\">11<\/sup>."},{"t":"p","h":"El Gobierno General confió esta tarea a los Consultores Generales que animan el tercer proceso de transformación (Prefecturas de Espiritualidad y Formación)<sup class=\"fn\" data-u=\"prol\" data-n=\"12\">12<\/sup> y se formó una comisión internacional de colaboración en la misma<sup class=\"fn\" data-u=\"prol\" data-n=\"13\">13<\/sup>. La comisión se reunió en septiembre de 2017 y estudió los resultados de una encuesta enviada a todas las casas de formación para evaluar el PGF y dar sugerencias para su revisión. Los resultados de la encuesta afirmaron que el PGF existente seguía siendo relevante y sólo se requería su actualización con los necesarios instrumentos para la implementación del mismo. La sugerencia de la comisión fue preparar dos volúmenes del PGF: una versión actualizada del PGF existente y un nuevo volumen como manual que contenga instrumentos para la aplicación del primer volumen. El Gobierno General, en su sesión del 14 de octubre de 2017, aceptó la propuesta. En consecuencia, la comisión comenzó a trabajar en dos grupos<sup class=\"fn\" data-u=\"prol\" data-n=\"14\">14<\/sup>. A medida que avanzaban los trabajos, se comprobó que el segundo volumen de aplicaciones prácticas requería que se completara el primero. Por lo tanto, se prestó atención a que se completara el PGF revisado antes de seguir adelante con el segundo volumen. La propuesta de tener un segundo volumen se modificó para prepararlo como un libro de trabajo de cara a la aplicación del PGF 2020 en lugar de como un segundo volumen del PGF. El nombramiento del P. Leo Dalmao, el entonces Prefecto General de Formación, como Prelado de la Prelatura Territorial de Isabela en Filipinas<sup class=\"fn\" data-u=\"prol\" data-n=\"15\">15<\/sup> retrasó el trabajo que se encontraba cerca de su finalización. Monseñor Leo Dalmao merece nuestro más sincero agradecimiento por su dedicado servicio en la realización del PGF 2020. El borrador preparado fue estudiado y mejorado por la Reunión de los Prefectos de Formación celebrada en Guatemala en mayo de 2019."},{"t":"p","h":"El P. Joseph Mbungu, el nuevo Prefecto General de Formación, se encargó de continuar el trabajo de finalización del PGF revisado (PGF 2020). Mientras tanto, el borrador se enriqueció aún más con las ideas de los diferentes encuentros organizados por la Santa Sede para abordar algunos temas concretos en la Iglesia. Cabe mencionar dos de ellos en los que participó el Superior General: el Encuentro convocado por el Santo Padre sobre “La protección de los menores en la Iglesia” (21-24 de febrero de 2019) y el primer “Congreso internacional para la pastoral de los ancianos” organizado por el Dicasterio para los Laicos, la Familia y la Vida (29-31 de enero de 2020). Ambos encuentros inspiraron la mejora de la parte de la formación permanente."},{"t":"p","h":"El Gobierno General aprobó el borrador final del PGF 2020 en su sesión del 19 de marzo de 2020. El PGF 2020 es fruto de la naturaleza sinodal de nuestra Congregación que asegura nuestra responsabilidad común para la vida y la misión de la Congregación."},{"t":"p","h":"Como vemos, este documento es un libro de referencia para que toda la Congregación forme a sus hijos en el espíritu misionero que impulsó la vida y la misión de nuestro Fundador. El PGF 2020 propone un proceso formativo que abarca toda la vida de un misionero claretiano. Por lo tanto, es responsabilidad de cada misionero claretiano aplicar creativamente las pautas de formación del PGF 2020 a su propia vida y formarse en la Fragua del Corazón de María como su hijo ungido y enviado a proclamar la alegría del Evangelio en el mundo al estilo de Claret."},{"t":"p","h":"<b>P. Joseph Mbungu, CMF<\/b>"},{"t":"p","h":"<i>Prefecto General de Formación<\/i>"}],"notes":{"1":"Aut 92.","2":"Cf. Aut 815.","3":"Aut 812.","4":"Aut 816.","5":"El primer estudiante que fue aceptado fue Hilario Brososa, como diácono recién ordenado el 1 de julio de 1858. Cf. Mariano Aguilar, <i>Historia de la Congregación de  Misioneros Hijos del Ido. Corazón de María<\/i>, tomo I, Barcelona 1901, p. 100.","6":"Para una información detallada sobre la historia de la formación claretiana, Cf. Jesús María Palacios, <i>Notas históricas sobre la formación en la Congregación<\/i>, Roma, Prefectura General de Formación, 1997.","7":"El VIII Capítulo General se celebró en Vic en diciembre de 1899.","8":"El XII Capítulo General del 1922, pidió la actualización de los documentos de la Congregación de acuerdo con el Código de Derecho Canónico promulgado en 1907.","9":"Los Capítulos Generales que emprendieron el proceso de renovación convocado por el Concilio Vaticano II son los Capítulos de 1967, 1973, 1979 y 1985.","10":"Cf. Actas, 14, 13 Septiembre 1991: <i>Annales<\/i> 60 (1991) 255.","11":"MS 75.1.","12":"El XXV Capítulo General invitó a toda la Congregación a emprender tres procesos de transformación (MS 62-75) y el Gobierno General se organizó en tres equipos para animar los tres procesos de transformación.","13":"La comisión estaba compuesta por los siguientes miembros: Thèophile Yene y Kenneth Oguejiofor (ACLA), Vianney Lusi Emi y Sid Ching (ASCLA East) James Kannanthanam y Bhyju Anthony (ASCLA West), Paul Smyth y José Ramón Sanz (ECLA), Fernando Kuhn y Marcos Garnica (MICLA), el Prefecto General de Formación, Leo Dalmao, y el Prefecto General de Espiritualidad, Gonzalo Fernández.","14":"Para el primer volumen el equipo estuvo formado por Fernando Kuhn, Marcos Garnica y Paulson Veliyannoor, siendo coordinado por Gonzalo Fernández. El segundo equipo estaba formado por Paul Smyth, José Ramón Sanz, Thèophile Yene, James Kannanthanam, Anthony Bhyju, Kenneth Oguejiofor y Babu Sebastian, siendo coordinado por Leo Dalmao.","15":"El nombramiento fue hecho por el Santo Padre, el Papa Francisco, el 25 de marzo de 2019."}},{"id":"intro","title":"Introducción","short":"Introducción","kind":"main","pages":[35,38],"blocks":[{"t":"h","l":2,"h":"1. NATURALEZA Y FIN DEL PGF"},{"t":"p","h":"El PGF expone y desarrolla de una manera pedagógica, y con perspectiva universal, los principios y normas formativos que aparecen en el Código de Derecho Canónico, en las Constituciones, en el Directorio y en otros documentos de la Iglesia y de la Congregación. Recoge también las experiencias de formación desde su riqueza intercultural que se vienen haciendo en los Organismos de nuestro Instituto. Dentro de él se acentúan, sin menoscabo de otros elementos necesarios más generales, aquellos que son propios de nuestro carisma, procurando armonizar su universalidad y unidad.","n":"1","s":1},{"t":"p","h":"En la situación actual de la Congregación, el PGF pretende:","n":"2","s":1},{"t":"p","h":"a. Orientar y dar consistencia al itinerario formativo inicial y continuo, como un proceso ininterrumpido de transformación personal, para configurarse con Cristo misionero.","n":"2"},{"t":"p","h":"b. Garantizar una formación claretiana que, por ser misionera, ha de enraizarse en un constante discernimiento, estar siempre abierta a los signos de los tiempos y en sintonía con los acontecimientos del mundo y de la Iglesia, tanto universal como particular<sup class=\"fn\" data-u=\"intro\" data-n=\"1\">1<\/sup>.","n":"2"},{"t":"p","h":"c. Ser una guía para la elaboración o actualización de los planes de formación, inicial y permanente, en los Organismos y casas formativas<sup class=\"fn\" data-u=\"intro\" data-n=\"2\">2<\/sup>.","n":"2"},{"t":"p","h":"d. Servir como instrumento pedagógico para formadores y formandos.","n":"2"},{"t":"h","l":2,"h":"2. DESTINATARIOS DEL PGF"},{"t":"p","h":"El PGF contempla al claretiano en un proceso continuo de formación<sup class=\"fn\" data-u=\"intro\" data-n=\"3\">3<\/sup> que le ayude a vivir su vocación misionera con gozo, durante toda su existencia. Va dirigido a todos los miembros de la comunidad congregacional, según su propia condición: presbíteros, diáconos, hermanos y estudiantes<sup class=\"fn\" data-u=\"intro\" data-n=\"4\">4<\/sup>. Se dirige también a los llamados a formar parte de ella que se encuentran en fase de discernimiento y preparación.","n":"3","s":1},{"t":"p","h":"Todos los claretianos hemos de ver en el PGF un instrumento útil para la formación de los miembros de la Congregación, ya que todos somos responsables de ella<sup class=\"fn\" data-u=\"intro\" data-n=\"5\">5<\/sup>. El PGF armoniza y articula las diferentes etapas del itinerario de la vocación misionera, proponiendo herramientas para su desarrollo.","n":"4","s":1},{"t":"h","l":2,"h":"3. FUENTES DE INSPIRACIÓN DEL PGF"},{"t":"p","h":"Como fuentes eclesiales de inspiración, el PGF tiene presentes los documentos del Magisterio de la Iglesia sobre la formación religiosa y sacerdotal. Presta una atención especial a los emanados del Concilio Vaticano II y a los publicados en el período posconciliar<sup class=\"fn\" data-u=\"intro\" data-n=\"6\">6<\/sup>; entre otros, al Código de Derecho Canónico (1983), <i>Potissimum institutioni <\/i>(1990), <i>Pastores dabo vobis <\/i>(1992), <i>La vida fraterna en comunidad<\/i> (1994), <i>Vita consecrata <\/i>(1996),<i> Caminar desde Cristo <\/i>(2002),<i> El servicio de la autoridad y la obediencia <\/i>(2008)<i> y Ratio fundamentalis <\/i>(2016).","n":"5","s":1},{"t":"p","h":"Como fuentes congregacionales que reflejan nuestro carisma el PGF tiene en cuenta:","n":"6","s":1},{"t":"p","h":"a. Los escritos del Padre Fundador, sobre todo: la Autobiografía, los Escritos Espirituales y sus obras sobre la vocación y la formación. De entre estas últimas, destaca el Reglamento que escribió sobre la formación de los aspirantes, novicios y estudiantes de la Congregación.","n":"6"},{"t":"p","h":"b. Los documentos congregacionales, particularmente las Constituciones y el Directorio; así como las orientaciones de los Capítulos Generales y de los Superiores Generales del período posconciliar.","n":"6"},{"t":"p","h":"c. La experiencia congregacional recogida en los textos elaborados por la Prefectura General de Formación, las diversas áreas congregacionales y los planes de formación de los Organismos Mayores.","n":"6"},{"t":"h","l":2,"h":"4. ESTRUCTURA DEL PGF"},{"t":"p","h":"El PGF 2020, que básicamente sigue la estructura del PGF 1994, tiene dos partes: <i>Aspectos Generales<\/i> y <i>Etapas<\/i>. La estructura de la primera parte se mantiene sin mayores cambios con sus seis capítulos que presentan un conjunto de aspectos generales sobre la formación. En la segunda parte sobre las <i>Etapas<\/i>, la etapa de <i>Pastoral Vocacional y Acogida<\/i> se suprime en el PGF 2020 reduciendo el documento a 11 capítulos. Así, la formación inicial consta de tres etapas en una progresión, a saber, preparación, iniciación y desarrollo/consolidación. En el Capítulo 11, sobre la <i>Formación Permanente<\/i>, se presentan cuatro períodos especiales de la formación permanente (nº 7): Quinquenio, Media Edad, Tercera Edad y Cuarta Edad. En el mismo Capítulo 11 se añade una nueva sección, <i>Situaciones Particulares<\/i> (nº 8) que incluye <i>Crisis durante la Formación Continua<\/i> y <i>Conductas Inapropiadas relacionada con los Consejos Evangélicos<\/i>. Se tratan las diferentes crisis que surgen durante la formación permanente, así como las situaciones de conducta inapropiada relacionadas con la vivencia de los consejos evangélicos en la vida concreta de un misionero. La Conclusión General enfatiza la naturaleza holística y la continuidad del proceso de formación.","n":"7","s":1},{"t":"p","h":"Los cinco Apéndices ofrecen varias herramientas para ayudar a entender y aplicar el PGF 2020. Se incluye una lista de importantes libros claretianos, útiles cánones relacionados con la formación, y consejos para la preparación de documentos y formularios en diferentes momentos de la formación.","n":"8","s":1}],"notes":{"1":"Cf. CIC 659 §2.","2":"Cf. Dir 168.","3":"Cf. CPR 66-71.","4":"Cf. CC 7; Dir 156, 158.","5":"Cf. CC 58, 76; Dir 160, 170.","6":"Cf. Apéndice 1."}},{"id":"c1","title":"La formación claretiana: objetivo y marco de referencia","short":"Capítulo 1","kind":"main","pages":[43,68],"blocks":[{"t":"h","l":2,"h":"INTRODUCCIÓN"},{"t":"p","h":"Este capítulo ofrece una presentación sumaria de los principios que orientan la formación claretiana. Constituye el fundamento de todo lo que se desarrolla con más amplitud en los capítulos siguientes. En el primer apartado se presenta el enunciado del objetivo fundamental de la formación y un breve comentario de cada una de las cuatro afirmaciones contenidas en el mismo. En el apartado segundo, el objetivo fundamental se coloca en un marco carismático, pedagógico y situacional, que pretende ayudar a comprender mejor su significado. Todo el capítulo trata, pues, de las mismas cuestiones básicas en tres niveles progresivos de desarrollo.","n":"9","s":1},{"t":"h","l":2,"h":"1. OBJETIVO FUNDAMENTAL"},{"t":"p","h":"El objetivo de la formación es promover nuestro crecimiento en la unión y configuración con Cristo, según el carisma claretiano en la Iglesia, mediante un proceso personalizador y transformador, en cada realidad concreta y abiertos a la universalidad.<sup class=\"fn\" data-u=\"c1\" data-n=\"1\">1<\/sup>","n":"10","s":1},{"t":"h","l":3,"h":"1.1. La configuración con Cristo misionero"},{"t":"p","h":"El objetivo fundamental consiste en seguir a Jesucristo misionero hasta configurarnos con Él. En nuestra formación <i>el seguimiento de Cristo, tal como se propone en el Evangelio, es para nosotros la regla suprema<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"2\">2<\/sup>. Las demás orientaciones y normas adquieren sentido si nos ayudan a <i>seguir a Cristo en comunión de vida y proclamar el Evangelio a toda criatura<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"3\">3<\/sup>. Nuestra vida y misión y, por consiguiente, todo el itinerario formativo es un proceso continuo que <i>ha de brotar siempre de una real configuración con Cristo evangelizador y de una íntima comunión y amistad con Él<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"4\">4<\/sup><i>, hasta que ya no seamos nosotros mismos los que vivamos, sino que sea Cristo quien realmente viva en nosotros<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"5\">5<\/sup>. En este proceso, María, Madre de Jesús y de la Iglesia, formadora de los apóstoles, desempeña una misión esencial. Por eso nos entregamos a Ella <i>para ser configurados con el misterio de Cristo, imitar su respuesta fiel como seguidora de Jesús y cooperar con su oficio maternal en la misión apostólica<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"6\">6<\/sup>. Sólo así podremos ser verdaderamente misioneros que ardamos en caridad y abrasemos por donde pasemos<sup class=\"fn\" data-u=\"c1\" data-n=\"7\">7<\/sup>.","n":"11","s":1},{"t":"h","l":3,"h":"1.2. Según el carisma claretiano en la Iglesia"},{"t":"p","h":"Dentro de la gran variedad de carismas que el Espíritu suscita en la Iglesia, y en comunión con ellos, nosotros prolongamos el don de gracia concedido a nuestro Fundador. Seguimos a Cristo <i>a semejanza de los apóstoles<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"8\">8<\/sup>, <i>buscando en todo la gloria de Dios, nuestra santificación y la salvación de todo el mundo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"9\">9<\/sup>. Los últimos Capítulos generales han profundizado nuestra identidad misionera como servidores de la Palabra (1991) enviados en misión profética (1997) para que nuestros pueblos tengan vida (2003). Procuramos ser fieles a nuestra vocación como hombres que arden en caridad (2009) y ser siendo testigos y mensajeros de la alegría del Evangelio (2015).","n":"12","s":1},{"t":"p","h":"Formamos así, en la Iglesia, <i>un instituto verdadera y plenamente apostólico<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"10\">10<\/sup>. En el Reglamento que nuestro Fundador escribió para los estudiantes señalaba que la formación del misionero se orienta a <i>la gloria de Dios, a quien han de pedir que los haga ministros idóneos de la Palabra para extender su nombre y propagar su Reino por todo el mundo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"11\">11<\/sup>. En él aparecía ya la impronta misionera que ha caracterizado la formación claretiana desde sus orígenes hasta hoy y que las Constituciones recogen con claridad. Nuestra formación es para la misión<sup class=\"fn\" data-u=\"c1\" data-n=\"12\">12<\/sup>. De ahí que la misión, vivida siempre en espíritu de comunión, sea la clave de toda nuestra formación<sup class=\"fn\" data-u=\"c1\" data-n=\"13\">13<\/sup> y <i>el núcleo promocional de las nuevas vocaciones claretianas, a la vez que un principio de discernimiento, de animación pedagógica y de experimentación para todo el proceso de incorporación a nuestro instituto<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"14\">14<\/sup>.","n":"13","s":1},{"t":"h","l":3,"h":"1.3. Mediante un proceso personalizador y transformador"},{"t":"p","h":"En nuestro itinerario formativo tratamos de recrear, con ayuda del Espíritu y como personas responsables y creativas, el carisma de Claret, persuadidos de que así podemos <i>conseguir en la comunidad misionera la plenitud personal a la que hemos sido llamados<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"15\">15<\/sup>. Nuestra formación - que dura toda la vida y abarca todas sus dimensiones - se inspira en una concepción de la persona como un ser abierto a Dios, a los demás y a toda la creación, que requiere continuos <i>procesos de transformación por las limitaciones propias de la condición humana<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"16\">16<\/sup><i>.<\/i>","n":"14","s":1},{"t":"h","l":3,"h":"1.4. En cada realidad concreta y abiertos a la universalidad"},{"t":"p","h":"En cuanto misioneros, vivimos insertos en las diversas realidades de los pueblos y culturas en los que estamos, conservando, al mismo tiempo, nuestra disponibilidad para la misión universal de la Congregación. Somos conscientes del permanente cambio de la realidad local y universal y los desafíos que supone para la formación. La comunidad misionera es el ambiente privilegiado de nuestro proceso formativo. Esta comunidad, al mismo tiempo que <i>se encarne verdaderamente en la situación y en las necesidades de la iglesia particular y del mundo que la rodea, tanto en el modo de vivir como en el modo de ejercer el ministerio<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"17\">17<\/sup>, se ha de mantener en relación con el resto de la Congregación, inserta en la Iglesia y en contacto con el mundo y particularmente con los pobres, y consciente de ser parte integral de la creación<sup class=\"fn\" data-u=\"c1\" data-n=\"18\">18<\/sup>.","n":"15","s":1},{"t":"h","l":2,"h":"2. MARCO DE REFERENCIA"},{"t":"p","h":"Para poder realizar el objetivo fundamental de la formación necesitamos tener en cuenta nuestra identidad claretiana (referencia carismática), las características esenciales del proceso formativo (referencia pedagógica) y la situación en la que nos encontramos (referencia situacional). Estas tres dimensiones, contenidas ya en la misma formulación del objetivo, se hallan entreveradas y constituyen instancias formativas indispensables.","n":"16","s":1},{"t":"h","l":3,"h":"2.1. Nuestra identidad claretiana (referencia carismática)"},{"t":"p","h":"Nuestra identidad, descrita de una manera global en los documentos congregacionales, se expresa claramente en las Constituciones. Estas condensan y transmiten una experiencia de gracia que el Espíritu nos concede y que genera un peculiar estilo de vida y de misión dentro de la Iglesia, con rasgos específicos de nuestro carisma. El XXV Capítulo General acentúa los siguientes: misioneros con Espíritu, oyentes y servidores de la Palabra de Dios, misioneros en comunidad, enviados a evangelizar y escuchar a los pobres, con toda la Iglesia y quienes buscan la transformación del mundo y abiertos a todo el mundo en diálogo profético<sup class=\"fn\" data-u=\"c1\" data-n=\"19\">19<\/sup>.","n":"17","s":1},{"t":"p","h":"Las Constituciones son la referencia inmediata de nuestro proceso formativo y la fuente de la que brota la siguiente síntesis pedagógica de nuestro carisma.","n":"18","s":1},{"t":"h","l":4,"h":"<i>2.1.1. Somos seguidores de Jesucristo al estilo de los apóstoles<\/i>"},{"t":"p","h":"Somos seguidores de Jesucristo, consagrados al Padre por el don del Espíritu. Jesucristo es para nosotros el Cristo<sup class=\"fn\" data-u=\"c1\" data-n=\"20\">20<\/sup> y el Señor<sup class=\"fn\" data-u=\"c1\" data-n=\"21\">21<\/sup> al que entregamos nuestra vida. Es el Hijo y el Enviado del Padre, hecho hombre de la Virgen María<sup class=\"fn\" data-u=\"c1\" data-n=\"22\">22<\/sup>, el Ungido por el Espíritu para evangelizar a los pobres, el Profeta poderoso en obras y palabras<sup class=\"fn\" data-u=\"c1\" data-n=\"23\">23<\/sup>, el obediente hasta la muerte y el Resucitado que sigue vivo en el mundo. A nosotros se nos ha concedido representar en la Iglesia su vida profética, su vocación de mensajero de la Buena Nueva para todos los hombres, especialmente para los pobres, destinatarios y sujetos privilegiados del Reino vivido y anunciado por Él. Por eso, somos llamados a configurarnos con Jesús adquiriendo sus actitudes y teniendo sus mismos sentimientos<sup class=\"fn\" data-u=\"c1\" data-n=\"24\">24<\/sup> con la gracia del Espíritu.","n":"19","s":1},{"t":"p","h":"Seguimos a Jesucristo a la manera de los apóstoles<sup class=\"fn\" data-u=\"c1\" data-n=\"25\">25<\/sup>. Como éstos, hemos sido agraciados para vivir y anunciar la Palabra<sup class=\"fn\" data-u=\"c1\" data-n=\"26\">26<\/sup>, representando en la Iglesia la virginidad, la pobreza y la obediencia de Cristo<sup class=\"fn\" data-u=\"c1\" data-n=\"27\">27<\/sup> y compartiendo las esperanzas y las tristezas de los hombres, principalmente de los pobres.","n":"20","s":1},{"t":"p","h":"Del Evangelio, prestamos una atención particular a la llamada a ser perfectos como el Padre, al mandamiento del amor, a la oración, a las reglas de la vida apostólica y a las bienaventuranzas<sup class=\"fn\" data-u=\"c1\" data-n=\"28\">28<\/sup>. Estos implican como fundamento la aceptación incondicional de la persona de Jesús y del orden nuevo de valores que Él propone como el Reino<sup class=\"fn\" data-u=\"c1\" data-n=\"29\">29<\/sup>. La centralidad del Reino <i>se convierte para nosotros en el criterio fundamental de discernimiento para nuestra vida y misión<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"30\">30<\/sup>. Supone una fe inquebrantable en el Dios que nos llama<sup class=\"fn\" data-u=\"c1\" data-n=\"31\">31<\/sup>, la experiencia de la relación filial con el Padre, la configuración con Cristo evangelizador, la docilidad al Espíritu Santo<sup class=\"fn\" data-u=\"c1\" data-n=\"32\">32<\/sup> y la vivencia de nuestra filiación cordimariana<sup class=\"fn\" data-u=\"c1\" data-n=\"33\">33<\/sup>. La formación claretiana consiste en caminar en el Espíritu aprendiendo a discernir la voluntad del Padre en todas las situaciones, como vivió Jesús.","n":"21","s":1},{"t":"h","l":4,"h":"<i>2.1.2. Formados por el Espíritu en la fragua del Corazón de María<\/i>"},{"t":"p","h":"Nuestra experiencia de vida apostólica sólo es posible por la acción del Espíritu. Él es el que unge a Jesús<sup class=\"fn\" data-u=\"c1\" data-n=\"34\">34<\/sup>, el que impulsa a los apóstoles a testimoniar su resurrección por todo el mundo<sup class=\"fn\" data-u=\"c1\" data-n=\"35\">35<\/sup> y anima a algunos a llevar su mismo género de vida<sup class=\"fn\" data-u=\"c1\" data-n=\"36\">36<\/sup>. Este Espíritu nos hace hijos de Dios y grita en nosotros <i>Abbá<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"37\">37<\/sup>. Es Él quien ha suscitado nuestra Congregación como don para la Iglesia<sup class=\"fn\" data-u=\"c1\" data-n=\"38\">38<\/sup>, otorga a cada uno de nosotros el don del seguimiento de Cristo en comunidad apostólica<sup class=\"fn\" data-u=\"c1\" data-n=\"39\">39<\/sup>, nos unge para evangelizar<sup class=\"fn\" data-u=\"c1\" data-n=\"40\">40<\/sup> dándonos el gozo y el celo misionero<sup class=\"fn\" data-u=\"c1\" data-n=\"41\">41<\/sup>, nos reúne en comunidad fraterna<sup class=\"fn\" data-u=\"c1\" data-n=\"42\">42<\/sup> y nos concede diversidad de dones para una misión común<sup class=\"fn\" data-u=\"c1\" data-n=\"43\">43<\/sup>.","n":"22","s":1},{"t":"p","h":"Nos llamamos y somos hijos del Corazón Inmaculado de María<sup class=\"fn\" data-u=\"c1\" data-n=\"44\">44<\/sup>. Ella nos forma en su corazón, allí donde la gracia del Espíritu transforma el corazón de piedra en un corazón de carne<sup class=\"fn\" data-u=\"c1\" data-n=\"45\">45<\/sup>. Así como estuvo presente en el proceso de crecimiento de Jesús, lo acompañó en su vida pública, estuvo al pie de la cruz y se reunió con los discípulos en el cenáculo de Pentecostés, también nos acompaña en nuestro camino misionero. Ella es modelo del discipulado, que nos enseña cómo vivir el seguimiento de Cristo. De modo que, por la gracia del Espíritu, somos formados en su corazón materno, y somos enviados a las periferias geográficas y existenciales para impulsar <i>la revolución de la ternura<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"46\">46<\/sup> del amor de Dios por la humanidad, especialmente por los pobres.","n":"23","s":1},{"t":"p","h":"La presencia de María fue fundamental en la vida del Padre Claret, especialmente en el desarrollo de su vocación misionera. Todos nosotros podemos dirigirnos a Ella con las mismas palabras usadas por él: <i>Bien sabéis que soy hijo y ministro vuestro, formado por Vos misma en la fragua de vuestra misericordia y amor. Soy como una saeta puesta en vuestra mano poderosa<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"47\">47<\/sup>. Así, nos sentimos fortalecidos para proclamar el Evangelio y enfrentarnos al mal que afecta a las personas y a las estructuras en las que viven. La formación claretiana es un proceso de transformación del corazón que se forja en el amor tierno de María y que nos capacita para “discernir y actuar según el corazón de Dios”<sup class=\"fn\" data-u=\"c1\" data-n=\"48\">48<\/sup> como discípulos-misioneros.","n":"24","s":1},{"t":"h","l":4,"h":"<i>2.1.3. Para buscar en todo la gloria de Dios<\/i>"},{"t":"p","h":"Nuestra Congregación existe para <i>buscar en todo la gloria de Dios, la santificación de sus miembros y la salvación de los hombres de todo el mundo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"49\">49<\/sup>. El Fundador concebía al hijo del Inmaculado Corazón de María como un hombre que sigue e imita a Cristo <i>en orar, en trabajar, en sufrir, en procurar siempre y únicamente la mayor gloria de Dios y la salvación de los hombres<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"50\">50<\/sup>. Por eso, todo nuestro proceso formativo está encaminado a hacer de nuestra vida una búsqueda constante de Dios anunciando que <i>el Evangelio del amor de Dios al hombre, el Evangelio de la dignidad de la persona y el Evangelio de la vida son un único e indivisible Evangelio<\/i>”<sup class=\"fn\" data-u=\"c1\" data-n=\"51\">51<\/sup>. Dar gloria a Dios significa para nosotros <i>que el hombre viva (Ireneo de Lyon), que el pobre viva (Oscar Romero), que la naturaleza viva (Pablo de Tarso)<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"52\">52<\/sup><i>.<\/i>","n":"25","s":1},{"t":"p","h":"La búsqueda de la gloria de Dios exige cultivar en nosotros una actitud de adoración en medio de un contexto en el que corremos el riesgo de idolatrar otras realidades como el propio yo, los gustos personales, la patria, el placer, el dinero o el poder. Somos hombres llamados a adorar a nuestro Padre Dios <i>en espíritu y verdad <\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"53\">53<\/sup>, de manera que, como nuestro Fundador, podamos decir: <i>Yo no quiero más que a Vos, y en Vos y únicamente por Vos y para Vos las demás cosas. Vos sois para mí suficientísimo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"54\">54<\/sup>. La adoración nos lleva a descubrir a Dios como <i>lo único que no tiene precio, que no se negocia, que no se cambia<\/i> (papa Francisco), la gratuidad de la gracia en un mundo que tiende a juzgar todo con criterios de eficiencia, la necesidad de dejarnos mirar compasivamente por Dios para mirar a los demás con compasión y ternura.","n":"26","s":1},{"t":"h","l":4,"h":"<i>2.1.4. En comunidad misionera<\/i>"},{"t":"p","h":"<i>Porque somos hijos somos también hermanos, convocados a compartir el mismo proyecto de vida evangélica<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"55\">55<\/sup>. Nuestra comunidad está enriquecida con diversidad de carismas y ministerios: Formamos la Congregación presbíteros, diáconos, hermanos y estudiantes, compartiendo toda la misma vocación. Y todos nos congregamos en la misma comunidad, realizamos la misma misión y, según el don del propio orden y la función de cada uno en la Congregación, <i>participamos de los mismos derechos y obligaciones que dimanan de la profesión religiosa<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"56\">56<\/sup>.","n":"27","s":1},{"t":"p","h":"No obstante, <i>ser comunidad es un verbo y no solo un nombre. Es acción, es proceso<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"57\">57<\/sup>. Un misionero puede gozar la vida en comunidad cuando abre su corazón para recibir el don de la comunión. La formación es el ámbito privilegiado para aprender a cuidar y a hacer crecer este don, desarrollando destrezas necesarias, tales como: escucha, diálogo, comunicación compasiva, solución de conflictos.","n":"28","s":1},{"t":"h","l":4,"h":"<i>2.1.5. Llamados a evangelizar desde el ministerio de la Palabra<\/i>"},{"t":"p","h":"En estrecha comunión con los diversos ministerios y carismas, <i>nuestra vocación especial en el Pueblo de Dios es el ministerio de la Palabra, con el que comunicamos a los hombres el misterio íntegro de Cristo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"58\">58<\/sup>. La colaboración en este ministerio pertenece al origen mismo de nuestra vida comunitaria<sup class=\"fn\" data-u=\"c1\" data-n=\"59\">59<\/sup>. Somos comunidad convocada en el Espíritu para el anuncio del Evangelio. Para nosotros, es tan esencial la Palabra de Dios a la comunidad como la comunidad a la Palabra de Dios<sup class=\"fn\" data-u=\"c1\" data-n=\"60\">60<\/sup>. Por eso, uno de los aspectos nucleares de nuestra formación es la iniciación y crecimiento <i>en el ministerio de la Palabra, entendido como un auténtico modo de ser, de actuar y de significar<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"61\">61<\/sup>.","n":"29","s":1},{"t":"p","h":"María ha vivido en plenitud este misterio. Bajo su acción materna <i>aprendemos a acoger la Palabra, a darle cuerpo de compromiso en la vida y a comunicarla con la misma presteza y generosidad con que ella lo hiciera<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"62\">62<\/sup>. La escucha, el cumplimiento, la comunicación fraterna y el anuncio, tanto personales como comunitarios, son momentos básicos de la dinámica de la Palabra que tienen que estar presentes en todas las etapas de la formación.","n":"30","s":1},{"t":"h","l":4,"h":"<i>2.1.6. En la misión evangelizadora de la Iglesia<\/i>"},{"t":"p","h":"A lo largo de los siglos, la Iglesia, impulsada por el Espíritu, ha intentado cumplir el encargo de Jesús: <i>Id por todo el mundo y anunciad la Buena Nueva a toda criatura<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"63\">63<\/sup>. Su misión consiste en <i>anunciar el reino
