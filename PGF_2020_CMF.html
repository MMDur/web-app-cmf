de Cristo y de Dios e instaurarlo en todos los pueblos, y constituye en la tierra el germen y el principio de ese reino<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"64\">64<\/sup>, evangelizando a todos los pueblos<sup class=\"fn\" data-u=\"c1\" data-n=\"65\">65<\/sup> a través del testimonio, la palabra, la transformación de la realidad y la denuncia profética. Nosotros, por nuestro carisma misionero, hacemos nuestra esta misión evangelizadora, urgidos por el Espíritu, tal como lo vivió nuestro fundador. Hemos sido llamados a comunicar a los hombres el misterio íntegro de Cristo. Cumplimos este encargo suscitando y consolidando comunidades de creyentes<sup class=\"fn\" data-u=\"c1\" data-n=\"66\">66<\/sup> allí donde es más urgente, oportuno y eficaz, sin anclarnos en la propia patria, dóciles al Espíritu y obedientes a la misión<sup class=\"fn\" data-u=\"c1\" data-n=\"67\">67<\/sup>. El Espíritu nos llama a vivir una transformación misionera que implica ser, con Jesús, Congregación <i>“en salida” que acoge la llamada de la Iglesia a la conversión pastoral misionera y ecológica<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"68\">68<\/sup>. La formación para la misión implica también adquirir la capacidad de dejar las zonas de confort y <i>con el alma, el corazón y la cabeza, caminar, buscar, ir a las <\/i>","n":"31","s":1},{"t":"p","h":". <i>fronteras de todo tipo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"69\">69<\/sup> para <i>anunciar la alegría del evangelio<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"70\">70<\/sup>, a la vez que hacer de la misión un lugar teologal de experiencia de Dios y de formación para el misionero.","n":"31"},{"t":"h","l":4,"h":"<i>2.1.7. Según las llamadas de Dios en nuestro tiempo<\/i>"},{"t":"p","h":"Vivimos en un mundo donde todo está interconectado. El amor y el cuidado de Dios protege, sostiene y dirige a toda la creación. <i>Nuestro Dios, con su presencia misteriosa, nos habla e interpela a través de su creación, de la humanidad, de los pueblos, de su Iglesia<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"71\">71<\/sup>. Como comunidad misionera nos sentimos interpelados por el grito de la madre tierra, el clamor de los pobres y la justicia, el sueño de la paz y la reconciliación, los signos de Dios en el mundo digital, las preocupaciones de la Iglesia para ser creíble y las inquietudes de la Congregación para ser fiel a misión. La formación claretiana tiene que capacitar a los misioneros a escuchar los clamores de Dios y responder con una vida coherente y comprometida en la misión.","n":"32","s":1},{"t":"p","h":"Dios Padre a quien Jesús reveló es un Dios rico en misericordia. Jesús, en Sí mismo, nos lo manifestó y nos lo dio a conocer<sup class=\"fn\" data-u=\"c1\" data-n=\"72\">72<\/sup>. En nuestro mundo, herido por diversas formas de violencia y manipulación, estamos llamados a vivir cada día como el tiempo de misericordia <i>marcado por la presencia de Dios, que guía nuestros pasos con el poder de la gracia que el Espíritu infunde en el corazón para plasmarlo y hacerlo capaz de amar<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"73\">73<\/sup>. Este es el tiempo de la misericordia para que los débiles e indefensos, los que están lejos y solos sientan la presencia de hermanos que los sostienen en sus necesidades, para que los pobres sientan la mirada de respeto y atención de aquellos que, venciendo la indiferencia, han descubierto lo que es fundamental en la vida, para <i>que cada pecador no deje de pedir perdón y de sentir la mano del Padre que acoge y abraza siempre<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"74\">74<\/sup>. La formación claretiana nos prepara para ser <i>misioneros de la misericordia<\/i>.","n":"33","s":1},{"t":"h","l":3,"h":"2.2. La formación como proceso (referencia pedagógica)"},{"t":"p","h":"Nuestra formación se inspira en la pedagogía que Dios usa con su pueblo, en el itinerario que Jesús recorre con sus discípulos y en la acción del Espíritu en la Iglesia y en el mundo. Se basa en una visión cristiana del ser humano, entendido como ser creado a imagen y semejanza de Dios, herido por el pecado y renovado por la gracia. También, un ser relacional, está llamado a la comunión y a la fraternidad universal, inserto en la historia y en la sociedad y vinculado a toda la creación. Al mismo tiempo está agraciado con una vocación particular, que va desplegando progresivamente en respuesta consciente y libre a las inspiraciones del Espíritu. Jesucristo es para nosotros el Hombre Nuevo, el único que ilumina completamente la comprensión y realización del ser humano, el origen, la vía y la meta de todo camino auténtico de humanización.","n":"34","s":1},{"t":"p","h":"Desde estas bases entendemos la formación como un proceso a través del cual vamos integrando, consciente y armónicamente, el ideal evangélico, tal como lo vivió nuestro Fundador, en la realidad de nuestra vida misionera. En este sentido, esta tiene por objeto actualizar a través de un proceso de transformación, lo que ya existe en cada uno de nosotros como don vocacional dado por Dios. El descubrimiento y el desarrollo del propio carisma vocacional, de las posibilidades y capacidades recibidas de Dios, genera en nosotros una sintonía y una aceptación progresiva del carisma y del proyecto de vida claretiano.","n":"35","s":1},{"t":"p","h":"Este proceso requiere ser vivido en constante actitud de discernimiento. Como afirma el Papa Francisco, el don del discernimiento es fundamental para que la persona consagrada alcance la madurez que necesita para vivir a plenitud el don vocacional recibido<sup class=\"fn\" data-u=\"c1\" data-n=\"75\">75<\/sup>. No basta discernir en momentos extraordinarios, necesitamos hacerlo siempre <i>para estar dispuestos a reconocer los tiempos de Dios y de su gracia, para no desperdiciar las inspiraciones del Señor, para no dejar pasar su invitación a crecer<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"76\">76<\/sup>. Si bien el discernimiento es una gracia del Señor, el misionero ha de cultivar una actitud de escucha dócil del Señor, que le descentra de sí mismo y de sus propios intereses para abrirlo al misterio amoroso de la voluntad de Dios y vivir la misión como una entrega generosa de la propia vida en favor de sus hermanos, desde la lógica de la cruz<sup class=\"fn\" data-u=\"c1\" data-n=\"77\">77<\/sup>. Solo así encarnaremos lo que afirman nuestras Constituciones: <i>Con la decisión de caminar en una vida nueva, orientando el corazón hacia Dios, hagan todas las cosas con recta intención y con verdadero fervor de espíritu y por Él soporten todas las adversidades<\/i> <sup class=\"fn\" data-u=\"c1\" data-n=\"78\">78<\/sup>. Para alcanzar esta meta, el proceso formativo ha de tener las siguientes características fundamentales:","n":"36","s":1},{"t":"h","l":4,"h":"<i>2.2.1. Personalizado<\/i>"},{"t":"p","h":"Todos nosotros somos personas libres y responsables, capacitadas para dar una respuesta personal a la llamada de Dios. Cuando contemplamos nuestra realidad personal y comunitaria desde la fe, descubrimos en ella la imagen de Dios, una novedad insospechada del Espíritu y <i>una vocación misionera que es gracia para el mundo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"79\">79<\/sup>. Desde esta constatación, es preciso que en nuestro itinerario formativo atendamos a cada persona en su singularidad<sup class=\"fn\" data-u=\"c1\" data-n=\"80\">80<\/sup>, la valoremos en todo lo que ella es, respetemos y estimulemos su ritmo de crecimiento, conscientes de que <i>la persona crece y se plenifica abriéndose a la comunión, insertándose en la historia<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"81\">81<\/sup>.","n":"37","s":1},{"t":"p","h":"En el proceso formativo la persona ha de ir tomando conciencia de su propia realidad, del don recibido de Dios, y asumiendo su propio pasado, en orden a desarrollar todas sus posibilidades humanas y espirituales. Por lo mismo, es necesario que apelemos <i>a la conciencia y responsabilidad personales, así como a la interiorización personalizada de los valores de la comunidad claretiana<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"82\">82<\/sup> y promovamos el protagonismo de cada claretiano, al mismo tiempo que nos preocupamos por asegurarle el debido acompañamiento personal y comunitario<sup class=\"fn\" data-u=\"c1\" data-n=\"83\">83<\/sup>. Este acompañamiento, con las apropiadas intervenciones de quienes participan en el proceso formativo, sobre todo por parte de los formadores, debe ayudar a cada uno a descubrir y desarrollar el don recibido de Dios, de manera que todos lleguemos a vivir la plenitud personal a la que hemos sido llamados<sup class=\"fn\" data-u=\"c1\" data-n=\"84\">84<\/sup>.","n":"38","s":1},{"t":"h","l":4,"h":"<i>2.2.2. Integral e integrador<\/i>"},{"t":"p","h":"La formación integral del misionero claretiano comprende el desarrollo armónico y equilibrado de todas las facetas de la personalidad<sup class=\"fn\" data-u=\"c1\" data-n=\"85\">85<\/sup> desde el don recibido. <i>Ser claretianos es para nosotros el modo concreto de ser hombres, cristianos, religiosos, sacerdotes y apóstoles<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"86\">86<\/sup>. La armonización de todas estas facetas nos permitirá lograr <i>aquella unidad de la vida misionera en virtud de la cual quedan perfectamente integrados el espíritu de unión con Dios y la acción apostólica<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"87\">87<\/sup>, <i>evitando toda dicotomía o extremismo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"88\">88<\/sup>. Esta integración, tarea y fruto de la madurez de la persona, es, sobre todo, obra del Espíritu<sup class=\"fn\" data-u=\"c1\" data-n=\"89\">89<\/sup>. Se logra cuando el amor personal a Cristo se convierte en el centro<sup class=\"fn\" data-u=\"c1\" data-n=\"90\">90<\/sup>. Desde él podemos integrar todas las dimensiones, incluso aquellas que se presentan como contradictorias. Por otra parte, el reconocimiento humilde de los propios dones y límites nos abrirá a la complementariedad que nos viene de los demás.","n":"39","s":1},{"t":"p","h":"Se debe prestar atención especial a los nuevos contextos y buscar formas de ayudar a las personas en su camino hacia la madurez humana, integrando especialmente los aspectos éticos, afectivos y sexuales.","n":"40","s":1},{"t":"p","h":"La formación también debe prestar atención a aspectos prácticos como el liderazgo y la gestión pastoral, la gestión de crisis y la administración económica. Sobre todo, se debe hacer hincapié en el anuncio del Evangelio a través del testimonio de la vida.","n":"41","s":1},{"t":"p","h":"La formación debe ayudar a los formandos a desarrollar una visión global y un compromiso de por vida. Debe llevarlos a un sentido de pertenencia a la Congregación con todo su ser. Debe ayudarles a dedicarse, participar y crecer en un compromiso misionero a través del testimonio de una vida coherente y equilibrada.","n":"42","s":1},{"t":"h","l":4,"h":"<i>2.2.3. Gradual, progresivo y articulado<\/i>"},{"t":"p","h":"La persona se realiza a lo largo de un proceso evolutivo en íntima interrelación con el mundo y las situaciones circundantes. La madurez es el empeño cotidiano de respuesta a la gracia. Por eso, el seguimiento de Cristo es gradual y progresivo. Esto no supone que renunciamos a la utopía del Reino, sino que procuramos encarnarla en la realidad de la persona. Debemos, por tanto, prestar una atención particular a las diversas etapas del itinerario formativo, <i>así como al ritmo y madurez de cada uno<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"91\">91<\/sup> acogiendo <i>los procesos de transformación que el Espíritu nos inspira<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"92\">92<\/sup>. La atención a la gradualidad y progresividad nos exige saber distinguir lo esencial de lo accidental, lo que permanece de lo que cambia, y no confundir los dos niveles. Sólo así podremos afrontar las diversas situaciones de nuestra vida personal y misionera sin caer en el rigorismo o en el relativismo<sup class=\"fn\" data-u=\"c1\" data-n=\"93\">93<\/sup>. Para nosotros, agraciados con un carisma que nos abre al mundo entero, es imprescindible crecer en un sentido creativo y mantenerse firmes en la fidelidad.","n":"43","s":1},{"t":"p","h":"La capacidad de hacer opción fundamental por Cristo y sustentarla en medio de pruebas y tentaciones es la dimensión central de la maduración vocacional. Esta madurez exigirá potenciar los comportamientos adecuados a la edad, con respecto a <i>la sinceridad, facilidad de comunicación consigo mismo y con los demás, desarrollo emocional, apertura a la vida en comunidad, capacidad para la amistad fraterna, responsabilidad con sus deberes, creatividad e iniciativa, expresión de la libertad, apertura al camino de la oración y encuentro con Cristo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"94\">94<\/sup>.","n":"44","s":1},{"t":"p","h":"La gradualidad del proceso y la necesidad de armonizar sus diferentes dimensiones hacen necesarias la planificación y la evaluación de los objetivos y acciones de nuestro itinerario formativo. En este esfuerzo de articulación aspiramos a un justo equilibrio. Por tanto, debemos evitar tanto la improvisación y el descuido de los instrumentos convenientes como la confianza vana en que la programación constituye el centro de la tarea formativa y garantiza automáticamente sus resultados.","n":"45","s":1},{"t":"h","l":4,"h":"<i>2.2.4. Atento a la vocación específica<\/i>"},{"t":"p","h":"Los rasgos de personalidad, la condición laical, diaconal o presbiteral, la edad y las consecuencias que dimanan del contexto sociocultural de cada uno de nosotros son las razones principales por las que nuestra formación, aun conservando su carácter unitario básico, debe atender a lo vocacional específico, teniendo en cuenta las necesidades de la misión y los dones de la persona. Esta distinción, particularmente la derivada de la condición ministerial <i>enriquece la índole pluriforme de nuestra comunidad y la capacita para su servicio misionero<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"95\">95<\/sup>.","n":"46","s":1},{"t":"h","l":4,"h":"<i>2.2.5. Liberador <\/i>"},{"t":"p","h":"<i>Para ser libres nos liberó Cristo<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"96\">96<\/sup>. Nuestra formación debe ser en y para la libertad, de manera que nos ayude a ser cada vez más libres y nos prepare para la misión liberadora propia de nuestro carisma. Esto exige que, a lo largo del itinerario formativo, aprendamos a conocernos mejor a nosotros mismos, a liberarnos de motivaciones inconscientes negativas, de miedos y de todos aquellos condicionamientos que nos impiden asumir responsablemente los compromisos de nuestra vida misionera. Exige, sobre todo, que desarrollemos la capacidad de discernir y de hacer opciones libres, referidas a los valores del Reino y estimuladas por motivaciones auténticas. Una libertad así vivida nos dispone a <i>ser signo y fuerza liberadora de todo tipo de egoísmo, de esclavitud y de servidumbre que impiden el crecimiento de la persona y su comunión con Dios y con los demás hombres<\/i> y con la creación<sup class=\"fn\" data-u=\"c1\" data-n=\"97\">97<\/sup>.","n":"47","s":1},{"t":"h","l":4,"h":"<i>2.2.6. Profético <\/i>"},{"t":"p","h":"La formación ha de ser profética. SS. Juan Pablo II<sup class=\"fn\" data-u=\"c1\" data-n=\"98\">98<\/sup> y el Papa Francisco<sup class=\"fn\" data-u=\"c1\" data-n=\"99\">99<\/sup> han resaltado el sentido profético de la vida consagrada como <i>una forma de especial participación en la función profética de Cristo, comunicada por el Espíritu Santo a todo el Pueblo de Dios. Es un profetismo inherente a la vida consagrada en cuanto tal, por el radical seguimiento de Jesús y la consiguiente entrega a la misión que la caracteriza… La verdadera profecía nace de Dios, de la amistad con Él, de la escucha atenta de su Palabra en las diversas circunstancias de la historia. El profeta siente arder en su corazón la pasión por la santidad de Dios y, tras haber acogido la palabra en el diálogo de la oración, la proclama con la vida, con los labios y con los hechos, haciéndose portavoz de Dios contra el mal y contra el pecado<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"100\">100<\/sup>.","n":"48","s":1},{"t":"p","h":"Esto supone vivir con radicalidad el espíritu profético que recibimos desde el Bautismo y cultivar el profetismo<i> de la vida ordinaria<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"101\">101<\/sup>. Asimismo, estar atentos a los signos de los tiempos, que promueven una constante relación con el Señor y que desarrollan en nosotros la audacia propia de los hombres de Dios. Dadas las condiciones conflictivas en las que vivimos esta vocación profética, debemos prepararnos para vivirla con el atrevimiento y la confianza de los mártires. Somos conscientes de que encarnar un estilo de vida alternativo / contracultural y de transmitir un mensaje de anuncio y de denuncia en situaciones conflictivas de increencia, de injusticia, de alienación o de muerte, es siempre peligroso y arriesgado<sup class=\"fn\" data-u=\"c1\" data-n=\"102\">102<\/sup>. Por eso, los que seguimos a Jesús, mártir de una Palabra que nadie ha logrado callar, debemos amar apasionadamente a Dios, a María y a los hermanos, como lo hicieron el Fundador y nuestros mártires. De este modo venceremos los miedos y las tentaciones que podrían paralizarnos<sup class=\"fn\" data-u=\"c1\" data-n=\"103\">103<\/sup>.","n":"49","s":1},{"t":"h","l":4,"h":"<i>2.2.7. Inculturado, intercultural y universal<\/i>"},{"t":"p","h":"Como misioneros enviados en misión para proclamar la alegría del Evangelio, nos encontramos con las diversas culturas sabiendo que Jesucristo y su Evangelio trascienden todas las culturas, incluso si están completamente penetradas por la presencia de Cristo resucitado y su Espíritu<sup class=\"fn\" data-u=\"c1\" data-n=\"104\">104<\/sup>. El Evangelio y, por consiguiente, la evangelización no se identifica ciertamente con la cultura y son independientes con respecto a todas las culturas<sup class=\"fn\" data-u=\"c1\" data-n=\"105\">105<\/sup>. Esta trascendencia del Evangelio en relación con las culturas hace posible que el Evangelio entre en una relación dinámica con todas las culturas a fin de que la luz de Cristo alcance a todos los sectores de la existencia humana, y el fermento de la salvación transforme desde dentro la vida social, favoreciendo una cultura impregnada de los valores evangélicos<sup class=\"fn\" data-u=\"c1\" data-n=\"106\">106<\/sup>. Como evangelizadores, nos convertimos en catalizadores de la inculturación en la medida en que somos <i>cómplices del Espíritu Santo<\/i> y compartimos la vida de las personas a quienes somos enviados. A menos que un misionero permita que este proceso transformador ocurra en sí mismo, trascendiendo sus propios límites culturales y entrando en un diálogo creativo con aquellos diferentes a los suyos, permanecerá solo como un espectador en lugar de ser un colaborador del Espíritu Santo. La formación para la misión debe necesariamente ocuparse de la preparación de nuestros misioneros para un auténtico diálogo con las culturas, para valorar las “semillas de la Palabra” en ellas, y caminar juntos hacia la plenitud del Reino de Dios.","n":"50","s":1},{"t":"p","h":"Somos conscientes de que la interculturalidad es una realidad compleja que requiere apertura de mente y corazón para ser vivida como un don que enriquece nuestra vida personal, comunitaria y la misión. En la formación hay que afrontar los elementos culturales de cada formando que le impiden la asimilación de los valores evangélicos. Necesitamos prepararnos para el encuentro con lo diverso como un diálogo de vida, intercultural e interreligioso, aprender a colaborar con personas de otras culturas y a promover el discernimiento de los auténticos valores que construyen el Reino<sup class=\"fn\" data-u=\"c1\" data-n=\"107\">107<\/sup>.","n":"51","s":1},{"t":"p","h":"En una Congregación como la nuestra, extendida por todos los continentes y llamada a una misión universal, es preciso mantener unidas la necesidad de insertarnos en la cultura de cada pueblo y la disponibilidad y apertura para ser enviados a cualquier lugar. Esto exige que nuestra formación al mismo tiempo que se realiza y prepara para vivir en una cultura y pueblo determinados, asumiendo su manera de ser y sus valores, cuide todos aquellos aspectos que se derivan de la apertura a la universalidad.","n":"52","s":1},{"t":"h","l":3,"h":"2.3. La situación actual (referencia situacional)"},{"t":"p","h":"Si toda forma de vida religiosa y de proceso formativo tiene que ser fiel a la situación de las personas y del tiempo presente<sup class=\"fn\" data-u=\"c1\" data-n=\"108\">108<\/sup>, en nuestro caso la atención a los desafíos sociales, eclesiales y congregacionales es una exigencia de nuestro carisma misionero: <i>nuestro Dios, con su presencia misteriosa, nos habla e interpela a través de su creación, de la humanidad, de los pueblos, de su Iglesia… Su Espíritu, Señor y Dador de Vida, nos interpela con gemidos inenarrables. La Iglesia, pueblo de Dios, siente estas interpelaciones, las discierne y nos las propone. Como comunidad misionera nos sentimos interpelados<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"109\">109<\/sup>.","n":"53","s":1},{"t":"p","h":"La formación es un proceso que se desarrolla en situaciones concretas, en el hoy de la sociedad y de la Iglesia<sup class=\"fn\" data-u=\"c1\" data-n=\"110\">110<\/sup>. El mundo actual nos ofrece esperanzas nuevas y lanza a la vez retos inéditos que afectan a nuestra formación<sup class=\"fn\" data-u=\"c1\" data-n=\"111\">111<\/sup>. El actual contexto sociocultural, eclesial y congregacional suscita estímulos positivos y nuevas posibilidades, pero también presenta obstáculos que pueden entorpecer o retrasar el proceso formativo. Por eso es necesario habituarse a un continuo discernimiento.","n":"54","s":1},{"t":"h","l":4,"h":"<i>2.3.1. La situación sociocultural<\/i>"},{"t":"p","h":"Cuando contemplamos a la humanidad, descubrimos una realidad compleja y diversificada<sup class=\"fn\" data-u=\"c1\" data-n=\"112\">112<\/sup> que se mueve con dramáticas oscilaciones entre una conciencia muy extendida de la dignidad de la persona<sup class=\"fn\" data-u=\"c1\" data-n=\"113\">113<\/sup>, pero también formas diversas de individualismo<sup class=\"fn\" data-u=\"c1\" data-n=\"114\">114<\/sup> y de subjetivismo<sup class=\"fn\" data-u=\"c1\" data-n=\"115\">115<\/sup>; una valoración del sentido y de la defensa de la vida<sup class=\"fn\" data-u=\"c1\" data-n=\"116\">116<\/sup> y, al mismo tiempo, expresiones de agresión contra ella (aborto, violación de los derechos humanos), que generan incluso una verdadera cultura de la muerte<sup class=\"fn\" data-u=\"c1\" data-n=\"117\">117<\/sup>; el hambre de valores auténticos y de una espiritualidad profunda<sup class=\"fn\" data-u=\"c1\" data-n=\"118\">118<\/sup>, junto a un gran auge de caminos falsos, destacándose el abrumador crecimiento de las adicciones de diversa índole. También constatamos la lucha por la libertad y la democracia en contraste con nuevos modos de opresión, explotación y dependencia (manipulación desde los medios de comunicación social y redes sociales, venta de armamentos, deuda externa); una evidente sensibilidad hacia el pluralismo cultural y religioso y un divorcio no menos evidente entre fe y cultura; un aumento notable de las ayudas humanitarias en favor del progreso de los pueblos, unido a una tendencia generalizada al hedonismo; una preocupación creciente por la solidaridad y una pérdida paralela del sentido de la gratuidad y de las responsabilidades<sup class=\"fn\" data-u=\"c1\" data-n=\"119\">119<\/sup>. Finalmente hay un incremento notable de la valoración de la cuestión de género que, si bien ha ayudado en muchos dinamismos de inclusión, al mismo tiempo convive con el oscurecimiento, tergiversación e incluso explotación del verdadero significado de la sexualidad humana<sup class=\"fn\" data-u=\"c1\" data-n=\"120\">120<\/sup>; una revalorización de la familia como matriz de la persona y, al propio tiempo, ataques tan duros contra ella que, en no pocos casos, la destruyen, generando un sinnúmero de nuevas configuraciones familiares<sup class=\"fn\" data-u=\"c1\" data-n=\"121\">121<\/sup>.","n":"55","s":1},{"t":"p","h":"Respecto de las estructuras políticas, sociales y económicas constatamos la mutua relación e interdependencia entre todos los pueblos y una mayor conciencia de la dignidad de las minorías étnicas como agentes de su propio destino<sup class=\"fn\" data-u=\"c1\" data-n=\"122\">122<\/sup>. No obstante, también encontramos nacionalismos cerrados sobre sí mismos que desgarran el tejido social, oprimen a las minorías culturales y religiosas, y no favorecen la universalidad del género humano. El nuevo mapa político y social del mundo está caracterizado más que nunca por un enorme abismo entre el Norte y el Sur, entre ricos y pobres<sup class=\"fn\" data-u=\"c1\" data-n=\"123\">123<\/sup>, con las consecuencias humanas que de éste se derivan. Al mismo tiempo que se da un sentido creciente de la solidaridad internacional<sup class=\"fn\" data-u=\"c1\" data-n=\"124\">124<\/sup>, vemos las consecuencias de su ausencia, especialmente en los enormes fenómenos migratorios hacia los países ricos. La gran sed de justicia y de paz que caracteriza el mundo de hoy<sup class=\"fn\" data-u=\"c1\" data-n=\"125\">125<\/sup> convive simultáneamente con la opresión, marginación y explotación generadas por estructuras económicas injustas<sup class=\"fn\" data-u=\"c1\" data-n=\"126\">126<\/sup> a lo que se suma el desarrollo tremendo de las nuevas formas de esclavitud como es la trata de personas<sup class=\"fn\" data-u=\"c1\" data-n=\"127\">127<\/sup>.","n":"56","s":1},{"t":"p","h":"Respecto de la cultura en general, percibimos el enorme desarrollo de la ciencia y de la técnica<sup class=\"fn\" data-u=\"c1\" data-n=\"128\">128<\/sup> y sus logros humanizadores, pero también excesos de racionalismo y pragmatismo<sup class=\"fn\" data-u=\"c1\" data-n=\"129\">129<\/sup> a los que con frecuencia conduce. También, tras la caída de las grandes ideologías, han surgido nuevas formas de expresar el pensamiento y el arte centrándose en lo visual e inmediato. Notamos la preocupación creciente por la ecología del planeta, y por ello, el Magisterio Pontificio nos invita a todos a una <i>conversión ecológica<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"130\">130<\/sup><i>, <\/i>nos alerta de las nuevas formas de contaminación y la complejidad del abordaje internacional del cambio climático. Valoramos la difusión de la información y de la cultura, así como las nuevas posibilidades de comunicación a través del <i>continente digital<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"131\">131<\/sup><i>.<\/i> Sin embargo, nos preocupa la contaminación de este continente mediante la proliferación de <i>fake news<\/i>, pornografía, juegos y aplicaciones adictivas que dañan la salud de la persona<sup class=\"fn\" data-u=\"c1\" data-n=\"132\">132<\/sup> así como la invasión de privacidad que atenta contra la dignidad humana. Hay un creciente acercamiento entre religiones que crea un ambiente de convivencia y tolerancia religiosa, permitiendo un mayor aprecio de los valores universales. Desgraciadamente, nuestro mundo está amenazado por movimientos fundamentalistas y violentos, y nuevas formas de persecución religiosa. Finalmente constatamos el divorcio entre la fe y la vida, la dificultad de asumir compromisos estables, el consumismo y el materialismo práctico que caracteriza a creyentes de todas las religiones.","n":"57","s":1},{"t":"h","l":4,"h":"<i>2.3.2. La situación eclesial<\/i>"},{"t":"p","h":"La Iglesia de la que formamos parte está viviendo una situación que nos interpela en cuanto misioneros. El camino abierto por el Concilio Vaticano II es irrefrenable y, poco a poco, va dando sus frutos. Abundan, por una parte, los signos de vitalidad: <i>El Espíritu está suscitando… nuevas comunidades y movimientos cristianos, nuevos estilos de vida y espiritualidad, teologías inculturadas, formas nuevas de presencia y de acompañamiento<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"133\">133<\/sup>. En el contexto de una cultura egocéntrica de gratificación instantánea, la Iglesia denuncia la idolatría del dinero y hace todo lo posible para promover la inclusión social de los pobres, el diálogo, la paz, la justicia y la defensa de la integridad de la creación. La Iglesia nos invita a ser mensajeros de la alegría y la misericordia del Evangelio, a romper las barreras de la indiferencia y a acompañar y abrir nuestros corazones sin temor a los que viven en las periferias de la sociedad<sup class=\"fn\" data-u=\"c1\" data-n=\"134\">134<\/sup>. La Iglesia ha sido la voz del creciente número de personas excluidas y abandonadas: inmigrantes, refugiados, personas sin hogar, pueblos amenazados, mujeres maltratadas, niños, ancianos y personas abandonadas y enfermas. Como discípulos de Jesús, hemos sido marcados para iluminar, bendecir, vivificar, levantar, sanar, liberar.","n":"58","s":1},{"t":"p","h":"Por otro lado, percibimos signos que nos preocupan como el clericalismo y la mundanidad espiritual, que frenan la necesaria reforma y conversión pastoral de la Iglesia<sup class=\"fn\" data-u=\"c1\" data-n=\"135\">135<\/sup>. El dolor provocado por la corrupción económica, los escándalos sexuales, así como el abuso de menores y adultos vulnerables, por parte de algunos de sus ministros, han provocado una pérdida de credibilidad ante el mundo. También se evidencia un declive de los cristianos en países de larga tradición católica y el alejamiento de algunos de sus fieles, en otros contextos, que buscan refugio en otras iglesias y espiritualidades. En este contexto, nos sentimos llamados a potenciar, en la Iglesia<i>, nuestra “salida misionera” según nuestro carisma evangelizador<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"136\">136<\/sup>.","n":"59","s":1},{"t":"h","l":4,"h":"<i>2.3.3. La situación congregacional<\/i>"},{"t":"p","h":"También la realidad de nuestra Congregación influye en los procesos formativos. Los claretianos hemos ido renovando durante los años del posconcilio nuestra conciencia misionera<sup class=\"fn\" data-u=\"c1\" data-n=\"137\">137<\/sup>. <i>Las Constituciones renovadas, aprobadas definitivamente en 1986, son fuente permanente de inspiración y punto obligado de referencia<\/i><sup class=\"fn\" data-u=\"c1\" data-n=\"138\">138<\/sup>. Estamos haciendo un gran esfuerzo por seguir profundizando con realismo en nuestra identidad, en nuestra espiritualidad misionera, en la vida comunitaria y en las exigencias y opciones evangelizadoras. Se nos sigue invitando a estar llenos del fuego que ardía en el corazón de Claret para encender a otros en el entusiasmo misionero<sup class=\"fn\" data-u=\"c1\" data-n=\"139\">139<\/sup>, pero también percibimos tensiones entre las necesidades universales de la Congregación y las prioridades locales. Seguimos empeñados en la revisión de posiciones y motivados a ser una <i>congregación en salida,<\/i> sin embargo, no siempre invitamos con convicción <i>a otros a abrazar la vocación<\/i> para aportar desde nuestro carisma al anuncio del Reino<sup class=\"fn\" data-u=\"c1\" data-n=\"140\">140<\/sup>.","n":"60","s":1}],"notes":{"1":"Cf. Dir 156.","2":"CC 4.","3":"CC 4.","4":"SP 6; cf. Dir 138.","5":"CC 39.","6":"CC 8; cf. MS 39.","7":"Cf. Aut 494; CC 9; HAC 30-31.","8":"CC 4; SP 3, 5.","9":"CC 2.","10":"CC 5.","11":"RE (B) 28b.","12":"Cf. CC 72.","13":"Cf. 1F 2.","14":"MCH 135; cf. MS 75.4.","15":"CC 12.","16":"MS 31.","17":"CC 14.","18":"Dir 159; cf. SP 21.4; MS 45, 3.4; HAC 12; LS 89.","19":"Cf. MS 34-63.","20":"Cf. CC 3, 4, 5.","21":"Cf. CC 15, 16, 23.","22":"Cf. DC 19.","23":"Cf. Lc 24,19; SP 13.","24":"Cf. Flp 2,5.","25":"Cf. CC 4.","26":"Cf. SP 6.","27":"Cf. CC 5.","28":"Cf. CC 4.","29":"Cf. MCH 143.","30":"SP 7.","31":"Cf. CC 62.","32":"Cf. MS 39.","33":"Cf. MCH 145; SP 15, 21.1.","34":"Cf. CC 3.","35":"Cf. CC 40.","36":"Cf. CC 3.","37":"Cf. CC 34.","38":"Cf. CC 68, 135.","39":"Cf. CC 4.","40":"Cf. CC 39; MS 39.","41":"Cf. CC 40.","42":"Cf. CC 10, 17.","43":"Cf. CC 72.","44":"Cf. CC 8.","45":"Cf. Ez 36,26.","46":"EG 88, 288.","47":"Aut 270.","48":"Cf. MS 72.","49":"CC 2.","50":"CC 9.","51":"EV 2.","52":"PTV 8.","53":"Jn 4,23.","54":"Aut 445.","55":"HAC 37.","56":"CC 7.","57":"MS 69.","58":"Cf. CC 46; SP 3, 5.","59":"Cf. CC 13.","60":"Cf. SP 7; 21.4.","61":"SP 21; cf. MS 44.","62":"MCH 151; Cf. SP 7, 15; MS 42.","63":"Mc 16,15.","64":"LG 5.","65":"Cf. MS 59-60.","66":"Cf. CC 47","67":"Cf. CC 48.","68":"MS 65.","69":"Palabras improvisadas del Papa Francisco a los participantes en el XXV Capitulo General, 11 de septiembre 2015.","70":"EG 1.","71":"MS 5.","72":"Cf. DiM 1.","73":"MM 21.","74":"MM 21.","75":"Cf. FRANCISCO<i>, La fuerza de la vocación: La vida consagrada hoy <\/i>(Publicaciones Claretianas, Madrid, 2018), p.<i> <\/i>52<i>.<\/i>","76":"GE 169.","77":"Cf. GE 174-175.","78":"CC 52.","79":"CPR 49.","80":"Cf. CIC 660, § 1.","81":"CPR 49.","82":"Dir 157.","83":"Cf. SP 13.3.","84":"Cf. CC 12.","85":"Cf. PI 34; 1 F 3.","86":"MCH 132.","87":"CC 68.","88":"Dir 157.","89":"Cf. PI 17.","90":"Cf. PI 18.","91":"Dir 157.","92":"MS 65.","93":"Cf. GE 35.","94":"RFIS 20.","95":"Dir 252c.","96":"Gal 5,1.","97":"MCH 170; cf. MS 7.","98":"Cf. VC 84-95.","99":"Cf. FRANCISCO, <i>Carta Apostólica a todos los consagrados <\/i>(21 de noviembre de 2014).","100":"VC 84.","101":"EMP 24.","102":"Cf. MS 49.","103":"Cf. SP 17; TM 22; EMP 17.","104":"Cf. PI 91.","105":"Cf. EN 20; EG 117.","106":"Cf. VC 98.","107":"Cf. BOCOS Aquilino, <i>La obligada vía de la interculturalidad, <\/i>p. 23<i>;<\/i> MS 75.3.","108":"Cf. RPH 21; PI 18.","109":"MS 5.","110":"Cf. PDV 5.","111":"Cf. SP 1.","112":"Cf. EMP 4.","113":"Cf. PDV 6; SP 1.1.","114":"Cf. SP 1.2.","115":"Cf. PDV 7.","116":"Cf. SP 1.1; EG 66.","117":"Cf. SP 1.2.","118":"Cf. SP 1.1.","119":"Cf. PDV 7; MV 15; MS 14.","120":"Cf. PDV 7; AL 280-286.","121":"Cf. HAC 2c.; EG 67; AL 32 -49.","122":"Cf. SP 1.1; EG 62.","123":"Cf. SP 1.2.","124":"Cf. PDV 6; EMP 10.","125":"Cf. PDV 6.","126":"Cf. SP 1.2; HAC 2d.","127":"Cf. EG 211.","128":"Cf. PDV 6.","129":"Cf. PDV 7; PTV 38.","130":"Cf. LS 216-232; MS 6.","131":"Cf. MS 17; LS 47.","132":"Cf. CV 74, 89.","133":"SP 2; HAC 4.","134":"Cf. MS 6-16.","135":"Cf. EG 93-97, 102.","136":"MS 20.","137":"Cf. SP 3.1; HAC 7.","138":"SP 3.1; Cf. MS 29.","139":"Cf. CPR 11; SP 13; HAC 8-11.","140":"Cf. SP 3.2, 3.3; MS 68.4."}},{"id":"c2","title":"El proceso de configuración con Cristo misionero","short":"Capítulo 2","kind":"main","pages":[71,92],"blocks":[{"t":"h","l":2,"h":"INTRODUCCIÓN"},{"t":"p","h":"El objetivo fundamental de nuestra formación, la unión y configuración con Cristo según el carisma claretiano, es <i>un proceso transformador<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"1\">1<\/sup> que nos impulsa a <i>contemplar asiduamente a Cristo y a imitarlo, penetrados de su Espíritu, hasta que ya no seamos nosotros mismos los que vivamos, sino que sea Cristo quien realmente viva en nosotros<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"2\">2<\/sup>.<i> Sólo de este modo seremos válidos instrumentos del Señor para anunciar el Reino de los cielos<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"3\">3<\/sup>. Este proceso de configuración comienza por la experiencia gratuita de la llamada vocacional que nos consagra para una dedicación total a Dios y a su Reino, nos introduce en la comunión de todos los convocados y reclama de nosotros una respuesta fiel para llevar a cabo la misión de Jesús. Consagración, comunión y misión son, pues, tres dimensiones complementarias de nuestra única vocación a la unión y configuración con Cristo. Tratamos de alcanzar esta unión a través de la entrega total a Dios, expresada en los votos de castidad, pobreza y obediencia. La alcanzamos también y la expresamos por medio de algunas virtudes según nuestro carisma en la Iglesia<sup class=\"fn\" data-u=\"c2\" data-n=\"4\">4<\/sup>.","n":"61","s":1},{"t":"h","l":2,"h":"1. LA EXPERIENCIA VOCACIONAL COMO PUNTO DE PARTIDA"},{"t":"p","h":"La experiencia vocacional comienza con el encuentro con Jesús que vive en y entre nosotros<sup class=\"fn\" data-u=\"c2\" data-n=\"5\">5<\/sup>. La experiencia de sentirnos bendecidos por Dios<sup class=\"fn\" data-u=\"c2\" data-n=\"6\">6<\/sup>, de ser mirados y queridos personalmente por Jesús<sup class=\"fn\" data-u=\"c2\" data-n=\"7\">7<\/sup> y de ser ungidos por el Espíritu<sup class=\"fn\" data-u=\"c2\" data-n=\"8\">8<\/sup> es la que nos impulsa, como a nuestro Fundador, a estar en las cosas del Padre<sup class=\"fn\" data-u=\"c2\" data-n=\"9\">9<\/sup>, a buscar siempre su gloria<sup class=\"fn\" data-u=\"c2\" data-n=\"10\">10<\/sup> y a sentirnos urgidos por el amor de Cristo<sup class=\"fn\" data-u=\"c2\" data-n=\"11\">11<\/sup> para anunciar la buena nueva a los pobres<sup class=\"fn\" data-u=\"c2\" data-n=\"12\">12<\/sup>.","n":"62","s":1},{"t":"p","h":"La vocación es una alianza<sup class=\"fn\" data-u=\"c2\" data-n=\"13\">13<\/sup> que hace de nuestra vida un diálogo constante con el Dios que nos llama y nos consagra totalmente a Él. Esta relación personal, vivida en la obediencia de la fe, en la apertura de la esperanza y en la fuerza del amor, es el fundamento de la vida misionera. Por eso debe informar nuestra vida entera en la más íntima comunión con la Iglesia<sup class=\"fn\" data-u=\"c2\" data-n=\"14\">14<\/sup>.","n":"63","s":1},{"t":"p","h":"El llamamiento de Dios, que se da en el origen de la consagración religiosa y de nuestro itinerario formativo, <i>sólo se explica por el amor que Él tiene a la persona llamada. Este amor es absolutamente gratuito, personal y único<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"15\">15<\/sup>. Ha sido derramado en nuestros corazones por el Espíritu<sup class=\"fn\" data-u=\"c2\" data-n=\"16\">16<\/sup>. <i>Es el don primero y más necesario, por el que nos configuramos como verdaderos discípulos de Cristo<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"17\">17<\/sup>. La experiencia vocacional consiste, pues, en el don del amor, el único que no pasa nunca<sup class=\"fn\" data-u=\"c2\" data-n=\"18\">18<\/sup> y el más necesario para un misionero<sup class=\"fn\" data-u=\"c2\" data-n=\"19\">19<\/sup>.","n":"64","s":1},{"t":"p","h":"Por eso, debemos pedirlo insistentemente y estar convencidos de que el Padre concede siempre su Espíritu a los que se lo piden<sup class=\"fn\" data-u=\"c2\" data-n=\"20\">20<\/sup>. Sólo si acogemos y hacemos vida este don podemos arder y abrasar por donde pasamos<sup class=\"fn\" data-u=\"c2\" data-n=\"21\">21<\/sup>.","n":"65","s":1},{"t":"p","h":"La llamada a seguir a Cristo abarca toda nuestra persona<sup class=\"fn\" data-u=\"c2\" data-n=\"22\">22<\/sup> y exige de nosotros una respuesta en fe y amor. La fidelidad vocacional brota de una fe viva, la misma que <i>inflamó a los Profetas, Apóstoles y Mártires y la que movió a muchos predicadores de la divina palabra a abrazar con ánimo alegre la pobreza, la abnegación y el sacrificio para dilatar el Reino de Cristo<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"23\">23<\/sup>. Implica también un amor que se entrega totalmente y sin reservas. Únicamente este amor de carácter nupcial y que abarca toda la afectividad de la persona permitirá motivar y sostener las renuncias y las cruces que necesariamente encuentra quien quiere perder su vida por Cristo y por el Evangelio<sup class=\"fn\" data-u=\"c2\" data-n=\"24\">24<\/sup>.","n":"66","s":1},{"t":"h","l":2,"h":"2. LA COMUNIDAD COMO EXPRESIÓN DE LA CONVOCACIÓN MISIONERA"},{"t":"p","h":"Hemos sido llamados personalmente por Jesús para vivir en comunión con Él y con los demás convocados, para compartir su estilo de vida y su destino<sup class=\"fn\" data-u=\"c2\" data-n=\"25\">25<\/sup>, para ser signo de la comunión inaugurada por Él. Esta comunión encuentra su raíz última en el multiforme y rico conjunto de relaciones que brota de la Trinidad y se prolonga en la comunión de la Iglesia, entendida como sacramento, o sea, signo e instrumento de la unión con Dios y de la unidad de todo el género humano en Cristo<sup class=\"fn\" data-u=\"c2\" data-n=\"26\">26<\/sup>. La llamada de Dios, aunque es siempre personal, se hace también vocación comunitaria, pues cada uno ha sido llamado para formar con los otros una sola alma y un solo corazón<sup class=\"fn\" data-u=\"c2\" data-n=\"27\">27<\/sup>. Antes que tarea humana, esta comunión es siempre un fruto del Espíritu<sup class=\"fn\" data-u=\"c2\" data-n=\"28\">28<\/sup> e imagen de la Santísima Trinidad.","n":"67","s":1},{"t":"p","h":"Para nosotros, como para nuestro Fundador, la comunidad misionera tiene su principio en el Dios que nos comunica un idéntico espíritu<sup class=\"fn\" data-u=\"c2\" data-n=\"29\">29<\/sup> para que, viviendo una vida perfectamente común y apostólica<sup class=\"fn\" data-u=\"c2\" data-n=\"30\">30<\/sup>, lleguemos a ser uno como el Padre, el Hijo y el Espíritu, a fin de que el mundo crea<sup class=\"fn\" data-u=\"c2\" data-n=\"31\">31<\/sup>. Esta comunión se edifica cuando nuestra vida está informada por el amor que el Espíritu Santo ha derramado en nuestros corazones. La vida fraterna se realiza plenamente en la eucaristía, signo de unidad y vínculo de caridad. Se alimenta también en la oración, se fomenta con un estilo de vida familiar que asume y armoniza los valores y carismas de cada uno y se expresa en la participación en el gobierno y en la ordenación de la comunidad<sup class=\"fn\" data-u=\"c2\" data-n=\"32\">32<\/sup>. Se perfecciona también con el sacramento de la reconciliación, que nos devuelve la paz con los hermanos<sup class=\"fn\" data-u=\"c2\" data-n=\"33\">33<\/sup>. La comunión expresada y fortalecida en la comunidad misionera es esencial para nosotros, hasta el punto de que <i>la iniciación del claretiano no es posible sino en el seno de una comunidad<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"34\">34<\/sup>, que es <i>nuestra primera palabra misionera<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"35\">35<\/sup>.","n":"68","s":1},{"t":"h","l":2,"h":"3. LA MISIÓN COMO CLAVE FORMATIVA CENTRAL"},{"t":"p","h":"<i>¡Somos misioneros! La Misión pertenece a nuestra identidad<\/i> más profunda<sup class=\"fn\" data-u=\"c2\" data-n=\"36\">36<\/sup>. La misión <i>es el núcleo de nuestra vocación<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"37\">37<\/sup>. Puesto que formamos en la Iglesia un Instituto verdadera y plenamente apostólico<sup class=\"fn\" data-u=\"c2\" data-n=\"38\">38<\/sup>, la misión, entendida como servicio misionero de la Palabra, ha de estar presente en todo el proceso formativo. Esta afecta a la persona entera en lo más íntimo. Implica un modo de ser, de actuar y de significar<sup class=\"fn\" data-u=\"c2\" data-n=\"39\">39<\/sup> en relación con Dios, con la propia comunidad y con las personas a las que somos enviados. Debe impregnar, por eso, toda nuestra personalidad de consagrados y ser vivida desde las diversas dimensiones: corporal, afectiva, intelectual, moral, espiritual, carismática, comunitaria, apostólica y ecológica. En efecto, desde la experiencia de Claret, misionero apostólico en todos los momentos y ámbitos de su vida, la palabra <i>misionero<\/i> tiene para nosotros, un sentido integral: <i>comunidad de vida con Jesús y en Jesús, y vivencia efectiva de los llamados consejos evangélicos en el anuncio del Reino o evangelización<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"40\">40<\/sup><i>.<\/i>","n":"69","s":1},{"t":"p","h":"En la formación para la misión hay que articular bien teoría y praxis, a través de todas las etapas, teniendo en cuenta de manera particular las exigencias, opciones y sujetos preferenciales de nuestra misión<sup class=\"fn\" data-u=\"c2\" data-n=\"41\">41<\/sup>. Debemos integrar, por un lado, el cultivo de las disciplinas teológicas, el conocimiento del mundo y de los hombres y el aprendizaje de las técnicas de apostolado<sup class=\"fn\" data-u=\"c2\" data-n=\"42\">42<\/sup> y, por otro, la realización de experiencias apostólicas formativas<sup class=\"fn\" data-u=\"c2\" data-n=\"43\">43<\/sup>, incluso fuera del ámbito del propio Organismo de adscripción. Así se favorece la capacitación para la acción apostólica directa y el crecimiento de todos aquellos dinamismos de la personalidad necesarios para desempeñar la misión con madurez y espíritu universal.","n":"70","s":1},{"t":"p","h":"La formación claretiana ha de buscar en María los rasgos identificadores del verdadero misionero: <i>capacidad contemplativa, adhesión profunda a Jesús, caridad pastoral y misericordia frente al hombre en miseria, disponibilidad, identificación con los pobres de este mundo, fortaleza ante la cruz y la muerte, inquebrantable esperanza, transparente comunicación de la Palabra<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"44\">44<\/sup>.","n":"71","s":1},{"t":"h","l":2,"h":"4. LOS VOTOS RELIGIOSOS"},{"t":"p","h":"Nuestra existencia misionera consiste en<i> representar en la Iglesia la virginidad, la pobreza y la obediencia de Cristo, dedicados a la predicación del Evangelio<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"45\">45<\/sup>, de tal modo que la consagración se convierte para nosotros en la primera forma de evangelizar<sup class=\"fn\" data-u=\"c2\" data-n=\"46\">46<\/sup>. Así expresamos nuestra donación total a Dios, <i>bien absoluto<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"47\">47<\/sup>. El Fundador vivió intensamente esta unión con el Señor, al imitar la vida de los apóstoles, siguiendo, como ellos, a Cristo, en completa abnegación, para el anuncio del Evangelio<sup class=\"fn\" data-u=\"c2\" data-n=\"48\">48<\/sup>.","n":"72","s":1},{"t":"p","h":"La vivencia fiel de los votos se hace posible cuando, sostenidos por el don vocacional, nos preocupamos por crecer en madurez humana, vida de fe, sentido de comunión y misión. En esta perspectiva nos orientan las Constituciones<sup class=\"fn\" data-u=\"c2\" data-n=\"49\">49<\/sup>. Una formación adecuada no sólo ha de prestar atención a los contenidos humanos y a la dimensión teológica, apostólica y comunitaria de los votos; requiere también cuidar la práctica concreta y la vivencia de sus exigencias. El estilo de vida que surge de los consejos evangélicos supone una ascesis y una continua conversión, pero va más allá de la simple renuncia, para constituir al consagrado en hombre libre y disponible para Dios y para los hermanos, a semejanza de Cristo<sup class=\"fn\" data-u=\"c2\" data-n=\"50\">50<\/sup>. Ello supone <i>vivir como consagrados dentro de la Iglesia, siendo testigos y anunciadores de que el Reino de Dios ha llegado, crece y llegará a plenitud en la última venida de Cristo, a quien esperamos<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"51\">51<\/sup>. Hemos de esforzarnos por lograr la unidad de vida entre consagración y misión, oblación a Dios y entrega a los hermanos, alabanza y servicio<sup class=\"fn\" data-u=\"c2\" data-n=\"52\">52<\/sup>.","n":"73","s":1},{"t":"h","l":3,"h":"4.1. Castidad"},{"t":"p","h":"El carisma de castidad que recibió nuestro Fundador estaba orientado a su vocación de evangelizador<sup class=\"fn\" data-u=\"c2\" data-n=\"53\">53<\/sup>, a la que tenía que entregarse con una dedicación total y una liberación plena. Por la castidad consagrada la configuración con Cristo llega a ser transparencia suya. Él quiere poseer todo nuestro corazón, cuerpo y alma, a fin de que la gente no vea en nosotros nada del hombre viejo sino a Jesús<sup class=\"fn\" data-u=\"c2\" data-n=\"54\">54<\/sup>.","n":"74","s":1},{"t":"p","h":"La castidad consagrada es un don que se recibe con alegría y se cultiva con ahínco mediante la aceptación consciente de este don y la celebración del amor trascendente propio del celibato (intimidad con Cristo y amor centrado en Cristo para los demás). Esto es fundamental para establecer límites personales saludables en las muchas relaciones que forman parte necesaria de nuestra vida y misión. La consagración total y exclusiva con Cristo a las cosas del Padre, la causa del Reino, el don del Espíritu y el ejemplo de María en la vivencia del don son el fundamento de la castidad claretiana<sup class=\"fn\" data-u=\"c2\" data-n=\"55\">55<\/sup>. Manifiestan la gloria en la debilidad y se convierten en fuente de comunión fraterna y de fecundidad apostólica.","n":"75","s":1},{"t":"p","h":"La castidad del claretiano es:","n":"76","s":1},{"t":"p","h":"a. Misionera: nos permite darnos con total disponibilidad al Reino de Dios<sup class=\"fn\" data-u=\"c2\" data-n=\"56\">56<\/sup>.","n":"76"},{"t":"p","h":"b. Testimoniante: expresa un modo intensamente evangélico de amar, como Cristo y como María, al Padre y a los hermanos<sup class=\"fn\" data-u=\"c2\" data-n=\"57\">57<\/sup>.","n":"76"},{"t":"p","h":"c. Profética y escatológica: vivida en amor desprendido y, a la vez, entregado, sirve <i>de instancia crítica al erotismo, a la comercialización del sexo, a la visión hedonista y egoísta de la vida<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"58\">58<\/sup> y alienta en toda la esperanza de la vida futura<sup class=\"fn\" data-u=\"c2\" data-n=\"59\">59<\/sup>.","n":"76"},{"t":"p","h":"Las exigencias de nuestra misión y el hecho de que <i>la observancia de esta castidad afecta a las más profundas inclinaciones de nuestra naturaleza<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"60\">60<\/sup>, hacen indispensable el desarrollo de:","n":"77","s":1},{"t":"p","h":"a. La madurez espiritual, que se apoya en una fe profunda y en un amor ardiente y apasionado, como Claret, a Cristo<sup class=\"fn\" data-u=\"c2\" data-n=\"61\">61<\/sup>, a la Virgen y a la Iglesia, y es garantía de victoria en las tentaciones<sup class=\"fn\" data-u=\"c2\" data-n=\"62\">62<\/sup>.","n":"77"},{"t":"p","h":"b. La madurez afectiva, que nos permita, por un lado, <i>integrar la sexualidad en un amor oblativo y universal, con normalidad, sin miedos ni inhibiciones<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"63\">63<\/sup> y, por otro, desarrollar la capacidad de colaborar con todos, hombres y mujeres, en la práctica apostólica<sup class=\"fn\" data-u=\"c2\" data-n=\"64\">64<\/sup>. Esta madurez comporta un conocimiento adecuado de la sexualidad masculina y femenina con sus diversas connotaciones, y de la propia sexualidad personal; la adecuada integración de las experiencias pasadas; la verbalización de los sentimientos, problemas, crisis; la prudencia en el uso de los medios de comunicación social y unas relaciones auténticas y saludables con todas las personas.","n":"77"},{"t":"p","h":"c. La capacidad de amor personal, tanto por lo que se refiere al amor comprensivo de los otros como al recto amor a uno mismo: respeto, aceptación y valoración adecuada de sí; debido control en el plano sexual y afectivo; preocupación por la integración y desarrollo armónico de los dones y capacidades<sup class=\"fn\" data-u=\"c2\" data-n=\"65\">65<\/sup>. También es necesario conocer los limites propios de cada relación para cuidar la integridad de las personas implicadas y mantener esta relación sana.","n":"77"},{"t":"p","h":"La pedagogía de la castidad<sup class=\"fn\" data-u=\"c2\" data-n=\"66\">66<\/sup> implica:","n":"78","s":1},{"t":"p","h":"a. Amar y recibir con gozo el don concedido. La castidad representa un signo de elección y confianza de Dios en nosotros.","n":"78"},{"t":"p","h":"b. Cultivarlo y vivir fielmente todas sus implicaciones. La confianza en Dios genera confianza en nosotros mismos para cumplir nuestros compromisos. Esta confianza debe prevalecer sobre las dificultades internas o externas que se nos presentan y que nos imponen ciertas renuncias<sup class=\"fn\" data-u=\"c2\" data-n=\"67\">67<\/sup>.","n":"78"},{"t":"p","h":"c. Practicar algunos medios: la intensificación de la relación con Dios, la devoción filial a María, el cultivo de la amistad y de la vida comunitaria, el evitar los peligros, la ocupación asidua, la prudencia pastoral y profesional, el buen uso de las nuevas tecnologías de comunicación social, el cuidado por la salud física y espiritual, el discernimiento y el acompañamiento personal, tanto espiritual como psicológico<sup class=\"fn\" data-u=\"c2\" data-n=\"68\">68<\/sup>.","n":"78"},{"t":"h","l":3,"h":"4.2. Pobreza"},{"t":"p","h":"La pobreza fue para nuestro Fundador una exigencia de su vocación misionera. Seguía e imitaba a Jesucristo pobre, conforme al Evangelio, como la mejor manera de configurarse con su misión evangelizadora<sup class=\"fn\" data-u=\"c2\" data-n=\"69\">69<\/sup>, de dar credibilidad a su ministerio<sup class=\"fn\" data-u=\"c2\" data-n=\"70\">70<\/sup> y de hacer frente al afán de riquezas que existe en el mundo<sup class=\"fn\" data-u=\"c2\" data-n=\"71\">71<\/sup>.","n":"79","s":1},{"t":"p","h":"El motivo por el que profesamos de por vida la pobreza evangélica está en Cristo: en su persona, en su conducta y en su doctrina<sup class=\"fn\" data-u=\"c2\" data-n=\"72\">72<\/sup>. Su forma de vida expresa que <i>todo lo recibe del Padre y todo lo devuelve en el amor<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"73\">73<\/sup>, de solidaridad con la humanidad<sup class=\"fn\" data-u=\"c2\" data-n=\"74\">74<\/sup>, de compromiso total con la misión<sup class=\"fn\" data-u=\"c2\" data-n=\"75\">75<\/sup> y de una opción preferencial por los pobres y oprimidos<sup class=\"fn\" data-u=\"c2\" data-n=\"76\">76<\/sup>. Encontramos también esta forma de vida en María, la primera entre los pobres del Señor, y en los apóstoles, que, para seguir al Señor, lo abandonaron todo.","n":"80","s":1},{"t":"p","h":"Los rasgos que más definen el estilo de pobreza claretiana son:","n":"81","s":1},{"t":"p","h":"a. La confianza filial en el Padre, que nos hace buscar, ante todo, el Reino de Dios y su justicia<sup class=\"fn\" data-u=\"c2\" data-n=\"77\">77<\/sup>.","n":"81"},{"t":"p","h":"b. La comunión de bienes como expresión del amor fraterno.","n":"81"},{"t":"p","h":"c. Un estilo de vida sencillo, sobrio, sensible y acorde al contexto de cada lugar.","n":"81"},{"t":"p","h":"d. La comunión de bienes, tanto materiales como espirituales, con los pobres y en su servicio.","n":"81"},{"t":"p","h":"e. La solidaridad con los que sufren la miseria, la injusticia, la opresión, la falta de voz para defender sus derechos, hasta llegar a identificarnos con ellos<sup class=\"fn\" data-u=\"c2\" data-n=\"78\">78<\/sup> como una <i>Congregación pobre y para los pobres<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"79\">79<\/sup>.","n":"81"},{"t":"p","h":"f. El desprendimiento exigido por nuestra vida misionera<sup class=\"fn\" data-u=\"c2\" data-n=\"80\">80<\/sup>.","n":"81"},{"t":"p","h":"g. El testimonio colectivo como signo de credibilidad<sup class=\"fn\" data-u=\"c2\" data-n=\"81\">81<\/sup>.","n":"81"},{"t":"p","h":"Para lograr que seamos misioneros verdaderamente pobres, de hecho y de espíritu, debemos asimilar la propia naturaleza de la pobreza evangélica. Esta se concreta en:","n":"82","s":1},{"t":"p","h":"a. Procurar evitar todo lo que es contrario a ella: retener, adquirir, usar cosa alguna como propia.","n":"82"},{"t":"p","h":"b. Afrontar la tendencia a la mundanidad espiritual<sup class=\"fn\" data-u=\"c2\" data-n=\"82\">82<\/sup>.","n":"82"},{"t":"p","h":"c. Practicar la ley común del trabajo.","n":"82"},{"t":"p","h":"d. Compartir la condición de los pobres.","n":"82"},{"t":"p","h":"e. Alegrarnos cuando experimentemos sus efectos<sup class=\"fn\" data-u=\"c2\" data-n=\"83\">83<\/sup>.","n":"82"},{"t":"p","h":"f. Vivir con simplicidad.","n":"82"},{"t":"p","h":"g. Cuidar los bienes comunitarios.","n":"82"},{"t":"p","h":"h. <i>Acoger, escuchar, acompañar y cuidar a los más frágiles de la tierra<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"84\">84<\/sup>.","n":"82"},{"t":"p","h":"i. Inspirar nuestras empresas apostólicas en la búsqueda de un mejor servicio al Evangelio y no en intereses materiales<sup class=\"fn\" data-u=\"c2\" data-n=\"85\">85<\/sup>.","n":"82"},{"t":"p","h":"j. Salir hacia las periferias de pobreza, exclusión y descarte, con actitudes de misericordia, compasión y profetismo<sup class=\"fn\" data-u=\"c2\" data-n=\"86\">86<\/sup>.","n":"82"},{"t":"p","h":"k. Asumir y secundar la doctrina social de la Iglesia en la realidad local<sup class=\"fn\" data-u=\"c2\" data-n=\"87\">87<\/sup>.","n":"82"},{"t":"p","h":"l. Adquirir los conocimientos elementales de economía y administración<sup class=\"fn\" data-u=\"c2\" data-n=\"88\">88<\/sup>.","n":"82"},{"t":"p","h":"Las exigencias de nuestra misión y el hecho de que la práctica de la pobreza afecta a esa inclinación profunda de nuestro ser que es el afán de tener, hacen indispensable el desarrollo de:","n":"83","s":1},{"t":"p","h":"a. La madurez espiritual adecuada para centrar nuestra vida <i>en Jesucristo pobre, contemplado, amado y seguido<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"89\">89<\/sup>. La fuente de una auténtica solidaridad y de una verdadera opción por los pobres, brota de un corazón pobre que sigue a Jesucristo pobre.","n":"83"},{"t":"p","h":"b. La primacía del ser sobre el tener. Hemos de ser más teniendo menos y cuestionándonos si lo que decimos necesitar lo necesitamos verdaderamente<sup class=\"fn\" data-u=\"c2\" data-n=\"90\">90<\/sup>. Muchas veces, la decadencia del celo misionero comienza con el amor hacia el dinero, el apetito de poseer; después viene la vanidad y al final, el orgullo y la soberbia<sup class=\"fn\" data-u=\"c2\" data-n=\"91\">91<\/sup>. La formación para vivir la pobreza implica potenciar la capacidad de distinguir entre las necesidades vitales y los deseos vanos y optar por las renuncias que nos hagan más libres para la misión.","n":"83"},{"t":"p","h":"c. El amor y servicio a los pobres. <i>No se puede ser claretiano como si los pobres no existieran<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"92\">92<\/sup>. La relación personalizada con ellos, que son presencia vicaria del Señor<sup class=\"fn\" data-u=\"c2\" data-n=\"93\">93<\/sup>, es esencial al discípulo de Cristo. Una formación sin esta clara referencia no tendrá alma evangélica<sup class=\"fn\" data-u=\"c2\" data-n=\"94\">94<\/sup>.","n":"83"},{"t":"p","h":"La pluralidad de formas de comunidades <i>insertas en ambientes populares y periféricos, o cercanas a dichas realidades, son expresión significativa de la “opción preferencial por los pobres”, porque no es suficiente trabajar para ellos, sino que es preciso vivir con ellos y, en cuanto sea posible, como ellos<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"95\">95<\/sup>. Las comunidades insertas están llamadas a ser un medio generador de comunión con los más necesitados, que, por la vía de la praxis concreta, hará radicar en el corazón del formando una opción que le tocará vivenciar en variadas estructuras y situaciones de vida<sup class=\"fn\" data-u=\"c2\" data-n=\"96\">96<\/sup>. En un contexto de mayorías empobrecidas y oprimidas, esta expresión del radicalismo evangélico nos impulsa a todos a vivir con más autenticidad nuestra opción por los pobres<sup class=\"fn\" data-u=\"c2\" data-n=\"97\">97<\/sup>. Descubrir en la práctica de la pobreza también una pedagogía de libertad, desprendimiento, de solidaridad, de ser alternativa en el mundo materialista.","n":"84","s":1},{"t":"h","l":3,"h":"4.3. Obediencia"},{"t":"p","h":"La obediencia fue, para nuestro Fundador, que se sentía plenamente identificado con todo lo que comportaba el título de “misionero apostólico”, un elemento configurador de su personalidad. La entendió y la vivió desde el misterio de la filiación y de la misión de Cristo, apasionado, como Él, de la voluntad del Padre, y con un fuerte sentido eclesial que se explicitaba en la necesidad de ser enviado<sup class=\"fn\" data-u=\"c2\" data-n=\"98\">98<\/sup>.","n":"85","s":1},{"t":"p","h":"El fundamento de nuestra obediencia misionera se encuentra en la imitación hasta la configuración con el misterio de Cristo obediente<sup class=\"fn\" data-u=\"c2\" data-n=\"99\">99<\/sup> en el ejemplo de la Virgen María<sup class=\"fn\" data-u=\"c2\" data-n=\"100\">100<\/sup>, en el don del Espíritu<sup class=\"fn\" data-u=\"c2\" data-n=\"101\">101<\/sup> y en la mediación de la Congregación<sup class=\"fn\" data-u=\"c2\" data-n=\"102\">102<\/sup>.","n":"86","s":1},{"t":"p","h":"En la formación para la obediencia hay que acentuar aquellos rasgos que más definen el estilo de obediencia claretiana:","n":"87","s":1},{"t":"p","h":"a. Nace como exigencia de la propia vocación misionera<sup class=\"fn\" data-u=\"c2\" data-n=\"103\">103<\/sup>; como actitud de fe viva que busca, personal y comunitariamente, estar en relación permanente con la voluntad del Padre para conocerla y cumplirla<sup class=\"fn\" data-u=\"c2\" data-n=\"104\">104<\/sup>.","n":"87"},{"t":"p","h":"b. Pasa por la mediación de la comunidad<sup class=\"fn\" data-u=\"c2\" data-n=\"105\">105<\/sup> y del superior, a quien los misioneros hemos de someternos por el Señor<sup class=\"fn\" data-u=\"c2\" data-n=\"106\">106<\/sup>.","n":"87"},{"t":"p","h":"c. Posee unas notas peculiares: pronta y perfecta<sup class=\"fn\" data-u=\"c2\" data-n=\"107\">107<\/sup>, dispuesta para la misión<sup class=\"fn\" data-u=\"c2\" data-n=\"108\">108<\/sup>.","n":"87"},{"t":"p","h":"Las exigencias de nuestra misión y el hecho de que la práctica de la obediencia afecta a esas inclinaciones de nuestro ser que llamamos el afán de poder sobre otros, y la autonomía para decidir y realizar sus propios planes, hacen indispensable el desarrollo de:","n":"88","s":1},{"t":"p","h":"a. La madurez espiritual adecuada para encarnar el misterio de la obediencia de Cristo en la ascética cotidiana de la abnegación de uno mismo, en la mortificación de la pereza o de la veleidad y en la perseverancia.","n":"88"},{"t":"p","h":"b. Una libertad madura y responsable que, en la creatividad y en la renuncia, en la oferta de los dones personales y en el reconocimiento de la misión común, vive la plena dedicación al proyecto apostólico.","n":"88"},{"t":"p","h":"c. Una toma de conciencia del «nosotros» comunitario que dé la dimensión fraterna a la corresponsabilidad, al ejercicio de la autoridad y a la misión compartida.","n":"88"},{"t":"p","h":"La formación para la obediencia implica:","n":"89","s":1},{"t":"p","h":"a. Escuchar con docilidad la Palabra de Dios concretada en las Constituciones como proyecto de vida y lugar privilegiado en el que se nos muestra la voluntad de Dios<sup class=\"fn\" data-u=\"c2\" data-n=\"109\">109<\/sup>.","n":"89"},{"t":"p","h":"b. Ser dóciles a las orientaciones del magisterio de la Iglesia y de la Congregación.","n":"89"},{"t":"p","h":"c. Asumir con madurez psicológica y de fe un concepto adecuado de lo que supone en nuestra vida misionera la obediencia religiosa vivida con espíritu de fe y de comunión fraterna, discernimiento, corresponsabilidad y justa autonomía<sup class=\"fn\" data-u=\"c2\" data-n=\"110\">110<\/sup>.","n":"89"},{"t":"p","h":"d. Fomentar un sano espíritu crítico, el desarrollo de la capacidad de creatividad y la confianza en los superiores.","n":"89"},{"t":"p","h":"e. Suscitar actitudes espirituales de discernimiento, de diálogo y de búsqueda personal y comunitaria de la voluntad de Dios. Se educa está actitud en la práctica cotidiana del examen-discernimiento.","n":"89"},{"t":"p","h":"f. Cumplir con exactitud y generosidad los compromisos apostólicos y los cargos comunitarios que se nos han confiado.","n":"89"},{"t":"p","h":"g. Practicar el diálogo y la corresponsabilidad con aquellos con quienes colaboramos en nuestros apostolados.","n":"89"},{"t":"p","h":"h. Discernir los dones de naturaleza y de gracia y emplearlos con rectitud, en congruencia con nuestro carisma y las necesidades de la Iglesia.","n":"89"},{"t":"p","h":"i. Afrontar la tendencia al clericalismo.","n":"89"},{"t":"p","h":"j. Evitar el abuso de poder en el ejercicio de la autoridad.","n":"89"},{"t":"h","l":2,"h":"5. LAS VIRTUDES APOSTÓLICAS"},{"t":"p","h":"La configuración con Cristo misionero se expresa también por medio de otras virtudes apostólicas según nuestro carisma propio en la Iglesia que forman el carácter misionero claretiano. El claretiano ha de asumir su itinerario formativo como un camino de transformación personal en el que va adquiriendo las virtudes necesarias para configurarse con Cristo misionero y constituirse así un hombre apostólico, al estilo de Claret. Tal como decía nuestro Fundador, el misionero <i>ha de empezar por hacer y practicar, y después enseñar<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"111\">111<\/sup>. De entre las más necesarias para el misionero, prestamos una atención especial a las que vivió el Fundador y a las que nos proponen las Constituciones<sup class=\"fn\" data-u=\"c2\" data-n=\"112\">112<\/sup>.","n":"90","s":1},{"t":"h","l":3,"h":"5.1. Caridad apostólica"},{"t":"p","h":"A nuestro Fundador la caridad de Cristo le urgía en forma de celo apostólico. Él se decía a sí mismo y decía a los demás que el verdadero misionero es <i>un hombre que arde en caridad, que abrasa por donde pasa... y que procura por todos los medios encender a todo el mundo en el fuego del divino amor<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"113\">113<\/sup>. Inflamados por este mismo fuego, los misioneros han llegado, llegan y llegarán hasta los confines del mundo para anunciar la Palabra de Dios, de modo que pueden decirse a sí mismos las palabras de Pablo, que Claret convirtió en lema de su escudo arzobispal: <i>La caridad de Cristo nos urge<\/i><sup class=\"fn\" data-u=\"c2\" data-n=\"114\">114<\/sup>. Esta virtud ha sido una de las más cuidadas en la tradición de la Congregación<sup class=\"fn\" data-u=\"c2\" data-n=\"115\">115<\/sup>. Ha alimentado el ardor de muchos de nuestros hermanos, aun a riesgo de sus vidas, en diversas y difíciles empresas misioneras por todo el mundo.","n":"91","s":1},{"t":"p","h":"Nuestras Constituciones reconocen explícitamente que es la virtud más necesaria al misionero<sup class=\"fn\" data-u=\"c2\" data-n=\"116\">116<\/sup>, de la que Jesucristo, la Virgen y los apóstoles son modelos. Ese mismo celo apostólico, que busca que Dios sea conocido, amado, servido y alabado por todos<sup class=\"fn\" data-u=\"c2\" data-n=\"117\">117<\/sup>, es el que debe urgir al misionero. Es la fuerza que origina y sostiene nuestra vocación misionera, sobre todo en momentos de prueba.","n":"92","s":1},{"t":"p","h":"Desde el punto de vista pedagógico, siguen siendo válidos los medios de los que se valía el Fundador<sup class=\"fn\" data-u=\"c2\" data-n=\"118\">118<\/sup>. Hoy debemos destacar singularmente éstos: la meditación de la Palabra de Dios<sup class=\"fn\" data-u=\"c2\" data-n=\"119\">119<\/sup>, la eucaristía<sup class=\"fn\" data-u=\"c2\" data-n=\"120\">120<\/sup>, la vivencia de ser hijos del Corazón de María y el recurso a su eficaz intercesión como madre de la caridad<sup class=\"fn\" data-u=\"c2\" data-n=\"121\">121<\/sup>. También pueden ser hoy una ayuda las experiencias apostólicas, especialmente en campos de marginación, increencia, pobreza<sup class=\"fn\" data-u=\"c2\" data-n=\"122\">122<\/sup>.","n":"93","s":1},{"t":"h","l":3,"h":"5.2. Humildad"},{"t":"p","h":"Nuestro Fundador, para imitar fielmente a Jesucristo, se esforzó por alcanzar la humildad<sup class=\"fn\" data-u=\"c2\" data-n=\"123\">123<\/sup>. A través de ella vivió el proyecto que Dios, el Señor, tenía sobre él. Descubrió también, a través de las humillaciones y persecuciones sufridas durante su vida, que el amor del Padre lo quería humilde<sup class=\"fn\" data-u=\"c2\" data-n=\"124\">124<\/sup>. Para él, esta virtud era el fundamento de la perfección y un medio para agradar a Jesús<sup class=\"fn\" data-u=\"c2\" data-n=\"125\">125<\/sup> y para transmitir fielmente la Palabra, procurando la gloria de Dios y la salvación de los hombres<sup class=\"fn\" data-u=\"c2\" data-n=\"126\">126<\/sup>. Por eso nos la inculca con insistencia. La recomienda a los novicios como fundamento de todas las demás virtudes<sup class=\"fn\" data-u=\"c2\" data-n=\"127\">127<\/sup>. Pide a los estudiantes que busquen en el estudio un camino para llegar a ser ministros idóneos de la Palabra y no para su vanagloria<sup class=\"fn\" data-u=\"c2\" data-n=\"128\">128<\/sup>. Indica, en fin, a todos los misioneros que se configuren con la humildad de Cristo, de manera que se alegren, como los apóstoles, cuando sufran humillaciones por el nombre de Jesús<sup class=\"fn\" data-u=\"c2\" data-n=\"129\">129<\/sup>.","n":"94","s":1},{"t":"p","h":"Nuestras Constituciones nos invitan a vivir la humildad como camino para configurarnos con Aquel que se anonadó a sí mismo tomando la forma de siervo<sup class=\"fn\" data-u=\"c2\" data-n=\"130\">130<\/sup>. Esta humildad, especialmente necesaria para los ministros del Evangelio<sup class=\"fn\" data-u=\"c2\" data-n=\"131\">131<\/sup>, nos dispone para buscar la perfección a la que el Padre nos llama y para acoger su gracia.","n":"95","s":1},{"t":"p","h":"Para formarnos en la humildad, debemos fomentar algunas actitudes y medios: dar toda la gloria a Dios, hacer fructificar los dones, reconocer la verdad de los propios pecados y defectos, aceptar y practicar la corrección fraterna<sup class=\"fn\" data-u=\"c2\" data-n=\"132\">132<\/sup> y, por último, actuar consecuentemente con sencillez, pidiendo perdón, sirviendo a los hermanos y teniendo con todos ellos un trato abierto y sincero<sup class=\"fn\" data-u=\"c2\" data-n=\"133\">133<\/sup>. Estos medios son también una propuesta pedagógica actualizada de cómo los misioneros podemos y debemos formarnos en esta virtud tan esencial y de tanto valor testimoniante para la edificación del Pueblo de Dios.","n":"96","s":1},{"t":"h","l":3,"h":"5.3. Mansedumbre"},{"t":"p","h":"Nuestro Fundador reconoce que Dios lo había prevenido con una especial gracia y bendición de dulzura<sup class=\"fn\" data-u=\"c2\" data-n=\"134\">134<\/sup>, y que este don estaba relacionado con su vocación al ministerio apostólico<sup class=\"fn\" data-u=\"c2\" data-n=\"135\">135<\/sup>. Para corresponder a él, se propuso contemplar a Jesucristo, a quien consideraba como la misma mansedumbre<sup class=\"fn\" data-u=\"c2\" data-n=\"136\">136<\/sup>. Este es el rasgo que caracteriza la relación personal de Jesús con sus discípulos y con la gente. Él, en efecto, no disputa ni grita, no quiebra la caña cascada ni apaga la mecha humeante<sup class=\"fn\" data-u=\"c2\" data-n=\"137\">137<\/sup>. Con su actitud compasiva hacia los desheredados transparenta al Dios que quiere misericordia y no sacrificios<sup class=\"fn\" data-u=\"c2\" data-n=\"138\">138<\/sup>. A medida que aumentaron en la vida del Fundador las situaciones conflictivas y adversas, fue concentrando sus esfuerzos ascéticos en esta virtud. Con este objeto, cambió el examen particular de la humildad por el de la mansedumbre<sup class=\"fn\" data-u=\"c2\" data-n=\"139\">139<\/sup>. En respuesta, el Señor le concedió la gracia del amor a los enemigos<sup class=\"fn\" data-u=\"c2\" data-n=\"140\">140<\/sup>. Claret concede una gran importancia a la mansedumbre en la espiritualidad del misionero<sup class=\"fn\" data-u=\"c2\" data-n=\"141\">141<\/sup> y hasta la considera como señal de vocación a la vida apostólica<sup class=\"fn\" data-u=\"c2\" data-n=\"142\">142<\/sup>.","n":"97","s":1},{"t":"p","h":"Nuestras Constituciones reflejan la experiencia y la doctrina del Fundador sobre esta virtud cuando resaltan su aspecto cristológico y apostólico. También hoy debemos imitar y estar animados por Aquel que es manso y humilde de corazón<sup class=\"fn\" data-u=\"c2\" data-n=\"143\">143<\/sup> y ejercer nuestro ministerio con mansedumbre a fin de ganar los más posibles para Cristo<sup class=\"fn\" data-u=\"c2\" data-n=\"144\">144<\/sup>.","n":"98","s":1},{"t":"p","h":"Se contiene, además, en el texto constitucional una propuesta pedagógica. El misionero debe guardar equilibrio entre el celo, que es ardor y vehemencia de amor<sup class=\"fn\" data-u=\"c2\" data-n=\"145\">145<\/sup>, y la dulzura y bondad de corazón. Hoy la mansedumbre puede traducirse también en:","n":"99","s":1},{"t":"p","h":"a. Evitar cualquier tipo de predominio o de actitud violenta, sin menoscabo de la necesaria valentía para el anuncio del Reino<sup class=\"fn\" data-u=\"c2\" data-n=\"146\">146<\/sup>.","n":"99"},{"t":"p","h":"b. Ser comprensivos ante el ritmo de cada uno, y saber esperar el tiempo de Dios en las personas; detenerse ante el otro y escuchar.","n":"99"},{"t":"p","h":"c. Mostrar paciencia ante la lentitud con la que crece el Reino.","n":"99"},{"t":"p","h":"d. Expresar cordialidad y misericordia en la misión.","n":"99"},{"t":"h","l":3,"h":"5.4. Mortificación"},{"t":"p","h":"Para nuestro Fundador, la mortificación resume toda la ascética, entendida ésta como el esfuerzo perseverante para convertirse plenamente al Evangelio y para vivirlo con transparencia testimonial<sup class=\"fn\" data-u=\"c2\" data-n=\"147\">147<\/sup>. En Claret, mortificarse es privarse del propio gusto para dárselo a Dios<sup class=\"fn\" data-u=\"c2\" data-n=\"148\">148<\/sup>. Esta actitud del Fundador tiene su origen en su devoción a la pasión de Cristo. Ella suscita en él una gran compasión hacia el Crucificado, que lo lleva a practicar ejercicios de penitencia corporal para imitarlo. Sin dejar estos ejercicios, Claret entiende pronto que la pasión se vive, sobre todo, llevando la cruz cada día. En esta línea, adopta una vida sobria y mortificada y acepta con alegría los trabajos, sufrimientos y contrariedades de la predicación itinerante, motivado siempre por la necesidad de configurarse con el Señor en su misterio pascual<sup class=\"fn\" data-u=\"c2\" data-n=\"149\">149<\/sup> y de testimoniar con su vida el Evangelio que predicaba<sup class=\"fn\" data-u=\"c2\" data-n=\"150\">150<\/sup>. Para Claret, la mortificación fue siempre un elemento esencial del testimonio apostólico que da eficacia al anuncio y ayuda a la oración y a la perfección del misionero<sup class=\"fn\" data-u=\"c2\" data-n=\"151\">151<\/sup>. Así lo enseña a los misioneros<sup class=\"fn\" data-u=\"c2\" data-n=\"152\">152<\/sup>.","n":"100","s":1},{"t":"p","h":"Nuestras Constituciones conservan toda la fuerza que el Fundador da a esta virtud, situándola también en esta perspectiva de configuración con Cristo y de ejemplaridad apostólica. Los misioneros nos comprometemos a seguir a Cristo tomando la cruz y perdiendo la vida por Él y por el Evangelio<sup class=\"fn\" data-u=\"c2\" data-n=\"153\">153<\/sup>. Este seguimiento se concreta en:","n":"101","s":1},{"t":"p","h":"a. Mortificar los deseos de la carne, los sentidos y las apetencias de nuestro cuerpo<sup class=\"fn\" data-u=\"c2\" data-n=\"154\">154<\/sup> y elegir aquellas formas de templanza que mejor traducen actualmente esta actitud.","n":"101"},{"t":"p","h":"b. Aceptar con alegría la adversidad, el hambre, la sed, la desnudez, los trabajos, las calumnias, las persecuciones y la tribulación<sup class=\"fn\" data-u=\"c2\" data-n=\"155\">155<\/sup>.","n":"101"},{"t":"p","h":"c. Soportar las propias enfermedades y dolores con humildad y entrega a la voluntad divina<sup class=\"fn\" data-u=\"c2\" data-n=\"156\">156<\/sup>.","n":"101"},{"t":"p","h":"d. Ayudar a los que sufren siendo solidarios y dando incluso la vida por ellos<sup class=\"fn\" data-u=\"c2\" data-n=\"157\">157<\/sup>.","n":"101"},{"t":"p","h":"Estas propuestas ascéticas pueden ampliarse a otras según las condiciones de tiempo y de lugar. Por ejemplo:","n":"102","s":1},{"t":"p","h":"a. La renuncia a la comodidad, a la instalación y a los apegos a personas y cosas<sup class=\"fn\" data-u=\"c2\" data-n=\"158\">158<\/sup>.","n":"102"},{"t":"p","h":"b. La moderación responsable en el uso de las redes digitales y de las tecnologías de la información y comunicación.","n":"102"},{"t":"p","h":"c. La asunción serena de los errores, fracasos y frustraciones.","n":"102"},{"t":"p","h":"d. La capacidad de aceptar con realismo las personas, las situaciones y el ritmo cotidiano, superando la impaciencia, la nostalgia y la rutina.","n":"102"},{"t":"p","h":"e. La permanente revisión de nuestras, actitudes personales y comunitarias y de las posiciones apostólicas.","n":"102"},{"t":"p","h":"Todo debe apuntar, en definitiva, a transparentar la gloria de Jesús en la muerte a nosotros mismos<sup class=\"fn\" data-u=\"c2\" data-n=\"159\">159<\/sup>, siguiendo el ejemplo de los mártires de ayer y de hoy, especialmente de nuestros hermanos beatos.","n":"103","s":1}],"notes":{"1":"MS 75.","2":"Cf. Gál 2,20.","3":"CC 39.","4":"Cf. CC 39.","5":"Cf. DCE 1; EG 7-8.","6":"Cf. Ef 1,3-4.","7":"Cf. Mc 10,21.","8":"Cf. Lc 4,18; CC 39.","9":"Cf. Lc 2,49.","10":"Cf. CC 2.","11":"Cf. 2 Cor 5,14.","12":"Cf. Lc 4,18.","13":"Cf. PI 8.","14":"Cf. PE 22.","15":"PI 8.","16":"Cf. Rm 5,5.","17":"CC 10.","18":"Cf. 1 Cor 13,8.","19":"Cf. Aut 438.","20":"Cf. Lc 11,13; Aut 443.","21":"Cf. CC 9.","22":"Cf. RD 3.","23":"CC 62.","24":"Cf. PI 9; VC 19; HAC 47.","25":"Cf. Mc 3,13-15.","26":"Cf. LG 1; VC 41.","27":"Cf. Hch 4,32.","28":"Cf. PC 15a; VC 42; VFC 2.","29":"Cf. Aut 489.","30":"Cf. Aut 491.","31":"Cf. CC 10.","32":"Cf. CC 12.","33":"Cf. CC 38.","34":"CF, p. 25.","35":"HAC 16; MS 69.","36":"MS 1.","37":"MS 2.","38":"Cf. CC 5.","39":"Cf. SP 21.","40":"Dir 27; Cf. CC 45; 1F 2,32.","41":"Cf. MCH 228.","42":"Cf. CC 72, 7475.","43":"Cf. CC 75; CPR 68.","44":"CF, p. 20; Cf. MCH 150-151; MS 42.","45":"CC 5.","46":"Cf. MCH 149.","47":"Cf. LG 44; VC 87.","48":"Cf. 1F 11.","49":"Cf. CC 20-32; 1F 11-12; 1VR 41; MCH 149.","50":"Cf. VC 35. 38.","51":"MCH 149.","52":"Cf. Lc 4,18; Is 61,1-2; Aut 118; CC 3.","53":"Cf. Aut 101; EA, 414.","54":"Cf. C .","123":"Cf. Aut. 340-356, 680.","124":"Cf. Aut. 352, 353.","125":"Cf. Aut. 356.","126":"Cf. Aut. 341, 669.","127":"Cf. CC (1862) Apéndice; Aut. 341.","128":"Cf. CC (1857) 29.","129":"Cf. CC (1857) 56.","130":"Cf. Flp 2,5-9.","131":"Cf. CC 41.","132":"Cf. CC 54.","133":"Cf. CC 41, 64.","134":"Cf. Aut 34.","135":"Cf. Aut 35.","136":"Cf. Aut 374; CI II, p. 491; EE, p. 304.","137":"Cf. Mt 12,19-20.","138":"Cf. Mt 9,13; 12,7.","139":"Cf. EA, pp. 563, 566.","140":"Cf. EA, p. 561.","141":"Cf. Aut 374.","142":"Cf. Aut 374.","143":"Cf. Mt 11,29.","144":"Cf. CC 42.","145":"Cf. Aut 381.","146":"Cf. GE 129.","147":"Cf. Aut 414, 415.","148":"Cf. Aut 391.","149":"Cf. Aut 423-427.","150":"Cf. Aut 392.","151":"Cf. Aut 411-413.","152":"Cf. Aut 406.","153":"Cf. CC 43, 44.","154":"Cf. CC 43.","155":"Cf. Aut 494; CC 9, 44.","156":"Cf. CC 45.","157":"Cf. CC 44.","158":"Cf. AP 8.","159":"Cf. MCH 155; EMP 18; MS 25."}},{"id":"c3","title":"Los agentes y los modelos inspiradores","short":"Capítulo 3","kind":"main","pages":[95,118],"blocks":[{"t":"h","l":2,"h":"INTRODUCCIÓN"},{"t":"p","h":"Por agente de formación se entiende la persona o conjunto de personas que colaboran con intención formativa en este proceso, ofreciendo y poniendo en práctica los dinamismos y medios que ayudan a conseguir los fines de la formación. Cada agente actúa de manera específica, según su propia naturaleza.","n":"104","s":1},{"t":"p","h":"Por modelo se entiende la persona que se convierte en mediación auténtica y viviente de los valores que quiere transmitir a través de otros dinamismos y medios. La fuerza formativa del modelo no sólo reside en la eficacia que la autenticidad de vida tiene en sí misma, sino también en que muestra, de una manera tangible y atractiva, que los valores que se ofrecen en la formación son posibles en la realidad. Los modelos pueden coincidir o no con los agentes formativos.","n":"105","s":1},{"t":"h","l":2,"h":"1. LOS AGENTES"},{"t":"p","h":"Estamos convencidos de que, a lo largo de n
