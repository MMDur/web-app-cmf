sensible a la cultura y procurará ser expresión del radicalismo evangélico.","n":"205"},{"t":"p","h":"e. La presencia de símbolos claretianos en su decoración contribuye pedagógicamente a crear un espíritu de familia y a visibilizar el aprecio por nuestro carisma. Asimismo, las comunidades formativas asumirán la simbología de los pueblos en orden a asimilar los valores de las culturas y a promover una mayor identificación con ellas.","n":"205"}],"notes":{"1":"Este apartado está especialmente pensado para misioneros en formación inicial, aunque hay elementos válidos para todos.","2":"Cf. PI 33, 39-41, 43.","3":"Cf. Dir 198.","4":"Cf. CIC 689, § 2.","5":"Cf. 1F 6.","6":"Cf. DVC 234, 235, 240.","7":"Cf. CV 68.","8":"Cf. CV 72-80.","9":"Cf. CV 72.","10":"Cf. CV 73.","11":"Cf. CV 83.","12":"Cf. CV 81.","13":"Cf. CV 84.","14":"Cf. PI 87-89; DVM 71-78.","15":"Cf. PDV 9.","16":"Cf. ChL 46.","17":"Cf. PI 87.","18":"Cf. PDV 8.","19":"Cf. RFIS 101.","20":"Cf. PDV 46.","21":"Cf. VC 56d; VFC 62.","22":"Cf. GS 52.","23":"Cf. PC 24.","24":"Cf. OT 2; LG 11; AA 11; PDV 41.","25":"HAC 2c.","26":"Cf. 1F 115.","27":"Cf. Lc 5,11.","28":"Cf. PGF 58-60.","29":"Cf. VNON 12.","30":"Cf. HAC 2a.","31":"Cf. PTV 8.","32":"Cf. MS 52.","33":"MS 17.","34":"Cf. Dir 127.","35":"Cf. PI 21-23.","36":"Cf. HAC 3.","37":"Cf. AAS 65 (1983) 777-779.","38":"Cf. RH.","39":"Cf. DiM.","40":"Cf. D et V.","41":"Cf. RM.","42":"Cf. MD.","43":"Cf. ChL.","44":"Cf. SRS y CA.","45":"Cf. RMi.","46":"Cf. VS.","47":"Cf. DCE, SS, LF.","48":"Cf. GE.","49":"Cf. EG.","50":"Cf. LS.","51":"Cf. AL.","52":"Cf. CC 58, 76.","53":"Cf. CPR 11, 13-19, 21-31, 32-38, 39-40; SP 3.2; HAC 11, 14; MS 25, 27.","54":"CC 49.","55":"Cf. Lc 4,18; MV 15.","56":"Cf. PTV 40; HAC 58.3.","57":"Cf. SP 20, 21.5."}},{"id":"c5","title":"Los dinamismos y medios","short":"Capítulo 5","kind":"main","pages":[139,162],"blocks":[{"t":"h","l":2,"h":"INTRODUCCIÓN"},{"t":"p","h":"Por <i>dinamismos y medios<\/i> entendemos las realidades (situaciones, actividades, instrumentos) que se presentan con una intencionalidad formativa. Se denominan <i>dinamismos<\/i> por la energía que poseen para estimular el proceso formativo. Se llaman <i>medios<\/i> en cuanto constituyen cauces de comunicación de los valores que se desea transmitir. Estas realidades pueden ser creadas por los distintos agentes formativos, o pueden ser tomadas, con intencionalidad educativa, del amplio mundo de los factores formativos (personales y ambientales).","n":"206","s":1},{"t":"p","h":"Sin embargo, no basta la intencionalidad de los agentes para que los medios se conviertan automáticamente en portadores de valores y sean válidos para la formación. Es necesario que las realidades sean previamente signos de valores que intentan transmitir. Además, una buena organización y orientación de los signos, así como una buena pedagogía en el uso de los medios contribuye a que éstos sean más eficaces y ayuden a conseguir los objetivos propuestos.","n":"207","s":1},{"t":"p","h":"En este capítulo se presentan los dinamismos y medios fundamentales. Otros más específicos aparecerán en las diversas etapas de la formación. Se presentan aquí, además, los que tienen un especial sentido carismático y tradición congregacional. Algunos se hallan articulados como binomios para mostrar la estrecha relación que existe entre ellos y que, en algunos casos, el mismo Fundador subrayó.","n":"208","s":1},{"t":"h","l":2,"h":"1. EL ACOMPAÑAMIENTO VOCACIONAL"},{"t":"h","l":3,"h":"1.1. El proceso de crecimiento vocacional"},{"t":"p","h":"La vocación es un don de Dios que exige siempre la respuesta libre del llamado. Hay que entenderla, pues, dinámicamente, como algo que está en proceso continuo de crecimiento.","n":"209","s":1},{"t":"p","h":"Por parte de Dios está siempre asegurada la presencia activa del Espíritu que ilumina y guía al llamado y lo sostiene en su respuesta. El llamado, por su parte, acoge el don clarificando más la llamada, asumiendo la responsabilidad de su propia vida, buscando una adecuada y continua formación en sintonía con el proyecto congregacional de vida y recorriendo el camino de su propia santificación.","n":"210","s":1},{"t":"p","h":"El llamado a nuestra vida misionera no recorre los caminos del Señor en soledad, sino en comunidad. Esta le ayuda a descubrir lo que el Espíritu pide de él, lo acompaña debidamente en su recorrido, a través de las sucesivas etapas, y le ofrece personas idóneas para una ayuda más personalizada. La disposición de la persona a recibir este acompañamiento es en sí un signo del anhelo de discernir y crecer en su vocación.","n":"211","s":1},{"t":"h","l":3,"h":"1.2. El acompañamiento personal"},{"t":"p","h":"Nuestro Fundador recorrió las sendas que el Señor quiso para él pidiendo ayudas puntuales<sup class=\"fn\" data-u=\"c5\" data-n=\"1\">1<\/sup> y regulares<sup class=\"fn\" data-u=\"c5\" data-n=\"2\">2<\/sup> a personas experimentadas espiritualmente, que le ayudaron en el discernimiento de la voluntad de Dios. Les confiaba el estado de su conciencia,<sup class=\"fn\" data-u=\"c5\" data-n=\"3\">3<\/sup> contaba con su aprobación<sup class=\"fn\" data-u=\"c5\" data-n=\"4\">4<\/sup> y les obedecía<sup class=\"fn\" data-u=\"c5\" data-n=\"5\">5<\/sup>. Él mismo advierte cómo en momentos muy críticos de su vida Dios se valió de algunas personas para aconsejarle y dirigirle<sup class=\"fn\" data-u=\"c5\" data-n=\"6\">6<\/sup>. Recuerda, como especialmente significativo, el encuentro que tuvo con el P. Amigó<sup class=\"fn\" data-u=\"c5\" data-n=\"7\">7<\/sup>, que contribuyó a que se despertara en él el fervor de la piedad y devoción, a abrir los ojos y a conocer los peligros por donde había pasado<sup class=\"fn\" data-u=\"c5\" data-n=\"8\">8<\/sup>. Reconoce al P. Bach como un director espiritual en el que depositó su confianza y en quien encontró la ayuda necesaria para aclarar dudas vocacionales, superar tentaciones y dejarse forjar como misionero en la fragua del amor de Dios<sup class=\"fn\" data-u=\"c5\" data-n=\"9\">9<\/sup>. En carta al P. Xifré le expresa su deseo de que se dé cuenta de conciencia a los directores espirituales para <i>evitar deserciones y vencer las tentaciones<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"10\">10<\/sup>.","n":"212","s":1},{"t":"p","h":"Acompañamiento personal es, en sentido amplio, toda ayuda que ilumina sostiene y guía al claretiano en su empeño por discernir la voluntad de Dios para alcanzar la plenitud de su vida misionera. Sus formas de realización son diversas, como se señala seguidamente.","n":"213","s":1},{"t":"p","h":"La dirección espiritual es la modalidad más recomendada por la Iglesia<sup class=\"fn\" data-u=\"c5\" data-n=\"11\">11<\/sup> y por la Congregación<sup class=\"fn\" data-u=\"c5\" data-n=\"12\">12<\/sup>. Esta ha visto en ella <i>un medio excelente para discernir la voluntad de Dios, para mantenerse en el fervor y perseverar hasta el fin<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"13\">13<\/sup>. La recomienda a los misioneros en general<sup class=\"fn\" data-u=\"c5\" data-n=\"14\">14<\/sup> y a los formandos en particular<sup class=\"fn\" data-u=\"c5\" data-n=\"15\">15<\/sup>. Durante la formación inicial el acompañamiento incluye también la presencia asidua del formador en la vida y los actos comunitarios y su participación en las actividades apostólicas y un diálogo personal, al menos una vez al mes en el caso de los profesos temporales y con más frecuencia en las etapas previas, entre cada formando y su formador para facilitar el discernimiento y el crecimiento vocacional<sup class=\"fn\" data-u=\"c5\" data-n=\"16\">16<\/sup>.","n":"214","s":1},{"t":"p","h":"En nuestra tradición, el formador es la persona que la Congregación ofrece a cada formando para la dirección espiritual, dejando a salvo la libertad del mismo a elegir, en diálogo con su formador, a otra persona idónea<sup class=\"fn\" data-u=\"c5\" data-n=\"17\">17<\/sup> como un apoyo al acompañamiento. Cuando se escoja a otra persona prefiérase, como criterio, a un claretiano u otro que entiende el espíritu y características de la Congregación.","n":"215","s":1},{"t":"p","h":".","n":"215"},{"t":"p","h":"En la dirección espiritual se ha de procurar ayudar a la persona a que:","n":"216","s":1},{"t":"p","h":"a. Se conozca a sí misma, se acepte y se posea desde la propia libertad.","n":"216"},{"t":"p","h":"b. Se distancie de sí para iniciar el camino de conversión a Dios, y darse oblativamente a los demás. En este momento es importante prestar una atención particular a la experiencia de Dios que se va dando en la persona; a la escucha de la Palabra; a su oración personal y comunitaria; a los diversos descubrimientos que va haciendo de la presencia de Cristo; a su lectura crítica de la realidad; a la manera como vive su pertenencia a la comunidad y sus experiencias apostólicas; y a sus pruebas, crisis y tentaciones, que le invitan a dejar el camino iniciado.","n":"216"},{"t":"p","h":"c. Busque siempre la voluntad de Dios en las circunstancias concretas de la vida mediante la práctica del discernimiento.","n":"216"},{"t":"p","h":"El director espiritual realiza su tarea de acompañamiento mediante una pedagogía que, por un lado, ilumina, sugiere y anima a la persona para que valore lo que es y lo que está llamada a ser; y, por otro, promueve su responsabilidad para que, gradualmente, sea él quien escoja o asuma como propios los caminos que le propone el Espíritu de Dios.","n":"217","s":1},{"t":"p","h":"Una modalidad del acompañamiento son los diálogos frecuentes con el formador<sup class=\"fn\" data-u=\"c5\" data-n=\"18\">18<\/sup>. La función del formador lo pone en relación con cada uno de los formandos en todo cuanto se refiere al conjunto de los aspectos del proyecto formativo. Esta forma de acompañamiento siempre se ha de tener, incluso cuando el director espiritual sea otra persona distinta del formador.","n":"218","s":1},{"t":"p","h":"También se entienden como formas de acompañamiento la confesión frecuente<sup class=\"fn\" data-u=\"c5\" data-n=\"19\">19<\/sup> y todas aquellas realidades que, en la comunidad formativa, resultan ayudas para el crecimiento de la persona: las revisiones de vida, los momentos en que se celebra y se comparte la Palabra; las charlas formativas; las informaciones ocasionales sobre la vida de la Iglesia, de la Congregación y del mundo, y hasta los más pequeños detalles (un consejo, una palabra o un gesto significativo).","n":"219","s":1},{"t":"p","h":"Sin embargo, para algunos casos específicos se puede buscar a otra persona (consejero, director espiritual) para que el formando pueda tener más libertad en revelar su vida interior o beneficiarse de la especialización que pueda tener dicha persona para tratar algunos temas<sup class=\"fn\" data-u=\"c5\" data-n=\"20\">20<\/sup>. La ayuda de psicólogos ha de utilizarse en la evaluación de la personalidad, dando una opinión sobre la salud psicológica del candidato; y en el acompañamiento terapéutico, para esclarecer cualquier problema que pueda surgir y para ayudar al crecimiento en la madurez humana<sup class=\"fn\" data-u=\"c5\" data-n=\"21\">21<\/sup>.","n":"220","s":1},{"t":"p","h":"La elaboración y fiel cumplimiento del proyecto personal, o de crecimiento<sup class=\"fn\" data-u=\"c5\" data-n=\"22\">22<\/sup> es otro medio que puede ayudar en la maduración vocacional. Nuestro Fundador concedió siempre mucha importancia a los propósitos y proyectos de vida por la eficacia que tienen en el progreso científico, espiritual y apostólico<sup class=\"fn\" data-u=\"c5\" data-n=\"23\">23<\/sup>. Para que responda verdaderamente a su objetivo, el proyecto personal debe partir de una experiencia de fe y abarcar las principales dimensiones de la vocación de uno<sup class=\"fn\" data-u=\"c5\" data-n=\"24\">24<\/sup>. Tiene que ser elaborado con realismo, concreción, sencillez y flexibilidad, de forma que se pueda ir adaptando periódicamente a las nuevas situaciones que surgen, y confrontarlo con el formador y el director espiritual.","n":"221","s":1},{"t":"h","l":2,"h":"2. LA PALABRA Y LOS SACRAMENTOS"},{"t":"p","h":"Uno de los rasgos que nos configuran en la Iglesia es nuestra <i>devoción especial a la Eucaristía y a la Palabra de Dios, como Fuente primaria y constante de nuestra vida sobrenatural y celo apostólico<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"25\">25<\/sup><i>.<\/i> Dada esta centralidad, ambos elementos – junto con el sacramento de la reconciliación - deben tener una presencia relevante y peculiar en el itinerario formativo.","n":"222","s":1},{"t":"h","l":3,"h":"2.1. La Palabra"},{"t":"p","h":"A lo largo de toda su historia, con diversas concreciones y expresiones prácticas, la Iglesia ha tenido presente la enseñanza paulina de que toda la Escritura, <i>inspirada por Dios es útil para enseñar, reprender, corregir e instruir en la justicia; para que el hombre de Dios esté en forma, equipado para toda obra buena<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"26\">26<\/sup><i>.<\/i> En esa misma línea, el Concilio Vaticano II recomienda a todos los fieles la lectura asidua de la Escritura, como camino hacia el conocimiento supremo de Jesucristo, y pide que los pastores de la Iglesia proporcionen a sus fieles los medios para una adecuada formación bíblica<sup class=\"fn\" data-u=\"c5\" data-n=\"27\">27<\/sup>. La Biblia nunca será un mero libro de estudio, sino, sobre todo, un alimento espiritual servido generosamente en la mesa de la liturgia<sup class=\"fn\" data-u=\"c5\" data-n=\"28\">28<\/sup>, y un libro de vida<sup class=\"fn\" data-u=\"c5\" data-n=\"29\">29<\/sup>.","n":"223","s":1},{"t":"p","h":"San Antonio María Claret descubre su vocación, sobre todo, en el contacto con la Biblia<sup class=\"fn\" data-u=\"c5\" data-n=\"30\">30<\/sup>. Muy aficionado a su lectura<sup class=\"fn\" data-u=\"c5\" data-n=\"31\">31<\/sup>, desde ella alimentará constantemente su espiritualidad misionera, fijándose principalmente en Jesús, los apóstoles y los profetas<sup class=\"fn\" data-u=\"c5\" data-n=\"32\">32<\/sup>. Se basó en la Biblia para su predicación, tanto en la referente a temas como al estilo<sup class=\"fn\" data-u=\"c5\" data-n=\"33\">33<\/sup>. En su época de seminarista se había acostumbrado a leer toda la Biblia en un año, según las orientaciones del obispo Corcuera<sup class=\"fn\" data-u=\"c5\" data-n=\"34\">34<\/sup>.","n":"224","s":1},{"t":"p","h":"La praxis y experiencia de Claret se transmitió a la Congregación. Ya el número 6 de las reglas del “misionero perfecto”, poco anteriores a la fundación del Instituto, prescribe la lectura diaria del Nuevo Testamento. Las pláticas de los ejercicios fundacionales tienen siempre una introducción bíblica. Las primeras Constituciones (1857) prescriben la lectura bíblica diaria en tiempo de misiones. El Reglamento especial para los Estudiantes (1862) establece que cada uno tenga la Biblia y lea cuatro capítulos diarios<sup class=\"fn\" data-u=\"c5\" data-n=\"35\">35<\/sup>. En las de 1865 se establece la lectura bíblica para los novicios. A partir de 1870, en el tiempo de estar en casa, los misioneros comienzan a tener clase semanal de Sagrada Escritura como formación permanente.","n":"225","s":1},{"t":"p","h":"Las Constituciones definen nuestra vocación específica en el pueblo de Dios como <i>servicio de la Palabra<\/i> y nos piden que, a ejemplo de María, la escuchemos asiduamente y que la compartamos con los hermanos<sup class=\"fn\" data-u=\"c5\" data-n=\"36\">36<\/sup>. La Biblia ha de ser nuestro principal libro de lectura espiritual<sup class=\"fn\" data-u=\"c5\" data-n=\"37\">37<\/sup>. El superior debe animar a sus hermanos a la fidelidad <i>suministrándoles la Palabra de Dios<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"38\">38<\/sup><i>.<\/i>","n":"226","s":1},{"t":"p","h":"Los Capítulos Generales del período de renovación posconciliar han reconocido y subrayado el rico legado de formación y espiritualidad bíblica que ha acompañado y vivificado al Instituto a lo largo de su historia<sup class=\"fn\" data-u=\"c5\" data-n=\"39\">39<\/sup>. Aspiramos a que el claretiano llegue a ser un habitual oyente de la Palabra (en la oración, en la historia, en la cultura de los pueblos, en sus silencios y clamores)<sup class=\"fn\" data-u=\"c5\" data-n=\"40\">40<\/sup>, un estudioso apasionado de la Escritura<sup class=\"fn\" data-u=\"c5\" data-n=\"41\">41<\/sup> que se deja interpelar por ella<sup class=\"fn\" data-u=\"c5\" data-n=\"42\">42<\/sup>, la acoge desde una óptica vocacional<sup class=\"fn\" data-u=\"c5\" data-n=\"43\">43<\/sup>, y la comparte con los hermanos y los seglares<sup class=\"fn\" data-u=\"c5\" data-n=\"44\">44<\/sup>. Bajo la acción materna de María aprendemos a hacer de la Palabra compromiso de vida y anuncio misionero.","n":"227","s":1},{"t":"p","h":"El misionero claretiano intentará que su lectura y estudio de la Palabra se realice en clave carismática y desde la realidad; desde el cristocentrismo misionero típico del Fundador y en comunión con la tradición viva del Evangelio, que incluye el progreso exegético y hermenéutico<sup class=\"fn\" data-u=\"c5\" data-n=\"45\">45<\/sup>. Se preparará también para ayudar a los creyentes a familiarizarse con la Palabra de Dios.","n":"228","s":1},{"t":"p","h":"Para que la Palabra incida de verdad en nosotros habrá que atender de una manera pedagógica a que sea lo que fue para nuestro Fundador: impacto de cambio y conversión; pan para nuestra hambre de estudio, meditación y contemplación; fuente de cambio y conversión; pan para nuestra hambre de estudio, meditación y contemplación; instancia de discernimiento y descubrimiento vocacional; renovación de la experiencia vocacional primera; fuego interior que dinamice nuestro seguimiento de Jesús en el hacer y padecer; tesoro que no puede menos de compartirse en la predicación y en los escritos<sup class=\"fn\" data-u=\"c5\" data-n=\"46\">46<\/sup>. Para ello es necesario <i>dar un lugar relevante, dentro de una formación académica seria, al conocimiento exegético y sapiencial de la Biblia; y hacer que la Palabra, mediante la lectio divina y otras formas de lectura, sea uno de los ejes de todo el proceso formativo<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"47\">47<\/sup><i>.<\/i> Procuraremos, a lo largo de las diversas etapas de la formación, hacer una lectura completa de los libros de la Escritura y mantendremos la tradición de su lectura diaria.","n":"229","s":1},{"t":"h","l":3,"h":"2.2. La Eucaristía"},{"t":"p","h":"La eucaristía, como sacramento del sacrificio y de la presencia real de Cristo, ocupó un lugar preponderante en la vida espiritual y apostólica de San Antonio María Claret<sup class=\"fn\" data-u=\"c5\" data-n=\"48\">48<\/sup>. Era el momento más intenso de su unión personal con Jesucristo ofrecido al Padre por la salvación de los hombres; en ella recibía los ardientes deseos de sacrificar su vida con Cristo para el bien de la Iglesia y de todos los hombres. La oración ante el Santísimo le ayudaba a mantener estos sentimientos y a desarrollar sus actividades en un espíritu sacrificial profundamente compenetrado con el misterio redentor de Cristo y de la Iglesia<sup class=\"fn\" data-u=\"c5\" data-n=\"49\">49<\/sup>. La <i>gracia grande<\/i>, recibida nueve años antes de su muerte, fue expresión de su configuración con Cristo que le llevó a vivir una existencia eucarística como total donación a Dios y a sus hermanos<sup class=\"fn\" data-u=\"c5\" data-n=\"50\">50<\/sup>.","n":"230","s":1},{"t":"p","h":"Dado que la eucaristía constituye el centro de la liturgia y del culto, hacia ella deben converger todos los esfuerzos de formación en la espiritualidad y en la piedad<sup class=\"fn\" data-u=\"c5\" data-n=\"51\">51<\/sup>. Siguiendo el ejemplo de nuestro Fundador hemos de procurar vivirla en toda su plenitud como:","n":"231","s":1},{"t":"p","h":"a. Sacrificio de Cristo y de su Iglesia, al cual debemos asociarnos personalmente en obediencia juntamente con Cristo, para entregarnos después a los demás, urgidos por su misma caridad<sup class=\"fn\" data-u=\"c5\" data-n=\"52\">52<\/sup>.","n":"231"},{"t":"p","h":"b. Sacramento de la comunión y de la unidad de la Iglesia, procurando proyectar sobre la vida comunitaria esa unidad significada y realizada por la eucaristía<sup class=\"fn\" data-u=\"c5\" data-n=\"53\">53<\/sup>.","n":"231"},{"t":"p","h":"c. Momento privilegiado donde se honra al Padre y se hace presente el Maestro que nos comunica sus palabras de vida y se nos entrega para que comulguemos con Él<sup class=\"fn\" data-u=\"c5\" data-n=\"54\">54<\/sup>.","n":"231"},{"t":"p","h":"d. Sacramento de la permanente presencia de Cristo, quien en el sagrario nos invita a acudir a su presencia para estar con Él, reavivar nuestra fe y hacernos ministros más idóneos de su palabra, a fin de difundir su Reino por todo el mundo<sup class=\"fn\" data-u=\"c5\" data-n=\"55\">55<\/sup>.","n":"231"},{"t":"p","h":"e. Memoria profética que nos estimula a luchar contra todo lo que se opone al Reino de Dios<sup class=\"fn\" data-u=\"c5\" data-n=\"56\">56<\/sup>.","n":"231"},{"t":"p","h":"f. Alimento que mantiene viva la conciencia vocacional misionera y el vigor a lo largo del itinerario formativo.","n":"231"},{"t":"p","h":"Conforme a la experiencia y a la enseñanza de nuestro Fundador<sup class=\"fn\" data-u=\"c5\" data-n=\"57\">57<\/sup>, nuestras Constituciones<sup class=\"fn\" data-u=\"c5\" data-n=\"58\">58<\/sup> hablan de la visita, la adoración y la celebración diaria de la eucaristía. Ésta ha de ser un elemento que no puede faltar en la jornada del claretiano y que ha de vivirse <i>con todo el corazón, <\/i>pues hay que entregarse del todo al que se nos entrega del todo<sup class=\"fn\" data-u=\"c5\" data-n=\"59\">59<\/sup>. En las comunidades formativas debe ser el <i>acto de comunidad fundamental<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"60\">60<\/sup><i>.<\/i>","n":"232","s":1},{"t":"p","h":"Para que la Eucaristía tenga en nosotros toda su fuerza transformadora y misionera se requiere desde el punto de vista pedagógico:","n":"233","s":1},{"t":"p","h":"a. Centrar toda la vida en ella, no reduciéndola al momento de su celebración sacramental.","n":"233"},{"t":"p","h":"b. Resaltar su dimensión eclesial y apostólica.","n":"233"},{"t":"p","h":"c. Integrar en la celebración la realidad del pueblo (sus luchas y sufrimientos, sus esperanzas y logros) y lo que somos y hacemos.","n":"233"},{"t":"p","h":"d. Descubrirla como fuerza que nos convierte en artífices de paz, reconciliación y justicia.","n":"233"},{"t":"p","h":"e. Cuidar una formación litúrgica adecuada.","n":"233"},{"t":"p","h":"f. Educar en el sentido y en el dinamismo propio de esta celebración, así como en la atención a las exigencias y a los compromisos misioneros que de ella se derivan.","n":"233"},{"t":"p","h":"g. Prestar una atención constante a la verdad de los signos presentes en el Sacramento: proclamación de la Palabra, ofertorio y consagración, gesto de la paz, fracción del pan y comunión bajo las dos especies.","n":"233"},{"t":"h","l":3,"h":"2.3. La Reconciliación"},{"t":"p","h":"El sacramento de la reconciliación, que restaura y vigoriza la vida nueva recibida en el bautismo, desempeña una función esencial en el crecimiento misionero, pues éste no se da sin conciencia personal y comunitaria de conversión constante<sup class=\"fn\" data-u=\"c5\" data-n=\"61\">61<\/sup>. En cuanto peregrinos que no hemos llegado a la patria, necesitamos recibir el perdón de Dios para ir muriendo al pecado<sup class=\"fn\" data-u=\"c5\" data-n=\"62\">62<\/sup>, que obstaculiza nuestra configuración con Cristo, que no conoció pecado<sup class=\"fn\" data-u=\"c5\" data-n=\"63\">63<\/sup>. Nuestro Fundador le concedió siempre gran importancia, tal como aparece en muchos de sus propósitos<sup class=\"fn\" data-u=\"c5\" data-n=\"64\">64<\/sup>.","n":"234","s":1},{"t":"p","h":"Las celebraciones comunitarias del rito penitencial en sus diversas formas y la celebración individual frecuente<sup class=\"fn\" data-u=\"c5\" data-n=\"65\">65<\/sup>, preparadas por el examen diario de nuestra fidelidad al Evangelio<sup class=\"fn\" data-u=\"c5\" data-n=\"66\">66<\/sup>, nos permitirán:","n":"235","s":1},{"t":"p","h":"a. Experimentar el gozo del perdón del Padre.","n":"235"},{"t":"p","h":"b. Reconstruir la comunión fraterna, con la Iglesia y con toda la creación.","n":"235"},{"t":"p","h":"c. Conocernos cada vez más a nosotros mismos.","n":"235"},{"t":"p","h":"d. Purificar las motivaciones que nos guían como servidores de la Palabra.","n":"235"},{"t":"p","h":"e. Fortalecer nuestra respuesta vocacional.","n":"235"},{"t":"h","l":2,"h":"3. LA ORACIÓN Y EL ESTUDIO"},{"t":"p","h":"Estos dos dinamismos de la formación han ido siempre muy unidos en la tradición claretiana. Como solía decir nuestro Fundador, la oración y el estudio son los dos pies del misionero, que necesita de ambos para poder caminar<sup class=\"fn\" data-u=\"c5\" data-n=\"67\">67<\/sup>. Él mismo los integró en su propia vida de misionero: <i>Yo antes de predicar debo mover y batir las alas del estudio y de la oración<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"68\">68<\/sup>. Por ello se nos recomienda a todos que cultivemos con toda diligencia las disciplinas teológicas y humanas y que sigamos constantemente el progreso de las mismas<sup class=\"fn\" data-u=\"c5\" data-n=\"69\">69<\/sup>. A los misioneros en formación inicial se les pide que <i>cultiven con gran esmero y abran a la acción del Espíritu su corazón y su inteligencia <\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"70\">70<\/sup><i>.<\/i>","n":"236","s":1},{"t":"p","h":"En esta asociación de la oración con el estudio ha de notarse especialmente el carácter de formación integradora<sup class=\"fn\" data-u=\"c5\" data-n=\"71\">71<\/sup>, buscando la unidad de la persona y la armonía en el desarrollo de todas sus posibilidades. La oración y el estudio han de ayudarse mutuamente: la oración ha de orientar la dirección apostólica del estudio y éste ha de dar contenidos, expresión y fuerza a la penetración de la Palabra que hemos de anunciar.","n":"237","s":1},{"t":"p","h":"Por consiguiente, tanto en la oración como en el estudio hay que proponerse llegar a la adquisición de hábitos que sólo se logran cuando aquellos se ejercitan asiduamente<sup class=\"fn\" data-u=\"c5\" data-n=\"72\">72<\/sup>.","n":"238","s":1},{"t":"h","l":3,"h":"3.1. La oración"},{"t":"p","h":"Nuestra oración se inspira en la actitud y recomendación de Cristo que oraba asiduamente <sup class=\"fn\" data-u=\"c5\" data-n=\"73\">73<\/sup> y en la actitud de María <i>que guardaba todas estas cosas meditándolas en su corazón<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"74\">74<\/sup><i>.<\/i> Nuestro Fundador se formó en esta actitud de acogida y meditación de la Palabra, plenamente convencido de que en el <i>fuego que arde en la meditación se derriten y funden los hombres y se amoldan a la imagen de Jesús<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"75\">75<\/sup><i>.<\/i> Por eso quería de sus misioneros practicasen esa forma concreta de oración que es la meditación entendida sobre todo como una <i>forma de mirar a Jesús y conocerlo para compenetrarse con Él y actuar como Él hizo<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"76\">76<\/sup><i>. <\/i>El claretiano <i>no piensa sino cómo seguirá e imitará a Cristo en orar<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"77\">77<\/sup>. Además, debe rogar constantemente al Señor que lo haga ministro idóneo de la Palabra<sup class=\"fn\" data-u=\"c5\" data-n=\"78\">78<\/sup>.","n":"239","s":1},{"t":"p","h":"Toda nuestra vida litúrgica (especialmente la eucaristía y la liturgia de las horas) y nuestros actos de piedad han de expresar aquellos elementos más característicos heredados de nuestro Fundador: <i>cristocentrismo, piedad eucarística, amor a la Palabra de Dios, el modo de vivir la filiación cordimariana en estrecha relación con su vocación misionera, devoción a los Apóstoles y a los santos que se han distinguido especialmente por su celo apostólico<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"79\">79<\/sup><i>.<\/i>","n":"240","s":1},{"t":"p","h":"Nuestra oración debe ser una oración misionera: en el continuo asumir la misión y su mensaje desde dentro, en la intención de comunicar lo contemplado, en la preocupación por asimilar el amor de Cristo al Padre y el celo de su gloria, en la intercesión constante en favor de la Iglesia y por la salvación de toda la humanidad. Y es que al misionero le sostiene siempre la certeza de que su actividad orante es una contribución valiosa a la eficacia de su ministerio<sup class=\"fn\" data-u=\"c5\" data-n=\"80\">80<\/sup>.","n":"241","s":1},{"t":"p","h":"En la formación de la vida de oración la historia de la espiritualidad cristiana ofrece un patrimonio muy rico al que todos debemos acercarnos, teórica y prácticamente. Esta materia debe programarse en los estudios académicos y, sobre todo, debe formar parte de las instrucciones concretas de los formadores, ya desde el año de noviciado, de modo que el formando vaya encontrando métodos y recursos que le faciliten el ejercicio de una vida de oración intense<sup class=\"fn\" data-u=\"c5\" data-n=\"81\">81<\/sup>.","n":"242","s":1},{"t":"p","h":"Particularmente durante la formación inicial, la oración personal crece en profundidad, en escucha, en disponibilidad y en silencio. Como María, que contempla la Palabra de Dios en el corazón, es necesario aprender a descansar en Dios, adorando sin palabras<sup class=\"fn\" data-u=\"c5\" data-n=\"82\">82<\/sup>, asintiendo a su presencia y acción, consintiendo a su voluntad, y abriéndose plenamente a su presencia amorosa. Es este descanso en Dios el que renueva, enciende, y capacita para ser contemplativos en la acción.","n":"243","s":1},{"t":"p","h":"Los maestros de la vida espiritual insisten sobre la necesidad de preparar la oración con una vida ordenada, un corazón puro y un esfuerzo por alejarnos del ruido y de las distracciones que nos rodean. Sólo así podremos crear en nuestro corazón el espacio de silencio necesario para acoger la Palabra de Dios y dejarnos transformar por ella<sup class=\"fn\" data-u=\"c5\" data-n=\"83\">83<\/sup>.","n":"244","s":1},{"t":"p","h":"La oración es una de las bases esenciales de la vida religiosa: la expresión de la fe, la fe misma en ejercicio. Debe, por ello, comprenderse ya desde el principio su sentido teológico básico y, sobre todo, debe ponerse como base de toda la vida teologal. Es apertura a Dios y comunicación con Él que tiene que irse llevando a la vida, a la lucha y al esfuerzo de cada día, como afianzamiento en la esperanza, para hacerse efectiva en el amor, con todas sus implicaciones prácticas.","n":"245","s":1},{"t":"p","h":"En todas las religiones y culturas la oración ha jugado este papel de respiración, de savia vital que posibilita y alimenta la vida religiosa. En la relación ecuménica actual es conveniente según aconsejen las circunstancias el acercamiento a formas de oración inspiradas en otras tradiciones religiosas.","n":"246","s":1},{"t":"p","h":"El acompañamiento personal es aquí particularmente necesario. A través de él debe analizarse, con asiduidad y continuidad, la marcha de la vida de oración, sus dificultades concretas, sus avances, los medios para afianzar la constancia y el cuidado en su práctica continuada.","n":"247","s":1},{"t":"h","l":3,"h":"3.2. El estudio"},{"t":"p","h":"Para llegar a ser ministro idóneo de la Palabra, el misionero ha de cultivar asiduamente su vida intelectual, su dedicación al estudio como medio de formación integral y como forma de ascetismo actual que estimula la contemplación y la oración. Así, el misionero se mantiene en búsqueda constante de la presencia y actividad de Dios en la realidad compleja del mundo de hoy<sup class=\"fn\" data-u=\"c5\" data-n=\"84\">84<\/sup>.","n":"248","s":1},{"t":"p","h":"El ejemplo del Fundador debe estimularnos a todos los misioneros. Hombre de acción, dado intensamente al apostolado, supo alimentar esa acción en las fuentes de la piedad y del estudio, cultivados con ahínco. Para él, la piedad y el estudio son, por así decir, los ojos del entendimiento y el pan que sustenta el alma: <i>un cuerpo sin ojos no ve y se precipita, y sin sustento se muere<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"85\">85<\/sup><i>. <\/i>Nosotros recogemos su ejemplo y, en las circunstancias actuales, como requisito imprescindible para la misión, nos proponemos <i>fomentar la calidad de la formación académica en el período inicial<\/i> <sup class=\"fn\" data-u=\"c5\" data-n=\"86\">86<\/sup><i>.<\/i>","n":"249","s":1},{"t":"p","h":"La formación debe proporcionar una preparación humana, cultural, espiritual y pastoral que preste especial atención a la integración armoniosa de todos sus diversos aspectos<sup class=\"fn\" data-u=\"c5\" data-n=\"87\">87<\/sup>.","n":"250","s":1},{"t":"p","h":"Como base de todos nuestros estudios, en razón de la orientación misionera de los mismos, se debe dar un <i>lugar relevante, dentro de una formación académica seria, al conocimiento sapiencial y exegético de la Biblia<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"88\">88<\/sup><i>.<\/i> Asimismo, debemos <i>cultivar diligentemente el estudio de los idiomas<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"89\">89<\/sup> y aprender las <i>técnicas de comunicación y lenguaje para poder ejercer el ministerio con acierto y de forma atrayente <\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"90\">90<\/sup><i>.<\/i> Los títulos eclesiásticos o civiles, o una especialización profesional deben discernirse de acuerdo con los talentos personales y la integridad vocacional de los formandos, y las necesidades de la Congregación.","n":"251","s":1},{"t":"p","h":"Para los que se preparan al ministerio ordenado, las orientaciones del Concilio Vaticano II, relativas a la formación académica de los presbíteros, actualizadas por el magisterio, deben ser la pauta básica para organizar los planes académicos<sup class=\"fn\" data-u=\"c5\" data-n=\"91\">91<\/sup>. Para los que se preparan para el ministerio laical, como hermanos misioneros, deben darse orientaciones para sus estudios según las cualidades personales y las áreas culturales diversas, <i>para responder a las exigencias apostólicas de la Familia religiosa, en armonía con las necesidades de la Iglesia<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"92\">92<\/sup><i>.<\/i>","n":"252","s":1},{"t":"p","h":"El conocimiento de la cultura y de las culturas de nuestro tiempo es muy importante. Esto exige una atención doble y complementaria: apertura ecuménica a todos los saberes y a todos los pueblos y, a la vez, una atención y una inserción adecuada en las culturas autóctonas en las que hemos de desplegar nuestro ministerio. Esto es aún más necesario hoy en día, ya que las posibilidades de interacción entre culturas han aumentado significativamente, dando lugar a nuevas oportunidades para el diálogo intercultural que, si no se hace acertadamente, desvaloriza la cultura y la naturaleza humana<sup class=\"fn\" data-u=\"c5\" data-n=\"93\">93<\/sup>. En la formación inicial, se procurará que los misioneros estudien en profundidad y sistemáticamente sus propias tradiciones culturales y ser introducidos en diferentes formas de diálogo con apertura y creatividad. Esto les permitirá iniciarse en un proceso de inculturación misionera y en un diálogo entre la fe y la cultura de su pueblo, <i>un diálogo que también extendemos al nuevo continente digital<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"94\">94<\/sup><i>.<\/i>","n":"253","s":1},{"t":"p","h":"Los estudios académicos, tanto los realizados en nuestros centros como los realizados en otros, se rigen por las normas de la Iglesia que regulan los estudios eclesiásticos. En algunos casos será necesario completarlos, siguiendo las orientaciones del PGF<sup class=\"fn\" data-u=\"c5\" data-n=\"95\">95<\/sup>, con algunas materias que guardan estrecha relación con nuestro carisma y que no siempre se incluyen en los planes de estudio ordinarios como Justicia, Paz e Integridad de la Creación (JPIC), Tecnologías de Información y Comunicación (TIC) y Economía. En la formación sobre temas de JPIC es conveniente ofrecer instancias concretas para que conozcan experiencias de organización social orientadas por los valores del Reino como la justicia, la igualdad y la fraternidad. Si la formación académica se realiza en facultades teológicas o centros de estudios que no son propios, debemos colaborar, en la medida de lo posible, para participar más directamente en la formación académica de los formandos.","n":"254","s":1},{"t":"p","h":"El centro de estudios, en el que los formandos transcurren buena parte de su tiempo, puede ejercer una influencia muy determinante en su formación. Por ello, conviene escoger aquellos que ofrezcan una enseñanza de calidad y garanticen, en el conjunto de su misión educativa, el nivel exigido por la Iglesia<sup class=\"fn\" data-u=\"c5\" data-n=\"96\">96<\/sup>. En el caso de que los estudios se cursen en centros no dirigidos por la Congregación, es preciso completar la formación misionera en la comunidad formativa<sup class=\"fn\" data-u=\"c5\" data-n=\"97\">97<\/sup>, siguiendo las indicaciones contenidas en el PGF 2020.","n":"255","s":1},{"t":"p","h":"El estudio se convierte en un dinamismo misionero cuando, realizado con responsabilidad, constancia, rigor y técnica suficiente, está motivado y orientado al anuncio del Evangelio. Con objeto de que pueda realizarse en buenas condiciones, debemos asegurar en todas las comunidades formativas los medios necesarios, desde un ambiente apropiado y una biblioteca actualizada, hasta otros instrumentos de capacitación pastoral y técnica.","n":"256","s":1},{"t":"h","l":2,"h":"4. LA VIDA COMUNITARIA Y LAS EXPERIENCIAS APOSTÓLICAS FORMATIVAS"},{"t":"h","l":3,"h":"4.1. La vida comunitaria"},{"t":"p","h":"La experiencia de comunidad que vivió San Antonio María Claret fue muy rica y original por ser fundador y por su peculiar misión en la Iglesia. Fundó la Congregación urgido por la misión para dedicarse al ministerio de la palabra<sup class=\"fn\" data-u=\"c5\" data-n=\"98\">98<\/sup> y a una vida perfectamente común en unión con otros que tenían idéntico espíritu<sup class=\"fn\" data-u=\"c5\" data-n=\"99\">99<\/sup>. Vivió, siempre que pudo, en comunidad con sus misioneros como exigencia de su configuración con Jesús, quien evangelizó en comunión con los apóstoles. Pero también vivió el misterio de la cruz en la comunidad cuando no pudo vivir en ella con la plenitud que deseaba.","n":"257","s":1},{"t":"p","h":"Nuestra vida común responde al deseo del Fundador de imitar la vida apostólica en plenitud, es decir, de seguir a Cristo que reúne en torno a Sí en fraterna caridad a los apóstoles<sup class=\"fn\" data-u=\"c5\" data-n=\"100\">100<\/sup>. Según nuestras Constituciones<sup class=\"fn\" data-u=\"c5\" data-n=\"101\">101<\/sup>, el fundamento de nuestra comunidad misionera está en la persona de Jesús, el Hijo enviado siempre en comunión con el Padre y el Espíritu; en la comunidad de los Doce<sup class=\"fn\" data-u=\"c5\" data-n=\"102\">102<\/sup> y en la primera comunidad de los creyentes<sup class=\"fn\" data-u=\"c5\" data-n=\"103\">103<\/sup>.","n":"258","s":1},{"t":"p","h":"En la formación para la comunidad hay que subrayar los rasgos más sobresalientes de nuestro estilo de vida comunitaria:","n":"259","s":1},{"t":"p","h":"a. Es, ante todo, comunidad misionera y, por tanto, la misión evangelizadora es su razón de ser y la que la hace eclesial y universal<sup class=\"fn\" data-u=\"c5\" data-n=\"104\">104<\/sup>. El testimonio de la vida fraterna es ya, de por sí, evangelizador <sup class=\"fn\" data-u=\"c5\" data-n=\"105\">105<\/sup>.","n":"259"},{"t":"p","h":"b. El espacio concreto donde nos asociamos con los hermanos por medio de la vida familiar y del ministerio es la comunidad local<sup class=\"fn\" data-u=\"c5\" data-n=\"106\">106<\/sup>.","n":"259"},{"t":"p","h":"c. Es lugar de convivencia, oración, corresponsabilidad, estudio y ámbito donde conseguir la plenitud personal a la que hemos sido llamados<sup class=\"fn\" data-u=\"c5\" data-n=\"107\">107<\/sup>.","n":"259"},{"t":"p","h":"d. Existen en ella diferentes carismas para llevar a cabo la misión a la que está destinada<sup class=\"fn\" data-u=\"c5\" data-n=\"108\">108<\/sup>.","n":"259"},{"t":"p","h":"e. Desarrolla, encarnándose en la realidad<sup class=\"fn\" data-u=\"c5\" data-n=\"109\">109<\/sup>, el carisma originario al servicio de la Iglesia y del mundo<sup class=\"fn\" data-u=\"c5\" data-n=\"110\">110<\/sup>.","n":"259"},{"t":"p","h":"f. En ella, en fin, se vive el amor fraterno en ambiente de familia, por encima de las diferencias de origen, edad, cultura y opinión<sup class=\"fn\" data-u=\"c5\" data-n=\"111\">111<\/sup>.","n":"259"},{"t":"p","h":"Para <i>revivir en comunidad el itinerario espiritual de Claret y su preocupación fundamental por servir y edificar la Iglesia con el ministerio de la Palabra, anunciando el Reino de Dios<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"112\">112<\/sup><i>,<\/i> es preciso que nuestra comunidad tenga ciertos requisitos, que:","n":"260","s":1},{"t":"p","h":"a. La comunión entre los hermanos, llamados y enviados a ser testigos y proclamadores de la Buena Nueva<sup class=\"fn\" data-u=\"c5\" data-n=\"113\">113<\/sup>, sea la primera y fundamental base del sentido de pertenencia del claretiano.","n":"260"},{"t":"p","h":"b. Los que están en el período de la primera formación <i>se familiaricen con el panorama de la misión en todas sus dimensiones sociológicas, culturales e históricas…, crezcan en la comprensión teológica de la Iglesia misionera y en una disponibilidad a ser enviados a través de determinadas mediaciones comunitarias<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"114\">114<\/sup><i>.<\/i>","n":"260"},{"t":"p","h":"c. Se privilegien los valores comunitarios: compartir la fe, la Palabra, las responsabilidades; programar y evaluar en común; trabajar en equipo; favorecer la recíproca apertura de la persona a las demás personas y al grupo; leer y analizar juntos las situaciones y los signos de los tiempos<sup class=\"fn\" data-u=\"c5\" data-n=\"115\">115<\/sup>. El proyecto comunitario debe convertirse en un dinamismo normal en nuestras comunidades formativas.<sup class=\"fn\" data-u=\"c5\" data-n=\"116\">116<\/sup>","n":"260"},{"t":"p","h":"d. Se construya un clima de diálogo; relaciones de estima, respeto y servicio; integración de la diversidad en la unidad<sup class=\"fn\" data-u=\"c5\" data-n=\"117\">117<\/sup>.","n":"260"},{"t":"p","h":"e. Se usen, asimismo, siempre que se crea conveniente y salvando la libertad y la intimidad de las personas, aquellas técnicas que potencien la comunidad en su vida y en su estructura, como dinámicas de grupos, ejercicios de comunicación profunda y esclarecedora, y otros medios pedagógicos<sup class=\"fn\" data-u=\"c5\" data-n=\"118\">118<\/sup>.","n":"260"},{"t":"p","h":"f. Nos acostumbremos, desde el principio de la formación, a trabajar en equipo<sup class=\"fn\" data-u=\"c5\" data-n=\"119\">119<\/sup>.","n":"260"},{"t":"p","h":"g. Nos capacitemos para prestar diversos servicios a la comunidad, incluidos los trabajos manuales.","n":"260"},{"t":"h","l":3,"h":"4.2. Las experiencias apostólicas en la formación inicial"},{"t":"p","h":"Teniendo en cuenta la centralidad de la misión en nuestra vida, las experiencias apostólicas adquieren una importancia singular a lo largo del itinerario formativo y se convierten en escuela en la que, al mismo tiempo que anunciamos la Palabra, somos formados como misioneros.","n":"261","s":1},{"t":"p","h":"Los documentos de la Iglesia<sup class=\"fn\" data-u=\"c5\" data-n=\"120\">120<\/sup> de nuestro Fundador<sup class=\"fn\" data-u=\"c5\" data-n=\"121\">121<\/sup>, y también las orientaciones de la Congregación<sup class=\"fn\" data-u=\"c5\" data-n=\"122\">122<\/sup>, insisten en la formación apostólica. El estudio debe estar íntimamente conectado con la práctica pastoral. La formación apostólica es fruto de la interrelación entre las acciones concretas y la iluminación que ofrece la teología de la acción pastoral.","n":"262","s":1},{"t":"p","h":"Esta formación requiere una planificación encaminada a la capacitación misionera de los formandos<sup class=\"fn\" data-u=\"c5\" data-n=\"123\">123<\/sup>, que evite la improvisación, la simple buena voluntad, los reduccionismos y el realizar acciones sin evaluarlas. En consecuencia, toda experiencia apostólica debe ser adecuadamente preparada, orientada, acompañada y evaluada.","n":"263","s":1},{"t":"p","h":"Por lo que se refiere a la formación apostólica teórica, hay que cuidar que se enmarque adecuadamente en el ciclo de estudios eclesiásticos<sup class=\"fn\" data-u=\"c5\" data-n=\"124\">124<\/sup> y que se complemente con la asistencia a cursos y cursillos, con lecturas de revistas especializadas en pastoral, y con el estudio de las técnicas del apostolado<sup class=\"fn\" data-u=\"c5\" data-n=\"125\">125<\/sup> y de otras disciplinas relacionadas con el ministerio de la palabra. También, hay que posibilitar espacios de reflexión crítica de los acontecimientos de cara a encontrar respuestas misioneras adecuadas.","n":"264","s":1},{"t":"p","h":"En cuanto a las actividades apostólicas concretas, éstas han de situarse dentro de un marco que tenga en cuenta los objetivos, las actitudes, los criterios y orientaciones pedagógicas que a continuación se señalan.","n":"265","s":1},{"t":"p","h":"El <i>objetivo fundamental<\/i>, al desarrollar las actividades apostólicas, es que los formandos experimenten la misión claretiana hoy, llevada a cabo con alegría desde nuestra vocación misionera en colaboración con otros, según las exigencias, opciones y destinatarios preferenciales que ésta comporta. Este objetivo se concreta en otros más específicos:","n":"266","s":1},{"t":"p","h":"a. El descubrimiento gradual y el desarrollo de las aptitudes apostólicas de cada formando, que servirá para enfocar la especialización ministerial.","n":"266"},{"t":"p","h":"b. El conocimiento de la realidad apostólica de la Iglesia y del Organismo en el que trabaja y su inserción progresiva en ella.","n":"266"},{"t":"p","h":"c. La adquisición del hábito de percibir en la realidad los retos y urgencias del Reino.","n":"266"},{"t":"p","h":"Entre las actitudes con las que deben llevar a cabo las actividades, los formandos han de resaltar la unión con Jesucristo, el Hijo enviado por el Padre<sup class=\"fn\" data-u=\"c5\" data-n=\"126\">126<\/sup>. De este modo la caridad de Cristo les urgirá a trabajar con dedicación y generosidad en el anuncio del Evangelio<sup class=\"fn\" data-u=\"c5\" data-n=\"127\">127<\/sup> allí donde, tras el debido discernimiento, la Congregación les pida que presten ese servicio<sup class=\"fn\" data-u=\"c5\" data-n=\"128\">128<\/sup>.","n":"267","s":1},{"t":"p","h":"De esta unión brotarán otras actitudes netamente claretianas:","n":"268","s":1},{"t":"p","h":"a. Colaboración estrecha con los Pastores como esforzados auxiliares suyos en el ministerio de la Palabra<sup class=\"fn\" data-u=\"c5\" data-n=\"129\">129<\/sup>.","n":"268"},{"t":"p","h":"b. Corresponsabilidad y trabajo en equipo con sus propios hermanos de comunidad y con los distintos agentes de pastoral en misión compartida<sup class=\"fn\" data-u=\"c5\" data-n=\"130\">130<\/sup>.","n":"268"},{"t":"p","h":"c. Fortaleza y alegría para asumir con responsabilidad y sin desánimos los sacrificios, dificultades, pruebas y fracasos del apostolado, como quienes saben que la cruz es la divisa del apóstol<sup class=\"fn\" data-u=\"c5\" data-n=\"131\">131<\/sup>.","n":"268"},{"t":"p","h":"d. Oblatividad y disponibilidad para superar la mera búsqueda de satisfacción de necesidades personales.","n":"268"},{"t":"p","h":"e. Sensibilidad e intuición para captar las necesidades y retos más urgentes<sup class=\"fn\" data-u=\"c5\" data-n=\"132\">132<\/sup> con especial atención a las que provienen de las generaciones jóvenes<sup class=\"fn\" data-u=\"c5\" data-n=\"133\">133<\/sup>, sin dejarse invadir por el pesimismo, buscando con otros respuestas misioneras adecuadas.","n":"268"},{"t":"p","h":"f. Apertura a todos. Mantener un <i>diálogo de vida, que tiene siempre en cuenta a los demás y no excluye a nadie (mujeres u hombres, de una confesión cristiana u otra, de una religión u otra, de una cultura u otra)<\/i><sup class=\"fn\" data-u=\"c5\" data-n=\"134\">134<\/sup><i>.<\/i>","n":"268"},{"t":"p","h":"Las actividades apostólicas concretas se ajustarán a los siguientes criterios:","n":"269","s":1},{"t":"p","h":"a. Han de estar en sintonía con nuestro carisma y ser, al mismo tiempo, eficazmente formativas; es decir, que contribuyan positivamente a la maduración de la persona y a su habilitación misionera. Para ello, es preciso aprender a captar e interpretar la realidad en la que viven los destinatarios de nuestra palabra, a acoger su experiencia y a expresarnos en su lenguaje y en su mundo simbólico.","n":"269"},{"t":"p","h":"b. En el desempeño de las mismas debe existir una gradualidad desde el postulantado hasta la profesión perpetua o la ordenación, respetando el ritmo de maduración de cada persona.","n":"269"},{"t":"p","h":"c. Han de partir de lo existencial y del contacto directo con personas y situaciones.","n":"269"},{"t":"p","h":"d. Han de ayudar a leer la realidad como Palabra de Dios y escucharla con actitud evangélica<sup class=\"fn\" data-u=\"c5\" data-n=\"135\">135<\/sup>.","n":"269"},{"t":"p","h":"e. Deben realizarse en coordinación con los proyectos pastorales de la Iglesia y de la Congregación y ser convenientemente acompañadas y evaluadas.","n":"269"},{"t":"p","h":"f. Han de ser variadas y en rotación de áreas, opciones y sujetos para que las perspectivas que adquiera le amplíen horizontes misioneros.","n":"269"},{"t":"p","h":"Como <i>orientaciones pedagógicas:<\/i>","n":"270","s":1},{"t":"p","h":"a. Atiéndase a que cada comunidad formativa programe anualmente las actividades apostólicas teniendo en cuenta, por un lado, las opciones claretianas, la persona del formando y las posibilidades del entorno; y, por otro, su distribución armónica en relación con la oración, el estudio y la vida comunitaria.","n":"270"},{"t":"p","h":"b. Asimismo, se debe asegurar que los formandos hagan el trabajo en equipo y que a lo largo del ciclo de su formación experimenten formas de servicio pastoral cada vez más exigentes de acuerdo con su etapa de formación.","n":"270"},{"t":"p","h":"c. Tanto en los tiempos de interrupción de estudios (año pastoral) como en otros tiempos especiales (vacaciones), se pueden programar experiencias más intensas y cualificadas en el campo del servicio de la Palabra, integridad de la creación, justicia y paz y el uso de tecnologías modernas<sup class=\"fn\" data-u=\"c5\" data-n=\"136\">136<\/sup> y otras capacitaciones en consonancia con nuestras opciones misioneras<sup class=\"fn\" data-u=\"c5\" data-n=\"137\">137<\/sup>.","n":"270"},{"t":"p","h":"d. Por su parte, un miembro del equipo formativo acompañe a los formandos en su proceso de formación apostólica integral y mantenga una comunicación frecuente con quienes los acogen en su trabajo pastoral.","n":"270"}],"notes":{"1":"Cf. Aut 69, 121.","2":"Cf. Aut 85, 86, 90.","3":"Cf. Aut 775-779, 796-801.","4":"Cf. Aut 86-87.","5":"Cf. Aut 81-82, 101.","6":"Cf. Aut 85.","7":"Cf. Aut 69.","8":"Cf. Aut 70.","9":"Cf. Aut 85","10":"EC II 636.","11":"Cf. OT 8; CIC 239 §2, 240 §2, 246 §4; RFIS 107; PI 63.","12":"Cf. Dir 140.","13":"Cf. CI I, c. 34; 1VR 16.","14":"Cf. CC 54; Dir 140; CPR 56; SP 13.3.","15":"Cf. CC 73; 1F 53.","16":"Cf. MS 75.2.","17":"Cf. CIC 630; 1F 82; CF, p. 28.","18":"Cf. Dir 236.","19":"Cf. CIC 630 §1-2.","20":"Cf. RFIS 146.","21":"Cf. RFIS 147; OUCP 5.","22":"Cf. HAC 55.1.","23":"Cf. Aut 86-87; EA, p. 412.","24":"Cf. CPR 67; SP 13.3.","25":"DC 24.4.","26":"2 Tim 3,14 ss.","27":"Cf. DV 21, 25.","28":"Cf. SC 24, 51.","29":"Cf. CIC 663 §3, 652 §2; CPR 54; SP 13-14; VC 94.","30":"Cf. Aut 68, 113 ss, 120.","31":"Cf. Aut 113, 151.","32":"Cf. Aut 214-224.","33":"Cf. Aut 222; cf. PE 15.","34":"Cf. NPVM I, pp. 190 ss.","35":"Cf. RE(A) 168.","36":"Cf. CC 34.","37":"Cf. CC 37.","38":"CC 104.4.","39":"Cf. NPVM I, p. 214.","40":"Cf. SP 16.1; PTV 70.1; HAC 54.1; MS 42- 45.","41":"Cf. SP 14.1; MS 44.","42":"Cf. SP 13.1; HAC 8.","43":"Cf. SP 14; MS 45.1.","44":"Cf. SP 16.2.","45":"Cf. NPVM I, pp. 216-217; CPR 54; IBI, pp. 106-112.","46":"Cf. CF, p. 17.","47":"SP 21.2; cf. MS 45.2-3.","48":"Cf. Aut 36-40.","49":"Cf. PE 14; MCH 60; HAC 44.","50":"Cf. Aut 694; NEM III, 2. b.","51":"Cf. CIC 246 §1; VC 95.","52":"Cf. 1F 46; PE 14.","53":"Cf. 1F 46; MS 26.","54":"Cf. CC 35.","55":"Cf. 1F 46.","56":"Cf. Aut 694-695; CPR 55.","57":"Cf. Aut 86, 110; CI I, p. 142.","58":"Cf. CC 35.","59":"Cf. CI II, p. 377.","60":"1VR 122.","61":"Cf. CC 38.","62":"Cf. Rom 6,2.","63":"Cf. 2 Cor 5,21.","64":"Cf. Aut 86, 107, 644, 740, 780; EA, pp. 522, 532, 533.","65":"Cf. CIC 664; CC 38.","66":"Cf. CC 37.","67":"Cf. RE(B) 37,4.","68":"Aut 665.","69":"Cf. CC 56.","70":"CC 72.","71":"Cf. Dir 157.","72":"Cf. CC 33, 34, 56; Dir 144.","73":"Cf. CC 33.","74":"Lc 2,19.","75":"Ap. 49.","76":"CF, p. 19.","77":"CC 9.","78":"Cf. CC 73.","79":"Dir 84.","80":"Cf. CC 34, 66, 73; Dir 103; Aut 264.","81":"Cf. 2VR, Anexo 6.","82":"Cf. Palabras improvisadas del Papa Francisco a los participantes en el XXV Capitulo General, 11 de septiembre 2015.","83":"Cf. SP 21.3.","84":"Cf. Dir 144; CC 56, 72; CIC 659 §3 con 252 §1; VC 98.","85":"DCr 4.","86":"CPR 71.","87":"Cf. VC 65.","88":"SP 21.2; cf. CIC 663.3, 659.3, 252.2.","89":"SP 21.4; cf. CIC 249, 257 §2.","90":"SP 21.6; cf. CIC 659 §3, 256.","91":"Cf. OT 13-18; CIC 659, § 3; PGF Apéndice 1.","92":"MR 26; Cf. PI 65.","93":"Cf. VC 51, 68, 79.","94":"MS 60.","95":"Cf. Apéndice 3.","96":"Cf. 1F 149, 151, 153; 2F 34.","97":"Cf. 2F 35.","98":"Cf. Aut 491.","99":"Cf. Aut 489.","100":"Cf. PE 118.","101":"Cf. CC 10.","102":"Cf. PE 118.","103":"Cf. PE 107.","104":"Cf. CC 10, 11.","105":"Cf. MCH 147; MS 70.","106":"Cf. CC 11.","107":"Cf. CC 12.","108":"Cf. CC 13.","109":"Cf. CC 14.","110":"Cf. MS 70.2.","111":"Cf. CC 15.","112":"MCH 132.","113":"Cf. MCH 133.","114":"MCH 135.","115":"Cf. 2F 13; CPR 61-62; SP 7.","116":"Cf. CPR 63.","117":"Cf. SP 7.1.","118":"Cf. 2F 13c.","119":"Cf. CC 13, 85.","120":"Cf. OT 4, 19; RFIS[1985] 94-99.","121":"Cf. RE (B).","122":"Cf. CC 72, 74-75; 1F 2, 32-33, 130-131, 136-139; 2F 23-25.","123":"Cf. CPR 68.","124":"Cf. CIC 659 §3; Apéndice 3.","125":"Cf. CC 75.","126":"Cf. CC 39, 61, 73; Dir 94.","127":"Cf. CC 40; MCH 158.","128":"Cf. CC 32, 48; Dir 101, 120.","129":"Cf. CC 6; Dir 28-29; MCH 139-141, 213-214.","130":"Cf. CC 13; MCH 138-139.","131":"Cf. CC 9, 44, 46; MCH 159, 172.","132":"Cf. CC 48, 74; Dir 105-106; MCH 163.","133":"Cf. MS 63.2.","134":"HAC 58. 2.","135":"Cf. SP 21.5; MS 73, 74.2.","136":"Cf. HAC 61.7; MS 18, 67.7.","137":"Cf. CPR 68."}},{"id":"c6","title":"Los responsables y las estructuras de animación y coordinación","short":"Capítulo 6","kind":"main","pages":[165,176],"blocks":[{"t":"h","l":2,"h":"INTRODUCCIÓN"},{"t":"p","h":"Conscientes de que la vocación y su crecimiento son ante todo gracia del Señor, la responsabilidad de la formación misionera, por su extraordinaria importancia, corresponde a toda la Congregación, al Organismo Mayor y a la comunidad formativa<sup class=\"fn\" data-u=\"c6\" data-n=\"1\">1<\/sup>. De una manera especial está encomendada a los Superiores en sus distintos niveles. Se lleva a cabo también a través de otras mediaciones personales<sup class=\"fn\" data-u=\"c6\" data-n=\"2\">2<\/sup> y de diversas estructuras de animación y coordinación vocacional y formativa<sup class=\"fn\" data-u=\"c6\" data-n=\"3\">3<\/sup>.","n":"271","s":1},{"t":"h","l":2,"h":"1. LOS SUPERIORES DE LA CONGREGACIÓN"},{"t":"p","h":"La primera responsabilidad en la animación y coordinación de la pastoral vocacional y de la formación recae en los superiores de la Congregación, según los distintos niveles de su jurisdicción y conforme a los criterios señalados por la Iglesia y la Congregación<sup class=\"fn\" data-u=\"c6\" data-n=\"4\">4<\/sup>. <i>Considerarán como misión propia suya el tratar de edificar esta comunidad fraterna en Cristo<\/i><sup class=\"fn\" data-u=\"c6\" data-n=\"5\">5<\/sup>.","n":"272","s":1},{"t":"p","h":"Los superiores desempeñan estas funciones de una manera personal, o con el equipo de gobierno, o delegando algunas funciones en otras personas o en estructuras, tanto de gobierno como de pastoral vocacional y formativa. Su actuación, en algunos casos, está regulada por las normas del derecho universal y propio, las cuales señalan explícitamente las formas y los momentos en los que deben intervenir. Y, en otros, actúan conforme a su propia iniciativa y según las urgencias, necesidades y conveniencias de la Congregación, Organismo y Comunidad.","n":"273","s":1},{"t":"p","h":"Entre las responsabilidades generales que las Constituciones señalan a los superiores están las siguientes:","n":"274","s":1},{"t":"p","h":"a. El Superior General ha de <i>procurar la conservación e incremento de la Congregación<\/i> y, en consecuencia, ha de <i>promover en todas partes las vocaciones y velar por la formación de los nuestros<\/i><sup class=\"fn\" data-u=\"c6\" data-n=\"6\">6<\/sup>.","n":"274"},{"t":"p","h":"b. El Superior Mayor ha de procurar con empeño que todo el Organismo <i>se responsabilice y se comprometa en la promoción vocacional y que se ponga la máxima diligencia en el perfeccionamiento de los formandos y de los demás religiosos<\/i><sup class=\"fn\" data-u=\"c6\" data-n=\"7\">7<\/sup>.","n":"274"},{"t":"p","h":"c. Y el Superior Local ha de confortar a los hermanos de comunidad para que crezcan en su vocación misionera, <i>permanezcan fieles a sus promesas y a las demás obligaciones de nuestra vida<\/i><sup class=\"fn\" data-u=\"c6\" data-n=\"8\">8<\/sup>.","n":"274"},{"t":"p","h":"Los superiores han de ser guía, estímulo y ayuda para el sector vocacional y formativo de la Congregación, con su ejemplo, con su palabra y con su actuación.","n":"275","s":1},{"t":"p","h":"a. Considerarán la promoción vocacional y la formación, tanto inicial como permanente, como una prioridad a la que han de prestar especial atención y dedicación.","n":"275"},{"t":"p","h":"b. Buscarán, en el nombramiento de los responsables de la pastoral vocacional y de los formadores<sup class=\"fn\" data-u=\"c6\" data-n=\"9\">9<\/sup>, las personas más adecuadas para dicha función<sup class=\"fn\" data-u=\"c6\" data-n=\"10\">10<\/sup>, aunque éstas tengan que dejar otras funciones y trabajos<sup class=\"fn\" data-u=\"c6\" data-n=\"11\">11<\/sup>. Han de asegurar la estabilidad de los formadores en su cargo por un tiempo razonable.","n":"275"},{"t":"p","h":"c. Darán los criterios vocacionales y formativos prácticos, dentro de su jurisdicción, y establecerán en ella lo dispuesto en los respectivos capítulos y asambleas, en sintonía con los principios y orientaciones de la Congregación.","n":"275"},{"t":"p","h":"d. Aplicarán con esmerada atención y cuidado, previo un serio discernimiento, las normas y criterios eclesiales y congregacionales en todo lo referente a las admisiones y dimisiones de los candidatos a la profesión y a las órdenes sagradas<sup class=\"fn\" data-u=\"c6\" data-n=\"12\">12<\/sup>.","n":"275"},{"t":"p","h":"e. Organizarán, según las normas de nuestro derecho propio, las estructuras (equipos, consejos, secretariados o comisiones) de animación y coordinación de la pastoral vocacional, y de la formación inicial y permanente. Asegurarán una adecuada formación permanente y especializada de los formadores.","n":"275"},{"t":"p","h":"f. Promoverán la elaboración de los planes de pastoral vocacional y de formación inicial y permanente, según los casos, en la comunidad, Organismo o Congregación, los aprobarán y seguirán de cerca su puesta en práctica.","n":"275"},{"t":"p","h":"g. Mantendrán constante relación y unidad de criterios de actuación con los responsables de la pastoral vocacional y con los formadores<sup class=\"fn\" data-u=\"c6\" data-n=\"13\">13<\/sup>. También con los Superiores Mayores de los Organismos que han enviado formandos a su comunidad formativa.","n":"275"},{"t":"p","h":"h. Alentarán, con su presencia y sus orientaciones, a los centros vocacionales y a las comunidades formativas, visitándolos con frecuencia<sup class=\"fn\" data-u=\"c6\" data-n=\"14\">14<\/sup>. En las visitas a las demás comunidades, especialmente en las canónicas, suscitarán la conciencia y el compromiso por las vocaciones y la formación del Organismo y estimularán los planes locales de formación permanente.","n":"275"},{"t":"p","h":"i. Dotarán a los centros y comunidades formativas de los medios y recursos necesarios<sup class=\"fn\" data-u=\"c6\" data-n=\"15\">15<\/sup>.","n":"275"},{"t":"h","l":2,"h":"2. LAS PREFECTURAS DE FORMACIÓN"},{"t":"h","l":3,"h":"2.1. Aspectos generales"},{"t":"p","h":"La Prefectura de Formación es una estructura de gobierno que se constituye en el Gobierno General y en los Organismos Mayores según lo acordado por los respectivos Capítulos, general o provincial<sup class=\"fn\" data-u=\"c6\" data-n=\"16\">16<\/sup>.","n":"276","s":1},{"t":"p","h":"La Prefectura de Formación puede organizarse en diversas secciones a través de comisiones y secretariados, temporales o permanentes, según las distintas actividades vocacionales y formativas<sup class=\"fn\" data-u=\"c6\" data-n=\"17\">17<\/sup>.","n":"277","s":1},{"t":"p","h":"Al frente de la Prefectura está el Prefecto de Formación. Éste, que ha de ser una persona competente en el campo formativo, puede ser un consultor, general o provincial, o una persona no perteneciente a los respectivos equipos de gobierno<sup class=\"fn\" data-u=\"c6\" data-n=\"18\">18<\/sup>.","n":"278","s":1},{"t":"p","h":"La responsabilidad última de la Prefectura corresponde al Superior General o al Superior Mayor. Al Prefecto le corresponde la responsabilidad formativa de manera inmediata y de forma habitual.","n":"279","s":1},{"t":"p","h":"Los Prefectos de Formación, bajo la autoridad del Superior respectivo, gozarán de las facultades suficientes para cumplir la misión específica que se les ha encomendado<sup class=\"fn\" data-u=\"c6\" data-n=\"19\">19<\/sup>.","n":"280","s":1},{"t":"h","l":3,"h":"2.2. La Prefectura General de Formación"},{"t":"p","h":"Tiene como objetivo específico animar y coordinar la tarea formativa de la Congregación ofreciendo orientaciones de carácter general y dejando a las correspondientes Prefecturas Provinciales<sup class=\"fn\" data-u=\"c6\" data-n=\"20\">20<\/sup> la aplicación a las circunstancias de cada Organismo y zona<sup class=\"fn\" data-u=\"c6\" data-n=\"21\">21<\/sup>. Si la pastoral vocacional o la formación permanente se encomienden a otras prefecturas o secretariados, la Prefectura de Formación trabajará en colaboración con ellas.","n":"281","s":1},{"t":"p","h":"La designación del Prefecto General de Formación corresponde al Superior General con su Consejo, teniendo en cuenta, en el caso de que sea Consultor, la orientación dada por el Capítulo General<sup class=\"fn\" data-u=\"c6\" data-n=\"22\">22<\/sup>.","n":"282","s":1},{"t":"p","h":"El Prefecto, para realizar mejor su función, puede tener un ayudante o auxiliar, que será nombrado por el Gobierno General.","n":"283","s":1},{"t":"p","h":"El Prefecto General de Formación puede convocar, siempre que sea necesario y oportuno, comisiones especiales de formación para el estudio y asesoramiento de situaciones y casos particulares.","n":"284","s":1},{"t":"p","h":"Son funciones de la Prefectura General de Formación:","n":"285","s":1},{"t":"p","h":"a. Ayudar directamente al Superior y al Gobierno General en la animación de la formación en la Congregación mediante la información periódica, el asesoramiento y la puesta en práctica de sus decisiones y orientaciones.","n":"285"},{"t":"p","h":"b. Animar el proceso de formación integral y transformadora.","n":"285"},{"t":"p","h":"c. Promover constantemente una cuidada selección vocacional y una formación de calidad, que sea claretiana, personalizada y actualizada, en orden a la misión.","n":"285"},{"t":"p","h":"d. Impulsar la selección y formación de los formadores y estimular y orientar las especializaciones en la Congregación<sup class=\"fn\" data-u=\"c6\" data-n=\"23\">23<\/sup>.","n":"285"},{"t":"p","h":"e. Ayudar de una manera particular a los Organismos Mayores más necesitados.","n":"285"},{"t":"p","h":"f. Favorecer el intercambio de formadores y profesores entre los diversos Organismos de la Congregación.","n":"285"},{"t":"p","h":"g. Promover entre los responsables de los Organismos Mayores y áreas congregacionales la relación y la comunicación que contribuyan a la ayuda interprovincial.","n":"285"},{"t":"p","h":"h. Cuidar que el PGF sea aplicado y evaluado en los Organismos Mayores de la Congregación<sup class=\"fn\" data-u=\"c6\" data-n=\"24\">24<\/sup>, de acuerdo con las características de cada área cultural.","n":"285"},{"t":"p","h":"i. Estimular la elaboración de los Planes de los Organismos, los proyectos locales (de formación inicial y permanente) y el proyecto personal de formación, en línea con las orientaciones de la Iglesia y de la Congregación.","n":"285"},{"t":"p","h":"Son actividades propias de la Prefectura:","n":"286","s":1},{"t":"p","h":"a. La comunicación frecuente con los superiores de la Congregación y con los responsables de la pastoral vocacional y de la formación (inicial y permanente), a través de la correspondencia epistolar, los diálogos personales o en grupo y otros medios de relación.","n":"286"},{"t":"p","h":"b. Las visitas periódicas a los centros vocacionales y formativos, debidamente programadas y organizadas en contacto con los respectivos responsables de los Organismos.","n":"286"},{"t":"p","h":"c. La organización y/o participación, según los casos, en encuentros y reuniones con los responsables de la pastoral vocacional, los formadores y formandos, tanto a nivel general como zonal y del Organismo<sup class=\"fn\" data-u=\"c6\" data-n=\"25\">25<\/sup>.","n":"286"},{"t":"p","h":"d. El ofrecimiento a los centros de la Congregación de subsidios vocacionales y formativos, claretianos y no claretianos.","n":"286"},{"t":"p","h":"e. La información a los responsables sobre las experiencias vocacionales y formativas que se realizan en la Iglesia y en la Congregación<sup class=\"fn\" data-u=\"c6\" data-n=\"26\">26<\/sup>.","n":"286"},{"t":"p","h":"f. La organización de iniciativas de formación (Escuela de Formadores Corazón de María, talleres por Conferencias, cursos online, etc.) para los formadores de la Congregación<sup class=\"fn\" data-u=\"c6\" data-n=\"27\">27<\/sup>.","n":"286"},{"t":"p","h":"g. La organización de encuentros para los responsables de la Pastoral Vocacional y la Formación<sup class=\"fn\" data-u=\"c6\" data-n=\"28\">28<\/sup>.","n":"286"},{"t":"p","h":"h. La promoción de iniciativas de estudio e intercambio entre los profesores pertenecientes a nuestros centros académicos y a otras instituciones no congregacionales<sup class=\"fn\" data-u=\"c6\" data-n=\"29\">29<\/sup>.","n":"286"},{"t":"h","l":3,"h":"2.3. Las Prefecturas de Formación de los Organismos Mayores"},{"t":"p","h":"La Prefectura tiene como objetivo específico animar y coordinar el proceso de formación inicial y permanente en el Organismo.","n":"287","s":1},{"t":"p","h":"En principio, el área de la Prefectura abarca la formación inicial y permanente. Según las circunstancias, no obstante, los Capítulos o Gobiernos de los Organismos Mayores pueden crear, según los casos, otras Prefecturas, consejos o comisiones para animar la formación permanente<sup class=\"fn\" data-u=\"c6\" data-n=\"30\">30<\/sup>.","n":"288","s":1},{"t":"p","h":"El Prefecto Provincial de Formación es nombrado o elegido según las diversas modalidades indicadas en nuestro derecho<sup class=\"fn\" data-u=\"c6\" data-n=\"31\">31<\/sup>.","n":"289","s":1},{"t":"p","h":"Son funciones de la Prefectura:","n":"290","s":1},{"t":"p","h":"a. Informar y asesorar al Superior y Gobierno Provincial en los asuntos de pastoral vocacional, formación inicial y permanente, y ejecutar sus decisiones y orientaciones.","n":"290"},{"t":"p","h":"b. Crear entre los responsables de la pastoral vocacional y de la formación inicial un sentido de comunión y corresponsabilidad.","n":"290"},{"t":"p","h":"c. Coordinar criterios y métodos para lograr una eficaz pastoral vocacional y un proceso formativo unitario, gradual y orgánico.","n":"290"},{"t":"p","h":"d. Procurar que se elabore el Plan de Formación del Organismo, teniendo como marco el PGF, y que sea aplicado y evaluado en el Organismo.","n":"290"},{"t":"p","h":"e. Evaluar periódicamente el proceso formativo, inicial y permanente, de la Provincia y ofrecer orientaciones para su mejor funcionamiento.","n":"290"},{"t":"p","h":"f. Informar al Prefecto General de Formación sobre la situación de la formación en su Organismo.","n":"290"},{"t":"p","h":"Entre las actividades de la Prefectura se indican las siguientes:","n":"291","s":1},{"t":"p","h":"a. La comunicación y relación con el Prefecto General de Formación y más frecuentemente con los responsables de la pastoral vocacional y con los formadores y formandos de los centros formativos.","n":"291"},{"t":"p","h":"b. Las visitas periódicas a los centros vocacionales y formativos y colaboración con ellos en las actividades propias.","n":"291"},{"t":"p","h":"c. La organización de reuniones y encuentros de estudio y formación con los profesores y formadores de la Provincia.","n":"291"},{"t":"p","h":"d. La elaboración y actualización periódica del Plan de Formación del Organismo y la revisión de los proyectos formativos locales<sup class=\"fn\" data-u=\"c6\" data-n=\"32\">32<\/sup>.","n":"291"},{"t":"p","h":"e. La animación de la formación permanente de las comunidades y de la elaboración del proyecto personal de formación.","n":"291"},{"t":"p","h":"f. La programación de la formación permanente del Organismo, siguiendo las orientaciones de los Capítulos y Gobiernos Provinciales y organización de las actividades programadas (cursos, encuentros, reuniones, ejercicios espirituales)<sup class=\"fn\" data-u=\"c6\" data-n=\"33\">33<\/sup>.","n":"291"},{"t":"p","h":"g. La elaboración y ofrecimiento de medios y subsidios de formación para las personas y comunidades.","n":"291"},{"t":"p","h":"h. La convocatoria del Consejo Provincial de Formación según esté establecida y siempre que se juzgue conveniente.","n":"291"},{"t":"h","l":3,"h":"2.4. Los Consejos de Formación"},{"t":"p","h":"Teniendo en cuenta las diversas experiencias congregacionales, se recomienda la constitución del Consejo de Formación en cada Organismo<sup class=\"fn\" data-u=\"c6\" data-n=\"34\">34<\/sup>.","n":"292","s":1},{"t":"p","h":"El Consejo de Formación es un órgano de corresponsabilidad y participación formativa en el Organismo.","n":"293","s":1},{"t":"p","h":"Tiene como finalidad inmediata asegurar la unidad y la continuidad del proceso formativo del Organismo y ayudar a la Prefectura de Formación en el cumplimiento de su misión formativa y en la realización de sus funciones y actividades propias<sup class=\"fn\" data-u=\"c6\" data-n=\"35\">35<\/sup>. También analiza y presenta soluciones a los diversos problemas que vayan surgiendo en las etapas de la formación y estudia el proceso formativo con una proyección de futuro.","n":"294","s":1},{"t":"p","h":"La constitución del Consejo de Formación, sus competencias y su funcionamiento serán determinados por el Gobierno de cada Organismo mediante un reglamento apropiado<sup class=\"fn\" data-u=\"c6\" data-n=\"36\">36<\/sup>.","n":"295","s":1},{"t":"p","h":"En el Consejo de Formación debe haber representantes de la pastoral de jóvenes y vocaciones, de todas las etapas formativas, de formadores y formandos, encargados de la formación permanente, y de otros sectores del Organismo.","n":"296","s":1},{"t":"p","h":"Se organizarán reuniones del Equipo de Formadores, constituido solamente por éstos, para tratar asuntos propios de su competencia.","n":"297","s":1},{"t":"p","h":"En donde parezca oportuno y dadas las circunstancias del centro formativo, se puede crear el Consejo Local de Formación, integrado por formadores y formandos, como órgano de participación, corresponsabilidad y ejecución de la comunidad formativa. Para tratar asuntos propios de su competencia reúnase periódicamente el equipo local de formadores<sup class=\"fn\" data-u=\"c6\" data-n=\"37\">37<\/sup>.","n":"298","s":1},{"t":"p","h":"Además de expresar su corresponsabilidad con la representación en los Consejos de Formación, los formandos pueden participar también en la animación formativa a través de otras estructuras que los Organismos Mayores juzguen más convenientes según las circunstancias (consejos, asamblea de formandos).","n":"299","s":1},{"t":"h","l":2,"h":"3. COLABORACIÓN INTERPROVINCIAL"},{"t":"p","h":"La colaboración interprovincial<sup class=\"fn\" data-u=\"c6\" data-n=\"38\">38<\/sup> en el campo de la formación manifiesta el servicio común a la Iglesia, la unidad y la comunión de personas y bienes de toda la Congregación y la fraternidad entre sus miembros.","n":"300","s":1},{"t":"p","h":"La naturaleza multicultural, el crecimiento de la misión universal y el número reducido de formandos en algunos Organismos de la Congregación favorecen la creación de centros formativos interprovinciales que requieren una colaboración y coordinación estrecha entre diversos Organismos.","n":"301","s":1},{"t":"p","h":"Debemos promover el espíritu de solidaridad y cooperación entre todos los miembros de la Congregación<sup class=\"fn\" data-u=\"c6\" data-n=\"39\">39<\/sup> en todas las etapas formativas, a partir de la pastoral vocacional, procurando favorecer al máximo la mutua ayuda entre los Organismos de la Congregación<sup class=\"fn\" data-u=\"c6\" data-n=\"40\">40<\/sup>, llegando incluso a la concentración de centros cuando fuere necesario<sup class=\"fn\" data-u=\"c6\" data-n=\"41\">41<\/sup>.","n":"302","s":1},{"t":"p","h":"La Prefectura General de Formación y las Conferencias Interprovinciales promuevan y organicen reuniones de las Prefecturas de carácter interprovincial. Su finalidad será contrastar experiencias, estudiar y reflexionar sobre temas específicos y buscar y organizar líneas de acción comunes.","n":"303","s":1},{"t":"p","h":"Los encuentros interprovinciales y regionales de formandos, así como la organización de acciones conjuntas (preparación para la primera profesión y la profesión perpetua, aprendizaje de idiomas, experiencias pastorales u otras experiencias a discernir oportunamente) contribuyen a profundizar el sentido de pertenencia congregacional y favorecen la apertura universal. Deben ser, pues, estimulados, según la periodicidad y modos que se estimen oportunos según los casos.","n":"304","s":1},{"t":"p","h":"Los formadores y profesores de nuestros centros estarán siempre disponibles para prestar sus servicios de una manera temporal o permanente en cualquier parte de la Congregación donde fuere necesario. Las diversas instancias impulsarán el intercambio de formadores y profesores de nuestros centros formativos y académicos para un mayor enriquecimiento mutuo<sup class=\"fn\" data-u=\"c6\" data-n=\"42\">42<\/sup>. Puede resultar conveniente que el equipo formativo y especialmente el prefecto de formación de Organismos que cuentan con casas formativas interculturales vivan experiencias de corta o media duración en otros centros formativos de la Congregación, especialmente en los lugares de procedencia de sus formandos, o hacer intercambio de formadores.","n":"305","s":1}],"notes":{"1":"Cf. CIC 652 §4; CC 58, 76; Dir 160.","2":"Cf. PGF, capítulo 3.","3":"Cf. 1F 84; MS 75.4.","4":"Cf. CC 138.4, 113.5.","5":"PI 27.","6":"CC 138.4.","7":"CC 113 §5; cf HAC 63.2.","8":"CC 104.4.","9":"Cf. Dir 457a, 210, 248.","10":"Cf. OT 5; Dir 264.","11":"Cf. MS 75.5.","12":"Cf. CIC 642, 653, 1025, 1028-1030.","13":"Cf. RC 32; PI 52.","14":"Cf. CC 134.","15":"Cf. HAC 63.4.","16":"Cf. Dir 412.","17":"Cf. Dir 412.","18":"Cf. 1F 164a; Dir 413-414.","19":"Cf. Dir 416.","20":"Cuando decimos Prefecto Provincial se refiere al Prefecto de los Organismos Mayores (Provincia o Delegación). Cuando hablamos de interprovinciales, significa entre los diferentes Organismos Mayores.","21":"Cf. 1F 165.","22":"Cf. Dir 413.","23":"Cf. Dir. 168-169, 245.","24":"Cf. MS 75.1.","25":"Cf. Dir 176; 1F 164c.","26":"Cf. Dir 177.","27":"Cf. HAC 63.3-4.","28":"Cf. 2F 27; CPR 69; MS 75.6.","29":"Cf. 1F 165; 2F 32.","30":"Cf. RG 73.","31":"Cf. Dir 414.","32":"Cf. Dir 168.","33":"Cf. 2F 30; HAC 55.","34":"Cf. Dir 166.","35":"Ibid.","36":"Ibid.","37":"Cf. 1F 85.","38":"Cuando se dice “Interprovincial” se entiende “entre Organismos Mayores”. Sean Provincias o Delegaciones.","39":"Cf. Dir 306.","40":"Cf. Dir 307.","41":"Cf. Dir 239.","42":"Cf. HAC 63.5."}},{"id":"c7","title":"Las etapas de preparación: prenoviciado (aspirantado y postulantado)","short":"Capítulo 7","kind":"main","pages":[181,198],"blocks":[{"t":"h","l":2,"h":"INTRODUCCIÓN"},{"t":"p","h":"El Directorio Vocacional Claretiano (DVC) orienta el discernimiento, la selección y la preparación de los candidatos que desean ingresar en nuestra comunidad congregacional. Entonces es necesario cuidar los criterios expuestos en el DVC para asegurar los fundamentos necesarios de la vocación misionera claretiana y así procurar un camino formativo sólido.","n":"306","s":1},{"t":"p","h":"Los responsables de la Pastoral Vocacional y del Prenoviciado, así como los candidatos y sus familias, conocerán los criterios generales de discernimiento en vigor para el Prenoviciado.","n":"307","s":1},{"t":"h","l":2,"h":"1. CRITERIOS GENERALES DE DISCERNIMIENTO"},{"t":"p","h":"Los criterios generales de discernimiento permiten verificar, tanto al candidato como a la Congregación, si existen signos positivos de verdadera vocación<sup class=\"fn\" data-u=\"c7\" data-n=\"1\">1<\/sup>.","n":"308","s":1},{"t":"p","h":"Los criterios señalados por la Iglesia y la Congregación son los siguientes<sup class=\"fn\" data-u=\"c7\" data-n=\"2\">2<\/sup>:","n":"309","s":1},{"t":"p","h":"a. Recta intención con motivaciones e intereses vocacionales auténticos y válidos.","n":"309"},{"t":"p","h":"b. Plena libertad a la hora de optar por la vida religiosa y, en particular, por la Congregación, atendiendo las normas de cada lugar sobre la mayoría de edad.","n":"309"},{"t":"p","h":"c. Índole, es decir, temperamento, carácter y personalidad apropiados, especialmente para la vida de comunidad, el trabajo en equipo y el servicio a los demás.","n":"309"},{"t":"p","h":"d. Cualidades requeridas para vivir la vida religiosa claretiana y participar en la misión de la Congregación. Entre ellas, buena salud física y psíquica, suficiente nivel intelectual, madurez y equilibrio psicológico según la edad de la persona; <i>y cualidades humanas, morales y espirituales adecuadas<\/i><sup class=\"fn\" data-u=\"c7\" data-n=\"3\">3<\/sup>.","n":"309"},{"t":"p","h":"e. Ausencia de contraindicaciones vocacionales, en sentido estricto, y de otros rasgos de la personalidad que impidan realizar las exigencias vocacionales claretianas.","n":"309"},{"t":"p","h":"f. En relación a las personas con tendencias homosexuales que quieren entrar en la Congregación, o que descubren durante la formación esta situación, en coherencia con el Magisterio, la Congregación, respetando profundamente a las personas en cuestión, no puede admitir a la profesión y a las Órdenes Sagradas a quienes practican la homosexualidad, presentan tendencias homosexuales profundamente arraigadas o sostienen la
