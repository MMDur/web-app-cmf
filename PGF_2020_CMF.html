ompañamiento de la comunidad<sup class=\"fn\" data-u=\"c9\" data-n=\"59\">59<\/sup>.","n":"413","s":1},{"t":"p","h":"Este diálogo se hace más necesario en los momentos de dificultad y cuando se ha de solicitar y preparar la renovación de la profesión, la profesión perpetua y la ordenación.","n":"414","s":1},{"t":"p","h":"El acompañamiento personal, dada su importancia en orden al discernimiento y afianzamiento vocacionales, será un criterio prioritario para que los formadores y superiores se orienten, especialmente en los momentos de admisión a la profesión y a la ordenación.","n":"415","s":1},{"t":"h","l":2,"h":"7. EL PREFECTO Y SUS COLABORADORES"},{"t":"p","h":"El prefecto es el formador propio de los misioneros que se preparan para la profesión perpetua y la ordenación diaconal o presbiteral. Se trata de un servicio muy importante por su fin y por sus consecuencias, ya que su misión es acompañar y formar, con su testimonio de vida y sus orientaciones, a aquellos que, a través del ministerio de la Palabra, serán como instrumentos de la salvación de muchos<sup class=\"fn\" data-u=\"c9\" data-n=\"60\">60<\/sup>. Es preciso, pues, que aquel que sea nombrado por el Superior Mayor con el consentimiento de su Consejo<sup class=\"fn\" data-u=\"c9\" data-n=\"61\">61<\/sup>, se prepare convenientemente y procure desempeñar con toda solicitud el servicio que la Congregación le encomienda.","n":"416","s":1},{"t":"p","h":"En nuestra tradición claretiana el prefecto es la persona que, en nombre de la Congregación, acompaña a los formandos en el desarrollo integral de su vocación misionera. Su misión no se reduce, pues, a los aspectos organizativos, disciplinares y de acompañamiento espiritual. Abarca todas las dimensiones formativas con objeto de promover una formación armónica.","n":"417","s":1},{"t":"p","h":"Las funciones principales del prefecto son:","n":"418","s":1},{"t":"p","h":"a. Amar igualmente a todos y conocer las necesidades de cada uno<sup class=\"fn\" data-u=\"c9\" data-n=\"62\">62<\/sup>.","n":"418"},{"t":"p","h":"b. Inspirar a los estudiantes, con su vida y con su palabra, el amor a la vocación, a la Iglesia y a nuestra Congregación, y exponerles su vida y misión en el mundo.","n":"418"},{"t":"p","h":"c. Ayudarles personalmente a afianzarse en su vocación y a vivirla con gozo, <i>de manera que todos asuman este modo de vida por íntimo convencimiento de fe<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"63\">63<\/sup>.","n":"418"},{"t":"p","h":"d. Animar la formación, <i>procurando que la virtud sea preferida al saber, pero no descuidando tampoco éste, porque la santidad y la inteligencia son los dos pies del misionero: ambas esenciales<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"64\">64<\/sup>.","n":"418"},{"t":"p","h":"e. Fomentar la responsabilidad y disciplina interior de cada formando, ayudándolo a crecer en libertad para optar por Dios.","n":"418"},{"t":"p","h":"f. Alentar la comunión de vida entre todos y mantenerse en comunión con los superiores, informándoles sobre la marcha de la comunidad formativa, discerniendo con ellos lo más conveniente y ejecutando sus orientaciones<sup class=\"fn\" data-u=\"c9\" data-n=\"65\">65<\/sup>.","n":"418"},{"t":"p","h":"El prefecto puede ser ayudado en su tarea por uno o varios colaboradores, con capacidades complementarias<sup class=\"fn\" data-u=\"c9\" data-n=\"66\">66<\/sup>. A él le corresponde la coordinación de todos los aspectos formativos y del equipo de colaboradores<sup class=\"fn\" data-u=\"c9\" data-n=\"67\">67<\/sup>. Entre estos ha de existir un fuerte sentido de unidad, tanto de criterio como de acción, dentro del estilo personal de cada miembro<sup class=\"fn\" data-u=\"c9\" data-n=\"68\">68<\/sup>. Su primera acción formativa es el testimonio alegre de vida misionera, que estimule a los formandos a un mayor compromiso en el seguimiento de Cristo según nuestro carisma.","n":"419","s":1},{"t":"p","h":"De entre las capacidades y cualidades de madurez humana y espiritual que se exigen a los formadores, el prefecto y sus colaboradores deben acentuar:","n":"420","s":1},{"t":"p","h":"a. La ejemplaridad, <i>de modo que resplandezca su amor a la Congregación y a la observancia de las Constituciones<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"69\">69<\/sup>.","n":"420"},{"t":"p","h":"b. El sentido eclesial y la sensibilidad misionera<sup class=\"fn\" data-u=\"c9\" data-n=\"70\">70<\/sup>.","n":"420"},{"t":"p","h":"<i>c. Una sólida formación como formadores<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"71\">71<\/sup>.","n":"420"},{"t":"p","h":"d. Una adecuada experiencia pastoral.","n":"420"},{"t":"p","h":"e. La capacidad de cuidar de los formandos, de adaptación y sintonía con ellos.","n":"420"},{"t":"p","h":"Las funciones principales del equipo son:","n":"421","s":1},{"t":"p","h":"a. Animar la formación de esta etapa buscando la corresponsabilidad de todos los miembros de la comunidad formativa.","n":"421"},{"t":"p","h":"b. Implementar de manera efectiva y creativa las líneas y medios formativos más en consonancia con el sentir de la Iglesia y de la Congregación.","n":"421"},{"t":"p","h":"c. Crear un buen clima comunitario y ayudar a vivir los compromisos de la programación formativa elaborada conjuntamente por todos los miembros de la comunidad.","n":"421"},{"t":"p","h":"d. Desempeñar las tareas concretas que a cada uno le hayan sido asignadas.","n":"421"},{"t":"p","h":"e. Ayudar a que los formandos crezcan como ministros idóneos de la Palabra y se mantengan disponibles para las necesidades de la Congregación.","n":"421"},{"t":"p","h":"f. Abordar con realismo y serenidad las cuestiones y problemas formativos que surjan.","n":"421"},{"t":"p","h":"g. Juzgar si los formandos ofrecen las garantías debidas, señaladas por la Iglesia y la Congregación, para la profesión y, según los casos, los ministerios y la ordenación.","n":"421"},{"t":"p","h":"h. Acompañar la formación en el uso responsable de los nuevos recursos tecnológicos y digitales como auténticas herramientas apostólicas.","n":"421"},{"t":"p","h":"i. Discernir las aptitudes apostólicas de cada formando para sugerir al gobierno provincial las posibles especializaciones y destinos.","n":"421"},{"t":"p","h":"j. Evaluar periódicamente la marcha de la comunidad formativa y de cada formando.","n":"421"},{"t":"h","l":2,"h":"8. LA PROFESIÓN PERPETUA Y SU PREPARACIÓN INMEDIATA"},{"t":"p","h":"Por la profesión perpetua el misionero de votos temporales <i>se incorpora definitivamente a la Congregación<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"72\">72<\/sup> y de este modo participa plenamente de su misión en el pueblo de Dios<sup class=\"fn\" data-u=\"c9\" data-n=\"73\">73<\/sup>.","n":"422","s":1},{"t":"p","h":"Dada la importancia de esta profesión, además de la preparación ordinaria que supone el proceso formativo en sí mismo, todos los formandos se prepararán inmediatamente para ella durante un período de seis meses. Durante este período:","n":"423","s":1},{"t":"p","h":"a. Intensificarán la oración personal, el tiempo de silencio y el discernimiento.","n":"423"},{"t":"p","h":"b. Renovarán los fundamentos teóricos y vivenciales de la vida religiosa claretiana.","n":"423"},{"t":"p","h":"c. Evaluarán la vida misionera en diálogo más asiduo con el formador<sup class=\"fn\" data-u=\"c9\" data-n=\"74\">74<\/sup>.","n":"423"},{"t":"p","h":"d. Expresarán su disponibilidad misionera ofreciéndose al Superior General para ser enviados donde sea necesario<sup class=\"fn\" data-u=\"c9\" data-n=\"75\">75<\/sup>.","n":"423"},{"t":"p","h":"Esta preparación<sup class=\"fn\" data-u=\"c9\" data-n=\"76\">76<\/sup>, especialmente necesaria para los que residen fuera de la comunidad formativa<sup class=\"fn\" data-u=\"c9\" data-n=\"77\">77<\/sup>, puede realizarse individualmente o en grupo, según las circunstancias de cada lugar. Son recomendables también aquellas iniciativas interprovinciales que garanticen una mejor consecución de los objetivos y que proporcionen al estudiante experiencias intensivas y una mayor apertura congregacional. Se aconseja disponer de un período prolongado, de dedicación exclusiva, al estilo de un <i>segundo noviciado<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"78\">78<\/sup>.","n":"424","s":1},{"t":"p","h":"La admisión a la profesión perpetua se debe basar en la certeza moral, por parte del formando y de la Congregación, de que el profesando conoce y vive la vocación como un bien de la persona en su totalidad<sup class=\"fn\" data-u=\"c9\" data-n=\"79\">79<\/sup>; posee la necesaria madurez vocacional para vivir con estabilidad las exigencias de la vida claretiana y la capacidad suficiente, tanto para afrontar las dificultades de la misión como para proseguir su crecimiento en la vida evangélica.","n":"425","s":1},{"t":"p","h":"Para que la profesión perpetua sea válida han de cumplirse las prescripciones del derecho universal y propio<sup class=\"fn\" data-u=\"c9\" data-n=\"80\">80<\/sup>. Se ha de solicitar por escrito al Superior Mayor seis meses antes de la fecha prevista para su celebración<sup class=\"fn\" data-u=\"c9\" data-n=\"81\">81<\/sup>. Esta admisión corresponde al mismo Superior Mayor con el consentimiento de su Consejo<sup class=\"fn\" data-u=\"c9\" data-n=\"82\">82<\/sup>. <i>Todos los miembros de la comunidad, especialmente el superior, los formadores y los compañeros, están obligados a informar acerca de los candidatos<\/i><sup class=\"fn\" data-u=\"c9\" data-n=\"83\">83<\/sup>.","n":"426","s":1},{"t":"p","h":"La profesión perpetua se realizará con solemnidad y con la presencia del pueblo<sup class=\"fn\" data-u=\"c9\" data-n=\"84\">84<\/sup>. Para la solicitud, preparación y celebración, así como para su constancia en acta, registro y comunicación, ténganse en cuenta las prescripciones del derecho universal y congregacional<sup class=\"fn\" data-u=\"c9\" data-n=\"85\">85<\/sup>.","n":"427","s":1},{"t":"p","h":".","n":"427"}],"notes":{"1":"Cf. 1F 123-124.","2":"Cf. CIC 659.1.","3":"Dir 234; Cf. CC 72.","4":"Dir 215.","5":"Cf. CC 70; Dir 221.","6":"Cf. CIC 688 §1; CC 60; Dir 271.","7":"Cf. CIC 688 §2; Dir 273.","8":"Cf. CIC 688 §2; Dir 272.","9":"Cf. PI 34.","10":"Cf. CPR 22; 24.","11":"Cf. Dir 235.","12":"Cf. Ibid.","13":"Cf. PI 43.","14":"Cf. 2F 13d.","15":"Cf. Dir 306, 308.","16":"Cf. CC 34.","17":"Cf. MCH 144.","18":"Cf. CC 73.","19":"Cf. CC 72.","20":"Cf. SP 13.1.","21":"Cf. SP 21.2.","22":"Cf. CC 73.","23":"Cf. PI 24.","24":"Cf. PI 24-25.","25":"Cf. 1F 126-129; 2F 13d.","26":"Cf. Dir 240; 2F 13c.","27":"Cf. Dir 239.","28":"Cf. PI 59.","29":"PI 59.","30":"Cf. CIC 660 §1.","31":"Cf. PI 60-65; Dir 235.","32":"PI 59.","33":"CC 73.","34":"Dir 236.","35":"Cf. MCH 150.","36":"Cf. CC 37.","37":"Cf. CC 35.","38":"Cf. CIC 663 §1, 246 §1; CC 12.","39":"Cf. CC 38.","40":"Cf. EG 122-126.","41":"Cf. CC 56; Dir 144; PI 61.","42":"Cf. CC 74.","43":"Dir 236.","44":"Cf. Dir 237; Apéndice 3.","45":"Cf. el apartado 2 del capítulo 10; Apéndice 3; Dir 238; 1HH 30.","46":"Dir. 237.","47":"Dir 237.","48":"Cf. Dir 247.","49":"Cf. CC 73.","50":"Cf. HAC 65.1-2; MS 71.1.","51":"Dir 236","52":"Cf. TM pp 21-22.","53":"Cf. Dir 235.","54":"Cf. Dir 236.","55":"Cf. CC 75.","56":"Dir 245.","57":"Cf. Dir 236.","58":"MS 75.2.","59":"Cf. VFC 21-34.","60":"Cf. RE (B) 37; CC 77.","61":"Cf. Dir 248.","62":"Cf. RE (B) 37.8; CC 77.","63":"CC 77.","64":"RE (B) 37.4.","65":"Cf. RE (B) 37.2; Dir 251.","66":"Cf. 2F 14.","67":"Cf. OT 5; 1F 75; Dir 162.","68":"Cf. 2F 14b.","69":"RE (B) 37.1.","70":"Cf. Dir 249.","71":"VNON 16, 34-37.","72":"CC 71.","73":"CC 71.","74":"Cf. Dir 241.","75":"Cf. Dir 225.","76":"Cf. Apéndice 3,V.","77":"Cf. Dir 241.","78":"El segundo noviciado hace referencia a un periodo entre uno y dos meses de preparación exclusiva para la profesión perpetua, generalmente organizado entre varios Organismos Mayores.","79":"Cf. CC 71.","80":"Cf. CIC 658; Dir 226","81":"Cf. Dir 224.","82":"Cf. CC 71; Dir 228.","83":"Dir 227.","84":"Cf. OPR 5; PI 56.","85":"Cf. CIC 657, 658; CC 71; Dir 224-227, 232, 241."}},{"id":"c10","title":"Formación específica","short":"Capítulo 10","kind":"main","pages":[237,252],"blocks":[{"t":"h","l":2,"h":"1. LA NECESIDAD DE LA FORMACIÓN PARA LAS VOCACIONES ESPECÍFICAS"},{"t":"p","h":"En nuestro Instituto se da unidad de vocación y de misión, así como diversidad y complementariedad de modos de vivirla<sup class=\"fn\" data-u=\"c10\" data-n=\"1\">1<\/sup>. Cuanto se expresa en este capítulo se refiere a la preparación específica de los misioneros hermanos y de los misioneros llamados a los ministerios ordenados<sup class=\"fn\" data-u=\"c10\" data-n=\"2\">2<\/sup>. Presupone, como preparación común, la progresiva maduración que se va obrando en las diferentes etapas formativas y que constituye la base para cualquier servicio congregacional y eclesial.","n":"428","s":1},{"t":"p","h":"A largo de la formación, lo específico de las diversas formas de la vocación claretiana debe ser presentado y promovido entre los candidatos desde la primera etapa de la formación inicial. Así, se posibilitará un mejor acompañamiento en el discernimiento a lo largo de las diversas etapas.","n":"429","s":1},{"t":"p","h":"En el modo de vivir la vocación y realizar la misión hay que tener en cuenta: los dones personales<sup class=\"fn\" data-u=\"c10\" data-n=\"3\">3<\/sup>; las cualidades para ejercer un ministerio concreto; las necesidades de la Iglesia, de la Congregación y del mundo; la disponibilidad para el servicio universal; la capacidad para trabajar en colaboración con otros.","n":"430","s":1},{"t":"h","l":2,"h":"2. ASPECTOS PARTICULARES DE LA FORMACIÓN DEL MISIONERO HERMANO"},{"t":"h","l":3,"h":"2.1. Criterios generales"},{"t":"p","h":"La formación de los hermanos, tanto inicial como permanente, debe ser una formación integral, dentro de la cual hay que potenciar de una manera especial aquellos aspectos particulares que están más en consonancia con su vocación laical<sup class=\"fn\" data-u=\"c10\" data-n=\"4\">4<\/sup>. <i>Desde ahí busca y señala a Dios en las realidades seculares de la cultura, la ciencia, la salud humana, el mundo del trabajo, el cuidado de los débiles y desfavorecidos<\/i><sup class=\"fn\" data-u=\"c10\" data-n=\"5\">5<\/sup>.","n":"431","s":1},{"t":"p","h":"Entre los aspectos particulares, cabe destacar los siguientes:","n":"432","s":1},{"t":"p","h":"a. Una formación humanística que posibilite el contacto con la cultura de hoy y la adquisición de una particular sensibilidad hacia el mundo del trabajo, de la educación, de la economía, del arte, de la comunicación social y de las relaciones humanas.","n":"432"},{"t":"p","h":"b. Una formación bíblico-teológica que asegure la fundamentación de su vida claretiana laical y de la misión apostólica que ha de desempeñar.","n":"432"},{"t":"p","h":"c. Una formación pastoral, en línea con nuestro carisma misionero de servidores de la Palabra y de los ministerios propios de su condición laical, que le permita una plena integración en la misión claretiana<sup class=\"fn\" data-u=\"c10\" data-n=\"6\">6<\/sup>.","n":"432"},{"t":"p","h":"d. Una formación profesional en perspectiva misionera, especializada y, a ser posible, titulada, que le capacite para realizar servicios cualificados en la comunidad y una presencia testimoniante en otras situaciones temporales<sup class=\"fn\" data-u=\"c10\" data-n=\"7\">7<\/sup>. Y desde esta formación buscar y señalar a Dios en las realidades seculares de la cultura, la ciencia, la salud humana, el mundo del trabajo, el cuidado de los débiles y desfavorecidos<sup class=\"fn\" data-u=\"c10\" data-n=\"8\">8<\/sup>.","n":"432"},{"t":"p","h":"e. Una formación sociopolítica para responder a las exigencias y opciones de nuestra misión y a los desafíos que plantea la realidad de cada pueblo.","n":"432"},{"t":"p","h":"f. Una formación que le permita compartir las realidades seculares y de la vida humana, en una búsqueda de la restauración de la dignidad y el valor positivo del trabajo, haciéndose próximo a sus hermanos más sencillos e identificándose con Jesús, hermano y obrero<sup class=\"fn\" data-u=\"c10\" data-n=\"9\">9<\/sup>.","n":"432"},{"t":"h","l":3,"h":"2.2. Orientaciones formativas"},{"t":"p","h":"Para poder cumplir los objetivos propios de la etapa de misioneros en formación, los misioneros hermanos no serán destinados inmediatamente después del noviciado a aquellas obras apostólicas que les impidan proseguir su formación<sup class=\"fn\" data-u=\"c10\" data-n=\"10\">10<\/sup>. Como principio general, el período formativo inicial de los mismos durará hasta la profesión perpetua<sup class=\"fn\" data-u=\"c10\" data-n=\"11\">11<\/sup>. Los superiores respectivos cuidarán su conveniente preparación misionera<sup class=\"fn\" data-u=\"c10\" data-n=\"12\">12<\/sup> procurando una formación común a todos los miembros del Instituto<sup class=\"fn\" data-u=\"c10\" data-n=\"13\">13<\/sup>.","n":"433","s":1},{"t":"p","h":"Ya sea en la casa de formación o en el caso excepcional de residir en otra comunidad, el misionero hermano tendrá un formador que lo acompañe personalmente en el crecimiento y en la maduración de su vocación.","n":"434","s":1},{"t":"p","h":"La instrucción teológica, pastoral, científica o técnica se cursará en los centros que determine el Gobierno de cada Organismo<sup class=\"fn\" data-u=\"c10\" data-n=\"14\">14<\/sup>, según las líneas y orientaciones del PGF<sup class=\"fn\" data-u=\"c10\" data-n=\"15\">15<\/sup>.","n":"435","s":1},{"t":"p","h":"A lo largo del proceso formativo, los misioneros hermanos, además de las experiencias apostólicas que hayan de realizar conforme a lo establecido en este PGF<sup class=\"fn\" data-u=\"c10\" data-n=\"16\">16<\/sup>, podrán realizar otras en el campo técnico y profesional, que habrán de ser programadas y evaluadas.","n":"436","s":1},{"t":"h","l":3,"h":"2.3. Ministerios propios de la condición laical"},{"t":"p","h":"Los hermanos pueden ejercer una gran variedad de ministerios no ordenados propios de su condición laical, para los cuales han de conseguir una adecuada preparación. Estos ministerios pueden ser no instituidos e instituidos.","n":"437","s":1},{"t":"h","l":4,"h":"<i>2.3.1. Servicios laicales<\/i>"},{"t":"p","h":"Entre los servicios laicales se señalan los siguientes:","n":"438","s":1},{"t":"p","h":"a. Servicios relacionados directamente con el ministerio de la Palabra: catequesis, animación litúrgica, educación cristiana, enseñanza de ciencias eclesiásticas, coordinación de comunidades de base, animación de asociaciones de vida cristiana/TIC’s<sup class=\"fn\" data-u=\"c10\" data-n=\"17\">17<\/sup>.","n":"438"},{"t":"p","h":"b. Servicios que preparan, acompañan o complementan el ministerio de la Palabra: pastoral vocacional; formación inicial y permanente; servicios caritativos o de promoción humana y social (atención a enfermos o marginados); gestión administrativa y trabajos técnicos en las obras apostólicas de la Congregación; actividades y tareas de orden comunitario interno<sup class=\"fn\" data-u=\"c10\" data-n=\"18\">18<\/sup>; otras ocupaciones, entre ellas, algunos oficios eclesiásticos previstos por el derecho<sup class=\"fn\" data-u=\"c10\" data-n=\"19\">19<\/sup>.","n":"438"},{"t":"p","h":"c. Servicios que se desarrollan en <i>lugares de frontera<\/i>, en las nuevas periferias que interpelan a nuestro carisma (ONG’s, diálogo intercultural, ecuménico e interreligioso, presencia en zonas de no creyentes, JPIC)<sup class=\"fn\" data-u=\"c10\" data-n=\"20\">20<\/sup>.","n":"438"},{"t":"h","l":4,"h":"<i>2.3.2. Ministerios instituidos: lectorado y acolitado<\/i>"},{"t":"p","h":"Como los ministerios de lectorado y acolitado gozan de autonomía y estabilidad, los misioneros hermanos pueden ser instituidos en uno de ellos, o en ambos, para un servicio a la comunidad<sup class=\"fn\" data-u=\"c10\" data-n=\"21\">21<\/sup>. Quienes reciben estos ministerios realizan, dentro de la Iglesia, las tareas de <i>servidores de la Palabra<\/i> (lectorado) y de <i>servidores de la liturgia eucarística<\/i> (acolitado).","n":"439","s":1},{"t":"p","h":"Las funciones más propias de estos ministerios son las siguientes:","n":"440","s":1},{"t":"p","h":"a. Ministerio del lectorado: leer la Palabra de Dios y proclamar en la asamblea litúrgica las lecturas de la Sagrada Escritura; enunciar las intenciones de la oración universal de los fieles; dirigir el canto y guiar la participación del pueblo; instruir a los fieles para que reciban dignamente los sacramentos, presidir la celebración de la Palabra.","n":"440"},{"t":"p","h":"b. Ministerio del acolitado: cuidar todo lo referente al servicio del altar; ayudar en las acciones litúrgicas, principalmente en la celebración de la eucaristía; como ministro extraordinario<sup class=\"fn\" data-u=\"c10\" data-n=\"22\">22<\/sup>, distribuir la sagrada comunión, llevarla a los enfermos, exponer y reservar el Santísimo Sacramento.","n":"440"},{"t":"p","h":"Para acceder a estos ministerios se precisa la edad conveniente y el grado de madurez requerido para el momento de la formación que se está viviendo. Se aconseja su institución previamente a la realización de la experiencia comunitario–apostólica o año pastoral, con el que se interrumpe los estudios académicos<sup class=\"fn\" data-u=\"c10\" data-n=\"23\">23<\/sup>. Además de las dotes y actitudes que determinen las Conferencias Episcopales, se requiere lo siguiente:","n":"441","s":1},{"t":"p","h":"a. Para el ministerio del lectorado: amor y conocimiento de las Sagradas Escrituras, escucha y meditación de la Palabra y esfuerzo por testimoniarla con la propia vida; voluntad de servir a Dios y al pueblo cristiano mediante el anuncio fiel de la Palabra.","n":"441"},{"t":"p","h":"b. Para el ministerio del acolitado: conocimiento y vivencia profunda de la eucaristía; conocimiento de cuanto se refiere a la liturgia y a su significado espiritual; ofrecimiento diario a Dios; sincero amor al pueblo de Dios<sup class=\"fn\" data-u=\"c10\" data-n=\"24\">24<\/sup>.","n":"441"},{"t":"p","h":"Para la admisión a estos ministerios es necesario:","n":"442","s":1},{"t":"p","h":"a. Que el candidato manifieste por escrito al Superior Mayor que los pide libre y voluntariamente y que conoce las obligaciones que de ello se derivan.","n":"442"},{"t":"p","h":"b. Que al Superior Mayor le conste, directamente o por otros, que los candidatos están bien instruidos, teórica y prácticamente, acerca de estos ministerios<sup class=\"fn\" data-u=\"c10\" data-n=\"25\">25<\/sup>.","n":"442"},{"t":"h","l":3,"h":"2.4. Aspectos organizativos"},{"t":"p","h":"Los Superiores Mayores deberán proporcionar a los misioneros hermanos la formación integral propia de todos los miembros de la Congregación y cuidarán especialmente los aspectos formativos particulares que les corresponde por su condición laical<sup class=\"fn\" data-u=\"c10\" data-n=\"26\">26<\/sup>.","n":"443","s":1},{"t":"p","h":"Dentro del plan provincial de formación, se concretarán, según las exigencias de los diversos Organismos, las orientaciones indicadas en el PGF para la formación de los misioneros hermanos<sup class=\"fn\" data-u=\"c10\" data-n=\"27\">27<\/sup>.","n":"444","s":1},{"t":"h","l":2,"h":"3. LA FORMACIÓN ESPECÍFICA DEL MISIONERO DIÁCONO"},{"t":"h","l":3,"h":"3.1. Criterios generales"},{"t":"p","h":"La formación específica del candidato a misionero diácono se ordena a que pueda vivir con plenitud de sentido su propia identidad vocacional en complementariedad con los misioneros presbíteros y hermanos.","n":"445","s":1},{"t":"p","h":"Imitando a Jesús, que no vino a ser servido sino a servir, los que van a acceder al diaconado se preparan para servir evangélicamente al Pueblo de Dios y a la propia comunidad en el ministerio de la Palabra, de la liturgia y de la caridad<sup class=\"fn\" data-u=\"c10\" data-n=\"28\">28<\/sup>.","n":"446","s":1},{"t":"p","h":"La formación específica de los candidatos a este sacramento sigue las normas y orientaciones establecidas por la Iglesia universal<sup class=\"fn\" data-u=\"c10\" data-n=\"29\">29<\/sup> y particular y por la Congregación<sup class=\"fn\" data-u=\"c10\" data-n=\"30\">30<\/sup>. Debe incluir, además de los estudios, la práctica pastoral adecuada y actualizada desde la experiencia de la Iglesia hoy.","n":"447","s":1},{"t":"p","h":"Por lo que se refiere a la formación intelectual, ésta debe ser análoga a la del presbítero, aunque, en la distribución concreta de las materias, hay que atender a lo que dictamine cada Conferencia Episcopal para el ámbito de su propio territorio<sup class=\"fn\" data-u=\"c10\" data-n=\"31\">31<\/sup>.","n":"448","s":1},{"t":"h","l":3,"h":"3.2. Funciones del ministerio del diácono"},{"t":"p","h":"Las funciones más propias de este ministerio son las siguientes:","n":"449","s":1},{"t":"p","h":"<i>a. Colaborar en la evangelización de los pueblos<\/i><sup class=\"fn\" data-u=\"c10\" data-n=\"32\">32<\/sup>, mediante la palabra y el testimonio de la vida<sup class=\"fn\" data-u=\"c10\" data-n=\"33\">33<\/sup>, en comunión con el Obispo y con los Superiores.","n":"449"},{"t":"p","h":"b. Proclamar el Evangelio y predicar; ejercitarse en organizar y presidir las celebraciones de la Palabra; enseñar la doctrina cristiana.","n":"449"},{"t":"p","h":"c. Orar por la Iglesia y en su nombre, sobre todo a través de la liturgia de las horas<sup class=\"fn\" data-u=\"c10\" data-n=\"34\">34<\/sup>.","n":"449"},{"t":"p","h":"d. Administrar el bautismo; preparar el sacrificio eucarístico y distribuir el cuerpo y la sangre del Señor; asistir y bendecir el matrimonio; presidir celebraciones penitenciales y ritos exequiales.","n":"449"},{"t":"p","h":"e. Servir a la comunidad cristiana, atendiendo principalmente a los más pobres y necesitados y colaborando en iniciativas a favor de la vida y de los derechos humanos.","n":"449"},{"t":"h","l":3,"h":"3.3. Orientaciones formativas"},{"t":"p","h":"Desde el punto de vista pedagógico, la formación específica para el misionero diácono exige que se preste una particular atención a las siguientes actitudes y comportamientos:","n":"450","s":1},{"t":"p","h":"a. La configuración con Cristo, Siervo de Yahveh y Buen Pastor, y lo que ella comporta: fe y abandono confiado en el Padre, servicio gratuito, disponibilidad total para la acción ministerial y solicitud por los pobres y pequeños.","n":"450"},{"t":"p","h":"b. El servicio a la Palabra, tanto para inspirar su conducta en ella como para anunciarla, como Buena Nueva y mensaje de cambio y conversión, a los hombres de hoy. Debe, en efecto, convertir en fe lo que lee, enseñar lo que cree, cumplir lo que enseña<sup class=\"fn\" data-u=\"c10\" data-n=\"35\">35<\/sup>; asimismo, ha de expresar respeto y reverencia a la Palabra de Dios; leer, estudiar y meditar continuamente la Sagrada Escritura<sup class=\"fn\" data-u=\"c10\" data-n=\"36\">36<\/sup>; reconocer la presencia y la acción de Dios en la historia y en la creación; y anunciar el Evangelio promoviendo los valores genuinamente humanos de cada pueblo y propiciando el diálogo fe-cultura.","n":"450"},{"t":"p","h":"c. El servicio a la liturgia, particularmente a la Eucaristía, que es el centro del culto y de la misma vida cristiana. Por eso, debe nutrir su fe en los sacramentos y en la liturgia de las horas; honrar el Cuerpo y la Sangre del Señor; profundizar el misterio de la Encarnación y de la Pascua de Jesús presente también en los hermanos, especialmente entre los pobres, enfermos y marginados, en los cuales Él es acogido y servido; cuidar la administración de los sacramentos y la animación de la comunidad cristiana en las celebraciones.","n":"450"},{"t":"p","h":"d. El servicio a la caridad: ser siervo pobre a ejemplo de Jesucristo; servir gratuitamente, compartir y ser solidario como María, que atendió con diligencia las necesidades de los hombres; dedicarse a obras de promoción y atender a los destinatarios de una manera tal que sean ellos mismos los que se conviertan en los protagonistas de su propia promoción y liberación; reavivar en la comunidad cristiana el sentido de la justicia para que el amor fraterno sea ley de vida entre los creyentes.","n":"450"},{"t":"h","l":3,"h":"3.4. Admisión al diaconado"},{"t":"p","h":"Para ser admitido a este ministerio es preciso:","n":"451","s":1},{"t":"p","h":"a. Haber ejercido fielmente los ministerios de lectorado y acolitado<sup class=\"fn\" data-u=\"c10\" data-n=\"37\">37<\/sup>.","n":"451"},{"t":"p","h":"b. Dirigir al Superior Mayor la petición y declaración exigidas por el derecho<sup class=\"fn\" data-u=\"c10\" data-n=\"38\">38<\/sup>.","n":"451"},{"t":"p","h":"c. Cumplir los requisitos exigidos por el derecho universal<sup class=\"fn\" data-u=\"c10\" data-n=\"39\">39<\/sup> y propio<sup class=\"fn\" data-u=\"c10\" data-n=\"40\">40<\/sup>; estar exento de las irregularidades e impedimentos<sup class=\"fn\" data-u=\"c10\" data-n=\"41\">41<\/sup>; presentar los documentos prescritos<sup class=\"fn\" data-u=\"c10\" data-n=\"42\">42<\/sup> y constatar las cualidades<sup class=\"fn\" data-u=\"c10\" data-n=\"43\">43<\/sup>. También se precisa hacer la profesión de fe<sup class=\"fn\" data-u=\"c10\" data-n=\"44\">44<\/sup>.","n":"451"},{"t":"p","h":"d. Prepararse convenientemente, de una manera inmediata, para este ministerio mediante un plan. Este plan habrá de tener un adecuado seguimiento por parte del responsable que el Superior Mayor designe. En él se indicarán los medios para informarse convenientemente de la doctrina sobre este ministerio en los documentos eclesiales<sup class=\"fn\" data-u=\"c10\" data-n=\"45\">45<\/sup>. Asimismo, se remitirá a cuanto se contiene en los diversos rituales de los sacramentos que competen al diácono y a lo que se refiere al anuncio homilético del Evangelio, a la liturgia de las horas, a la pastoral de enfermos y a la pastoral social.","n":"451"},{"t":"h","l":2,"h":"4. LA FORMACIÓN ESPECÍFICA DEL MISIONERO PRESBÍTERO"},{"t":"h","l":3,"h":"4.1. Criterios generales"},{"t":"p","h":"La formación para el ministerio presbiteral se ordena a preparar a los formandos para que lleguen a ser presbíteros idóneos, dedicados particularmente al servicio de la Palabra como testigos y mensajeros de la alegría del Evangelio, al estilo de Claret. Desde el punto de vista formativo, requiere que tal preparación se haga por grados y en progresión, tanto con la institución y el ejercicio de los ministerios del lectorado y del acolitado, como con la recepción y el ejercicio del orden del diaconado<sup class=\"fn\" data-u=\"c10\" data-n=\"46\">46<\/sup>.","n":"452","s":1},{"t":"p","h":"El diaconado, cuando se orienta a la ordenación presbiteral, tiene como objetivo ejercer el propio ministerio durante un tiempo prudente y madurar algunos aspectos específicos. En este sentido, su finalidad es predominantemente pedagógica (espiritual, ascética, litúrgica, pastoral) hacia la ordenación presbiteral.","n":"453","s":1},{"t":"p","h":"El ministerio ordenado es un don del Espíritu para la Iglesia<sup class=\"fn\" data-u=\"c10\" data-n=\"47\">47<\/sup>, no un derecho o una propiedad de quien lo recibe. Por eso, la formación para el ministerio debe subrayar la necesaria conexión con la Iglesia y su manera de entenderlo y de vivirlo.","n":"454","s":1},{"t":"h","l":3,"h":"4.2. Funciones del ministerio del presbítero"},{"t":"p","h":"El presbítero claretiano, configurado con Cristo Sacerdote para la edificación de su Cuerpo que es la Iglesia<sup class=\"fn\" data-u=\"c10\" data-n=\"48\">48<\/sup>, participa, por el sacramento de la imposición de manos, del ministerio apostólico<sup class=\"fn\" data-u=\"c10\" data-n=\"49\">49<\/sup> confiado a los obispos. Por eso, se siente colaborador suyo<sup class=\"fn\" data-u=\"c10\" data-n=\"50\">50<\/sup>, especialmente en la tarea de suscitar y consolidar comunidades de creyentes<sup class=\"fn\" data-u=\"c10\" data-n=\"51\">51<\/sup> mediante el ministerio de la palabra<sup class=\"fn\" data-u=\"c10\" data-n=\"52\">52<\/sup>, con un estilo de vida evangélico y profético<sup class=\"fn\" data-u=\"c10\" data-n=\"53\">53<\/sup>, según el espíritu de la Iglesia y en fraternidad apostólica<sup class=\"fn\" data-u=\"c10\" data-n=\"54\">54<\/sup>. El ejercicio profético del ministerio de la Palabra implica el anuncio del Reino en las concretas situaciones de nuestro tiempo, la denuncia del pecado y de la injusticia y la aceptación de los riesgos que comporta<sup class=\"fn\" data-u=\"c10\" data-n=\"55\">55<\/sup>.","n":"455","s":1},{"t":"p","h":"Esta función evangelizadora y profética está íntimamente relacionada con las funciones pastoral y sacramental. El anuncio de la Palabra crea la comunidad, de la que la eucaristía es cumbre y fuente. Por eso, el presbítero claretiano, al mismo tiempo que representa a Cristo como profeta de la Buena Nueva<sup class=\"fn\" data-u=\"c10\" data-n=\"56\">56<\/sup>, ejerce:","n":"456","s":1},{"t":"p","h":"a. El ministerio del cuidado pastoral de las comunidades surgidas de la Palabra. En ellas representa a Cristo pastor, que no vino a ser servido, sino a servir y a dar su vida en rescate por muchos<sup class=\"fn\" data-u=\"c10\" data-n=\"57\">57<\/sup>.","n":"456"},{"t":"p","h":"b. El ministerio del culto, en el que la Palabra, unida a los signos, se hace sacramento de salvación. El presbítero claretiano representa a Cristo santificador en la celebración de los sacramentos, sobre todo en la eucaristía<sup class=\"fn\" data-u=\"c10\" data-n=\"58\">58<\/sup> y en la penitencia. En la tarea evangelizadora de nuestro Fundador, la penitencia se halla estrechamente vinculada a la predicación de la Palabra<sup class=\"fn\" data-u=\"c10\" data-n=\"59\">59<\/sup>.","n":"456"},{"t":"p","h":"c. El ministerio sacerdotal, cuando se vive en integridad como pan vivo ofrecido para el pueblo de Dios, manifiesta su vínculo intrínseco con la proclamación de la Palabra y la Celebración Eucarística.","n":"456"},{"t":"p","h":"Estas funciones nacen en el seno de la Iglesia y adquieren sentido referidas a ella y al servicio de todo el mundo. Por eso, puesto que el presbítero claretiano ha sido tomado de entre los hombres y constituido en favor de ellos en lo que se refiere a Dios<sup class=\"fn\" data-u=\"c10\" data-n=\"60\">60<\/sup>, debe convivir con ellos como hermano, haciéndose todo a todos<sup class=\"fn\" data-u=\"c10\" data-n=\"61\">61<\/sup> y preocupándose particularmente de los enfermos y marginados<sup class=\"fn\" data-u=\"c10\" data-n=\"62\">62<\/sup>. Como misionero claretiano, la ofrenda de su vida no es solo una ofrenda en el altar, sino en y hacia el mundo. En el ejercicio de su ministerio debe considerar lo que realiza, imitar lo que conmemora y conformar su vida con el misterio de la cruz del Señor<sup class=\"fn\" data-u=\"c10\" data-n=\"63\">63<\/sup>.","n":"457","s":1},{"t":"h","l":3,"h":"4.3. Orientaciones formativas"},{"t":"p","h":"La formación para el presbiterado acentúa:","n":"458","s":1},{"t":"p","h":"a. La comprensión de Cristo como profeta, sacerdote y pastor, con el que, a ejemplo de Claret, los estudiantes deben compenetrarse<sup class=\"fn\" data-u=\"c10\" data-n=\"64\">64<\/sup> compartiendo su muerte y su vida<sup class=\"fn\" data-u=\"c10\" data-n=\"65\">65<\/sup>.","n":"458"},{"t":"p","h":"b. El conocimiento sólido de la naturaleza del ministerio del presbiterado, así como su articulación con los demás carismas y ministerios; en particular, el conocimiento del sacerdocio en clave claretiana.","n":"458"},{"t":"p","h":"c. La integración progresiva de la dimensión ministerial y religiosa en un único proyecto vocacional<sup class=\"fn\" data-u=\"c10\" data-n=\"66\">66<\/sup>.","n":"458"},{"t":"p","h":"d. La ejercitación del ministerio de la Palabra y la colaboración estrecha con los obispos, como elementos característicos de los misioneros claretianos.","n":"458"},{"t":"p","h":"e. La apertura a los nuevos campos pastorales que nos presenta la evangelización actual, como son JPIC, el mundo digital y las nuevas periferias geográficas y existenciales.","n":"458"},{"t":"p","h":"f. La dimensión comunitaria del ministerio<sup class=\"fn\" data-u=\"c10\" data-n=\"67\">67<\/sup>, subrayando el trabajo en equipo la conciencia de ser enviado por la comunidad.","n":"458"},{"t":"p","h":"g. La preparación para el ejercicio de la dirección y el acompañamiento espirituales.","n":"458"},{"t":"p","h":"h. La práctica de aquella caridad que lleva orar diariamente por la Iglesia y el mundo, a dar la vida por los hermanos<sup class=\"fn\" data-u=\"c10\" data-n=\"68\">68<\/sup>, a comprometerse con el pueblo pobre a quien sirve y a preocuparse pastoralmente por los enfermos y marginados<sup class=\"fn\" data-u=\"c10\" data-n=\"69\">69<\/sup>.","n":"458"},{"t":"p","h":"i. La iniciación litúrgica y pastoral que permite la realización competente de las funciones ministeriales.","n":"458"},{"t":"p","h":"j. La colaboración estrecha con los sacerdotes de la Iglesia local para sentirse verdaderamente miembros del presbiterio y de la familia diocesana<sup class=\"fn\" data-u=\"c10\" data-n=\"70\">70<\/sup>.","n":"458"},{"t":"p","h":"k. La práctica del trabajo en equipo con personas de distintas vocaciones en la clave de iglesia de comunión, misión compartida y sinodalidad.","n":"458"},{"t":"p","h":"l. El carácter de servicio de su ministerio, para evitar el clericalismo y la mundanidad espiritual<sup class=\"fn\" data-u=\"c10\" data-n=\"71\">71<\/sup>.","n":"458"},{"t":"p","h":"La preparación inmediata al orden del presbiterado tiene como objetivo profundizar en las actitudes que más unen al candidato con Cristo sacerdote, según la vocación claretiana, y para irse disponiendo a actuar siempre en su nombre y en representación de la Iglesia.","n":"459","s":1},{"t":"p","h":"La preparación inmediata se realiza a través de un plan que integre:","n":"460","s":1},{"t":"p","h":"a. Posibilidades concretas de ejercicio del diaconado.","n":"460"},{"t":"p","h":"b. Programación de oración, retiros, ejercicios espirituales y encuentros de dirección espiritual.","n":"460"},{"t":"p","h":"c. Asimilación de la teología y espiritualidad del presbiterado, conforme a los documentos de la Iglesia y el propio Ritual.","n":"460"},{"t":"p","h":"d. Profundización en las características carismáticas del sacerdocio claretiano.","n":"460"},{"t":"p","h":"e. Estudio de síntesis relativas a los sacramentos de la Penitencia, Confirmación, Unción de enfermos y Eucaristía, y de sus dinamismos celebrativos.","n":"460"},{"t":"p","h":"f. Diálogo con alguna persona experimentada en criterios morales y pastorales en orden a la confesión y a la dirección espiritual<sup class=\"fn\" data-u=\"c10\" data-n=\"72\">72<\/sup>.","n":"460"},{"t":"p","h":"g. Una acentuación de la dimensión mariana en la perspectiva sacerdotal.","n":"460"},{"t":"h","l":3,"h":"4.4. Admisión al presbiterado"},{"t":"p","h":"El candidato al presbiterado dirigirá al Superior Mayor la petición y declaración exigidas por el derecho<sup class=\"fn\" data-u=\"c10\" data-n=\"73\">73<\/sup>. Deberá cumplir los mismos requisitos prescritos para el diaconado y haber ejercitado este Orden durante el tiempo que el Superior Mayor le señale y que no deberá ser inferior a seis meses.","n":"461","s":1},{"t":"p","h":"El Superior Mayor, por sí o por otro, verificará si el candidato ha realizado esta preparación y cumple las condiciones para ser llamado al presbiterado.","n":"462","s":1}],"notes":{"1":"Cf. CC 7, 78; Dir 252.","2":"Cf. CPR 31.","3":"Cf. MCH 139.","4":"Cf. IM 34-35.","5":"IM 10.","6":"Cf. SP 8.2.","7":"Cf. Dir 252c, 254.","8":"Cf. IM 30.","9":"Cf. IM 31.","10":"Cf. PC 18.","11":"Cf. Dir 238; PC 18; 1HH 31.","12":"Cf. MH, pp. 97 ss.","13":"Cf. Dir 255.","14":"Cf. 1HH 30.","15":"Cf. Dir 238; Apéndice 3.","16":"Cf. PGF 261-268.","17":"Cf. Dir 254.","18":"Cf. Ibid.","19":"Cf. CIC 228.","20":"Cf. MH, pp. 47 ss.; cf. IM, p. 31.","21":"Cf. CIC 230 §1.","22":"Cf. CIC 910 §2.","23":"Cf. CIC 230 §1.","24":"Cf. MQ.","25":"Cf. Apéndice 3,V.","26":"Cf. Dir 255.","27":"Cf. Dir 238; CPR 31; Apéndice 3,IV.","28":"CC 81.","29":"Cf. LG 29; CIC 236, 288, 1031 §2, 1032 §3.","30":"Cf. Dir 257-260.","31":"Cf. CIC 236; Dir 258.","32":"Dir 257.","33":"Cf. CC 81; Dir 260.","34":"Cf. CC 81.","35":"Cf. RO: Ordenación de diáconos, 210.","36":"Cf. Dir 260.","37":"Cf. CIC 1035 §1.","38":"Cf. CIC 1036.","39":"Cf. CIC 1024-1039.","40":"Cf. Dir 242.","41":"Cf. CIC 1040-1049.","42":"Cf. CIC 1050.","43":"Cf. CIC 1051.","44":"Cf. CIC 833 §6; Apéndice 4 (Formulario 12).","45":"Cf. SDO; PR.","46":"Cf. CIC 1035; 1032 §2.","47":"Cf. PO 2.","48":"Cf. PO 12; CC 83.","49":"Cf. CC 82; PO 2; Aut 223-224.","50":"Cf. CC 6.","51":"Cf. CC 47, 82.","52":"Cf. CC 46, 50.","53":"Cf. CC 82.","54":"Cf. CC 85.","55":"Cf. MCH 58, 171-172, 232; EMP 18.","56":"Cf. CC 3; EMP 19.","57":"Cf. Mc 10, 45; CC 83.","58":"Cf. CC 83.","59":"Cf. Aut 304, 762-763.","60":"Cf. Hb 5,1.","61":"Cf. 1 Cor 9,22.","62":"Cf. CC 83.","63":"Cf. RO: Ordenación de Presbíteros, 135.","64":"Cf. Aut 754-756.","65":"Cf. CC 83.","66":"Cf. PI 108.","67":"Cf. CC 85.","68":"Cf. CC 84.","69":"Cf. CC 83.","70":"Cf. Dir 263; PI 109.","71":"Cf. EG 93-97.","72":"Cf. Apéndice 3.","73":"Cf. CIC 1036, 1050; Apéndice 4 (Formulario 12)."}},{"id":"c11","title":"El misionero en el proceso de formación permanente","short":"Capítulo 11","kind":"main","pages":[255,298],"blocks":[{"t":"h","l":2,"h":"1. NATURALEZA Y FINALIDAD DE LA FORMACIÓN PERMANENTE"},{"t":"p","h":"La formación permanente es intrínseca a nuestra vocación<sup class=\"fn\" data-u=\"c11\" data-n=\"1\">1<\/sup>. Se trata de un proceso global de renovación que abarca todos los aspectos del claretiano y de la Congregación en su conjunto<sup class=\"fn\" data-u=\"c11\" data-n=\"2\">2<\/sup> y revela la profunda naturaleza de nuestra vocación como fidelidad a la misión y como proceso de continua conversión<sup class=\"fn\" data-u=\"c11\" data-n=\"3\">3<\/sup>. Se trata de un camino:","n":"463","s":1},{"t":"p","h":"<b>a) Abierto<\/b>. Dura toda la vida<sup class=\"fn\" data-u=\"c11\" data-n=\"4\">4<\/sup>. La formación permanente no tiene punto final<sup class=\"fn\" data-u=\"c11\" data-n=\"5\">5<\/sup>: Como misioneros <i>dedicados a Dios y consagrados por El<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"6\">6<\/sup>, nuestra vida es un proceso permanente de formación. Como discípulos estamos en <i>escucha constante y abiertos a las sorpresas de la Palabra y del Espíritu<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"7\">7<\/sup>.","n":"463"},{"t":"p","h":"<b>b) Global<\/b>. Abarca toda la persona y todas las dimensiones de la personalidad, en un proceso integral de crecimiento: humano, espiritual, intelectual, pastoral y carismático<sup class=\"fn\" data-u=\"c11\" data-n=\"8\">8<\/sup>.","n":"463"},{"t":"p","h":"<b>c) Multiplicador<\/b>. Afecta también a la renovación de las comunidades, de la misión y de las estructuras comunitarias y apostólicas<sup class=\"fn\" data-u=\"c11\" data-n=\"9\">9<\/sup>.","n":"463"},{"t":"p","h":"La formación permanente pretende la renovación de la vida personal y comunitaria del claretiano a la luz del Evangelio y de nuestro carisma, en cada nueva etapa personal<sup class=\"fn\" data-u=\"c11\" data-n=\"10\">10<\/sup>.","n":"464","s":1},{"t":"h","l":2,"h":"2. NECESIDAD DE FORMACIÓN PERMANENTE"},{"t":"h","l":3,"h":"2.1. Para ser fieles a nuestro proyecto personal de vida."},{"t":"p","h":"La formación permanente es una exigencia de todo claretiano. En cuanto personas, alcanzamos nuestra plenitud desarrollando nuestras potencialidades en comunión con los hombres insertos en la historia y en la realidad de los pueblos<sup class=\"fn\" data-u=\"c11\" data-n=\"11\">11<\/sup>.","n":"465","s":1},{"t":"p","h":"Asimismo, por haber recibido el don de la vocación, el claretiano debe estar en actitud de constante crecimiento y fidelidad a la misma<sup class=\"fn\" data-u=\"c11\" data-n=\"12\">12<\/sup>. La vocación es un don dinámico. Dios llama constantemente. Nosotros debemos responder en fidelidad<sup class=\"fn\" data-u=\"c11\" data-n=\"13\">13<\/sup>. El carisma vocacional y los dones de naturaleza y gracia son fuerzas dinámicas que hacen crecer a la persona para desarrollar el propio proyecto de vida.","n":"466","s":1},{"t":"p","h":"Como persona llamada por el Señor a la Congregación para vivir en una comunidad misionera, el claretiano crece y se desarrolla plenamente en comunión con los hermanos y en la realización de la misión comunitaria<sup class=\"fn\" data-u=\"c11\" data-n=\"14\">14<\/sup>. La Congregación, comunidad en constante crecimiento y renovación, es el ámbito natural donde cada claretiano debe lograr su mayor crecimiento personal.","n":"467","s":1},{"t":"h","l":3,"h":"2.2. Para ser fieles a la acción renovadora del Espíritu"},{"t":"p","h":"El mismo Espíritu que suscita el carisma de la Congregación es el que lo estimula y lo desarrolla en la Iglesia y en la historia. Por lo tanto, la acción del Espíritu nos exige una continua conversión para dar un nuevo vigor a la dimensión profética de nuestra vocación<sup class=\"fn\" data-u=\"c11\" data-n=\"15\">15<\/sup>. Es imperativo, entonces, que respondamos, personal y comunitariamente, a nuestra necesidad de una formación permanente, especialmente en los momentos críticos de nuestra vida, a fin de prepararnos adecuadamente para ser ministros idóneos de la Palabra.","n":"468","s":1},{"t":"p","h":"La formación permanente pide prestar una atención particular a los signos del Espíritu en nuestro tiempo para poder dar una respuesta apropiada. Nos estimula también a integrar la creatividad en la fidelidad<sup class=\"fn\" data-u=\"c11\" data-n=\"16\">16<\/sup>: <i>Seguir a Cristo significa ponernos en marcha, liberarnos de la esclerosis y del anquilosamiento para poder ofrecer un testimonio vivo y verdadero del Reino de Dios en este mundo<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"17\">17<\/sup>.","n":"469","s":1},{"t":"p","h":"Nuestro Fundador buscó incesantemente la sabiduría y el conocimiento a fin de mantener viva su orientación apostólica hacia la evangelización misionera. Una prueba de este afán fue su práctica de la lectura diaria y vocacional de la Biblia<sup class=\"fn\" data-u=\"c11\" data-n=\"18\">18<\/sup>, pues para él ser servidor de la Palabra requería estar inmerso en ella<sup class=\"fn\" data-u=\"c11\" data-n=\"19\">19<\/sup>. En la Palabra, encontró Claret la experiencia de la acción dinamizadora y renovadora del Espíritu, de manera que pudo decir, como discípulo de Jesús: <i>El Espíritu del Señor está sobre mí<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"20\">20<\/sup>.","n":"470","s":1},{"t":"p","h":"La Congregación nos ha recordado también la necesidad de dejarnos transformar por el Espíritu para poder cumplir la misión a la que hemos sido llamados<sup class=\"fn\" data-u=\"c11\" data-n=\"21\">21<\/sup> y alcanzar así la madurez de nuestra vocación<sup class=\"fn\" data-u=\"c11\" data-n=\"22\">22<\/sup>. A fin, pues, de poder ser testigos vivos y verdaderos del Reino de Dios reconocemos la necesidad de la acción renovadora del Espíritu en nuestra vida: como personas y como comunidad, de suerte que el Espíritu del Señor Resucitado pueda, a través de la formación permanente, <i>continuar restaurando la alegría de nuestra juventud<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"23\">23<\/sup>.","n":"471","s":1},{"t":"h","l":3,"h":"2.3. Para ser fieles al proceso de renovación congregacional"},{"t":"p","h":"El carisma del Padre Fundador, como experiencia del Espíritu transmitida a todos los claretianos, ha de ser vivido, custodiado, profundizado y desarrollado constantemente en sintonía con la Iglesia, que crece continuamente<sup class=\"fn\" data-u=\"c11\" data-n=\"24\">24<\/sup>. La fidelidad al carisma, como don dinámico, está exigiendo a toda la Congregación una actitud de constante renovación. La formación permanente, expresión de esta actitud, incide en las personas, y a través de ellas en las comunidades y en la misión apostólica. La renovación de la persona del claretiano hará posible un estilo renovado de vida comunitaria y una revisión constante de nuestras posiciones apostólicas<sup class=\"fn\" data-u=\"c11\" data-n=\"25\">25<\/sup>.","n":"472","s":1},{"t":"p","h":"Esta acción renovadora restaura nuestras fuerzas personales y comunitarias y nos dispone para responder a las situaciones de nuestro mundo como servidores de la Palabra. Debemos ser una comunidad evangelizada y evangelizadora<sup class=\"fn\" data-u=\"c11\" data-n=\"26\">26<\/sup>. Una comunidad es evangelizada en la medida en que se mantiene en conversión permanente: tiene siempre como punto de referencia la Palabra de Dios; a partir de ella, cultiva el diálogo que suscita una actitud de servicio respecto de los hermanos, para ofrecerles confianza y para ayudarles en la fidelidad a los compromisos adquiridos; desde ella discierne cuanto acontece y se deja evangelizar por los hechos que afectan a los hombres, sobre todo a los más pobres y necesitados, a los que es enviada<sup class=\"fn\" data-u=\"c11\" data-n=\"27\">27<\/sup>.","n":"473","s":1},{"t":"h","l":3,"h":"2.4. Para ser fieles a los retos de la misión"},{"t":"p","h":"La formación permanente no afecta sólo a nuestra dimensión personal. La necesidad de prestar atención a los signos de nuestro tiempo y de adaptarnos a las nuevas situaciones nos impulsa a afrontar, como misioneros, las urgencias siempre nuevas de la evangelización<sup class=\"fn\" data-u=\"c11\" data-n=\"28\">28<\/sup>. Debemos <i>mantener el paso con la marcha de la historia<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"29\">29<\/sup>.","n":"474","s":1},{"t":"p","h":"Todos los claretianos estamos llamados a vivir una espiritualidad sólidamente arraigada que asimile los cambios y evoluciones del mundo y de la Iglesia con una docilidad continua al Espíritu.<sup class=\"fn\" data-u=\"c11\" data-n=\"30\">30<\/sup> Necesitamos <i>conocer profunda y vivencialmente la situación humana y religiosa del pueblo que pretendemos evangelizar<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"31\">31<\/sup>. La nueva realidad del mundo, de la Iglesia y de la Congregación se convierte en una interpelación del Espíritu que nos urge secundar, desde nuestro carisma de servidores de la Palabra y desde las opciones de nuestra misión, la llamada a una evangelización misionera<sup class=\"fn\" data-u=\"c11\" data-n=\"32\">32<\/sup>.","n":"475","s":1},{"t":"h","l":2,"h":"3. REFERENCIA CARISMÁTICA DE LA FORMACIÓN PERMANENTE"},{"t":"p","h":"Una característica destacada en la vida del Fundador fue su interés por renovarse y actualizarse. En él no hubo ruptura entre su formación inicial y su dedicación a la lectura y al estudio después de la ordenación. A él se dedicó intensa y sistemáticamente para profundizar en las Sagradas Escrituras, renovar los conocimientos teológicos y pastorales, conocer el pensamiento filosófico y las ideologías de su tiempo y saberse situar en las diferentes realidades en las que tuvo que ejercer su ministerio apostólico. Su motivación fue siempre clara: por un lado, crecer en el conocimiento de Dios para acercarse cada vez más a Él y vivir en comunión con Él; y, por otro lado, ser fiel a la misión apostólica de una manera creativa y siempre nueva, convirtiéndose en instrumento cada vez más apto para la salvación de todos los hombres. Los medios que utilizó fueron muy eficaces, entre ellos, el plan personal y la biblioteca.","n":"476","s":1},{"t":"p","h":"En la Congregación, los tiempos dedicados al estudio, a la renovación espiritual y a la preparación apostólica han sido siempre una tradición consolidada. En los ejercicios espirituales que el Fundador dirigió en 1865 a los misioneros, les decía: <i>el estudio los dirigiréis al de misionar (sic)<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"33\">33<\/sup>. Además de los tiempos de renovación espiritual en los retiros mensuales y en los ejercicios espirituales de cada año, el mismo Fundador prescribió a los misioneros un tiempo anual, en torno a cuatro meses<sup class=\"fn\" data-u=\"c11\" data-n=\"34\">34<\/sup>, de formación permanente a base del estudio. Las Constituciones, ya desde el principio, ordenaban los tiempos y las materias que se habían de estudiar y repasar, tanto para los presbíteros como para los hermanos; e insistían en la necesidad de tener una biblioteca bien abastecida y actualizada.","n":"477","s":1},{"t":"p","h":"La formación permanente sigue siendo una exigencia de la vida del claretiano, que ha de crecer en la configuración con Cristo misionero y ha de estar a la altura de los tiempos para responder a la misión apostólica<sup class=\"fn\" data-u=\"c11\" data-n=\"35\">35<\/sup>. Más aún, actualmente la formación permanente es una urgente necesidad para todos los claretianos. <i>Sólo una comunidad que acoge el don de Dios escucha los signos de los tiempos y se deja rejuvenecer constantemente, puede realizar el anuncio del Evangelio de modo creíble y atrayente<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"36\">36<\/sup>. La Congregación, en los distintos Capítulos Generales, se ha interpelado a sí misma, y la ha impulsado de una manera decisiva, pidiendo incluso la <i>reiniciación <\/i>carismática<sup class=\"fn\" data-u=\"c11\" data-n=\"37\">37<\/sup>.","n":"478","s":1},{"t":"h","l":2,"h":"4. CRITERIOS CONGREGACIONALES PARA LA FORMACIÓN PERMANENTE"},{"t":"p","h":"La mayor riqueza que tiene la Congregación son las personas, pues cada claretiano es imagen de Dios, una novedad insospechada del Espíritu y una vocación misionera que es gracia para el mundo<sup class=\"fn\" data-u=\"c11\" data-n=\"38\">38<\/sup>. Por eso, la formación permanente ha de situarse en la perspectiva de la persona<sup class=\"fn\" data-u=\"c11\" data-n=\"39\">39<\/sup>. Más aún, esta formación no sería posible sin una colaboración y participación activa de la persona, comenzando por el convencimiento de que es algo imprescindible para la vida misionera<sup class=\"fn\" data-u=\"c11\" data-n=\"40\">40<\/sup>.","n":"479","s":1},{"t":"p","h":"La formación permanente prolonga el proceso de formación inicial. Por lo mismo, el claretiano ha de superar cualquier ruptura entre la inicial y la permanente, ya que éstos son dos aspectos de una misma realidad. Se ha de considerar, desde el principio, en un proceso que no acaba nunca. Una buena formación inicial debe suscitar esta necesidad.","n":"480","s":1},{"t":"p","h":"Como orientación, la formación permanente que abarque toda la persona y todas sus dimensiones: humana, espiritual, intelectual, pastoral y carismática se ha de realizar:","n":"481","s":1},{"t":"p","h":"a. En la línea de nuestro carisma misionero, para prepararse mejor a ser ministros idóneos de la Palabra, de la opciones y sujetos preferenciales y de la sensibilización ante los problemas de la justicia y de la paz<sup class=\"fn\" data-u=\"c11\" data-n=\"41\">41<\/sup>.","n":"481"},{"t":"p","h":"b. En contacto con el mundo y abierta a la realidad. Por ello, se impulsarán todas aquellas iniciativas, tanto de dentro como de fuera de la Congregación, que puedan favorecer la apertura de cada claretiano a la realidad circundante y universal, y el estudio crítico de esa misma realidad en orden a responder a sus desafíos desde nuestro carisma misionero<sup class=\"fn\" data-u=\"c11\" data-n=\"42\">42<\/sup>.","n":"481"},{"t":"p","h":"c. En una perspectiva universal, sensibilizándonos a la situación de la Iglesia y capacitándonos a través del estudio de las lenguas para prestar servicios misioneros en cualquier parte del mundo.","n":"481"},{"t":"p","h":"d. Con criterios de calidad, capacitando al misionero más y mejor para una evangelización de vanguardia a través de las especializaciones necesarias<sup class=\"fn\" data-u=\"c11\" data-n=\"43\">43<\/sup>.","n":"481"},{"t":"p","h":"e. Con métodos activos y participativos y que tengan en cuenta las experiencias personales y las apostólicas en el campo de la pobreza, marginación e increencia<sup class=\"fn\" data-u=\"c11\" data-n=\"44\">44<\/sup>. Cada claretiano ha de ser consciente que toda experiencia pastoral es una fuente inagotable de formación permanente.","n":"481"},{"t":"h","l":2,"h":"5. AGENTES Y RESPONSABLES DE LA FORMACIÓN PERMANENTE"},{"t":"p","h":"En primer lugar y, sobre todo, la <i>persona del claretiano<\/i>. <i>Es imprescindible que cada uno de nosotros llegue a la convicción personal de que necesitamos una formación continuada para realizar nuestra vocación misionera.<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"45\">45<\/sup>. Para ello, el claretiano ha de sentir la necesidad y la urgencia de formación. Esta es la clave de la eficacia de la formación permanente. Sin el convencimiento personal, todos los medios y ayudas de que se disponga no producirán el efecto deseado.","n":"482","s":1},{"t":"p","h":"En segundo lugar, la <i>comunidad<\/i>. Por ser el ámbito normal donde se desarrolla la vida del claretiano, constituye el lugar privilegiado para la formación permanente.","n":"483","s":1},{"t":"p","h":"a. Es en la comunidad, como ámbito de libertad y crecimiento, donde la persona se realiza plenamente<sup class=\"fn\" data-u=\"c11\" data-n=\"46\">46<\/sup>. En ella vive, ora, se relaciona, estudia y trabaja.","n":"483"},{"t":"p","h":"b. El estilo de vida y misión de la comunidad es el primer parámetro de formación permanente para el claretiano. La fidelidad de la misma al proyecto claretiano y a los dinamismos ordinarios de santificación, vida y misión son los estímulos constantes que impulsan al claretiano a crecer. Cuando la comunidad se siente renovada y actúa conforme a los criterios y orientaciones de renovación congregacional, cada uno de sus miembros se renueva, crece y madura en su opción fundamental.","n":"483"},{"t":"p","h":"c. El papel de animador de la comunidad, propio del superior local, es muy importante en este punto<sup class=\"fn\" data-u=\"c11\" data-n=\"47\">47<\/sup>. Bajo su dirección, la comunidad debe promover la renovación pastoral de sus miembros para que desempeñen cada vez mejor sus ministerios.","n":"483"},{"t":"p","h":"En tercer lugar, los <i>superiores y sus respectivos gobiernos<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"48\">48<\/sup>:","n":"484","s":1},{"t":"p","h":"a. El Gobierno General y los gobiernos de los Organismos Mayores han de promover iniciativas de formación permanente, a fin de que todos los claretianos estén debidamente preparados para el ministerio de la Palabra, dando respuesta a los desafíos de los tiempos actuales<sup class=\"fn\" data-u=\"c11\" data-n=\"49\">49<\/sup>.","n":"484"},{"t":"p","h":"b. Al Gobierno General le corresponde la animación y la organización de la formación permanente de los misioneros del Instituto.","n":"484"},{"t":"p","h":"c. A los gobiernos de los Organismo Mayores les compete la misma responsabilidad en sus respectivos Organismos. Para animarla se puede también establecer en ellos una comisión especial, con miembros bien preparados y con responsabilidades claramente definidas<sup class=\"fn\" data-u=\"c11\" data-n=\"50\">50<\/sup>, encargados de elaborar un plan para cada periodo de gobierno.","n":"484"},{"t":"p","h":"d. Tanto el Gobierno General como los gobiernos provinciales realizarán esta tarea normalmente a través de las prefecturas, los consejos y las comisiones nombradas al efecto<sup class=\"fn\" data-u=\"c11\" data-n=\"51\">51<\/sup>.","n":"484"},{"t":"h","l":2,"h":"6. MODOS DE REALIZACIÓN"},{"t":"p","h":"Como primer criterio se ha de procurar elaborar planes de formación permanente en los distintos niveles congregacionales, donde se programen de manera ordenada y sistemática los momentos, dinamismos, medios e instrumentos de formación<sup class=\"fn\" data-u=\"c11\" data-n=\"52\">52<\/sup>.","n":"485","s":1},{"t":"h","l":3,"h":"6.1. Ordinarios"},{"t":"h","l":4,"h":"<i>6.1.1. Personales<\/i>"},{"t":"p","h":"<i>La atención especial a la Palabra de Dios<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"53\">53<\/sup>: Debemos escucharla <i>en la oración personal, en los acontecimientos de la historia, en las culturas y en la vida de los pueblos, en sus silencios y en sus clamores<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"54\">54<\/sup>. Esto exige dedicar una parte fundamental de tiempo a la lectura, al estudio y a la meditación y contemplación de la Palabra<sup class=\"fn\" data-u=\"c11\" data-n=\"55\">55<\/sup>.","n":"486","s":1},{"t":"p","h":"La oración y la celebración de la liturgia tienen un lugar fundamental en nuestra vida. Celebramos de todo corazón con la Iglesia la presencia de Dios y el amor por su pueblo especialmente en la Eucaristía, el sacramento de la reconciliación y la liturgia de las horas<sup class=\"fn\" data-u=\"c11\" data-n=\"56\">56<\/sup>.","n":"487","s":1},{"t":"p","h":"El <i>proyecto personal de formación<\/i> (o de crecimiento personal). Dicho proyecto debe atender a la integridad de la persona (dimensión espiritual, física, psicológica, intelectual y apostólico-ministerial) de acuerdo con la comunidad y los superiores<sup class=\"fn\" data-u=\"c11\" data-n=\"57\">57<\/sup>. En el se pueden tener en cuenta diversos elementos como: el ejercicio físico y el deporte, la dieta, la distribución armónica de la jornada, el tipo y frecuencia de lectura y de estudio, y los medios y dinamismos de la vida espiritual y apostólica.","n":"488","s":1},{"t":"p","h":"Debemos avanzar en la práctica del <i>discernimiento personal y comunitario<\/i>, y del <i>acompañamiento personal <\/i>para favorecer el progreso en nuestra vida misionera<sup class=\"fn\" data-u=\"c11\" data-n=\"58\">58<\/sup> y en la toma de decisiones.","n":"489","s":1},{"t":"h","l":4,"h":"<i>6.1.2. Comunitarios<\/i>"},{"t":"p","h":"La comunidad claretiana, al elaborar su proyecto comunitario, debe programar su estilo de vida y misión de un modo participativo, procurando que sus miembros tengan los medios necesarios y adecuados para profundizar en su llamada vocacional (tiempos para la oración, el estudio y el descanso, ayuda profesional).","n":"490","s":1},{"t":"p","h":"Además programará, en el mismo proyecto comunitario, la formación permanente específica, teniendo en cuenta sus necesidades y las exigencias de la misión. Dicho plan debe comprender, entre otras cosas, el estudio y asimilación de los documentos de la Iglesia y de la Congregación, particularmente de las Constituciones y de la Palabra de Dios.","n":"491","s":1},{"t":"p","h":"La comunidad debe estimular y ayudar también a sus miembros a trazar el plan personal de formación, sugiriendo sus modalidades. Entre las iniciativas ordinarias hay que mencionar el <i>día semanal de la comunidad<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"59\">59<\/sup><i>,<\/i> que consiste en reservar un tiempo, a ser posible cada semana, para orar en común, planificar, evaluar, compartir experiencias y recrearse.","n":"492","s":1},{"t":"p","h":"Es imprescindible una biblioteca especializada y actualizada en los ministerios apostólicos propios de la comunidad para impulsar la formación permanente de sus miembros<sup class=\"fn\" data-u=\"c11\" data-n=\"60\">60<\/sup>.","n":"493","s":1},{"t":"p","h":"Todas las comunidades deben aprovechar también las iniciativas intercomunitarias, diocesanas, interprovinciales y congregacionales e intercongregacionales como medios para su formación, sobre todo por lo que suponen de apertura y de contraste.","n":"494","s":1},{"t":"p","h":"Cuando un miembro de la comunidad es enviado a participar de un programa de formación permanente, se aconseja a las comunidades que se organicen de tal manera que este miembro pueda participar plenamente en dicho programa y cumpla así los objetivos de éste.","n":"495","s":1},{"t":"h","l":4,"h":"<i>6.1.3. Organismos Mayores<\/i>"},{"t":"p","h":"Todas los Organismos Mayores deben elaborar, en el marco del plan de formación permanente, un programa anual de iniciativas de formación. Estas iniciativas pueden realizarse también con otros Organismos o por áreas congregacionales cuando se juzgue conveniente. Entre las más practicadas se pueden señalar<sup class=\"fn\" data-u=\"c11\" data-n=\"61\">61<\/sup>:","n":"496","s":1},{"t":"p","h":"a. Ejercicios espirituales anuales.","n":"496"},{"t":"p","h":"b. Encuentros sistemáticos y periódicos de los sectores de los Organismos Mayores: formadores, educadores, párrocos, misioneros itinerantes de la Palabra, ecónomos y otros.","n":"496"},{"t":"p","h":"c. Encuentros de comunidades en su totalidad o por zonas, durante algunas jornadas, para estudiar y reflexionar temas claretianos relevantes y otros temas de interés.","n":"496"},{"t":"p","h":"d. El día anual del Organismo Mayor<sup class=\"fn\" data-u=\"c11\" data-n=\"62\">62<\/sup>.","n":"496"},{"t":"p","h":"e. La publicación periódica del boletín informativo.","n":"496"},{"t":"p","h":"Los superiores y responsables de la formación proporcionarán a los misioneros hermanos durante toda su vida los elementos formativos necesarios para perfeccionar su compromiso misionero, su cultura, su preparación doctrinal y espiritual, y la capacitación pastoral y técnica, según los planes de formación permanente de cada Organismo<sup class=\"fn\" data-u=\"c11\" data-n=\"63\">63<\/sup>.","n":"497","s":1},{"t":"h","l":4,"h":"<i>6.1.4. Generales<\/i>"},{"t":"p","h":"El Gobierno General debe elaborar también un programa para toda la Congregación, según el PGF y las orientaciones de los Capítulos. En él se incluyen:","n":"498","s":1},{"t":"p","h":"a. Las visitas canónicas generalicias como medio para evaluar y promover los programas de formación permanente de los Organismos Mayores<sup class=\"fn\" data-u=\"c11\" data-n=\"64\">64<\/sup>.","n":"498"},{"t":"p","h":"b. La organización de encuentros especiales de renovación claretiana y de estudio<sup class=\"fn\" data-u=\"c11\" data-n=\"65\">65<\/sup>.","n":"498"},{"t":"p","h":"c. Los encuentros, organizados a través de las Prefecturas, para los distintos sectores y las diversas áreas de la Congregación o de las conferencias interprovinciales.","n":"498"},{"t":"p","h":"d. El ofrecimiento de estructuras (comunidades y centros) al servicio de la Congregación para cursos de renovación, periodos sabáticos y especializaciones.","n":"498"},{"t":"p","h":"e. La elaboración de subsidios sobre temas específicos que se consideren oportunos.","n":"498"},{"t":"h","l":3,"h":"6.2. Extraordinarias"},{"t":"h","l":4,"h":"<i>6.2.1. Especializaciones<\/i>"},{"t":"p","h":"El gobierno del Organismo Mayor elaborará un plan de especializaciones para cualificar a los miembros que considere idóneos, en orden a responder a las necesidades de la misión y a la formación de sus miembros.","n":"499","s":1},{"t":"p","h":"Durante los últimos años de la formación inicial se irá orientando al formando hacia una especialización<sup class=\"fn\" data-u=\"c11\" data-n=\"66\">66<\/sup>, según el plan de especialización del Organismo.","n":"500","s":1},{"t":"p","h":"Las especializaciones tienen como objetivo completar la formación inicial con estudios más específicos o ampliados y convenientemente titulados. Se promoverán de acuerdo con las aptitudes e inclinaciones personales y las necesidades y opciones misioneras de la Provincia y de la Congregación<sup class=\"fn\" data-u=\"c11\" data-n=\"67\">67<\/sup>.","n":"501","s":1},{"t":"p","h":"Es necesario que los Organismos Mayores procuren la formación de verdaderos especialistas en ciencias eclesiásticas, para una acción misionera más profunda y para contribuir a la formación de los miembros de la Congregación<sup class=\"fn\" data-u=\"c11\" data-n=\"68\">68<\/sup>.","n":"502","s":1},{"t":"p","h":"Conviene también prestar atención a aquellas especializaciones civiles que son más útiles para un diálogo misionero con la cultura o para ejercer con más competencia otros compromisos de misión que exigen un conocimiento profundo de las ciencias humanas.","n":"503","s":1},{"t":"p","h":"Entre nosotros, los estudios eclesiásticos básicos no pueden simultanearse con otras carreras<sup class=\"fn\" data-u=\"c11\" data-n=\"69\">69<\/sup>. Pero ciertas especializaciones pastorales pueden hacerse durante los últimos años de la formación inicial<sup class=\"fn\" data-u=\"c11\" data-n=\"70\">70<\/sup>, según las diversas circunstancias:","n":"504","s":1},{"t":"p","h":"a. En unos casos, estudiando alguna materia particular o siguiendo cursillos de diverso tipo, tanto durante el año escolar como durante las vacaciones, sin que sea necesario matricularse en institutos especializados. En estos casos, es preciso mantener la obligada proporción con las disciplinas principales.","n":"504"},{"t":"p","h":"b. En otros, estudiando una especialidad pastoral, una vez terminados los estudios institucionales básicos según la normativa de las Conferencias Episcopales.","n":"504"},{"t":"p","h":"Tras un tiempo de experiencia pastoral, se puede dedicar un tiempo expreso para la especialización en facultades o institutos superiores, obteniendo los diplomas y grados académicos correspondientes.","n":"505","s":1},{"t":"h","l":4,"h":"<i>6.2.2. Los períodos sabáticos<\/i>"},{"t":"p","h":"Los períodos sabáticos son tiempos determinados, en los que cada misionero, libre de compromisos apostólicos y comunitarios, puede elaborar un plan personal, convenientemente aceptado por los Superiores, que responda a sus necesidades de descanso, renovación espiritual, cualificación misionera y contacto con nuevas realidades de evangelización.","n":"506","s":1},{"t":"p","h":"Se debe ofrecer esta posibilidad a todo claretiano, y muy particularmente a los que no han tenido otras facilidades para su renovación. Para ello hay que tener en cuenta las situaciones personales dentro de un plan provincial que prevea la coordinación necesaria y la adecuada financiación.","n":"507","s":1},{"t":"h","l":4,"h":"<i>6.2.3. Experiencias misioneras<\/i>"},{"t":"p","h":"Las experiencias apostólicas abrirán nuestro espíritu a nuevos horizontes y valores. En este sentido, es conveniente promover iniciativas diversas (en lugares de misión, sobre todo). Estas experiencias, que pueden ser de duración variable, deben ser programadas de manera coordinada por los distintos responsables<sup class=\"fn\" data-u=\"c11\" data-n=\"71\">71<\/sup>.","n":"508","s":1},{"t":"h","l":2,"h":"7. PERÍODOS ESPECIALES DURANTE LA FORMACIÓN PERMANENTE"},{"t":"p","h":"Aunque la formación continua es una tarea de toda la vida, adquiere una intensidad especial en ciertos momentos,<sup class=\"fn\" data-u=\"c11\" data-n=\"72\">72<\/sup> durante la andadura de un misionero. Tales momentos requieren una atención y un acompañamiento especial por parte de todos los implicados en el proceso de formación. Hay cuatro momentos en la formación permanente que requieren una consideración especial: el quinquenio, la media edad, la tercera edad y la cuarta edad. También hay que prestar atención a los misioneros que se encuentran en situaciones particulares. Sin embargo, los Organismos Mayores harán bien en organizar programas de formación permanente adaptados a los distintos grupos de edad para asegurar un acompañamiento adecuado y oportuno.","n":"509","s":1},{"t":"h","l":3,"h":"7.1. El <i>quinquenio<\/i>"},{"t":"p","h":"El primer momento especial de la formación permanente, llamado quinquenio, es la etapa de los primeros años de implicación plena en el apostolado que sigue inmediatamente a la formación inicial. Marca el paso de una vida supervisada a una situación de plena responsabilidad en el trabajo<sup class=\"fn\" data-u=\"c11\" data-n=\"73\">73<\/sup>. Por tanto, hay que procurar que el joven misionero sea animado y acompañado personalmente para vivir plenamente la juventud de su amor y su entusiasmo por Cristo<sup class=\"fn\" data-u=\"c11\" data-n=\"74\">74<\/sup>.","n":"510","s":1},{"t":"p","h":"En esta etapa, el claretiano debe descubrir con la ayuda de la comunidad una nueva manera de permanecer fiel a Dios<sup class=\"fn\" data-u=\"c11\" data-n=\"75\">75<\/sup>, para que pueda dar una respuesta adecuada a los retos que se le presentan en su nueva situación<sup class=\"fn\" data-u=\"c11\" data-n=\"76\">76<\/sup>. En un proceso integral de renovación que abarca todos los aspectos de la persona del religioso durante esta etapa<sup class=\"fn\" data-u=\"c11\" data-n=\"77\">77<\/sup>, debemos dar especial importancia a:","n":"511","s":1},{"t":"p","h":"a. Que la vida espiritual se viva en armonía con la acción<sup class=\"fn\" data-u=\"c11\" data-n=\"78\">78<\/sup>.","n":"511"},{"t":"p","h":"b. El acompañamiento pastoral, para que el claretiano pueda seguir integrando su preparación ministerial con su experiencia de vida.","n":"511"},{"t":"p","h":"c. Actualizar y aplicar en la práctica lo que se ha aprendido durante la formación inicial<sup class=\"fn\" data-u=\"c11\" data-n=\"79\">79<\/sup>.","n":"511"},{"t":"p","h":"d. Aprender a mantener el equilibrio necesario entre la vida comunitaria y el servicio ministerial.","n":"511"},{"t":"p","h":"e. Desarrollo de un conjunto de hábitos saludables adecuados a la nueva situación para mantener un crecimiento armonioso a todos los niveles.","n":"511"},{"t":"p","h":"Se deben ofrecer programas adecuados de acompañamiento a nuestros sacerdotes misioneros durante los primeros cinco años de su ministerio y a nuestros hermanos misioneros durante los cinco años siguientes a su profesión perpetua para ayudarles a consolidar la integración de su vida y su ministerio<sup class=\"fn\" data-u=\"c11\" data-n=\"80\">80<\/sup>. Algunos programas podrían organizarse en el ámbito interprovincial o de conferencia. Concretamente, esta ayuda puede ser ofrecida:","n":"512","s":1},{"t":"p","h":"a. Asegurando que los misioneros en el <i>quinquenio<\/i> sean destinados a comunidades en las que reciban un acompañamiento adecuado con la intención de cumplir los objetivos de esta etapa.","n":"512"},{"t":"p","h":"b. Confiándoles responsabilidades que no excedan su capacidad y se ajusten lo más posible a su situación personal.","n":"512"},{"t":"p","h":"c. Asegurándose de que sean acompañados personalmente por el propio Superior Mayor o por la persona responsable para la formación permanente.","n":"512"},{"t":"p","h":"d. Ofreciéndoles encuentros anuales de formación y de revisión de vida.","n":"512"},{"t":"p","h":"Además de las iniciativas ofrecidas por la Congregación, se insta a los jóvenes claretianos a participar activamente en los cursos y encuentros organizados en ámbitos diocesano, interprovincial e intercongregacional para jóvenes sacerdotes y religiosos<sup class=\"fn\" data-u=\"c11\" data-n=\"81\">81<\/sup>. Estos medios deben ser integrados en el plan del Organismo.","n":"513","s":1},{"t":"p","h":"Este período debe concluirse con un encuentro de renovación, con la suspensión al menos parcial de otras actividades. Su finalidad es la actualización de los conocimientos y, sobre todo, la intensificación de la formación espiritual, adaptada a la vida real del misionero<sup class=\"fn\" data-u=\"c11\" data-n=\"82\">82<\/sup>.","n":"514","s":1},{"t":"h","l":3,"h":"7.2. La <i>media edad<\/i>"},{"t":"p","h":"La media edad es el período de la adultez humana que precede inmediatamente al comienzo de la vejez. Aunque puede variar según las personas, se considera “edad media” la edad entre 40 y 60 años. Es el período de ministerio activo que da frutos maduros de la paternidad espiritual de un misionero aderezado por su aprendizaje y experiencia. Esta etapa de la vida introduce a la persona en la “segunda mitad” de la vida que se caracteriza por la búsqueda de lo esencial en la vida. Para muchos, es un tiempo de descubrimiento del verdadero tesoro interior cuando las fuentes externas de identidad no dan sentido a la vida. La madurez de esta etapa ayuda a recuperar el ardor del “primer amor” que inspiró nuestra vocación misionera, a renovar el don de sí mismo a Dios de manera más genuina y con mayor generosidad, a a extenderlo a los demás con mayor serenidad y sabiduría<sup class=\"fn\" data-u=\"c11\" data-n=\"83\">83<\/sup>. El misionero que encuentra el justo equilibrio entre oración, vida comunitaria y ministerio podrá sostener su ministerio con la frescura creativa de un místico y hombre de acción como nuestro Fundador que nunca se cansó de proclamar el Evangelio varias veces al día.","n":"515","s":1},{"t":"p","h":"Los frutos maduros de la media edad no se cosechan sin sus costos. En la segunda mitad de la vida, uno comienza a experimentar el declive gradual de sus habilidades físicas y los primeros signos de enfermedades. Se verá obligado a tomar conciencia de su mortalidad al darse cuenta de que le queda menos tiempo de vida del que ya ha vivido. Su mente rumia más fácilmente sobre los logros del pasado que sobre las perspectivas del futuro. Un misionero en esta etapa puede experimentar la llamada “crisis de la media edad” al pasar a la segunda mitad de su vida. La tensión de “romper y construir” en esta etapa es vivida de diversas maneras por diferentes personas. Algunos viven el período de la media edad con un activismo exagerado, agotamiento, un cierto enfoque rutinario del ministerio y la consiguiente pérdida de entusiasmo<sup class=\"fn\" data-u=\"c11\" data-n=\"84\">84<\/sup>. Algunos se acostumbran a un estilo de vida individualista y a hacer el ministerio solos. Sin embargo, un estilo personal no examinado de manejar las dificultades y los fracasos de la vida puede dar lugar a una resignada desilusión. También existe el riesgo de lidiar con la tensión escapando hacia el alcohol, temas de índole sexual y varios tipos de adicciones.","n":"516","s":1},{"t":"p","h":"<i>Hay que ayudar a los misioneros en esta etapa, a la luz del Evangelio y del carisma de la Congregación, a renovar su decisión original y a no confundir la integridad de su entrega con el nivel de los buenos resultados<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"85\">85<\/sup>. Deben recurrir a los diversos medios disponibles en la Congregación y en la Iglesia para su renovación personal.","n":"517","s":1},{"t":"p","h":"La cercanía sensible del Superior es esencial durante la crisis de transición de un misionero. El consuelo y la presencia atenta de los miembros de la comunidad y de otros claretianos puede llevar a un redescubrimiento del significado de la alianza que Dios estableció originalmente, y que no tiene intención de romper<sup class=\"fn\" data-u=\"c11\" data-n=\"86\">86<\/sup>. Las pruebas son también momentos privilegiados para descubrir la necesidad de sufrimiento y purificación en el seguimiento de Cristo crucificado.","n":"518","s":1},{"t":"p","h":"La etapa de la media edad puede ser enriquecida por:","n":"519","s":1},{"t":"p","h":"a. Escoger prácticas adecuadas de autocuidado para mantener el cuerpo, la mente y el espíritu vivos y activos, e integrar estas prácticas en el ritmo de la vida cotidiana.","n":"519"},{"t":"p","h":"b. Recurrir a un mentor/director espiritual o a un experto según la necesidad en momentos de dificultad, y abstenerse de un enfoque de “hazlo tú mismo” para arreglarse.","n":"519"},{"t":"p","h":"c. Canalizar la energía en propósitos creativos como escribir, componer, etc., y comprometerse a un servicio generoso en la comunidad y la sociedad para que este período sea muy productivo.","n":"519"},{"t":"p","h":"d. Asistir a programas sobre la media edad y temas relacionados con el crecimiento, y crear un ambiente de apreciación en la comunidad donde el envejecimiento se celebre como parte normal de la vida humana.","n":"519"},{"t":"p","h":"Sería necesario hacer una pausa en la rutina de la vida para asistir a programas de renovación al menos una vez durante este período de vida. También puede ser un período apropiado para interrumpir el ministerio pastoral ordinario con un <i>año sabático<\/i>, incluidos la actualización pastoral o los estudios especializados con miras a mejorar la competencia ministerial o en preparación para un nuevo futuro destino. También podría ser útil una nueva experiencia pastoral.","n
