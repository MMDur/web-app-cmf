":"520","s":1},{"t":"p","h":"En respuesta a la necesidad específica de renovación para las personas de media edad - y para aquellos que desean profundizar en el conocimiento del Fundador y de nuestro carisma claretiano","n":"521","s":1},{"t":"p","h":"- la Congregación ofrece <i>el Proyecto Fragua<\/i>, <i>el Encuentro con Claret<\/i> y otros programas para ayudar al misionero a vivir esta etapa particular de su vida como un momento de transformación espiritual<sup class=\"fn\" data-u=\"c11\" data-n=\"87\">87<\/sup>.","n":"521"},{"t":"h","l":3,"h":"7.3. La <i>tercera edad<\/i>"},{"t":"p","h":"La tercera edad se refiere al período de vida desde la edad de jubilación<sup class=\"fn\" data-u=\"c11\" data-n=\"88\">88<\/sup> hasta el retiro de la actividad debido a la edad avanzada y al deterioro de las facultades físicas y mentales. Como no hay edad de jubilación para la vida y misión claretiana, el misionero continúa enriqueciendo la vida y misión de la Congregación a través de lo que pueda hacer por sus hermanos y por la gente tanto como su salud se lo permita.","n":"522","s":1},{"t":"p","h":"El objetivo de esta etapa es confirmar al claretiano en la misión que aún puede realizar<sup class=\"fn\" data-u=\"c11\" data-n=\"89\">89<\/sup>, ayudarle a descubrir lo que el Señor le pide en la nueva etapa de la vida, y mantener, desde la fe y la Palabra de Dios, una actitud serena y llena de esperanza en su nueva situación de vida. Necesita aprender a aceptar e integrar la realidad del fin de la propia vida terrenal con la alegría y la esperanza cristiana.","n":"523","s":1},{"t":"p","h":"En una cultura consumista, la vejez es evitada y temida como una parte no deseada de la vida. Pero, la Palabra de Dios estima la larga vida como un signo del favor divino<sup class=\"fn\" data-u=\"c11\" data-n=\"90\">90<\/sup>. Dios también ha elegido a las personas de edad avanzada para nuevas iniciativas y para transmitir su mensaje (por ejemplo, Abraham y Sara, Moisés, Isabel y Zacarías, Simeón y Ana). <i>La vida es un regalo, y cuando es larga es un privilegio, para uno mismo y para los demás<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"91\">91<\/sup>. En la historia claretiana hay muchos ejemplos de claretianos “jubilados” a los que Dios ha elegido para nuevas iniciativas misioneras<sup class=\"fn\" data-u=\"c11\" data-n=\"92\">92<\/sup>. Los misioneros ancianos dan testimonio de la buena noticia de que la vida, en todas sus etapas y condiciones, es un precioso don de Dios y una oportunidad para conocer, amar y servir a Dios y compartir el amor de Dios con los demás.","n":"524","s":1},{"t":"p","h":"La atención médica avanzada y las mejores condiciones de vida han prolongado la longevidad, lo que ha dado lugar a un gran número de miembros relativamente sanos en la tercera edad. Es una bendición contar con misioneros veteranos con sabiduría y experiencia en nuestras comunidades. Pueden vivir en comunidades dedicadas al apostolado y pueden realizar diferentes actividades en ellas, de acuerdo con su estado y su preparación. Estos claretianos contribuyen a dar a la comunidad un sentido de estabilidad, riqueza e ingenio. También pueden compartir la sabiduría de su experiencia con otros miembros del Organismo, especialmente con los candidatos, novicios y estudiantes. La presencia de jóvenes y ancianos en la Congregación enriquece nuestra vida y misión con la memoria y sabiduría de los ancianos desde su experiencia y la renovada y expansiva esperanza y nuevos rumbos que los jóvenes representan para la humanidad<sup class=\"fn\" data-u=\"c11\" data-n=\"93\">93<\/sup>.","n":"525","s":1},{"t":"p","h":"Los misioneros de la tercera edad deben asumir su papel en las comunidades para transmitir la memoria y la sabiduría de nuestra historia en cada lugar y reflejar la belleza de una vida misionera perseverante. Llevan a cabo su vida misionera mediante la oración, el sacrificio y el testimonio de vida, compartiendo su sabiduría con los demás y apoyando la misión de la comunidad mediante una actividad ministerial apropiada. Así como se inspiraron para sus apostolados en la vida de Claret como misionero apostólico, también deben aprender el arte de vivir el atardecer de sus vidas a partir de su ejemplo de cómo vivió su vocación misionera en el momento de la disminución de las actividades apostólicas, el sufrimiento, la enfermedad y el exilio.","n":"526","s":1},{"t":"p","h":"Por parte del individuo, esto implica:","n":"527","s":1},{"t":"p","h":"a. Aceptar su propia situación (edad, enfermedad y otras limitaciones) y prepararse para vivirla de manera serena aprendiendo a envejecer con sentido y pasión misionera. También implica dejar ir las posiciones de poder mientras anima y capacita a los claretianos más jóvenes para asumir y llevar a cabo las responsabilidades que anteriormente él desempeñaba.","n":"527"},{"t":"p","h":"b. Vivir esta etapa con un espíritu de gratitud, perdón, entrega y alegría, compartiendo la propia sabiduría y el celo misionero con los demás y rezando por la Iglesia y la Congregación.","n":"527"},{"t":"p","h":"c. Vivir con conciencia el proceso de transfiguración con Cristo, convirtiendo los sufrimientos de esta etapa en una oportunidad para ser transformados por la experiencia pascual<sup class=\"fn\" data-u=\"c11\" data-n=\"94\">94<\/sup>.","n":"527"},{"t":"p","h":"d. Disposición para responder a nuevas oportunidades de participación misionera, y compartir generosamente sus dones, talentos y experiencia.","n":"527"},{"t":"p","h":"Por parte de la comunidad, esto implica que debería:","n":"528","s":1},{"t":"p","h":"a. Mostrar una delicada sensibilidad a las necesidades de los ancianos claretianos, y un gran amor y respeto por sus personas y su vida vivida, independientemente de su capacidad de hacer cualquier servicio a la comunidad.","n":"528"},{"t":"p","h":"b. Discernir lo que cada uno puede aportar todavía a la misión global de la Congregación e implicarle en la vida cotidiana de la comunidad en la medida de sus posibilidades.","n":"528"},{"t":"p","h":"c. Ofrecerle la ayuda necesaria para que pueda adaptarse a su nueva situación.","n":"528"},{"t":"p","h":"Para lograr esta integración, se le debe proporcionar:","n":"529","s":1},{"t":"p","h":"a. Atención a sus necesidades médicas y psicológicas.","n":"529"},{"t":"p","h":"b. Asistencia para aceptarse a sí mismo como es.","n":"529"},{"t":"p","h":"c. Una verdadera espiritualidad de la tercera edad, que supone una vida especial de contemplación, una dedicación más intensa a la oración apostólica y una ofrenda de su propia vida en favor de la misión.","n":"529"},{"t":"p","h":"d. Una actualización pastoral para los tipos de ministerios que aún puede emprender: el sacramento de la reconciliación, la pastoral de los enfermos, la dirección espiritual y otros ministerios.","n":"529"},{"t":"p","h":"e. Oportunidades para realizar aficiones personales y cualquier tipo de colaboración en la que pueda sentirse útil.","n":"529"},{"t":"p","h":"f. Cuando el funcionamiento cognoscitivo de la persona se ve perjudicado o limitado, el superior tiene la responsabilidad de discernir y decidir por la persona para evitarle daños a él o a otros, o para que no sea aprovechado por otros.","n":"529"},{"t":"p","h":"Para los que todavía pueden trabajar pero viven en países donde la jubilación es obligatoria a cierta edad, queda la posibilidad, si lo desean, de continuar su labor misionera trasladándose a otro país que no presente estas limitaciones<sup class=\"fn\" data-u=\"c11\" data-n=\"95\">95<\/sup>.","n":"530","s":1},{"t":"p","h":"Cada Organismo puede también organizar excursiones, actividades recreativas, retiros y otras iniciativas que puedan servir como experiencias formativas para los misioneros de esta época y mantenerlos conectados lo más estrechamente posible con la vida de la comunidad más amplia.","n":"531","s":1},{"t":"h","l":3,"h":"7.4. La <i>cuarta edad<\/i>"},{"t":"p","h":"La cuarta edad<sup class=\"fn\" data-u=\"c11\" data-n=\"96\">96<\/sup> se refiere a los últimos años de la edad adulta caracterizados por un declive biológico y cognitivo relacionado con la edad que conduce al “fiat” final de la vida. Es la etapa en que cesan los esfuerzos productivos, disminuye la fuerza y los signos de enfermedad, la vulnerabilidad y la necesidad de asistencia y cuidados se vuelven esenciales. La configuración a la agonía y muerte de Cristo toma una huella muy personal y única en el sufrimiento del misionero. Es el momento de imitar a Jesús que <i>supo que había llegado el momento de dejar este mundo e ir al Padre,<\/i> y <i>habiendo amado a los suyos que estaban en el mundo<\/i>, <i>los amó hasta el final<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"97\">97<\/sup>.<b> <\/b>Así, “cuando llega el momento de unirse a la hora suprema de la Pasión del Señor, la persona consagrada sabe que el Padre está llevando a cabo el misterioso proceso de formación que comenzó hace muchos años”<sup class=\"fn\" data-u=\"c11\" data-n=\"98\">98<\/sup>. El misionero espera y prepara su muerte como el “acto supremo de amor y de entrega”<sup class=\"fn\" data-u=\"c11\" data-n=\"99\">99<\/sup>.","n":"532","s":1},{"t":"p","h":"El objetivo de esta etapa es ofrecer al claretiano una atención y un acompañamiento adecuados en los últimos años y días de su vida terrena, y ayudarle a vivir el misterio pascual en su vida concreta y a esperar la venida del Señor.","n":"533","s":1},{"t":"p","h":"Puede ser necesario crear comunidades especiales, particularmente para aquellos que necesitan asistencia regular y cuidados intensivos que no pueden recibir en otras comunidades. Estas comunidades deben tener un proyecto comunitario realista. Además, hay que tener cuidado de nombrar a los superiores y al personal idóneo para tales comunidades<sup class=\"fn\" data-u=\"c11\" data-n=\"100\">100<\/sup>.","n":"534","s":1},{"t":"p","h":"Por parte del claretiano de la cuarta edad, esto implica:","n":"535","s":1},{"t":"p","h":"a. Aceptar humildemente su propia fragilidad, enfermedad y mantener un corazón agradecido por las grandes cosas que Dios ha realizado en su vida.","n":"535"},{"t":"p","h":"b. Dejarse llevar por el proceso de transfiguración con Cristo, para que los sufrimientos, pérdidas y fragilidades de esta etapa se conviertan en oportunidades para ser transformados por la gracia del misterio pascual.","n":"535"},{"t":"p","h":"c. Como Pedro, debe aplicarse a sí mismo las palabras del Señor: Cuando seas viejo, extenderás tus manos, y otro te ceñirá y te llevará donde no quieras.","n":"535"},{"t":"p","h":"d. Preparar su última voluntad de acuerdo con nuestras normas para no dejar ningún asunto sin resolver después de su muerte.","n":"535"},{"t":"p","h":"e. Prepararse para decir como Jesús con la confianza en Dios como la de un niño, “está cumplido” y “en tus manos confío mi espíritu”.","n":"535"},{"t":"p","h":"Por parte de la comunidad, esto significa que debería:","n":"536","s":1},{"t":"p","h":"a. Apreciar con reverencia, amor y cuidado fraternal a los ancianos claretianos que están en los últimos años o días de su vida.","n":"536"},{"t":"p","h":"b. Ofrecerles toda la ayuda necesaria, acompañamiento amoroso, validación y apoyo para que no sufran desesperación, dolor y soledad.","n":"536"},{"t":"p","h":"c. Valorar los dones y carismas de los ancianos claretianos en el apostolado y la liturgia.","n":"536"},{"t":"p","h":"d. Ayudar a los ancianos claretianos a trascender la pérdida y las discapacidades para encontrar esperanza y sentido en Dios y en la vivencia de su vocación misionera.","n":"536"},{"t":"p","h":"e. Evaluar las necesidades espirituales de los ancianos claretianos frágiles y ayudarles a que sean atendidas eficazmente.","n":"536"},{"t":"p","h":"f. Asegurarse de que exista un último testamento legalmente válido para evitar que se dejen cuestiones injustificadas a la posteridad.","n":"536"},{"t":"p","h":"A medida que la longevidad se prolonga debido a los avances en la medicina y el tratamiento, el período de vida vivido en la enfermedad también suele prolongarse. En este contexto, hay que recordar que Dios llama a cada persona a “<i>está llamado a una plenitud de vida que va más allá de las dimensiones de su existencia terrena, ya que consiste en la participación de la vida misma de Dios<\/i>”<sup class=\"fn\" data-u=\"c11\" data-n=\"101\">101<\/sup>, y <i>esta llamada sobrenatural subraya precisamente el carácter relativo de la vida terrena del hombre y de la mujer. En verdad, esa no es realidad “última”, sino “penúltima”<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"102\">102<\/sup>. Sobre la base de este principio, debemos discernir la idoneidad de los tratamientos elegidos en los momentos críticos y evitar los excesos terapéuticos destinados a prolongar la vida a toda costa sin tener en cuenta el misterio de la vida después. Nuestro enfoque debe ser el de ofrecer una adecuada asistencia médica, presencia claretiana, calor fraterno y cercanía responsable en el acompañamiento de un misionero en los últimos días de su vida. Cuando un misionero es llamado al Padre, debemos ofrecer una liturgia significativa y orante de entierro apropiada para un misionero que ha sido fiel a su vocación hasta su último aliento<sup class=\"fn\" data-u=\"c11\" data-n=\"103\">103<\/sup>.","n":"537","s":1},{"t":"h","l":2,"h":"8. SITUACIONES PARTICULARES"},{"t":"h","l":3,"h":"8.1. Crisis durante la formación permanente"},{"t":"p","h":"Los misioneros pueden pasar por una crisis en cualquier momento de su vida<sup class=\"fn\" data-u=\"c11\" data-n=\"104\">104<\/sup>. Todo desarrollo humano (incluido el espiritual) implica crisis y es necesario educar la capacidad de enfrentar las crisis de la vida con resiliencia. A veces las crisis no se producen y es necesario provocarlas con la intención formativa de despertar a la persona de su letargo espiritual y promover su crecimiento. Los momentos de crisis pueden ocurrir debido a factores externos (como cambio del lugar de trabajo, traslados, fracasos, críticas, etc.) o a factores personales (aridez espiritual, tentaciones de los agentes pastorales<sup class=\"fn\" data-u=\"c11\" data-n=\"105\">105<\/sup>, enfermedades físicas o mentales, soledad, crisis de amor, fe y esperanza, así como los que tienen que ver con la identidad presbiteral / religiosa, etc.). Una crisis en la vida vocacional, si no se maneja positivamente como un momento de gracia y crecimiento, puede desestabilizar temporalmente el equilibrio vital del misionero y tener graves consecuencias. Una situación de crisis no debe conducir necesariamente al debilitamiento de la vocación, sino que puede servir como un aula de maduración de la vida y misión claretiana en la escuela del Espíritu Santo. Una crisis puede ser un lugar de encuentro con el Señor resucitado, como en el caso de los discípulos de Emaús<sup class=\"fn\" data-u=\"c11\" data-n=\"106\">106<\/sup>, y desembocar en la renovación del entusiasmo misionero. Durante la formación continua, nuestros misioneros deben estar adecuadamente preparados para identificar y manejar las crisis de la vida a medida que vayan surgiendo en el transcurso de su camino. La vida comunitaria saludable, la corrección fraterna oportuna, el examen diario de conciencia, la dirección espiritual, el uso responsable de los medios de comunicación y el acompañamiento mutuo juegan un papel importante a la hora de afrontar las crisis de manera positiva.","n":"538","s":1},{"t":"p","h":"Una crisis experimentada en los primeros años de formación continua puede estar relacionada con la falta de internalización de los valores de la vida consagrada. Tras la formación inicial, un joven misionero, en el contexto de la recién descubierta libertad en el ministerio, cuya vocación no se basa en un encuentro personal con el Señor resucitado y carece del apoyo de dinámicas espirituales regulares, del alimento de los sacramentos y de una vida disciplinada, puede tener dificultades para mantenerse centrado en Cristo y atento a la misión de la comunidad. Las decisiones basadas en gustos y disgustos no examinados a la luz del Espíritu pueden conducir a situaciones de crisis y afectar a la vivencia de los votos, al alcoholismo, a problemas persistentes en la vida comunitaria y a la pérdida de entusiasmo por la misión. Durante la crisis, suele darse la tendencia a actuar a la defensiva, negando el problema, ocultándolo o minimizándolo, y a esperar que desaparezca por sí solo<sup class=\"fn\" data-u=\"c11\" data-n=\"107\">107<\/sup>. A menudo, se interrumpe la comunicación. El misionero puede verse tentado de refugiarse en una melancolía silenciosa, buscar refugio en adicciones autodestructivas, expresar el estrés a través de arrebatos de enojo y constantes quejas o incluso cuestionarse la propia identidad misionera. Las crisis que requieren un anclaje vocacional exigen que uno vuelva a examinar las raíces de la crisis y se comprometa nuevamente con Cristo consciente y libremente, porque una vocación misionera no puede construirse sobre la arena<sup class=\"fn\" data-u=\"c11\" data-n=\"108\">108<\/sup>.","n":"539","s":1},{"t":"p","h":"Aunque las crisis pueden ocurrir en cualquier etapa de la vida, hay ciertos momentos que requieren especial atención. El misionero puede darse cuenta de que ha perdido su pasión por la misión y el fervor por el Señor cuando el entusiasmo inicial por el ministerio da paso a la monotonía de la rutina y a una sensación de soledad que a menudo tiene que ver con el conflicto de intimidad-aislamiento<sup class=\"fn\" data-u=\"c11\" data-n=\"109\">109<\/sup> propio de la vida adulta. Otro momento es la conocida como “crisis de la mediana edad”, durante la cual el misionero puede verse enfrentado al conflicto de no generar descendencia y el miedo al estancamiento<sup class=\"fn\" data-u=\"c11\" data-n=\"110\">110<\/sup>. A menudo, la tentación en tales crisis de desarrollo es evitar el conflicto recurriendo a soluciones rápidas, como refugiarse en enredos afectivos o buscar una forma de vida diocesana. Durante estos períodos, las crisis deben abordarse a través del auténtico discernimiento de los espíritus que hay detrás del deseo de cambio. Los superiores deben acompañar la formación continua de los misioneros, “no sólo ofrecerles ayuda para resolver eventuales problemas o superar posibles crisis, sino también estar atentos al crecimiento normal de cada uno en todas y cada una de las fases y estaciones de la existencia, de manera que quede garantizada esa «juventud de espíritu que permanece en el tiempo»”<sup class=\"fn\" data-u=\"c11\" data-n=\"111\">111<\/sup>.","n":"540","s":1},{"t":"p","h":"Cómo afrontar una crisis:","n":"541","s":1},{"t":"p","h":"a. El misionero en crisis, sus hermanos y superiores, deben ser conscientes de que un momento de crisis, si se entiende y aborda adecuadamente, con la voluntad de aprender de la vida, puede y debe convertirse en una ocasión de conversión y renovación<sup class=\"fn\" data-u=\"c11\" data-n=\"112\">112<\/sup>. Lo más importante es enfrentarla juntos en el Espíritu de Cristo.","n":"541"},{"t":"p","h":"b. Tomar medidas para regresar a la “memoria deuteronómica de nuestra vocación”, a esos momentos luminosos en los que experimentamos el llamado del Señor a dedicar la vida a su servicio<sup class=\"fn\" data-u=\"c11\" data-n=\"113\">113<\/sup>.","n":"541"},{"t":"p","h":"c. Los superiores y las comunidades deben ofrecer una presencia de apoyo y un amor comprensivo al misionero en crisis, acompañándolo pacientemente y alentándolo a estar tranquilo frente a una crisis e invitándolo a regresar al “amor primero” que le animó a hacer la profesión religiosa en la Congregación.","n":"541"},{"t":"p","h":"d. Nunca tomar ninguna decisión que cambie la vida cuando se está emocionalmente perturbado.","n":"541"},{"t":"p","h":"e. Discernir lo que el Señor está pidiendo a través de la crisis y cómo este tiempo se puede transformar en un momento de gracia y crecimiento. El discernimiento auténtico necesariamente debe involucrar a los Superiores y, cuando sea apropiado, también al asesoramiento de profesionales.","n":"541"},{"t":"p","h":"f. Practicar la oración de gratitud mediante el reconocimiento de todas las formas en que uno ha experimentado el amor, la generosidad, la solidaridad y la confianza de Dios, así como su perdón, paciencia, tolerancia y compasión<sup class=\"fn\" data-u=\"c11\" data-n=\"114\">114<\/sup>.","n":"541"},{"t":"p","h":"g. Cuando una crisis implica una conducta inapropiada relacionada con los consejos evangélicos, debe abordarse seriamente de acuerdo con las normas de nuestro derecho, y del derecho de la Iglesia y la sociedad civil.","n":"541"},{"t":"h","l":3,"h":"8.2. Conducta inapropiada relacionada con los consejos evangélicos"},{"t":"p","h":"Cualquier conducta que sea incompatible con nuestra forma de vida daña a la persona misma, a los demás, a la Congregación y a la Iglesia. Debemos hacer todo lo posible para evitar que ocurran estos casos en cualquier espacio de nuestra Congregación mediante la introducción de un código de conducta adecuado y la implementación de medidas preventivas según el protocolo de la Congregación<sup class=\"fn\" data-u=\"c11\" data-n=\"115\">115<\/sup>. Debe haber programas de concienciación de los problemas importantes relacionados con diversas formas de abuso y el cultivo de las competencias necesarias para evitar que nuestros misioneros sean víctimas de vicios y diversas adicciones, especialmente en relación con el alcohol, la sexualidad, la pornografía y el mal uso del Internet. Debemos crear colectivamente un clima de credibilidad mediante el cultivo de valores como la responsabilidad, la rendición de cuentas y la transparencia en todos los niveles<sup class=\"fn\" data-u=\"c11\" data-n=\"116\">116<\/sup>.","n":"542","s":1},{"t":"h","l":4,"h":"<i>8.2.1. Conducta inapropiada en relación con el voto de castidad<\/i>"},{"t":"p","h":"No es fácil vivir con alegría la castidad consagrada en nuestra sociedad contemporánea. Las inconsistencias vocacionales y la integración inadecuada de los impulsos sexuales en el misionero comienzan a expresarse externamente en el contexto ministerial a través de algunos indicadores como el no respetar ciertos límites en las relaciones personales, llamadas telefónicas en momentos inapropiados, conversaciones obscenas, adicción a la pornografía, masturbación compulsiva e inapropiada conducta sexual. Los apegos afectivos desordenados se agravan por la falta de interés por la comunidad, la pérdida de interés en la oración (común y personal) y la falta de responsabilidad personal.","n":"543","s":1},{"t":"p","h":"La formación continua debe enfocarse en profundizar la conciencia de los desafíos que implica vivir la castidad y preparar a los misioneros para afrontarlos de una manera madura. El secreto y la oscuridad son el caldo de cultivo de afectos desordenados que van más allá de los límites personales saludables y conducen a un comportamiento abusivo. Una cultura de transparencia y responsabilidad en comunidad, la corrección fraterna y la evaluación, así como el acompañamiento espiritual y psicológico, ayudan en el proceso de integrar las dimensiones afectivas y sexuales en la forma de vida que hemos elegido. El crecimiento y la integración tienen lugar cuando el misionero toma conciencia de sus fortalezas y debilidades y asume la responsabilidad de abordar sus problemas haciendo uso de los medios espirituales y psicológicos, especialmente los prescritos por nuestras Constituciones (oración diaria<sup class=\"fn\" data-u=\"c11\" data-n=\"117\">117<\/sup>, retiro mensual, ejercicios espirituales<sup class=\"fn\" data-u=\"c11\" data-n=\"118\">118<\/sup>, celebración frecuente del sacramento de la reconciliación<sup class=\"fn\" data-u=\"c11\" data-n=\"119\">119<\/sup>, dirección espiritual y discernimiento comunitario<sup class=\"fn\" data-u=\"c11\" data-n=\"120\">120<\/sup>, corrección fraterna<sup class=\"fn\" data-u=\"c11\" data-n=\"121\">121<\/sup>, trabajo intenso y cuidado adecuado de la salud mental y física<sup class=\"fn\" data-u=\"c11\" data-n=\"122\">122<\/sup>).","n":"544","s":1},{"t":"h","l":5,"h":"<i>a. Abuso sexual de menores y adultos vulnerables<\/i>"},{"t":"p","h":"El abuso sexual de menores<sup class=\"fn\" data-u=\"c11\" data-n=\"123\">123<\/sup> y adultos vulnerables<sup class=\"fn\" data-u=\"c11\" data-n=\"124\">124<\/sup> es un delito penal que causa graves daños a la vida de las víctimas. A menudo, el abuso sexual de menores y adultos vulnerables está relacionado con la estructura patológica de la persona que ha sido víctima de abuso y se ha convertido en parte de la cadena de un mal pernicioso muy extendido en la sociedad<sup class=\"fn\" data-u=\"c11\" data-n=\"125\">125<\/sup>. Por lo tanto, tanto la víctima como el victimario necesitan acompañamiento y apoyo para recuperarse del daño a sí mismos sin perjuicio de las implicaciones canónicas y legales sobre el abusador.","n":"545","s":1},{"t":"p","h":"El abuso sexual de menores y adultos vulnerables es un abuso en cuatro niveles: <i>abuso sexual<\/i>, <i>abuso de poder<\/i>, <i>abuso de confianza<\/i> y<i> abuso espiritual<\/i>.","n":"546","s":1},{"t":"p","h":"a. Es un <i>abuso sexual<\/i> porque implica un contacto sexual entre un adulto y un menor, lo que incluye tocamientos inapropiados de tipo sexual y exposición indecente. El riesgo de abuso mediante ciertos gestos o palabras provoca una revictimización, especialmente cuando el menor ha sufrido abusos anteriormente.","n":"546"},{"t":"p","h":"b. También es un <i>abuso de poder<\/i> porque el abusador ejerce su poder sobre el menor o adulto vulnerable como eclesiástico y como adulto, lo que hace indefenso al abusado. Este abuso implica que se explote la inferioridad y vulnerabilidad del abusado<sup class=\"fn\" data-u=\"c11\" data-n=\"126\">126<\/sup>.","n":"546"},{"t":"p","h":"c. Es un <i>abuso de confianza<\/i> cuando lo cometen miembros de la Iglesia que las víctimas conocen y en quienes confían por su carácter sagrado y la credibilidad de la Iglesia.","n":"546"},{"t":"p","h":"d. Es un abuso espiritual porque el abuso de un menor o persona vulnerable por parte de un ministro ordenado o un religioso se equipara a una especie de incesto espiritual que genera violencia sobre el alma de la persona. Cuando el abuso es realizado por la persona mediadora de la fuente última, Dios, se despoja a la persona de su sistema espiritual orientado hacia Dios.","n":"546"},{"t":"p","h":"Dada la firme responsabilidad de la Iglesia en la formación de religiosos y sacerdotes a este respecto<sup class=\"fn\" data-u=\"c11\" data-n=\"127\">127<\/sup> los programas de formación continua deben incluir información adecuada y actualizada sobre aquellos temas relacionados con la violencia y posible explotación como, por ejemplo, las adicciones, el tráfico de menores, el trabajo infantil y el abuso sexual de niños o personas vulnerables. Los miembros de la Congregación que puedan estar implicados en casos de comportamientos inadecuados en relación al voto de castidad deben ser acompañados de forma apropiada, actuando con honestidad y celeridad, siguiendo las normas de los derechos civil y canónico, el protocolo de la Congregación y del Organismo Mayor respectivo.","n":"547","s":1},{"t":"p","h":"Para asegurar la prevención de abusos y la protección de menores y adultos vulnerables, nuestros misioneros deberán prestar atención a:","n":"548","s":1},{"t":"p","h":"a. Seguir el código de conducta descrito en el protocolo del Organismo Mayor para la protección de menores. Debe estudiarse personalmente y en grupo. Asimismo, se debe guardar en el archivo provincial una copia firmada por cada miembro.","n":"548"},{"t":"p","h":"b. La vigilancia y corrección mutua entre los miembros de la comunidad y del Organismo Mayor para evitar que se produzca cualquier abuso. Si alguien sabe que un misionero está sometido a una fuerte tentación o ha sido culpable de una falta grave, debe informar de inmediato a los superiores respectivos y ayudar a resolver el problema de inmediato mostrando preocupación por la verdad y por el bien de las personas afectadas. En estos casos se debe actuar con honestidad, discreción y caridad, respetando la privacidad y el derecho a la buena fama de las partes involucradas.","n":"548"},{"t":"p","h":"c. Para evitar malentendidos y posibles casos desafortunados de abuso, debemos trabajar en equipo en aquellas actividades que involucren a niños y adultos vulnerables.","n":"548"},{"t":"p","h":"d. Evitar cualquier tipo de abuso físico y verbal hacia los niños, así como conversaciones sexuales y bromas en su presencia, exhibición de material pornográfico o moralmente inapropiado, comunicaciones electrónicas sexualmente provocativas. Se debe evitar también proporcionar a los niños alcohol, tabaco o drogas.","n":"548"},{"t":"p","h":"e. Evitar expresiones inapropiadas de afecto entre los misioneros y los menores de acuerdo con las tradiciones y la cultura de cada lugar.","n":"548"},{"t":"p","h":"f. Observar las mejores prácticas descritas en el código de conducta en relación a los viajes con niños y jóvenes, su alojamiento y supervisión.","n":"548"},{"t":"h","l":5,"h":"<i>b. Abuso sexual en un contexto ministerial con fieles adultos<\/i>"},{"t":"p","h":"Los misioneros deben conocer las situaciones y expresiones de los abusos sexuales en el ejercicio de su ministerio. Deben tener en cuenta que se les confía el cuidado y el acompañamiento de las personas en sus respectivos ministerios y responsabilidades al servicio de las personas en el nombre del Señor. En el caso de una conducta sexual en la que estén involucrados un misionero y un adulto fiel, siempre hay una diferencia de poder (por ejemplo, párroco y fiel, formador y formando, director espiritual y dirigido, consejero y aconsejado, director y personal, etc.); por eso, se considera que hay abuso sexual, abuso de confianza y una violación de los límites relacionales. Tales comportamientos perjudican a las víctimas y a la institución, independientemente del posible consentimiento mutuo. Estos comportamientos requieren medidas correctivas apropiadas y rápidas. En el cuidado pastoral de las personas, nuestros misioneros deben:","n":"549","s":1},{"t":"p","h":"a. Cultivar una nueva cultura del cuidado pastoral basada en la conversión, la transparencia, la sinceridad y la solidaridad con las víctimas, y atenta a todas las formas de sufrimiento humano, de modo que la cultura del abuso no tenga espacio para desarrollarse, y mucho menos para continuar<sup class=\"fn\" data-u=\"c11\" data-n=\"128\">128<\/sup>.","n":"549"},{"t":"p","h":"b. Vivir la espiritualidad del discipulado para que, configurados con Cristo, aprendan a mirar a las personas a través de los ojos de Jesús y a amarlas con el corazón del Señor. Las actitudes y los sentimientos de Jesús les permitirán reconocer la imagen de Dios en el otro y usar el poder y la autoridad para servirlos con humildad.","n":"549"},{"t":"p","h":"c. Buscar una persona sabia de confianza para recibir dirección espiritual, orientación, acompañamiento y asesoramiento, compartiendo su camino personal con total confianza y apertura<sup class=\"fn\" data-u=\"c11\" data-n=\"129\">129<\/sup>.","n":"549"},{"t":"p","h":"d. Evitar con prudencia los apegos exclusivos con personas particulares, las visitas inoportunas a personas que causen sospechas en otros, el envío de mensajes lascivos, etc., toda conducta que no sea Que no esté en consonancia con el cargo que ocupan.","n":"549"},{"t":"p","h":"e. Mantener los límites apropiados cuando en las relaciones propias del ministerio tengan que ofrecer apoyo, aliento, escucha y consejos a las personas que buscan consuelo para sus problemas. Esta distancia saludable protege al misionero de cualquier posible manipulación, de la dependencia emocional y material y la consiguiente vulnerabilidad de las personas que reciben ayuda. Por otro lado, es importante cultivar una relación sana, respetuosa y capacitadora con las personas para servirlas de manera efectiva.","n":"549"},{"t":"p","h":"f. Tener en cuenta las normas culturales del lugar donde se ejerce el ministerio con respecto al contacto apropiado y el contacto físico con personas de ambos sexos.","n":"549"},{"t":"p","h":"g. En el caso de las amistades heterosexuales, tomar conciencia de que la dimensión erótica de cualquier relación se intensifica por el secreto y la exclusividad. Es importante contar con otra persona, ya sea un director espiritual o un acompañante, para ayudar a discernir y mantener la relación congruente con la forma de vida elegida.","n":"549"},{"t":"p","h":"h. En el caso de una acusación de conducta sexual inapropiada con un adulto, debe seguirse el protocolo de la Congregación sin perjuicio de las leyes civiles del lugar.","n":"549"},{"t":"h","l":5,"h":"<i>c. Abuso de mujeres consagradas<\/i>"},{"t":"p","h":"Nuestros misioneros colaboran estrechamente con mujeres consagradas como colaboradoras en la misión. Es un testimonio de amor evangélico cuando se da una relación sana y mutuamente respetuosa entre hombres y mujeres consagrados que se ayudan a crecer en fidelidad al llamado de Dios y a cumplir su misión en la Iglesia. Sin embargo, hay también espacio para conductas y abusos sexuales inapropiados debido a la disparidad de poder y la dinámica psico-sexual entre personas célibes que mantienen un contacto cercano. Los factores de desarrollo también juegan un papel en el enamoramiento transitorio entre los jóvenes religiosos que están juntos en el mismo ambiente. Estos pueden llegar a una mayor madurez si abordan sus afectos con el acompañamiento adecuado de sus mentores. El abuso sexual de mujeres consagradas en cualquier forma (insinuaciones sexuales, sexo consensuado, violencia o violación) denigra la dignidad de las mujeres, traiciona la confianza y profana su consagración. Para cultivar una relación respetuosa y recíproca con las mujeres consagradas y promover la corresponsabilidad de la misión del Señor, debemos:","n":"550","s":1},{"t":"p","h":"a. Abordar abierta y prudentemente todos los asuntos relacionados con el abuso de poder, el abuso sexual y los enredos afectivos que involucran a mujeres consagradas y a mujeres colaboradoras en nuestra pastoral.","n":"550"},{"t":"p","h":"b. Crear conciencia sobre las características espirituales y psicológicas, así como la naturaleza complementaria de las diferencias de género que juegan un papel en las relaciones personales de los célibes y su colaboración en el ministerio.","n":"550"},{"t":"p","h":"c. Aprender a respetar la dignidad de las mujeres y considerar a las mujeres consagradas como socios iguales al servicio del reino en una misión compartida. Apreciar asimismo las aportaciones de los talentos, roles y carismas complementarios de ambos sexos.","n":"550"},{"t":"p","h":"d. Informar sobre acusaciones de mala conducta, atenderlas con la debida seriedad y tomar las medidas apropiadas siguiendo el protocolo de la Congregación.","n":"550"},{"t":"h","l":5,"h":"<i>d. Comportamientos homosexuales<\/i>"},{"t":"p","h":"El respeto por la persona humana y el reconocimiento de la imagen divina inviolable en cada persona<sup class=\"fn\" data-u=\"c11\" data-n=\"130\">130<\/sup>, independientemente de su orientación sexual, es fundamental para el acercamiento de la Iglesia a los problemas humanos. Sin embargo, esto no implica aceptar comportamientos incompatibles con la propia vocación. Si bien la Iglesia sostiene que debe hacerse una distinción entre una tendencia que puede ser innata y los actos de homosexualidad que <i>son intrínsecamente desordenados y contrarios a la Ley Natural<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"131\">131<\/sup>, considera que las personas con “tendencias homosexuales profundamente arraigadas” no son aptas para el sacerdocio y la vida religiosa<sup class=\"fn\" data-u=\"c11\" data-n=\"132\">132<\/sup>.","n":"551","s":1},{"t":"p","h":"Los comportamientos homosexuales se vuelven aún inaceptables, cuando tienen lugar en el contexto del ministerio pastoral o la formación de misioneros o laicos. La pertenencia a clubes gay, la participación en movimientos gay y la visita a sitios web gay son incompatibles con nuestra forma de vida. No debemos permitir que en el ambiente claretiano crezca una cultura gay<sup class=\"fn\" data-u=\"c11\" data-n=\"133\">133<\/sup> que también causa facciones y coaliciones encubiertas, y erosiona nuestra vitalidad misionera en la Iglesia. Siguiendo las instrucciones de la Santa Sede y de nuestra Congregación, debemos tener programas para ayudar a nuestros misioneros en la integración continua de su sexualidad y afectividad a medida que avanzan en la vida.","n":"552","s":1},{"t":"h","l":4,"h":"<i>8.2.2. Conducta inapropiada relacionada con la pobreza<\/i>"},{"t":"p","h":"Los bienes temporales de la Congregación, fruto de nuestro trabajo y la caridad de los fieles, son medios necesarios para nuestra vida y misión y nuestro servicio a los pobres<sup class=\"fn\" data-u=\"c11\" data-n=\"134\">134<\/sup>. Debemos administrarlos como custodios responsables con responsabilidad y transparencia, de acuerdo con las normas de la Iglesia y la Congregación<sup class=\"fn\" data-u=\"c11\" data-n=\"135\">135<\/sup>.","n":"553","s":1},{"t":"p","h":"Cuando los misioneros se enamoran del dinero y la riqueza y los usan por su cuenta sin seguir nuestras normas, van en contra del voto de pobreza y perjudican a la Congregación y a los pobres. Lo que inicialmente aparece como pequeñas concesiones y componendas con el voto de pobreza se convierte en graves trastornos en la vida religiosa, incluso hasta causar grandes escándalos financieros. El misionero que es víctima del ansia de obtener ganancias económicas no trabajará de manera decidida por la gloria de Dios. La codicia, que es el peor de los vicios, le costaría su credibilidad ante la gente<sup class=\"fn\" data-u=\"c11\" data-n=\"136\">136<\/sup>. A menudo, el abuso de dinero va ligado a otros actos pecaminosos.","n":"554","s":1},{"t":"p","h":"Los ecónomos y aquellos que administran los bienes de la Congregación deben ser conscientes de sus propias inclinaciones contra el espíritu de pobreza y llevar a cabo su tarea en dependencia y bajo la dirección de sus respectivos superiores<sup class=\"fn\" data-u=\"c11\" data-n=\"137\">137<\/sup>. Las conductas impropias en relación con el voto de pobreza tienen lugar de diferentes maneras:","n":"555","s":1},{"t":"p","h":"a. Mantener el dinero no contabilizado, negarse a remitir estipendios, remuneraciones / sueldos y donaciones, etc., a la comunidad y gastarlos por cuenta propia sin la aprobación de los superiores.","n":"555"},{"t":"p","h":"b. Gastos personales excesivos, viajes sin la autorización de los superiores y vivir un estilo de vida como si los pobres no existieran<sup class=\"fn\" data-u=\"c11\" data-n=\"138\">138<\/sup>.","n":"555"},{"t":"p","h":"c. Favorecer la compañía preferente y exclusiva de personas ricas en nuestras fiestas, tiempo libre, visitas, viajes, etc.","n":"555"},{"t":"p","h":"d. Gestión de fondos o bienes de los cuales uno está a cargo, sin realizar las debidas consultas, sin obtener los permisos de los superiores respectivos y sin proporcionarles a tiempo la información oportuna.","n":"555"},{"t":"p","h":"e. Uso indebido de los fondos recibidos para proyectos específicos o gastos en otros proyectos.","n":"555"},{"t":"p","h":"f. Pedir prestado dinero o tomar préstamos sin la autorización de los superiores.","n":"555"},{"t":"p","h":"g. Tener cuentas bancarias y propiedad de bienes que no sean bienes patrimoniales<sup class=\"fn\" data-u=\"c11\" data-n=\"139\">139<\/sup> o adquirir posesiones (edificios, vehículos, etc.) a nombre propio sin la autorización de los superiores.","n":"555"},{"t":"p","h":"h. Desvío de fondos congregacionales, sin el discernimiento adecuado y el conocimiento y aprobación de los superiores, para brindar apoyo económico a otras personas con las que hay vínculos afectivos, incluida la propia familia y los parientes.","n":"555"},{"t":"p","h":"i. Actuación de los ecónomos por su cuenta sin dar cuenta a sus Superiores.","n":"555"},{"t":"p","h":"j. Inversiones no éticas buscando solo el mayor beneficio.","n":"555"},{"t":"p","h":"k. Los superiores y los ecónomos a todos los niveles que realizan operaciones financieras y usan los recursos de la Congregación sin la debida consulta y discernimiento.","n":"555"},{"t":"p","h":"Las comunidades y los Organismos Mayores van en contra del espíritu de pobreza de diferentes maneras, como, por ejemplo:","n":"556","s":1},{"t":"p","h":"a. No teniendo en cuenta a los pobres y necesitados en la planificación y administración de nuestros bienes.","n":"556"},{"t":"p","h":"b. Pasando por alto la enseñanza social de la Iglesia al tratar con los empleados.","n":"556"},{"t":"p","h":"c. Comunidades capitalizando sus ingresos sin presentar las cuentas reales a los Superiores Mayores o gastando, sin permiso, el dinero excedente sin permiso.","n":"556"},{"t":"p","h":"d. Haciendo inversiones non éticas para obtener más ganancias.","n":"556"},{"t":"p","h":"e. Los Organismos Mayores que no tienen en cuenta las necesidades de las otras partes de la Congregación, independientemente de su situación financiera.","n":"556"},{"t":"p","h":"Las comunidades y las Provincias deberían alentar a los miembros a dar testimonio de una vida de pobreza basada en el carisma congregacional, la vigilancia, la transparencia y la responsabilidad<sup class=\"fn\" data-u=\"c11\" data-n=\"140\">140<\/sup>. También hay trastornos psicológicos relacionados con el uso del dinero, como el gasto compulsivo, el juego patológico, la infidelidad económica y la generosidad irresponsable. Cuando tales trastornos se den de forma crónica en un misionero, se requerirá ayuda profesional. Cuando se produzcan conductas inapropiadas en el uso de fondos o una administración irresponsable de los bienes de la Congregación, se deben aplicar de inmediato las sanciones canónicas correspondientes.","n":"557","s":1},{"t":"h","l":4,"h":"<i>8.2.3. Conducta inapropiada relacionada con el voto de obediencia<\/i>"},{"t":"p","h":"A través de la profesión religiosa, el misionero le ha ofrecido a Dios la capacidad libre de organizar el curso de su vida y se ha comprometido a obedecer a sus superiores legítimos en asuntos relacionados con la vida de nuestro Instituto<sup class=\"fn\" data-u=\"c11\" data-n=\"141\">141<\/sup>. Sin embargo, la falta de madurez religiosa, los problemas psicológicos no resueltos en relación con las figuras de autoridad, el falso orgullo y las necesidades frustradas del propio ego pueden empujarlo a comportamientos arrogantes y agresivos hacia los superiores. Por otra parte, la falta de diálogo, la incapacidad de recibir críticas y comentarios, la venganza y la mentalidad autocrática en los superiores pueden llevarlos a abusar del poder y de la autoridad causando daño a los demás.","n":"558","s":1},{"t":"p","h":"Hay muchas situaciones en las que el misionero tiene que <i>aprender sufriendo a obedecer<\/i><sup class=\"fn\" data-u=\"c11\" data-n=\"142\">142<\/sup>, siguiendo el ejemplo de Cristo que abrazó la “insensatez” de la cruz<sup class=\"fn\" data-u=\"c11\" data-n=\"143\">143<\/sup>, cuando la decisión de un superior no tiene sentido para él<sup class=\"fn\" data-u=\"c11\" data-n=\"144\">144<\/sup>. El sentido de obediencia a Dios y por Dios “da fuerza para echar las redes basados en su palabra”<sup class=\"fn\" data-u=\"c11\" data-n=\"145\">145<\/sup> y no solo en motivaciones exclusivamente humanas”<sup class=\"fn\" data-u=\"c11\" data-n=\"146\">146<\/sup>. La obediencia se convierte en una experiencia liberadora cuando se ve reforzada por las capacidades de escucha, diálogo, comunicación compasiva y las virtudes que Claret recomendó a sus misioneros, especialmente la humildad, la mansedumbre y la mortificación<sup class=\"fn\" data-u=\"c11\" data-n=\"147\">147<\/sup>.","n":"559","s":1},{"t":"p","h":"La conducta inapropiada relacionada con el voto de obediencia ocurre cuando un misionero:","n":"560","s":1},{"t":"p","h":"a. No se coloca a sí mismo, su tiempo y recursos libremente y con alegría al servicio de la Congregación y la Iglesia, y vive solo para sí mismo.","n":"560"},{"t":"p","h":"b. Se niega a aceptar destinos y no está abierto a ser enviado en misión por superiores legítimos.","n":"560"},{"t":"p","h":"c. Acepta responsabilidades y cargos en la sociedad civil sin consultar u obtener la aprobación de los superiores.","n":"560"},{"t":"p","h":"d. Realiza estudios especializados o apostolados por su cuenta sin el debido permiso.","n":"560"},{"t":"p","h":"e. Se permite desobedecer al superior cuando está en desacuerdo con él o porque no le gusta su estilo de funcionamiento.","n":"560"},{"t":"p","h":"f. Está ausente de la comunidad sin razones de peso y sin la aprobación de los superiores.","n":"560"},{"t":"p","h":"g. Vive una vida muy independiente sin tener en cuenta el trabajo en equipo o la vida fraterna en comunidad. Acepta ministerios sin considerar el proyecto comunitario y sin consultar con el superior.","n":"560"},{"t":"p","h":"h. No ejerce la responsabilidad como superior para confrontar a un hermano cuyo comportamiento hiere o daña a otros.","n":"560"},{"t":"p","h":"i. Actúa de manera autocrática en el papel de superior en asuntos importantes sin ningún proceso de discernimiento de la comunidad (en reuniones de consejo y plenarias).","n":"560"},{"t":"p","h":"En los casos de mala conducta reiterada y grave de un misionero en relación con el voto de obediencia, los hermanos y superiores deben estar alerta a las señales de su deterioro espiritual y psicológico y buscar medidas adecuadas para evitar daños a los demás y a la persona misma. El silencio y la complicidad de los hermanos solo sirven para empeorar la situación. En caso de cualquier comportamiento criminal o mala conducta con implicaciones legales, se deben seguir estrictamente las normas civiles y eclesiásticas.","n":"561","s":1}],"notes":{"1":"Cf. VC 69; CC 56.","2":"Cf. PI 68; 2F 27.","3":"Cf. PDV 70-71; VNON 16, 35a.","4":"VC 69.","5":"Cf. CIC 661; CF, pp. 10-13.","6":"CC 5.","7":"SP 22.","8":"Cf. PI 66, 68; CPR 67.","9":"Cf. CPR 77-78, 83; MS 60.","10":"Cf. Dir 148; 1F 143-144; 2F 27-29.","11":"Cf. CPR 49.","12":"Cf. VC 69-70.","13":"Cf. 2F 27; PI 67.","14":"Cf. CPR 49.","15":"Cf. CDC 1.","16":"Cf. PI 67.","17":"PI 67.","18":"Cf. CPR 54; SP 14.","19":"Cf. Aut 113-120.","20":"Aut 687; cf. Lc 4,18.","21":"Cf. CPR 30, 70; SP 22.","22":"Cf. CC 51; CPR 49-50, 67.","23":"Cf. Oración Colecta del III Domingo de Pascua.","24":"Cf. MR 11; PI 67.","25":"Cf. MCH 134, 137; CPR 46, 72; EMP 51-52.","26":"Cf. MCH 147-151.","27":"Cf. MCH 148.","28":"Cf. CC 56.","29":"PDV 70.","30":"Cf. MCH 137; CPR 28.","31":"MCH 201; cf. HAC 1-2.","32":"Cf. SP 4; EMP 57.","33":"CCTT, p. 582.","34":"Cf. Clotet, J., <i>Notas para los Anales de la Congregación<\/i> AG:CMF: GC 11.4.","35":"Cf. CC 56; Dir 144.","36":"EMP 34.","37":"Cf. 2F 26-30; CPR 27-31; SP 22;HAC 44-46.","38":"Cf. CPR 49.","39":"Cf. 2F 27; CPR 65.","40":"Cf. CPR 67.","41":"Cf. CPR 68; SP 13.1, 14.1, 16.1, 22, 22.1; MS 20.","42":"Cf. CPR 29, 70.","43":"Cf. Dir 147.2c; CPR 30, 71; SP 13.1; HAC 55.8.","44":"Cf. CPR 68, 69.","45":"CPR 67; cf. MS 75.8.","46":"Cf. CPR 49, 60; HAC 56.","47":"Cf. CIC 661; CC 104.4; PI 66.","48":"Cf. MR 26; PI 66, 71; CPR 67.","49":"Cf. SP 22.1.","50":"Cf. PI 71; 2F 30.","51":"Cf. PGF, cap. 6.","52":"Cf. PI 66; CPR 69.","53":"Cf. SP 13.1, 14.1, 15.1.","54":"SP 16.1; cf. PQTV 12-13.","55":"Cf. CC 34, 37; SP 14.1, 15.1, 15.2, 16.1, 16.2; Discurso del Papa al XXI Capítulo General: <i>Annales<\/i> 60 (1991), 139-140; HAC 59; MS 42-45.","56":"Cf. VC 95; CC 35: Dir 84-85.","57":"CPR 67; SP 13.3; HAC 55.","58":"Cf. CC 54; Dir 142; CPR 56; SP 13.3; PI 63, 71.","59":"Cf. CPR 61.","60":"Cf. CC 56; Dir 145.","61":"Cf. Dir 147-149.","62":"El día anual del Organismo Mayor hace referencia al día elegido por el mismo (día patronal o un día especial claretiano) para celebrar la fraterna comunión de diferentes maneras como convivencias, aniversarios, celebraciones litúrgicas, etc.","63":"Cf. Dir 255; Her 33.","64":"Cf. Dir 149.","65":"Cf. Dir 149; CPR 69; SP 22.1; MS 74.1-7.","66":"Cf. Dir 245.","67":"Cf. CIC 819.","68":"Cf. Dir 247.","69":"Cf. Dir 236.","70":"Cf. RFIS 79-82.","71":"Cf. CPR 68.","72":"Cf. PI 70; RFIS 80-87.","73":"Cf. VC 70; CIC 279; PI 70; SP 22.2; EMP 35.","74":"Cf. VC 70.","75":"Cf. PDV 76.","76":"Cf. SP 22.1; HAC 55.7.","77":"Cf. PI 68.","78":"Cf. CPR 56.","79":"Cf. OSG 252ff.","80":"Cf. SP 22.2; IPM 35.","81":"Cf. CIC 279.","82":"Cf. 1F 143-144.","83":"Cf. VC 70.","84":"Cf. PI 70; PDV 77.","85":"VC 70.","86":"Ibid.","87":"Cf. HAC 55.5.","88":"Hay variaciones en la edad de jubilación según el país y la profesión. Las profesiones seculares en muchos países suelen conocer la edad de jubilación a los 65 años. En el contexto eclesial, la edad de jubilación para la enseñanza es de 70 años y para los párrocos 75 (Can 538 §3). El término tercera edad se aplica aquí al grupo de edad que va de los 65 a los 85 años, en el que las personas siguen activas y pueden contribuir positivamente a la misión de la Congregación.","89":"Cf. PDV 77; SP 12.2.","90":"Cf. Gén 11,10-32.","91":"Francisco, <i>Discurso a los participantes en el Congreso Internacional ‘La riqueza de los  años’<\/i>, 31 de enero de 2020.","92":"A continuación se mencionan algunos ejemplos. Se puede consultar el<i> Año Claretiano<\/i> en las fechas que se indican entre paréntesis: Alcides Fernández (18 de enero); Joan Sidera (16 de febrero); Ramón Genover (20 de febrero); Joaquín Bestué (17 de marzo); Franz Dirnberger (12 de abril); Luis Ignacio Andrade (30 de diciembre).","93":"Cf. EG 108; CV 193, 201.","94":"Cf. VC 70; CC 45.","95":"Cf. Dir 51.","96":"La cuarta edad se define mejor por el declive funcional, que requiere asistencia externa para cuidar del funcionamiento normal de la persona, aunque cronológicamente la cuarta edad se considera generalmente como más de 85 años. Sin embargo, los factores culturales, sociales y económicos tienen un gran impacto en la longevidad.","97":"Jn 13,1.","98":"Cf. VC 70.","99":"Ibid.","100":"Cf. Dir 52.","101":"EV 2.","102":"EV 2.","103":"Cf. CC 19.","104":"Cf. CC. 53.","105":"El Papa Francisco señala las tentaciones de \"mayor individualismo, una crisis de identidad y un enfriamiento del fervor\" en los trabajadores pastorales. También alude al relativismo práctico, el egoísmo y la pereza espiritual, el pesimismo estéril, la mundanalidad espiritual, el clericalismo y la crisis de la comunidad que debilitan la vitalidad de los trabajadores pastorales. (Cf. EG 78-109).","106":"Cf. Lc 24,13-35.","107":"Cf. AL 232-240. El Papa habla de la crisis de la familia que es relevante también para la vida consagrada.","108":"Cf. Mt 7,26.","109":"Es la sexta etapa del desarrollo psicosocial de Erik Erikson. En la vida religiosa es un período de consolidación de una sólida espiritualidad de la vida consagrada centrada en la persona de Cristo.","110":"Este período marca la séptima etapa del desarrollo psicosocial, que abarca desde los 40 hasta mediados de los 60.","111":"SAO 13g.","112":"Cf. RFIS 96.","113":"Cf. Francisco,<i> Carta a los Sacerdotes en el 160 aniversario de la muerte de Cura de Ars<\/i>, 4 de agosto de 2019.","114":"Ibid.","115":"El Gobierno General aprobó el documento \"<i>Vademécum de los misioneros claretianos.  Manual para la Protección de Menores y Adultos Vulnerables y Protocolo para la Prevención  e Intervención ante un Delito de Abuso Sexual<\/i>\" el 25 de noviembre de 2019 que entró en vigor el 1 de enero de 2020.","116":"Cf. Matthew Vattamattam, <i>En salida por el camino del Fundador,<\/i> (marzo de 2019).","117":"Cf. CC 37.","118":"Cf. CC 52.","119":"Cf. CC 38.","120":"Cf. CC 54.","121":"Cf. CC 55.","122":"Cf. CC 22, 57.","123":"Un <i>menor<\/i> es cualquier persona con una edad inferior a dieciocho años o legalmente equiparada a ella. Cf. VELM §2a; Can. 97§1.","124":"Una <i>persona vulnerable<\/i> es cualquier persona en estado de enfermedad, de deficiencia física o psicológica, o de privación de la libertad personal que, de hecho, limite incluso ocasionalmente su capacidad de entender o de querer o, en cualquier caso, de resistir a la ofensa. Cf. VELM§2b.","125":"Cf. Francisco, <i>Discurso de clausura de la cumbre sobre la protección de los menores en  la Iglesia<\/i>, (24 de febrero de 2019).","126":"Ibid.","127":"Cf. RFIS 202.","128":"Cf. Francisco, <i>Carta a los sacerdotes con motivo del 160 aniversario de la muerte de  Cure de Ars<\/i>, (4 de agosto de 2019).","129":"Cf. Francisco, <i>Carta a los sacerdotes con motivo del 160 aniversario de la muerte de  Cure de Ars<\/i>, (4 de agosto de 2019).","130":"Cf. Catecismo de la Iglesia Catolica, 1700.","131":"Pontificio Consejo para la Familia, <i>Sexualidad Humana: Verdad y Significado,  Orientaciones educativas en familia<\/i>, no. 104 (8 de diciembre de 1995).","132":"Cf. Congregación para la Educación Católica, <i>Instrucción sobre los criterios de  discernimiento vocacional en relación con las personas de tendencias homosexuales antes  de su admisión al seminario y a las Órdenes sagradas<\/i>, no. 2 (4 de noviembre de 2005); RFIS, 199.","133":"La “cultura gay” indica los valores e intereses compartidos por un grupo de personas basados en su identidad homosexual.","134":"Dir 518.","135":"Dir 520.","136":"Cf. MI 21.","137":"Dir 542.","138":"Cf. MS 49; EG 80.","139":"Cf. Dir 519.","140":"Cf. CIVCSVA, Carta Circular <i>Líneas orientativas para la gestión de los bienes en los  Institutos de vida consagrada y en las Sociedades de vida apostólica<\/i> (2 de agosto de 2014); <i>Economía al servicio del carisma y de la misión, <\/i>no. 2-4 (12 de diciembre de 2017).","141":"CC 28.","142":"Heb 5,8.","143":"Cf. 1 Cor 3,18-19.","144":"Cf. SOA 10.","145":"Cf. Lc 5,5.","146":"Cf. SOA 11.","147":"Aut 340, 372, 390."}},{"id":"concl","title":"Conclusión","short":"Conclusión","kind":"main","pages":[299,300],"blocks":[{"t":"p","h":"La formación claretiana es un proceso que dura toda la vida y que tiene como objeto la configuración con la persona de Cristo, el misionero del Padre, mediante el cual los misioneros ven el mundo a través de los ojos y el corazón de Dios. El amor de Dios por la humanidad es el origen de la misión de Cristo que compartimos en virtud de nuestro bautismo y para la cual hemos sido agraciados para dedicar nuestras vidas totalmente a través de nuestra consagración religiosa. Todos los procesos, métodos y programas formativos están al servicio de este objetivo: crecer en Cristo y compartir su misión.","n":"562","s":1},{"t":"p","h":"El desarrollo de la vocación misionera de Claret al servicio de la misión de Cristo a través de las vicisitudes de su vida, y que culminó en su muerte en el exilio, es para nosotros un modelo de formación misionera. Vemos cuán bellamente brota la semilla de la vocación misionera, crece y transforma la vida entera de una persona que coopera y sirve a esta misión por la acción del Espíritu. Claret se vio a sí mismo formado en la fragua del Corazón de María, como una flecha para ser lanzada en misión<sup>1<\/sup><sup>48<\/sup>. Cada misionero encuentra su propio lugar especial en el Corazón de María. En él se forja a semejanza de su hijo de una manera única porque una madre conoce a cada uno de sus hijos de manera personal.","n":"563","s":1},{"t":"p","h":"El sufrimiento y la persecución aceleraron el proceso de configuración con Cristo de nuestros mártires claretianos, la mayoría de los cuales eran muy jóvenes. Ninguno de ellos renunció a Cristo para prolongar su vida terrenal. Los mártires aprendieron de la vida de nuestro Fundador cómo permanecer fieles en tiempos de pruebas y dar testimonio de la verdad del Evangelio hasta el final. El Plan General de Formación pretende encarnar este proceso de crecimiento en la configuración con Cristo hasta ser capaces de dar la vida por Cristo y por su Evangelio.","n":"564","s":1},{"t":"p","h":"La continuidad y adaptación de la formación claretiana a los tiempos cambiantes es vital para la Congregación porque el protagonista de la vocación, formación y misión claretianas es el mismo Espíritu Santo que animó a Claret en su tiempo. Ahora les corresponde a los misioneros de hoy ponerse a disposición de la acción del Espíritu Santo y cumplir nuestra misión en la Iglesia como hijos del Corazón de María.","n":"565","s":1}],"notes":{"148":"Cf. Aut 270."}},{"id":"ap1","title":"Documentos del Magisterio y de la Congregación sobre la formación","short":"Apéndice 1","kind":"app","pages":[301,317],"blocks":[{"t":"p","h":"1965: Decreto <i>Optatam Totius<\/i> sobre la formación sacerdotal (28 de octubre)."},{"t":"p","h":"1965: Decreto <i>Perfectae Caritatis<\/i> sobre la renovación de la vida religiosa (28 de octubre)."},{"t":"p","h":"1965: Decreto <i>Christus Dominus<\/i> sobre el oficio pastoral de los obispos en la Iglesia (28 de octubre)."},{"t":"p","h":"1965: Decreto <i>Presbyterorum Ordinis<\/i> sobre el ministerio y la vida de los presbíteros (7 de diciembre)."},{"t":"p","h":"1965: Decreto <i>Ad Gentes<\/i> sobre la actividad misionera de la Iglesia (7 de diciembre)."},{"t":"h","l":3,"h":"1.2. Documentos posconciliares"},{"t":"p","h":"1966: PABLO VI, Motu Proprio <i>Ecclesiae sanctae<\/i> sobre la aplicación del decreto *Perfectae caritatis+ (6 de agosto): AAS 58 (1966) 757-787."},{"t":"p","h":"1967: PABLO VI, Motu Proprio <i>Sacrum diaconatus ordinem<\/i> (normas generales para la restauración del diaconado permanente en la Iglesia latina) (18 de junio): AAS 59 (1967) 697-704."},{"t":"p","h":"1967: PABLO VI, Encíclica <i>Sacerdotalis coelibatus<\/i> sobre el celibato sacerdotal (24 de junio): AAS 59 (1967) 657-697."},{"t":"p","h":"1968: CONGREGACIÓN PARA LA EDUCACIÓN CATÓLICA, Nota <i>Les petits seminaires<\/i> sobre l
