<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturas de Adviento y Navidad</title>
    <style>
        :root {
            --font-size: 18px;
            --bg-color: #f8f9fa;
            --text-color: #2c3e50;
            --sidebar-bg: #ffffff;
            --sidebar-text: #34495e;
            --accent-color: #5e35b1; /* Color morado adviento */
            --border-color: #e0e0e0;
            --hover-bg: rgba(94, 53, 177, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --sidebar-bg: #1e1e1e;
            --sidebar-text: #b0b0b0;
            --accent-color: #9575cd;
            --border-color: #333333;
            --hover-bg: rgba(149, 117, 205, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size);
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Menú Lateral */
        #sidebar {
            width: 330px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: absolute;
            z-index: 10;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        #sidebar.open {
            transform: translateX(0);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--sidebar-bg);
            z-index: 3;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            font-family: sans-serif;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #searchInput {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
        }

        #menuList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding-bottom: 20px;
        }

        /* Nuevos Estilos para la Jerarquía del Menú */
        .menu-season h3 {
            padding: 15px 20px 8px;
            font-size: 0.85rem;
            font-family: sans-serif;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background-color: var(--sidebar-bg);
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 2px solid var(--border-color);
            margin-top: 10px;
        }

        .menu-season:first-child h3 {
            margin-top: 0;
        }

        .menu-week h4 {
            padding: 12px 20px 5px 20px;
            font-size: 0.8rem;
            font-family: sans-serif;
            color: var(--sidebar-text);
            font-style: italic;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--sidebar-bg);
            position: sticky;
            top: 43px; /* Justo debajo del encabezado de temporada */
            z-index: 1;
        }

        #menuList li a {
            display: block;
            padding: 12px 20px 12px 30px; /* Sangría para los días */
            text-decoration: none;
            color: var(--sidebar-text);
            font-family: sans-serif;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }

        #menuList li a:hover, #menuList li a.active {
            background-color: var(--hover-bg);
            border-left-color: var(--accent-color);
            color: var(--accent-color);
        }

        #menuList li a small {
            display: block;
            color: #888;
            margin-top: 4px;
            font-size: 0.8rem;
        }

        /* Área Principal */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            font-family: sans-serif;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        button.secondary:hover {
            background-color: var(--border-color);
        }

        #reading-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            scroll-behavior: smooth;
        }

        .reading-wrapper {
            max-width: 750px;
            margin: 0 auto;
        }

        .week-title {
            font-family: sans-serif;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--text-color);
            line-height: 1.2;
        }

        .biblical-verse {
            font-style: italic;
            color: var(--accent-color);
            margin-bottom: 30px;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .reading-text p {
            margin-bottom: 1.2em;
            text-align: justify;
        }

        .reading-text strong {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Controles Inferiores */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: var(--sidebar-bg);
            border-top: 1px solid var(--border-color);
        }

        .menu-toggle {
            display: block;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
            padding: 0 10px;
        }

        @media (min-width: 768px) {
            #sidebar {
                position: relative;
                transform: translateX(0);
            }
            .menu-toggle {
                display: none;
            }
        }

        /* Overlay para móvil */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 5;
        }
        #overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>Adviento y Navidad</h2>
            <input type="text" id="searchInput" placeholder="Buscar por día o cita..." onkeyup="filterMenu()">
        </div>
        <ul id="menuList">
            <!-- Se genera dinámicamente con JS con la nueva jerarquía -->
        </ul>
    </aside>

    <main id="main-content">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
                <button class="secondary" onclick="goToToday()">📅 Ir a Hoy</button>
            </div>
            <div class="header-controls">
                <button class="secondary" onclick="changeFontSize(-1)" title="Disminuir letra">A-</button>
                <button class="secondary" onclick="changeFontSize(1)" title="Aumentar letra">A+</button>
                <button class="secondary" onclick="toggleTheme()" title="Cambiar tema">🌓</button>
            </div>
        </header>

        <div id="reading-container">
            <div class="reading-wrapper" id="reading-wrapper">
                <!-- El contenido se carga aquí -->
            </div>
        </div>

        <div class="bottom-nav">
            <button class="secondary" onclick="navigate(-1)">← Anterior</button>
            <button class="secondary" onclick="navigate(1)">Siguiente →</button>
        </div>
    </main>

    <script>
        // BASE DE DATOS COMPLETA CON TODAS LAS LECTURAS DEL PDF
        // (Mantenemos la misma estructura de datos, el script se encarga de agruparlos)
        const readingsData = [
            { dateStr: "", week: "Primera semana de Adviento", title: "LUNES", verse: "Isaías 4, 2-6", content: `<p>Durante las dos primeras semanas de Adviento, la Iglesia nos proporciona la meditación de «los profetas de Isaías». Isaías es uno de los grandes testigos de la espera mesiánica. Vivió ocho siglos antes de Jesús. Habitaba Jerusalén, la capital del país. Ha visto derrumbarse el Reino del Norte, Samaria, bajo los golpes de los Asirios, y siente venir la misma amenaza para el Reino del Sur. Es pues en el contexto histórico de una catástrofe inminente cuando el profeta anuncia la esperanza de un Mesías que aportará la paz.</p><p><strong>Aquel día, el «germen» que el Señor hará crecer será el honor y la gloria de los «supervivientes» de Israel. Y el «fruto de la tierra» será su honra y su corona.</strong></p><p>El Mesías es presentado como un «germen»: una potencia de vida, el comienzo de un proceso vital que se desarrollará... Una «pequeña semilla», dirá Jesús, que llegará a ser un gran árbol! El Mesías es pues, a la vez, Jesús y la Iglesia; Jesús y la vida que sale de Jesús; Jesús como germen de todo lo que ha nacido de El. Gracias, Señor. ¡Mi vida viene de ti!</p><p>El Mesías es también presentado como «un fruto de la tierra», no es un «cuerpo extraño» caído del cielo... es más bien el fruto de una lenta y larga germinación. Todo un pueblo lo ha preparado y esperado. Una mujer, una madre sobre todo lo ha preparado y esperado. Y desde ese primer día de Adviento, contemplamos esa preparación en el corazón y el corazón de María. ¿Qué voy a hacer, a mi vez, para preparar la venida de Cristo?</p><p><strong>Entonces, a los «restantes» de Sión, a los «supervivientes» de Jerusalén, se les llamará santos.</strong></p>` },
            { dateStr: "", week: "Primera semana de Adviento", title: "MARTES", verse: "Isaías 11, 1-10", content: `<p>Los pobres, los débiles son sus preferidos. ¿Y yo? ¿ayudo, defiendo a los pobres?</p><p><strong>Una rama saldrá del tronco de Jesé —el padre de David—. Un retoño brotará de sus raíces.</strong></p><p>Imagen tradicional en Israel en que, refiriéndose a la felicidad, se habla de un árbol floreciente... refiriéndose a la desgracia, se habla de un árbol seco reducido al tronco... De ese tronco casi muerto sale una pequeña yema, un brotecillo endeble, una ramita frágil.</p><p>El Mesías futuro, como «resto de Israel» escapado de la prueba, ha de surgir de la pobreza y del sufrimiento. Jesús será perseguido desde su nacimiento y morirá mártir.</p><p>También la Iglesia vive constantemente en la prueba. ¿Creo yo en el poder de Dios, capaz de hacer surgir la vida desde lo profundo de las situaciones más desesperadas? ¿Cómo es mi esperanza?</p><p>Imágenes simbólicas: Los animales salvajes «conviven» con los animales domésticos... El lobo y el cordero serán vecinos... El niño meterá la mano en la hurra de la víbora...</p><p>En esta profecía, Isaías anuncia para el «fin de los tiempos», un retorno al paraíso primitivo: así vivía Adán en paz en medio de los animales. Lo que se nos promete es pues una «nueva creación», donde no habrá fuerzas hostiles al hombre... donde el hombre no sentirá temor... donde los instintos agresivos estarán dominados... donde los seres todos podrán convivir en paz unos con los otros. Ayúdanos, Señor, a convivir en paz.</p><p>La Biblia nos habla a menudo de la Paz. El Mesías es un «príncipe de la Paz». Esta es una aspiración universal de la humanidad. ¿Qué puedo hacer en este sentido?</p><p><strong>Reposará sobre él el Espíritu Santo del Señor: Espíritu de sabiduría y de inteligencia, Espíritu de consejo y de fortaleza, Espíritu de ciencia y de temor del Señor.</strong></p><p>El Mesías que ha de venir es anunciado como «lleno del Espíritu». Dios viene y «reposa» sobre ese hombre. Jesús hace suya esa profecía, aplicándola a sí mismo, en la sinagoga de Nazaret (Lucas 4, 18). «El Espíritu de Dios reposa sobre mí...»</p><p>«Sabiduría», «inteligencia», «fuerza», «ciencia de Dios»... Me imagino y contemplo esas cualidades en Jesús. ¿Y nosotros... los que tenemos que ser prolongación de Cristo? ¿Es éste nuestro espíritu? ¿Qué voy a hacer, hoy, para dejarme conducir por el Espíritu?</p><p><strong>No juzgará por las apariencias... Juzgará con justicia a los débiles, y dictará sentencia con rectitud a los pobres del país...</strong></p><p>Nosotros, los hombres, nos dejamos impresionar fácilmente por las «apariencias». El, el Mesías, juzgará según la verdad y el corazón del hombre.</p><p><strong>Nadie hará mal en toda mi montaña santa... Porque el conocimiento del Señor llenará la tierra, como las aguas llenan el fondo del mar.</strong></p><p>¡Oh, qué necesario es a la humanidad ese sueño y esa promesa! ¡Una humanidad que ya no obra el mal, que ya no es opresora ni despreciadora de nadie!</p><p>La fuente de esa «paz mesiánica» es el «conocimiento de Dios». La «paz-entre-ellos» proviene de tener todos la mirada puesta en el mismo Dios. Dios, factor de unidad. El Padre, fuente de amor entre hermanos. Ciertamente la Iglesia puede ser la suerte de la humanidad. No deja de tener importancia que hombres de todos los países se nutran de la misma Palabra, y comulguen en el mismo ideal, y constituyan un mismo Cuerpo.</p><p>Te ruego, Señor, que esta profecía se realice y que yo contribuya a realizarla en la parte que de mí dependa.</p>` },
            { dateStr: "", week: "Primera semana de Adviento", title: "MIÉRCOLES", verse: "Isaías 25, 6-10", content: `<p><strong>Aquel día, el Señor, Dios del universo, preparará, sobre su montaña, un banquete de manjares muy condimentados y de vinos embriagadores, un banquete de platos suculentos y de vinos depurados...</strong></p><p>En las costumbres orientales y bíblicas el banquete forma parte del ritual de entronización de los reyes. Con frecuencia la magnificencia en el aderezo de la mesa, la calidad de los manjares y de los vinos eran el signo del poder de un rey, y muy particularmente eran el modo de celebrar una victoria.</p><p>También nosotros festejamos nuestras alegrías en familia con una comida más exquisita.</p><p>Para anunciar los tiempos mesiánicos, Dios anuncia que será el anfitrión de su propia mesa. Jesús hizo de la comida el signo de su gracia.</p><p>¿Me doy cuenta de que en la eucaristía Dios me recibe en su propia mesa? ¿Es una comida gozosa, una fiesta? ¿Tengo algo a conmemorar o a celebrar cuando voy a misa? ¿Valoro la acción de gracias?</p><p><strong>Para todos los pueblos... sobre toda la faz de la tierra...</strong></p><p>Ese universalismo, es sorprendente para aquella época. Un Mesías no reservado exclusivamente al pueblo de Israel. Un Mesías cuyos beneficios se extenderán sobre toda la humanidad: promesa divina...</p><p>¡Señor, ensancha nuestros corazones hasta la dimensión del mundo entero! ¿Es para mí un sufrimiento pensar que todavía HOY son muchos los hombres que ignoran esa buena nueva?</p><p><strong>Apartará de los rostros el velo que cubría todos los pueblos y el sudario que envolvía las naciones. Destruirá la muerte para siempre.</strong></p><p>Efectivamente, Dios celebra una victoria al invitarnos a ese festín gozoso. En la victoria sobre la «muerte». El enemigo. La muerte es la gran obsesión de la humanidad, el gran fracaso, el gran absurdo, el símbolo de la fragilidad y del sufrimiento. Es también la gran objeción que hacen los hombres a Dios: si Dios existe, ¿por qué hay ese mal? Debemos escuchar la pregunta y también la respuesta de Dios. Hay que darle tiempo, saber esperar su respuesta.</p><p>«El Señor quitará el sudario que envolvía los pueblos». ¡Tal es su promesa, su palabra de honor! «El Señor destruirá la muerte para siempre.» Tal es la buena nueva de Jesucristo. Comenzada en Jesucristo y celebrada en cada misa.</p><p>Cada eucaristía, ¿es para mí una comida de victoria sobre la muerte? Proclamamos tu muerte, Señor, celebramos tu resurrección.</p><p><strong>El Señor enjugará las lágrimas de todos los rostros. ¡Lo ha prometido!</strong></p><p>¡Admirable imagen! Dios... enjugará... las lágrimas... de los rostros de todos los hombres! ¡Señor, cuán reconfortante será ese día! Lo espero en la Fe y, en la espera de ese día procuraré consolar algunas lágrimas del rostro de mis hermanos.</p><p><strong>Se dirá aquel día: ¡Ahí tenéis a nuestro Dios, en El esperábamos y nos ha salvado... exultemos, alegrémonos, porque nos ha salvado!</strong></p><p>La muerte no es el final del hombre, no es su fin. El fin es la exultación, la alegría, la salvación. Esto es lo que Dios quiere, lo que Dios nos ha preparado.</p>` },
            { dateStr: "", week: "Primera semana de Adviento", title: "JUEVES", verse: "Isaías 25, 1-6", content: `<p>El tema de la lucha entre las dos ciudades, Babilonia y Jerusalén, símbolo de la lucha entre el mal y el bien, es constante en la Biblia (Apocalipsis 18,21).</p><p><strong>Aquel día se entonará este cantar en el país de Judá: «¡Ciudad fuerte tenemos!».</strong></p><p>Ciertamente no se trata de Jerusalén ni de Babilonia consideradas como capitales geográficas. Jesús podrá anunciar incluso la destrucción de Jerusalén. De hecho, esa profecía de Isaías anuncia «la comunidad espiritual», la Iglesia, Ciudad fuerte. Con ello responde a la necesidad profunda de seguridad que habita en todos los hombres.</p><p>¿Es la Iglesia mi seguridad? ¿De qué modo me apoyo en ella? O bien... ¿me apoyo en mis propias fuerzas, en mis propios juicios? criticando a la Iglesia...</p><p><strong>Para protegernos, el Señor le ha puesto murallas y antemuro...</strong></p><p>Hermosa imagen. Doble defensa. Y es Dios quien edifica la muralla. No olvidemos que en aquella época todos los habitantes de Jerusalén -y el mismo Isaías- cada semana tenían noticias alarmantes de la caída de tal o cual ciudad, en el reino del Norte, distante unos cincuenta kilómetros. Considero, también mis propias fragilidades. Y te pido, Señor, que seas mi muralla, la muralla de los míos y de todos los hombres. ¡Protégenos del mal!</p><p><strong>¡Abrid las puertas! Y entrará la nación justa, la que guarda fidelidad.</strong></p><p>No solamente los ciudadanos de Jerusalén. Isaías pide a sus conciudadanos que abran su mentalidad, porque la ciudadanía de esta ciudad la crean la «justicia» y la «fidelidad» y no el hecho de pertenecer a una raza o a un país. La puerta está abierta a todos los pueblos, a todos los hombres justos y fieles. En el evangelio resuena esta apertura. ¿Y yo?</p><p><strong>Tú construyes «la paz» sólidamente, Señor.</strong></p><p>Los hombres de HOY, más aún que los de épocas precedentes, saben que la guerra es destrucción, desgracia, muerte. Saben también que la paz no es propiedad particular, sino que su suerte se juega en el plan internacional pues toda guerra, incluso local, repercute en el resto de la humanidad.</p><p>Las enseñanzas del Papa insisten sobre ese tema frecuentemente: ¿cómo es posible tanta indiferencia sobre este asunto? ¿que la masa de los hombres, aunque aspire a la paz, no se comprometa más decididamente en una acción conjunta en favor de la paz? Construir la paz, con Dios. ¡Cuán lejos estamos de ello, Señor! Y esto comienza ya a nivel de nuestras relaciones humanas. Construir la paz con los que viven conmigo.</p><p><strong>Poned vuestra confianza en el Señor, porque en El tenemos una Roca para siempre.</strong></p><p>La seguridad de las ciudades antiguas se debía, a menudo, a su situación; Jerusalén, por ejemplo, era considerada inexpugnable porque estaba admirablemente situada sobre un espolón rocoso, lugar muy estratégico para la defensa. Los profetas desarrollan el tema: Dios-roca.</p><p>La verdadera seguridad de una ciudad no procede de sus medios humanos de defensa, sino de su apoyo en Dios: ¡Dios es la roca verdadera! Imagen de la solidez de la piedra, que Jesús repetirá en el evangelio. «Edificar su casa sobre roca»... «Tú eres Pedro, tú eres Roca, y sobre esta piedra, sobre esta Roca, edificaré mi Iglesia.»</p><p><strong>El derroca a los que viven en las alturas y humilla la ciudadela inaccesible.</strong></p><p>Este es el tema complementario: la fragilidad de las seguridades humanas.</p>` },
            { dateStr: "", week: "Primera semana de Adviento", title: "VIERNES", verse: "Isaías 29, 17-24", content: `<p>Página profética, que expresa la espera de la humanidad. El Mesías ha venido. La era mesiánica ha comenzado y ¡ha llegado el tiempo anunciado por los profetas!</p><p>Y, no obstante, son todavía muchos los pobres que sufren y gimen, y ¡que están muy lejos de exultar!</p><p>«Soy de los que trabajan esforzadamente para que la miseria vaya desapareciendo? Porque habrá llegado el fin de los tiranos...</p><p><strong>Dentro de poco tiempo, muy poco, y el Líbano se convertirá en vergel</strong></p><p>Una «selva» que, de súbito, se convierte en «vergel». ¡Todos los árboles improductivos se ponen a dar frutos! Sí, en los tiempos mesiánicos, la naturaleza misma se asocia a la gran renovación de los corazones humanos. Promesa de felicidad total. Sentido de la creación que participa a los decaimientos y a los enderezamientos del hombre.</p><p><strong>Aquel día, los sordos oirán las palabras del libro y los ojos de los ciegos verán.</strong></p><p>El profeta-poeta ha escogido dos de las más dramáticas deficiencias humanas y simbólicamente nos anuncia la liberación de «todos» los achaques.</p><p>Me detengo a evocar en mi memoria los achaques y sufrimientos de aquéllos que conozco... No para aumentar mi visión pesimista del mundo, sino para sentir mejor la belleza y la originalidad de la buena nueva que se nos anuncia en ese día.</p><p>Señor, ayuda a todos los que sufren esperando «aquel día» que nos has prometido. ¡Que venga aquel día!</p><p>Un pueblo entero, alimentándose de esa Palabra, esperaba la era mesiánica. María debió «exultar» cuando vio a su hijo «abrir los ojos de los ciegos y los oídos de los sordos».</p><p>No olvidemos que esos oráculos de Isaías, en el texto hebreo, no están escritos en prosa, sino en verso: son «poemas» líricos.</p><p><strong>Los que se burlan de Dios, desaparecerán... Y serán exterminados todos los que desean el mal... En adelante, Jacob no se avergonzará.</strong></p><p>Ciertamente esto es lo que esperan los pobres de todas las épocas: no ser aplastados, ni explotados, ni despreciados. Ante todo reclaman su dignidad: «¡no sentirse avergonzados!»</p><p>«Presto atención a los más pobres que yo? ¿a los que, comparativamente, podrían avergonzarse ante mí? «Qué puedo hacer para ayudar a la promoción colectiva de los más desheredados? ¿para reducir las diferencias enormemente escandalosas entre las situaciones?</p><p>«Cuáles son mis compromisos al servicio de los demás? Igualmente me interrogo sobre mi plegaria al servicio de los demás.</p><p><strong>Los humildes volverán a alegrarse en el Señor y los pobres se regocijarán en Dios, el santo de Israel.</strong></p><p>Mensaje de esperanza para los humildes y los pobres. Estas son, por adelantado, las palabras mismas del Magnificat. María, toda ella, estaba como impregnada de esos pasajes de la Biblia, que ahora leemos diariamente. Ella había leído ese poema de Isaías, lo aprendió en la escuela de su pueblo; y a su vez, como madre lo enseñó a Jesús.</p>` },
            { dateStr: "", week: "Primera semana de Adviento", title: "SÁBADO", verse: "Isaías 30, 19-21; 23-26", content: `<p><strong>Pueblo de Sión, que habitas en Jerusalén, no llorarás ya más. Cuando clamarás, el Señor tendrá piedad de ti; oirá tu voz y te contestará.</strong></p><p>Los habitantes de Jerusalén ven acercarse a su puerta la amenaza asiria. Los ejércitos de la época arrasan las ciudades y matan a todos los habitantes, a excepción de los más fuertes que son deportados. Las palabras esperanzadoras de Isaías han de leerse en ese contexto dramático.</p><p><strong>Aquel día de muerte y devastación, cuando se derrumbarán todas las torres de defensa...</strong></p><p>Sí, es en medio de las violencias militares de una guerra feroz cuando Isaías evoca un «tiempo» en el que todo tipo de mal estará ausente. ¡Isaías es el profeta de la esperanza, de la más humana esperanza!</p><p><strong>En la tribulación el Señor te dará pan de asedio y agua de opresión. El dará lluvia a tu sementera, con que hayas sembrado el suelo y el pan que producirá la tierra será rico y sustancioso. Tus ganados pacerán aquel día en vastos pastizales. De tus montañas brotarán manantiales...</strong></p><p>Isaías evoca una felicidad paradisíaca, un futuro reino mesiánico del que todo mal habrá desaparecido: hambre... enfermedad... violencia... injusticia... Es el retorno del hombre a su equilibrio moral que traerá también consigo el retorno de la naturaleza a su armonía y a la fecundidad del «paraíso terrenal». La Biblia cree profundamente en una comunión entre el hombre y su entorno: el Señor resucitado, no solamente salva el alma, sino también la carne y la materia (Romanos, 8). La naturaleza entera espera su transfiguración. Por todo ello, en Adviento, el cristiano se siente también interpelado</p><p>—a una conversión espiritual que transforme su corazón...</p><p>—y a transformar la naturaleza con los avances de la técnica, el trabajo, el progreso...</p><p>¿Considero que éste es también mi trabajo? ¿Participo del gran proyecto de Dios: «¡Dominad la tierra y sometedla!» para la mayor felicidad de todos los hombres?</p><p><strong>¡No será ya ocultado el que te enseña, y tus ojos le verán!</strong></p><p>Ver a Dios. Comunicarse con Dios. ¡Un Dios «que ya no se oculta», que se «deja ver»! Esta es también una de las aspiraciones fundamentales del hombre. Dios escondido, invisible. Dios silencioso, Dios ausente, Dios lejano, Dios inaccesible. Efectivamente, ¡ésta es nuestra experiencia dolorosa!</p><p>Pues bien, para el «final de los tiempos», para «aquel día» ¡Dios anuncia que podremos llegar a El y verle!</p><p>Jesús, Dios que se toca, Dios que se ve, Dios que habla, Dios que no se esconde, Dios accesible, Dios cercano. «¡Ven, Señor Jesús!» «¡Estamos esperando tu retorno!»</p><p>Los sacramentos son signos «sensibles» de su presencia. Son una continuación de la Encarnación de Dios. La Iglesia es El sacramento, El signo de Jesucristo... en la espera de su retorno.</p><p>La felicidad soñada y evocada por Isaías existe con esta condición: ¡Creer que Dios sólo es capaz de construir la felicidad definitiva futura. Reconocerse suficientemente pobre para tener la convicción que el hombre, por sus propios medios, es incapaz de conseguir tal felicidad. Esforzarse en contemplar a Dios. ¿Qué son para mi los sacramentos? ¿Todos los sacramentos?</p><p><strong>«¡Este es el camino; síguelo!»</strong></p>` },
            { dateStr: "", week: "Segunda semana de Adviento", title: "LUNES", verse: "Isaías 35, 1-10", content: `<p>Durante esta segunda semana de Adviento, leeremos unos pasajes de la segunda parte del libro de Isaías. Su autor es otro escritor sagrado, profeta también, denominado «el segundo Isaías», y que sin duda fue discípulo del primero. Su época no es menos dramática de la que vivió su predecesor: efectivamente nos encontramos en pleno exilio... Jerusalén, como Samaria, ha sido destruida... el Templo profanado y arruinado por los ejércitos enemigos... y todos los judíos aptos para trabajar han sido deportados a Babilonia donde están condenados a duros trabajos forzados... y aquí, en ese contexto, el profeta medita, por adelantado, sobre el «retorno a la tierra santa». Esta segunda parte de Isaías se llamó a menudo «el libro de la consolación». Dirigiéndose a cautivos y a desgraciados es una vigorosa predicación de esperanza: ¡vendrá un tiempo de felicidad total, cuando Dios salvará a su pueblo! El autor es también poeta, sus versos están llenos de imágenes.</p><p><strong>¡Que el desierto y el sequedal se alegren, que la estepa exulte y florezca, que la cubran las flores de los campos!</strong></p><p>Acumulación de imágenes de alegría: el desierto florecerá. Dios lo promete a unos exiliados. En mi estado de pecador se me repite una promesa parecida... Gracias, Señor. En medio de un mundo difícil y duro, espero, Señor, ese día en que el desierto florecerá.</p><p><strong>Fortaleced las manos fatigadas, afianzad las rodillas vacilantes, decid a los que se azoran: «¡Animo, no temáis...!»</strong></p><p>Cumple tu promesa, Señor. ¡Danos firmeza, fortaleza, valentía! Te ruego, Señor, por todos los que están «desanimados» y te nombro a los que conozco en ese estado. Mirad que viene vuestro Dios... y os salvará. ¡Ven, Señor! En esta vida, donde esperamos tu advenimiento... «Esperamos tu venida...» Las nuevas plegarias eucarísticas nos han restituido ese aspecto importante de nuestra Fe, que fue tan viva en la Iglesia primitiva pero demasiado olvidado durante siglos.</p><p><strong>Entonces se abrirán los ojos de los ciegos, y los oídos de los sordos... Entonces saltará el cojo como ciervo y la boca del mudo lanzará gritos de alegría... Los cautivos rescatados llegarán a Jerusalén entre aclamaciones de júbilo... Una dicha sin fin iluminará sus rostros... Alegría y gozo les acompañarán, dolor y tristeza huirán para siempre...</strong></p><p>El evangelio nos repite que esas cosas se produjeron por la bendición de Jesús. Pero, Señor, realízalas más todavía. En este tiempo de Adviento y con todo el poder de mi deseo, te digo: «haz que salten los cojos... danos tu salvación... suprime el mal... como Tú has prometido».</p>` },
            { dateStr: "", week: "Segunda semana de Adviento", title: "MARTES", verse: "Isaías 40, 1-11", content: `<p><strong>Consolad, consolad a mi pueblo, dice vuestro Dios. Hablad al corazón de Jerusalén.</strong></p><p>Palabras de Dios, tan humanas, todas llenas de emoción. Se está preparando la Encarnación de Dios: «Navidad» se acerca... un Dios que viene a consolar, un Dios que «habla al corazón». Pero, ¿qué quiere decirnos Dios? ¿Qué tiene que decirnos tan importante y tan dulce?</p><p><strong>Proclamad que ya ha cumplido su servicio, que su culpa ya está perdonada, que Jerusalén, de la mano del Señor, ha recibido doble castigo por todas sus faltas...</strong></p><p>Sí, quiere hablarnos de la misericordia de su Corazón. Los deportados a Babilonia han terminado ahora su duro exilio, han pagado bastante caro su redención. Pronto serán liberados y volverán a su país. Dios está conmovido. Su corazón no quiere el castigo del pecador, sino sólo su arrepentimiento. Es como si hubiera castigado algo forzado. Los profetas siempre interpretaron el destierro a Babilonia como un castigo por los pecados del pueblo de Israel. Pero ahora todo está perdonado, nos encontramos ante la experiencia muy humana de un padre o de una madre que sufre por tener que hacer o permitir un daño a su hijo por su propio bien.</p><p>Contemplo en silencio los sentimientos de Dios... Contemplo la misericordia de Dios hacia mi... Dios ama a los pecadores. De tal modo amó Dios al mundo que le entregó a su Hijo unigénito, para que el mundo se salve. Dios detesta el pecado. Es preciso que el pecado sea destruido, expiado. Pero, una vez hecho esto, que enseguida el pecador recobre su alegría, su vida abierta y plena.</p><p><strong>Una voz clama: «Preparad en el desierto el camino del Señor... Trazad en la estepa una calzada recta para nuestro Dios. Que todo valle sea elevado y todo monte y cerro, rebajado».</strong></p><p>Los deportados a Babilonia habían sido obligados a duros trabajos de remoción de tierras -desmonte y terraplenado- para nivelar el terreno y construir la «vía sagrada» de Marduk, dios de Babilonia. Durante sus trabajos forzados, la voz del profeta les invita a esperar. Se está abriendo un «camino para Dios». ¡Dios viene! Juan Bautista repitió exactamente esta palabra. ¡Dios viene! HOY se me invita a «preparar» a «abrir» un camino para El... en las «tierras áridas» de la estepa... con grandes esfuerzos, ¡¡desplazando los montes» si es preciso! Todas esas imágenes son evocadoras. ¿Cuáles son mis «montañas», las más?</p><p><strong>Súbete a un alto monte, portador de la buena nueva para Sión. Clama con voz poderosa, mensajero de la buena nueva para Jerusalén. Di a las ciudades de Judá: «Ahí está nuestro Dios... ¡Ahí viene el Señor!».</strong></p><p>Evangelizar, dar la buena nueva, es decir: «Ahí está vuestro Dios, el Señor viene». Ahora bien, es preciso que ésta sea la fe del mensajero para poder proclamarla a los demás. Ejercitarme en ver «la venida» de Dios a través de los signos imperceptibles. Porque, no hay que hacerse ilusiones; no se verá esta «venida» de modo visible; no será esplendorosa -excepto al final de los tiempos-; y sin embargo, se desliza ya debajo de las apariencias. Dios «está viniendo». El verbo es usado en presente: viene... y no en futuro: vendrá.</p><p><strong>Como un pastor pastorea su rebaño, recoge en brazos sus corderos, los lleva junto a su pecho, y trata con cuidado a las que amamantan sus crías.</strong></p><p>Así hablas de mi... y de todos los hombres... Señor.</p>` },
            { dateStr: "", week: "Segunda semana de Adviento", title: "MIÉRCOLES", verse: "Isaías 40, 25-31", content: `<p><strong>«¿Con quién me compararéis? ¿Quién podría igualarme?», dice el Dios santo.</strong></p><p>Los exiliados podían dejarse impresionar por el despliegue de lujo deslumbrante del culto a los dioses de Babilonia. El profeta les recuerda que Yavé no es inferior a Marduk. HOY, el «poder del hombre» y sus realizaciones grandiosas podría deslumbrarnos o hacernos perder la cabeza.</p><p><strong>Alzad a lo alto los ojos y ved: ¿Quién ha creado todo esto? El que despliega el ejército celeste y llama cada estrella por su nombre.</strong></p><p>Si somos capaces de admirar el poder y la inteligencia del hombre, ¿porque seríamos ciegos ante la obra de Dios? Si se ha empleado tanta inteligencia y trabajo para enviar cosmonautas a la luna y naves espaciales tripuladas, ¿por qué no seríamos capaces de admirar la grandiosidad del cosmos con sus galaxias y billones de estrellas?</p><p><strong>Dios, desde siempre, es creador de los confines de la tierra... Su inteligencia es insondable.</strong></p><p>Las leyendas de Marduk celebraban con entusiasmo el triunfo del dios sobre el caos, sobre las fuerzas del mal. Me detengo a contemplar la «inteligencia» de Dios. En este momento billones de astros se están moviendo y girando en sus órbitas respectivas. La tierra gira en este momento y siempre. El sol se levanta en algún lugar, y suscita la vida. Y todo eso, ¿ya no nos maravillará?</p><p><strong>¿Por qué afirmas tú, Israel: «Mi camino está oculto para mi Dios; al Señor se le pasa mi derecho?».</strong></p><p>Desarrollando la «grandeza» de Dios, el profeta corre el riesgo de cortar los puentes entre Dios y su pueblo. Ante un Dios tan grande, los hombres aparecen entonces como hormigas. ¿De qué modo pues, sus pequeñas o grandes preocupaciones podrían interesar a un Dios tan grande y tan lejano? Isaías recoge ante todo esa pregunta, pregunta de todos los tiempos. ¿No la he formulado yo también alguna vez? ¿No tengo a menudo la impresión de que Dios no se ocupa de mi, ni del mundo; que se desentiende de muchas cosas?</p><p><strong>¿Es que no lo sabes? Dios da vigor al cansado y al que no tiene fuerzas, le acrecienta la energía.</strong></p><p>Este gran Dios, dice el profeta, tiene un hacer sorprendente: ¡tanto más se interesa por los seres, cuanto más pequeños y débiles son! Revelación de la paternidad de Dios, de la maternidad de Dios. ¿No sucede también así en una familia que el amor la lleva a cuidar más del «más débil»?</p><p><strong>Los jóvenes se cansan, se fatigan... Los atletas vacilan abatidos... Mientras que los que ponen su esperanza en el Señor, El les renueva el vigor y corren ya, sin cansarse.</strong></p><p>El Dios grande y trascendente, creador de los astros y del cosmos, es también el Dios-cercano, que comunica su fuerza a los que se abren a El... a «los que ponen en El su confianza». A los exiliados, llenos de lasitud, Isaías les revela una fuente de vigor. ¡Oh, Señor, cumple tu promesa, dame «nuevas fuerzas»! Devuelve, cada mañana, a la humanidad, a los más pobres, la ilusión y el vigor de existir; de emprender y de empezar de nuevo; así como la posibilidad de vencer siempre la desesperación.</p>` },
            { dateStr: "", week: "Segunda semana de Adviento", title: "JUEVES", verse: "Isaías 41, 13-20", content: `<p><strong>No temas, Yo te ayudo. No temas, Jacob, débil gusanillo; Israel, miserable mortal.</strong></p><p>Esta es ya una bienaventuranza: la de los pobres. Medito sobre la debilidad, la pequeñez. La pequeñez de ese pueblo de deportados, despreciados, explotados, perdidos en la gran Babilonia pagana. La pequeñez de María, portadora, sin embargo, del Misterio de Dios. María, «débil criatura» vivía en una pobre aldea, casi desconocida. ¡No en Roma, la triunfante... No en Atenas, la sabia... Ni en Babilonia, la soberbia... Ni siquiera en Jerusalén, la santa... Ni en ninguna de las grandes capitales de la época! Sino en Nazaret, poblado desconocido, en medio de gente humilde y sencilla.</p><p>El verdadero valor no procede de la situación humana, sino de la mirada de Dios. ¿Qué es lo que esto cuestiona mi vida?</p><p><strong>«Los pobres buscan...» Esa fórmula expresa la espera, el deseo. La imagen es la de «tener sed»... una necesidad biológica concreta, que no puede satisfacerse con hermosas palabras.</strong></p><p>«Dichosos los que tienen hambre y sed de justicia.» Pero, que el término bíblico no nos oculte el verdadero sentido. ¡No es «agua» lo que los pobres de HOY andan buscando! ¿Cuál es su deseo? Ser amados y considerados... ganar regularmente un salario justo... ir adquiriendo algo más de responsabilidad, de confort... ser como todo el mundo, no ser humillados... ser atendidos en las necesidades, con una visita oportuna... y que los sufrimientos y la mala suerte no sea algo normal en sus vidas...</p><p>Ante esos deseos tan humanos, ante esa «sed», debemos también, como Dios, testificar «y no hay nada» ¿Es una espera frustrada, un deseo inútil, la Nada?</p><p><strong>Yo, el Señor, los atenderé... No los abandonaré... Señor, realiza tu promesa.</strong></p><p>Señor, ayúdanos también a atender a los pobres en todo lo que esté de nuestra parte.</p><p><strong>Yo soy el Señor, tu Dios. Te tengo asido por la diestra.</strong></p><p>Es preciso saborear, en el silencio, esas declaraciones de amor... Basta con dejarse llevar por esa imagen: ¡Toma mi diestra, Señor! ¡Quédate de veras «conmigo»! Escucho... Escucho esas palabras que me diriges. ¿Qué podría dañarme, en mi pequeñez, si, de verdad, conservo tu mano en la mía?</p><p><strong>Abriré en los montes, ríos y fuentes... Convertiré el desierto en lagunas... Y la tierra árida en hontanar de aguas... Pondré en el desierto cedros, acacias, mitros, olivos, cipreses, pinos y enebros... De modo que todos vean y sepan que la mano del Señor ha hecho eso.</strong></p><p>Imágenes de lozanía, de fecundidad y de abundancia. En nuestro mundo tan «árido», tan duro... ¡haz que mane el «agua viva»!</p><p><strong>Triturarás los montes... Y tú te regocijarás en el Señor.</strong></p><p>Es una réplica contra los opresores babilonios. Es, ante todo, el anuncio de un gran gozo después de la pena. Los pequeños y los pobres buscan agua... pero no hay nada. Su lengua se les secó de sed. La boca de Dios lo testifica.</p>` },
            { dateStr: "", week: "Segunda semana de Adviento", title: "VIERNES", verse: "Isaías 48, 17-19", content: `<p><strong>Así habla el Señor, tu Redentor.</strong></p><p>En nuestro lenguaje corriente, ese término «redención» evoca la idea de «rescate»: pagar en lugar de otro para rescatarlo. Ciertamente, Jesús se puso en nuestro lugar y pagó duramente, nuestra justificación. Pero de hecho, el término, de origen hebreo, tiene otro matiz «Yo, el Señor, soy tu redentor, tu 'goel'». En el derecho tribal primitivo había un «goel»: era el hombre encargado de «vengar la sangre», el responsable del honor de la tribu. De hecho la idea es pues la de «un amor de Dios que se ha comprometido en el destino de los hombres». La idea principal no es la de un Dios que requiere sangre para aplacarse. Es la idea de un Dios que ama «apasionadamente la humanidad y se compromete totalmente para salvarla».</p><p>«¡Yo, el Señor, vengo a auxiliar!» «Yo, el Señor, soy tu «goel», tu redentor!» ¡Qué misterio! Contemplo en Belén a Jesús encarnado, compartiendo totalmente nuestra condición humana, y muriendo en la cruz.</p><p><strong>Yo, el Señor tu Dios, te instruyo en lo que es provechoso y te marco el camino por donde debes ir.</strong></p><p>Dios se ha comprometido en nuestra salvación. Pero no nos reemplaza. Nos invita a «caminar», a aceptar la instrucción «provechosa», la que salva. La enseñanza de Jesús, el Evangelio. «Te doy una instrucción, una enseñanza» dice Jesús también. ¿Cómo es mi fidelidad en recibir y meditar esa enseñanza? ¿Cómo me esfuerzo en aumentar mi cultura religiosa? ¿Y en ser fiel a la oración?</p><p><strong>Si hubieras estado atento a mis mandatos...</strong> «Atento»... Es una cualidad esencial a la oración... y a toda la vida del hombre. Haznos atentos, Señor. Jesús hablaba a menudo de vigilancia: «velad y orad» ¡Tan a menudo vivo como adormilado, dejándome llevar! «Os doy un mandamiento nuevo: ¡que os améis los unos a los otros!» ¡Estar atentos a amar! ¡No dejar pasar las ocasiones de amar!</p><p><strong>...Tu paz sería como un río.</strong></p><p>El que se deja «guiar» por Dios, el que escucha la «enseñanza provechosa», el que está «atento a amar», ¡está lleno de paz! ¡Un río! Evoco esa imagen...</p><p><strong>...Tu dicha y tu justicia serían como las olas del mar. ...Tu posteridad sería como la arena del mar, y tus hijos tantos como los granos de arena.</strong></p><p>Repetición de la promesa hecha a Abraham. A pesar de todos nuestros rechazos, de todas nuestras faltas de amor, Dios quiere nuestra felicidad, nuestra «justicia» nuestra «rectitud», nuestra «santidad»... ¡vasta y potente como las olas del mar! Y Dios quiere que nuestra vida sea fecunda, que «nuestros talentos rindan el céntuplo»... ¡como los granos de arena de las riberas! Una sola condición: estar atento a tus mandatos, Señor.</p>` },
            { dateStr: "", week: "Segunda semana de Adviento", title: "SÁBADO", verse: "Eclesiástico 48, 1-4; 9-11", content: `<p>Ese pasaje ha sido escogido hoy, para corresponder con la lectura del Evangelio: los escribas esperaban el retorno de Elías... Jesús dice que Elías ya ha venido... ¡es El, Jesús, el nuevo Elías!... Excelente ocasión de aprender de los labios de Jesús, que no se deben interpretar todos los pasajes de la Escritura, de un modo demasiado simple, liberal o infantil. El verdadero sentido de la Biblia no se obtiene interpretándolo materialmente.</p><p><strong>El profeta Elías surgió como fuego, su palabra ardía como una antorcha.</strong></p><p>El fuego es una imagen constante en la Biblia, para simbolizar a Dios. En el Sinaí, Dios se manifestó en el fuego de la tormenta. Es natural que el portador de la voluntad divina tenga un rostro de fuego. El fuego será el instrumento de la purificación última de los últimos tiempos. Esa imagen sugestiva proviene seguramente del hecho que, en los sacrificios primitivos, el fuego era el elemento que unía el hombre a Dios. Se comía luego la víctima para consumar la comunión con Dios.</p><p><strong>Elías, por tres veces, hizo caer fuego del cielo.</strong></p><p>Juan Bautista dirá: «El que viene detrás de mí, os bautizará en el Espíritu Santo y el fuego...» (Mateo 3,11). Y Jesús dirá: «He venido a traer fuego sobre la tierra y ¡cuánto desearía que estuviera ya encendido...!» (Lucas, 12,49). Y, en Pentecostés, «vieron aparecer unas lenguas, como de fuego...» (Hechos 2,3). ¡Dios. Ven a abrasarnos, a purificarnos! ¡Ven a alumbrarnos, a guiarnos!</p><p><strong>Elías, tú que fuiste arrebatado en torbellino de fuego, en carro de caballos de fuego.</strong></p><p>Escucho la revelación. Acepto esas palabras como unas imágenes: a su muerte, el profeta es «arrebatado en Dios»...</p><p><strong>Fuiste designado para el fin de los tiempos.</strong></p><p>Es el anuncio del famoso «retorno de Elías» del que los escribas hablaban en tiempo de Jesús, al preguntarse si no sería Juan Bautista, o Jesús. Esto debe interpretarse, pues, espiritualmente.</p><p><strong>Para calmar la ira antes que estalle... Para reconducir el corazón de los padres a los hijos... y restablecer las tribus de Jacob... Dichosos los que te verán, dichosos los que se durmieron en el amor del Señor, porque también nosotros poseeremos la verdadera vida.</strong></p><p>Jesús dijo que había venido a asumir la función de Elías, el profeta. Sí, vino a «calmar la ira antes que estalle», y a «conducir de nuevo los corazones de los padres a los hijos»... Esa es la función confiada a la Iglesia y a los cristianos: ser signos de la venida de Dios en el mundo. Para eso recibimos, en Pentecostés, el fuego del Espíritu Santo. En ese tiempo de Adviento que nos encamina hacia Navidad, analizo la situación: ¿dónde estoy, en cuanto a los esfuerzos espirituales decididos? ¿en cuanto mi participación a la venida de Dios en el mundo? ¿Participo del celo y ansia de Jesús cuando dijo: «cuánto quisiera que el fuego de Dios encendiera la tierra»? ¿o bien lo espero pasivamente?</p>` },
            { dateStr: "", week: "Tercera semana de Adviento", title: "LUNES", verse: "Números 24, 2-7. 15-17", content: `<p>La profecía que leeremos hoy es bastante sorprendente. Fue pronunciada en las siguientes circunstancias: Durante el Exodo, después de cuarenta años de larga marcha a través del desierto de Sinaí, el pueblo de Israel, conducido por Moisés, llega al Este del Mar Muerto, cerca de la tierra prometida; pero le queda todavía por atravesar el territorio de Moab. El rey de ese país no ve con agrado esa tropa de nómadas que quieren pasar. Envía pues a buscar, por las orillas del Éufrates, a un famoso adivino, una especie de brujo poderoso para que maldiga a esos inoportunos y les lance un maleficio. ¡Balaam es pues un profeta pagano!</p><p>Ahora bien, esto es lo que pasó: En lugar de maldecir, anuncia el futuro mesiánico del pueblo de Israel.</p><p><strong>El profeta pagano Balaam, alzando los ojos, vio el pueblo que acampaba... Le sobrevino el Espíritu de Dios, y pronunció estas palabras:</strong></p><p>¡Sorprendente! Ya en el Antiguo Testamento, esto es una prueba manifiesta que el Espíritu de Dios no está encerrado en los límites demasiado estrechos de un pueblo o de una institución. Dios no es tan solo el Dios del «pueblo escogido»... es el Dios de «todos los hombres»... Su acción no está limitada al marco de las instituciones de la Ley de Moisés. HOY, todavía, esto es igualmente real. Es verdad que Dios ha escogido la Iglesia como instrumento de salvación para el mundo; pero su gracia, su acción divina no se limitan a las fronteras visibles de la Iglesia. Dios por su Espíritu, está presente en el corazón de los paganos. Trabaja en el corazón de todos y de cada uno de los hombres.</p><p>Permanezco en silencio el tiempo necesario para contemplar a Dios, HOY, trabajando en el corazón de los hombres que no pertenecen visiblemente a la Iglesia.</p><p><strong>Oráculo de Balaam, el varón clarividente, que oye las palabras de Dios.</strong></p><p>También a mí, Señor, me pides aguzar mi mirada para ver mejor... No sé «ver» ni sé «oír» suficientemente los signos de Dios, «los signos de los tiempos». Dios sigue obrando y hablando. ¿Qué me dices, Señor? ¿Hacia donde suscitas, HOY, mi atención?</p><p><strong>Saldrá un héroe de la descendencia de Israel, dominará sobre pueblos numerosos. Su reino será mayor que el de...</strong></p><p>La fe nos proyecta, a nosotros también, hacia el futuro del mundo. Nos hace ver, por adelantado, «lo que ha de venir». Cristo va creciendo hasta su advenimiento definitivo. En silencio, busco, en mí y a mi alrededor, los signos de ese crecimiento. Todo hombre que progresa, que va siendo mejor... Es Cristo que está creciendo. Pero, todo ello no es algo deslumbrante. Son pequeños signos.</p><p><strong>A ese héroe, lo veo... aunque no para ahora. Lo diviso, pero no de cerca. Un astro se levanta, un cetro se endereza.</strong></p><p>Sí, no es muy aparente todavía. No se ve bien. Es necesario tener buenos ojos para discernir esas cosas. Así, el anuncio del Mesías viene jalonando toda la historia. Incluso entre los paganos de buena fe. En ese tiempo de Adviento hay que aguzar nuestra mirada.</p>` },
            { dateStr: "", week: "Tercera semana de Adviento", title: "MARTES", verse: "Sofonías 3, 1-2; 9-13", content: `<p>El profeta Sofonías escribe un siglo después de Isaías, aproximadamente en el 640. También él anuncia que las desgracias que sobrevendrán a Jerusalén, la purificarán. Y que será el comienzo de una era nueva, que verá la conversión y la afluencia de paganos en el pueblo de Dios: visión mesiánica y universalista.</p><p><strong>¡Ay de Jerusalén!, la ciudad rebelde, impura, opresora. No ha escuchado la voz, no ha aceptado la corrección, no ha puesto su confianza en el Señor...</strong></p><p>La historia del pueblo escogido es una larga serie de infidelidades: idolatrías, injusticias sociales, hipocresía religiosa. Es tarea de los profetas denunciar ese mal. Sin embargo, Dios continúa trabajando en medio de todo eso. ¡Ambigüedad profunda de toda obra humana! Mezcla de bien y de mal, en el interior mismo del pueblo de Dios. HOY también, en la Iglesia.</p><p><strong>Pero yo transformaré los pueblos y purificaré sus labios, para que invoquen todos el nombre del Señor... ¡Allende los ríos de Etiopía, mis hijos dispersos me aportarán ofrendas!</strong></p><p>Sofonías anuncia la conversión de Egipto y de Etiopía símbolo de países lejanos. Dios dará a los paganos unos «labios puros» dignos de alabar a Dios. Vendrán hasta Jerusalén para «aportar sus ofrendas». El episodio de los magos, venidos de países lejanos es una repetición de esa profecía. Es bastante emocionante oír que el mismo Dios llama a los «paganos» sus «hijos dispersos». Esa fórmula ha sido insertada en las nuevas plegarias eucarísticas. Dios no se olvida de sus hijos... ¡incluso cuando éstos le olvidan!</p><p>¿Cuál es mi preocupación misionera? ¿Tengo tendencia a condenar a «los que no conocen a Dios todavía»?, ¿a los «no practicantes»?</p><p><strong>Aquel día no tendrás ya que avergonzarte de todas tus rebeldías contra mí, porque entonces extirparé de tu seno a todos los orgullosos con su insolencia, y tú no volverás a engreírte en mi monte santo.</strong></p><p>Esa afluencia de paganos que se dirigen a Jerusalén para adorar a Dios, contribuye a la purificación del pueblo escogido: los arrogantes, los que creían que el monte del templo era un privilegio exclusivo, quedan abatidos. Sí, que hay que librarse de todo exclusivismo y de todo orgullo, ¡sobre todo del orgullo que rechaza a los demás!</p><p><strong>En medio de ti, sólo dejaré subsistir un pueblo pequeño y pobre, que se refugiará en el monte del Señor.</strong></p><p>En el pueblo renovado, solamente subsisten los humildes y los pobres. Es como un anuncio de lo que sucedió en Belén. Después de anunciar la venida de los paganos -los magos- se anuncia la llegada de los humildes -los pastores-.</p><p><strong>Ese «resto» de Israel no cometerá más injusticias... Renunciará a la mentira... Se apacentarán y reposarán sin que nadie los turbe.</strong></p><p>La «pobreza espiritual», la que Jesús ha beatificado, ya está aquí. Líbranos, Señor, de todo orgullo, de toda suficiencia, de toda condena, de toda dureza: Haznos pequeños y pobres ante Ti. Consérvanos humildes ante tu paz. ¡La Iglesia, concebida como el «pequeño resto» de los humildes! De los que modestamente encuentran su refugio en el Señor, y no en sus propias fuerzas.</p>` },
            { dateStr: "", week: "Tercera semana de Adviento", title: "MIÉRCOLES", verse: "Isaías 45, 6-8; 18-25", content: `<p>Esta es una de las profecías de Isaías que el Adviento ha tenido más en cuenta. La renovación mesiánica es anunciada como una «primavera». La naturaleza entera se renueva y participa a la eclosión del Mesías.</p><p><strong>Que los cielos destilen el rocío / Que las nubes derramen la justicia / Y produzca la salvación / Que la justicia haga que crezcan a la vez todos sus brotes...</strong></p><p>Visión poética y optimista. Una vez más, oímos esa revelación constante de la Biblia. La humanidad no puede ser feliz, sin que la naturaleza obtenga de ello un beneficio. La tierra reseca recibe un «rocío» que la hace «fecunda» y las yemas brotan de todas partes. Concepción optimista de la naturaleza.</p><p><strong>¡Yo, el Señor, he creado todo esto! Así habla el Señor, el Creador de los cielos. Que ha modelado la tierra y la ha formado. No la creó como un desierto, sino para que fuera habitada.</strong></p><p>Constantemente debemos volver a encontrar ese sentido profundo de las cosas, ese optimismo enraizado. Efectivamente, Dios hizo hermosa la tierra; y quiere que sea bella, fecunda y dichosa. El anuncio de la era mesiánica, anuncia también ese renuevo. ¿Cuál es mi participación en esa renovación? Concebir todo mi trabajo, mi vida de familia, mis compromisos, como una cooperación a Dios creador.</p><p><strong>Yo soy el Señor. No existe ningún otro. No hay otro Dios, sino Yo.</strong></p><p>Ese optimismo está fundado en un monoteísmo feroz. Isaías es el más estricto defensor del monoteísmo: ¡un solo Dios! ¡No hay otro!</p><p><strong>Un Dios justo y salvador, no hay otro fuera de mí. ¡Volveos a mí y seréis «salvados», habitantes de toda la tierra!</strong></p><p>La reivindicación divina no es una reivindicación orgullosa y tiránica... ¡un monopolio! ¡Es un «servicio»! Soy el único que puedo salvaros. No erréis la dirección. ¡Sería un gran daño para vosotros buscar una «salvación» fuera de mí! Seríais muy desgraciados. Malograríais vuestra vida. Esto fue dicho no sólo al pueblo hebreo, sino a «todos los habitantes de la tierra», en un universalismo sorprendente para aquella época. Cristo Jesús ha venido. Leamos de nuevo esas frases proféticas pensando en El. ¡Salvanos, Señor! ¡Salva a todos los habitantes de la tierra!</p><p><strong>¡Sólo al Señor la justicia y la fuerza! A El se volverán avergonzados los que se habían levantado contra El.</strong></p><p>Cristo cambia los corazones: los que estaban «contra El», van «hacia El». Esta es la maravillosa primavera anunciada. Cumple, Señor, tu promesa. Cambia el corazón de los hombres.</p>` },
            { dateStr: "", week: "Tercera semana de Adviento", title: "JUEVES", verse: "Isaías 54, 1-10", content: `<p>El pasaje pertenece al Segundo Isaías. El contexto histórico es el exilio. Jerusalén ha sido destruida, el Templo derribado, los habitantes deportados. Un profeta, discípulo de Isaías, anuncia la «restauración».</p><p><strong>Palabra de Dios dirigida a Jerusalén... Dice el Señor tu Dios...</strong></p><p>En la breve página que leemos hoy, cinco veces encontramos fórmulas de ese tipo. A través de las palabras del profeta tenemos las palabras de Dios. Dios habla. ¿Qué quieres decirnos, Señor?</p><p><strong>Grita de júbilo, mujer estéril, que no das a luz. Rompe en gritos de júbilo y alegría tú que no has tenido los dolores; que más son los hijos de la abandonada que los de la esposa. Dice el Señor...</strong></p><p>Ese primer poema divino, esa primera promesa, canta la fecundidad de la nueva Jerusalén. Estéril durante el exilio, puesto que la ciudad había quedado desierta, Jerusalén tendrá hijos, de nuevo. ¡Hay que «gritar»... «gritar de júbilo», «romper en gritos de alegría», dice el Señor! Una vez más notemos esa invitación a una religión alegre; de ningún modo a una religión «fácil» o beata-ingenua, porque esas palabras van dirigidas a gente anonadada, humillada, a hombres que todo podría llevarles a la tristeza y la desesperación.</p><p>La alegría, que Dios nos pide, ¿de dónde procede?</p><p><strong>Tu esposo es tu Creador.</strong></p><p>La razón de la alegría, incluso en situaciones humanamente sin salida, es el «amor de Dios» por nosotros. Dios afirma que nos ha desposado. Ese tema de los esponsales será desarrollado en tres estrofas.</p><p><strong>Te llamó el Señor. ¿Es repudiada la mujer de la juventud? Dice el Señor...</strong></p><p>Los pecados de Jerusalén han sido considerados por Dios como un adulterio; y Dios fue obligado a dar una carta de repudio —el exilio—. Pero Dios no olvida a la que El ha seguido amando. Ni siquiera el pecado puede parar ese amor. Entonces... Dios anula la carta de repudio.</p><p><strong>Por un momento te abandoné, pero con gran ternura te recogeré. En un arranque de furor te oculté mi rostro por un momento; pero en mi amor eterno, tengo piedad de ti. Dice el Señor...</strong></p><p>Hay que volver a leer despacio esas palabras de amor ardiente. ¡Solamente los más apasionados amores humanos pueden darnos una idea de los sentimientos de Dios por su pueblo, por nosotros, por todos los hombres! «Mi amor eterno...» «Mi amor eterno...» Cuando san Pablo repetirá a los esposos que «su amor es grande, porque es el signo —el sacramento— del amor de Cristo y de la Iglesia» (Efesios, 5-32) no hará sino repetir esas palabras mismas de Dios.</p><p><strong>¡Juro que no me irritaré más contra ti! ¡Que no te amenazaré! Aun cuando los montes se movieran y las colinas tambalearan, mi amor por ti no cambiará, mi alianza de paz no será alterada, ha declarado el Señor en su compasión por ti...</strong></p><p>Ciertamente, así me ama Dios. Es preciso callarse y escuchar esas declaraciones. Es preciso ser muy humilde, pequeño, porque no merecemos en absoluto ser amados hasta tal punto.</p>` },
            { dateStr: "", week: "Tercera semana de Adviento", title: "VIERNES", verse: "Isaías 56, 1-8", content: `<p>El profeta que ha escrito ese pasaje, quiere indicar a los paganos las condiciones para entrar en el Pueblo de Dios.</p><p><strong>Palabra de Dios: Observad el derecho. Practicad la justicia.</strong></p><p>Eso no empieza pues por lo cultual, los ritos sino por la buena moral natural. San Pablo lo repetirá a los Romanos (2, 14): seguir la propia conciencia, practicar el derecho y la justicia es el primer criterio de la salvación. En este tiempo de Adviento, ruego por tantos hombres rectos y de vida honesta que todavía no han encontrado a Jesucristo de modo explícito.</p><p><strong>Porque mi salvación se acerca, está viniendo... Dichoso el hombre que obra según el derecho y se mantiene en él con firmeza.</strong></p><p>Dios ama a los paganos, quiere su salvación, los hace caminar por toda clase de senderos hacia su felicidad definitiva. «Dichoso» el hombre que sigue su conciencia. A mi alrededor hay quizá muchos de esos hombres. Doy gracias a Dios por sus buenas obras. Ofrezco sus vidas a Cristo que no conocen o que lo conocen mal, insuficientemente. Antes de proponerles actos de «práctica religiosa», lo que sería prematuro quizá, debo cooperar a la obra de Dios en ellos, estimulándolos a hacer, paso a paso, aquellos actos buenos de los que son, a veces, más capaces que yo.</p><p><strong>Observa el sábado sin profanarlo y evita toda acción mala.</strong></p><p>Esa es una etapa nueva. Se va entrando más en el Pueblo escogido, observando las reglas, más precisas, del Sábado. Es la etapa de la práctica religiosa propiamente dicha.</p><p><strong>En cuanto a los extranjeros adheridos al ministerio del Señor, por amor de su nombre y para ser sus servidores; a todos aquellos que guardan el Sábado sin profanarlo y se mantienen firmes en mi alianza, Yo les conduciré a mi monte Santo. Les alegraré en mi «casa de oración»; sus holocaustos y sacrificios serán bien acogidos sobre mi altar...</strong></p><p>Les vemos pues ahora, totalmente integrados a la asamblea litúrgica de Israel, en igualdad, según parece. Nuestras parroquias y comunidades cristianas, nuestras asambleas eucarísticas, ¿tienen ese carácter de apertura universal? Los extraños, la gente que está de paso, los hombres de buena voluntad, de cualquier cultura y ambiente, ¿se encuentran acogidos en ellas? En cuanto a nuestros grupos humanos, ¿permanecen habitualmente sociológicamente cerrados, donde prácticamente ningún «novato» puede entrar? El amor cristiano es «sin fronteras», o no es cristiano.</p><p><strong>Porque mi casa será llamada «Casa de oración para todos los pueblos». Palabras del Señor.</strong></p><p>Jesús citó ese texto cuando expulsó a los vendedores del Templo (Marcos 11, 17). Sucede que los comentaristas se limitan a hablar de la casa de «oración»... como si Jesús hubiera defendido solamente una espiritualización del Templo. Ahora bien, según la cita de Isaías, Jesús ciertamente defendió también una universalización del Templo: ¡una casa «para todos»! André Chouraqui, judío contemporáneo, que fue alcalde de Jerusalén, en su libro «Vivir por Jerusalén», reconoce lo siguiente: «Más que por la sustancia de su enseñanza, la singularidad de Jesús se sitúa en el extraordinario poder de su personalidad natural y sobrenatural: ésta proporciona un fundamento suficiente para la edificación de un universalismo que no era extraño al genio de Israel, ciertamente, pero que Israel nunca tuvo la audacia o la fuerza de afirmar».</p><p><strong>A los ya reunidos todavía añadiré otros.</strong></p><p>Efectivamente, ése era el sentimiento premonitorio de Isaías. ¿Cómo participo yo, HOY, en ese gran movimiento?</p>` },
            { dateStr: "12-17", week: "Tiempo de Adviento", title: "17 DE DICIEMBRE", verse: "Génesis 49, 2; 8-10", content: `<p>A partir de hoy, el evangelio nos presenta lo que ha precedido al nacimiento de Jesús: los evangelios de la infancia. Notaremos que la primera lectura, sacada del Antiguo Testamento está siempre en correspondencia con esa página del evangelio. Es algo más que una coincidencia. Mateo, en particular, escribió esas páginas subrayando la armonía entre el Antiguo y el Nuevo Testamento: Jesús es, ciertamente, «aquél que Israel esperaba, aquél que había sido prometido... Varias veces y de muy diversas maneras...»</p><p><strong>Jacob llamó a sus hijos: «Quiero anunciaros lo que os ha de acontecer en días venideros...»</strong></p><p>Es el testamento de Jacob de cuya «genealogía» nos hablará el evangelio. El pueblo de Israel, desde sus orígenes lejanos, ha sido invitado por Dios a esperar: «quiero anunciaros lo que os ha de acontecer en días venideros»... Un pueblo en tensión hacia el porvenir. Un pueblo que es conocedor del avanzar de la historia. Un pueblo que sabe que Dios obra en él. Un pueblo en marcha, seguro del éxito de lo que Dios está preparando. El pueblo de la esperanza. La humanidad posee un «porvenir». La humanidad no va hacia un callejón sin salida. ¿Soy un hombre de esperanza?</p><p><strong>Judá, tus hermanos te rendirán homenaje... Judá, mi hijo, es un león joven...</strong></p><p>Esta es ya como una prueba misteriosa de que no son los hombres solos los que hacen la historia. Dios interviene con toda su libertad. ¡No es el primogénito Rubén, ni el segundo, Simeón, ni el tercero, Leví, quienes «heredarán de la promesa», sino el cuarto, Judá! Esa bendición de Jacob sobre éste más que sobre los otros, tiene toda su significación. Dios es el que elije. «He ahí que el León de la tribu de Judá ha vencido». (Apocalipsis 5, 5). Jesús nacerá en la «tribu de Judá», en Judea, en Belén, Dios ya piensa en ello. Haznos disponibles, Señor, a tus «designios» a los que Tú quieres hacer por medio de nuestras vidas, de nuestras responsabilidades.</p><p><strong>La realeza no se irá de Judá, ni el bastón del mando se irá de su descendencia, hasta tanto que venga aquél a quien le está reservado el poder y a quién las naciones obedecerán...</strong></p><p>Esa frase es, netamente, profética: un descendiente de Judá reinará no sólo sobre las demás tribus del pueblo elegido, sino sobre todas las naciones. A través de los siglos, a través de las vicisitudes y de los fracasos de la historia se ha mantenido esa sorprendente esperanza: ¡un «salvador» nacerá de la familia de Judá! (Mateo 2,6). Ahora, esa profecía se ha realizado. Cristo ha venido; pero la misma esperanza profunda nos mantiene: su Reino no tendrá fin... Y también nosotros, aspiramos a la plena realización de ese Reino: Venga a nosotros Tu Reino, así en la tierra como en el cielo... ¿Qué hago yo para ello?</p>` },
            { dateStr: "12-18", week: "Tiempo de Adviento", title: "18 DE DICIEMBRE", verse: "Jeremías 23, 5-8", content: `<p>En el Evangelio de ese día, Mateo insistirá sobre el título «José, hijo de David». Toda una tradición presentaba al Mesías como un descendiente de la familia de David.</p><p><strong>Oráculo del Señor: Mirad que vienen días en que suscitaré a David un «Germen justo».</strong></p><p>Ese oráculo de Jeremías está inserto en un contexto de duras condenas por parte de los reyes de Judá. La dinastía davídica está en plena decadencia, y suscita la cólera de Dios (Jeremías 21 y 22): incapacidades, injusticias sociales, alianzas idolátricas, crímenes políticos, mala conducta personal... El panorama es muy negro. «Ay de los pastores que dejan que perezca el rebaño de mi pastizal, ¡oráculo del Señor!». «Pero mirad, que vienen días en que nacerá un verdadero rey.»</p><p><strong>Reinará como verdadero rey, será inteligente y prudente, practicará el derecho y la justicia en la tierra. De modo que, en la humanidad pecadora hay un «germen justo», un germen de Dios. En la dinastía de David, tan condenable, hay un germen de Mesías.</strong></p><p>Tú Señor, ves en mí, en germen, todas las posibilidades de santidad. Imagen casi biológica: el «germen» es el comienzo del ser. Lo que contiene toda la potencia de vida que irá desarrollándose. Minúsculo, casi invisible, el germen posee todo el poder que se manifestará esplendoroso a pleno día. Son cualidades del rey esperado, del Mesías, de Jesús, ser un verdadero jefe, inteligente, bueno y justo. ¿No es esto lo que está esperando la humanidad HOY y siempre? ¡Que la prudencia rija en los responsables a todos los niveles! ¡Que el derecho y la justicia presidan las relaciones entre los hombres! Que a los problemas humanos se les apliquen soluciones sensatas. Sin saberlo, quizá todo ello es un esperar a Cristo. El mundo, sin darse cuenta, espera a este Cristo prudente, recto y justo; y esto no se realiza más que mediante la mediación de un hombre. HOY puedo yo cooperar en esa obra de Cristo.</p><p><strong>En sus días estará a salvo el reino de Judá, e Israel vivirá en seguro. Y éste es el nombre que se le dará: «El Señor-justicia-nuestra».</strong></p><p>Un rey-mesías cuyo nombre es simbólico. Los nombres tienen mucha importancia para la mentalidad semítica: caracterizan a la persona. Un hombre que no es por sí mismo su propia justicia. Un hombre investido de la misma justicia de Dios. Cuando trato de ser más justo, en realidad «es el Señor mi justicia».</p><p><strong>Mirad que vienen días en que no se dirá más: «El Señor hizo... en el pasado,» sino: «El Señor hace... hoy».</strong></p><p>Los judíos, del tiempo de Jeremías, solían, como nosotros, referirse al pasado: antes se hacía esto... Una vez Dios hizo que los hijos de Israel salieran del país de Egipto... Jeremías reacciona. Nunca más se dirá esto. Porque, es HOY cuando Dios libera de la esclavitud a su pueblo; es HOY cuando Dios reúne a sus hijos dispersos y les instala en su propio pueblo. Efectivamente, el Señor vive, es un contemporáneo, su acción es actual; pero la mayoría de las veces no sabemos reconocer su obra. Ayúdanos, Señor, a reconocer lo que ahora estás haciendo por nosotros.</p>` },
            { dateStr: "12-19", week: "Tiempo de Adviento", title: "19 DE DICIEMBRE", verse: "Jueces 13, 2-7; 24-25", content: `<p>Historia del nacimiento de Sansón. Ese tema de nacimientos milagrosos se repite a lo largo de toda la historia de Israel. La obra de Dios desorienta a los hombres y los rebasa. Los nacimientos extraordinarios narrados en la Biblia señalan la intervención muy especial de Dios cuando comunican la maternidad original de María, el nacimiento de Isaac, Sansón, Samuel, Juan Bautista, Jesús...</p><p>Son hijos «dados por Dios»...<br>—En todos ellos, un ángel se presenta al padre del niño.<br>—En todos ellos, el padre contesta aduciendo un obstáculo insuperable, como la vejez o la esterilidad.<br>—En todos ellos, el ángel replica y da un «signo».<br>—En todos ellos, Dios impone el nombre, el nombre del niño.</p><p><strong>El ángel del Señor se apareció a la mujer de Manoa: «Bien sabes que eres estéril y que no has tenido hijos; pero tú concebirás y darás a luz un hijo... que será dedicado a Dios desde su concepción».</strong></p><p>Para subrayar que la fuerza de Sansón no procede de sí mismo, sino que es un don de Dios, la Biblia señala que esa fuerza había sido prometida por Dios antes de su nacimiento, ¡momento en el cual la debilidad del hombre es más manifiesta! La debilidad está representada por la fragilidad del recién nacido y la esterilidad de su madre. Lo que será de mayor es pues un don gratuito. Ciertamente Dios no parece preferir la fuerza; antes bien es la debilidad el mejor signo de su cercanía. Así, la vida humilde y sencilla que llevó Jesús en la tierra no fue un paréntesis excepcional en la vida eterna de un Dios todopoderoso, sino el más perfecto reflejo de lo que Dios tiene en mayor estima: ¡su amor!</p><p>¡Sánanos, Señor, de nuestros sueños de grandeza! Contemplo tu infancia, la humildad de María, tu madre. El aparente fracaso de tu cruz.</p><p><strong>El comenzará a salvar a Israel.</strong></p><p>Sansón fue un salvador temporal, un liberador que luchó contra los enemigos humanos de Israel, pero a través de esa salvación temporal, Dios ayudaba humanamente a su pueblo y le dejaba entrever otro tipo de «liberación». El verdadero salvador es Jesús. Su nombre, Jesús, en hebreo significa: «Dios salva». Señor, libéranos del pecado. ¡Líbranos del «mal»! Líbranos de todo mal.</p><p><strong>En lo sucesivo, no bebas vino ni bebida fermentada.</strong></p><p>Es un signo de vida austera, el signo del «nazir», del que ha renunciado a muchas cosas para consagrarse exclusivamente a Dios. Juan Bautista también será un nazir. Es el origen lejano de la vida monástica, consagrada.</p><p><strong>El niño creció, el Señor le bendijo, y el espíritu del Señor comenzó a conducirle.</strong></p><p>Sabemos por la historia de Sansón que éste no permaneció siempre digno de la misión que había recibido. Morirá precisamente el día que usará su fuerza sobrehumana en provecho personal..., como un título de gloria personal y no como un don de Dios. Ayúdanos, Señor, a ser siempre dóciles a la moción de tu Espíritu.</p>` },
            { dateStr: "12-20", week: "Tiempo de Adviento", title: "20 DE DICIEMBRE", verse: "Isaías 7, 10-14", content: `<p><strong>La profecía del Emmanuel.</strong></p><p>Todos los exegetas están de acuerdo en situar esa profecía en el contexto histórico siguiente: el rey Acaz, cercado por la coalición del rey de Damasco y del rey de Samaría, está totalmente fuera de sí y a punto de ofrecer en sacrificio a su propio hijo. Isaías va a verle y le pide que no tema puesto que: si guarda su «fe» en Dios, su dinastía está asegurada por una promesa divina... Dios mismo se propone intervenir: un «hijo» le es anunciado, un nuevo heredero del trono de David. Ese hijo prometido por Dios será Ezequías, el rey piadoso que reinará en Jerusalén. Pero detrás de ese contexto histórico se perfila el Mesías. La solemnidad de ese oráculo, el nombre dado al niño. «Dios-con-nosotros»... el término que designa a su madre, la «virgen»... el hecho que sea un signo de Dios... Todo eso ha orientado a los teólogos hacia una interpretación mesiánica. Como siempre, en casos parecidos, es después, una vez realizada la profecía, cuando ésta resulta más esclarecida.</p><p>En el interior de toda historia humana se desarrolla el proyecto divino. «Estoy convencido de que Dios, HOY, está realizando parte de su designio, a través de mis propios hijos, si los tengo, a través de mis decisiones, mis compromisos, los acontecimientos que me suceden?</p><p><strong>El Señor envió al profeta Isaías al rey Acaz para que le dijera: «Pide para ti un signo de parte del Señor, tu Dios».</strong></p><p>En medio de sus preocupaciones de rey y de hombre político atacado por sus enemigos, Dios está con él. La historia no es únicamente profana. Es el lugar en que «Dios da un signo». Jesús reprochará a los judíos de su tiempo no saber reconocer los signos que Dios les hacía. También, en mi vida, Dios hace para mí unos signos. No son vistosos ni milagrosos, pero he de saber leerlos e interpretarlos.</p><p><strong>«No, contestó Acaz, no lo pediré, no tentaré al Señor.»</strong></p><p>Se queda tranquilo al usar ese argumento que aparentemente es respetuoso con Dios; pero, en el fondo, permanece incrédulo. No quiere ningún signo porque no está decidido a seguir las indicaciones de Dios y prefiere hacer su parecer y decidir, él sólo, su política. Eso es lo que el profeta le reprochará.</p><p><strong>«Oíd pues, casa de David, dijo Isaías: ¿Os parece poco cansar a los hombres, que cansáis también a mi Dios?...»</strong></p><p>Los reyes no tenían buena reputación, «cansaban a los hombres», oprimían al pueblo bajo del país. Y he ahí que ese error político, que ya es grave para un rey se complica ahora con la falta de fe: Dios dice «estar fatigado» de esos reyes que no creen en El, y ¡que sólo confían en sus ejércitos y en sus alianzas humanas! Con frecuencia, ¡también nosotros debemos de fatigarte, Señor!</p><p><strong>Pues bien, el Señor mismo va a daros una «señal»: He aquí que la Virgen concebirá y dará a luz a un Hijo y le pondrá por nombre Emmanuel, es decir, «Dios-con-nosotros».</strong></p><p>El término traducido aquí por la palabra «virgen» en hebreo es «halmah» que designa siempre «doncellas». Es el indicio muy claro de un nacimiento sorprendente. Ese texto ha sido aplicado siempre a María de una manera privilegiada. Ciertamente, Isaías entrevió siempre al Mesías venidero como un hombre especialmente lleno del Espíritu de Dios: «Dios-con-nosotros».</p>` },
            { dateStr: "12-21", week: "Tiempo de Adviento", title: "21 DE DICIEMBRE", verse: "Cantar de los Cantares 2, 8-14", content: `<p>El Cantar de los Cantares es un «Cántico de amor». En todo tiempo ha sido interpretado como el símbolo del amor de Dios a su pueblo. El relato describe la vehemente pasión de los prometidos, su ardiente deseo de encontrarse: el encuentro de dos corazones, el mutuo don de dos personas... dos seres que tratan de comprenderse, de estimarse, de amarse... Esa experiencia universal del amor humano puede pasar a ser «experiencia religiosa» y es uno de los signos más emotivos del amor de Dios.</p><p>Ese poema de amor puede pues interpretarse a diferentes niveles:<br>—el ideal del amor de un matrimonio, según Dios...<br>—el amor de Dios por María, su esposa...<br>—el amor de Dios por toda la humanidad, que en Navidad viene a desposarse con ella...<br>—el amor de Dios por cada uno de nosotros, personalmente.</p><p><strong>He aquí a mi amado que viene.</strong></p><p>Dios contemplado como un «amado». Decir a Dios: «¡mi amado!». Jesús, en el evangelio, dirá: «el reino de los cielos es semejante a diez doncellas que salieron al encuentro del esposo...». (Mateo 25, 1.) «Viene.» Es el misterio mismo de Navidad. Dios viene a nosotros como el amado que va al encuentro de su «amada». Es el fresco suave de una cita entre prometidos.</p><p><strong>Salta por las colinas, semejante a la gacela o a un joven cervatillo.</strong></p><p>Efectivamente, Dios ha debido de salvar muchas distancias para llegar hasta nosotros. No solamente «montes y colinas», sino la distancia infinita de la divinidad a la humanidad. Nada es obstáculo para Dios. Salta, ligero y ágil. Viene.</p><p><strong>Mi amado ha hablado y me ha dicho: «Levántate amada mía, hermosa mía y vente».</strong></p><p>El amor es recíproco. Tenemos, ahora, la declaración de Dios. Ama y desea a la humanidad. Esta es tratada por Dios como la «amada» la «muy hermosa». Dios se hizo hombre porque ama a la humanidad, la ve hermosa. También debemos nosotros amar lo que Dios ama: nuestra vida humana es la obra maestra de su inteligencia y de su Amor. ¡El es quien ha creado esto! El Hijo de Dios es concebido en un seno materno de mujer, toma un cuerpo y un alma humanas, nace, toma «condición humana»... ¡todo eso prueba que lo encuentra hermoso!</p><p><strong>Porque, mira, ha pasado el invierno... Aparecen las flores en el campo... el tiempo de las canciones ha llegado... Se oye el arrullo de la tórtola. Echa la higuera sus yemas, la viña en flor exhala su fragancia...</strong></p><p>Son las «imágenes» tradicionales que en todos los pueblos son expresión del amor: primavera... flores... perfumes... canciones... felicidad. Esas expresiones poéticas, en los escritos proféticos, caracterizan siempre la era mesiánica. El mismo Jesús las repite también cuando, al anunciar su retorno al final de los tiempos, lo presenta como la llegada de la «primavera»: «cuando véis que la higuera echa sus yemas tiernas, sabéis que el verano está cerca, así también el reino de Dios está cerca...» (Mateo 24, 32). La venida de Dios inaugura una era de felicidad. «Tranquilízanos, Señor, en las pruebas, en esta vida en que esperamos la felicidad que nos prometes, y el advenimiento de Jesucristo, nuestro Salvador.» Danos, Señor, desde ahora, ese gozo interior que viene de ti... y que resulta colmado en la eternidad.</p><p><strong>Muéstrame tu semblante, déjame oír tu voz. Porque tu voz es dulce y tu rostro, hermoso.</strong></p><p>Nos lo dice Dios, que ama a la humanidad. ¿Soy digno de ello?</p>` },
