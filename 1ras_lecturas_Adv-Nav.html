            { dateStr: "12-22", week: "Tiempo de Adviento", title: "22 DE DICIEMBRE", verse: "I Samuel 1, 24 - 2, 1", content: `<p>Ese pasaje del Antiguo Testamento ha sido elegido para hoy por dos razones manifiestas:<br>—el cántico de Ana contiene exactamente los mismos temas que el «Magnificat» de María que se lee en este día...<br>—la maternidad excepcional de esa mujer, hasta ahora, estéril, anuncia también por adelantado las dos maternidades excepcionales de Isabel y de María.</p><p><strong>Yo soy esa mujer que estuvo aquí ante ti orando al Señor. Yo pedía este niño y el Señor me ha concedido la petición que le hice.</strong></p><p>Muy próxima ya la Navidad, la liturgia se concentra en la contemplación de María; y rememoriza los nacimientos algo milagrosos que narra el Antiguo Testamento. Ana era estéril. Suplicó a Dios que se dignara «mirar la aflicción de su sierva». Habiendo sido escuchada su oración, consagró a Dios a su hijo, el pequeño Samuel. Misterio de la maternidad. Contemplo en silencio la alegría de María en esos días: ella espera y se prepara...</p><p><strong>Entonces Ana dijo esta oración: «Mi corazón exulta en el Señor...».</strong></p><p>«Mi alma exalta al señor, mi espíritu exulta en Dios, mi salvador...» El clima interior de María es la alegría, la exultación. Trato de imaginarla esos días dichosa, ¡a pesar del desplazamiento de Nazaret a Belén para cumplir la orden de empadronamiento impuesta por el emperador de Roma! ¿Cuál es el clima interior de mi alma? ¿Suelo también recitar el «Magnificat» para cantar, en verdad, mi gozo y mi agradecimiento?</p><p><strong>«El arco de los fuertes se quiebra, pero los débiles recobran vigor...» «Los hartos se contratan por pan, los hambrientos dejan su trabajo...» «Derriba de su trono a los poderosos, ensalza a los humildes...» «A los hambrientos los colma de bienes, a los ricos los despide vacíos...»</strong></p><p>María se sabe pequeña, humilde y modesta. No forma parte de los grupos de gente muy conocida y bien relacionada. Su única y profunda relación es Dios. No busca aparentar, en el sentido mundano. Vive ignorada por todos. Nadie a su alrededor, salvo José e Isabel, saben el gran misterio: Dios está en ella, escondido. Como María, ¿sabré yo hacer la verdadera jerarquía de valores? ¿Sabré buscar los verdaderos «bienes» y dejarme «colmar» por ellos?</p><p><strong>«Levanta del polvo al humilde y del estercolero alza al indigente.» «Acogió a Israel, su siervo; se acordó de su misericordia...»</strong></p><p>Toda una tradición bíblica conduce a esas expresiones: Dios ama a los pobres, se hace defensor de los débiles, de los que no tienen apoyo humano. Dichosos los pobres en espíritu, porque de ellos es el reino de los cielos. El tema de la «alegría» y el de la «pobreza» están ligadas. ¡Concédénos, Señor, esa pobreza interior y, a la vez, esa alegría! Que en los próximos días de Navidad, el pesebre del establo de Belén, sea para mí un recuerdo y una llamada. Ciertamente, no se debe al azar el hecho que hayas querido nacer en esas condiciones de sorprendente indigencia. ¡Estamos todos demasiado acostumbrados a oírlo o a leerlo y ya no nos choca! Dios nacido en un establo... y recostado sobre la paja de un pesebre...</p>` },
            { dateStr: "12-23", week: "Tiempo de Adviento", title: "23 DE DICIEMBRE", verse: "Malaquías 3, 1-4; 23-24", content: `<p><strong>Así habla el Señor Dios: «He aquí que yo envío a mi mensajero a allanar el camino delante de mí».</strong></p><p>El Señor es consecuente en sus ideas y prepara sus intervenciones con mucha anterioridad. Mateo (17, 9-13) y Lucas (7, 24-30) designarán a ese «mensajero». Es Juan Bautista, cuyo nacimiento leemos en el evangelio de hoy.</p><p><strong>Y enseguida vendrá a su Templo el Señor a quien vosotros buscáis...</strong></p><p>No será sólo un Mesías con realeza, un descendiente de David, como lo anunciaban las profecías de Isaías sobre el Emmanuel... es el Señor en persona el que viene. Es sorprendente encontrar en esos textos, por adelantado el anuncio de un Ungido, un Cristo que es Dios mismo. Evidentemente no se sabía cómo iba a realizarse esto, ha sido necesaria «la venida de Jesucristo» para aclarar esas profecías, a posteriori. Esos textos sagrados nos dicen mucho más de lo que solemos ver en la Navidad: no rebajemos el misterio, no lo reduzcamos a la mera amenidad de una fiesta folklórica agradable. ¡Es Dios el que viene! ¡Dios! ¡El gran Dios del universo!</p><p><strong>¿Quién podrá soportar el Día de su venida? ¿Quién se tendrá en pie cuando aparezca? Porque es él como fuego de fundidor y como lejía de las lavanderías. Se instalará para fundir y para purificar.</strong></p><p>Bien sabemos, desde el pesebre-cuna de Navidad, que Dios no ha venido para aplastar al hombre con su poder, y que se ha mostrado siempre completamente «humano». Pero eso no debe hacernos olvidar ese otro aspecto, expresado aquí con fuerza: El que viene, ¡es Dios! Y ante El ninguna imperfección puede mantenerse, ningún pecador puede envalentonarse. Ante El el orgullo es impensable. Es necesario reconocerlo como Dios, sentirse pequeño y humilde, y confiarse a El.</p><p>Señor, en el pesebre de Belén, yo te adoro, profundamente prosternado ante tu divina grandeza. Purifícame de todos mis pecados; porque ¡Tú sólo eres santo, Tú sólo Señor, Jesucristo, con el Espíritu Santo en la gloria de Dios Padre!</p><p><strong>Purificará a los hijos de Levi, los acrisolará como el oro y la plata: Así podrán presentar la oblación en plena justicia, ante la mirada del Señor.</strong></p><p>La venida del Mesías inaugurará una reforma profunda de la «función sacerdotal» que ejercía, hasta aquí, la familia de Levi. Se anuncia un «culto» nuevo. El Hombre-Dios ha venido a fundar el culto definitivo: la ofrenda no será sólo de animales. Cristo es la «ofrenda agradable y justa». La eucaristía es el sacrificio espiritual por el cual los cristianos «ellos mismos se ofrecen en unión con Cristo». Así la ofrenda de Judá y de Jerusalén será grata al Señor. El concilio ha revalorado esta teología del «culto espiritual» de los cristianos. Jesús no ofreció un cordero pascual, sino que se ofreció a sí mismo, su propia vida, y su propia muerte. También nosotros debemos ofrecer nuestra propia vida. El sacrificio agradable a Dios es «el hombre vivo». Nuestra vida misma debería ser un culto.</p><p>Señor, te ofrezco la vida de Jesús desde su nacimiento en Belén, su adolescencia, su edad adulta, hasta su cruz. Te ofrezco todos los trabajos, los pensamientos, las acciones, las palabras de Jesús. Y te ofrezco también mi vida, mis trabajos, mis pensamientos, mis acciones, mis palabras. ¡Mira la ofrenda que presentamos ante ti, nosotros, tus servidores!</p>` },
            { dateStr: "12-24", week: "Tiempo de Adviento", title: "24 DE DICIEMBRE", verse: "II Samuel 7, 1-5; 8-16", content: `<p>Hoy, víspera de Navidad, leemos la célebre profecía de Natán. Esa es la página que ha dado origen a la corriente llamada el «mesianismo real». Muchos pasajes de la Biblia han repetido ese tema, en particular los salmos 132 y 89. El evangelio subrayará que Jesús nace en Belén, ciudad de David (Lucas 2, 4). El ángel Gabriel anuncia su nacimiento a María y lo califica como Hijo de David (Lucas 1, 32). Dios cumple sus promesas.</p><p>Mirad esos versos del salmo 132 que repite la profecía de Natán:<br>«Señor, acuérdate, acuérdate de David, acuérdate de tu promesa, acuérdate.<br>«Tú le dijiste: el fruto de tu seno, asentaré en el trono que te he preparado.<br>«Bendeciré a los justos en su júbilo, a los pobres, hartaré de pan.<br>«Secaré las lágrimas de todos los que lloran, todos mis amigos darán gritos de júbilo.<br>«David, te lo prometo, glorificaré tu raza, el Mesías será luz de las naciones... entre vosotros.</p><p><strong>Cuando el rey David se estableció en su casa, en Jerusalén, el Señor le concedió días de paz.</strong></p><p>Después de un largo período de guerrillas contra los filisteos, David se encontraba, por fin, en paz. Se había hecho construir un palacio real, sobre la colina de Sión, en Jerusalén, su nueva capital; pero se sentía algo avergonzado porque Dios no tenía todavía una Casa. El arca de la Alianza continuaba estando en Silo. Tuvo pues intención de construir un Templo para Dios.</p><p><strong>Mira, ¡yo habito en una casa de cedro, mientras que el arca de Dios habita en una tienda!</strong></p><p>Pero el profeta Natán fue a ver al rey y le hizo esta sorprendente promesa:</p><p><strong>¿Eres tú quien vas a edificarme una casa para que la habite? Yo te he tomado del pastizal, de detrás del rebaño, para que seas caudillo de mi pueblo. He estado «contigo» en todas tus empresas.</strong></p><p>Dios tiene empeño en conservar la iniciativa. David no era más que un muchacho campesino, pastor de un rebaño, cuando Dios lo escogió. No era descendiente de familia real. Todo ello fue una elección gratuita de Dios.</p><p><strong>Voy a hacerte un nombre grande como el de los más grandes de la tierra. El Señor te anuncia que te edificará una casa. Tu reino y tu casa permanecerán para siempre ante mí, tu trono estará firme eternamente.</strong></p><p>David quería ofrecer una «casa» a Dios. ¡Y es Dios el que le promete darle una! La casa de David, es en primer lugar Salomón, su primer hijo –que construirá el Templo–... y es sobre todo Jesús, el Mesías. Es pues Dios el que conserva la iniciativa. ¡Hay que permanecer humilde delante de Dios... incluso cuando se es el rey David! No somos nosotros quienes damos a Dios, ¡Dios es el que nos da! Jesús a su vez, rechazará el Templo. ¡Destruid ese Templo y dentro de tres días lo reconstruiré! El Cuerpo de Cristo pasa a ser el único templo, el único lugar de culto a Dios. La verdadera «casa de Dios» es Jesús, Presencia de Dios.</p>` },
            { dateStr: "12-25", week: "Tiempo de Navidad", title: "25 DE DICIEMBRE", verse: "Isaías 9, 1-6 / 62, 11-12 / 52, 7-10 / Tito 2, 11-14", content: `<p>No nos contentemos con las músicas ingenuas y los sentimientos algo folklóricos... que han envuelto, y es hermoso y natural, la fiesta de Navidad. La oración personal ha de ser capaz de llegar al nivel más profundo, aquel en el que los textos litúrgicos nos sitúan.</p><p><strong>Medianoche: Isaías 9, 1-6</strong></p><p><strong>Un niño nos ha nacido. Tendrá por nombre: «Admirable consejero. Dios fuerte, siempre Padre, Príncipe de la Paz». La paz no tendrá fin sobre David ni sobre su reino. Será sólidamente instaurado sobre el derecho y la justicia desde ahora y para siempre. Mirad lo que ha hecho el amor invencible de nuestro Dios.</strong></p><p>Ese oráculo fue pronunciado en medio de la peor desolación. Los terribles ejércitos de Tíglat-Falasas III asolaban Palestina. El futuro aparecía cerrado ante el enemigo asirio, mil veces más poderoso que el pobre y pequeño país de Israel. Y he aquí que toda la esperanza de ese pueblo se concentra en un débil muchacho... cuyo poder viene exclusivamente «de Dios».</p><p>«Mirad lo que hizo el amor invencible de nuestro Dios.» ¿Creo yo, con toda certeza, que el poder de Dios es capaz de salvar a la humanidad de sus angustias más dramáticas? ¿De qué modo la Navidad me compromete? ¿Por la paz, por el derecho, por la justicia, por el amor?</p><p><strong>Aurora: Isaías 62, 11-12</strong></p><p><strong>Mirad lo que el Señor hace oír hasta los confines de la tierra: «Decid a la hija de Sión: mira que viene tu Salvador... Se os llamará “pueblo santo”, “rescatados por el Señor”... “la deseada”, “la ciudad que no será ya más abandonada.»</strong></p><p>Dios visita a su pueblo. Dios viene. Viene como «salvador». Y ese pueblo recibe «nombres» nuevos. Es un renacimiento. El nombre, expresa la profundidad del ser, para los semitas. El pueblo de Dios participa de la cualidad de Dios: ¡santidad! La esperanza de Navidad se apoya en la intervención personal de Dios en la humanidad.</p><p><strong>Día: Isaías 52, 7-10</strong></p><p><strong>Escuchad la voz de los vigías, alzan la voz a una, dan gritos de júbilo. Prorrumpid en voces de júbilo, ruinas de Jerusalén, porque el Señor ha consolado a su pueblo.</strong></p><p>Después de cuarenta años de destierro en Babilonia, el pueblo judío se creía abandonado de Dios. La capital, Jerusalén, continuaba siendo un montón de ruinas calcinadas. Y he aquí que el profeta anuncia, en nombre de Dios, que esas ruinas revivirán. ¡Ciertamente, no! La salvación de Dios no cae fuera de la creación. ¡Es un misterio inserto en la historia, que empieza con la creación! Que la alegría de Navidad resuene en nuestras familias, en nuestras calles y ciudades iluminadas, es normal. Que se manifieste con los regalos y una dicha humana y sana, es conforme al querer de Dios. Pero nosotros, los creyentes, sabemos reconocer de dónde nos viene esa «dicha». En muchas ciudades y ambientes, somos esos vigías que alzan la voz para decir que el Señor quiere consolar a su pueblo.</p><p><strong>Medianoche: Tito 2, 11-14</strong></p><p><strong>La gracia de Dios se ha manifestado para la salvación de todos los hombres. Aguardar la feliz esperanza y la manifestación de la gloria de Jesucristo, nuestro gran Dios y nuestro Salvador.</strong></p><p>La alegría de Navidad, la fiesta gozosa de esos días privilegiados, no es todo. «Esperamos» algo mejor. Una fiesta para «todos»... una «fiesta» definitiva... una fiesta «total»... Cuando se manifestará la Gloria de Jesucristo.</p>` },
            { dateStr: "12-26", week: "Tiempo de Navidad", title: "26 DE DICIEMBRE - San Esteban", verse: "Hechos de los Apóstoles 6, 8... 7, 60", content: `<p>Los ángeles de Navidad jamás anunciaron a un «Jesusito» dulzón y sosito. Anunciaron a un «salvador»; y es por la cruz que Jesús nos salva. Esteban, según los Hechos de los Apóstoles es el «primer mártir», el primero en seguir a su maestro, al llevar, él también, su cruz. Esteban reproduce la muerte misma de Jesús.</p><p><strong>Esteban, lleno de gracia y de poder, realizaba entre el pueblo, grandes prodigios y señales.</strong></p><p>Era «diácono» es decir «encargado del servicio de comedor» durante los ágapes o comidas fraternas, en el curso de las cuales los primeros cristianos celebraban la eucaristía (Hechos 6, 2-3). Estaba al servicio de los más pobres. Fue nombrado para ese cargo esencial para aliviar de esa tarea a los apóstoles. (Hechos 6, 1-2.) Desde el principio, la Iglesia tuvo que hacer frente a situaciones de penuria, entre los sacerdotes. ¿Presto atención a las necesidades de los más pobres? ¿Soy capaz, como Esteban, de poner mis aptitudes al servicio de los más necesitados?</p><p><strong>Unos de la sinagoga se pusieron a discutir con Esteban; pero no pudieron resistir a la sabiduría y al Espíritu con que hablaba. Se encolerizaron contra él... Pero, Esteban, lleno del Espíritu Santo, miraba fijamente al cielo... y vio la gloria de Dios y a Jesús en pie a la diestra de Dios.</strong></p><p>Danos, Señor, esa «mirada interior», que nos hace ver lo invisible. Danos el Espíritu. Fue de esa «visión» que Esteban sacó su fuerza. A partir de ello nada pudo detenerle ni doblegarle.</p><p><strong>Los testigos pusieron sus vestidos a los pies de un joven llamado Saulo.</strong></p><p>Este cambiará pronto su nombre por el de Pablo. San Pablo conservó toda su vida un recuerdo muy vivo de las persecuciones en las que había participado. Aquel día estaba allí. Miraba cómo mataban a un hombre a pedradas. Estaba de acuerdo con esa tortura: guardaba los vestidos de los verdugos que se habían puesto más cómodos para su tarea. Desde aquel día Saulo debió hacerse una pregunta: «¿De dónde le viene ese valor y entereza?» HOY todavía, la mayoría de las conversiones vienen de un testimonio... de alguien cuyo modo de vivir suscita una pregunta. Mi vida ¿suscita una pregunta a los incrédulos que me conocen? ¿Hay a mi alrededor quienes podrían descubrir el móvil de mi vida? ¿Este mirar al cielo y ver a Jesús en pie?</p><p><strong>Esteban oraba mientras le lapidaban...</strong></p><p>Mirad a uno que, en verdad, es más fuerte que sus verdugos.</p><p><strong>«Señor Jesús, recibe mi espíritu... Señor, no les tengáis en cuenta ese pecado.»</strong></p><p>La más pura joya del evangelio: «Amad a vuestros enemigos, haced bien a los que os odian, rogad por los que os persiguen.» La víctima que «ama» a los que la dañan. Jesús fue el primero en hacerlo. Es la actitud evangélica por excelencia, el amor universal, sin condición y sin frontera... La novedad del evangelio, capaz de suscitar una pregunta al hombre. ¿A quién debo perdonar? ¿A quién he de ofrecer ese amor que va más allá de las concesiones humanas? No pasar ligeramente sobre esas dos preguntas, propias para ese tiempo de Navidad.</p>` },
            { dateStr: "12-27", week: "Tiempo de Navidad", title: "27 DE DICIEMBRE - San Juan", verse: "I Juan 1, 1-4", content: `<p><strong>Lo que existía desde el principio, Lo que oímos, Lo que contemplaron nuestros ojos, Lo que palparon nuestras manos, ¡Es el Verbo, la palabra de vida!</strong></p><p>La epístola que empezamos hoy es una meditación personal de Juan: recuerda, tiene los «ojos» llenos de esas escenas evangélicas. Y todos sus sentidos, sus ojos, sus oídos, sus manos recuerdan: el sonido de la voz de Jesús, su rostro. «Lo que palparon nuestras manos.» No, la Encarnación no es un sueño, un fruto de la imaginación. Juan es de los que han tocado a Jesús. En su mano tuvo el contacto de la mano de Jesús. Se comprende que se nos propongan esas lecturas en esos días de Encarnación. Nosotros, hombres modernos, deseamos también pruebas tangibles. Nos gustan las cosas muy probadas, experimentadas, verificadas. Si nuestra fe fuera más viva, tendríamos también como Juan, el «contacto» del Señor:<br>—la eucaristía es ciertamente Jesús en nuestras manos...<br>—el servicio a los hermanos es ciertamente Jesús en nuestras manos...</p><p>Para los que han elegido en adelante comulgar «en la mano», es ésta una meditación muy realista: «lo que palparon nuestras manos, es el Verbo de vida».</p><p><strong>El verbo, la palabra de vida... sí, la vida se manifestó, la contemplamos y os anunciamos esa vida eterna...</strong></p><p>Los dos términos «verbo» y «palabra» son equivalentes. Jesús es la «palabra» de Dios, Jesús revela a Dios. Dios no es «algo», es «alguien». Dios no es algo estático, inmóvil, rígido, pasivo, insensible. Dios es «vida», actividad, dinamismo vital, pensamiento, palabra. Para tratar de entender mejor esto es preciso evocar algunas imágenes, aunque imperfectas: es el único medio de hacerse una idea de esa vida divina.<br>—Dios, como un niño pequeño, exulta de su vida siempre nueva y desborda vitalidad...<br>—Dios, como un corazón palpitante de amor, está impulsado por incontables emociones...<br>—Dios, como una inteligencia viviente, rebosa de inmensos y complejos pensamientos...<br>—Dios, como una persona adulta y responsable, se desborda en actividades, proyectos y pensamientos. Dios es «vida».</p><p>Dios ha comunicado todo eso por medio de una «Palabra» en la que se ha expresado totalmente: Jesucristo. ¡Se me invita a vivir! Participar a la «vida» de Dios, es pues «pensar», «reflexionar», «amar», «actuar», «trabajar», como El... es tratar de reproducir la vida de Jesús. De ahí la importancia de la meditación.</p><p><strong>Esa vida eterna que estaba de cara al Padre y se manifestó a nosotros, os la anunciamos ahora para que estéis en comunión con nosotros, como nosotros estamos en comunión con el Padre y con su Hijo Jesucristo.</strong></p><p>La «vida» de Dios es esencialmente una «vida de amor», una vida de familia: es la vida de muchas personas que viven en común-unión. Una vida paternal, una vida filial, una vida conyugal. En esto, también nos vemos obligados a usar comparaciones humanas: el amor de una madre en total comunión con su hijo... el amor de un matrimonio perfectamente unido... la unidad de una familia feliz. Todo esto, multiplicado al infinito y realizado en perfección.</p>` },
            { dateStr: "12-28", week: "Tiempo de Navidad", title: "28 DE DICIEMBRE - Los santos Inocentes", verse: "I Juan 1, 5 - 2, 2", content: `<p><strong>El anuncio que le oímos a Jesús es éste: Dios es luz... No hay tiniebla alguna en El...</strong></p><p>La «luz». Una imagen de Dios. Habitualmente, me aprovecho de la luz sin darme cuenta. Trato de considerar mejor lo que la luz es: contemplo una fuente de luz: una lámpara, el sol, mi ventana... Dejo que me deslumbre... luego cierro los ojos y me hundo en las tinieblas. Trato de imaginar lo que sería el mundo sin luz. Miro mi mano, por ejemplo. De noche, en la tiniebla, no la vería por muy cerca que estuviera de mis ojos. Sin luz, los ojos resultan inútiles. No sirven para nada. «Dios es luz» El pone de manifiesto todo lo restante. Sin El todo sería tiniebla... inexistente.</p><p><strong>Si caminamos en las tinieblas, nuestra conducta no es sincera.</strong></p><p>El tema de la luz en san Juan está ligado al de la verdad. Dios es «verdadero». Dios es transparencia, Dios es sinceridad, Dios es luz. En El no hay ningún desfase entre «lo que dice o muestra»... y «lo que verdaderamente es». En nosotros, por el contrario, existe a menudo ese desfase mentiroso: llevamos una especie de máscara, no dejamos al descubierto nuestro verdadero rostro... «no actuamos según la verdad»... «somos mentirosos». Vivir «según la verdad», es «vivir según Dios». Es en primer lugar una exigencia de lucidez, de santidad, de verdad.</p><p><strong>Cuando nos movemos en la luz somos solidarios unos de otros.</strong></p><p>No nos esperábamos ese final de la frase, esperábamos más bien «si nos movemos en la luz = vivimos en comunión con Dios». Ahora bien, san Juan inmediatamente apunta al amor fraterno. ¡Vivir «en la luz» es vivir en «comunión con los demás», en el servicio a los demás, en la apertura unos de otros! Seres que están en común-unión los unos con los otros. Trato de dar un contenido concreto a esa expresión. Evoco algunas experiencias de «comunión» entre personas, momentos más logrados de comunicación, de participación, de unión; si bien todos esos términos humanos son demasiado pobres para expresar esa realidad. La «vida» de Dios es una inefable experiencia continua de «comunión». El proyecto de Dios es una inmensa empresa de «comunicación» entre personas. Es el mandamiento nuevo del amor. Amémonos.</p><p><strong>Y la sangre de Jesús nos limpia de todo pecado... Si decimos no tener pecado, la verdad no está en nosotros... Si reconocemos abiertamente nuestros pecados, Dios, que es fiel y justo, perdona nuestros pecados y nos purifica de toda injusticia.</strong></p><p>Pecar... es caminar en las tinieblas. Hay en nosotros algo tenebroso, una parte de nosotros mismos que deseamos esconder. Esa parte egoísta, esas motivaciones interesadas, inconfesables, esas debilidades de nuestra voluntad... esos rechazos a compartir, a la comunicación, al amor. ¡Hay que hacer luz sobre todo ello! Si decimos que nada de eso está en nosotros, nos engañamos, somos mentirosos. Pero basta con «reconocer que somos pecadores» para que todo eso sea salvado.</p><p><strong>Si uno de nosotros comete pecado, tenemos un defensor ante el Padre: Jesús, el justo. El es la víctima que expía nuestros pecados. ¡Gracias!</strong></p>` },
            { dateStr: "12-29", week: "Tiempo de Navidad", title: "29 DE DICIEMBRE", verse: "I Juan 2, 3-11", content: `<p><strong>Queridos...</strong></p><p>Así se dirigía Juan a los cristianos. El mismo aplica ese gran principio de «comunión» del que nos habla. ¿Puedo yo usar esa expresión para tal o cual persona? ¿Qué clase de conversión exigiría de mi parte?</p><p><strong>En esto sabemos que conocemos a Jesucristo: en que guardamos sus mandamientos.</strong></p><p>El conocimiento de Jesucristo no es un conocimiento intelectual. No está reservado a los sabios, a los que son capaces de descifrar intelectualmente las «Escrituras» o el «Dogma»... es un conocimiento experimental, vital. El que «guarda» los mandamientos, el que «hace» la voluntad de Dios... ese tal «conoce» a Dios. ¿Corresponde mi vida a Dios?</p><p><strong>Lo que os escribo no es un mandamiento nuevo... y sin embargo es «nuevo» en Jesús y en vosotros.</strong></p><p><strong>Quien declara estar en la luz, mientras odia a su hermano no ha salido de las tinieblas.</strong></p><p>Esa es la razón principal por la que se está «en la noche»... Es el principal obstáculo a la luz... es nuestra dificultad para encontrar a Dios... Todo ello viene sobre todo de nuestra falta de amor fraterno. Pretendemos encontrar a Dios, quisiéramos la «luz»... pero mantenemos en nosotros el odio y la falta de amor. Es lo más contrario a Dios, porque ¡Dios es amor!</p><p><strong>El que ama a su hermano permanece en la luz.</strong></p><p>Todo se aclara cuando nos situamos y vivimos en el verdadero amor. Dios se descubre cercano, a los corazones abiertos al amor, al perdón, a la participación; pero es inaccesible a los corazones cerrados en sí mismos. Ahora bien, Señor, ¡no es fácil amar!</p><p><strong>Quien guarda fielmente su Palabra, ciertamente en él el amor de Dios ha llegado a su plenitud.</strong></p><p>Dame, Señor, el amor de tu Palabra. Haz que la medite, que practique tu Palabra. Que todos los actos de mi vida cotidiana sean como una aplicación de tu Palabra: amar, servir, trabajar para guardar tu Palabra. Por tu amor. Uno se hace fácilmente la ilusión, se cree amar. Yo te ruego, Señor, que me ilumines, que pongas suficiente claridad en mí, para que descubra las sutilezas que he inventado para rechazar el amor.</p><p><strong>En esto conocemos que estamos en El. Quien dice que permanece en El debe vivir como vivió El y seguir el camino que Jesús ha seguido.</strong></p><p>Fórmula a repetir. Me imagino la «conducta» de Jesús, sus actuaciones... sus maneras de hacer... sus reflejos... el camino seguido. En ese momento ¿cómo reaccionaría si estuviera en mi lugar junto a las personas con las que vivo? Portarme como Tú, Jesús. La imitación de Jesucristo es secreto de santidad y de felicidad. Y en la medida en que actúo como Tú, me es lícito pensar que «permaneces en mí». En mí Tú eres bueno cuando yo soy bueno. Habitan en mí tu dulzura, tu pureza, tu oración... Soy una encarnación prolongada. Cristo continúa su vida en mí.</p>` },
            { dateStr: "12-30", week: "Tiempo de Navidad", title: "30 DE DICIEMBRE", verse: "I Juan 2, 12-17", content: `<p><strong>Os digo, hijos míos: «Vuestros pecados están perdonados por obra del nombre de Jesús».</strong></p><p>Incansablemente, debemos repetirnos esas palabras a fin de que del fondo de nuestras vidas surja:<br>- nuestro agradecimiento absoluto a Dios.<br>- y el deseo sincero de nunca más pecar...</p><p><strong>Os lo digo a vosotros, padres porque: «conocéis al que es desde el principio».</strong></p><p>San Juan se dirige, particularmente aquí, a las personas de edad avanzada y les recomienda que se apoyen en el «conocimiento» de Dios, y en su «estabilidad»: «el que existe desde siempre». ¡La vejez invita a concentrarse en lo «esencial»! En esa edad, muchas cosas «desaparecen». Así el árbol se despoja de sus galas después de haber dado sus frutos. Pero también es señal de que la primavera está cerca. «Os lo digo a vosotros, padres: «conocéis al que es, desde el principio».</p><p><strong>Os lo digo a vosotros jóvenes: «Habéis vencido al Maligno. Sois fuertes, porque la Palabra de Dios permanece en vosotros.»</strong></p><p>Al dirigirse a los jóvenes, san Juan les recomienda ser «fuertes» para el combate que han de afrontar con el «Maligno»... apoyados en la «palabra de Dios».<br>- El compromiso...<br>- La oración de contemplación...<br>- todo un programa de vida para jóvenes-.</p><p><strong>No améis al mundo ni lo que hay en el mundo.</strong></p><p>El término «mundo», en la pluma de san Juan tiene, casi siempre un sentido peyorativo. Se trata de esa «humanidad que sólo cuenta en sí misma y rehusa confiar a Dios su porvenir». Se trata del mundo encerrado en sí mismo... del mundo que «pretende bastarse a sí mismo»... del mundo «a puerta cerrada». Un mundo tal no puede ir a la paz con Dios.</p><p><strong>Si alguien ama al mundo, el amor del Padre no está en él.</strong></p><p>Esas son unas frases severas. Hay que escucharlas tal cual son. Ya decía Jesús: «¡No se puede servir a dos amos!». Sin embargo, ese mundo pecador con el que ningún compromiso es posible, ¡Dios lo ha amado! para salvarle. El mismo san Juan puso en labios de Jesús esta otra frase: «Tanto amó Dios al mundo que dio a su Hijo único, para que todo el que crea en él no perezca, sino que tenga vida eterna». (Juan, 3- 16. ) Danos, Señor, saber condenar el pecado y amar a los pecadores... Ayúdanos, Señor a «no ser del mundo» y a «amar al mundo» como Tú lo amas...</p><p><strong>Todo lo que hay en el mundo es:<br>- Deseos egoístas de la naturaleza humana...<br>- Concupiscencia de los ojos.<br>- Orgullo de las riquezas...<br>¡Todo ello no procede del Padre!</strong></p><p>Efectivamente, lo que está condenado en el mundo es su «suficiencia», su «egoísmo», su «orgullo». El hecho de prescindir de Dios. ¡Bastarse a sí mismo! Detrás de esas palabras de Juan se perfila el paganismo de la época: la sensualidad aberrante del imperio romano decadente, los espectáculos indecentes y violentos del circo, la opresión de los ricos sobre los pobres. Evidentemente, si decimos que amamos a Dios, no tenemos derecho de amar a este mundo.</p><p><strong>Ahora bien, el mundo con sus deseos desaparecerá; pero el que hace la voluntad de Dios permanece para siempre.</strong></p><p>Todo lo solamente humano... ¡pasa! es frágil, transitorio, efímero. Todo lo que tiene fin es corto. Sólo Dios permanece. Uniendo mi vida a la tuya. Señor, ligo mi destino a tu vida eterna.</p>` },
            { dateStr: "12-31", week: "Tiempo de Navidad", title: "31 DE DICIEMBRE", verse: "I Juan 2, 18-21", content: `<p><strong>Hijos míos, es la última hora. Habéis oído que iba a venir un anticristo. Pues bien, muchos anticristos han aparecido.</strong></p><p>En este pasaje, san Juan pone en guardia a los cristianos contra los «falsos doctores». Esta carta se dirige, evidentemente a unas comunidades que atraviesan una crisis grave. En efecto, en el interior de esas comunidades se han levantado unos «cristianos» que pretenden anunciar a Cristo, pero que Juan califica de «anticristos» y dice que son muchos.</p><p><strong>Estaban entre nosotros, pero no eran de los nuestros. De haber sido de los nuestros, se hubieron quedado con nosotros.</strong></p><p>En tiempo de crisis, las defecciones son inevitables. Los «falsos doctores» han dejado la comunidad. Se les detecta por el hecho que: bautizados o sacerdotes, se separan de la Iglesia. Jesús había anunciado esto con anterioridad, cuando dijo: «Si se os dice: "Mirad aquí está Cristo" o bien "Mirad, está allá", no lo creáis. Surgirán, en efecto, falsos-cristos y falsos-profetas, que harán signos y prodigios considerables, capaces de engañar, incluso, a los elegidos.» (Mateo 24, 24). Sería peligroso que, partiendo de textos de esta clase, pretendiéramos, nosotros, hacer una separación entre los buenos y los malos, entre los fieles y los heréticos. Pero esas Palabras divinas nos colocan ante la realidad de la verdad, ante la realidad de nuestra pertenencia a la Iglesia. «De haber sido de los nuestros, se hubieran quedado con nosotros.» Roguemos por todos los que HOY, como en todo tiempo sienten la tentación de abandonar la Iglesia.</p><p><strong>En cuanto a vosotros estáis ungidos por el Santo, y todos vosotros lo sabéis.</strong></p><p>Del hecho de estar en «comunión» con la Iglesia, se derivan otros dos signos.<br>- la vida sacramental, simbolizada por la «unción»...<br>- la rectitud doctrinal, el «conocimiento»...</p><p>1. El sacramento no es un rito mágico y mecánico de pertenencia a Dios es: el reconocimiento de que «Dios actúa en nosotros». Es un «acto de Dios en nosotros». Por él, reconocemos que no podemos salvarnos a nosotros mismos: «el que es Santo os ha consagrado por la unción». No es el hombre quien se consagra. Es Dios el que le consagra. ¿Es ésta mi actitud profunda de cara a los sacramentos? Me pongo ante Dios como un pobre, humildemente? Características del falso-doctor, del falso-cristo, son: el orgullo, la suficiencia.</p><p>2. La Fe - el «conocimiento» de Dios- es el segundo signo de pertenencia a la Iglesia. La «fe» y el «sacramento» están vinculados uno al otro.<br>- La fe da vigor y sentido al sacramento. El Espíritu es el que actúa y no el «gesto» externo: bautizar al que no tiene fe está prohibido y no tiene significado alguno... recibir la eucaristía sin tener fe sería un gesto vacío.<br>- El sacramento da vigor a la fe: el signo exterior y visible, repetido en muchos sacramentos refuerza y alimenta la fe.</p><p>En este último día del año me pregunto sobre mi actitud profunda respecto a la Iglesia... a los sacramentos... a la fe... ¡Señor, aumenta en nosotros la fe!</p>` },
            { dateStr: "01-01", week: "Tiempo de Navidad", title: "1º DE ENERO - Santa María, Madre de Dios", verse: "Números 6, 22-27 / Gálatas 4, 4-7", content: `<p><strong>¡Que el Señor te bendiga y te guarde! ¡Que ilumine su rostro sobre ti! ¡Que te sea propicio! ¡Que el Señor «te muestre su rostro»!</strong></p><p>Esas palabras, con imágenes muy humanas, nos hablan del amor de Dios por María. En esos días después de Navidad, pueden aplicarse a María muy concretamente: el rostro de Jesús y el rostro de María, vueltos el uno hacia el otro, como todas las madres con su pequeñín. Además, esas palabras tienen un sentido místico: Dios, ciertamente, se regocija con ese nacimiento. María es la «preferida» de Dios. No nos resulta fácil imaginarnos el diálogo de esos dos «corazones», de Dios y de María inclinados sobre «ese» hijo. Entre Dios y María hay un incesante diálogo de amor a través de Jesús. Me detengo a contemplar ese diálogo, interiormente.</p><p><strong>Al llegar la plenitud de los tiempos, envió Dios a su Hijo, nacido de mujer.</strong></p><p>Esta frase nos indica que Dios se ha valido del tiempo, que ha hecho una preparación. La encarnación no se produjo más que cuando la humanidad hubo llegado a un cierto grado de madurez. La historia del pueblo de Israel es la historia de una ascensión, de un descubrimiento progresivo: el hombre iba afinándose, lentamente descubría unos valores esenciales y poco a poco tenía la experiencia de su relación con Dios. Toda esa preparación, en un momento dado se concentró en una persona, la Virgen María. María es la delicada y fina flor de la humanidad, la cumbre de toda la ascensión humana, la obra maestra de Dios. El corazón de María es la joya preciosa de la humanidad.</p><p>Después de larga espera, al llegar la plenitud de los tiempos... todo está preparado en el corazón de esa «mujer». Bendita eres entre todas las mujeres y bendito es el fruto de tu vientre, Jesús.</p><p><strong>Mirad la prueba de que sois hijos: «Dios ha enviado a nuestros corazones el Espíritu de su Hijo que clama: ¡Abba, Padre!</strong></p><p>La paternidad de Dios es tan vasta como la humanidad entera. La paternidad de Dios engendra primero, desde la eternidad a un hijo único. Pero el espíritu de ese Hijo ha sido enviado a nuestros corazones! Desde entonces, de nuestros corazones parte un «grito de hijo: «Abba»... «papá»... Es el término hebreo más familiar. ¡La palabra que Jesús lanzó a la humanidad para hablar a Dios! El misterio de Navidad no es solamente el misterio de un hijo, es el misterio de una multitud de hijos: todos los hombres pueden llegar a ser «hijos», en ese «Hijo».</p><p><strong>De modo que ya no eres esclavo, sino Hijo... y si hijo, también heredero... por la gracia de Dios.</strong></p><p>Por la gracia de Navidad, la humanidad entra en una nueva relación con Dios. En lugar de la relación de «amo» a «esclavo», desde ahora serán relaciones de «padre» a «hijo». Podría decirse de «una madre» a un «hijo», para tratar de captar mejor lo que pasa entre Dios y nosotros. ¡Entre Dios y la humanidad hay un lazo de amor inverso! A Dios no podemos comprenderlo, ni podemos tampoco entender nada de lo que hace, si olvidamos eso. Me quedo contemplando el corazón de Dios. El sentimiento paternal de Dios hacia mí y hacia todos los hombres. Pero, de mi parte, ¿qué pongo? ¿Correspondo a ese amor? ¿Quizá me quedo más en el temor? Danos, Señor, un corazón de niño, un corazón filial.</p>` },
            { dateStr: "01-02", week: "Tiempo de Navidad", title: "2 DE ENERO", verse: "I Juan 2, 22-28", content: `<p>El testimonio sobre Jesús nos lo dará hoy san Juan, hombre que vivió con El y le observó y escuchó en múltiples ocasiones durante mucho tiempo. Juan afirma: «Jesús es Dios», Hijo del Padre, igual al Padre. Esta afirmación no fue hecha a la ligera ni irreflexivamente, se inscribe en una controversia teológica. Algunos decían -¡ya entonces!-, que Jesús no es Dios sino tan sólo un hombre eminente del cual se sirvió Dios para anunciar su mensaje al mundo. Muchos hombres rectos de HOY estarían de acuerdo con esto: Jesús, «un gran genio religioso», «un hombre que ha marcado la historia». Esto es todo. Para Juan, que conoció muy bien a Jesús, esto es insuficiente.</p><p>Gracias, Jesús, por habernos dado acceso al «secreto» de Dios... Por habernos introducido en lo «incognoscible»... por habernos hecho ver al Dios «escondido»... Me coloco humildemente ante un «pesebre», y contemplo: Dios se revela de ese modo. El verdadero rostro de Dios está ahí. El semblante del Hijo nos aporta el verdadero rostro del Padre.</p><p><strong>Por vuestra parte, guardad en vosotros lo que aprendisteis desde el principio.</strong></p><p>Fidelidad: Guardar lo que se ha oído. Esto es más necesario todavía en las horas de crisis de fe, cuando surgen nuevas preguntas en nuestros corazones, cuando viene la «noche». Es preciso entonces agarrarse a las certezas elementales, y a los puntos de referencia que han marcado nuestro anterior itinerario. No sé a donde voy, pero sé de donde vengo... y continúo caminando en el mismo sentido que ha iluminado mi camino anteriormente.</p><p><strong>Hijos míos: ¿Quién es el mentiroso, sino el que niega que Jesús es el Cristo? Ese es precisamente el Anticristo: el que niega al Padre y al Hijo. Todo el que niega al Hijo, tampoco posee al Padre y quien confiesa al Hijo, posee también al Padre.</strong></p><p>Negar la divinidad de Jesús, es, para Juan, condenarse a no conocer nada de Dios. Todos los sentimientos religiosos del mundo... todas sus especulaciones filosóficas no son sino imperfectas aproximaciones al descubrimiento de Dios. La única y verdadera revelación de Dios es Jesús. Tenemos ahí ciertas afirmaciones típicas del evangelio de Juan:<br>—«Nadie va al Padre sino por el Hijo...» (Juan 14, 6)<br>—«El que conoce al Hijo, conoce también al Padre...» (Juan 8, 19)<br>—«El Hijo es el único capaz de revelar al Padre...» (Juan 14, 7)</p><p>En mi búsqueda de Dios me esforzaré más en la meditación evangélica. Contemplar a Jesús para contemplar a Dios.</p><p><strong>La unción con que él os ungió sigue con vosotros...</strong></p><p>Es el símbolo del Espíritu que penetra todo el ser desde el interior, como el aceite impregna un tejido. Dios-Espíritu está ahí, impregnando mi ser, y a la vez distinto de mí, si bien inmanente en mi vida. ¡Estoy «consagrado», impregnado por Dios... en comunión contigo, Señor!</p><p><strong>Permaneced en él.</strong></p><p>Permanecer en Dios. ¡Y esto basta! Alegría y paz.</p><p><strong>Para que cuando se manifieste, nos sintamos seguros y no quedemos avergonzados delante de él el día de su venida.</strong></p><p>Esa es la esperanza: verle cara a cara, en la luz eterna. Camino hacia ese descubrimiento final. Y Jesús es el «camino» que nos conduce hacia ese dulce encuentro en la luz del último día.</p>` },
            { dateStr: "01-03", week: "Tiempo de Navidad", title: "3 DE ENERO", verse: "I Juan 2, 29 - 3, 6", content: `<p><strong>Todo el que practica la justicia «ha nacido» de Dios.</strong></p><p>Nacido de Dios. Mi nacimiento humano ha sido un principio, el principio de una aventura... ¡de algo completamente nuevo! ¿Y mi nacimiento divino?</p><p><strong>Mirad qué magnífico regalo nos ha hecho el Padre: que nos llamemos hijos de Dios... y además lo somos.</strong></p><p>Ir saboreando interiormente estas palabras: «soy un hijo de Dios»... «Dios es mi Padre»... «Yo soy amado por El»... Concretizando, puedo evocar el amor que mi madre y mi padre tienen para conmigo... o bien el amor paterno o materno que tengo y siento hacia mis propios hijos...</p><p><strong>La razón de que el mundo no nos conozca es que no ha descubierto a Dios.</strong></p><p>¡Fórmula extraordinaria! El que no ha descubierto a Dios no sabe de veras lo que es el hombre. La verdadera grandeza del hombre es el hecho de ser «hijo de Dios». ¡Es algo inaudito! En cuanto a mí, con frecuencia tampoco me conozco a mí mismo. Muy raras veces me pongo a considerar ese don de Dios: ¡su Vida divina en mí! El que no conoce a Dios, desconoce también lo que es esencial en mí.</p><p><strong>Amigos míos, ahora somos hijos de Dios, pero aún no se ha manifestado lo que seremos.</strong></p><p>Lo esencial, mi vida divina... Ya ha empezado, desde ahora, desde HOY, desde este mismo instante. Pero es una realidad que se está haciendo. No está acabada. Todo ello se inscribe en una historia, en un crecimiento. ¿Qué llegará a ser? ¿Hasta qué grado seguirá creciendo?</p><p><strong>Sabemos: Cuando el Hijo de Dios se manifieste, seremos semejantes a él...</strong></p><p>Tal es el objetivo final: llegar a ser completamente «semejante» a Jesús, el perfecto «Hijo de Dios». ¡Nada menos esto! Es la empresa de toda una vida, para identificarme más y más a El, parecerme a El, modelar mi espíritu según El. Debemos pedir esa gracia.</p><p><strong>Lo veremos tal cual es.</strong></p><p>Ver a Jesús. ¡Ya le vemos... un poco! Le veremos un día... a plena luz. Para Juan se trataba de un «volver a ver». Recordaba aquellos momentos pasados con Jesús, y aspiraba al nuevo reencuentro, definitivo.</p><p><strong>Todo el que tiene puesta en Jesús esa esperanza se purifica para ser puro como El lo es.</strong></p><p>El camino que conduce a Dios es el de una purificación cada vez más perfecta. «Bienaventurados los limpios de corazón, porque ellos verán a Dios», había dicho Jesús.</p><p><strong>Todo el que comete pecado, comete rebeldía contra Dios. Como sabéis, Jesús se manifestó para quitar el pecado, y en El no hay pecado.</strong></p><p>Ver a Dios. Ser semejante a Jesús. Estar sin pecado. Mantengo en mí ese deseo. Esa gracia pido. Admiro a Jesús en quien no hay pecado, quien jamás hizo mal alguno.</p><p><strong>Todo el que permanece en El, no peca. Todo el que peca ni le ha visto ni le ha conocido.</strong></p><p>Efectivamente, lo sé por experiencia: mis pecados se insinúan en mi vida cuando no tengo presente a Jesús; porque cuando «veo y conozco» a Jesús, no peco.</p>` },
            { dateStr: "01-04", week: "Tiempo de Navidad", title: "4 DE ENERO", verse: "I Juan 3, 7-10", content: `<p><strong>«Hijos de Dios»... «Hijos del diablo»...</strong></p><p>Juan acaba de descubrir a los hijos de Dios. Ahora los contrapone a los «hijos del diablo». Esa expresión hace estremecerse. Del mismo modo que se puede vivir «en comunión con Dios», se puede también «vivir con el diablo». Podemos estar unidos a Dios y podemos encadenarnos al mal. Pero no olvidemos que esto no determina ante todo dos categorías de hombres —resultaría demasiado fácil clasificarse en la primera—; en realidad la frontera que separa a los hijos de Dios de los hijos del diablo, pasa por nuestro propio corazón. Por algunos aspectos de mi vida, soy «de Dios» ¡Gracias, Señor!... Por otros, soy «del diablo»... ¡Perdón, Señor!</p><p><strong>Mirad como se distingue a los hijos de Dios de los hijos del diablo:</strong><br>1. El que no practica la justicia, no pertenece a Dios...<br>2. Tampoco el que no ama a su hermano es de Dios...</p><p>Dos signos sencillos. Dos criterios. Es nuestro género de vida cotidiano el que nos hace pertenecer a Dios o al Diablo. La justicia. El Amor. Yo me dejo investir por esas dos palabras. Yo miro mi vida bajo esas dos luces: Ser justo... amar... Sin embargo, confío que son muchos los que «pertenecen a Dios». Pienso en todos los gestos de justicia y de amor verdadero, en todos los deseos de justicia y de fraternidad que surgen en el mundo por doquier. Evidentemente, ¡Ahí está Dios!</p><p><strong>Hijitos míos, que nadie os extravíe.</strong></p><p>Juan se preocupa mucho de preservar a sus cristianos de posibles desviaciones. El mal, el error pueden infiltrarse. Muy pronto empezaron las herejías. Los falsos doctores, los falsos conductores, los falsos profetas existen hoy como siempre existieron. «¡Que nadie os extravíe!»</p><p><strong>Quien vive según la justicia es justo, como El, Jesús, es justo.</strong></p><p>El punto de referencia es siempre la persona de Jesús. ¿En qué se basa mi juicio?... ¿En un código, en principios, en una moral, en una ideología, en una mentalidad inconsciente, en unos hábitos? «¡Jesús es justo!» Esta debería ser mi referencia constante. Exigencia infinita.</p><p><strong>Quien comete el pecado es del diablo, que ha sido pecador desde el principio. Precisamente para esto se manifestó el Hijo de Dios, para destruir las obras del Diablo.</strong></p><p>El mundo es el teatro donde se libra ese gran combate. Jesucristo está en el corazón del mundo, como en la arena, en un cuerpo a cuerpo, luchando contra el pecado. Señor, hazme participar en tu combate. Señor, concédeme lucidez suficiente para descubrir a mi alrededor el pecado del mundo y mi propia participación en él.</p><p><strong>Quien ha nacido de Dios no comete pecado, porque permanece en él la semilla sembrada por Dios: por lo tanto no puede pecar.</strong></p><p>Hay que entender eso bien. En otros pasajes (I Juan 1, 8-10) Juan nos dice que tenemos pecados. ¡Eso es evidente! Aquí Juan afirma que «el hombre nacido de Dios» está colocado en una especie de estado fundamental que no es ya el mal; se trata de esa orientación global que marca la dirección principal de una vida. Gracias, Señor, por esa explicación. A pesar de los desvíos y los resbalones pasajeros, a pesar de las caídas ocasionales, es también mucha verdad, Señor, que te pertenezco y que voy a Ti. «Tu divina simiente permanece en mí» ¡Gracias. Quédate conmigo!</p>` },
            { dateStr: "01-05", week: "Tiempo de Navidad", title: "5 DE ENERO", verse: "I Juan 3, 11-21", content: `<p><strong>Queridos míos, es preciso que nos amemos unos a otros... Porque amamos a los hermanos, sabemos que hemos pasado de la muerte a la vida.</strong></p><p>No amar es quedarse en la muerte. Esas expresiones tienen una fuerza sorprendente. El amor es la vida. El que no ama es como si no existiera: está muerto. Un día sin amor es un día vacío, insustancial, inexistente, un día muerto. Una vida profesional sin amor, es viento, no es nada o mejor es la nada. Una familia, un matrimonio sin amor es triste, como la muerte.</p><p>Señor, inocéndenos el don de amar!</p><p><strong>No seamos como Caín: estaba de la parte del «Malo» y asesinó a su hermano. No os extrañéis hermanos si el mundo os odia... Todo el que odia a su hermano es un asesino...</strong></p><p>Aquéllos a los que Juan se dirigía, sus corresponsales sufrían entonces la persecución. ¡Odio!... ¡Amor!... Hay que desconfiar. Es menester buscar qué aspecto toma el odio en mi propio corazón. La palabra es dura y hay el riesgo de que nos engañe: ¡Vamos a ver! ¡Yo no odio a nadie, no soy un asesino! ¿Por quién me tomáis? Sin embargo, ¿no hay quizás en mi vida personas que quisiera ver a cien leguas de mí, a las que suprimiría de mi vida si fuera posible? «Pero, Yo os digo: amad a vuestros enemigos, haced bien a los que os persiguen.»</p><p><strong>Todo el que odia a su hermano es un asesino y sabéis que ningún asesino conserva dentro la vida eterna.</strong></p><p>Señor, haz que conserve yo en mí tu vida eterna. Señor, ayúdame a soportar a aquéllos hacia los que siento la tentación de no amar. Señor, ayúdame a amar a los que, con mis solas fuerzas, tengo dificultad de amar.</p><p><strong>Hemos comprendido lo que es el amor porque Jesús dio su vida por nosotros.</strong></p><p>Siempre la misma, la única referencia. Muy bien se acuerda Juan, de cuando estaba al pie de la cruz, donde Jesús daba su vida y amaba a todos los hombres con amor universal: «Perdónalos, Padre, no saben lo que hacen».</p><p><strong>También nosotros debemos dar nuestra vida por nuestros hermanos; debemos amar no de boquilla ni con discursos, sino con obras y en verdad.</strong></p><p>Nos preguntamos a veces «si amamos realmente». No debemos tener miedo de hacernos esa pregunta. Escuchemos lo que dice san Juan: El amor no es forzosamente algo sensible, sentimental, experimentado... ¡el amor consiste en «actos»! ¿Amo realmente a todos mis compañeros de trabajo, a todos mis familiares? ¡Mirad lo que hacéis! No solamente vuestras intenciones; no os contentéis con buenas palabras. Mirad los hechos, lo que hacéis.</p><p><strong>Si uno posee bienes de este mundo y, viendo que su hermano pasa necesidad, le cierra su corazón, ¿cómo va a estar en él el amor de Dios?</strong></p><p>Podemos confiar... si en nuestras jornadas abundan los gestos concretos de «servicio» a los demás. Entonces, el amor de Dios habita en nosotros, aunque a menudo no lo experimentemos. Te ofrezco, Señor, mis actos del día de hoy.</p>` },
            { dateStr: "", week: "Semana después de Epifanía", title: "LUNES", verse: "I Juan 3, 22 - 4, 6", content: `<p><strong>Dios nos concede cualquier cosa que le pedimos confiadamente porque somos fieles a sus mandamientos y hacemos lo que le agrada.</strong></p><p>¿Cómo podemos saber que «Dios está con nosotros»? ¿Qué seguridad tenemos de estar «en comunión con Dios» y de que nuestras oraciones sean atendidas? San Juan contesta: Estamos en comunión con Dios si «hacemos lo que le agrada... si permanecemos fieles a lo que nos manda...». Es lo mismo que sucede con las personas que amamos: la verdadera unión, la verdadera prueba de amor consiste en hacer lo que agrada al otro. Se da entonces la comunión de pensamientos y de voluntades. Si dos se aman son sólo uno: Todo lo mío es tuyo.</p><p>Agradarte, Señor. Hacer tu voluntad. Mis proyectos, mis actividades, mi jornada entera, todo según tu propio proyecto divino. Está claro entonces que mi plegaria será atendida, porque correspondo con todo mi ser a «lo que Tú quieres», a «lo que te agrada».</p><p><strong>Y este es «su» mandamiento: Que creamos en el nombre de su Hijo Jesucristo... Y que nos amemos unos a otros...</strong></p><p>Son dos aspectos de un solo mandamiento: creer y amar. No son dos preceptos, son el mismo, «su» mandamiento. Para san Juan, según parece, la fe y la caridad no son dos virtudes distintas, sino una sola virtud: «ser hijo de Dios». ¿Constituye esto el fondo de mi vida?</p><p><strong>Quien guarda sus mandamientos permanece en Dios y Dios en él. Conocemos que permanece en nosotros por el Espíritu que nos dio.</strong></p><p>El Espíritu de Dios no es algo material, un regalo, un don inerte. Es un Impulso, es un Pensamiento, es un Querer, es un Proyecto, es una Persona... Es el Espíritu de Dios en nosotros. ¿Correspondo yo a ello? ¿Dejo que ese espíritu me vivifique?</p><p><strong>No os fiéis de cualquier «inspirado».</strong></p><p>Con esa doctrina a la que san Juan da tanta importancia, un cierto «subjetivismo» muy individualista sería de temer: ¡cada uno podría creerse «inspirado» por el Espíritu! En tiempo de san Juan no faltaban los falsos profetas de ese tipo. En nuestro tiempo tampoco faltan los por así decir profetas que, muy «concienzudamente» seguros de sí mismos, afirman saber lo que conviene a la Iglesia. Hoy se insiste, en particular y con razón, en la «dimensión horizontal»; el amor fraterno, el compromiso en la promoción de los hermanos... y san Juan no deja nunca de insistir en ese aspecto. Pero no podemos olvidar que su fuente, su origen se halla en una «dimensión vertical» igualmente esencial: el amor de Dios, la fe en Cristo, la oración...</p><p><strong>Mirad como podréis conocer si el espíritu de Dios les inspira: Todo «inspirado» que confiesa que Jesucristo es el Mesías venido ya en carne mortal, procede de Dios.</strong></p><p>Jesucristo vuelto, a la vez, hacia Dios y hacia los hombres. Procuro que esas palabras penetren profundamente en mí. Permanecer en Dios... ¿«Permanezco yo en Dios»? o bien ¿me aparto de Él con frecuencia? ¿tal vez, por el pecado, me sitúo fuera de Dios?</p>` },
            { dateStr: "", week: "Semana después de Epifanía", title: "MARTES", verse: "I Juan 4, 7-10", content: `<p><strong>Queridos míos, amémonos unos a otros.</strong></p><p>Todo un programa para la Iglesia. Todo un programa para nuestras familias, nuestros ambientes de vida y de trabajo. Todo un programa para la humanidad. En mi recuerdo evoco los lugares, a mi alrededor o en el mundo donde falta ese amor. Y ruego para que nazca y progrese.</p><p><strong>Porque el amor es de Dios. Todos los que aman son «hijos» de Dios y conocen a Dios. Quien no ama no conoce a Dios. ¡Porque, Dios es amor!</strong></p><p>Texto de insondable profundidad. Hay que escucharlo en silencio, repetirlo, tratar de expresarlo con palabras nuestras. Todo el que ama es como una parcela de Dios, una parte del Amor, porque Dios es amor. Todo acto de amor «viene de Dios», tiene su fuente u origen en el Corazón de Dios. Dios puede ser contemplado en:<br>—el amor de una madre que ama a su hijito... y de un niño que ama a sus padres...<br>—el amor de un prometido a su prometida... de un esposo a su esposa...<br>—el amor de un hombre que se desvela por sus camaradas de trabajo...<br>—el amor de un trabajador que pone su oficio al servicio de sus compatriotas...</p><p>Dios está en el origen de todas esas actitudes. ¿Y en mi vida?</p><p><strong>En esto se manifestó el amor que Dios nos tiene, en que envió al mundo a su Hijo único para que vivamos por medio de El.</strong></p><p>Dios no se ha quedado en las generalidades, en las hermosas declaraciones. Dios ha manifestado, concretado y probado su amor. Dios ha «encarnado» su amor. Ha dado su Hijo al mundo. Jesús es el amor de Dios por el mundo. Es el Hijo único, entregado. Único. Entregado. No guardado para sí. Dado. ¿Y yo? ¿De qué soy capaz de privarme, por amor? ¿De qué modo concreto traduzco en obras mi amor?</p><p><strong>El amor existe no porque amáramos nosotros a Dios... sino porque El nos amó a nosotros.</strong></p><p>San Juan insiste siempre sobre esa iniciativa divina. Dios no nos ha esperado. Tomó la iniciativa de amarnos antes incluso de conocer como responderíamos a ese amor. La experiencia del pecado tiene una misteriosa ventaja: nos permite comprender mejor esto: ¡el pecador sabe que es esperado y amado! Aun en los momentos en que el hombre no piensa en Dios ni ama a Dios... ¡Dios no cesa de pensar en él y de amarlo! Gratuidad total del amor divino. No está condicionado a una respuesta positiva. Pero Señor, ¿cómo procuraré responder plenamente a un tal amor?</p><p><strong>El Padre envió a su Hijo, que es víctima propiciatoria por nuestros pecados.</strong></p><p>El amor de Dios no fue algo banal o «de broma». Fue un amor «hasta el derramamiento de sangre». Cristo se sacrificó por nosotros. Jesús ha sido la víctima de «mis» pecados. Jesús se sacrificó por mí, porque, ¡me ama hasta tal punto! de ser capaz de renunciar a su propia vida «para que yo viva». ¿Y yo?</p>` },
            { dateStr: "", week: "Semana después de Epifanía", title: "MIÉRCOLES", verse: "I Juan 4, 11-18", content: `<p><strong>Si Dios nos amó de tal manera...</strong></p><p>El don de su Hijo. La muerte voluntaria de su Hijo, por amor. No hay que pasar rápidamente sobre esas palabras. «Si Dios os amó de tal manera que nos entregó a su Hijo...» «Ni la muerte, ni el pecado no sabrían arrancarnos». «Al amor que nos viene de El...» Permanezco unos momentos en contemplación...</p><p><strong>Debemos amarnos también unos a otros.</strong></p><p>El amor que profesamos a nuestros hermanos no es tan solo un sentimiento natural, que brota espontáneamente de una necesidad afectiva muy humana... ni tampoco un reflejo que bastaría con dejar que se manifestase... Ese amor es un «deber»: debemos amarnos unos a otros. Y esto viene de Dios: «Si Dios nos ha amado tanto, debemos también nosotros...» No podemos por menos de hacer como Dios. Se trata de un amor absoluto, infinito, universal... como el de Dios.</p><p><strong>A Dios, nadie le ha visto. Pero, si nos amamos unos a otros, Dios permanece en nosotros.</strong></p><p>La significación es clara: el verdadero amor hace visible al Dios invisible. Cada vez que amo de veras, «hago visible» a Dios. Dios está allí. Si en casa, en mi ambiente de trabajo, pongo amor, Dios se habrá hecho visible allí. Pienso a veces en cambiar de ocupación, de estilo de vida, de empleo del tiempo. Pero es mi «corazón» lo que tendría que cambiar: haz, Señor, que sepa amar la situación en que me encuentro, a las personas que me rodean... «Dios está allí, si nos amamos unos a otros».</p><p><strong>Y nosotros, en la fe, hemos conocido el amor que Dios nos tiene.</strong></p><p>Así es, efectivamente. Reconocer, identificar. Frecuentemente no sabemos reconocer el amor de Dios. Está ahí y lo ignoramos.</p><p><strong>Dios es amor.</strong></p><p>Y yo, a menudo, soy lo contrario. Soy egoísmo. Cada uno de mis pecados es una falta de amor. Señor, Tú que eres Amor, ven a mí. Libera toda mi potencia de amar.</p><p><strong>Quien permanece en el amor permanece en Dios y Dios en él.</strong></p><p>«Permanecer en Dios.» «Permanecer en el amor.» Saborear esa vivencia sería una fuente de gozo indestructible.</p><p><strong>Nuestra vida en este mundo imita lo que es Jesús. No hay temor en el amor... quien teme no ha llegado a la plenitud en el amor.</strong></p><p>Jesús no tenía «miedo» de Dios, y El es nuestro modelo. San Juan nos invita a abandonar todo temor delante de Dios. El amor sólo es el que debe impulsar nuestro obrar. Danos, Señor, esa seguridad. No quiero tener miedo de Ti ni de tu Juicio... quiero amarte y nada más.</p>` },
            { dateStr: "", week: "Semana después de Epifanía", title: "JUEVES", verse: "I Juan 4, 19 - 5, 4", content: `<p><strong>Queridos míos: podemos amar nosotros porque Dios nos amó primero.</strong></p><p>No fundamentamos nuestra seguridad sobre nuestros propios méritos. Si consideráramos nuestra propia vida, más bien tendríamos muchas razones para «temer» a Dios; pero todo descansa en el hecho que «Dios nos amó primero», antes de cualquier mérito nuestro. Nos ama tal como somos, es decir, «pecadores». No nos ama por ser más o menos agradables, atractivos, simpáticos... o por ser personas «bien»... Nos ama para que seamos amables –tengamos amor–, para salvarnos. Dios nos ama primero, aun siendo «deformes», repelentes, llenos de egoísmo... nos ama tal como somos.</p><p>Gracias, Señor, por amarme de ese modo.</p><p><strong>Si alguno dice: «amo a Dios» y aborrece a su hermano, es un mentiroso.</strong></p><p>San Juan se atreve a comparar la actitud que tengo con Dios... a la que tengo con el señor o la señora X... Mi actitud hacia mis prójimos es el test de mi actitud hacia Dios. Si no llego a soportar, a amar a tal o cual de mis colegas, de mis parientes, de mis vecinos... tampoco alcanzo a amar a Dios. Y si digo que amo a Dios, en ese caso, soy un mentiroso.</p><p><strong>Quien no ama a su hermano, a quien ve, no puede amar a Dios a quien no ve.</strong></p><p>Toda la argumentación conduce al último miembro de la frase. Juan es un realista, en el fondo: el amor de un ser «invisible» puede ilusionarnos... ¡es un sentimiento muy fácil! Pero amar, soportar, aceptar diariamente a un ser concreto, próximo a nosotros es verificable: uno sabe muy bien, por desgracia, si se lo soporta o no se lo soporta. El amor al prójimo, a quien vemos, es nuestro medio de controlar nuestro amor de Dios, a quien no vemos. Esos «hermanos que veo»... ¿quiénes son? Cuidado, ninguna ilusión posible. Repaso en mi memoria todos los rostros de los que «veo» ¡Son, para mí, el rostro de Dios a «quien no veo»! Concédeme, Señor, saber aceptar las dificultades de la vida fraterna. Señor, ayúdame a amar a los que Tú me has dado.</p><p><strong>Este es el mandamiento que hemos recibido de El: «Quien ama a Dios... ame también a su hermano...»</strong></p><p>Insistencia. San Juan nos lo ha repetido varias veces. En el pasaje que hoy hemos leído, es la 3.ª repetición. Amar. a Dios. Amar. a nuestros Hermanos. Esto debería ser el punto de referencia constante de cada uno de nuestros exámenes de conciencia. ¿Tengo amor? ¿Amo a Dios? ¿Amo a mis hermanos? ¿Cómo se traduce concretamente ese amor? Que ese amor no sea un sueño. Empezar primero por lo más sencillo, lo más elemental: tolerarse, aceptarse diferentes, soportarse, hacernos la vida agradable, en lo posible. Y adelantar hacia lo más perfecto: prestarse ayuda mutua, tomar la propia parte en las cargas comunes, participar, estar abiertos al máximo, vivir en comunión en unión de voluntades, ser uno solo.</p><p><strong>Conocemos que amamos a los hijos de Dios, si amamos a Dios y cumplimos sus mandamientos.</strong></p><p>El amor a los demás —llamados aquí hijos de Dios— tiene su fuente y origen en el amor de Dios. Se trata de amar a «los que Dios ama». Dios ama al Sr. X... Sra. Z... a los que tanto me cuesta amar. Sustituir los puntos suspensivos por nombres concretos.</p>` },
            { dateStr: "", week: "Semana después de Epifanía", title: "VIERNES", verse: "I Juan 5, 5-13", content: `<p><strong>¿Quién es el que vence al mundo?</strong></p><p>En el vocabulario de san Juan sabemos que el término «mundo» significa: «al hombre encerrado en sí mismo y tentado de construirse y salvarse por sus propias fuerzas». De hecho, el verdadero cristiano ha vencido esa tentación: no vive replegado en sí mismo, sino abierto a Dios... ha vencido la ridícula y vana tentativa de querer «divinizarse» por sí mismo y deja el éxito de toda su vida en las manos de Dios.</p><p><strong>El que cree que Jesús es el Hijo de Dios.</strong></p><p>La Fe nos hace vencedores de aquella tentación. La Fe nos «abre a Dios» que hace que nuestra salvación y el éxito de nuestra vida los confiemos a Jesús, Hijo de Dios. ¿Es así el modo como concibo yo mi Fe?</p><p><strong>Dios nos ha concedido la vida eterna, y esta vida eterna está en su Hijo.</strong></p><p>Tal es el éxito, la salvación que debemos ambicionar. No simplemente un éxito humano... mediano, grande o inmenso... para sesenta u ochenta años... Sino un éxito divino... infinito y absoluto... un éxito eterno. La Fe consiste en creer que Jesús, Hijo de Dios, posee la vida eterna, especialmente después de su victoria sobre la muerte... y que esa vida eterna es también herencia nuestra si creemos en Jesucristo.</p><p><strong>Quien tiene al Hijo, posee la vida. Quien no tiene al Hijo, no posee la vida.</strong></p><p>Señor, quiero creer en tu Hijo. Cristo es mi vida. Pienso en todos esos jóvenes que dicen tener «la furia de vivir», un vehemente deseo de vivir... Señor, haz que descubran que Tú estás de parte de la vida, que eres un apasionado por todo lo que vive, que Tú eres el viviente por excelencia... y que Tú propones y ofreces la explosión de tu propia vida a todos los que están ávidos de vida en plenitud.</p><p><strong>Es El, Jesucristo, el que vino por el agua y por la sangre...</strong></p><p>«El agua y la sangre» tienen un doble significado simbólico en san Juan:<br>«el agua y la sangre» simbolizan la obediencia filial de Jesús hasta la muerte, por amor a todos los hombres. Juan vio esto. Estaba al pie de la cruz. Lo afirma. Jesús lo ha dado todo. El Corazón abierto, del que mana «el agua y la sangre» es el símbolo más fuerte y expresivo del amor!<br>«el agua y la sangre» simbolizan también la sacramentalidad eclesial: la presencia del resucitado es perpetuada por su Cuerpo que es la Iglesia, y que se expresa en unos ritos visibles, los sacramentos. En particular el bautismo y la eucaristía, «el agua y la sangre» el más fuerte testimonio, HOY, del don de Dios a los hombres.</p><p><strong>Tres son los que dan testimonio: el Espíritu, el agua y la sangre...</strong></p><p>El procedimiento judicial de los tribunales judíos exigía tres testigos... Hoy diríamos que tenemos varios testimonios que recibir y que dar:<br>«el de los sacramentos: vivir el rito eucarístico en plenitud, recibir el agua y la sangre de Cristo...<br>«el de la vida: vivir nuestra vida cotidiana de tal manera que sea una ofrenda agradable a Dios vivida «según el Espíritu» comprometiendo el sacrificio de nuestra vida por amor...</p>` },
            { dateStr: "", week: "Semana después de Epifanía", title: "SÁBADO", verse: "I Juan 5, 14-21", content: `<p>Leemos HOY la conclusión de la 1.ª Epístola de san Juan. Es una invitación a la oración... en particular a la plegaria por los pecadores.</p><p><strong>Lo que nos da confianza ante Dios es que nos escucha si le pedimos algo según su voluntad.</strong></p><p>La «oración» es como el signo de nuestra «comunión» con Dios. Es el testimonio de que estamos en «unidad» con El, de que «vivimos en conformidad con su voluntad». Ayúdanos, Señor, a no pedirte más que lo que sea conforme a lo que Tú quieres para nosotros... Sabemos que quieres nuestro mayor bien. Esta es la invitación de Jesús en el Padrenuestro: «Hágase tu voluntad.»</p><p><strong>Si alguno ve que su hermano comete un pecado...</strong></p><p>La vida de unión con Dios no nos tapa los ojos. Por el contrario debería hacernos estar más atentos a ciertas cosas. Adoptar los puntos de vista de Dios quiere decir ser lúcido para ver el «mal»; detectar donde hay egoísmo, falta de amor; sentir pena en lo íntimo de uno mismo por todo lo que se opone a Dios. El ejercicio espiritual llamado «revisión de vida» comporta esta búsqueda: en un acontecimiento, en un hecho de vida, descubrir el pecado que yace escondido, los contra-valores, mezclados allí... no para condenar o juzgar con cierta altivez —es una tentación siempre renaciente— sino para contemplar la obra salvadora de Dios y rogar para que la salvación de Dios progrese. Allí donde hay pecado, está Dios como salvador.</p><p><strong>Si alguno ve que su hermano comete un pecado que no es de muerte, rogará, y Dios dará de nuevo vida al pecador.</strong></p><p>El pecado suscita la oración y no la condena. Adoptar los puntos de vista de Dios es llegar a ser salvador con El. Jesús nos ha repetido que «Dios ama a los pecadores», que El es esencialmente bueno, que «hace brillar el sol sobre los buenos y sobre los malos». Sabemos que Jesús ha venido «no para los sanos, sino para los que necesitan al médico». «Pecado que no es de muerte». San Juan utiliza aquí una distinción que el mismo Jesús usaba también: no se trata forzosamente de la distinción clásica entre «pecado venial» y «pecado mortal»... sino de lo que Jesús llamaba el «pecado contra el Espíritu Santo», es decir, el rechazo de la luz, el rechazo del ver claro. Es el más grave.</p><p><strong>Toda injusticia es pecado, pero hay pecados que no son de muerte.</strong></p><p>Son los que no dañan «directamente» nuestra relación con Dios.</p><p><strong>Lo sabemos: El hombre que ha nacido de Dios no comete pecado. El Hijo engendrado de Dios lo protege, y el maligno no llega a tocarlo.</strong></p><p>El estado de impecabilidad del que habla san Juan no consiste en la capacidad de evitar todo pecado. Como, para él, el único verdadero pecado es el revés de la «comunión con Dios», es decir, la «separación de Dios»... nos dice que ¡el estado normal del cristiano es «no poder ser tocado hasta ese punto por el Maligno»! Gracias, Señor. Tenemos experiencia de que muchos de nuestros pecados en lugar de alejarnos de Dios, nos conducen a El... siempre y cuando somos leales y lúcidos. Porque es entonces cuando reconocemos nuestros límites y nuestra incapacidad de realizar, según Dios, nuestra vida por nuestras solas fuerzas humanas.</p><p><em>Entre la semana después de Epifanía y el Miércoles de Ceniza, se colocan cada año algunas semanas del Tiempo ordinario, cuyo número varía según la fecha de Pascua. Las meditaciones sobre esas lecturas se encuentran en el tomo IV de PALABRA DE DIOS PARA CADA DIA para los años pares, en el Tomo V para los años impares.</em></p>` }
        ];

        // ESTADO DE LA APLICACIÓN
        let currentReadingIndex = 0;
        let currentFontSize = parseInt(localStorage.getItem('fontSize')) || 18;

        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
            renderMenu();
            
            // Intentar cargar el día de hoy, si no, cargar el primero
            if (!loadToday()) {
                loadReading(0);
            }

            // Configurar tema guardado
            if (localStorage.getItem('theme') === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }
        });

        // RENDERIZAR MENÚ CON JERARQUÍA
        function renderMenu() {
            const menuList = document.getElementById('menuList');
            menuList.innerHTML = '';

            // 1. Agrupar los datos en las 3 grandes temporadas
            const seasons = {
                "Tiempo de Adviento": [],
                "Tiempo de Navidad": [],
                "Semana después de Epifanía": []
            };

            readingsData.forEach((reading, index) => {
                if (reading.week.includes("Adviento")) {
                    seasons["Tiempo de Adviento"].push({ ...reading, originalIndex: index });
                } else if (reading.week.includes("Navidad")) {
                    seasons["Tiempo de Navidad"].push({ ...reading, originalIndex: index });
                } else if (reading.week.includes("Epifanía")) {
                    seasons["Semana después de Epifanía"].push({ ...reading, originalIndex: index });
                }
            });

            // 2. Renderizar cada temporada
            for (const [seasonName, readings] of Object.entries(seasons)) {
                if (readings.length === 0) continue;

                // Cabecera de la temporada (Ej: TIEMPO DE ADVIENTO)
                const seasonHeader = document.createElement('li');
                seasonHeader.className = 'menu-season';
                seasonHeader.innerHTML = `<h3>${seasonName}</h3>`;
                menuList.appendChild(seasonHeader);

                // Sub-agrupar por semana dentro de la temporada
                const weeks = {};
                readings.forEach(r => {
                    if (!weeks[r.week]) weeks[r.week] = [];
                    weeks[r.week].push(r);
                });

                for (const [weekName, weekReadings] of Object.entries(weeks)) {
                    // Si no es una temporada genérica (ej. "Tiempo de Adviento"), mostramos el subtítulo de la semana
                    if (weekName !== "Tiempo de Adviento" && weekName !== "Tiempo de Navidad" && weekName !== "Semana después de Epifanía") {
                        const weekHeader = document.createElement('li');
                        weekHeader.className = 'menu-week';
                        weekHeader.innerHTML = `<h4>${weekName}</h4>`;
                        menuList.appendChild(weekHeader);
                    }

                    // Renderizar los días
                    weekReadings.forEach(reading => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = '#';
                        a.innerHTML = `<strong>${reading.title}</strong><small>${reading.verse}</small>`;
                        a.onclick = (e) => {
                            e.preventDefault();
                            loadReading(reading.originalIndex);
                            if(window.innerWidth < 768) toggleMenu();
                        };
                        a.id = `menu-item-${reading.originalIndex}`;
                        li.appendChild(a);
                        menuList.appendChild(li);
                    });
                }
            }
        }

        // CARGAR LECTURA
        function loadReading(index) {
            if (index < 0 || index >= readingsData.length) return;
            
            currentReadingIndex = index;
            const data = readingsData[index];
            
            const wrapper = document.getElementById('reading-wrapper');
            wrapper.innerHTML = `
                <div class="week-title">${data.week}</div>
                <h1>${data.title}</h1>
                <div class="biblical-verse">${data.verse}</div>
                <div class="reading-text">${data.content}</div>
            `;

            // Resaltar en el menú
            document.querySelectorAll('#menuList a').forEach(a => a.classList.remove('active'));
            const activeItem = document.getElementById(`menu-item-${index}`);
            if (activeItem) {
                activeItem.classList.add('active');
                // Hacer scroll en el menú para que el elemento activo sea visible
                activeItem.scrollIntoView({ block: 'nearest' });
            }

            // Scroll al inicio
            document.getElementById('reading-container').scrollTop = 0;
        }

        // NAVEGACIÓN
        function navigate(direction) {
            loadReading(currentReadingIndex + direction);
        }

        // BOTÓN HOY
        function goToToday() {
            if (!loadToday()) {
                alert("Hoy no hay una lectura específica asignada en el texto (las lecturas fijas van del 17 de diciembre al 5 de enero). Usa el menú lateral para explorar las semanas de Adviento.");
            }
        }

        function loadToday() {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateString = `${month}-${day}`;

            const index = readingsData.findIndex(r => r.dateStr === dateString);
            if (index !== -1) {
                loadReading(index);
                return true;
            }
            return false;
        }

        // CONTROL DE TAMAÑO DE FUENTE
        function changeFontSize(step) {
            currentFontSize += step * 2;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 32) currentFontSize = 32;
            
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
            localStorage.setItem('fontSize', currentFontSize);
        }

        // BUSCADOR
        function filterMenu() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('#menuList li');
            
            items.forEach(item => {
                // Si es un elemento de enlace (lectura)
                if (item.querySelector('a')) {
                    const text = item.textContent.toLowerCase();
                    if (text.includes(query)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                }
            });
        }

        // MENÚ MÓVIL
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // MODO OSCURO
        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }
    </script>
</body>
</html>
